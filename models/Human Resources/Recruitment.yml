---
entities:
- name: "Organization"
  description: "Legal employer entity that owns job requisitions, postings, and hiring\
    \ operations."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "website"
    type: "URL"
  - name: "headquarters"
    type: "Address"
  relations:
  - name: "departments"
    type: "Department"
    multiplicity: "OneToMany"
  - name: "recruiters"
    type: "Recruiter"
    multiplicity: "OneToMany"
  - name: "hiringManagers"
    type: "HiringManager"
    multiplicity: "OneToMany"
  - name: "sourcingChannels"
    type: "SourcingChannel"
    multiplicity: "OneToMany"
  - name: "vendorAgreements"
    type: "VendorAgreement"
    multiplicity: "OneToMany"
  - name: "jobRequisitions"
    type: "JobRequisition"
    multiplicity: "OneToMany"
- name: "Department"
  description: "Functional unit within an organization responsible for headcount and\
    \ hiring."
  data:
  - name: "name"
    type: "String"
  - name: "departmentCode"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "hiringManagers"
    type: "HiringManager"
    multiplicity: "OneToMany"
  - name: "recruiters"
    type: "Recruiter"
    multiplicity: "OneToMany"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
  - name: "jobRequisitions"
    type: "JobRequisition"
    multiplicity: "OneToMany"
- name: "Recruiter"
  description: "Talent acquisition professional managing sourcing, screening, and\
    \ candidate communications."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "seniority"
    type: "SeniorityLevel"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "managedRequisitions"
    type: "JobRequisition"
    multiplicity: "OneToMany"
  - name: "ownedApplications"
    type: "Application"
    multiplicity: "OneToMany"
  - name: "communications"
    type: "Communication"
    multiplicity: "OneToMany"
- name: "HiringManager"
  description: "People leader accountable for defining roles, interviewing, and making\
    \ hiring decisions."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "title"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "jobRequisitions"
    type: "JobRequisition"
    multiplicity: "OneToMany"
- name: "Employee"
  description: "Internal employee participating in interviews, referrals, and offer\
    \ approvals."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "title"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "interviewFeedbacks"
    type: "InterviewFeedback"
    multiplicity: "OneToMany"
  - name: "referralsMade"
    type: "Referral"
    multiplicity: "OneToMany"
  - name: "offerApprovals"
    type: "OfferApproval"
    multiplicity: "OneToMany"
- name: "Agency"
  description: "External staffing vendor supplying candidates and background-check\
    \ services."
  data:
  - name: "name"
    type: "String"
  - name: "agencyType"
    type: "AgencyType"
  - name: "website"
    type: "URL"
  relations:
  - name: "recruiters"
    type: "AgencyRecruiter"
    multiplicity: "OneToMany"
  - name: "vendorAgreements"
    type: "VendorAgreement"
    multiplicity: "OneToMany"
  - name: "backgroundChecks"
    type: "BackgroundCheck"
    multiplicity: "OneToMany"
- name: "AgencyRecruiter"
  description: "Recruiter employed by an external agency submitting candidates and\
    \ referrals."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  relations:
  - name: "agency"
    type: "Agency"
    multiplicity: "ManyToOne"
  - name: "submittedApplications"
    type: "Application"
    multiplicity: "OneToMany"
  - name: "referrals"
    type: "Referral"
    multiplicity: "OneToMany"
- name: "VendorAgreement"
  description: "Commercial agreement governing services and candidate submissions\
    \ from a vendor."
  data:
  - name: "agreementNumber"
    type: "String"
  - name: "activePeriod"
    type: "DateRange"
  - name: "termsUrl"
    type: "URL"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "agency"
    type: "Agency"
    multiplicity: "ManyToOne"
- name: "SourcingChannel"
  description: "Distribution or acquisition channel for job ads and candidates."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "jobPostings"
    type: "JobPosting"
    multiplicity: "ManyToMany"
- name: "JobRequisition"
  description: "Authorized request to hire, defining role requirements, headcount,\
    \ and budget."
  data:
  - name: "requisitionNumber"
    type: "String"
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "headcount"
    type: "Integer"
  - name: "employmentType"
    type: "EmploymentType"
  - name: "workArrangement"
    type: "WorkArrangement"
  - name: "seniority"
    type: "SeniorityLevel"
  - name: "location"
    type: "Address"
  - name: "compensation"
    type: "CompensationRange"
  - name: "status"
    type: "RequisitionStatus"
  - name: "targetStartDate"
    type: "Date"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "hiringManager"
    type: "HiringManager"
    multiplicity: "ManyToOne"
  - name: "recruiter"
    type: "Recruiter"
    multiplicity: "ManyToOne"
  - name: "jobPostings"
    type: "JobPosting"
    multiplicity: "OneToMany"
  - name: "applications"
    type: "Application"
    multiplicity: "OneToMany"
- name: "JobPosting"
  description: "Public-facing job advertisement derived from a requisition and distributed\
    \ to channels."
  data:
  - name: "postingId"
    type: "String"
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "externalUrl"
    type: "URL"
  - name: "postedDate"
    type: "Date"
  - name: "closedDate"
    type: "Date"
  - name: "status"
    type: "PostingStatus"
  relations:
  - name: "requisition"
    type: "JobRequisition"
    multiplicity: "ManyToOne"
  - name: "channels"
    type: "SourcingChannel"
    multiplicity: "ManyToMany"
  - name: "applications"
    type: "Application"
    multiplicity: "OneToMany"
- name: "Candidate"
  description: "Individual seeking employment and progressing through the hiring pipeline."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "location"
    type: "Address"
  - name: "workAuthorization"
    type: "WorkAuthorizationStatus"
  - name: "relocationPreference"
    type: "RelocationPreference"
  - name: "linkedin"
    type: "URL"
  relations:
  - name: "applications"
    type: "Application"
    multiplicity: "OneToMany"
  - name: "resumes"
    type: "Resume"
    multiplicity: "OneToMany"
  - name: "referrals"
    type: "Referral"
    multiplicity: "OneToMany"
  - name: "communications"
    type: "Communication"
    multiplicity: "OneToMany"
- name: "Resume"
  description: "Candidate-provided document describing experience, education, and\
    \ skills."
  data:
  - name: "resumeId"
    type: "String"
  - name: "fileUrl"
    type: "URL"
  - name: "summary"
    type: "String"
  - name: "lastUpdated"
    type: "Date"
  relations:
  - name: "candidate"
    type: "Candidate"
    multiplicity: "ManyToOne"
  - name: "experiences"
    type: "WorkExperience"
    multiplicity: "OneToMany"
  - name: "educations"
    type: "Education"
    multiplicity: "OneToMany"
  - name: "certifications"
    type: "Certification"
    multiplicity: "OneToMany"
  - name: "skills"
    type: "Skill"
    multiplicity: "ManyToMany"
- name: "WorkExperience"
  description: "Past professional role held by the candidate."
  data:
  - name: "companyName"
    type: "String"
  - name: "jobTitle"
    type: "String"
  - name: "employmentType"
    type: "EmploymentType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "resume"
    type: "Resume"
    multiplicity: "ManyToOne"
- name: "Education"
  description: "Academic qualification attained by the candidate."
  data:
  - name: "schoolName"
    type: "String"
  - name: "degree"
    type: "DegreeType"
  - name: "fieldOfStudy"
    type: "String"
  - name: "graduationDate"
    type: "Date"
  relations:
  - name: "resume"
    type: "Resume"
    multiplicity: "ManyToOne"
- name: "Certification"
  description: "Professional certification demonstrating candidate proficiency."
  data:
  - name: "name"
    type: "String"
  - name: "issuedBy"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "resume"
    type: "Resume"
    multiplicity: "ManyToOne"
- name: "Skill"
  description: "Competency or technology relevant to a role."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "SkillCategory"
  relations:
  - name: "resumes"
    type: "Resume"
    multiplicity: "ManyToMany"
- name: "Application"
  description: "Submission by a candidate for a specific job requisition or posting."
  data:
  - name: "applicationNumber"
    type: "String"
  - name: "status"
    type: "ApplicationStatus"
  - name: "source"
    type: "CandidateSource"
  - name: "submittedDate"
    type: "Date"
  - name: "currentStage"
    type: "PipelineStage"
  relations:
  - name: "candidate"
    type: "Candidate"
    multiplicity: "ManyToOne"
  - name: "requisition"
    type: "JobRequisition"
    multiplicity: "ManyToOne"
  - name: "jobPosting"
    type: "JobPosting"
    multiplicity: "ManyToOne"
  - name: "recruiter"
    type: "Recruiter"
    multiplicity: "ManyToOne"
  - name: "agencyRecruiter"
    type: "AgencyRecruiter"
    multiplicity: "ManyToOne"
  - name: "resume"
    type: "Resume"
    multiplicity: "ManyToOne"
  - name: "interviews"
    type: "Interview"
    multiplicity: "OneToMany"
  - name: "assessments"
    type: "Assessment"
    multiplicity: "OneToMany"
  - name: "offer"
    type: "Offer"
    multiplicity: "OneToOne"
  - name: "backgroundChecks"
    type: "BackgroundCheck"
    multiplicity: "OneToMany"
  - name: "stageHistory"
    type: "ApplicationStageHistory"
    multiplicity: "OneToMany"
  - name: "communications"
    type: "Communication"
    multiplicity: "OneToMany"
- name: "ApplicationStageHistory"
  description: "Audit trail of pipeline stage transitions for an application."
  data:
  - name: "stage"
    type: "PipelineStage"
  - name: "changedAt"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
- name: "Interview"
  description: "Scheduled evaluation session between the candidate and interviewers."
  data:
  - name: "interviewDate"
    type: "Date"
  - name: "interviewType"
    type: "InterviewType"
  - name: "mode"
    type: "InterviewMode"
  - name: "duration"
    type: "Duration"
  - name: "outcome"
    type: "InterviewOutcome"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "interviewers"
    type: "Employee"
    multiplicity: "ManyToMany"
  - name: "feedback"
    type: "InterviewFeedback"
    multiplicity: "OneToMany"
- name: "InterviewFeedback"
  description: "Structured evaluation submitted by an interviewer for a specific interview."
  data:
  - name: "rating"
    type: "Integer"
  - name: "recommendation"
    type: "FeedbackRecommendation"
  - name: "comments"
    type: "String"
  - name: "submittedAt"
    type: "Date"
  relations:
  - name: "interview"
    type: "Interview"
    multiplicity: "ManyToOne"
  - name: "interviewer"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "Assessment"
  description: "Standardized test or exercise used to evaluate candidate skills."
  data:
  - name: "assessmentType"
    type: "AssessmentType"
  - name: "status"
    type: "AssessmentStatus"
  - name: "score"
    type: "Decimal"
  - name: "takenAt"
    type: "Date"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
- name: "Offer"
  description: "Formal proposal of employment terms extended to a candidate."
  data:
  - name: "offerNumber"
    type: "String"
  - name: "status"
    type: "OfferStatus"
  - name: "baseSalary"
    type: "Money"
  - name: "bonusTarget"
    type: "Percentage"
  - name: "equityGrant"
    type: "Money"
  - name: "startDate"
    type: "Date"
  - name: "contractType"
    type: "ContractType"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "OfferApproval"
    multiplicity: "OneToMany"
- name: "OfferApproval"
  description: "Decision record from an approver authorizing offer terms."
  data:
  - name: "status"
    type: "ApprovalStatus"
  - name: "decidedAt"
    type: "Date"
  relations:
  - name: "offer"
    type: "Offer"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "BackgroundCheck"
  description: "Post-offer screening to verify candidate history and eligibility."
  data:
  - name: "checkType"
    type: "BackgroundCheckType"
  - name: "status"
    type: "BackgroundCheckStatus"
  - name: "requestedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  - name: "reportUrl"
    type: "URL"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "agency"
    type: "Agency"
    multiplicity: "ManyToOne"
- name: "Referral"
  description: "Candidate recommendation submitted by an internal employee or agency\
    \ recruiter."
  data:
  - name: "referralCode"
    type: "String"
  - name: "relationship"
    type: "String"
  - name: "bonusEligible"
    type: "Boolean"
  relations:
  - name: "candidate"
    type: "Candidate"
    multiplicity: "ManyToOne"
  - name: "referrerEmployee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "referrerAgencyRecruiter"
    type: "AgencyRecruiter"
    multiplicity: "ManyToOne"
- name: "Communication"
  description: "Logged message between the recruiting team and the candidate."
  data:
  - name: "subject"
    type: "String"
  - name: "message"
    type: "String"
  - name: "sentAt"
    type: "Date"
  - name: "channel"
    type: "CommunicationChannel"
  - name: "direction"
    type: "CommunicationDirection"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "senderRecruiter"
    type: "Recruiter"
    multiplicity: "ManyToOne"
  - name: "recipientCandidate"
    type: "Candidate"
    multiplicity: "ManyToOne"
- name: "Employment"
  description: "Record of a successful hire and resulting employment assignment."
  data:
  - name: "employeeNumber"
    type: "String"
  - name: "jobTitle"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "employmentType"
    type: "EmploymentType"
  relations:
  - name: "offer"
    type: "Offer"
    multiplicity: "ManyToOne"
  - name: "candidate"
    type: "Candidate"
    multiplicity: "ManyToOne"
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
- name: "OnboardingTask"
  description: "Action item assigned to complete paperwork and provisioning after\
    \ acceptance."
  data:
  - name: "taskName"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "completed"
    type: "Boolean"
  relations:
  - name: "employment"
    type: "Employment"
    multiplicity: "ManyToOne"
  - name: "assigneeCandidate"
    type: "Candidate"
    multiplicity: "ManyToOne"
  - name: "assigneeRecruiter"
    type: "Recruiter"
    multiplicity: "ManyToOne"
  - name: "relatedOffer"
    type: "Offer"
    multiplicity: "ManyToOne"
metadata:
  name: "Recruitment Industry Domain Model"
  description: "HCIDL model capturing core recruitment, applicant tracking, interviewing,\
    \ offers, and onboarding capabilities."
  version: "1.0.0"
  industry: "Recruitment"
  category: "Human Resources"
  language: "en-US"
  type: "Industry"
  domain: "Recruitment"
enums:
- name: "EmploymentType"
  description: "Contractual arrangement defining working hours and duration expectations."
  data:
  - name: "FullTime"
  - name: "PartTime"
  - name: "Contract"
  - name: "Internship"
  - name: "Temporary"
- name: "WorkArrangement"
  description: "Location pattern that specifies where the work is performed."
  data:
  - name: "Onsite"
  - name: "Remote"
  - name: "Hybrid"
- name: "SeniorityLevel"
  description: "Experience band and scope expected for the role."
  data:
  - name: "Junior"
  - name: "Mid"
  - name: "Senior"
  - name: "Lead"
  - name: "Manager"
  - name: "Director"
  - name: "Executive"
- name: "RequisitionStatus"
  description: "Lifecycle state of a job requisition from creation to closure."
  data:
  - name: "Draft"
  - name: "Open"
  - name: "OnHold"
  - name: "Closed"
  - name: "Cancelled"
- name: "PostingStatus"
  description: "Publication state of a job posting across channels."
  data:
  - name: "Draft"
  - name: "Published"
  - name: "Closed"
  - name: "Archived"
- name: "ApplicationStatus"
  description: "Outcome-oriented status for application decision-making and tracking."
  data:
  - name: "New"
  - name: "Screening"
  - name: "Interviewing"
  - name: "OfferExtended"
  - name: "Hired"
  - name: "Rejected"
  - name: "Withdrawn"
- name: "CandidateSource"
  description: "Origin of the application submission."
  data:
  - name: "JobBoard"
  - name: "CareerSite"
  - name: "Referral"
  - name: "Agency"
  - name: "Social"
  - name: "Event"
  - name: "Sourcing"
  - name: "Internal"
- name: "InterviewType"
  description: "Format or focus area for an interview session."
  data:
  - name: "PhoneScreen"
  - name: "Technical"
  - name: "Behavioral"
  - name: "Panel"
  - name: "HiringManager"
  - name: "Executive"
- name: "InterviewMode"
  description: "Delivery method for conducting the interview."
  data:
  - name: "Phone"
  - name: "Video"
  - name: "Onsite"
- name: "InterviewOutcome"
  description: "Result classification of an interview event."
  data:
  - name: "Pending"
  - name: "Pass"
  - name: "Fail"
  - name: "NoShow"
- name: "FeedbackRecommendation"
  description: "Interviewer hiring recommendation scale."
  data:
  - name: "StrongHire"
  - name: "Hire"
  - name: "Mixed"
  - name: "NoHire"
  - name: "StrongNoHire"
- name: "AssessmentType"
  description: "Category of evaluation administered to the candidate."
  data:
  - name: "CodingTest"
  - name: "CaseStudy"
  - name: "Personality"
  - name: "Aptitude"
  - name: "Language"
- name: "AssessmentStatus"
  description: "Progress state of a candidate assessment."
  data:
  - name: "Assigned"
  - name: "InProgress"
  - name: "Completed"
  - name: "Expired"
- name: "OfferStatus"
  description: "State of an employment offer as it moves toward acceptance."
  data:
  - name: "Draft"
  - name: "Sent"
  - name: "Accepted"
  - name: "Declined"
  - name: "Expired"
  - name: "Withdrawn"
- name: "ApprovalStatus"
  description: "Decision outcome for an approval request."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
- name: "BackgroundCheckType"
  description: "Screening category used to validate candidate history."
  data:
  - name: "Criminal"
  - name: "EmploymentVerification"
  - name: "EducationVerification"
  - name: "Credit"
  - name: "DrugScreen"
- name: "BackgroundCheckStatus"
  description: "Processing state of a background screening."
  data:
  - name: "Requested"
  - name: "InProgress"
  - name: "Clear"
  - name: "Consider"
  - name: "AdverseAction"
  - name: "Failed"
- name: "ChannelType"
  description: "Type classification for sourcing and distribution channels."
  data:
  - name: "JobBoard"
  - name: "SocialNetwork"
  - name: "Agency"
  - name: "University"
  - name: "Event"
  - name: "InternalPortal"
- name: "WorkAuthorizationStatus"
  description: "Candidate’s eligibility to work in the hiring jurisdiction."
  data:
  - name: "Authorized"
  - name: "RequiresSponsorship"
  - name: "NotAuthorized"
  - name: "Limited"
- name: "DegreeType"
  description: "Academic degree level for educational credentials."
  data:
  - name: "HighSchool"
  - name: "Associate"
  - name: "Bachelor"
  - name: "Master"
