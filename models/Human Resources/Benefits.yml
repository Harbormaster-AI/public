---
metadata:
  name: "Benefits"
  description: "HCIDL capabilities model for employee benefits administration across\
    \ enrollment, eligibility, funding, claims, and compliance."
  version: "1.0.0"
  industry: "Human Capital Management"
  category: "Human Resources"
  type: "Capability"
  domain: "Benefits"
entities:
- name: "Employer"
  description: "Organization that sponsors employee benefits and defines program and\
    \ funding strategy."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "registeredAddress"
    type: "Address"
  relations:
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
  - name: "benefitPrograms"
    type: "BenefitProgram"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "Policy"
    multiplicity: "OneToMany"
  - name: "carriers"
    type: "Carrier"
    multiplicity: "ManyToMany"
- name: "Employee"
  description: "Individual employed by the employer and eligible to participate in\
    \ benefits."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "dateOfBirth"
    type: "Date"
  - name: "employmentStatus"
    type: "EmploymentStatus"
  - name: "hireDate"
    type: "Date"
  - name: "workCountry"
    type: "String"
  - name: "email"
    type: "String"
  - name: "homeAddress"
    type: "Address"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "dependents"
    type: "Dependent"
    multiplicity: "OneToMany"
  - name: "enrollments"
    type: "Enrollment"
    multiplicity: "OneToMany"
  - name: "spendingAccounts"
    type: "SpendingAccount"
    multiplicity: "OneToMany"
  - name: "lifeEvents"
    type: "LifeEvent"
    multiplicity: "OneToMany"
  - name: "claims"
    type: "Claim"
    multiplicity: "OneToMany"
  - name: "payrollDeductions"
    type: "PayrollDeduction"
    multiplicity: "OneToMany"
  - name: "cobraEnrollments"
    type: "COBRAEnrollment"
    multiplicity: "OneToMany"
  - name: "wellnessIncentives"
    type: "WellnessIncentive"
    multiplicity: "OneToMany"
- name: "Dependent"
  description: "Individual related to an employee and eligible for coverage under\
    \ certain plans."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "relationship"
    type: "DependentRelationship"
  - name: "dateOfBirth"
    type: "Date"
  - name: "disabilityFlag"
    type: "Boolean"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "enrollments"
    type: "EnrollmentDependent"
    multiplicity: "OneToMany"
- name: "BenefitProgram"
  description: "Annual program that groups plans, eligibility, contributions, and\
    \ enrollment windows for an employer."
  data:
  - name: "name"
    type: "String"
  - name: "planYear"
    type: "Integer"
  - name: "fundingType"
    type: "PlanFundingType"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "benefitPlans"
    type: "BenefitPlan"
    multiplicity: "OneToMany"
  - name: "enrollmentWindows"
    type: "EnrollmentWindow"
    multiplicity: "OneToMany"
  - name: "contributionPolicies"
    type: "ContributionPolicy"
    multiplicity: "OneToMany"
- name: "BenefitPlan"
  description: "Specific benefit offering such as medical, dental, vision, life, or\
    \ spending accounts."
  data:
  - name: "name"
    type: "String"
  - name: "benefitType"
    type: "BenefitType"
  - name: "requiresEvidence"
    type: "Boolean"
  - name: "networkApplicable"
    type: "Boolean"
  relations:
  - name: "program"
    type: "BenefitProgram"
    multiplicity: "ManyToOne"
  - name: "planOptions"
    type: "PlanOption"
    multiplicity: "OneToMany"
  - name: "eligibilityRules"
    type: "EligibilityRule"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "Policy"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "PlanDocument"
    multiplicity: "OneToMany"
- name: "PlanOption"
  description: "Variant of a benefit plan with distinct coverage features or cost-sharing\
    \ levels."
  data:
  - name: "name"
    type: "String"
  - name: "metalLevel"
    type: "PlanMetalLevel"
  - name: "deductibleAmount"
    type: "Money"
  - name: "outOfPocketMax"
    type: "Money"
  - name: "hsaEligible"
    type: "Boolean"
  relations:
  - name: "benefitPlan"
    type: "BenefitPlan"
    multiplicity: "ManyToOne"
  - name: "rateTables"
    type: "RateTable"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "Policy"
    multiplicity: "OneToMany"
  - name: "enrollments"
    type: "Enrollment"
    multiplicity: "OneToMany"
  - name: "spendingAccounts"
    type: "SpendingAccount"
    multiplicity: "OneToMany"
  - name: "cobraEnrollments"
    type: "COBRAEnrollment"
    multiplicity: "OneToMany"
- name: "Policy"
  description: "Insurance or administrative contract that binds a carrier and employer\
    \ to a plan option."
  data:
  - name: "policyNumber"
    type: "String"
  - name: "effectiveStart"
    type: "Date"
  - name: "effectiveEnd"
    type: "Date"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "planOption"
    type: "PlanOption"
    multiplicity: "ManyToOne"
  - name: "claims"
    type: "Claim"
    multiplicity: "OneToMany"
- name: "Carrier"
  description: "Insurance or third-party administrator responsible for underwriting,\
    \ networks, and claims processing."
  data:
  - name: "name"
    type: "String"
  - name: "naicCode"
    type: "String"
  - name: "website"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "policies"
    type: "Policy"
    multiplicity: "OneToMany"
  - name: "networks"
    type: "Network"
    multiplicity: "OneToMany"
  - name: "providers"
    type: "Provider"
    multiplicity: "ManyToMany"
- name: "Network"
  description: "Contracted set of healthcare providers associated with a carrier and\
    \ tiered access."
  data:
  - name: "name"
    type: "String"
  - name: "networkTier"
    type: "NetworkTier"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "providers"
    type: "Provider"
    multiplicity: "ManyToMany"
- name: "Provider"
  description: "Healthcare professional or facility rendering covered services."
  data:
  - name: "name"
    type: "String"
  - name: "npi"
    type: "String"
  - name: "specialty"
    type: "ProviderSpecialty"
  relations:
  - name: "networks"
    type: "Network"
    multiplicity: "ManyToMany"
  - name: "claims"
    type: "Claim"
    multiplicity: "OneToMany"
- name: "RateTable"
  description: "Effective-dated set of premium rates for a plan option based on rating\
    \ method."
  data:
  - name: "effectiveStart"
    type: "Date"
  - name: "effectiveEnd"
    type: "Date"
  - name: "ratingMethod"
    type: "RatingMethod"
  relations:
  - name: "planOption"
    type: "PlanOption"
    multiplicity: "ManyToOne"
  - name: "premiumRates"
    type: "PremiumRate"
    multiplicity: "OneToMany"
- name: "PremiumRate"
  description: "Individual premium entry for a coverage level and, where applicable,\
    \ an age band."
  data:
  - name: "coverageLevel"
    type: "CoverageLevel"
  - name: "ageBandName"
    type: "String"
  - name: "monthlyPremium"
    type: "Money"
  relations:
  - name: "rateTable"
    type: "RateTable"
    multiplicity: "ManyToOne"
- name: "EligibilityRule"
  description: "Criteria that determine when and how an employee or dependent qualifies\
    \ for a plan."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "EligibilityRuleType"
  - name: "waitingPeriodDays"
    type: "Integer"
  - name: "minimumHoursPerWeek"
    type: "Integer"
  - name: "unionCode"
    type: "String"
  relations:
  - name: "benefitPlan"
    type: "BenefitPlan"
    multiplicity: "ManyToOne"
- name: "EnrollmentWindow"
  description: "Time-bound window during which enrollments or changes are permitted."
  data:
  - name: "windowType"
    type: "EnrollmentWindowType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "benefitProgram"
    type: "BenefitProgram"
    multiplicity: "ManyToOne"
- name: "Enrollment"
  description: "Employee’s elected coverage for a specific plan option and coverage\
    \ level."
  data:
  - name: "status"
    type: "EnrollmentStatus"
  - name: "effectiveDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "coverageLevel"
    type: "CoverageLevel"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "planOption"
    type: "PlanOption"
    multiplicity: "ManyToOne"
  - name: "enrollmentDependents"
    type: "EnrollmentDependent"
    multiplicity: "OneToMany"
  - name: "payrollDeductions"
    type: "PayrollDeduction"
    multiplicity: "OneToMany"
  - name: "evidenceOfInsurability"
    type: "EvidenceOfInsurability"
    multiplicity: "OneToOne"
  - name: "lifeEvent"
    type: "LifeEvent"
    multiplicity: "ManyToOne"
- name: "EnrollmentDependent"
  description: "Inclusion of a dependent on a specific enrollment with effective-dated\
    \ coverage."
  data:
  - name: "coverageStart"
    type: "Date"
  - name: "coverageEnd"
    type: "Date"
  relations:
  - name: "enrollment"
    type: "Enrollment"
    multiplicity: "ManyToOne"
  - name: "dependent"
    type: "Dependent"
    multiplicity: "ManyToOne"
- name: "EvidenceOfInsurability"
  description: "Underwriting process and decision required for certain coverage amounts\
    \ or plan types."
  data:
  - name: "requestDate"
    type: "Date"
  - name: "status"
    type: "EvidenceStatus"
  - name: "decisionDate"
    type: "Date"
  relations:
  - name: "enrollment"
    type: "Enrollment"
    multiplicity: "OneToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
- name: "ContributionPolicy"
  description: "Employer funding rules that determine contributions toward employee\
    \ premiums or accounts."
  data:
  - name: "name"
    type: "String"
  - name: "contributionMethod"
    type: "ContributionMethod"
  - name: "employerPercent"
    type: "Decimal"
  - name: "employerAmount"
    type: "Money"
  - name: "appliesTo"
    type: "ContributionScope"
  relations:
  - name: "benefitPlan"
    type: "BenefitPlan"
    multiplicity: "ManyToOne"
- name: "PayrollDeduction"
  description: "Employee cost share deducted through payroll for elected benefits."
  data:
  - name: "deductionType"
    type: "ContributionType"
  - name: "amount"
    type: "Money"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "frequency"
    type: "DeductionFrequency"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "enrollment"
    type: "Enrollment"
    multiplicity: "ManyToOne"
- name: "SpendingAccount"
  description: "Tax-advantaged account associated with certain plan options used to\
    \ pay eligible expenses."
  data:
  - name: "accountType"
    type: "SpendingAccountType"
  - name: "planYear"
    type: "Integer"
  - name: "contributionLimit"
    type: "Money"
  - name: "rolloverAllowed"
    type: "Boolean"
  - name: "balance"
    type: "Money"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "planOption"
    type: "PlanOption"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "SpendingTransaction"
    multiplicity: "OneToMany"
- name: "SpendingTransaction"
  description: "Financial transaction affecting a spending account, including contributions\
    \ and reimbursements."
  data:
  - name: "transactionDate"
    type: "Date"
  - name: "transactionType"
    type: "SpendingTransactionType"
  - name: "amount"
    type: "Money"
  - name: "merchantCategory"
    type: "String"
  relations:
  - name: "spendingAccount"
    type: "SpendingAccount"
    multiplicity: "ManyToOne"
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
- name: "LifeEvent"
  description: "Qualifying event allowing changes to benefits outside open enrollment."
  data:
  - name: "eventType"
    type: "LifeEventType"
  - name: "eventDate"
    type: "Date"
  - name: "description"
    type: "String"
  - name: "documentationRequired"
    type: "Boolean"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "enrollments"
    type: "Enrollment"
    multiplicity: "OneToMany"
- name: "Claim"
  description: "Request for payment of covered services processed according to policy\
    \ and network rules."
  data:
  - name: "claimNumber"
    type: "String"
  - name: "claimType"
    type: "ClaimType"
  - name: "status"
    type: "ClaimStatus"
  - name: "dateOfService"
    type: "Date"
  - name: "billedAmount"
    type: "Money"
  - name: "allowedAmount"
    type: "Money"
  - name: "paidAmount"
    type: "Money"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "Provider"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "claimLines"
    type: "ClaimLine"
    multiplicity: "OneToMany"
  - name: "spendingTransactions"
    type: "SpendingTransaction"
    multiplicity: "OneToMany"
- name: "ClaimLine"
  description: "Line-level detail of a claim representing a specific service or item."
  data:
  - name: "serviceCode"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "billedAmount"
    type: "Money"
  - name: "allowedAmount"
    type: "Money"
  - name: "memberCostShare"
    type: "Money"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
- name: "COBRAEvent"
  description: "Qualifying event that triggers eligibility for continuation coverage\
    \ under COBRA."
  data:
  - name: "eventType"
    type: "COBRAEventType"
  - name: "eventDate"
    type: "Date"
  - name: "description"
    type: "String"
  - name: "notificationSentDate"
    type: "Date"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "cobraEnrollments"
    type: "COBRAEnrollment"
    multiplicity: "OneToMany"
- name: "COBRAEnrollment"
  description: "Continuation coverage election and status under COBRA."
  data:
  - name: "status"
    type: "COBRAEnrollmentStatus"
  - name: "coverageLevel"
    type: "CoverageLevel"
  - name: "effectiveDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "cobraEvent"
    type: "COBRAEvent"
    multiplicity: "ManyToOne"
  - name: "planOption"
    type: "PlanOption"
    multiplicity: "ManyToOne"
- name: "PlanDocument"
  description: "Official plan communication such as summaries, certificates, and amendments."
  data:
  - name: "documentType"
    type: "PlanDocumentType"
  - name: "version"
    type: "String"
  - name: "publishedDate"
    type: "Date"
  - name: "url"
    type: "String"
  relations:
  - name: "benefitPlan"
    type: "BenefitPlan"
    multiplicity: "ManyToOne"
- name: "WellnessIncentive"
  description: "Incentive or reward earned by the employee for completing wellness\
    \ activities."
  data:
  - name: "name"
    type: "String"
  - name: "incentiveType"
    type: "IncentiveType"
  - name: "amount"
    type: "Money"
  - name: "completionDate"
    type: "Date"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "benefitProgram"
    type: "BenefitProgram"
    multiplicity: "ManyToOne"
enums:
- name: "BenefitType"
  description: "Categories of benefits offered to employees and dependents."
  data:
  - name: "Medical"
  - name: "Dental"
  - name: "Vision"
  - name: "Life"
  - name: "DisabilityShortTerm"
  - name: "DisabilityLongTerm"
  - name: "Accident"
  - name: "CriticalIllness"
  - name: "HospitalIndemnity"
  - name: "Commuter"
  - name: "HSA"
  - name: "FSAHealthcare"
  - name: "FSADependentCare"
  - name: "HRA"
  - name: "EAP"
  - name: "Wellness"
- name: "PlanFundingType"
  description: "Financing approach used to fund claims and premiums."
  data:
  - name: "FullyInsured"
  - name: "SelfFunded"
  - name: "LevelFunded"
- name: "CoverageLevel"
  description: "Family coverage configuration elected by the member."
  data:
  - name: "EmployeeOnly"
  - name: "EmployeeSpouse"
  - name: "EmployeeChild"
  - name: "EmployeeChildren"
  - name: "Family"
  - name: "Waive"
- name: "EmploymentStatus"
  description: "Employment state determining benefits eligibility and deductions."
  data:
  - name: "Active"
  - name: "Leave"
  - name: "Terminated"
  - name: "Retired"
  - name: "PartTime"
- name: "DependentRelationship"
  description: "Relationship of a dependent to the employee for coverage purposes."
  data:
  - name: "Spouse"
  - name: "DomesticPartner"
  - name: "Child"
  - name: "StepChild"
  - name: "FosterChild"
  - name: "Other"
- name: "EnrollmentWindowType"
  description: "Reason and timing category for allowing benefit elections."
  data:
  - name: "OpenEnrollment"
  - name: "NewHire"
  - name: "LifeEvent"
  - name: "Reinstatement"
- name: "EnrollmentStatus"
  description: "Current state of an enrollment record in the benefits lifecycle."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "PendingEvidence"
  - name: "Waived"
  - name: "Terminated"
- name: "LifeEventType"
  description: "Qualifying events that permit mid-year enrollment changes."
  data:
  - name: "Marriage"
  - name: "Birth"
  - name: "Adoption"
  - name: "Divorce"
  - name: "Death"
  - name: "LossOfCoverage"
  - name: "GainOfCoverage"
  - name: "ChangeInHours"
  - name: "Relocation"
  - name: "CourtOrder"
- name: "EvidenceStatus"
  description: "Status of evidence of insurability underwriting and decisioning."
  data:
  - name: "NotRequired"
  - name: "Requested"
  - name: "Submitted"
  - name: "Approved"
  - name: "Declined"
  - name: "Expired"
- name: "RatingMethod"
  description: "Method used by the carrier to calculate premium rates."
  data:
  - name: "Composite"
  - name: "AgeBanded"
  - name: "TobaccoTiered"
  - name: "CompositeFamilyTier"
- name: "PlanMetalLevel"
  description: "Cost-sharing level or design tier used to differentiate plan options."
  data:
  - name: "Platinum"
  - name: "Gold"
  - name: "Silver"
  - name: "Bronze"
  - name: "HighDeductible"
- name: "ContributionType"
  description: "Classification of payroll or employer contribution applied to benefits."
  data:
  - name: "PreTax"
  - name: "PostTax"
  - name: "Employer"
  - name: "EmployerHSASeed"
  - name: "EmployerMatch"
- name: "ContributionMethod"
  description: "Rule used to compute employer contributions for premiums or accounts."
  data:
  - name: "FixedAmount"
  - name: "PercentageOfPremium"
  - name: "TieredAmount"
- name: "ContributionScope"
  description: "Scope of benefits to which a contribution policy applies."
  data:
  - name: "MedicalOnly"
  - name: "AllPlans"
  - name: "HSAOnly"
  - name: "FSAOnly"
  - name: "DentalOnly"
  - name: "VisionOnly"
- name: "DeductionFrequency"
  description: "Frequency with which payroll deductions are taken."
  data:
  - name: "PerPayPeriod"
  - name: "Weekly"
  - name: "BiWeekly"
  - name: "SemiMonthly"
  - name: "Monthly"
- name: "ClaimType"
  description: "Type of claim submitted for benefits reimbursement or payment."
  data:
  - name: "Medical"
  - name: "Dental"
  - name: "Vision"
  - name: "Pharmacy"
  - name: "Life"
  - name: "Disability"
- name: "ClaimStatus"
  description: "Processing status of a claim from receipt to final disposition."
  data:
  - name: "Received"
  - name: "InReview"
  - name: "Approved"
  - name: "Denied"
  - name: "PartiallyApproved"
  - name: "Paid"
  - name: "Adjusted"
  - name: "Voided"
- name: "ProviderSpecialty"
  description: "Clinical area of focus for a provider used in network and claim adjudication."
  data:
  - name: "PrimaryCare"
  - name: "Pediatrics"
  - name: "ObstetricsGynecology"
  - name: "Cardiology"
  - name: "Dentistry"
  - name: "Optometry"
  - name: "Pharmacy"
  - name: "MentalHealth"
  - name: "Chiropractic"
  - name: "UrgentCare"
- name: "NetworkTier"
  description: "Access and pricing level for providers within a carrier network."
  data:
  - name: "InNetwork"
  - name: "OutOfNetwork"
  - name: "Tier1"
  - name: "Tier2"
- name: "SpendingAccountType"
  description: "Type of consumer-directed account used to manage eligible expenses."
  data:
  - name: "HSA"
  - name: "FSAHealthcare"
  - name: "FSADependentCare"
  - name: "HRA"
  - name: "CommuterTransit"
  - name: "CommuterParking"
- name: "SpendingTransactionType"
  description: "Nature of a transaction impacting a spending account balance."
  data:
  - name: "Contribution"
  - name: "DebitCard"
  - name: "Reimbursement"
  - name: "Adjustment"
  - name: "Fee"
  - name: "Interest"
- name: "COBRAEventType"
  description: "Events that create eligibility for COBRA continuation coverage."
  data:
  - name: "TerminationOfEmployment"
  - name: "ReductionInHours"
  - name: "Divorce"
  - name: "Death"
  - name: "AgedOutDependent"
  - name: "MedicareEntitlement"
- name: "COBRAEnrollmentStatus"
  description: "Status of a COBRA continuation enrollment."
  data:
