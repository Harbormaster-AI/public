---
metadata:
  name: "HCIDL Capabilities Model - Learning Management"
  description: "Capability model for planning, delivering, tracking, and validating\
    \ workforce learning, including courses, sessions, assessments, skills, and credentials."
  version: "1.0.0"
  industry: "Human Resources"
  category: "Human Resources"
  type: "Capability"
  domain: "Learning Management"
entities:
- name: "TrainingProvider"
  description: "External or internal organization responsible for creating or delivering\
    \ courses."
  data:
  - name: "name"
    type: "String"
  - name: "contactEmail"
    type: "Email"
  - name: "website"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "courses"
    type: "Course"
    multiplicity: "OneToMany"
- name: "Department"
  description: "Organizational unit used to group learners and instructors for administrative\
    \ purposes."
  data:
  - name: "name"
    type: "String"
  - name: "costCenter"
    type: "String"
  relations:
  - name: "learners"
    type: "LearnerProfile"
    multiplicity: "OneToMany"
  - name: "instructors"
    type: "Instructor"
    multiplicity: "OneToMany"
- name: "LearnerProfile"
  description: "Individual employee record representing a person participating in\
    \ learning activities."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "Email"
  - name: "jobTitle"
    type: "String"
  - name: "languagePreference"
    type: "Language"
  - name: "hireDate"
    type: "Date"
  relations:
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "enrollments"
    type: "Enrollment"
    multiplicity: "OneToMany"
  - name: "completions"
    type: "CompletionRecord"
    multiplicity: "OneToMany"
  - name: "certificates"
    type: "Certificate"
    multiplicity: "OneToMany"
  - name: "badges"
    type: "Badge"
    multiplicity: "OneToMany"
  - name: "competencyProfile"
    type: "CompetencyProfile"
    multiplicity: "OneToOne"
  - name: "creditGrants"
    type: "CreditGrant"
    multiplicity: "OneToMany"
  - name: "attendanceRecords"
    type: "AttendanceRecord"
    multiplicity: "OneToMany"
  - name: "feedback"
    type: "Feedback"
    multiplicity: "OneToMany"
  - name: "learningAssignments"
    type: "LearningAssignment"
    multiplicity: "OneToMany"
  - name: "competencyAchievements"
    type: "CompetencyAchievement"
    multiplicity: "OneToMany"
  - name: "attempts"
    type: "Attempt"
    multiplicity: "OneToMany"
- name: "Instructor"
  description: "Person who facilitates, teaches, or assesses learners in courses and\
    \ sessions."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "Email"
  - name: "bio"
    type: "String"
  - name: "primaryLanguage"
    type: "Language"
  relations:
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
  - name: "courses"
    type: "Course"
    multiplicity: "ManyToMany"
  - name: "questionBanks"
    type: "QuestionBank"
    multiplicity: "OneToMany"
  - name: "gradedEntries"
    type: "GradebookEntry"
    multiplicity: "OneToMany"
  - name: "feedback"
    type: "Feedback"
    multiplicity: "OneToMany"
- name: "Course"
  description: "Structured learning offering with content, schedule options, and assessments."
  data:
  - name: "title"
    type: "String"
  - name: "courseCode"
    type: "String"
  - name: "shortDescription"
    type: "String"
  - name: "level"
    type: "CourseLevel"
  - name: "deliveryMode"
    type: "DeliveryMode"
  - name: "visibility"
    type: "Visibility"
  - name: "duration"
    type: "Duration"
  - name: "language"
    type: "Language"
  - name: "ceuValue"
    type: "Decimal"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "provider"
    type: "TrainingProvider"
    multiplicity: "ManyToOne"
  - name: "modules"
    type: "Module"
    multiplicity: "OneToMany"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
  - name: "enrollments"
    type: "Enrollment"
    multiplicity: "OneToMany"
  - name: "targetCompetencies"
    type: "Competency"
    multiplicity: "ManyToMany"
  - name: "relatedSkills"
    type: "Skill"
    multiplicity: "ManyToMany"
  - name: "prerequisites"
    type: "Prerequisite"
    multiplicity: "OneToMany"
  - name: "certificates"
    type: "Certificate"
    multiplicity: "OneToMany"
  - name: "learningPaths"
    type: "LearningPath"
    multiplicity: "ManyToMany"
  - name: "creditGrants"
    type: "CreditGrant"
    multiplicity: "OneToMany"
  - name: "feedback"
    type: "Feedback"
    multiplicity: "OneToMany"
  - name: "assessments"
    type: "Assessment"
    multiplicity: "OneToMany"
- name: "Module"
  description: "Logical section within a course that groups lessons and assessments."
  data:
  - name: "title"
    type: "String"
  - name: "order"
    type: "Integer"
  - name: "summary"
    type: "String"
  relations:
  - name: "course"
    type: "Course"
    multiplicity: "ManyToOne"
  - name: "lessons"
    type: "Lesson"
    multiplicity: "OneToMany"
  - name: "assessments"
    type: "Assessment"
    multiplicity: "OneToMany"
- name: "Lesson"
  description: "Deliverable unit of learning content within a module."
  data:
  - name: "title"
    type: "String"
  - name: "order"
    type: "Integer"
  - name: "contentType"
    type: "ContentType"
  - name: "duration"
    type: "Duration"
  - name: "overview"
    type: "String"
  relations:
  - name: "module"
    type: "Module"
    multiplicity: "ManyToOne"
  - name: "contentAssets"
    type: "ContentAsset"
    multiplicity: "OneToMany"
- name: "ContentAsset"
  description: "File or link used as learning material for a lesson."
  data:
  - name: "name"
    type: "String"
  - name: "uri"
    type: "String"
  - name: "contentType"
    type: "ContentType"
  - name: "language"
    type: "Language"
  - name: "fileSizeBytes"
    type: "Integer"
  relations:
  - name: "lesson"
    type: "Lesson"
    multiplicity: "ManyToOne"
- name: "Session"
  description: "Scheduled offering of a course with defined dates and capacity."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "SessionStatus"
  - name: "capacity"
    type: "Integer"
  - name: "isVirtual"
    type: "Boolean"
  relations:
  - name: "course"
    type: "Course"
    multiplicity: "ManyToOne"
  - name: "instructor"
    type: "Instructor"
    multiplicity: "ManyToOne"
  - name: "classroom"
    type: "Classroom"
    multiplicity: "ManyToOne"
  - name: "enrollments"
    type: "Enrollment"
    multiplicity: "OneToMany"
  - name: "attendanceRecords"
    type: "AttendanceRecord"
    multiplicity: "OneToMany"
  - name: "feedback"
    type: "Feedback"
    multiplicity: "OneToMany"
- name: "Classroom"
  description: "Physical or virtual location used to host learning sessions."
  data:
  - name: "name"
    type: "String"
  - name: "location"
    type: "Address"
  - name: "capacity"
    type: "Integer"
  - name: "virtualMeetingLink"
    type: "String"
  relations:
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
- name: "Enrollment"
  description: "Registration of a learner into a course or a specific session."
  data:
  - name: "status"
    type: "EnrollmentStatus"
  - name: "enrolledOn"
    type: "Date"
  - name: "completionDueDate"
    type: "Date"
  - name: "fee"
    type: "Money"
  - name: "isWaitlist"
    type: "Boolean"
  relations:
  - name: "learner"
    type: "LearnerProfile"
    multiplicity: "ManyToOne"
  - name: "course"
    type: "Course"
    multiplicity: "ManyToOne"
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "attempts"
    type: "Attempt"
    multiplicity: "OneToMany"
  - name: "completion"
    type: "CompletionRecord"
    multiplicity: "OneToOne"
- name: "Assessment"
  description: "Measurable activity used to evaluate knowledge or skill attainment."
  data:
  - name: "title"
    type: "String"
  - name: "assessmentType"
    type: "AssessmentType"
  - name: "passingScore"
    type: "Decimal"
  - name: "timeLimitMinutes"
    type: "Integer"
  - name: "gradingMode"
    type: "GradingMode"
  - name: "randomized"
    type: "Boolean"
  relations:
  - name: "course"
    type: "Course"
    multiplicity: "ManyToOne"
  - name: "module"
    type: "Module"
    multiplicity: "ManyToOne"
  - name: "questions"
    type: "QuestionItem"
    multiplicity: "OneToMany"
  - name: "attempts"
    type: "Attempt"
    multiplicity: "OneToMany"
  - name: "bank"
    type: "QuestionBank"
    multiplicity: "ManyToOne"
- name: "QuestionBank"
  description: "Curated repository of reusable question items for assessments."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "language"
    type: "Language"
  - name: "topic"
    type: "String"
  relations:
  - name: "questions"
    type: "QuestionItem"
    multiplicity: "OneToMany"
  - name: "owner"
    type: "Instructor"
    multiplicity: "ManyToOne"
  - name: "assessments"
    type: "Assessment"
    multiplicity: "OneToMany"
- name: "QuestionItem"
  description: "Individual assessment question with scoring attributes."
  data:
  - name: "prompt"
    type: "RichText"
  - name: "questionType"
    type: "QuestionType"
  - name: "maxScore"
    type: "Decimal"
  - name: "shuffleOptions"
    type: "Boolean"
  relations:
  - name: "assessment"
    type: "Assessment"
    multiplicity: "ManyToOne"
  - name: "bank"
    type: "QuestionBank"
    multiplicity: "ManyToOne"
  - name: "options"
    type: "OptionChoice"
    multiplicity: "OneToMany"
- name: "OptionChoice"
  description: "Potential answer option associated with a question item."
  data:
  - name: "label"
    type: "String"
  - name: "value"
    type: "String"
  - name: "isCorrect"
    type: "Boolean"
  - name: "feedback"
    type: "String"
  relations:
  - name: "question"
    type: "QuestionItem"
    multiplicity: "ManyToOne"
- name: "Attempt"
  description: "A learner's effort to complete an assessment instance."
  data:
  - name: "startedOn"
    type: "Date"
  - name: "submittedOn"
    type: "Date"
  - name: "status"
    type: "AttemptStatus"
  - name: "score"
    type: "Score"
  relations:
  - name: "enrollment"
    type: "Enrollment"
    multiplicity: "ManyToOne"
  - name: "assessment"
    type: "Assessment"
    multiplicity: "ManyToOne"
  - name: "submission"
    type: "Submission"
    multiplicity: "OneToOne"
  - name: "gradebookEntry"
    type: "GradebookEntry"
    multiplicity: "OneToOne"
  - name: "learner"
    type: "LearnerProfile"
    multiplicity: "ManyToOne"
- name: "Submission"
  description: "Work product or response content provided for grading."
  data:
  - name: "submittedAt"
    type: "Date"
  - name: "contentURI"
    type: "String"
  - name: "comments"
    type: "String"
  relations:
  - name: "attempt"
    type: "Attempt"
    multiplicity: "ManyToOne"
  - name: "attachments"
    type: "SubmissionAttachment"
    multiplicity: "OneToMany"
- name: "SubmissionAttachment"
  description: "Binary or linked artifact associated with a submission."
  data:
  - name: "filename"
    type: "String"
  - name: "uri"
    type: "String"
  - name: "contentType"
    type: "ContentType"
  - name: "sizeBytes"
    type: "Integer"
  relations:
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
- name: "GradebookEntry"
  description: "Official record of grading results for an attempt."
  data:
  - name: "pointsEarned"
    type: "Decimal"
  - name: "pointsPossible"
    type: "Decimal"
  - name: "gradedAt"
    type: "Date"
  - name: "feedback"
    type: "RichText"
  - name: "passed"
    type: "Boolean"
  relations:
  - name: "attempt"
    type: "Attempt"
    multiplicity: "ManyToOne"
  - name: "assessor"
    type: "Instructor"
    multiplicity: "ManyToOne"
- name: "CompletionRecord"
  description: "Final outcome of a learner's enrollment including pass status and\
    \ score."
  data:
  - name: "completedOn"
    type: "Date"
  - name: "passed"
    type: "Boolean"
  - name: "finalScore"
    type: "Score"
  - name: "notes"
    type: "String"
  relations:
  - name: "enrollment"
    type: "Enrollment"
    multiplicity: "ManyToOne"
  - name: "certificate"
    type: "Certificate"
    multiplicity: "OneToOne"
  - name: "learner"
    type: "LearnerProfile"
    multiplicity: "ManyToOne"
- name: "Certificate"
  description: "Formal credential issued upon successful completion of a course."
  data:
  - name: "certificateNumber"
    type: "String"
  - name: "issuedOn"
    type: "Date"
  - name: "expiresOn"
    type: "Date"
  - name: "status"
    type: "CertificateStatus"
  - name: "title"
    type: "String"
  relations:
  - name: "course"
    type: "Course"
    multiplicity: "ManyToOne"
  - name: "learner"
    type: "LearnerProfile"
    multiplicity: "ManyToOne"
  - name: "completion"
    type: "CompletionRecord"
    multiplicity: "OneToOne"
- name: "Badge"
  description: "Digital recognition awarded for achieving specific learning milestones."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "imageURI"
    type: "String"
  - name: "issuedOn"
    type: "Date"
  relations:
  - name: "learner"
    type: "LearnerProfile"
    multiplicity: "ManyToOne"
  - name: "course"
    type: "Course"
    multiplicity: "ManyToOne"
- name: "Competency"
  description: "Measurable capability that a course or pathway aims to develop."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "category"
    type: "String"
  - name: "proficiencyScale"
    type: "String"
  relations:
  - name: "courses"
    type: "Course"
    multiplicity: "ManyToMany"
- name: "Skill"
  description: "Discrete, demonstrable ability that can be mapped to training."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "category"
    type: "String"
  relations:
  - name: "courses"
    type: "Course"
    multiplicity: "ManyToMany"
- name: "CompetencyProfile"
  description: "Consolidated view of a learner’s current skill levels and development\
    \ progress."
  data:
  - name: "summary"
    type: "String"
  - name: "lastReviewedOn"
    type: "Date"
  relations:
  - name: "learner"
    type: "LearnerProfile"
    multiplicity: "ManyToOne"
  - name: "skillRatings"
    type: "SkillRating"
    multiplicity: "OneToMany"
- name: "SkillRating"
  description: "Evidence-backed proficiency level for a specific skill within a profile."
  data:
  - name: "level"
    type: "ProficiencyLevel"
  - name: "lastUpdatedOn"
    type: "Date"
  - name: "evidence"
    type: "String"
  relations:
  - name: "profile"
    type: "CompetencyProfile"
    multiplicity: "ManyToOne"
  - name: "skill"
    type: "Skill"
    multiplicity: "ManyToOne"
- name: "CompetencyAchievement"
  description: "Verified attainment of a competency by a learner, with level and evidence."
  data:
  - name: "achievedOn"
    type: "Date"
  - name: "level"
    type: "ProficiencyLevel"
  - name: "evidenceURI"
    type: "String"
  relations:
  - name: "learner"
    type: "LearnerProfile"
    multiplicity: "ManyToOne"
  - name: "competency"
    type: "Competency"
    multiplicity: "ManyToOne"
  - name: "course"
    type: "Course"
    multiplicity: "ManyToOne"
- name: "LearningPath"
  description: "Prescribed sequence of courses curated for a target role or outcome."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "targetRole"
    type: "String"
  - name: "visibility"
    type: "Visibility"
  relations:
  - name: "courses"
    type: "Course"
    multiplicity: "ManyToMany"
  - name: "assignments"
    type: "LearningAssignment"
    multiplicity: "OneToMany"
- name: "LearningAssignment"
  description: "Directive assigning a course or path to a learner with a due date\
    \ and status."
  data:
  - name: "assignedOn"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "AssignmentStatus"
  relations:
  - name: "learner"
    type: "LearnerProfile"
    multiplicity: "ManyToOne"
  - name: "course"
    type: "Course"
    multiplicity: "ManyToOne"
  - name: "learningPath"
    type: "LearningPath"
    multiplicity: "ManyToOne"
- name: "Prerequisite"
  description: "Requirement that must be met before a learner can enroll in a course."
  data:
  - name: "prerequisiteType"
    type: "PrerequisiteType"
  - name: "requiredLevel"
    type: "ProficiencyLevel"
  - name: "notes"
    type: "String"
  relations:
  - name: "course"
    type: "Course"
    multiplicity: "ManyToOne"
  - name: "requiredCourse"
    type: "Course"
    multiplicity: "ManyToOne"
  - name: "requiredCompetency"
    type: "Competency"
    multiplicity: "ManyToOne"
- name: "AttendanceRecord"
  description: "Presence tracking for a learner in an instructor-led session."
  data:
  - name: "attendanceDate"
    type: "Date"
  - name: "status"
    type: "AttendanceStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "learner"
    type: "LearnerProfile"
    multiplicity: "ManyToOne"
- name: "Feedback"
  description: "Qualitative and quantitative evaluation of course, session, or instructor."
  data:
  - name: "rating"
    type: "Integer"
  - name: "comments"
    type: "String"
  - name: "submittedOn"
    type: "Date"
  relations:
  - name: "learner"
    type: "LearnerProfile"
    multiplicity: "ManyToOne"
  - name: "course"
    type: "Course"
    multiplicity: "ManyToOne"
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "instructor"
    type: "Instructor"
    multiplicity: "ManyToOne"
- name: "CreditGrant"
  description: "Award of professional or regulatory credit upon course completion."
  data:
  - name: "creditValue"
    type: "Decimal"
  - name: "creditType"
    type: "CreditType"
  - name: "grantedOn"
    type: "Date"
  - name: "referenceNumber"
    type: "String"
  relations:
  - name: "learner"
    type: "LearnerProfile"
    multiplicity: "ManyToOne"
  - name: "course"
    type: "Course"
    multiplicity: "ManyToOne"
enums:
- name: "DeliveryMode"
  description: "Method used to deliver course content."
  data:
  - name: "Online"
  - name: "InPerson"
  - name: "Blended"
  - name: "VirtualInstructorLed"
- name: "CourseLevel"
  description: "Complexity and intended audience experience for a course."
  data:
  - name: "Beginner"
  - name: "Intermediate"
  - name: "Advanced"
  - name: "Expert"
- name: "Visibility"
  description: "Access scope determining who can discover and enroll in content."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Private"
- name: "Language"
  description: "Primary language of instruction or content asset."
  data:
  - name: "English"
  - name: "Spanish"
  - name: "French"
  - name: "German"
  - name: "Chinese"
  - name: "Japanese"
  - name: "Arabic"
  - name: "Portuguese"
- name: "SessionStatus"
  description: "Lifecycle state of a scheduled session."
  data:
  - name: "Planned"
  - name: "Scheduled"
  - name: "Open"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
- name: "EnrollmentStatus"
  description: "Current state of a learner’s enrollment."
  data:
  - name: "Requested"
  - name: "Approved"
  - name: "Enrolled"
  - name: "Waitlisted"
  - name: "Withdrawn"
  - name: "Completed"
  - name: "Cancelled"
- name: "AssessmentType"
  description: "Classification of an assessment activity."
  data:
  - name: "Quiz"
  - name: "Exam"
  - name: "Assignment"
  - name: "Survey"
  - name: "Practical"
- name: "QuestionType"
  description: "Interaction model defining how a question is answered and scored."
  data:
  - name: "MultipleChoice"
  - name: "TrueFalse"
  - name: "ShortAnswer"
  - name: "Essay"
  - name: "Matching"
  - name: "Likert"
- name: "AttemptStatus"
  description: "Progress state of an assessment attempt."
  data:
  - name: "Started"
  - name: "Submitted"
  - name: "Passed"
  - name: "Failed"
  - name: "Abandoned"
- name: "GradingMode"
  description: "Scoring method used to evaluate an assessment."
  data:
  - name: "Points"
  - name: "Percentage"
  - name: "PassFail"
  - name: "Rubric"
- name: "CertificateStatus"
  description: "Validity and availability state of an issued certificate."
  data:
  - name: "Issued"
  - name: "Revoked"
  - name: "Expired"
- name: "ProficiencyLevel"
  description: "Standardized indicator of capability for a skill or competency."
  data:
  - name: "Novice"
  - name: "Competent"
  - name: "Proficient"
  - name: "Expert"
- name: "ContentType"
  description: "Format of a learning or submission asset."
  data:
  - name: "Video"
  - name: "Document"
  - name: "SCORM"
  - name: "Link"
  - name: "Audio"
  - name: "Interactive"
- name: "AttendanceStatus"
  description: "Recorded participation outcome for a session occurrence."
  data:
  - name: "Present"
  - name: "Absent"
  - name: "Late"
  - name: "Excused"
- name: "CreditType"
  description: "Unit of credit recognized by regulatory or professional bodies."
  data:
  - name: "CEU"
  - name: "PDH"
