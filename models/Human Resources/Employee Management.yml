---
metadata:
  name: "Employee Management Capabilities Model"
  description: "Canonical HCIDL capabilities model for managing employees, organizational\
    \ structure, positions, contracts, assignments, and workforce qualifications."
  version: "1.0.0"
  industry: "Human Resources"
  category: "Human Resources"
  type: "Capability"
  domain: "Employee Management"
entities:
- name: "Employer"
  description: "Legal employing entity that hires and manages a workforce."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "registrationCountry"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "businessUnits"
    type: "BusinessUnit"
    multiplicity: "OneToMany"
  - name: "departments"
    type: "Department"
    multiplicity: "OneToMany"
  - name: "locations"
    type: "WorkLocation"
    multiplicity: "OneToMany"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
  - name: "jobFamilies"
    type: "JobFamily"
    multiplicity: "OneToMany"
  - name: "jobGrades"
    type: "JobGrade"
    multiplicity: "OneToMany"
  - name: "jobProfiles"
    type: "JobProfile"
    multiplicity: "OneToMany"
  - name: "positions"
    type: "Position"
    multiplicity: "OneToMany"
  - name: "costCenters"
    type: "CostCenter"
    multiplicity: "OneToMany"
  - name: "skills"
    type: "Skill"
    multiplicity: "OneToMany"
  - name: "certifications"
    type: "Certification"
    multiplicity: "OneToMany"
- name: "BusinessUnit"
  description: "Top-level operational division within an employer."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "mission"
    type: "String"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "departments"
    type: "Department"
    multiplicity: "OneToMany"
  - name: "costCenters"
    type: "CostCenter"
    multiplicity: "OneToMany"
  - name: "leader"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "Department"
  description: "Functional organizational unit responsible for a specific domain of\
    \ work."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "manager"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "positions"
    type: "Position"
    multiplicity: "OneToMany"
  - name: "costCenters"
    type: "CostCenter"
    multiplicity: "ManyToMany"
- name: "WorkLocation"
  description: "Physical or virtual workplace where employees perform their duties."
  data:
  - name: "name"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "positions"
    type: "Position"
    multiplicity: "OneToMany"
  - name: "workAssignments"
    type: "WorkAssignment"
    multiplicity: "OneToMany"
- name: "JobFamily"
  description: "Grouping of similar jobs that share a common nature of work."
  data:
  - name: "name"
    type: "String"
  - name: "overview"
    type: "String"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "jobProfiles"
    type: "JobProfile"
    multiplicity: "OneToMany"
- name: "JobGrade"
  description: "Level within a structured pay and responsibility framework."
  data:
  - name: "gradeCode"
    type: "String"
  - name: "minPay"
    type: "Money"
  - name: "maxPay"
    type: "Money"
  - name: "payFrequency"
    type: "PayFrequency"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "jobProfiles"
    type: "JobProfile"
    multiplicity: "OneToMany"
- name: "JobProfile"
  description: "Standardized definition of a role including title, responsibilities,\
    \ and grade alignment."
  data:
  - name: "title"
    type: "String"
  - name: "jobCode"
    type: "String"
  - name: "exemptionStatus"
    type: "JobExemptionStatus"
  - name: "description"
    type: "String"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "jobFamily"
    type: "JobFamily"
    multiplicity: "ManyToOne"
  - name: "jobGrade"
    type: "JobGrade"
    multiplicity: "ManyToOne"
  - name: "positions"
    type: "Position"
    multiplicity: "OneToMany"
- name: "Position"
  description: "Budgeted seat in the organization chart that may be filled by an employee."
  data:
  - name: "title"
    type: "String"
  - name: "positionCode"
    type: "String"
  - name: "positionStatus"
    type: "PositionStatus"
  - name: "fteCapacity"
    type: "Decimal"
  relations:
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "jobProfile"
    type: "JobProfile"
    multiplicity: "ManyToOne"
  - name: "workLocation"
    type: "WorkLocation"
    multiplicity: "ManyToOne"
  - name: "reportsTo"
    type: "Position"
    multiplicity: "ManyToOne"
  - name: "workAssignments"
    type: "WorkAssignment"
    multiplicity: "OneToMany"
- name: "Employee"
  description: "Individual person employed by an employer."
  data:
  - name: "employeeNumber"
    type: "String"
  - name: "name"
    type: "PersonName"
  - name: "birthDate"
    type: "Date"
  - name: "personalEmail"
    type: "Email"
  - name: "workEmail"
    type: "Email"
  - name: "mobilePhone"
    type: "PhoneNumber"
  - name: "nationalIdentifier"
    type: "NationalIdentifier"
  - name: "primaryNationality"
    type: "String"
  - name: "hireDate"
    type: "Date"
  - name: "employmentStatus"
    type: "EmploymentStatus"
  - name: "employmentType"
    type: "EmploymentType"
  - name: "pronouns"
    type: "String"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "workAssignments"
    type: "WorkAssignment"
    multiplicity: "OneToMany"
  - name: "contracts"
    type: "EmploymentContract"
    multiplicity: "OneToMany"
  - name: "emergencyContacts"
    type: "EmergencyContact"
    multiplicity: "OneToMany"
  - name: "workAuthorizations"
    type: "WorkAuthorization"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "HRDocument"
    multiplicity: "OneToMany"
  - name: "addressRecords"
    type: "AddressRecord"
    multiplicity: "OneToMany"
  - name: "managerAssignmentsAsManager"
    type: "ManagerAssignment"
    multiplicity: "OneToMany"
  - name: "managerAssignmentsAsSubordinate"
    type: "ManagerAssignment"
    multiplicity: "OneToMany"
  - name: "employeeSkills"
    type: "EmployeeSkill"
    multiplicity: "OneToMany"
  - name: "languageSkills"
    type: "LanguageSkill"
    multiplicity: "OneToMany"
  - name: "employeeCertifications"
    type: "EmployeeCertification"
    multiplicity: "OneToMany"
  - name: "employmentEvents"
    type: "EmploymentEvent"
    multiplicity: "OneToMany"
  - name: "terminationRecords"
    type: "TerminationRecord"
    multiplicity: "OneToMany"
- name: "WorkAssignment"
  description: "Time-bound assignment of an employee to a position and organizational\
    \ attributes."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "assignmentStatus"
    type: "AssignmentStatus"
  - name: "percentTime"
    type: "Decimal"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "WorkLocation"
    multiplicity: "ManyToOne"
  - name: "costCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
  - name: "payComponents"
    type: "PayComponent"
    multiplicity: "OneToMany"
- name: "EmploymentContract"
  description: "Agreement that governs the terms and conditions of employment."
  data:
  - name: "contractNumber"
    type: "String"
  - name: "contractType"
    type: "ContractType"
  - name: "status"
    type: "ContractStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "standardHoursPerWeek"
    type: "Decimal"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "PayComponent"
  description: "Compensation element defining pay amount, rate, and frequency for\
    \ an assignment."
  data:
  - name: "componentType"
    type: "PayComponentType"
  - name: "amount"
    type: "Money"
  - name: "rate"
    type: "Decimal"
  - name: "payFrequency"
    type: "PayFrequency"
  - name: "effectiveStart"
    type: "Date"
  - name: "effectiveEnd"
    type: "Date"
  relations:
  - name: "workAssignment"
    type: "WorkAssignment"
    multiplicity: "ManyToOne"
  - name: "changes"
    type: "CompensationChange"
    multiplicity: "OneToMany"
- name: "CompensationChange"
  description: "Record of a pay component adjustment with effective values."
  data:
  - name: "changeDate"
    type: "Date"
  - name: "reason"
    type: "String"
  - name: "oldAmount"
    type: "Money"
  - name: "newAmount"
    type: "Money"
  relations:
  - name: "payComponent"
    type: "PayComponent"
    multiplicity: "ManyToOne"
- name: "EmergencyContact"
  description: "Person to contact in case of emergency for an employee."
  data:
  - name: "fullName"
    type: "String"
  - name: "relationship"
    type: "RelationshipType"
  - name: "phone"
    type: "PhoneNumber"
  - name: "email"
    type: "Email"
  - name: "isPrimary"
    type: "Boolean"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "WorkAuthorization"
  description: "Evidence of legal right to work in a given country."
  data:
  - name: "authorizationType"
    type: "WorkAuthorizationType"
  - name: "status"
    type: "WorkAuthorizationStatus"
  - name: "country"
    type: "String"
  - name: "documentNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "HRDocument"
  description: "Employee-related document stored for reference and compliance."
  data:
  - name: "documentType"
    type: "DocumentType"
  - name: "title"
    type: "String"
  - name: "fileName"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "CostCenter"
  description: "Accounting structure used to track and allocate personnel costs."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "costCenterType"
    type: "CostCenterType"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "departments"
    type: "Department"
    multiplicity: "ManyToMany"
  - name: "workAssignments"
    type: "WorkAssignment"
    multiplicity: "OneToMany"
- name: "ManagerAssignment"
  description: "Relationship indicating a managerial connection between two employees."
  data:
  - name: "relationshipType"
    type: "ManagerRelationshipType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "manager"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "subordinate"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "Skill"
  description: "Canonical skill taxonomy item maintained by the employer."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "employeeSkills"
    type: "EmployeeSkill"
    multiplicity: "OneToMany"
- name: "EmployeeSkill"
  description: "Mapping of an employee to a skill with proficiency and recency."
  data:
  - name: "proficiency"
    type: "ProficiencyLevel"
  - name: "lastUsedDate"
    type: "Date"
  - name: "yearsOfExperience"
    type: "Decimal"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "skill"
    type: "Skill"
    multiplicity: "ManyToOne"
- name: "Certification"
  description: "Professional credential available for employees to attain."
  data:
  - name: "name"
    type: "String"
  - name: "authority"
    type: "String"
  - name: "validForMonths"
    type: "Integer"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "employeeCertifications"
    type: "EmployeeCertification"
    multiplicity: "OneToMany"
- name: "EmployeeCertification"
  description: "Employee-held certification record with lifecycle status."
  data:
  - name: "certificationStatus"
    type: "CertificationStatus"
  - name: "credentialId"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "certification"
    type: "Certification"
    multiplicity: "ManyToOne"
- name: "LanguageSkill"
  description: "Declared language capability and proficiency for an employee."
  data:
  - name: "language"
    type: "Language"
  - name: "proficiency"
    type: "ProficiencyLevel"
  - name: "isNative"
    type: "Boolean"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "EmploymentEvent"
  description: "Auditable change in an employee’s record such as hire, transfer, or\
    \ pay change."
  data:
  - name: "eventDate"
    type: "Date"
  - name: "eventType"
    type: "EmploymentEventType"
  - name: "notes"
    type: "String"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "TerminationRecord"
  description: "Details of an employee’s separation from employment."
  data:
  - name: "terminationDate"
    type: "Date"
  - name: "reason"
    type: "TerminationReason"
  - name: "eligibleForRehire"
    type: "Boolean"
  - name: "lastWorkingDay"
    type: "Date"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "AddressRecord"
  description: "Historical address record for an employee with effective dates."
  data:
  - name: "addressType"
    type: "AddressType"
  - name: "address"
    type: "Address"
  - name: "effectiveStart"
    type: "Date"
  - name: "effectiveEnd"
    type: "Date"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
enums:
- name: "EmploymentStatus"
  description: "Current standing of an employee within the organization."
  data:
  - name: "Active"
  - name: "OnLeave"
  - name: "Suspended"
  - name: "Terminated"
  - name: "Retired"
- name: "EmploymentType"
  description: "Category describing the nature of the employment relationship."
  data:
  - name: "FullTime"
  - name: "PartTime"
  - name: "FixedTerm"
  - name: "Intern"
  - name: "Contractor"
- name: "AssignmentStatus"
  description: "Lifecycle state of a work assignment."
  data:
  - name: "Pending"
  - name: "Active"
  - name: "Suspended"
  - name: "Ended"
- name: "PayFrequency"
  description: "Interval at which pay is earned or disbursed."
  data:
  - name: "Hourly"
  - name: "Weekly"
  - name: "Biweekly"
  - name: "Monthly"
  - name: "Annual"
- name: "PayComponentType"
  description: "Classification of a compensation element."
  data:
  - name: "BaseSalary"
  - name: "HourlyWage"
  - name: "Allowance"
  - name: "BonusTarget"
  - name: "OvertimeRate"
- name: "ContractStatus"
  description: "Lifecycle state of an employment contract."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Suspended"
  - name: "Ended"
- name: "RelationshipType"
  description: "Relationship of an emergency contact to the employee."
  data:
  - name: "Spouse"
  - name: "Partner"
  - name: "Parent"
  - name: "Sibling"
  - name: "Guardian"
  - name: "Friend"
  - name: "Other"
- name: "WorkAuthorizationType"
  description: "Kind of document or standing that grants work eligibility."
  data:
  - name: "Visa"
  - name: "WorkPermit"
  - name: "Residency"
  - name: "Citizenship"
- name: "WorkAuthorizationStatus"
  description: "Status of a work authorization record."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Expired"
  - name: "Revoked"
- name: "DocumentType"
  description: "Type of HR document stored on an employee record."
  data:
  - name: "OfferLetter"
  - name: "EmploymentContract"
  - name: "NDA"
  - name: "PolicyAcknowledgment"
  - name: "DisciplinaryNotice"
  - name: "Other"
- name: "ManagerRelationshipType"
  description: "Nature of a managerial relationship between two employees."
  data:
  - name: "LineManager"
  - name: "MatrixManager"
  - name: "ProjectManager"
  - name: "Mentor"
- name: "ProficiencyLevel"
  description: "Standardized scale of skill or language proficiency."
  data:
  - name: "Basic"
  - name: "Conversational"
  - name: "Professional"
  - name: "Expert"
  - name: "Native"
- name: "CertificationStatus"
  description: "Current status of an employee’s certification."
  data:
  - name: "InProgress"
  - name: "Active"
  - name: "Expired"
  - name: "Revoked"
- name: "EmploymentEventType"
  description: "Categorization of events recorded on an employee file."
  data:
  - name: "Hire"
  - name: "Transfer"
  - name: "Promotion"
  - name: "Demotion"
  - name: "PayChange"
  - name: "StatusChange"
  - name: "ManagerChange"
  - name: "Termination"
- name: "TerminationReason"
  description: "Stated reason for separation from employment."
  data:
  - name: "Resignation"
  - name: "Redundancy"
  - name: "Misconduct"
  - name: "Performance"
  - name: "Retirement"
  - name: "EndOfContract"
  - name: "Deceased"
- name: "AddressType"
  description: "Purpose classification for an address record."
  data:
  - name: "Home"
  - name: "Mailing"
  - name: "Work"
- name: "JobExemptionStatus"
  description: "Exemption classification for overtime and wage rules."
  data:
  - name: "Exempt"
  - name: "NonExempt"
- name: "PositionStatus"
  description: "Availability and staffing state of a position."
  data:
  - name: "Open"
  - name: "Filled"
  - name: "Frozen"
  - name: "Closed"
- name: "CostCenterType"
  description: "Accounting category of a cost center."
  data:
  - name: "Operating"
  - name: "Capital"
  - name: "SharedService"
  - name: "Project"
- name: "ContractType"
  description: "Form of employment contract defining tenure and conditions."
  data:
  - name: "Permanent"
  - name: "FixedTerm"
  - name: "Apprenticeship"
  - name: "Internship"
  - name: "Contractor"
- name: "Language"
  description: "Supported set of languages for recording language skills."
  data:
  - name: "English"
  - name: "Spanish"
  - name: "French"
  - name: "German"
  - name: "Chinese"
  - name: "Japanese"
  - name: "Portuguese"
  - name: "Arabic"
valueObjects:
- name: "Money"
  description: "Monetary value paired with a currency code."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address for identifying a physical or mailing location."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "PersonName"
  description: "Human-readable components of a person’s name."
  data:
  - name: "givenName"
    type: "String"
  - name: "middleName"
    type: "String"
  - name: "familyName"
    type: "String"
  - name: "preferredName"
    type: "String"
- name: "Email"
  description: "Electronic mail address in string form."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "Telephone number captured as a formatted string."
  data:
  - name: "value"
    type: "String"
- name: "NationalIdentifier"
  description: "Government-issued national identification value within a country."
  data:
  - name: "country"
    type: "String"
  - name: "identifier"
    type: "String"
