  - name: "roleName"
    type: "String"
  - name: "grantedDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  relations:
  - name: "applicationSystem"
    type: "ApplicationSystem"
    multiplicity: "ManyToOne"
  - name: "newHire"
    type: "NewHire"
    multiplicity: "ManyToOne"
  - name: "request"
    type: "AccountProvisioningRequest"
    multiplicity: "ManyToOne"
- name: "EquipmentOrder"
  description: "Procurement order to obtain equipment and supplies for a new hire."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "status"
    type: "EquipmentOrderStatus"
  - name: "neededByDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "newHire"
    type: "NewHire"
    multiplicity: "ManyToOne"
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "lines"
