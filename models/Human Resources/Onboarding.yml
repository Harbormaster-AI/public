  - name: "course"
    type: "TrainingCourse"
    multiplicity: "ManyToOne"
  - name: "newHire"
    type: "NewHire"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "OnboardingTask"
    multiplicity: "ManyToOne"
- name: "EligibilityVerification"
  description: "Verification activity confirming right-to-work, background, or other\
