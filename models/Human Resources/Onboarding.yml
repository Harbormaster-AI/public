  data:
  - name: "verificationType"
    type: "EligibilityType"
  - name: "status"
    type: "EligibilityStatus"
  - name: "initiatedDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "newHire"
    type: "NewHire"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "ComplianceDocument"
    multiplicity: "ManyToMany"
- name: "PolicyAcknowledgment"
  description: "Record that a new hire has acknowledged receipt and understanding\
