  data:
  - name: "policyName"
    type: "String"
  - name: "acknowledgedDate"
    type: "Date"
  relations:
  - name: "newHire"
    type: "NewHire"
    multiplicity: "ManyToOne"
  - name: "document"
    type: "ComplianceDocument"
    multiplicity: "ManyToOne"
- name: "TaxWithholdingSetup"
  description: "New hire tax withholding elections submitted during onboarding."
  data:
  - name: "filingStatus"
    type: "FilingStatus"
  - name: "additionalWithholding"
    type: "Money"
  - name: "dependentsCount"
    type: "Integer"
  - name: "submissionDate"
    type: "Date"
  relations:
  - name: "newHire"
    type: "NewHire"
    multiplicity: "ManyToOne"
- name: "DirectDepositSetup"
