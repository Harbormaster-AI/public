  - name: "orientationSessions"
    type: "OrientationSession"
    multiplicity: "OneToMany"
- name: "TrainingCourse"
  description: "Learning item included in onboarding, such as compliance or role training."
  data:
  - name: "courseCode"
    type: "String"
  - name: "title"
    type: "String"
  - name: "deliveryMode"
    type: "TrainingDeliveryMode"
  - name: "durationMinutes"
    type: "Integer"
  - name: "courseLevel"
    type: "String"
