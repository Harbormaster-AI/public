  - name: "requestNumber"
    type: "String"
  - name: "status"
    type: "AccountProvisioningStatus"
  - name: "requestedRole"
    type: "String"
  - name: "requestedDate"
    type: "Date"
  - name: "effectiveDate"
    type: "Date"
  relations:
  - name: "applicationSystem"
    type: "ApplicationSystem"
    multiplicity: "ManyToOne"
  - name: "newHire"
    type: "NewHire"
    multiplicity: "ManyToOne"
  - name: "assignedTo"
    type: "StaffMember"
    multiplicity: "ManyToOne"
  - name: "accessGrants"
    type: "AccessGrant"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "OnboardingTask"
    multiplicity: "ManyToMany"
- name: "AccessGrant"
  description: "Record of effective access provided to a new hire for a system."
  data:
  - name: "accessLevel"
