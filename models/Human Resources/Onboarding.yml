---
metadata:
  name: "HCIDL Onboarding Capabilities Model"
  description: "Canonical capabilities model for Human Resources onboarding, covering\
    \ programs, plans, tasks, documents, provisioning, equipment, orientation, training,\
    \ and workforce readiness steps from offer acceptance through early tenure."
  version: "1.0.0"
  industry: "Human Resources"
  category: "Human Resources"
  type: "Capability"
  domain: "Onboarding"
entities:
- name: "Employer"
  description: "Legal entity responsible for hiring and onboarding workers."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "departments"
    type: "Department"
    multiplicity: "OneToMany"
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "onboardingPrograms"
    type: "OnboardingProgram"
    multiplicity: "OneToMany"
  - name: "staffMembers"
    type: "StaffMember"
    multiplicity: "OneToMany"
  - name: "cohorts"
    type: "OnboardingCohort"
    multiplicity: "OneToMany"
  - name: "newHires"
    type: "NewHire"
    multiplicity: "OneToMany"
- name: "Department"
  description: "Operational division within the employer to which roles and new hires\
    \ belong."
  data:
  - name: "name"
    type: "String"
  - name: "costCenter"
    type: "String"
  - name: "function"
    type: "String"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "positions"
    type: "JobPosition"
    multiplicity: "OneToMany"
  - name: "staffMembers"
    type: "StaffMember"
    multiplicity: "OneToMany"
  - name: "onboardingPrograms"
    type: "OnboardingProgram"
    multiplicity: "OneToMany"
  - name: "newHires"
    type: "NewHire"
    multiplicity: "OneToMany"
- name: "JobPosition"
  description: "Defined role a new hire is joining, informing onboarding scope and\
    \ requirements."
  data:
  - name: "title"
    type: "String"
  - name: "jobFamily"
    type: "String"
  - name: "grade"
    type: "String"
  - name: "locationType"
    type: "WorkLocationType"
  relations:
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "program"
    type: "OnboardingProgram"
    multiplicity: "ManyToOne"
  - name: "newHires"
    type: "NewHire"
    multiplicity: "OneToMany"
- name: "StaffMember"
  description: "Existing worker who participates in onboarding as manager, buddy,\
    \ mentor, or facilitator."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "workEmail"
    type: "EmailAddress"
  - name: "roleTitle"
    type: "String"
  - name: "phone"
    type: "PhoneNumber"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "managedNewHires"
    type: "NewHire"
    multiplicity: "OneToMany"
  - name: "buddyAssignments"
    type: "NewHire"
    multiplicity: "OneToMany"
  - name: "mentorships"
    type: "NewHire"
    multiplicity: "OneToMany"
  - name: "taskAssignments"
    type: "OnboardingTask"
    multiplicity: "OneToMany"
  - name: "orientationFacilitations"
    type: "OrientationSession"
    multiplicity: "OneToMany"
  - name: "accountRequests"
    type: "AccountProvisioningRequest"
    multiplicity: "OneToMany"
  - name: "workspaceAssignments"
    type: "WorkspaceAssignment"
    multiplicity: "OneToMany"
- name: "NewHire"
  description: "Person being onboarded from offer acceptance through early tenure."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "preferredName"
    type: "String"
  - name: "personalEmail"
    type: "EmailAddress"
  - name: "startDate"
    type: "Date"
  - name: "employmentType"
    type: "EmploymentType"
  - name: "workLocationType"
    type: "WorkLocationType"
  - name: "jobTitle"
    type: "String"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "position"
    type: "JobPosition"
    multiplicity: "ManyToOne"
  - name: "manager"
    type: "StaffMember"
    multiplicity: "ManyToOne"
  - name: "buddy"
    type: "StaffMember"
    multiplicity: "ManyToOne"
  - name: "mentor"
    type: "StaffMember"
    multiplicity: "ManyToOne"
  - name: "onboardingPlan"
    type: "OnboardingPlan"
    multiplicity: "OneToOne"
  - name: "equipmentOrders"
    type: "EquipmentOrder"
    multiplicity: "OneToMany"
  - name: "accountRequests"
    type: "AccountProvisioningRequest"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "ComplianceDocument"
    multiplicity: "OneToMany"
  - name: "trainings"
    type: "TrainingAssignment"
    multiplicity: "OneToMany"
  - name: "orientationAttendances"
    type: "OrientationAttendance"
    multiplicity: "OneToMany"
  - name: "workspaceAssignment"
    type: "WorkspaceAssignment"
    multiplicity: "OneToOne"
  - name: "surveyResponses"
    type: "SurveyResponse"
    multiplicity: "OneToMany"
  - name: "eligibilityVerification"
    type: "EligibilityVerification"
    multiplicity: "OneToOne"
  - name: "directDepositSetup"
    type: "DirectDepositSetup"
    multiplicity: "OneToOne"
  - name: "taxWithholdingSetup"
    type: "TaxWithholdingSetup"
    multiplicity: "OneToOne"
  - name: "accessGrants"
    type: "AccessGrant"
    multiplicity: "OneToMany"
- name: "OnboardingProgram"
  description: "Curated onboarding journey defining tasks, sessions, and resources\
    \ for specific roles or departments."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "programStatus"
    type: "ProgramStatus"
  - name: "durationDays"
    type: "Integer"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "departments"
    type: "Department"
    multiplicity: "ManyToMany"
  - name: "positions"
    type: "JobPosition"
    multiplicity: "ManyToMany"
  - name: "taskTemplates"
    type: "TaskTemplate"
    multiplicity: "OneToMany"
  - name: "orientationSessions"
    type: "OrientationSession"
    multiplicity: "OneToMany"
  - name: "resources"
    type: "KnowledgeResource"
    multiplicity: "ManyToMany"
  - name: "surveys"
    type: "FeedbackSurvey"
    multiplicity: "OneToMany"
  - name: "trainingCourses"
    type: "TrainingCourse"
    multiplicity: "OneToMany"
- name: "OnboardingPlan"
  description: "Personalized instance of an onboarding program for a specific new\
    \ hire."
  data:
  - name: "planName"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "targetCompletionDate"
    type: "Date"
  - name: "status"
    type: "PlanStatus"
  relations:
  - name: "newHire"
    type: "NewHire"
    multiplicity: "ManyToOne"
  - name: "program"
    type: "OnboardingProgram"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "OnboardingTask"
    multiplicity: "OneToMany"
- name: "TaskTemplate"
  description: "Reusable definition of a task used to generate onboarding task instances."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "TaskCategory"
  - name: "description"
    type: "String"
  - name: "dueAnchor"
    type: "DueAnchor"
  - name: "dueOffsetDays"
    type: "Integer"
  - name: "defaultAssignee"
    type: "AssigneeType"
  relations:
  - name: "program"
    type: "OnboardingProgram"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "ComplianceDocumentTemplate"
    multiplicity: "ManyToMany"
  - name: "trainingCourses"
    type: "TrainingCourse"
    multiplicity: "ManyToMany"
  - name: "applicationSystems"
    type: "ApplicationSystem"
    multiplicity: "ManyToMany"
  - name: "resources"
    type: "KnowledgeResource"
    multiplicity: "ManyToMany"
- name: "OnboardingTask"
  description: "Actionable work item within a new hire's onboarding plan."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "category"
    type: "TaskCategory"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "TaskStatus_"
  - name: "priority"
    type: "TaskPriority"
  - name: "assigneeType"
    type: "AssigneeType"
  relations:
  - name: "plan"
    type: "OnboardingPlan"
    multiplicity: "ManyToOne"
  - name: "assignedToStaffMember"
    type: "StaffMember"
    multiplicity: "ManyToOne"
  - name: "assignedToNewHire"
    type: "NewHire"
    multiplicity: "ManyToOne"
  - name: "relatedDocuments"
    type: "ComplianceDocument"
    multiplicity: "ManyToMany"
  - name: "accountRequests"
    type: "AccountProvisioningRequest"
    multiplicity: "ManyToMany"
  - name: "equipmentOrders"
    type: "EquipmentOrder"
    multiplicity: "ManyToMany"
  - name: "trainingAssignments"
    type: "TrainingAssignment"
    multiplicity: "OneToMany"
- name: "OrientationSession"
  description: "Scheduled orientation or welcome event for new hires."
  data:
  - name: "name"
    type: "String"
  - name: "sessionDate"
    type: "Date"
  - name: "durationMinutes"
    type: "Integer"
  - name: "location"
    type: "String"
  - name: "sessionType"
    type: "OrientationType"
  relations:
  - name: "program"
    type: "OnboardingProgram"
    multiplicity: "ManyToOne"
  - name: "facilitator"
    type: "StaffMember"
    multiplicity: "ManyToOne"
  - name: "attendances"
    type: "OrientationAttendance"
    multiplicity: "OneToMany"
  - name: "cohort"
    type: "OnboardingCohort"
    multiplicity: "ManyToOne"
  - name: "locationSite"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "OrientationAttendance"
  description: "Attendance record for a new hire at an orientation session."
  data:
  - name: "status"
    type: "AttendanceStatus"
  relations:
  - name: "session"
    type: "OrientationSession"
    multiplicity: "ManyToOne"
  - name: "newHire"
    type: "NewHire"
    multiplicity: "ManyToOne"
- name: "ComplianceDocumentTemplate"
  description: "Standardized document template used to generate required onboarding\
    \ documents."
  data:
  - name: "name"
    type: "String"
  - name: "documentType"
    type: "DocumentType"
  - name: "signatureType"
    type: "SignatureType"
  - name: "validityDays"
    type: "Integer"
  relations:
  - name: "resources"
    type: "KnowledgeResource"
    multiplicity: "ManyToMany"
  - name: "tasks"
    type: "TaskTemplate"
    multiplicity: "ManyToMany"
  - name: "documents"
    type: "ComplianceDocument"
    multiplicity: "OneToMany"
- name: "ComplianceDocument"
  description: "Issued onboarding document for a new hire, possibly requiring signature\
    \ or acknowledgment."
  data:
  - name: "version"
    type: "String"
  - name: "status"
    type: "DocumentStatus"
  - name: "issuedDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "template"
    type: "ComplianceDocumentTemplate"
    multiplicity: "ManyToOne"
  - name: "newHire"
    type: "NewHire"
    multiplicity: "ManyToOne"
  - name: "envelope"
    type: "ESignatureEnvelope"
    multiplicity: "OneToOne"
  - name: "policyAcknowledgment"
    type: "PolicyAcknowledgment"
    multiplicity: "OneToOne"
- name: "ESignatureEnvelope"
  description: "Electronic signature container used to route and track document signing."
  data:
  - name: "provider"
    type: "String"
  - name: "envelopeNumber"
    type: "String"
  - name: "status"
    type: "DocumentStatus"
  - name: "sentDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "document"
    type: "ComplianceDocument"
    multiplicity: "OneToOne"
- name: "KnowledgeResource"
  description: "Informational asset such as guides or videos supporting onboarding\
    \ tasks."
  data:
  - name: "title"
    type: "String"
  - name: "url"
    type: "Url"
  - name: "resourceType"
    type: "ResourceType"
  relations:
  - name: "programs"
    type: "OnboardingProgram"
    multiplicity: "ManyToMany"
  - name: "taskTemplates"
    type: "TaskTemplate"
    multiplicity: "ManyToMany"
  - name: "documentTemplates"
    type: "ComplianceDocumentTemplate"
    multiplicity: "ManyToMany"
- name: "ApplicationSystem"
  description: "Business application for which access must be provisioned during onboarding."
  data:
  - name: "name"
    type: "String"
  - name: "systemOwner"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "accessGrants"
    type: "AccessGrant"
    multiplicity: "OneToMany"
  - name: "accountRequests"
    type: "AccountProvisioningRequest"
    multiplicity: "OneToMany"
  - name: "taskTemplates"
    type: "TaskTemplate"
    multiplicity: "ManyToMany"
- name: "AccountProvisioningRequest"
