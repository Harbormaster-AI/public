  - name: "submittedDate"
    type: "Date"
  - name: "overallRating"
    type: "Integer"
  - name: "comments"
    type: "String"
  relations:
  - name: "survey"
    type: "FeedbackSurvey"
    multiplicity: "ManyToOne"
  - name: "newHire"
    type: "NewHire"
    multiplicity: "ManyToOne"
enums:
- name: "EmploymentType"
  description: "Classification of engagement for a new hire."
  data:
  - name: "FullTime"
  - name: "PartTime"
  - name: "Contractor"
  - name: "Intern"
  - name: "Temporary"
- name: "WorkLocationType"
  description: "Arrangement indicating where work will be performed."
  data:
  - name: "Onsite"
  - name: "Hybrid"
  - name: "Remote"
- name: "ProgramStatus"
  description: "Lifecycle state of an onboarding program."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Archived"
- name: "PlanStatus"
  description: "Lifecycle state of an onboarding plan instance."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "TaskCategory"
  description: "Thematic grouping for onboarding tasks."
  data:
  - name: "HRPaperwork"
  - name: "ITSetup"
  - name: "Compliance"
  - name: "Training"
  - name: "Facilities"
  - name: "ManagerMeetings"
  - name: "Social"
  - name: "Benefits"
  - name: "Orientation"
  - name: "Security"
- name: "TaskStatus_"
  description: "Execution status of an onboarding task."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Blocked"
  - name: "Completed"
  - name: "Cancelled"
  - name: "Deferred"
- name: "TaskPriority"
  description: "Relative urgency of an onboarding task."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "AssigneeType"
