    multiplicity: "ManyToOne"
  - name: "taskTemplates"
    type: "TaskTemplate"
    multiplicity: "ManyToMany"
  - name: "trainingAssignments"
    type: "TrainingAssignment"
    multiplicity: "OneToMany"
- name: "TrainingAssignment"
