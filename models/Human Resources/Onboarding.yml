  - name: "order"
    type: "EquipmentOrder"
    multiplicity: "ManyToOne"
- name: "WorkspaceAssignment"
  description: "Allocation of a physical or remote working setup for a new hire."
  data:
  - name: "workspaceType"
    type: "WorkspaceType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "seat"
    type: "SeatLocation"
