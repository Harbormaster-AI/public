---
metadata:
  name: "Payroll"
  description: "Capabilities model for payroll operations including pay scheduling,\
    \ calculation, taxation, payments, and accounting integration."
  version: "1.0.0"
  industry: "Human Capital Management"
  category: "Human Resources"
  type: "Capability"
  domain: "Payroll"
entities:
- name: "Employer"
  description: "Organization legally responsible for compensating workers and remitting\
    \ payroll taxes."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "taxIdentifier"
    type: "TaxIdentificationNumber"
  - name: "countryOfRegistration"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "payrollContactEmail"
    type: "String"
  relations:
  - name: "workLocations"
    type: "WorkLocation"
    multiplicity: "OneToMany"
  - name: "paySchedules"
    type: "PaySchedule"
    multiplicity: "OneToMany"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
  - name: "taxAuthorities"
    type: "TaxAuthority"
    multiplicity: "ManyToMany"
- name: "WorkLocation"
  description: "Physical or jurisdictional place of work used for tax, labor, and\
    \ payment rules."
  data:
  - name: "name"
    type: "String"
  - name: "address"
    type: "PostalAddress"
  - name: "jurisdiction"
    type: "String"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "assignedEmployees"
    type: "Employee"
    multiplicity: "OneToMany"
- name: "Employee"
  description: "Individual who performs work for the employer and receives compensation."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "birthDate"
    type: "Date"
  - name: "hireDate"
    type: "Date"
  - name: "employmentType"
    type: "EmploymentType"
  - name: "payBasis"
    type: "PayBasis"
  - name: "basePayRate"
    type: "Decimal"
  - name: "baseRateUnit"
    type: "RateUnit"
  - name: "taxFilingStatus"
    type: "TaxFilingStatus"
  - name: "taxIdentifier"
    type: "TaxIdentificationNumber"
  - name: "primaryEmail"
    type: "String"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "workLocation"
    type: "WorkLocation"
    multiplicity: "ManyToOne"
  - name: "paySchedule"
    type: "PaySchedule"
    multiplicity: "ManyToOne"
  - name: "compensationAgreements"
    type: "CompensationAgreement"
    multiplicity: "OneToMany"
  - name: "paymentMethods"
    type: "PayrollPaymentMethod"
    multiplicity: "OneToMany"
  - name: "payStatements"
    type: "PayStatement"
    multiplicity: "OneToMany"
  - name: "timeInputs"
    type: "TimeInput"
    multiplicity: "OneToMany"
  - name: "garnishmentOrders"
    type: "GarnishmentOrder"
    multiplicity: "OneToMany"
  - name: "recurringPayComponents"
    type: "RecurringPayComponent"
    multiplicity: "OneToMany"
- name: "PaySchedule"
  description: "Template defining how often and when employees are paid."
  data:
  - name: "name"
    type: "String"
  - name: "frequency"
    type: "PayFrequency"
  - name: "paymentTiming"
    type: "PaymentTiming"
  - name: "anchorDate"
    type: "Date"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "payPeriods"
    type: "PayPeriod"
    multiplicity: "OneToMany"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
- name: "PayPeriod"
  description: "Specific period of work covered by a payroll payment."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "paymentDate"
    type: "Date"
  - name: "periodNumber"
    type: "Integer"
  - name: "isClosed"
    type: "Boolean"
  relations:
  - name: "paySchedule"
    type: "PaySchedule"
    multiplicity: "ManyToOne"
  - name: "payRuns"
    type: "PayRun"
    multiplicity: "OneToMany"
  - name: "timeInputs"
    type: "TimeInput"
    multiplicity: "OneToMany"
- name: "PayRun"
  description: "Execution of payroll calculation for a group of workers and a period."
  data:
  - name: "runCode"
    type: "String"
  - name: "runDate"
    type: "Date"
  - name: "status"
    type: "PayRunStatus"
  - name: "approvalStatus"
    type: "ApprovalStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "payPeriod"
    type: "PayPeriod"
    multiplicity: "ManyToOne"
  - name: "payStatements"
    type: "PayStatement"
    multiplicity: "OneToMany"
  - name: "payrollJournal"
    type: "PayrollJournal"
    multiplicity: "OneToOne"
- name: "PayStatement"
  description: "Statement of earnings, taxes, deductions, and net pay for a single\
    \ employee in a pay run."
  data:
  - name: "statementNumber"
    type: "String"
  - name: "payDate"
    type: "Date"
  - name: "grossPay"
    type: "Money"
  - name: "totalDeductions"
    type: "Money"
  - name: "taxesWithheld"
    type: "Money"
  - name: "netPay"
    type: "Money"
  relations:
  - name: "payRun"
    type: "PayRun"
    multiplicity: "ManyToOne"
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "earnings"
    type: "EarningLine"
    multiplicity: "OneToMany"
  - name: "deductions"
    type: "DeductionLine"
    multiplicity: "OneToMany"
  - name: "taxWithholdings"
    type: "TaxWithholdingLine"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "PayrollPayment"
    multiplicity: "OneToMany"
  - name: "adjustments"
    type: "PayrollAdjustment"
    multiplicity: "OneToMany"
- name: "EarningLine"
  description: "Calculated earning for a specific pay code, often derived from time\
    \ or piece inputs."
  data:
  - name: "units"
    type: "Decimal"
  - name: "rate"
    type: "Decimal"
  - name: "amount"
    type: "Money"
  - name: "description"
    type: "String"
  relations:
  - name: "payStatement"
    type: "PayStatement"
    multiplicity: "ManyToOne"
  - name: "payCode"
    type: "PayCode"
    multiplicity: "ManyToOne"
  - name: "timeInput"
    type: "TimeInput"
    multiplicity: "ManyToOne"
- name: "DeductionLine"
  description: "Amount withheld from the employee for benefits, garnishments, or other\
    \ deductions."
  data:
  - name: "amount"
    type: "Money"
  - name: "preTax"
    type: "Boolean"
  - name: "description"
    type: "String"
  relations:
  - name: "payStatement"
    type: "PayStatement"
    multiplicity: "ManyToOne"
  - name: "payCode"
    type: "PayCode"
    multiplicity: "ManyToOne"
  - name: "thirdPartyPayee"
    type: "ThirdPartyPayee"
    multiplicity: "ManyToOne"
  - name: "garnishmentOrder"
    type: "GarnishmentOrder"
    multiplicity: "ManyToOne"
- name: "TaxWithholdingLine"
  description: "Employee tax withheld for a specific tax authority."
  data:
  - name: "taxableWages"
    type: "Money"
  - name: "amount"
    type: "Money"
  - name: "supplemental"
    type: "Boolean"
  relations:
  - name: "payStatement"
    type: "PayStatement"
    multiplicity: "ManyToOne"
  - name: "taxAuthority"
    type: "TaxAuthority"
    multiplicity: "ManyToOne"
- name: "PayrollPayment"
  description: "Disbursement of net pay to an employee for a pay statement."
  data:
  - name: "paymentReference"
    type: "String"
  - name: "method"
    type: "PaymentMethodType"
  - name: "amount"
    type: "Money"
  - name: "settlementDate"
    type: "Date"
  - name: "status"
    type: "PaymentStatus"
  relations:
  - name: "payStatement"
    type: "PayStatement"
    multiplicity: "ManyToOne"
  - name: "paymentMethod"
    type: "PayrollPaymentMethod"
    multiplicity: "ManyToOne"
- name: "PayrollPaymentMethod"
  description: "Employee payment instructions and allocation rules for disbursing\
    \ net pay."
  data:
  - name: "methodType"
    type: "PaymentMethodType"
  - name: "priority"
    type: "Integer"
  - name: "allocationType"
    type: "AllocationType"
  - name: "allocationValue"
    type: "Decimal"
  - name: "accountHolderName"
    type: "String"
  - name: "bankAccount"
    type: "BankAccount"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "PayCode"
  description: "Classification for earnings and deductions used for calculation, reporting,\
    \ and accounting."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "componentType"
    type: "PayComponentType"
  - name: "taxable"
    type: "Boolean"
  - name: "subjectToOvertime"
    type: "Boolean"
  relations:
  - name: "earningLines"
    type: "EarningLine"
    multiplicity: "OneToMany"
  - name: "deductionLines"
    type: "DeductionLine"
    multiplicity: "OneToMany"
  - name: "recurringComponents"
    type: "RecurringPayComponent"
    multiplicity: "OneToMany"
  - name: "taxConfigurations"
    type: "TaxConfiguration"
    multiplicity: "ManyToMany"
  - name: "timeInputs"
    type: "TimeInput"
    multiplicity: "OneToMany"
- name: "RecurringPayComponent"
  description: "Ongoing earning or deduction that recurs each pay period per defined\
    \ rules."
  data:
  - name: "name"
    type: "String"
  - name: "componentType"
    type: "PayComponentType"
  - name: "calculationMethod"
    type: "CalculationMethod"
  - name: "amount"
    type: "Decimal"
  - name: "percentage"
    type: "Decimal"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "payCode"
    type: "PayCode"
    multiplicity: "ManyToOne"
- name: "TaxAuthority"
  description: "Government body that levies payroll taxes and collects withholdings."
  data:
  - name: "name"
    type: "String"
  - name: "country"
    type: "String"
  - name: "jurisdictionLevel"
    type: "JurisdictionLevel"
  - name: "withholdingFormCode"
    type: "String"
  relations:
  - name: "employers"
    type: "Employer"
    multiplicity: "ManyToMany"
  - name: "taxConfigurations"
    type: "TaxConfiguration"
    multiplicity: "OneToMany"
  - name: "withholdingLines"
    type: "TaxWithholdingLine"
    multiplicity: "OneToMany"
- name: "TaxConfiguration"
  description: "Employer-specific tax setup and rates for a given authority and time\
    \ range."
  data:
  - name: "configName"
    type: "String"
  - name: "effectiveStartDate"
    type: "Date"
  - name: "effectiveEndDate"
    type: "Date"
  - name: "calculationMethod"
    type: "TaxCalculationMethod"
  - name: "standardRate"
    type: "Decimal"
  - name: "supplementalRate"
    type: "Decimal"
  relations:
  - name: "taxAuthority"
    type: "TaxAuthority"
    multiplicity: "ManyToOne"
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "applicablePayCodes"
    type: "PayCode"
    multiplicity: "ManyToMany"
- name: "GarnishmentOrder"
  description: "Court or agency order requiring withholding from employee wages."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "garnishmentType"
    type: "GarnishmentType"
  - name: "issuingAuthority"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "calculationMethod"
    type: "GarnishmentCalculationMethod"
  - name: "amount"
    type: "Decimal"
  - name: "maxPercentage"
    type: "Decimal"
  - name: "priority"
    type: "Integer"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "deductionLines"
    type: "DeductionLine"
    multiplicity: "OneToMany"
- name: "TimeInput"
  description: "Reported work or piece activity used to calculate earnings."
  data:
  - name: "sourceSystem"
    type: "String"
  - name: "workDate"
    type: "Date"
  - name: "units"
    type: "Decimal"
  - name: "rate"
    type: "Decimal"
  - name: "notes"
    type: "String"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "payPeriod"
    type: "PayPeriod"
    multiplicity: "ManyToOne"
  - name: "payCode"
    type: "PayCode"
    multiplicity: "ManyToOne"
  - name: "generatedEarningLines"
    type: "EarningLine"
    multiplicity: "OneToMany"
- name: "PayrollJournal"
  description: "Accounting summary of payroll results prepared for posting to the\
    \ general ledger."
  data:
  - name: "journalNumber"
    type: "String"
  - name: "status"
    type: "PayrollJournalStatus"
  - name: "postingDate"
    type: "Date"
  - name: "totalDebit"
    type: "Money"
  - name: "totalCredit"
    type: "Money"
  relations:
  - name: "payRun"
    type: "PayRun"
    multiplicity: "OneToOne"
  - name: "lines"
    type: "PayrollJournalLine"
    multiplicity: "OneToMany"
- name: "PayrollJournalLine"
  description: "Detailed debit or credit line mapped to financial accounts and labor\
    \ dimensions."
  data:
  - name: "accountCode"
    type: "String"
  - name: "description"
    type: "String"
  - name: "debit"
    type: "Money"
  - name: "credit"
    type: "Money"
  - name: "costCenter"
    type: "String"
  - name: "department"
    type: "String"
  relations:
  - name: "payrollJournal"
    type: "PayrollJournal"
    multiplicity: "ManyToOne"
  - name: "payStatement"
    type: "PayStatement"
    multiplicity: "ManyToOne"
  - name: "payCode"
    type: "PayCode"
    multiplicity: "ManyToOne"
- name: "ThirdPartyPayee"
  description: "External recipient of payroll-related payments such as agencies, providers,\
    \ or courts."
  data:
  - name: "name"
    type: "String"
  - name: "payeeType"
    type: "ThirdPartyPayeeType"
  - name: "address"
    type: "PostalAddress"
  relations:
  - name: "deductionLines"
    type: "DeductionLine"
    multiplicity: "OneToMany"
  - name: "employers"
    type: "Employer"
    multiplicity: "ManyToMany"
- name: "CompensationAgreement"
  description: "Terms defining an employee’s base compensation and eligibility rules\
    \ over a time range."
  data:
  - name: "effectiveStartDate"
    type: "Date"
  - name: "effectiveEndDate"
    type: "Date"
  - name: "compensationType"
    type: "PayBasis"
  - name: "baseRate"
    type: "Decimal"
  - name: "rateUnit"
    type: "RateUnit"
  - name: "standardHoursPerWeek"
    type: "Decimal"
  - name: "overtimeEligible"
    type: "Boolean"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "PayrollAdjustment"
  description: "Manual correction or retroactive change applied to a pay statement."
  data:
  - name: "reasonCode"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "adjustmentType"
    type: "PayrollAdjustmentType"
  - name: "notes"
    type: "String"
  relations:
  - name: "payStatement"
    type: "PayStatement"
    multiplicity: "ManyToOne"
  - name: "payCode"
    type: "PayCode"
    multiplicity: "ManyToOne"
enums:
- name: "EmploymentType"
  description: "Nature of the employment relationship affecting eligibility, taxes,\
    \ and benefits."
  data:
  - name: "FullTime"
  - name: "PartTime"
  - name: "Temporary"
  - name: "Seasonal"
  - name: "Contractor"
  - name: "Intern"
- name: "PayBasis"
  description: "Primary basis used to determine compensation."
  data:
  - name: "Hourly"
  - name: "Salaried"
  - name: "Piecework"
  - name: "Commission"
- name: "RateUnit"
  description: "Unit associated with a pay rate or earning calculation."
  data:
  - name: "Hour"
  - name: "Day"
  - name: "Week"
  - name: "Month"
  - name: "Year"
  - name: "Piece"
- name: "PayFrequency"
  description: "Frequency with which payroll is processed and employees are paid."
  data:
  - name: "Weekly"
  - name: "Biweekly"
  - name: "Semimonthly"
  - name: "Monthly"
- name: "PaymentTiming"
  description: "Indicates whether payment covers time worked before or after the pay\
    \ date."
  data:
  - name: "InArrears"
  - name: "InAdvance"
- name: "PayRunStatus"
  description: "Lifecycle status of a payroll run."
  data:
  - name: "Draft"
  - name: "Open"
  - name: "Calculating"
  - name: "AwaitingApproval"
  - name: "Approved"
  - name: "Paying"
  - name: "Completed"
  - name: "Voided"
- name: "ApprovalStatus"
  description: "Approval state used for controls prior to payment."
  data:
  - name: "NotSubmitted"
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
- name: "PayComponentType"
  description: "High-level classification for payroll components used in calculation\
    \ and posting."
  data:
  - name: "Earning"
  - name: "Deduction"
  - name: "EmployerTax"
  - name: "EmployerContribution"
- name: "CalculationMethod"
  description: "Method for determining recurring component amounts."
  data:
  - name: "FlatAmount"
  - name: "RateTimesUnits"
  - name: "PercentageOfEarnings"
  - name: "TableLookup"
- name: "PaymentMethodType"
  description: "Mechanism used to disburse net pay."
  data:
  - name: "DirectDeposit"
  - name: "Check"
  - name: "Cash"
  - name: "PayCard"
- name: "PaymentStatus"
  description: "Processing status of a payroll payment."
  data:
  - name: "Pending"
  - name: "Sent"
  - name: "Settled"
  - name: "Failed"
  - name: "Cancelled"
  - name: "Reversed"
- name: "JurisdictionLevel"
  description: "Level of government authority for payroll taxation."
  data:
  - name: "National"
  - name: "State"
  - name: "Provincial"
  - name: "County"
  - name: "City"
  - name: "OtherLocal"
- name: "TaxCalculationMethod"
  description: "Approach used to compute withholding amounts."
  data:
  - name: "Progressive"
  - name: "Flat"
  - name: "TableBased"
  - name: "SupplementalFlat"
- name: "GarnishmentType"
  description: "Category of wage garnishment order."
  data:
  - name: "ChildSupport"
  - name: "TaxLevy"
  - name: "Bankruptcy"
  - name: "Creditor"
  - name: "StudentLoan"
  - name: "WageAssignment"
- name: "GarnishmentCalculationMethod"
  description: "Technique for computing garnishment amounts."
  data:
  - name: "PercentageOfDisposableEarnings"
  - name: "FixedAmount"
  - name: "TieredFormula"
- name: "AllocationType"
  description: "Rule for allocating payment among multiple methods."
  data:
  - name: "FixedAmount"
  - name: "Percentage"
  - name: "Remainder"
- name: "PayrollJournalStatus"
  description: "Posting lifecycle of a payroll accounting journal."
  data:
  - name: "Draft"
  - name: "Posted"
  - name: "Reversed"
- name: "ThirdPartyPayeeType"
  description: "Classification for external recipients of payroll-related payments."
  data:
  - name: "TaxAgency"
  - name: "BenefitProvider"
  - name: "Court"
  - name: "Union"
  - name: "Charity"
- name: "BankAccountType"
  description: "Type of bank account used for payroll disbursements."
  data:
  - name: "Checking"
  - name: "Savings"
  - name: "BusinessChecking"
  - name: "BusinessSavings"
- name: "TaxIdType"
  description: "Type of taxpayer identification used for payroll and reporting."
  data:
  - name: "SSN"
  - name: "SIN"
  - name: "NIN"
  - name: "TIN"
  - name: "EIN"
  - name: "Other"
- name: "TaxFilingStatus"
  description: "Employee federal filing status impacting withholding."
  data:
  - name: "Single"
  - name: "Married"
  - name: "MarriedFilingSeparately"
  - name: "HeadOfHousehold"
  - name: "QualifyingWidowOrWidower"
- name: "PayrollAdjustmentType"
  description: "Category identifying the nature of a payroll adjustment."
  data:
  - name: "EarningIncrease"
  - name: "EarningDecrease"
  - name: "DeductionIncrease"
  - name: "DeductionDecrease"
  - name: "TaxCorrection"
  - name: "RetroPay"
valueObjects:
- name: "Money"
  description: "Monetary value with explicit currency for financial accuracy."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "PostalAddress"
  description: "Structured mailing address for locations and payees."
  data:
  - name: "line1"
    type: "String"
  - name: "line2"
    type: "String"
  - name: "city"
    type: "String"
  - name: "stateProvince"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "BankAccount"
  description: "Bank account details used for direct deposit and other electronic\
    \ payments."
  data:
  - name: "bankName"
    type: "String"
  - name: "accountType"
    type: "BankAccountType"
  - name: "accountNumber"
    type: "String"
  - name: "routingNumber"
    type: "String"
  - name: "iban"
    type: "String"
  - name: "swiftBic"
    type: "String"
- name: "TaxIdentificationNumber"
  description: "Government-issued taxpayer identifier for individuals or organizations."
  data:
  - name: "value"
    type: "String"
  - name: "type"
    type: "TaxIdType"
  - name: "issuingCountry"
    type: "String"
