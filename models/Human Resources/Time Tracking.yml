---
metadata:
  name: "Time Tracking HCIDL Model"
  description: "Comprehensive capabilities model for capturing employee time, attendance,\
    \ scheduling, leave, and approvals across projects and cost centers."
  version: "1.0.0"
  industry: "Human Resources"
  category: "Human Resources"
  type: "Capability"
  domain: "Time Tracking"
entities:
- name: "Organization"
  description: "Legal entity responsible for employing staff and governing time tracking\
    \ policies and periods."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "businessUnits"
    type: "BusinessUnit"
    multiplicity: "OneToMany"
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
  - name: "costCenters"
    type: "CostCenter"
    multiplicity: "OneToMany"
  - name: "timePolicies"
    type: "TimePolicy"
    multiplicity: "OneToMany"
  - name: "timesheetPeriods"
    type: "TimesheetPeriod"
    multiplicity: "OneToMany"
  - name: "holidayCalendars"
    type: "HolidayCalendar"
    multiplicity: "OneToMany"
- name: "BusinessUnit"
  description: "Administrative subdivision used to organize employees, projects, and\
    \ cost control."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "costCenters"
    type: "CostCenter"
    multiplicity: "OneToMany"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
- name: "Location"
  description: "Physical or virtual place where work is performed and attendance may\
    \ be captured."
  data:
  - name: "name"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "country"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "clockDevices"
    type: "ClockDevice"
    multiplicity: "OneToMany"
  - name: "shifts"
    type: "Shift"
    multiplicity: "OneToMany"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
- name: "Employee"
  description: "Individual whose time, attendance, and leave are tracked."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "employmentType"
    type: "EmploymentType"
  - name: "hireDate"
    type: "Date"
  - name: "email"
    type: "String"
  - name: "standardHoursPerWeek"
    type: "Integer"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "manager"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "workSchedule"
    type: "WorkSchedule"
    multiplicity: "ManyToOne"
  - name: "timePolicy"
    type: "TimePolicy"
    multiplicity: "ManyToOne"
  - name: "costCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
  - name: "assignments"
    type: "Assignment"
    multiplicity: "OneToMany"
  - name: "timesheets"
    type: "Timesheet"
    multiplicity: "OneToMany"
  - name: "attendanceRecords"
    type: "AttendanceRecord"
    multiplicity: "OneToMany"
  - name: "leaveBalances"
    type: "LeaveBalance"
    multiplicity: "OneToMany"
  - name: "holidayCalendar"
    type: "HolidayCalendar"
    multiplicity: "ManyToOne"
- name: "CostCenter"
  description: "Financial tracking unit used to attribute labor costs."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
  - name: "timeEntries"
    type: "TimeEntry"
    multiplicity: "OneToMany"
- name: "Project"
  description: "Time-collecting initiative used for planning, costing, and billing."
  data:
  - name: "name"
    type: "String"
  - name: "projectCode"
    type: "String"
  - name: "billable"
    type: "Boolean"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "costCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "Task"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "Assignment"
    multiplicity: "OneToMany"
  - name: "rateCards"
    type: "RateCard"
    multiplicity: "OneToMany"
  - name: "timeEntries"
    type: "TimeEntry"
    multiplicity: "OneToMany"
- name: "Task"
  description: "Work breakdown element within a project to which time can be recorded."
  data:
  - name: "name"
    type: "String"
  - name: "taskCode"
    type: "String"
  - name: "activityType"
    type: "ActivityType"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "timeEntries"
    type: "TimeEntry"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "Assignment"
    multiplicity: "OneToMany"
- name: "Assignment"
  description: "Engagement of an employee to a project and optionally a task with\
    \ a specified allocation."
  data:
  - name: "role"
    type: "String"
  - name: "allocationPercent"
    type: "Integer"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "rateCard"
    type: "RateCard"
    multiplicity: "ManyToOne"
- name: "RateCard"
  description: "Set of labor rates applicable to a project and time period."
  data:
  - name: "name"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "currency"
    type: "String"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "rates"
    type: "Rate"
    multiplicity: "OneToMany"
- name: "Rate"
  description: "Activity-specific rate definition including billing and payroll characteristics."
  data:
  - name: "payRate"
    type: "HourlyRate"
  - name: "activityType"
    type: "ActivityType"
  - name: "billable"
    type: "Boolean"
  relations:
  - name: "rateCard"
    type: "RateCard"
    multiplicity: "ManyToOne"
  - name: "payCode"
    type: "PayCode"
    multiplicity: "ManyToOne"
- name: "PayCode"
  description: "Pay classification used to map time to payroll and reporting categories."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "payCodeType"
    type: "PayCodeType"
  - name: "taxable"
    type: "Boolean"
  relations:
  - name: "rates"
    type: "Rate"
    multiplicity: "OneToMany"
  - name: "timeEntries"
    type: "TimeEntry"
    multiplicity: "OneToMany"
- name: "TimePolicy"
  description: "Collection of rules governing overtime, rounding, and breaks."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "overtimeMethod"
    type: "OvertimeMethod"
  - name: "roundingRule"
    type: "RoundingRule"
  - name: "gracePeriodMinutes"
    type: "Integer"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "overtimeRules"
    type: "OvertimeRule"
    multiplicity: "OneToMany"
  - name: "breakRules"
    type: "BreakRule"
    multiplicity: "OneToMany"
  - name: "holidayCalendars"
    type: "HolidayCalendar"
    multiplicity: "ManyToMany"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
- name: "OvertimeRule"
  description: "Threshold and multiplier specification for calculating overtime."
  data:
  - name: "name"
    type: "String"
  - name: "period"
    type: "OvertimePeriod"
  - name: "thresholdMinutes"
    type: "Integer"
  - name: "multiplier"
    type: "Decimal"
  - name: "includePaidBreaks"
    type: "Boolean"
  relations:
  - name: "timePolicy"
    type: "TimePolicy"
    multiplicity: "ManyToOne"
  - name: "payCode"
    type: "PayCode"
    multiplicity: "ManyToOne"
- name: "BreakRule"
  description: "Policy definition for paid or unpaid breaks and auto-deductions."
  data:
  - name: "name"
    type: "String"
  - name: "breakType"
    type: "BreakType"
  - name: "minimumMinutes"
    type: "Integer"
  - name: "paid"
    type: "Boolean"
  - name: "autoDeduct"
    type: "Boolean"
  - name: "thresholdWorkMinutes"
    type: "Integer"
  relations:
  - name: "timePolicy"
    type: "TimePolicy"
    multiplicity: "ManyToOne"
- name: "HolidayCalendar"
  description: "Regional schedule of observed holidays for paid and unpaid time considerations."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "holidays"
    type: "Holiday"
    multiplicity: "OneToMany"
  - name: "timePolicies"
    type: "TimePolicy"
    multiplicity: "ManyToMany"
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
- name: "Holiday"
  description: "Specific observed date within a holiday calendar."
  data:
  - name: "date"
    type: "Date"
  - name: "name"
    type: "String"
  - name: "paid"
    type: "Boolean"
  relations:
  - name: "holidayCalendar"
    type: "HolidayCalendar"
    multiplicity: "ManyToOne"
- name: "WorkSchedule"
  description: "Standard working pattern for one or more employees."
  data:
  - name: "name"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "weekStart"
    type: "DayOfWeek"
  - name: "maxDailyMinutes"
    type: "Integer"
  relations:
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
  - name: "shiftTemplates"
    type: "ShiftTemplate"
    multiplicity: "OneToMany"
- name: "ShiftTemplate"
  description: "Reusable daily shift definition including planned start, end, and\
    \ break expectations."
  data:
  - name: "name"
    type: "String"
  - name: "shiftType"
    type: "ShiftType"
  - name: "startTime"
    type: "TimeOfDay"
  - name: "endTime"
    type: "TimeOfDay"
  - name: "expectedDailyMinutes"
    type: "Integer"
  - name: "defaultBreakMinutes"
    type: "Integer"
  relations:
  - name: "workSchedule"
    type: "WorkSchedule"
    multiplicity: "ManyToOne"
- name: "Shift"
  description: "Assigned work period for an employee on a specific date."
  data:
  - name: "date"
    type: "Date"
  - name: "scheduledStart"
    type: "TimeOfDay"
  - name: "scheduledEnd"
    type: "TimeOfDay"
  - name: "shiftType"
    type: "ShiftType"
  - name: "status"
    type: "ShiftStatus"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "attendanceRecord"
    type: "AttendanceRecord"
    multiplicity: "ManyToOne"
- name: "ClockDevice"
  description: "Hardware or software endpoint used to capture punches."
  data:
  - name: "name"
    type: "String"
  - name: "deviceIdentifier"
    type: "String"
  - name: "deviceType"
    type: "ClockDeviceType"
  - name: "status"
    type: "DeviceStatus"
  relations:
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "punches"
    type: "Punch"
    multiplicity: "OneToMany"
- name: "AttendanceRecord"
  description: "Daily aggregation of punches, presence, and calculated totals."
  data:
  - name: "date"
    type: "Date"
  - name: "status"
    type: "AttendanceStatus"
  - name: "totalWorkedMinutes"
    type: "Integer"
  - name: "totalOvertimeMinutes"
    type: "Integer"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "punches"
    type: "Punch"
    multiplicity: "OneToMany"
  - name: "shifts"
    type: "Shift"
    multiplicity: "OneToMany"
- name: "Punch"
  description: "Timestamped in, out, and break events associated with attendance."
  data:
  - name: "timestamp"
    type: "DateTime"
  - name: "direction"
    type: "PunchDirection"
  - name: "source"
    type: "PunchSource"
  - name: "latitude"
    type: "Decimal"
  - name: "longitude"
    type: "Decimal"
  - name: "notes"
    type: "String"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "clockDevice"
    type: "ClockDevice"
    multiplicity: "ManyToOne"
  - name: "attendanceRecord"
    type: "AttendanceRecord"
    multiplicity: "ManyToOne"
- name: "TimesheetPeriod"
  description: "Defined time window for timesheet collection and processing."
  data:
  - name: "name"
    type: "String"
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "frequency"
    type: "TimesheetFrequency"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "timesheets"
    type: "Timesheet"
    multiplicity: "OneToMany"
- name: "Timesheet"
  description: "Container for an employee’s time entries within a period."
  data:
  - name: "status"
    type: "TimesheetStatus"
  - name: "submissionDate"
    type: "Date"
  - name: "approvedDate"
    type: "Date"
  - name: "totalHours"
    type: "Decimal"
  - name: "notes"
    type: "String"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "TimesheetPeriod"
    multiplicity: "ManyToOne"
  - name: "entries"
    type: "TimeEntry"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "TimeEntry"
  description: "Recorded unit of work or leave for a specific date and duration."
  data:
  - name: "workDate"
    type: "Date"
  - name: "startTime"
    type: "TimeOfDay"
  - name: "endTime"
    type: "TimeOfDay"
  - name: "durationMinutes"
    type: "Integer"
  - name: "entryType"
    type: "TimeEntryType"
  - name: "isBillable"
    type: "Boolean"
  - name: "notes"
    type: "String"
  relations:
  - name: "timesheet"
    type: "Timesheet"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "costCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
  - name: "payCode"
    type: "PayCode"
    multiplicity: "ManyToOne"
- name: "Approval"
  description: "Decision record for a timesheet or leave request including comments."
  data:
  - name: "decision"
    type: "ApprovalStatus"
  - name: "decisionDate"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "timesheet"
    type: "Timesheet"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Approver"
    multiplicity: "ManyToOne"
- name: "Approver"
  description: "Person authorized to review and decide on timesheets and leave."
  data:
  - name: "name"
    type: "String"
  - name: "role"
    type: "ApprovalRole"
  - name: "email"
    type: "String"
  relations:
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "LeaveRequest"
  description: "Employee-initiated request for time away from work."
  data:
  - name: "requestDate"
    type: "Date"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "leaveType"
    type: "LeaveType"
  - name: "status"
    type: "LeaveRequestStatus"
  - name: "totalMinutes"
    type: "Integer"
  - name: "comments"
    type: "String"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "LeaveBalance"
  description: "Accrued and available leave for an employee by leave type."
  data:
  - name: "leaveType"
    type: "LeaveType"
  - name: "balanceMinutes"
    type: "Integer"
  - name: "accrualRateMinutesPerPeriod"
    type: "Integer"
  - name: "lastUpdated"
    type: "Date"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
enums:
- name: "EmploymentType"
  description: "Engagement classification of an employee impacting scheduling and\
    \ pay."
  data:
  - name: "FullTime"
  - name: "PartTime"
  - name: "Contractor"
  - name: "Intern"
- name: "TimesheetStatus"
  description: "Lifecycle states of a timesheet."
  data:
  - name: "Open"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Locked"
- name: "TimeEntryType"
  description: "Categories of time recorded on a timesheet."
  data:
  - name: "Regular"
  - name: "Overtime"
  - name: "Leave"
  - name: "Training"
  - name: "Travel"
- name: "ApprovalStatus"
  description: "Possible outcomes of an approval decision."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
  - name: "Recalled"
- name: "ApprovalRole"
  description: "Roles authorized to approve timesheets or leave."
  data:
  - name: "Manager"
  - name: "ProjectManager"
  - name: "Payroll"
  - name: "HR"
- name: "OvertimeMethod"
  description: "Strategy used to determine when overtime applies."
  data:
  - name: "DailyThreshold"
  - name: "WeeklyThreshold"
  - name: "ConsecutiveDays"
  - name: "HolidayWorked"
- name: "OvertimePeriod"
  description: "Timeframe over which overtime thresholds are evaluated."
  data:
  - name: "Daily"
  - name: "Weekly"
  - name: "BiWeekly"
- name: "RoundingRule"
  description: "Method used to round punch or entry times."
  data:
  - name: "None"
  - name: "Nearest5"
  - name: "Nearest10"
  - name: "UpTo15"
  - name: "DownTo15"
- name: "BreakType"
  description: "Classification of breaks for policy and pay treatment."
  data:
  - name: "Rest"
  - name: "Meal"
  - name: "Personal"
- name: "ShiftType"
  description: "Type of shift that may affect premiums and policies."
  data:
  - name: "Regular"
  - name: "Night"
  - name: "Split"
  - name: "OnCall"
- name: "ShiftStatus"
  description: "Operational status of an assigned shift."
  data:
  - name: "Scheduled"
  - name: "InProgress"
  - name: "Completed"
  - name: "Missed"
  - name: "Cancelled"
- name: "PunchDirection"
  description: "Direction or phase represented by a punch."
  data:
  - name: "In"
  - name: "Out"
  - name: "BreakStart"
  - name: "BreakEnd"
- name: "PunchSource"
  description: "Originating channel of a punch event."
  data:
  - name: "Device"
  - name: "Web"
  - name: "Mobile"
  - name: "API"
- name: "DeviceStatus"
  description: "Connectivity and operational readiness of a clock device."
  data:
  - name: "Online"
  - name: "Offline"
  - name: "Maintenance"
- name: "AttendanceStatus"
  description: "Presence summary for a given day."
  data:
  - name: "Present"
  - name: "Absent"
  - name: "Late"
  - name: "Excused"
- name: "PayCodeType"
  description: "Payroll mapping category used for calculating compensation."
  data:
  - name: "Regular"
  - name: "Overtime"
  - name: "DoubleTime"
  - name: "Holiday"
  - name: "LeavePaid"
  - name: "LeaveUnpaid"
- name: "DayOfWeek"
  description: "Days used to define schedule and policy anchors."
  data:
  - name: "Monday"
  - name: "Tuesday"
  - name: "Wednesday"
  - name: "Thursday"
  - name: "Friday"
  - name: "Saturday"
  - name: "Sunday"
- name: "LeaveType"
  description: "Reasons for approved time away from work."
  data:
  - name: "Vacation"
  - name: "Sick"
  - name: "Personal"
  - name: "Bereavement"
  - name: "JuryDuty"
  - name: "Parental"
- name: "LeaveRequestStatus"
  description: "Processing state of a leave request."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Cancelled"
- name: "TimesheetFrequency"
  description: "Cadence for collecting and approving timesheets."
  data:
  - name: "Weekly"
  - name: "BiWeekly"
  - name: "SemiMonthly"
  - name: "Monthly"
- name: "ClockDeviceType"
  description: "Mechanism by which employees register punches."
  data:
  - name: "Biometric"
  - name: "BadgeReader"
  - name: "Kiosk"
  - name: "MobileApp"
- name: "ActivityType"
  description: "Nature of work activity that may influence rates and approvals."
  data:
  - name: "Work"
  - name: "Training"
  - name: "Travel"
  - name: "Meeting"
  - name: "Support"
valueObjects:
- name: "Address"
  description: "Postal address for a location or correspondence."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "TimeOfDay"
  description: "Clock time within a day independent of date or timezone offset."
  data:
  - name: "hour"
    type: "Integer"
  - name: "minute"
    type: "Integer"
  - name: "second"
    type: "Integer"
- name: "HourlyRate"
  description: "Monetary value representing compensation or billing per hour."
