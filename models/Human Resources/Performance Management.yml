---
metadata:
  name: "HCIDL Capabilities Model - Performance Management"
  description: "Canonical capabilities model for Human Resources performance management,\
    \ covering goals, reviews, competencies, feedback, calibration, and development\
    \ planning."
  version: "1.0.0"
  industry: "Human Resources"
  category: "Human Resources"
  type: "Capability"
  domain: "Performance Management"
entities:
- name: "OrganizationUnit"
  description: "Structural unit such as division, department, team, or region."
  data:
  - name: "name"
    type: "String"
  - name: "unitType"
    type: "OrganizationUnitType"
  relations:
  - name: "parent"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
  - name: "goals"
    type: "Goal"
    multiplicity: "OneToMany"
- name: "Employee"
  description: "Individual worker who is evaluated and developed through performance\
    \ management processes."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "workEmail"
    type: "String"
  - name: "hireDate"
    type: "Date"
  - name: "employmentStatus"
    type: "EmploymentStatus"
  relations:
  - name: "manager"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "jobRole"
    type: "JobRole"
    multiplicity: "ManyToOne"
  - name: "goals"
    type: "Goal"
    multiplicity: "OneToMany"
  - name: "performanceReviews"
    type: "PerformanceReview"
    multiplicity: "OneToMany"
  - name: "feedbackRequests"
    type: "FeedbackRequest"
    multiplicity: "OneToMany"
  - name: "feedbackResponses"
    type: "FeedbackResponse"
    multiplicity: "OneToMany"
  - name: "checkIns"
    type: "CheckIn"
    multiplicity: "OneToMany"
  - name: "developmentPlans"
    type: "DevelopmentPlan"
    multiplicity: "OneToMany"
  - name: "recognitionsReceived"
    type: "Recognition"
    multiplicity: "OneToMany"
  - name: "recognitionsGiven"
    type: "Recognition"
    multiplicity: "OneToMany"
  - name: "talentPools"
    type: "TalentPool"
    multiplicity: "ManyToMany"
  - name: "calibrationDecisions"
    type: "CalibrationDecision"
    multiplicity: "OneToMany"
- name: "JobRole"
  description: "Defined position with responsibilities, expectations, and related\
    \ competencies."
  data:
  - name: "title"
    type: "String"
  - name: "jobFamily"
    type: "String"
  - name: "grade"
    type: "String"
  relations:
  - name: "competencies"
    type: "Competency"
    multiplicity: "ManyToMany"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
- name: "Competency"
  description: "Measurable ability, behavior, or knowledge area relevant to job performance."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "category"
    type: "CompetencyCategory"
  relations:
  - name: "jobRoles"
    type: "JobRole"
    multiplicity: "ManyToMany"
- name: "RatingScale"
  description: "Configurable quantitative or descriptive scale used to evaluate goals\
    \ and competencies."
  data:
  - name: "name"
    type: "String"
  - name: "scaleType"
    type: "RatingMethod"
  - name: "minValue"
    type: "Decimal"
  - name: "maxValue"
    type: "Decimal"
  - name: "step"
    type: "Decimal"
  relations:
  - name: "levels"
    type: "RatingLevel"
    multiplicity: "OneToMany"
  - name: "reviewTemplates"
    type: "ReviewTemplate"
    multiplicity: "OneToMany"
  - name: "goalRatings"
    type: "GoalRating"
    multiplicity: "OneToMany"
  - name: "competencyAssessments"
    type: "CompetencyAssessment"
    multiplicity: "OneToMany"
- name: "RatingLevel"
  description: "Labeled point on a rating scale used for consistent interpretation."
  data:
  - name: "value"
    type: "Decimal"
  - name: "label"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "ratingScale"
    type: "RatingScale"
    multiplicity: "ManyToOne"
- name: "ReviewCycle"
  description: "Time-bounded period during which performance assessments are conducted."
  data:
  - name: "name"
    type: "String"
  - name: "period"
    type: "Period"
  - name: "cycleType"
    type: "TimePeriodType"
  - name: "status"
    type: "ReviewCycleStatus"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "reviews"
    type: "PerformanceReview"
    multiplicity: "OneToMany"
  - name: "feedbackRequests"
    type: "FeedbackRequest"
    multiplicity: "OneToMany"
  - name: "calibrationSessions"
    type: "CalibrationSession"
    multiplicity: "OneToMany"
- name: "ReviewTemplate"
  description: "Structured configuration that defines sections, scales, and weighting\
    \ for reviews."
  data:
  - name: "name"
    type: "String"
  - name: "templateType"
    type: "ReviewTemplateType"
  - name: "weightingMethod"
    type: "WeightingMethod"
  relations:
  - name: "sections"
    type: "ReviewSectionTemplate"
    multiplicity: "OneToMany"
  - name: "ratingScale"
    type: "RatingScale"
    multiplicity: "ManyToOne"
  - name: "reviews"
    type: "PerformanceReview"
    multiplicity: "OneToMany"
- name: "ReviewSectionTemplate"
  description: "Configurable part of a review template with purpose and relative weight."
  data:
  - name: "title"
    type: "String"
  - name: "sectionType"
    type: "ReviewSectionType"
  - name: "weight"
    type: "Decimal"
  relations:
  - name: "template"
    type: "ReviewTemplate"
    multiplicity: "ManyToOne"
  - name: "competencies"
    type: "Competency"
    multiplicity: "ManyToMany"
- name: "PerformanceReview"
  description: "Formal evaluation of an employee's performance within a review cycle."
  data:
  - name: "status"
    type: "PerformanceReviewStatus"
  - name: "overallRating"
    type: "Decimal"
  - name: "submitDate"
    type: "Date"
  - name: "summaryDocument"
    type: "Attachment"
  - name: "employeeAcknowledgement"
    type: "Signature"
  - name: "managerAcknowledgement"
    type: "Signature"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "manager"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "cycle"
    type: "ReviewCycle"
    multiplicity: "ManyToOne"
  - name: "template"
    type: "ReviewTemplate"
    multiplicity: "ManyToOne"
  - name: "goalRatings"
    type: "GoalRating"
    multiplicity: "OneToMany"
  - name: "competencyAssessments"
    type: "CompetencyAssessment"
    multiplicity: "OneToMany"
  - name: "feedbackResponses"
    type: "FeedbackResponse"
    multiplicity: "OneToMany"
  - name: "calibrationDecisions"
    type: "CalibrationDecision"
    multiplicity: "OneToMany"
- name: "Goal"
  description: "Specific outcome or objective with measurable results and time bounds."
  data:
  - name: "title"
    type: "String"
  - name: "goalType"
    type: "GoalType"
  - name: "description"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "GoalStatus"
  - name: "weight"
    type: "Decimal"
  - name: "alignmentType"
    type: "AlignmentType"
  relations:
  - name: "owner"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "parentGoal"
    type: "Goal"
    multiplicity: "ManyToOne"
  - name: "keyResults"
    type: "KeyResult"
    multiplicity: "OneToMany"
  - name: "ratings"
    type: "GoalRating"
    multiplicity: "OneToMany"
  - name: "checkIns"
    type: "CheckIn"
    multiplicity: "ManyToMany"
- name: "KeyResult"
  description: "Quantifiable indicator used to evaluate progress toward a goal."
  data:
  - name: "name"
    type: "String"
  - name: "target"
    type: "Decimal"
  - name: "unit"
    type: "String"
  - name: "current"
    type: "Decimal"
  relations:
  - name: "goal"
    type: "Goal"
    multiplicity: "ManyToOne"
- name: "GoalRating"
  description: "Assessment of a goal within the context of a performance review."
  data:
  - name: "rating"
    type: "Decimal"
  - name: "comments"
    type: "String"
  relations:
  - name: "goal"
    type: "Goal"
    multiplicity: "ManyToOne"
  - name: "review"
    type: "PerformanceReview"
    multiplicity: "ManyToOne"
  - name: "ratingScale"
    type: "RatingScale"
    multiplicity: "ManyToOne"
- name: "CompetencyAssessment"
  description: "Evaluation of a competency within a performance review."
  data:
  - name: "comments"
    type: "String"
  - name: "rating"
    type: "Decimal"
  relations:
  - name: "competency"
    type: "Competency"
    multiplicity: "ManyToOne"
  - name: "review"
    type: "PerformanceReview"
    multiplicity: "ManyToOne"
  - name: "ratingScale"
    type: "RatingScale"
    multiplicity: "ManyToOne"
- name: "FeedbackRequest"
  description: "Structured request for input about an employee’s performance."
  data:
  - name: "requestedDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "FeedbackRequestStatus"
  - name: "feedbackType"
    type: "FeedbackType"
  - name: "visibility"
    type: "FeedbackVisibility"
  relations:
  - name: "subject"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "requester"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "cycle"
    type: "ReviewCycle"
    multiplicity: "ManyToOne"
  - name: "responses"
    type: "FeedbackResponse"
    multiplicity: "OneToMany"
- name: "FeedbackResponse"
  description: "Feedback content supplied by a respondent to a feedback request."
  data:
  - name: "submittedDate"
    type: "Date"
  - name: "comment"
    type: "Comment"
  - name: "rating"
    type: "Decimal"
  relations:
  - name: "request"
    type: "FeedbackRequest"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "relatedReview"
    type: "PerformanceReview"
    multiplicity: "ManyToOne"
- name: "CheckIn"
  description: "Recurring or ad-hoc conversation between employee and manager focusing\
    \ on progress and blockers."
  data:
  - name: "meetingDate"
    type: "Date"
  - name: "frequency"
    type: "CheckInFrequency"
  - name: "notes"
    type: "String"
  - name: "mood"
    type: "MoodLevel"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "manager"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "goals"
    type: "Goal"
    multiplicity: "ManyToMany"
- name: "DevelopmentPlan"
  description: "Documented plan that organizes actions to build capabilities and achieve\
    \ growth objectives."
  data:
  - name: "name"
    type: "String"
  - name: "createdDate"
    type: "Date"
  - name: "status"
    type: "PlanStatus"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "actions"
    type: "DevelopmentAction"
    multiplicity: "OneToMany"
  - name: "relatedReview"
    type: "PerformanceReview"
    multiplicity: "ManyToOne"
  - name: "goals"
    type: "Goal"
    multiplicity: "ManyToMany"
- name: "DevelopmentAction"
  description: "Actionable task assigned within a development plan."
  data:
  - name: "title"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "ActionStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "developmentPlan"
    type: "DevelopmentPlan"
    multiplicity: "ManyToOne"
  - name: "competency"
    type: "Competency"
    multiplicity: "ManyToOne"
  - name: "learningActivity"
    type: "LearningActivity"
    multiplicity: "ManyToOne"
- name: "LearningActivity"
  description: "Learning resource or experience aligned to skill development objectives."
  data:
  - name: "title"
    type: "String"
  - name: "provider"
    type: "String"
  - name: "format"
    type: "LearningFormat"
  relations:
  - name: "developmentActions"
    type: "DevelopmentAction"
    multiplicity: "OneToMany"
- name: "PerformanceImprovementPlan"
  description: "Formal plan to address significant gaps in performance with clear\
    \ expectations and timelines."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "PIPStatus"
  - name: "summary"
    type: "String"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "actions"
    type: "PIPAction"
    multiplicity: "OneToMany"
  - name: "relatedReview"
    type: "PerformanceReview"
    multiplicity: "ManyToOne"
- name: "PIPAction"
  description: "Specific requirement or milestone within a performance improvement\
    \ plan."
  data:
  - name: "description"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "ActionStatus"
  relations:
  - name: "pip"
    type: "PerformanceImprovementPlan"
    multiplicity: "ManyToOne"
- name: "CalibrationSession"
  description: "Facilitated meeting to normalize performance ratings and ensure fairness\
    \ across teams."
  data:
  - name: "name"
    type: "String"
  - name: "sessionDate"
    type: "Date"
  - name: "status"
    type: "CalibrationStatus"
  relations:
  - name: "cycle"
    type: "ReviewCycle"
    multiplicity: "ManyToOne"
  - name: "facilitators"
    type: "Employee"
    multiplicity: "ManyToMany"
  - name: "participants"
    type: "Employee"
    multiplicity: "ManyToMany"
  - name: "decisions"
    type: "CalibrationDecision"
    multiplicity: "OneToMany"
- name: "CalibrationDecision"
  description: "Outcome of a calibration discussion for a specific employee."
  data:
  - name: "decisionType"
    type: "CalibrationDecisionType"
  - name: "finalRating"
    type: "Decimal"
  - name: "notes"
    type: "String"
  relations:
  - name: "session"
    type: "CalibrationSession"
    multiplicity: "ManyToOne"
  - name: "review"
    type: "PerformanceReview"
    multiplicity: "ManyToOne"
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "talentPool"
    type: "TalentPool"
    multiplicity: "ManyToOne"
- name: "TalentPool"
  description: "Designated group of employees for targeted development or succession\
    \ planning."
  data:
  - name: "name"
    type: "String"
  - name: "poolType"
    type: "TalentPoolType"
  - name: "description"
    type: "String"
  relations:
  - name: "members"
    type: "Employee"
    multiplicity: "ManyToMany"
  - name: "sourceSession"
    type: "CalibrationSession"
    multiplicity: "ManyToOne"
- name: "Recognition"
  description: "Positive acknowledgment of contributions or behaviors aligned to organizational\
    \ values."
  data:
  - name: "title"
    type: "String"
  - name: "recognitionDate"
    type: "Date"
  - name: "recognitionType"
    type: "RecognitionType"
  - name: "message"
    type: "String"
  relations:
  - name: "recipient"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "giver"
    type: "Employee"
    multiplicity: "ManyToOne"
enums:
- name: "OrganizationUnitType"
  description: "Classification of organizational units by structural role."
  data:
  - name: "Division"
  - name: "Department"
  - name: "Team"
  - name: "Project"
  - name: "Region"
- name: "EmploymentStatus"
  description: "Current work engagement state of an employee."
  data:
  - name: "Active"
  - name: "Leave"
  - name: "Terminated"
  - name: "Retired"
  - name: "Contractor"
- name: "TimePeriodType"
  description: "Standardized time window definitions for review cycles."
  data:
  - name: "Annual"
  - name: "SemiAnnual"
  - name: "Quarterly"
  - name: "Monthly"
  - name: "Continuous"
- name: "ReviewCycleStatus"
  description: "Lifecycle state of a review cycle."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "Closed"
  - name: "Archived"
- name: "ReviewTemplateType"
  description: "Purpose-oriented classification of review templates."
  data:
  - name: "Standard"
  - name: "MidYear"
  - name: "YearEnd"
  - name: "Probationary"
  - name: "Project"
- name: "WeightingMethod"
  description: "Approach for calculating section or item contributions to overall\
    \ results."
  data:
  - name: "Equal"
  - name: "Proportional"
  - name: "Custom"
- name: "RatingMethod"
  description: "Methodology used to express evaluation outcomes."
  data:
  - name: "Numeric"
  - name: "Descriptive"
  - name: "Mixed"
- name: "ReviewSectionType"
  description: "Functional category for a section of a review template."
  data:
  - name: "Goals"
  - name: "Competencies"
  - name: "Summary"
  - name: "PeerFeedback"
  - name: "ManagerAssessment"
- name: "PerformanceReviewStatus"
  description: "Workflow state of a performance review."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Submitted"
  - name: "ManagerApproved"
  - name: "Calibrated"
  - name: "Finalized"
  - name: "Reopened"
  - name: "Cancelled"
- name: "GoalType"
  description: "Scope and intent of a goal."
  data:
  - name: "Individual"
  - name: "Team"
  - name: "Company"
  - name: "Development"
- name: "AlignmentType"
  description: "Structural relationship of a goal to other goals."
  data:
  - name: "Cascaded"
  - name: "Shared"
  - name: "Contributing"
  - name: "Informational"
- name: "GoalStatus"
  description: "Progress and tracking state of a goal."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "FeedbackRequestStatus"
  description: "Workflow state of a feedback request."
  data:
  - name: "Requested"
  - name: "InProgress"
  - name: "Submitted"
  - name: "Declined"
  - name: "Expired"
- name: "FeedbackType"
  description: "Channel or perspective for requested feedback."
  data:
  - name: "Peer"
  - name: "Upward"
  - name: 360
  - name: "External"
- name: "FeedbackVisibility"
  description: "Access scope for viewing provided feedback."
  data:
  - name: "Public"
  - name: "PrivateToManager"
  - name: "ConfidentialHR"
- name: "CheckInFrequency"
  description: "Recurrence pattern for employee-manager conversations."
  data:
  - name: "Weekly"
  - name: "BiWeekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "AdHoc"
- name: "MoodLevel"
  description: "Self-reported energy or engagement level captured during check-ins."
  data:
  - name: "VeryLow"
  - name: "Low"
  - name: "Neutral"
  - name: "High"
  - name: "VeryHigh"
- name: "PlanStatus"
  description: "Lifecycle state of a development plan."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Completed"
  - name: "OnHold"
  - name: "Cancelled"
- name: "ActionStatus"
  description: "Execution state of an action item."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
  - name: "Blocked"
  - name: "Cancelled"
- name: "LearningFormat"
  description: "Delivery format for a learning activity."
  data:
  - name: "Course"
  - name: "Article"
  - name: "Video"
  - name: "Workshop"
  - name: "Mentoring"
  - name: "Project"
- name: "PIPStatus"
  description: "Lifecycle state of a performance improvement plan."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Extended"
  - name: "Completed"
  - name: "Terminated"
- name: "CalibrationStatus"
  description: "Workflow state of a calibration session."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
  - name: "Archived"
- name: "CalibrationDecisionType"
  description: "Type of outcome reached during calibration."
  data:
  - name: "RatingAdjustment"
  - name: "PromotionReadiness"
  - name: "CompensationImpact"
  - name: "TalentPoolAssignment"
- name: "TalentPoolType"
  description: "Classification of a talent pool for targeted development."
  data:
  - name: "HighPotential"
  - name: "Successor"
  - name: "CriticalSkill"
  - name: "Leadership"
- name: "RecognitionType"
  description: "Category of recognition aligned to organizational culture."
  data:
  - name: "Values"
  - name: "Milestone"
  - name: "Performance"
  - name: "Innovation"
  - name: "CustomerPraise"
- name: "CompetencyCategory"
  description: "Organizational grouping for competencies."
  data:
  - name: "Technical"
  - name: "Leadership"
  - name: "Behavioral"
  - name: "Functional"
  - name: "Compliance"
valueObjects:
- name: "Period"
  description: "Start and end dates defining a bounded interval for planning or evaluation."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "Attachment"
  description: "Reference to a stored document or file relevant to performance records."
  data:
  - name: "fileName"
    type: "String"
  - name: "url"
    type: "String"
  - name: "uploadedDate"
    type: "Date"
- name: "Comment"
  description: "Authored text with timestamp and display name."
  data:
  - name: "authorName"
    type: "String"
  - name: "commentDate"
    type: "Date"
  - name: "text"
    type: "String"
- name: "Signature"
  description: "Electronic acknowledgment indicating review or acceptance."
  data:
  - name: "signerName"
    type: "String"
  - name: "signedDate"
    type: "Date"
