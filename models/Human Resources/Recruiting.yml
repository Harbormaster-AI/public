  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "title"
    type: "String"
  relations:
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "requisitions"
    type: "JobRequisition"
    multiplicity: "OneToMany"
