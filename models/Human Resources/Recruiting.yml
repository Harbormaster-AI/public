  - name: "applicationNumber"
    type: "String"
  - name: "source"
    type: "CandidateSourceType"
  - name: "status"
    type: "ApplicationStatus"
  - name: "appliedDate"
    type: "Date"
  relations:
  - name: "candidate"
    type: "Candidate"
    multiplicity: "ManyToOne"
  - name: "requisition"
    type: "JobRequisition"
    multiplicity: "ManyToOne"
  - name: "stages"
    type: "ApplicationStage"
    multiplicity: "OneToMany"
  - name: "interviews"
    type: "Interview"
    multiplicity: "OneToMany"
  - name: "assessments"
    type: "Assessment"
    multiplicity: "OneToMany"
  - name: "offer"
    type: "Offer"
    multiplicity: "OneToOne"
  - name: "backgroundCheck"
    type: "BackgroundCheck"
    multiplicity: "OneToOne"
  - name: "referenceChecks"
    type: "ReferenceCheck"
    multiplicity: "OneToMany"
  - name: "communications"
    type: "Communication"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "ApplicationAttachment"
    multiplicity: "OneToMany"
  - name: "sourceChannel"
    type: "SourceChannel"
    multiplicity: "ManyToOne"
  - name: "referral"
    type: "Referral"
    multiplicity: "OneToOne"
  - name: "agencySubmission"
    type: "AgencySubmission"
    multiplicity: "OneToOne"
- name: "ApplicationStage"
  description: "Historical record of a candidate’s movement through the hiring pipeline."
