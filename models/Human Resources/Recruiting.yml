  description: "Talent acquisition professional managing requisitions and candidates."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "specialization"
    type: "String"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "departments"
    type: "Department"
    multiplicity: "ManyToMany"
  - name: "requisitions"
    type: "JobRequisition"
    multiplicity: "ManyToMany"
  - name: "communications"
    type: "Communication"
    multiplicity: "OneToMany"
- name: "HiringManager"
  description: "Department leader accountable for selection decisions."
