  - name: "endDate"
    type: "Date"
  - name: "budget"
    type: "Money"
  relations:
  - name: "postings"
    type: "JobPosting"
    multiplicity: "ManyToMany"
  - name: "sourceChannels"
    type: "SourceChannel"
    multiplicity: "ManyToMany"
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "events"
    type: "RecruitingEvent"
    multiplicity: "ManyToMany"
- name: "SourceChannel"
