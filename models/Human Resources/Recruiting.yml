---
metadata:
  name: "Recruiting Capabilities Model (HCIDL)"
  description: "A comprehensive capability model capturing the core entities, processes,\
    \ and information flows used in enterprise recruiting."
  version: "1.0.0"
  industry: "Human Resources"
  category: "Human Resources"
  type: "Capability"
  domain: "Recruiting"
entities:
- name: "Employer"
  description: "Legal entity responsible for workforce planning and hiring activities."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "WebLink"
  relations:
  - name: "departments"
    type: "Department"
    multiplicity: "OneToMany"
  - name: "recruiters"
    type: "Recruiter"
    multiplicity: "OneToMany"
  - name: "agencies"
    type: "RecruitmentAgency"
    multiplicity: "ManyToMany"
  - name: "jobBoards"
    type: "JobBoard"
    multiplicity: "ManyToMany"
  - name: "assessmentVendors"
    type: "AssessmentVendor"
    multiplicity: "OneToMany"
  - name: "talentPools"
    type: "TalentPool"
    multiplicity: "OneToMany"
  - name: "universities"
    type: "University"
    multiplicity: "ManyToMany"
  - name: "campaigns"
    type: "Campaign"
    multiplicity: "OneToMany"
  - name: "sourceChannels"
    type: "SourceChannel"
    multiplicity: "OneToMany"
- name: "Department"
  description: "Organizational unit with its own leadership and hiring needs."
  data:
  - name: "name"
    type: "String"
  - name: "costCenter"
    type: "String"
  - name: "functionArea"
    type: "FunctionArea"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "positions"
    type: "Position"
    multiplicity: "OneToMany"
  - name: "hiringManagers"
    type: "HiringManager"
    multiplicity: "OneToMany"
  - name: "recruiters"
    type: "Recruiter"
    multiplicity: "ManyToMany"
- name: "Position"
  description: "Role definition that describes responsibilities, competencies, and\
    \ pay bands."
  data:
  - name: "title"
    type: "String"
  - name: "jobFamily"
    type: "String"
  - name: "seniorityLevel"
    type: "SeniorityLevel"
  - name: "employmentType"
    type: "EmploymentType"
  - name: "workLocationType"
    type: "WorkLocationType"
  - name: "primaryLocation"
    type: "Address"
  relations:
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "requisitions"
    type: "JobRequisition"
    multiplicity: "OneToMany"
- name: "JobRequisition"
  description: "Authorized request to fill one or more openings for a specific position."
  data:
  - name: "requisitionNumber"
    type: "String"
  - name: "targetOpenings"
    type: "Integer"
  - name: "status"
    type: "RequisitionStatus"
  - name: "priority"
    type: "RequisitionPriority"
  - name: "openedDate"
    type: "Date"
  - name: "employmentType"
    type: "EmploymentType"
  - name: "workLocationType"
    type: "WorkLocationType"
  - name: "minSalary"
    type: "Money"
  - name: "maxSalary"
    type: "Money"
  relations:
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
  - name: "hiringManager"
    type: "HiringManager"
    multiplicity: "ManyToOne"
  - name: "recruiters"
    type: "Recruiter"
    multiplicity: "ManyToMany"
  - name: "jobPostings"
    type: "JobPosting"
    multiplicity: "OneToMany"
  - name: "applications"
    type: "Application"
    multiplicity: "OneToMany"
  - name: "talentPool"
    type: "TalentPool"
    multiplicity: "ManyToOne"
  - name: "sourceChannels"
    type: "SourceChannel"
    multiplicity: "ManyToMany"
- name: "JobPosting"
  description: "External or internal advertisement of an open role."
  data:
  - name: "title"
    type: "String"
  - name: "postingStatus"
    type: "PostingStatus"
  - name: "postingUrl"
    type: "WebLink"
  - name: "language"
    type: "String"
  - name: "activePeriod"
    type: "DateRange"
  relations:
  - name: "requisition"
    type: "JobRequisition"
    multiplicity: "ManyToOne"
  - name: "jobBoard"
    type: "JobBoard"
    multiplicity: "ManyToOne"
  - name: "campaigns"
    type: "Campaign"
    multiplicity: "ManyToMany"
  - name: "applicationForm"
    type: "ApplicationForm"
    multiplicity: "OneToOne"
- name: "ApplicationForm"
  description: "Structured questionnaire and declarations required when applying."
  data:
  - name: "formName"
    type: "String"
  - name: "isEEOCollected"
    type: "Boolean"
  relations:
  - name: "jobPosting"
    type: "JobPosting"
    multiplicity: "OneToOne"
  - name: "questions"
    type: "ApplicationQuestion"
    multiplicity: "OneToMany"
- name: "ApplicationQuestion"
  description: "A single prompt and response definition within an application form."
  data:
  - name: "questionText"
    type: "String"
  - name: "required"
    type: "Boolean"
  - name: "responseType"
    type: "QuestionResponseType"
  relations:
  - name: "applicationForm"
    type: "ApplicationForm"
    multiplicity: "ManyToOne"
- name: "Candidate"
  description: "Person who has applied or may apply for employment."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "currentCompany"
    type: "String"
  - name: "highestEducation"
    type: "EducationLevel"
  - name: "yearsOfExperience"
    type: "Integer"
  - name: "location"
    type: "Address"
  relations:
  - name: "applications"
    type: "Application"
    multiplicity: "OneToMany"
  - name: "resumes"
    type: "Resume"
    multiplicity: "OneToMany"
  - name: "referrals"
    type: "Referral"
    multiplicity: "OneToMany"
  - name: "notes"
    type: "CandidateNote"
    multiplicity: "OneToMany"
  - name: "talentPools"
    type: "TalentPool"
    multiplicity: "ManyToMany"
  - name: "universities"
    type: "University"
    multiplicity: "ManyToMany"
- name: "Resume"
  description: "Candidate-provided curriculum vitae or resume artifact."
  data:
  - name: "fileName"
    type: "String"
  - name: "resumeText"
    type: "String"
  - name: "uploadUrl"
    type: "WebLink"
  - name: "lastUpdated"
    type: "Date"
  relations:
  - name: "candidate"
    type: "Candidate"
    multiplicity: "ManyToOne"
- name: "Referral"
  description: "Employee or external party recommendation of a candidate."
  data:
  - name: "referrerName"
    type: "String"
  - name: "referrerEmail"
    type: "String"
  - name: "relationship"
    type: "String"
  - name: "referralDate"
    type: "Date"
  relations:
  - name: "candidate"
    type: "Candidate"
    multiplicity: "ManyToOne"
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
- name: "CandidateNote"
  description: "Internal note about a candidate or application."
  data:
  - name: "noteText"
    type: "String"
  - name: "author"
    type: "String"
  - name: "notedDate"
    type: "Date"
  - name: "visibility"
    type: "NoteVisibility"
  relations:
  - name: "candidate"
    type: "Candidate"
    multiplicity: "ManyToOne"
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "recruiter"
    type: "Recruiter"
    multiplicity: "ManyToOne"
- name: "Application"
