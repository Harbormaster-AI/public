  - name: "stage"
    type: "StageType"
  - name: "enteredDate"
    type: "Date"
  - name: "exitedDate"
    type: "Date"
  - name: "isCurrent"
    type: "Boolean"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
- name: "Interview"
  description: "Scheduled evaluation session with one or more interviewers."
  data:
  - name: "interviewDate"
    type: "Date"
  - name: "interviewType"
    type: "InterviewType"
  - name: "durationMinutes"
    type: "Integer"
  - name: "location"
    type: "String"
  - name: "status"
    type: "InterviewStatus"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "interviewers"
    type: "Interviewer"
    multiplicity: "ManyToMany"
  - name: "feedback"
    type: "InterviewFeedback"
    multiplicity: "OneToMany"
- name: "Interviewer"
  description: "Employee or contractor who participates in interviews."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "department"
    type: "String"
  - name: "role"
    type: "String"
  - name: "isHiringManager"
    type: "Boolean"
  relations:
  - name: "interviews"
    type: "Interview"
    multiplicity: "ManyToMany"
- name: "InterviewFeedback"
  description: "Structured assessment submitted by an interviewer after an interview."
  data:
  - name: "submittedDate"
    type: "Date"
  - name: "rating"
    type: "Integer"
  - name: "recommendation"
    type: "FeedbackRecommendation"
  - name: "comments"
    type: "String"
  relations:
  - name: "interview"
    type: "Interview"
    multiplicity: "ManyToOne"
  - name: "interviewer"
    type: "Interviewer"
    multiplicity: "ManyToOne"
- name: "Assessment"
  description: "Standardized test or work sample used to evaluate candidate capabilities."
  data:
  - name: "assessmentName"
    type: "String"
  - name: "assessmentType"
    type: "AssessmentType"
  - name: "score"
    type: "Decimal"
  - name: "completedDate"
    type: "Date"
  - name: "passed"
    type: "Boolean"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "vendor"
    type: "AssessmentVendor"
    multiplicity: "ManyToOne"
- name: "AssessmentVendor"
  description: "Third-party provider delivering candidate assessments."
  data:
  - name: "name"
    type: "String"
  - name: "website"
    type: "WebLink"
  relations:
  - name: "assessments"
    type: "Assessment"
    multiplicity: "OneToMany"
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
- name: "Offer"
  description: "Formal proposal of employment terms extended to a candidate."
  data:
  - name: "offerNumber"
    type: "String"
  - name: "status"
    type: "OfferStatus"
  - name: "proposedStartDate"
    type: "Date"
  - name: "baseSalary"
    type: "Money"
  - name: "bonusTarget"
    type: "Decimal"
  - name: "equityValue"
    type: "Money"
  - name: "employmentType"
    type: "EmploymentType"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "OfferApproval"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "OfferDocument"
    multiplicity: "OneToMany"
  - name: "components"
    type: "OfferComponent"
    multiplicity: "OneToMany"
- name: "OfferComponent"
  description: "Itemized element of total compensation included in an offer."
  data:
  - name: "componentType"
    type: "OfferComponentType"
  - name: "amount"
    type: "Money"
  - name: "frequency"
    type: "PayFrequency"
  relations:
  - name: "offer"
    type: "Offer"
    multiplicity: "ManyToOne"
- name: "OfferApproval"
  description: "Decision record from stakeholders who must approve an offer."
  data:
  - name: "approverName"
    type: "String"
  - name: "approverRole"
    type: "String"
  - name: "approved"
    type: "Boolean"
  - name: "approvedDate"
    type: "Date"
  - name: "comment"
    type: "String"
