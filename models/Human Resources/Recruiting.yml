  - name: "website"
    type: "WebLink"
  - name: "postingFormat"
    type: "String"
  relations:
  - name: "employers"
    type: "Employer"
    multiplicity: "ManyToMany"
  - name: "postings"
    type: "JobPosting"
    multiplicity: "OneToMany"
- name: "Campaign"
