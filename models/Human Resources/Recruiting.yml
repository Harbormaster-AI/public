  - name: "offer"
    type: "Offer"
    multiplicity: "ManyToOne"
- name: "OfferDocument"
  description: "Generated document containing offer terms and acknowledgments."
  data:
  - name: "documentName"
    type: "String"
  - name: "documentUrl"
    type: "WebLink"
  - name: "requiresSignature"
    type: "Boolean"
  - name: "signedDate"
    type: "Date"
  relations:
  - name: "offer"
    type: "Offer"
    multiplicity: "ManyToOne"
- name: "BackgroundCheck"
  description: "Consolidated screening process coordinated with a provider."
  data:
  - name: "providerName"
    type: "String"
  - name: "status"
    type: "BackgroundCheckStatus"
  - name: "initiatedDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "reports"
    type: "BackgroundReport"
    multiplicity: "OneToMany"
- name: "BackgroundReport"
  description: "Individual screening report within a background check."
  data:
  - name: "reportType"
    type: "BackgroundReportType"
  - name: "result"
    type: "BackgroundResult"
  - name: "findingsSummary"
    type: "String"
  relations:
  - name: "backgroundCheck"
    type: "BackgroundCheck"
    multiplicity: "ManyToOne"
- name: "ReferenceCheck"
  description: "Collected feedback from a candidate’s professional reference."
  data:
  - name: "refereeName"
    type: "String"
  - name: "refereeEmail"
    type: "String"
  - name: "relationship"
    type: "String"
  - name: "feedbackText"
    type: "String"
  - name: "rating"
    type: "Integer"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
