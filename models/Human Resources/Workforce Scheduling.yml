---
metadata:
  name: "Workforce Scheduling"
  description: "Capability model defining concepts and relationships used to plan,\
    \ optimize, publish, and govern workforce schedules."
  version: "1.0.0"
  industry: "Human Resources"
  category: "Human Resources"
  type: "Capability"
  domain: "Workforce Scheduling"
entities:
- name: "Employer"
  description: "Organization responsible for managing workforce scheduling, policies,\
    \ and labor practices."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "defaultTimezone"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "departments"
    type: "Department"
    multiplicity: "OneToMany"
  - name: "workers"
    type: "Worker"
    multiplicity: "OneToMany"
  - name: "workRules"
    type: "WorkRule"
    multiplicity: "OneToMany"
  - name: "laborAgreements"
    type: "LaborAgreement"
    multiplicity: "OneToMany"
  - name: "breakPolicies"
    type: "BreakPolicy"
    multiplicity: "OneToMany"
  - name: "holidayCalendars"
    type: "HolidayCalendar"
    multiplicity: "OneToMany"
  - name: "schedulePeriods"
    type: "SchedulePeriod"
    multiplicity: "OneToMany"
- name: "Location"
  description: "Physical or virtual workplace where shifts are performed."
  data:
  - name: "name"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "openTwentyFourSeven"
    type: "Boolean"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "departments"
    type: "Department"
    multiplicity: "ManyToMany"
  - name: "positions"
    type: "Position"
    multiplicity: "OneToMany"
  - name: "shifts"
    type: "Shift"
    multiplicity: "OneToMany"
  - name: "staffingRequirements"
    type: "StaffingRequirement"
    multiplicity: "OneToMany"
  - name: "demandForecasts"
    type: "DemandForecast"
    multiplicity: "OneToMany"
  - name: "workers"
    type: "Worker"
    multiplicity: "OneToMany"
- name: "Department"
  description: "Administrative unit responsible for a set of positions and schedules."
  data:
  - name: "name"
    type: "String"
  - name: "costCenter"
    type: "String"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "locations"
    type: "Location"
    multiplicity: "ManyToMany"
  - name: "positions"
    type: "Position"
    multiplicity: "OneToMany"
  - name: "workRules"
    type: "WorkRule"
    multiplicity: "ManyToMany"
- name: "Position"
  description: "Defined job or role to be staffed within schedules."
  data:
  - name: "title"
    type: "String"
  - name: "employmentType"
    type: "EmploymentType"
  - name: "minWeeklyHours"
    type: "Integer"
  - name: "maxWeeklyHours"
    type: "Integer"
  - name: "allowOvertime"
    type: "Boolean"
  relations:
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "requiredSkills"
    type: "Skill"
    multiplicity: "ManyToMany"
  - name: "requiredCertifications"
    type: "Certification"
    multiplicity: "ManyToMany"
  - name: "workers"
    type: "Worker"
    multiplicity: "OneToMany"
  - name: "shifts"
    type: "Shift"
    multiplicity: "OneToMany"
  - name: "breakPolicies"
    type: "BreakPolicy"
    multiplicity: "ManyToMany"
  - name: "laborAgreements"
    type: "LaborAgreement"
    multiplicity: "ManyToMany"
- name: "Skill"
  description: "Demonstrable capability relevant to a position or shift."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "positions"
    type: "Position"
    multiplicity: "ManyToMany"
  - name: "workers"
    type: "Worker"
    multiplicity: "ManyToMany"
  - name: "staffingRequirements"
    type: "StaffingRequirement"
    multiplicity: "ManyToMany"
- name: "Certification"
  description: "Credential required or preferred for certain work assignments."
  data:
  - name: "name"
    type: "String"
  - name: "issuingAuthority"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "renewalRequired"
    type: "Boolean"
  relations:
  - name: "positions"
    type: "Position"
    multiplicity: "ManyToMany"
  - name: "workers"
    type: "Worker"
    multiplicity: "ManyToMany"
- name: "Worker"
  description: "Individual who may be assigned to shifts."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "employmentType"
    type: "EmploymentType"
  - name: "seniorityDate"
    type: "Date"
  - name: "preferredHoursPerWeek"
    type: "Integer"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
  - name: "skills"
    type: "Skill"
    multiplicity: "ManyToMany"
  - name: "certifications"
    type: "Certification"
    multiplicity: "ManyToMany"
  - name: "availabilities"
    type: "WorkerAvailability"
    multiplicity: "OneToMany"
  - name: "timeOffRequests"
    type: "TimeOffRequest"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "ShiftAssignment"
    multiplicity: "OneToMany"
  - name: "preferences"
    type: "SchedulePreference"
    multiplicity: "OneToMany"
  - name: "bids"
    type: "ScheduleBid"
    multiplicity: "OneToMany"
  - name: "swapRequests"
    type: "SwapRequest"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "WorkRule"
  description: "Constraint used to ensure compliant and sustainable schedules."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "WorkRuleType"
  - name: "minRestHours"
    type: "Decimal"
  - name: "maxDailyHours"
    type: "Decimal"
  - name: "maxWeeklyHours"
    type: "Decimal"
  - name: "maxConsecutiveDays"
    type: "Integer"
  - name: "minGapBetweenShiftsHours"
    type: "Decimal"
  - name: "consecutiveNightShiftLimit"
    type: "Integer"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "departments"
    type: "Department"
    multiplicity: "ManyToMany"
  - name: "positions"
    type: "Position"
    multiplicity: "ManyToMany"
- name: "LaborAgreement"
  description: "Set of labor terms that influence scheduling and premiums."
  data:
  - name: "name"
    type: "String"
  - name: "agreementType"
    type: "AgreementType"
  - name: "overtimeDailyThresholdHours"
    type: "Decimal"
  - name: "overtimeWeeklyThresholdHours"
    type: "Decimal"
  - name: "weekendPremiumPercent"
    type: "Decimal"
  - name: "nightPremiumPercent"
    type: "Decimal"
  - name: "notes"
    type: "String"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "positions"
    type: "Position"
    multiplicity: "ManyToMany"
- name: "BreakPolicy"
  description: "Rules governing meal and rest breaks within shifts."
  data:
  - name: "name"
    type: "String"
  - name: "mealBreakMinutes"
    type: "Integer"
  - name: "restBreakMinutes"
    type: "Integer"
  - name: "breakSchedulingMode"
    type: "BreakSchedulingMode"
  - name: "requiresApprovalForShortening"
    type: "Boolean"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "positions"
    type: "Position"
    multiplicity: "ManyToMany"
- name: "HolidayCalendar"
  description: "Calendar of observed holidays that affect staffing and coverage."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "year"
    type: "Integer"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "holidays"
    type: "Holiday"
    multiplicity: "OneToMany"
- name: "Holiday"
  description: "Observed day that may influence staffing levels and premiums."
  data:
  - name: "date"
    type: "Date"
  - name: "name"
    type: "String"
  - name: "isPaid"
    type: "Boolean"
  relations:
  - name: "calendar"
    type: "HolidayCalendar"
    multiplicity: "ManyToOne"
  - name: "locations"
    type: "Location"
    multiplicity: "ManyToMany"
- name: "SchedulePeriod"
  description: "Planning window over which shifts are created and published."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "ScheduleStatus"
  relations:
  - name: "employer"
    type: "Employer"
    multiplicity: "ManyToOne"
  - name: "shifts"
    type: "Shift"
    multiplicity: "OneToMany"
  - name: "staffingRequirements"
    type: "StaffingRequirement"
    multiplicity: "OneToMany"
  - name: "demandForecasts"
    type: "DemandForecast"
    multiplicity: "OneToMany"
  - name: "coveragePlans"
    type: "CoveragePlan"
    multiplicity: "OneToMany"
  - name: "publications"
    type: "SchedulePublication"
    multiplicity: "OneToMany"
- name: "CoveragePlan"
  description: "Strategy for meeting staffing demand within a schedule period."
  data:
  - name: "name"
    type: "String"
  - name: "targetServiceLevel"
    type: "Decimal"
  - name: "status"
    type: "CoveragePlanStatus"
  relations:
  - name: "schedulePeriod"
    type: "SchedulePeriod"
    multiplicity: "ManyToOne"
  - name: "staffingRequirements"
    type: "StaffingRequirement"
    multiplicity: "ManyToMany"
  - name: "demandForecasts"
    type: "DemandForecast"
    multiplicity: "ManyToMany"
- name: "ShiftTemplate"
  description: "Reusable pattern defining shift timing and recurrence."
  data:
  - name: "name"
    type: "String"
  - name: "shiftType"
    type: "ShiftType"
  - name: "startTime"
    type: "String"
  - name: "endTime"
    type: "String"
  - name: "recurrence"
    type: "RecurrencePattern"
  relations:
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "StaffingRequirement"
  description: "Required headcount and skills for a specific time window."
  data:
  - name: "date"
    type: "Date"
  - name: "startTime"
    type: "String"
  - name: "endTime"
    type: "String"
  - name: "requiredCount"
    type: "Integer"
  - name: "requirementType"
    type: "RequirementType"
  relations:
  - name: "schedulePeriod"
    type: "SchedulePeriod"
    multiplicity: "ManyToOne"
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
  - name: "skills"
    type: "Skill"
    multiplicity: "ManyToMany"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "DemandForecast"
  description: "Predicted workload used to inform staffing requirements."
  data:
  - name: "date"
    type: "Date"
  - name: "intervalMinutes"
    type: "Integer"
  - name: "expectedWorkload"
    type: "Decimal"
  - name: "method"
    type: "ForecastMethod"
  relations:
  - name: "schedulePeriod"
    type: "SchedulePeriod"
    multiplicity: "ManyToOne"
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "Shift"
  description: "Discrete period of work to be staffed by a worker."
  data:
  - name: "startDateTime"
    type: "DateTime"
  - name: "endDateTime"
    type: "DateTime"
  - name: "status"
    type: "ShiftStatus"
  - name: "shiftType"
    type: "ShiftType"
  - name: "breakMinutes"
    type: "Integer"
  - name: "isOnCall"
    type: "Boolean"
  relations:
  - name: "schedulePeriod"
    type: "SchedulePeriod"
    multiplicity: "ManyToOne"
  - name: "template"
    type: "ShiftTemplate"
    multiplicity: "ManyToOne"
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "assignments"
    type: "ShiftAssignment"
    multiplicity: "OneToMany"
- name: "ShiftAssignment"
  description: "Record of a worker being assigned to a specific shift."
  data:
  - name: "assignmentStatus"
    type: "AssignmentStatus"
  - name: "assignedOn"
    type: "DateTime"
  - name: "assignedBy"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "shift"
    type: "Shift"
    multiplicity: "ManyToOne"
  - name: "worker"
    type: "Worker"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "SchedulePublication"
  description: "Snapshot of a schedule period released to the workforce."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "publishedOn"
    type: "DateTime"
  - name: "notes"
    type: "String"
  relations:
  - name: "schedulePeriod"
    type: "SchedulePeriod"
    multiplicity: "ManyToOne"
  - name: "publishedBy"
    type: "Worker"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "WorkerAvailability"
  description: "Stated availability for a worker on a given date and time window."
  data:
  - name: "date"
    type: "Date"
  - name: "startTime"
    type: "String"
  - name: "endTime"
    type: "String"
  - name: "availabilityType"
    type: "AvailabilityType"
  - name: "preferenceWeight"
    type: "Integer"
  relations:
  - name: "worker"
    type: "Worker"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
- name: "SchedulePreference"
  description: "Persistent preference that influences scheduling decisions."
  data:
  - name: "preferenceType"
    type: "PreferenceType"
  - name: "dayOfWeek"
    type: "DayOfWeek"
  - name: "startTime"
    type: "String"
  - name: "endTime"
    type: "String"
  - name: "weight"
    type: "Integer"
  - name: "notes"
    type: "String"
  relations:
  - name: "worker"
    type: "Worker"
    multiplicity: "ManyToOne"
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
- name: "TimeOffRequest"
  description: "Request by a worker for scheduled time away from work."
  data:
  - name: "requestDate"
    type: "Date"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "reason"
    type: "TimeOffReason"
  - name: "status"
    type: "RequestStatus"
  - name: "partialDay"
    type: "Boolean"
  relations:
  - name: "worker"
    type: "Worker"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "Approval"
  description: "Decision record for requests, assignments, and publications."
  data:
  - name: "status"
    type: "ApprovalStatus"
  - name: "decidedOn"
    type: "DateTime"
  - name: "comment"
    type: "String"
  relations:
  - name: "approver"
    type: "Worker"
    multiplicity: "ManyToOne"
  - name: "timeOffRequest"
    type: "TimeOffRequest"
    multiplicity: "ManyToOne"
  - name: "swapRequest"
    type: "SwapRequest"
    multiplicity: "ManyToOne"
  - name: "assignment"
    type: "ShiftAssignment"
    multiplicity: "ManyToOne"
  - name: "publication"
    type: "SchedulePublication"
    multiplicity: "ManyToOne"
- name: "SwapRequest"
  description: "Request to exchange or give up a shift."
  data:
  - name: "createdOn"
    type: "DateTime"
  - name: "status"
    type: "RequestStatus"
  - name: "swapType"
    type: "SwapType"
  - name: "message"
    type: "String"
  relations:
  - name: "requester"
    type: "Worker"
    multiplicity: "ManyToOne"
  - name: "offeredShift"
    type: "Shift"
    multiplicity: "ManyToOne"
  - name: "requestedShift"
    type: "Shift"
    multiplicity: "ManyToOne"
  - name: "candidateWorkers"
    type: "Worker"
    multiplicity: "ManyToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "OvertimeOffer"
  description: "Offer to fill a shift at a premium outside normal hours."
  data:
  - name: "createdOn"
    type: "DateTime"
  - name: "premiumMultiplier"
    type: "Decimal"
  - name: "status"
    type: "OfferStatus"
  - name: "expiresOn"
    type: "DateTime"
  relations:
  - name: "shift"
    type: "Shift"
    multiplicity: "ManyToOne"
  - name: "candidates"
    type: "Worker"
    multiplicity: "ManyToMany"
  - name: "acceptedBy"
    type: "Worker"
    multiplicity: "ManyToOne"
- name: "BidRound"
  description: "Window during which workers submit bids for future schedules."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "BidRoundStatus"
  relations:
  - name: "schedulePeriod"
    type: "SchedulePeriod"
    multiplicity: "ManyToOne"
  - name: "bids"
    type: "ScheduleBid"
    multiplicity: "OneToMany"
- name: "ScheduleBid"
  description: "Worker’s ranked preference for future shift patterns."
  data:
  - name: "rank"
    type: "Integer"
  - name: "preferenceNotes"
    type: "String"
  - name: "status"
    type: "BidStatus"
  relations:
  - name: "bidRound"
    type: "BidRound"
    multiplicity: "ManyToOne"
  - name: "worker"
    type: "Worker"
    multiplicity: "ManyToOne"
  - name: "shiftTemplate"
    type: "ShiftTemplate"
    multiplicity: "ManyToOne"
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
- name: "Communication"
  description: "Notification or message related to schedules and shifts."
  data:
  - name: "sentOn"
    type: "DateTime"
  - name: "channel"
    type: "CommunicationChannel"
  - name: "subject"
    type: "String"
  - name: "message"
    type: "String"
  relations:
  - name: "sender"
    type: "Worker"
    multiplicity: "ManyToOne"
  - name: "recipients"
    type: "Worker"
    multiplicity: "ManyToMany"
  - name: "relatedShift"
    type: "Shift"
    multiplicity: "ManyToOne"
  - name: "relatedSchedulePeriod"
    type: "SchedulePeriod"
    multiplicity: "ManyToOne"
- name: "ComplianceViolation"
  description: "Detected breach of a work rule or agreement."
  data:
  - name: "detectedOn"
    type: "DateTime"
  - name: "ruleName"
    type: "String"
  - name: "severity"
    type: "ViolationSeverity"
  - name: "resolved"
    type: "Boolean"
  - name: "notes"
    type: "String"
  relations:
  - name: "worker"
    type: "Worker"
    multiplicity: "ManyToOne"
  - name: "shift"
    type: "Shift"
    multiplicity: "ManyToOne"
  - name: "workRule"
    type: "WorkRule"
    multiplicity: "ManyToOne"
- name: "ScheduleException"
  description: "Unplanned event affecting coverage or published schedules."
  data:
  - name: "occurredOn"
    type: "DateTime"
  - name: "exceptionType"
    type: "String"
  - name: "description"
    type: "String"
  - name: "resolvedOn"
    type: "DateTime"
  relations:
  - name: "schedulePeriod"
    type: "SchedulePeriod"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "shift"
    type: "Shift"
    multiplicity: "ManyToOne"
enums:
- name: "EmploymentType"
  description: "Classification of the worker’s engagement with the employer."
  data:
  - name: "FullTime"
  - name: "PartTime"
  - name: "Temporary"
  - name: "Contractor"
- name: "ShiftType"
  description: "Category of shift based on timing or duty pattern."
  data:
  - name: "Regular"
  - name: "Night"
  - name: "Weekend"
  - name: "OnCall"
  - name: "Split"
- name: "ShiftStatus"
  description: "Lifecycle state of an individual shift."
  data:
  - name: "Planned"
  - name: "Published"
  - name: "Locked"
  - name: "Cancelled"
- name: "ScheduleStatus"
  description: "Publication state of a schedule period."
  data:
  - name: "Draft"
  - name: "Published"
  - name: "Closed"
- name: "RequestStatus"
  description: "Decision state for worker-initiated requests."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Cancelled"
- name: "AvailabilityType"
  description: "Worker’s declared availability for scheduling."
  data:
  - name: "Available"
  - name: "Unavailable"
  - name: "Preferred"
- name: "TimeOffReason"
  description: "Motivation for a time away request."
  data:
  - name: "Vacation"
  - name: "Sick"
  - name: "Personal"
  - name: "Bereavement"
  - name: "JuryDuty"
- name: "OfferStatus"
  description: "Current state of an overtime or open shift offer."
  data:
  - name: "Open"
  - name: "Accepted"
  - name: "Declined"
  - name: "Expired"
  - name: "Withdrawn"
- name: "PreferenceType"
  description: "Type of preference that guides scheduling decisions."
  data:
  - name: "DayOff"
  - name: "PreferredShift"
  - name: "UnavailableTime"
  - name: "PreferredLocation"
- name: "WorkRuleType"
  description: "Category of scheduling constraint enforced by policy."
  data:
  - name: "RestPeriod"
  - name: "MaxHours"
  - name: "ConsecutiveDays"
  - name: "NightWorkLimit"
  - name: "WeekendWorkLimit"
- name: "AgreementType"
  description: "Nature of the labor agreement influencing schedules."
  data:
  - name: "Union"
  - name: "CompanyPolicy"
