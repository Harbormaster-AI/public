---
metadata:
  name: "Promotion Management Capabilities Model"
  description: "A domain model describing the structures, rules, and processes used\
    \ to plan, author, approve, distribute, and measure sales promotions across channels\
    \ and audiences."
  version: "1.0.0"
  industry: "Retail & Digital Commerce"
  category: "Product & Catalog"
  type: "Capability"
  domain: "Promotion Management"
entities:
- name: "PromotionProgram"
  description: "A coordinated set of promotions aligned to a business objective and\
    \ time frame."
  data:
  - name: "name"
    type: "String"
  - name: "objective"
    type: "String"
  - name: "programType"
    type: "ProgramType"
  - name: "status"
    type: "ProgramStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "budget"
    type: "Money"
  relations:
  - name: "owner"
    type: "MarketingTeam"
    multiplicity: "ManyToOne"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "OneToMany"
  - name: "channels"
    type: "PromotionChannel"
    multiplicity: "ManyToMany"
  - name: "targetAudiences"
    type: "AudienceSegment"
    multiplicity: "ManyToMany"
  - name: "approvalWorkflow"
    type: "ApprovalWorkflow"
    multiplicity: "OneToOne"
  - name: "spendLedger"
    type: "SpendLedger"
    multiplicity: "OneToOne"
  - name: "experiments"
    type: "Experiment"
    multiplicity: "OneToMany"
  - name: "partners"
    type: "Partner"
    multiplicity: "ManyToMany"
- name: "MarketingTeam"
  description: "Organizational unit responsible for planning and executing promotions."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "programs"
    type: "PromotionProgram"
    multiplicity: "OneToMany"
  - name: "members"
    type: "Staff"
    multiplicity: "ManyToMany"
- name: "Staff"
  description: "Individual user participating in authoring, review, and approval of\
    \ promotions."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "String"
  relations:
  - name: "teams"
    type: "MarketingTeam"
    multiplicity: "ManyToMany"
  - name: "approvals"
    type: "ApprovalStep"
    multiplicity: "OneToMany"
- name: "Promotion"
  description: "A discrete, market-facing incentive with defined eligibility, benefits,\
    \ and schedule."
  data:
  - name: "name"
    type: "String"
  - name: "promotionType"
    type: "PromotionType"
  - name: "priority"
    type: "Integer"
  - name: "applicationScope"
    type: "ApplicationScope"
  - name: "status"
    type: "PromotionStatus"
  - name: "startDate"
    type: "DateTime"
  - name: "endDate"
    type: "DateTime"
  - name: "autoApply"
    type: "Boolean"
  - name: "couponRequired"
    type: "Boolean"
  - name: "maxRedemptionsPerCustomer"
    type: "Integer"
  - name: "maxRedemptionsTotal"
    type: "Integer"
  - name: "stackGroup"
    type: "String"
  relations:
  - name: "program"
    type: "PromotionProgram"
    multiplicity: "ManyToOne"
  - name: "benefits"
    type: "Benefit"
    multiplicity: "OneToMany"
  - name: "eligibilityRules"
    type: "EligibilityRule"
    multiplicity: "OneToMany"
  - name: "schedule"
    type: "PromotionSchedule"
    multiplicity: "OneToOne"
  - name: "channels"
    type: "PromotionChannel"
    multiplicity: "ManyToMany"
  - name: "audiences"
    type: "AudienceSegment"
    multiplicity: "ManyToMany"
  - name: "stackingPolicy"
    type: "StackingPolicy"
    multiplicity: "OneToOne"
  - name: "exclusionRules"
    type: "ExclusionRule"
    multiplicity: "OneToMany"
  - name: "capRules"
    type: "CapRule"
    multiplicity: "OneToMany"
  - name: "coupons"
    type: "Coupon"
    multiplicity: "OneToMany"
  - name: "redemptions"
    type: "Redemption"
    multiplicity: "OneToMany"
  - name: "contentVariants"
    type: "ContentVariant"
    multiplicity: "OneToMany"
  - name: "kpiRecords"
    type: "KPIRecord"
    multiplicity: "OneToMany"
  - name: "partners"
    type: "Partner"
    multiplicity: "ManyToMany"
  - name: "experiments"
    type: "Experiment"
    multiplicity: "ManyToMany"
- name: "Benefit"
  description: "The monetary or non-monetary value granted when a promotion is applied."
  data:
  - name: "benefitType"
    type: "BenefitType"
  - name: "valueType"
    type: "BenefitValueType"
  - name: "percentage"
    type: "Decimal"
  - name: "amount"
    type: "Money"
  - name: "fixedPrice"
    type: "Money"
  - name: "appliesTo"
    type: "ApplicationScope"
  - name: "allocationMethod"
    type: "AllocationMethod"
  - name: "roundingMode"
    type: "RoundingMode"
  relations:
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "productScope"
    type: "ProductScope"
    multiplicity: "ManyToOne"
- name: "ProductScope"
  description: "Declarative selection of products or services to which rules or benefits\
    \ apply."
  data:
  - name: "name"
    type: "String"
  - name: "scopeType"
    type: "ProductScopeType"
  - name: "criteriaExpression"
    type: "String"
  relations:
  - name: "benefits"
    type: "Benefit"
    multiplicity: "OneToMany"
  - name: "exclusionRules"
    type: "ExclusionRule"
    multiplicity: "OneToMany"
  - name: "conditions"
    type: "Condition"
    multiplicity: "OneToMany"
- name: "EligibilityRule"
  description: "A logical grouping of conditions that determine when a promotion can\
    \ be applied."
  data:
  - name: "name"
    type: "String"
  - name: "logicOperator"
    type: "LogicalOperator"
  - name: "description"
    type: "String"
  relations:
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "conditions"
    type: "Condition"
    multiplicity: "OneToMany"
  - name: "segments"
    type: "AudienceSegment"
    multiplicity: "ManyToMany"
- name: "Condition"
  description: "An atomic predicate evaluated against cart, product, order, or customer\
    \ context."
  data:
  - name: "attribute"
    type: "ConditionAttribute"
  - name: "comparator"
    type: "Comparator"
  - name: "value"
    type: "String"
  relations:
  - name: "eligibilityRule"
    type: "EligibilityRule"
    multiplicity: "ManyToOne"
  - name: "productScope"
    type: "ProductScope"
    multiplicity: "ManyToOne"
- name: "PromotionSchedule"
  description: "Time window and recurrence controls for availability of a promotion."
  data:
  - name: "timeZone"
    type: "String"
  - name: "recurrenceType"
    type: "RecurrenceType"
  - name: "startDateTime"
    type: "DateTime"
  - name: "endDateTime"
    type: "DateTime"
  relations:
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "blackoutWindows"
    type: "BlackoutWindow"
    multiplicity: "OneToMany"
- name: "BlackoutWindow"
  description: "A defined interval during which a promotion is not available."
  data:
  - name: "startDateTime"
    type: "DateTime"
  - name: "endDateTime"
    type: "DateTime"
  - name: "reason"
    type: "String"
  relations:
  - name: "schedule"
    type: "PromotionSchedule"
    multiplicity: "ManyToOne"
- name: "PromotionChannel"
  description: "Distribution medium through which a promotion is communicated or applied."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  relations:
  - name: "programs"
    type: "PromotionProgram"
    multiplicity: "ManyToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
  - name: "contentVariants"
    type: "ContentVariant"
    multiplicity: "OneToMany"
  - name: "partners"
    type: "Partner"
    multiplicity: "ManyToMany"
- name: "AudienceSegment"
  description: "A defined set of customers targeted for or restricted from a promotion."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "segmentType"
    type: "SegmentType"
  relations:
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
  - name: "customers"
    type: "CustomerProfile"
    multiplicity: "ManyToMany"
  - name: "distributionLists"
    type: "DistributionList"
    multiplicity: "ManyToMany"
  - name: "eligibilityRules"
    type: "EligibilityRule"
    multiplicity: "ManyToMany"
- name: "Coupon"
  description: "A code-bound entitlement enabling redemption of a promotion."
  data:
  - name: "code"
    type: "String"
  - name: "codeFormat"
    type: "CodeFormat"
  - name: "status"
    type: "CouponStatus"
  - name: "expirationDate"
    type: "Date"
  - name: "usageLimitPerCustomer"
    type: "Integer"
  - name: "usageLimitTotal"
    type: "Integer"
  relations:
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "batch"
    type: "CouponBatch"
    multiplicity: "ManyToOne"
  - name: "redemptions"
    type: "Redemption"
    multiplicity: "OneToMany"
  - name: "customer"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "partner"
    type: "Partner"
    multiplicity: "ManyToOne"
- name: "CouponBatch"
  description: "A cohesive set of coupons generated or imported for distribution."
  data:
  - name: "name"
    type: "String"
  - name: "generationStrategy"
    type: "CodeStrategy"
  - name: "quantity"
    type: "Integer"
  - name: "prefix"
    type: "String"
  - name: "suffix"
    type: "String"
  - name: "codePattern"
    type: "CodePattern"
  relations:
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "coupons"
    type: "Coupon"
    multiplicity: "OneToMany"
  - name: "distributionList"
    type: "DistributionList"
    multiplicity: "ManyToOne"
- name: "Redemption"
  description: "The event of applying a promotion and its benefits to a transaction."
  data:
  - name: "redeemedAt"
    type: "DateTime"
  - name: "status"
    type: "RedemptionStatus"
  - name: "orderReference"
    type: "String"
  - name: "channel"
    type: "ChannelType"
  - name: "preDiscountAmount"
    type: "Money"
  - name: "discountApplied"
    type: "Money"
  relations:
  - name: "coupon"
    type: "Coupon"
    multiplicity: "ManyToOne"
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "spendEntry"
    type: "SpendEntry"
    multiplicity: "OneToOne"
- name: "CustomerProfile"
  description: "Customer attributes relevant for eligibility, targeting, and redemption\
    \ tracking."
  data:
  - name: "email"
    type: "String"
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "loyaltyLevel"
    type: "LoyaltyLevel"
  - name: "birthDate"
    type: "Date"
  - name: "geography"
    type: "String"
  - name: "consentToMarketing"
    type: "Boolean"
  relations:
  - name: "redemptions"
    type: "Redemption"
    multiplicity: "OneToMany"
  - name: "segments"
    type: "AudienceSegment"
    multiplicity: "ManyToMany"
  - name: "coupons"
    type: "Coupon"
    multiplicity: "OneToMany"
- name: "StackingPolicy"
  description: "Rules determining whether and how a promotion can combine with others."
  data:
  - name: "policyType"
    type: "StackingPolicyType"
  - name: "stackGroup"
    type: "String"
  - name: "exclusivityLevel"
    type: "ExclusivityLevel"
  relations:
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
- name: "ExclusionRule"
  description: "Constraints preventing a promotion from applying under certain contexts."
  data:
  - name: "exclusionType"
    type: "ExclusionType"
  - name: "reason"
    type: "String"
  relations:
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "productScope"
    type: "ProductScope"
    multiplicity: "ManyToOne"
  - name: "audienceSegment"
    type: "AudienceSegment"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "PromotionChannel"
    multiplicity: "ManyToOne"
- name: "CapRule"
  description: "Limits governing how often and how much a promotion can be redeemed."
  data:
  - name: "capType"
    type: "CapType"
  - name: "limit"
    type: "Integer"
  - name: "resetPeriod"
    type: "CapResetPeriod"
  relations:
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
- name: "SpendLedger"
  description: "Financial ledger tracking planned and actual spend for a program."
  data:
  - name: "name"
    type: "String"
  - name: "currency"
    type: "String"
  relations:
  - name: "program"
    type: "PromotionProgram"
    multiplicity: "ManyToOne"
  - name: "entries"
    type: "SpendEntry"
    multiplicity: "OneToMany"
- name: "SpendEntry"
  description: "An individual financial movement related to promotions or redemptions."
  data:
  - name: "entryDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "entryType"
    type: "SpendEntryType"
  - name: "reference"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "ledger"
    type: "SpendLedger"
    multiplicity: "ManyToOne"
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "redemption"
    type: "Redemption"
    multiplicity: "ManyToOne"
- name: "ApprovalWorkflow"
  description: "Governance process controlling promotion review and approval."
  data:
  - name: "status"
    type: "ApprovalStatus"
  - name: "submittedAt"
    type: "DateTime"
  - name: "approvedAt"
    type: "DateTime"
  relations:
  - name: "program"
    type: "PromotionProgram"
    multiplicity: "ManyToOne"
  - name: "steps"
    type: "ApprovalStep"
    multiplicity: "OneToMany"
  - name: "approvers"
    type: "Staff"
    multiplicity: "ManyToMany"
- name: "ApprovalStep"
  description: "A single approval action within a workflow including decision and\
    \ timestamp."
  data:
  - name: "stepOrder"
    type: "Integer"
  - name: "decision"
    type: "DecisionStatus"
  - name: "decidedAt"
    type: "DateTime"
  - name: "comment"
    type: "String"
  relations:
  - name: "workflow"
    type: "ApprovalWorkflow"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Staff"
    multiplicity: "ManyToOne"
- name: "Experiment"
  description: "Controlled test to evaluate promotion effectiveness with measurable\
    \ outcomes."
  data:
  - name: "name"
    type: "String"
  - name: "hypothesis"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "ExperimentStatus"
  relations:
  - name: "program"
    type: "PromotionProgram"
    multiplicity: "ManyToOne"
  - name: "variants"
    type: "ExperimentVariant"
    multiplicity: "OneToMany"
  - name: "metrics"
    type: "MetricDefinition"
    multiplicity: "ManyToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
- name: "ExperimentVariant"
  description: "A traffic-split version under test with a specific allocation."
  data:
  - name: "name"
    type: "String"
  - name: "allocationPercent"
    type: "Decimal"
  relations:
  - name: "experiment"
    type: "Experiment"
    multiplicity: "ManyToOne"
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
- name: "MetricDefinition"
  description: "A standardized metric used to compute KPIs for promotions and experiments."
  data:
  - name: "name"
    type: "String"
  - name: "formula"
    type: "String"
  - name: "unit"
    type: "MetricUnit"
  - name: "description"
    type: "String"
  relations:
  - name: "experiments"
    type: "Experiment"
    multiplicity: "ManyToMany"
  - name: "kpiRecords"
    type: "KPIRecord"
    multiplicity: "OneToMany"
- name: "KPIRecord"
  description: "A time-stamped measurement value for a defined metric."
  data:
  - name: "metricName"
    type: "String"
  - name: "value"
    type: "Decimal"
  - name: "asOf"
    type: "DateTime"
  relations:
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "experiment"
    type: "Experiment"
    multiplicity: "ManyToOne"
  - name: "metricDefinition"
    type: "MetricDefinition"
    multiplicity: "ManyToOne"
- name: "ContentVariant"
  description: "Creative content linked to a promotion for a specific locale and channel."
  data:
  - name: "locale"
    type: "String"
  - name: "headline"
    type: "String"
  - name: "subheading"
    type: "String"
  - name: "imageUrl"
    type: "String"
  - name: "callToAction"
    type: "String"
  relations:
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "PromotionChannel"
    multiplicity: "ManyToOne"
- name: "DistributionList"
  description: "A scheduled outbound list used to distribute coupon codes to audiences."
  data:
  - name: "name"
    type: "String"
  - name: "channel"
    type: "ChannelType"
  - name: "scheduledSendAt"
    type: "DateTime"
  relations:
  - name: "audienceSegments"
    type: "AudienceSegment"
    multiplicity: "ManyToMany"
  - name: "couponBatch"
    type: "CouponBatch"
    multiplicity: "OneToOne"
  - name: "channelEntity"
    type: "PromotionChannel"
    multiplicity: "ManyToOne"
- name: "Partner"
  description: "External party such as an affiliate or marketplace participating in\
    \ promotions."
  data:
  - name: "name"
    type: "String"
  - name: "partnerType"
    type: "PartnerType"
  - name: "website"
    type: "String"
  - name: "contactEmail"
    type: "String"
  relations:
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
  - name: "channels"
    type: "PromotionChannel"
    multiplicity: "ManyToMany"
  - name: "coupons"
    type: "Coupon"
    multiplicity: "OneToMany"
enums:
- name: "ProgramType"
  description: "Classification of a promotion program based on purpose and cadence."
  data:
  - name: "AlwaysOn"
  - name: "Seasonal"
  - name: "Campaign"
  - name: "Clearance"
  - name: "Launch"
- name: "ProgramStatus"
  description: "Lifecycle state of a promotion program."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Paused"
  - name: "Completed"
  - name: "Archived"
- name: "PromotionType"
  description: "The primary mechanism used to deliver value to the customer."
  data:
  - name: "OrderDiscount"
  - name: "ItemDiscount"
  - name: "ShippingDiscount"
  - name: "GiftWithPurchase"
  - name: "BuyXGetY"
  - name: "FreeTrial"
  - name: "StoreCredit"
- name: "ApplicationScope"
  description: "The level at which a promotion is evaluated and applied."
  data:
  - name: "Cart"
  - name: "Item"
  - name: "Shipping"
  - name: "Subscription"
- name: "PromotionStatus"
  description: "Operational state of a promotion within its lifecycle."
  data:
  - name: "Draft"
  - name: "Scheduled"
  - name: "Active"
  - name: "Paused"
  - name: "Expired"
  - name: "Cancelled"
- name: "BenefitType"
  description: "Category of value granted by a promotion."
  data:
  - name: "Discount"
  - name: "Reward"
  - name: "Gift"
- name: "BenefitValueType"
  description: "How the value of a benefit is expressed."
  data:
  - name: "Percent"
  - name: "Amount"
  - name: "FixedPrice"
- name: "AllocationMethod"
  description: "Strategy for distributing a benefit across eligible items."
  data:
  - name: "Proportional"
  - name: "HighestPrice"
  - name: "LowestPrice"
  - name: "EvenSplit"
- name: "RoundingMode"
  description: "Rule applied when distributing fractional discount values."
  data:
  - name: "HalfUp"
  - name: "HalfDown"
  - name: "Ceiling"
  - name: "Floor"
- name: "ProductScopeType"
  description: "Basis for selecting products to include or exclude."
  data:
  - name: "AllProducts"
  - name: "Category"
  - name: "SKU"
  - name: "Collection"
  - name: "AttributeExpression"
- name: "LogicalOperator"
  description: "How a set of conditions is aggregated for evaluation."
  data:
  - name: "All"
  - name: "Any"
- name: "ConditionAttribute"
  description: "Attributes evaluated to determine eligibility."
  data:
  - name: "CartSubtotal"
  - name: "ItemCount"
  - name: "CategoryInCart"
  - name: "SKUInCart"
  - name: "CustomerGroup"
  - name: "FirstPurchase"
  - name: "LoyaltyLevel"
  - name: "CouponApplied"
  - name: "PaymentMethod"
  - name: "ShippingMethod"
  - name: "Geography"
  - name: "DayOfWeek"
  - name: "TimeOfDay"
- name: "Comparator"
  description: "Operator used to compare an attribute to a value."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "GreaterThan"
  - name: "GreaterOrEqual"
  - name: "LessThan"
  - name: "LessOrEqual"
  - name: "In"
  - name: "NotIn"
  - name: "Contains"
- name: "RecurrenceType"
  description: "Recurrence pattern controlling repeated activation windows."
  data:
  - name: "None"
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Custom"
- name: "ChannelType"
  description: "Medium through which promotions are delivered or redeemed."
  data:
  - name: "Web"
  - name: "MobileApp"
  - name: "Email"
  - name: "SMS"
  - name: "POS"
  - name: "Marketplace"
  - name: "Social"
- name: "SegmentType"
  description: "Method used to construct the audience segment."
  data:
  - name: "RuleBased"
  - name: "UploadedList"
  - name: "Behavioral"
  - name: "Demographic"
  - name: "Predictive"
- name: "CodeFormat"
  description: "Structure of coupon codes within a batch or promotion."
  data:
  - name: "Single"
  - name: "Unique"
  - name: "Group"
- name: "CouponStatus"
  description: "Current usability of a coupon code."
  data:
  - name: "Available"
  - name: "Assigned"
  - name: "Redeemed"
  - name: "Expired"
