---
metadata:
  name: "Product Lifecycle Management HCIDL"
  description: "Capabilities model describing product definition, configuration, change,\
    \ document, quality, and release management across the product lifecycle."
  version: "1.0.0"
  industry: "Manufacturing"
  category: "Product & Catalog"
  type: "Capability"
  domain: "Product Lifecycle Management"
entities:
- name: "Enterprise"
  description: "Top-level organization that governs PLM policies, master data, and\
    \ cross-business standards."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "businessUnits"
    type: "BusinessUnit"
    multiplicity: "OneToMany"
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "ManyToMany"
  - name: "standards"
    type: "Standard"
    multiplicity: "ManyToMany"
  - name: "regulations"
    type: "Regulation"
    multiplicity: "ManyToMany"
- name: "BusinessUnit"
  description: "Operating group within the enterprise responsible for product lines,\
    \ engineering, and delivery."
  data:
  - name: "name"
    type: "String"
  - name: "domainFocus"
    type: "String"
  relations:
  - name: "enterprise"
    type: "Enterprise"
    multiplicity: "ManyToOne"
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
  - name: "stakeholders"
    type: "Stakeholder"
    multiplicity: "OneToMany"
- name: "ProductFamily"
  description: "Grouping of related products that share market positioning, technology,\
    \ or architecture."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "String"
  - name: "lifecyclePhase"
    type: "LifecyclePhase"
  relations:
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
  - name: "standards"
    type: "Standard"
    multiplicity: "ManyToMany"
- name: "Product"
  description: "Managed offering representing a marketable solution with governed\
    \ revisions and configurations."
  data:
  - name: "name"
    type: "String"
  - name: "productType"
    type: "ProductType"
  - name: "lifecyclePhase"
    type: "LifecyclePhase"
  relations:
  - name: "productFamily"
    type: "ProductFamily"
    multiplicity: "ManyToOne"
  - name: "revisions"
    type: "ProductRevision"
    multiplicity: "OneToMany"
  - name: "requirements"
    type: "Requirement"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "ManyToMany"
  - name: "manufacturingPlans"
    type: "ManufacturingProcessPlan"
    multiplicity: "OneToMany"
  - name: "configurationItems"
    type: "ConfigurationItem"
    multiplicity: "OneToMany"
- name: "ProductRevision"
  description: "Controlled configuration state of a product at a specific revision\
    \ and release."
  data:
  - name: "revisionCode"
    type: "String"
  - name: "status"
    type: "RevisionStatus"
  - name: "effectivity"
    type: "EffectivityRange"
  - name: "releaseStatus"
    type: "ReleaseStatus"
  - name: "releaseDate"
    type: "Date"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "primaryBOM"
    type: "BillOfMaterial"
    multiplicity: "OneToOne"
  - name: "documents"
    type: "DocumentRevision"
    multiplicity: "ManyToMany"
  - name: "changeOrders"
    type: "ChangeOrder"
    multiplicity: "ManyToMany"
  - name: "baselines"
    type: "Baseline"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
- name: "Part"
  description: "Standardized component or assembly definition managed across design,\
    \ sourcing, and manufacturing."
  data:
  - name: "name"
    type: "String"
  - name: "partNumber"
    type: "String"
  - name: "category"
    type: "PartCategory"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  - name: "sourcingType"
    type: "SourcingType"
  relations:
  - name: "revisions"
    type: "PartRevision"
    multiplicity: "OneToMany"
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "ManyToMany"
  - name: "materials"
    type: "Material"
    multiplicity: "ManyToMany"
  - name: "complianceDeclarations"
    type: "ComplianceDeclaration"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "ManyToMany"
- name: "PartRevision"
  description: "Specific controlled version of a part with defined effectivity and\
    \ release status."
  data:
  - name: "revisionCode"
    type: "String"
  - name: "status"
    type: "RevisionStatus"
  - name: "effectivity"
    type: "EffectivityRange"
  relations:
  - name: "part"
    type: "Part"
    multiplicity: "ManyToOne"
  - name: "usedInBomItems"
    type: "BomItem"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "DocumentRevision"
    multiplicity: "ManyToMany"
  - name: "changeOrders"
    type: "ChangeOrder"
    multiplicity: "ManyToMany"
  - name: "deviations"
    type: "Deviation"
    multiplicity: "OneToMany"
  - name: "waivers"
    type: "Waiver"
    multiplicity: "OneToMany"
  - name: "nonconformances"
    type: "Nonconformance"
    multiplicity: "OneToMany"
  - name: "operations"
    type: "Operation"
    multiplicity: "ManyToMany"
- name: "BillOfMaterial"
  description: "Structured list of child components that define a product or assembly\
    \ configuration."
  data:
  - name: "name"
    type: "String"
  - name: "bomType"
    type: "BOMType"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  relations:
  - name: "productRevision"
    type: "ProductRevision"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "BomItem"
    multiplicity: "OneToMany"
- name: "BomItem"
  description: "Line entry within a BOM describing component usage, quantity, and\
    \ effectivity."
  data:
  - name: "quantity"
    type: "Decimal"
  - name: "findNumber"
    type: "String"
  - name: "referenceDesignators"
    type: "String"
  - name: "usageEffectivity"
    type: "EffectivityRange"
  relations:
  - name: "bom"
    type: "BillOfMaterial"
    multiplicity: "ManyToOne"
  - name: "componentPartRevision"
    type: "PartRevision"
    multiplicity: "ManyToOne"
- name: "Document"
  description: "Managed file-based or record-based artifact such as drawings, CAD,\
    \ specifications, and procedures."
  data:
  - name: "title"
    type: "String"
  - name: "documentType"
    type: "DocumentType"
  - name: "classification"
    type: "String"
  relations:
  - name: "revisions"
    type: "DocumentRevision"
    multiplicity: "OneToMany"
  - name: "linkedProducts"
    type: "Product"
    multiplicity: "ManyToMany"
  - name: "linkedParts"
    type: "Part"
    multiplicity: "ManyToMany"
- name: "DocumentRevision"
  description: "Specific version of a managed document with controlled file content\
    \ and approval record."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "status"
    type: "RevisionStatus"
  - name: "file"
    type: "FileReference"
  - name: "effectiveDate"
    type: "Date"
  relations:
  - name: "document"
    type: "Document"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "changeOrders"
    type: "ChangeOrder"
    multiplicity: "ManyToMany"
- name: "Requirement"
  description: "Statement of need or constraint that must be satisfied by the product\
    \ or its components."
  data:
  - name: "identifier"
    type: "String"
  - name: "title"
    type: "String"
  - name: "requirementType"
    type: "RequirementType"
  - name: "priority"
    type: "Integer"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "parentRequirement"
    type: "Requirement"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "Requirement"
    multiplicity: "OneToMany"
  - name: "testCases"
    type: "TestCase"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "TestCase"
  description: "Verified procedure to validate a requirement or design characteristic."
  data:
  - name: "name"
    type: "String"
  - name: "testType"
    type: "String"
  - name: "expectedResult"
    type: "String"
  relations:
  - name: "requirement"
    type: "Requirement"
    multiplicity: "ManyToOne"
  - name: "productRevision"
    type: "ProductRevision"
    multiplicity: "ManyToOne"
  - name: "testRuns"
    type: "TestRun"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "DocumentRevision"
    multiplicity: "ManyToMany"
- name: "TestRun"
  description: "Execution record of a test case with observed results and traceability."
  data:
  - name: "executionDate"
    type: "Date"
  - name: "result"
    type: "TestResultStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "testCase"
    type: "TestCase"
    multiplicity: "ManyToOne"
  - name: "productRevision"
    type: "ProductRevision"
    multiplicity: "ManyToOne"
  - name: "changeOrder"
    type: "ChangeOrder"
    multiplicity: "ManyToOne"
- name: "ChangeRequest"
  description: "Formal proposal describing a problem or opportunity requiring a controlled\
    \ change."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "title"
    type: "String"
  - name: "changeType"
    type: "ChangeType"
  - name: "status"
    type: "ChangeStatus"
  - name: "raisedDate"
    type: "Date"
  - name: "reason"
    type: "String"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "impactedPartRevisions"
    type: "PartRevision"
    multiplicity: "ManyToMany"
  - name: "impactedDocumentRevisions"
    type: "DocumentRevision"
    multiplicity: "ManyToMany"
  - name: "proposedBy"
    type: "Stakeholder"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "changeOrders"
    type: "ChangeOrder"
    multiplicity: "OneToMany"
- name: "ChangeOrder"
  description: "Authorized instruction to implement a change to released items with\
    \ specified effectivity."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "changeType"
    type: "ChangeType"
  - name: "status"
    type: "ChangeStatus"
  - name: "implementationDate"
    type: "Date"
  relations:
  - name: "changeRequest"
    type: "ChangeRequest"
    multiplicity: "ManyToOne"
  - name: "affectedPartRevisions"
    type: "PartRevision"
    multiplicity: "ManyToMany"
  - name: "affectedDocumentRevisions"
    type: "DocumentRevision"
    multiplicity: "ManyToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "releasePackage"
    type: "ReleasePackage"
    multiplicity: "ManyToOne"
  - name: "testRuns"
    type: "TestRun"
    multiplicity: "OneToMany"
- name: "ChangeNotice"
  description: "Communication artifact that distributes approved change details to\
    \ stakeholders and systems."
  data:
  - name: "noticeNumber"
    type: "String"
  - name: "status"
    type: "ChangeStatus"
  - name: "issuanceDate"
    type: "Date"
  relations:
  - name: "changeOrder"
    type: "ChangeOrder"
    multiplicity: "ManyToOne"
  - name: "recipients"
    type: "Stakeholder"
    multiplicity: "ManyToMany"
- name: "Workflow"
  description: "Defined sequence of steps used to route items for review and approval."
  data:
  - name: "name"
    type: "String"
  - name: "workflowType"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "steps"
    type: "WorkflowStep"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "relatedChangeRequests"
    type: "ChangeRequest"
    multiplicity: "OneToMany"
  - name: "relatedChangeOrders"
    type: "ChangeOrder"
    multiplicity: "OneToMany"
- name: "WorkflowStep"
  description: "Actionable stage in a workflow with sequencing and approval requirements."
  data:
  - name: "name"
    type: "String"
  - name: "sequence"
    type: "Integer"
  - name: "requiredApprovals"
    type: "Integer"
  relations:
  - name: "workflow"
    type: "Workflow"
    multiplicity: "ManyToOne"
- name: "Approval"
  description: "Decision record capturing reviewer outcome, comments, and date."
  data:
  - name: "decision"
    type: "ApprovalStatus"
  - name: "decisionDate"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "approver"
    type: "Stakeholder"
    multiplicity: "ManyToOne"
  - name: "changeRequest"
    type: "ChangeRequest"
    multiplicity: "ManyToOne"
  - name: "changeOrder"
    type: "ChangeOrder"
    multiplicity: "ManyToOne"
  - name: "documentRevision"
    type: "DocumentRevision"
    multiplicity: "ManyToOne"
  - name: "requirement"
    type: "Requirement"
    multiplicity: "ManyToOne"
  - name: "deviation"
    type: "Deviation"
    multiplicity: "ManyToOne"
  - name: "waiver"
    type: "Waiver"
    multiplicity: "ManyToOne"
  - name: "capa"
    type: "CAPA"
    multiplicity: "ManyToOne"
- name: "Stakeholder"
  description: "Individual responsible for reviewing, approving, or executing PLM\
    \ activities."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "role"
    type: "String"
  - name: "contact"
    type: "Contact"
  relations:
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "ManyToMany"
- name: "Supplier"
  description: "External party providing materials, components, or services under\
    \ controlled quality agreements."
  data:
  - name: "name"
    type: "String"
  - name: "supplierType"
    type: "SupplierType"
  - name: "rating"
    type: "Integer"
  relations:
  - name: "enterprises"
    type: "Enterprise"
    multiplicity: "ManyToMany"
  - name: "parts"
    type: "Part"
    multiplicity: "ManyToMany"
  - name: "complianceDeclarations"
    type: "ComplianceDeclaration"
    multiplicity: "OneToMany"
- name: "Material"
  description: "Physical substance used in parts with defined properties and standards."
  data:
  - name: "name"
    type: "String"
  - name: "materialType"
    type: "MaterialType"
  - name: "density"
    type: "Measurement"
  relations:
  - name: "parts"
    type: "Part"
    multiplicity: "ManyToMany"
  - name: "standards"
    type: "Standard"
    multiplicity: "ManyToMany"
- name: "ComplianceDeclaration"
  description: "Assertion of conformity for a part or material against specific regulations."
  data:
  - name: "declarationNumber"
    type: "String"
  - name: "complianceStatus"
    type: "ComplianceStatus"
  - name: "assessmentDate"
    type: "Date"
  relations:
  - name: "part"
    type: "Part"
    multiplicity: "ManyToOne"
  - name: "regulation"
    type: "Regulation"
    multiplicity: "ManyToOne"
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "DocumentRevision"
    multiplicity: "ManyToMany"
- name: "Standard"
  description: "Voluntary consensus or company specification governing design, documentation,\
    \ or testing."
  data:
  - name: "code"
    type: "String"
  - name: "title"
    type: "String"
  - name: "organization"
    type: "String"
  relations:
  - name: "products"
    type: "Product"
    multiplicity: "ManyToMany"
  - name: "materials"
    type: "Material"
    multiplicity: "ManyToMany"
- name: "Regulation"
  description: "Mandatory rule or directive with jurisdictional scope that impacts\
    \ product compliance."
  data:
  - name: "code"
    type: "String"
  - name: "title"
    type: "String"
  - name: "jurisdiction"
    type: "String"
  relations:
  - name: "complianceDeclarations"
    type: "ComplianceDeclaration"
    multiplicity: "OneToMany"
- name: "Deviation"
  description: "Authorized temporary departure from a requirement for a specific scope\
    \ or duration."
  data:
  - name: "deviationNumber"
    type: "String"
  - name: "description"
    type: "String"
  - name: "status"
    type: "DeviationStatus"
  - name: "validThrough"
    type: "Date"
  relations:
  - name: "partRevision"
    type: "PartRevision"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "Waiver"
  description: "Permanent acceptance of a nonconformance to allow use-as-is with recorded\
    \ justification."
  data:
  - name: "waiverNumber"
    type: "String"
  - name: "justification"
    type: "String"
  - name: "status"
    type: "WaiverStatus"
  - name: "validThrough"
    type: "Date"
  relations:
  - name: "partRevision"
    type: "PartRevision"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "Nonconformance"
  description: "Recorded failure to meet a specified requirement discovered during\
    \ inspection or test."
  data:
  - name: "recordNumber"
    type: "String"
  - name: "severity"
    type: "RiskSeverity"
  - name: "discoveredDate"
    type: "Date"
  - name: "status"
    type: "NonconformanceStatus"
  relations:
  - name: "partRevision"
    type: "PartRevision"
    multiplicity: "ManyToOne"
  - name: "correctiveActions"
    type: "CAPA"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "DocumentRevision"
    multiplicity: "ManyToMany"
- name: "CAPA"
  description: "Corrective and preventive action plan addressing root cause and effectiveness."
  data:
  - name: "actionNumber"
    type: "String"
  - name: "actionType"
    type: "CAPAType"
  - name: "status"
    type: "CAPAStatus"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "nonconformance"
    type: "Nonconformance"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "RiskAssessment"
  description: "Evaluation of potential hazards with severity and probability scoring\
    \ and mitigation."
  data:
  - name: "name"
    type: "String"
  - name: "severity"
    type: "RiskSeverity"
  - name: "probability"
    type: "RiskProbability"
  - name: "riskLevel"
    type: "Integer"
  - name: "mitigation"
    type: "String"
  relations:
  - name: "productRevision"
    type: "ProductRevision"
    multiplicity: "ManyToOne"
  - name: "changeOrder"
    type: "ChangeOrder"
    multiplicity: "ManyToOne"
- name: "FMEAFunction"
  description: "Function within an FMEA analysis with calculated risk priority and\
    \ controls."
  data:
  - name: "functionName"
    type: "String"
  - name: "severity"
    type: "RiskSeverity"
  - name: "occurrence"
    type: "Integer"
  - name: "detection"
    type: "Integer"
  - name: "rpn"
    type: "Integer"
  relations:
  - name: "productRevision"
    type: "ProductRevision"
    multiplicity: "ManyToOne"
- name: "ReleasePackage"
  description: "Aggregation of artifacts approved for release, including changes and\
    \ documentation."
  data:
  - name: "packageNumber"
    type: "String"
  - name: "status"
    type: "ReleaseStatus"
  - name: "releasedDate"
    type: "Date"
  relations:
  - name: "productRevision"
    type: "ProductRevision"
    multiplicity: "ManyToOne"
  - name: "changeOrders"
    type: "ChangeOrder"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "DocumentRevision"
    multiplicity: "ManyToMany"
- name: "Baseline"
  description: "Frozen snapshot capturing a coherent set of product, part, and document\
    \ revisions."
  data:
  - name: "name"
    type: "String"
  - name: "createdDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "productRevision"
    type: "ProductRevision"
    multiplicity: "ManyToOne"
  - name: "partRevisions"
    type: "PartRevision"
    multiplicity: "ManyToMany"
  - name: "documentRevisions"
    type: "DocumentRevision"
    multiplicity: "ManyToMany"
- name: "EffectivityRule"
  description: "Rule defining when a configuration or change is valid based on time\
    \ or serial usage."
  data:
  - name: "ruleName"
    type: "String"
  - name: "effectivityType"
    type: "EffectivityType"
  - name: "effectivityRange"
    type: "EffectivityRange"
  relations:
  - name: "productRevision"
    type: "ProductRevision"
    multiplicity: "ManyToOne"
  - name: "partRevision"
    type: "PartRevision"
    multiplicity: "ManyToOne"
- name: "ConfigurationItem"
  description: "Baseline-managed item used to control product configuration and traceability."
  data:
  - name: "name"
    type: "String"
  - name: "ciType"
    type: "ConfigurationItemType"
  - name: "identifier"
    type: "String"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "baselines"
    type: "Baseline"
    multiplicity: "ManyToMany"
  - name: "relatedItems"
    type: "ConfigurationItem"
    multiplicity: "ManyToMany"
- name: "ManufacturingProcessPlan"
  description: "Defined sequence of manufacturing operations and resources to build\
    \ a product or part."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "planType"
    type: "ProcessPlanType"
  relations:
  - name: "productRevision"
    type: "ProductRevision"
    multiplicity: "ManyToOne"
  - name: "operations"
    type: "Operation"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "DocumentRevision"
    multiplicity: "ManyToMany"
- name: "Operation"
  description: "Executable manufacturing step with defined sequence, inputs, and tooling."
  data:
  - name: "name"
    type: "String"
  - name: "sequence"
    type: "Integer"
  - name: "workInstructions"
    type: "String"
  relations:
  - name: "processPlan"
    type: "ManufacturingProcessPlan"
    multiplicity: "ManyToOne"
  - name: "requiredTools"
    type: "Tooling"
    multiplicity: "ManyToMany"
  - name: "consumedPartRevisions"
    type: "PartRevision"
    multiplicity: "ManyToMany"
- name: "Tooling"
  description: "Reusable tool, fixture, or gauge required to execute specific manufacturing\
    \ operations."
  data:
  - name: "name"
    type: "String"
  - name: "toolNumber"
    type: "String"
  - name: "toolType"
    type: "String"
  relations:
  - name: "operations"
