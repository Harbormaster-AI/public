---
metadata:
  name: "Quote Management Capabilities Model"
  description: "Canonical capability model for creating, pricing, approving, and managing\
    \ commercial quotes across products and services."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Sales & CRM"
  type: "Capability"
  domain: "Quote Management"
entities:
- name: "Quote"
  description: "Commercial offer delivered to a buying party including configured\
    \ items, prices, terms, and approval state."
  data:
  - name: "quoteNumber"
    type: "String"
  - name: "status"
    type: "QuoteStatus"
  - name: "issueDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "pricingMethod"
    type: "PricingMethod"
  - name: "currency"
    type: "String"
  - name: "totalListAmount"
    type: "Money"
  - name: "totalDiscountAmount"
    type: "Money"
  - name: "totalTaxAmount"
    type: "Money"
  - name: "totalNetAmount"
    type: "Money"
  - name: "notes"
    type: "String"
  relations:
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "primaryContact"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "salesRep"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "salesChannel"
    type: "SalesChannel"
    multiplicity: "ManyToOne"
  - name: "priceList"
    type: "PriceList"
    multiplicity: "ManyToOne"
  - name: "opportunity"
    type: "SalesOpportunity"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "QuoteItem"
    multiplicity: "OneToMany"
  - name: "adjustments"
    type: "QuoteAdjustment"
    multiplicity: "OneToMany"
  - name: "taxes"
    type: "TaxLine"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "QuoteApproval"
    multiplicity: "OneToMany"
  - name: "terms"
    type: "QuoteTerm"
    multiplicity: "OneToMany"
  - name: "versions"
    type: "QuoteVersion"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "QuoteAttachment"
    multiplicity: "OneToMany"
- name: "QuoteItem"
  description: "Line within a quote representing a specific product or service configuration\
    \ and its pricing."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "quantity"
    type: "Quantity"
  - name: "listPrice"
    type: "Money"
  - name: "unitPrice"
    type: "Money"
  - name: "discountAmount"
    type: "Money"
  - name: "netAmount"
    type: "Money"
  - name: "chargeType"
    type: "ChargeType"
  - name: "lineStatus"
    type: "LineStatus"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
  - name: "productOffering"
    type: "ProductOffering"
    multiplicity: "ManyToOne"
  - name: "parentItem"
    type: "QuoteItem"
    multiplicity: "ManyToOne"
  - name: "childItems"
    type: "QuoteItem"
    multiplicity: "OneToMany"
  - name: "configurationSelections"
    type: "ConfigurationSelection"
    multiplicity: "OneToMany"
  - name: "taxes"
    type: "TaxLine"
    multiplicity: "OneToMany"
  - name: "adjustments"
    type: "QuoteAdjustment"
    multiplicity: "OneToMany"
- name: "CustomerAccount"
  description: "Organization or individual to whom the quote is presented and who\
    \ may purchase."
  data:
  - name: "name"
    type: "String"
  - name: "accountNumber"
    type: "String"
  - name: "segment"
    type: "String"
  - name: "billingAddress"
    type: "Address"
  - name: "shippingAddress"
    type: "Address"
  relations:
  - name: "contacts"
    type: "Contact"
    multiplicity: "OneToMany"
  - name: "quotes"
    type: "Quote"
    multiplicity: "OneToMany"
  - name: "opportunities"
    type: "SalesOpportunity"
    multiplicity: "OneToMany"
- name: "Contact"
  description: "Person associated with a customer account involved in the quote process."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "role"
    type: "PartyRoleType"
  relations:
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "quoteParticipations"
    type: "QuoteParticipant"
    multiplicity: "OneToMany"
- name: "QuoteParticipant"
  description: "Association between a quote and a contact, capturing the contact's\
    \ role in the transaction."
  data:
  - name: "role"
    type: "PartyRoleType"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "Seller"
  description: "Internal or partner salesperson responsible for preparing and negotiating\
    \ the quote."
  data:
  - name: "name"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "quotes"
    type: "Quote"
    multiplicity: "OneToMany"
- name: "SalesChannel"
  description: "Route-to-market through which the quote is created and managed."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  relations:
  - name: "quotes"
    type: "Quote"
    multiplicity: "OneToMany"
- name: "SalesOpportunity"
  description: "Sales engagement context that may generate one or more quotes."
  data:
  - name: "name"
    type: "String"
  - name: "stage"
    type: "String"
  - name: "expectedCloseDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  relations:
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "quotes"
    type: "Quote"
    multiplicity: "OneToMany"
- name: "ProductOffering"
  description: "Marketable product or service that can be quoted."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "productType"
    type: "ProductType"
  - name: "unitOfMeasure"
    type: "String"
  - name: "defaultTermMonths"
    type: "Integer"
  relations:
  - name: "priceEntries"
    type: "PriceListEntry"
    multiplicity: "OneToMany"
  - name: "quoteItems"
    type: "QuoteItem"
    multiplicity: "OneToMany"
  - name: "configurationSelections"
    type: "ConfigurationSelection"
    multiplicity: "OneToMany"
- name: "PriceList"
  description: "Catalog of prices applied when evaluating a quote."
  data:
  - name: "name"
    type: "String"
  - name: "currency"
    type: "String"
  - name: "effectivePeriod"
    type: "DateRange"
  - name: "description"
    type: "String"
  relations:
  - name: "entries"
    type: "PriceListEntry"
    multiplicity: "OneToMany"
  - name: "quotes"
    type: "Quote"
    multiplicity: "OneToMany"
- name: "PriceListEntry"
  description: "Price for a specific product offering within a price list."
  data:
  - name: "listPrice"
    type: "Money"
  - name: "chargeType"
    type: "ChargeType"
  - name: "minimumQuantity"
    type: "Decimal"
  - name: "maximumQuantity"
    type: "Decimal"
  relations:
  - name: "priceList"
    type: "PriceList"
    multiplicity: "ManyToOne"
  - name: "productOffering"
    type: "ProductOffering"
    multiplicity: "ManyToOne"
- name: "QuoteAdjustment"
  description: "Manual or rule-based price component applied to a quote or quote item."
  data:
  - name: "componentType"
    type: "PriceComponentType"
  - name: "method"
    type: "DiscountType"
  - name: "reason"
    type: "AdjustmentReason"
  - name: "rate"
    type: "Percentage"
  - name: "amount"
    type: "Money"
  - name: "description"
    type: "String"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
  - name: "quoteItem"
    type: "QuoteItem"
    multiplicity: "ManyToOne"
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
- name: "TaxLine"
  description: "Calculated tax applied at header or line level within a quote."
  data:
  - name: "taxType"
    type: "TaxType"
  - name: "rate"
    type: "Percentage"
  - name: "amount"
    type: "Money"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
  - name: "quoteItem"
    type: "QuoteItem"
    multiplicity: "ManyToOne"
  - name: "jurisdiction"
    type: "TaxJurisdiction"
    multiplicity: "ManyToOne"
- name: "TaxJurisdiction"
  description: "Geographic or legal area used to determine applicable tax rules."
  data:
  - name: "name"
    type: "String"
  - name: "country"
    type: "String"
  - name: "region"
    type: "String"
  - name: "city"
    type: "String"
  - name: "postalCodePattern"
    type: "String"
  relations:
  - name: "taxRates"
    type: "TaxRateDefinition"
    multiplicity: "OneToMany"
- name: "TaxRateDefinition"
  description: "Effective tax rate for a jurisdiction and tax type."
  data:
  - name: "taxType"
    type: "TaxType"
  - name: "rate"
    type: "Percentage"
  - name: "effectivePeriod"
    type: "DateRange"
  - name: "productCategory"
    type: "String"
  relations:
  - name: "jurisdiction"
    type: "TaxJurisdiction"
    multiplicity: "ManyToOne"
- name: "QuoteTerm"
  description: "Commercial terms and conditions associated with a quote."
  data:
  - name: "termType"
    type: "TermType"
  - name: "text"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
- name: "QuoteApproval"
  description: "Approval record documenting review and authorization of a quote."
  data:
  - name: "approverName"
    type: "String"
  - name: "approverRole"
    type: "String"
  - name: "status"
    type: "ApprovalStatus"
  - name: "decidedAt"
    type: "Date"
  - name: "comment"
    type: "String"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
- name: "QuoteVersion"
  description: "Snapshot of a quote at a specific point in time for auditing and comparison."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "changeNote"
    type: "String"
  - name: "createdAt"
    type: "Date"
  - name: "totalNetAmount"
    type: "Money"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
- name: "QuoteAttachment"
  description: "Supporting document or artifact associated with a quote."
  data:
  - name: "fileName"
    type: "String"
  - name: "contentType"
    type: "String"
  - name: "url"
    type: "String"
  - name: "uploadedAt"
    type: "Date"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
- name: "ConfigurationSelection"
  description: "Chosen option or attribute value affecting the configuration and price\
    \ of a quoted item."
  data:
  - name: "name"
    type: "String"
  - name: "selectedValue"
    type: "String"
  - name: "priceImpact"
    type: "Money"
  relations:
  - name: "quoteItem"
    type: "QuoteItem"
    multiplicity: "ManyToOne"
  - name: "productOffering"
    type: "ProductOffering"
    multiplicity: "ManyToOne"
- name: "Promotion"
  description: "Marketing incentive or offer that can be applied to quotes or items."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "adjustments"
    type: "QuoteAdjustment"
    multiplicity: "OneToMany"
enums:
- name: "QuoteStatus"
  description: "Lifecycle states a quote can progress through."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Approved"
  - name: "Rejected"
  - name: "Presented"
  - name: "Accepted"
  - name: "Converted"
  - name: "Expired"
  - name: "Withdrawn"
  - name: "Cancelled"
- name: "ApprovalStatus"
  description: "Disposition of an approval decision related to a quote."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
  - name: "Reassigned"
- name: "PriceComponentType"
  description: "Categories of price components that adjust totals."
  data:
  - name: "BasePrice"
  - name: "Discount"
  - name: "Surcharge"
  - name: "Fee"
  - name: "Shipping"
  - name: "Tax"
- name: "DiscountType"
  description: "Methods by which a discount is calculated or granted."
  data:
  - name: "Percentage"
  - name: "Amount"
  - name: "Volume"
  - name: "Promotion"
  - name: "Manual"
- name: "TermType"
  description: "Types of commercial terms associated with a quote."
  data:
  - name: "Payment"
  - name: "Delivery"
  - name: "Warranty"
  - name: "ServiceLevel"
  - name: "Cancellation"
  - name: "Renewal"
- name: "ChargeType"
  description: "Nature of the charge for a quoted item."
  data:
  - name: "OneTime"
  - name: "Recurring"
  - name: "Usage"
- name: "PartyRoleType"
  description: "Roles played by contacts involved in a quote."
  data:
  - name: "Buyer"
  - name: "DecisionMaker"
  - name: "Influencer"
  - name: "Signatory"
  - name: "Billing"
  - name: "Shipping"
- name: "LineStatus"
  description: "Processing state of a quote line item."
  data:
  - name: "Open"
  - name: "Locked"
  - name: "Cancelled"
- name: "ProductType"
  description: "Classification of what is being quoted."
  data:
  - name: "Goods"
  - name: "Service"
  - name: "Subscription"
  - name: "Bundle"
- name: "TaxType"
  description: "Types of indirect taxes applicable to quotes."
  data:
  - name: "VAT"
  - name: "SalesTax"
  - name: "GST"
  - name: "HST"
  - name: "PST"
  - name: "Duty"
- name: "ChannelType"
  description: "Route-to-market by which a quote is transacted."
  data:
  - name: "Direct"
  - name: "Online"
  - name: "Partner"
  - name: "Reseller"
  - name: "Marketplace"
- name: "PricingMethod"
  description: "Basis used to derive prices on a quote."
  data:
  - name: "ListPrice"
  - name: "ContractPrice"
  - name: "Negotiated"
  - name: "Custom"
- name: "AdjustmentReason"
  description: "Business rationale for applying a price adjustment."
  data:
  - name: "Negotiation"
  - name: "Promotion"
  - name: "Rounding"
  - name: "TaxExemption"
  - name: "Shipping"
  - name: "ServiceFee"
valueObjects:
- name: "Money"
  description: "Monetary value expressed in a specific currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address used for billing, shipping, or taxation."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "region"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "DateRange"
  description: "Time period bounded by a start and end date."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "Percentage"
  description: "Percentage value represented as a decimal fraction of 100."
  data:
  - name: "value"
    type: "Decimal"
- name: "Quantity"
  description: "Measured amount paired with a unit."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "unit"
    type: "String"
