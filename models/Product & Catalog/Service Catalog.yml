---
metadata:
  name: "Service Catalog Capabilities Model"
  description: "Domain model defining capabilities and data structures for managing\
    \ a Service Catalog, including service definitions, versions, offerings, bundles,\
    \ governance, and publication."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Product & Catalog"
  type: "Capability"
  domain: "Service Catalog"
entities:
- name: "SvcProvider"
  description: "Organization that owns, governs, and maintains a portfolio of services."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "website"
    type: "String"
  - name: "supportEmail"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  relations:
  - name: "portfolios"
    type: "ServicePortfolio"
    multiplicity: "OneToMany"
  - name: "channels"
    type: "SalesChannel"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "ServicePortfolio"
  description: "Curated collection of related services, categories, and offerings\
    \ managed within a given planning horizon."
  data:
  - name: "name"
    type: "String"
  - name: "fiscalYear"
    type: "Integer"
  - name: "status"
    type: "PublicationStatus"
  - name: "summary"
    type: "LocalizedString"
  relations:
  - name: "provider"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
  - name: "categories"
    type: "ServiceCategory"
    multiplicity: "OneToMany"
  - name: "services"
    type: "ServiceDefinition"
    multiplicity: "OneToMany"
- name: "ServiceCategory"
  description: "Hierarchical classification used to organize services for discovery\
    \ and governance."
  data:
  - name: "name"
    type: "String"
  - name: "categoryCode"
    type: "String"
  - name: "summary"
    type: "String"
  - name: "displayOrder"
    type: "Integer"
  relations:
  - name: "portfolio"
    type: "ServicePortfolio"
    multiplicity: "ManyToOne"
  - name: "parentCategory"
    type: "ServiceCategory"
    multiplicity: "ManyToOne"
  - name: "subcategories"
    type: "ServiceCategory"
    multiplicity: "OneToMany"
  - name: "services"
    type: "ServiceDefinition"
    multiplicity: "OneToMany"
- name: "ServiceDefinition"
  description: "Canonical description of a service independent of commercial packaging."
  data:
  - name: "name"
    type: "String"
  - name: "shortCode"
    type: "String"
  - name: "serviceType"
    type: "ServiceType"
  - name: "fulfillmentMode"
    type: "FulfillmentMode"
  - name: "defaultActivationTime"
    type: "Duration"
  relations:
  - name: "portfolio"
    type: "ServicePortfolio"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "ServiceCategory"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "ServiceVersion"
    multiplicity: "OneToMany"
- name: "ServiceVersion"
  description: "Versioned instance of a service capturing publish state, availability,\
    \ options, SLAs, and specifications."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "publicationStatus"
    type: "PublicationStatus"
  - name: "generalAvailabilityDate"
    type: "Date"
  - name: "endOfLifeDate"
    type: "Date"
  - name: "availabilityScope"
    type: "AvailabilityScope"
  - name: "descriptionText"
    type: "LocalizedString"
  relations:
  - name: "serviceDefinition"
    type: "ServiceDefinition"
    multiplicity: "ManyToOne"
  - name: "specifications"
    type: "ServiceSpecification"
    multiplicity: "OneToMany"
  - name: "options"
    type: "ServiceOption"
    multiplicity: "OneToMany"
  - name: "slas"
    type: "ServiceLevel"
    multiplicity: "OneToMany"
  - name: "offerings"
    type: "ServiceOffering"
    multiplicity: "OneToMany"
  - name: "dependencies"
    type: "ServiceRelationship"
    multiplicity: "OneToMany"
  - name: "eligibilityRules"
    type: "EligibilityRule"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "ServiceSpecification"
  description: "Structured technical or operational parameters that define how a service\
    \ is delivered."
  data:
  - name: "name"
    type: "String"
  - name: "specificationType"
    type: "String"
  - name: "configSchemaUri"
    type: "Link"
  - name: "changeImpact"
    type: "String"
  relations:
  - name: "serviceVersion"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
- name: "ServiceOffering"
  description: "Market-facing packaging of a service version for sale or subscription\
    \ through specific channels."
  data:
  - name: "name"
    type: "String"
  - name: "offerCode"
    type: "String"
  - name: "publicationStatus"
    type: "PublicationStatus"
  - name: "defaultTerm"
    type: "Duration"
  - name: "listPrice"
    type: "Money"
  relations:
  - name: "serviceVersion"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
  - name: "channels"
    type: "SalesChannel"
    multiplicity: "ManyToMany"
  - name: "options"
    type: "ServiceOption"
    multiplicity: "ManyToMany"
  - name: "slas"
    type: "ServiceLevel"
    multiplicity: "OneToMany"
  - name: "bundles"
    type: "ServiceBundle"
    multiplicity: "ManyToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "eligibilityRules"
    type: "EligibilityRule"
    multiplicity: "OneToMany"
- name: "ServiceBundle"
  description: "Logical grouping of service offerings that can be marketed and sold\
    \ together."
  data:
  - name: "name"
    type: "String"
  - name: "bundleCode"
    type: "String"
  - name: "displayOrder"
    type: "Integer"
  relations:
  - name: "components"
    type: "ServiceOffering"
    multiplicity: "ManyToMany"
  - name: "referencedByOfferings"
    type: "ServiceOffering"
    multiplicity: "ManyToMany"
- name: "ServiceOption"
  description: "Selectable add-on, feature, or tier that augments a service."
  data:
  - name: "name"
    type: "String"
  - name: "optionCode"
    type: "String"
  - name: "optionType"
    type: "OptionType"
  - name: "isRequired"
    type: "Boolean"
  - name: "descriptionText"
    type: "LocalizedString"
  - name: "oneTimeFee"
    type: "Money"
  - name: "recurringFee"
    type: "Money"
  relations:
  - name: "serviceVersion"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
  - name: "offerings"
    type: "ServiceOffering"
    multiplicity: "ManyToMany"
- name: "SalesChannel"
  description: "Route-to-market through which service offerings are discovered and\
    \ purchased."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "region"
    type: "String"
  - name: "website"
    type: "String"
  - name: "isDirect"
    type: "Boolean"
  relations:
  - name: "provider"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
  - name: "offerings"
    type: "ServiceOffering"
    multiplicity: "ManyToMany"
- name: "EligibilityRule"
  description: "Constraint defining who may buy, use, or see a service based on policy\
    \ or segmentation."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "EligibilityType"
  - name: "expression"
    type: "ConstraintExpression"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "serviceVersion"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
  - name: "offering"
    type: "ServiceOffering"
    multiplicity: "ManyToOne"
- name: "ServiceLevel"
  description: "Quantitative objective defining expected service performance and any\
    \ associated credits."
  data:
  - name: "name"
    type: "String"
  - name: "slaType"
    type: "SLAType"
  - name: "targetValue"
    type: "Decimal"
  - name: "targetUnit"
    type: "String"
  - name: "measurementWindow"
    type: "Duration"
  - name: "creditsPercentage"
    type: "Decimal"
  relations:
  - name: "serviceVersion"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
  - name: "offering"
    type: "ServiceOffering"
    multiplicity: "ManyToOne"
- name: "ServiceRelationship"
  description: "Directed relationship between service versions expressing dependencies\
    \ or conflicts."
  data:
  - name: "relationshipType"
    type: "DependencyType"
  - name: "notes"
    type: "String"
  relations:
  - name: "source"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
  - name: "target"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
- name: "Document"
  description: "External artifact that provides reference materials for providers,\
    \ services, and offerings."
  data:
  - name: "title"
    type: "String"
  - name: "documentType"
    type: "DocumentType"
  - name: "uri"
    type: "Link"
  - name: "locale"
    type: "String"
  relations:
  - name: "provider"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
  - name: "serviceVersion"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
  - name: "offering"
    type: "ServiceOffering"
    multiplicity: "ManyToOne"
enums:
- name: "ServiceType"
  description: "High-level classification of the nature of the service."
  data:
  - name: "ManagedService"
  - name: "ProfessionalService"
  - name: "SupportService"
  - name: "SubscriptionService"
  - name: "PlatformService"
  - name: "IntegrationService"
  - name: "NetworkService"
  - name: "CloudService"
- name: "FulfillmentMode"
  description: "How the service is provisioned and activated."
  data:
  - name: "Automated"
  - name: "Manual"
  - name: "Hybrid"
- name: "PublicationStatus"
  description: "Governance status used to control catalog visibility and lifecycle."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Approved"
  - name: "Published"
  - name: "Deprecated"
  - name: "Retired"
- name: "ChannelType"
  description: "Type of sales or distribution channel used to reach customers."
  data:
  - name: "Direct"
  - name: "Partner"
  - name: "Marketplace"
  - name: "SelfServicePortal"
  - name: "InsideSales"
  - name: "FieldSales"
- name: "OptionType"
  description: "Category of selectable option provided with a service."
  data:
  - name: "AddOn"
  - name: "FeatureToggle"
  - name: "CapacityTier"
  - name: "SupportLevel"
  - name: "DataPack"
- name: "DependencyType"
  description: "Nature of the relationship between two service versions."
  data:
  - name: "Requires"
  - name: "ConflictsWith"
  - name: "Replaces"
  - name: "BundlesWith"
  - name: "Extends"
- name: "SLAType"
  description: "Metric type used to quantify service performance."
  data:
  - name: "ResponseTime"
  - name: "ResolutionTime"
  - name: "Availability"
  - name: "Throughput"
  - name: "Latency"
- name: "AvailabilityScope"
  description: "Geographic or market scope in which the service is available."
  data:
  - name: "Global"
  - name: "Regional"
  - name: "Country"
  - name: "MarketSegment"
- name: "DocumentType"
  description: "Document classification to guide usage and placement."
  data:
  - name: "SpecSheet"
  - name: "TermsAndConditions"
  - name: "UserGuide"
  - name: "ArchitectureDiagram"
  - name: "Image"
  - name: "Brochure"
- name: "EligibilityType"
  description: "Dimension against which eligibility rules are defined."
  data:
  - name: "CustomerSegment"
  - name: "AccountTier"
  - name: "Geography"
  - name: "Industry"
  - name: "Compliance"
valueObjects:
- name: "Money"
  description: "Monetary value consisting of amount and currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Duration"
  description: "Length of time expressed as a numeric value and unit."
  data:
  - name: "value"
    type: "Integer"
  - name: "unit"
    type: "String"
- name: "LocalizedString"
  description: "Human-readable text paired with its locale."
  data:
  - name: "locale"
    type: "String"
  - name: "value"
    type: "String"
- name: "ConstraintExpression"
  description: "Machine-readable expression defining a constraint or rule."
  data:
  - name: "language"
    type: "String"
  - name: "expression"
    type: "String"
- name: "Link"
  description: "Reference to an external resource using a URI."
  data:
  - name: "uri"
    type: "String"
  - name: "title"
    type: "String"
