---
metadata:
  name: "Product Catalog HCIDL"
  description: "Canonical capabilities model for authoring, organizing, governing,\
    \ and publishing products and categories across channels."
  version: "1.0.0"
  industry: "Retail & eCommerce"
  category: "Product & Catalog"
  type: "Capability"
  domain: "Product Catalog"
entities:
- name: "Catalog"
  description: "Logical collection of categories and products curated for a market,\
    \ brand, or channel strategy."
  data:
  - name: "name"
    type: "String"
  - name: "catalogCode"
    type: "String"
  - name: "defaultLanguage"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "versions"
    type: "CatalogVersion"
    multiplicity: "OneToMany"
  - name: "rootCategories"
    type: "Category"
    multiplicity: "OneToMany"
  - name: "salesChannels"
    type: "SalesChannel"
    multiplicity: "ManyToMany"
- name: "CatalogVersion"
  description: "Governed snapshot of a catalog for staging, approvals, and time-bound\
    \ publication."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "status"
    type: "PublicationStatus"
  - name: "validPeriod"
    type: "DateRange"
  - name: "notes"
    type: "String"
  relations:
  - name: "catalog"
    type: "Catalog"
    multiplicity: "ManyToOne"
  - name: "categories"
    type: "Category"
    multiplicity: "OneToMany"
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
  - name: "channelAssignments"
    type: "ChannelAssignment"
    multiplicity: "OneToMany"
  - name: "attributeDefinitions"
    type: "AttributeDefinition"
    multiplicity: "OneToMany"
- name: "SalesChannel"
  description: "Distribution or presentation venue where catalog content is published\
    \ and merchandised."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "region"
    type: "String"
  - name: "locale"
    type: "String"
  relations:
  - name: "catalogs"
    type: "Catalog"
    multiplicity: "ManyToMany"
  - name: "channelAssignments"
    type: "ChannelAssignment"
    multiplicity: "OneToMany"
- name: "Category"
  description: "Hierarchical grouping used to organize and browse products in the\
    \ catalog."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "slug"
    type: "String"
  - name: "description"
    type: "String"
  - name: "displayOrder"
    type: "Integer"
  - name: "isActive"
    type: "Boolean"
  - name: "seo"
    type: "SeoMetadata"
  relations:
  - name: "catalogVersion"
    type: "CatalogVersion"
    multiplicity: "ManyToOne"
  - name: "parentCategory"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "Category"
    multiplicity: "OneToMany"
  - name: "products"
    type: "Product"
    multiplicity: "ManyToMany"
  - name: "mediaAssets"
    type: "MediaAsset"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
- name: "Brand"
  description: "Market-facing brand identity under which products are positioned and\
    \ sold."
  data:
  - name: "name"
    type: "String"
  - name: "owner"
    type: "String"
  - name: "website"
    type: "Url"
  relations:
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
- name: "Product"
  description: "Managed product master representing a sellable item or a reference\
    \ for its variants."
  data:
  - name: "sku"
    type: "SKU"
  - name: "name"
    type: "String"
  - name: "productType"
    type: "ProductType"
  - name: "shortDescription"
    type: "String"
  - name: "longDescription"
    type: "String"
  - name: "brandName"
    type: "String"
  - name: "defaultUnitOfMeasure"
    type: "UnitOfMeasure"
  - name: "lifecycleStatus"
    type: "LifecycleStatus"
  - name: "taxCategory"
    type: "TaxCategory"
  - name: "recommendedRetailPrice"
    type: "Money"
  - name: "releaseDate"
    type: "Date"
  - name: "discontinueDate"
    type: "Date"
  - name: "seo"
    type: "SeoMetadata"
  relations:
  - name: "catalogVersion"
    type: "CatalogVersion"
    multiplicity: "ManyToOne"
  - name: "brand"
    type: "Brand"
    multiplicity: "ManyToOne"
  - name: "categories"
    type: "Category"
    multiplicity: "ManyToMany"
  - name: "mediaAssets"
    type: "MediaAsset"
    multiplicity: "OneToMany"
  - name: "specifications"
    type: "ProductSpecification"
    multiplicity: "OneToMany"
  - name: "variants"
    type: "ProductVariant"
    multiplicity: "OneToMany"
  - name: "associations"
    type: "ProductAssociation"
    multiplicity: "OneToMany"
  - name: "bundle"
    type: "ProductBundle"
    multiplicity: "OneToOne"
  - name: "complianceCertificates"
    type: "ComplianceCertificate"
    multiplicity: "OneToMany"
  - name: "packagingInfo"
    type: "PackagingInfo"
    multiplicity: "OneToOne"
  - name: "channelAssignments"
    type: "ChannelAssignment"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
- name: "ProductVariant"
  description: "Purchasable variation of a product defined by specific option selections."
  data:
  - name: "sku"
    type: "SKU"
  - name: "name"
    type: "String"
  - name: "gtin"
    type: "String"
  - name: "mpn"
    type: "String"
  - name: "isDefault"
    type: "Boolean"
  - name: "weight"
    type: "Weight"
  - name: "dimensions"
    type: "Dimension"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "optionValues"
    type: "OptionValue"
    multiplicity: "OneToMany"
  - name: "mediaAssets"
    type: "MediaAsset"
    multiplicity: "OneToMany"
  - name: "complianceCertificates"
    type: "ComplianceCertificate"
    multiplicity: "OneToMany"
  - name: "packagingInfo"
    type: "PackagingInfo"
    multiplicity: "OneToOne"
  - name: "channelAssignments"
    type: "ChannelAssignment"
    multiplicity: "OneToMany"
- name: "AttributeDefinition"
  description: "Schema definition for managed product or variant attributes and their\
    \ allowed value types."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "AttributeDataType"
  - name: "isVariantDefining"
    type: "Boolean"
  - name: "isRequired"
    type: "Boolean"
  - name: "selectionType"
    type: "OptionSelectionType"
  relations:
  - name: "catalogVersion"
    type: "CatalogVersion"
    multiplicity: "ManyToOne"
  - name: "allowedValues"
    type: "AttributeOption"
    multiplicity: "OneToMany"
  - name: "applicableCategories"
    type: "Category"
    multiplicity: "ManyToMany"
- name: "AttributeOption"
  description: "Predefined selectable value for an attribute definition."
  data:
  - name: "value"
    type: "String"
  - name: "label"
    type: "String"
  - name: "sortOrder"
    type: "Integer"
  - name: "isDeprecated"
    type: "Boolean"
  relations:
  - name: "attribute"
    type: "AttributeDefinition"
    multiplicity: "ManyToOne"
- name: "OptionValue"
  description: "Concrete attribute selection recorded for a product or a variant instance."
  data:
  - name: "attributeCode"
    type: "String"
  - name: "value"
    type: "String"
  relations:
  - name: "attribute"
    type: "AttributeDefinition"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
- name: "ProductSpecification"
  description: "Structured technical characteristic presented as a displayable name-value\
    \ pair."
  data:
  - name: "name"
    type: "String"
  - name: "value"
    type: "String"
  - name: "unit"
    type: "String"
  - name: "displayGroup"
    type: "String"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "MediaAsset"
  description: "Image, video, or rich media resource used to merchandise products\
    \ and categories."
  data:
  - name: "url"
    type: "Url"
  - name: "title"
    type: "String"
  - name: "altText"
    type: "String"
  - name: "mediaType"
    type: "MediaType"
  - name: "sortOrder"
    type: "Integer"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
- name: "DocumentAsset"
  description: "Non-media product collateral such as manuals, datasheets, and warranty\
    \ documents."
  data:
  - name: "url"
    type: "Url"
  - name: "title"
    type: "String"
  - name: "documentType"
    type: "DocumentType"
  - name: "description"
    type: "String"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
- name: "ProductAssociation"
  description: "Directed relationship connecting products for merchandising such as\
    \ upsells and cross-sells."
  data:
  - name: "associationType"
    type: "AssociationType"
  - name: "note"
    type: "String"
  - name: "rank"
    type: "Integer"
  relations:
  - name: "sourceProduct"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "targetProduct"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "ProductBundle"
  description: "Composition rule set for a bundle product and its component items."
  data:
  - name: "name"
    type: "String"
  - name: "bundleCode"
    type: "String"
  - name: "pricingStrategy"
    type: "BundlePricingStrategy"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "components"
    type: "BundleComponent"
    multiplicity: "OneToMany"
- name: "BundleComponent"
  description: "Component line within a bundle defining quantity and optionality constraints."
  data:
  - name: "quantity"
    type: "Decimal"
  - name: "isOptional"
    type: "Boolean"
  - name: "minQuantity"
    type: "Decimal"
  - name: "maxQuantity"
    type: "Decimal"
  relations:
  - name: "bundle"
    type: "ProductBundle"
    multiplicity: "ManyToOne"
  - name: "componentProduct"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "ChannelAssignment"
  description: "Publication record controlling where, when, and how a product or variant\
    \ appears on a channel."
  data:
  - name: "publicationStatus"
    type: "PublicationStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "isFeatured"
    type: "Boolean"
  - name: "displayRank"
    type: "Integer"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
  - name: "salesChannel"
    type: "SalesChannel"
    multiplicity: "ManyToOne"
  - name: "catalogVersion"
    type: "CatalogVersion"
    multiplicity: "ManyToOne"
- name: "PackagingInfo"
  description: "Packaging and shipping characteristics for a product or specific variant."
  data:
  - name: "unitsPerPackage"
    type: "Integer"
  - name: "packageDimensions"
    type: "Dimension"
  - name: "packageWeight"
    type: "Weight"
  - name: "hazardousMaterial"
    type: "Boolean"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
- name: "ComplianceCertificate"
  description: "Regulatory or standards compliance attestation linked to products\
    \ or variants."
  data:
  - name: "certificateCode"
    type: "String"
  - name: "complianceType"
    type: "ComplianceType"
  - name: "issuer"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "documentUrl"
    type: "Url"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
- name: "SearchFacet"
  description: "Faceted navigation rule mapping an attribute to a browse filter with\
    \ display behavior."
  data:
  - name: "name"
    type: "String"
  - name: "attributeCode"
    type: "String"
  - name: "facetType"
    type: "FacetType"
  - name: "isMultiselect"
    type: "Boolean"
  - name: "displayOrder"
    type: "Integer"
  relations:
  - name: "catalogVersion"
    type: "CatalogVersion"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
- name: "Tag"
  description: "Lightweight keyword used for search boosting and editorial curation."
  data:
  - name: "name"
    type: "String"
  - name: "normalizedName"
    type: "String"
  relations:
  - name: "products"
    type: "Product"
    multiplicity: "ManyToMany"
  - name: "categories"
    type: "Category"
    multiplicity: "ManyToMany"
enums:
- name: "ProductType"
  description: "Structural classification describing how a product is modeled and\
    \ sold."
  data:
  - name: "Simple"
  - name: "Variant"
  - name: "Bundle"
  - name: "Service"
  - name: "Virtual"
- name: "LifecycleStatus"
  description: "Commercial readiness and support state of a product through its lifecycle."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Deprecated"
  - name: "Retired"
- name: "PublicationStatus"
  description: "Governance state used to control staging and visibility across channels."
  data:
  - name: "Unpublished"
  - name: "Staged"
  - name: "Published"
  - name: "Archived"
- name: "MediaType"
  description: "Type classification for merchandising media assets."
  data:
  - name: "Image"
  - name: "Video"
  - name: "Document"
  - name: "View360"
- name: "AssociationType"
  description: "Intent of a relationship between two products for merchandising."
  data:
  - name: "CrossSell"
  - name: "UpSell"
  - name: "Accessory"
  - name: "Replacement"
  - name: "Similar"
  - name: "Alternative"
- name: "AttributeDataType"
  description: "Data representation used by a defined attribute."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "RichText"
- name: "OptionSelectionType"
  description: "Selection behavior for attributes with predefined options."
  data:
  - name: "SingleSelect"
  - name: "MultiSelect"
- name: "ChannelType"
  description: "Mode of distribution used to present catalog content to customers."
  data:
  - name: "Online"
  - name: "RetailStore"
  - name: "Marketplace"
  - name: "PartnerPortal"
  - name: "MobileApp"
- name: "FacetType"
  description: "User interface behavior for attribute-based filtering."
  data:
  - name: "Term"
  - name: "Range"
  - name: "Hierarchical"
- name: "ComplianceType"
  description: "Regulatory or standards program under which a product is certified."
  data:
  - name: "CE"
  - name: "RoHS"
  - name: "REACH"
  - name: "FCC"
  - name: "UL"
  - name: "WEEE"
- name: "DocumentType"
  description: "Classification of non-media product documents."
  data:
  - name: "SpecSheet"
  - name: "SafetyDataSheet"
  - name: "InstallationGuide"
  - name: "WarrantyDocument"
  - name: "ComplianceCertificate"
- name: "UnitOfMeasure"
  description: "Default sell or reference unit used for a product."
  data:
  - name: "Each"
  - name: "Box"
  - name: "Case"
  - name: "Meter"
  - name: "Kilogram"
  - name: "Liter"
  - name: "Hour"
- name: "TaxCategory"
  description: "Indirect tax treatment category for catalog pricing display."
  data:
  - name: "Standard"
  - name: "Reduced"
  - name: "Zero"
  - name: "Exempt"
- name: "BundlePricingStrategy"
  description: "Rule determining how a bundle’s sell price is derived."
  data:
  - name: "Inherit"
  - name: "FixedBundlePrice"
  - name: "SumOfComponents"
  - name: "Dynamic"
valueObjects:
- name: "SKU"
  description: "Merchant-assigned stock keeping unit used to reference catalog items."
  data:
  - name: "value"
    type: "String"
- name: "Money"
  description: "Monetary amount represented with decimal precision and an ISO currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Url"
  description: "Web address referencing a resolvable resource."
  data:
  - name: "value"
    type: "String"
- name: "Dimension"
  description: "Physical measurements expressed as width, height, and depth in a single\
    \ unit."
  data:
  - name: "width"
    type: "Decimal"
  - name: "height"
    type: "Decimal"
  - name: "depth"
    type: "Decimal"
  - name: "unit"
    type: "String"
- name: "Weight"
  description: "Mass of an item represented as a numeric value and unit."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "unit"
    type: "String"
- name: "DateRange"
  description: "Time window with inclusive start and end dates."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "SeoMetadata"
  description: "Search engine optimization metadata for catalog content."
  data:
  - name: "metaTitle"
    type: "String"
  - name: "metaDescription"
    type: "String"
  - name: "keywords"
    type: "String"
  - name: "canonicalUrl"
    type: "String"
