---
metadata:
  name: "Configuration Management"
  description: "Canonical HCIDL capabilities model for managing configurable products\
    \ and services, including features, options, rules, and effectivity across catalogs\
    \ and releases."
  version: "1.0.0"
  industry: "Cross-industry"
  category: "Product & Catalog"
  type: "Capability"
  domain: "Configuration Management"
entities:
- name: "ProductCatalog"
  description: "Catalog that organizes products and their configuration models for\
    \ a defined market or channel."
  data:
  - name: "name"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "status"
    type: "CatalogStatus"
  - name: "ownerOrganization"
    type: "String"
  relations:
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
  - name: "releases"
    type: "Release"
    multiplicity: "OneToMany"
- name: "Product"
  description: "Market-facing item that can be configured, sold, or bundled, governed\
    \ by a configuration model."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "shortDescription"
    type: "String"
  - name: "productType"
    type: "ProductType"
  - name: "lifecycleState"
    type: "LifecycleState"
  relations:
  - name: "catalog"
    type: "ProductCatalog"
    multiplicity: "ManyToOne"
  - name: "configurationModel"
    type: "ConfigurationModel"
    multiplicity: "OneToOne"
  - name: "variants"
    type: "ProductVariant"
    multiplicity: "OneToMany"
  - name: "components"
    type: "Component"
    multiplicity: "ManyToMany"
  - name: "compatibilityGroups"
    type: "CompatibilityGroup"
    multiplicity: "OneToMany"
- name: "ConfigurationModel"
  description: "Versioned model that defines features, options, rules, and selection\
    \ behavior for a product."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "isConfigurable"
    type: "Boolean"
  - name: "defaultSelectionStrategy"
    type: "SelectionStrategy"
  - name: "effectiveDate"
    type: "Date"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "features"
    type: "ConfigFeature"
    multiplicity: "OneToMany"
  - name: "optionGroups"
    type: "OptionGroup"
    multiplicity: "OneToMany"
  - name: "rules"
    type: "ConfigurationRule"
    multiplicity: "OneToMany"
  - name: "effectivities"
    type: "EffectivityPeriod"
    multiplicity: "OneToMany"
  - name: "releases"
    type: "Release"
    multiplicity: "ManyToMany"
  - name: "changeRequests"
    type: "ChangeRequest"
    multiplicity: "OneToMany"
- name: "ConfigFeature"
  description: "A configurable characteristic or capability of a product controlling\
    \ how options can be selected."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "featureType"
    type: "FeatureType"
  - name: "mandatory"
    type: "Boolean"
  - name: "minSelections"
    type: "Integer"
  - name: "maxSelections"
    type: "Integer"
  relations:
  - name: "configurationModel"
    type: "ConfigurationModel"
    multiplicity: "ManyToOne"
  - name: "optionGroups"
    type: "OptionGroup"
    multiplicity: "OneToMany"
  - name: "relatedFeatures"
    type: "ConfigFeature"
    multiplicity: "ManyToMany"
- name: "OptionGroup"
  description: "A logical group of selectable options for a feature with shared selection\
    \ constraints."
  data:
  - name: "name"
    type: "String"
  - name: "selectionMode"
    type: "SelectionMode"
  - name: "minSelections"
    type: "Integer"
  - name: "maxSelections"
    type: "Integer"
  - name: "displayOrder"
    type: "Integer"
  relations:
  - name: "feature"
    type: "ConfigFeature"
    multiplicity: "ManyToOne"
  - name: "options"
    type: "Option"
    multiplicity: "OneToMany"
- name: "Option"
  description: "A selectable value or choice that fulfills a feature requirement or\
    \ adds a capability."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "availabilityStatus"
    type: "AvailabilityStatus"
  - name: "isDefault"
    type: "Boolean"
  relations:
  - name: "optionGroup"
    type: "OptionGroup"
    multiplicity: "ManyToOne"
  - name: "compatibilityGroups"
    type: "CompatibilityGroup"
    multiplicity: "ManyToMany"
  - name: "priceAdjustments"
    type: "PriceAdjustment"
    multiplicity: "OneToMany"
  - name: "components"
    type: "Component"
    multiplicity: "ManyToMany"
  - name: "rules"
    type: "ConfigurationRule"
    multiplicity: "ManyToMany"
  - name: "effectivities"
    type: "EffectivityPeriod"
    multiplicity: "ManyToMany"
  - name: "variants"
    type: "ProductVariant"
    multiplicity: "ManyToMany"
- name: "ConfigurationRule"
  description: "Declarative constraint or logic expression that governs valid combinations\
    \ and selections."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "ruleType"
    type: "RuleType"
  - name: "expression"
    type: "RuleExpression"
  - name: "severity"
    type: "RuleSeverity"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "configurationModel"
    type: "ConfigurationModel"
    multiplicity: "ManyToOne"
  - name: "appliesToFeatures"
    type: "ConfigFeature"
    multiplicity: "ManyToMany"
  - name: "appliesToOptions"
    type: "Option"
    multiplicity: "ManyToMany"
  - name: "effectivities"
    type: "EffectivityPeriod"
    multiplicity: "ManyToMany"
- name: "EffectivityPeriod"
  description: "Contextual window defining when and where rules, options, or pricing\
    \ are in force."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "channel"
    type: "ChannelType"
  - name: "market"
    type: "String"
  relations:
  - name: "configurationModel"
    type: "ConfigurationModel"
    multiplicity: "ManyToOne"
  - name: "options"
    type: "Option"
    multiplicity: "ManyToMany"
  - name: "rules"
    type: "ConfigurationRule"
    multiplicity: "ManyToMany"
  - name: "priceAdjustments"
    type: "PriceAdjustment"
    multiplicity: "OneToMany"
- name: "ProductVariant"
  description: "Pre-defined configuration blueprint representing a curated set of\
    \ option selections."
  data:
  - name: "name"
    type: "String"
  - name: "variantCode"
    type: "String"
  - name: "status"
    type: "VariantStatus"
  - name: "summary"
    type: "String"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "selectedOptions"
    type: "Option"
    multiplicity: "ManyToMany"
- name: "ConfigurationSession"
  description: "Interactive configuration record capturing selections, validations,\
    \ and resolution outcomes."
  data:
  - name: "label"
    type: "String"
  - name: "state"
    type: "ConfigurationState"
  - name: "createdOn"
    type: "Date"
  - name: "updatedOn"
    type: "Date"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "selectedOptions"
    type: "Option"
    multiplicity: "ManyToMany"
  - name: "resolvedRules"
    type: "ConfigurationRule"
    multiplicity: "ManyToMany"
  - name: "violations"
    type: "ConstraintViolation"
    multiplicity: "OneToMany"
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
- name: "ConstraintViolation"
  description: "Result of rule evaluation indicating a configuration error or advisory\
    \ message."
  data:
  - name: "message"
    type: "String"
  - name: "severity"
    type: "RuleSeverity"
  relations:
  - name: "configurationSession"
    type: "ConfigurationSession"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "ConfigurationRule"
    multiplicity: "ManyToOne"
  - name: "involvedOptions"
    type: "Option"
    multiplicity: "ManyToMany"
- name: "Component"
  description: "Underlying component or module that options may require or realize\
    \ within the product structure."
  data:
  - name: "name"
    type: "String"
  - name: "componentType"
    type: "ComponentType"
  - name: "referenceDesignator"
    type: "String"
  relations:
  - name: "products"
    type: "Product"
    multiplicity: "ManyToMany"
  - name: "options"
    type: "Option"
    multiplicity: "ManyToMany"
  - name: "mappings"
    type: "OptionComponentMapping"
    multiplicity: "OneToMany"
- name: "OptionComponentMapping"
  description: "Mapping that quantifies how an option consumes or instantiates a component."
  data:
  - name: "quantity"
    type: "Quantity"
  - name: "notes"
    type: "String"
  relations:
  - name: "option"
    type: "Option"
    multiplicity: "ManyToOne"
  - name: "component"
    type: "Component"
    multiplicity: "ManyToOne"
- name: "CompatibilityGroup"
  description: "Grouping used to express compatibility domains and cross-option constraints."
  data:
  - name: "name"
    type: "String"
  - name: "groupType"
    type: "CompatibilityGroupType"
  - name: "description"
    type: "String"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "options"
    type: "Option"
    multiplicity: "ManyToMany"
- name: "ChangeRequest"
  description: "Governed proposal to modify configuration models, features, rules,\
    \ or options."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "status"
    type: "ChangeRequestStatus"
  - name: "priority"
    type: "PriorityLevel"
  - name: "submittedOn"
    type: "Date"
  - name: "targetRelease"
    type: "String"
  relations:
  - name: "configurationModel"
    type: "ConfigurationModel"
    multiplicity: "ManyToOne"
  - name: "impactedFeatures"
    type: "ConfigFeature"
    multiplicity: "ManyToMany"
  - name: "impactedRules"
    type: "ConfigurationRule"
    multiplicity: "ManyToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "Approval"
  description: "Decision record by a stakeholder or role for a change request."
  data:
  - name: "approverRole"
    type: "String"
  - name: "decision"
    type: "ApprovalDecision"
  - name: "decidedOn"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "changeRequest"
    type: "ChangeRequest"
    multiplicity: "ManyToOne"
- name: "Release"
  description: "Packaged publication of configuration changes made available to a\
    \ catalog."
  data:
  - name: "name"
    type: "String"
  - name: "releaseDate"
    type: "Date"
  - name: "releaseType"
    type: "ReleaseType"
  - name: "status"
    type: "ReleaseStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "catalog"
    type: "ProductCatalog"
    multiplicity: "ManyToOne"
  - name: "configurationModels"
    type: "ConfigurationModel"
    multiplicity: "ManyToMany"
- name: "PriceAdjustment"
  description: "Configurative price impact associated with an option under specific\
    \ effectivity."
  data:
  - name: "adjustmentType"
    type: "PriceAdjustmentType"
  - name: "value"
    type: "Money"
  - name: "description"
    type: "String"
  relations:
  - name: "option"
    type: "Option"
    multiplicity: "ManyToOne"
  - name: "effectivity"
    type: "EffectivityPeriod"
    multiplicity: "ManyToOne"
enums:
- name: "CatalogStatus"
  description: "State of a product catalog in its lifecycle."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Retired"
- name: "ProductType"
  description: "Classification of the product being configured."
  data:
  - name: "Good"
  - name: "Service"
  - name: "Subscription"
  - name: "Digital"
- name: "LifecycleState"
  description: "Lifecycle progression of a product."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "Deprecated"
  - name: "EndOfLife"
- name: "FeatureType"
  description: "Data behavior of a configurable feature."
  data:
  - name: "Boolean"
  - name: "Choice"
  - name: "IntegerRange"
  - name: "DecimalRange"
  - name: "Text"
- name: "SelectionMode"
  description: "Selection behavior allowed within an option group."
  data:
  - name: "SingleSelect"
  - name: "MultiSelect"
- name: "AvailabilityStatus"
  description: "Availability of an option for selection."
  data:
  - name: "Available"
  - name: "Deprecated"
  - name: "Unavailable"
- name: "RuleType"
  description: "Category of configuration logic applied."
  data:
  - name: "Inclusion"
  - name: "Exclusion"
  - name: "Requires"
  - name: "Conflicts"
  - name: "Cardinality"
  - name: "Recommendation"
- name: "RuleSeverity"
  description: "Impact level of a rule when violated or evaluated."
  data:
  - name: "Error"
  - name: "Warning"
  - name: "Info"
- name: "ChannelType"
  description: "Commercial channel or interface where configurations apply."
  data:
  - name: "Online"
  - name: "Retail"
  - name: "Partner"
  - name: "API"
- name: "VariantStatus"
  description: "Publication status of a pre-defined variant."
  data:
  - name: "Published"
  - name: "Archived"
  - name: "Preview"
- name: "ConfigurationState"
  description: "Current validation state of a configuration session."
  data:
  - name: "InProgress"
  - name: "Valid"
  - name: "Invalid"
  - name: "Submitted"
- name: "ComponentType"
  description: "Nature of a component linked to an option or product."
  data:
  - name: "Material"
  - name: "ServiceComponent"
  - name: "SoftwareModule"
- name: "CompatibilityGroupType"
  description: "Semantics of a compatibility grouping."
  data:
  - name: "Electrical"
  - name: "Physical"
  - name: "Regulatory"
  - name: "Licensing"
- name: "ChangeRequestStatus"
  description: "Workflow state for a configuration change request."
  data:
  - name: "Draft"
  - name: "UnderReview"
  - name: "Approved"
  - name: "Rejected"
  - name: "Implemented"
  - name: "Closed"
- name: "PriorityLevel"
  description: "Importance ranking for change assessment and scheduling."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "ApprovalDecision"
  description: "Outcome of an approval action."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
- name: "ReleaseType"
  description: "Categorization of the scope of published changes."
  data:
  - name: "Major"
  - name: "Minor"
  - name: "Patch"
- name: "ReleaseStatus"
  description: "Current lifecycle state of a release."
  data:
  - name: "Planned"
  - name: "Released"
  - name: "Deprecated"
- name: "PriceAdjustmentType"
  description: "Type of price impact introduced by configuration."
  data:
  - name: "Surcharge"
  - name: "Discount"
  - name: "Override"
- name: "SelectionStrategy"
  description: "Default strategy for resolving selections in a configuration model."
  data:
  - name: "None"
  - name: "Minimal"
  - name: "FirstAvailable"
  - name: "MostPopular"
valueObjects:
- name: "RuleExpression"
  description: "Portable representation of rule logic, including syntax and the textual\
    \ expression."
  data:
  - name: "syntax"
    type: "String"
  - name: "body"
    type: "String"
- name: "Money"
  description: "Monetary amount paired with a currency code."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Quantity"
  description: "Numeric amount with associated unit of measure."
  data:
  - name: "value"
    type: "Decimal"
  - name: "unit"
    type: "String"
