---
metadata:
  name: "HCIDL Capabilities Model - Bundle Management"
  description: "Capability model for defining, validating, pricing, and publishing\
    \ configurable product and service bundles across channels and segments."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Product & Catalog"
  type: "Capability"
  domain: "Bundle Management"
entities:
- name: "Catalog"
  description: "Container of marketable products, services, and bundles for a specific\
    \ assortment or market."
  data:
  - name: "name"
    type: "String"
  - name: "catalogCode"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  relations:
  - name: "channels"
    type: "Channel"
    multiplicity: "ManyToMany"
  - name: "entries"
    type: "CatalogEntry"
    multiplicity: "OneToMany"
- name: "Channel"
  description: "Distribution or sales medium through which offerings are marketed\
    \ and sold."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  relations:
  - name: "catalogs"
    type: "Catalog"
    multiplicity: "ManyToMany"
  - name: "availabilityWindows"
    type: "AvailabilityWindow"
    multiplicity: "OneToMany"
- name: "Product"
  description: "Atomic physical or digital item that can be sold independently or\
    \ as part of a bundle."
  data:
  - name: "name"
    type: "String"
  - name: "sku"
    type: "SKU"
  - name: "unitOfMeasure"
    type: "String"
  - name: "basePrice"
    type: "Money"
  - name: "lifecycleStatus"
    type: "LifecycleStatus"
  relations:
  - name: "catalogEntries"
    type: "CatalogEntry"
    multiplicity: "OneToMany"
  - name: "bundleComponents"
    type: "BundleComponent"
    multiplicity: "OneToMany"
- name: "Service"
  description: "Provisioned activity or subscription that can be sold standalone or\
    \ within a bundle."
  data:
  - name: "name"
    type: "String"
  - name: "serviceCode"
    type: "String"
  - name: "unitOfMeasure"
    type: "String"
  - name: "basePrice"
    type: "Money"
  - name: "lifecycleStatus"
    type: "LifecycleStatus"
  relations:
  - name: "catalogEntries"
    type: "CatalogEntry"
    multiplicity: "OneToMany"
  - name: "bundleComponents"
    type: "BundleComponent"
    multiplicity: "OneToMany"
- name: "Charge"
  description: "Non-product monetary charge associated with a bundle or component."
  data:
  - name: "name"
    type: "String"
  - name: "chargeCode"
    type: "String"
  - name: "chargeType"
    type: "ChargeType"
  - name: "amount"
    type: "Money"
  - name: "taxApplicability"
    type: "TaxApplicability"
  - name: "lifecycleStatus"
    type: "LifecycleStatus"
  relations:
  - name: "bundleComponents"
    type: "BundleComponent"
    multiplicity: "OneToMany"
- name: "BundleOffering"
  description: "Marketable bundle concept that aggregates components and pricing under\
    \ a sellable identity."
  data:
  - name: "name"
    type: "String"
  - name: "bundleCode"
    type: "String"
  - name: "bundleType"
    type: "BundleType"
  - name: "lifecycleStatus"
    type: "LifecycleStatus"
  - name: "shortDescription"
    type: "String"
  relations:
  - name: "versions"
    type: "BundleVersion"
    multiplicity: "OneToMany"
  - name: "catalogs"
    type: "Catalog"
    multiplicity: "ManyToMany"
  - name: "customerSegments"
    type: "CustomerSegment"
    multiplicity: "ManyToMany"
  - name: "availabilityWindows"
    type: "AvailabilityWindow"
    multiplicity: "OneToMany"
  - name: "catalogEntries"
    type: "CatalogEntry"
    multiplicity: "OneToMany"
- name: "BundleVersion"
  description: "Versioned definition of components, structure, and rules for a bundle\
    \ offering."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "status"
    type: "BundleVersionStatus"
  - name: "revisionNotes"
    type: "String"
  relations:
  - name: "offering"
    type: "BundleOffering"
    multiplicity: "ManyToOne"
  - name: "componentGroups"
    type: "ComponentGroup"
    multiplicity: "OneToMany"
  - name: "pricing"
    type: "BundlePricing"
    multiplicity: "OneToOne"
  - name: "rules"
    type: "BundleRule"
    multiplicity: "OneToMany"
- name: "ComponentGroup"
  description: "Logical group representing a selection set within a bundle version."
  data:
  - name: "name"
    type: "String"
  - name: "selectionMode"
    type: "SelectionMode"
  - name: "minSelections"
    type: "Integer"
  - name: "maxSelections"
    type: "Integer"
  relations:
  - name: "bundleVersion"
    type: "BundleVersion"
    multiplicity: "ManyToOne"
  - name: "components"
    type: "BundleComponent"
    multiplicity: "OneToMany"
- name: "BundleComponent"
  description: "Configurable component that contributes a product, service, or charge\
    \ to a bundle."
  data:
  - name: "componentKind"
    type: "ComponentKind"
  - name: "defaultQuantity"
    type: "Decimal"
  - name: "minQuantity"
    type: "Decimal"
  - name: "maxQuantity"
    type: "Decimal"
  - name: "pricingBehavior"
    type: "ComponentPricingBehavior"
  relations:
  - name: "group"
    type: "ComponentGroup"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "charge"
    type: "Charge"
    multiplicity: "ManyToOne"
  - name: "affectedByRules"
    type: "BundleRule"
    multiplicity: "ManyToMany"
- name: "BundlePricing"
  description: "Pricing configuration for a bundle version, including base price and\
    \ discounting."
  data:
  - name: "pricingMethod"
    type: "PricingMethod"
  - name: "basePrice"
    type: "Money"
  - name: "billingCycle"
    type: "BillingCycle"
  relations:
  - name: "bundleVersion"
    type: "BundleVersion"
    multiplicity: "OneToOne"
  - name: "priceTiers"
    type: "PriceTier"
    multiplicity: "OneToMany"
  - name: "discounts"
    type: "BundleDiscount"
    multiplicity: "OneToMany"
- name: "PriceTier"
  description: "Tier definition for quantity-based or component-count-based pricing."
  data:
  - name: "minQuantity"
    type: "Decimal"
  - name: "maxQuantity"
    type: "Decimal"
  - name: "tierPrice"
    type: "Money"
  relations:
  - name: "bundlePricing"
    type: "BundlePricing"
    multiplicity: "ManyToOne"
- name: "BundleDiscount"
  description: "Discount or special price applied at the bundle level under specific\
    \ conditions."
  data:
  - name: "name"
    type: "String"
  - name: "discountType"
    type: "DiscountType"
  - name: "amount"
    type: "Money"
  - name: "percent"
    type: "Percentage"
  - name: "stackingRule"
    type: "DiscountStackingRule"
  - name: "condition"
    type: "Expression"
  relations:
  - name: "bundlePricing"
    type: "BundlePricing"
    multiplicity: "ManyToOne"
  - name: "applicableSegments"
    type: "CustomerSegment"
    multiplicity: "ManyToMany"
  - name: "applicableChannels"
    type: "Channel"
    multiplicity: "ManyToMany"
- name: "BundleRule"
  description: "Constraint or logic that governs component compatibility, eligibility,\
    \ or selection within a bundle."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "RuleType"
  - name: "severity"
    type: "RuleSeverity"
  - name: "condition"
    type: "Expression"
  - name: "message"
    type: "String"
  relations:
  - name: "bundleVersion"
    type: "BundleVersion"
    multiplicity: "ManyToOne"
  - name: "affectedComponents"
    type: "BundleComponent"
    multiplicity: "ManyToMany"
  - name: "requiredComponents"
    type: "BundleComponent"
    multiplicity: "ManyToMany"
  - name: "eligibleSegments"
    type: "CustomerSegment"
    multiplicity: "ManyToMany"
- name: "CustomerSegment"
  description: "Group of customers defined by shared traits for eligibility, pricing,\
    \ or targeting."
  data:
  - name: "name"
    type: "String"
  - name: "segmentCode"
    type: "String"
  - name: "priority"
    type: "Integer"
  - name: "description"
    type: "String"
  relations:
  - name: "bundleOfferings"
    type: "BundleOffering"
    multiplicity: "ManyToMany"
  - name: "discounts"
    type: "BundleDiscount"
    multiplicity: "OneToMany"
- name: "CatalogEntry"
  description: "Publication of a product, service, or bundle in a catalog with timing\
    \ and placement details."
  data:
  - name: "referenceCode"
    type: "String"
  - name: "displayOrder"
    type: "Integer"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "catalog"
    type: "Catalog"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "bundleOffering"
    type: "BundleOffering"
    multiplicity: "ManyToOne"
- name: "AvailabilityWindow"
  description: "Time-bounded availability policy for an offering in a channel and\
    \ segment context."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "maxPerOrder"
    type: "Integer"
  relations:
  - name: "bundleOffering"
    type: "BundleOffering"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "segment"
    type: "CustomerSegment"
    multiplicity: "ManyToOne"
enums:
- name: "BundleType"
  description: "Structure and variability of the bundle being offered."
  data:
  - name: "Fixed"
  - name: "Configurable"
  - name: "Dynamic"
- name: "ComponentKind"
  description: "Nature of the component contributed to a bundle."
  data:
  - name: "Product"
  - name: "Service"
  - name: "Charge"
- name: "SelectionMode"
  description: "Rule governing how many items can be selected within a component group."
  data:
  - name: "MandatorySingle"
  - name: "OptionalSingle"
  - name: "OptionalMultiple"
  - name: "Range"
  - name: "All"
- name: "PricingMethod"
  description: "Approach used to calculate the price of a bundle."
  data:
  - name: "SumOfParts"
  - name: "BundleLevelPrice"
  - name: "Tiered"
- name: "BillingCycle"
  description: "Recurrence pattern for billing the bundle."
  data:
  - name: "OneTime"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Annual"
  - name: "Usage"
- name: "RuleType"
  description: "Category of constraint or logic applied to a bundle configuration."
  data:
  - name: "Compatibility"
  - name: "Exclusion"
  - name: "Dependency"
  - name: "Cardinality"
  - name: "Eligibility"
  - name: "AttributeConstraint"
- name: "RuleSeverity"
  description: "Impact of a rule violation on the configuration process."
  data:
  - name: "Error"
  - name: "Warning"
  - name: "Info"
- name: "LifecycleStatus"
  description: "Stage of availability and support for an offering or component."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Deprecated"
  - name: "Retired"
- name: "ChannelType"
  description: "Classification of the sales or distribution channel."
  data:
  - name: "Online"
  - name: "Store"
  - name: "Partner"
  - name: "Marketplace"
  - name: "MobileApp"
- name: "ChargeType"
  description: "Purpose of a non-product monetary charge."
  data:
  - name: "SetupFee"
  - name: "Shipping"
  - name: "Handling"
  - name: "Surcharge"
  - name: "Deposit"
- name: "ComponentPricingBehavior"
  description: "How a component contributes to the overall price of the bundle."
  data:
  - name: "Included"
  - name: "Discounted"
  - name: "ChargedSeparately"
  - name: "NotPriced"
- name: "TaxApplicability"
  description: "Tax treatment applied to a charge or price."
  data:
  - name: "Taxable"
  - name: "NonTaxable"
  - name: "Exempt"
- name: "BundleVersionStatus"
  description: "Governance and release state of a bundle version."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Approved"
  - name: "Active"
  - name: "Suspended"
  - name: "Retired"
- name: "DiscountType"
  description: "Method used to represent a discount at the bundle level."
  data:
  - name: "AmountOff"
  - name: "PercentOff"
  - name: "FixedPrice"
- name: "DiscountStackingRule"
  description: "Policy controlling whether multiple discounts can be combined."
  data:
  - name: "Stackable"
  - name: "Exclusive"
  - name: "StackWithSameTypeOnly"
valueObjects:
- name: "SKU"
  description: "Stock keeping unit code used to uniquely reference a product in commercial\
    \ operations."
  data:
  - name: "value"
    type: "String"
- name: "Money"
  description: "Monetary amount paired with its currency code."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Percentage"
  description: "Numeric ratio expressed as a percentage."
  data:
  - name: "value"
    type: "Decimal"
- name: "Expression"
  description: "Machine-readable expression or predicate used to evaluate conditions."
  data:
  - name: "value"
    type: "String"
  - name: "language"
    type: "String"
