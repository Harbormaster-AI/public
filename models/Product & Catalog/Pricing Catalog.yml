---
metadata:
  name: "Pricing Catalog HCIDL Model"
  description: "Capabilities model for defining, governing, and publishing reusable\
    \ pricing structures across markets, channels, and customer segments."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Product & Catalog"
  type: "Capability"
  domain: "Pricing Catalog"
entities:
- name: "PricingCatalog"
  description: "Top-level construct that organizes price books, policies, and market\
    \ scope for an enterprise’s pricing assets."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "PricingStatus"
  - name: "defaultCurrency"
    type: "String"
  relations:
  - name: "priceBooks"
    type: "PriceBook"
    multiplicity: "OneToMany"
  - name: "markets"
    type: "Market"
    multiplicity: "ManyToMany"
  - name: "roundingPolicies"
    type: "RoundingPolicy"
    multiplicity: "OneToMany"
  - name: "prorationPolicies"
    type: "ProrationPolicy"
    multiplicity: "OneToMany"
- name: "Market"
  description: "Commercial geography or regulatory jurisdiction used to localize pricing,\
    \ currency, and taxation."
  data:
  - name: "name"
    type: "String"
  - name: "regionCode"
    type: "String"
  relations:
  - name: "catalogs"
    type: "PricingCatalog"
    multiplicity: "ManyToMany"
  - name: "currencies"
    type: "Currency"
    multiplicity: "ManyToMany"
  - name: "priceBooks"
    type: "PriceBook"
    multiplicity: "OneToMany"
  - name: "taxPolicies"
    type: "TaxPolicy"
    multiplicity: "OneToMany"
- name: "Currency"
  description: "Monetary unit configuration used for pricing and conversions."
  data:
  - name: "code"
    type: "String"
  - name: "symbol"
    type: "String"
  - name: "decimalPlaces"
    type: "Integer"
  relations:
  - name: "exchangeRates"
    type: "ExchangeRate"
    multiplicity: "OneToMany"
  - name: "markets"
    type: "Market"
    multiplicity: "ManyToMany"
  - name: "priceLists"
    type: "PriceList"
    multiplicity: "OneToMany"
  - name: "usageRateCards"
    type: "UsageRateCard"
    multiplicity: "OneToMany"
- name: "ExchangeRate"
  description: "Point-in-time conversion factor between two currencies for pricing\
    \ and rating."
  data:
  - name: "rate"
    type: "Decimal"
  - name: "validFrom"
    type: "Date"
  relations:
  - name: "baseCurrency"
    type: "Currency"
    multiplicity: "ManyToOne"
  - name: "quoteCurrency"
    type: "Currency"
    multiplicity: "ManyToOne"
- name: "SalesChannel"
  description: "Route-to-market through which offers are priced and sold."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "priceBooks"
    type: "PriceBook"
    multiplicity: "ManyToMany"
  - name: "priceLists"
    type: "PriceList"
    multiplicity: "ManyToMany"
  - name: "eligibilityRules"
    type: "EligibilityRule"
    multiplicity: "OneToMany"
- name: "CustomerSegment"
  description: "Grouping of customers with shared pricing eligibility or negotiation\
    \ characteristics."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "priceBooks"
    type: "PriceBook"
    multiplicity: "ManyToMany"
  - name: "eligibilityRules"
    type: "EligibilityRule"
    multiplicity: "OneToMany"
- name: "PriceBook"
  description: "Curated collection of price lists aligned to a market, channel, or\
    \ segment over a defined timeframe."
  data:
  - name: "name"
    type: "String"
  - name: "lifecycleStatus"
    type: "PricingStatus"
  - name: "effectivePeriod"
    type: "DateRange"
  - name: "scope"
    type: "ScopeType"
  relations:
  - name: "catalog"
    type: "PricingCatalog"
    multiplicity: "ManyToOne"
  - name: "market"
    type: "Market"
    multiplicity: "ManyToOne"
  - name: "priceLists"
    type: "PriceList"
    multiplicity: "OneToMany"
  - name: "customerSegments"
    type: "CustomerSegment"
    multiplicity: "ManyToMany"
  - name: "salesChannels"
    type: "SalesChannel"
    multiplicity: "ManyToMany"
- name: "PriceList"
  description: "Time-bounded, currency-specific set of item and bundle prices and\
    \ related policies."
  data:
  - name: "name"
    type: "String"
  - name: "currencyTreatment"
    type: "CurrencyTreatment"
  - name: "currency"
    type: "String"
  - name: "versionLabel"
    type: "String"
  - name: "lifecycleStatus"
    type: "PricingStatus"
  - name: "effectivePeriod"
    type: "DateRange"
  relations:
  - name: "priceBook"
    type: "PriceBook"
    multiplicity: "ManyToOne"
  - name: "currencyRef"
    type: "Currency"
    multiplicity: "ManyToOne"
  - name: "priceItems"
    type: "PriceItem"
    multiplicity: "OneToMany"
  - name: "bundlePrices"
    type: "BundlePrice"
    multiplicity: "OneToMany"
  - name: "roundingPolicy"
    type: "RoundingPolicy"
    multiplicity: "ManyToOne"
  - name: "prorationPolicy"
    type: "ProrationPolicy"
    multiplicity: "ManyToOne"
  - name: "salesChannels"
    type: "SalesChannel"
    multiplicity: "ManyToMany"
  - name: "taxPolicy"
    type: "TaxPolicy"
    multiplicity: "ManyToOne"
- name: "RoundingPolicy"
  description: "Consistent rule for rounding calculated prices and components."
  data:
  - name: "name"
    type: "String"
  - name: "mode"
    type: "RoundingMode"
  - name: "scale"
    type: "Integer"
  relations:
  - name: "priceLists"
    type: "PriceList"
    multiplicity: "OneToMany"
  - name: "priceComponents"
    type: "PriceComponent"
    multiplicity: "OneToMany"
  - name: "usageRateCards"
    type: "UsageRateCard"
    multiplicity: "OneToMany"
- name: "ProrationPolicy"
  description: "Rule controlling how recurring charges are adjusted for partial periods."
  data:
  - name: "name"
    type: "String"
  - name: "method"
    type: "ProrationMethod"
  relations:
  - name: "priceLists"
    type: "PriceList"
    multiplicity: "OneToMany"
  - name: "priceComponents"
    type: "PriceComponent"
    multiplicity: "OneToMany"
- name: "UnitOfMeasure"
  description: "Standardized unit used to express quantities for pricing and usage."
  data:
  - name: "name"
    type: "String"
  - name: "symbol"
    type: "String"
  relations:
  - name: "catalogItems"
    type: "CatalogItem"
    multiplicity: "OneToMany"
  - name: "usageMetrics"
    type: "UsageMetric"
    multiplicity: "OneToMany"
- name: "CatalogItem"
  description: "Sellable entity whose price is governed by the pricing catalog."
  data:
  - name: "name"
    type: "String"
  - name: "chargeType"
    type: "ChargeType"
  - name: "priceModel"
    type: "PriceModelType"
  relations:
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
    multiplicity: "ManyToOne"
  - name: "priceItems"
    type: "PriceItem"
    multiplicity: "OneToMany"
  - name: "bundles"
    type: "Bundle"
    multiplicity: "ManyToMany"
  - name: "usageMetrics"
    type: "UsageMetric"
    multiplicity: "ManyToMany"
- name: "PriceItem"
  description: "Price definition for a single catalog item within a specific price\
    \ list context."
  data:
  - name: "amount"
    type: "Money"
  - name: "amountType"
    type: "AmountType"
  - name: "billingPeriod"
    type: "BillingPeriod"
  - name: "calculationBasis"
    type: "CalculationBasis"
  - name: "lifecycleStatus"
    type: "PricingStatus"
  relations:
  - name: "priceList"
    type: "PriceList"
    multiplicity: "ManyToOne"
  - name: "catalogItem"
    type: "CatalogItem"
    multiplicity: "ManyToOne"
  - name: "priceTiers"
    type: "PriceTier"
    multiplicity: "OneToMany"
  - name: "components"
    type: "PriceComponent"
    multiplicity: "OneToMany"
  - name: "eligibilityRules"
    type: "EligibilityRule"
    multiplicity: "OneToMany"
  - name: "ratingPlan"
    type: "RatingPlan"
    multiplicity: "ManyToOne"
  - name: "overridePolicy"
    type: "PriceOverridePolicy"
    multiplicity: "ManyToOne"
- name: "PriceTier"
  description: "Quantity-based threshold model for unit pricing within a price item."
  data:
  - name: "minQuantity"
    type: "Decimal"
  - name: "maxQuantity"
    type: "Decimal"
  - name: "unitPrice"
    type: "Money"
  relations:
  - name: "priceItem"
    type: "PriceItem"
    multiplicity: "ManyToOne"
- name: "PriceComponent"
  description: "Atomic adjustment applied to a price, such as a discount, surcharge,\
    \ fee, or tax."
  data:
  - name: "name"
    type: "String"
  - name: "kind"
    type: "AdjustmentKind"
  - name: "isCompound"
    type: "Boolean"
  - name: "precedence"
    type: "Integer"
  - name: "rate"
    type: "Percentage"
  - name: "amount"
    type: "Money"
  relations:
  - name: "priceItem"
    type: "PriceItem"
    multiplicity: "ManyToOne"
  - name: "conditions"
    type: "EligibilityRule"
    multiplicity: "OneToMany"
  - name: "roundingPolicy"
    type: "RoundingPolicy"
    multiplicity: "ManyToOne"
  - name: "prorationPolicy"
    type: "ProrationPolicy"
    multiplicity: "ManyToOne"
- name: "EligibilityRule"
  description: "Declarative condition controlling when a price, component, or bundle\
    \ applies."
  data:
  - name: "name"
    type: "String"
  - name: "matchType"
    type: "EligibilityMatch"
  - name: "expression"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "customerSegments"
    type: "CustomerSegment"
    multiplicity: "ManyToMany"
  - name: "markets"
    type: "Market"
    multiplicity: "ManyToMany"
  - name: "salesChannels"
    type: "SalesChannel"
    multiplicity: "ManyToMany"
- name: "RatingPlan"
  description: "Reusable strategy for transforming usage measurements into charges."
  data:
  - name: "name"
    type: "String"
  - name: "aggregation"
    type: "UsageAggregation"
  - name: "billingPeriod"
    type: "BillingPeriod"
  relations:
  - name: "metrics"
    type: "UsageMetric"
    multiplicity: "ManyToMany"
  - name: "rateCards"
    type: "UsageRateCard"
    multiplicity: "OneToMany"
  - name: "priceItems"
    type: "PriceItem"
    multiplicity: "OneToMany"
- name: "UsageMetric"
  description: "Measurable quantity used to drive usage-based pricing."
  data:
  - name: "name"
    type: "String"
  - name: "metricCode"
    type: "String"
  - name: "granularity"
    type: "String"
  relations:
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
    multiplicity: "ManyToOne"
  - name: "ratingPlans"
    type: "RatingPlan"
    multiplicity: "ManyToMany"
  - name: "rateCards"
    type: "UsageRateCard"
    multiplicity: "OneToMany"
  - name: "catalogItems"
    type: "CatalogItem"
    multiplicity: "ManyToMany"
- name: "UsageRateCard"
  description: "Currency and market-specific table of usage rates linked to a rating\
    \ plan."
  data:
  - name: "name"
    type: "String"
  - name: "lifecycleStatus"
    type: "PricingStatus"
  - name: "effectivePeriod"
    type: "DateRange"
  relations:
  - name: "ratingPlan"
    type: "RatingPlan"
    multiplicity: "ManyToOne"
  - name: "metric"
    type: "UsageMetric"
    multiplicity: "ManyToOne"
  - name: "tiers"
    type: "UsageRateTier"
    multiplicity: "OneToMany"
  - name: "market"
    type: "Market"
    multiplicity: "ManyToOne"
  - name: "currency"
    type: "Currency"
    multiplicity: "ManyToOne"
  - name: "roundingPolicy"
    type: "RoundingPolicy"
    multiplicity: "ManyToOne"
- name: "UsageRateTier"
  description: "Thresholded unit prices for usage within a rate card."
  data:
  - name: "minQuantity"
    type: "Decimal"
  - name: "maxQuantity"
    type: "Decimal"
  - name: "unitPrice"
    type: "Money"
  relations:
  - name: "rateCard"
    type: "UsageRateCard"
    multiplicity: "ManyToOne"
- name: "PriceOverridePolicy"
  description: "Governance rules defining allowable price adjustments and approval\
    \ thresholds."
  data:
  - name: "name"
    type: "String"
  - name: "allowsOverride"
    type: "Boolean"
  - name: "maxDiscount"
    type: "Percentage"
  - name: "minMargin"
    type: "Percentage"
  relations:
  - name: "priceItems"
    type: "PriceItem"
    multiplicity: "OneToMany"
  - name: "approvalRules"
    type: "ApprovalRule"
    multiplicity: "OneToMany"
- name: "ApprovalRule"
  description: "Authorization requirement to exceed specified override thresholds."
  data:
  - name: "name"
    type: "String"
  - name: "threshold"
    type: "Money"
  - name: "approverRole"
    type: "String"
  relations:
  - name: "overridePolicy"
    type: "PriceOverridePolicy"
    multiplicity: "ManyToOne"
- name: "Bundle"
  description: "Commercial grouping of catalog items with a defined pricing model."
  data:
  - name: "name"
    type: "String"
  - name: "priceModel"
    type: "PriceModelType"
  - name: "bundleType"
    type: "BundleType"
  relations:
  - name: "items"
    type: "CatalogItem"
    multiplicity: "ManyToMany"
  - name: "bundlePrices"
    type: "BundlePrice"
    multiplicity: "OneToMany"
  - name: "market"
    type: "Market"
    multiplicity: "ManyToOne"
- name: "BundlePrice"
  description: "Price definition for a bundle within a specific price list."
  data:
  - name: "amount"
    type: "Money"
  - name: "amountType"
    type: "AmountType"
  - name: "billingPeriod"
    type: "BillingPeriod"
  relations:
  - name: "bundle"
    type: "Bundle"
    multiplicity: "ManyToOne"
  - name: "priceList"
    type: "PriceList"
    multiplicity: "ManyToOne"
  - name: "components"
    type: "PriceComponent"
    multiplicity: "OneToMany"
  - name: "eligibilityRules"
    type: "EligibilityRule"
    multiplicity: "OneToMany"
- name: "TaxPolicy"
  description: "Framework describing how taxes are applied for a market and whether\
    \ prices are tax-inclusive."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "taxInclusive"
    type: "Boolean"
  relations:
  - name: "taxRates"
    type: "TaxRate"
    multiplicity: "OneToMany"
  - name: "priceLists"
    type: "PriceList"
    multiplicity: "OneToMany"
- name: "TaxRate"
  description: "Tax percentage and classification effective over a period."
  data:
  - name: "name"
    type: "String"
  - name: "rate"
    type: "Percentage"
  - name: "taxType"
    type: "String"
  - name: "effectivePeriod"
    type: "DateRange"
  relations:
  - name: "taxPolicy"
    type: "TaxPolicy"
    multiplicity: "ManyToOne"
  - name: "market"
    type: "Market"
    multiplicity: "ManyToOne"
enums:
- name: "ChargeType"
  description: "Classification of how a charge is triggered."
  data:
  - name: "OneTime"
  - name: "Recurring"
  - name: "Usage"
- name: "PriceModelType"
  description: "Structure used to compute the price for an item or bundle."
  data:
  - name: "Flat"
  - name: "Tiered"
  - name: "Volume"
  - name: "Stairstep"
  - name: "PerUser"
  - name: "PerUnit"
  - name: "UsageBased"
- name: "RoundingMode"
  description: "Strategy for rounding monetary values."
  data:
  - name: "HalfUp"
  - name: "HalfDown"
  - name: "HalfEven"
  - name: "Up"
  - name: "Down"
  - name: "Ceiling"
  - name: "Floor"
- name: "BillingPeriod"
  description: "Recurrence window used for subscription or recurring charges."
  data:
  - name: "Monthly"
  - name: "Quarterly"
  - name: "SemiAnnual"
  - name: "Annual"
- name: "CalculationBasis"
  description: "Unit of calculation applied when computing charges."
  data:
  - name: "PerUnit"
  - name: "PerOrder"
  - name: "PerUser"
  - name: "PerPeriod"
- name: "AdjustmentKind"
  description: "Type of pricing adjustment."
  data:
  - name: "Discount"
  - name: "Surcharge"
  - name: "Fee"
  - name: "Tax"
- name: "EligibilityMatch"
  description: "Logical operator determining how conditions are evaluated."
  data:
  - name: "All"
  - name: "Any"
- name: "CurrencyTreatment"
  description: "Defines whether list prices are fixed in a currency or derived via\
    \ foreign exchange."
  data:
  - name: "Fixed"
  - name: "FXLinked"
- name: "UsageAggregation"
  description: "Method used to summarize usage measurements for rating."
  data:
  - name: "Sum"
  - name: "Max"
  - name: "Min"
  - name: "Average"
- name: "PricingStatus"
  description: "Lifecycle state of a pricing artifact."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Deprecated"
  - name: "Archived"
- name: "ScopeType"
  description: "Organizational reach of a pricing artifact."
  data:
  - name: "Global"
  - name: "Market"
  - name: "Channel"
  - name: "Segment"
  - name: "Agreement"
- name: "AmountType"
  description: "Indicates whether prices include or exclude applicable taxes and fees."
  data:
  - name: "Net"
  - name: "Gross"
- name: "ProrationMethod"
  description: "Technique for calculating partial-period charges."
  data:
  - name: "Daily"
  - name: "ActualDays"
  - name: "ThirtyDayMonth"
  - name: "None"
- name: "BundleType"
  description: "Structural characterization of a bundle."
  data:
  - name: "Static"
  - name: "Dynamic"
valueObjects:
- name: "Money"
  description: "Monetary value consisting of an amount and a currency code."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Percentage"
  description: "Fractional rate expressed as a decimal representation of percent."
  data:
  - name: "value"
    type: "Decimal"
- name: "DateRange"
  description: "Inclusive window of time for which an element is effective."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
