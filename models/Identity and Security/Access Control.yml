---
metadata:
  name: "Access Control Capabilities Model"
  description: "Canonical capabilities model for defining, managing, and evaluating\
    \ access decisions across subjects, actions, policies, and protected resources."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Identity and Security"
  type: "Capability"
  domain: "Access Control"
entities:
- name: "Subject"
  description: "An actor whose access is evaluated, such as a human user or service\
    \ identity."
  data:
  - name: "username"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "subjectType"
    type: "SubjectType"
  - name: "status"
    type: "SubjectStatus"
  - name: "email"
    type: "String"
  relations:
  - name: "groups"
    type: "SubjectGroup"
    multiplicity: "ManyToMany"
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "entitlements"
    type: "Entitlement"
    multiplicity: "OneToMany"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
  - name: "attributes"
    type: "SubjectAttribute"
    multiplicity: "OneToMany"
  - name: "roleAssignments"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
  - name: "accessRequests"
    type: "AccessRequest"
    multiplicity: "OneToMany"
- name: "SubjectGroup"
  description: "A collection of subjects used to simplify policy targeting and role\
    \ assignment."
  data:
  - name: "name"
    type: "String"
  - name: "groupType"
    type: "GroupType"
  - name: "summary"
    type: "String"
  relations:
  - name: "parentGroup"
    type: "SubjectGroup"
    multiplicity: "ManyToOne"
  - name: "childGroups"
    type: "SubjectGroup"
    multiplicity: "OneToMany"
  - name: "members"
    type: "Subject"
    multiplicity: "ManyToMany"
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "attributes"
    type: "SubjectAttribute"
    multiplicity: "OneToMany"
- name: "Role"
  description: "A collection of permissions that define what actions are allowed on\
    \ resources."
  data:
  - name: "name"
    type: "String"
  - name: "roleType"
    type: "RoleType"
  - name: "summary"
    type: "String"
  - name: "isDefault"
    type: "Boolean"
  relations:
  - name: "permissions"
    type: "Permission"
    multiplicity: "ManyToMany"
  - name: "parentRoles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "childRoles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "assignments"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
  - name: "subjects"
    type: "Subject"
    multiplicity: "ManyToMany"
  - name: "groups"
    type: "SubjectGroup"
    multiplicity: "ManyToMany"
- name: "Permission"
  description: "A capability to perform one or more actions on one or more resources."
  data:
  - name: "name"
    type: "String"
  - name: "summary"
    type: "String"
  - name: "criticality"
    type: "PermissionCriticality"
  relations:
  - name: "actions"
    type: "Action"
    multiplicity: "ManyToMany"
  - name: "resources"
    type: "ProtectedResource"
    multiplicity: "ManyToMany"
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "entitlements"
    type: "Entitlement"
    multiplicity: "OneToMany"
- name: "Action"
  description: "An operation that may be performed on a protected resource."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "ActionCategory"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "permissions"
    type: "Permission"
    multiplicity: "ManyToMany"
  - name: "rules"
    type: "PolicyRule"
    multiplicity: "ManyToMany"
  - name: "accessRequests"
    type: "AccessRequest"
    multiplicity: "OneToMany"
- name: "ProtectedResource"
  description: "An addressable entity requiring controlled access, such as an API,\
    \ file, or database object."
  data:
  - name: "name"
    type: "String"
  - name: "resourceKind"
    type: "ResourceKind"
  - name: "resourceUri"
    type: "ResourceURI"
  - name: "sensitivity"
    type: "SensitivityLevel"
  relations:
  - name: "parentResource"
    type: "ProtectedResource"
    multiplicity: "ManyToOne"
  - name: "childResources"
    type: "ProtectedResource"
    multiplicity: "OneToMany"
  - name: "permissions"
    type: "Permission"
    multiplicity: "ManyToMany"
  - name: "attributes"
    type: "ResourceAttribute"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "ResourceGroup"
    multiplicity: "ManyToMany"
  - name: "entitlements"
    type: "Entitlement"
    multiplicity: "OneToMany"
  - name: "accessRequests"
    type: "AccessRequest"
    multiplicity: "OneToMany"
- name: "ResourceGroup"
  description: "A logical set of resources managed together for access control purposes."
  data:
  - name: "name"
    type: "String"
  - name: "groupType"
    type: "ResourceGroupType"
  - name: "ruleExpression"
    type: "String"
  relations:
  - name: "resources"
    type: "ProtectedResource"
    multiplicity: "ManyToMany"
- name: "AccessPolicy"
  description: "A defined set of rules used to evaluate and enforce access decisions."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "PolicyType"
  - name: "effect"
    type: "Effect"
  - name: "priority"
    type: "Integer"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "rules"
    type: "PolicyRule"
    multiplicity: "OneToMany"
  - name: "targetResources"
    type: "ProtectedResource"
    multiplicity: "ManyToMany"
  - name: "applicableRoles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "applicableGroups"
    type: "SubjectGroup"
    multiplicity: "ManyToMany"
- name: "PolicyRule"
  description: "A unit of evaluation within a policy that binds conditions and actions\
    \ to an effect."
  data:
  - name: "name"
    type: "String"
  - name: "effect"
    type: "Effect"
  - name: "conditionLogic"
    type: "ConditionLogic"
  - name: "evaluationOrder"
    type: "Integer"
  relations:
  - name: "policy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
  - name: "actions"
    type: "Action"
    multiplicity: "ManyToMany"
  - name: "conditions"
    type: "Condition"
    multiplicity: "OneToMany"
- name: "Condition"
  description: "A predicate used during policy evaluation to compare contextual or\
    \ attribute data."
  data:
  - name: "attributePath"
    type: "String"
  - name: "operator_"
    type: "ConditionOperator"
  - name: "comparisonValue"
    type: "String"
  - name: "caseSensitive"
    type: "Boolean"
  relations:
  - name: "rule"
    type: "PolicyRule"
    multiplicity: "ManyToOne"
  - name: "attributeDefinition"
    type: "AttributeDefinition"
    multiplicity: "ManyToOne"
- name: "AttributeDefinition"
  description: "A schema element describing available attributes for subjects, resources,\
    \ and sessions."
  data:
  - name: "name"
    type: "String"
  - name: "attributeType"
    type: "AttributeType"
  - name: "descriptionText"
    type: "String"
  - name: "isMutable"
    type: "Boolean"
  - name: "isMultiValued"
    type: "Boolean"
  relations:
  - name: "subjectAttributes"
    type: "SubjectAttribute"
    multiplicity: "OneToMany"
  - name: "resourceAttributes"
    type: "ResourceAttribute"
    multiplicity: "OneToMany"
  - name: "sessionAttributes"
    type: "SessionAttribute"
    multiplicity: "OneToMany"
  - name: "conditions"
    type: "Condition"
    multiplicity: "OneToMany"
- name: "SubjectAttribute"
  description: "A realized value of a defined attribute attached to a subject or subject\
    \ group."
  data:
  - name: "value"
    type: "String"
  - name: "source"
    type: "String"
  - name: "lastUpdated"
    type: "Date"
  relations:
  - name: "definition"
    type: "AttributeDefinition"
    multiplicity: "ManyToOne"
  - name: "subject"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "group"
    type: "SubjectGroup"
    multiplicity: "ManyToOne"
- name: "ResourceAttribute"
  description: "A realized value of a defined attribute attached to a protected resource."
  data:
  - name: "value"
    type: "String"
  - name: "source"
    type: "String"
  - name: "lastUpdated"
    type: "Date"
  relations:
  - name: "definition"
    type: "AttributeDefinition"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "ProtectedResource"
    multiplicity: "ManyToOne"
- name: "Session"
  description: "An authenticated context used during access evaluation."
  data:
  - name: "startedAt"
    type: "Date"
  - name: "lastActivity"
    type: "Date"
  - name: "ipAddress"
    type: "IPAddress"
  - name: "device"
    type: "String"
  - name: "authenticationLevel"
    type: "AuthenticationLevel"
  relations:
  - name: "subject"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "attributes"
    type: "SessionAttribute"
    multiplicity: "OneToMany"
  - name: "accessRequests"
    type: "AccessRequest"
    multiplicity: "OneToMany"
- name: "SessionAttribute"
  description: "A realized value of a defined attribute attached to a session context."
  data:
  - name: "value"
    type: "String"
  - name: "source"
    type: "String"
  relations:
  - name: "definition"
    type: "AttributeDefinition"
    multiplicity: "ManyToOne"
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
- name: "AccessRequest"
  description: "A runtime request to perform an action on a resource by a subject\
    \ under a session context."
  data:
  - name: "requestTime"
    type: "Date"
  - name: "purpose"
    type: "String"
  - name: "contextLabel"
    type: "String"
  relations:
  - name: "subject"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "ProtectedResource"
    multiplicity: "ManyToOne"
  - name: "action"
    type: "Action"
    multiplicity: "ManyToOne"
  - name: "evaluatedPolicy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
  - name: "decision"
    type: "AccessDecision"
    multiplicity: "OneToOne"
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
- name: "AccessDecision"
  description: "The outcome of evaluating an access request against policies and rules."
  data:
  - name: "result"
    type: "AccessDecisionResult"
  - name: "evaluationTime"
    type: "Date"
  - name: "reason"
    type: "String"
  - name: "obligationRequired"
    type: "Boolean"
  relations:
  - name: "request"
    type: "AccessRequest"
    multiplicity: "OneToOne"
  - name: "policy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "PolicyRule"
    multiplicity: "ManyToOne"
  - name: "obligations"
    type: "Obligation"
    multiplicity: "OneToMany"
- name: "Obligation"
  description: "A required action that must be fulfilled as part of an access decision."
  data:
  - name: "name"
    type: "String"
  - name: "instruction"
    type: "String"
  - name: "isBlocking"
    type: "Boolean"
  relations:
  - name: "decision"
    type: "AccessDecision"
    multiplicity: "ManyToOne"
- name: "Entitlement"
  description: "A granted capability linking a subject, permission, and resource,\
    \ often derived from policy or role."
  data:
  - name: "grantedBy"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "subject"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "permission"
    type: "Permission"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "ProtectedResource"
    multiplicity: "ManyToOne"
  - name: "grantedByPolicy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
- name: "RoleAssignment"
  description: "A binding granting a role to a subject or group, optionally scoped\
    \ to a resource."
  data:
  - name: "assignmentReason"
    type: "String"
  - name: "expiresOn"
    type: "Date"
  - name: "isInherited"
    type: "Boolean"
  relations:
  - name: "role"
    type: "Role"
    multiplicity: "ManyToOne"
  - name: "subject"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "group"
    type: "SubjectGroup"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "ProtectedResource"
    multiplicity: "ManyToOne"
enums:
- name: "SubjectType"
  description: "Classification of the subject identity used for access evaluation."
  data:
  - name: "Human"
  - name: "ServiceAccount"
  - name: "Device"
- name: "SubjectStatus"
  description: "Lifecycle state of a subject within access control."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Disabled"
- name: "GroupType"
  description: "Method by which a subject group is populated and maintained."
  data:
  - name: "Static"
  - name: "Dynamic"
  - name: "External"
- name: "RoleType"
  description: "Functional category of a role for governance and administration."
  data:
  - name: "Business"
  - name: "Technical"
  - name: "Emergency"
- name: "PermissionCriticality"
  description: "Risk associated with misuse of a permission."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
- name: "ActionCategory"
  description: "General classification of operations that may be performed on resources."
  data:
  - name: "Read"
  - name: "Write"
  - name: "Execute"
  - name: "Admin"
  - name: "Metadata"
- name: "ResourceGroupType"
  description: "Strategy used to include resources within a resource group."
  data:
  - name: "Static"
  - name: "Dynamic"
  - name: "TagBased"
- name: "PolicyType"
  description: "Conceptual model used by the policy to determine access."
  data:
  - name: "RBAC"
  - name: "ABAC"
  - name: "ACL"
  - name: "MAC"
  - name: "DAC"
- name: "Effect"
  description: "Directive applied when a policy or rule matches."
  data:
  - name: "Allow"
  - name: "Deny"
- name: "ConditionLogic"
  description: "How multiple conditions within a rule are combined."
  data:
  - name: "MatchAll"
  - name: "MatchAny"
  - name: "PriorityOrder"
- name: "ConditionOperator"
  description: "Comparison operator used to evaluate an attribute against a value."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "GreaterThan"
  - name: "GreaterThanOrEquals"
  - name: "LessThan"
  - name: "LessThanOrEquals"
  - name: "In"
  - name: "NotIn"
  - name: "Contains"
  - name: "StartsWith"
  - name: "EndsWith"
  - name: "Matches"
- name: "AttributeType"
  description: "Data type allowed for attribute values."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime"
- name: "AuthenticationLevel"
  description: "Strength of authentication achieved for a session."
  data:
  - name: "Low"
  - name: "Moderate"
  - name: "High"
  - name: "VeryHigh"
- name: "AccessDecisionResult"
  description: "Final outcome of an access evaluation."
  data:
  - name: "Permit"
  - name: "Deny"
  - name: "NotApplicable"
  - name: "Indeterminate"
- name: "ResourceKind"
  description: "Type of protected resource managed by access control."
  data:
  - name: "API"
  - name: "File"
  - name: "Database"
  - name: "Table"
  - name: "Dataset"
  - name: "Queue"
  - name: "Topic"
  - name: "Secret"
  - name: "Application"
- name: "SensitivityLevel"
  description: "Classification indicating the confidentiality of a resource."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Confidential"
  - name: "Restricted"
  - name: "HighlyRestricted"
valueObjects:
- name: "ResourceURI"
  description: "Canonical identifier for a protected resource, typically a URI or\
    \ ARN-like string."
  data:
  - name: "value"
    type: "String"
- name: "IPAddress"
  description: "IPv4 or IPv6 textual representation used for session context and policy\
    \ conditions."
  data:
  - name: "value"
    type: "String"
