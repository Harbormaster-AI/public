---
metadata:
  name: "Session Management"
  description: "Capabilities model for governing the lifecycle, security, storage,\
    \ and propagation of authenticated sessions across clients and channels."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Identity and Security"
  type: "Capability"
  domain: "Session Management"
entities:
- name: "SessionAuthority"
  description: "Central control plane that issues, validates, rotates, and revokes\
    \ sessions and related artifacts."
  data:
  - name: "name"
    type: "String"
  - name: "defaultState"
    type: "SessionState"
  - name: "persistenceType"
    type: "SessionPersistenceType"
  - name: "clockSkewSeconds"
    type: "Integer"
  relations:
  - name: "tenants"
    type: "TenantRealm"
    multiplicity: "OneToMany"
  - name: "clients"
    type: "ClientApplication"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "SessionPolicy"
    multiplicity: "OneToMany"
  - name: "storageNodes"
    type: "SessionStorageNode"
    multiplicity: "OneToMany"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
  - name: "revocationLists"
    type: "SessionRevocationList"
    multiplicity: "OneToMany"
- name: "TenantRealm"
  description: "Administrative boundary within which sessions, subjects, and clients\
    \ are organized and governed."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "authority"
    type: "SessionAuthority"
    multiplicity: "ManyToOne"
  - name: "subjects"
    type: "Subject"
    multiplicity: "OneToMany"
  - name: "clients"
    type: "ClientApplication"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "SessionPolicy"
    multiplicity: "OneToMany"
- name: "ClientApplication"
  description: "Relying application participating in session creation and consumption\
    \ for a tenant."
  data:
  - name: "name"
    type: "String"
  - name: "clientType"
    type: "ClientType"
  - name: "tokenFormat"
    type: "TokenFormat"
  - name: "sessionAffinity"
    type: "SessionAffinity"
  relations:
  - name: "authority"
    type: "SessionAuthority"
    multiplicity: "ManyToOne"
  - name: "tenant"
    type: "TenantRealm"
    multiplicity: "ManyToOne"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
  - name: "cookiePolicy"
    type: "CookiePolicy"
    multiplicity: "ManyToOne"
  - name: "policies"
    type: "SessionPolicy"
    multiplicity: "ManyToMany"
- name: "Subject"
  description: "Logical principal represented within sessions, such as a user, service,\
    \ or privileged operator."
  data:
  - name: "subjectType"
    type: "SubjectType"
  - name: "displayName"
    type: "String"
  relations:
  - name: "tenant"
    type: "TenantRealm"
    multiplicity: "ManyToOne"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
  - name: "devices"
    type: "DeviceProfile"
    multiplicity: "OneToMany"
- name: "Session"
  description: "Authenticated context that holds durable state for a subject across\
    \ requests and channels."
  data:
  - name: "key"
    type: "SessionKey"
  - name: "sessionType"
    type: "SessionType"
  - name: "state"
    type: "SessionState"
  - name: "createdAt"
    type: "DateTime"
  - name: "lastActivityAt"
    type: "DateTime"
  - name: "absoluteExpiryAt"
    type: "DateTime"
  - name: "idleTimeoutSeconds"
    type: "Integer"
  - name: "ipAddress"
    type: "IPAddress"
  - name: "userAgent"
    type: "UserAgent"
  - name: "deviceTrustLevel"
    type: "DeviceTrustLevel"
  relations:
  - name: "authority"
    type: "SessionAuthority"
    multiplicity: "ManyToOne"
  - name: "tenant"
    type: "TenantRealm"
    multiplicity: "ManyToOne"
  - name: "client"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
  - name: "subject"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "DeviceProfile"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "SessionPolicy"
    multiplicity: "ManyToOne"
  - name: "storageNode"
    type: "SessionStorageNode"
    multiplicity: "ManyToOne"
  - name: "refreshTokens"
    type: "RefreshToken"
    multiplicity: "OneToMany"
  - name: "events"
    type: "SessionEvent"
    multiplicity: "OneToMany"
  - name: "locks"
    type: "SessionLock"
    multiplicity: "OneToMany"
  - name: "bindings"
    type: "SessionBinding"
    multiplicity: "OneToMany"
  - name: "cookie"
    type: "BrowserSessionCookie"
    multiplicity: "OneToOne"
  - name: "termination"
    type: "SessionTermination"
    multiplicity: "OneToOne"
- name: "AuthenticationContext"
  description: "Bound authentication details that characterize the assurance of a\
    \ session."
  data:
  - name: "method"
    type: "String"
  - name: "assurance"
    type: "AssuranceLevel"
  - name: "authenticatedAt"
    type: "DateTime"
  - name: "authenticatorLabel"
    type: "String"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "subject"
    type: "Subject"
    multiplicity: "ManyToOne"
- name: "SessionEvent"
  description: "Immutable record of significant state changes or risk signals related\
    \ to a session."
  data:
  - name: "eventType"
    type: "SessionEventType"
  - name: "occurredAt"
    type: "DateTime"
  - name: "ipAddress"
    type: "IPAddress"
  - name: "userAgent"
    type: "UserAgent"
  - name: "detail"
    type: "String"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "subject"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "client"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
- name: "RefreshToken"
  description: "Renewable credential associated with a session and client to extend\
    \ session validity."
  data:
  - name: "tokenFormat"
    type: "TokenFormat"
  - name: "tokenHash"
    type: "Hash"
  - name: "issuedAt"
    type: "DateTime"
  - name: "lastUsedAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  - name: "usageCount"
    type: "Integer"
  - name: "tokenBinding"
    type: "String"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "client"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
  - name: "revocationList"
    type: "SessionRevocationList"
    multiplicity: "ManyToOne"
- name: "SessionPolicy"
  description: "Set of constraints governing session creation, duration, rotation,\
    \ binding, and concurrency."
  data:
  - name: "name"
    type: "String"
  - name: "maxIdleSeconds"
    type: "Integer"
  - name: "maxAbsoluteSeconds"
    type: "Integer"
  - name: "maxConcurrentSessions"
    type: "Integer"
  - name: "requireMfaOnNewDevice"
    type: "Boolean"
  - name: "allowTokenRefresh"
    type: "Boolean"
  - name: "lockOnIpChange"
    type: "Boolean"
  - name: "rotationStrategy"
    type: "TokenRotationStrategy"
  relations:
  - name: "authority"
    type: "SessionAuthority"
    multiplicity: "ManyToOne"
  - name: "tenants"
    type: "TenantRealm"
    multiplicity: "ManyToMany"
  - name: "clients"
    type: "ClientApplication"
    multiplicity: "ManyToMany"
  - name: "networkZones"
    type: "NetworkZone"
    multiplicity: "ManyToMany"
- name: "SessionLock"
  description: "Restrictive flag preventing certain operations on a session due to\
    \ policy or detected risk."
  data:
  - name: "reason"
    type: "LockReason"
  - name: "message"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "Subject"
    multiplicity: "ManyToOne"
- name: "SessionBinding"
  description: "Constraint tying a session to contextual attributes such as network,\
    \ device, or client."
  data:
  - name: "bindingType"
    type: "BindingType"
  - name: "value"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "isEnforced"
    type: "Boolean"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
- name: "SessionRevocationList"
  description: "Catalog of revoked sessions and renewable credentials for fast invalidation\
    \ checks."
  data:
  - name: "name"
    type: "String"
  - name: "populatedAt"
    type: "DateTime"
  - name: "scope"
    type: "RevocationScope"
  relations:
  - name: "authority"
    type: "SessionAuthority"
    multiplicity: "ManyToOne"
  - name: "revokedSessions"
    type: "Session"
    multiplicity: "ManyToMany"
  - name: "revokedTokens"
    type: "RefreshToken"
    multiplicity: "OneToMany"
- name: "BrowserSessionCookie"
  description: "HTTP cookie configuration tied to a session for browser-based usage."
  data:
  - name: "name"
    type: "String"
  - name: "domain"
    type: "String"
  - name: "path"
    type: "String"
  - name: "sameSite"
    type: "CookieSameSite"
  - name: "httpOnly"
    type: "Boolean"
  - name: "secure"
    type: "Boolean"
  - name: "expiresAt"
    type: "DateTime"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "OneToOne"
  - name: "client"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
  - name: "settings"
    type: "CookiePolicy"
    multiplicity: "ManyToOne"
- name: "CookiePolicy"
  description: "Policy specifying default attributes for browser session cookies issued\
    \ by a client."
  data:
  - name: "name"
    type: "String"
  - name: "defaultPath"
    type: "String"
  - name: "defaultDomain"
    type: "String"
  - name: "sameSite"
    type: "CookieSameSite"
  - name: "secureRequired"
    type: "Boolean"
  - name: "httpOnlyRequired"
    type: "Boolean"
  relations:
  - name: "client"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
- name: "SessionStorageNode"
  description: "Storage backend node that persists session state and indices."
  data:
  - name: "name"
    type: "String"
  - name: "nodeType"
    type: "SessionPersistenceType"
  - name: "endpoint"
    type: "String"
  - name: "capacity"
    type: "Integer"
  - name: "status"
    type: "StorageNodeStatus"
  relations:
  - name: "authority"
    type: "SessionAuthority"
    multiplicity: "ManyToOne"
  - name: "cluster"
    type: "SessionCluster"
    multiplicity: "ManyToOne"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
- name: "SessionCluster"
  description: "Logical grouping of storage nodes for sharding, affinity, and replication."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "affinity"
    type: "SessionAffinity"
  - name: "replicationFactor"
    type: "Integer"
  relations:
  - name: "nodes"
    type: "SessionStorageNode"
    multiplicity: "OneToMany"
  - name: "authority"
    type: "SessionAuthority"
    multiplicity: "ManyToOne"
- name: "SessionTermination"
  description: "Record explaining how and why a session ended."
  data:
  - name: "reason"
    type: "RevocationReason"
  - name: "occurredAt"
    type: "DateTime"
  - name: "initiatedBy"
    type: "TerminationInitiator"
  - name: "comment"
    type: "String"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
- name: "SessionConcurrency"
  description: "Aggregate that tracks and enforces concurrent session limits for a\
    \ subject and client."
  data:
  - name: "maxAllowed"
    type: "Integer"
  - name: "currentCount"
    type: "Integer"
  - name: "lastEvaluatedAt"
    type: "DateTime"
  relations:
  - name: "subject"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "client"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "SessionPolicy"
    multiplicity: "ManyToOne"
- name: "SessionHeartbeat"
  description: "Keep-alive signal that updates activity and extends idle timeouts\
    \ when permitted."
  data:
  - name: "receivedAt"
    type: "DateTime"
  - name: "ipAddress"
    type: "IPAddress"
  - name: "userAgent"
    type: "UserAgent"
  - name: "result"
    type: "HeartbeatResult"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "client"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
- name: "DeviceProfile"
  description: "Persisted device characteristics observed for a subject to inform\
    \ trust and risk decisions."
  data:
  - name: "fingerprint"
    type: "DeviceFingerprint"
  - name: "model"
    type: "String"
  - name: "platform"
    type: "String"
  - name: "trustLevel"
    type: "DeviceTrustLevel"
  - name: "firstSeenAt"
    type: "DateTime"
  - name: "lastSeenAt"
    type: "DateTime"
  relations:
  - name: "subject"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
- name: "NetworkZone"
  description: "Named network segment and action used to allow, deny, or challenge\
    \ session activity."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "policyAction"
    type: "NetworkPolicyAction"
  - name: "cidr"
    type: "NetworkRange"
  relations:
  - name: "authority"
    type: "SessionAuthority"
    multiplicity: "ManyToOne"
  - name: "policies"
    type: "SessionPolicy"
    multiplicity: "ManyToMany"
- name: "SessionScopeAssignment"
  description: "Granted scope expression associated with a session for a specific\
    \ client."
  data:
  - name: "scopeExpression"
    type: "String"
  - name: "grantedAt"
    type: "DateTime"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "client"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
- name: "SessionExport"
  description: "Serialized snapshot of session state used for migration, backup, or\
    \ replication."
  data:
  - name: "format"
    type: "SnapshotFormat"
  - name: "createdAt"
    type: "DateTime"
  - name: "checksum"
    type: "Hash"
  - name: "sizeBytes"
    type: "Integer"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "storageNode"
    type: "SessionStorageNode"
    multiplicity: "ManyToOne"
- name: "SessionReplayAttempt"
  description: "Detection record of attempted reuse of session artifacts indicating\
    \ possible compromise."
  data:
  - name: "detectedAt"
    type: "DateTime"
  - name: "sourceIp"
    type: "IPAddress"
  - name: "userAgent"
    type: "UserAgent"
  - name: "outcome"
    type: "ReplayOutcome"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "authority"
    type: "SessionAuthority"
    multiplicity: "ManyToOne"
- name: "SessionBackChannelLogout"
  description: "Out-of-band logout notification dispatched to relying parties."
  data:
  - name: "endpoint"
    type: "String"
  - name: "status"
    type: "LogoutDeliveryStatus"
  - name: "attemptedAt"
    type: "DateTime"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "client"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
- name: "SessionFrontChannelLogout"
  description: "Browser-based logout mechanism utilizing redirects or embedded frames."
  data:
  - name: "logoutUrl"
    type: "String"
  - name: "status"
    type: "LogoutDeliveryStatus"
  - name: "attemptedAt"
    type: "DateTime"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "client"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
- name: "RememberMeSetting"
  description: "Controls persistence characteristics for long-lived, user-friendly\
    \ sessions."
  data:
  - name: "enabled"
    type: "Boolean"
  - name: "durationSeconds"
    type: "Integer"
  - name: "cookieName"
    type: "String"
  relations:
  - name: "policy"
    type: "SessionPolicy"
    multiplicity: "ManyToOne"
enums:
- name: "SessionState"
  description: "Lifecycle state of a session from creation to termination."
  data:
  - name: "Active"
  - name: "Idle"
  - name: "Expired"
  - name: "Revoked"
  - name: "Terminated"
  - name: "Pending"
  - name: "Locked"
- name: "SessionType"
  description: "Interaction mode for which the session is used."
  data:
  - name: "Browser"
  - name: "API"
  - name: "MobileApp"
  - name: "Service"
- name: "ClientType"
  description: "Type of client integrating with the session authority."
  data:
  - name: "Web"
  - name: "SPA"
  - name: "Native"
  - name: "MachineToMachine"
- name: "CookieSameSite"
  description: "SameSite directive applied to browser cookies."
  data:
  - name: "Strict"
  - name: "Lax"
  - name: "None"
- name: "DeviceTrustLevel"
  description: "Confidence level in the integrity and familiarity of a device."
  data:
  - name: "New"
  - name: "Trusted"
  - name: "Suspicious"
  - name: "Compromised"
- name: "SessionEventType"
  description: "Classification for session-related events."
  data:
  - name: "Created"
  - name: "Refreshed"
  - name: "Activity"
  - name: "IpChanged"
  - name: "DeviceChanged"
  - name: "ScopeUpdated"
  - name: "Locked"
  - name: "Unlocked"
  - name: "Revoked"
  - name: "Expired"
  - name: "Terminated"
  - name: "Logout"
- name: "RevocationReason"
  description: "Reason explaining why a session or token was invalidated."
  data:
  - name: "UserInitiated"
  - name: "AdminPolicy"
  - name: "RiskSignal"
  - name: "CredentialChange"
  - name: "LogoutAll"
  - name: "Inactivity"
  - name: "Violation"
- name: "SessionPersistenceType"
  description: "Storage mechanism used to persist session state."
  data:
  - name: "InMemory"
  - name: "DistributedCache"
  - name: "Database"
  - name: "Cookie"
- name: "SessionAffinity"
  description: "Strategy used to route subsequent requests to a stable backend node."
  data:
  - name: "None"
  - name: "ClientIp"
  - name: "CookieSticky"
  - name: "Header"
- name: "StorageNodeStatus"
  description: "Health condition of a session storage node."
  data:
  - name: "Online"
  - name: "Degraded"
  - name: "Offline"
  - name: "Draining"
- name: "TerminationInitiator"
  description: "Party that initiated the end of a session."
  data:
  - name: "User"
  - name: "Admin"
  - name: "System"
  - name: "Policy"
- name: "HeartbeatResult"
  description: "Outcome of a keep-alive signal for a session."
  data:
  - name: "Accepted"
  - name: "Ignored"
  - name: "Rejected"
  - name: "Extended"
- name: "BindingType"
  description: "Contextual attribute used to bind and constrain a session."
  data:
  - name: "IpAddress"
  - name: "Device"
  - name: "Geo"
  - name: "Client"
  - name: "TlsKey"
- name: "RevocationScope"
  description: "Scope at which revocation is applied."
  data:
  - name: "Session"
  - name: "Token"
  - name: "Subject"
  - name: "Client"
- name: "TokenFormat"
  description: "Representation of issued tokens used with sessions."
  data:
  - name: "Opaque"
  - name: "JWT"
  - name: "PASETO"
- name: "AssuranceLevel"
  description: "Authentication assurance level bound to a session."
  data:
  - name: "Low"
  - name: "Substantial"
  - name: "High"
- name: "LockReason"
  description: "Explanation for placing a lock on a session."
  data:
  - name: "AdminAction"
  - name: "RiskDetected"
  - name: "PolicyViolation"
  - name: "DeviceUntrusted"
  - name: "NetworkAnomaly"
- name: "NetworkPolicyAction"
  description: "Action to take when a session originates from a network zone."
  data:
  - name: "Allow"
  - name: "Deny"
  - name: "Challenge"
- name: "SnapshotFormat"
  description: "Serialization format used for exporting session state."
  data:
  - name: "JSON"
  - name: "MessagePack"
  - name: "Protobuf"
- name: "ReplayOutcome"
  description: "Decision taken when a suspected session replay is detected."
  data:
  - name: "Blocked"
  - name: "Allowed"
  - name: "Quarantined"
  - name: "Alerted"
- name: "LogoutDeliveryStatus"
  description: "Delivery outcome for logout notifications."
  data:
  - name: "Pending"
  - name: "Delivered"
  - name: "Failed"
- name: "TokenRotationStrategy"
  description: "Policy guiding when renewable tokens are rotated."
  data:
  - name: "Static"
  - name: "RotateOnUse"
  - name: "RotateOnRefresh"
- name: "SubjectType"
  description: "Classification of the principal represented by a session."
  data:
  - name: "User"
  - name: "Service"
  - name: "Admin"
  - name: "Device"
valueObjects:
- name: "SessionKey"
  description: "Opaque, unpredictable reference used to locate a session."
  data:
  - name: "value"
    type: "String"
- name: "IPAddress"
  description: "Canonical representation of an IPv4 or IPv6 address."
  data:
  - name: "value"
    type: "String"
- name: "UserAgent"
  description: "Client software identifier string supplied during requests."
  data:
  - name: "value"
    type: "String"
- name: "DeviceFingerprint"
  description: "Stable hash computed from device characteristics to identify a device\
    \ profile."
  data:
  - name: "value"
    type: "String"
- name: "NetworkRange"
  description: "Network segment expressed using CIDR notation."
  data:
  - name: "cidr"
    type: "String"
- name: "Hash"
  description: "Cryptographic digest paired with its algorithm name."
  data:
  - name: "algorithm"
    type: "String"
  - name: "value"
    type: "String"
