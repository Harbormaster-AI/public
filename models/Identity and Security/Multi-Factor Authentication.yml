---
metadata:
  name: "Multi-Factor Authentication Capabilities Model"
  description: "A capability-centric model for configuring, enrolling, challenging,\
    \ and verifying multi-factor authentication across organizations, devices, and\
    \ policies."
  version: "1.0.0"
  industry: "Software"
  category: "Identity and Security"
  type: "Capability"
  domain: "Multi-Factor Authentication"
entities:
- name: "Tenant"
  description: "Logical organization boundary that owns MFA configuration, users,\
    \ and delivery providers."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "mfaEnabled"
    type: "Boolean"
  - name: "defaultAal"
    type: "AssuranceLevel"
  relations:
  - name: "users"
    type: "User"
    multiplicity: "OneToMany"
  - name: "enrollmentPolicies"
    type: "EnrollmentPolicy"
    multiplicity: "OneToMany"
  - name: "authenticationPolicies"
    type: "AuthenticationPolicy"
    multiplicity: "OneToMany"
  - name: "providerConfigurations"
    type: "ProviderConfiguration"
    multiplicity: "OneToMany"
  - name: "notifications"
    type: "Notification"
    multiplicity: "OneToMany"
  - name: "sessions"
    type: "AuthenticationSession"
    multiplicity: "OneToMany"
- name: "User"
  description: "Person or service principal that signs in and enrolls authentication\
    \ factors."
  data:
  - name: "username"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "primaryEmail"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "status"
    type: "UserStatus"
  - name: "preferredLanguage"
    type: "String"
  - name: "timeZone"
    type: "String"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "authenticators"
    type: "Authenticator"
    multiplicity: "OneToMany"
  - name: "enrollments"
    type: "FactorEnrollment"
    multiplicity: "OneToMany"
  - name: "trustedDevices"
    type: "TrustedDevice"
    multiplicity: "OneToMany"
  - name: "sessions"
    type: "AuthenticationSession"
    multiplicity: "OneToMany"
  - name: "recoveryCodeSets"
    type: "RecoveryCodeSet"
    multiplicity: "OneToMany"
- name: "Authenticator"
  description: "A configured factor method or device capable of fulfilling verification\
    \ challenges."
  data:
  - name: "label"
    type: "String"
  - name: "factorType"
    type: "FactorType"
  - name: "status"
    type: "AuthenticatorStatus"
  - name: "enabled"
    type: "Boolean"
  - name: "enrolledAt"
    type: "DateTime"
  - name: "lastUsedAt"
    type: "DateTime"
  - name: "oobChannel"
    type: "DeliveryChannel"
  - name: "algorithm"
    type: "OtpAlgorithm"
  - name: "sharedSecret"
    type: "SecretKey"
  - name: "publicKey"
    type: "PublicKeyMaterial"
  - name: "maskedAddress"
    type: "String"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "challenges"
    type: "Challenge"
    multiplicity: "OneToMany"
  - name: "trustedDevices"
    type: "TrustedDevice"
    multiplicity: "ManyToMany"
- name: "FactorEnrollment"
  description: "Lifecycle record for adding, verifying, and managing an authenticator\
    \ for a user."
  data:
  - name: "factorType"
    type: "FactorType"
  - name: "enrollmentStatus"
    type: "EnrollmentStatus"
  - name: "enrollmentRequirement"
    type: "EnrollmentRequirement"
  - name: "enrolledAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  - name: "proofingLevel"
    type: "AssuranceLevel"
  - name: "deviceBindingRequired"
    type: "Boolean"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "authenticator"
    type: "Authenticator"
    multiplicity: "OneToOne"
  - name: "enrollmentPolicy"
    type: "EnrollmentPolicy"
    multiplicity: "ManyToOne"
- name: "AuthenticationSession"
  description: "End-to-end authentication transaction that may include one or more\
    \ MFA challenges."
  data:
  - name: "status"
    type: "SessionStatus"
  - name: "createdAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  - name: "clientIp"
    type: "IPAddress"
  - name: "userAgent"
    type: "UserAgent"
  - name: "interactionType"
    type: "InteractionType"
  - name: "requestedAal"
    type: "AssuranceLevel"
  - name: "achievedAal"
    type: "AssuranceLevel"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "challenges"
    type: "Challenge"
    multiplicity: "OneToMany"
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "OneToOne"
- name: "Challenge"
  description: "A single verification event issued to an authenticator or generated\
    \ for the user."
  data:
  - name: "challengeType"
    type: "ChallengeType"
  - name: "deliveryChannel"
    type: "DeliveryChannel"
  - name: "status"
    type: "ChallengeStatus"
  - name: "issuedAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  - name: "retryCount"
    type: "Integer"
  - name: "codeLength"
    type: "Integer"
  - name: "codeHash"
    type: "HashedSecret"
  - name: "totpSkewAllowance"
    type: "Integer"
  - name: "pushTitle"
    type: "String"
  - name: "pushBody"
    type: "String"
  relations:
  - name: "session"
    type: "AuthenticationSession"
    multiplicity: "ManyToOne"
  - name: "authenticator"
    type: "Authenticator"
    multiplicity: "ManyToOne"
  - name: "verificationAttempts"
    type: "VerificationAttempt"
    multiplicity: "OneToMany"
  - name: "notification"
    type: "Notification"
    multiplicity: "OneToOne"
- name: "VerificationAttempt"
  description: "User-submitted response or gesture evaluated against a challenge."
  data:
  - name: "result"
    type: "VerificationResult"
  - name: "submittedAt"
    type: "DateTime"
  - name: "responseLatencyMs"
    type: "Integer"
  - name: "errorCode"
    type: "String"
  - name: "location"
    type: "GeoPoint"
  - name: "clientIp"
    type: "IPAddress"
  - name: "deviceId"
    type: "String"
  relations:
  - name: "challenge"
    type: "Challenge"
    multiplicity: "ManyToOne"
  - name: "session"
    type: "AuthenticationSession"
    multiplicity: "ManyToOne"
  - name: "trustedDevice"
    type: "TrustedDevice"
    multiplicity: "ManyToOne"
- name: "TrustedDevice"
  description: "A device marked as trusted per policy to reduce MFA prompts."
  data:
  - name: "deviceLabel"
    type: "String"
  - name: "platform"
    type: "DevicePlatform"
  - name: "osVersion"
    type: "String"
  - name: "lastSeenAt"
    type: "DateTime"
  - name: "trustExpiresAt"
    type: "DateTime"
  - name: "trustState"
    type: "TrustState"
  - name: "bindingMethod"
    type: "BindingMethod"
  - name: "fingerprint"
    type: "DeviceFingerprint"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "authenticators"
    type: "Authenticator"
    multiplicity: "ManyToMany"
- name: "RiskAssessment"
  description: "Evaluation of session risk used to drive MFA and step-up decisions."
  data:
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "reasons"
    type: "String"
  - name: "evaluatedAt"
    type: "DateTime"
  - name: "anomalyScore"
    type: "Decimal"
  - name: "policyAction"
    type: "RiskPolicyAction"
  relations:
  - name: "session"
    type: "AuthenticationSession"
    multiplicity: "ManyToOne"
  - name: "signals"
    type: "RiskSignal"
    multiplicity: "OneToMany"
- name: "RiskSignal"
  description: "Individual signal that contributes to a risk assessment score."
  data:
  - name: "signalType"
    type: "RiskSignalType"
  - name: "value"
    type: "String"
  - name: "scoreContribution"
    type: "Decimal"
  relations:
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
- name: "EnrollmentPolicy"
  description: "Rules that govern which factors can be enrolled and whether enrollment\
    \ is required."
  data:
  - name: "name"
    type: "String"
  - name: "enrollmentRequirement"
    type: "EnrollmentRequirement"
  - name: "maxAuthenticatorsPerUser"
    type: "Integer"
  - name: "allowSelfServiceEnrollment"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "allowedFactorRules"
    type: "PolicyFactorRule"
    multiplicity: "OneToMany"
- name: "PolicyFactorRule"
  description: "Allowed factor configuration within an enrollment policy with priority\
    \ and defaults."
  data:
  - name: "factorType"
    type: "FactorType"
  - name: "defaultEnabled"
    type: "Boolean"
  - name: "priority"
    type: "Integer"
  - name: "minimumAal"
    type: "AssuranceLevel"
  relations:
  - name: "enrollmentPolicy"
    type: "EnrollmentPolicy"
    multiplicity: "ManyToOne"
- name: "AuthenticationPolicy"
  description: "Rules determining MFA requirements, challenge behavior, and session\
    \ strength."
  data:
  - name: "name"
    type: "String"
  - name: "requiredAal"
    type: "AssuranceLevel"
  - name: "reauthIntervalMinutes"
    type: "Integer"
  - name: "challengeExpirySeconds"
    type: "Integer"
  - name: "pushAllowed"
    type: "Boolean"
  - name: "rememberDeviceEnabled"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "conditionalRules"
    type: "ConditionalRule"
    multiplicity: "OneToMany"
- name: "ConditionalRule"
  description: "Policy condition and action used to trigger or skip MFA under specific\
    \ contexts."
  data:
  - name: "conditionType"
    type: "ConditionType"
  - name: "operator_"
    type: "ConditionOperator"
  - name: "value"
    type: "String"
  - name: "action"
    type: "PolicyAction"
  - name: "priority"
    type: "Integer"
  relations:
  - name: "authenticationPolicy"
    type: "AuthenticationPolicy"
    multiplicity: "ManyToOne"
- name: "Notification"
  description: "Out-of-band message sent to deliver or approve a verification challenge."
  data:
  - name: "channel"
    type: "DeliveryChannel"
  - name: "destination"
    type: "String"
  - name: "messageTemplate"
    type: "String"
  - name: "sentAt"
    type: "DateTime"
  - name: "deliveryStatus"
    type: "NotificationStatus"
  - name: "provider"
    type: "String"
  - name: "providerMessageId"
    type: "String"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "challenge"
    type: "Challenge"
    multiplicity: "ManyToOne"
  - name: "authenticator"
    type: "Authenticator"
    multiplicity: "ManyToOne"
- name: "RecoveryCodeSet"
  description: "Set of single-use recovery codes for regaining account access."
  data:
  - name: "codesHash"
    type: "HashedSecret"
  - name: "generatedAt"
    type: "DateTime"
  - name: "remainingCount"
    type: "Integer"
  - name: "codeLength"
    type: "Integer"
  - name: "status"
    type: "RecoveryCodeStatus"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "ProviderConfiguration"
  description: "Delivery provider settings used for sending MFA notifications."
  data:
  - name: "name"
    type: "String"
  - name: "providerType"
    type: "ProviderType"
  - name: "active"
    type: "Boolean"
  - name: "endpoint"
    type: "String"
  - name: "senderId"
    type: "String"
  - name: "apiKey"
    type: "SecretKey"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
enums:
- name: "UserStatus"
  description: "State of a user account impacting sign-in and MFA usage."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Locked"
  - name: "Disabled"
- name: "FactorType"
  description: "Supported multi-factor methods available for enrollment and verification."
  data:
  - name: "TOTP"
  - name: "HOTP"
  - name: "SMS"
  - name: "Email"
  - name: "Push"
  - name: "VoiceCall"
  - name: "SecurityKey"
  - name: "PlatformAuthenticator"
  - name: "RecoveryCode"
- name: "AuthenticatorStatus"
  description: "Lifecycle status of an authenticator indicating availability for use."
  data:
  - name: "PendingVerification"
  - name: "Active"
  - name: "Suspended"
  - name: "Revoked"
  - name: "Expired"
- name: "EnrollmentStatus"
  description: "Progress state of factor enrollment for a user."
  data:
  - name: "Initiated"
  - name: "Verified"
  - name: "Failed"
  - name: "Cancelled"
  - name: "Expired"
- name: "AssuranceLevel"
  description: "Authentication assurance strength achieved or required."
  data:
  - name: "AAL1"
  - name: "AAL2"
  - name: "AAL3"
- name: "DeliveryChannel"
  description: "Out-of-band channel used to deliver a challenge or approval request."
  data:
  - name: "SMS"
  - name: "Email"
  - name: "Push"
  - name: "VoiceCall"
- name: "ChallengeType"
  description: "Verification modality used by a challenge."
  data:
  - name: "OneTimePassword"
  - name: "PushApproval"
  - name: "BiometricAssertion"
  - name: "WebAuthnAssertion"
  - name: "RecoveryCodeEntry"
- name: "ChallengeStatus"
  description: "Current lifecycle state of a challenge instance."
  data:
  - name: "Issued"
  - name: "Delivered"
  - name: "PendingApproval"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Expired"
  - name: "Cancelled"
- name: "VerificationResult"
  description: "Outcome of evaluating a user response to a challenge."
  data:
  - name: "Success"
  - name: "Incorrect"
  - name: "Expired"
  - name: "Blocked"
  - name: "RateLimited"
  - name: "Error"
- name: "SessionStatus"
  description: "Progress and completion state of an authentication session."
  data:
  - name: "Started"
  - name: "WaitingForMFA"
  - name: "Completed"
  - name: "Failed"
  - name: "Abandoned"
  - name: "Expired"
- name: "DevicePlatform"
  description: "Operating platform reported by a trusted device."
  data:
  - name: "iOS"
  - name: "Android"
  - name: "Windows"
  - name: "macOS"
  - name: "Linux"
  - name: "Web"
- name: "TrustState"
  description: "Trustworthiness state reflecting whether a device can bypass MFA."
  data:
  - name: "Trusted"
  - name: "Expired"
  - name: "Revoked"
  - name: "Suspended"
- name: "BindingMethod"
  description: "Mechanism used to bind a device to a user or factor."
  data:
  - name: "Cookie"
  - name: "DeviceKey"
  - name: "TPM"
  - name: "SecureEnclave"
  - name: "PlatformAuthenticator"
- name: "RiskLevel"
  description: "Aggregate risk rating for a session used to inform policy actions."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "RiskPolicyAction"
  description: "Action recommended by risk evaluation for the current session."
  data:
  - name: "Allow"
  - name: "RequireStepUp"
  - name: "Deny"
- name: "InteractionType"
  description: "Context of the authentication flow requesting MFA."
  data:
  - name: "Login"
  - name: "StepUp"
  - name: "Reauthentication"
  - name: "TransactionApproval"
- name: "ConditionType"
  description: "Contextual attribute evaluated by a conditional policy rule."
  data:
  - name: "IpRange"
  - name: "GeoLocation"
  - name: "DeviceNewness"
  - name: "TimeOfDay"
  - name: "NetworkType"
  - name: "RiskLevel"
- name: "ConditionOperator"
  description: "Comparator used to evaluate a policy condition."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "In"
  - name: "NotIn"
  - name: "LessThan"
  - name: "GreaterThan"
  - name: "Between"
  - name: "Matches"
- name: "PolicyAction"
  description: "Enforcement behavior applied when a conditional rule matches."
  data:
  - name: "RequireMFA"
  - name: "SkipMFA"
  - name: "StepUpToAAL2"
  - name: "StepUpToAAL3"
  - name: "Block"
- name: "EnrollmentRequirement"
  description: "Degree to which factor enrollment is mandated for users."
  data:
  - name: "Required"
  - name: "Optional"
  - name: "Conditional"
- name: "NotificationStatus"
  description: "Delivery lifecycle state for an out-of-band notification."
  data:
  - name: "Queued"
  - name: "Sent"
  - name: "Delivered"
  - name: "Failed"
- name: "ProviderType"
  description: "Category of third-party service used to deliver MFA messages."
  data:
  - name: "SMS"
  - name: "Email"
  - name: "Push"
  - name: "VoiceCall"
- name: "OtpAlgorithm"
  description: "One-time password algorithm used by an authenticator."
  data:
  - name: "TOTP"
  - name: "HOTP"
- name: "HashAlgorithm"
  description: "Cryptographic hash family applied to stored secrets."
  data:
  - name: "SHA1"
  - name: "SHA256"
  - name: "SHA512"
- name: "RiskSignalType"
  description: "Specific indicator contributing to the overall risk calculation."
  data:
  - name: "ImpossibleTravel"
  - name: "TorExitNode"
  - name: "NewDevice"
  - name: "NewLocation"
  - name: "Velocity"
  - name: "LowReputationIP"
  - name: "MalwareSignal"
- name: "RecoveryCodeStatus"
  description: "Availability and rotation state for a set of recovery codes."
  data:
  - name: "Active"
  - name: "Regenerated"
  - name: "Exhausted"
  - name: "Revoked"
valueObjects:
- name: "EmailAddress"
  description: "Canonical email address representation with optional display components."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "E.164 formatted telephone number for SMS or voice delivery."
  data:
  - name: "value"
    type: "String"
- name: "IPAddress"
  description: "IPv4 or IPv6 textual address associated with the client connection."
  data:
  - name: "value"
    type: "String"
- name: "UserAgent"
  description: "Parsed user agent string identifying client software and platform."
  data:
  - name: "value"
    type: "String"
- name: "GeoPoint"
  description: "Geographic coordinates for approximate client location."
  data:
  - name: "latitude"
    type: "Decimal"
  - name: "longitude"
    type: "Decimal"
- name: "SecretKey"
  description: "Symmetric secret material stored securely for OTP or provider credentials."
  data:
  - name: "value"
    type: "String"
  - name: "encoding"
    type: "String"
- name: "HashedSecret"
  description: "Derived representation of a secret suitable for secure comparison."
  data:
  - name: "hash"
    type: "String"
  - name: "algorithm"
    type: "HashAlgorithm"
- name: "PublicKeyMaterial"
  description: "Asymmetric public key data used for WebAuthn or security keys."
  data:
  - name: "keyPem"
    type: "String"
  - name: "algorithm"
    type: "String"
- name: "DeviceFingerprint"
  description: "Stable, privacy-preserving identifier derived from device attributes."
  data:
  - name: "value"
    type: "String"
  - name: "method"
    type: "String"
