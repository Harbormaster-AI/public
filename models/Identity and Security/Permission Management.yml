---
metadata:
  name: "Permission Management Capabilities Model"
  description: "Canonical HCIDL model describing entities and relationships for defining,\
    \ grouping, assigning, evaluating, and reviewing permissions across resources\
    \ and scopes."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Identity and Security"
  type: "Capability"
  domain: "Permission Management"
entities:
- name: "ResourceType"
  description: "Classification of protected assets defining shared semantics and supported\
    \ actions."
  data:
  - name: "name"
    type: "String"
  - name: "namespace"
    type: "String"
  - name: "supportsHierarchy"
    type: "Boolean"
  relations:
  - name: "actions"
    type: "Action"
    multiplicity: "ManyToMany"
  - name: "resources"
    type: "Resource"
    multiplicity: "OneToMany"
- name: "Action"
  description: "Discrete operation that can be performed on a resource, such as read,\
    \ write, or delete."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "String"
  - name: "sensitivity"
    type: "ActionSensitivity"
  relations:
  - name: "resourceTypes"
    type: "ResourceType"
    multiplicity: "ManyToMany"
  - name: "impliedActions"
    type: "Action"
    multiplicity: "ManyToMany"
- name: "Resource"
  description: "Addressable protected object to which access is controlled."
  data:
  - name: "urn"
    type: "ResourceURN"
  - name: "displayName"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "resourceType"
    type: "ResourceType"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "Resource"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "ResourceGroup"
    multiplicity: "ManyToMany"
  - name: "scope"
    type: "Scope"
    multiplicity: "ManyToOne"
- name: "ResourceGroup"
  description: "Logical set of resources selected explicitly or via query."
  data:
  - name: "name"
    type: "String"
  - name: "selectionType"
    type: "ResourceSelectionType"
  - name: "query"
    type: "String"
  relations:
  - name: "resources"
    type: "Resource"
    multiplicity: "ManyToMany"
  - name: "scope"
    type: "Scope"
    multiplicity: "ManyToOne"
- name: "Scope"
  description: "Boundary within which permissions are evaluated, such as tenant, project,\
    \ or environment."
  data:
  - name: "name"
    type: "String"
  - name: "scopeType"
    type: "ScopeType"
  - name: "scopeKey"
    type: "String"
  relations:
  - name: "parentScope"
    type: "Scope"
    multiplicity: "ManyToOne"
  - name: "childScopes"
    type: "Scope"
    multiplicity: "OneToMany"
  - name: "resources"
    type: "Resource"
    multiplicity: "OneToMany"
  - name: "roleAssignments"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
  - name: "permissionGrants"
    type: "PermissionGrant"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
- name: "PermissionDefinition"
  description: "Canonical permission template binding an action to a resource type,\
    \ optionally constrained by conditions."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "strategy"
    type: "PermissionStrategy"
  relations:
  - name: "action"
    type: "Action"
    multiplicity: "ManyToOne"
  - name: "resourceType"
    type: "ResourceType"
    multiplicity: "ManyToOne"
  - name: "conditions"
    type: "Condition"
    multiplicity: "ManyToMany"
- name: "Role"
  description: "Named collection of permissions for assignment to principals within\
    \ a scope."
  data:
  - name: "name"
    type: "String"
  - name: "roleType"
    type: "RoleType"
  - name: "isSystem"
    type: "Boolean"
  relations:
  - name: "permissions"
    type: "PermissionDefinition"
    multiplicity: "ManyToMany"
  - name: "parentRoles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "childRoles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "delegations"
    type: "Delegation"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
- name: "Principal"
  description: "Actor evaluated for access, such as a user, group, or service account."
  data:
  - name: "displayName"
    type: "String"
  - name: "principalType"
    type: "PrincipalType"
  - name: "email"
    type: "String"
  - name: "externalReference"
    type: "String"
  relations:
  - name: "assignments"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
  - name: "permissionGrants"
    type: "PermissionGrant"
    multiplicity: "OneToMany"
  - name: "delegationsGiven"
    type: "Delegation"
    multiplicity: "OneToMany"
  - name: "delegationsReceived"
    type: "Delegation"
    multiplicity: "OneToMany"
  - name: "accessRequests"
    type: "AccessRequest"
    multiplicity: "OneToMany"
  - name: "reviews"
    type: "AccessReview"
    multiplicity: "OneToMany"
- name: "RoleAssignment"
  description: "Binding of a role to a principal within a specific scope and time\
    \ window."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "AssignmentStatus"
  - name: "reason"
    type: "String"
  relations:
  - name: "principal"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "role"
    type: "Role"
    multiplicity: "ManyToOne"
  - name: "scope"
    type: "Scope"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "PermissionGrant"
  description: "Direct permission assignment to a principal, independent of role membership."
  data:
  - name: "effect"
    type: "Effect"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "source"
    type: "GrantSource"
  - name: "reason"
    type: "String"
  relations:
  - name: "principal"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "permissionDefinition"
    type: "PermissionDefinition"
    multiplicity: "ManyToOne"
  - name: "scope"
    type: "Scope"
    multiplicity: "ManyToOne"
  - name: "conditions"
    type: "Condition"
    multiplicity: "ManyToMany"
  - name: "createdBy"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "AccessPolicy"
  description: "Policy container that evaluates statements to derive permissions for\
    \ principals within a scope."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "PolicyType"
  - name: "isEnabled"
    type: "Boolean"
  relations:
  - name: "statements"
    type: "PolicyStatement"
    multiplicity: "OneToMany"
  - name: "principals"
    type: "Principal"
    multiplicity: "ManyToMany"
  - name: "scope"
    type: "Scope"
    multiplicity: "ManyToOne"
- name: "PolicyStatement"
  description: "Atomic rule within a policy specifying effect, targeted actions, resources,\
    \ and optional conditions."
  data:
  - name: "effect"
    type: "Effect"
  - name: "priority"
    type: "Integer"
  relations:
  - name: "policy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
  - name: "actions"
    type: "Action"
    multiplicity: "ManyToMany"
  - name: "resources"
    type: "Resource"
    multiplicity: "ManyToMany"
  - name: "resourceTypes"
    type: "ResourceType"
    multiplicity: "ManyToMany"
  - name: "conditions"
    type: "Condition"
    multiplicity: "ManyToMany"
- name: "Condition"
  description: "Predicate used to constrain permissions based on attributes, context,\
    \ or environment."
  data:
  - name: "name"
    type: "String"
  - name: "expression"
    type: "ConditionExpression"
  - name: "language"
    type: "ConditionLanguage"
  - name: "evaluationMode"
    type: "EvaluationMode"
- name: "Delegation"
  description: "Temporary or permanent transfer of administrative capability from\
    \ one principal to another within a scope."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "delegationType"
    type: "DelegationType"
  - name: "reason"
    type: "String"
  relations:
  - name: "delegator"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "delegate"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "scope"
    type: "Scope"
    multiplicity: "ManyToOne"
- name: "AccessRequest"
  description: "Workflow entry initiated by a principal to obtain roles or direct\
    \ permissions."
  data:
  - name: "requestedAt"
    type: "Date"
  - name: "justification"
    type: "String"
  - name: "status"
    type: "AccessRequestStatus"
  relations:
  - name: "requester"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "requestedRole"
    type: "Role"
    multiplicity: "ManyToOne"
  - name: "requestedPermission"
    type: "PermissionDefinition"
    multiplicity: "ManyToOne"
  - name: "scope"
    type: "Scope"
    multiplicity: "ManyToOne"
  - name: "approvalTasks"
    type: "ApprovalTask"
    multiplicity: "OneToMany"
- name: "ApprovalTask"
  description: "Actionable item for an approver to decide on an access request."
  data:
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "ApprovalTaskStatus"
  - name: "decision"
    type: "ReviewDecision"
  - name: "notes"
    type: "String"
  relations:
  - name: "request"
    type: "AccessRequest"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "decidedBy"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "AccessReview"
  description: "Periodic certification campaign to validate that permissions and assignments\
    \ remain appropriate."
  data:
  - name: "name"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "ReviewStatus"
  relations:
  - name: "scope"
    type: "Scope"
    multiplicity: "ManyToOne"
  - name: "reviewers"
    type: "Principal"
    multiplicity: "ManyToMany"
  - name: "items"
    type: "ReviewItem"
    multiplicity: "OneToMany"
- name: "ReviewItem"
  description: "Unit of review representing a specific grant considered within a certification\
    \ campaign."
  data:
  - name: "decision"
    type: "ReviewDecision"
  - name: "notes"
    type: "String"
  relations:
  - name: "review"
    type: "AccessReview"
    multiplicity: "ManyToOne"
  - name: "permissionGrant"
    type: "PermissionGrant"
    multiplicity: "ManyToOne"
enums:
- name: "PrincipalType"
  description: "Types of actors that can be evaluated for access."
  data:
  - name: "User"
  - name: "Group"
  - name: "ServiceAccount"
  - name: "ExternalUser"
- name: "RoleType"
  description: "Classification of roles based on origin and governance."
  data:
  - name: "System"
  - name: "Business"
  - name: "Custom"
  - name: "Administrator"
- name: "Effect"
  description: "Direction of authorization outcome when a rule or grant matches."
  data:
  - name: "Allow"
  - name: "Deny"
- name: "AssignmentStatus"
  description: "Lifecycle states for role assignments."
  data:
  - name: "Pending"
  - name: "Active"
  - name: "Suspended"
  - name: "Expired"
  - name: "Cancelled"
- name: "PolicyType"
  description: "Evaluation model used to derive permissions from policy."
  data:
  - name: "AttributeBased"
  - name: "RoleBased"
  - name: "RuleBased"
  - name: "ContextAware"
- name: "ConditionLanguage"
  description: "Expression language used to author conditions."
  data:
  - name: "CEL"
  - name: "Rego"
  - name: "SpEL"
  - name: "SQLLike"
- name: "EvaluationMode"
  description: "Logical strategy for combining multiple conditions."
  data:
  - name: "AllOf"
  - name: "AnyOf"
  - name: "Not"
- name: "ScopeType"
  description: "Common boundaries for targeting and evaluating permissions."
  data:
  - name: "Global"
  - name: "Tenant"
  - name: "OrganizationUnit"
  - name: "Project"
  - name: "Environment"
  - name: "ResourceInstance"
- name: "ActionSensitivity"
  description: "Relative risk level associated with performing an action."
  data:
  - name: "Low"
  - name: "Moderate"
  - name: "High"
  - name: "Critical"
- name: "PermissionStrategy"
  description: "Mechanism by which a permission is resolved during evaluation."
  data:
  - name: "Static"
  - name: "Dynamic"
  - name: "Contextual"
- name: "ResourceSelectionType"
  description: "Technique used to specify membership in a resource group."
  data:
  - name: "Explicit"
  - name: "Query"
  - name: "Pattern"
- name: "DelegationType"
  description: "Duration model defining how long delegated authority remains in effect."
  data:
  - name: "Temporary"
  - name: "Permanent"
- name: "ReviewStatus"
  description: "Progress state of an access review campaign."
  data:
  - name: "Draft"
  - name: "InProgress"
  - name: "Completed"
  - name: "Archived"
- name: "ReviewDecision"
  description: "Outcome recorded by approvers or reviewers."
  data:
  - name: "Approve"
  - name: "Revoke"
  - name: "Escalate"
  - name: "NoChange"
- name: "GrantSource"
  description: "Origin by which a principal received effective permissions."
  data:
  - name: "Direct"
  - name: "Role"
  - name: "Policy"
  - name: "Delegation"
  - name: "Inheritance"
- name: "AccessRequestStatus"
  description: "Processing state of an access request."
  data:
  - name: "Submitted"
  - name: "UnderReview"
  - name: "Approved"
  - name: "Rejected"
  - name: "Withdrawn"
- name: "ApprovalTaskStatus"
  description: "Lifecycle state of an approval task tied to an access request."
  data:
  - name: "Open"
  - name: "Waiting"
  - name: "Decided"
  - name: "Cancelled"
valueObjects:
- name: "ResourceURN"
  description: "Uniform resource name string uniquely addressing a protected resource\
    \ within the authorization system."
  data:
  - name: "value"
    type: "String"
- name: "ConditionExpression"
  description: "Free-form expression text representing a boolean predicate evaluated\
    \ at runtime."
  data:
  - name: "text"
    type: "String"
- name: "TimeWindow"
  description: "Time interval specifying a start and end date for time-bound access\
    \ decisions."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
