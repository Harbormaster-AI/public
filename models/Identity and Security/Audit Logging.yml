---
metadata:
  name: "Audit Logging Capabilities Model"
  description: "Canonical HCIDL capabilities model for end-to-end audit logging, covering\
    \ event capture, normalization, storage, integrity, governance, querying, alerting,\
    \ exporting, and reporting across identity and security domains."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Identity and Security"
  type: "Capability"
  domain: "Audit Logging"
entities:
- name: "Tenant"
  description: "Logical boundary for isolating audit data, configuration, and policies\
    \ across organizations or environments."
  data:
  - name: "name"
    type: "String"
  - name: "slug"
    type: "String"
  - name: "region"
    type: "String"
  - name: "defaultTimezone"
    type: "String"
  relations:
  - name: "sources"
    type: "LogSource"
    multiplicity: "OneToMany"
  - name: "streams"
    type: "LogStream"
    multiplicity: "OneToMany"
  - name: "retentionPolicies"
    type: "RetentionPolicy"
    multiplicity: "OneToMany"
  - name: "redactionRules"
    type: "RedactionRule"
    multiplicity: "OneToMany"
  - name: "ingestionEndpoints"
    type: "IngestionEndpoint"
    multiplicity: "OneToMany"
  - name: "storageTargets"
    type: "StorageTarget"
    multiplicity: "OneToMany"
  - name: "integrityChains"
    type: "IntegrityChain"
    multiplicity: "OneToMany"
  - name: "savedQueries"
    type: "SavedQuery"
    multiplicity: "OneToMany"
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "OneToMany"
  - name: "notificationChannels"
    type: "NotificationChannel"
    multiplicity: "OneToMany"
  - name: "exportJobs"
    type: "ExportJob"
    multiplicity: "OneToMany"
  - name: "complianceReports"
    type: "ComplianceReport"
    multiplicity: "OneToMany"
- name: "LogSource"
  description: "Application, service, or system component that emits raw audit records\
    \ for ingestion."
  data:
  - name: "name"
    type: "String"
  - name: "systemName"
    type: "String"
  - name: "environment"
    type: "Environment"
  - name: "category"
    type: "AuditCategory"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "streams"
    type: "LogStream"
    multiplicity: "OneToMany"
  - name: "ingestionPipelines"
    type: "IngestionPipeline"
    multiplicity: "ManyToMany"
  - name: "endpoints"
    type: "IngestionEndpoint"
    multiplicity: "ManyToMany"
- name: "LogStream"
  description: "Logical channel that groups normalized audit events from one or more\
    \ sources by schema and policy."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "source"
    type: "LogSource"
    multiplicity: "ManyToOne"
  - name: "schema"
    type: "EventSchema"
    multiplicity: "ManyToOne"
  - name: "events"
    type: "AuditEvent"
    multiplicity: "OneToMany"
  - name: "retentionPolicy"
    type: "RetentionPolicy"
    multiplicity: "ManyToOne"
  - name: "redactionRules"
    type: "RedactionRule"
    multiplicity: "ManyToMany"
  - name: "storageTargets"
    type: "StorageTarget"
    multiplicity: "ManyToMany"
  - name: "archives"
    type: "Archive"
    multiplicity: "ManyToMany"
- name: "EventSchema"
  description: "Versioned structure that defines normalized audit event fields and\
    \ semantics for a stream."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "definitionUri"
    type: "ResourceLocator"
  relations:
  - name: "streams"
    type: "LogStream"
    multiplicity: "OneToMany"
- name: "Actor"
  description: "Principal responsible for initiating an auditable action, including\
    \ users, services, and devices."
  data:
  - name: "actorType"
    type: "ActorType"
  - name: "principal"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "ipAddress"
    type: "IPAddress"
  - name: "userAgent"
    type: "UserAgent"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "events"
    type: "AuditEvent"
    multiplicity: "OneToMany"
  - name: "createdQueries"
    type: "SavedQuery"
    multiplicity: "OneToMany"
  - name: "assignedIncidents"
    type: "AlertIncident"
    multiplicity: "OneToMany"
  - name: "generatedReports"
    type: "ComplianceReport"
    multiplicity: "OneToMany"
  - name: "requestedExports"
    type: "ExportJob"
    multiplicity: "OneToMany"
- name: "Resource"
  description: "Target entity impacted by an audit action, such as a user, role, policy,\
    \ dataset, or secret."
  data:
  - name: "resourceType"
    type: "ResourceType"
  - name: "name"
    type: "String"
  - name: "resourceUrn"
    type: "ResourceLocator"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "events"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "AuditEvent"
  description: "Immutable, ordered record of a security-relevant action with normalized\
    \ context and outcome."
  data:
  - name: "occurredAt"
    type: "DateTime"
  - name: "receivedAt"
    type: "DateTime"
  - name: "category"
    type: "AuditCategory"
  - name: "eventType"
    type: "String"
  - name: "severity"
    type: "Severity"
  - name: "outcome"
    type: "Outcome"
  - name: "correlationId"
    type: "String"
  - name: "requestId"
    type: "String"
  - name: "traceId"
    type: "String"
  - name: "ipAddress"
    type: "IPAddress"
  - name: "userAgent"
    type: "UserAgent"
  - name: "geolocation"
    type: "GeoPoint"
  - name: "additionalContext"
    type: "String"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "actor"
    type: "Actor"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "source"
    type: "LogSource"
    multiplicity: "ManyToOne"
  - name: "stream"
    type: "LogStream"
    multiplicity: "ManyToOne"
  - name: "integrityChain"
    type: "IntegrityChain"
    multiplicity: "ManyToOne"
  - name: "attachments"
    type: "EventAttachment"
    multiplicity: "OneToMany"
- name: "EventAttachment"
  description: "Supplemental artifact linked to an audit event, such as evidence,\
    \ payload fragments, or reports."
  data:
  - name: "name"
    type: "String"
  - name: "mediaType"
    type: "String"
  - name: "contentHash"
    type: "Hash"
  - name: "uri"
    type: "ResourceLocator"
  relations:
  - name: "event"
    type: "AuditEvent"
    multiplicity: "ManyToOne"
- name: "IngestionEndpoint"
  description: "Network-accessible collector that receives raw audit records for normalization\
    \ and routing."
  data:
  - name: "name"
    type: "String"
  - name: "protocol"
    type: "IngestionProtocol"
  - name: "endpointUrl"
    type: "String"
  - name: "authenticationMethod"
    type: "IngestionAuthMethod"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "pipelines"
    type: "IngestionPipeline"
    multiplicity: "OneToMany"
  - name: "sources"
    type: "LogSource"
    multiplicity: "ManyToMany"
- name: "IngestionPipeline"
  description: "Configurable processing flow that parses, enriches, and routes inbound\
    \ audit data to streams and storage."
  data:
  - name: "name"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  - name: "description"
    type: "String"
  relations:
  - name: "endpoint"
    type: "IngestionEndpoint"
    multiplicity: "ManyToOne"
  - name: "parserRules"
    type: "ParserRule"
    multiplicity: "OneToMany"
  - name: "destinations"
    type: "StorageTarget"
    multiplicity: "ManyToMany"
  - name: "sources"
    type: "LogSource"
    multiplicity: "ManyToMany"
  - name: "streams"
    type: "LogStream"
    multiplicity: "ManyToMany"
- name: "ParserRule"
  description: "Pattern-driven instruction for extracting, transforming, and validating\
    \ fields from raw input."
  data:
  - name: "name"
    type: "String"
  - name: "pattern"
    type: "RegexPattern"
  - name: "mappingTemplate"
    type: "String"
  - name: "timestampPath"
    type: "String"
  - name: "dropWhenMatch"
    type: "Boolean"
  relations:
  - name: "pipeline"
    type: "IngestionPipeline"
    multiplicity: "ManyToOne"
- name: "StorageTarget"
  description: "Durable storage destination for audit data, optimized by tier, compression,\
    \ and immutability."
  data:
  - name: "name"
    type: "String"
  - name: "provider"
    type: "StorageProvider"
  - name: "location"
    type: "StorageLocation"
  - name: "compression"
    type: "CompressionType"
  - name: "storageTier"
    type: "StorageTier"
  - name: "immutable"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "pipelines"
    type: "IngestionPipeline"
    multiplicity: "ManyToMany"
  - name: "streams"
    type: "LogStream"
    multiplicity: "ManyToMany"
  - name: "archives"
    type: "Archive"
    multiplicity: "OneToMany"
- name: "Archive"
  description: "Historical package of audit data preserved for long-term retention\
    \ or compliance offloading."
  data:
  - name: "name"
    type: "String"
  - name: "startedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  - name: "reason"
    type: "ArchiveReason"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "storageTarget"
    type: "StorageTarget"
    multiplicity: "ManyToOne"
  - name: "streams"
    type: "LogStream"
    multiplicity: "ManyToMany"
- name: "RetentionPolicy"
  description: "Rules governing how long audit data is kept and how it is disposed\
    \ when eligibility is reached."
  data:
  - name: "name"
    type: "String"
  - name: "retentionDuration"
    type: "Duration"
  - name: "legalHoldEnabled"
    type: "Boolean"
  - name: "deleteMode"
    type: "DeleteMode"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "streams"
    type: "LogStream"
    multiplicity: "OneToMany"
- name: "RedactionRule"
  description: "Policy for masking or removing sensitive fields during ingestion,\
    \ indexing, or export."
  data:
  - name: "name"
    type: "String"
  - name: "method"
    type: "RedactionMethod"
  - name: "pattern"
    type: "RegexPattern"
  - name: "appliesToField"
    type: "String"
  - name: "reversible"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "streams"
    type: "LogStream"
    multiplicity: "ManyToMany"
- name: "IntegrityChain"
  description: "Cryptographic sequence linking events to prove ordering and tamper-evidence."
  data:
  - name: "name"
    type: "String"
  - name: "algorithm"
    type: "HashAlgorithm"
  - name: "anchored"
    type: "Boolean"
  - name: "anchorReference"
    type: "String"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "events"
    type: "AuditEvent"
    multiplicity: "OneToMany"
  - name: "proofs"
    type: "IntegrityProof"
    multiplicity: "OneToMany"
- name: "IntegrityProof"
  description: "Periodic attestation of a chain’s state, including signed roots and\
    \ verifier details."
  data:
  - name: "createdAt"
    type: "DateTime"
  - name: "rootHash"
    type: "Hash"
  - name: "signature"
    type: "Signature"
  - name: "verifier"
    type: "String"
  relations:
  - name: "chain"
    type: "IntegrityChain"
    multiplicity: "ManyToOne"
- name: "SavedQuery"
  description: "Persisted search definition for reusable investigations, dashboards,\
    \ and alerts."
  data:
  - name: "name"
    type: "String"
  - name: "query"
    type: "QueryString"
  - name: "description"
    type: "String"
  - name: "isPublic"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "Actor"
    multiplicity: "ManyToOne"
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "OneToMany"
  - name: "exportJobs"
    type: "ExportJob"
    multiplicity: "OneToMany"
- name: "AlertRule"
  description: "Condition that evaluates event streams and queries to detect suspicious\
    \ or policy-relevant activity."
  data:
  - name: "name"
    type: "String"
  - name: "severity"
    type: "Severity"
  - name: "enabled"
    type: "Boolean"
  - name: "threshold"
    type: "Integer"
  - name: "window"
    type: "Duration"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "query"
    type: "SavedQuery"
    multiplicity: "ManyToOne"
  - name: "notificationChannels"
    type: "NotificationChannel"
    multiplicity: "ManyToMany"
  - name: "incidents"
    type: "AlertIncident"
    multiplicity: "OneToMany"
- name: "AlertIncident"
  description: "Lifecycle record of a detected alert occurrence, including assignment\
    \ and related evidence."
  data:
  - name: "startedAt"
    type: "DateTime"
  - name: "endedAt"
    type: "DateTime"
  - name: "status"
    type: "IncidentStatus"
  - name: "summary"
    type: "String"
  relations:
  - name: "alertRule"
    type: "AlertRule"
    multiplicity: "ManyToOne"
  - name: "events"
    type: "AuditEvent"
    multiplicity: "ManyToMany"
  - name: "assignee"
    type: "Actor"
    multiplicity: "ManyToOne"
- name: "NotificationChannel"
  description: "Destination for alert notifications, such as email, webhooks, and\
    \ chat integrations."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "NotificationChannelType"
  - name: "endpoint"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "ManyToMany"
- name: "ExportJob"
  description: "Operational request to extract a set of audit events for investigation,\
    \ eDiscovery, or compliance."
  data:
  - name: "requestedAt"
    type: "DateTime"
  - name: "status"
    type: "ExportStatus"
  - name: "format"
    type: "ExportFormat"
  - name: "timeRange"
    type: "TimeRange"
  - name: "resultLocation"
    type: "StorageLocation"
  - name: "includeAttachments"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "requestedBy"
    type: "Actor"
    multiplicity: "ManyToOne"
  - name: "query"
    type: "SavedQuery"
    multiplicity: "ManyToOne"
  - name: "streams"
    type: "LogStream"
    multiplicity: "ManyToMany"
- name: "ComplianceReport"
  description: "Generated summary of audit evidence aligned to regulatory or internal\
    \ control requirements."
  data:
  - name: "name"
    type: "String"
  - name: "reportType"
    type: "ReportType"
  - name: "generatedAt"
    type: "DateTime"
  - name: "status"
    type: "ReportStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "generatedBy"
    type: "Actor"
    multiplicity: "ManyToOne"
  - name: "sourceExports"
    type: "ExportJob"
    multiplicity: "ManyToMany"
enums:
- name: "AuditCategory"
  description: "High-level classification of audit activity used for routing, policy,\
    \ and reporting."
  data:
  - name: "Authentication"
  - name: "Authorization"
  - name: "DataAccess"
  - name: "ConfigurationChange"
  - name: "PolicyChange"
  - name: "PrivilegeChange"
  - name: "KeyManagement"
  - name: "SecretAccess"
  - name: "CertificateLifecycle"
  - name: "APIActivity"
  - name: "SystemActivity"
  - name: "DataExport"
  - name: "Governance"
- name: "Severity"
  description: "Relative importance or risk level associated with an audit event or\
    \ alert."
  data:
  - name: "Info"
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "Outcome"
  description: "Result of the attempted action being audited."
  data:
  - name: "Success"
  - name: "Failure"
  - name: "Denied"
  - name: "Partial"
- name: "ActorType"
  description: "Category of principal responsible for initiating an event."
  data:
  - name: "HumanUser"
  - name: "ServiceAccount"
  - name: "Device"
  - name: "ExternalIdentity"
  - name: "SystemProcess"
- name: "ResourceType"
  description: "Kind of target object affected by an event."
  data:
  - name: "User"
  - name: "Group"
  - name: "Role"
  - name: "Permission"
  - name: "Policy"
  - name: "Dataset"
  - name: "Record"
  - name: "Secret"
  - name: "Certificate"
  - name: "APIKey"
  - name: "Endpoint"
  - name: "Organization"
  - name: "Tenant"
  - name: "Project"
- name: "Environment"
  description: "Deployment context of the source emitting events."
  data:
  - name: "Production"
  - name: "Staging"
  - name: "Development"
  - name: "Test"
- name: "IngestionProtocol"
  description: "Supported transport mechanism for audit data collection."
  data:
  - name: "HTTPS"
  - name: "SyslogTCP"
  - name: "SyslogUDP"
  - name: "Kafka"
  - name: "S3"
- name: "IngestionAuthMethod"
  description: "Authentication required by an ingestion endpoint."
  data:
  - name: "None"
  - name: "APIKey"
  - name: "mTLS"
  - name: "OAuth2"
- name: "StorageProvider"
  description: "Platform providing the durable storage service."
  data:
  - name: "Internal"
  - name: "AWS"
  - name: "GCP"
  - name: "Azure"
- name: "CompressionType"
  description: "Compression algorithm applied to stored audit data."
  data:
  - name: "None"
  - name: "GZIP"
  - name: "ZSTD"
- name: "StorageTier"
  description: "Access and cost optimization tier for stored data."
  data:
  - name: "Hot"
  - name: "Warm"
  - name: "Cold"
  - name: "Archive"
- name: "ArchiveReason"
  description: "Trigger or purpose for creating an audit archive."
  data:
  - name: "RetentionExpiration"
  - name: "LegalHoldRelease"
  - name: "Manual"
- name: "DeleteMode"
  description: "Method used to dispose of audit data when retention is met."
  data:
  - name: "SoftDelete"
  - name: "HardDelete"
- name: "RedactionMethod"
  description: "Technique used to protect sensitive information within audit content."
  data:
  - name: "Mask"
  - name: "Remove"
  - name: "Hash"
  - name: "Tokenize"
- name: "HashAlgorithm"
  description: "Cryptographic hash function for integrity and fingerprinting."
  data:
  - name: "SHA256"
  - name: "SHA384"
  - name: "SHA512"
- name: "ExportStatus"
  description: "Lifecycle state of an export job."
  data:
  - name: "Requested"
  - name: "Running"
  - name: "Completed"
  - name: "Failed"
  - name: "Cancelled"
- name: "ExportFormat"
  description: "File format for exported audit data."
  data:
  - name: "JSON"
  - name: "NDJSON"
  - name: "CSV"
  - name: "Parquet"
- name: "NotificationChannelType"
  description: "Mechanism used to deliver alert notifications."
  data:
  - name: "Email"
  - name: "Webhook"
  - name: "Slack"
  - name: "Teams"
  - name: "PagerDuty"
- name: "IncidentStatus"
  description: "Current state of an alert incident through its lifecycle."
  data:
  - name: "Open"
  - name: "Acknowledged"
  - name: "Resolved"
  - name: "Closed"
- name: "ReportType"
  description: "Purpose and scope of a compliance report."
  data:
  - name: "AccessReview"
  - name: "PolicyChangeHistory"
  - name: "PrivilegedActivity"
  - name: "DataExportHistory"
  - name: "AuthenticationSummary"
- name: "ReportStatus"
  description: "Generation status of a compliance report."
  data:
  - name: "Pending"
  - name: "InProgress"
  - name: "Completed"
  - name: "Failed"
- name: "TimeUnit"
  description: "Granularity for expressing durations in policies and windows."
  data:
  - name: "Seconds"
  - name: "Minutes"
  - name: "Hours"
  - name: "Days"
  - name: "Weeks"
  - name: "Months"
valueObjects:
- name: "IPAddress"
  description: "IPv4 or IPv6 address value used for network attribution."
  data:
  - name: "value"
    type: "String"
- name: "UserAgent"
  description: "Raw user agent string conveying client and platform details."
  data:
  - name: "value"
    type: "String"
- name: "RegexPattern"
  description: "Regular expression with optional flags for parsing or redaction."
  data:
  - name: "pattern"
    type: "String"
  - name: "flags"
    type: "String"
- name: "Duration"
  description: "Length of time represented as a quantity and unit."
  data:
  - name: "amount"
    type: "Integer"
  - name: "unit"
    type: "TimeUnit"
- name: "TimeRange"
  description: "Closed interval of time with a start and end instant."
  data:
  - name: "start"
    type: "DateTime"
  - name: "end"
    type: "DateTime"
- name: "StorageLocation"
  description: "Provider-specific storage reference used for persistence or export\
    \ destinations."
  data:
  - name: "bucket"
    type: "String"
  - name: "path"
    type: "String"
  - name: "region"
    type: "String"
- name: "Hash"
  description: "Cryptographic digest with specified algorithm for integrity validation."
  data:
  - name: "value"
    type: "String"
  - name: "algorithm"
    type: "HashAlgorithm"
- name: "Signature"
  description: "Digital signature associated with an integrity proof."
  data:
  - name: "value"
    type: "String"
  - name: "algorithm"
    type: "String"
  - name: "publicKeyFingerprint"
    type: "String"
- name: "ResourceLocator"
  description: "Portable URI or URN that locates a referenced entity or schema."
  data:
  - name: "uri"
    type: "String"
- name: "QueryString"
  description: "Stored query definition as a serialized string for the audit search\
    \ engine."
  data:
  - name: "value"
