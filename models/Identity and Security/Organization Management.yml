---
metadata:
  name: "HCIDL Organization Management Model"
  description: "Core capabilities model for defining, structuring, and governing organizational\
    \ hierarchies, units, teams, memberships, positions, and inter-organization trust\
    \ within an identity and security context."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Identity and Security"
  type: "Capability"
  domain: "Organization Management"
entities:
- name: "Organization"
  description: "Root container representing a business, institution, or tenant that\
    \ owns domains, structure, members, and collaboration relationships."
  data:
  - name: "displayName"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "status"
    type: "OrganizationStatus"
  - name: "defaultLocale"
    type: "Locale"
  - name: "defaultTimeZone"
    type: "TimeZoneId"
  - name: "supportEmail"
    type: "EmailAddress"
  - name: "website"
    type: "Url"
  relations:
  - name: "domains"
    type: "VerifiedDomain"
    multiplicity: "OneToMany"
  - name: "organizationUnits"
    type: "OrganizationUnit"
    multiplicity: "OneToMany"
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "members"
    type: "Membership"
    multiplicity: "OneToMany"
  - name: "trusts"
    type: "OrganizationTrust"
    multiplicity: "OneToMany"
  - name: "invitations"
    type: "OrganizationInvitation"
    multiplicity: "OneToMany"
  - name: "lifecycleEvents"
    type: "OrganizationLifecycleEvent"
    multiplicity: "OneToMany"
- name: "VerifiedDomain"
  description: "Claimed internet domain controlled by the organization and used for\
    \ identity, email, and federation."
  data:
  - name: "domainName"
    type: "String"
  - name: "isPrimary"
    type: "Boolean"
  - name: "verificationStatus"
    type: "DomainVerificationStatus"
  - name: "dnsRecordValue"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "OrganizationUnit"
  description: "Hierarchical subdivision of an organization such as a division, department,\
    \ or project-based unit."
  data:
  - name: "name"
    type: "String"
  - name: "unitType"
    type: "OrgUnitType"
  - name: "code"
    type: "Code"
  - name: "path"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "OrganizationUnit"
    multiplicity: "OneToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "OneToMany"
  - name: "positions"
    type: "Position"
    multiplicity: "OneToMany"
  - name: "memberships"
    type: "Membership"
    multiplicity: "OneToMany"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "labels"
    type: "Label"
    multiplicity: "ManyToMany"
- name: "Team"
  description: "Cross-functional or functional group used for collaboration, communication,\
    \ and access scoping."
  data:
  - name: "name"
    type: "String"
  - name: "teamType"
    type: "TeamType"
  - name: "email"
    type: "EmailAddress"
  - name: "isSecuritySensitive"
    type: "Boolean"
  relations:
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Identity"
    multiplicity: "ManyToOne"
  - name: "memberships"
    type: "Membership"
    multiplicity: "OneToMany"
  - name: "labels"
    type: "Label"
    multiplicity: "ManyToMany"
- name: "Position"
  description: "Authorized job position or seat within an organization unit, optionally\
    \ with a designated occupant."
  data:
  - name: "title"
    type: "String"
  - name: "positionType"
    type: "PositionType"
  - name: "grade"
    type: "String"
  - name: "maximumHeadcount"
    type: "Integer"
  - name: "isManagerial"
    type: "Boolean"
  relations:
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "occupant"
    type: "Identity"
    multiplicity: "ManyToOne"
  - name: "delegations"
    type: "Delegation"
    multiplicity: "OneToMany"
- name: "Identity"
  description: "Person or non-human principal recognized by the directory and eligible\
    \ for organizational membership."
  data:
  - name: "primaryEmail"
    type: "EmailAddress"
  - name: "displayName"
    type: "String"
  - name: "givenName"
    type: "String"
  - name: "familyName"
    type: "String"
  - name: "kind"
    type: "IdentityKind"
  - name: "isExternal"
    type: "Boolean"
  - name: "phone"
    type: "PhoneNumber"
  - name: "locale"
    type: "Locale"
  - name: "timeZone"
    type: "TimeZoneId"
  relations:
  - name: "memberships"
    type: "Membership"
    multiplicity: "OneToMany"
  - name: "positions"
    type: "Position"
    multiplicity: "OneToMany"
  - name: "delegations"
    type: "Delegation"
    multiplicity: "OneToMany"
- name: "Membership"
  description: "Assignment linking an identity to an organization and optionally to\
    \ a unit, team, or position."
  data:
  - name: "membershipType"
    type: "MembershipType"
  - name: "status"
    type: "MembershipStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "primary"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "identity"
    type: "Identity"
    multiplicity: "ManyToOne"
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
  - name: "manager"
    type: "Identity"
    multiplicity: "ManyToOne"
- name: "Delegation"
  description: "Time-bound assignment that allows a delegate to act on behalf of a\
    \ delegator or position."
  data:
  - name: "delegationType"
    type: "DelegationType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "reason"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
  - name: "delegator"
    type: "Identity"
    multiplicity: "ManyToOne"
  - name: "delegate"
    type: "Identity"
    multiplicity: "ManyToOne"
- name: "Location"
  description: "Physical or virtual site associated with organization units and regional\
    \ governance."
  data:
  - name: "name"
    type: "String"
  - name: "locationType"
    type: "LocationType"
  - name: "address"
    type: "PostalAddress"
  - name: "timeZone"
    type: "TimeZoneId"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "units"
    type: "OrganizationUnit"
    multiplicity: "OneToMany"
- name: "OrganizationTrust"
  description: "Relationship describing collaboration or federation trust between\
    \ two organizations."
  data:
  - name: "trustType"
    type: "TrustType"
  - name: "status"
    type: "TrustStatus"
  - name: "establishedOn"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "sourceOrganization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "targetOrganization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "OrganizationInvitation"
  description: "Invitation sent to a prospective member to join an organization, unit,\
    \ or team."
  data:
  - name: "email"
    type: "EmailAddress"
  - name: "message"
    type: "String"
  - name: "invitedAs"
    type: "MembershipType"
  - name: "expiresOn"
    type: "Date"
  - name: "status"
    type: "InvitationStatus"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "invitedBy"
    type: "Identity"
    multiplicity: "ManyToOne"
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
- name: "OrganizationLifecycleEvent"
  description: "Audit record capturing significant lifecycle changes to an organization."
  data:
  - name: "eventType"
    type: "OrganizationLifecycleEventType"
  - name: "occurredAt"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "relatedOrganization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "Label"
  description: "Managed taxonomy tag used to classify organization units and teams\
    \ for governance and reporting."
  data:
  - name: "name"
    type: "String"
  - name: "labelType"
    type: "LabelType"
  - name: "color"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "units"
    type: "OrganizationUnit"
    multiplicity: "ManyToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
enums:
- name: "OrganizationStatus"
  description: "Lifecycle state of an organization within the directory."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Deactivated"
  - name: "PendingVerification"
- name: "OrgUnitType"
  description: "Classification of an organizational unit."
  data:
  - name: "Division"
  - name: "Department"
  - name: "Section"
  - name: "Project"
  - name: "Region"
- name: "TeamType"
  description: "Taxonomy for how teams are formed and used."
  data:
  - name: "Functional"
  - name: "Project"
  - name: "Community"
  - name: "Guild"
  - name: "SecurityGroup"
- name: "PositionType"
  description: "Employment category or designation for a position."
  data:
  - name: "FullTime"
  - name: "PartTime"
  - name: "Temporary"
  - name: "Intern"
  - name: "Executive"
- name: "MembershipType"
  description: "Nature of a member’s affiliation to the organization."
  data:
  - name: "Employee"
  - name: "Contractor"
  - name: "Vendor"
  - name: "ServiceAccount"
  - name: "Guest"
- name: "MembershipStatus"
  description: "Current state of a membership assignment."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Pending"
  - name: "Suspended"
- name: "DelegationType"
  description: "Purpose and scope of a delegation."
  data:
  - name: "Acting"
  - name: "Proxy"
  - name: "ApprovalDelegate"
- name: "IdentityKind"
  description: "Core kind of principal represented by an identity."
  data:
  - name: "Human"
  - name: "Service"
  - name: "Bot"
- name: "TrustType"
  description: "Collaboration model established between organizations."
  data:
  - name: "Federation"
  - name: "B2BCollaboration"
  - name: "ParentSubsidiary"
  - name: "DataProcessing"
- name: "TrustStatus"
  description: "Operational state of an inter-organization trust."
  data:
  - name: "Proposed"
  - name: "Active"
  - name: "Suspended"
  - name: "Terminated"
- name: "DomainVerificationStatus"
  description: "Status of ownership proof for a claimed domain."
  data:
  - name: "Unverified"
  - name: "Pending"
  - name: "Verified"
  - name: "Failed"
- name: "LocationType"
  description: "Type of site associated with organizational presence."
  data:
  - name: "Headquarters"
  - name: "Office"
  - name: "Remote"
  - name: "DataCenter"
  - name: "Region"
- name: "InvitationStatus"
  description: "Delivery and acceptance state of an organization invitation."
  data:
  - name: "Draft"
  - name: "Sent"
  - name: "Accepted"
  - name: "Expired"
  - name: "Revoked"
- name: "OrganizationLifecycleEventType"
  description: "Sorts of changes tracked for organization lifecycle."
  data:
  - name: "Created"
  - name: "Renamed"
  - name: "Merged"
  - name: "Split"
  - name: "Suspended"
  - name: "Reactivated"
  - name: "Deactivated"
- name: "LabelType"
  description: "Scope classification for managed labels."
  data:
  - name: "Governance"
  - name: "Reporting"
  - name: "Compliance"
  - name: "CostCenter"
  - name: "Geography"
valueObjects:
- name: "EmailAddress"
  description: "Canonical representation of an email address with format validation."
  data:
  - name: "value"
    type: "String"
- name: "Url"
  description: "Fully qualified URL used for websites and endpoints."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "International phone number in E.164 or normalized format."
  data:
  - name: "value"
    type: "String"
- name: "Locale"
  description: "IETF language tag representing localization preferences."
  data:
  - name: "value"
    type: "String"
- name: "TimeZoneId"
  description: "IANA time zone identifier for scheduling and policy enforcement."
  data:
  - name: "value"
    type: "String"
- name: "Code"
  description: "Human-readable short code used for stable referencing of units and\
    \ structures."
  data:
  - name: "value"
    type: "String"
- name: "PostalAddress"
  description: "Structured postal address for physical or mailing purposes."
  data:
  - name: "street1"
    type: "String"
  - name: "street2"
    type: "String"
  - name: "city"
    type: "String"
  - name: "region"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
