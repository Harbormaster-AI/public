---
metadata:
  name: "Authorization"
  description: "Domain model for fine-grained, multi-tenant authorization, covering\
    \ RBAC, ABAC, policy evaluation, and entitlement derivation."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Identity and Security"
  type: "Capability"
  domain: "Authorization"
entities:
- name: "AuthorizationRealm"
  description: "Administrative and isolation boundary for policies, roles, resources,\
    \ and subjects."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "defaultDecision"
    type: "DecisionEffect"
  - name: "status"
    type: "RealmStatus"
  relations:
  - name: "subjects"
    type: "Subject"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "Group"
    multiplicity: "OneToMany"
  - name: "roles"
    type: "Role"
    multiplicity: "OneToMany"
  - name: "permissions"
    type: "Permission"
    multiplicity: "OneToMany"
  - name: "resourceTypes"
    type: "ResourceType"
    multiplicity: "OneToMany"
  - name: "resources"
    type: "Resource"
    multiplicity: "OneToMany"
  - name: "policySets"
    type: "PolicySet"
    multiplicity: "OneToMany"
  - name: "roleAssignments"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
- name: "Subject"
  description: "Principal that may request access, such as a user, service account,\
    \ or device."
  data:
  - name: "displayName"
    type: "String"
  - name: "subjectType"
    type: "SubjectType"
  - name: "isActive"
    type: "Boolean"
  - name: "externalReference"
    type: "String"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "groups"
    type: "Group"
    multiplicity: "ManyToMany"
  - name: "roleAssignments"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
  - name: "ownedResources"
    type: "Resource"
    multiplicity: "OneToMany"
  - name: "delegationsGiven"
    type: "DelegationGrant"
    multiplicity: "OneToMany"
  - name: "delegationsReceived"
    type: "DelegationGrant"
    multiplicity: "OneToMany"
  - name: "accessRequests"
    type: "AccessRequest"
    multiplicity: "OneToMany"
  - name: "entitlements"
    type: "Entitlement"
    multiplicity: "OneToMany"
- name: "Group"
  description: "Collection of subjects managed as a unit for authorization assignments."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "isDynamic"
    type: "Boolean"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "members"
    type: "Subject"
    multiplicity: "ManyToMany"
  - name: "roleAssignments"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
- name: "Role"
  description: "Named collection of permissions intended for assignment to subjects\
    \ or groups."
  data:
  - name: "name"
    type: "String"
  - name: "isSystem"
    type: "Boolean"
  - name: "roleLevel"
    type: "Integer"
  - name: "description"
    type: "String"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "permissions"
    type: "Permission"
    multiplicity: "ManyToMany"
  - name: "parentRoles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "childRoles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "assignments"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
- name: "Permission"
  description: "Operation that can be performed on a resource type."
  data:
  - name: "name"
    type: "String"
  - name: "action"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "resourceType"
    type: "ResourceType"
    multiplicity: "ManyToOne"
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
- name: "ResourceType"
  description: "Classification of protected resources with a defined action vocabulary."
  data:
  - name: "name"
    type: "String"
  - name: "uriNamespace"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "supportedActions"
    type: "SupportedAction"
    multiplicity: "OneToMany"
  - name: "resources"
    type: "Resource"
    multiplicity: "OneToMany"
  - name: "permissions"
    type: "Permission"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "AccessPolicy"
    multiplicity: "ManyToMany"
- name: "SupportedAction"
  description: "Canonical action supported by a resource type."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "resourceType"
    type: "ResourceType"
    multiplicity: "ManyToOne"
  - name: "policyRules"
    type: "PolicyRule"
    multiplicity: "ManyToMany"
- name: "Resource"
  description: "Addressable protected entity on which permissions are evaluated."
  data:
  - name: "name"
    type: "String"
  - name: "path"
    type: "ResourcePath"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "resourceType"
    type: "ResourceType"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "Resource"
    multiplicity: "OneToMany"
  - name: "owners"
    type: "Subject"
    multiplicity: "ManyToMany"
  - name: "entitlements"
    type: "Entitlement"
    multiplicity: "OneToMany"
- name: "ResourceGroup"
  description: "Logical grouping of resources for collective authorization configuration."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "resources"
    type: "Resource"
    multiplicity: "ManyToMany"
  - name: "policies"
    type: "AccessPolicy"
    multiplicity: "ManyToMany"
- name: "PolicySet"
  description: "Container that orders and evaluates access policies together."
  data:
  - name: "name"
    type: "String"
  - name: "evaluationStrategy"
    type: "EvaluationStrategy"
  - name: "description"
    type: "String"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "policies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
- name: "AccessPolicy"
  description: "Declarative rule set that yields a permit or deny effect under specified\
    \ conditions."
  data:
  - name: "name"
    type: "String"
  - name: "effect"
    type: "DecisionEffect"
  - name: "priority"
    type: "Integer"
  - name: "state"
    type: "PolicyState"
  - name: "description"
    type: "String"
  relations:
  - name: "policySet"
    type: "PolicySet"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "PolicyRule"
    multiplicity: "OneToMany"
  - name: "appliesToResourceTypes"
    type: "ResourceType"
    multiplicity: "ManyToMany"
  - name: "appliesToResourceGroups"
    type: "ResourceGroup"
    multiplicity: "ManyToMany"
- name: "PolicyRule"
  description: "Action-scoped conditional logic within a policy."
  data:
  - name: "name"
    type: "String"
  - name: "order"
    type: "Integer"
  relations:
  - name: "policy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
  - name: "actions"
    type: "SupportedAction"
    multiplicity: "ManyToMany"
  - name: "conditionGroups"
    type: "ConditionGroup"
    multiplicity: "OneToMany"
- name: "ConditionGroup"
  description: "Logical grouping of attribute-based conditions evaluated with a specified\
    \ operator."
  data:
  - name: "operator_"
    type: "LogicalOperator"
  - name: "description"
    type: "String"
  relations:
  - name: "policyRule"
    type: "PolicyRule"
    multiplicity: "ManyToOne"
  - name: "conditions"
    type: "AttributeCondition"
    multiplicity: "OneToMany"
- name: "AttributeCondition"
  description: "Atomic predicate comparing an attribute value with an expected value\
    \ using an operator."
  data:
  - name: "attributeSource"
    type: "AttributeSource"
  - name: "attributePath"
    type: "String"
  - name: "operator_"
    type: "ConditionOperator"
  - name: "comparisonValue"
    type: "String"
  - name: "caseSensitive"
    type: "Boolean"
  relations:
  - name: "conditionGroup"
    type: "ConditionGroup"
    multiplicity: "ManyToOne"
- name: "RoleAssignment"
  description: "Grant of a role to a subject or group, optionally scoped to a resource\
    \ and constrained by time."
  data:
  - name: "scope"
    type: "AccessScope"
  - name: "activeFrom"
    type: "Date"
  - name: "activeUntil"
    type: "Date"
  - name: "isDisabled"
    type: "Boolean"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "role"
    type: "Role"
    multiplicity: "ManyToOne"
  - name: "subject"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "group"
    type: "Group"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
- name: "DelegationGrant"
  description: "Delegation of specific permissions from one subject to another within\
    \ an optional scope."
  data:
  - name: "name"
    type: "String"
  - name: "expiresOn"
    type: "Date"
  - name: "isRevocable"
    type: "Boolean"
  relations:
  - name: "grantor"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "delegate"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "permissions"
    type: "Permission"
    multiplicity: "ManyToMany"
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
- name: "Entitlement"
  description: "Effective permission for a subject on a resource resulting from roles,\
    \ policies, or delegations."
  data:
  - name: "action"
    type: "String"
  - name: "effect"
    type: "DecisionEffect"
  - name: "source"
    type: "GrantSource"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "subject"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "permission"
    type: "Permission"
    multiplicity: "ManyToOne"
  - name: "roleAssignment"
    type: "RoleAssignment"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
  - name: "delegation"
    type: "DelegationGrant"
    multiplicity: "ManyToOne"
- name: "AccessRequest"
  description: "Request to evaluate whether a subject may perform an action on a resource\
    \ in a given realm."
  data:
  - name: "requestTime"
    type: "DateTime"
  - name: "reason"
    type: "String"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "subject"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "action"
    type: "SupportedAction"
    multiplicity: "ManyToOne"
  - name: "decision"
    type: "AccessDecision"
    multiplicity: "OneToOne"
- name: "AccessDecision"
  description: "Result of an access evaluation, including final effect and explanation."
  data:
  - name: "decision"
    type: "DecisionEffect"
  - name: "explanation"
    type: "DecisionExplanation"
  - name: "cacheable"
    type: "Boolean"
  relations:
  - name: "request"
    type: "AccessRequest"
    multiplicity: "OneToOne"
  - name: "evaluatedPolicies"
    type: "PolicyEvaluation"
    multiplicity: "OneToMany"
- name: "PolicyEvaluation"
  description: "Outcome of evaluating a single policy as part of an access decision."
  data:
  - name: "result"
    type: "PolicyEvaluationResult"
  - name: "priorityAtEvaluation"
    type: "Integer"
  relations:
  - name: "decision"
    type: "AccessDecision"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
- name: "EntitlementReview"
  description: "Certification activity to attest that entitlements remain appropriate."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "ReviewStatus"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "ReviewItem"
    multiplicity: "OneToMany"
- name: "ReviewItem"
  description: "Individual entitlement checked during a review."
  data:
  - name: "decision"
    type: "ReviewDecision"
  - name: "comment"
    type: "String"
  relations:
  - name: "review"
    type: "EntitlementReview"
    multiplicity: "ManyToOne"
  - name: "entitlement"
    type: "Entitlement"
    multiplicity: "ManyToOne"
  - name: "reviewer"
    type: "Subject"
    multiplicity: "ManyToOne"
enums:
- name: "SubjectType"
  description: "Kinds of principals that can request authorization decisions."
  data:
  - name: "User"
  - name: "ServiceAccount"
  - name: "Device"
  - name: "ExternalUser"
- name: "DecisionEffect"
  description: "Possible outcomes of policy evaluation and access decision."
  data:
  - name: "Permit"
  - name: "Deny"
  - name: "NotApplicable"
  - name: "Indeterminate"
- name: "ConditionOperator"
  description: "Operators used to compare attribute values within conditions."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "In"
  - name: "NotIn"
  - name: "Contains"
  - name: "StartsWith"
  - name: "EndsWith"
  - name: "GreaterThan"
  - name: "GreaterOrEqual"
  - name: "LessThan"
  - name: "LessOrEqual"
  - name: "RegexMatch"
- name: "AttributeSource"
  description: "Origin of the attribute referenced by a condition."
  data:
  - name: "Subject"
  - name: "Resource"
  - name: "Environment"
  - name: "Context"
- name: "LogicalOperator"
  description: "How multiple conditions in a group are combined."
  data:
  - name: "All"
  - name: "Any"
  - name: "None"
- name: "PolicyState"
  description: "Lifecycle state of an access policy."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Deprecated"
  - name: "Archived"
- name: "EvaluationStrategy"
  description: "Strategy used to evaluate a set of policies."
  data:
  - name: "FirstApplicable"
  - name: "AllApplicable"
  - name: "HighestPriorityWins"
- name: "RealmStatus"
  description: "Operational status of an authorization realm."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Decommissioned"
- name: "GrantSource"
  description: "Origin of an entitlement."
  data:
  - name: "Role"
  - name: "Policy"
  - name: "Delegation"
- name: "PolicyEvaluationResult"
  description: "Per-policy evaluation outcome within a decision."
  data:
  - name: "Permit"
  - name: "Deny"
  - name: "NotApplicable"
  - name: "Indeterminate"
- name: "ReviewStatus"
  description: "Status of an entitlement review campaign."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
- name: "ReviewDecision"
  description: "Reviewer disposition for a single entitlement."
  data:
  - name: "Approve"
  - name: "Revoke"
  - name: "Escalate"
  - name: "NoChange"
valueObjects:
- name: "ResourcePath"
  description: "Opaque path or URI used to locate a protected resource instance."
  data:
  - name: "value"
    type: "String"
- name: "AccessScope"
  description: "Arbitrary scope key used to limit the applicability of a role assignment."
  data:
  - name: "value"
    type: "String"
- name: "DecisionExplanation"
  description: "Human-readable rationale or trace for an access decision."
  data:
  - name: "text"
    type: "String"
