---
metadata:
  name: "API Key Management Capabilities Model"
  description: "Capabilities model for governing the lifecycle, security, distribution,\
    \ rotation, and enforcement of API keys across environments and products."
  version: "1.0.0"
  industry: "Software"
  category: "Identity and Security"
  type: "Capability"
  domain: "API Key Management"
entities:
- name: "Organization"
  description: "Administrative tenant that owns API assets, policies, and keys."
  data:
  - name: "name"
    type: "String"
  - name: "domain"
    type: "String"
  - name: "contactEmail"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "environments"
    type: "ApiEnvironment"
    multiplicity: "OneToMany"
  - name: "applications"
    type: "ApiClient"
    multiplicity: "OneToMany"
  - name: "products"
    type: "ApiProduct"
    multiplicity: "OneToMany"
  - name: "keyRings"
    type: "KeyRing"
    multiplicity: "OneToMany"
  - name: "complianceRules"
    type: "ComplianceRule"
    multiplicity: "OneToMany"
  - name: "keyTemplates"
    type: "ApiKeyTemplate"
    multiplicity: "OneToMany"
- name: "ApiEnvironment"
  description: "Logical runtime stage where APIs are deployed and key enforcement\
    \ occurs."
  data:
  - name: "name"
    type: "String"
  - name: "environmentType"
    type: "EnvironmentType"
  - name: "baseUrl"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "products"
    type: "ApiProduct"
    multiplicity: "OneToMany"
  - name: "gateways"
    type: "ApiGateway"
    multiplicity: "OneToMany"
- name: "ApiGateway"
  description: "Enforcement component that validates API keys, applies restrictions,\
    \ and records usage."
  data:
  - name: "name"
    type: "String"
  - name: "vendor"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "environment"
    type: "ApiEnvironment"
    multiplicity: "ManyToOne"
- name: "ApiProduct"
  description: "Collection of API capabilities exposed under a common contract to\
    \ consumers."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "environment"
    type: "ApiEnvironment"
    multiplicity: "ManyToOne"
  - name: "endpoints"
    type: "ApiEndpoint"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "keyTemplates"
    type: "ApiKeyTemplate"
    multiplicity: "OneToMany"
- name: "ApiEndpoint"
  description: "Addressable route or resource pattern included in an API product."
  data:
  - name: "pathPattern"
    type: "EndpointPattern"
  - name: "deprecated"
    type: "Boolean"
  relations:
  - name: "product"
    type: "ApiProduct"
    multiplicity: "ManyToOne"
- name: "ApiClient"
  description: "Registered consumer application or integration that uses API keys."
  data:
  - name: "name"
    type: "String"
  - name: "owner"
    type: "String"
  - name: "description"
    type: "String"
  - name: "contactEmail"
    type: "String"
  - name: "status"
    type: "ClientStatus"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "apiKeys"
    type: "ApiKey"
    multiplicity: "OneToMany"
- name: "Subscription"
  description: "Agreement that grants a client access to a product with attached policies."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "SubscriptionStatus"
  relations:
  - name: "client"
    type: "ApiClient"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "ApiProduct"
    multiplicity: "ManyToOne"
  - name: "apiKeys"
    type: "ApiKey"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "AccessPolicy"
    multiplicity: "ManyToMany"
- name: "ApiKey"
  description: "Credential used by an API client to authenticate and access products."
  data:
  - name: "alias"
    type: "String"
  - name: "status"
    type: "ApiKeyStatus"
  - name: "tokenFormat"
    type: "TokenFormat"
  - name: "createdAt"
    type: "DateTime"
  - name: "lastUsedAt"
    type: "DateTime"
  - name: "maskingLevel"
    type: "SecretMaskingLevel"
  relations:
  - name: "client"
    type: "ApiClient"
    multiplicity: "ManyToOne"
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "keyRing"
    type: "KeyRing"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "KeyVersion"
    multiplicity: "OneToMany"
  - name: "restrictions"
    type: "KeyRestriction"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "KeyTag"
    multiplicity: "ManyToMany"
  - name: "rotationPlan"
    type: "RotationPlan"
    multiplicity: "OneToOne"
- name: "KeyVersion"
  description: "Specific secret material instance of an API key used for rotation\
    \ overlap and rollback."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "secretHash"
    type: "KeyHash"
  - name: "createdAt"
    type: "DateTime"
  - name: "activatedAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  - name: "state"
    type: "KeyVersionState"
  relations:
  - name: "apiKey"
    type: "ApiKey"
    multiplicity: "ManyToOne"
  - name: "deliveryRecords"
    type: "CredentialDelivery"
    multiplicity: "OneToMany"
  - name: "revocation"
    type: "Revocation"
    multiplicity: "OneToOne"
  - name: "secretAccessEvents"
    type: "ApiKeySecretAccess"
    multiplicity: "OneToMany"
  - name: "usageEvents"
    type: "KeyUsageEvent"
    multiplicity: "OneToMany"
- name: "KeyRestriction"
  description: "Aggregate of constraints that must be satisfied for a key to be accepted."
  data:
  - name: "name"
    type: "String"
  - name: "enforced"
    type: "Boolean"
  relations:
  - name: "apiKey"
    type: "ApiKey"
    multiplicity: "ManyToOne"
  - name: "ipRules"
    type: "IpAccessRule"
    multiplicity: "OneToMany"
  - name: "referrerRules"
    type: "ReferrerRule"
    multiplicity: "OneToMany"
  - name: "endpointRules"
    type: "EndpointRule"
    multiplicity: "OneToMany"
  - name: "headerRules"
    type: "HeaderRule"
    multiplicity: "OneToMany"
  - name: "timeWindows"
    type: "AccessTimeWindow"
    multiplicity: "OneToMany"
- name: "IpAccessRule"
  description: "Network constraint expressed as an allow or deny action for CIDR ranges."
  data:
  - name: "action"
    type: "AccessDecision"
  - name: "cidr"
    type: "Cidr"
  - name: "description"
    type: "String"
  relations:
  - name: "restriction"
    type: "KeyRestriction"
    multiplicity: "ManyToOne"
- name: "ReferrerRule"
  description: "Web referrer constraint defining allowed or denied referer patterns."
  data:
  - name: "action"
    type: "AccessDecision"
  - name: "referrer"
    type: "ReferrerPattern"
  - name: "description"
    type: "String"
  relations:
  - name: "restriction"
    type: "KeyRestriction"
    multiplicity: "ManyToOne"
- name: "HeaderRule"
  description: "HTTP header requirement that must match or be absent for a request\
    \ to be accepted."
  data:
  - name: "headerName"
    type: "String"
  - name: "matchType"
    type: "HeaderMatchType"
  - name: "matchValue"
    type: "String"
  - name: "action"
    type: "AccessDecision"
  relations:
  - name: "restriction"
    type: "KeyRestriction"
    multiplicity: "ManyToOne"
- name: "EndpointRule"
  description: "Endpoint and method filter controlling whether a request is permitted."
  data:
  - name: "method"
    type: "HttpMethod"
  - name: "path"
    type: "EndpointPattern"
  - name: "action"
    type: "AccessDecision"
  - name: "description"
    type: "String"
  relations:
  - name: "restriction"
    type: "KeyRestriction"
    multiplicity: "ManyToOne"
- name: "AccessTimeWindow"
  description: "Time-of-day window that defines when a key is valid."
  data:
  - name: "windowType"
    type: "TimeWindowType"
  - name: "startTime"
    type: "String"
  - name: "endTime"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "dayRule"
    type: "DayRule"
  relations:
  - name: "restriction"
    type: "KeyRestriction"
    multiplicity: "ManyToOne"
- name: "AccessPolicy"
  description: "Managed enforcement policy that applies rate limits and quotas."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "status"
    type: "PolicyStatus"
  relations:
  - name: "product"
    type: "ApiProduct"
    multiplicity: "ManyToOne"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "ManyToMany"
  - name: "rateLimits"
    type: "RateLimitRule"
    multiplicity: "OneToMany"
  - name: "quotaRules"
    type: "QuotaRule"
    multiplicity: "OneToMany"
- name: "RateLimitRule"
  description: "Algorithmic request rate limit applied over a rolling or fixed window."
  data:
  - name: "strategy"
    type: "RateLimitStrategy"
  - name: "limit"
    type: "Integer"
  - name: "windowSeconds"
    type: "Integer"
  - name: "burstCapacity"
    type: "Integer"
  relations:
  - name: "policy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
- name: "QuotaRule"
  description: "Aggregate request cap over a defined time window."
  data:
  - name: "maximum"
    type: "Integer"
  - name: "window"
    type: "QuotaWindow"
  relations:
  - name: "policy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
- name: "RotationPlan"
  description: "Plan that governs how and when key versions are rotated and overlapped."
  data:
  - name: "strategy"
    type: "RotationStrategy"
  - name: "overlapSeconds"
    type: "Integer"
  - name: "rotateEveryDays"
    type: "Integer"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "apiKey"
    type: "ApiKey"
    multiplicity: "ManyToOne"
  - name: "notifications"
    type: "RotationNotification"
    multiplicity: "OneToMany"
- name: "RotationNotification"
  description: "Notification preference for upcoming rotation events."
  data:
  - name: "channel"
    type: "NotificationChannel"
  - name: "address"
    type: "String"
  - name: "notifyDaysBefore"
    type: "Integer"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "rotationPlan"
    type: "RotationPlan"
    multiplicity: "ManyToOne"
- name: "KeyTag"
  description: "User-defined label for organizing and filtering API keys."
  data:
  - name: "name"
    type: "String"
  - name: "color"
    type: "String"
  relations:
  - name: "apiKeys"
    type: "ApiKey"
    multiplicity: "ManyToMany"
- name: "CredentialDelivery"
  description: "Record of how secret material for a key version was delivered to a\
    \ recipient."
  data:
  - name: "method"
    type: "DeliveryMethod"
  - name: "deliveredAt"
    type: "DateTime"
  - name: "recipient"
    type: "String"
  - name: "successful"
    type: "Boolean"
  - name: "notes"
    type: "String"
  relations:
  - name: "keyVersion"
    type: "KeyVersion"
    multiplicity: "ManyToOne"
- name: "Revocation"
  description: "Irreversible action that invalidates a specific key version."
  data:
  - name: "reason"
    type: "RevocationReason"
  - name: "revokedAt"
    type: "DateTime"
  - name: "comment"
    type: "String"
  relations:
  - name: "keyVersion"
    type: "KeyVersion"
    multiplicity: "ManyToOne"
- name: "KeyUsageEvent"
  description: "Observation of a key-based authentication attempt and its outcome."
  data:
  - name: "occurredAt"
    type: "DateTime"
  - name: "outcome"
    type: "UsageOutcome"
  - name: "httpStatus"
    type: "Integer"
  - name: "endpoint"
    type: "String"
  - name: "method"
    type: "HttpMethod"
  - name: "sourceIp"
    type: "String"
  - name: "tokenPreview"
    type: "KeyPreview"
  relations:
  - name: "keyVersion"
    type: "KeyVersion"
    multiplicity: "ManyToOne"
  - name: "gateway"
    type: "ApiGateway"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "ApiProduct"
    multiplicity: "ManyToOne"
  - name: "client"
    type: "ApiClient"
    multiplicity: "ManyToOne"
- name: "SecretsBackend"
  description: "System that stores hashed secret material and related key metadata."
  data:
  - name: "name"
    type: "String"
  - name: "provider"
    type: "SecretProvider"
  - name: "location"
    type: "String"
  - name: "managedExternally"
    type: "Boolean"
  relations:
  - name: "keyRings"
    type: "KeyRing"
    multiplicity: "OneToMany"
- name: "KeyRing"
  description: "Logical grouping of API keys bound to a secrets backend with shared\
    \ retention."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  - name: "rotatedByDefault"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "secretsBackend"
    type: "SecretsBackend"
    multiplicity: "ManyToOne"
  - name: "apiKeys"
    type: "ApiKey"
    multiplicity: "OneToMany"
- name: "ApiKeyTemplate"
  description: "Blueprint defining defaults and constraints when creating new API\
    \ keys."
  data:
  - name: "name"
    type: "String"
  - name: "tokenLength"
    type: "Integer"
  - name: "tokenEncoding"
    type: "TokenEncoding"
  - name: "defaultMasking"
    type: "SecretMaskingLevel"
  - name: "defaultStatus"
    type: "ApiKeyStatus"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "ApiProduct"
    multiplicity: "ManyToOne"
  - name: "defaultPolicies"
    type: "AccessPolicy"
    multiplicity: "ManyToMany"
- name: "ComplianceRule"
  description: "Requirement representing internal or regulatory controls for keys."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "ruleType"
    type: "ComplianceRuleType"
  - name: "required"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "evaluatedKeys"
    type: "ApiKey"
    multiplicity: "ManyToMany"
- name: "ComplianceFinding"
  description: "Result of evaluating an API key against a compliance rule."
  data:
  - name: "checkedAt"
    type: "DateTime"
  - name: "passed"
    type: "Boolean"
  - name: "notes"
    type: "String"
  relations:
  - name: "rule"
    type: "ComplianceRule"
    multiplicity: "ManyToOne"
  - name: "apiKey"
    type: "ApiKey"
    multiplicity: "ManyToOne"
- name: "KeyInspection"
  description: "Assessment activity that scans keys for exposure risk and configuration\
    \ issues."
  data:
  - name: "inspectedAt"
    type: "DateTime"
  - name: "inspectionType"
    type: "InspectionType"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "findingSummary"
    type: "String"
  relations:
  - name: "apiKey"
    type: "ApiKey"
    multiplicity: "ManyToOne"
  - name: "findings"
    type: "ExposureFinding"
    multiplicity: "OneToMany"
- name: "ExposureFinding"
  description: "Evidence of possible key leakage or misuse discovered during inspection."
  data:
  - name: "category"
    type: "ExposureCategory"
  - name: "evidence"
    type: "String"
  - name: "severity"
    type: "SeverityLevel"
  - name: "detectedAt"
    type: "DateTime"
  - name: "resolved"
    type: "Boolean"
  relations:
  - name: "inspection"
    type: "KeyInspection"
    multiplicity: "ManyToOne"
- name: "ApiKeySecretAccess"
  description: "Administrative event that revealed or exported secret material for\
    \ a key version."
  data:
  - name: "occurredAt"
    type: "DateTime"
  - name: "action"
    type: "SecretAccessAction"
  - name: "actor"
    type: "String"
  - name: "maskedView"
    type: "String"
  - name: "justification"
    type: "String"
  relations:
  - name: "keyVersion"
    type: "KeyVersion"
    multiplicity: "ManyToOne"
enums:
- name: "EnvironmentType"
  description: "Types of runtime stages used to deploy and test APIs."
  data:
  - name: "Development"
  - name: "Test"
  - name: "Staging"
  - name: "Production"
- name: "ClientStatus"
  description: "Lifecycle state of a registered API consumer application."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Retired"
- name: "SubscriptionStatus"
  description: "Current status of a client’s access agreement to a product."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Suspended"
  - name: "Cancelled"
  - name: "Expired"
- name: "ApiKeyStatus"
  description: "High-level lifecycle state of an API key."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Revoked"
  - name: "Expired"
  - name: "PendingActivation"
  - name: "Disabled"
- name: "TokenFormat"
  description: "Structural format of the API key token."
  data:
  - name: "Opaque"
  - name: "UUIDv4"
  - name: "UUIDv7"
  - name: "Prefixed"
- name: "SecretMaskingLevel"
  description: "Degree to which a secret is masked when displayed."
  data:
  - name: "None"
  - name: "Partial"
  - name: "Full"
- name: "KeyVersionState"
  description: "Operational state of a specific key version."
  data:
  - name: "Current"
  - name: "Previous"
  - name: "Scheduled"
  - name: "Expired"
  - name: "Revoked"
- name: "AccessDecision"
  description: "Action taken by a rule when its condition matches."
  data:
  - name: "Allow"
  - name: "Deny"
- name: "HeaderMatchType"
  description: "Mechanism used to evaluate a header rule."
  data:
  - name: "Exact"
  - name: "Prefix"
  - name: "Suffix"
  - name: "Contains"
  - name: "Regex"
  - name: "Exists"
- name: "TimeWindowType"
  description: "Scheduling model for access windows."
  data:
  - name: "Permanent"
  - name: "Daily"
  - name: "OneTime"
- name: "DayRule"
  description: "Days on which a time window applies."
  data:
  - name: "AllDays"
  - name: "WeekdaysOnly"
  - name: "WeekendsOnly"
- name: "PolicyStatus"
  description: "Lifecycle status of an enforcement policy."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Archived"
- name: "RateLimitStrategy"
  description: "Algorithm used to enforce request rate limits."
  data:
  - name: "FixedWindow"
  - name: "SlidingWindow"
  - name: "TokenBucket"
  - name: "LeakyBucket"
- name: "QuotaWindow"
  description: "Duration over which a quota is measured."
  data:
  - name: "Hour"
  - name: "Day"
  - name: "Week"
  - name: "Month"
  - name: "Quarter"
- name: "RotationStrategy"
  description: "Approach for rotating key versions and managing overlap."
  data:
  - name: "Overlap"
  - name: "Cutover"
  - name: "Manual"
  - name: "EventDriven"
- name: "NotificationChannel"
  description: "Communication channel for rotation and policy notifications."
  data:
  - name: "Email"
  - name: "Webhook"
  - name: "Slack"
  - name: "Sms"
- name: "DeliveryMethod"
  description: "Means by which secret material is shared with recipients."
  data:
  - name: "PortalDownload"
  - name: "CLI"
  - name: "API"
  - name: "Email"
- name: "RevocationReason"
  description: "Reason a key version was revoked."
  data:
  - name: "Compromised"
  - name: "Rotated"
  - name: "OwnerRequest"
  - name: "PolicyViolation"
  - name: "Expired"
- name: "UsageOutcome"
  description: "Result of an authentication attempt using an API key."
  data:
  - name: "Authorized"
  - name: "RejectedInvalidKey"
  - name: "RejectedRevoked"
  - name: "RejectedExpired"
  - name: "RejectedRateLimited"
  - name: "RejectedPolicy"
- name: "SecretProvider"
  description: "Backend system used for storing and protecting secrets."
  data:
  - name: "Vault"
  - name: "KMS"
  - name: "Database"
  - name: "HSM"
  - name: "CloudSecretManager"
- name: "TokenEncoding"
  description: "Encoding used to represent the token characters."
  data:
  - name: "Base64Url"
  - name: "Base32"
  - name: "Hex"
- name: "ComplianceRuleType"
  description: "Category of compliance requirement applicable to keys."
  data:
  - name: "RotationFrequency"
  - name: "NetworkRestriction"
  - name: "ScopeRestriction"
  - name: "MaskingLevel"
  - name: "RateLimitPresence"
- name: "InspectionType"
  description: "Method by which a key inspection was initiated."
  data:
  - name: "ScheduledScan"
  - name: "OnDemand"
  - name: "ManualReview"
- name: "RiskLevel"
  description: "Overall risk level determined during an inspection."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "ExposureCategory"
  description: "Type of location or channel where key exposure was detected."
  data:
  - name: "CodeRepository"
  - name: "ClientLog"
  - name: "BrowserStorage"
  - name: "PublicIssue"
  - name: "PackageConfig"
  - name: "NetworkLeak"
- name: "SeverityLevel"
  description: "Severity assigned to an exposure finding."
  data:
  - name: "Info"
  - name: "Warning"
  - name: "Major"
  - name: "Critical"
- name: "SecretAccessAction"
  description: "Type of administrative action taken on secret material visibility."
  data:
  - name: "ViewedMasked"
  - name: "ViewedUnmasked"
  - name: "Exported"
  - name: "ReWrapped"
- name: "HttpMethod"
  description: "HTTP methods that may be targeted by endpoint rules."
  data:
  - name: "GET"
  - name: "POST"
  - name: "PUT"
  - name: "PATCH"
  - name: "DELETE"
  - name: "HEAD"
  - name: "OPTIONS"
- name: "HashAlgorithm"
  description: "Algorithm used to derive and store hashed token material."
  data:
  - name: "Bcrypt"
  - name: "Scrypt"
  - name: "Argon2id"
  - name: "PBKDF2_SHA256"
valueObjects:
- name: "KeyHash"
  description: "Non-reversible representation of secret material with algorithm metadata."
  data:
  - name: "algorithm"
    type: "HashAlgorithm"
