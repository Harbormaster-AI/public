---
metadata:
  name: "HCIDL Policy Management Capabilities Model"
  description: "Domain model for authoring, versioning, governing, assigning, and\
    \ enforcing identity and access policies across subjects, resources, actions,\
    \ and environments."
  version: "1.0.0"
  industry: "Software"
  category: "Identity and Security"
  type: "Capability"
  domain: "Policy Management"
entities:
- name: "PolicyRepository"
  description: "Central catalog that governs storage, discovery, and governance of\
    \ policies and related artifacts."
  data:
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  - name: "defaultCombiningAlgorithm"
    type: "CombiningAlgorithm"
  relations:
  - name: "policySets"
    type: "PolicySet"
    multiplicity: "OneToMany"
  - name: "attributes"
    type: "AttributeDefinition"
    multiplicity: "OneToMany"
  - name: "decisionPoints"
    type: "PolicyDecisionPoint"
    multiplicity: "OneToMany"
  - name: "enforcementPoints"
    type: "PolicyEnforcementPoint"
    multiplicity: "OneToMany"
- name: "AttributeDefinition"
  description: "Canonical definition of an attribute referenced in policy targets\
    \ and conditions."
  data:
  - name: "name"
    type: "String"
  - name: "source"
    type: "AttributeSource"
  - name: "dataType"
    type: "DataType"
  - name: "descriptionText"
    type: "String"
  - name: "multiValued"
    type: "Boolean"
  relations:
  - name: "repository"
    type: "PolicyRepository"
    multiplicity: "ManyToOne"
  - name: "allowedOperators"
    type: "AllowedOperator"
    multiplicity: "OneToMany"
- name: "AllowedOperator"
  description: "Operator permitted for a specific attribute definition."
  data:
  - name: "operator_"
    type: "ConditionOperator"
  relations:
  - name: "attributeDefinition"
    type: "AttributeDefinition"
    multiplicity: "ManyToOne"
- name: "PolicySet"
  description: "Logical container of related policies with a shared target and combining\
    \ algorithm."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "PolicyType"
  - name: "combiningAlgorithm"
    type: "CombiningAlgorithm"
  - name: "status"
    type: "PolicyLifecycleStatus"
  - name: "enforcementMode"
    type: "EnforcementMode"
  relations:
  - name: "repository"
    type: "PolicyRepository"
    multiplicity: "ManyToOne"
  - name: "target"
    type: "Target"
    multiplicity: "OneToOne"
  - name: "policies"
    type: "Policy"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "PolicyAssignment"
    multiplicity: "OneToMany"
- name: "Policy"
  description: "Managed policy artifact that encapsulates objectives and governance\
    \ for access decisions."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "PolicyType"
  - name: "status"
    type: "PolicyLifecycleStatus"
  - name: "defaultDecision"
    type: "EvaluationOutcome"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "policySet"
    type: "PolicySet"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "PolicyVersion"
    multiplicity: "OneToMany"
  - name: "variables"
    type: "PolicyVariable"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "PolicyAssignment"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "PolicyTag"
    multiplicity: "ManyToMany"
- name: "PolicyVersion"
  description: "Frozen, auditable snapshot of a policy used for deployment and evaluation."
  data:
  - name: "versionTag"
    type: "VersionTag"
  - name: "changeSummary"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "combiningAlgorithm"
    type: "CombiningAlgorithm"
  - name: "enforcementMode"
    type: "EnforcementMode"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "Rule"
    multiplicity: "OneToMany"
  - name: "target"
    type: "Target"
    multiplicity: "OneToOne"
  - name: "obligations"
    type: "Obligation"
    multiplicity: "OneToMany"
  - name: "advices"
    type: "Advice"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "ApprovalRecord"
    multiplicity: "OneToMany"
  - name: "testCases"
    type: "PolicyTestCase"
    multiplicity: "OneToMany"
- name: "Target"
  description: "Declarative scoping that restricts when a policy or policy set is\
    \ considered for evaluation."
  data:
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "subjectMatches"
    type: "TargetMatch"
    multiplicity: "OneToMany"
  - name: "resourceMatches"
    type: "TargetMatch"
    multiplicity: "OneToMany"
  - name: "actionMatches"
    type: "TargetMatch"
    multiplicity: "OneToMany"
  - name: "environmentMatches"
    type: "TargetMatch"
    multiplicity: "OneToMany"
- name: "TargetMatch"
  description: "Atomic match clause within a target defining attribute comparison\
    \ logic."
  data:
  - name: "attribute"
    type: "AttributeReference"
  - name: "operator_"
    type: "ConditionOperator"
  - name: "value"
    type: "String"
  - name: "valueType"
    type: "DataType"
  - name: "matchSource"
    type: "AttributeSource"
  relations:
  - name: "target"
    type: "Target"
    multiplicity: "ManyToOne"
- name: "Rule"
  description: "Evaluatable unit within a policy version that yields a permit or deny\
    \ effect."
  data:
  - name: "name"
    type: "String"
  - name: "priority"
    type: "Integer"
  - name: "effect"
    type: "RuleEffect"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "policyVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
  - name: "conditions"
    type: "Condition"
    multiplicity: "OneToMany"
  - name: "obligations"
    type: "Obligation"
    multiplicity: "OneToMany"
  - name: "advices"
    type: "Advice"
    multiplicity: "OneToMany"
- name: "Condition"
  description: "Predicate that must be satisfied for the parent rule to take effect."
  data:
  - name: "leftAttribute"
    type: "AttributeReference"
  - name: "operator_"
    type: "ConditionOperator"
  - name: "rightValue"
    type: "String"
  - name: "rightValueType"
    type: "DataType"
  relations:
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
- name: "Obligation"
  description: "Mandatory post-decision action triggered by a rule or policy version\
    \ outcome."
  data:
  - name: "name"
    type: "String"
  - name: "kind"
    type: "ObligationKind"
  - name: "triggerOn"
    type: "EvaluationOutcome"
  - name: "isMandatory"
    type: "Boolean"
  relations:
  - name: "policyVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
  - name: "parameters"
    type: "ObligationParameter"
    multiplicity: "OneToMany"
- name: "ObligationParameter"
  description: "Key-value parameter provided to an obligation at enforcement time."
  data:
  - name: "key"
    type: "String"
  - name: "value"
    type: "String"
  relations:
  - name: "obligation"
    type: "Obligation"
    multiplicity: "ManyToOne"
- name: "Advice"
  description: "Non-mandatory guidance returned with a decision to inform the enforcement\
    \ point or user."
  data:
  - name: "message"
    type: "String"
  - name: "kind"
    type: "AdviceKind"
  relations:
  - name: "policyVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
- name: "PolicyVariable"
  description: "Named reusable constant or expression available to rules within a\
    \ policy."
  data:
  - name: "name"
    type: "String"
  - name: "value"
    type: "String"
  - name: "valueType"
    type: "DataType"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
- name: "PolicyAssignment"
  description: "Binding that applies a policy or policy set to a specific scope and\
    \ enforcement point."
  data:
  - name: "scopeType"
    type: "ScopeType"
  - name: "scopeIdentifier"
    type: "String"
  - name: "precedence"
    type: "Integer"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "policySet"
    type: "PolicySet"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "enforcementPoint"
    type: "PolicyEnforcementPoint"
    multiplicity: "ManyToOne"
- name: "PolicyDecisionPoint"
  description: "Service that evaluates requests against active policy versions and\
    \ returns decisions."
  data:
  - name: "name"
    type: "String"
  - name: "location"
    type: "String"
  - name: "version"
    type: "String"
  - name: "evaluationCacheEnabled"
    type: "Boolean"
  relations:
  - name: "repository"
    type: "PolicyRepository"
    multiplicity: "ManyToOne"
  - name: "evaluations"
    type: "PolicyEvaluation"
    multiplicity: "OneToMany"
  - name: "enforcementPoints"
    type: "PolicyEnforcementPoint"
    multiplicity: "ManyToMany"
- name: "PolicyEnforcementPoint"
  description: "Integration component that enforces decisions in-line within applications\
    \ or services."
  data:
  - name: "name"
    type: "String"
  - name: "system"
    type: "String"
  - name: "enforcementMode"
    type: "EnforcementMode"
  relations:
  - name: "repository"
    type: "PolicyRepository"
    multiplicity: "ManyToOne"
  - name: "decisionPoints"
    type: "PolicyDecisionPoint"
    multiplicity: "ManyToMany"
  - name: "assignments"
    type: "PolicyAssignment"
    multiplicity: "OneToMany"
  - name: "evaluations"
    type: "PolicyEvaluation"
    multiplicity: "OneToMany"
- name: "PolicyEvaluation"
  description: "Audit record of a single access request evaluation, outcome, and execution\
    \ context."
  data:
  - name: "timestamp"
    type: "Date"
  - name: "outcome"
    type: "EvaluationOutcome"
  - name: "latencyMs"
    type: "Integer"
  - name: "subjectId"
    type: "String"
  - name: "resourceId"
    type: "String"
  - name: "action"
    type: "String"
  - name: "environmentContext"
    type: "String"
  relations:
  - name: "policyVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
  - name: "ruleApplied"
    type: "Rule"
    multiplicity: "ManyToOne"
  - name: "decisionPoint"
    type: "PolicyDecisionPoint"
    multiplicity: "ManyToOne"
  - name: "enforcementPoint"
    type: "PolicyEnforcementPoint"
    multiplicity: "ManyToOne"
  - name: "obligationsReturned"
    type: "Obligation"
    multiplicity: "OneToMany"
- name: "ApprovalRecord"
  description: "Formal sign-off capturing workflow decisions for policy changes and\
    \ exceptions."
  data:
  - name: "approver"
    type: "String"
  - name: "decision"
    type: "ApprovalDecision"
  - name: "decisionDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "policyVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
  - name: "exceptionRequest"
    type: "ExceptionRequest"
    multiplicity: "ManyToOne"
- name: "ExceptionRequest"
  description: "Time-bound request to deviate from an existing policy under defined\
    \ conditions."
  data:
  - name: "name"
    type: "String"
  - name: "reason"
    type: "String"
  - name: "requestedBy"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "ExceptionStatus"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "ApprovalRecord"
    multiplicity: "OneToMany"
  - name: "enforcementPoint"
    type: "PolicyEnforcementPoint"
    multiplicity: "ManyToOne"
- name: "PolicyTestCase"
  description: "Example scenario used to validate policy behavior before promotion."
  data:
  - name: "name"
    type: "String"
  - name: "subjectContext"
    type: "String"
  - name: "resourceContext"
    type: "String"
  - name: "actionContext"
    type: "String"
  - name: "expectedOutcome"
    type: "EvaluationOutcome"
  relations:
  - name: "policyVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
- name: "PolicyTag"
  description: "Lightweight label for organizing and searching policy artifacts."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "policies"
    type: "Policy"
    multiplicity: "ManyToMany"
enums:
- name: "PolicyType"
  description: "Categorization of a policy based on its security objective."
  data:
  - name: "AccessControl"
  - name: "DataProtection"
  - name: "Session"
  - name: "APIAccess"
  - name: "Password"
  - name: "Secrets"
  - name: "Certificate"
- name: "PolicyLifecycleStatus"
  description: "Governance state of a policy throughout its lifecycle."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Approved"
  - name: "Active"
  - name: "Deprecated"
  - name: "Retired"
- name: "EnforcementMode"
  description: "How an enforcement point applies a policy decision."
  data:
  - name: "Enforce"
  - name: "Monitor"
  - name: "Disabled"
- name: "CombiningAlgorithm"
  description: "Strategy for deriving a single decision from multiple policies or\
    \ rules."
  data:
  - name: "PermitOverrides"
  - name: "DenyOverrides"
  - name: "FirstApplicable"
  - name: "OrderedDenyOverrides"
  - name: "OrderedPermitOverrides"
- name: "RuleEffect"
  description: "Outcome produced when a rule matches."
  data:
  - name: "Permit"
  - name: "Deny"
- name: "ConditionOperator"
  description: "Operator used to compare attribute values in targets and conditions."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "In"
  - name: "NotIn"
  - name: "GreaterThan"
  - name: "LessThan"
  - name: "GreaterOrEqual"
  - name: "LessOrEqual"
  - name: "Contains"
  - name: "StartsWith"
  - name: "EndsWith"
  - name: "MatchesRegex"
  - name: "IsPresent"
  - name: "IsNotPresent"
  - name: "Between"
  - name: "OverlapsTimeWindow"
- name: "AttributeSource"
  description: "Logical origin of an attribute referenced during evaluation."
  data:
  - name: "Subject"
  - name: "Resource"
  - name: "Action"
  - name: "Environment"
- name: "DataType"
  description: "Primitive type of an attribute or literal value."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime"
  - name: "CIDR"
  - name: "ListString"
- name: "EvaluationOutcome"
  description: "Final decision produced by policy evaluation."
  data:
  - name: "Permit"
  - name: "Deny"
  - name: "NotApplicable"
  - name: "Indeterminate"
- name: "ObligationKind"
  description: "Action mandated upon a decision to meet security or compliance requirements."
  data:
  - name: "MaskData"
  - name: "Redact"
  - name: "Notify"
  - name: "Log"
  - name: "RequireMFA"
  - name: "AddHeader"
  - name: "Watermark"
  - name: "Quarantine"
- name: "AdviceKind"
  description: "Informational guidance included with a decision."
  data:
  - name: "Info"
  - name: "Warning"
  - name: "NextStep"
- name: "ScopeType"
  description: "Type of target scope to which a policy is assigned."
  data:
  - name: "Tenant"
  - name: "OrganizationUnit"
  - name: "Application"
  - name: "API"
  - name: "ResourceGroup"
  - name: "Environment"
  - name: "Role"
  - name: "Permission"
- name: "ApprovalDecision"
  description: "Outcome of a governance approval action."
  data:
  - name: "Approved"
  - name: "Rejected"
  - name: "ChangesRequested"
  - name: "Withdrawn"
- name: "ExceptionStatus"
  description: "Workflow state of a policy exception request."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Active"
  - name: "Expired"
  - name: "Cancelled"
valueObjects:
- name: "VersionTag"
  description: "Semantic label used to identify an immutable policy version."
  data:
  - name: "value"
    type: "String"
- name: "AttributeReference"
  description: "Reference to an attribute by logical name and source used during evaluation."
  data:
  - name: "name"
    type: "String"
  - name: "source"
    type: "AttributeSource"
