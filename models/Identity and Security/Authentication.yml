---
metadata:
  name: "Authentication Capabilities Model"
  description: "Canonical HCIDL model describing entities and relationships involved\
    \ in user authentication, session establishment, multi-factor verification, and\
    \ federated sign-in."
  version: "1.0.0"
  industry: "Software"
  category: "Identity and Security"
  type: "Capability"
  domain: "Authentication"
entities:
- name: "IdentityProvider"
  description: "External or internal service that asserts user identity and issues\
    \ authentication claims."
  data:
  - name: "name"
    type: "String"
  - name: "providerType"
    type: "ProviderType"
  - name: "issuer"
    type: "String"
  - name: "authorizationEndpoint"
    type: "Url"
  - name: "tokenEndpoint"
    type: "Url"
  - name: "jwksUri"
    type: "Url"
  - name: "clockSkewSeconds"
    type: "Integer"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "clients"
    type: "ClientApplication"
    multiplicity: "OneToMany"
  - name: "signingKeys"
    type: "SigningKey"
    multiplicity: "OneToMany"
  - name: "federationMappings"
    type: "FederationMapping"
    multiplicity: "OneToMany"
  - name: "authenticationEvents"
    type: "AuthenticationEvent"
    multiplicity: "OneToMany"
- name: "ClientApplication"
  description: "Software application that initiates authentication to obtain a session\
    \ for a user."
  data:
  - name: "name"
    type: "String"
  - name: "clientType"
    type: "ClientType"
  - name: "confidential"
    type: "Boolean"
  - name: "homeUri"
    type: "Url"
  - name: "callbackPattern"
    type: "String"
  - name: "logoutUri"
    type: "Url"
  - name: "allowRememberMe"
    type: "Boolean"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
  - name: "authFlows"
    type: "AuthFlow"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "AuthPolicy"
    multiplicity: "ManyToMany"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
  - name: "tokens"
    type: "SessionToken"
    multiplicity: "OneToMany"
  - name: "authenticationEvents"
    type: "AuthenticationEvent"
    multiplicity: "OneToMany"
- name: "UserAccount"
  description: "Person or service principal whose identity is authenticated."
  data:
  - name: "username"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "status"
    type: "AccountStatus"
  - name: "preferredLocale"
    type: "LocaleCode"
  - name: "timeZone"
    type: "TimeZoneId"
  - name: "createdOn"
    type: "Date"
  - name: "lastLoginOn"
    type: "Date"
  relations:
  - name: "credentials"
    type: "Credential"
    multiplicity: "OneToMany"
  - name: "factors"
    type: "AuthFactorEnrollment"
    multiplicity: "OneToMany"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
  - name: "devices"
    type: "DeviceIdentity"
    multiplicity: "OneToMany"
  - name: "recoveryCodes"
    type: "RecoveryCode"
    multiplicity: "OneToMany"
  - name: "passwordHistory"
    type: "PasswordHistory"
    multiplicity: "OneToMany"
  - name: "accountLocks"
    type: "AccountLock"
    multiplicity: "OneToMany"
  - name: "authenticationEvents"
    type: "AuthenticationEvent"
    multiplicity: "OneToMany"
- name: "Credential"
  description: "Secret or key material bound to a user and used to prove identity."
  data:
  - name: "credentialKind"
    type: "CredentialType"
  - name: "secret"
    type: "HashedSecret"
  - name: "publicKey"
    type: "PublicKey"
  - name: "enabled"
    type: "Boolean"
  - name: "createdOn"
    type: "Date"
  - name: "lastUsedOn"
    type: "Date"
  relations:
  - name: "userAccount"
    type: "UserAccount"
    multiplicity: "ManyToOne"
- name: "AuthFactorEnrollment"
  description: "Enrollment record for a specific authentication factor such as password,\
    \ OTP, or WebAuthn."
  data:
  - name: "factorType"
    type: "AuthFactorType"
  - name: "displayName"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  - name: "creationDate"
    type: "Date"
  - name: "lastVerifiedOn"
    type: "Date"
  relations:
  - name: "userAccount"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "otpConfiguration"
    type: "OtpConfiguration"
    multiplicity: "OneToOne"
  - name: "securityKeys"
    type: "SecurityKey"
    multiplicity: "OneToMany"
- name: "OtpConfiguration"
  description: "Parameters and delivery channels for one-time password verification."
  data:
  - name: "deliveryMethod"
    type: "OtpDeliveryMethod"
  - name: "seed"
    type: "OtpSeed"
  - name: "digits"
    type: "Integer"
  - name: "periodSeconds"
    type: "Integer"
  - name: "algorithm"
    type: "OtpAlgorithm"
  - name: "issuer"
    type: "String"
  - name: "accountLabel"
    type: "String"
  - name: "lastUsedOn"
    type: "Date"
  - name: "phoneNumber"
    type: "PhoneNumber"
  - name: "emailAddress"
    type: "EmailAddress"
  relations:
  - name: "factorEnrollment"
    type: "AuthFactorEnrollment"
    multiplicity: "ManyToOne"
- name: "SecurityKey"
  description: "Registered FIDO2/WebAuthn authenticator associated with a user."
  data:
  - name: "label"
    type: "String"
  - name: "credentialPublicKey"
    type: "PublicKey"
  - name: "aaguid"
    type: "String"
  - name: "signCount"
    type: "Integer"
  - name: "transports"
    type: "String"
  - name: "lastUsedOn"
    type: "Date"
  relations:
  - name: "factorEnrollment"
    type: "AuthFactorEnrollment"
    multiplicity: "ManyToOne"
  - name: "deviceIdentity"
    type: "DeviceIdentity"
    multiplicity: "ManyToOne"
- name: "Session"
  description: "Logical authentication session established after successful sign-in."
  data:
  - name: "status"
    type: "SessionStatus"
  - name: "startedOn"
    type: "Date"
  - name: "lastActivityOn"
    type: "Date"
  - name: "expiresOn"
    type: "Date"
  - name: "ipAddress"
    type: "IpAddress"
  - name: "userAgent"
    type: "UserAgent"
  - name: "persistent"
    type: "Boolean"
  - name: "riskLevel"
    type: "RiskLevel"
  relations:
  - name: "userAccount"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "clientApplication"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "DeviceIdentity"
    multiplicity: "ManyToOne"
  - name: "tokens"
    type: "SessionToken"
    multiplicity: "OneToMany"
  - name: "events"
    type: "AuthenticationEvent"
    multiplicity: "OneToMany"
- name: "SessionToken"
  description: "Opaque or signed token associated with a session and presented by\
    \ the client."
  data:
  - name: "tokenType"
    type: "TokenType"
  - name: "value"
    type: "String"
  - name: "issuedOn"
    type: "Date"
  - name: "expiresOn"
    type: "Date"
  - name: "revoked"
    type: "Boolean"
  - name: "revokedReason"
    type: "String"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "clientApplication"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
- name: "AuthenticationEvent"
  description: "Immutable record describing an authentication attempt, method, and\
    \ result."
  data:
  - name: "occurredOn"
    type: "Date"
  - name: "outcome"
    type: "AuthOutcome"
  - name: "method"
    type: "AuthMethod"
  - name: "ipAddress"
    type: "IpAddress"
  - name: "userAgent"
    type: "UserAgent"
  - name: "geolocation"
    type: "String"
  - name: "failureReason"
    type: "String"
  relations:
  - name: "userAccount"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "clientApplication"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "OneToOne"
  - name: "challenges"
    type: "Challenge"
    multiplicity: "OneToMany"
- name: "RiskAssessment"
  description: "Evaluation of contextual signals to determine the risk of an authentication\
    \ attempt."
  data:
  - name: "score"
    type: "Integer"
  - name: "level"
    type: "RiskLevel"
  - name: "reason"
    type: "String"
  - name: "signalsEvaluated"
    type: "Integer"
  relations:
  - name: "authenticationEvent"
    type: "AuthenticationEvent"
    multiplicity: "ManyToOne"
  - name: "ipReputation"
    type: "IpReputation"
    multiplicity: "ManyToOne"
  - name: "deviceIdentity"
    type: "DeviceIdentity"
    multiplicity: "ManyToOne"
- name: "DeviceIdentity"
  description: "Device profile observed during sign-in, used for recognition and risk\
    \ evaluation."
  data:
  - name: "deviceLabel"
    type: "String"
  - name: "platform"
    type: "DevicePlatform"
  - name: "trustedStatus"
    type: "TrustLevel"
  - name: "firstSeenOn"
    type: "Date"
  - name: "lastSeenOn"
    type: "Date"
  - name: "fingerprintHash"
    type: "String"
  - name: "compliant"
    type: "Boolean"
  relations:
  - name: "userAccount"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
  - name: "securityKeys"
    type: "SecurityKey"
    multiplicity: "OneToMany"
- name: "AuthPolicy"
  description: "Configurable set of rules governing authentication behavior and requirements."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "AuthPolicyType"
  - name: "description"
    type: "String"
  - name: "active"
    type: "Boolean"
  - name: "priority"
    type: "Integer"
  relations:
  - name: "rules"
    type: "AuthRule"
    multiplicity: "OneToMany"
  - name: "factorRequirements"
    type: "FactorRequirement"
    multiplicity: "OneToMany"
  - name: "clientApplications"
    type: "ClientApplication"
    multiplicity: "ManyToMany"
- name: "AuthRule"
  description: "Conditional expression with an effect applied during authentication\
    \ evaluation."
  data:
  - name: "name"
    type: "String"
  - name: "conditionExpression"
    type: "String"
  - name: "effect"
    type: "PolicyEffect"
  - name: "priority"
    type: "Integer"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "policy"
    type: "AuthPolicy"
    multiplicity: "ManyToOne"
- name: "FactorRequirement"
  description: "Policy directive specifying required factor count and acceptable factor\
    \ types."
  data:
  - name: "requirementType"
    type: "FactorRequirementType"
  - name: "minimumFactors"
    type: "Integer"
  - name: "stepUpOnRiskLevel"
    type: "RiskLevel"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "policy"
    type: "AuthPolicy"
    multiplicity: "ManyToOne"
  - name: "allowedFactors"
    type: "AllowedFactor"
    multiplicity: "OneToMany"
- name: "AllowedFactor"
  description: "Factor type expressly permitted by a requirement."
  data:
  - name: "factorType"
    type: "AuthFactorType"
  relations:
  - name: "requirement"
    type: "FactorRequirement"
    multiplicity: "ManyToOne"
- name: "AuthFlow"
  description: "Orchestrated sequence of steps defining the authentication experience."
  data:
  - name: "name"
    type: "String"
  - name: "flowType"
    type: "AuthFlowType"
  - name: "description"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "clientApplication"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
  - name: "steps"
    type: "AuthStep"
    multiplicity: "OneToMany"
  - name: "factorRequirements"
    type: "FactorRequirement"
    multiplicity: "ManyToMany"
- name: "AuthStep"
  description: "Executable stage within a flow, such as identification or factor verification."
  data:
  - name: "order"
    type: "Integer"
  - name: "stepType"
    type: "AuthStepType"
  - name: "description"
    type: "String"
  - name: "required"
    type: "Boolean"
  relations:
  - name: "flow"
    type: "AuthFlow"
    multiplicity: "ManyToOne"
- name: "Challenge"
  description: "Time-bound verification prompt issued during authentication."
  data:
  - name: "challengeType"
    type: "ChallengeType"
  - name: "issuedOn"
    type: "Date"
  - name: "expiresOn"
    type: "Date"
  - name: "verified"
    type: "Boolean"
  - name: "nonce"
    type: "String"
  relations:
  - name: "authenticationEvent"
    type: "AuthenticationEvent"
    multiplicity: "ManyToOne"
  - name: "factorEnrollment"
    type: "AuthFactorEnrollment"
    multiplicity: "ManyToOne"
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
- name: "RecoveryCode"
  description: "One-time backup code used to regain account access when other factors\
    \ are unavailable."
  data:
  - name: "code"
    type: "String"
  - name: "used"
    type: "Boolean"
  - name: "issuedOn"
    type: "Date"
  - name: "lastUsedOn"
    type: "Date"
  relations:
  - name: "userAccount"
    type: "UserAccount"
    multiplicity: "ManyToOne"
- name: "PasswordHistory"
  description: "Historical passwords retained to enforce reuse prevention policies."
  data:
  - name: "password"
    type: "HashedSecret"
  - name: "changedOn"
    type: "Date"
  relations:
  - name: "userAccount"
    type: "UserAccount"
    multiplicity: "ManyToOne"
- name: "AccountLock"
  description: "Lock state applied to an account due to policy or security reasons."
  data:
  - name: "lockReason"
    type: "LockReason"
  - name: "startOn"
    type: "Date"
  - name: "endOn"
    type: "Date"
  - name: "active"
    type: "Boolean"
  - name: "comment"
    type: "String"
  relations:
  - name: "userAccount"
    type: "UserAccount"
    multiplicity: "ManyToOne"
- name: "IpReputation"
  description: "Reputation information for IP addresses observed during authentication."
  data:
  - name: "ipAddress"
    type: "IpAddress"
  - name: "reputationScore"
    type: "Integer"
  - name: "source"
    type: "String"
  - name: "lastUpdatedOn"
    type: "Date"
  relations:
  - name: "events"
    type: "AuthenticationEvent"
    multiplicity: "ManyToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
- name: "SigningKey"
  description: "Cryptographic key used to sign or validate authentication-related\
    \ artifacts."
  data:
  - name: "name"
    type: "String"
  - name: "keyUse"
    type: "KeyUse"
  - name: "publicKey"
    type: "PublicKey"
  - name: "active"
    type: "Boolean"
  - name: "notBefore"
    type: "Date"
  - name: "notAfter"
    type: "Date"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
- name: "FederationMapping"
  description: "Rules translating external identity claims into local account attributes."
  data:
  - name: "name"
    type: "String"
  - name: "externalIdFormat"
    type: "FederationIdFormat"
  - name: "localUsernameTemplate"
    type: "String"
  - name: "attributeMappingExpression"
    type: "String"
  - name: "autoProvision"
    type: "Boolean"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
enums:
- name: "ProviderType"
  description: "Types of identity providers that can participate in authentication."
  data:
  - name: "OIDC"
  - name: "SAML"
  - name: "LDAP"
  - name: "Social"
  - name: "Local"
- name: "ClientType"
  description: "Categories of applications initiating authentication."
  data:
  - name: "Public"
  - name: "Confidential"
  - name: "Native"
  - name: "Browser"
- name: "AccountStatus"
  description: "Lifecycle and access states for a user account."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Locked"
  - name: "Disabled"
  - name: "PendingVerification"
- name: "CredentialType"
  description: "Supported credential kinds used to prove identity."
  data:
  - name: "Password"
  - name: "WebAuthn"
  - name: "OtpSeed"
  - name: "RecoveryCodes"
  - name: "MagicLinkSecret"
- name: "AuthOutcome"
  description: "Result of an authentication attempt."
  data:
  - name: "Success"
  - name: "Failure"
  - name: "Challenged"
  - name: "LockedOut"
  - name: "Expired"
  - name: "Aborted"
- name: "AuthMethod"
  description: "Mechanisms applied during an authentication attempt."
  data:
  - name: "Password"
  - name: "WebAuthn"
  - name: "Otp"
  - name: "MagicLink"
  - name: "RecoveryCode"
  - name: "Social"
  - name: "Federated"
- name: "RiskLevel"
  description: "Normalized risk categorization used during sign-in."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "DevicePlatform"
  description: "Operating platform of a device observed during sign-in."
  data:
  - name: "iOS"
  - name: "Android"
  - name: "Windows"
  - name: "macOS"
  - name: "Linux"
  - name: "Web"
- name: "TrustLevel"
  description: "Degree of trust attributed to a device."
  data:
  - name: "Untrusted"
  - name: "Known"
  - name: "Trusted"
- name: "AuthFactorType"
  description: "Factor categories available for multi-factor authentication."
  data:
  - name: "Password"
  - name: "Otp"
  - name: "WebAuthn"
  - name: "RecoveryCodes"
  - name: "EmailLink"
  - name: "Push"
- name: "OtpDeliveryMethod"
  description: "Channels through which one-time passwords are delivered or generated."
  data:
  - name: "App"
  - name: "SMS"
  - name: "Voice"
  - name: "Email"
- name: "OtpAlgorithm"
  description: "Hash algorithms used for time or counter based OTP generation."
  data:
  - name: "SHA1"
  - name: "SHA256"
  - name: "SHA512"
- name: "AuthPolicyType"
  description: "Classes of policies that influence authentication behavior."
  data:
  - name: "FlowControl"
  - name: "FactorPolicy"
  - name: "RiskPolicy"
  - name: "SessionPolicy"
- name: "PolicyEffect"
  description: "Action taken when a policy rule condition matches."
  data:
  - name: "Allow"
  - name: "Deny"
  - name: "RequireStepUp"
- name: "FactorRequirementType"
  description: "Requirement semantics governing factor usage."
  data:
  - name: "Required"
  - name: "Optional"
  - name: "Conditional"
  - name: "StepUp"
- name: "AuthFlowType"
  description: "High-level authentication flow categories."
  data:
  - name: "Interactive"
  - name: "Passwordless"
  - name: "Federated"
  - name: "DeviceCode"
- name: "AuthStepType"
  description: "Stage types commonly executed within authentication flows."
  data:
  - name: "Identify"
  - name: "PrimaryVerification"
  - name: "SecondaryVerification"
  - name: "RiskEvaluation"
  - name: "Completion"
- name: "ChallengeType"
  description: "Types of challenges presented to users during authentication."
  data:
  - name: "Password"
  - name: "Otp"
  - name: "WebAuthn"
  - name: "EmailLink"
  - name: "Push"
- name: "TokenType"
  description: "Session-related token categories issued to clients."
  data:
  - name: "Session"
  - name: "RememberMe"
- name: "LockReason"
  description: "Reasons an account may be locked against authentication."
  data:
  - name: "TooManyFailures"
  - name: "AdminAction"
  - name: "RiskDetected"
  - name: "Compliance"
- name: "SessionStatus"
  description: "Lifecycle state of an authentication session."
  data:
  - name: "Active"
  - name: "Idle"
  - name: "Expired"
  - name: "Revoked"
  - name: "Terminated"
- name: "KeyUse"
  description: "Intended cryptographic usage of a key."
  data:
  - name: "Signing"
  - name: "Encryption"
- name: "FederationIdFormat"
  description: "Formats used to represent federated subject identifiers."
  data:
  - name: "Subject"
  - name: "Email"
  - name: "PersistentNameId"
  - name: "TransientNameId"
valueObjects:
- name: "HashedSecret"
  description: "Non-reversible representation of a secret including algorithm and\
    \ salt."
  data:
  - name: "value"
    type: "String"
  - name: "algorithm"
    type: "String"
  - name: "salt"
    type: "String"
  - name: "createdOn"
    type: "Date"
- name: "PublicKey"
  description: "Encoded public key used for asymmetric authentication."
  data:
  - name: "algorithm"
    type: "String"
  - name: "keyPem"
    type: "String"
- name: "Url"
  description: "Absolute URL identifying an HTTP or HTTPS endpoint."
  data:
  - name: "value"
    type: "String"
- name: "IpAddress"
  description: "Canonical representation of an IPv4 or IPv6 address."
  data:
  - name: "value"
    type: "String"
- name: "UserAgent"
  description: "Raw representation of the client user agent string."
  data:
  - name: "value"
    type: "String"
- name: "EmailAddress"
  description: "Electronic mail address compliant with common internet standards."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "International telephone number with country code and optional extension."
  data:
  - name: "countryCode"
    type: "String"
  - name: "number"
    type: "String"
  - name: "extension"
    type: "String"
- name: "LocaleCode"
  description: "IETF BCP 47 language tag expressing the user’s locale preference."
  data:
  - name: "value"
    type: "String"
- name: "TimeZoneId"
  description: "IANA time zone identifier for local time interpretation."
  data:
  - name: "value"
    type: "String"
- name: "OtpSeed"
  description: "Base32-encoded shared secret used to generate one-time passwords."
  data:
  - name: "value"
    type: "String"
