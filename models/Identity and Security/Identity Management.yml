---
metadata:
  name: "Identity Management HCIDL"
  description: "Capability model for managing digital identities, accounts, profiles,\
    \ credentials, federation, and provisioning across identity stores and connected\
    \ systems."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Identity and Security"
  type: "Capability"
  domain: "Identity Management"
entities:
- name: "IdentityStore"
  description: "Logical directory that governs identities, schema, providers, and\
    \ connectors for a defined domain."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "domainName"
    type: "String"
  - name: "defaultLocale"
    type: "String"
  - name: "status"
    type: "StoreStatus"
  relations:
  - name: "users"
    type: "User"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "Group"
    multiplicity: "OneToMany"
  - name: "servicePrincipals"
    type: "ServicePrincipal"
    multiplicity: "OneToMany"
  - name: "identityProviders"
    type: "IdentityProvider"
    multiplicity: "OneToMany"
  - name: "attributeSchema"
    type: "AttributeSchema"
    multiplicity: "OneToOne"
  - name: "provisioningConnectors"
    type: "ProvisioningConnector"
    multiplicity: "OneToMany"
  - name: "events"
    type: "IdentityEvent"
    multiplicity: "OneToMany"
- name: "User"
  description: "Human-centric digital identity subject representing a person within\
    \ the identity store."
  data:
  - name: "username"
    type: "String"
  - name: "primaryEmail"
    type: "EmailAddress"
  - name: "displayName"
    type: "DisplayName"
  - name: "userType"
    type: "UserType"
  - name: "status"
    type: "AccountStatus"
  - name: "preferredLocale"
    type: "String"
  - name: "createdAt"
    type: "Date"
  - name: "lastSeenAt"
    type: "Date"
  relations:
  - name: "identityStore"
    type: "IdentityStore"
    multiplicity: "ManyToOne"
  - name: "profile"
    type: "IdentityProfile"
    multiplicity: "OneToOne"
  - name: "credentials"
    type: "Credential"
    multiplicity: "OneToMany"
  - name: "factors"
    type: "AuthenticationFactor"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "Group"
    multiplicity: "ManyToMany"
  - name: "externalAccounts"
    type: "ExternalAccount"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "ConsentGrant"
    multiplicity: "OneToMany"
  - name: "lifecyclePolicy"
    type: "LifecyclePolicy"
    multiplicity: "ManyToOne"
- name: "IdentityProfile"
  description: "Extended profile and demographic attributes for a user."
  data:
  - name: "nameParts"
    type: "NameParts"
  - name: "birthdate"
    type: "Date"
  - name: "timezone"
    type: "String"
  - name: "primaryAddress"
    type: "PostalAddress"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "OneToOne"
- name: "Group"
  description: "Collection of users for organizing identities and driving policy and\
    \ entitlement assignments."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "isDynamic"
    type: "Boolean"
  relations:
  - name: "identityStore"
    type: "IdentityStore"
    multiplicity: "ManyToOne"
  - name: "members"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "owners"
    type: "User"
    multiplicity: "ManyToMany"
- name: "ServicePrincipal"
  description: "Non-human identity representing an application, integration, or automated\
    \ agent."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "applicationType"
    type: "ApplicationType"
  - name: "status"
    type: "AccountStatus"
  relations:
  - name: "identityStore"
    type: "IdentityStore"
    multiplicity: "ManyToOne"
  - name: "credentials"
    type: "Credential"
    multiplicity: "OneToMany"
  - name: "owners"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "externalAccounts"
    type: "ExternalAccount"
    multiplicity: "OneToMany"
  - name: "lifecyclePolicy"
    type: "LifecyclePolicy"
    multiplicity: "ManyToOne"
- name: "Credential"
  description: "Authentication material such as passwords, keys, certificates, and\
    \ recovery artifacts bound to identities."
  data:
  - name: "credentialType"
    type: "CredentialType"
  - name: "status"
    type: "CredentialStatus"
  - name: "hashedSecret"
    type: "HashedSecret"
  - name: "publicKey"
    type: "PublicKeyMaterial"
  - name: "certificatePem"
    type: "String"
  - name: "friendlyName"
    type: "String"
  - name: "createdAt"
    type: "Date"
  - name: "expiresAt"
    type: "Date"
  - name: "lastRotatedAt"
    type: "Date"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "servicePrincipal"
    type: "ServicePrincipal"
    multiplicity: "ManyToOne"
- name: "AuthenticationFactor"
  description: "Enrolled multi-factor authentication method for a user."
  data:
  - name: "factorType"
    type: "FactorType"
  - name: "status"
    type: "FactorStatus"
  - name: "displayName"
    type: "String"
  - name: "enrolledAt"
    type: "Date"
  - name: "lastUsedAt"
    type: "Date"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "bindingId"
    type: "String"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "IdentityProvider"
  description: "External provider configuration enabling authentication and identity\
    \ federation."
  data:
  - name: "name"
    type: "String"
  - name: "providerType"
    type: "ProviderType"
  - name: "protocol"
    type: "FederationProtocol"
  - name: "issuer"
    type: "String"
  - name: "clientId"
    type: "String"
  - name: "discoveryUrl"
    type: "Url"
  - name: "enabled"
    type: "Boolean"
  - name: "signingKey"
    type: "PublicKeyMaterial"
  relations:
  - name: "identityStore"
    type: "IdentityStore"
    multiplicity: "ManyToOne"
  - name: "claimMappings"
    type: "ClaimMapping"
    multiplicity: "OneToMany"
  - name: "federationTrusts"
    type: "FederationTrust"
    multiplicity: "OneToMany"
- name: "FederationTrust"
  description: "Trust configuration defining token validation and security rules for\
    \ federated authentication."
  data:
  - name: "name"
    type: "String"
  - name: "protocol"
    type: "FederationProtocol"
  - name: "audienceUri"
    type: "Url"
  - name: "assertionValiditySeconds"
    type: "Integer"
  - name: "signatureAlgorithm"
    type: "SignatureAlgorithm"
  - name: "clockSkewSeconds"
    type: "Integer"
  - name: "status"
    type: "TrustStatus"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
  - name: "relyingParties"
    type: "RelyingParty"
    multiplicity: "OneToMany"
- name: "RelyingParty"
  description: "Application or service that consumes identity assertions from a federation\
    \ trust."
  data:
  - name: "name"
    type: "String"
  - name: "clientId"
    type: "String"
  - name: "defaultRedirectUri"
    type: "Url"
  - name: "logoUrl"
    type: "Url"
  - name: "contactEmail"
    type: "EmailAddress"
  relations:
  - name: "federationTrust"
    type: "FederationTrust"
    multiplicity: "ManyToOne"
  - name: "consents"
    type: "ConsentGrant"
    multiplicity: "OneToMany"
- name: "AttributeSchema"
  description: "Collection of attribute definitions governing identity data structure\
    \ within a store."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "status"
    type: "SchemaStatus"
  - name: "description"
    type: "String"
  relations:
  - name: "identityStore"
    type: "IdentityStore"
    multiplicity: "ManyToOne"
  - name: "attributes"
    type: "SchemaAttribute"
    multiplicity: "OneToMany"
- name: "SchemaAttribute"
  description: "Declarative definition of an individual attribute, its type, and constraints."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "SchemaAttributeType"
  - name: "multivalued"
    type: "Boolean"
  - name: "required"
    type: "Boolean"
  - name: "uniqueness"
    type: "Uniqueness"
  - name: "caseExact"
    type: "Boolean"
  - name: "description"
    type: "String"
  relations:
  - name: "schema"
    type: "AttributeSchema"
    multiplicity: "ManyToOne"
- name: "ClaimMapping"
  description: "Rule translating inbound provider claims to internal attribute names\
    \ with optional transformation."
  data:
  - name: "sourceClaim"
    type: "String"
  - name: "targetAttribute"
    type: "String"
  - name: "transformType"
    type: "ClaimTransformType"
  - name: "transformRule"
    type: "String"
  - name: "isRequired"
    type: "Boolean"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
- name: "ProvisioningConnector"
  description: "Integration endpoint used to provision, update, and deprovision identities\
    \ in external systems."
  data:
  - name: "name"
    type: "String"
  - name: "connectorType"
    type: "ConnectorType"
  - name: "endpoint"
    type: "Url"
  - name: "enabled"
    type: "Boolean"
  - name: "authType"
    type: "ConnectorAuthType"
  - name: "allowCreateUpdate"
    type: "Boolean"
  relations:
  - name: "identityStore"
    type: "IdentityStore"
    multiplicity: "ManyToOne"
  - name: "provisioningTasks"
    type: "ProvisioningTask"
    multiplicity: "OneToMany"
  - name: "externalAccounts"
    type: "ExternalAccount"
    multiplicity: "OneToMany"
  - name: "attributeMappings"
    type: "AttributeMapping"
    multiplicity: "OneToMany"
- name: "AttributeMapping"
  description: "Transformation rule mapping internal attributes to target system fields\
    \ for provisioning."
  data:
  - name: "sourceAttribute"
    type: "String"
  - name: "targetField"
    type: "String"
  - name: "transformType"
    type: "ClaimTransformType"
  - name: "transformRule"
    type: "String"
  - name: "isRequired"
    type: "Boolean"
  relations:
  - name: "provisioningConnector"
    type: "ProvisioningConnector"
    multiplicity: "ManyToOne"
- name: "ExternalAccount"
  description: "Representation of an identity in a connected external system, linked\
    \ to a user or service principal."
  data:
  - name: "externalSystem"
    type: "String"
  - name: "externalSubject"
    type: "SubjectIdentifier"
  - name: "accountStatus"
    type: "AccountStatus"
  - name: "linkedAt"
    type: "Date"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "servicePrincipal"
    type: "ServicePrincipal"
    multiplicity: "ManyToOne"
  - name: "provisioningConnector"
    type: "ProvisioningConnector"
    multiplicity: "ManyToOne"
- name: "ProvisioningTask"
  description: "Instruction and execution record for synchronizing identity data with\
    \ a target system."
  data:
  - name: "actionType"
    type: "ProvisioningActionType"
  - name: "status"
    type: "ProvisioningStatus"
  - name: "requestedAt"
    type: "Date"
  - name: "executedAt"
    type: "Date"
  - name: "errorMessage"
    type: "String"
  relations:
  - name: "provisioningConnector"
    type: "ProvisioningConnector"
    multiplicity: "ManyToOne"
  - name: "externalAccount"
    type: "ExternalAccount"
    multiplicity: "ManyToOne"
  - name: "subjectUser"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "subjectServicePrincipal"
    type: "ServicePrincipal"
    multiplicity: "ManyToOne"
- name: "ConsentGrant"
  description: "Record of a user's consent for a relying party to access defined identity\
    \ scopes."
  data:
  - name: "scope"
    type: "String"
  - name: "grantedAt"
    type: "Date"
  - name: "expiresAt"
    type: "Date"
  - name: "status"
    type: "ConsentStatus"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "relyingParty"
    type: "RelyingParty"
    multiplicity: "ManyToOne"
- name: "IdentityEvent"
  description: "Audit-relevant occurrence reflecting changes or actions related to\
    \ identities and providers."
  data:
  - name: "eventType"
    type: "IdentityEventType"
  - name: "occurredAt"
    type: "Date"
  - name: "actor"
    type: "String"
  - name: "ipAddress"
    type: "IPAddress"
  - name: "userAgent"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "identityStore"
    type: "IdentityStore"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "servicePrincipal"
    type: "ServicePrincipal"
    multiplicity: "ManyToOne"
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
- name: "LifecyclePolicy"
  description: "Rules governing activation, suspension, MFA requirements, and retirement\
    \ of identities."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "disableOnInactiveDays"
    type: "Integer"
  - name: "deleteAfterDeprovisionDays"
    type: "Integer"
  - name: "requireMfa"
    type: "Boolean"
  - name: "passwordRotationDays"
    type: "Integer"
  - name: "status"
    type: "PolicyStatus"
  relations:
  - name: "identityStore"
    type: "IdentityStore"
    multiplicity: "ManyToOne"
  - name: "users"
    type: "User"
    multiplicity: "OneToMany"
  - name: "servicePrincipals"
    type: "ServicePrincipal"
    multiplicity: "OneToMany"
enums:
- name: "StoreStatus"
  description: "Lifecycle state of an identity store."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "ReadOnly"
  - name: "Decommissioned"
- name: "AccountStatus"
  description: "Operational state of a user or service principal account."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Disabled"
  - name: "Archived"
  - name: "PendingActivation"
  - name: "Deprovisioned"
  - name: "Locked"
- name: "UserType"
  description: "Classification of user based on affiliation."
  data:
  - name: "Employee"
  - name: "Contractor"
  - name: "Partner"
  - name: "Customer"
  - name: "Guest"
- name: "ProviderType"
  description: "Type of external identity provider integration."
  data:
  - name: "OIDC"
  - name: "SAML"
  - name: "LDAP"
  - name: "SCIM"
- name: "FederationProtocol"
  description: "Protocol used for single sign-on and identity federation."
  data:
  - name: "OpenIDConnect"
  - name: "SAML2"
- name: "CredentialType"
  description: "Kind of credential material used for authentication."
  data:
  - name: "Password"
  - name: "TOTPSeed"
  - name: "WebAuthnPublicKey"
  - name: "X509Certificate"
  - name: "SSHKey"
  - name: "ApiKey"
  - name: "RecoveryCode"
- name: "CredentialStatus"
  description: "Current validity of a credential."
  data:
  - name: "Active"
  - name: "Revoked"
  - name: "Compromised"
  - name: "Expired"
  - name: "PendingActivation"
- name: "FactorType"
  description: "Supported multi-factor method categories."
  data:
  - name: "TOTP"
  - name: "SMS"
  - name: "EmailOTP"
  - name: "Push"
  - name: "WebAuthn"
  - name: "SecurityKey"
  - name: "BackupCode"
- name: "FactorStatus"
  description: "Enrollment and availability state of an MFA factor."
  data:
  - name: "Enrolled"
  - name: "PendingVerification"
  - name: "Locked"
  - name: "Disabled"
- name: "SchemaAttributeType"
  description: "Primitive and semantic types used in the attribute schema."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime"
  - name: "Email"
  - name: "Phone"
  - name: "Url"
  - name: "Binary"
  - name: "Json"
- name: "Uniqueness"
  description: "Uniqueness scope constraint for an attribute value."
  data:
  - name: "None"
  - name: "Global"
  - name: "ScopedToStore"
- name: "SignatureAlgorithm"
  description: "Algorithm used to sign federation tokens or assertions."
  data:
  - name: "RS256"
  - name: "RS512"
  - name: "ES256"
  - name: "ES384"
  - name: "PS256"
- name: "TrustStatus"
  description: "Lifecycle and readiness state of a federation trust configuration."
  data:
  - name: "Active"
  - name: "Disabled"
  - name: "Expired"
  - name: "Testing"
- name: "ApplicationType"
  description: "Classification for applications represented by service principals."
  data:
  - name: "WebApplication"
  - name: "NativeApplication"
  - name: "Service"
  - name: "Daemon"
- name: "ConnectorType"
  description: "Technology category of a provisioning connector."
  data:
  - name: "SCIM"
  - name: "LDAP"
  - name: "AzureADGraph"
  - name: "Webhook"
  - name: "Custom"
- name: "ConnectorAuthType"
  description: "Authentication approach used by provisioning connectors."
  data:
  - name: "None"
  - name: "Basic"
  - name: "OAuth2ClientCredentials"
  - name: "ApiKey"
  - name: "SignedJwt"
- name: "ProvisioningActionType"
  description: "Operation to be performed against a target system."
  data:
  - name: "Create"
  - name: "Update"
  - name: "Disable"
  - name: "Delete"
  - name: "Link"
  - name: "Unlink"
  - name: "Sync"
- name: "ProvisioningStatus"
  description: "Execution state of a provisioning task."
  data:
  - name: "Queued"
  - name: "InProgress"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Retrying"
  - name: "Cancelled"
- name: "ConsentStatus"
  description: "State of a user's consent in relation to a relying party."
  data:
  - name: "Active"
  - name: "Revoked"
  - name: "Expired"
- name: "IdentityEventType"
  description: "Types of auditable events occurring within identity management."
  data:
  - name: "IdentityCreated"
  - name: "IdentityUpdated"
  - name: "IdentityDisabled"
  - name: "IdentityDeleted"
  - name: "CredentialChanged"
  - name: "FactorEnrolled"
  - name: "FactorRemoved"
  - name: "ExternalAccountLinked"
  - name: "ExternalAccountUnlinked"
  - name: "ConsentGranted"
  - name: "ConsentRevoked"
- name: "HashAlgorithm"
  description: "Algorithms used to derive password or secret hashes."
  data:
  - name: "BCrypt"
  - name: "SCrypt"
  - name: "Argon2id"
  - name: "PBKDF2"
- name: "KeyType"
  description: "Public key family for cryptographic materials."
  data:
  - name: "RSA"
  - name: "EC"
  - name: "Ed25519"
- name: "SchemaStatus"
  description: "Publication state of an attribute schema."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Deprecated"
- name: "PolicyStatus"
  description: "Deployment readiness of a lifecycle policy."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Disabled"
valueObjects:
- name: "EmailAddress"
  description: "Canonical email address format for contact and notification purposes."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "E.164-compatible phone number split into country code and subscriber\
    \ number."
  data:
  - name: "countryCode"
    type: "String"
  - name: "number"
    type: "String"
- name: "DisplayName"
  description: "Preferred human-readable name for displaying an identity."
  data:
  - name: "value"
    type: "String"
- name: "SubjectIdentifier"
  description: "Stable, provider-agnostic identifier string for external or federated\
    \ subjects."
  data:
  - name: "value"
    type: "String"
- name: "HashedSecret"
  description: "Derived representation of a secret including algorithm parameters."
  data:
  - name: "algorithm"
    type: "HashAlgorithm"
  - name: "hash"
    type: "String"
  - name: "salt"
    type: "String"
  - name: "iterations"
    type: "Integer"
- name: "PublicKeyMaterial"
  description: "Public key material expressed in PEM with its key family."
  data:
  - name: "keyType"
    type: "KeyType"
  - name: "publicKeyPem"
    type: "String"
- name: "NameParts"
  description: "Structured personal name components for internationalization and matching."
  data:
  - name: "givenName"
    type: "String"
  - name: "middleName"
    type: "String"
  - name: "familyName"
    type: "String"
  - name: "honorificPrefix"
    type: "String"
  - name: "honorificSuffix"
    type: "String"
- name: "Url"
  description: "Fully qualified uniform resource locator."
  data:
  - name: "value"
    type: "String"
- name: "PostalAddress"
  description: "Physical mailing address for an identity."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "IPAddress"
  description: "IPv4 or IPv6 textual representation for audit and policy evaluation."
  data:
  - name: "value"
    type: "String"
