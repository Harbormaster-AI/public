---
metadata:
  name: "Secrets Management Capabilities Model"
  description: "A capabilities model for securely storing, versioning, controlling\
    \ access to, and auditing the lifecycle of secrets across environments and workloads."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Identity and Security"
  type: "Capability"
  domain: "Secrets Management"
entities:
- name: "SecretStore"
  description: "Logical boundary that provides secret storage, access control, encryption,\
    \ replication, and auditing for one or more namespaces."
  data:
  - name: "name"
    type: "String"
  - name: "endpoint"
    type: "EndpointURL"
  - name: "defaultEncryption"
    type: "KeyReference"
  - name: "softDeleteRetentionDays"
    type: "Integer"
  - name: "purgeProtectionEnabled"
    type: "Boolean"
  relations:
  - name: "namespaces"
    type: "Namespace"
    multiplicity: "OneToMany"
  - name: "secretEngines"
    type: "SecretEngine"
    multiplicity: "OneToMany"
  - name: "encryptionKeys"
    type: "EncryptionKey"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
  - name: "backups"
    type: "BackupSnapshot"
    multiplicity: "OneToMany"
  - name: "principals"
    type: "Principal"
    multiplicity: "OneToMany"
  - name: "clients"
    type: "ClientApplication"
    multiplicity: "OneToMany"
- name: "Namespace"
  description: "Administrative and path-based partition within a secret store used\
    \ to segregate teams, environments, or applications."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "resourcePath"
    type: "ResourcePath"
  - name: "environment"
    type: "Environment"
  relations:
  - name: "secretStore"
    type: "SecretStore"
    multiplicity: "ManyToOne"
  - name: "secrets"
    type: "Secret"
    multiplicity: "OneToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "clients"
    type: "ClientApplication"
    multiplicity: "ManyToMany"
  - name: "backups"
    type: "BackupSnapshot"
    multiplicity: "OneToMany"
- name: "Secret"
  description: "Named logical secret whose values are stored as immutable versions\
    \ and protected by policy, encryption, and rotation rules."
  data:
  - name: "name"
    type: "String"
  - name: "type"
    type: "SecretType"
  - name: "state"
    type: "SecretState"
  - name: "createdAt"
    type: "Date"
  - name: "lastRotatedAt"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "checksum"
    type: "Checksum"
  - name: "labels"
    type: "String"
  relations:
  - name: "namespace"
    type: "Namespace"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "SecretVersion"
    multiplicity: "OneToMany"
  - name: "rotationPolicy"
    type: "RotationPolicy"
    multiplicity: "OneToOne"
  - name: "replicationPolicy"
    type: "ReplicationPolicy"
    multiplicity: "OneToOne"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "encryptionKey"
    type: "EncryptionKey"
    multiplicity: "ManyToOne"
- name: "SecretVersion"
  description: "Immutable value of a secret captured at a point in time with encoding\
    \ and cryptographic integrity details."
  data:
  - name: "versionNumber"
    type: "Integer"
  - name: "createdAt"
    type: "Date"
  - name: "activatedAt"
    type: "Date"
  - name: "expiresAt"
    type: "Date"
  - name: "encoding"
    type: "SecretEncoding"
  - name: "sizeBytes"
    type: "Integer"
  - name: "checksum"
    type: "Checksum"
  - name: "isCurrent"
    type: "Boolean"
  relations:
  - name: "secret"
    type: "Secret"
    multiplicity: "ManyToOne"
  - name: "encryptionKey"
    type: "EncryptionKey"
    multiplicity: "ManyToOne"
- name: "RotationPolicy"
  description: "Rule set that defines how and when a secret is rotated, the retention\
    \ of versions, and operational status."
  data:
  - name: "name"
    type: "String"
  - name: "schedule"
    type: "CronExpression"
  - name: "rotationWindowDays"
    type: "Integer"
  - name: "status"
    type: "RotationStatus"
  - name: "maxVersionsRetained"
    type: "Integer"
  relations:
  - name: "secret"
    type: "Secret"
    multiplicity: "ManyToOne"
  - name: "engine"
    type: "SecretEngine"
    multiplicity: "ManyToOne"
- name: "ReplicationPolicy"
  description: "Configuration describing how secret data is replicated across regions\
    \ or clusters and how conflicts are resolved."
  data:
  - name: "name"
    type: "String"
  - name: "mode"
    type: "ReplicationMode"
  - name: "targetRegions"
    type: "String"
  - name: "conflictResolution"
    type: "ConflictResolutionStrategy"
  relations:
  - name: "secret"
    type: "Secret"
    multiplicity: "ManyToOne"
  - name: "links"
    type: "ReplicationLink"
    multiplicity: "OneToMany"
- name: "ReplicationLink"
  description: "Operational state of a single replication flow between a source region\
    \ and a target region for a secret."
  data:
  - name: "sourceRegion"
    type: "String"
  - name: "targetRegion"
    type: "String"
  - name: "status"
    type: "ReplicationStatus"
  - name: "lastSyncedAt"
    type: "Date"
  relations:
  - name: "replicationPolicy"
    type: "ReplicationPolicy"
    multiplicity: "ManyToOne"
- name: "AccessPolicy"
  description: "Authorization rule granting a principal or client application specific\
    \ permissions on a secret or namespace."
  data:
  - name: "name"
    type: "String"
  - name: "permission"
    type: "AccessPermission"
  - name: "condition"
    type: "ConditionExpression"
  - name: "expiresAt"
    type: "Date"
  relations:
  - name: "secret"
    type: "Secret"
    multiplicity: "ManyToOne"
  - name: "namespace"
    type: "Namespace"
    multiplicity: "ManyToOne"
  - name: "principal"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "client"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
- name: "Principal"
  description: "Human or machine identity recognized by the secret store for authorization\
    \ and auditing."
  data:
  - name: "name"
    type: "String"
  - name: "principalType"
    type: "PrincipalType"
  - name: "externalReference"
    type: "String"
  - name: "organization"
    type: "String"
  relations:
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "tokens"
    type: "AccessToken"
    multiplicity: "OneToMany"
  - name: "clients"
    type: "ClientApplication"
    multiplicity: "OneToMany"
- name: "ClientApplication"
  description: "Software workload that retrieves or manages secrets, often bound to\
    \ a namespace and governed by policies and tokens."
  data:
  - name: "name"
    type: "String"
  - name: "applicationType"
    type: "ApplicationType"
  - name: "environment"
    type: "Environment"
  - name: "allowedCidrs"
    type: "String"
  relations:
  - name: "namespace"
    type: "Namespace"
    multiplicity: "ManyToOne"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "tokens"
    type: "AccessToken"
    multiplicity: "OneToMany"
  - name: "leases"
    type: "CredentialLease"
    multiplicity: "OneToMany"
- name: "AccessToken"
  description: "Time-bound credential issued by the secret store that authorizes a\
    \ principal or client to perform actions."
  data:
  - name: "tokenType"
    type: "TokenType"
  - name: "issuedAt"
    type: "Date"
  - name: "expiresAt"
    type: "Date"
  - name: "scopes"
    type: "String"
  - name: "revoked"
    type: "Boolean"
  relations:
  - name: "principal"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "client"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
  - name: "secretStore"
    type: "SecretStore"
    multiplicity: "ManyToOne"
- name: "SecretEngine"
  description: "Pluggable subsystem that generates, stores, or transforms secrets\
    \ such as key-value, database credentials, or cloud keys."
  data:
  - name: "name"
    type: "String"
  - name: "engineType"
    type: "EngineType"
  - name: "mountPath"
    type: "ResourcePath"
  - name: "configuration"
    type: "String"
  - name: "defaultLeaseDurationSeconds"
    type: "Integer"
  - name: "maxLeaseDurationSeconds"
    type: "Integer"
  - name: "status"
    type: "EngineStatus"
  relations:
  - name: "secretStore"
    type: "SecretStore"
    multiplicity: "ManyToOne"
  - name: "definitions"
    type: "DynamicCredentialDefinition"
    multiplicity: "OneToMany"
  - name: "leases"
    type: "CredentialLease"
    multiplicity: "OneToMany"
- name: "DynamicCredentialDefinition"
  description: "Template describing how to create, rotate, and revoke on-demand credentials\
    \ from a secret engine."
  data:
  - name: "name"
    type: "String"
  - name: "credentialType"
    type: "CredentialType"
  - name: "creationStatements"
    type: "String"
  - name: "revokeStatements"
    type: "String"
  - name: "rotationStatements"
    type: "String"
  relations:
  - name: "engine"
    type: "SecretEngine"
    multiplicity: "ManyToOne"
  - name: "rotationPolicy"
    type: "RotationPolicy"
    multiplicity: "ManyToOne"
- name: "CredentialLease"
  description: "Time-limited right to use a dynamically generated credential, renewable\
    \ within defined limits."
  data:
  - name: "issuedAt"
    type: "Date"
  - name: "expiresAt"
    type: "Date"
  - name: "renewable"
    type: "Boolean"
  - name: "status"
    type: "LeaseStatus"
  relations:
  - name: "engine"
    type: "SecretEngine"
    multiplicity: "ManyToOne"
  - name: "definition"
    type: "DynamicCredentialDefinition"
    multiplicity: "ManyToOne"
  - name: "client"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
  - name: "principal"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "secret"
    type: "Secret"
    multiplicity: "ManyToOne"
- name: "EncryptionKey"
  description: "Cryptographic key material or external reference used to encrypt secrets\
    \ at rest and in transit."
  data:
  - name: "alias"
    type: "String"
  - name: "keyType"
    type: "KeyType"
  - name: "algorithm"
    type: "KeyAlgorithm"
  - name: "rotationIntervalDays"
    type: "Integer"
  - name: "managedBy"
    type: "KeyManager"
  - name: "createdAt"
    type: "Date"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "secretStore"
    type: "SecretStore"
    multiplicity: "ManyToOne"
  - name: "secrets"
    type: "Secret"
    multiplicity: "OneToMany"
- name: "BackupSnapshot"
  description: "Point-in-time export of secret metadata and values, protected by encryption\
    \ and suitable for disaster recovery."
  data:
  - name: "name"
    type: "String"
  - name: "createdAt"
    type: "Date"
  - name: "scope"
    type: "BackupScope"
  - name: "storageLocation"
    type: "String"
  - name: "encrypted"
    type: "Boolean"
  relations:
  - name: "secretStore"
    type: "SecretStore"
    multiplicity: "ManyToOne"
  - name: "namespace"
    type: "Namespace"
    multiplicity: "ManyToOne"
  - name: "secrets"
    type: "Secret"
    multiplicity: "ManyToMany"
  - name: "encryptionKey"
    type: "EncryptionKey"
    multiplicity: "ManyToOne"
- name: "RestoreTask"
  description: "Operational task to rehydrate secrets and metadata from a backup into\
    \ a target location."
  data:
  - name: "name"
    type: "String"
  - name: "requestedAt"
    type: "Date"
  - name: "status"
    type: "RestoreStatus"
  - name: "targetNamespace"
    type: "String"
  - name: "overwriteExisting"
    type: "Boolean"
  relations:
  - name: "backup"
    type: "BackupSnapshot"
    multiplicity: "ManyToOne"
  - name: "secretStore"
    type: "SecretStore"
    multiplicity: "ManyToOne"
  - name: "namespace"
    type: "Namespace"
    multiplicity: "ManyToOne"
- name: "AuditEvent"
  description: "Immutable record describing an action taken within the secret store,\
    \ including actor, outcome, and affected resources."
  data:
  - name: "occurredAt"
    type: "Date"
  - name: "action"
    type: "AuditAction"
  - name: "actorType"
    type: "ActorType"
  - name: "actorName"
    type: "String"
  - name: "outcome"
    type: "AuditOutcome"
  - name: "sourceIp"
    type: "String"
  - name: "userAgent"
    type: "String"
  relations:
  - name: "secretStore"
    type: "SecretStore"
    multiplicity: "ManyToOne"
  - name: "namespace"
    type: "Namespace"
    multiplicity: "ManyToOne"
  - name: "secret"
    type: "Secret"
    multiplicity: "ManyToOne"
  - name: "client"
    type: "ClientApplication"
    multiplicity: "ManyToOne"
  - name: "principal"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "SecretTemplate"
  description: "Blueprint that defines structure, required keys, and validation rules\
    \ for creating new secrets consistently."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "templateBody"
    type: "String"
  - name: "allowedTypes"
    type: "String"
  relations:
  - name: "namespace"
    type: "Namespace"
    multiplicity: "ManyToOne"
  - name: "secrets"
    type: "Secret"
    multiplicity: "OneToMany"
enums:
- name: "Environment"
  description: "Deployment or operational context used to segment secrets and policies."
  data:
  - name: "Development"
  - name: "Test"
  - name: "Staging"
  - name: "Production"
- name: "SecretType"
  description: "Classification of the secret determining storage, validation, and\
    \ rotation behavior."
  data:
  - name: "Opaque"
  - name: "Password"
  - name: "ApiKey"
  - name: "DatabaseCredential"
  - name: "OAuthClientSecret"
  - name: "SSHPrivateKey"
- name: "SecretState"
  description: "Lifecycle state indicating whether a secret is available for use."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Deprecated"
  - name: "Destroyed"
- name: "SecretEncoding"
  description: "Representation used for storing or transporting the secret payload."
  data:
  - name: "Utf8"
  - name: "Base64"
  - name: "Binary"
- name: "RotationStatus"
  description: "Operational state of automated or manual secret rotation."
  data:
  - name: "Enabled"
  - name: "Disabled"
  - name: "Paused"
- name: "ReplicationMode"
  description: "Strategy governing how secret data is propagated to other locations."
  data:
  - name: "Automatic"
  - name: "Manual"
- name: "ConflictResolutionStrategy"
  description: "Rule applied when concurrent changes are detected across replicas."
  data:
  - name: "LastWriteWins"
  - name: "SourceOfTruth"
- name: "ReplicationStatus"
  description: "Health and progress of a replication link."
  data:
  - name: "Pending"
  - name: "Healthy"
  - name: "Degraded"
  - name: "Error"
- name: "AccessPermission"
  description: "Level of capability granted to a principal or client on a resource."
  data:
  - name: "Read"
  - name: "Write"
  - name: "Rotate"
  - name: "Destroy"
  - name: "Admin"
- name: "PrincipalType"
  description: "Category of identity used for authorization and auditing."
  data:
  - name: "User"
  - name: "Group"
  - name: "ServiceAccount"
  - name: "FederatedIdentity"
- name: "ApplicationType"
  description: "Runtime style of the client application that consumes secrets."
  data:
  - name: "Server"
  - name: "Container"
  - name: "Function"
  - name: "CLI"
  - name: "BatchJob"
- name: "TokenType"
  description: "Format and verification model used for issued tokens."
  data:
  - name: "Bearer"
  - name: "JWT"
  - name: "HMAC"
- name: "EngineType"
  description: "Functional category of secret engine providing storage or credential\
    \ generation."
  data:
  - name: "KV"
  - name: "Database"
  - name: "Cloud"
  - name: "SSH"
  - name: "Transit"
- name: "EngineStatus"
  description: "Availability state of a secret engine."
  data:
  - name: "Enabled"
  - name: "Disabled"
  - name: "Sealed"
- name: "CredentialType"
  description: "Nature of dynamically generated credentials."
  data:
  - name: "DatabaseUser"
  - name: "CloudAccessKey"
  - name: "SSHCredential"
  - name: "TemporaryToken"
- name: "LeaseStatus"
  description: "Current validity state of a credential lease."
  data:
  - name: "Active"
  - name: "Renewed"
  - name: "Expired"
  - name: "Revoked"
- name: "KeyType"
  description: "Structural form of the cryptographic key used to protect secrets."
  data:
  - name: "Symmetric"
  - name: "Asymmetric"
- name: "KeyAlgorithm"
  description: "Cryptographic algorithm applied by the encryption key."
  data:
  - name: "AES256"
  - name: "RSA2048"
  - name: "RSA4096"
  - name: "ChaCha20Poly1305"
- name: "KeyManager"
  description: "System responsible for key lifecycle management and custody."
  data:
  - name: "Internal"
  - name: "ExternalKMS"
  - name: "HSM"
- name: "BackupScope"
  description: "Extent of a backup operation across store assets."
  data:
  - name: "Store"
  - name: "Namespace"
  - name: "Selection"
- name: "RestoreStatus"
  description: "Progress state for a restore task."
  data:
  - name: "Pending"
  - name: "InProgress"
  - name: "Completed"
  - name: "Failed"
  - name: "Cancelled"
- name: "AuditAction"
  description: "Type of operation recorded for compliance and forensics."
  data:
  - name: "CreateSecret"
  - name: "ReadSecret"
  - name: "UpdateSecret"
  - name: "DeleteSecret"
  - name: "RotateSecret"
  - name: "GrantAccess"
  - name: "RevokeAccess"
  - name: "IssueLease"
  - name: "RenewLease"
  - name: "RevokeLease"
  - name: "Backup"
  - name: "Restore"
  - name: "ConfigureEngine"
  - name: "Seal"
  - name: "Unseal"
- name: "ActorType"
  description: "Origin of the action recorded in the audit trail."
  data:
  - name: "User"
  - name: "Service"
  - name: "System"
- name: "AuditOutcome"
  description: "Result of the attempted action."
  data:
  - name: "Success"
  - name: "Failure"
valueObjects:
- name: "ResourcePath"
  description: "Hierarchical location reference used to address namespaces, mounts,\
    \ or secrets."
  data:
  - name: "value"
    type: "String"
- name: "EndpointURL"
  description: "Network-accessible URL used by clients and administrators to reach\
    \ the secret store."
  data:
  - name: "value"
    type: "String"
- name: "CronExpression"
  description: "Time-based schedule described in cron syntax for automation tasks\
    \ such as rotation."
  data:
  - name: "value"
    type: "String"
- name: "Checksum"
  description: "Digest that verifies the integrity of a secret value or backup artifact."
  data:
  - name: "algorithm"
    type: "String"
  - name: "value"
    type: "String"
- name: "KeyReference"
  description: "Logical reference to an encryption key including the alias and managing\
    \ system."
  data:
  - name: "alias"
    type: "String"
  - name: "provider"
    type: "String"
- name: "ConditionExpression"
  description: "Expression evaluated at access time to enforce contextual authorization\
    \ constraints."
  data:
  - name: "language"
    type: "String"
  - name: "expression"
    type: "String"
