---
metadata:
  name: "User Management"
  description: "Capability model for managing users, their attributes, credentials,\
    \ memberships, and related lifecycle within identity and security domains."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Identity and Security"
  type: "Capability"
  domain: "User Management"
entities:
- name: "User"
  description: "Core identity representing a human or service principal that can authenticate\
    \ and be managed."
  data:
  - name: "username"
    type: "Username"
  - name: "displayName"
    type: "String"
  - name: "givenName"
    type: "String"
  - name: "familyName"
    type: "String"
  - name: "preferredLocale"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "status"
    type: "UserStatus"
  - name: "userType"
    type: "UserType"
  - name: "createdDate"
    type: "Date"
  - name: "lastSignInDate"
    type: "Date"
  relations:
  - name: "profile"
    type: "UserProfile"
    multiplicity: "OneToOne"
  - name: "contactMethods"
    type: "ContactMethod"
    multiplicity: "OneToMany"
  - name: "credentials"
    type: "UserCredential"
    multiplicity: "OneToMany"
  - name: "externalIdentities"
    type: "ExternalIdentity"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "Group"
    multiplicity: "ManyToMany"
  - name: "consents"
    type: "UserConsent"
    multiplicity: "OneToMany"
  - name: "signInEvents"
    type: "SignInEvent"
    multiplicity: "OneToMany"
  - name: "passwordResets"
    type: "PasswordReset"
    multiplicity: "OneToMany"
  - name: "settings"
    type: "UserSetting"
    multiplicity: "OneToMany"
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "UserProfile"
  description: "Extended personal and preference information for a user."
  data:
  - name: "jobTitle"
    type: "String"
  - name: "department"
    type: "String"
  - name: "locale"
    type: "String"
  - name: "timeFormat24h"
    type: "Boolean"
  - name: "birthDate"
    type: "Date"
  - name: "avatarUrl"
    type: "Url"
  - name: "address"
    type: "Address"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "OneToOne"
- name: "ContactMethod"
  description: "A user’s reachable channel such as email or phone, with verification\
    \ state."
  data:
  - name: "type"
    type: "ContactMethodType"
  - name: "value"
    type: "String"
  - name: "isPrimary"
    type: "Boolean"
  - name: "status"
    type: "VerificationStatus"
  - name: "verifiedOn"
    type: "Date"
  - name: "addedOn"
    type: "Date"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "UserCredential"
  description: "An authenticator associated with a user account, such as a password\
    \ or passkey."
  data:
  - name: "credentialType"
    type: "CredentialType"
  - name: "credentialLabel"
    type: "String"
  - name: "secret"
    type: "PasswordHash"
  - name: "publicKey"
    type: "String"
  - name: "isPrimary"
    type: "Boolean"
  - name: "isRevoked"
    type: "Boolean"
  - name: "createdOn"
    type: "Date"
  - name: "lastUsedOn"
    type: "Date"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Group"
  description: "Named collection of users for administration, delegation, and policy\
    \ targeting."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "groupType"
    type: "GroupType"
  - name: "isAssignable"
    type: "Boolean"
  - name: "createdOn"
    type: "Date"
  relations:
  - name: "members"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "parentGroup"
    type: "Group"
    multiplicity: "ManyToOne"
  - name: "childGroups"
    type: "Group"
    multiplicity: "OneToMany"
  - name: "passwordPolicies"
    type: "PasswordPolicy"
    multiplicity: "ManyToMany"
- name: "PasswordPolicy"
  description: "Rules governing password construction, rotation, and lockout behavior."
  data:
  - name: "minLength"
    type: "Integer"
  - name: "maxLength"
    type: "Integer"
  - name: "requireUppercase"
    type: "Boolean"
  - name: "requireLowercase"
    type: "Boolean"
  - name: "requireNumber"
    type: "Boolean"
  - name: "requireSymbol"
    type: "Boolean"
  - name: "disallowCommonPasswords"
    type: "Boolean"
  - name: "passwordExpiryDays"
    type: "Integer"
  - name: "passwordHistoryCount"
    type: "Integer"
  - name: "lockoutThreshold"
    type: "Integer"
  - name: "lockoutDurationMinutes"
    type: "Integer"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "appliesToGroups"
    type: "Group"
    multiplicity: "ManyToMany"
- name: "ExternalIdentity"
  description: "Association of a user account with an external identity provider account."
  data:
  - name: "provider"
    type: "IdentityProviderType"
  - name: "subject"
    type: "String"
  - name: "email"
    type: "String"
  - name: "emailVerified"
    type: "Boolean"
  - name: "linkedOn"
    type: "Date"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "SignInEvent"
  description: "Record of an authentication attempt including method, outcome, and\
    \ context."
  data:
  - name: "method"
    type: "AuthMethod"
  - name: "outcome"
    type: "SignInOutcome"
  - name: "ipAddress"
    type: "IPAddress"
  - name: "userAgent"
    type: "String"
  - name: "occurredOn"
    type: "Date"
  - name: "city"
    type: "String"
  - name: "country"
    type: "String"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "UserConsent"
  description: "User’s consent decision for specific processing purposes and versions."
  data:
  - name: "consentType"
    type: "ConsentType"
  - name: "version"
    type: "String"
  - name: "granted"
    type: "Boolean"
  - name: "grantedOn"
    type: "Date"
  - name: "expiresOn"
    type: "Date"
  - name: "jurisdiction"
    type: "String"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "PasswordReset"
  description: "A time-bound, one-time process enabling a user to reset their password\
    \ securely."
  data:
  - name: "status"
    type: "PasswordResetStatus"
  - name: "tokenHash"
    type: "Token"
  - name: "initiatedOn"
    type: "Date"
  - name: "completedOn"
    type: "Date"
  - name: "expiresOn"
    type: "Date"
  - name: "channel"
    type: "ContactMethodType"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "UserSetting"
  description: "Arbitrary key-value preferences or flags scoped to a user."
  data:
  - name: "key"
    type: "String"
  - name: "value"
    type: "String"
  - name: "isSecure"
    type: "Boolean"
  - name: "createdOn"
    type: "Date"
  - name: "updatedOn"
    type: "Date"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "AccountLifecycleEvent"
  description: "Audit trail of user lifecycle changes such as activation, suspension,\
    \ or deletion."
  data:
  - name: "eventType"
    type: "AccountLifecycleEventType"
  - name: "reason"
    type: "String"
  - name: "occurredOn"
    type: "Date"
  - name: "performedBy"
    type: "String"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Invitation"
  description: "Invitation workflow for onboarding a prospective user into an organization."
  data:
  - name: "email"
    type: "String"
  - name: "invitedOn"
    type: "Date"
  - name: "expiresOn"
    type: "Date"
  - name: "acceptedOn"
    type: "Date"
  - name: "status"
    type: "InvitationStatus"
  - name: "inviteToken"
    type: "Token"
  relations:
  - name: "invitedBy"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "Organization"
  description: "Administrative boundary that owns users, groups, and applicable policies."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "domain"
    type: "String"
  - name: "organizationType"
    type: "OrganizationType"
  - name: "country"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "users"
    type: "User"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "Group"
    multiplicity: "OneToMany"
  - name: "passwordPolicies"
    type: "PasswordPolicy"
    multiplicity: "OneToMany"
enums:
- name: "UserStatus"
  description: "Lifecycle and access state of a user account."
  data:
  - name: "Active"
  - name: "Invited"
  - name: "PendingActivation"
  - name: "Suspended"
  - name: "Locked"
  - name: "Deactivated"
  - name: "Deleted"
- name: "UserType"
  description: "Classification of user identity."
  data:
  - name: "Person"
  - name: "ServiceAccount"
- name: "ContactMethodType"
  description: "Types of reachable channels for a user."
  data:
  - name: "Email"
  - name: "Mobile"
  - name: "Landline"
- name: "VerificationStatus"
  description: "Current verification state of a contact method."
  data:
  - name: "Unverified"
  - name: "Pending"
  - name: "Verified"
- name: "CredentialType"
  description: "Supported authenticator categories."
  data:
  - name: "Password"
  - name: "WebAuthn"
  - name: "Totp"
  - name: "OAuthLink"
  - name: "RecoveryCode"
- name: "AuthMethod"
  description: "Authentication mechanism used during sign-in."
  data:
  - name: "Password"
  - name: "WebAuthn"
  - name: "SSO"
  - name: "MagicLink"
  - name: "RecoveryCode"
- name: "SignInOutcome"
  description: "Result of a sign-in attempt."
  data:
  - name: "Success"
  - name: "Failure"
  - name: "LockedOut"
  - name: "ChallengeRequired"
- name: "GroupType"
  description: "Nature and origin of a group."
  data:
  - name: "Standard"
  - name: "Dynamic"
  - name: "External"
- name: "IdentityProviderType"
  description: "External identity systems that can be linked to a user."
  data:
  - name: "Google"
  - name: "Microsoft"
  - name: "Apple"
  - name: "Github"
  - name: "Okta"
  - name: "CustomOIDC"
  - name: "SAML"
- name: "ConsentType"
  description: "Purposes for which user consent may be captured."
  data:
  - name: "TermsOfService"
  - name: "PrivacyPolicy"
  - name: "Marketing"
  - name: "DataSharing"
- name: "PasswordResetStatus"
  description: "State of a password reset process."
  data:
  - name: "Initiated"
  - name: "Verified"
  - name: "Completed"
  - name: "Expired"
  - name: "Cancelled"
- name: "OrganizationType"
  description: "Categorization of the organization managing users."
  data:
  - name: "Business"
  - name: "Nonprofit"
  - name: "Government"
  - name: "Education"
  - name: "Individual"
- name: "AccountLifecycleEventType"
  description: "Types of auditable user lifecycle changes."
  data:
  - name: "Created"
  - name: "Activated"
  - name: "Suspended"
  - name: "Reactivated"
  - name: "Locked"
  - name: "Unlocked"
  - name: "Deactivated"
  - name: "Deleted"
- name: "InvitationStatus"
  description: "Progress of an organization invitation."
  data:
  - name: "Sent"
  - name: "Accepted"
  - name: "Expired"
  - name: "Revoked"
  - name: "Cancelled"
valueObjects:
- name: "Username"
  description: "Unique human-readable handle used for user sign-in and display."
  data:
  - name: "value"
    type: "String"
- name: "PasswordHash"
  description: "Opaque representation of a password digest including algorithm metadata."
  data:
  - name: "value"
    type: "String"
- name: "Address"
  description: "Postal address for contact or profile purposes."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "Url"
  description: "Web resource locator used for avatars, links, or callbacks."
  data:
  - name: "value"
    type: "String"
- name: "IPAddress"
  description: "Network address captured for security and auditing purposes."
  data:
  - name: "value"
    type: "String"
- name: "Token"
  description: "High-entropy opaque string used for temporary workflows such as invitations\
    \ and resets."
  data:
  - name: "value"
    type: "String"
