---
metadata:
  name: "Certificate Management"
  description: "Capabilities model for managing digital certificates, certificate\
    \ authorities, key material, enrollment workflows, revocation, validation, and\
    \ deployment across systems and environments."
  version: "1.0.0"
  industry: "Information Technology"
  category: "Identity and Security"
  type: "Capability"
  domain: "Certificate Management"
entities:
- name: "CertificateAuthority"
  description: "Entity responsible for issuing, validating, and managing X.509 certificates\
    \ within a public key infrastructure."
  data:
  - name: "name"
    type: "String"
  - name: "caType"
    type: "CAType"
  - name: "distinguishedName"
    type: "DistinguishedName"
  - name: "certificatePem"
    type: "PemEncoded"
  - name: "ocspSigningEnabled"
    type: "Boolean"
  - name: "crlDistributionUrl"
    type: "String"
  - name: "aiaIssuerUrl"
    type: "String"
  - name: "validityDefaultDays"
    type: "Integer"
  - name: "pathLengthConstraint"
    type: "Integer"
  relations:
  - name: "parent"
    type: "CertificateAuthority"
    multiplicity: "ManyToOne"
  - name: "keyPairs"
    type: "KeyPair"
    multiplicity: "OneToMany"
  - name: "certificates"
    type: "Certificate"
    multiplicity: "OneToMany"
  - name: "crls"
    type: "CertificateRevocationList"
    multiplicity: "OneToMany"
  - name: "ocspResponders"
    type: "OCSPResponder"
    multiplicity: "OneToMany"
  - name: "registrationAuthorities"
    type: "RegistrationAuthority"
    multiplicity: "OneToMany"
  - name: "profiles"
    type: "CertificateProfile"
    multiplicity: "OneToMany"
- name: "RegistrationAuthority"
  description: "Function that verifies requester identity and authorizes certificate\
    \ enrollment in coordination with the issuing authority."
  data:
  - name: "name"
    type: "String"
  - name: "contactEmail"
    type: "String"
  - name: "requiresManualApproval"
    type: "Boolean"
  - name: "allowedDomains"
    type: "String"
  relations:
  - name: "certificateAuthority"
    type: "CertificateAuthority"
    multiplicity: "ManyToOne"
  - name: "enrollmentRequests"
    type: "EnrollmentRequest"
    multiplicity: "OneToMany"
- name: "HardwareSecurityModule"
  description: "Cryptographic module that generates, stores, and protects private\
    \ keys used by certificate authorities and related services."
  data:
  - name: "vendor"
    type: "String"
  - name: "model"
    type: "String"
  - name: "moduleSerial"
    type: "String"
  - name: "hsmType"
    type: "HSMType"
  - name: "protectionLevel"
    type: "ProtectionLevel"
  - name: "location"
    type: "String"
  relations:
  - name: "keyPairs"
    type: "KeyPair"
    multiplicity: "OneToMany"
- name: "KeyPair"
  description: "Asymmetric key material consisting of a private and public key used\
    \ to sign, decrypt, or authenticate within the PKI."
  data:
  - name: "label"
    type: "String"
  - name: "keyAlgorithm"
    type: "KeyAlgorithm"
  - name: "keyGenerationParameters"
    type: "KeyGenerationParameters"
  - name: "status"
    type: "KeyPairStatus"
  - name: "createdOn"
    type: "Date"
  - name: "publicKeyPem"
    type: "PemEncoded"
  relations:
  - name: "certificateAuthority"
    type: "CertificateAuthority"
    multiplicity: "ManyToOne"
  - name: "hsm"
    type: "HardwareSecurityModule"
    multiplicity: "ManyToOne"
  - name: "certificates"
    type: "Certificate"
    multiplicity: "OneToMany"
  - name: "keyArchive"
    type: "KeyArchive"
    multiplicity: "ManyToOne"
- name: "KeyArchive"
  description: "Secure repository for archiving encrypted private keys to support\
    \ recovery and continuity requirements."
  data:
  - name: "name"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  - name: "encryptionMethod"
    type: "String"
  - name: "storageLocation"
    type: "String"
  relations:
  - name: "keyPairs"
    type: "KeyPair"
    multiplicity: "OneToMany"
- name: "CertificateProfile"
  description: "Template defining issuance constraints, cryptographic defaults, and\
    \ subject requirements for a category of certificates."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "signatureAlgorithm"
    type: "SignatureAlgorithm"
  - name: "validityDays"
    type: "Integer"
  - name: "keyUsageOptions"
    type: "KeyUsageOptions"
  - name: "extendedKeyUsage"
    type: "ExtendedKeyUsageSet"
  - name: "allowWildcard"
    type: "Boolean"
  - name: "subjectConstraints"
    type: "SubjectConstraints"
  relations:
  - name: "certificateAuthority"
    type: "CertificateAuthority"
    multiplicity: "ManyToOne"
  - name: "policies"
    type: "CertificatePolicy"
    multiplicity: "ManyToMany"
  - name: "certificates"
    type: "Certificate"
    multiplicity: "OneToMany"
- name: "CertificatePolicy"
  description: "Policy descriptor with OID and CPS reference used to express legal\
    \ and procedural rules for certificate issuance and use."
  data:
  - name: "name"
    type: "String"
  - name: "policyOid"
    type: "String"
  - name: "cpsUri"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "profiles"
    type: "CertificateProfile"
    multiplicity: "ManyToMany"
- name: "CertificateSigningRequest"
  description: "Request message containing a public key and subject information to\
    \ be reviewed and signed by a certificate authority."
  data:
  - name: "format"
    type: "CSRFormat"
  - name: "subject"
    type: "DistinguishedName"
  - name: "subjectAlternativeNames"
    type: "SubjectAlternativeNameSet"
  - name: "csrPem"
    type: "PemEncoded"
  - name: "createdOn"
    type: "Date"
  relations:
  - name: "keyPair"
    type: "KeyPair"
    multiplicity: "ManyToOne"
  - name: "enrollmentRequest"
    type: "EnrollmentRequest"
    multiplicity: "ManyToOne"
- name: "EnrollmentRequest"
  description: "Workflow record capturing the end-to-end lifecycle of a certificate\
    \ issuance request, including validation and approval."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "status"
    type: "EnrollmentStatus"
  - name: "requestedValidityDays"
    type: "Integer"
  - name: "requester"
    type: "String"
  - name: "comments"
    type: "String"
  - name: "createdOn"
    type: "Date"
  relations:
  - name: "registrationAuthority"
    type: "RegistrationAuthority"
    multiplicity: "ManyToOne"
  - name: "certificateProfile"
    type: "CertificateProfile"
    multiplicity: "ManyToOne"
  - name: "csr"
    type: "CertificateSigningRequest"
    multiplicity: "OneToOne"
  - name: "issuedCertificate"
    type: "Certificate"
    multiplicity: "OneToOne"
  - name: "domainValidationChallenges"
    type: "DomainValidationChallenge"
    multiplicity: "OneToMany"
- name: "DomainValidationChallenge"
  description: "Authorization challenge used to validate control of a domain or endpoint\
    \ prior to certificate issuance."
  data:
  - name: "domainName"
    type: "String"
  - name: "challengeType"
    type: "ChallengeType"
  - name: "token"
    type: "String"
  - name: "status"
    type: "DomainValidationStatus"
  - name: "validatedAt"
    type: "Date"
  relations:
  - name: "enrollmentRequest"
    type: "EnrollmentRequest"
    multiplicity: "ManyToOne"
- name: "Certificate"
  description: "X.509 certificate issued by a certificate authority, containing subject\
    \ identity, validity, and cryptographic assertions."
  data:
  - name: "serialNumber"
    type: "String"
  - name: "status"
    type: "CertificateStatus"
  - name: "subject"
    type: "DistinguishedName"
  - name: "issuer"
    type: "DistinguishedName"
  - name: "notBefore"
    type: "Date"
  - name: "notAfter"
    type: "Date"
  - name: "fingerprint"
    type: "KeyFingerprint"
  - name: "keyAlgorithm"
    type: "KeyAlgorithm"
  - name: "signatureAlgorithm"
    type: "SignatureAlgorithm"
  - name: "certificatePem"
    type: "PemEncoded"
  relations:
  - name: "certificateAuthority"
    type: "CertificateAuthority"
    multiplicity: "ManyToOne"
  - name: "certificateProfile"
    type: "CertificateProfile"
    multiplicity: "ManyToOne"
  - name: "keyPair"
    type: "KeyPair"
    multiplicity: "ManyToOne"
  - name: "csr"
    type: "CertificateSigningRequest"
    multiplicity: "ManyToOne"
  - name: "revocation"
    type: "CertificateRevocation"
    multiplicity: "OneToOne"
  - name: "bindings"
    type: "CertificateBinding"
    multiplicity: "OneToMany"
  - name: "trustStores"
    type: "TrustStore"
    multiplicity: "ManyToMany"
- name: "CertificateRevocation"
  description: "Record of a certificate being revoked, including reason and effective\
    \ dates, published via CRL and OCSP."
  data:
  - name: "revocationDate"
    type: "Date"
  - name: "reason"
    type: "RevocationReason"
  - name: "invalidityDate"
    type: "Date"
  relations:
  - name: "certificate"
    type: "Certificate"
    multiplicity: "ManyToOne"
  - name: "crl"
    type: "CertificateRevocationList"
    multiplicity: "ManyToOne"
- name: "CertificateRevocationList"
  description: "Periodic list of revoked certificates issued by a certificate authority\
    \ and distributed for relying party validation."
  data:
  - name: "crlNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "nextUpdate"
    type: "Date"
  - name: "publishStatus"
    type: "CRLPublishStatus"
  - name: "distributionPoint"
    type: "String"
  relations:
  - name: "certificateAuthority"
    type: "CertificateAuthority"
    multiplicity: "ManyToOne"
  - name: "revocations"
    type: "CertificateRevocation"
    multiplicity: "OneToMany"
- name: "OCSPResponder"
  description: "Online service that provides real-time certificate status information\
    \ on behalf of a certificate authority."
  data:
  - name: "name"
    type: "String"
  - name: "endpointUrl"
    type: "String"
  - name: "status"
    type: "OCSPResponderStatus"
  - name: "signingCertificateStaplingEnabled"
    type: "Boolean"
  relations:
  - name: "certificateAuthority"
    type: "CertificateAuthority"
    multiplicity: "ManyToOne"
  - name: "signingKeyPair"
    type: "KeyPair"
    multiplicity: "ManyToOne"
- name: "TrustStore"
  description: "Managed collection of trusted certificates used to validate peer identities\
    \ and certificate chains."
  data:
  - name: "name"
    type: "String"
  - name: "scope"
    type: "TrustStoreScope"
  - name: "description"
    type: "String"
  - name: "managedBy"
    type: "String"
  relations:
  - name: "certificates"
    type: "Certificate"
    multiplicity: "ManyToMany"
  - name: "certificateAuthorities"
    type: "CertificateAuthority"
    multiplicity: "ManyToMany"
- name: "Endpoint"
  description: "Networked system or service where certificates are deployed to enable\
    \ TLS or mutual authentication."
  data:
  - name: "name"
    type: "String"
  - name: "type"
    type: "EndpointType"
  - name: "hostname"
    type: "String"
  - name: "port"
    type: "Integer"
  - name: "environment"
    type: "String"
  relations:
  - name: "certificateBindings"
    type: "CertificateBinding"
    multiplicity: "OneToMany"
- name: "CertificateBinding"
  description: "Association of a certificate with a specific endpoint, including deployment\
    \ and rotation characteristics."
  data:
  - name: "bindingName"
    type: "String"
  - name: "status"
    type: "BindingStatus"
  - name: "installedOn"
    type: "Date"
  - name: "rotationWindowDays"
    type: "Integer"
  - name: "autoRenew"
    type: "Boolean"
  relations:
  - name: "certificate"
    type: "Certificate"
    multiplicity: "ManyToOne"
  - name: "endpoint"
    type: "Endpoint"
    multiplicity: "ManyToOne"
  - name: "trustStore"
    type: "TrustStore"
    multiplicity: "ManyToOne"
enums:
- name: "CAType"
  description: "Classification of a certificate authority within a hierarchical PKI."
  data:
  - name: "Root"
  - name: "Intermediate"
- name: "KeyAlgorithm"
  description: "Supported asymmetric key algorithms for certificate and key pair generation."
  data:
  - name: "RSA"
  - name: "ECDSA"
  - name: "Ed25519"
- name: "KeyPairStatus"
  description: "Lifecycle state of a key pair, reflecting usability and security posture."
  data:
  - name: "Active"
  - name: "Retired"
  - name: "Compromised"
  - name: "Destroyed"
  - name: "Archived"
- name: "SignatureAlgorithm"
  description: "Algorithms used to sign certificates and certificate-related artifacts."
  data:
  - name: "SHA256WithRSA"
  - name: "SHA384WithRSA"
  - name: "SHA512WithRSA"
  - name: "ECDSAWithSHA256"
  - name: "ECDSAWithSHA384"
  - name: "ECDSAWithSHA512"
  - name: "Ed25519"
- name: "EnrollmentStatus"
  description: "Progress of a certificate enrollment request from submission through\
    \ issuance."
  data:
  - name: "Submitted"
  - name: "PendingValidation"
  - name: "Approved"
  - name: "Rejected"
  - name: "Issued"
  - name: "Failed"
  - name: "Cancelled"
- name: "CSRFormat"
  description: "Encapsulation formats supported for certificate signing requests."
  data:
  - name: "PKCS10"
  - name: "CMC"
  - name: "SPKAC"
- name: "CertificateStatus"
  description: "Operational status of a certificate for relying parties and deployments."
  data:
  - name: "Pending"
  - name: "Issued"
  - name: "Revoked"
  - name: "Expired"
  - name: "Suspended"
- name: "RevocationReason"
  description: "Enumerated reasons recorded when a certificate is revoked."
  data:
  - name: "Unspecified"
  - name: "KeyCompromise"
  - name: "CACompromise"
  - name: "AffiliationChanged"
  - name: "Superseded"
  - name: "CessationOfOperation"
  - name: "CertificateHold"
  - name: "PrivilegeWithdrawn"
- name: "HSMType"
  description: "Deployment form factor of the hardware security module."
  data:
  - name: "NetworkHSM"
  - name: "PCIeHSM"
  - name: "VirtualHSM"
  - name: "CloudKMS"
- name: "ProtectionLevel"
  description: "Security certification level associated with cryptographic module\
    \ assurance."
  data:
  - name: "FIPSLevel1"
  - name: "FIPSLevel2"
  - name: "FIPSLevel3"
  - name: "FIPSLevel4"
- name: "EndpointType"
  description: "Categories of systems on which certificates are deployed."
  data:
  - name: "WebServer"
  - name: "LoadBalancer"
  - name: "APIGateway"
  - name: "MessageBroker"
  - name: "Database"
  - name: "KubernetesIngress"
- name: "BindingStatus"
  description: "State of a certificate deployment on an endpoint."
  data:
  - name: "Pending"
  - name: "Active"
  - name: "Retired"
  - name: "Failed"
- name: "TrustStoreScope"
  description: "Administrative boundary within which a trust store is authoritative."
  data:
  - name: "System"
  - name: "Application"
  - name: "Environment"
  - name: "Tenant"
- name: "ChallengeType"
  description: "Mechanisms used to validate domain or endpoint control during enrollment."
  data:
  - name: "DNS01"
  - name: "HTTP01"
  - name: "TLSALPN01"
  - name: "Email"
- name: "DomainValidationStatus"
  description: "Status of a domain control validation challenge."
  data:
  - name: "Pending"
  - name: "Validated"
  - name: "Failed"
  - name: "Expired"
- name: "OCSPResponderStatus"
  description: "Health status of an OCSP responder service."
  data:
  - name: "Online"
  - name: "Degraded"
  - name: "Offline"
- name: "CRLPublishStatus"
  description: "Publication state of a certificate revocation list."
  data:
  - name: "Pending"
  - name: "Published"
  - name: "Failed"
valueObjects:
- name: "DistinguishedName"
  description: "Structured identification of a certificate subject or issuer."
  data:
  - name: "commonName"
    type: "String"
  - name: "organization"
    type: "String"
  - name: "organizationalUnit"
    type: "String"
  - name: "country"
    type: "String"
  - name: "state"
    type: "String"
  - name: "locality"
    type: "String"
- name: "SubjectAlternativeNameSet"
  description: "Alternative identifiers bound to a certificate subject."
  data:
  - name: "dnsNames"
    type: "String"
  - name: "ipAddresses"
    type: "String"
  - name: "emailAddresses"
    type: "String"
  - name: "uris"
    type: "String"
- name: "PemEncoded"
  description: "Base64-encoded and armored representation of cryptographic material."
  data:
  - name: "value"
    type: "String"
- name: "KeyFingerprint"
  description: "Hash-based digest uniquely identifying key or certificate material."
  data:
  - name: "algorithm"
    type: "String"
  - name: "value"
    type: "String"
- name: "KeyGenerationParameters"
  description: "Parameters guiding asymmetric key generation."
  data:
  - name: "keySize"
    type: "Integer"
  - name: "curveName"
    type: "String"
- name: "KeyUsageOptions"
  description: "Boolean capabilities indicating permitted key usages."
  data:
  - name: "digitalSignature"
    type: "Boolean"
  - name: "keyEncipherment"
    type: "Boolean"
  - name: "dataEncipherment"
    type: "Boolean"
  - name: "keyAgreement"
    type: "Boolean"
  - name: "keyCertSign"
    type: "Boolean"
  - name: "crlSign"
    type: "Boolean"
  - name: "contentCommitment"
    type: "Boolean"
  - name: "encipherOnly"
    type: "Boolean"
  - name: "decipherOnly"
    type: "Boolean"
- name: "ExtendedKeyUsageSet"
  description: "Extended application purposes permitted for the certificate."
  data:
  - name: "serverAuth"
    type: "Boolean"
  - name: "clientAuth"
    type: "Boolean"
  - name: "codeSigning"
    type: "Boolean"
  - name: "emailProtection"
    type: "Boolean"
  - name: "timeStamping"
    type: "Boolean"
  - name: "ocspSigning"
    type: "Boolean"
- name: "SubjectConstraints"
  description: "Requirements and formatting rules for subject fields in issued certificates."
  data:
  - name: "requireCommonName"
    type: "Boolean"
  - name: "requireOrganization"
    type: "Boolean"
  - name: "requireCountry"
    type: "Boolean"
  - name: "allowedCountries"
    type: "String"
  - name: "commonNameMaxLength"
    type: "Integer"
