---
metadata:
  name: "Identity Federation Capabilities Model"
  description: "A capabilities model that describes entities, relationships, and data\
    \ structures used to establish and operate identity federation across autonomous\
    \ organizations using protocols such as SAML and OpenID Connect."
  version: "1.0.0"
  industry: "Information Technology"
  category: "Identity and Security"
  type: "Capability"
  domain: "Identity Federation"
entities:
- name: "Federation"
  description: "Governance construct that defines the trust community, policies, and\
    \ metadata practices enabling cross-organization identity exchange."
  data:
  - name: "name"
    type: "String"
  - name: "federationType"
    type: "FederationType"
  - name: "status"
    type: "FederationStatus"
  - name: "trustFramework"
    type: "TrustFramework"
  relations:
  - name: "operator_"
    type: "FederationOperator"
    multiplicity: "ManyToOne"
  - name: "members"
    type: "FederationMember"
    multiplicity: "OneToMany"
  - name: "trustAnchors"
    type: "TrustAnchor"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "FederationPolicy"
    multiplicity: "OneToMany"
  - name: "metadataAggregates"
    type: "MetadataAggregate"
    multiplicity: "OneToMany"
- name: "FederationOperator"
  description: "Organization or team responsible for running federation governance,\
    \ onboarding, metadata services, and compliance."
  data:
  - name: "name"
    type: "String"
  - name: "contactEmail"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "federations"
    type: "Federation"
    multiplicity: "OneToMany"
- name: "FederationMember"
  description: "Legal or organizational participant in the federation operating one\
    \ or more identity or service providers."
  data:
  - name: "displayName"
    type: "String"
  - name: "homeDomain"
    type: "String"
  - name: "memberType"
    type: "MemberType"
  - name: "status"
    type: "MembershipStatus"
  relations:
  - name: "federation"
    type: "Federation"
    multiplicity: "ManyToOne"
  - name: "identityProviders"
    type: "IdentityProvider"
    multiplicity: "OneToMany"
  - name: "serviceProviders"
    type: "SvcProvider"
    multiplicity: "OneToMany"
  - name: "legalAgreements"
    type: "TrustAgreement"
    multiplicity: "OneToMany"
  - name: "assuranceProfiles"
    type: "AssuranceProfile"
    multiplicity: "ManyToMany"
- name: "IdentityProvider"
  description: "Authentication authority that issues assertions or tokens to relying\
    \ parties on behalf of authenticated subjects."
  data:
  - name: "name"
    type: "String"
  - name: "entityURI"
    type: "URI"
  - name: "protocol"
    type: "FederationProtocol"
  - name: "signingAlgorithm"
    type: "SigningAlgorithm"
  - name: "subjectIdentifier"
    type: "SubjectIdentifierType"
  - name: "discoveryEnabled"
    type: "Boolean"
  relations:
  - name: "member"
    type: "FederationMember"
    multiplicity: "ManyToOne"
  - name: "endpoints"
    type: "ProtocolEndpoint"
    multiplicity: "OneToMany"
  - name: "keys"
    type: "KeyPair"
    multiplicity: "OneToMany"
  - name: "attributeReleasePolicies"
    type: "AttributeReleasePolicy"
    multiplicity: "OneToMany"
  - name: "claimMappings"
    type: "ClaimMapping"
    multiplicity: "OneToMany"
  - name: "metadataDocuments"
    type: "MetadataDocument"
    multiplicity: "OneToMany"
  - name: "entityCategories"
    type: "EntityCategory"
    multiplicity: "ManyToMany"
- name: "SvcProvider"
  description: "Relying party that consumes assertions or tokens from identity providers\
    \ to grant access to protected services."
  data:
  - name: "name"
    type: "String"
  - name: "entityURI"
    type: "URI"
  - name: "protocol"
    type: "FederationProtocol"
  - name: "requestedSubjectIdentifier"
    type: "SubjectIdentifierType"
  - name: "encryptionRequired"
    type: "Boolean"
  relations:
  - name: "member"
    type: "FederationMember"
    multiplicity: "ManyToOne"
  - name: "endpoints"
    type: "ProtocolEndpoint"
    multiplicity: "OneToMany"
  - name: "keys"
    type: "KeyPair"
    multiplicity: "OneToMany"
  - name: "claimRequirements"
    type: "ClaimRequirement"
    multiplicity: "OneToMany"
  - name: "metadataDocuments"
    type: "MetadataDocument"
    multiplicity: "OneToMany"
  - name: "entityCategories"
    type: "EntityCategory"
    multiplicity: "ManyToMany"
- name: "ProtocolEndpoint"
  description: "Network endpoint implementing a specific protocol role and binding\
    \ for message exchange."
  data:
  - name: "endpointType"
    type: "EndpointType"
  - name: "binding"
    type: "BindingType"
  - name: "url"
    type: "URL"
  - name: "isDefault"
    type: "Boolean"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
  - name: "svcProvider"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
- name: "KeyPair"
  description: "Cryptographic key material and associated certificate used for signing\
    \ or encryption with lifecycle state."
  data:
  - name: "alias"
    type: "String"
  - name: "keyUse"
    type: "KeyUse"
  - name: "algorithm"
    type: "SigningAlgorithm"
  - name: "certificate"
    type: "CertificatePEM"
  - name: "notBefore"
    type: "DateTime"
  - name: "notAfter"
    type: "DateTime"
  - name: "rotationStatus"
    type: "KeyRotationStatus"
  relations:
  - name: "ownerIdP"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
  - name: "ownerSP"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
- name: "TrustAnchor"
  description: "Root certificate or key reference used to validate signatures and\
    \ metadata within the federation."
  data:
  - name: "name"
    type: "String"
  - name: "certificate"
    type: "CertificatePEM"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  relations:
  - name: "federation"
    type: "Federation"
    multiplicity: "ManyToOne"
- name: "MetadataDocument"
  description: "Published metadata describing an entity’s capabilities, endpoints,\
    \ and keys, optionally signed."
  data:
  - name: "documentType"
    type: "MetadataType"
  - name: "location"
    type: "URI"
  - name: "signatureStatus"
    type: "SignatureStatus"
  - name: "lastFetchedAt"
    type: "DateTime"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
  - name: "svcProvider"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
  - name: "signingKey"
    type: "KeyPair"
    multiplicity: "ManyToOne"
- name: "MetadataAggregate"
  description: "Signed aggregate of multiple metadata documents distributed by the\
    \ federation operator."
  data:
  - name: "name"
    type: "String"
  - name: "location"
    type: "URI"
  - name: "signatureStatus"
    type: "SignatureStatus"
  - name: "cacheDurationSeconds"
    type: "Integer"
  relations:
  - name: "federation"
    type: "Federation"
    multiplicity: "ManyToOne"
  - name: "trustAnchor"
    type: "TrustAnchor"
    multiplicity: "ManyToOne"
- name: "ClaimMapping"
  description: "Transformation rule mapping incoming attributes or claims to local\
    \ names and formats."
  data:
  - name: "sourceClaim"
    type: "String"
  - name: "targetClaim"
    type: "String"
  - name: "transformType"
    type: "ClaimTransformType"
  - name: "transformRule"
    type: "String"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
  - name: "svcProvider"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
- name: "AttributeReleasePolicy"
  description: "Policy that determines which attributes are released by an identity\
    \ provider under specified conditions."
  data:
  - name: "policyName"
    type: "String"
  - name: "defaultAction"
    type: "ReleaseAction"
  - name: "conditions"
    type: "String"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
  - name: "applicableServiceProviders"
    type: "SvcProvider"
    multiplicity: "ManyToMany"
  - name: "requiredAssurance"
    type: "AssuranceProfile"
    multiplicity: "ManyToOne"
- name: "ClaimRequirement"
  description: "Declaration by a service provider specifying required or optional\
    \ claims and their formats."
  data:
  - name: "claimName"
    type: "String"
  - name: "required"
    type: "Boolean"
  - name: "format"
    type: "ClaimFormat"
  - name: "constraint"
    type: "String"
  relations:
  - name: "svcProvider"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
- name: "FederationPolicy"
  description: "Technical policy settings applied across the federation, including\
    \ algorithm constraints and assurance minima."
  data:
  - name: "name"
    type: "String"
  - name: "minAssurance"
    type: "AssuranceLevel"
  - name: "signatureRequired"
    type: "Boolean"
  - name: "allowedAlgorithms"
    type: "String"
  relations:
  - name: "federation"
    type: "Federation"
    multiplicity: "ManyToOne"
- name: "TrustAgreement"
  description: "Legal and operational agreement defining obligations, security requirements,\
    \ and acceptable use for members."
  data:
  - name: "title"
    type: "String"
  - name: "agreementType"
    type: "AgreementType"
  - name: "effectiveDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "member"
    type: "FederationMember"
    multiplicity: "ManyToOne"
  - name: "federation"
    type: "Federation"
    multiplicity: "ManyToOne"
- name: "DiscoveryService"
  description: "End-user service that assists in selecting the appropriate identity\
    \ provider for login."
  data:
  - name: "name"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  - name: "uiUrl"
    type: "URL"
  relations:
  - name: "federation"
    type: "Federation"
    multiplicity: "ManyToOne"
  - name: "identityProviders"
    type: "IdentityProvider"
    multiplicity: "ManyToMany"
- name: "EntityCategory"
  description: "Classification label applied to entities indicating conformance to\
    \ defined behavior or service class."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "referenceURI"
    type: "URI"
  relations:
  - name: "identityProviders"
    type: "IdentityProvider"
    multiplicity: "ManyToMany"
  - name: "serviceProviders"
    type: "SvcProvider"
    multiplicity: "ManyToMany"
- name: "AssuranceProfile"
  description: "Scheme and level describing identity assurance used to qualify authentication\
    \ events and attribute quality."
  data:
  - name: "scheme"
    type: "AssuranceScheme"
  - name: "level"
    type: "AssuranceLevel"
  - name: "referenceURI"
    type: "URI"
  relations:
  - name: "members"
    type: "FederationMember"
    multiplicity: "ManyToMany"
- name: "Assertion"
  description: "Security assertion or token issued by an identity provider and consumed\
    \ by a service provider within the federation."
  data:
  - name: "tokenType"
    type: "TokenType"
  - name: "issuedAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  - name: "audience"
    type: "String"
  - name: "authenticationContext"
    type: "String"
  relations:
  - name: "issuer"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
  - name: "recipient"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
enums:
- name: "FederationType"
  description: "Topology style used to organize trust relationships among members."
  data:
  - name: "HubAndSpoke"
  - name: "Mesh"
- name: "FederationStatus"
  description: "Lifecycle state of a federation."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Suspended"
  - name: "Retired"
- name: "MemberType"
  description: "Operational role of a member within the federation."
  data:
  - name: "IdentityProvider"
  - name: "SvcProvider"
  - name: "Combined"
- name: "MembershipStatus"
  description: "Enrollment and standing of a member in the federation."
  data:
  - name: "Pending"
  - name: "Active"
  - name: "Suspended"
  - name: "Withdrawn"
- name: "FederationProtocol"
  description: "Federation protocol implemented by an entity."
  data:
  - name: "SAML2"
  - name: "OpenIDConnect"
  - name: "WSFederation"
- name: "SigningAlgorithm"
  description: "Cryptographic algorithm used for signing operations."
  data:
  - name: "RS256"
  - name: "RS512"
  - name: "PS256"
  - name: "ES256"
  - name: "ES384"
- name: "SubjectIdentifierType"
  description: "Subject identifier style conveyed to relying parties."
  data:
  - name: "Transient"
  - name: "Persistent"
  - name: "Pairwise"
  - name: "Public"
- name: "EndpointType"
  description: "Role performed by a protocol endpoint."
  data:
  - name: "SingleSignOnService"
  - name: "SingleLogoutService"
  - name: "ArtifactResolutionService"
  - name: "AuthorizationEndpoint"
  - name: "TokenEndpoint"
  - name: "UserInfoEndpoint"
  - name: "JWKSUri"
  - name: "EndSessionEndpoint"
- name: "BindingType"
  description: "Transport or message binding mechanism for protocol exchanges."
  data:
  - name: "HTTPRedirect"
  - name: "HTTPPost"
  - name: "SOAP"
  - name: "JSON"
- name: "MetadataType"
  description: "Document format used to publish entity capabilities."
  data:
  - name: "SAMLMetadata"
  - name: "OIDCDiscovery"
  - name: "JWKS"
- name: "SignatureStatus"
  description: "Result of signature validation on a document or message."
  data:
  - name: "Valid"
  - name: "Invalid"
  - name: "NotSigned"
  - name: "Unknown"
- name: "KeyUse"
  description: "Intended cryptographic operation for a key."
  data:
  - name: "Signing"
  - name: "Encryption"
- name: "KeyRotationStatus"
  description: "Lifecycle state indicating current use for a key."
  data:
  - name: "Current"
  - name: "Deprecated"
  - name: "Retired"
  - name: "Compromised"
- name: "ClaimTransformType"
  description: "Method used to transform or derive a claim value."
  data:
  - name: "PassThrough"
  - name: "Map"
  - name: "Default"
  - name: "RegexReplace"
  - name: "Script"
- name: "ReleaseAction"
  description: "Default policy action for releasing attributes."
  data:
  - name: "Permit"
  - name: "Deny"
- name: "ClaimFormat"
  description: "Expected data type or syntax for a claim."
  data:
  - name: "String"
  - name: "Email"
  - name: "URI"
  - name: "DateTime"
  - name: "Integer"
  - name: "Boolean"
- name: "AgreementType"
  description: "Type of agreement used to formalize federation participation."
  data:
  - name: "Participation"
  - name: "DataProtection"
  - name: "Security"
  - name: "Interfederation"
- name: "TokenType"
  description: "Format of a security token conveyed in the federation."
  data:
  - name: "SAMLAssertion"
  - name: "IDToken"
  - name: "AccessToken"
- name: "AssuranceScheme"
  description: "Framework used to express identity assurance."
  data:
  - name: "eIDAS"
  - name: "NIST80063"
  - name: "ISO29115"
  - name: "Custom"
- name: "AssuranceLevel"
  description: "Strength of identity proofing or authentication required."
  data:
  - name: "Low"
  - name: "Substantial"
  - name: "High"
  - name: "AAL1"
  - name: "AAL2"
  - name: "AAL3"
- name: "TrustFramework"
  description: "High-level policy framework guiding federation operations and compliance."
  data:
  - name: "Baseline"
  - name: "ResearchAndEducation"
  - name: "Government"
  - name: "Enterprise"
  - name: "Custom"
valueObjects:
- name: "URI"
  description: "Uniform Resource Identifier representing a unique identifier or location."
  data:
  - name: "value"
    type: "String"
- name: "URL"
  description: "Network-accessible address used for HTTP-based endpoints."
  data:
  - name: "value"
    type: "String"
- name: "CertificatePEM"
  description: "X.509 certificate encoded in PEM format including header and footer\
    \ lines."
  data:
  - name: "value"
    type: "String"
- name: "Email"
  description: "Electronic mail address formatted according to common internet standards."
  data:
  - name: "value"
    type: "String"
- name: "DisplayName"
  description: "Human-readable label suitable for user interfaces and discovery services."
  data:
  - name: "value"
    type: "String"
