---
metadata:
  name: "Multi-Tenant Management HCIDL"
  description: "Capabilities model for governing tenants, isolation, entitlements,\
    \ and cross-tenant controls in identity and security platforms."
  version: "1.0.0"
  industry: "Software"
  category: "Identity and Security"
  type: "Capability"
  domain: "Multi-Tenant Management"
entities:
- name: "Tenant"
  description: "Logical boundary representing a customer or organizational space with\
    \ isolated resources, identities, and policies."
  data:
  - name: "name"
    type: "String"
  - name: "tenantCode"
    type: "String"
  - name: "status"
    type: "TenantStatus"
  - name: "tenantType"
    type: "TenantType"
  - name: "defaultLocale"
    type: "LocaleCode"
  - name: "dataResidency"
    type: "DataResidency"
  - name: "isolationLevel"
    type: "IsolationLevel"
  - name: "complianceProfile"
    type: "ComplianceFramework"
  - name: "createdDate"
    type: "Date"
  relations:
  - name: "parentTenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "childTenants"
    type: "Tenant"
    multiplicity: "OneToMany"
  - name: "domains"
    type: "TenantDomain"
    multiplicity: "OneToMany"
  - name: "environments"
    type: "TenantEnvironment"
    multiplicity: "OneToMany"
  - name: "ssoConnections"
    type: "TenantSsoConnection"
    multiplicity: "OneToMany"
  - name: "featureSettings"
    type: "TenantFeatureSetting"
    multiplicity: "OneToMany"
  - name: "entitlements"
    type: "TenantEntitlement"
    multiplicity: "OneToMany"
  - name: "dataPartitions"
    type: "DataPartition"
    multiplicity: "OneToMany"
  - name: "rateLimitPolicies"
    type: "RateLimitPolicy"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "auditLogSinks"
    type: "AuditLogSink"
    multiplicity: "OneToMany"
  - name: "networkBoundaries"
    type: "NetworkBoundary"
    multiplicity: "OneToMany"
  - name: "members"
    type: "TenantMember"
    multiplicity: "OneToMany"
  - name: "onboardingCases"
    type: "TenantOnboarding"
    multiplicity: "OneToMany"
  - name: "servicePlan"
    type: "ServicePlan"
    multiplicity: "ManyToOne"
- name: "TenantDomain"
  description: "Verified domain owned or delegated for identity and routing within\
    \ a tenant."
  data:
  - name: "domain"
    type: "EmailDomain"
  - name: "verified"
    type: "ToggleStatus"
  - name: "verificationMethod"
    type: "String"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
- name: "TenantEnvironment"
  description: "Execution context within a tenant such as production, staging, or\
    \ test with distinct policies and resources."
  data:
  - name: "name"
    type: "String"
  - name: "environmentType"
    type: "EnvironmentType"
  - name: "status"
    type: "ProvisioningStatus"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
- name: "TenantMember"
  description: "Person or service principal associated with a tenant for administrative\
    \ or application access."
  data:
  - name: "principalHandle"
    type: "PrincipalHandle"
  - name: "email"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "membershipStatus"
    type: "MemberStatus"
  - name: "joinedDate"
    type: "Date"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "roleAssignments"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
- name: "RoleDefinition"
  description: "Named collection of permissions intended for assignment to members\
    \ within tenant or environment scopes."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "scope"
    type: "RoleScope"
  relations:
  - name: "permissions"
    type: "Permission"
    multiplicity: "OneToMany"
  - name: "roleAssignments"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
- name: "Permission"
  description: "Fine-grained authorization unit representing an action on a resource."
  data:
  - name: "name"
    type: "String"
  - name: "action"
    type: "String"
  - name: "resource"
    type: "ResourceName"
  relations:
  - name: "roles"
    type: "RoleDefinition"
    multiplicity: "ManyToMany"
- name: "RoleAssignment"
  description: "Binding of a role to a member within a tenant or environment, optionally\
    \ time-limited."
  data:
  - name: "assignmentType"
    type: "AssignmentType"
  - name: "expiresOn"
    type: "Date"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "TenantEnvironment"
    multiplicity: "ManyToOne"
  - name: "role"
    type: "RoleDefinition"
    multiplicity: "ManyToOne"
  - name: "member"
    type: "TenantMember"
    multiplicity: "ManyToOne"
- name: "Feature"
  description: "Platform capability that can be enabled, disabled, or targeted per\
    \ tenant and environment."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "key"
    type: "String"
  relations:
  - name: "tenantSettings"
    type: "TenantFeatureSetting"
    multiplicity: "OneToMany"
  - name: "entitlements"
    type: "Entitlement"
    multiplicity: "OneToMany"
- name: "TenantFeatureSetting"
  description: "Effective feature toggle configuration for a tenant and optional environment."
  data:
  - name: "strategy"
    type: "FeatureToggleStrategy"
  - name: "status"
    type: "ToggleStatus"
  - name: "percentage"
    type: "Integer"
  - name: "targetingRule"
    type: "PolicyRuleExpression"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "feature"
    type: "Feature"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "TenantEnvironment"
    multiplicity: "ManyToOne"
- name: "ServicePlan"
  description: "Commercial or operational plan defining entitled capabilities and\
    \ governance defaults for tenants."
  data:
  - name: "name"
    type: "String"
  - name: "planCode"
    type: "String"
  - name: "description"
    type: "String"
  - name: "secretHandling"
    type: "SecretHandlingMode"
  relations:
  - name: "entitlements"
    type: "Entitlement"
    multiplicity: "OneToMany"
  - name: "tenants"
    type: "Tenant"
    multiplicity: "OneToMany"
- name: "Entitlement"
  description: "Quantitative or qualitative allowance attached to a plan or feature,\
    \ optionally imposing limits."
  data:
  - name: "name"
    type: "String"
  - name: "entitlementType"
    type: "EntitlementType"
  - name: "limit"
    type: "Integer"
  - name: "resource"
    type: "ResourceName"
  relations:
  - name: "servicePlan"
    type: "ServicePlan"
    multiplicity: "ManyToOne"
  - name: "tenantEntitlements"
    type: "TenantEntitlement"
    multiplicity: "OneToMany"
  - name: "feature"
    type: "Feature"
    multiplicity: "ManyToOne"
- name: "TenantEntitlement"
  description: "Effective entitlement applied to a tenant with optional environment\
    \ scoping and validity window."
  data:
  - name: "effectiveLimit"
    type: "Integer"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "entitlement"
    type: "Entitlement"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "TenantEnvironment"
    multiplicity: "ManyToOne"
- name: "DataPartition"
  description: "Storage and compute segregation artifact assigned to a tenant for\
    \ isolation and residency compliance."
  data:
  - name: "partitionKey"
    type: "String"
  - name: "storageClass"
    type: "StorageClass"
  - name: "region"
    type: "String"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "TenantEnvironment"
    multiplicity: "ManyToOne"
- name: "AccessPolicy"
  description: "Policy statement defining access conditions and effects over a resource\
    \ within tenant boundaries."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "effect"
    type: "PolicyEffect"
  - name: "condition"
    type: "PolicyRuleExpression"
  - name: "target"
    type: "ResourceName"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "TenantEnvironment"
    multiplicity: "ManyToOne"
- name: "CrossTenantAccessGrant"
  description: "Controlled allowance for access across tenant boundaries under explicit\
    \ policy and time constraints."
  data:
  - name: "grantType"
    type: "CrossTenantGrantType"
  - name: "externalTenantCode"
    type: "String"
  - name: "justification"
    type: "String"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "sourceTenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "targetTenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
- name: "TenantSsoConnection"
  description: "Identity federation configuration enabling single sign-on for a tenant."
  data:
  - name: "name"
    type: "String"
  - name: "protocol"
    type: "SSOProtocol"
  - name: "issuerUri"
    type: "URI"
  - name: "audience"
    type: "URI"
  - name: "authnMode"
    type: "AuthnMode"
  - name: "enabled"
    type: "ToggleStatus"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "environments"
    type: "TenantEnvironment"
    multiplicity: "ManyToMany"
- name: "AuditLogSink"
  description: "Destination for streaming or exporting tenant audit events for compliance\
    \ and monitoring."
  data:
  - name: "name"
    type: "String"
  - name: "sinkType"
    type: "AuditSinkType"
  - name: "destinationUri"
    type: "URI"
  - name: "status"
    type: "ToggleStatus"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "TenantEnvironment"
    multiplicity: "ManyToOne"
- name: "NetworkBoundary"
  description: "IP-based network rule defining allowed or blocked ranges for a tenant\
    \ or environment."
  data:
  - name: "ruleType"
    type: "NetworkRuleType"
  - name: "cidr"
    type: "CidrBlock"
  - name: "description"
    type: "String"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "TenantEnvironment"
    multiplicity: "ManyToOne"
- name: "RateLimitPolicy"
  description: "Throttling configuration applied to tenant traffic with defined scope\
    \ and enforcement mode."
  data:
  - name: "scope"
    type: "RateLimitScope"
  - name: "limitPerMinute"
    type: "Integer"
  - name: "burstCapacity"
    type: "Integer"
  - name: "enforcement"
    type: "EnforcementMode"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "TenantEnvironment"
    multiplicity: "ManyToOne"
- name: "TenantOnboarding"
  description: "Case tracking the provisioning workflow for establishing a new tenant."
  data:
  - name: "requestedDate"
    type: "Date"
  - name: "status"
    type: "ProvisioningStatus"
  - name: "requestedPlan"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "provisioningTasks"
    type: "ProvisioningTask"
    multiplicity: "OneToMany"
- name: "ProvisioningTask"
  description: "Atomic step within a tenant onboarding or maintenance workflow."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "ProvisioningStatus"
  - name: "runbookUrl"
    type: "URI"
  - name: "lastRunDate"
    type: "Date"
  relations:
  - name: "onboarding"
    type: "TenantOnboarding"
    multiplicity: "ManyToOne"
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
enums:
- name: "TenantStatus"
  description: "Lifecycle state of a tenant."
  data:
  - name: "PendingActivation"
  - name: "Active"
  - name: "Suspended"
  - name: "Deprovisioned"
  - name: "Archived"
- name: "TenantType"
  description: "Classification of tenant purpose and ownership."
  data:
  - name: "ExternalCustomer"
  - name: "Internal"
  - name: "Sandbox"
  - name: "Partner"
- name: "IsolationLevel"
  description: "Degree of infrastructure and data segregation granted to a tenant."
  data:
  - name: "Shared"
  - name: "Pooled"
  - name: "Dedicated"
  - name: "AirGapped"
- name: "DataResidency"
  description: "Preferred geographic location for data storage and processing."
  data:
  - name: "Global"
  - name: "US"
  - name: "EU"
  - name: "APAC"
  - name: "Custom"
- name: "EnvironmentType"
  description: "Deployment stage used to separate workloads and controls."
  data:
  - name: "Production"
  - name: "Staging"
  - name: "Test"
  - name: "Development"
- name: "ProvisioningStatus"
  description: "Status values for onboarding and operations workflow execution."
  data:
  - name: "Draft"
  - name: "Requested"
  - name: "InProgress"
  - name: "Completed"
  - name: "Failed"
  - name: "RolledBack"
- name: "RoleScope"
  description: "Administrative scope where a role is valid."
  data:
  - name: "Tenant"
  - name: "Environment"
  - name: "Global"
- name: "AssignmentType"
  description: "Origin of a role assignment."
  data:
  - name: "Direct"
  - name: "Group"
  - name: "External"
- name: "MemberStatus"
  description: "Current state of a tenant member account or binding."
  data:
  - name: "Invited"
  - name: "Active"
  - name: "Suspended"
  - name: "Removed"
- name: "FeatureToggleStrategy"
  description: "Mechanism determining how a feature is enabled for a tenant."
  data:
  - name: "Static"
  - name: "PercentageRollout"
  - name: "UserTargeting"
  - name: "TimeWindow"
- name: "EntitlementType"
  description: "Governing rule for entitlement enforcement."
  data:
  - name: "HardCap"
  - name: "SoftCap"
  - name: "Unlimited"
  - name: "FeatureAccess"
- name: "StorageClass"
  description: "Storage performance and durability profile for partitions."
  data:
  - name: "Standard"
  - name: "HighPerformance"
  - name: "Archive"
- name: "PolicyEffect"
  description: "Decision outcome when a policy matches."
  data:
  - name: "Allow"
  - name: "Deny"
- name: "CrossTenantGrantType"
  description: "Purpose and breadth of cross-tenant access."
  data:
  - name: "ViewOnly"
  - name: "SupportAccess"
  - name: "DataShare"
  - name: "DelegatedAdmin"
- name: "SSOProtocol"
  description: "Federation standard used for single sign-on."
  data:
  - name: "SAML2"
  - name: "OIDC"
- name: "AuthnMode"
  description: "Initiation flow for federated authentication."
  data:
  - name: "IdPInitiated"
  - name: "SPInitiated"
- name: "AuditSinkType"
  description: "Destination category for audit event export."
  data:
  - name: "InternalStream"
  - name: "ExternalWebhook"
  - name: "CloudStorage"
- name: "NetworkRuleType"
  description: "Policy stance for listed network ranges."
  data:
  - name: "Allowlist"
  - name: "Blocklist"
- name: "RateLimitScope"
  description: "Context to which rate limits apply."
  data:
  - name: "Tenant"
  - name: "User"
  - name: "ClientApp"
  - name: "IP"
- name: "EnforcementMode"
  description: "Operational behavior for enforcing a control."
  data:
  - name: "Enforced"
  - name: "Monitor"
  - name: "Disabled"
- name: "ToggleStatus"
  description: "Binary activation state for runtime controls."
  data:
  - name: "Enabled"
  - name: "Disabled"
- name: "ComplianceFramework"
  description: "Recognized compliance and certification standards."
  data:
  - name: "SOC2"
  - name: "ISO27001"
  - name: "HIPAA"
  - name: "GDPR"
  - name: "FedRAMP"
  - name: "PCI"
- name: "SecretHandlingMode"
  description: "Approach for managing secrets under a service plan."
  data:
  - name: "ManagedByPlatform"
  - name: "BringYourOwn"
valueObjects:
- name: "LocaleCode"
  description: "IETF BCP 47 language tag representing a locale preference."
  data:
  - name: "value"
    type: "String"
- name: "EmailDomain"
  description: "DNS domain name used for email and identity routing."
  data:
  - name: "value"
    type: "String"
- name: "ResourceName"
  description: "Canonical identifier of a protected resource or collection."
  data:
  - name: "value"
    type: "String"
- name: "PolicyRuleExpression"
  description: "Conditional expression evaluated by the policy engine."
  data:
  - name: "value"
    type: "String"
- name: "CidrBlock"
  description: "Classless Inter-Domain Routing notation for an IP range."
  data:
  - name: "value"
    type: "String"
- name: "URI"
  description: "Uniform Resource Identifier string for endpoints and resources."
  data:
  - name: "value"
    type: "String"
- name: "PrincipalHandle"
  description: "External or platform-unique reference to a user or service principal."
  data:
  - name: "value"
    type: "String"
