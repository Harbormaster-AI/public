---
metadata:
  name: "Single Sign-On Capabilities Model"
  description: "Canonical HCIDL capabilities model for Single Sign-On across SAML\
    \ and OpenID Connect, covering providers, relying parties, configuration, mappings,\
    \ sessions, tokens, and federation metadata."
  version: "1.0.0"
  industry: "Software"
  category: "Identity and Security"
  type: "Capability"
  domain: "Single Sign-On"
entities:
- name: "OrganizationTenant"
  description: "Logical organization or tenant that owns applications and user principals\
    \ and trusts one or more identity providers for SSO."
  data:
  - name: "name"
    type: "String"
  - name: "primaryDomain"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "serviceProviders"
    type: "SvcProvider"
    multiplicity: "OneToMany"
  - name: "principals"
    type: "Principal"
    multiplicity: "OneToMany"
  - name: "ssoConfigurations"
    type: "SSOConfiguration"
    multiplicity: "OneToMany"
  - name: "trustedIdentityProviders"
    type: "IdentityProvider"
    multiplicity: "ManyToMany"
  - name: "domainClaims"
    type: "DomainClaim"
    multiplicity: "OneToMany"
- name: "IdentityProvider"
  description: "Upstream identity system that authenticates end users and issues assertions\
    \ or tokens for SSO."
  data:
  - name: "name"
    type: "String"
  - name: "protocol"
    type: "ProtocolType"
  - name: "issuer"
    type: "String"
  - name: "discoveryEndpoint"
    type: "URL"
  - name: "signatureAlgorithm"
    type: "SignatureAlgorithm"
  - name: "logoutMethod"
    type: "LogoutMethod"
  - name: "assertionEncryption"
    type: "AssertionEncryption"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "samlSettings"
    type: "SAMLIdentityProvider"
    multiplicity: "OneToOne"
  - name: "oidcSettings"
    type: "OIDCProvider"
    multiplicity: "OneToOne"
  - name: "signingCertificates"
    type: "SigningCertificate"
    multiplicity: "OneToMany"
  - name: "organizations"
    type: "OrganizationTenant"
    multiplicity: "ManyToMany"
  - name: "federationMetadata"
    type: "FederationMetadata"
    multiplicity: "OneToMany"
  - name: "externalSubjects"
    type: "ExternalSubject"
    multiplicity: "OneToMany"
  - name: "tokens"
    type: "Token"
    multiplicity: "OneToMany"
- name: "SAMLIdentityProvider"
  description: "SAML-specific configuration for an identity provider."
  data:
  - name: "issuer"
    type: "String"
  - name: "singleSignOnService"
    type: "URL"
  - name: "singleLogoutService"
    type: "URL"
  - name: "defaultBinding"
    type: "BindingType"
  - name: "nameIdFormat"
    type: "NameIDFormat"
  - name: "signatureAlgorithm"
    type: "SignatureAlgorithm"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
  - name: "signingCertificates"
    type: "SigningCertificate"
    multiplicity: "OneToMany"
- name: "OIDCProvider"
  description: "OpenID Connect provider endpoints and cryptographic settings."
  data:
  - name: "issuer"
    type: "String"
  - name: "authorizationEndpoint"
    type: "URL"
  - name: "tokenEndpoint"
    type: "URL"
  - name: "jwksEndpoint"
    type: "URL"
  - name: "userinfoEndpoint"
    type: "URL"
  - name: "revocationEndpoint"
    type: "URL"
  - name: "defaultResponseType"
    type: "ResponseType"
  - name: "signatureAlgorithm"
    type: "SignatureAlgorithm"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
  - name: "signingKeys"
    type: "JwkKey"
    multiplicity: "OneToMany"
- name: "SvcProvider"
  description: "Application or service relying on an identity provider for Single\
    \ Sign-On."
  data:
  - name: "name"
    type: "String"
  - name: "homepage"
    type: "URL"
  - name: "defaultCallback"
    type: "URL"
  - name: "clientType"
    type: "ClientType"
  relations:
  - name: "organization"
    type: "OrganizationTenant"
    multiplicity: "ManyToOne"
  - name: "oidcClients"
    type: "OIDCClient"
    multiplicity: "OneToMany"
  - name: "samlServiceProviders"
    type: "SAMLServiceProvider"
    multiplicity: "OneToMany"
  - name: "ssoConfigurations"
    type: "SSOConfiguration"
    multiplicity: "OneToMany"
  - name: "federationMetadata"
    type: "FederationMetadata"
    multiplicity: "OneToMany"
  - name: "serviceProviderCertificates"
    type: "ServiceProviderCertificate"
    multiplicity: "OneToMany"
- name: "OIDCClient"
  description: "Relying party configuration for OpenID Connect."
  data:
  - name: "clientKey"
    type: "String"
  - name: "grantType"
    type: "GrantType"
  - name: "responseType"
    type: "ResponseType"
  - name: "tokenEndpointAuthMethod"
    type: "String"
  - name: "requirePkce"
    type: "Boolean"
  relations:
  - name: "svcProvider"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
  - name: "redirectUris"
    type: "RedirectUri"
    multiplicity: "OneToMany"
  - name: "postLogoutRedirectUris"
    type: "PostLogoutRedirectUri"
    multiplicity: "OneToMany"
  - name: "consentGrants"
    type: "ConsentGrant"
    multiplicity: "OneToMany"
- name: "RedirectUri"
  description: "Approved redirect location for an OpenID Connect client."
  data:
  - name: "uri"
    type: "URL"
  - name: "description"
    type: "String"
  relations:
  - name: "oidcClient"
    type: "OIDCClient"
    multiplicity: "ManyToOne"
- name: "PostLogoutRedirectUri"
  description: "Approved post-logout redirection location for an OpenID Connect client."
  data:
  - name: "uri"
    type: "URL"
  - name: "description"
    type: "String"
  relations:
  - name: "oidcClient"
    type: "OIDCClient"
    multiplicity: "ManyToOne"
- name: "SAMLServiceProvider"
  description: "SAML-specific configuration for a relying service."
  data:
  - name: "entityUri"
    type: "String"
  - name: "defaultAcsUrl"
    type: "URL"
  - name: "acsBinding"
    type: "BindingType"
  - name: "wantAssertionsSigned"
    type: "Boolean"
  - name: "wantResponsesSigned"
    type: "Boolean"
  - name: "nameIdFormat"
    type: "NameIDFormat"
  relations:
  - name: "svcProvider"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
  - name: "assertionConsumerServices"
    type: "AssertionConsumerService"
    multiplicity: "OneToMany"
  - name: "certificates"
    type: "ServiceProviderCertificate"
    multiplicity: "OneToMany"
- name: "AssertionConsumerService"
  description: "Endpoint at the service provider that receives SAML assertions."
  data:
  - name: "location"
    type: "URL"
  - name: "binding"
    type: "BindingType"
  - name: "index"
    type: "Integer"
  - name: "isDefault"
    type: "Boolean"
  relations:
  - name: "samlServiceProvider"
    type: "SAMLServiceProvider"
    multiplicity: "ManyToOne"
- name: "SigningCertificate"
  description: "X.509 certificate used by an identity provider for signing or encryption."
  data:
  - name: "certificate"
    type: "X509Certificate"
  - name: "use"
    type: "CertificateUse"
  - name: "notBefore"
    type: "Date"
  - name: "notAfter"
    type: "Date"
  - name: "thumbprint"
    type: "String"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
- name: "ServiceProviderCertificate"
  description: "X.509 certificate used by a service provider for signing or encryption\
    \ of SAML messages."
  data:
  - name: "certificate"
    type: "X509Certificate"
  - name: "use"
    type: "CertificateUse"
  - name: "notBefore"
    type: "Date"
  - name: "notAfter"
    type: "Date"
  - name: "thumbprint"
    type: "String"
  relations:
  - name: "samlServiceProvider"
    type: "SAMLServiceProvider"
    multiplicity: "ManyToOne"
  - name: "svcProvider"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
- name: "JwkKey"
  description: "Public key material from a JWKS document for verifying OpenID Connect\
    \ tokens."
  data:
  - name: "keyId"
    type: "String"
  - name: "keyType"
    type: "String"
  - name: "algorithm"
    type: "SignatureAlgorithm"
  - name: "publicKeyPem"
    type: "String"
  relations:
  - name: "oidcProvider"
    type: "OIDCProvider"
    multiplicity: "ManyToOne"
- name: "SSOConfiguration"
  description: "Binding between a service provider and an identity provider, including\
    \ protocol and mapping policies."
  data:
  - name: "name"
    type: "String"
  - name: "protocol"
    type: "ProtocolType"
  - name: "loginPath"
    type: "String"
  - name: "logoutMethod"
    type: "LogoutMethod"
  - name: "enabled"
    type: "Boolean"
  - name: "strictMode"
    type: "Boolean"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
  - name: "svcProvider"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
  - name: "oidcClient"
    type: "OIDCClient"
    multiplicity: "ManyToOne"
  - name: "samlServiceProvider"
    type: "SAMLServiceProvider"
    multiplicity: "ManyToOne"
  - name: "attributeMappings"
    type: "AttributeMapping"
    multiplicity: "OneToMany"
  - name: "claimMappings"
    type: "ClaimMapping"
    multiplicity: "OneToMany"
  - name: "sessionPolicy"
    type: "SessionPolicy"
    multiplicity: "ManyToOne"
  - name: "accountLinks"
    type: "AccountLink"
    multiplicity: "OneToMany"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
- name: "AttributeMapping"
  description: "Rule that maps incoming identity attributes to application-specific\
    \ attributes."
  data:
  - name: "sourceAttribute"
    type: "String"
  - name: "targetAttribute"
    type: "String"
  - name: "transformType"
    type: "AttributeTransformType"
  - name: "transformExpression"
    type: "String"
  relations:
  - name: "ssoConfiguration"
    type: "SSOConfiguration"
    multiplicity: "ManyToOne"
- name: "ClaimMapping"
  description: "Rule that maps incoming claims to application-specific claims for\
    \ authorization or personalization."
  data:
  - name: "sourceClaim"
    type: "String"
  - name: "targetClaim"
    type: "String"
  - name: "transformType"
    type: "AttributeTransformType"
  - name: "transformExpression"
    type: "String"
  relations:
  - name: "ssoConfiguration"
    type: "SSOConfiguration"
    multiplicity: "ManyToOne"
- name: "SessionPolicy"
  description: "Constraints and timeouts governing SSO session lifecycles."
  data:
  - name: "maxSessionDuration"
    type: "Duration"
  - name: "idleTimeout"
    type: "Duration"
  - name: "singleLogoutRequired"
    type: "Boolean"
  - name: "forceReauthentication"
    type: "Boolean"
  relations:
  - name: "ssoConfigurations"
    type: "SSOConfiguration"
    multiplicity: "OneToMany"
- name: "FederationMetadata"
  description: "Metadata source and publication state for SAML or OIDC federation."
  data:
  - name: "metadataUrl"
    type: "URL"
  - name: "status"
    type: "MetadataStatus"
  - name: "lastRefreshed"
    type: "Date"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
  - name: "svcProvider"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
- name: "Principal"
  description: "Local user principal within a tenant that participates in SSO."
  data:
  - name: "username"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "OrganizationTenant"
    multiplicity: "ManyToOne"
  - name: "accountLinks"
    type: "AccountLink"
    multiplicity: "OneToMany"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
  - name: "consentGrants"
    type: "ConsentGrant"
    multiplicity: "OneToMany"
- name: "ExternalSubject"
  description: "Representation of a user as asserted by an external identity provider."
  data:
  - name: "subject"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "displayName"
    type: "String"
  relations:
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
  - name: "accountLinks"
    type: "AccountLink"
    multiplicity: "OneToMany"
- name: "AccountLink"
  description: "Association between a local principal and an external subject within\
    \ a specific SSO configuration."
  data:
  - name: "status"
    type: "String"
  - name: "linkedAt"
    type: "Date"
  relations:
  - name: "principal"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "externalSubject"
    type: "ExternalSubject"
    multiplicity: "ManyToOne"
  - name: "ssoConfiguration"
    type: "SSOConfiguration"
    multiplicity: "ManyToOne"
- name: "Session"
  description: "Authenticated SSO session that tracks activity and token lifecycle."
  data:
  - name: "sessionKey"
    type: "String"
  - name: "state"
    type: "SessionState"
  - name: "createdAt"
    type: "Date"
  - name: "expiresAt"
    type: "Date"
  - name: "lastActiveAt"
    type: "Date"
  relations:
  - name: "principal"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "ssoConfiguration"
    type: "SSOConfiguration"
    multiplicity: "ManyToOne"
  - name: "tokens"
    type: "Token"
    multiplicity: "OneToMany"
- name: "Token"
  description: "Assertion or token issued during SSO used to establish or continue\
    \ a session."
  data:
  - name: "tokenType"
    type: "TokenType"
  - name: "audience"
    type: "String"
  - name: "issuedAt"
    type: "Date"
  - name: "expiresAt"
    type: "Date"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "identityProvider"
    type: "IdentityProvider"
    multiplicity: "ManyToOne"
- name: "ConsentGrant"
  description: "End-user consent record allowing a client to access specific information\
    \ or perform actions."
  data:
  - name: "scope"
    type: "String"
  - name: "status"
    type: "ConsentStatus"
  - name: "grantedAt"
    type: "Date"
  relations:
  - name: "principal"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "oidcClient"
    type: "OIDCClient"
    multiplicity: "ManyToOne"
- name: "DomainClaim"
  description: "Verification of a domain for a tenant to enable identity routing and\
    \ trust."
  data:
  - name: "domainName"
    type: "String"
  - name: "verificationMethod"
    type: "String"
  - name: "verified"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "OrganizationTenant"
    multiplicity: "ManyToOne"
enums:
- name: "ProtocolType"
  description: "Supported federation protocols used for Single Sign-On."
  data:
  - name: "SAML2"
  - name: "OpenIDConnect"
- name: "BindingType"
  description: "Transport and message binding mechanisms for SSO protocol exchanges."
  data:
  - name: "HTTPRedirect"
  - name: "HTTPPost"
  - name: "Artifact"
  - name: "FrontChannel"
  - name: "BackChannel"
- name: "SignatureAlgorithm"
  description: "Algorithms used for signing and verifying assertions and tokens."
  data:
  - name: "RS256"
  - name: "PS256"
  - name: "ES256"
  - name: "RS512"
- name: "NameIDFormat"
  description: "Subject identifier formats used in SAML assertions."
  data:
  - name: "Unspecified"
  - name: "Email"
  - name: "Transient"
  - name: "Persistent"
- name: "TokenType"
  description: "Token or assertion types used in Single Sign-On flows."
  data:
  - name: "IDToken"
  - name: "AccessToken"
  - name: "SAMLAssertion"
- name: "SessionState"
  description: "Lifecycle state of an SSO session."
  data:
  - name: "Active"
  - name: "Expired"
  - name: "Terminated"
  - name: "Revoked"
- name: "ConsentStatus"
  description: "State of a consent decision from an end user."
  data:
  - name: "Granted"
  - name: "Denied"
  - name: "Revoked"
- name: "ClientType"
  description: "Security profile of a relying party application."
  data:
  - name: "Confidential"
  - name: "Public"
- name: "GrantType"
  description: "Predominant OAuth2 flow used by an OIDC client for SSO."
  data:
  - name: "AuthorizationCode"
  - name: "Hybrid"
- name: "ResponseType"
  description: "Response mode requested by a relying party in authorization flows."
  data:
  - name: "Code"
  - name: "IdToken"
  - name: "CodeIdToken"
- name: "LogoutMethod"
  description: "Mechanism used to propagate logout across participants."
  data:
  - name: "FrontChannel"
  - name: "BackChannel"
  - name: "Global"
  - name: "RPInitiated"
- name: "AttributeTransformType"
  description: "Method used to transform inbound attributes or claims."
  data:
  - name: "None"
  - name: "Regex"
  - name: "Template"
  - name: "Script"
- name: "CertificateUse"
  description: "Intended use of an X.509 certificate in SSO exchanges."
  data:
  - name: "Signing"
  - name: "Encryption"
  - name: "TLS"
- name: "MetadataStatus"
  description: "Publication lifecycle of federation metadata."
  data:
  - name: "Draft"
  - name: "Published"
  - name: "Deprecated"
- name: "AssertionEncryption"
  description: "Requirement level for encrypting assertions."
  data:
  - name: "None"
  - name: "Optional"
  - name: "Required"
valueObjects:
- name: "URL"
  description: "Fully qualified web address including scheme and host."
  data:
  - name: "value"
    type: "String"
- name: "EmailAddress"
  description: "RFC-compliant email address."
  data:
  - name: "value"
    type: "String"
- name: "Duration"
  description: "Time duration represented as a total number of seconds."
  data:
  - name: "seconds"
    type: "Integer"
- name: "X509Certificate"
  description: "PEM-encoded X.509 certificate."
  data:
  - name: "pem"
    type: "String"
