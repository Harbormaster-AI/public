---
metadata:
  name: "Role Management HCIDL"
  description: "Canonical capabilities model describing entities, relationships, and\
    \ value semantics for enterprise role management, including role definitions,\
    \ assignments, scopes, governance, and segregation-of-duties."
  version: "1.0.0"
  industry: "Enterprise Software"
  category: "Identity and Security"
  type: "Capability"
  domain: "Role Management"
entities:
- name: "AuthorizationRealm"
  description: "Logical boundary within which roles, scopes, and governance policies\
    \ are defined and enforced."
  data:
  - name: "name"
    type: "String"
  - name: "realmType"
    type: "RealmType"
  - name: "isActive"
    type: "Boolean"
  - name: "ownerEmail"
    type: "EmailAddress"
  - name: "defaultReviewIntervalDays"
    type: "Integer"
  - name: "retentionDays"
    type: "Integer"
  relations:
  - name: "applications"
    type: "Application"
    multiplicity: "OneToMany"
  - name: "organizationUnits"
    type: "OrganizationUnit"
    multiplicity: "OneToMany"
  - name: "roleBundles"
    type: "RoleBundle"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "SegregationOfDutiesPolicy"
    multiplicity: "OneToMany"
  - name: "campaigns"
    type: "RecertificationCampaign"
    multiplicity: "OneToMany"
- name: "Application"
  description: "Software application or service whose resources are governed by roles\
    \ and permissions."
  data:
  - name: "name"
    type: "String"
  - name: "serviceName"
    type: "String"
  - name: "environment"
    type: "EnvironmentType"
  - name: "homepage"
    type: "Url"
  - name: "critical"
    type: "Boolean"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "resourceTypes"
    type: "ResourceType"
    multiplicity: "OneToMany"
  - name: "roles"
    type: "RoleDefinition"
    multiplicity: "OneToMany"
  - name: "scopes"
    type: "Scope"
    multiplicity: "OneToMany"
- name: "ResourceType"
  description: "Category of resources within an application to which permissions and\
    \ roles are applied."
  data:
  - name: "name"
    type: "String"
  - name: "defaultActionHint"
    type: "String"
  - name: "supportsInstanceScope"
    type: "Boolean"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "permissions"
    type: "Permission"
    multiplicity: "OneToMany"
- name: "Permission"
  description: "Atomic capability representing an allowed action on a resource type."
  data:
  - name: "name"
    type: "String"
  - name: "action"
    type: "String"
  - name: "sensitive"
    type: "Boolean"
  relations:
  - name: "resourceType"
    type: "ResourceType"
    multiplicity: "ManyToOne"
  - name: "roles"
    type: "RoleDefinition"
    multiplicity: "ManyToMany"
- name: "RoleDefinition"
  description: "Formal specification of a role including its permissions, level, constraints,\
    \ and lifecycle."
  data:
  - name: "roleName"
    type: "RoleName"
  - name: "roleLevel"
    type: "RoleLevel"
  - name: "isAbstract"
    type: "Boolean"
  - name: "riskLevel"
    type: "PrivilegeRisk"
  - name: "reviewFrequencyDays"
    type: "Integer"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "permissions"
    type: "Permission"
    multiplicity: "ManyToMany"
  - name: "parentRole"
    type: "RoleDefinition"
    multiplicity: "ManyToOne"
  - name: "childRoles"
    type: "RoleDefinition"
    multiplicity: "OneToMany"
  - name: "lifecyclePolicy"
    type: "RoleLifecyclePolicy"
    multiplicity: "OneToOne"
  - name: "constraints"
    type: "RoleConstraint"
    multiplicity: "OneToMany"
  - name: "versions"
    type: "RoleVersion"
    multiplicity: "OneToMany"
  - name: "bundles"
    type: "RoleBundle"
    multiplicity: "ManyToMany"
- name: "RoleVersion"
  description: "Versioned snapshot of a role’s definition, used for auditability and\
    \ change tracking."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "changeSummary"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "role"
    type: "RoleDefinition"
    multiplicity: "ManyToOne"
- name: "RoleConstraint"
  description: "Attribute-based condition that must be satisfied for the role to be\
    \ used or assigned."
  data:
  - name: "attributeName"
    type: "String"
  - name: "operator_"
    type: "ConstraintOperator"
  - name: "value"
    type: "String"
  - name: "condition"
    type: "ConditionExpression"
  relations:
  - name: "role"
    type: "RoleDefinition"
    multiplicity: "ManyToOne"
  - name: "scope"
    type: "Scope"
    multiplicity: "ManyToOne"
- name: "RoleLifecyclePolicy"
  description: "Policy that governs creation, activation, review, and retirement of\
    \ a role."
  data:
  - name: "status"
    type: "LifecycleStatus"
  - name: "autoExpireDays"
    type: "Integer"
  - name: "reviewIntervalDays"
    type: "Integer"
  relations:
  - name: "role"
    type: "RoleDefinition"
    multiplicity: "ManyToOne"
- name: "RoleBundle"
  description: "Curated package of roles intended for streamlined provisioning to\
    \ common personas."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "RoleBundlePurpose"
  - name: "isDefault"
    type: "Boolean"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "roles"
    type: "RoleDefinition"
    multiplicity: "ManyToMany"
- name: "AccessPrincipal"
  description: "Security subject that can receive roles, such as a user, group, or\
    \ service account."
  data:
  - name: "displayName"
    type: "String"
  - name: "principalType"
    type: "PrincipalType"
  - name: "email"
    type: "EmailAddress"
  - name: "originSystem"
    type: "String"
  relations:
  - name: "assignments"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
  - name: "eligibility"
    type: "RoleEligibility"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "exceptions"
    type: "SoDException"
    multiplicity: "OneToMany"
  - name: "reviews"
    type: "AssignmentReview"
    multiplicity: "OneToMany"
- name: "Scope"
  description: "Context that limits where a role applies, such as realm, application,\
    \ resource instance, or organizational unit."
  data:
  - name: "name"
    type: "String"
  - name: "scopeType"
    type: "ScopeType"
  - name: "path"
    type: "ScopePath"
  - name: "isGlobal"
    type: "Boolean"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "parentScope"
    type: "Scope"
    multiplicity: "ManyToOne"
  - name: "childScopes"
    type: "Scope"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
  - name: "eligibilities"
    type: "RoleEligibility"
    multiplicity: "OneToMany"
- name: "RoleAssignment"
  description: "Grant of a role to a principal within a scope for a defined time window."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "AssignmentStatus"
  - name: "justification"
    type: "JustificationText"
  relations:
  - name: "principal"
    type: "AccessPrincipal"
    multiplicity: "ManyToOne"
  - name: "role"
    type: "RoleDefinition"
    multiplicity: "ManyToOne"
  - name: "scope"
    type: "Scope"
    multiplicity: "ManyToOne"
  - name: "grantRequest"
    type: "GrantRequest"
    multiplicity: "ManyToOne"
  - name: "campaignReviews"
    type: "AssignmentReview"
    multiplicity: "OneToMany"
- name: "RoleEligibility"
  description: "Pre-authorized condition that allows a principal to activate a role\
    \ on demand."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "approvalRequired"
    type: "Boolean"
  - name: "status"
    type: "EligibilityStatus"
  relations:
  - name: "principal"
    type: "AccessPrincipal"
    multiplicity: "ManyToOne"
  - name: "role"
    type: "RoleDefinition"
    multiplicity: "ManyToOne"
  - name: "scope"
    type: "Scope"
    multiplicity: "ManyToOne"
- name: "GrantRequest"
  description: "Workflow request to obtain a role assignment, optionally time-bound\
    \ and subject to approval."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "requestedDurationDays"
    type: "Integer"
  - name: "status"
    type: "RequestStatus"
  - name: "justification"
    type: "JustificationText"
  - name: "submittedAt"
    type: "Date"
  relations:
  - name: "principal"
    type: "AccessPrincipal"
    multiplicity: "ManyToOne"
  - name: "role"
    type: "RoleDefinition"
    multiplicity: "ManyToOne"
  - name: "scope"
    type: "Scope"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "resultingAssignment"
    type: "RoleAssignment"
    multiplicity: "OneToOne"
- name: "Approval"
  description: "Decision record for a specific step in a role grant workflow."
  data:
  - name: "stepName"
    type: "String"
  - name: "decision"
    type: "Decision"
  - name: "decidedAt"
    type: "Date"
  - name: "approverType"
    type: "ApproverType"
  relations:
  - name: "grantRequest"
    type: "GrantRequest"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "AccessPrincipal"
    multiplicity: "ManyToOne"
- name: "RecertificationCampaign"
  description: "Periodic review event to confirm continued need for role assignments."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "CampaignStatus"
  - name: "reviewMethod"
    type: "RecertificationMethod"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "reviews"
    type: "AssignmentReview"
    multiplicity: "OneToMany"
- name: "AssignmentReview"
  description: "Line-item decision to keep or revoke a specific role assignment."
  data:
  - name: "decision"
    type: "Decision"
  - name: "decidedAt"
    type: "Date"
  - name: "comment"
    type: "String"
  relations:
  - name: "campaign"
    type: "RecertificationCampaign"
    multiplicity: "ManyToOne"
  - name: "assignment"
    type: "RoleAssignment"
    multiplicity: "ManyToOne"
  - name: "reviewer"
    type: "AccessPrincipal"
    multiplicity: "ManyToOne"
- name: "SegregationOfDutiesPolicy"
  description: "Constraint that prevents conflicting roles from being held concurrently."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "SoDPolicyType"
  - name: "isBlocking"
    type: "Boolean"
  - name: "windowDays"
    type: "Integer"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "disallowedRoles"
    type: "RoleDefinition"
    multiplicity: "ManyToMany"
  - name: "exceptions"
    type: "SoDException"
    multiplicity: "OneToMany"
- name: "SoDException"
  description: "Approved, time-bound allowance to bypass a segregation-of-duties policy\
    \ for a principal."
  data:
  - name: "justification"
    type: "JustificationText"
  - name: "expiresOn"
    type: "Date"
  relations:
  - name: "policy"
    type: "SegregationOfDutiesPolicy"
    multiplicity: "ManyToOne"
  - name: "principal"
    type: "AccessPrincipal"
    multiplicity: "ManyToOne"
  - name: "approvedBy"
    type: "AccessPrincipal"
    multiplicity: "ManyToOne"
- name: "OrganizationUnit"
  description: "Hierarchical structure within a realm used to group principals and\
    \ define default scopes."
  data:
  - name: "name"
    type: "String"
  - name: "path"
    type: "String"
  relations:
  - name: "realm"
    type: "AuthorizationRealm"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "OrganizationUnit"
    multiplicity: "OneToMany"
  - name: "defaultScopes"
    type: "Scope"
    multiplicity: "OneToMany"
enums:
- name: "RealmType"
  description: "Classification of the administrative boundary that owns roles and\
    \ policies."
  data:
  - name: "Internal"
  - name: "Customer"
  - name: "Partner"
- name: "EnvironmentType"
  description: "Deployment environment in which an application operates."
  data:
  - name: "Production"
  - name: "Staging"
  - name: "Development"
- name: "RoleLevel"
  description: "Scope at which a role is intended to operate."
  data:
  - name: "Global"
  - name: "Realm"
  - name: "Application"
  - name: "Resource"
- name: "PrivilegeRisk"
  description: "Relative risk associated with the level of access a role grants."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "PrincipalType"
  description: "Category of security subject eligible to receive roles."
  data:
  - name: "User"
  - name: "Group"
  - name: "ServiceAccount"
- name: "AssignmentStatus"
  description: "Lifecycle state of a granted role."
  data:
  - name: "Pending"
  - name: "Active"
  - name: "Expired"
  - name: "Revoked"
  - name: "Suspended"
- name: "ScopeType"
  description: "Kind of contextual boundary to which a role can be limited."
  data:
  - name: "Global"
  - name: "Realm"
  - name: "Application"
  - name: "ResourceInstance"
  - name: "OrganizationUnit"
- name: "SoDPolicyType"
  description: "Type of segregation-of-duties constraint enforced."
  data:
  - name: "MutualExclusion"
  - name: "CardinalityLimit"
  - name: "TimeSeparation"
- name: "RequestStatus"
  description: "Current stage in the role grant workflow."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Fulfilled"
  - name: "Cancelled"
- name: "Decision"
  description: "Outcome of a review or approval step."
  data:
  - name: "Approved"
  - name: "Rejected"
  - name: "Escalated"
  - name: "Delegated"
  - name: "Pending"
- name: "ApproverType"
  description: "Functional role of the actor making an approval decision."
  data:
  - name: "Manager"
  - name: "Owner"
  - name: "Security"
  - name: "Compliance"
  - name: "Administrator"
- name: "CampaignStatus"
  description: "Lifecycle phase of a recertification campaign."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
- name: "RecertificationMethod"
  description: "Approach used to attest the continued need for access."
  data:
  - name: "SelfAttestation"
  - name: "ManagerAttestation"
  - name: "OwnerAttestation"
- name: "ConstraintOperator"
  description: "Operator applied when evaluating a role constraint against attributes."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "In"
  - name: "NotIn"
  - name: "StartsWith"
  - name: "EndsWith"
  - name: "Contains"
  - name: "MatchesRegex"
  - name: "LessThan"
  - name: "GreaterThan"
- name: "LifecycleStatus"
  description: "Current standing of a role within its lifecycle."
  data:
  - name: "Proposed"
  - name: "Active"
  - name: "Deprecated"
  - name: "Retired"
- name: "RoleBundlePurpose"
  description: "Intended usage context for a curated set of roles."
  data:
  - name: "Onboarding"
  - name: "Operations"
  - name: "Compliance"
  - name: "Audit"
- name: "EligibilityStatus"
  description: "Standing of a principal’s ability to activate a role."
  data:
  - name: "Eligible"
  - name: "Suspended"
  - name: "Expired"
  - name: "Revoked"
valueObjects:
- name: "RoleName"
  description: "Normalized, human-friendly label for a role, unique within its application\
    \ or realm."
  data:
  - name: "value"
    type: "String"
- name: "EmailAddress"
  description: "Electronic mail address in RFC 5322 format used to contact an owner\
    \ or principal."
  data:
  - name: "value"
    type: "String"
- name: "Url"
  description: "Web address referencing an application home page or documentation."
  data:
  - name: "value"
    type: "String"
- name: "ScopePath"
  description: "Canonical textual representation of a scope hierarchy for constraint\
    \ and lookup."
  data:
  - name: "value"
    type: "String"
- name: "JustificationText"
  description: "Business rationale provided for requesting, granting, or excepting\
    \ access."
  data:
  - name: "value"
    type: "String"
- name: "ConditionExpression"
  description: "Expression evaluated at assignment or runtime to enforce attribute-based\
    \ constraints."
  data:
  - name: "value"
    type: "String"
