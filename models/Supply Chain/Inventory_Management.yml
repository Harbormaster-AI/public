---
metadata:
  name: "Inventory Management Industry Domain Model"
  description: "HCIDL model capturing core item, warehouse, stock, procurement, order\
    \ fulfillment, and inventory control capabilities."
  version: "1.0.0"
  industry: "Inventory Management"
  category: "Supply Chain"
  language: "English"
  type: "Industry"
  domain: "Inventory Management"
entities:
- name: "Enterprise"
  description: "Legal entity operating inventory operations across facilities."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "taxId"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "businessUnits"
    type: "BusinessUnit"
    multiplicity: "OneToMany"
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "OneToMany"
  - name: "customers"
    type: "CustomerAccount"
    multiplicity: "OneToMany"
- name: "BusinessUnit"
  description: "Operational division responsible for specific products or regions."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  relations:
  - name: "enterprise"
    type: "Enterprise"
    multiplicity: "ManyToOne"
  - name: "warehouses"
    type: "Warehouse"
    multiplicity: "OneToMany"
  - name: "catalogs"
    type: "ItemCatalog"
    multiplicity: "OneToMany"
- name: "Supplier"
  description: "External party providing goods for inventory replenishment."
  data:
  - name: "name"
    type: "String"
  - name: "supplierCode"
    type: "String"
  - name: "paymentTerms"
    type: "String"
  - name: "preferred"
    type: "Boolean"
  relations:
  - name: "enterprise"
    type: "Enterprise"
    multiplicity: "ManyToOne"
  - name: "contacts"
    type: "Contact"
    multiplicity: "OneToMany"
  - name: "items"
    type: "SupplierItem"
    multiplicity: "OneToMany"
- name: "CustomerAccount"
  description: "Downstream organization or person receiving goods through fulfillment."
  data:
  - name: "accountName"
    type: "String"
  - name: "accountNumber"
    type: "String"
  - name: "customerType"
    type: "CustomerType"
  - name: "creditLimit"
    type: "Money"
  relations:
  - name: "enterprise"
    type: "Enterprise"
    multiplicity: "ManyToOne"
  - name: "contacts"
    type: "Contact"
    multiplicity: "OneToMany"
  - name: "salesOrders"
    type: "SalesOrder"
    multiplicity: "OneToMany"
- name: "Contact"
  description: "Contact record with communication details for suppliers and customers."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
- name: "ItemCatalog"
  description: "Structured listing of items available for stocking and sale."
  data:
  - name: "name"
    type: "String"
  - name: "catalogCode"
    type: "String"
  relations:
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "categories"
    type: "ItemCategory"
    multiplicity: "OneToMany"
  - name: "items"
    type: "Item"
    multiplicity: "OneToMany"
- name: "ItemCategory"
  description: "Hierarchical grouping used for classification and reporting."
  data:
  - name: "name"
    type: "String"
  - name: "categoryCode"
    type: "String"
  - name: "abcClass"
    type: "ABCClass"
  relations:
  - name: "parent"
    type: "ItemCategory"
    multiplicity: "ManyToOne"
  - name: "catalog"
    type: "ItemCatalog"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "ItemCategory"
    multiplicity: "OneToMany"
  - name: "items"
    type: "Item"
    multiplicity: "OneToMany"
- name: "Item"
  description: "Managed product or material master defining identification and control\
    \ policies."
  data:
  - name: "sku"
    type: "SKU"
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "itemType"
    type: "ItemType"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  - name: "trackingMethod"
    type: "TrackingMethod"
  - name: "weight"
    type: "Decimal"
  - name: "weightUom"
    type: "String"
  - name: "volume"
    type: "Decimal"
  - name: "volumeUom"
    type: "String"
  - name: "shelfLifeDays"
    type: "Integer"
  - name: "hazardous"
    type: "Boolean"
  - name: "replenishmentPolicy"
    type: "ReplenishmentPolicy"
  relations:
  - name: "category"
    type: "ItemCategory"
    multiplicity: "ManyToOne"
  - name: "barcodes"
    type: "Barcode"
    multiplicity: "OneToMany"
  - name: "supplierItems"
    type: "SupplierItem"
    multiplicity: "OneToMany"
  - name: "bom"
    type: "BillOfMaterials"
    multiplicity: "OneToOne"
- name: "Barcode"
  description: "Machine-readable identifier associated to an item or packaging level."
  data:
  - name: "symbology"
    type: "BarcodeSymbology"
  - name: "value"
    type: "String"
  - name: "packagingLevel"
    type: "PackagingLevel"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "SupplierItem"
  description: "Supplier-specific definition of an item including price and lead time."
  data:
  - name: "supplierItemCode"
    type: "String"
  - name: "leadTimeDays"
    type: "Integer"
  - name: "minimumOrderQuantity"
    type: "Quantity"
  - name: "unitPrice"
    type: "Money"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "BillOfMaterials"
  description: "Structure defining component quantities required to assemble a parent\
    \ item."
  data:
  - name: "revision"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "parentItem"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "components"
    type: "BOMComponent"
    multiplicity: "OneToMany"
- name: "BOMComponent"
  description: "Component line within a bill of materials."
  data:
  - name: "quantity"
    type: "Quantity"
  - name: "scrapFactor"
    type: "Percentage"
  - name: "referenceDesignator"
    type: "String"
  relations:
  - name: "bom"
    type: "BillOfMaterials"
    multiplicity: "ManyToOne"
  - name: "componentItem"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "Warehouse"
  description: "Physical facility where inventory is stored and processed."
  data:
  - name: "name"
    type: "String"
  - name: "warehouseCode"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "timeZone"
    type: "String"
  relations:
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "zones"
    type: "Zone"
    multiplicity: "OneToMany"
  - name: "storageLocations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "inventory"
    type: "StockKeepingUnit"
    multiplicity: "OneToMany"
- name: "Zone"
  description: "Logical area within a warehouse used for storage or processing."
  data:
  - name: "name"
    type: "String"
  - name: "zoneType"
    type: "ZoneType"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
- name: "Location"
  description: "Addressable storage position such as aisle, bay, and bin."
  data:
  - name: "locationCode"
    type: "String"
  - name: "locationType"
    type: "LocationType"
  - name: "capacity"
    type: "Decimal"
  - name: "capacityUom"
    type: "String"
  - name: "temperatureControlled"
    type: "Boolean"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "zone"
    type: "Zone"
    multiplicity: "ManyToOne"
  - name: "stock"
    type: "StockKeepingUnit"
    multiplicity: "OneToMany"
- name: "StockKeepingUnit"
  description: "Inventory position representing quantity of an item at a specific\
    \ location with status and ownership."
  data:
  - name: "quantityOnHand"
    type: "Quantity"
  - name: "quantityReserved"
    type: "Quantity"
  - name: "quantityAvailable"
    type: "Quantity"
  - name: "status"
    type: "InventoryStatus"
  - name: "ownership"
    type: "Ownership"
  - name: "unitCost"
    type: "Money"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "serials"
    type: "SerialNumber"
    multiplicity: "OneToMany"
- name: "Lot"
  description: "Batch of items produced or procured under similar conditions."
  data:
  - name: "lotNumber"
    type: "String"
  - name: "manufactureDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "lotStatus"
    type: "LotStatus"
  - name: "countryOfOrigin"
    type: "String"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "SerialNumber"
  description: "Unique serialized identifier for individually tracked items."
  data:
  - name: "serial"
    type: "String"
  - name: "status"
    type: "SerialStatus"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
- name: "InventoryTransaction"
  description: "Atomic record of a change to inventory balances."
  data:
  - name: "transactionNumber"
    type: "String"
  - name: "transactionType"
    type: "InventoryTransactionType"
  - name: "quantity"
    type: "Quantity"
  - name: "transactionDate"
    type: "Date"
  - name: "reasonCode"
    type: "AdjustmentReason"
  - name: "reference"
    type: "String"
  relations:
  - name: "stockKeepingUnit"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "sourceDocument"
    type: "DocumentReference"
    multiplicity: "ManyToOne"
- name: "DocumentReference"
  description: "Polymorphic reference to an originating document for traceability."
  data:
  - name: "documentType"
    type: "DocumentType"
  - name: "documentNumber"
    type: "String"
- name: "PurchaseOrder"
  description: "Commercial document requesting goods from a supplier."
  data:
  - name: "poNumber"
    type: "String"
  - name: "status"
    type: "PurchaseOrderStatus"
  - name: "orderDate"
    type: "Date"
  - name: "expectedReceiptDate"
    type: "Date"
  - name: "currency"
    type: "String"
  - name: "totalAmount"
    type: "Money"
  - name: "incoterm"
    type: "String"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "shipToWarehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "PurchaseOrderLine"
    multiplicity: "OneToMany"
- name: "PurchaseOrderLine"
  description: "Line item detailing quantity and price for a purchased item."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "itemDescription"
    type: "String"
  - name: "orderedQuantity"
    type: "Quantity"
  - name: "unitPrice"
    type: "Money"
  - name: "lineStatus"
    type: "PurchaseOrderLineStatus"
  relations:
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "ReceivingOrder"
  description: "Operational document used to record inbound receipts against purchase\
    \ orders."
  data:
  - name: "receivingNumber"
    type: "String"
  - name: "receivedDate"
    type: "Date"
  - name: "status"
    type: "ReceivingStatus"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "ReceivingLine"
    multiplicity: "OneToMany"
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
- name: "ReceivingLine"
  description: "Line capturing quantities and lot or serial details received for an\
    \ item."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "receivedQuantity"
    type: "Quantity"
  - name: "putawayStatus"
    type: "PutawayStatus"
  - name: "condition"
    type: "Condition"
  relations:
  - name: "receivingOrder"
    type: "ReceivingOrder"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "serials"
    type: "SerialNumber"
    multiplicity: "OneToMany"
  - name: "destinationLocation"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "PutawayTask"
  description: "Directed activity to move received goods from staging to storage."
  data:
  - name: "taskNumber"
    type: "String"
  - name: "status"
    type: "TaskStatus_"
  - name: "priority"
    type: "Integer"
  - name: "createdDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "receivingLine"
    type: "ReceivingLine"
    multiplicity: "ManyToOne"
  - name: "sourceLocation"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "targetLocation"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "ReplenishmentTask"
  description: "Task to move stock from reserve to forward pick locations based on\
    \ thresholds."
  data:
  - name: "taskNumber"
    type: "String"
  - name: "status"
    type: "TaskStatus_"
  - name: "priority"
    type: "Integer"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "sourceLocation"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "targetLocation"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "SalesOrder"
  description: "Customer order requesting fulfillment of items."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "status"
    type: "SalesOrderStatus"
  - name: "orderDate"
    type: "Date"
  - name: "requestedShipDate"
    type: "Date"
  - name: "totalAmount"
    type: "Money"
  - name: "shippingAddress"
    type: "Address"
  - name: "billingAddress"
    type: "Address"
  relations:
  - name: "customer"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "SalesOrderLine"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
- name: "SalesOrderLine"
  description: "Commitment to supply a specific quantity of an item to a customer."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "orderedQuantity"
    type: "Quantity"
  - name: "allocatedQuantity"
    type: "Quantity"
  - name: "unitPrice"
    type: "Money"
  - name: "lineStatus"
    type: "SalesOrderLineStatus"
  relations:
  - name: "salesOrder"
    type: "SalesOrder"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "Allocation"
  description: "Reservation of available inventory to specific demand."
  data:
  - name: "allocatedQuantity"
    type: "Quantity"
  - name: "allocationDate"
    type: "Date"
  - name: "status"
    type: "AllocationStatus"
  relations:
  - name: "salesOrderLine"
    type: "SalesOrderLine"
    multiplicity: "ManyToOne"
  - name: "stockKeepingUnit"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
- name: "PickingWave"
  description: "Grouping of order lines for coordinated picking."
  data:
  - name: "waveNumber"
    type: "String"
  - name: "status"
    type: "WaveStatus"
  - name: "releaseDate"
    type: "Date"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "pickTasks"
    type: "PickTask"
    multiplicity: "OneToMany"
- name: "PickTask"
  description: "Instruction to retrieve a quantity from a location for an order."
  data:
  - name: "taskNumber"
    type: "String"
  - name: "status"
    type: "TaskStatus_"
  - name: "pickMethod"
    type: "PickMethod"
  - name: "quantity"
    type: "Quantity"
  relations:
  - name: "wave"
    type: "PickingWave"
    multiplicity: "ManyToOne"
  - name: "sourceLocation"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "salesOrderLine"
    type: "SalesOrderLine"
    multiplicity: "ManyToOne"
- name: "PackingUnit"
  description: "Logical container aggregating picked items for shipment."
  data:
  - name: "packingId"
    type: "String"
  - name: "packagingType"
    type: "PackagingType"
  - name: "weight"
    type: "Decimal"
  - name: "weightUom"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "PackingUnitItem"
    multiplicity: "OneToMany"
- name: "PackingUnitItem"
  description: "Quantity of a specific item contained in a packing unit."
  data:
  - name: "quantity"
    type: "Quantity"
  relations:
  - name: "packingUnit"
    type: "PackingUnit"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "Shipment"
  description: "Outbound consignment of goods to a customer or destination."
  data:
  - name: "shipmentNumber"
    type: "String"
  - name: "status"
    type: "ShipmentStatus"
  - name: "shipDate"
    type: "Date"
  - name: "carrier"
    type: "String"
  - name: "trackingNumber"
    type: "String"
  - name: "freightCost"
    type: "Money"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "salesOrder"
    type: "SalesOrder"
    multiplicity: "ManyToOne"
  - name: "packingUnits"
    type: "PackingUnit"
    multiplicity: "OneToMany"
- name: "TransferOrder"
  description: "Internal document to move inventory between facilities or locations."
  data:
  - name: "transferNumber"
    type: "String"
  - name: "status"
    type: "TransferOrderStatus"
  - name: "requestedShipDate"
    type: "Date"
  - name: "expectedReceiptDate"
    type: "Date"
  relations:
  - name: "sourceWarehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "destinationWarehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "TransferOrderLine"
    multiplicity: "OneToMany"
- name: "TransferOrderLine"
  description: "Line specifying item and quantity for internal transfer."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Quantity"
  - name: "lineStatus"
    type: "TransferOrderLineStatus"
  relations:
  - name: "transferOrder"
    type: "TransferOrder"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "CycleCountPlan"
  description: "Policy defining frequency and scope of periodic inventory verification."
  data:
  - name: "planName"
    type: "String"
  - name: "policy"
    type: "CycleCountPolicy"
  - name: "status"
    type: "CycleCountPlanStatus"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "schedules"
    type: "CycleCountSchedule"
    multiplicity: "OneToMany"
- name: "CycleCountSchedule"
  description: "Scheduled execution of counts by location, item, or ABC class."
  data:
  - name: "scheduleNumber"
    type: "String"
  - name: "countScope"
    type: "CountScope"
  - name: "scheduledDate"
    type: "Date"
  relations:
  - name: "plan"
    type: "CycleCountPlan"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "CountTask"
    multiplicity: "OneToMany"
- name: "CountTask"
  description: "Task to count inventory in a location or for an item."
  data:
  - name: "taskNumber"
    type: "String"
  - name: "status"
    type: "CountTaskStatus"
  - name: "countedQuantity"
    type: "Quantity"
  - name: "discrepancy"
    type: "Quantity"
  relations:
  - name: "schedule"
    type: "CycleCountSchedule"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "Adjustment"
  description: "Authorization record to correct inventory based on discrepancies."
  data:
  - name: "adjustmentNumber"
    type: "String"
  - name: "reason"
    type: "AdjustmentReason"
  - name: "status"
    type: "AdjustmentStatus"
  - name: "approvedBy"
    type: "String"
  - name: "approvalDate"
    type: "Date"
  relations:
  - name: "countTask"
    type: "CountTask"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "AdjustmentLine"
    multiplicity: "OneToMany"
- name: "AdjustmentLine"
  description: "Line specifying the quantity and stock context for correction."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantityChange"
    type: "Quantity"
  relations:
  - name: "adjustment"
    type: "Adjustment"
    multiplicity: "ManyToOne"
  - name: "stockKeepingUnit"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
- name: "ReturnOrder"
  description: "Document managing returns from customers back into inventory."
  data:
  - name: "returnNumber"
    type: "String"
  - name: "status"
    type: "ReturnOrderStatus"
  - name: "receivedDate"
    type: "Date"
  - name: "rmaNumber"
    type: "String"
  relations:
  - name: "customer"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "ReturnOrderLine"
    multiplicity: "OneToMany"
- name: "ReturnOrderLine"
  description: "Line detailing item condition and disposition for a return."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Quantity"
