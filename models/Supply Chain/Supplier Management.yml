---
metadata:
  name: "Supplier Management HCIDL"
  description: "Canonical capabilities model for orchestrating the full supplier lifecycle,\
    \ including onboarding, qualification, compliance, risk, performance, and commercial\
    \ governance."
  version: "1.0.0"
  industry: "Cross-Industry Procurement"
  category: "Supply Chain"
  type: "Capability"
  domain: "Supplier Management"
entities:
- name: "BuyingOrganization"
  description: "Enterprise entity that owns supplier relationships and governance\
    \ processes."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "businessUnits"
    type: "BusinessUnit"
    multiplicity: "OneToMany"
  - name: "categories"
    type: "Category"
    multiplicity: "OneToMany"
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "qualifications"
    type: "Qualification"
    multiplicity: "OneToMany"
- name: "BusinessUnit"
  description: "Operational division of the buying organization that engages and manages\
    \ suppliers for its scope."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "costCenterCode"
    type: "String"
  - name: "contactEmail"
    type: "String"
  relations:
  - name: "buyingOrganization"
    type: "BuyingOrganization"
    multiplicity: "ManyToOne"
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "ManyToMany"
  - name: "qualifications"
    type: "Qualification"
    multiplicity: "OneToMany"
- name: "Supplier"
  description: "Third-party company that provides goods or services to the buying\
    \ organization."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "taxIdentifier"
    type: "TaxIdentifier"
  - name: "registrationCountry"
    type: "String"
  - name: "status"
    type: "SupplierStatus"
  - name: "externalReference"
    type: "String"
  relations:
  - name: "businessUnits"
    type: "BusinessUnit"
    multiplicity: "ManyToMany"
  - name: "sites"
    type: "SupplierSite"
    multiplicity: "OneToMany"
  - name: "contacts"
    type: "SupplierContact"
    multiplicity: "OneToMany"
  - name: "bankAccounts"
    type: "BankAccount"
    multiplicity: "OneToMany"
  - name: "diversityProfile"
    type: "DiversityProfile"
    multiplicity: "OneToOne"
  - name: "insurancePolicies"
    type: "InsurancePolicy"
    multiplicity: "OneToMany"
  - name: "certifications"
    type: "Certification"
    multiplicity: "OneToMany"
  - name: "qualifications"
    type: "Qualification"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "scorecards"
    type: "SupplierScorecard"
    multiplicity: "OneToMany"
  - name: "audits"
    type: "Audit"
    multiplicity: "OneToMany"
  - name: "contracts"
    type: "Contract"
    multiplicity: "OneToMany"
  - name: "onboardingWorkflows"
    type: "OnboardingWorkflow"
    multiplicity: "OneToMany"
  - name: "complianceObligations"
    type: "ComplianceObligation"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "issues"
    type: "Issue"
    multiplicity: "OneToMany"
  - name: "communications"
    type: "CommunicationLog"
    multiplicity: "OneToMany"
- name: "SupplierSite"
  description: "Physical or legal site associated with the supplier."
  data:
  - name: "siteName"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "siteType"
    type: "SupplierSiteType"
  - name: "timezone"
    type: "String"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "contacts"
    type: "SupplierContact"
    multiplicity: "OneToMany"
  - name: "bankAccounts"
    type: "BankAccount"
    multiplicity: "OneToMany"
  - name: "capabilities"
    type: "SupplierCapability"
    multiplicity: "OneToMany"
  - name: "certifications"
    type: "Certification"
    multiplicity: "OneToMany"
  - name: "issues"
    type: "Issue"
    multiplicity: "OneToMany"
- name: "SupplierContact"
  description: "Individual point of contact representing the supplier."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "contactRole"
    type: "ContactRole"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "SupplierSite"
    multiplicity: "ManyToOne"
  - name: "communications"
    type: "CommunicationLog"
    multiplicity: "OneToMany"
- name: "BankAccount"
  description: "Financial account details used to remit payments to the supplier."
  data:
  - name: "bankName"
    type: "String"
  - name: "accountNumber"
    type: "String"
  - name: "iban"
    type: "String"
  - name: "swiftCode"
    type: "String"
  - name: "currency"
    type: "String"
  - name: "accountHolderName"
    type: "String"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "SupplierSite"
    multiplicity: "ManyToOne"
- name: "SupplierCapability"
  description: "Specific manufacturing or service capability offered by the supplier."
  data:
  - name: "name"
    type: "String"
  - name: "capabilityType"
    type: "CapabilityType"
  - name: "description"
    type: "String"
  relations:
  - name: "site"
    type: "SupplierSite"
    multiplicity: "ManyToOne"
  - name: "categories"
    type: "Category"
    multiplicity: "ManyToMany"
- name: "Category"
  description: "Procurement category used to organize supplier offerings."
  data:
  - name: "name"
    type: "String"
  - name: "categoryCode"
    type: "String"
  - name: "categoryType"
    type: "CategoryType"
  relations:
  - name: "parentCategory"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "subcategories"
    type: "Category"
    multiplicity: "OneToMany"
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "ManyToMany"
- name: "Qualification"
  description: "Formal approval outcome allowing a supplier to provide goods or services\
    \ for defined categories."
  data:
  - name: "qualificationNumber"
    type: "String"
  - name: "status"
    type: "QualificationStatus"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "scope"
    type: "String"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "categories"
    type: "Category"
    multiplicity: "ManyToMany"
  - name: "buyingOrganization"
    type: "BuyingOrganization"
    multiplicity: "ManyToOne"
- name: "Certification"
  description: "Third-party credential or standard attestation held by the supplier\
    \ or site."
  data:
  - name: "standardName"
    type: "String"
  - name: "certificateNumber"
    type: "String"
  - name: "issuedBy"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "status"
    type: "CertificationStatus"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "SupplierSite"
    multiplicity: "ManyToOne"
- name: "InsurancePolicy"
  description: "Insurance coverage maintained by the supplier to mitigate operational\
    \ and legal risks."
  data:
  - name: "policyNumber"
    type: "String"
  - name: "insuranceType"
    type: "InsuranceType"
  - name: "coverageAmount"
    type: "Money"
  - name: "expiryDate"
    type: "Date"
  - name: "carrierName"
    type: "String"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
- name: "DiversityProfile"
  description: "Supplier diversity classification and certification details."
  data:
  - name: "diversityType"
    type: "DiversityType"
  - name: "certificationAgency"
    type: "String"
  - name: "certificationExpiry"
    type: "Date"
  - name: "isSelfCertified"
    type: "YesNo"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "OneToOne"
- name: "RiskAssessment"
  description: "Structured evaluation of a supplier’s risk across multiple dimensions."
  data:
  - name: "assessmentDate"
    type: "Date"
  - name: "overallRiskLevel"
    type: "RiskLevel"
  - name: "financialRiskScore"
    type: "Integer"
  - name: "complianceRiskScore"
    type: "Integer"
  - name: "cyberRiskScore"
    type: "Integer"
  - name: "notes"
    type: "String"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "buyingOrganization"
    type: "BuyingOrganization"
    multiplicity: "ManyToOne"
- name: "Audit"
  description: "Planned review of supplier processes, controls, and compliance to\
    \ requirements."
  data:
  - name: "auditNumber"
    type: "String"
  - name: "auditType"
    type: "AuditType"
  - name: "scheduledDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  - name: "result"
    type: "AuditResult"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "findings"
    type: "AuditFinding"
    multiplicity: "OneToMany"
- name: "AuditFinding"
  description: "Discrete nonconformance or observation identified during an audit."
  data:
  - name: "referenceCode"
    type: "String"
  - name: "severity"
    type: "FindingSeverity"
  - name: "description"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "FindingStatus"
  relations:
  - name: "audit"
    type: "Audit"
    multiplicity: "ManyToOne"
  - name: "correctiveActionPlan"
    type: "CorrectiveActionPlan"
    multiplicity: "ManyToOne"
- name: "CorrectiveActionPlan"
  description: "Time-bound set of actions to address audit findings or supplier issues."
  data:
  - name: "planNumber"
    type: "String"
  - name: "description"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "ActionPlanStatus"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "findings"
    type: "AuditFinding"
    multiplicity: "OneToMany"
  - name: "issues"
    type: "Issue"
    multiplicity: "OneToMany"
- name: "SupplierScorecard"
  description: "Periodic evaluation of supplier performance against targets."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "overallScore"
    type: "Decimal"
  - name: "qualityScore"
    type: "Decimal"
  - name: "deliveryScore"
    type: "Decimal"
  - name: "costScore"
    type: "Decimal"
  - name: "responsivenessScore"
    type: "Decimal"
  - name: "status"
    type: "ScorecardStatus"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "metrics"
    type: "ScorecardMetric"
    multiplicity: "OneToMany"
- name: "ScorecardMetric"
  description: "Component measure contributing to a supplier scorecard."
  data:
  - name: "name"
    type: "String"
  - name: "target"
    type: "Decimal"
  - name: "actual"
    type: "Decimal"
  - name: "weight"
    type: "Decimal"
  relations:
  - name: "scorecard"
    type: "SupplierScorecard"
    multiplicity: "ManyToOne"
- name: "Issue"
  description: "Reported event affecting supplier quality, delivery, compliance, or\
    \ conduct."
  data:
  - name: "issueNumber"
    type: "String"
  - name: "issueType"
    type: "IssueType"
  - name: "openedDate"
    type: "Date"
  - name: "status"
    type: "IssueStatus"
  - name: "description"
    type: "String"
  - name: "severity"
    type: "IssueSeverity"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "SupplierSite"
    multiplicity: "ManyToOne"
  - name: "correctiveActionPlan"
    type: "CorrectiveActionPlan"
    multiplicity: "ManyToOne"
  - name: "escalations"
    type: "Escalation"
    multiplicity: "OneToMany"
- name: "Escalation"
  description: "Managed elevation of a supplier issue to higher governance levels."
  data:
  - name: "escalationNumber"
    type: "String"
  - name: "level"
    type: "EscalationLevel"
  - name: "reason"
    type: "String"
  - name: "openedDate"
    type: "Date"
  - name: "status"
    type: "EscalationStatus"
  relations:
  - name: "issue"
    type: "Issue"
    multiplicity: "ManyToOne"
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
- name: "OnboardingWorkflow"
  description: "Orchestrated process to register and enable a new supplier."
  data:
  - name: "workflowName"
    type: "String"
  - name: "status"
    type: "OnboardingStatus"
  - name: "startDate"
    type: "Date"
  - name: "completionDate"
    type: "Date"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "steps"
    type: "OnboardingStep"
    multiplicity: "OneToMany"
- name: "OnboardingStep"
  description: "Discrete task within a supplier onboarding workflow."
  data:
  - name: "stepName"
    type: "String"
  - name: "stepType"
    type: "OnboardingStepType"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "OnboardingStepStatus"
  relations:
  - name: "workflow"
    type: "OnboardingWorkflow"
    multiplicity: "ManyToOne"
  - name: "requiredDocuments"
    type: "DocumentRequirement"
    multiplicity: "ManyToMany"
- name: "DocumentRequirement"
  description: "Document that must be provided or maintained as part of onboarding\
    \ or compliance."
  data:
  - name: "name"
    type: "String"
  - name: "documentType"
    type: "DocumentType"
  - name: "isMandatory"
    type: "YesNo"
  relations:
  - name: "onboardingSteps"
    type: "OnboardingStep"
    multiplicity: "ManyToMany"
- name: "Document"
  description: "Managed artifact uploaded or referenced for supplier governance."
  data:
  - name: "fileName"
    type: "String"
  - name: "documentType"
    type: "DocumentType"
  - name: "uploadedDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "status"
    type: "DocumentStatus"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "requirement"
    type: "DocumentRequirement"
    multiplicity: "ManyToOne"
  - name: "complianceObligation"
    type: "ComplianceObligation"
    multiplicity: "ManyToOne"
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
- name: "ComplianceRequirement"
  description: "External or internal rule that imposes obligations on suppliers."
  data:
  - name: "name"
    type: "String"
  - name: "jurisdiction"
    type: "String"
  - name: "requirementType"
    type: "ComplianceType"
  - name: "effectiveDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  relations:
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "obligations"
    type: "ComplianceObligation"
    multiplicity: "OneToMany"
- name: "ComplianceObligation"
  description: "Supplier-specific instantiation of a compliance requirement."
  data:
  - name: "status"
    type: "ComplianceStatus"
  - name: "dueDate"
    type: "Date"
  - name: "lastVerifiedDate"
    type: "Date"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "requirement"
    type: "ComplianceRequirement"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "Contract"
  description: "Commercial agreement governing terms, pricing, and obligations with\
    \ a supplier."
  data:
  - name: "contractNumber"
    type: "String"
  - name: "contractType"
    type: "ContractType"
  - name: "effectiveDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "totalValue"
    type: "Money"
  - name: "status"
    type: "ContractStatus"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "priceLists"
    type: "PriceList"
    multiplicity: "OneToMany"
  - name: "slas"
    type: "SLA"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "SLA"
  description: "Service-level commitment and associated remedies defined within a\
    \ contract."
  data:
  - name: "name"
    type: "String"
  - name: "metric"
    type: "String"
  - name: "target"
    type: "Decimal"
  - name: "unit"
    type: "String"
  - name: "penalty"
    type: "Money"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
- name: "PriceList"
  description: "Set of commercial rates and conditions for items or services."
  data:
  - name: "name"
    type: "String"
  - name: "currency"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "status"
    type: "PriceListStatus"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "PriceListItem"
    multiplicity: "OneToMany"
- name: "PriceListItem"
  description: "Priced good or service under a price list."
  data:
  - name: "itemCode"
    type: "String"
  - name: "itemDescription"
    type: "String"
  - name: "unitOfMeasure"
    type: "String"
  - name: "unitPrice"
    type: "Decimal"
  - name: "minOrderQty"
    type: "Integer"
  - name: "leadTimeDays"
    type: "Integer"
  relations:
  - name: "priceList"
    type: "PriceList"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
- name: "CommunicationLog"
  description: "Record of communications with suppliers and their contacts."
  data:
  - name: "subject"
    type: "String"
  - name: "messageType"
    type: "CommunicationType"
  - name: "dateSent"
    type: "Date"
  - name: "channel"
    type: "CommunicationChannel"
  - name: "contentSummary"
    type: "String"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "contact"
    type: "SupplierContact"
    multiplicity: "ManyToOne"
enums:
- name: "SupplierStatus"
  description: "Lifecycle state representing where a supplier stands in engagement\
    \ and eligibility."
  data:
  - name: "Prospective"
  - name: "Registered"
  - name: "Active"
  - name: "Suspended"
  - name: "Blacklisted"
  - name: "Inactive"
- name: "SupplierSiteType"
  description: "Classification of the supplier site based on operational function."
  data:
  - name: "Headquarters"
  - name: "Manufacturing"
  - name: "Warehouse"
  - name: "ServiceCenter"
  - name: "Billing"
- name: "ContactRole"
  description: "Primary responsibility of a supplier contact within the relationship."
  data:
  - name: "Sales"
  - name: "AccountManager"
  - name: "Technical"
  - name: "Finance"
  - name: "Compliance"
  - name: "Executive"
- name: "CapabilityType"
  description: "Type of capability a supplier provides."
  data:
  - name: "Manufacturing"
  - name: "Distribution"
  - name: "Services"
  - name: "Engineering"
  - name: "ResearchAndDevelopment"
  - name: "Logistics"
- name: "CategoryType"
  description: "High-level grouping that distinguishes category usage and sourcing\
    \ strategy."
  data:
  - name: "Material"
  - name: "Service"
  - name: "Indirect"
  - name: "IT"
  - name: "ProfessionalServices"
  - name: "CapitalEquipment"
- name: "QualificationStatus"
  description: "State of a supplier’s qualification outcome."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
  - name: "Expired"
  - name: "Revoked"
- name: "CertificationStatus"
  description: "Validity state of a supplier certification."
  data:
  - name: "Valid"
  - name: "Expired"
  - name: "Suspended"
  - name: "Revoked"
  - name: "Pending"
- name: "InsuranceType"
  description: "Category of insurance coverage relevant to supplier operations."
  data:
  - name: "GeneralLiability"
  - name: "ProductLiability"
  - name: "WorkersCompensation"
  - name: "AutoLiability"
  - name: "CyberLiability"
  - name: "ProfessionalLiability"
- name: "DiversityType"
  description: "Recognized classifications for diverse supplier ownership."
  data:
  - name: "MinorityOwned"
  - name: "WomanOwned"
  - name: "VeteranOwned"
  - name: "DisabledOwned"
  - name: "LGBTQOwned"
  - name: "SmallBusiness"
- name: "YesNo"
  description: "Simple binary indicator used for required responses."
  data:
  - name: true
  - name: false
- name: "RiskLevel"
  description: "Overall severity tier determined by risk assessment."
  data:
  - name: "Low"
  - name: "Moderate"
  - name: "High"
  - name: "Critical"
- name: "AuditType"
  description: "Focus area for an audit engagement."
  data:
  - name: "Quality"
  - name: "Process"
  - name: "Compliance"
  - name: "SocialResponsibility"
  - name: "Security"
- name: "AuditResult"
  description: "Outcome assigned at audit close."
  data:
  - name: "Pass"
  - name: "ConditionalPass"
  - name: "Fail"
  - name: "NotApplicable"
- name: "FindingSeverity"
  description: "Impact level associated with an audit finding."
  data:
  - name: "Minor"
  - name: "Major"
  - name: "Critical"
- name: "FindingStatus"
  description: "Progress state for remediation of an audit finding."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "Verified"
  - name: "Closed"
  - name: "Deferred"
- name: "ActionPlanStatus"
  description: "Lifecycle state of a corrective action plan."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Implementing"
  - name: "Completed"
  - name: "Overdue"
- name: "ScorecardStatus"
