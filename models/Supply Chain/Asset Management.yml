---
metadata:
  name: "HCIDL Capabilities Model - Asset Management"
  description: "Domain model capturing capabilities for enterprise asset management,\
    \ maintenance execution, and lifecycle governance."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Supply Chain"
  type: "Capability"
  domain: "Asset Management"
entities:
- name: "Asset"
  description: "Registered physical or digital item tracked across acquisition, operation,\
    \ and retirement."
  data:
  - name: "assetTag"
    type: "AssetTag"
  - name: "serialNumber"
    type: "SerialNumber"
  - name: "assetName"
    type: "String"
  - name: "assetType"
    type: "AssetType"
  - name: "criticality"
    type: "AssetCriticality"
  - name: "status"
    type: "AssetStatus"
  - name: "conditionRating"
    type: "ConditionRating"
  - name: "acquisitionDate"
    type: "Date"
  - name: "inServiceDate"
    type: "Date"
  - name: "bookValue"
    type: "Money"
  - name: "usefulLifeMonths"
    type: "Integer"
  - name: "warrantyExpiryDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "category"
    type: "AssetCategory"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "AssetOwner"
    multiplicity: "ManyToOne"
  - name: "costCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
  - name: "maintenancePlans"
    type: "MaintenancePlan"
    multiplicity: "ManyToMany"
  - name: "components"
    type: "AssetComponent"
    multiplicity: "OneToMany"
  - name: "meters"
    type: "AssetMeter"
    multiplicity: "OneToMany"
  - name: "workOrders"
    type: "WorkOrder"
    multiplicity: "OneToMany"
  - name: "contracts"
    type: "Contract"
    multiplicity: "ManyToMany"
  - name: "depreciationSchedule"
    type: "DepreciationSchedule"
    multiplicity: "OneToOne"
  - name: "events"
    type: "AssetEvent"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "utilizationRecords"
    type: "UtilizationRecord"
    multiplicity: "OneToMany"
  - name: "downtimeRecords"
    type: "DowntimeRecord"
    multiplicity: "OneToMany"
  - name: "certificates"
    type: "ComplianceCertificate"
    multiplicity: "OneToMany"
- name: "AssetCategory"
  description: "Hierarchical classification that drives standards, accounting rules,\
    \ and maintenance strategies."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "depreciationMethod"
    type: "DepreciationMethod"
  - name: "defaultUsefulLifeMonths"
    type: "Integer"
  relations:
  - name: "parentCategory"
    type: "AssetCategory"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "compatibleParts"
    type: "SparePart"
    multiplicity: "ManyToMany"
- name: "Location"
  description: "Physical or logical place where assets, work, and parts are situated."
  data:
  - name: "name"
    type: "String"
  - name: "siteCode"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "latitude"
    type: "Decimal"
  - name: "longitude"
    type: "Decimal"
  - name: "isStorage"
    type: "Boolean"
  relations:
  - name: "parentLocation"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "partStocks"
    type: "PartStock"
    multiplicity: "OneToMany"
  - name: "workOrders"
    type: "WorkOrder"
    multiplicity: "OneToMany"
  - name: "audits"
    type: "Audit"
    multiplicity: "OneToMany"
- name: "AssetOwner"
  description: "Financial or custodial owner accountable for asset stewardship and\
    \ decisions."
  data:
  - name: "name"
    type: "String"
  - name: "ownerType"
    type: "OwnerType"
  - name: "contactEmail"
    type: "String"
  relations:
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "costCenters"
    type: "CostCenter"
    multiplicity: "OneToMany"
- name: "CostCenter"
  description: "Accounting dimension used to allocate and report asset and maintenance\
    \ costs."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  relations:
  - name: "owner"
    type: "AssetOwner"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "workOrders"
    type: "WorkOrder"
    multiplicity: "OneToMany"
- name: "MaintenancePlan"
  description: "Recurring preventive or condition-based program that schedules standardized\
    \ tasks."
  data:
  - name: "name"
    type: "String"
  - name: "strategy"
    type: "MaintenanceStrategy"
  - name: "intervalValue"
    type: "Integer"
  - name: "intervalUnit"
    type: "TimeUnit"
  - name: "conditions"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "tasks"
    type: "MaintenanceTask"
    multiplicity: "OneToMany"
- name: "MaintenanceTask"
  description: "Standard job definition with steps, materials, and skill requirements\
    \ for a plan."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "estimatedDurationMinutes"
    type: "Integer"
  - name: "requiredSkills"
    type: "String"
  - name: "safetyNotes"
    type: "String"
  relations:
  - name: "plan"
    type: "MaintenancePlan"
    multiplicity: "ManyToOne"
  - name: "materials"
    type: "SparePart"
    multiplicity: "ManyToMany"
- name: "WorkOrder"
  description: "Authorized instruction to execute maintenance, inspection, or calibration\
    \ work."
  data:
  - name: "workOrderNumber"
    type: "String"
  - name: "status"
    type: "WorkOrderStatus"
  - name: "priority"
    type: "Priority"
  - name: "requestedStart"
    type: "Date"
  - name: "completionDate"
    type: "Date"
  - name: "scheduledWindow"
    type: "DateRange"
  - name: "costLabor"
    type: "Money"
  - name: "costMaterial"
    type: "Money"
  - name: "summary"
    type: "String"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "WorkOrderTask"
    multiplicity: "OneToMany"
  - name: "team"
    type: "MaintenanceTeam"
    multiplicity: "ManyToOne"
  - name: "technicians"
    type: "Technician"
    multiplicity: "ManyToMany"
  - name: "serviceRequest"
    type: "ServiceRequest"
    multiplicity: "OneToOne"
  - name: "costCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
  - name: "events"
    type: "AssetEvent"
    multiplicity: "OneToMany"
- name: "WorkOrderTask"
  description: "Executable task line within a work order capturing progress and actuals."
  data:
  - name: "description"
    type: "String"
  - name: "status"
    type: "WorkOrderTaskStatus"
  - name: "actualDurationMinutes"
    type: "Integer"
  - name: "notes"
    type: "String"
  relations:
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "ManyToOne"
  - name: "materials"
    type: "SparePart"
    multiplicity: "ManyToMany"
- name: "ServiceRequest"
  description: "Initial request raised by a stakeholder to report an issue or need\
    \ service."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "summary"
    type: "String"
  - name: "description"
    type: "String"
  - name: "status"
    type: "RequestStatus"
  - name: "requestedDate"
    type: "Date"
  - name: "contactName"
    type: "String"
  - name: "contactEmail"
    type: "String"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "OneToOne"
  - name: "requester"
    type: "Stakeholder"
    multiplicity: "ManyToOne"
- name: "AssetMeter"
  description: "Measurable channel of usage or condition associated with an asset."
  data:
  - name: "name"
    type: "String"
  - name: "meterType"
    type: "MeterType"
  - name: "unit"
    type: "String"
  - name: "rolloverThreshold"
    type: "Decimal"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "readings"
    type: "MeterReading"
    multiplicity: "OneToMany"
- name: "MeterReading"
  description: "Recorded measurement value for an asset meter at a point in time."
  data:
  - name: "readingValue"
    type: "Decimal"
  - name: "readingDate"
    type: "Date"
  - name: "source"
    type: "ReadingSource"
  - name: "note"
    type: "String"
  relations:
  - name: "meter"
    type: "AssetMeter"
    multiplicity: "ManyToOne"
- name: "AssetComponent"
  description: "Replaceable subassembly or module of an asset with its own traceability."
  data:
  - name: "name"
    type: "String"
  - name: "serialNumber"
    type: "SerialNumber"
  - name: "componentType"
    type: "ComponentType"
  - name: "critical"
    type: "Boolean"
  - name: "installationDate"
    type: "Date"
  - name: "removalDate"
    type: "Date"
  relations:
  - name: "parentAsset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "subcomponents"
    type: "AssetComponent"
    multiplicity: "OneToMany"
  - name: "part"
    type: "SparePart"
    multiplicity: "ManyToOne"
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
- name: "SparePart"
  description: "Stocked replacement item used to service and repair assets."
  data:
  - name: "partNumber"
    type: "String"
  - name: "name"
    type: "String"
  - name: "unitOfMeasure"
    type: "String"
  - name: "standardCost"
    type: "Money"
  - name: "reorderPoint"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "isHazardous"
    type: "Boolean"
  relations:
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "ManyToMany"
  - name: "stocks"
    type: "PartStock"
    multiplicity: "OneToMany"
  - name: "compatibleCategories"
    type: "AssetCategory"
    multiplicity: "ManyToMany"
  - name: "tasks"
    type: "MaintenanceTask"
    multiplicity: "ManyToMany"
  - name: "workOrderTasks"
    type: "WorkOrderTask"
    multiplicity: "ManyToMany"
  - name: "components"
    type: "AssetComponent"
    multiplicity: "OneToMany"
- name: "PartStock"
  description: "Inventory balance and storage details of a spare part at a specific\
    \ location."
  data:
  - name: "quantityOnHand"
    type: "Integer"
  - name: "quantityReserved"
    type: "Integer"
  - name: "binLocation"
    type: "String"
  - name: "expirationDate"
    type: "Date"
  - name: "lotNumber"
    type: "String"
  relations:
  - name: "part"
    type: "SparePart"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "Supplier"
  description: "External organization providing parts, services, or certifications."
  data:
  - name: "name"
    type: "String"
  - name: "supplierType"
    type: "SupplierType"
  - name: "preferred"
    type: "Boolean"
  - name: "website"
    type: "String"
  - name: "phone"
    type: "String"
  relations:
  - name: "parts"
    type: "SparePart"
    multiplicity: "OneToMany"
  - name: "contracts"
    type: "Contract"
    multiplicity: "OneToMany"
  - name: "components"
    type: "AssetComponent"
    multiplicity: "OneToMany"
  - name: "acquisitions"
    type: "Acquisition"
    multiplicity: "OneToMany"
  - name: "disposals"
    type: "Disposal"
    multiplicity: "OneToMany"
- name: "Contract"
  description: "Binding agreement defining service, warranty, lease, or maintenance\
    \ obligations."
  data:
  - name: "contractNumber"
    type: "String"
  - name: "contractType"
    type: "ContractType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "totalValue"
    type: "Money"
  - name: "terms"
    type: "String"
  - name: "responseTimeHours"
    type: "Integer"
  - name: "cancellationNoticeDays"
    type: "Integer"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "coveredAssets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "serviceLevelAgreement"
    type: "ServiceLevelAgreement"
    multiplicity: "OneToOne"
- name: "ServiceLevelAgreement"
  description: "Performance targets and commitments attached to a contract."
  data:
  - name: "name"
    type: "String"
  - name: "targetResponseHours"
    type: "Integer"
  - name: "targetResolutionHours"
    type: "Integer"
  - name: "penaltiesApplicable"
    type: "Boolean"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "OneToOne"
- name: "Calibration"
  description: "Program and cycle for ensuring the accuracy of measurement instruments."
  data:
  - name: "calibrationIntervalMonths"
    type: "Integer"
  - name: "lastCalibrationDate"
    type: "Date"
  - name: "nextDueDate"
    type: "Date"
  - name: "status"
    type: "CalibrationStatus"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "workOrders"
    type: "WorkOrder"
    multiplicity: "OneToMany"
  - name: "certificates"
    type: "ComplianceCertificate"
    multiplicity: "OneToMany"
- name: "ComplianceCertificate"
  description: "Formal attestation that an asset meets regulatory or standards requirements."
  data:
  - name: "certificateNumber"
    type: "String"
  - name: "issuingBody"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "status"
    type: "CertificateStatus"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "calibration"
    type: "Calibration"
    multiplicity: "ManyToOne"
- name: "Audit"
  description: "Periodic verification of asset existence, location, and condition."
  data:
  - name: "auditNumber"
    type: "String"
  - name: "auditDate"
    type: "Date"
  - name: "auditorName"
    type: "String"
  - name: "varianceCount"
    type: "Integer"
  - name: "status"
    type: "AuditStatus"
  relations:
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "findings"
    type: "AuditFinding"
    multiplicity: "OneToMany"
- name: "AuditFinding"
  description: "Specific discrepancy or confirmation recorded during an asset audit."
  data:
  - name: "discrepancyType"
    type: "DiscrepancyType"
  - name: "notes"
    type: "String"
  - name: "resolved"
    type: "Boolean"
  relations:
  - name: "audit"
    type: "Audit"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
- name: "DepreciationSchedule"
  description: "Plan detailing the periodic expensing of an asset’s value."
  data:
  - name: "method"
    type: "DepreciationMethod"
  - name: "startDate"
    type: "Date"
  - name: "usefulLifeMonths"
    type: "Integer"
  - name: "salvageValue"
    type: "Money"
  - name: "monthlyDepreciation"
    type: "Money"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "OneToOne"
  - name: "book"
    type: "FinancialBook"
    multiplicity: "ManyToOne"
- name: "FinancialBook"
  description: "Accounting book that governs depreciation policies and reporting."
  data:
  - name: "name"
    type: "String"
  - name: "bookType"
    type: "BookType"
  - name: "currency"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "depreciationSchedules"
    type: "DepreciationSchedule"
    multiplicity: "OneToMany"
- name: "Acquisition"
  description: "Event capturing the capitalization and intake of an asset."
  data:
  - name: "acquisitionDate"
    type: "Date"
  - name: "type"
    type: "AcquisitionType"
  - name: "acquisitionCost"
    type: "Money"
  - name: "documentReference"
    type: "String"
  - name: "vendorInvoiceNumber"
    type: "String"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "financialBook"
    type: "FinancialBook"
    multiplicity: "ManyToOne"
- name: "Disposal"
  description: "Event capturing the retirement of an asset and related financial outcome."
  data:
  - name: "disposalDate"
    type: "Date"
  - name: "disposalMethod"
    type: "DisposalMethod"
  - name: "proceeds"
    type: "Money"
  - name: "reason"
    type: "String"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "counterparty"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "financialBook"
    type: "FinancialBook"
    multiplicity: "ManyToOne"
- name: "AssetEvent"
  description: "General lifecycle or maintenance milestone recorded against an asset."
  data:
  - name: "eventType"
    type: "AssetEventType"
  - name: "eventDate"
    type: "Date"
  - name: "description"
    type: "String"
  - name: "createdBy"
    type: "String"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "ManyToOne"
- name: "MaintenanceTeam"
  description: "Group responsible for planning and executing maintenance activities."
  data:
  - name: "name"
    type: "String"
  - name: "contactEmail"
    type: "String"
  - name: "shift"
    type: "ShiftType"
  - name: "isExternal"
    type: "Boolean"
  relations:
  - name: "assignedWorkOrders"
    type: "WorkOrder"
    multiplicity: "OneToMany"
  - name: "members"
    type: "Technician"
    multiplicity: "OneToMany"
  - name: "contracts"
    type: "Contract"
    multiplicity: "ManyToMany"
- name: "Technician"
  description: "Skilled individual who performs maintenance, inspection, and calibration\
    \ work."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "skillLevel"
    type: "SkillLevel"
  - name: "certifications"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "team"
    type: "MaintenanceTeam"
    multiplicity: "ManyToOne"
  - name: "workOrders"
    type: "WorkOrder"
    multiplicity: "ManyToMany"
- name: "RiskAssessment"
  description: "Evaluation of asset risks with likelihood, impact, and mitigation\
    \ actions."
  data:
  - name: "riskScore"
    type: "Integer"
  - name: "likelihood"
    type: "RiskLevel"
  - name: "impact"
    type: "RiskLevel"
  - name: "reviewDate"
    type: "Date"
  - name: "mitigationPlan"
    type: "String"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
- name: "UtilizationRecord"
  description: "Summary of asset use, availability, and performance for a defined\
    \ period."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "operatingHours"
    type: "Decimal"
  - name: "availabilityPercent"
    type: "Decimal"
  - name: "uptimeMinutes"
    type: "Integer"
  - name: "downtimeMinutes"
    type: "Integer"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
- name: "DowntimeRecord"
  description: "Detailed record of an interruption in asset availability and its impact."
  data:
  - name: "startTime"
    type: "Date"
  - name: "endTime"
    type: "Date"
  - name: "reasonCategory"
    type: "DowntimeCategory"
  - name: "cause"
    type: "String"
  - name: "impact"
    type: "DowntimeImpact"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "ManyToOne"
- name: "Stakeholder"
  description: "Person or role that participates in asset processes such as requesting\
    \ or approving work."
  data:
  - name: "name"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "role"
    type: "StakeholderRole"
  relations:
  - name: "serviceRequests"
    type: "ServiceRequest"
    multiplicity: "OneToMany"
  - name: "costCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
enums:
- name: "AssetType"
  description: "High-level classification of assets by nature and function."
  data:
  - name: "Equipment"
  - name: "Machinery"
  - name: "ITAsset"
  - name: "Instrument"
  - name: "Infrastructure"
  - name: "Facility"
  - name: "Furniture"
  - name: "Tool"
- name: "AssetCriticality"
  description: "Importance of an asset to safety, compliance, or operations."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "AssetStatus"
  description: "Lifecycle state indicating availability for use."
  data:
  - name: "Planned"
  - name: "InService"
  - name: "Idle"
  - name: "UnderMaintenance"
  - name: "Retired"
  - name: "Disposed"
- name: "MaintenanceStrategy"
  description: "Approach used to plan and trigger maintenance activities."
  data:
  - name: "Preventive"
  - name: "Predictive"
  - name: "ConditionBased"
  - name: "RunToFailure"
  - name: "ReliabilityCentered"
- name: "TimeUnit"
  description: "Units for scheduling or measurement intervals."
  data:
  - name: "Hours"
  - name: "Days"
  - name: "Weeks"
  - name: "Months"
  - name: "Years"
- name: "WorkOrderStatus"
  description: "Progress state of a maintenance work order."
  data:
  - name: "New"
  - name: "Approved"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
  - name: "Closed"
- name: "Priority"
  description: "Relative urgency used to sequence work."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
