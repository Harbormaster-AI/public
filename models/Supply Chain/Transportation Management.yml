---
metadata:
  name: "Transportation Management Capabilities Model"
  description: "Capability model for planning, execution, visibility, and financial\
    \ settlement of freight movements across all modes."
  version: "1.0.0"
  industry: "Logistics"
  category: "Supply Chain"
  type: "Capability"
  domain: "Transportation Management"
entities:
- name: "Shipper"
  description: "Organization that tenders freight and is typically responsible for\
    \ transportation charges."
  data:
  - name: "name"
    type: "String"
  - name: "billingAddress"
    type: "Address"
  - name: "primaryContact"
    type: "ContactInfo"
  - name: "paymentTerms"
    type: "String"
  relations:
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "routingGuides"
    type: "RoutingGuide"
    multiplicity: "OneToMany"
  - name: "rateContracts"
    type: "RateContract"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
- name: "Consignee"
  description: "Party designated to receive freight at destination."
  data:
  - name: "name"
    type: "String"
  - name: "deliveryAddress"
    type: "Address"
  - name: "primaryContact"
    type: "ContactInfo"
  relations:
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
- name: "Carrier"
  description: "Transportation service provider that moves freight under a service\
    \ agreement."
  data:
  - name: "name"
    type: "String"
  - name: "scac"
    type: "String"
  - name: "homeCountry"
    type: "String"
  - name: "primaryContact"
    type: "ContactInfo"
  relations:
  - name: "serviceOfferings"
    type: "ServiceOffering"
    multiplicity: "OneToMany"
  - name: "rateContracts"
    type: "RateContract"
    multiplicity: "OneToMany"
  - name: "tenders"
    type: "CarrierTender"
    multiplicity: "OneToMany"
  - name: "bookings"
    type: "Booking"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "freightBills"
    type: "FreightBill"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
- name: "Location"
  description: "Physical site for pickup, delivery, or interchange, including docks\
    \ and yards."
  data:
  - name: "name"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "timezone"
    type: "String"
  - name: "coordinates"
    type: "GeoPoint"
  - name: "contact"
    type: "ContactInfo"
  relations:
  - name: "shipper"
    type: "Shipper"
    multiplicity: "ManyToOne"
  - name: "consignee"
    type: "Consignee"
    multiplicity: "ManyToOne"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
  - name: "shipmentStops"
    type: "ShipmentStop"
    multiplicity: "OneToMany"
- name: "RoutingGuide"
  description: "Preferred carrier and service selection rules organized by lanes and\
    \ priorities."
  data:
  - name: "name"
    type: "String"
  - name: "effectivePeriod"
    type: "DateRange"
  - name: "priorityLevels"
    type: "Integer"
  relations:
  - name: "shipper"
    type: "Shipper"
    multiplicity: "ManyToOne"
  - name: "lanes"
    type: "Lane"
    multiplicity: "OneToMany"
  - name: "carriers"
    type: "Carrier"
    multiplicity: "ManyToMany"
- name: "Lane"
  description: "Origin and destination pairing used for planning, rating, and procurement."
  data:
  - name: "name"
    type: "String"
  - name: "mode"
    type: "TransportMode"
  - name: "incoterm"
    type: "Incoterm"
  relations:
  - name: "origin"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "destination"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "routingGuide"
    type: "RoutingGuide"
    multiplicity: "ManyToOne"
  - name: "carriers"
    type: "Carrier"
    multiplicity: "ManyToMany"
  - name: "rateTables"
    type: "RateTable"
    multiplicity: "OneToMany"
- name: "RateContract"
  description: "Commercial agreement defining pricing, terms, and conditions between\
    \ a shipper and a carrier."
  data:
  - name: "contractName"
    type: "String"
  - name: "effectivePeriod"
    type: "DateRange"
  - name: "currency"
    type: "String"
  - name: "paymentTerms"
    type: "String"
  relations:
  - name: "shipper"
    type: "Shipper"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "rateTables"
    type: "RateTable"
    multiplicity: "OneToMany"
  - name: "accessorials"
    type: "Accessorial"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "RateTable"
  description: "Structured set of rating rules for a contract and lane, including\
    \ scales and minimums."
  data:
  - name: "tableName"
    type: "String"
  - name: "basis"
    type: "ChargeBasis"
  - name: "minCharge"
    type: "Money"
  - name: "fuelSurchargePercent"
    type: "Decimal"
  relations:
  - name: "contract"
    type: "RateContract"
    multiplicity: "ManyToOne"
  - name: "lane"
    type: "Lane"
    multiplicity: "ManyToOne"
- name: "Accessorial"
  description: "Ancillary charge definition with conditions and calculation method."
  data:
  - name: "name"
    type: "String"
  - name: "accessorialType"
    type: "AccessorialType"
  - name: "amount"
    type: "Money"
  - name: "calculationMethod"
    type: "ChargeCalcMethod"
  relations:
  - name: "rateContract"
    type: "RateContract"
    multiplicity: "ManyToOne"
  - name: "chargeLines"
    type: "ChargeLine"
    multiplicity: "OneToMany"
- name: "Shipment"
  description: "Planned and executed movement of goods from origin to destination\
    \ under a single billable movement."
  data:
  - name: "mode"
    type: "TransportMode"
  - name: "serviceLevel"
    type: "ServiceLevel"
  - name: "status"
    type: "ShipmentStatus"
  - name: "totalWeight"
    type: "Weight"
  - name: "totalVolume"
    type: "Volume"
  - name: "temperatureControl"
    type: "TemperatureControlType"
  - name: "customerReference"
    type: "String"
  relations:
  - name: "shipper"
    type: "Shipper"
    multiplicity: "ManyToOne"
  - name: "consignee"
    type: "Consignee"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "booking"
    type: "Booking"
    multiplicity: "OneToOne"
  - name: "tender"
    type: "CarrierTender"
    multiplicity: "OneToOne"
  - name: "routePlan"
    type: "RoutePlan"
    multiplicity: "OneToOne"
  - name: "stops"
    type: "ShipmentStop"
    multiplicity: "OneToMany"
  - name: "handlingUnits"
    type: "HandlingUnit"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "trackingEvents"
    type: "TrackingEvent"
    multiplicity: "OneToMany"
  - name: "freightBill"
    type: "FreightBill"
    multiplicity: "OneToOne"
  - name: "claims"
    type: "Claim"
    multiplicity: "OneToMany"
- name: "ShipmentStop"
  description: "Sequenced stop at a location for pickup, delivery, or operational\
    \ processing."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "stopType"
    type: "StopType"
  - name: "appointmentWindow"
    type: "TimeWindow"
  - name: "isAppointmentRequired"
    type: "Boolean"
  - name: "notes"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "appointment"
    type: "Appointment"
    multiplicity: "OneToOne"
  - name: "handlingUnits"
    type: "HandlingUnit"
    multiplicity: "OneToMany"
- name: "HandlingUnit"
  description: "Physical logistics unit such as a pallet, container, or skid containing\
    \ one or more packages."
  data:
  - name: "label"
    type: "String"
  - name: "packagingType"
    type: "PackagingType"
  - name: "weight"
    type: "Weight"
  - name: "dimensions"
    type: "Dimensions"
  - name: "isStackable"
    type: "Boolean"
  - name: "temperatureRange"
    type: "TemperatureRange"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "stop"
    type: "ShipmentStop"
    multiplicity: "ManyToOne"
  - name: "packages"
    type: "Package"
    multiplicity: "OneToMany"
  - name: "commodities"
    type: "Commodity"
    multiplicity: "OneToMany"
  - name: "parentHandlingUnit"
    type: "HandlingUnit"
    multiplicity: "ManyToOne"
  - name: "childHandlingUnits"
    type: "HandlingUnit"
    multiplicity: "OneToMany"
- name: "Package"
  description: "Smallest packed unit within a handling unit, typically a carton or\
    \ parcel."
  data:
  - name: "packagingType"
    type: "PackagingType"
  - name: "weight"
    type: "Weight"
  - name: "dimensions"
    type: "Dimensions"
  - name: "dangerousGoods"
    type: "DangerousGoods"
  relations:
  - name: "handlingUnit"
    type: "HandlingUnit"
    multiplicity: "ManyToOne"
  - name: "commodity"
    type: "Commodity"
    multiplicity: "ManyToOne"
- name: "Commodity"
  description: "Line-level product description used for rating, compliance, and documentation."
  data:
  - name: "description"
    type: "String"
  - name: "harmonizedCode"
    type: "String"
  - name: "nmfcClass"
    type: "String"
  - name: "isHazardous"
    type: "Boolean"
  relations:
  - name: "handlingUnit"
    type: "HandlingUnit"
    multiplicity: "ManyToOne"
- name: "Booking"
  description: "Reservation of transportation capacity and service with a carrier."
  data:
  - name: "status"
    type: "BookingStatus"
  - name: "confirmationCode"
    type: "String"
  - name: "requestedDeparture"
    type: "DateTime"
  - name: "requestedArrival"
    type: "DateTime"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "shipment"
    type: "Shipment"
    multiplicity: "OneToOne"
- name: "CarrierTender"
  description: "Offer sent to a carrier requesting acceptance to move a shipment."
  data:
  - name: "status"
    type: "TenderStatus"
  - name: "expirationTime"
    type: "DateTime"
  - name: "offerAmount"
    type: "Money"
  - name: "notes"
    type: "String"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "shipment"
    type: "Shipment"
    multiplicity: "OneToOne"
- name: "Appointment"
  description: "Scheduled window for loading or unloading at a specific location and\
    \ dock."
  data:
  - name: "status"
    type: "AppointmentStatus"
  - name: "timeWindow"
    type: "TimeWindow"
  - name: "reference"
    type: "String"
  - name: "instructions"
    type: "String"
  relations:
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "stop"
    type: "ShipmentStop"
    multiplicity: "OneToOne"
- name: "RoutePlan"
  description: "Planned path consisting of one or more segments used to move the shipment."
  data:
  - name: "planType"
    type: "RoutePlanType"
  - name: "distanceKm"
    type: "Decimal"
  - name: "estimatedTransitHours"
    type: "Decimal"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "OneToOne"
  - name: "segments"
    type: "RouteSegment"
    multiplicity: "OneToMany"
- name: "RouteSegment"
  description: "Individual leg of a route between two points, possibly using a different\
    \ mode or carrier."
  data:
  - name: "mode"
    type: "TransportMode"
  - name: "sequence"
    type: "Integer"
  - name: "plannedDeparture"
    type: "DateTime"
  - name: "plannedArrival"
    type: "DateTime"
  relations:
  - name: "routePlan"
    type: "RoutePlan"
    multiplicity: "ManyToOne"
  - name: "origin"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "destination"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
- name: "TrackingEvent"
  description: "Operational visibility event recorded during execution of a shipment\
    \ or segment."
  data:
  - name: "eventType"
    type: "TrackingEventType"
  - name: "eventTime"
    type: "DateTime"
  - name: "statusDescription"
    type: "String"
  - name: "position"
    type: "GeoPoint"
  - name: "source"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "segment"
    type: "RouteSegment"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "Document"
  description: "Business document related to shipments, billing, or compliance."
  data:
  - name: "documentType"
    type: "DocumentType"
  - name: "fileName"
    type: "String"
  - name: "url"
    type: "String"
  - name: "issuedDate"
    type: "Date"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "rateContract"
    type: "RateContract"
    multiplicity: "ManyToOne"
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "freightBill"
    type: "FreightBill"
    multiplicity: "ManyToOne"
- name: "FreightBill"
  description: "Carrier invoice summarizing transportation charges for a shipment."
  data:
  - name: "status"
    type: "FreightBillStatus"
  - name: "invoiceDate"
    type: "Date"
  - name: "totalCharges"
    type: "Money"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "OneToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "chargeLines"
    type: "ChargeLine"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "disputes"
    type: "Claim"
    multiplicity: "OneToMany"
- name: "ChargeLine"
  description: "Individual rated component of a freight bill, including linehaul and\
    \ accessorials."
  data:
  - name: "chargeType"
    type: "ChargeType"
  - name: "amount"
    type: "Money"
  - name: "basis"
    type: "ChargeBasis"
  - name: "description"
    type: "String"
  relations:
  - name: "freightBill"
    type: "FreightBill"
    multiplicity: "ManyToOne"
  - name: "accessorial"
    type: "Accessorial"
    multiplicity: "ManyToOne"
  - name: "rateTable"
    type: "RateTable"
    multiplicity: "ManyToOne"
- name: "Payment"
  description: "Financial remittance applied against a freight bill."
  data:
  - name: "paymentDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "method"
    type: "PaymentMethod"
  - name: "reference"
    type: "String"
  relations:
  - name: "freightBill"
    type: "FreightBill"
    multiplicity: "ManyToOne"
  - name: "shipper"
    type: "Shipper"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
- name: "Claim"
  description: "Request for compensation due to damage, loss, delay, shortage, or\
    \ billing dispute."
  data:
  - name: "claimType"
    type: "ClaimType"
  - name: "status"
    type: "ClaimStatus"
  - name: "filingDate"
    type: "Date"
  - name: "amountClaimed"
    type: "Money"
  - name: "description"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "freightBill"
    type: "FreightBill"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "shipper"
    type: "Shipper"
    multiplicity: "ManyToOne"
  - name: "consignee"
    type: "Consignee"
    multiplicity: "ManyToOne"
- name: "ServiceOffering"
  description: "Carrier capability describing mode, service level, and equipment available\
    \ on specific lanes."
  data:
  - name: "name"
    type: "String"
  - name: "mode"
    type: "TransportMode"
  - name: "serviceLevel"
    type: "ServiceLevel"
  - name: "equipmentType"
    type: "EquipmentType"
  - name: "maxWeight"
    type: "Weight"
  - name: "temperatureCapability"
    type: "TemperatureControlType"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "lanes"
    type: "Lane"
    multiplicity: "ManyToMany"
enums:
- name: "TransportMode"
  description: "Primary means of conveyance used to move freight."
  data:
  - name: "Road"
  - name: "Rail"
  - name: "Ocean"
  - name: "Air"
  - name: "Parcel"
  - name: "Intermodal"
- name: "ServiceLevel"
  description: "Commitment regarding transit speed or delivery promise."
  data:
  - name: "Standard"
  - name: "Expedited"
  - name: "Overnight"
  - name: "TwoDay"
  - name: "Economy"
- name: "EquipmentType"
  description: "Type of conveyance or equipment used to carry freight."
  data:
  - name: "DryVan"
  - name: "Reefer"
  - name: "Flatbed"
  - name: "Tanker"
  - name: "Container20"
  - name: "Container40"
  - name: "BoxTruck"
  - name: "Railcar"
- name: "ShipmentStatus"
  description: "Lifecycle state of a shipment from planning through completion."
  data:
  - name: "Planned"
  - name: "Tendered"
  - name: "Accepted"
  - name: "InTransit"
  - name: "Delivered"
  - name: "Exception"
  - name: "Cancelled"
- name: "StopType"
  description: "Purpose of a shipment stop in the route plan."
  data:
  - name: "Pickup"
  - name: "Delivery"
  - name: "Stop"
  - name: "Customs"
  - name: "CrossDock"
- name: "BookingStatus"
  description: "State of a capacity reservation with a carrier."
  data:
  - name: "Requested"
  - name: "Confirmed"
  - name: "Rejected"
  - name: "Cancelled"
- name: "TenderStatus"
  description: "Acceptance state of a shipment offer sent to a carrier."
  data:
  - name: "Sent"
  - name: "Accepted"
  - name: "Declined"
  - name: "Expired"
  - name: "Withdrawn"
- name: "AppointmentStatus"
  description: "Scheduling state of a dock appointment at a location."
  data:
  - name: "Requested"
  - name: "Scheduled"
  - name: "Arrived"
  - name: "Completed"
  - name: "NoShow"
  - name: "Cancelled"
- name: "RoutePlanType"
  description: "Strategy used to route a shipment from origin to destination."
  data:
  - name: "Direct"
  - name: "MultiStop"
  - name: "Consolidated"
  - name: "CrossDocked"
  - name: "Transloaded"
- name: "TrackingEventType"
  description: "Type of visibility milestone or operational status update."
  data:
  - name: "Departed"
  - name: "Arrived"
  - name: "InTransit"
  - name: "Delayed"
  - name: "CustomsHold"
  - name: "CustomsReleased"
  - name: "ProofOfDelivery"
  - name: "Exception"
- name: "DocumentType"
  description: "Classification of a business document used in transportation."
  data:
  - name: "BillOfLading"
  - name: "ProofOfDelivery"
  - name: "AirWaybill"
  - name: "SeaWaybill"
  - name: "PackingList"
  - name: "CommercialInvoice"
  - name: "ExportDeclaration"
  - name: "ImportDeclaration"
  - name: "RateConfirmation"
- name: "FreightBillStatus"
  description: "Financial processing state of a carrier invoice."
  data:
  - name: "Open"
  - name: "Approved"
  - name: "Disputed"
  - name: "Paid"
  - name: "PartiallyPaid"
  - name: "Voided"
- name: "ChargeType"
  description: "Billing category of a charge on a freight bill."
  data:
  - name: "Linehaul"
  - name: "FuelSurcharge"
  - name: "Accessorial"
  - name: "Detention"
  - name: "Demurrage"
  - name: "Lumper"
  - name: "Toll"
  - name: "Other"
- name: "AccessorialType"
  description: "Type of non-linehaul service or fee applied to transportation."
  data:
  - name: "Detention"
  - name: "Liftgate"
  - name: "InsideDelivery"
  - name: "ResidentialDelivery"
  - name: "AppointmentFee"
  - name: "Reconsignment"
  - name: "AfterHours"
  - name: "HazardousMaterials"
  - name: "OversizeHandling"
- name: "ChargeBasis"
  description: "Unit basis for calculating a transportation charge."
  data:
  - name: "PerMile"
  - name: "PerKm"
  - name: "PerPound"
  - name: "PerKg"
  - name: "PerShipment"
  - name: "PerStop"
  - name: "Flat"
- name: "ChargeCalcMethod"
  description: "Method used to compute the monetary value of an accessorial."
  data:
  - name: "Flat"
  - name: "PerHour"
  - name: "PerDay"
  - name: "Percentage"
  - name: "PerStop"
  - name: "PerMile"
- name: "PaymentMethod"
  description: "Means by which a remittance is sent to settle a freight bill."
  data:
  - name: "ACH"
  - name: "WireTransfer"
  - name: "Check"
  - name: "CreditCard"
  - name: "VirtualCard"
  - name: "Cash"
- name: "ClaimType"
  description: "Nature of a claim filed against a shipment or invoice."
  data:
  - name: "Damage"
  - name: "Loss"
  - name: "Shortage"
  - name: "Delay"
  - name: "Overcharge"
- name: "ClaimStatus"
  description: "Processing state of a filed claim."
  data:
  - name: "Filed"
  - name: "UnderReview"
  - name: "Approved"
  - name: "Denied"
  - name: "Settled"
  - name: "Withdrawn"
- name: "PackagingType"
