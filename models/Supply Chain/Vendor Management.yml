---
metadata:
  name: "HCIDL Vendor Management Capabilities Model"
  description: "Canonical capabilities model for managing third-party vendors across\
    \ onboarding, risk, compliance, performance, and commercial relationships."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Supply Chain"
  type: "Capability"
  domain: "Vendor Management"
entities:
- name: "BuyingOrganization"
  description: "Enterprise that governs vendor policies, categories, and relationships."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "Url"
  relations:
  - name: "businessUnits"
    type: "BusinessUnit"
    multiplicity: "OneToMany"
  - name: "categories"
    type: "Category"
    multiplicity: "OneToMany"
  - name: "vendors"
    type: "Vendor"
    multiplicity: "OneToMany"
- name: "BusinessUnit"
  description: "Internal division consuming vendor products or services."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "organization"
    type: "BuyingOrganization"
    multiplicity: "ManyToOne"
  - name: "engagements"
    type: "VendorEngagement"
    multiplicity: "OneToMany"
- name: "Category"
  description: "Managed spend area used to segment vendors and oversight."
  data:
  - name: "name"
    type: "String"
  - name: "categoryType"
    type: "CategoryType"
  relations:
  - name: "organization"
    type: "BuyingOrganization"
    multiplicity: "ManyToOne"
  - name: "vendors"
    type: "Vendor"
    multiplicity: "ManyToMany"
  - name: "managers"
    type: "CategoryManager"
    multiplicity: "OneToMany"
- name: "CategoryManager"
  description: "Person accountable for strategy and performance within a category."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  relations:
  - name: "categories"
    type: "Category"
    multiplicity: "ManyToMany"
- name: "Vendor"
  description: "External party providing goods or services to the organization."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "vendorType"
    type: "VendorType"
  - name: "status"
    type: "VendorStatus"
  - name: "diversityClassification"
    type: "DiversityClassification"
  - name: "website"
    type: "Url"
  - name: "taxIdentifier"
    type: "TaxIdentifier"
  - name: "primaryAddress"
    type: "Address"
  relations:
  - name: "contacts"
    type: "VendorContact"
    multiplicity: "OneToMany"
  - name: "addresses"
    type: "VendorAddress"
    multiplicity: "OneToMany"
  - name: "bankAccounts"
    type: "VendorBankAccount"
    multiplicity: "OneToMany"
  - name: "insurancePolicies"
    type: "InsurancePolicy"
    multiplicity: "OneToMany"
  - name: "complianceDocuments"
    type: "ComplianceDocument"
    multiplicity: "OneToMany"
  - name: "certifications"
    type: "Certification"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "onboardingWorkflow"
    type: "OnboardingWorkflow"
    multiplicity: "OneToOne"
  - name: "contracts"
    type: "Contract"
    multiplicity: "OneToMany"
  - name: "scorecards"
    type: "PerformanceScorecard"
    multiplicity: "OneToMany"
  - name: "categories"
    type: "Category"
    multiplicity: "ManyToMany"
  - name: "questionnaireResponses"
    type: "QuestionnaireResponse"
    multiplicity: "OneToMany"
  - name: "engagements"
    type: "VendorEngagement"
    multiplicity: "OneToMany"
- name: "VendorContact"
  description: "Individual representing the vendor in commercial or operational matters."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "jobTitle"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  relations:
  - name: "vendor"
    type: "Vendor"
    multiplicity: "ManyToOne"
- name: "VendorAddress"
  description: "Classified address associated with a vendor."
  data:
  - name: "label"
    type: "String"
  - name: "addressType"
    type: "AddressType"
  - name: "address"
    type: "Address"
  relations:
  - name: "vendor"
    type: "Vendor"
    multiplicity: "ManyToOne"
- name: "VendorBankAccount"
  description: "Settlement account used for vendor payments."
  data:
  - name: "accountName"
    type: "String"
  - name: "bankName"
    type: "String"
  - name: "accountNumber"
    type: "String"
  - name: "swiftBic"
    type: "String"
  - name: "currency"
    type: "String"
  relations:
  - name: "vendor"
    type: "Vendor"
    multiplicity: "ManyToOne"
- name: "InsurancePolicy"
  description: "Insurance coverage maintained by the vendor."
  data:
  - name: "policyNumber"
    type: "String"
  - name: "coverageType"
    type: "InsuranceType"
  - name: "coverageAmount"
    type: "Money"
  - name: "expiryDate"
    type: "Date"
  - name: "insurerName"
    type: "String"
  relations:
  - name: "vendor"
    type: "Vendor"
    multiplicity: "ManyToOne"
- name: "ComplianceDocument"
  description: "Artifact evidencing compliance or legal standing."
  data:
  - name: "documentType"
    type: "DocumentType"
  - name: "title"
    type: "String"
  - name: "referenceNumber"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "status"
    type: "DocumentStatus"
  relations:
  - name: "vendor"
    type: "Vendor"
    multiplicity: "ManyToOne"
- name: "Certification"
  description: "Third-party certification attesting to standards conformity."
  data:
  - name: "certificationType"
    type: "CertificationType"
  - name: "issuingBody"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "status"
    type: "CertificationStatus"
  relations:
  - name: "vendor"
    type: "Vendor"
    multiplicity: "ManyToOne"
- name: "RiskAssessment"
  description: "Structured evaluation of a vendor’s risk profile."
  data:
  - name: "name"
    type: "String"
  - name: "assessmentType"
    type: "AssessmentType"
  - name: "assessmentDate"
    type: "Date"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "reviewer"
    type: "String"
  relations:
  - name: "vendor"
    type: "Vendor"
    multiplicity: "ManyToOne"
  - name: "issues"
    type: "RiskIssue"
    multiplicity: "OneToMany"
- name: "RiskIssue"
  description: "Specific finding identified during risk evaluation."
  data:
  - name: "title"
    type: "String"
  - name: "severity"
    type: "RiskSeverity"
  - name: "status"
    type: "IssueStatus"
  - name: "remediationDueDate"
    type: "Date"
  relations:
  - name: "vendor"
    type: "Vendor"
    multiplicity: "ManyToOne"
  - name: "assessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
- name: "OnboardingWorkflow"
  description: "Coordinated set of tasks required to activate a vendor."
  data:
  - name: "initiatedDate"
    type: "Date"
  - name: "status"
    type: "OnboardingStatus"
  - name: "completionDate"
    type: "Date"
  relations:
  - name: "vendor"
    type: "Vendor"
    multiplicity: "OneToOne"
  - name: "tasks"
    type: "OnboardingTask"
    multiplicity: "OneToMany"
- name: "OnboardingTask"
  description: "Actionable step within the onboarding workflow."
  data:
  - name: "taskName"
    type: "String"
  - name: "taskType"
    type: "OnboardingTaskType"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "TaskStatus_"
  - name: "owner"
    type: "String"
  relations:
  - name: "workflow"
    type: "OnboardingWorkflow"
    multiplicity: "ManyToOne"
- name: "Contract"
  description: "Binding commercial agreement defining terms with a vendor."
  data:
  - name: "contractNumber"
    type: "String"
  - name: "contractType"
    type: "ContractType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "ContractStatus"
  - name: "totalValue"
    type: "Money"
  relations:
  - name: "vendor"
    type: "Vendor"
    multiplicity: "ManyToOne"
  - name: "serviceLevelAgreements"
    type: "ServiceLevelAgreement"
    multiplicity: "OneToMany"
  - name: "statementsOfWork"
    type: "StatementOfWork"
    multiplicity: "OneToMany"
  - name: "paymentTerm"
    type: "PaymentTerm"
    multiplicity: "ManyToOne"
- name: "ServiceLevelAgreement"
  description: "Measurable service commitments and remedies."
  data:
  - name: "name"
    type: "String"
  - name: "serviceLevelType"
    type: "ServiceLevelType"
  - name: "threshold"
    type: "Decimal"
  - name: "measurementUnit"
    type: "String"
  - name: "penaltyTerms"
    type: "String"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
- name: "StatementOfWork"
  description: "Detailed scope, deliverables, and pricing under a master contract."
  data:
  - name: "sowNumber"
    type: "String"
  - name: "title"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
- name: "PerformanceScorecard"
  description: "Periodic evaluation of vendor results against targets."
  data:
  - name: "periodStartDate"
    type: "Date"
  - name: "periodEndDate"
    type: "Date"
  - name: "overallScore"
    type: "Decimal"
  relations:
  - name: "vendor"
    type: "Vendor"
    multiplicity: "ManyToOne"
  - name: "metrics"
    type: "PerformanceMetric"
    multiplicity: "OneToMany"
- name: "PerformanceMetric"
  description: "Quantitative indicator supporting scorecard evaluation."
  data:
  - name: "name"
    type: "String"
  - name: "target"
    type: "Decimal"
  - name: "actual"
    type: "Decimal"
  - name: "unit"
    type: "String"
  relations:
  - name: "scorecard"
    type: "PerformanceScorecard"
    multiplicity: "ManyToOne"
- name: "PaymentTerm"
  description: "Standard conditions governing payment timing and discounts."
  data:
  - name: "name"
    type: "String"
  - name: "days"
    type: "Integer"
  - name: "discountPercent"
    type: "Decimal"
  relations:
  - name: "vendors"
    type: "Vendor"
    multiplicity: "ManyToMany"
  - name: "contracts"
    type: "Contract"
    multiplicity: "OneToMany"
- name: "VendorEngagement"
  description: "Contextual relationship between a business unit and a vendor."
  data:
  - name: "purpose"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "status"
    type: "EngagementStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "vendor"
    type: "Vendor"
    multiplicity: "ManyToOne"
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "primaryContact"
    type: "VendorContact"
    multiplicity: "ManyToOne"
  - name: "primaryContract"
    type: "Contract"
    multiplicity: "ManyToOne"
- name: "QuestionnaireResponse"
  description: "Vendor-submitted answers to due diligence questionnaires."
  data:
  - name: "questionnaireName"
    type: "String"
  - name: "submissionDate"
    type: "Date"
  - name: "status"
    type: "ResponseStatus"
  - name: "score"
    type: "Decimal"
  relations:
  - name: "vendor"
    type: "Vendor"
    multiplicity: "ManyToOne"
  - name: "assessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
enums:
- name: "VendorType"
  description: "Classification of the vendor’s primary offering."
  data:
  - name: "Goods"
  - name: "Services"
  - name: "SaaS"
  - name: "Consulting"
  - name: "Outsourcing"
  - name: "Contractor"
- name: "VendorStatus"
  description: "Lifecycle state of a vendor within the organization."
  data:
  - name: "Prospect"
  - name: "Onboarding"
  - name: "Active"
  - name: "UnderReview"
  - name: "Suspended"
  - name: "Terminated"
- name: "DiversityClassification"
  description: "Supplier diversity designation for reporting and programs."
  data:
  - name: "None"
  - name: "SmallBusiness"
  - name: "MinorityOwned"
  - name: "WomenOwned"
  - name: "VeteranOwned"
  - name: "DisabledOwned"
  - name: "LGBTQOwned"
- name: "AddressType"
  description: "Usage classification for a vendor address."
  data:
  - name: "Headquarters"
  - name: "RemitTo"
  - name: "ShipFrom"
  - name: "ServiceLocation"
  - name: "Billing"
- name: "DocumentType"
  description: "Types of documents used in vendor governance and compliance."
  data:
  - name: "NDA"
  - name: "MSA"
  - name: "SOW"
  - name: "InsuranceCertificate"
  - name: "TaxFormW9"
  - name: "TaxFormW8"
  - name: "PrivacyPolicy"
  - name: "SecurityReport"
- name: "DocumentStatus"
  description: "Approval and validity state for submitted documents."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Expired"
- name: "CertificationType"
  description: "Recognized standards and attestations relevant to vendors."
  data:
  - name: "ISO9001"
  - name: "ISO27001"
  - name: "SOC2Type2"
  - name: "PCI_DSS"
  - name: "HIPAA_BAA"
- name: "CertificationStatus"
  description: "Validity state of a certification."
  data:
  - name: "Valid"
  - name: "ExpiringSoon"
  - name: "Expired"
  - name: "Revoked"
- name: "RiskLevel"
  description: "Overall inherent or residual risk rating."
  data:
  - name: "Low"
  - name: "Moderate"
  - name: "High"
  - name: "Critical"
- name: "RiskSeverity"
  description: "Impact priority for an individual issue or finding."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "IssueStatus"
  description: "Tracking state for remediation of an issue."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "Resolved"
  - name: "Closed"
  - name: "Deferred"
- name: "AssessmentType"
  description: "Domain focus of a vendor risk assessment."
  data:
  - name: "Security"
  - name: "Financial"
  - name: "Compliance"
  - name: "Privacy"
  - name: "ESG"
  - name: "BusinessContinuity"
- name: "OnboardingStatus"
  description: "Progress state of the vendor onboarding workflow."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "OnboardingTaskType"
  description: "Common task categories executed during onboarding."
  data:
  - name: "IdentityVerification"
  - name: "TaxValidation"
  - name: "InsuranceVerification"
  - name: "SecurityQuestionnaire"
  - name: "BankValidation"
  - name: "ContractExecution"
- name: "TaskStatus_"
  description: "Execution state for a workflow task."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Blocked"
  - name: "Completed"
  - name: "Cancelled"
- name: "ContractType"
  description: "Commercial agreement structures used with vendors."
  data:
  - name: "MSA"
  - name: "SOW"
  - name: "License"
  - name: "Subscription"
  - name: "ServiceAgreement"
- name: "ContractStatus"
  description: "Lifecycle state of a contract."
  data:
  - name: "Draft"
  - name: "Negotiation"
  - name: "Executed"
  - name: "Active"
  - name: "Suspended"
  - name: "Expired"
  - name: "Terminated"
- name: "ServiceLevelType"
  description: "Category of service performance being measured."
  data:
  - name: "Availability"
  - name: "ResponseTime"
  - name: "ResolutionTime"
  - name: "Quality"
  - name: "Delivery"
  - name: "Accuracy"
- name: "CategoryType"
  description: "Procurement taxonomy segment used for vendor grouping."
  data:
  - name: "Direct"
  - name: "Indirect"
  - name: "Services"
  - name: "IT"
  - name: "Marketing"
  - name: "Facilities"
- name: "EngagementStatus"
  description: "Operational state of a business unit’s engagement with a vendor."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "InsuranceType"
  description: "Insurance coverage categories commonly required of vendors."
  data:
  - name: "GeneralLiability"
  - name: "ProfessionalLiability"
  - name: "CyberLiability"
  - name: "WorkersCompensation"
  - name: "AutoLiability"
  - name: "EmployersLiability"
- name: "ResponseStatus"
  description: "Processing state for a submitted questionnaire response."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "UnderReview"
  - name: "Approved"
  - name: "Rejected"
valueObjects:
- name: "Money"
  description: "Monetary value expressed as an amount and currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address for physical or mailing purposes."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "EmailAddress"
  description: "Electronic mail address for contacting a person or organization."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "International telephone number with optional extension."
  data:
  - name: "countryCode"
    type: "String"
  - name: "number"
    type: "String"
  - name: "extension"
    type: "String"
- name: "TaxIdentifier"
  description: "Jurisdictional tax registration reference."
  data:
  - name: "value"
    type: "String"
  - name: "country"
    type: "String"
- name: "Url"
  description: "Web address pointing to an external resource."
  data:
  - name: "value"
    type: "String"
