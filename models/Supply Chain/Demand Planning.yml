---
metadata:
  name: "Demand Planning Capabilities Model"
  description: "Canonical capability model for demand planning encompassing product,\
    \ location, time, scenario, forecasting, promotions, causal events, overrides,\
    \ and consensus processes."
  version: "1.0.0"
  industry: "Supply Chain"
  category: "Supply Chain"
  type: "Capability"
  domain: "Demand Planning"
entities:
- name: "Product"
  description: "Forecastable item or SKU managed within the demand planning process."
  data:
  - name: "name"
    type: "String"
  - name: "sku"
    type: "String"
  - name: "unitOfMeasure"
    type: "UnitOfMeasureCode"
  - name: "lifeCyclePhase"
    type: "LifeCyclePhase"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "category"
    type: "ProductCategory"
    multiplicity: "ManyToOne"
  - name: "seasonalityProfile"
    type: "SeasonalityProfile"
    multiplicity: "ManyToOne"
  - name: "supersededBy"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "demandSignals"
    type: "DemandSignal"
    multiplicity: "OneToMany"
  - name: "forecastSeries"
    type: "ForecastSeries"
    multiplicity: "OneToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
  - name: "causalEvents"
    type: "CausalEvent"
    multiplicity: "ManyToMany"
- name: "ProductCategory"
  description: "Hierarchical grouping used for product rollups, governance, and model\
    \ assignments."
  data:
  - name: "name"
    type: "String"
  - name: "categoryCode"
    type: "String"
  - name: "level"
    type: "Integer"
  relations:
  - name: "parentCategory"
    type: "ProductCategory"
    multiplicity: "ManyToOne"
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
- name: "Location"
  description: "Physical or logical place where demand occurs or is recorded."
  data:
  - name: "name"
    type: "String"
  - name: "locationCode"
    type: "String"
  - name: "country"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "locationType"
    type: "LocationType"
  relations:
  - name: "parentLocation"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "demandSignals"
    type: "DemandSignal"
    multiplicity: "OneToMany"
  - name: "forecastSeries"
    type: "ForecastSeries"
    multiplicity: "OneToMany"
  - name: "assortments"
    type: "Assortment"
    multiplicity: "OneToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
  - name: "causalEvents"
    type: "CausalEvent"
    multiplicity: "ManyToMany"
- name: "Channel"
  description: "Route to market or sales channel through which demand is captured."
  data:
  - name: "name"
    type: "String"
  - name: "channelCode"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "demandSignals"
    type: "DemandSignal"
    multiplicity: "OneToMany"
  - name: "forecastSeries"
    type: "ForecastSeries"
    multiplicity: "OneToMany"
  - name: "assortments"
    type: "Assortment"
    multiplicity: "OneToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
  - name: "causalEvents"
    type: "CausalEvent"
    multiplicity: "ManyToMany"
- name: "CustomerSegment"
  description: "Grouping of customers with similar demand behavior used for planning."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "demandSignals"
    type: "DemandSignal"
    multiplicity: "OneToMany"
  - name: "forecastSeries"
    type: "ForecastSeries"
    multiplicity: "OneToMany"
- name: "PlanningCalendar"
  description: "Calendar defining planning buckets and alignment for all time-based\
    \ measures."
  data:
  - name: "name"
    type: "String"
  - name: "bucketType"
    type: "BucketType"
  - name: "weekStartDay"
    type: "String"
  relations:
  - name: "periods"
    type: "PlanningPeriod"
    multiplicity: "OneToMany"
  - name: "forecastVersions"
    type: "ForecastVersion"
    multiplicity: "OneToMany"
  - name: "forecastModels"
    type: "ForecastModel"
    multiplicity: "OneToMany"
- name: "PlanningPeriod"
  description: "Discrete time bucket with start and end dates used for demand and\
    \ forecast alignment."
  data:
  - name: "periodLabel"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "sequence"
    type: "Integer"
  relations:
  - name: "calendar"
    type: "PlanningCalendar"
    multiplicity: "ManyToOne"
  - name: "demandSignals"
    type: "DemandSignal"
    multiplicity: "OneToMany"
  - name: "forecastPoints"
    type: "ForecastPoint"
    multiplicity: "OneToMany"
- name: "DemandSignal"
  description: "Historical demand observation used as input to forecasting."
  data:
  - name: "signalType"
    type: "DemandSignalType"
  - name: "quantity"
    type: "Decimal"
  - name: "revenue"
    type: "CurrencyAmount"
  - name: "capturedOn"
    type: "Date"
  - name: "sourceSystem"
    type: "String"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "customerSegment"
    type: "CustomerSegment"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "PlanningPeriod"
    multiplicity: "ManyToOne"
- name: "ForecastModel"
  description: "Statistical configuration used to generate baseline forecasts."
  data:
  - name: "name"
    type: "String"
  - name: "method"
    type: "ForecastMethod"
  - name: "horizonBuckets"
    type: "Integer"
  - name: "usesExternalCausals"
    type: "Boolean"
  relations:
  - name: "calendar"
    type: "PlanningCalendar"
    multiplicity: "ManyToOne"
  - name: "productCategory"
    type: "ProductCategory"
    multiplicity: "ManyToOne"
  - name: "forecastSeries"
    type: "ForecastSeries"
    multiplicity: "OneToMany"
- name: "ForecastScenario"
  description: "What-if planning context combining drivers such as promotions and\
    \ events."
  data:
  - name: "name"
    type: "String"
  - name: "scenarioType"
    type: "ScenarioType"
  - name: "description"
    type: "String"
  relations:
  - name: "versions"
    type: "ForecastVersion"
    multiplicity: "OneToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
  - name: "causalEvents"
    type: "CausalEvent"
    multiplicity: "ManyToMany"
- name: "ForecastVersion"
  description: "Time-stamped snapshot of a forecast within a scenario."
  data:
  - name: "versionName"
    type: "String"
  - name: "createdOn"
    type: "Date"
  - name: "status"
    type: "ForecastStatus"
  relations:
  - name: "scenario"
    type: "ForecastScenario"
    multiplicity: "ManyToOne"
  - name: "calendar"
    type: "PlanningCalendar"
    multiplicity: "ManyToOne"
  - name: "series"
    type: "ForecastSeries"
    multiplicity: "OneToMany"
  - name: "accuracyRecords"
    type: "ForecastAccuracyRecord"
    multiplicity: "OneToMany"
- name: "ForecastSeries"
  description: "Logical forecast at a defined level of the product, location, and\
    \ channel hierarchy."
  data:
  - name: "measure"
    type: "MeasureType"
  - name: "aggregationLevel"
    type: "AggregationLevel"
  - name: "unitOfMeasure"
    type: "UnitOfMeasureCode"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "customerSegment"
    type: "CustomerSegment"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "ForecastVersion"
    multiplicity: "ManyToOne"
  - name: "points"
    type: "ForecastPoint"
    multiplicity: "OneToMany"
  - name: "model"
    type: "ForecastModel"
    multiplicity: "ManyToOne"
  - name: "overrides"
    type: "ForecastOverride"
    multiplicity: "OneToMany"
- name: "ForecastPoint"
  description: "Single forecasted value for a specific planning period with uncertainty\
    \ bounds."
  data:
  - name: "forecastValue"
    type: "Decimal"
  - name: "lowerBound"
    type: "Decimal"
  - name: "upperBound"
    type: "Decimal"
  relations:
  - name: "series"
    type: "ForecastSeries"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "PlanningPeriod"
    multiplicity: "ManyToOne"
- name: "ForecastOverride"
  description: "Planner adjustment applied to a forecast series for a given scope\
    \ and period."
  data:
  - name: "reason"
    type: "OverrideReason"
  - name: "valueChange"
    type: "Decimal"
  - name: "notes"
    type: "String"
  - name: "createdOn"
    type: "Date"
  relations:
  - name: "series"
    type: "ForecastSeries"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "PlanningPeriod"
    multiplicity: "ManyToOne"
  - name: "appliedBy"
    type: "Planner"
    multiplicity: "ManyToOne"
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "causalEvent"
    type: "CausalEvent"
    multiplicity: "ManyToOne"
- name: "Promotion"
  description: "Planned commercial activity intended to uplift demand."
  data:
  - name: "name"
    type: "String"
  - name: "mechanic"
    type: "PromotionMechanic"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "expectedUplift"
    type: "Percentage"
  relations:
  - name: "products"
    type: "Product"
    multiplicity: "ManyToMany"
  - name: "locations"
    type: "Location"
    multiplicity: "ManyToMany"
  - name: "channels"
    type: "Channel"
    multiplicity: "ManyToMany"
  - name: "scenarios"
    type: "ForecastScenario"
    multiplicity: "ManyToMany"
  - name: "overrides"
    type: "ForecastOverride"
    multiplicity: "OneToMany"
- name: "CausalEvent"
  description: "External or internal causal factor influencing demand beyond baseline."
  data:
  - name: "name"
    type: "String"
  - name: "causalType"
    type: "CausalType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "impactDirection"
    type: "ImpactDirection"
  - name: "expectedImpact"
    type: "Percentage"
  relations:
  - name: "products"
    type: "Product"
    multiplicity: "ManyToMany"
  - name: "locations"
    type: "Location"
    multiplicity: "ManyToMany"
  - name: "channels"
    type: "Channel"
    multiplicity: "ManyToMany"
  - name: "scenarios"
    type: "ForecastScenario"
    multiplicity: "ManyToMany"
  - name: "overrides"
    type: "ForecastOverride"
    multiplicity: "OneToMany"
- name: "SeasonalityProfile"
  description: "Set of seasonal indices applied to normalize or amplify demand by\
    \ period."
  data:
  - name: "name"
    type: "String"
  - name: "seasonalityType"
    type: "SeasonalityType"
  - name: "description"
    type: "String"
  relations:
  - name: "indices"
    type: "SeasonalityIndex"
    multiplicity: "OneToMany"
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
- name: "SeasonalityIndex"
  description: "Period-specific index representing relative seasonal impact."
  data:
  - name: "periodNumber"
    type: "Integer"
  - name: "index"
    type: "Decimal"
  relations:
  - name: "profile"
    type: "SeasonalityProfile"
    multiplicity: "ManyToOne"
- name: "Assortment"
  description: "Range of products active at a location and channel during a defined\
    \ window."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "products"
    type: "Product"
    multiplicity: "ManyToMany"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
- name: "NewProductIntroduction"
  description: "Planning construct for launching a new product using seeding or like\
    \ modeling."
  data:
  - name: "launchDate"
    type: "Date"
  - name: "strategy"
    type: "NpiStrategy"
  - name: "targetInitialWeeks"
    type: "Integer"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "referenceProduct"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "ConsensusMeeting"
  description: "S&OP/IBP forum to review forecasts and agree on a consensus version."
  data:
  - name: "name"
    type: "String"
  - name: "meetingDate"
    type: "Date"
  - name: "status"
    type: "ConsensusStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "participants"
    type: "Planner"
    multiplicity: "ManyToMany"
  - name: "reviewedVersions"
    type: "ForecastVersion"
    multiplicity: "ManyToMany"
  - name: "decisions"
    type: "ConsensusDecision"
    multiplicity: "OneToMany"
- name: "ConsensusDecision"
  description: "Recorded outcome from a consensus meeting regarding scenarios or versions."
  data:
  - name: "decisionType"
    type: "ConsensusDecisionType"
  - name: "comment"
    type: "String"
  relations:
  - name: "meeting"
    type: "ConsensusMeeting"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "ForecastVersion"
    multiplicity: "ManyToOne"
  - name: "approvedScenario"
    type: "ForecastScenario"
    multiplicity: "ManyToOne"
- name: "Planner"
  description: "Person accountable for creating and maintaining demand plans."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "PlannerRole"
  relations:
  - name: "overrides"
    type: "ForecastOverride"
    multiplicity: "OneToMany"
  - name: "meetings"
    type: "ConsensusMeeting"
    multiplicity: "ManyToMany"
- name: "ForecastAccuracyRecord"
  description: "Accuracy and bias metrics calculated by comparing forecast to actuals."
  data:
  - name: "mape"
    type: "Percentage"
  - name: "bias"
    type: "Percentage"
  - name: "rmse"
    type: "Decimal"
  - name: "evaluationWindow"
    type: "Integer"
  relations:
  - name: "version"
    type: "ForecastVersion"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "customerSegment"
    type: "CustomerSegment"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "PlanningPeriod"
    multiplicity: "ManyToOne"
- name: "ReconciliationPolicy"
  description: "Rule defining how forecasts are aligned across hierarchy levels."
  data:
  - name: "name"
    type: "String"
  - name: "method"
    type: "ReconciliationMethod"
  - name: "description"
    type: "String"
  relations:
  - name: "calendar"
    type: "PlanningCalendar"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "ForecastVersion"
    multiplicity: "ManyToMany"
enums:
- name: "BucketType"
  description: "Time granularity used to define planning periods."
  data:
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Yearly"
- name: "DemandSignalType"
  description: "Classification of historical demand input used for forecasting."
  data:
  - name: "Shipments"
  - name: "Orders"
  - name: "POS"
  - name: "Returns"
  - name: "Backorders"
  - name: "WebTraffic"
- name: "ForecastMethod"
  description: "Algorithmic approach employed by the forecasting model."
  data:
  - name: "Naive"
  - name: "MovingAverage"
  - name: "ExponentialSmoothing"
  - name: "ARIMA"
  - name: "Croston"
  - name: "MachineLearning"
- name: "ForecastStatus"
  description: "Lifecycle state of a forecast version."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Approved"
  - name: "Archived"
  - name: "Rejected"
- name: "MeasureType"
  description: "Quantitative dimension captured or forecasted by the series."
  data:
  - name: "Units"
  - name: "Revenue"
  - name: "GrossMargin"
  - name: "Cases"
- name: "LifeCyclePhase"
  description: "Commercial lifecycle stage of a product."
  data:
  - name: "Introduction"
  - name: "Growth"
  - name: "Maturity"
  - name: "Decline"
  - name: "EndOfLife"
- name: "PromotionMechanic"
  description: "Primary promotional tactic expected to drive uplift."
  data:
  - name: "Discount"
  - name: "BOGO"
  - name: "DisplayOnly"
  - name: "FeatureAd"
  - name: "Bundle"
- name: "OverrideReason"
  description: "Justification for manual changes to forecast values."
  data:
  - name: "PlannerJudgment"
  - name: "PromotionUplift"
  - name: "PriceChange"
  - name: "StockoutCorrection"
  - name: "NewInformation"
  - name: "EventAdjustment"
- name: "ScenarioType"
  description: "High-level classification of a planning scenario."
  data:
  - name: "Base"
  - name: "Optimistic"
  - name: "Pessimistic"
  - name: "WhatIf"
- name: "AggregationLevel"
  description: "Hierarchical level at which a forecast is expressed."
  data:
  - name: "SKU"
  - name: "ProductCategory"
  - name: "Location"
  - name: "Region"
  - name: "Channel"
  - name: "CustomerSegment"
  - name: "Global"
- name: "LocationType"
  description: "Nature of location where demand is planned or observed."
  data:
  - name: "Store"
  - name: "DistributionCenter"
  - name: "Region"
  - name: "Country"
  - name: "Online"
- name: "CausalType"
  description: "Category of causal factor that influences demand."
  data:
  - name: "Holiday"
  - name: "Weather"
  - name: "PriceChange"
  - name: "CompetitorAction"
  - name: "MarketingCampaign"
  - name: "PublicEvent"
- name: "ImpactDirection"
  description: "Expected directional effect of a causal driver on demand."
  data:
  - name: "Positive"
  - name: "Negative"
  - name: "Neutral"
- name: "SeasonalityType"
  description: "Pattern structure used to index recurring seasonal effects."
  data:
  - name: "Weekly"
  - name: "Monthly"
  - name: "SeasonalEvent"
  - name: "Custom"
- name: "NpiStrategy"
  description: "Approach used to seed demand for a new product introduction."
  data:
  - name: "LikeModeling"
  - name: "AttributeCloning"
  - name: "ProportionalToCategory"
  - name: "Manual"
- name: "ConsensusStatus"
  description: "Status of a consensus meeting session."
  data:
  - name: "Scheduled"
  - name: "InProgress"
  - name: "Completed"
- name: "ConsensusDecisionType"
  description: "Outcome category associated with a consensus decision."
  data:
  - name: "Approve"
  - name: "Reject"
  - name: "RequestChanges"
  - name: "SelectScenario"
- name: "PlannerRole"
  description: "Role within the demand planning organization."
  data:
  - name: "DemandPlanner"
  - name: "Manager"
  - name: "Analyst"
  - name: "Executive"
- name: "ReconciliationMethod"
  description: "Technique used to align forecasts across hierarchy levels."
  data:
  - name: "TopDown"
  - name: "BottomUp"
  - name: "MiddleOut"
  - name: "ProportionalByHistory"
  - name: "StatisticalOptimized"
valueObjects:
- name: "UnitOfMeasureCode"
  description: "Canonical unit code used to interpret quantities consistently across\
    \ the plan."
  data:
  - name: "code"
    type: "String"
- name: "CurrencyAmount"
  description: "Monetary value represented with an explicit currency for financial\
    \ measures."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "DateRange"
  description: "Continuous date interval with inclusive start and end used for planning\
    \ windows."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "Percentage"
  description: "Proportional value expressed as a percent for impacts, uplift, and\
    \ accuracy."
  data:
  - name: "value"
    type: "Decimal"
