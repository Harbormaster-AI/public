---
metadata:
  name: "Warehouse Management HCIDL"
  description: "Canonical capability model for Warehouse Management within the supply\
    \ chain domain, covering inbound, storage, handling, inventory control, and outbound\
    \ processes."
  version: "1.0.0"
  industry: "Logistics and Supply Chain"
  category: "Supply Chain"
  type: "Capability"
  domain: "Warehouse Management"
entities:
- name: "WarehouseOperator"
  description: "Business entity that owns or manages one or more warehouse facilities."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "warehouses"
    type: "Warehouse"
    multiplicity: "OneToMany"
  - name: "carriers"
    type: "Carrier"
    multiplicity: "ManyToMany"
  - name: "workers"
    type: "Worker"
    multiplicity: "OneToMany"
- name: "Carrier"
  description: "Transportation company responsible for moving goods into or out of\
    \ the warehouse."
  data:
  - name: "name"
    type: "String"
  - name: "scac"
    type: "String"
  - name: "contactPhone"
    type: "String"
  relations:
  - name: "operators"
    type: "WarehouseOperator"
    multiplicity: "ManyToMany"
  - name: "inboundShipments"
    type: "InboundShipment"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "dockAppointments"
    type: "DockAppointment"
    multiplicity: "OneToMany"
- name: "Warehouse"
  description: "Physical facility used for receiving, storing, handling, and shipping\
    \ goods."
  data:
  - name: "name"
    type: "String"
  - name: "warehouseCode"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "operator_"
    type: "WarehouseOperator"
    multiplicity: "ManyToOne"
  - name: "zones"
    type: "Zone"
    multiplicity: "OneToMany"
  - name: "docks"
    type: "Dock"
    multiplicity: "OneToMany"
  - name: "storageLocations"
    type: "StorageLocation"
    multiplicity: "OneToMany"
  - name: "inventoryPositions"
    type: "InventoryPosition"
    multiplicity: "OneToMany"
  - name: "workers"
    type: "Worker"
    multiplicity: "OneToMany"
  - name: "inboundShipments"
    type: "InboundShipment"
    multiplicity: "OneToMany"
  - name: "outboundOrders"
    type: "OutboundOrder"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "appointments"
    type: "DockAppointment"
    multiplicity: "OneToMany"
  - name: "equipment"
    type: "Equipment"
    multiplicity: "OneToMany"
  - name: "cycleCountPlans"
    type: "CycleCountPlan"
    multiplicity: "OneToMany"
  - name: "slottingPlans"
    type: "SlottingPlan"
    multiplicity: "OneToMany"
- name: "Zone"
  description: "Logical area within a warehouse used to group locations by process,\
    \ temperature, or handling characteristics."
  data:
  - name: "name"
    type: "String"
  - name: "zoneType"
    type: "ZoneType"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "aisles"
    type: "Aisle"
    multiplicity: "OneToMany"
  - name: "storageLocations"
    type: "StorageLocation"
    multiplicity: "OneToMany"
- name: "Aisle"
  description: "Passage within a zone used to organize storage locations for accessibility\
    \ and flow."
  data:
  - name: "label"
    type: "String"
  relations:
  - name: "zone"
    type: "Zone"
    multiplicity: "ManyToOne"
  - name: "storageLocations"
    type: "StorageLocation"
    multiplicity: "OneToMany"
- name: "StorageLocation"
  description: "Specific bin, slot, or area where inventory or handling units are\
    \ stored."
  data:
  - name: "locationCode"
    type: "String"
  - name: "locationType"
    type: "LocationType"
  - name: "maxCapacity"
    type: "Decimal"
  - name: "capacityUom"
    type: "UnitOfMeasure"
  relations:
  - name: "zone"
    type: "Zone"
    multiplicity: "ManyToOne"
  - name: "aisle"
    type: "Aisle"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "inventoryPositions"
    type: "InventoryPosition"
    multiplicity: "OneToMany"
  - name: "handlingUnits"
    type: "HandlingUnit"
    multiplicity: "OneToMany"
- name: "Item"
  description: "Stock keeping unit (SKU) master defining attributes used for storage\
    \ and fulfillment."
  data:
  - name: "sku"
    type: "String"
  - name: "description"
    type: "String"
  - name: "baseUom"
    type: "UnitOfMeasure"
  - name: "weight"
    type: "Weight"
  - name: "dimensions"
    type: "Dimensions"
  - name: "shelfLifeDays"
    type: "Integer"
  relations:
  - name: "inventoryPositions"
    type: "InventoryPosition"
    multiplicity: "OneToMany"
  - name: "lots"
    type: "Lot"
    multiplicity: "OneToMany"
  - name: "serializedItems"
    type: "SerializedItem"
    multiplicity: "OneToMany"
  - name: "inboundShipmentLines"
    type: "InboundShipmentLine"
    multiplicity: "OneToMany"
  - name: "outboundOrderLines"
    type: "OutboundOrderLine"
    multiplicity: "OneToMany"
  - name: "receiptLines"
    type: "ReceiptLine"
    multiplicity: "OneToMany"
  - name: "shipmentLines"
    type: "ShipmentLine"
    multiplicity: "OneToMany"
- name: "Lot"
  description: "Batch or lot identifier used for traceability and expiration control."
  data:
  - name: "lotNumber"
    type: "String"
  - name: "manufactureDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "inventoryPositions"
    type: "InventoryPosition"
    multiplicity: "OneToMany"
  - name: "receiptLines"
    type: "ReceiptLine"
    multiplicity: "OneToMany"
  - name: "cycleCountLines"
    type: "CycleCountLine"
    multiplicity: "OneToMany"
  - name: "shipmentLines"
    type: "ShipmentLine"
    multiplicity: "OneToMany"
- name: "SerializedItem"
  description: "Individually identifiable unit tracked by a unique serial number."
  data:
  - name: "serialNumber"
    type: "String"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "inventoryPosition"
    type: "InventoryPosition"
    multiplicity: "ManyToOne"
  - name: "handlingUnit"
    type: "HandlingUnit"
    multiplicity: "ManyToOne"
- name: "HandlingUnit"
  description: "Physical logistics unit such as a pallet, carton, or tote that can\
    \ contain items and other handling units."
  data:
  - name: "huNumber"
    type: "String"
  - name: "handlingUnitType"
    type: "HandlingUnitType"
  - name: "weight"
    type: "Weight"
  - name: "dimensions"
    type: "Dimensions"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "parentHandlingUnit"
    type: "HandlingUnit"
    multiplicity: "ManyToOne"
  - name: "childHandlingUnits"
    type: "HandlingUnit"
    multiplicity: "OneToMany"
  - name: "storageLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "receiptLines"
    type: "ReceiptLine"
    multiplicity: "OneToMany"
  - name: "pickTasks"
    type: "PickTask"
    multiplicity: "OneToMany"
  - name: "inventoryPositions"
    type: "InventoryPosition"
    multiplicity: "OneToMany"
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
- name: "InventoryPosition"
  description: "Quantitative record of an item at a location with an optional lot\
    \ or serial association."
  data:
  - name: "quantityOnHand"
    type: "Decimal"
  - name: "quantityAllocated"
    type: "Decimal"
  - name: "status"
    type: "InventoryStatus"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "storageLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "serializedItems"
    type: "SerializedItem"
    multiplicity: "OneToMany"
  - name: "handlingUnit"
    type: "HandlingUnit"
    multiplicity: "ManyToOne"
  - name: "holds"
    type: "InventoryHold"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "InventoryTransaction"
    multiplicity: "OneToMany"
- name: "InventoryTransaction"
  description: "Audit record of an inventory movement or adjustment."
  data:
  - name: "transactionNumber"
    type: "String"
  - name: "transactionType"
    type: "InventoryTransactionType"
  - name: "quantity"
    type: "Decimal"
  - name: "transactionDate"
    type: "Date"
  - name: "reference"
    type: "String"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "fromLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "toLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "handlingUnit"
    type: "HandlingUnit"
    multiplicity: "ManyToOne"
  - name: "inventoryPosition"
    type: "InventoryPosition"
    multiplicity: "ManyToOne"
- name: "InboundShipment"
  description: "Advance shipment notice or expected inbound delivery to the warehouse."
  data:
  - name: "asnNumber"
    type: "String"
  - name: "status"
    type: "InboundShipmentStatus"
  - name: "expectedArrivalDate"
    type: "Date"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "inboundShipmentLines"
    type: "InboundShipmentLine"
    multiplicity: "OneToMany"
  - name: "receipts"
    type: "Receipt"
    multiplicity: "OneToMany"
  - name: "dockAppointment"
    type: "DockAppointment"
    multiplicity: "ManyToOne"
- name: "InboundShipmentLine"
  description: "Line detail of an inbound shipment specifying item and expected quantity."
  data:
  - name: "lineNumber"
    type: "String"
  - name: "expectedQuantity"
    type: "Decimal"
  relations:
  - name: "inboundShipment"
    type: "InboundShipment"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
- name: "Receipt"
  description: "Confirmed record of goods received into the warehouse."
  data:
  - name: "receiptNumber"
    type: "String"
  - name: "receivedDate"
    type: "Date"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "inboundShipment"
    type: "InboundShipment"
    multiplicity: "ManyToOne"
  - name: "receiptLines"
    type: "ReceiptLine"
    multiplicity: "OneToMany"
  - name: "qualityInspections"
    type: "QualityInspection"
    multiplicity: "OneToMany"
- name: "ReceiptLine"
  description: "Item-level receipt confirmation including quantities and storage context."
  data:
  - name: "quantityReceived"
    type: "Decimal"
  - name: "overageShortageReason"
    type: "String"
  relations:
  - name: "receipt"
    type: "Receipt"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "handlingUnit"
    type: "HandlingUnit"
    multiplicity: "ManyToOne"
  - name: "storageLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
- name: "PutawayTask"
  description: "Directed activity to move received goods to a designated storage location."
  data:
  - name: "taskNumber"
    type: "String"
  - name: "status"
    type: "TaskStatus_"
  - name: "priority"
    type: "Integer"
  - name: "putawayStrategy"
    type: "PutawayStrategy"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "fromLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "toLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "handlingUnit"
    type: "HandlingUnit"
    multiplicity: "ManyToOne"
  - name: "assignedWorker"
    type: "Worker"
    multiplicity: "ManyToOne"
- name: "ReplenishmentTask"
  description: "Directed move to refill pick locations from reserve storage."
  data:
  - name: "taskNumber"
    type: "String"
  - name: "status"
    type: "TaskStatus_"
  - name: "priority"
    type: "Integer"
  - name: "replenishmentType"
    type: "ReplenishmentType"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "fromLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "toLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "assignedWorker"
    type: "Worker"
    multiplicity: "ManyToOne"
- name: "PickingWave"
  description: "Grouping mechanism that releases and coordinates pick tasks for outbound\
    \ fulfillment."
  data:
  - name: "waveNumber"
    type: "String"
  - name: "status"
    type: "WaveStatus"
  - name: "releaseDate"
    type: "Date"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "pickTasks"
    type: "PickTask"
    multiplicity: "OneToMany"
- name: "OutboundOrder"
  description: "Instruction to allocate, pick, and ship goods to a destination."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "orderType"
    type: "OutboundOrderType"
  - name: "status"
    type: "OutboundOrderStatus"
  - name: "requestedShipDate"
    type: "Date"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "orderLines"
    type: "OutboundOrderLine"
    multiplicity: "OneToMany"
- name: "OutboundOrderLine"
  description: "Line detail defining item and quantity to be fulfilled."
  data:
  - name: "lineNumber"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  relations:
  - name: "outboundOrder"
    type: "OutboundOrder"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "pickTasks"
    type: "PickTask"
    multiplicity: "OneToMany"
  - name: "shipmentLines"
    type: "ShipmentLine"
    multiplicity: "OneToMany"
- name: "PickTask"
  description: "Directed activity to retrieve inventory from a location to fulfill\
    \ an order."
  data:
  - name: "taskNumber"
    type: "String"
  - name: "status"
    type: "TaskStatus_"
  - name: "pickMethod"
    type: "PickingMethod"
  - name: "quantity"
    type: "Decimal"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "wave"
    type: "PickingWave"
    multiplicity: "ManyToOne"
  - name: "outboundOrderLine"
    type: "OutboundOrderLine"
    multiplicity: "ManyToOne"
  - name: "fromLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "handlingUnit"
    type: "HandlingUnit"
    multiplicity: "ManyToOne"
  - name: "assignedWorker"
    type: "Worker"
    multiplicity: "ManyToOne"
- name: "Shipment"
  description: "Outbound movement of goods from the warehouse to a consignee or downstream\
    \ node."
  data:
  - name: "shipmentNumber"
    type: "String"
  - name: "status"
    type: "ShipmentStatus"
  - name: "shipDate"
    type: "Date"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "shipmentLines"
    type: "ShipmentLine"
    multiplicity: "OneToMany"
  - name: "handlingUnits"
    type: "HandlingUnit"
    multiplicity: "OneToMany"
  - name: "dockAppointment"
    type: "DockAppointment"
    multiplicity: "ManyToOne"
- name: "ShipmentLine"
  description: "Item-level detail of goods included in an outbound shipment."
  data:
  - name: "quantityShipped"
    type: "Decimal"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "outboundOrderLine"
    type: "OutboundOrderLine"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
- name: "Dock"
  description: "Physical loading or unloading point within a warehouse."
  data:
  - name: "name"
    type: "String"
  - name: "dockType"
    type: "DockType"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "appointments"
    type: "DockAppointment"
    multiplicity: "OneToMany"
- name: "DockAppointment"
  description: "Scheduled window for a carrier to load or unload at a dock."
  data:
  - name: "appointmentNumber"
    type: "String"
  - name: "appointmentDate"
    type: "Date"
  - name: "status"
    type: "AppointmentStatus"
  relations:
  - name: "dock"
    type: "Dock"
    multiplicity: "ManyToOne"
  - name: "inboundShipments"
    type: "InboundShipment"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
- name: "Worker"
  description: "Individual performing warehouse operations such as receiving, picking,\
    \ and packing."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "role"
    type: "WorkerRole"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "putawayTasks"
    type: "PutawayTask"
    multiplicity: "OneToMany"
  - name: "replenishmentTasks"
    type: "ReplenishmentTask"
    multiplicity: "OneToMany"
  - name: "pickTasks"
    type: "PickTask"
    multiplicity: "OneToMany"
  - name: "cycleCounts"
    type: "CycleCount"
    multiplicity: "OneToMany"
  - name: "equipment"
    type: "Equipment"
    multiplicity: "OneToMany"
- name: "Equipment"
  description: "Material handling asset used to move or store goods."
  data:
  - name: "equipmentCode"
    type: "String"
  - name: "equipmentType"
    type: "EquipmentType"
  - name: "capacityKg"
    type: "Decimal"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "assignedWorker"
    type: "Worker"
    multiplicity: "ManyToOne"
- name: "CycleCountPlan"
  description: "Policy defining how and when items or locations are counted."
  data:
  - name: "name"
    type: "String"
  - name: "frequencyDays"
    type: "Integer"
  - name: "strategy"
    type: "CycleCountStrategy"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "cycleCounts"
    type: "CycleCount"
    multiplicity: "OneToMany"
- name: "CycleCount"
  description: "Execution instance of counting inventory for specific items or locations."
  data:
  - name: "countNumber"
    type: "String"
  - name: "status"
    type: "CountStatus"
  - name: "scheduledDate"
    type: "Date"
  - name: "countedDate"
    type: "Date"
  relations:
  - name: "plan"
    type: "CycleCountPlan"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "worker"
    type: "Worker"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "CycleCountLine"
    multiplicity: "OneToMany"
- name: "CycleCountLine"
  description: "Line-level count result for a specific item and location."
  data:
  - name: "expectedQuantity"
    type: "Decimal"
  - name: "countedQuantity"
    type: "Decimal"
  - name: "varianceQuantity"
    type: "Decimal"
  relations:
  - name: "cycleCount"
    type: "CycleCount"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "storageLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "handlingUnit"
    type: "HandlingUnit"
    multiplicity: "ManyToOne"
- name: "QualityInspection"
  description: "Examination of received or in-process goods to ensure conformance\
    \ to standards."
  data:
  - name: "inspectionNumber"
    type: "String"
  - name: "status"
    type: "InspectionStatus"
  - name: "result"
    type: "InspectionResult"
  relations:
  - name: "receiptLine"
    type: "ReceiptLine"
    multiplicity: "ManyToOne"
  - name: "defects"
    type: "InspectionDefect"
    multiplicity: "OneToMany"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "handlingUnit"
    type: "HandlingUnit"
    multiplicity: "ManyToOne"
- name: "InspectionDefect"
  description: "Recorded nonconformance detected during an inspection."
  data:
  - name: "code"
    type: "String"
  - name: "severity"
    type: "InspectionSeverity"
  - name: "description"
    type: "String"
  relations:
  - name: "inspection"
    type: "QualityInspection"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "InventoryHold"
  description: "Restriction applied to inventory preventing use or shipment."
