---
metadata:
  name: "HCIDL Fleet Management Capabilities Model"
  description: "Capability model for planning, operating, maintaining, and monitoring\
    \ mobile assets, operators, routes, compliance, and telemetry across supply chain\
    \ fleets."
  version: "1.0.0"
  industry: "Supply Chain"
  category: "Supply Chain"
  type: "Capability"
  domain: "Fleet Management"
entities:
- name: "FleetOrganization"
  description: "Legal entity responsible for owning and operating one or more fleets."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  - name: "contact"
    type: "ContactInfo"
  relations:
  - name: "fleets"
    type: "Fleet"
    multiplicity: "OneToMany"
  - name: "vendors"
    type: "ServiceVendor"
    multiplicity: "OneToMany"
- name: "Fleet"
  description: "Logical grouping of assets, operators, and plans under a single operating\
    \ unit."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "String"
  - name: "operatingRegion"
    type: "String"
  relations:
  - name: "organization"
    type: "FleetOrganization"
    multiplicity: "ManyToOne"
  - name: "depots"
    type: "Depot"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "MobileAsset"
    multiplicity: "OneToMany"
  - name: "operators"
    type: "Operator_"
    multiplicity: "ManyToMany"
  - name: "routePlans"
    type: "RoutePlan"
    multiplicity: "OneToMany"
  - name: "dispatchOrders"
    type: "DispatchOrder"
    multiplicity: "OneToMany"
  - name: "checklists"
    type: "InspectionChecklist"
    multiplicity: "OneToMany"
  - name: "contracts"
    type: "Contract"
    multiplicity: "OneToMany"
  - name: "geofences"
    type: "Geofence"
    multiplicity: "OneToMany"
- name: "Depot"
  description: "Physical operating location used for staging, storage, maintenance,\
    \ and energy replenishment."
  data:
  - name: "name"
    type: "String"
  - name: "depotCode"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "timezone"
    type: "String"
  relations:
  - name: "fleet"
    type: "Fleet"
    multiplicity: "ManyToOne"
  - name: "parkingBays"
    type: "ParkingBay"
    multiplicity: "OneToMany"
  - name: "energyTransactions"
    type: "EnergyTransaction"
    multiplicity: "OneToMany"
- name: "ParkingBay"
  description: "Designated space within a depot for staging or storing mobile assets."
  data:
  - name: "bayCode"
    type: "String"
  - name: "capacity"
    type: "Integer"
  - name: "restrictions"
    type: "String"
  relations:
  - name: "depot"
    type: "Depot"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "MobileAsset"
    multiplicity: "OneToMany"
- name: "ServiceVendor"
  description: "External provider offering maintenance, inspection, towing, or energy\
    \ services."
  data:
  - name: "name"
    type: "String"
  - name: "vendorType"
    type: "VendorType"
  - name: "website"
    type: "String"
  - name: "contact"
    type: "ContactInfo"
  relations:
  - name: "contracts"
    type: "Contract"
    multiplicity: "OneToMany"
  - name: "workOrders"
    type: "MaintenanceWorkOrder"
    multiplicity: "OneToMany"
  - name: "energyTransactions"
    type: "EnergyTransaction"
    multiplicity: "OneToMany"
  - name: "incidentReports"
    type: "IncidentReport"
    multiplicity: "OneToMany"
- name: "MobileAsset"
  description: "Movable equipment used to execute transport or service activities\
    \ across the fleet."
  data:
  - name: "assetCode"
    type: "String"
  - name: "assetKind"
    type: "AssetKind"
  - name: "serialNumber"
    type: "String"
  - name: "commissioningDate"
    type: "Date"
  - name: "status"
    type: "AssetStatus"
  - name: "capacityKg"
    type: "Decimal"
  - name: "capacityCubicMeters"
    type: "Decimal"
  - name: "notes"
    type: "String"
  relations:
  - name: "fleet"
    type: "Fleet"
    multiplicity: "ManyToOne"
  - name: "depot"
    type: "Depot"
    multiplicity: "ManyToOne"
  - name: "telematicsDevice"
    type: "TelematicsDevice"
    multiplicity: "OneToOne"
  - name: "components"
    type: "AssetComponent"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "Assignment"
    multiplicity: "OneToMany"
  - name: "trips"
    type: "Trip"
    multiplicity: "OneToMany"
  - name: "inspections"
    type: "InspectionReport"
    multiplicity: "OneToMany"
  - name: "maintenanceProgram"
    type: "MaintenanceProgram"
    multiplicity: "ManyToOne"
  - name: "workOrders"
    type: "MaintenanceWorkOrder"
    multiplicity: "OneToMany"
  - name: "energyTransactions"
    type: "EnergyTransaction"
    multiplicity: "OneToMany"
  - name: "complianceDocuments"
    type: "ComplianceDocument"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
- name: "AssetComponent"
  description: "Replaceable or serviceable subassembly associated with a mobile asset."
  data:
  - name: "componentCode"
    type: "String"
  - name: "name"
    type: "String"
  - name: "componentCategory"
    type: "ComponentCategory"
  - name: "serialNumber"
    type: "String"
  relations:
  - name: "asset"
    type: "MobileAsset"
    multiplicity: "ManyToOne"
  - name: "workOrders"
    type: "MaintenanceWorkOrder"
    multiplicity: "OneToMany"
- name: "TelematicsDevice"
  description: "Installed device providing connectivity and telemetry for an asset."
  data:
  - name: "deviceSerial"
    type: "String"
  - name: "providerName"
    type: "String"
  - name: "status"
    type: "DeviceStatus"
  - name: "firmwareVersion"
    type: "String"
  - name: "activationDate"
    type: "Date"
  relations:
  - name: "asset"
    type: "MobileAsset"
    multiplicity: "OneToOne"
  - name: "telemetryEvents"
    type: "TelemetryEvent"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
- name: "TelemetryEvent"
  description: "Time-stamped event captured from a telematics device including location\
    \ and sensor context."
  data:
  - name: "eventCode"
    type: "String"
  - name: "eventType"
    type: "TelemetryEventType"
  - name: "severity"
    type: "AlertSeverity"
  - name: "occurredAt"
    type: "DateTime"
  - name: "latitude"
    type: "Decimal"
  - name: "longitude"
    type: "Decimal"
  - name: "value"
    type: "String"
  relations:
  - name: "device"
    type: "TelematicsDevice"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "MobileAsset"
    multiplicity: "ManyToOne"
  - name: "trip"
    type: "Trip"
    multiplicity: "ManyToOne"
- name: "Operator_"
  description: "Individual qualified to operate mobile assets and perform fleet activities."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "qualificationLevel"
    type: "QualificationLevel"
  - name: "employmentType"
    type: "EmploymentType"
  - name: "operatorCredentialNumber"
    type: "String"
  - name: "credentialExpiry"
    type: "Date"
  - name: "contact"
    type: "ContactInfo"
  relations:
  - name: "fleets"
    type: "Fleet"
    multiplicity: "ManyToMany"
  - name: "assignments"
    type: "Assignment"
    multiplicity: "OneToMany"
  - name: "inspections"
    type: "InspectionReport"
    multiplicity: "OneToMany"
  - name: "incidents"
    type: "IncidentReport"
    multiplicity: "OneToMany"
  - name: "complianceDocuments"
    type: "ComplianceDocument"
    multiplicity: "OneToMany"
- name: "Assignment"
  description: "Planned or actual allocation of an operator to an asset for a time\
    \ window."
  data:
  - name: "assignmentNumber"
    type: "String"
  - name: "status"
    type: "AssignmentStatus"
  - name: "plannedStart"
    type: "DateTime"
  - name: "plannedEnd"
    type: "DateTime"
  - name: "role"
    type: "AssignmentRole"
  relations:
  - name: "asset"
    type: "MobileAsset"
    multiplicity: "ManyToOne"
  - name: "operator_"
    type: "Operator_"
    multiplicity: "ManyToOne"
  - name: "shift"
    type: "Shift"
    multiplicity: "ManyToOne"
  - name: "trip"
    type: "Trip"
    multiplicity: "OneToOne"
- name: "Shift"
  description: "Recurring schedule block used to organize operator availability and\
    \ assignments."
  data:
  - name: "name"
    type: "String"
  - name: "dayOfWeek"
    type: "DayOfWeek"
  - name: "startTime"
    type: "Time"
  - name: "endTime"
    type: "Time"
  relations:
  - name: "fleet"
    type: "Fleet"
    multiplicity: "ManyToOne"
  - name: "assignments"
    type: "Assignment"
    multiplicity: "OneToMany"
- name: "RoutePlan"
  description: "Planned sequence of stops and activities optimized for distance and\
    \ time."
  data:
  - name: "planNumber"
    type: "String"
  - name: "name"
    type: "String"
  - name: "plannedDistanceKm"
    type: "Decimal"
  - name: "status"
    type: "RoutePlanStatus"
  relations:
  - name: "fleet"
    type: "Fleet"
    multiplicity: "ManyToOne"
  - name: "stops"
    type: "RouteStop"
    multiplicity: "OneToMany"
  - name: "trips"
    type: "Trip"
    multiplicity: "OneToMany"
  - name: "dispatchOrders"
    type: "DispatchOrder"
    multiplicity: "OneToMany"
- name: "RouteStop"
  description: "Planned location on a route with time windows and service requirements."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "stopType"
    type: "StopType"
  - name: "address"
    type: "Address"
  - name: "plannedArrival"
    type: "DateTime"
  - name: "plannedDeparture"
    type: "DateTime"
  - name: "serviceTimeMinutes"
    type: "Integer"
  relations:
  - name: "routePlan"
    type: "RoutePlan"
    multiplicity: "ManyToOne"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "ManyToMany"
  - name: "depot"
    type: "Depot"
    multiplicity: "ManyToOne"
- name: "Trip"
  description: "Executed movement linked to a route plan, asset, and operator, with\
    \ actual outcomes."
  data:
  - name: "tripNumber"
    type: "String"
  - name: "status"
    type: "TripStatus"
  - name: "actualDistanceKm"
    type: "Decimal"
  - name: "startTime"
    type: "DateTime"
  - name: "endTime"
    type: "DateTime"
  relations:
  - name: "routePlan"
    type: "RoutePlan"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "MobileAsset"
    multiplicity: "ManyToOne"
  - name: "operator_"
    type: "Operator_"
    multiplicity: "ManyToOne"
  - name: "tripStops"
    type: "TripStop"
    multiplicity: "OneToMany"
  - name: "telemetryEvents"
    type: "TelemetryEvent"
    multiplicity: "OneToMany"
  - name: "incidents"
    type: "IncidentReport"
    multiplicity: "OneToMany"
- name: "TripStop"
  description: "Actual arrival and departure details for a stop during a trip."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "arrivalTime"
    type: "DateTime"
  - name: "departureTime"
    type: "DateTime"
  - name: "completionStatus"
    type: "StopCompletionStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "trip"
    type: "Trip"
    multiplicity: "ManyToOne"
  - name: "plannedStop"
    type: "RouteStop"
    multiplicity: "ManyToOne"
- name: "DispatchOrder"
  description: "Instruction to execute a movement or service with defined priority\
    \ and status."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "priority"
    type: "PriorityLevel"
  - name: "status"
    type: "DispatchOrderStatus"
  - name: "customerReference"
    type: "String"
  relations:
  - name: "routePlan"
    type: "RoutePlan"
    multiplicity: "ManyToOne"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "fleet"
    type: "Fleet"
    multiplicity: "ManyToOne"
  - name: "capacityReservations"
    type: "CapacityReservation"
    multiplicity: "OneToMany"
- name: "Shipment"
  description: "Grouping of goods to be transported with defined origin and destination."
  data:
  - name: "shipmentNumber"
    type: "String"
  - name: "totalWeightKg"
    type: "Decimal"
  - name: "totalVolumeCubicMeters"
    type: "Decimal"
  - name: "status"
    type: "ShipmentStatus"
  - name: "origin"
    type: "Address"
  - name: "destination"
    type: "Address"
  relations:
  - name: "dispatchOrder"
    type: "DispatchOrder"
    multiplicity: "ManyToOne"
  - name: "loadUnits"
    type: "LoadUnit"
    multiplicity: "OneToMany"
- name: "LoadUnit"
  description: "Handling unit used for consolidation of goods such as pallets or totes."
  data:
  - name: "unitCode"
    type: "String"
  - name: "unitType"
    type: "LoadUnitType"
  - name: "weightKg"
    type: "Decimal"
  - name: "volumeCubicMeters"
    type: "Decimal"
  - name: "sealed"
    type: "Boolean"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "container"
    type: "Container"
    multiplicity: "ManyToOne"
- name: "Container"
  description: "Reusable enclosure or tank used to hold and secure load units."
  data:
  - name: "containerCode"
    type: "String"
  - name: "containerType"
    type: "ContainerType"
  - name: "tareWeightKg"
    type: "Decimal"
  - name: "notes"
    type: "String"
  relations:
  - name: "fleet"
    type: "Fleet"
    multiplicity: "ManyToOne"
  - name: "loadUnits"
    type: "LoadUnit"
    multiplicity: "OneToMany"
  - name: "trips"
    type: "Trip"
    multiplicity: "OneToMany"
- name: "MaintenanceProgram"
  description: "Preventive maintenance policy defining intervals and scope for assets."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "policyType"
    type: "MaintenancePolicyType"
  - name: "intervalDistanceKm"
    type: "Decimal"
  - name: "intervalHours"
    type: "Decimal"
  - name: "intervalDays"
    type: "Integer"
  relations:
  - name: "assets"
    type: "MobileAsset"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "MaintenanceTask"
    multiplicity: "OneToMany"
- name: "MaintenanceTask"
  description: "Standardized procedure within a maintenance program."
  data:
  - name: "taskCode"
    type: "String"
  - name: "name"
    type: "String"
  - name: "standardDurationMinutes"
    type: "Integer"
  - name: "requiredSkill"
    type: "SkillType"
  relations:
  - name: "program"
    type: "MaintenanceProgram"
    multiplicity: "ManyToOne"
  - name: "workOrders"
    type: "MaintenanceWorkOrder"
    multiplicity: "OneToMany"
- name: "MaintenanceWorkOrder"
  description: "Executable record to perform corrective or preventive maintenance."
  data:
  - name: "workOrderNumber"
    type: "String"
  - name: "status"
    type: "MaintenanceStatus"
  - name: "openedAt"
    type: "DateTime"
  - name: "closedAt"
    type: "DateTime"
  - name: "cost"
    type: "Money"
  - name: "notes"
    type: "String"
  relations:
  - name: "asset"
    type: "MobileAsset"
    multiplicity: "ManyToOne"
  - name: "vendor"
    type: "ServiceVendor"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "MaintenanceTask"
    multiplicity: "ManyToMany"
  - name: "component"
    type: "AssetComponent"
    multiplicity: "ManyToOne"
- name: "InspectionChecklist"
  description: "Template defining the set and cadence of inspection items."
  data:
  - name: "name"
    type: "String"
  - name: "frequency"
    type: "InspectionFrequency"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "fleet"
    type: "Fleet"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "InspectionItem"
    multiplicity: "OneToMany"
  - name: "reports"
    type: "InspectionReport"
    multiplicity: "OneToMany"
- name: "InspectionItem"
  description: "Individual check action within a checklist including instructions\
    \ and criticality."
  data:
  - name: "name"
    type: "String"
  - name: "criticality"
    type: "Criticality"
  - name: "instructions"
    type: "String"
  relations:
  - name: "checklist"
    type: "InspectionChecklist"
    multiplicity: "ManyToOne"
- name: "InspectionReport"
  description: "Completed inspection with outcome and recorded findings."
  data:
  - name: "reportNumber"
    type: "String"
  - name: "result"
    type: "InspectionResult"
  - name: "performedAt"
    type: "DateTime"
  - name: "notes"
    type: "String"
  relations:
  - name: "asset"
    type: "MobileAsset"
    multiplicity: "ManyToOne"
  - name: "operator_"
    type: "Operator_"
    multiplicity: "ManyToOne"
  - name: "checklist"
    type: "InspectionChecklist"
    multiplicity: "ManyToOne"
  - name: "findings"
    type: "InspectionFinding"
    multiplicity: "OneToMany"
- name: "InspectionFinding"
  description: "Item-level outcome and observation from an inspection report."
  data:
  - name: "itemName"
    type: "String"
  - name: "status"
    type: "ChecklistItemStatus"
  - name: "observation"
    type: "String"
  - name: "severity"
    type: "IncidentSeverity"
  relations:
  - name: "report"
    type: "InspectionReport"
    multiplicity: "ManyToOne"
- name: "EnergyTransaction"
  description: "Record of energy replenishment including quantity, unit, and cost."
  data:
  - name: "ticketNumber"
    type: "String"
  - name: "energyType"
    type: "EnergyType"
  - name: "quantity"
    type: "Decimal"
  - name: "unit"
    type: "EnergyUnit"
  - name: "amount"
    type: "Money"
  - name: "occurredAt"
    type: "DateTime"
  - name: "sourceName"
    type: "String"
  relations:
  - name: "asset"
    type: "MobileAsset"
    multiplicity: "ManyToOne"
  - name: "depot"
    type: "Depot"
    multiplicity: "ManyToOne"
  - name: "vendor"
    type: "ServiceVendor"
    multiplicity: "ManyToOne"
- name: "ComplianceDocument"
  description: "Credential or permit required for legal or safety compliance."
  data:
  - name: "documentNumber"
    type: "String"
  - name: "documentType"
    type: "ComplianceDocumentType"
  - name: "issuedBy"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "status"
    type: "ComplianceStatus"
  relations:
  - name: "asset"
    type: "MobileAsset"
    multiplicity: "ManyToOne"
  - name: "operator_"
    type: "Operator_"
    multiplicity: "ManyToOne"
  - name: "fleet"
    type: "Fleet"
    multiplicity: "ManyToOne"
- name: "IncidentReport"
  description: "Reported event causing disruption, damage, or safety concern."
  data:
  - name: "incidentNumber"
    type: "String"
  - name: "incidentType"
    type: "IncidentType"
  - name: "severity"
    type: "IncidentSeverity"
  - name: "occurredAt"
    type: "DateTime"
  - name: "description"
    type: "String"
  - name: "cost"
    type: "Money"
  relations:
  - name: "asset"
    type: "MobileAsset"
    multiplicity: "ManyToOne"
  - name: "operator_"
    type: "Operator_"
    multiplicity: "ManyToOne"
  - name: "trip"
    type: "Trip"
    multiplicity: "ManyToOne"
  - name: "vendor"
    type: "ServiceVendor"
    multiplicity: "ManyToOne"
- name: "Alert"
  description: "Real-time or batched exception raised by devices, rules, or operations."
  data:
  - name: "alertCode"
    type: "String"
  - name: "severity"
    type: "AlertSeverity"
  - name: "status"
    type: "AlertStatus"
  - name: "message"
    type: "String"
  - name: "raisedAt"
    type: "DateTime"
  - name: "acknowledgedAt"
    type: "DateTime"
  relations:
  - name: "asset"
    type: "MobileAsset"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "TelematicsDevice"
    multiplicity: "ManyToOne"
  - name: "trip"
    type: "Trip"
    multiplicity: "ManyToOne"
- name: "Contract"
  description: "Commercial agreement governing services, leasing, or energy supply."
  data:
  - name: "contractNumber"
    type: "String"
  - name: "contractType"
    type: "ContractType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "totalValue"
    type: "Money"
  relations:
  - name: "vendor"
    type: "ServiceVendor"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "MobileAsset"
    multiplicity: "ManyToMany"
  - name: "fleet"
    type: "Fleet"
    multiplicity: "ManyToOne"
- name: "CapacityReservation"
  description: "Temporary allocation of asset carrying capacity for a planned order."
  data:
  - name: "reservationNumber"
    type: "String"
  - name: "validFrom"
    type: "DateTime"
  - name: "validTo"
    type: "DateTime"
  - name: "reservedWeightKg"
    type: "Decimal"
  - name: "reservedVolumeCubicMeters"
    type: "Decimal"
  relations:
  - name: "asset"
    type: "MobileAsset"
    multiplicity: "ManyToOne"
  - name: "dispatchOrder"
    type: "DispatchOrder"
    multiplicity: "ManyToOne"
- name: "Geofence"
  description: "Virtual geographic boundary used for monitoring entry, exit, and dwell\
    \ behavior."
  data:
  - name: "name"
    type: "String"
  - name: "regionType"
    type: "GeofenceType"
  - name: "polygon"
    type: "GeoPolygon"
  relations:
  - name: "fleet"
    type: "Fleet"
    multiplicity: "ManyToOne"
  - name: "accessRules"
    type: "AccessRule"
    multiplicity: "OneToMany"
- name: "AccessRule"
  description: "Policy governing entry, exit, and acceptable dwell time within a geofence."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "AccessRuleType"
  - name: "maxDwellMinutes"
    type: "Integer"
  - name: "active"
    type: "Boolean"
  relations:
