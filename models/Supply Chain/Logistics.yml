---
entities:
- name: "Organization"
  description: "Participant in the logistics network such as shipper, consignee, carrier,\
    \ broker, or 3PL."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "organizationType"
    type: "OrganizationType"
  - name: "taxId"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
- name: "Location"
  description: "Physical site for pickup, delivery, terminal, cross-dock, port, or\
    \ warehouse operations."
  data:
  - name: "name"
    type: "String"
  - name: "locationCode"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "geoCoordinate"
    type: "GeoCoordinate"
  - name: "timeZone"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "docks"
    type: "DockDoor"
    multiplicity: "OneToMany"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
- name: "DockDoor"
  description: "Identified loading or unloading door within a facility used for appointments\
    \ and staging."
  data:
  - name: "doorNumber"
    type: "String"
  - name: "capacityPerHour"
    type: "Integer"
  relations:
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "Product"
  description: "Item managed as inventory and transported through the logistics network."
  data:
  - name: "sku"
    type: "String"
  - name: "name"
    type: "String"
  - name: "unitOfMeasure"
    type: "String"
  - name: "netWeight"
    type: "Weight"
  - name: "dimensions"
    type: "Dimensions"
  - name: "commodityCode"
    type: "String"
  - name: "hazardousClass"
    type: "HazardClass"
  - name: "temperatureRequirement"
    type: "TemperatureRange"
  relations:
  - name: "owner"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "InventoryItem"
  description: "On-hand and allocated quantities of a product at a specific location\
    \ and ownership."
  data:
  - name: "quantityOnHand"
    type: "Decimal"
  - name: "quantityAllocated"
    type: "Decimal"
  - name: "lotNumber"
    type: "String"
  - name: "serialNumber"
    type: "String"
  - name: "expirationDate"
    type: "Date"
  - name: "status"
    type: "InventoryStatus"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "CustomerOrder"
  description: "Commercial order from a shipper to deliver products to a consignee\
    \ under defined terms."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "orderDate"
    type: "Date"
  - name: "incoterm"
    type: "Incoterm"
  - name: "termsOfSale"
    type: "String"
  - name: "status"
    type: "CustomerOrderStatus"
  - name: "priority"
    type: "PriorityLevel"
  relations:
  - name: "shipper"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "consignee"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "origin"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "destination"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "orderLines"
    type: "CustomerOrderLine"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
- name: "CustomerOrderLine"
  description: "Line-level request identifying product, quantity, and unit of measure\
    \ on a customer order."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "productDescription"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "uom"
    type: "String"
  relations:
  - name: "order"
    type: "CustomerOrder"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "allocations"
    type: "Allocation"
    multiplicity: "OneToMany"
- name: "Allocation"
  description: "Reservation of inventory to satisfy an order line at a given location\
    \ and time."
  data:
  - name: "allocatedQuantity"
    type: "Decimal"
  - name: "status"
    type: "AllocationStatus"
  relations:
  - name: "orderLine"
    type: "CustomerOrderLine"
    multiplicity: "ManyToOne"
  - name: "inventoryItem"
    type: "InventoryItem"
    multiplicity: "ManyToOne"
- name: "Shipment"
  description: "Planned and executed movement of goods from origin to destination\
    \ possibly across modes."
  data:
  - name: "shipmentNumber"
    type: "String"
  - name: "mode"
    type: "ModeOfTransport"
  - name: "serviceLevel"
    type: "ServiceLevel"
  - name: "declaredValue"
    type: "Money"
  - name: "status"
    type: "ShipmentStatus"
  - name: "asInternational"
    type: "Boolean"
  relations:
  - name: "shipper"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "consignee"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "origin"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "destination"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "packages"
    type: "_Package"
    multiplicity: "OneToMany"
  - name: "legs"
    type: "ShipmentLeg"
    multiplicity: "OneToMany"
  - name: "booking"
    type: "Booking"
    multiplicity: "OneToOne"
  - name: "documents"
    type: "TradeDocument"
    multiplicity: "OneToMany"
  - name: "trackingEvents"
    type: "TrackingEvent"
    multiplicity: "OneToMany"
  - name: "proofOfDelivery"
    type: "ProofOfDelivery"
    multiplicity: "OneToOne"
  - name: "invoice"
    type: "FreightInvoice"
    multiplicity: "OneToOne"
  - name: "consignment"
    type: "Consignment"
    multiplicity: "ManyToOne"
- name: "Consignment"
  description: "Legal carriage unit under a transport contract representing one or\
    \ more related shipments."
  data:
  - name: "consignmentNumber"
    type: "String"
  - name: "status"
    type: "ConsignmentStatus"
  - name: "liabilityLimit"
    type: "Money"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "contract"
    type: "TransportContract"
    multiplicity: "ManyToOne"
  - name: "billOfLading"
    type: "BillOfLading"
    multiplicity: "OneToOne"
- name: "_Package"
  description: "Physical handling unit such as a parcel, pallet, crate, or drum containing\
    \ one or more products."
  data:
  - name: "packageId"
    type: "String"
  - name: "packageType"
    type: "_PackageType"
  - name: "weight"
    type: "Weight"
  - name: "dimensions"
    type: "Dimensions"
  - name: "stackable"
    type: "Boolean"
  - name: "hazardousIndicator"
    type: "Boolean"
  - name: "temperatureRequirement"
    type: "TemperatureRange"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "_PackageItem"
    multiplicity: "OneToMany"
  - name: "label"
    type: "ShippingLabel"
    multiplicity: "OneToOne"
  - name: "container"
    type: "Container"
    multiplicity: "ManyToOne"
- name: "PackageItem"
  description: "Association of a product and its quantity within a specific package\
    \ including lot or serials."
  data:
  - name: "quantity"
    type: "Decimal"
  - name: "lotNumber"
    type: "String"
  - name: "serialNumber"
    type: "String"
  relations:
  - name: "package"
    type: "_Package"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "orderLine"
    type: "CustomerOrderLine"
    multiplicity: "ManyToOne"
- name: "Container"
  description: "Intermodal equipment such as ISO containers, trailers, or ULDs used\
    \ for consolidation."
  data:
  - name: "containerNumber"
    type: "String"
  - name: "equipmentType"
    type: "EquipmentType"
  - name: "sealNumber"
    type: "String"
  - name: "tareWeight"
    type: "Weight"
  - name: "capacity"
    type: "Volume"
  relations:
  - name: "packages"
    type: "_Package"
    multiplicity: "OneToMany"
  - name: "legs"
    type: "ShipmentLeg"
    multiplicity: "OneToMany"
  - name: "owner"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "ShipmentLeg"
  description: "Executable movement segment between two locations performed by a single\
    \ carrier and asset."
  data:
  - name: "legNumber"
    type: "Integer"
  - name: "scheduledDeparture"
    type: "DateTime"
  - name: "scheduledArrival"
    type: "DateTime"
  - name: "actualDeparture"
    type: "DateTime"
  - name: "actualArrival"
    type: "DateTime"
  - name: "status"
    type: "LegStatus"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "origin"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "destination"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "transportAsset"
    type: "TransportAsset"
    multiplicity: "ManyToOne"
  - name: "container"
    type: "Container"
    multiplicity: "ManyToOne"
- name: "Carrier"
  description: "Transport operator moving freight by road, rail, ocean, air, or inland\
    \ waterways."
  data:
  - name: "name"
    type: "String"
  - name: "carrierCode"
    type: "String"
  - name: "scac"
    type: "String"
  - name: "mcNumber"
    type: "String"
  - name: "carrierType"
    type: "CarrierType"
  - name: "contactEmail"
    type: "String"
  - name: "contactPhone"
    type: "String"
  relations:
  - name: "serviceAreas"
    type: "ServiceArea"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "TransportAsset"
    multiplicity: "OneToMany"
  - name: "contracts"
    type: "TransportContract"
    multiplicity: "OneToMany"
  - name: "rateCards"
    type: "RateCard"
    multiplicity: "OneToMany"
- name: "TransportAsset"
  description: "Operated equipment used to execute transport such as containers, trailers,\
    \ railcars, aircraft ULDs, or vessels."
  data:
  - name: "assetId"
    type: "String"
  - name: "equipmentType"
    type: "EquipmentType"
  - name: "licensePlate"
    type: "String"
  - name: "countryOfRegistration"
    type: "String"
  - name: "maxGrossWeight"
    type: "Weight"
  - name: "refrigerationAvailable"
    type: "Boolean"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
- name: "ServiceArea"
  description: "Geographic coverage definition indicating supported lanes and modes\
    \ for a carrier."
  data:
  - name: "name"
    type: "String"
  - name: "originRegion"
    type: "String"
  - name: "destinationRegion"
    type: "String"
  - name: "mode"
    type: "ModeOfTransport"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
- name: "Booking"
  description: "Confirmed reservation with a carrier to move a shipment or equipment\
    \ on specified dates."
  data:
  - name: "bookingNumber"
    type: "String"
  - name: "requestedDeparture"
    type: "DateTime"
  - name: "requestedArrival"
    type: "DateTime"
  - name: "status"
    type: "BookingStatus"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "rateQuote"
    type: "RateQuote"
    multiplicity: "ManyToOne"
- name: "RateQuote"
  description: "Priced offer with validity and charge breakdown for a defined movement\
    \ and service level."
  data:
  - name: "quoteNumber"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "totalCharge"
    type: "Money"
  - name: "currency"
    type: "String"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "origin"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "destination"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "charges"
    type: "ChargeLine"
    multiplicity: "OneToMany"
- name: "RateCard"
  description: "Contracted pricing schedule defining charges and accessorials across\
    \ an effective period."
  data:
  - name: "name"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "currency"
    type: "String"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "charges"
    type: "ChargeLine"
    multiplicity: "OneToMany"
- name: "ChargeLine"
  description: "Individual charge component used on quotes, tariffs, and invoices."
  data:
  - name: "chargeCode"
    type: "String"
  - name: "description"
    type: "String"
  - name: "chargeType"
    type: "ChargeType"
  - name: "unitPrice"
    type: "Money"
  - name: "unitOfMeasure"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  relations:
  - name: "rateQuote"
    type: "RateQuote"
    multiplicity: "ManyToOne"
  - name: "rateCard"
    type: "RateCard"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "FreightInvoice"
    multiplicity: "ManyToOne"
- name: "TransportContract"
  description: "Agreement between a shipper and carrier detailing terms, service levels,\
    \ and pricing."
  data:
  - name: "contractNumber"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "paymentTerms"
    type: "String"
  - name: "status"
    type: "ContractStatus"
  relations:
  - name: "shipper"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "rateCards"
    type: "RateCard"
    multiplicity: "OneToMany"
- name: "TradeDocument"
  description: "Formal document associated with a shipment such as invoices, certificates,\
    \ and declarations."
  data:
  - name: "documentNumber"
    type: "String"
  - name: "documentType"
    type: "DocumentType"
  - name: "fileReference"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "issuer"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
- name: "BillOfLading"
  description: "Carrier-issued document of title and receipt describing the goods\
    \ and transport terms."
  data:
  - name: "blNumber"
    type: "String"
  - name: "blType"
    type: "BillOfLadingType"
  - name: "issueDate"
    type: "Date"
  - name: "originalCount"
    type: "Integer"
  relations:
  - name: "consignment"
    type: "Consignment"
    multiplicity: "ManyToOne"
  - name: "shipper"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "consignee"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "notifyParty"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "TrackingEvent"
  description: "Time-stamped operational update indicating movement, milestone, or\
    \ exception state."
  data:
  - name: "eventTime"
    type: "DateTime"
  - name: "eventType"
    type: "TrackingEventType"
  - name: "locationDescription"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "package"
    type: "_Package"
    multiplicity: "ManyToOne"
  - name: "leg"
    type: "ShipmentLeg"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "Appointment"
  description: "Scheduled time window for pickup, delivery, or cross-dock operations\
    \ at a facility."
  data:
  - name: "appointmentNumber"
    type: "String"
  - name: "appointmentType"
    type: "AppointmentType"
  - name: "timeWindow"
    type: "TimeWindow"
  - name: "status"
    type: "AppointmentStatus"
  relations:
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "dockDoor"
    type: "DockDoor"
    multiplicity: "ManyToOne"
- name: "ShippingLabel"
  description: "Encoded label containing identifiers and routing data printed for\
    \ package handling."
  data:
  - name: "labelNumber"
    type: "String"
  - name: "barcodeType"
    type: "BarcodeType"
  - name: "encodedData"
    type: "String"
  - name: "printedAt"
    type: "DateTime"
  relations:
  - name: "package"
    type: "_Package"
    multiplicity: "ManyToOne"
- name: "FreightInvoice"
  description: "Financial document billing transportation services including base\
    \ and accessorial charges."
  data:
  - name: "invoiceNumber"
    type: "String"
  - name: "invoiceDate"
    type: "Date"
  - name: "status"
    type: "InvoiceStatus"
  - name: "totalAmount"
    type: "Money"
  - name: "currency"
    type: "String"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "charges"
    type: "ChargeLine"
    multiplicity: "OneToMany"
  - name: "payer"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "contract"
    type: "TransportContract"
    multiplicity: "ManyToOne"
- name: "ProofOfDelivery"
  description: "Evidence that delivery has been completed and received, including\
    \ condition and signature."
  data:
  - name: "podNumber"
    type: "String"
  - name: "receivedBy"
    type: "String"
  - name: "receivedAt"
    type: "DateTime"
  - name: "conditionAtDelivery"
    type: "DeliveryCondition"
  - name: "signatureReference"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "photos"
    type: "MediaAttachment"
    multiplicity: "OneToMany"
- name: "ExceptionCase"
  description: "Managed incident such as delay, damage, or misroute requiring investigation\
    \ and resolution."
  data:
  - name: "caseNumber"
    type: "String"
  - name: "exceptionType"
    type: "ExceptionType"
  - name: "severity"
    type: "SeverityLevel"
  - name: "description"
    type: "String"
  - name: "openedAt"
    type: "DateTime"
  - name: "status"
    type: "ExceptionStatus"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "package"
    type: "_Package"
    multiplicity: "ManyToOne"
  - name: "assignedTo"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "trackingEvents"
    type: "TrackingEvent"
    multiplicity: "OneToMany"
- name: "Claim"
  description: "Demand for compensation due to loss, damage, shortage, or service\
    \ failure during transport."
  data:
  - name: "claimNumber"
    type: "String"
  - name: "claimType"
    type: "ClaimType"
  - name: "status"
    type: "ClaimStatus"
  - name: "claimedAmount"
    type: "Money"
  - name: "filedDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "package"
    type: "_Package"
    multiplicity: "ManyToOne"
  - name: "claimant"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "insurer"
    type: "Insurer"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "TradeDocument"
    multiplicity: "OneToMany"
- name: "Insurer"
  description: "Insurance underwriter providing cargo and liability coverage for logistics\
    \ stakeholders."
  data:
  - name: "name"
    type: "String"
  - name: "policyContact"
    type: "String"
  - name: "phone"
    type: "String"
  relations:
  - name: "policies"
    type: "InsurancePolicy"
    multiplicity: "OneToMany"
- name: "InsurancePolicy"
  description: "Contract defining coverage, limits, and terms for shipments or consignments."
  data:
  - name: "policyNumber"
    type: "String"
  - name: "coverageType"
    type: "CoverageType"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "limit"
    type: "Money"
  - name: "deductible"
    type: "Money"
  relations:
  - name: "insurer"
    type: "Insurer"
    multiplicity: "ManyToOne"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "consignments"
    type: "Consignment"
    multiplicity: "OneToMany"
- name: "CustomsDeclaration"
  description: "Filing with authorities declaring goods, values, and classifications\
    \ for border clearance."
  data:
  - name: "declarationNumber"
    type: "String"
  - name: "filingDate"
    type: "Date"
  - name: "status"
    type: "CustomsStatus"
  - name: "totalValue"
    type: "Money"
  - name: "currency"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "broker"
    type: "CustomsBroker"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "TradeDocument"
    multiplicity: "OneToMany"
- name: "CustomsBroker"
  description: "Licensed intermediary submitting and managing customs documentation\
    \ and clearances."
  data:
  - name: "name"
    type: "String"
  - name: "licenseNumber"
    type: "String"
  - name: "contactEmail"
    type: "String"
  - name: "contactPhone"
    type: "String"
  relations:
  - name: "declarations"
    type: "CustomsDeclaration"
    multiplicity: "OneToMany"
- name: "RoutePlan"
  description: "Optimized sequence of legs and modes designed to meet service and\
    \ cost objectives."
  data:
  - name: "planNumber"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "optimizationObjective"
