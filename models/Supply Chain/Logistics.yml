metadata:
  name: "Logistics Industry Domain Model"
  description: "HCIDL model capturing core logistics capabilities for orders, shipments,\
    \ carriers, pricing, customs, and warehousing."
  version: "1.0.0"
  industry: "Logistics"
  category: "Supply Chain"
  language: "English"
  type: "Industry"
  domain: "Logistics"
