---
metadata:
  name: "Inventory Management"
  description: "Capability model for managing items, stock, locations, movements,\
    \ counts, and replenishment across warehouses."
  version: "1.0.0"
  industry: "Supply Chain"
  category: "Supply Chain"
  type: "Capability"
  domain: "Inventory Management"
entities:
- name: "Item"
  description: "Master definition of a stock-keeping unit with tracking and measurement\
    \ attributes."
  data:
  - name: "sku"
    type: "String"
  - name: "name"
    type: "String"
  - name: "itemType"
    type: "ItemType"
  - name: "trackingMethod"
    type: "TrackingMethod"
  - name: "defaultUom"
    type: "UoM"
  - name: "barcode"
    type: "String"
  - name: "abcClass"
    type: "ABCClass"
  relations:
  - name: "inventoryBalances"
    type: "InventoryBalance"
    multiplicity: "OneToMany"
  - name: "lots"
    type: "InventoryLot"
    multiplicity: "OneToMany"
  - name: "serializedUnits"
    type: "SerializedUnit"
    multiplicity: "OneToMany"
  - name: "replenishmentPolicies"
    type: "ReplenishmentPolicy"
    multiplicity: "OneToMany"
  - name: "unitConversions"
    type: "UnitConversion"
    multiplicity: "OneToMany"
- name: "Warehouse"
  description: "Physical facility used to store and process inventory."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "storageLocations"
    type: "StorageLocation"
    multiplicity: "OneToMany"
  - name: "inventoryBalances"
    type: "InventoryBalance"
    multiplicity: "OneToMany"
  - name: "inboundShipments"
    type: "InboundShipment"
    multiplicity: "OneToMany"
  - name: "outboundShipments"
    type: "OutboundShipment"
    multiplicity: "OneToMany"
  - name: "outboundTransfers"
    type: "StockTransfer"
    multiplicity: "OneToMany"
  - name: "inboundTransfers"
    type: "StockTransfer"
    multiplicity: "OneToMany"
- name: "StorageLocation"
  description: "Addressable location within a warehouse such as a bin, rack, or staging\
    \ area."
  data:
  - name: "code"
    type: "String"
  - name: "locationType"
    type: "LocationType"
  - name: "allowsMixedItems"
    type: "Boolean"
  - name: "capacity"
    type: "Quantity"
  - name: "pickSequence"
    type: "Integer"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "inventoryBalances"
    type: "InventoryBalance"
    multiplicity: "OneToMany"
- name: "InventoryBalance"
  description: "Quantities and status of an item held at a warehouse and location."
  data:
  - name: "quantityOnHand"
    type: "Decimal"
  - name: "quantityReserved"
    type: "Decimal"
  - name: "quantityAvailable"
    type: "Decimal"
  - name: "inventoryStatus"
    type: "InventoryStatus"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "InventoryLot"
    multiplicity: "ManyToOne"
- name: "InventoryTransaction"
  description: "Immutable record of a stock movement affecting on-hand or reserved\
    \ quantities."
  data:
  - name: "transactionNumber"
    type: "String"
  - name: "transactionDate"
    type: "Date"
  - name: "transactionType"
    type: "InventoryTransactionType"
  - name: "quantity"
    type: "Quantity"
  - name: "reasonCode"
    type: "String"
  - name: "note"
    type: "String"
  - name: "unitCost"
    type: "Money"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "InventoryLot"
    multiplicity: "ManyToOne"
  - name: "serializedUnit"
    type: "SerializedUnit"
    multiplicity: "ManyToOne"
  - name: "transferLine"
    type: "StockTransferLine"
    multiplicity: "ManyToOne"
  - name: "inboundShipmentLine"
    type: "InboundShipmentLine"
    multiplicity: "ManyToOne"
  - name: "outboundShipmentLine"
    type: "OutboundShipmentLine"
    multiplicity: "ManyToOne"
  - name: "reservation"
    type: "Reservation"
    multiplicity: "ManyToOne"
- name: "InventoryLot"
  description: "Batch or lot identifier used for traceability and expiration control."
  data:
  - name: "lotNumber"
    type: "String"
  - name: "manufactureDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "qualityStatus"
    type: "QualityStatus"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "SerializedUnit"
  description: "Individually tracked unit of an item identified by a unique serial\
    \ number."
  data:
  - name: "serialNumber"
    type: "String"
  - name: "status"
    type: "SerializedUnitStatus"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "InventoryLot"
    multiplicity: "ManyToOne"
  - name: "currentWarehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "currentLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
- name: "StockTransfer"
  description: "Movement of stock between warehouses with shipping and receipt milestones."
  data:
  - name: "transferNumber"
    type: "String"
  - name: "status"
    type: "TransferStatus"
  - name: "requestedDate"
    type: "Date"
  - name: "shippedDate"
    type: "Date"
  - name: "receivedDate"
    type: "Date"
  relations:
  - name: "fromWarehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "toWarehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "StockTransferLine"
    multiplicity: "OneToMany"
- name: "StockTransferLine"
  description: "Line-level detail for a stock transfer including item, quantity, and\
    \ locations."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Quantity"
  - name: "note"
    type: "String"
  relations:
  - name: "transfer"
    type: "StockTransfer"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "fromLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "toLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "InventoryLot"
    multiplicity: "ManyToOne"
- name: "InboundShipment"
  description: "Receipt of goods into a warehouse from suppliers, returns, or transfers."
  data:
  - name: "receiptNumber"
    type: "String"
  - name: "status"
    type: "ReceiptStatus"
  - name: "expectedDate"
    type: "Date"
  - name: "receivedDate"
    type: "Date"
  - name: "sourceType"
    type: "InboundSourceType"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "InboundShipmentLine"
    multiplicity: "OneToMany"
- name: "InboundShipmentLine"
  description: "Line item received on an inbound shipment with quantity and put-away\
    \ details."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Quantity"
  - name: "unitCost"
    type: "Money"
  relations:
  - name: "inboundShipment"
    type: "InboundShipment"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "InventoryLot"
    multiplicity: "ManyToOne"
- name: "OutboundShipment"
  description: "Shipment of goods from a warehouse to customers, stores, or other\
    \ sites."
  data:
  - name: "shipmentNumber"
    type: "String"
  - name: "status"
    type: "ShipmentStatus"
  - name: "shipDate"
    type: "Date"
  - name: "destinationType"
    type: "OutboundDestinationType"
  - name: "destinationAddress"
    type: "Address"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "OutboundShipmentLine"
    multiplicity: "OneToMany"
- name: "OutboundShipmentLine"
  description: "Line item on an outbound shipment specifying picks from locations."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Quantity"
  - name: "unitPrice"
    type: "Money"
  relations:
  - name: "outboundShipment"
    type: "OutboundShipment"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "InventoryLot"
    multiplicity: "ManyToOne"
  - name: "reservation"
    type: "Reservation"
    multiplicity: "ManyToOne"
- name: "Reservation"
  description: "Allocation of item quantity to a demand source to protect availability."
  data:
  - name: "referenceNumber"
    type: "String"
  - name: "status"
    type: "ReservationStatus"
  - name: "reservedQuantity"
    type: "Decimal"
  - name: "reason"
    type: "ReservationReason"
  - name: "createdDate"
    type: "Date"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "InventoryLot"
    multiplicity: "ManyToOne"
  - name: "outboundShipmentLine"
    type: "OutboundShipmentLine"
    multiplicity: "ManyToOne"
- name: "ReplenishmentPolicy"
  description: "Rules that determine when and how much to replenish for an item at\
    \ a warehouse."
  data:
  - name: "policyName"
    type: "String"
  - name: "method"
    type: "ReplenishmentMethod"
  - name: "reorderPoint"
    type: "Decimal"
  - name: "reorderQuantity"
    type: "Decimal"
  - name: "safetyStock"
    type: "Decimal"
  - name: "reviewPeriodDays"
    type: "Integer"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "sourceWarehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
- name: "UnitConversion"
  description: "Item-specific conversion factor between two units of measure."
  data:
  - name: "fromUom"
    type: "UoM"
  - name: "toUom"
    type: "UoM"
  - name: "factor"
    type: "Decimal"
  - name: "isExact"
    type: "Boolean"
  - name: "precision"
    type: "Integer"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "StockCount"
  description: "Inventory counting event used to verify and correct stock records."
  data:
  - name: "countNumber"
    type: "String"
  - name: "status"
    type: "CountStatus"
  - name: "countType"
    type: "CountType"
  - name: "scheduledDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "entries"
    type: "StockCountEntry"
    multiplicity: "OneToMany"
- name: "StockCountEntry"
  description: "Line-level counted quantity and resulting variance for a specific\
    \ item and location."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "countedQuantity"
    type: "Quantity"
  - name: "variance"
    type: "Decimal"
  - name: "reasonCode"
    type: "String"
  relations:
  - name: "stockCount"
    type: "StockCount"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "InventoryLot"
    multiplicity: "ManyToOne"
enums:
- name: "ItemType"
  description: "Classification of an item based on its role in operations."
  data:
  - name: "FinishedGood"
  - name: "Component"
  - name: "RawMaterial"
  - name: "Packaging"
  - name: "Consumable"
  - name: "Kit"
- name: "TrackingMethod"
  description: "Level of traceability required for an item."
  data:
  - name: "None"
  - name: "Lot"
  - name: "Serial"
- name: "UoM"
  description: "Units of measure used for quantities in inventory processes."
  data:
  - name: "Each"
  - name: "Case"
  - name: "Pallet"
  - name: "Kilogram"
  - name: "Gram"
  - name: "Pound"
  - name: "Liter"
  - name: "Meter"
  - name: "SquareMeter"
  - name: "CubicMeter"
- name: "ABCClass"
  description: "Inventory classification for control intensity based on value or velocity."
  data:
  - name: "A"
  - name: "B"
  - name: "C"
- name: "LocationType"
  description: "Functional type of a storage location within a warehouse."
  data:
  - name: "Bin"
  - name: "Rack"
  - name: "Bulk"
  - name: "Staging"
  - name: "Dock"
  - name: "QAHold"
- name: "InventoryStatus"
  description: "Availability state of stock affecting usability."
  data:
  - name: "Available"
  - name: "Reserved"
  - name: "Damaged"
  - name: "OnHold"
  - name: "InTransit"
  - name: "Quarantine"
- name: "InventoryTransactionType"
  description: "Categorization of stock movements recorded as transactions."
  data:
  - name: "Receipt"
  - name: "Issue"
  - name: "TransferOut"
  - name: "TransferIn"
  - name: "AdjustmentIncrease"
  - name: "AdjustmentDecrease"
  - name: "CountIncrease"
  - name: "CountDecrease"
- name: "QualityStatus"
  description: "Quality disposition of a lot affecting its releasability."
  data:
  - name: "Released"
  - name: "PendingInspection"
  - name: "Rejected"
  - name: "Hold"
  - name: "Rework"
- name: "SerializedUnitStatus"
  description: "Lifecycle state of a serialized unit."
  data:
  - name: "InStock"
  - name: "Allocated"
  - name: "Shipped"
  - name: "Returned"
  - name: "Scrapped"
  - name: "UnderInspection"
- name: "TransferStatus"
  description: "Progress state of an inter-warehouse stock transfer."
  data:
  - name: "Planned"
  - name: "Picked"
  - name: "Shipped"
  - name: "InTransit"
  - name: "Received"
  - name: "Closed"
  - name: "Cancelled"
- name: "ReceiptStatus"
  description: "Processing state of an inbound shipment."
  data:
  - name: "Expected"
  - name: "PartiallyReceived"
  - name: "Received"
  - name: "PutAwayInProgress"
  - name: "Closed"
  - name: "Cancelled"
- name: "ShipmentStatus"
  description: "Processing state of an outbound shipment."
  data:
  - name: "Planned"
  - name: "Picking"
  - name: "Packed"
  - name: "Shipped"
  - name: "Delivered"
  - name: "Closed"
  - name: "Cancelled"
- name: "InboundSourceType"
  description: "Origin of goods received into the warehouse."
  data:
  - name: "Purchase"
  - name: "Return"
  - name: "Transfer"
  - name: "Production"
- name: "OutboundDestinationType"
  description: "Type of destination for goods leaving the warehouse."
  data:
  - name: "Customer"
  - name: "Store"
  - name: "Warehouse"
  - name: "Supplier"
  - name: "Disposal"
- name: "ReservationStatus"
  description: "Lifecycle state of a reservation against inventory."
  data:
  - name: "Active"
  - name: "PartiallySatisfied"
  - name: "Satisfied"
  - name: "Cancelled"
  - name: "Expired"
- name: "ReservationReason"
  description: "Purpose for reserving inventory."
  data:
  - name: "SalesOrder"
  - name: "WorkOrder"
  - name: "TransferOrder"
  - name: "ServiceOrder"
  - name: "QualityHold"
- name: "ReplenishmentMethod"
  description: "Strategy used to determine replenishment triggers and quantities."
  data:
  - name: "MinMax"
  - name: "ReorderPoint"
  - name: "Kanban"
  - name: "PeriodicReview"
- name: "CountStatus"
  description: "Processing state of a stock count event."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "PendingApproval"
  - name: "Posted"
  - name: "Cancelled"
- name: "CountType"
  description: "Scope and method of inventory counting."
  data:
  - name: "Cycle"
  - name: "Full"
  - name: "Spot"
  - name: "Investigative"
valueObjects:
- name: "Quantity"
  description: "Numeric amount paired with a unit of measure."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "uom"
    type: "UoM"
- name: "Address"
  description: "Physical address used for facilities and destinations."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "Money"
  description: "Monetary value expressed in a specific currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Dimensions"
  description: "Three-dimensional measurements for an item or package."
  data:
  - name: "length"
    type: "Decimal"
  - name: "width"
    type: "Decimal"
  - name: "height"
    type: "Decimal"
  - name: "unit"
    type: "String"
- name: "Weight"
  description: "Mass of an item or package with a measurement unit."
  data:
  - name: "value"
    type: "Decimal"
  - name: "unit"
    type: "String"
