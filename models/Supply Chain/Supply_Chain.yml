metadata:
  name: "Supply Chain Industry Domain Model"
  description: "HCIDL model capturing procurement, inventory, warehousing, transportation,\
    \ and cross-border trade capabilities."
  version: "1.0.0"
  industry: "SupplyChain"
  category: "Supply Chain"
  language: "en-US"
  type: "Industry"
  domain: "Supply Chain"
enums:
- name: "BusinessFunction"
  description: "Functional domain of a business unit within the enterprise."
  data:
  - name: "Procurement"
  - name: "Manufacturing"
  - name: "Logistics"
  - name: "Sales"
  - name: "Finance"
  - name: "Quality"
  - name: "Planning"
- name: "PartnerType"
  description: "Classification of a trading partner by their operational role."
  data:
  - name: "Supplier"
  - name: "Customer"
  - name: "Carrier"
  - name: "ThirdPartyLogistics"
  - name: "Broker"
  - name: "Manufacturer"
  - name: "Distributor"
  - name: "Retailer"
- name: "FacilityType"
  description: "Type of physical site used within the supply chain network."
  data:
  - name: "Plant"
  - name: "DistributionCenter"
  - name: "Warehouse"
  - name: "CrossDock"
  - name: "Yard"
  - name: "Port"
  - name: "Airport"
  - name: "RetailStore"
- name: "LocationType"
  description: "Purpose or behavior of a storage or processing location inside a facility."
  data:
  - name: "Bin"
  - name: "Bulk"
  - name: "Staging"
  - name: "DockDoor"
  - name: "QualityHold"
  - name: "Returns"
  - name: "WorkArea"
- name: "ProductType"
  description: "Nature of a product managed in the supply chain."
  data:
  - name: "FinishedGood"
  - name: "Component"
  - name: "RawMaterial"
  - name: "Packaging"
  - name: "Service"
- name: "PackagingLevel"
  description: "Hierarchical level for standardized packaging configurations."
  data:
  - name: "Each"
  - name: "InnerPack"
  - name: "Carton"
  - name: "Case"
  - name: "Pallet"
  - name: "Container"
- name: "LotStatus"
  description: "Lifecycle state of a product lot."
  data:
  - name: "Released"
  - name: "Quarantine"
  - name: "Blocked"
  - name: "Expired"
- name: "PurchaseOrderStatus"
  description: "Processing status of a purchase order or its lines."
  data:
  - name: "Draft"
  - name: "Approved"
  - name: "Sent"
  - name: "PartiallyReceived"
  - name: "Received"
  - name: "Closed"
  - name: "Cancelled"
- name: "SalesOrderStatus"
  description: "Processing status of a sales order or its lines."
  data:
  - name: "Draft"
  - name: "Confirmed"
  - name: "Allocated"
  - name: "PartiallyShipped"
  - name: "Shipped"
  - name: "Delivered"
  - name: "Invoiced"
  - name: "Closed"
  - name: "Cancelled"
- name: "ASNStatus"
  description: "Status of an advance shipment notice document."
  data:
  - name: "Created"
  - name: "Sent"
  - name: "Revised"
  - name: "Cancelled"
- name: "ReceiptStatus"
  description: "Status of warehouse receiving operations for a delivery."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "Completed"
  - name: "Reconciled"
  - name: "Discrepancy"
- name: "TaskStatus_"
  description: "Execution status for warehouse and planning tasks."
  data:
  - name: "Planned"
  - name: "Released"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "WaveStatus"
  description: "Status of a picking wave controlling grouped work."
  data:
  - name: "Planned"
  - name: "Released"
  - name: "Closed"
  - name: "Cancelled"
- name: "AdjustmentReason"
  description: "Reason code used to justify an inventory balance correction."
  data:
  - name: "Damage"
  - name: "Shrinkage"
  - name: "CountCorrection"
  - name: "Expiration"
  - name: "Conversion"
  - name: "Other"
- name: "CountStatus"
  description: "State of a cycle counting activity."
  data:
  - name: "Planned"
  - name: "Counting"
  - name: "Recount"
  - name: "Approved"
  - name: "Posted"
- name: "TransferStatus"
  description: "Status of an internal stock transfer between facilities."
  data:
  - name: "Draft"
  - name: "Released"
  - name: "Shipped"
  - name: "Received"
  - name: "Closed"
  - name: "Cancelled"
- name: "ShipmentStatus"
  description: "Operational state of a shipment throughout its lifecycle."
  data:
  - name: "Planned"
  - name: "Tendered"
  - name: "Accepted"
  - name: "InTransit"
  - name: "Arrived"
  - name: "Delivered"
  - name: "Exception"
  - name: "Closed"
- name: "TransportMode"
  description: "Primary mode used to move a shipment."
  data:
  - name: "Road"
  - name: "Rail"
  - name: "Ocean"
  - name: "Air"
  - name: "Courier"
  - name: "Pipeline"
  - name: "Intermodal"
- name: "HandlingUnitStatus"
  description: "Status of a handling unit as it progresses through the warehouse and\
    \ transport flow."
  data:
  - name: "Packed"
  - name: "Staged"
  - name: "Loaded"
  - name: "InTransit"
  - name: "Received"
  - name: "Damaged"
  - name: "Lost"
- name: "EquipmentType"
  description: "Category of transport equipment used to carry goods."
  data:
  - name: "Container20"
  - name: "Container40"
  - name: "Trailer"
  - name: "BoxTruck"
  - name: "Flatbed"
  - name: "Reefer"
- name: "ServiceLevel"
  description: "Speed and reliability tier for a transportation service."
  data:
  - name: "Economy"
  - name: "Standard"
  - name: "Expedited"
  - name: "SameDay"
  - name: "TwoDay"
- name: "StopType"
  description: "Purpose of a shipment stop in a planned route."
  data:
  - name: "Pickup"
  - name: "Dropoff"
  - name: "Customs"
  - name: "Layover"
- name: "AppointmentStatus"
  description: "State of a scheduled dock appointment."
  data:
  - name: "Requested"
  - name: "Confirmed"
  - name: "CheckedIn"
  - name: "Completed"
  - name: "NoShow"
  - name: "Cancelled"
- name: "DockType"
  description: "Operating orientation of a facility dock."
  data:
  - name: "Inbound"
  - name: "Outbound"
  - name: "Mixed"
- name: "DockStatus"
  description: "Availability of a facility dock for appointments."
  data:
  - name: "Available"
  - name: "Occupied"
  - name: "Closed"
  - name: "Maintenance"
- name: "DocumentType"
  description: "Kind of compliance or logistics document attached to goods or shipments."
  data:
  - name: "CertificateOfAnalysis"
  - name: "SafetyDataSheet"
  - name: "CountryOfOrigin"
  - name: "PackingList"
  - name: "BillOfLading"
  - name: "CommercialInvoice"
  - name: "InsuranceCertificate"
- name: "CustomsStatus"
  description: "Status of a customs declaration during border clearance."
  data:
  - name: "Draft"
  - name: "Filed"
  - name: "UnderReview"
  - name: "Cleared"
  - name: "Held"
  - name: "Rejected"
- name: "ForecastGranularity"
  description: "Time bucket size for planning demand forecasts."
  data:
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
- name: "Incoterm"
  description: "International commercial terms defining responsibilities for delivery\
    \ and risk."
  data:
  - name: "EXW"
  - name: "FCA"
  - name: "CPT"
  - name: "CIP"
  - name: "DAP"
  - name: "DDP"
  - name: "FOB"
  - name: "CFR"
  - name: "CIF"
- name: "InvoiceType"
  description: "Accounting classification for an invoice document."
  data:
  - name: "AR"
  - name: "AP"
  - name: "CreditMemo"
  - name: "DebitMemo"
- name: "InvoiceStatus"
  description: "Payment and processing state of an invoice."
  data:
  - name: "Draft"
  - name: "Issued"
  - name: "Sent"
  - name: "PartiallyPaid"
  - name: "Paid"
  - name: "Disputed"
  - name: "Cancelled"
valueObjects:
- name: "Money"
  description: "Monetary value paired with a currency code used for pricing and valuation."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address used for shipping, billing, and facility locations."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "GeoCoordinate"
  description: "Geographic latitude and longitude for mapping a physical location."
  data:
  - name: "latitude"
    type: "Decimal"
  - name: "longitude"
    type: "Decimal"
- name: "UOM"
  description: "Unit of measure used to quantify items, weight, or volume."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
- name: "Dimensions"
  description: "Physical measurements of an item or handling unit."
  data:
  - name: "length"
    type: "Decimal"
  - name: "width"
    type: "Decimal"
  - name: "height"
    type: "Decimal"
  - name: "uom"
    type: "UOM"
- name: "HSCode"
  description: "Harmonized System classification used for international trade and\
    \ customs."
  data:
  - name: "code"
    type: "String"
  - name: "description"
    type: "String"
- name: "TimeWindow"
  description: "Interval with a start and end timestamp used for planning appointments\
    \ and stops."
  data:
  - name: "start"
    type: "DateTime"
  - name: "end"
    type: "DateTime"
