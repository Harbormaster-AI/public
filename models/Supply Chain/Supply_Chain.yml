---
entities:
- name: "Enterprise"
  description: "Legal entity that orchestrates and governs the end-to-end supply chain\
    \ across business units and geographies."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "taxId"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "businessUnits"
    type: "BusinessUnit"
    multiplicity: "OneToMany"
  - name: "facilities"
    type: "Facility"
    multiplicity: "OneToMany"
  - name: "tradingPartners"
    type: "TradingPartner"
    multiplicity: "ManyToMany"
- name: "BusinessUnit"
  description: "Operational subdivision of an enterprise with its own objectives,\
    \ processes, and P&L."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "function"
    type: "BusinessFunction"
  relations:
  - name: "enterprise"
    type: "Enterprise"
    multiplicity: "ManyToOne"
  - name: "facilities"
    type: "Facility"
    multiplicity: "OneToMany"
  - name: "catalogs"
    type: "Product"
    multiplicity: "OneToMany"
- name: "TradingPartner"
  description: "External or internal organization that exchanges goods, services,\
    \ or information within the supply chain."
  data:
  - name: "name"
    type: "String"
  - name: "partnerType"
    type: "PartnerType"
  - name: "dunsNumber"
    type: "String"
  - name: "taxId"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  relations:
  - name: "contracts"
    type: "Contract"
    multiplicity: "OneToMany"
  - name: "carrierServices"
    type: "CarrierService"
    multiplicity: "OneToMany"
  - name: "purchaseOrders"
    type: "PurchaseOrder"
    multiplicity: "OneToMany"
  - name: "salesOrders"
    type: "SalesOrder"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
- name: "Facility"
  description: "Physical site where goods are received, stored, processed, or shipped."
  data:
  - name: "name"
    type: "String"
  - name: "facilityCode"
    type: "String"
  - name: "facilityType"
    type: "FacilityType"
  - name: "timeZone"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "geo"
    type: "GeoCoordinate"
  relations:
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "docks"
    type: "Dock"
    multiplicity: "OneToMany"
  - name: "storageAreas"
    type: "StorageArea"
    multiplicity: "OneToMany"
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
- name: "Dock"
  description: "Inbound or outbound door where vehicles are scheduled to load or unload."
  data:
  - name: "dockCode"
    type: "String"
  - name: "dockType"
    type: "DockType"
  - name: "status"
    type: "DockStatus"
  relations:
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
- name: "StorageArea"
  description: "Logical zone within a facility used to group locations with similar\
    \ characteristics."
  data:
  - name: "name"
    type: "String"
  - name: "areaCode"
    type: "String"
  - name: "temperatureControlled"
    type: "Boolean"
  relations:
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
- name: "Location"
  description: "Addressable place within a facility where inventory can be stored\
    \ or processed."
  data:
  - name: "locationCode"
    type: "String"
  - name: "locationType"
    type: "LocationType"
  - name: "capacityQuantity"
    type: "Decimal"
  - name: "capacityUom"
    type: "UOM"
  relations:
  - name: "storageArea"
    type: "StorageArea"
    multiplicity: "ManyToOne"
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "stockItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
  - name: "cycleCounts"
    type: "CycleCount"
    multiplicity: "OneToMany"
- name: "Product"
  description: "Trade item managed in the supply chain, such as a material, component,\
    \ or finished good."
  data:
  - name: "sku"
    type: "String"
  - name: "name"
    type: "String"
  - name: "productType"
    type: "ProductType"
  - name: "unitOfMeasure"
    type: "UOM"
  - name: "netWeight"
    type: "Decimal"
  - name: "grossWeight"
    type: "Decimal"
  - name: "weightUom"
    type: "UOM"
  - name: "dimensions"
    type: "Dimensions"
  - name: "harmonizedCode"
    type: "HSCode"
  - name: "asHazardous"
    type: "Boolean"
  relations:
  - name: "suppliers"
    type: "TradingPartner"
    multiplicity: "ManyToMany"
  - name: "customers"
    type: "TradingPartner"
    multiplicity: "ManyToMany"
  - name: "packagingSpecs"
    type: "PackagingSpec"
    multiplicity: "OneToMany"
  - name: "lots"
    type: "Lot"
    multiplicity: "OneToMany"
  - name: "billOfMaterials"
    type: "BillOfMaterials"
    multiplicity: "OneToOne"
- name: "BillOfMaterials"
  description: "Structured list of components and quantities required to produce a\
    \ product."
  data:
  - name: "bomNumber"
    type: "String"
  - name: "revision"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "OneToOne"
  - name: "items"
    type: "BOMItem"
    multiplicity: "OneToMany"
- name: "BOMItem"
  description: "Component line specifying required quantity and unit for a bill of\
    \ materials."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Decimal"
  - name: "uom"
    type: "UOM"
  - name: "scrapFactor"
    type: "Decimal"
  relations:
  - name: "billOfMaterials"
    type: "BillOfMaterials"
    multiplicity: "ManyToOne"
  - name: "component"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "PackagingSpec"
  description: "Definition of standard packaging for a product at a given level."
  data:
  - name: "level"
    type: "PackagingLevel"
  - name: "quantityPer"
    type: "Decimal"
  - name: "uom"
    type: "UOM"
  - name: "dimensions"
    type: "Dimensions"
  - name: "weight"
    type: "Decimal"
  - name: "weightUom"
    type: "UOM"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "Lot"
  description: "Batch identifier that groups product units produced or received at\
    \ the same time."
  data:
  - name: "lotNumber"
    type: "String"
  - name: "manufactureDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "status"
    type: "LotStatus"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "supplier"
    type: "TradingPartner"
    multiplicity: "ManyToOne"
  - name: "qualityInspections"
    type: "ComplianceDocument"
    multiplicity: "OneToMany"
- name: "InventoryItem"
  description: "Quantity of a specific product and lot held at a location within a\
    \ facility."
  data:
  - name: "quantityOnHand"
    type: "Decimal"
  - name: "quantityReserved"
    type: "Decimal"
  - name: "uom"
    type: "UOM"
  - name: "ownerReference"
    type: "String"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "TradingPartner"
    multiplicity: "ManyToOne"
- name: "PurchaseOrder"
  description: "Commercial document issued by a buyer requesting products from a supplier."
  data:
  - name: "poNumber"
    type: "String"
  - name: "status"
    type: "PurchaseOrderStatus"
  - name: "orderDate"
    type: "Date"
  - name: "promisedDate"
    type: "Date"
  - name: "incoterm"
    type: "Incoterm"
  - name: "currency"
    type: "String"
  - name: "totalAmount"
    type: "Money"
  relations:
  - name: "supplier"
    type: "TradingPartner"
    multiplicity: "ManyToOne"
  - name: "buyer"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "shipTo"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "PurchaseOrderLine"
    multiplicity: "OneToMany"
  - name: "asns"
    type: "ASN"
    multiplicity: "OneToMany"
  - name: "receipts"
    type: "GoodsReceipt"
    multiplicity: "OneToMany"
- name: "PurchaseOrderLine"
  description: "Line item on a purchase order specifying product, quantity, and price."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Decimal"
  - name: "uom"
    type: "UOM"
  - name: "unitPrice"
    type: "Money"
  - name: "status"
    type: "PurchaseOrderStatus"
  - name: "requestedDate"
    type: "Date"
  relations:
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "ASN"
  description: "Advance shipment notice sent by a supplier to inform the receiver\
    \ of an incoming delivery."
  data:
  - name: "asnNumber"
    type: "String"
  - name: "status"
    type: "ASNStatus"
  - name: "expectedArrivalDate"
    type: "Date"
  - name: "carrierReference"
    type: "String"
  relations:
  - name: "supplier"
    type: "TradingPartner"
    multiplicity: "ManyToOne"
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "ASNLine"
    multiplicity: "OneToMany"
- name: "ASNLine"
  description: "Product line within an advance shipment notice with quantities and\
    \ lot details."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Decimal"
  - name: "uom"
    type: "UOM"
  relations:
  - name: "asn"
    type: "ASN"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "purchaseOrderLine"
    type: "PurchaseOrderLine"
    multiplicity: "ManyToOne"
- name: "GoodsReceipt"
  description: "Record of received goods against a purchase order or ASN."
  data:
  - name: "receiptNumber"
    type: "String"
  - name: "receiptDate"
    type: "Date"
  - name: "status"
    type: "ReceiptStatus"
  relations:
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "asn"
    type: "ASN"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "GoodsReceiptLine"
    multiplicity: "OneToMany"
  - name: "handlingUnits"
    type: "HandlingUnit"
    multiplicity: "OneToMany"
- name: "GoodsReceiptLine"
  description: "Line item on a goods receipt recording quantities received and lot\
    \ information."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantityReceived"
    type: "Decimal"
  - name: "uom"
    type: "UOM"
  relations:
  - name: "goodsReceipt"
    type: "GoodsReceipt"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "purchaseOrderLine"
    type: "PurchaseOrderLine"
    multiplicity: "ManyToOne"
  - name: "handlingUnit"
    type: "HandlingUnit"
    multiplicity: "ManyToOne"
- name: "PutawayTask"
  description: "Warehouse task to move received goods to their designated storage\
    \ locations."
  data:
  - name: "taskNumber"
    type: "String"
  - name: "status"
    type: "TaskStatus_"
  - name: "quantity"
    type: "Decimal"
  - name: "uom"
    type: "UOM"
  relations:
  - name: "goodsReceipt"
    type: "GoodsReceipt"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "fromLocation"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "toLocation"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "SalesOrder"
  description: "Commercial order from a customer requesting delivery of products."
  data:
  - name: "soNumber"
    type: "String"
  - name: "status"
    type: "SalesOrderStatus"
  - name: "orderDate"
    type: "Date"
  - name: "requestedShipDate"
    type: "Date"
  - name: "shipToAddress"
    type: "Address"
  - name: "billToAddress"
    type: "Address"
  - name: "currency"
    type: "String"
  - name: "totalAmount"
    type: "Money"
  relations:
  - name: "customer"
    type: "TradingPartner"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "shipFrom"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "SalesOrderLine"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
- name: "SalesOrderLine"
  description: "Line item on a sales order with requested quantity, price, and allocation\
    \ details."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Decimal"
  - name: "uom"
    type: "UOM"
  - name: "unitPrice"
    type: "Money"
  - name: "status"
    type: "SalesOrderStatus"
  - name: "requestedDate"
    type: "Date"
  relations:
  - name: "salesOrder"
    type: "SalesOrder"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "allocations"
    type: "PickTask"
    multiplicity: "OneToMany"
- name: "PickingWave"
  description: "Grouping of orders or lines to be picked together within a time window."
  data:
  - name: "waveNumber"
    type: "String"
  - name: "status"
    type: "WaveStatus"
  - name: "scheduledStart"
    type: "DateTime"
  - name: "scheduledEnd"
    type: "DateTime"
  relations:
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "pickTasks"
    type: "PickTask"
    multiplicity: "OneToMany"
  - name: "salesOrders"
    type: "SalesOrder"
    multiplicity: "OneToMany"
- name: "PickTask"
  description: "Instruction to retrieve specified quantities from locations to fulfill\
    \ demand."
  data:
  - name: "taskNumber"
    type: "String"
  - name: "status"
    type: "TaskStatus_"
  - name: "quantity"
    type: "Decimal"
  - name: "uom"
    type: "UOM"
  relations:
  - name: "wave"
    type: "PickingWave"
    multiplicity: "ManyToOne"
  - name: "fromLocation"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "toLocation"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "salesOrderLine"
    type: "SalesOrderLine"
    multiplicity: "ManyToOne"
- name: "TransferOrder"
  description: "Internal document to move inventory between facilities."
  data:
  - name: "transferNumber"
    type: "String"
  - name: "status"
    type: "TransferStatus"
  - name: "requestedShipDate"
    type: "Date"
  relations:
  - name: "fromFacility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "toFacility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "TransferOrderLine"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
- name: "TransferOrderLine"
  description: "Line item specifying product and quantity to be transferred."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Decimal"
  - name: "uom"
    type: "UOM"
  relations:
  - name: "transferOrder"
    type: "TransferOrder"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
- name: "Shipment"
  description: "Movement of goods from an origin to a destination via a carrier service."
  data:
  - name: "shipmentNumber"
    type: "String"
  - name: "status"
    type: "ShipmentStatus"
  - name: "mode"
    type: "TransportMode"
  - name: "incoterm"
    type: "Incoterm"
  - name: "plannedDeparture"
    type: "DateTime"
  - name: "plannedArrival"
    type: "DateTime"
  - name: "actualDeparture"
    type: "DateTime"
  - name: "actualArrival"
    type: "DateTime"
  - name: "totalWeight"
    type: "Decimal"
  - name: "weightUom"
    type: "UOM"
  - name: "totalVolume"
    type: "Decimal"
  - name: "volumeUom"
    type: "UOM"
  relations:
  - name: "origin"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "destination"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "TradingPartner"
    multiplicity: "ManyToOne"
  - name: "service"
    type: "CarrierService"
    multiplicity: "ManyToOne"
  - name: "stops"
    type: "Stop"
    multiplicity: "OneToMany"
  - name: "handlingUnits"
    type: "HandlingUnit"
    multiplicity: "OneToMany"
  - name: "equipment"
    type: "TransportEquipment"
    multiplicity: "OneToMany"
  - name: "salesOrders"
    type: "SalesOrder"
    multiplicity: "ManyToMany"
  - name: "purchaseOrders"
    type: "PurchaseOrder"
    multiplicity: "ManyToMany"
  - name: "customsDeclaration"
    type: "CustomsDeclaration"
    multiplicity: "OneToOne"
- name: "Stop"
  description: "Planned or actual visit within a shipment route for loading, unloading,\
    \ or control."
  data:
  - name: "sequenceNumber"
    type: "Integer"
  - name: "stopType"
    type: "StopType"
  - name: "appointmentWindow"
    type: "TimeWindow"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
- name: "HandlingUnit"
  description: "Physical handling container such as a case, pallet, or container used\
    \ to group items."
  data:
  - name: "huId"
    type: "String"
  - name: "level"
    type: "PackagingLevel"
  - name: "status"
    type: "HandlingUnitStatus"
  - name: "grossWeight"
    type: "Decimal"
  - name: "weightUom"
    type: "UOM"
  - name: "dimensions"
    type: "Dimensions"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "HandlingUnitItem"
    multiplicity: "OneToMany"
- name: "HandlingUnitItem"
  description: "Association of a product and lot with a quantity contained in a handling\
    \ unit."
  data:
  - name: "quantity"
    type: "Decimal"
  - name: "uom"
    type: "UOM"
  relations:
  - name: "handlingUnit"
    type: "HandlingUnit"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "salesOrderLine"
    type: "SalesOrderLine"
    multiplicity: "ManyToOne"
  - name: "purchaseOrderLine"
    type: "PurchaseOrderLine"
    multiplicity: "ManyToOne"
- name: "TransportEquipment"
  description: "Conveyance asset used to move shipments such as a container, trailer,\
    \ or vehicle."
  data:
  - name: "equipmentId"
    type: "String"
  - name: "equipmentType"
    type: "EquipmentType"
  - name: "sealNumber"
    type: "String"
  - name: "tareWeight"
    type: "Decimal"
  - name: "weightUom"
    type: "UOM"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "TradingPartner"
    multiplicity: "ManyToOne"
- name: "CarrierService"
  description: "Transportation service offering provided by a carrier with a defined\
    \ service level."
  data:
  - name: "serviceCode"
    type: "String"
  - name: "serviceLevel"
    type: "ServiceLevel"
  - name: "mode"
    type: "TransportMode"
  relations:
  - name: "carrier"
    type: "TradingPartner"
    multiplicity: "ManyToOne"
- name: "Appointment"
  description: "Scheduled time at a facility dock for a carrier to load or unload\
    \ a shipment."
  data:
  - name: "appointmentNumber"
    type: "String"
  - name: "status"
    type: "AppointmentStatus"
  - name: "scheduledStart"
    type: "DateTime"
  - name: "scheduledEnd"
    type: "DateTime"
  - name: "checkInTime"
    type: "DateTime"
  - name: "checkOutTime"
    type: "DateTime"
  relations:
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "dock"
    type: "Dock"
    multiplicity: "ManyToOne"
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "TradingPartner"
    multiplicity: "ManyToOne"
- name: "InventoryAdjustment"
  description: "Transaction that changes inventory balances due to operational or\
    \ accounting reasons."
  data:
  - name: "adjustmentNumber"
