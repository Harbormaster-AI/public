---
metadata:
  name: "HCIDL Procurement Capabilities Model"
  description: "Canonical capability model for enterprise procurement, covering sourcing,\
    \ contracting, requisitioning, purchasing, receiving, invoicing, and supplier\
    \ performance management."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Supply Chain"
  type: "Capability"
  domain: "Procurement"
entities:
- name: "BuyingOrganization"
  description: "Legal entity responsible for procurement activities and commercial\
    \ agreements."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "taxIdentifier"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "primaryCurrency"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "businessUnits"
    type: "BusinessUnit"
    multiplicity: "OneToMany"
  - name: "buyers"
    type: "Buyer"
    multiplicity: "OneToMany"
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "ManyToMany"
  - name: "categories"
    type: "Category"
    multiplicity: "OneToMany"
- name: "BusinessUnit"
  description: "Internal organizational unit initiating requisitions and holding budgets."
  data:
  - name: "name"
    type: "String"
  - name: "costCenterCode"
    type: "String"
  - name: "locationCountry"
    type: "String"
  relations:
  - name: "organization"
    type: "BuyingOrganization"
    multiplicity: "ManyToOne"
  - name: "requisitions"
    type: "PurchaseRequisition"
    multiplicity: "OneToMany"
  - name: "approvalRules"
    type: "ApprovalRule"
    multiplicity: "OneToMany"
  - name: "catalogs"
    type: "Catalog"
    multiplicity: "OneToMany"
  - name: "budgets"
    type: "BudgetAllocation"
    multiplicity: "OneToMany"
- name: "Buyer"
  description: "Procurement professional responsible for sourcing events, contracts,\
    \ and purchase orders."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  relations:
  - name: "organization"
    type: "BuyingOrganization"
    multiplicity: "ManyToOne"
  - name: "sourcingProjects"
    type: "SourcingProject"
    multiplicity: "OneToMany"
  - name: "purchaseOrders"
    type: "PurchaseOrder"
    multiplicity: "OneToMany"
  - name: "evaluations"
    type: "SupplierScorecard"
    multiplicity: "OneToMany"
- name: "Employee"
  description: "Internal user participating in procurement as requester, approver,\
    \ or manager."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "EmployeeRole"
  relations:
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "requisitions"
    type: "PurchaseRequisition"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "ApprovalRequest"
    multiplicity: "OneToMany"
- name: "Supplier"
  description: "External organization providing goods or services."
  data:
  - name: "name"
    type: "String"
  - name: "supplierType"
    type: "SupplierType"
  - name: "taxIdentifier"
    type: "String"
  - name: "website"
    type: "String"
  - name: "primaryCurrency"
    type: "String"
  - name: "paymentTerm"
    type: "PaymentTerm"
  - name: "riskRating"
    type: "RiskRating"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "contacts"
    type: "SupplierContact"
    multiplicity: "OneToMany"
  - name: "locations"
    type: "SupplierLocation"
    multiplicity: "OneToMany"
  - name: "categories"
    type: "Category"
    multiplicity: "ManyToMany"
  - name: "catalogs"
    type: "Catalog"
    multiplicity: "OneToMany"
  - name: "contracts"
    type: "Contract"
    multiplicity: "OneToMany"
  - name: "bids"
    type: "SupplierBid"
    multiplicity: "OneToMany"
  - name: "purchaseOrders"
    type: "PurchaseOrder"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "SupplierInvoice"
    multiplicity: "OneToMany"
  - name: "qualifications"
    type: "SupplierQualification"
    multiplicity: "OneToMany"
  - name: "scorecards"
    type: "SupplierScorecard"
    multiplicity: "OneToMany"
  - name: "bankAccounts"
    type: "SupplierBankAccount"
    multiplicity: "OneToMany"
- name: "SupplierContact"
  description: "Named contact at the supplier for commercial or operational communication."
  data:
  - name: "name"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "role"
    type: "String"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
- name: "SupplierLocation"
  description: "Supplier physical or shipping location relevant for logistics and\
    \ taxation."
  data:
  - name: "name"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "incoterm"
    type: "Incoterm"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
- name: "Category"
  description: "Procurement category grouping similar goods or services."
  data:
  - name: "name"
    type: "String"
  - name: "categoryCode"
    type: "String"
  relations:
  - name: "parentCategory"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "subcategories"
    type: "Category"
    multiplicity: "OneToMany"
  - name: "items"
    type: "Item"
    multiplicity: "OneToMany"
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "ManyToMany"
  - name: "catalogs"
    type: "Catalog"
    multiplicity: "OneToMany"
  - name: "approvalRules"
    type: "ApprovalRule"
    multiplicity: "OneToMany"
  - name: "contracts"
    type: "Contract"
    multiplicity: "OneToMany"
- name: "Item"
  description: "Purchasable good or service defined for procurement and cataloging."
  data:
  - name: "sku"
    type: "String"
  - name: "name"
    type: "String"
  - name: "itemType"
    type: "ItemType"
  - name: "description"
    type: "String"
  - name: "unitOfMeasure"
    type: "UoM"
  - name: "defaultPrice"
    type: "Money"
  - name: "leadTimeDays"
    type: "Integer"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "preferredSupplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "catalogs"
    type: "Catalog"
    multiplicity: "ManyToMany"
  - name: "contractLines"
    type: "ContractLine"
    multiplicity: "OneToMany"
  - name: "requisitionLines"
    type: "RequisitionLine"
    multiplicity: "OneToMany"
  - name: "purchaseOrderLines"
    type: "PurchaseOrderLine"
    multiplicity: "OneToMany"
- name: "Catalog"
  description: "Published list of items, prices, and terms provided by a supplier\
    \ to the buying organization."
  data:
  - name: "name"
    type: "String"
  - name: "effectivePeriod"
    type: "DateRange"
  - name: "currency"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "BuyingOrganization"
    multiplicity: "ManyToOne"
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "Item"
    multiplicity: "ManyToMany"
- name: "BudgetAllocation"
  description: "Budget available to a business unit for a given category and fiscal\
    \ period."
  data:
  - name: "fiscalYear"
    type: "Integer"
  - name: "costCenterCode"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "remainingAmount"
    type: "Money"
  relations:
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
- name: "SourcingProject"
  description: "Initiative to source goods or services culminating in supplier selection\
    \ and contracting."
  data:
  - name: "name"
    type: "String"
  - name: "objective"
    type: "String"
  - name: "status"
    type: "SourcingProjectStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "buyer"
    type: "Buyer"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "rfxEvents"
    type: "RFxEvent"
    multiplicity: "OneToMany"
  - name: "contract"
    type: "Contract"
    multiplicity: "OneToOne"
- name: "RFxEvent"
  description: "Formal information, quotation, proposal, or auction event issued to\
    \ suppliers."
  data:
  - name: "eventCode"
    type: "String"
  - name: "eventType"
    type: "RFxType"
  - name: "status"
    type: "RFxStatus"
  - name: "openDate"
    type: "Date"
  - name: "closeDate"
    type: "Date"
  - name: "currency"
    type: "String"
  relations:
  - name: "sourcingProject"
    type: "SourcingProject"
    multiplicity: "ManyToOne"
  - name: "lots"
    type: "RFxLot"
    multiplicity: "OneToMany"
  - name: "invitedSuppliers"
    type: "Supplier"
    multiplicity: "ManyToMany"
  - name: "bids"
    type: "SupplierBid"
    multiplicity: "OneToMany"
  - name: "awardDecisions"
    type: "AwardDecision"
    multiplicity: "OneToMany"
- name: "RFxLot"
  description: "Grouping of items or scope within an RFx event, commonly awarded as\
    \ a unit."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "termsText"
    type: "String"
  - name: "requiredDeliveryDate"
    type: "Date"
  relations:
  - name: "rfxEvent"
    type: "RFxEvent"
    multiplicity: "ManyToOne"
  - name: "itemSpecifications"
    type: "ItemSpecification"
    multiplicity: "OneToMany"
  - name: "awardedBid"
    type: "SupplierBid"
    multiplicity: "ManyToOne"
- name: "ItemSpecification"
  description: "Technical and commercial specification for an item or service requested\
    \ in sourcing."
  data:
  - name: "specificationText"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "unitOfMeasure"
    type: "UoM"
  - name: "targetPrice"
    type: "Money"
  relations:
  - name: "lot"
    type: "RFxLot"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "SupplierBid"
  description: "Supplier submission responding to an RFx event with commercial and\
    \ technical details."
  data:
  - name: "bidNumber"
    type: "String"
  - name: "submissionDate"
    type: "Date"
  - name: "status"
    type: "BidStatus"
  - name: "totalAmount"
    type: "Money"
  - name: "validityPeriod"
    type: "DateRange"
  - name: "paymentTerms"
    type: "PaymentTerm"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "rfxEvent"
    type: "RFxEvent"
    multiplicity: "ManyToOne"
  - name: "lotResponses"
    type: "BidLine"
    multiplicity: "OneToMany"
  - name: "awards"
    type: "AwardDecision"
    multiplicity: "OneToMany"
  - name: "contract"
    type: "Contract"
    multiplicity: "OneToOne"
- name: "BidLine"
  description: "Line-level response within a supplier bid corresponding to a requested\
    \ specification."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "unitPrice"
    type: "Money"
  - name: "quantityOffered"
    type: "Decimal"
  - name: "incoterm"
    type: "Incoterm"
  - name: "deliveryDays"
    type: "Integer"
  - name: "notes"
    type: "String"
  relations:
  - name: "supplierBid"
    type: "SupplierBid"
    multiplicity: "ManyToOne"
  - name: "itemSpecification"
    type: "ItemSpecification"
    multiplicity: "ManyToOne"
  - name: "shipFrom"
    type: "SupplierLocation"
    multiplicity: "ManyToOne"
- name: "AwardDecision"
  description: "Decision record documenting the outcome of supplier selection for\
    \ an RFx event or lot."
  data:
  - name: "decisionDate"
    type: "Date"
  - name: "awardType"
    type: "AwardType"
  - name: "comments"
    type: "String"
  relations:
  - name: "rfxEvent"
    type: "RFxEvent"
    multiplicity: "ManyToOne"
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "bid"
    type: "SupplierBid"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "RFxLot"
    multiplicity: "ManyToOne"
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
- name: "Contract"
  description: "Binding commercial agreement with a supplier defining terms, pricing,\
    \ and scope."
  data:
  - name: "contractNumber"
    type: "String"
  - name: "contractType"
    type: "ContractType"
  - name: "status"
    type: "ContractStatus"
  - name: "effectivePeriod"
    type: "DateRange"
  - name: "totalValue"
    type: "Money"
  - name: "paymentTerms"
    type: "PaymentTerm"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "contractLines"
    type: "ContractLine"
    multiplicity: "OneToMany"
  - name: "sourcingProject"
    type: "SourcingProject"
    multiplicity: "OneToOne"
  - name: "purchaseOrders"
    type: "PurchaseOrder"
    multiplicity: "OneToMany"
- name: "ContractLine"
  description: "Line-level pricing or scope element within a contract."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "itemDescription"
    type: "String"
  - name: "unitOfMeasure"
    type: "UoM"
  - name: "unitPrice"
    type: "Money"
  - name: "minOrderQuantity"
    type: "Decimal"
  - name: "maxOrderQuantity"
    type: "Decimal"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "PurchaseRequisition"
  description: "Internal request to procure goods or services subject to approval."
  data:
  - name: "requisitionNumber"
    type: "String"
  - name: "status"
    type: "RequisitionStatus"
  - name: "requestedDeliveryDate"
    type: "Date"
  - name: "justification"
    type: "String"
  - name: "totalAmount"
    type: "Money"
  - name: "urgency"
    type: "ProcurementUrgency"
  relations:
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "requester"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "RequisitionLine"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "ApprovalRequest"
    multiplicity: "OneToMany"
  - name: "sourcingProject"
    type: "SourcingProject"
    multiplicity: "ManyToOne"
  - name: "purchaseOrders"
    type: "PurchaseOrder"
    multiplicity: "OneToMany"
- name: "RequisitionLine"
  description: "Line-level detail on a purchase requisition describing quantity and\
    \ pricing."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "unitPrice"
    type: "Money"
  - name: "total"
    type: "Money"
  - name: "needByDate"
    type: "Date"
  relations:
  - name: "requisition"
    type: "PurchaseRequisition"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "contractLine"
    type: "ContractLine"
    multiplicity: "ManyToOne"
- name: "ApprovalRule"
  description: "Policy defining approvers and thresholds for procurement documents."
  data:
  - name: "name"
    type: "String"
  - name: "threshold"
    type: "Money"
  - name: "ruleType"
    type: "ApprovalRuleType"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "approvers"
    type: "Employee"
    multiplicity: "ManyToMany"
- name: "ApprovalRequest"
  description: "Workflow instance requesting approval for a requisition or purchase\
    \ order."
  data:
  - name: "requestDate"
    type: "Date"
  - name: "status"
    type: "ApprovalStatus"
  - name: "decisionDate"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "requisition"
    type: "PurchaseRequisition"
    multiplicity: "ManyToOne"
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "PurchaseOrder"
  description: "Commercial order issued to a supplier to procure goods or services."
  data:
  - name: "purchaseOrderNumber"
    type: "String"
  - name: "status"
    type: "PurchaseOrderStatus"
  - name: "orderDate"
    type: "Date"
  - name: "currency"
    type: "String"
  - name: "terms"
    type: "PaymentTerm"
  - name: "totalAmount"
    type: "Money"
  - name: "incoterm"
    type: "Incoterm"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "buyer"
    type: "Buyer"
    multiplicity: "ManyToOne"
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "PurchaseOrderLine"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "SupplierInvoice"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "ApprovalRequest"
    multiplicity: "OneToMany"
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "shipToLocation"
    type: "ShipToLocation"
    multiplicity: "ManyToOne"
- name: "PurchaseOrderLine"
  description: "Line-level commitment within a purchase order specifying items, quantities,\
    \ and delivery."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "itemDescription"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "unitOfMeasure"
    type: "UoM"
  - name: "unitPrice"
    type: "Money"
  - name: "deliveryDate"
    type: "Date"
  - name: "costCenterCode"
    type: "String"
  - name: "projectCode"
    type: "String"
  relations:
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "contractLine"
    type: "ContractLine"
    multiplicity: "ManyToOne"
  - name: "receipts"
    type: "GoodsReceipt"
    multiplicity: "OneToMany"
- name: "ShipToLocation"
  description: "Destination location for delivery and receiving operations."
  data:
  - name: "name"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "receivingHours"
    type: "String"
  - name: "contactName"
    type: "String"
  relations:
  - name: "purchaseOrders"
    type: "PurchaseOrder"
    multiplicity: "OneToMany"
  - name: "receipts"
    type: "GoodsReceipt"
    multiplicity: "OneToMany"
- name: "Shipment"
  description: "Outbound shipment from supplier to the buyer associated with a purchase\
    \ order."
  data:
  - name: "shipmentReference"
    type: "String"
  - name: "carrierName"
    type: "String"
  - name: "shipDate"
    type: "Date"
  - name: "expectedArrivalDate"
    type: "Date"
  - name: "trackingNumber"
    type: "String"
  relations:
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "shipFrom"
    type: "SupplierLocation"
    multiplicity: "ManyToOne"
  - name: "shipTo"
    type: "ShipToLocation"
    multiplicity: "ManyToOne"
  - name: "packingLists"
    type: "PackingList"
    multiplicity: "OneToMany"
- name: "PackingList"
  description: "Document detailing the contents and packaging of a shipment."
  data:
  - name: "packingListNumber"
    type: "String"
  - name: "totalPackages"
    type: "Integer"
  - name: "totalWeight"
    type: "Decimal"
  - name: "notes"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "PackingListLine"
    multiplicity: "OneToMany"
- name: "PackingListLine"
  description: "Line-level detail of quantities and items within a packing list."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Decimal"
  - name: "unitOfMeasure"
    type: "UoM"
  - name: "itemDescription"
    type: "String"
  relations:
  - name: "packingList"
    type: "PackingList"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "purchaseOrderLine"
    type: "PurchaseOrderLine"
    multiplicity: "ManyToOne"
- name: "GoodsReceipt"
  description: "Record of received goods or services against a purchase order line."
  data:
  - name: "receiptNumber"
    type: "String"
  - name: "receiptDate"
    type: "Date"
  - name: "status"
    type: "ReceiptStatus"
  - name: "receivedBy"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "purchaseOrderLine"
    type: "PurchaseOrderLine"
    multiplicity: "ManyToOne"
  - name: "shipToLocation"
    type: "ShipToLocation"
    multiplicity: "ManyToOne"
  - name: "inspection"
    type: "QualityInspection"
    multiplicity: "OneToOne"
  - name: "invoiceLine"
    type: "SupplierInvoiceLine"
    multiplicity: "OneToOne"
- name: "QualityInspection"
  description: "Quality assessment performed on received items."
  data:
  - name: "inspectionDate"
    type: "Date"
