---
metadata:
  name: "State Machine"
  description: "Capability model for defining, executing, and observing hierarchical\
    \ and concurrent state machines with deterministic event handling."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Workflow & Process"
  type: "Capability"
  domain: "State Machine"
entities:
- name: "StateMachineDefinition"
  description: "Blueprint describing states, transitions, events, actions, variables,\
    \ and execution semantics."
  data:
  - name: "name"
    type: "String"
  - name: "versionLabel"
    type: "String"
  - name: "isHierarchical"
    type: "Boolean"
  - name: "supportsParallelism"
    type: "Boolean"
  relations:
  - name: "executionProfile"
    type: "ExecutionProfile"
    multiplicity: "OneToOne"
  - name: "states"
    type: "StateDefinition"
    multiplicity: "OneToMany"
  - name: "regions"
    type: "RegionDefinition"
    multiplicity: "OneToMany"
  - name: "transitions"
    type: "TransitionDefinition"
    multiplicity: "OneToMany"
  - name: "events"
    type: "EventDefinition"
    multiplicity: "OneToMany"
  - name: "actions"
    type: "ActionDefinition"
    multiplicity: "OneToMany"
  - name: "variables"
    type: "VariableDefinition"
    multiplicity: "OneToMany"
  - name: "instances"
    type: "StateMachineInstance"
    multiplicity: "OneToMany"
- name: "ExecutionProfile"
  description: "Prescriptive runtime semantics for concurrency, ordering, reentrancy,\
    \ and error handling."
  data:
  - name: "concurrencyPolicy"
    type: "ConcurrencyPolicy"
  - name: "eventOrderingPolicy"
    type: "EventOrderingPolicy"
  - name: "reentrancyAllowed"
    type: "Boolean"
  - name: "errorHandlingStrategy"
    type: "ErrorHandlingStrategy"
  - name: "retryMaxAttempts"
    type: "Integer"
  - name: "retryBackoffStrategy"
    type: "BackoffStrategy"
  - name: "retryInitialDelayMs"
    type: "Integer"
  - name: "retryMaxDelayMs"
    type: "Integer"
  relations:
  - name: "stateMachine"
    type: "StateMachineDefinition"
    multiplicity: "OneToOne"
- name: "VariableDefinition"
  description: "Declarative variable available to the state machine runtime with optional\
    \ default and scope."
  data:
  - name: "name"
    type: "String"
  - name: "variableType"
    type: "VariableType"
  - name: "required"
    type: "Boolean"
  - name: "defaultValue"
    type: "String"
  - name: "scope"
    type: "VariableScope"
  relations:
  - name: "stateMachine"
    type: "StateMachineDefinition"
    multiplicity: "ManyToOne"
- name: "StateDefinition"
  description: "A state node representing a condition of the system; may be simple,\
    \ composite, or pseudo-state."
  data:
  - name: "name"
    type: "String"
  - name: "stateKind"
    type: "StateKind"
  - name: "isTerminal"
    type: "Boolean"
  - name: "isInitial"
    type: "Boolean"
  - name: "timeoutMs"
    type: "Integer"
  - name: "deferUnhandledEvents"
    type: "Boolean"
  relations:
  - name: "stateMachine"
    type: "StateMachineDefinition"
    multiplicity: "ManyToOne"
  - name: "region"
    type: "RegionDefinition"
    multiplicity: "ManyToOne"
  - name: "entryActions"
    type: "ActionDefinition"
    multiplicity: "ManyToMany"
  - name: "exitActions"
    type: "ActionDefinition"
    multiplicity: "ManyToMany"
  - name: "doAction"
    type: "ActionDefinition"
    multiplicity: "ManyToOne"
  - name: "outgoingTransitions"
    type: "TransitionDefinition"
    multiplicity: "OneToMany"
  - name: "incomingTransitions"
    type: "TransitionDefinition"
    multiplicity: "OneToMany"
- name: "RegionDefinition"
  description: "Orthogonal region contained by a composite state, enabling parallel\
    \ sub-flows."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "stateMachine"
    type: "StateMachineDefinition"
    multiplicity: "ManyToOne"
  - name: "parentState"
    type: "StateDefinition"
    multiplicity: "ManyToOne"
  - name: "states"
    type: "StateDefinition"
    multiplicity: "OneToMany"
- name: "ActionDefinition"
  description: "Reusable executable behavior invoked on entry, exit, do activity,\
    \ or during transitions."
  data:
  - name: "name"
    type: "String"
  - name: "actionType"
    type: "ActionType"
  - name: "implementationRef"
    type: "String"
  - name: "isSynchronous"
    type: "Boolean"
  - name: "timeoutMs"
    type: "Integer"
  relations:
  - name: "stateMachine"
    type: "StateMachineDefinition"
    multiplicity: "ManyToOne"
- name: "EventDefinition"
  description: "Named occurrence that can trigger transitions, optionally carrying\
    \ payload and correlation."
  data:
  - name: "name"
    type: "String"
  - name: "eventType"
    type: "EventType"
  - name: "payloadEncoding"
    type: "PayloadEncoding"
  - name: "isConsumable"
    type: "Boolean"
  - name: "correlationExpression"
    type: "Expression"
  relations:
  - name: "stateMachine"
    type: "StateMachineDefinition"
    multiplicity: "ManyToOne"
- name: "GuardDefinition"
  description: "Boolean condition that must be satisfied for a transition to fire."
  data:
  - name: "name"
    type: "String"
  - name: "guard"
    type: "Expression"
  - name: "negate"
    type: "Boolean"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "stateMachine"
    type: "StateMachineDefinition"
    multiplicity: "ManyToOne"
- name: "TransitionDefinition"
  description: "Directed connection between states with optional triggers, guard,\
    \ priority, and effects."
  data:
  - name: "name"
    type: "String"
  - name: "transitionKind"
    type: "TransitionKind"
  - name: "priority"
    type: "Integer"
  - name: "isEnabledByDefault"
    type: "Boolean"
  relations:
  - name: "stateMachine"
    type: "StateMachineDefinition"
    multiplicity: "ManyToOne"
  - name: "source"
    type: "StateDefinition"
    multiplicity: "ManyToOne"
  - name: "target"
    type: "StateDefinition"
    multiplicity: "ManyToOne"
  - name: "triggers"
    type: "EventDefinition"
    multiplicity: "ManyToMany"
  - name: "guard"
    type: "GuardDefinition"
    multiplicity: "ManyToOne"
  - name: "effects"
    type: "ActionDefinition"
    multiplicity: "ManyToMany"
- name: "StateMachineInstance"
  description: "Runtime execution of a state machine, maintaining context, active\
    \ states, and history."
  data:
  - name: "businessKey"
    type: "String"
  - name: "status"
    type: "InstanceStatus"
  - name: "startedAt"
    type: "DateTime"
  - name: "lastUpdatedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  relations:
  - name: "definition"
    type: "StateMachineDefinition"
    multiplicity: "ManyToOne"
  - name: "activeStates"
    type: "StateInstance"
    multiplicity: "OneToMany"
  - name: "transitions"
    type: "TransitionInstance"
    multiplicity: "OneToMany"
  - name: "pendingEvents"
    type: "EventMessage"
    multiplicity: "OneToMany"
  - name: "timers"
    type: "TimerSubscription"
    multiplicity: "OneToMany"
- name: "StateInstance"
  description: "Membership of a running instance in a particular state within a specific\
    \ region."
  data:
  - name: "enteredAt"
    type: "DateTime"
  - name: "exitedAt"
    type: "DateTime"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "instance"
    type: "StateMachineInstance"
    multiplicity: "ManyToOne"
  - name: "state"
    type: "StateDefinition"
    multiplicity: "ManyToOne"
- name: "TransitionInstance"
  description: "Audit event capturing a transition firing, its trigger, and outcome."
  data:
  - name: "occurredAt"
    type: "DateTime"
  - name: "successful"
    type: "Boolean"
  - name: "guardEvaluated"
    type: "Boolean"
  relations:
  - name: "instance"
    type: "StateMachineInstance"
    multiplicity: "ManyToOne"
  - name: "transition"
    type: "TransitionDefinition"
    multiplicity: "ManyToOne"
  - name: "trigger"
    type: "EventMessage"
    multiplicity: "ManyToOne"
- name: "EventMessage"
  description: "Discrete event instance delivered to or produced by a state machine\
    \ execution."
  data:
  - name: "name"
    type: "String"
  - name: "eventType"
    type: "EventType"
  - name: "receivedAt"
    type: "DateTime"
  - name: "correlationKey"
    type: "String"
  - name: "payload"
    type: "DataBlob"
  relations:
  - name: "instance"
    type: "StateMachineInstance"
    multiplicity: "ManyToOne"
  - name: "definition"
    type: "EventDefinition"
    multiplicity: "ManyToOne"
- name: "TimerSubscription"
  description: "Scheduled timer associated with an instance, used to raise timer events\
    \ or timeouts."
  data:
  - name: "name"
    type: "String"
  - name: "dueAt"
    type: "DateTime"
  - name: "cron"
    type: "CronSchedule"
  - name: "active"
    type: "Boolean"
  - name: "repeatCount"
    type: "Integer"
  relations:
  - name: "instance"
    type: "StateMachineInstance"
    multiplicity: "ManyToOne"
  - name: "eventDefinition"
    type: "EventDefinition"
    multiplicity: "ManyToOne"
enums:
- name: "StateKind"
  description: "Classification of state semantics, including simple, composite, and\
    \ pseudo-states."
  data:
  - name: "Initial"
  - name: "Final"
  - name: "Simple"
  - name: "Composite"
  - name: "Submachine"
  - name: "Choice"
  - name: "Junction"
  - name: "ShallowHistory"
  - name: "DeepHistory"
  - name: "Fork"
  - name: "Join"
  - name: "EntryPoint"
  - name: "ExitPoint"
  - name: "Terminate"
- name: "TransitionKind"
  description: "Scope of state change relative to source and target states."
  data:
  - name: "External"
  - name: "Internal"
  - name: "Local"
- name: "EventType"
  description: "Nature of the event used to trigger transitions or internal behavior."
  data:
  - name: "Signal"
  - name: "Message"
  - name: "Timer"
  - name: "Completion"
  - name: "Change"
  - name: "Error"
- name: "ActionType"
  description: "Mechanism by which an action is executed."
  data:
  - name: "Script"
  - name: "ServiceCall"
  - name: "PublishEvent"
  - name: "SetVariable"
  - name: "CompositeAction"
  - name: "Compensate"
- name: "VariableType"
  description: "Primitive or structured type of a runtime variable."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "DateTime"
  - name: "Object"
- name: "VariableScope"
  description: "Visibility and lifetime boundary for a variable."
  data:
  - name: "Machine"
  - name: "State"
  - name: "Transition"
  - name: "Region"
  - name: "Session"
- name: "InstanceStatus"
  description: "Lifecycle stage of a state machine instance."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Completed"
  - name: "Cancelled"
  - name: "Faulted"
- name: "ConcurrencyPolicy"
  description: "Degree of parallel processing allowed across events and instances."
  data:
  - name: "Single"
  - name: "ParallelByKey"
  - name: "FullyParallel"
- name: "EventOrderingPolicy"
  description: "Rule applied to determine processing order for queued events."
  data:
  - name: "FIFO"
  - name: "ByTimestamp"
  - name: "None"
- name: "ErrorHandlingStrategy"
  description: "Action to take when an action or transition effect fails."
  data:
  - name: "Retry"
  - name: "Skip"
  - name: "Halt"
  - name: "Compensate"
- name: "BackoffStrategy"
  description: "Delay growth pattern for retries when errors occur."
  data:
  - name: "Fixed"
  - name: "Linear"
  - name: "Exponential"
  - name: "ExponentialJitter"
- name: "ExpressionLanguage"
  description: "Language used to author guard and correlation expressions."
  data:
  - name: "CEL"
  - name: "JavaScript"
  - name: "MVEL"
  - name: "SpEL"
  - name: "JMESPath"
  - name: "SQL"
- name: "PayloadEncoding"
  description: "Encoding format used to represent event payload data."
  data:
  - name: "JSON"
  - name: "XML"
  - name: "Text"
  - name: "Binary"
valueObjects:
- name: "Expression"
  description: "Portable representation of a boolean or computed expression with language\
    \ metadata."
  data:
  - name: "language"
    type: "ExpressionLanguage"
  - name: "source"
    type: "String"
- name: "DataBlob"
  description: "Opaque payload container with explicit content typing and encoding."
  data:
  - name: "contentType"
    type: "String"
  - name: "encoding"
    type: "PayloadEncoding"
  - name: "content"
    type: "String"
- name: "CronSchedule"
  description: "Time-based scheduling expression with optional time zone."
  data:
  - name: "expression"
    type: "String"
  - name: "timezone"
    type: "String"
