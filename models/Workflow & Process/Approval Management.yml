---
metadata:
  name: "Approval Management Capabilities Model"
  description: "HCIDL capabilities model describing core concepts, structures, and\
    \ relationships for enterprise approval management."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Workflow & Process"
  type: "Capability"
  domain: "Approval Management"
entities:
- name: "OrganizationUnit"
  description: "Hierarchical business unit used to scope approval policies and participants."
  data:
  - name: "name"
    type: "String"
  - name: "path"
    type: "String"
  - name: "costCenter"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "parent"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "OrganizationUnit"
    multiplicity: "OneToMany"
  - name: "approvers"
    type: "Approver"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "ApprovalPolicy"
    multiplicity: "OneToMany"
- name: "Approver"
  description: "Individual capable of reviewing and deciding on approval steps."
  data:
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "Email"
  - name: "roleTitle"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "active"
    type: "Boolean"
  - name: "outOfOffice"
    type: "Boolean"
  relations:
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "groups"
    type: "ApproverGroup"
    multiplicity: "ManyToMany"
- name: "ApproverGroup"
  description: "Logical group of approvers used for assignment and escalation."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "assignmentStrategy"
    type: "AssignmentStrategy"
  relations:
  - name: "members"
    type: "Approver"
    multiplicity: "ManyToMany"
- name: "ApprovalPolicy"
  description: "High-level routing and governance policy for approval processing."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "policyScope"
    type: "PolicyScope"
  - name: "priority"
    type: "Integer"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "applicableUnits"
    type: "OrganizationUnit"
    multiplicity: "ManyToMany"
  - name: "rules"
    type: "PolicyRule"
    multiplicity: "OneToMany"
  - name: "definitions"
    type: "ApprovalDefinition"
    multiplicity: "OneToMany"
- name: "PolicyRule"
  description: "Conditional rule that selects an approval definition within a policy."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "evaluationOrder"
    type: "Integer"
  - name: "isEnabled"
    type: "Boolean"
  - name: "conditionExpression"
    type: "String"
  relations:
  - name: "policy"
    type: "ApprovalPolicy"
    multiplicity: "ManyToOne"
  - name: "targetDefinition"
    type: "ApprovalDefinition"
    multiplicity: "ManyToOne"
- name: "ApprovalDefinition"
  description: "Versioned blueprint that defines the steps and routing of an approval\
    \ flow."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "version"
    type: "String"
  - name: "routingType"
    type: "RoutingType"
  - name: "isDefault"
    type: "Boolean"
  relations:
  - name: "policy"
    type: "ApprovalPolicy"
    multiplicity: "ManyToOne"
  - name: "stepDefinitions"
    type: "ApprovalStepDefinition"
    multiplicity: "OneToMany"
  - name: "escalationRules"
    type: "EscalationRule"
    multiplicity: "OneToMany"
  - name: "reminderRules"
    type: "ReminderRule"
    multiplicity: "OneToMany"
- name: "ApprovalStepDefinition"
  description: "Template describing a single step within an approval definition."
  data:
  - name: "name"
    type: "String"
  - name: "sequence"
    type: "Integer"
  - name: "assignmentStrategy"
    type: "AssignmentStrategy"
  - name: "approvalQuorum"
    type: "ApprovalQuorum"
  - name: "requiredCount"
    type: "Integer"
  - name: "sla"
    type: "Duration"
  - name: "allowDelegation"
    type: "Boolean"
  relations:
  - name: "definition"
    type: "ApprovalDefinition"
    multiplicity: "ManyToOne"
  - name: "approverGroups"
    type: "ApproverGroup"
    multiplicity: "ManyToMany"
  - name: "fallbackApprovers"
    type: "Approver"
    multiplicity: "ManyToMany"
- name: "DelegationAssignment"
  description: "Time-bound substitution allowing one approver to act on behalf of\
    \ another."
  data:
  - name: "reason"
    type: "String"
  - name: "scope"
    type: "DelegationScope"
  - name: "isActive"
    type: "Boolean"
  - name: "window"
    type: "TimeWindow"
  relations:
  - name: "fromApprover"
    type: "Approver"
    multiplicity: "ManyToOne"
  - name: "toApprover"
    type: "Approver"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "ApprovalPolicy"
    multiplicity: "ManyToOne"
  - name: "definition"
    type: "ApprovalDefinition"
    multiplicity: "ManyToOne"
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
- name: "ApprovalRequest"
  description: "A submitted request that requires approval according to a selected\
    \ definition."
  data:
  - name: "title"
    type: "String"
  - name: "submittedAt"
    type: "Date"
  - name: "requestedBy"
    type: "String"
  - name: "priority"
    type: "PriorityLevel"
  - name: "status"
    type: "ApprovalStatus"
  - name: "target"
    type: "TargetReference"
  - name: "justification"
    type: "RichText"
  - name: "requestedDueDate"
    type: "Date"
  - name: "externalReference"
    type: "String"
  relations:
  - name: "definition"
    type: "ApprovalDefinition"
    multiplicity: "ManyToOne"
  - name: "process"
    type: "ApprovalProcess"
    multiplicity: "OneToOne"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "comments"
    type: "ApprovalComment"
    multiplicity: "OneToMany"
  - name: "auditTrail"
    type: "AuditEntry"
    multiplicity: "OneToMany"
- name: "ApprovalProcess"
  description: "Runtime instance tracking the execution of an approval request."
  data:
  - name: "startedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  - name: "status"
    type: "ProcessStatus"
  - name: "currentSequence"
    type: "Integer"
  relations:
  - name: "request"
    type: "ApprovalRequest"
    multiplicity: "OneToOne"
  - name: "steps"
    type: "ApprovalStepInstance"
    multiplicity: "OneToMany"
  - name: "escalationEvents"
    type: "EscalationEvent"
    multiplicity: "OneToMany"
  - name: "reminders"
    type: "ReminderEvent"
    multiplicity: "OneToMany"
- name: "ApprovalStepInstance"
  description: "Executable step created from a step definition for a specific process."
  data:
  - name: "name"
    type: "String"
  - name: "sequence"
    type: "Integer"
  - name: "startedAt"
    type: "Date"
  - name: "dueAt"
    type: "Date"
  - name: "status"
    type: "StepStatus"
  - name: "requiredCount"
    type: "Integer"
  - name: "approvalQuorum"
    type: "ApprovalQuorum"
  relations:
  - name: "process"
    type: "ApprovalProcess"
    multiplicity: "ManyToOne"
  - name: "stepDefinition"
    type: "ApprovalStepDefinition"
    multiplicity: "ManyToOne"
  - name: "assignees"
    type: "Approver"
    multiplicity: "ManyToMany"
  - name: "decisions"
    type: "ApprovalDecision"
    multiplicity: "OneToMany"
  - name: "escalations"
    type: "EscalationEvent"
    multiplicity: "OneToMany"
  - name: "reminders"
    type: "ReminderEvent"
    multiplicity: "OneToMany"
- name: "ApprovalDecision"
  description: "A single approver’s decision on a step instance."
  data:
  - name: "decision"
    type: "DecisionType"
  - name: "decidedAt"
    type: "Date"
  - name: "comment"
    type: "String"
  - name: "delegated"
    type: "Boolean"
  relations:
  - name: "stepInstance"
    type: "ApprovalStepInstance"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Approver"
    multiplicity: "ManyToOne"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
- name: "ApprovalComment"
  description: "Comment associated with an approval request or step instance."
  data:
  - name: "author"
    type: "String"
  - name: "message"
    type: "RichText"
  - name: "createdAt"
    type: "Date"
  - name: "visibility"
    type: "Visibility"
  relations:
  - name: "request"
    type: "ApprovalRequest"
    multiplicity: "ManyToOne"
  - name: "stepInstance"
    type: "ApprovalStepInstance"
    multiplicity: "ManyToOne"
- name: "Attachment"
  description: "File or link attached to a request, step, or decision."
  data:
  - name: "fileName"
    type: "String"
  - name: "contentType"
    type: "String"
  - name: "uri"
    type: "String"
  - name: "uploadedAt"
    type: "Date"
  relations:
  - name: "request"
    type: "ApprovalRequest"
    multiplicity: "ManyToOne"
  - name: "stepInstance"
    type: "ApprovalStepInstance"
    multiplicity: "ManyToOne"
  - name: "decision"
    type: "ApprovalDecision"
    multiplicity: "ManyToOne"
- name: "EscalationRule"
  description: "Configuration that determines when and how to escalate stalled steps."
  data:
  - name: "name"
    type: "String"
  - name: "conditionExpression"
    type: "String"
  - name: "action"
    type: "EscalationAction"
  - name: "delayHours"
    type: "Integer"
  - name: "maxAttempts"
    type: "Integer"
  - name: "isEnabled"
    type: "Boolean"
  relations:
  - name: "definition"
    type: "ApprovalDefinition"
    multiplicity: "ManyToOne"
  - name: "reassignGroup"
    type: "ApproverGroup"
    multiplicity: "ManyToOne"
  - name: "reassignApprover"
    type: "Approver"
    multiplicity: "ManyToOne"
- name: "EscalationEvent"
  description: "Recorded occurrence of an escalation during process execution."
  data:
  - name: "occurredAt"
    type: "Date"
  - name: "actionTaken"
    type: "EscalationAction"
  - name: "attempt"
    type: "Integer"
  - name: "notes"
    type: "String"
  relations:
  - name: "stepInstance"
    type: "ApprovalStepInstance"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "EscalationRule"
    multiplicity: "ManyToOne"
  - name: "reassignedTo"
    type: "Approver"
    multiplicity: "ManyToOne"
- name: "ReminderRule"
  description: "Schedule and content settings for sending step reminders."
  data:
  - name: "name"
    type: "String"
  - name: "intervalHours"
    type: "Integer"
  - name: "maxReminders"
    type: "Integer"
  - name: "messageTemplate"
    type: "String"
  - name: "isEnabled"
    type: "Boolean"
  - name: "channel"
    type: "ReminderChannel"
  relations:
  - name: "definition"
    type: "ApprovalDefinition"
    multiplicity: "ManyToOne"
- name: "ReminderEvent"
  description: "A sent reminder message for an approval step."
  data:
  - name: "sentAt"
    type: "Date"
  - name: "channel"
    type: "ReminderChannel"
  - name: "recipient"
    type: "String"
  relations:
  - name: "stepInstance"
    type: "ApprovalStepInstance"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "ReminderRule"
    multiplicity: "ManyToOne"
- name: "AuditEntry"
  description: "Immutable log entry that captures significant events in the approval\
    \ lifecycle."
  data:
  - name: "eventType"
    type: "AuditEventType"
  - name: "createdAt"
    type: "Date"
  - name: "actor"
    type: "String"
  - name: "details"
    type: "String"
  relations:
  - name: "request"
    type: "ApprovalRequest"
    multiplicity: "ManyToOne"
  - name: "stepInstance"
    type: "ApprovalStepInstance"
    multiplicity: "ManyToOne"
enums:
- name: "PriorityLevel"
  description: "Relative urgency used to influence routing and SLA expectations."
  data:
  - name: "Low"
  - name: "Normal"
  - name: "High"
  - name: "Urgent"
- name: "ApprovalStatus"
  description: "Overall lifecycle status of an approval request."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "InReview"
  - name: "Approved"
  - name: "Rejected"
  - name: "Cancelled"
  - name: "OnHold"
- name: "ProcessStatus"
  description: "Execution status of the approval process instance."
  data:
  - name: "NotStarted"
  - name: "Running"
  - name: "Completed"
  - name: "Cancelled"
  - name: "Paused"
- name: "StepStatus"
  description: "Current state of an approval step instance."
  data:
  - name: "Pending"
  - name: "InProgress"
  - name: "Approved"
  - name: "Rejected"
  - name: "Escalated"
  - name: "Skipped"
  - name: "Expired"
- name: "DecisionType"
  description: "Possible outcomes that an approver can record on a step."
  data:
  - name: "Approve"
  - name: "Reject"
  - name: "RequestChanges"
  - name: "Delegate"
  - name: "Abstain"
- name: "RoutingType"
  description: "Strategy determining how steps are ordered and combined."
  data:
  - name: "Serial"
  - name: "Parallel"
  - name: "AnyOne"
  - name: "All"
- name: "AssignmentStrategy"
  description: "Method used to select which approvers are assigned to a step."
  data:
  - name: "SpecificUsers"
  - name: "GroupRoundRobin"
  - name: "ManagerOfRequester"
  - name: "RoleBased"
  - name: "AutoAssignToOwner"
- name: "ApprovalQuorum"
  description: "Rule that defines how many approvals are required to satisfy a step."
  data:
  - name: "All"
  - name: "Any"
  - name: "Percentage"
  - name: "Count"
- name: "EscalationAction"
  description: "Action taken when escalation conditions are met."
  data:
  - name: "Notify"
  - name: "Reassign"
  - name: "AutoApprove"
  - name: "AutoReject"
- name: "ReminderChannel"
  description: "Communication channel used for sending reminders."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "Push"
  - name: "Webhook"
- name: "PolicyScope"
  description: "Boundaries that define where a policy applies."
  data:
  - name: "Global"
  - name: "OrganizationUnit"
  - name: "Project"
- name: "Visibility"
  description: "Audience that can view a given comment or note."
  data:
  - name: "Public"
  - name: "Internal"
- name: "DelegationScope"
  description: "The scope of requests covered by a delegation assignment."
  data:
  - name: "AllRequests"
  - name: "PolicyOnly"
  - name: "DefinitionOnly"
- name: "AuditEventType"
  description: "Classification of events captured for auditing purposes."
  data:
  - name: "RequestCreated"
  - name: "RequestSubmitted"
  - name: "StepAssigned"
  - name: "DecisionRecorded"
  - name: "StepEscalated"
  - name: "RequestApproved"
  - name: "RequestRejected"
  - name: "RequestCancelled"
  - name: "CommentAdded"
  - name: "AttachmentAdded"
  - name: "ReminderSent"
  - name: "AutoActionApplied"
valueObjects:
- name: "TargetReference"
  description: "Identifies the external business object associated with the approval."
  data:
  - name: "objectType"
    type: "String"
  - name: "externalKey"
    type: "String"
  - name: "uri"
    type: "String"
- name: "TimeWindow"
  description: "Start and end dates defining an active period."
  data:
  - name: "start"
    type: "Date"
  - name: "end"
    type: "Date"
- name: "Duration"
  description: "Length of time expressed in hours and minutes."
  data:
  - name: "hours"
    type: "Integer"
  - name: "minutes"
    type: "Integer"
- name: "Email"
  description: "Validated email address for an approver or recipient."
  data:
  - name: "value"
    type: "String"
- name: "RichText"
  description: "Human-readable, formatted text supporting newlines and lightweight\
    \ markup."
  data:
  - name: "content"
    type: "String"
