---
metadata:
  name: "Task Management Capabilities Model"
  description: "A comprehensive HCIDL model for organizing, tracking, and collaborating\
    \ on tasks across projects, teams, and workflows."
  version: "1.0.0"
  industry: "Cross-industry"
  category: "Workflow & Process"
  type: "Capability"
  domain: "Task Management"
entities:
- name: "Organization"
  description: "The top-level administrative unit that owns workspaces, teams, and\
    \ users."
  data:
  - name: "name"
    type: "String"
  - name: "primaryDomain"
    type: "String"
  - name: "defaultTimeZone"
    type: "String"
  relations:
  - name: "workspaces"
    type: "Workspace"
    multiplicity: "OneToMany"
  - name: "users"
    type: "User"
    multiplicity: "OneToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "OneToMany"
- name: "Workspace"
  description: "A collaboration context that groups projects, labels, and members\
    \ under a common governance boundary."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "RichText"
  - name: "visibility"
    type: "WorkspaceVisibility"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "OneToMany"
  - name: "labels"
    type: "Label"
    multiplicity: "OneToMany"
  - name: "members"
    type: "User"
    multiplicity: "ManyToMany"
- name: "Team"
  description: "A group of users that collaborates on projects and tasks with shared\
    \ conventions and responsibilities."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "String"
  - name: "assignmentStrategy"
    type: "AssignmentStrategy"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "ManyToMany"
- name: "User"
  description: "An individual who creates, assigns, and completes tasks and collaborates\
    \ via comments and attachments."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "timeZone"
    type: "String"
  - name: "userType"
    type: "UserType"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "assignedTasks"
    type: "Task"
    multiplicity: "ManyToMany"
  - name: "reportedTasks"
    type: "Task"
    multiplicity: "OneToMany"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
  - name: "timeEntries"
    type: "TimeEntry"
    multiplicity: "OneToMany"
  - name: "reminders"
    type: "Reminder"
    multiplicity: "OneToMany"
- name: "Project"
  description: "A structured initiative that organizes tasks, epics, milestones, boards,\
    \ and iterations to achieve outcomes."
  data:
  - name: "name"
    type: "String"
  - name: "key"
    type: "String"
  - name: "status"
    type: "ProjectStatus"
  - name: "description"
    type: "RichText"
  - name: "schedule"
    type: "DateRange"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "epics"
    type: "Epic"
    multiplicity: "OneToMany"
  - name: "iterations"
    type: "Iteration"
    multiplicity: "OneToMany"
  - name: "milestones"
    type: "Milestone"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "Task"
    multiplicity: "OneToMany"
  - name: "boards"
    type: "Board"
    multiplicity: "OneToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
- name: "Epic"
  description: "A large body of work that can be broken down into tasks and spans\
    \ multiple iterations or milestones."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "EpicStatus"
  - name: "description"
    type: "RichText"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "Task"
    multiplicity: "OneToMany"
- name: "Iteration"
  description: "A fixed timebox that focuses the team on a specific set of tasks and\
    \ goals."
  data:
  - name: "name"
    type: "String"
  - name: "dateRange"
    type: "DateRange"
  - name: "status"
    type: "IterationStatus"
  - name: "goal"
    type: "String"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "Task"
    multiplicity: "ManyToMany"
- name: "Milestone"
  description: "A deadline-oriented checkpoint used to track progress toward major\
    \ deliverables."
  data:
  - name: "name"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "MilestoneStatus"
  - name: "description"
    type: "RichText"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "Task"
    multiplicity: "ManyToMany"
- name: "Board"
  description: "A visual workflow board that organizes tasks across columns to reflect\
    \ process stages."
  data:
  - name: "name"
    type: "String"
  - name: "boardType"
    type: "BoardType"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "columns"
    type: "BoardColumn"
    multiplicity: "OneToMany"
- name: "BoardColumn"
  description: "A swimlane column on a board that groups tasks by a stage or category."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "ColumnCategory"
  - name: "wipLimit"
    type: "Integer"
  relations:
  - name: "board"
    type: "Board"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "Task"
    multiplicity: "ManyToMany"
- name: "Label"
  description: "A reusable tag used to categorize and filter tasks consistently across\
    \ a workspace."
  data:
  - name: "name"
    type: "String"
  - name: "color"
    type: "Color"
  - name: "description"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "Task"
    multiplicity: "ManyToMany"
- name: "Task"
  description: "The fundamental unit of work that captures objectives, status, priority,\
    \ scheduling, and collaboration data."
  data:
  - name: "title"
    type: "String"
  - name: "taskType"
    type: "TaskType"
  - name: "status"
    type: "TaskStatus_"
  - name: "priority"
    type: "PriorityLevel"
  - name: "startDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "estimate"
    type: "TimeEstimate"
  - name: "description"
    type: "RichText"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "epic"
    type: "Epic"
    multiplicity: "ManyToOne"
  - name: "iteration"
    type: "Iteration"
    multiplicity: "ManyToOne"
  - name: "milestones"
    type: "Milestone"
    multiplicity: "ManyToMany"
  - name: "labels"
    type: "Label"
    multiplicity: "ManyToMany"
  - name: "boardColumns"
    type: "BoardColumn"
    multiplicity: "ManyToMany"
  - name: "assignees"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "watchers"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "reporter"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "parentTask"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "subTasks"
    type: "Task"
    multiplicity: "OneToMany"
  - name: "dependenciesAsPredecessor"
    type: "TaskDependency"
    multiplicity: "OneToMany"
  - name: "dependenciesAsSuccessor"
    type: "TaskDependency"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
  - name: "checklistItems"
    type: "ChecklistItem"
    multiplicity: "OneToMany"
  - name: "timeEntries"
    type: "TimeEntry"
    multiplicity: "OneToMany"
  - name: "reminders"
    type: "Reminder"
    multiplicity: "OneToMany"
- name: "ChecklistItem"
  description: "A small, actionable step within a task used to track granular progress."
  data:
  - name: "text"
    type: "String"
  - name: "status"
    type: "ChecklistItemStatus"
  - name: "order"
    type: "Integer"
  - name: "completedAt"
    type: "Date"
  relations:
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "completedBy"
    type: "User"
    multiplicity: "ManyToOne"
- name: "TaskDependency"
  description: "A precedence relationship that constrains the scheduling of a successor\
    \ task relative to a predecessor."
  data:
  - name: "type"
    type: "PrecedenceType"
  - name: "lagDays"
    type: "Integer"
  relations:
  - name: "predecessorTask"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "successorTask"
    type: "Task"
    multiplicity: "ManyToOne"
- name: "Comment"
  description: "A discussion message associated with a task for collaboration and\
    \ clarification."
  data:
  - name: "body"
    type: "RichText"
  - name: "visibility"
    type: "CommentVisibility"
  - name: "createdAt"
    type: "Date"
  relations:
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Attachment"
  description: "A file or link associated with a task that supports implementation\
    \ or documentation."
  data:
  - name: "fileName"
    type: "String"
  - name: "url"
    type: "URL"
  - name: "contentType"
    type: "String"
  - name: "sizeBytes"
    type: "Integer"
  - name: "uploadedAt"
    type: "Date"
  - name: "kind"
    type: "AttachmentKind"
  relations:
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "uploadedBy"
    type: "User"
    multiplicity: "ManyToOne"
- name: "TimeEntry"
  description: "A record of time spent by a user on a task for tracking effort and\
    \ reporting."
  data:
  - name: "entryDate"
    type: "Date"
  - name: "duration"
    type: "Duration"
  - name: "entryType"
    type: "TimeEntryType"
  - name: "notes"
    type: "String"
  relations:
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Reminder"
  description: "A scheduled notification that alerts a user about a task at a specified\
    \ time."
  data:
  - name: "remindAt"
    type: "Date"
  - name: "channel"
    type: "NotificationChannel"
  - name: "message"
    type: "String"
  - name: "snoozed"
    type: "Boolean"
  - name: "snoozeUntil"
    type: "Date"
  relations:
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "recipient"
    type: "User"
    multiplicity: "ManyToOne"
- name: "TaskTemplate"
  description: "A reusable set of default values and structure used to create consistent\
    \ tasks."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "RichText"
  - name: "defaultType"
    type: "TaskType"
  - name: "defaultPriority"
    type: "PriorityLevel"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "Task"
    multiplicity: "OneToMany"
- name: "AutomationRule"
  description: "A configurable rule that triggers automated actions in response to\
    \ task-related events."
  data:
  - name: "name"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  - name: "trigger"
    type: "AutomationTrigger"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "User"
    multiplicity: "ManyToOne"
enums:
- name: "TaskStatus_"
  description: "Lifecycle states that a task progresses through from inception to\
    \ completion."
  data:
  - name: "Backlog"
  - name: "ToDo"
  - name: "InProgress"
  - name: "InReview"
  - name: "Done"
  - name: "Blocked"
  - name: "Cancelled"
- name: "PriorityLevel"
  description: "Relative urgency and importance used to order work and allocate attention."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
  - name: "Urgent"
- name: "TaskType"
  description: "Classification of work that influences workflow, policies, and reporting."
  data:
  - name: "Task"
  - name: "Bug"
  - name: "Feature"
  - name: "Improvement"
  - name: "Research"
- name: "PrecedenceType"
  description: "Scheduling dependency semantics determining how predecessor and successor\
    \ relate."
  data:
  - name: "FinishToStart"
  - name: "StartToStart"
  - name: "FinishToFinish"
  - name: "StartToFinish"
- name: "IterationStatus"
  description: "States representing the lifecycle of a timeboxed iteration."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "Completed"
  - name: "Cancelled"
- name: "ProjectStatus"
  description: "Health and lifecycle state for a project’s overall execution."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "OnHold"
  - name: "Completed"
  - name: "Archived"
- name: "CommentVisibility"
  description: "Audience scope that controls who can read a comment."
  data:
  - name: "Internal"
  - name: "Project"
  - name: "Public"
- name: "NotificationChannel"
  description: "Delivery mechanisms for sending reminders and alerts to users."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "Push"
  - name: "InApp"
- name: "ChecklistItemStatus"
  description: "Progress marker for an individual checklist item within a task."
  data:
  - name: "Pending"
  - name: "InProgress"
  - name: "Completed"
  - name: "Skipped"
- name: "AttachmentKind"
  description: "Generalized category describing the type of an attachment."
  data:
  - name: "Document"
  - name: "Image"
  - name: "Link"
  - name: "Spreadsheet"
  - name: "Other"
- name: "BoardType"
  description: "Organizational scheme and policies applied to a visual board."
  data:
  - name: "Kanban"
  - name: "Scrum"
  - name: "Mixed"
- name: "ColumnCategory"
  description: "Canonical column intent used for mapping workflow stages across boards."
  data:
  - name: "Backlog"
  - name: "ToDo"
  - name: "InProgress"
  - name: "Review"
  - name: "Done"
- name: "UserType"
  description: "Classification of user relationship to the organization and workspace."
  data:
  - name: "Internal"
  - name: "External"
  - name: "Guest"
- name: "WorkspaceVisibility"
  description: "Access scope controlling discoverability and membership of a workspace."
  data:
  - name: "Private"
  - name: "Internal"
  - name: "Public"
- name: "EstimationUnit"
  description: "Units used for estimating or tracking work effort and duration."
  data:
  - name: "Minutes"
  - name: "Hours"
  - name: "Days"
  - name: "Points"
- name: "TimeEntryType"
  description: "Categories of time tracking that support reporting and cost allocation."
  data:
  - name: "Work"
  - name: "Meeting"
  - name: "Review"
  - name: "Research"
  - name: "Administration"
- name: "AutomationTrigger"
  description: "Events that initiate the evaluation and execution of automation rules."
  data:
  - name: "TaskCreated"
  - name: "StatusChanged"
  - name: "DueDateApproaching"
  - name: "CommentAdded"
  - name: "AssignedUserChanged"
- name: "AssignmentStrategy"
  description: "Policy that guides how tasks are assigned to team members."
  data:
  - name: "Manual"
  - name: "RoundRobin"
  - name: "LeadFirst"
  - name: "LoadBalanced"
  - name: "None"
- name: "EpicStatus"
  description: "Lifecycle states for epics used to track large initiatives."
  data:
  - name: "Proposed"
  - name: "InProgress"
  - name: "Done"
  - name: "Cancelled"
- name: "MilestoneStatus"
  description: "Progress and risk posture of a milestone relative to its due date."
  data:
  - name: "Planned"
  - name: "AtRisk"
  - name: "Completed"
  - name: "Cancelled"
valueObjects:
- name: "TimeEstimate"
  description: "A quantitative estimate of effort required to complete a task."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "unit"
    type: "EstimationUnit"
- name: "Duration"
  description: "An actual or planned span of time used for time tracking or scheduling\
    \ constraints."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "unit"
    type: "EstimationUnit"
- name: "DateRange"
  description: "A contiguous period with a defined start and end date."
  data:
  - name: "start"
    type: "Date"
  - name: "end"
    type: "Date"
- name: "RichText"
  description: "Formatted textual content supporting basic markup for readability."
  data:
  - name: "content"
    type: "String"
  - name: "format"
    type: "String"
- name: "Color"
  description: "A display color encoded as a hexadecimal RGB or RGBA value."
  data:
  - name: "hex"
    type: "String"
- name: "URL"
  description: "A network address that references an external resource."
  data:
  - name: "value"
    type: "String"
- name: "EmailAddress"
  description: "A standardized electronic mail address for contacting a user."
  data:
  - name: "value"
    type: "String"
