---
metadata:
  name: "Scheduling Capabilities Model"
  description: "A domain model for managing resources, calendars, tasks, appointments,\
    \ shifts, and policies that drive enterprise scheduling and dispatch."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Workflow & Process"
  type: "Capability"
  domain: "Scheduling"
entities:
- name: "SchedulingWorkspace"
  description: "Logical container for scheduling configuration, catalogs, and operational\
    \ plans."
  data:
  - name: "name"
    type: "String"
  - name: "defaultTimeZone"
    type: "TimeZone"
  - name: "defaultAllocationStrategy"
    type: "AllocationStrategy"
  relations:
  - name: "resources"
    type: "Resource"
    multiplicity: "OneToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "OneToMany"
  - name: "skills"
    type: "Skill"
    multiplicity: "OneToMany"
  - name: "services"
    type: "Service"
    multiplicity: "OneToMany"
  - name: "schedules"
    type: "Schedule"
    multiplicity: "OneToMany"
  - name: "calendars"
    type: "Calendar"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "SchedulingPolicy"
    multiplicity: "OneToMany"
  - name: "requesters"
    type: "Requester"
    multiplicity: "OneToMany"
- name: "Resource"
  description: "Person or asset that can be reserved to perform work, with capacity,\
    \ skills, and availability."
  data:
  - name: "displayName"
    type: "String"
  - name: "resourceType"
    type: "ResourceType"
  - name: "primaryLocation"
    type: "GeoLocation"
  - name: "timeZone"
    type: "TimeZone"
  - name: "capacityPerDay"
    type: "Integer"
  - name: "maxConcurrentAppointments"
    type: "Integer"
  - name: "utilizationTarget"
    type: "Decimal"
  relations:
  - name: "workspace"
    type: "SchedulingWorkspace"
    multiplicity: "ManyToOne"
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "skills"
    type: "Skill"
    multiplicity: "ManyToMany"
  - name: "baseCalendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
  - name: "timeOffs"
    type: "TimeOff"
    multiplicity: "OneToMany"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
  - name: "shifts"
    type: "Shift"
    multiplicity: "ManyToMany"
- name: "Team"
  description: "Group of resources organized for coverage, skills mix, or geographic\
    \ responsibility."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "String"
  relations:
  - name: "workspace"
    type: "SchedulingWorkspace"
    multiplicity: "ManyToOne"
  - name: "resources"
    type: "Resource"
    multiplicity: "ManyToMany"
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
  - name: "shifts"
    type: "Shift"
    multiplicity: "OneToMany"
  - name: "schedules"
    type: "Schedule"
    multiplicity: "OneToMany"
- name: "Skill"
  description: "Qualification or capability that enables a resource to perform specific\
    \ services or tasks."
  data:
  - name: "name"
    type: "String"
  - name: "proficiencyScale"
    type: "String"
  - name: "category"
    type: "String"
  relations:
  - name: "resources"
    type: "Resource"
    multiplicity: "ManyToMany"
  - name: "services"
    type: "Service"
    multiplicity: "ManyToMany"
- name: "Service"
  description: "Catalog entry describing a type of work with default duration and\
    \ requirements."
  data:
  - name: "name"
    type: "String"
  - name: "defaultDuration"
    type: "Duration"
  - name: "priority"
    type: "Priority"
  - name: "requiresOnsite"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "SchedulingWorkspace"
    multiplicity: "ManyToOne"
  - name: "skills"
    type: "Skill"
    multiplicity: "ManyToMany"
  - name: "tasks"
    type: "Task"
    multiplicity: "OneToMany"
- name: "Requester"
  description: "Individual or account that requests scheduled work or appointments."
  data:
  - name: "displayName"
    type: "String"
  - name: "organization"
    type: "String"
  - name: "contact"
    type: "ContactInfo"
  relations:
  - name: "workspace"
    type: "SchedulingWorkspace"
    multiplicity: "ManyToOne"
  - name: "bookingRequests"
    type: "BookingRequest"
    multiplicity: "OneToMany"
- name: "BookingRequest"
  description: "Initial request to schedule work within a time window, with optional\
    \ preferences."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "BookingRequestStatus"
  - name: "requestedWindow"
    type: "TimeWindow"
  - name: "location"
    type: "GeoLocation"
  - name: "preferredResourceType"
    type: "ResourceType"
  - name: "priority"
    type: "Priority"
  - name: "instructions"
    type: "String"
  relations:
  - name: "workspace"
    type: "SchedulingWorkspace"
    multiplicity: "ManyToOne"
  - name: "requester"
    type: "Requester"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "Task"
    multiplicity: "OneToOne"
- name: "Task"
  description: "Unit of schedulable work derived from a request or service order."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "TaskStatus_"
  - name: "expectedDuration"
    type: "Duration"
  - name: "dueWindow"
    type: "TimeWindow"
  - name: "priority"
    type: "Priority"
  - name: "location"
    type: "GeoLocation"
  - name: "notes"
    type: "String"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "bookingRequest"
    type: "BookingRequest"
    multiplicity: "OneToOne"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
  - name: "predecessorTasks"
    type: "Task"
    multiplicity: "ManyToMany"
- name: "Appointment"
  description: "Concrete reservation of time for a resource to perform a task."
  data:
  - name: "start"
    type: "DateTime"
  - name: "end"
    type: "DateTime"
  - name: "status"
    type: "AppointmentStatus"
  - name: "location"
    type: "GeoLocation"
  - name: "travelMode"
    type: "TravelMode"
  - name: "bufferBeforeMinutes"
    type: "Integer"
  - name: "bufferAfterMinutes"
    type: "Integer"
  - name: "notes"
    type: "String"
  relations:
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "schedule"
    type: "Schedule"
    multiplicity: "ManyToOne"
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
- name: "Schedule"
  description: "Published plan defining appointments and shifts over a specific period."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "ScheduleStatus"
  - name: "periodStart"
    type: "DateTime"
  - name: "periodEnd"
    type: "DateTime"
  - name: "objective"
    type: "String"
  relations:
  - name: "workspace"
    type: "SchedulingWorkspace"
    multiplicity: "ManyToOne"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "SchedulingPolicy"
    multiplicity: "ManyToMany"
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
- name: "SchedulingPolicy"
  description: "Set of rules guiding allocation, overtime, and splitting behavior\
    \ during scheduling."
  data:
  - name: "name"
    type: "String"
  - name: "allocationStrategy"
    type: "AllocationStrategy"
  - name: "maxOvertimeMinutesPerWeek"
    type: "Integer"
  - name: "allowSplitTasks"
    type: "Boolean"
  - name: "allowDoubleBooking"
    type: "Boolean"
  - name: "backfillWindowMinutes"
    type: "Integer"
  relations:
  - name: "workspace"
    type: "SchedulingWorkspace"
    multiplicity: "ManyToOne"
  - name: "schedules"
    type: "Schedule"
    multiplicity: "ManyToMany"
- name: "Calendar"
  description: "Container for working patterns and date-specific exceptions in a given\
    \ time zone."
  data:
  - name: "name"
    type: "String"
  - name: "timeZone"
    type: "TimeZone"
  - name: "description"
    type: "String"
  relations:
  - name: "workspace"
    type: "SchedulingWorkspace"
    multiplicity: "ManyToOne"
  - name: "availabilityWindows"
    type: "AvailabilityWindow"
    multiplicity: "OneToMany"
  - name: "exceptions"
    type: "CalendarException"
    multiplicity: "OneToMany"
  - name: "resources"
    type: "Resource"
    multiplicity: "OneToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "OneToMany"
- name: "AvailabilityWindow"
  description: "Recurring weekly availability block indicating working or non-working\
    \ time."
  data:
  - name: "dayOfWeek"
    type: "DayOfWeek"
  - name: "startTimeLocal"
    type: "String"
  - name: "endTimeLocal"
    type: "String"
  - name: "isWorking"
    type: "Boolean"
  relations:
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
- name: "CalendarException"
  description: "Date-specific override to adjust availability for holidays, outages,\
    \ or special openings."
  data:
  - name: "date"
    type: "Date"
  - name: "startTimeLocal"
    type: "String"
  - name: "endTimeLocal"
    type: "String"
  - name: "isWorking"
    type: "Boolean"
  - name: "reason"
    type: "String"
  relations:
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
- name: "TimeOff"
  description: "Planned or unplanned absence blocking a resource’s availability."
  data:
  - name: "start"
    type: "DateTime"
  - name: "end"
    type: "DateTime"
  - name: "type"
    type: "TimeOffType"
  - name: "reason"
    type: "String"
  relations:
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
- name: "ShiftTemplate"
  description: "Reusable definition for recurring coverage requirements on specific\
    \ days."
  data:
  - name: "name"
    type: "String"
  - name: "dayOfWeek"
    type: "DayOfWeek"
  - name: "startTimeLocal"
    type: "String"
  - name: "endTimeLocal"
    type: "String"
  - name: "requiredResourceCount"
    type: "Integer"
  relations:
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "requiredSkills"
    type: "Skill"
    multiplicity: "ManyToMany"
  - name: "workspace"
    type: "SchedulingWorkspace"
    multiplicity: "ManyToOne"
- name: "Shift"
  description: "Concrete staffing block assigned to one or more resources on a given\
    \ date."
  data:
  - name: "date"
    type: "Date"
  - name: "start"
    type: "DateTime"
  - name: "end"
    type: "DateTime"
  - name: "status"
    type: "ShiftStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "assignedResources"
    type: "Resource"
    multiplicity: "ManyToMany"
  - name: "schedule"
    type: "Schedule"
    multiplicity: "ManyToOne"
  - name: "template"
    type: "ShiftTemplate"
    multiplicity: "ManyToOne"
enums:
- name: "ResourceType"
  description: "Classification of resources that can be scheduled."
  data:
  - name: "Person"
  - name: "Room"
  - name: "Equipment"
  - name: "Vehicle"
  - name: "Virtual"
- name: "TaskStatus_"
  description: "Lifecycle states through which a schedulable task progresses."
  data:
  - name: "Proposed"
  - name: "Ready"
  - name: "Scheduled"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
  - name: "Deferred"
- name: "AppointmentStatus"
  description: "Execution status of a concrete reservation on the calendar."
  data:
  - name: "Tentative"
  - name: "Confirmed"
  - name: "InService"
  - name: "Completed"
  - name: "NoShow"
  - name: "Cancelled"
- name: "ScheduleStatus"
  description: "Publication state of a schedule over a time horizon."
  data:
  - name: "Draft"
  - name: "Published"
  - name: "Archived"
- name: "Priority"
  description: "Relative urgency used for ordering and allocation decisions."
  data:
  - name: "Low"
  - name: "Normal"
  - name: "High"
  - name: "Urgent"
- name: "BookingRequestStatus"
  description: "Progress of a booking request from intake to fulfillment."
  data:
  - name: "New"
  - name: "Validated"
  - name: "Matched"
  - name: "Fulfilled"
  - name: "Rejected"
  - name: "Expired"
- name: "TimeOffType"
  description: "Reasons for resource unavailability outside standard calendars."
  data:
  - name: "Vacation"
  - name: "Sick"
  - name: "Holiday"
  - name: "Training"
  - name: "Maintenance"
  - name: "Other"
- name: "AllocationStrategy"
  description: "Heuristics guiding how resources are selected for work."
  data:
  - name: "FirstFit"
  - name: "BestFit"
  - name: "RoundRobin"
  - name: "LoadBalanced"
  - name: "SkillBased"
- name: "DayOfWeek"
  description: "Days used to define weekly recurrence patterns and shifts."
  data:
  - name: "Monday"
  - name: "Tuesday"
  - name: "Wednesday"
  - name: "Thursday"
  - name: "Friday"
  - name: "Saturday"
  - name: "Sunday"
- name: "ShiftStatus"
  description: "Current operational state of a staffing block."
  data:
  - name: "Planned"
  - name: "Open"
  - name: "Covered"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
- name: "TravelMode"
  description: "Method assumed for travel time estimation around appointments."
  data:
  - name: "Driving"
  - name: "Walking"
  - name: "Bicycling"
  - name: "Transit"
valueObjects:
- name: "TimeZone"
  description: "IANA-compliant time zone identifier for converting local time."
  data:
  - name: "ianaName"
    type: "String"
- name: "Duration"
  description: "Length of time expressed in whole minutes."
  data:
  - name: "minutes"
    type: "Integer"
- name: "TimeWindow"
  description: "Earliest and latest permissible times that bound scheduling decisions."
  data:
  - name: "start"
    type: "DateTime"
  - name: "end"
    type: "DateTime"
- name: "GeoLocation"
  description: "Physical point and optional address used to locate work or resources."
  data:
  - name: "latitude"
    type: "Decimal"
  - name: "longitude"
    type: "Decimal"
  - name: "address"
    type: "String"
- name: "ContactInfo"
  description: "Basic communication details for a requester or contact."
  data:
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
