---
metadata:
  name: "Case Management"
  description: "Capabilities model for managing cases through intake, investigation,\
    \ collaboration, and resolution with governed workflows, tasks, stages, SLAs,\
    \ and evidence."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Workflow & Process"
  type: "Capability"
  domain: "Case Management"
entities:
- name: "Case"
  description: "Central record representing a matter that progresses through stages\
    \ and tasks toward an outcome."
  data:
  - name: "title"
    type: "String"
  - name: "summary"
    type: "String"
  - name: "openedDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "CaseStatus"
  - name: "priority"
    type: "CasePriority"
  - name: "confidentiality"
    type: "ConfidentialityLevel"
  relations:
  - name: "type"
    type: "CaseType"
    multiplicity: "ManyToOne"
  - name: "stages"
    type: "CaseStage"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "Task"
    multiplicity: "OneToMany"
  - name: "participants"
    type: "CaseParticipant"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "notes"
    type: "Note"
    multiplicity: "OneToMany"
  - name: "communications"
    type: "Communication"
    multiplicity: "OneToMany"
  - name: "milestones"
    type: "Milestone"
    multiplicity: "OneToMany"
  - name: "decisions"
    type: "Decision"
    multiplicity: "OneToMany"
  - name: "outcomes"
    type: "Outcome"
    multiplicity: "OneToMany"
  - name: "sla"
    type: "SLAAgreement"
    multiplicity: "ManyToOne"
  - name: "escalations"
    type: "Escalation"
    multiplicity: "OneToMany"
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "auditTrail"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "CaseType"
  description: "Configuration defining lifecycle, task templates, SLAs, and policies\
    \ for a class of cases."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "defaultPriority"
    type: "CasePriority"
  relations:
  - name: "stageTemplates"
    type: "StageTemplate"
    multiplicity: "OneToMany"
  - name: "taskTemplates"
    type: "TaskTemplate"
    multiplicity: "OneToMany"
  - name: "defaultSLA"
    type: "SLAAgreement"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "cases"
    type: "Case"
    multiplicity: "OneToMany"
- name: "StageTemplate"
  description: "Prescribed stage definition for a case type including sequencing and\
    \ entry/exit criteria."
  data:
  - name: "name"
    type: "String"
  - name: "sequence"
    type: "Integer"
  - name: "entryCriteria"
    type: "String"
  - name: "exitCriteria"
    type: "String"
  relations:
  - name: "caseType"
    type: "CaseType"
    multiplicity: "ManyToOne"
  - name: "taskTemplates"
    type: "TaskTemplate"
    multiplicity: "OneToMany"
- name: "TaskTemplate"
  description: "Reusable task definition associated with a case type or stage template."
  data:
  - name: "name"
    type: "String"
  - name: "taskType"
    type: "TaskType"
  - name: "defaultDuration"
    type: "Duration"
  relations:
  - name: "caseType"
    type: "CaseType"
    multiplicity: "ManyToOne"
  - name: "stageTemplate"
    type: "StageTemplate"
    multiplicity: "ManyToOne"
- name: "CaseStage"
  description: "Runtime instance of a case stage tracking progress against its template."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "StageStatus"
  - name: "startedDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  - name: "plannedWindow"
    type: "DateRange"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "stageTemplate"
    type: "StageTemplate"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "Task"
    multiplicity: "OneToMany"
- name: "Task"
  description: "Unit of work within a case, executable by users or teams with trackable\
    \ status."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "taskType"
    type: "TaskType"
  - name: "status"
    type: "TaskStatus_"
  - name: "dueDate"
    type: "Date"
  - name: "priority"
    type: "CasePriority"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "stage"
    type: "CaseStage"
    multiplicity: "ManyToOne"
  - name: "assignments"
    type: "Assignment"
    multiplicity: "OneToMany"
  - name: "workItem"
    type: "WorkItem"
    multiplicity: "OneToOne"
  - name: "predecessors"
    type: "Task"
    multiplicity: "ManyToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "ManyToMany"
  - name: "decisions"
    type: "Decision"
    multiplicity: "OneToMany"
  - name: "milestones"
    type: "Milestone"
    multiplicity: "OneToMany"
- name: "Assignment"
  description: "Record of responsibility for a task, including ownership and acceptance\
    \ state."
  data:
  - name: "status"
    type: "AssignmentStatus"
  - name: "assignedDate"
    type: "Date"
  - name: "acceptanceDate"
    type: "Date"
  - name: "workload"
    type: "Integer"
  relations:
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "assigneeUser"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "assigneeTeam"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "queue"
    type: "Queue"
    multiplicity: "ManyToOne"
- name: "User"
  description: "Person with system access who can work on tasks and make decisions."
  data:
  - name: "username"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "timeZone"
    type: "String"
  - name: "activeFrom"
    type: "Date"
  - name: "activeTo"
    type: "Date"
  relations:
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
- name: "Team"
  description: "Group of users organized for workload, skills, and escalation handling."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "skillTags"
    type: "String"
  relations:
  - name: "members"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "queues"
    type: "Queue"
    multiplicity: "OneToMany"
  - name: "manager"
    type: "User"
    multiplicity: "ManyToOne"
- name: "CaseParticipant"
  description: "Party linked to a case with a defined role and participation period."
  data:
  - name: "role"
    type: "ParticipantRole"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "person"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "Person"
  description: "Individual participating in or related to a case."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "address"
    type: "Address"
  relations:
  - name: "organizations"
    type: "Organization"
    multiplicity: "ManyToMany"
- name: "Organization"
  description: "Legal or informal entity associated with a case as a stakeholder or\
    \ subject."
  data:
  - name: "name"
    type: "String"
  - name: "organizationType"
    type: "OrganizationType"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "address"
    type: "Address"
  relations:
  - name: "contacts"
    type: "Person"
    multiplicity: "OneToMany"
- name: "Document"
  description: "File or reference captured as supporting material for a case or task."
  data:
  - name: "title"
    type: "String"
  - name: "documentType"
    type: "DocumentType"
  - name: "uri"
    type: "URL"
  - name: "uploadedDate"
    type: "Date"
  - name: "visibility"
    type: "Visibility"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "Task"
    multiplicity: "ManyToMany"
  - name: "uploadedBy"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Note"
  description: "Unstructured annotation or comment added for collaboration and auditability."
  data:
  - name: "createdDate"
    type: "Date"
  - name: "content"
    type: "String"
  - name: "visibility"
    type: "Visibility"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
- name: "Communication"
  description: "Interaction related to a case captured across inbound and outbound\
    \ channels."
  data:
  - name: "channel"
    type: "CommunicationChannel"
  - name: "direction"
    type: "CommunicationDirection"
  - name: "subject"
    type: "String"
  - name: "body"
    type: "String"
  - name: "sentOrReceivedDate"
    type: "Date"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "relatedTask"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "sender"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "recipient"
    type: "Person"
    multiplicity: "ManyToOne"
- name: "SLAAgreement"
  description: "Service level policy defining targets and monitoring rules applied\
    \ to cases."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "SLAStatus"
  - name: "description"
    type: "String"
  relations:
  - name: "metrics"
    type: "SLAMetric"
    multiplicity: "OneToMany"
  - name: "cases"
    type: "Case"
    multiplicity: "OneToMany"
  - name: "caseType"
    type: "CaseType"
    multiplicity: "ManyToOne"
- name: "SLAMetric"
  description: "Measurable service target with timing and breach criteria."
  data:
  - name: "name"
    type: "String"
  - name: "target"
    type: "Duration"
  - name: "breachThreshold"
    type: "Duration"
  - name: "applicableStatus"
    type: "CaseStatus"
  - name: "clockStartEvent"
    type: "String"
  - name: "clockStopEvent"
    type: "String"
  relations:
  - name: "sla"
    type: "SLAAgreement"
    multiplicity: "ManyToOne"
- name: "Milestone"
  description: "Significant point in a case timeline that can be tracked for achievement."
  data:
  - name: "name"
    type: "String"
  - name: "targetDate"
    type: "Date"
  - name: "status"
    type: "MilestoneStatus"
  - name: "achievedDate"
    type: "Date"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "relatedTask"
    type: "Task"
    multiplicity: "ManyToOne"
- name: "Decision"
  description: "Choice recorded during case processing, manual or automated, with\
    \ outcome and rationale."
  data:
  - name: "decisionType"
    type: "DecisionType"
  - name: "result"
    type: "DecisionResult"
  - name: "decidedDate"
    type: "Date"
  - name: "rationale"
    type: "String"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "decidedBy"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Outcome"
  description: "Final or interim resolution state summarized for a case after a decision."
  data:
  - name: "outcomeType"
    type: "OutcomeType"
  - name: "summary"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "decidedBy"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "decision"
    type: "Decision"
    multiplicity: "ManyToOne"
- name: "Escalation"
  description: "Management action elevating attention or priority based on risk, policy,\
    \ or SLA."
  data:
  - name: "reason"
    type: "EscalationReason"
  - name: "createdDate"
    type: "Date"
  - name: "status"
    type: "SLAStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "escalatedTo"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "raisedBy"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Queue"
  description: "Work distribution point used to route and prioritize tasks."
  data:
  - name: "name"
    type: "String"
  - name: "queueType"
    type: "QueueType"
  - name: "description"
    type: "String"
  relations:
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "workItems"
    type: "WorkItem"
    multiplicity: "OneToMany"
- name: "WorkItem"
  description: "Queueable representation of a task for routing, prioritization, and\
    \ tracking."
  data:
  - name: "status"
    type: "WorkItemStatus"
  - name: "enqueuedDate"
    type: "Date"
  - name: "startedDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  - name: "priority"
    type: "CasePriority"
  relations:
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "queue"
    type: "Queue"
    multiplicity: "ManyToOne"
  - name: "currentAssignee"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Category"
  description: "Classification for cases and case types to aid routing, reporting,\
    \ and policy."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "cases"
    type: "Case"
    multiplicity: "OneToMany"
  - name: "caseTypes"
    type: "CaseType"
    multiplicity: "OneToMany"
- name: "Tag"
  description: "Lightweight labeling construct for ad hoc grouping and search."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "cases"
    type: "Case"
    multiplicity: "ManyToMany"
  - name: "tasks"
    type: "Task"
    multiplicity: "ManyToMany"
- name: "AuditEvent"
  description: "Immutable record of significant user or system actions for compliance\
    \ and forensics."
  data:
  - name: "eventType"
    type: "String"
  - name: "eventTime"
    type: "Date"
  - name: "actor"
    type: "String"
  - name: "details"
    type: "String"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
enums:
- name: "CaseStatus"
  description: "Lifecycle states through which a case may transition."
  data:
  - name: "New"
  - name: "Intake"
  - name: "InReview"
  - name: "InProgress"
  - name: "OnHold"
  - name: "WaitingForCustomer"
  - name: "Resolved"
  - name: "Closed"
  - name: "Cancelled"
  - name: "Reopened"
- name: "CasePriority"
  description: "Urgency indicator used for triage, routing, and SLA selection."
  data:
  - name: "Low"
  - name: "Normal"
  - name: "High"
  - name: "Urgent"
  - name: "Critical"
- name: "ConfidentialityLevel"
  description: "Access control classification determining who can view content."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Restricted"
  - name: "Confidential"
- name: "StageStatus"
  description: "Execution state for a case stage instance."
  data:
  - name: "NotStarted"
  - name: "Active"
  - name: "Completed"
  - name: "Skipped"
- name: "TaskStatus_"
  description: "Progress state for individual tasks within a case."
  data:
  - name: "Planned"
  - name: "Ready"
  - name: "InProgress"
  - name: "Blocked"
  - name: "Completed"
  - name: "Cancelled"
  - name: "Deferred"
- name: "TaskType"
  description: "Functional category of work guiding skills and form usage."
  data:
  - name: "Review"
  - name: "Investigation"
  - name: "Approval"
  - name: "Communication"
  - name: "Documentation"
  - name: "DataEntry"
  - name: "FieldVisit"
- name: "AssignmentStatus"
  description: "Ownership and acceptance state for a task assignment."
  data:
  - name: "Unassigned"
  - name: "Assigned"
  - name: "Accepted"
  - name: "Declined"
  - name: "Reassigned"
- name: "ParticipantRole"
  description: "Role of a person or organization within the context of a case."
  data:
  - name: "Requester"
  - name: "Subject"
  - name: "Approver"
  - name: "Investigator"
  - name: "Owner"
  - name: "Observer"
  - name: "Stakeholder"
- name: "CommunicationChannel"
  description: "Medium by which a case-related interaction occurs."
  data:
  - name: "Email"
  - name: "Phone"
  - name: "SMS"
  - name: "Portal"
  - name: "Chat"
  - name: "Letter"
  - name: "InPerson"
  - name: "Video"
- name: "CommunicationDirection"
  description: "Direction of a communication relative to the organization."
  data:
  - name: "Inbound"
  - name: "Outbound"
- name: "DocumentType"
  description: "Classification for stored content to aid governance and retrieval."
  data:
  - name: "Form"
  - name: "Attachment"
  - name: "Evidence"
  - name: "Photo"
  - name: "Transcript"
  - name: "Report"
  - name: "Contract"
- name: "DecisionType"
  description: "Method by which a decision is derived and recorded."
  data:
  - name: "Manual"
  - name: "Automated"
  - name: "Assisted"
- name: "DecisionResult"
  description: "Outcome selected by a decision step."
  data:
  - name: "Approved"
  - name: "Rejected"
  - name: "RequestChanges"
  - name: "Escalate"
  - name: "Defer"
- name: "OutcomeType"
  description: "Resolution classification for summarizing case disposition."
  data:
  - name: "Resolved"
  - name: "PartiallyResolved"
  - name: "Unresolved"
  - name: "Withdrawn"
  - name: "Duplicate"
- name: "EscalationReason"
  description: "Triggering factor for raising attention or priority."
  data:
  - name: "BreachImminent"
  - name: "BreachOccurred"
  - name: "HighPriority"
  - name: "CustomerRequest"
  - name: "PolicyException"
  - name: "Inactivity"
- name: "SLAStatus"
  description: "Monitoring status indicating achievement risk or compliance."
  data:
  - name: "NotStarted"
  - name: "AtRisk"
  - name: "Breached"
  - name: "Met"
  - name: "Paused"
- name: "MilestoneStatus"
  description: "Achievement state for key events within a case."
  data:
  - name: "Pending"
  - name: "Achieved"
  - name: "Missed"
  - name: "Cancelled"
- name: "QueueType"
  description: "Strategy used for grouping and routing work."
  data:
  - name: "SkillBased"
  - name: "Team"
  - name: "Global"
  - name: "PriorityBased"
- name: "WorkItemStatus"
  description: "Processing state of a queued unit of work."
  data:
  - name: "Queued"
  - name: "InProgress"
  - name: "Suspended"
  - name: "Completed"
  - name: "Cancelled"
- name: "Visibility"
  description: "Audience scope controlling who can view an item."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Private"
- name: "OrganizationType"
  description: "Category of organization participating in cases."
  data:
  - name: "Company"
  - name: "Agency"
  - name: "Nonprofit"
  - name: "Department"
valueObjects:
- name: "EmailAddress"
  description: "Structured representation of an electronic mail address."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "Structured telephone number with optional country code and extension."
  data:
  - name: "countryCode"
    type: "String"
  - name: "number"
    type: "String"
  - name: "extension"
    type: "String"
- name: "Address"
  description: "Physical mailing location for a person or organization."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "URL"
  description: "Locator for externally stored resources."
  data:
  - name: "value"
    type: "String"
- name: "Duration"
  description: "Time span represented as an ISO 8601 duration string."
  data:
  - name: "iso8601"
    type: "String"
- name: "DateRange"
  description: "Start and end dates bounding a planned or actual period."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
