---
metadata:
  name: "Decision Management Capabilities Model"
  description: "Canonical capabilities model for designing, governing, executing,\
    \ and monitoring enterprise decision logic across policies, rules, tables, and\
    \ services."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Workflow & Process"
  type: "Capability"
  domain: "Decision Management"
entities:
- name: "DecisionPortfolio"
  description: "Enterprise-wide container that organizes decision domains, assets,\
    \ and governance artifacts."
  data:
  - name: "name"
    type: "String"
  - name: "owner"
    type: "String"
  - name: "governanceNotes"
    type: "String"
  relations:
  - name: "decisionDomains"
    type: "DecisionDomain"
    multiplicity: "OneToMany"
  - name: "policySets"
    type: "PolicySet"
    multiplicity: "OneToMany"
  - name: "vocabularies"
    type: "Vocabulary"
    multiplicity: "OneToMany"
- name: "DecisionDomain"
  description: "Business area in which decisions are modeled, maintained, and operated."
  data:
  - name: "name"
    type: "String"
  - name: "businessArea"
    type: "String"
  relations:
  - name: "portfolio"
    type: "DecisionPortfolio"
    multiplicity: "ManyToOne"
  - name: "decisionModels"
    type: "DecisionModel"
    multiplicity: "OneToMany"
  - name: "dataStructures"
    type: "DataStructure"
    multiplicity: "OneToMany"
  - name: "factSources"
    type: "FactSource"
    multiplicity: "OneToMany"
- name: "DataStructure"
  description: "Logical schema describing inputs, intermediate facts, or outputs used\
    \ by decisions."
  data:
  - name: "name"
    type: "String"
  - name: "structureKind"
    type: "StructureKind"
  - name: "externalSchemaRef"
    type: "String"
  relations:
  - name: "domain"
    type: "DecisionDomain"
    multiplicity: "ManyToOne"
  - name: "attributes"
    type: "DataAttribute"
    multiplicity: "OneToMany"
  - name: "models"
    type: "DecisionModel"
    multiplicity: "ManyToMany"
- name: "DataAttribute"
  description: "Atomic data element within a structure with type and validation characteristics."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "required"
    type: "Boolean"
  - name: "defaultValue"
    type: "String"
  relations:
  - name: "dataStructure"
    type: "DataStructure"
    multiplicity: "ManyToOne"
- name: "Vocabulary"
  description: "Business glossary providing shared terms and definitions used in decisions."
  data:
  - name: "name"
    type: "String"
  - name: "language"
    type: "String"
  relations:
  - name: "portfolio"
    type: "DecisionPortfolio"
    multiplicity: "ManyToOne"
  - name: "terms"
    type: "Term"
    multiplicity: "OneToMany"
- name: "Term"
  description: "Defined business concept with meaning, data type, and optional synonyms."
  data:
  - name: "term"
    type: "String"
  - name: "definition"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "synonyms"
    type: "String"
  relations:
  - name: "vocabulary"
    type: "Vocabulary"
    multiplicity: "ManyToOne"
- name: "PolicySet"
  description: "Grouping of related policies that guide or constrain decisions."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "PolicyType"
  relations:
  - name: "portfolio"
    type: "DecisionPortfolio"
    multiplicity: "ManyToOne"
  - name: "policies"
    type: "Policy"
    multiplicity: "OneToMany"
- name: "Policy"
  description: "Statement of intent, rule, or regulation that must be interpreted\
    \ and enforced by decision logic."
  data:
  - name: "name"
    type: "String"
  - name: "reference"
    type: "String"
  - name: "effectiveWindow"
    type: "TimeWindow"
  - name: "lifecycleState"
    type: "LifecycleState"
  relations:
  - name: "policySet"
    type: "PolicySet"
    multiplicity: "ManyToOne"
  - name: "appliesToModels"
    type: "DecisionModel"
    multiplicity: "ManyToMany"
- name: "DecisionModel"
  description: "Cohesive set of decision assets representing a versioned, deployable\
    \ decisioning capability."
  data:
  - name: "name"
    type: "String"
  - name: "modelType"
    type: "DecisionModelType"
  - name: "version"
    type: "Version"
  - name: "lifecycleState"
    type: "LifecycleState"
  relations:
  - name: "domain"
    type: "DecisionDomain"
    multiplicity: "ManyToOne"
  - name: "decisions"
    type: "Decision"
    multiplicity: "OneToMany"
  - name: "ruleSets"
    type: "RuleSet"
    multiplicity: "OneToMany"
  - name: "scorecards"
    type: "Scorecard"
    multiplicity: "OneToMany"
  - name: "decisionServices"
    type: "DecisionService"
    multiplicity: "OneToMany"
  - name: "dataStructures"
    type: "DataStructure"
    multiplicity: "ManyToMany"
  - name: "testSuites"
    type: "TestSuite"
    multiplicity: "OneToMany"
  - name: "simulationScenarios"
    type: "SimulationScenario"
    multiplicity: "OneToMany"
  - name: "eventTriggers"
    type: "EventTrigger"
    multiplicity: "OneToMany"
  - name: "strategies"
    type: "Strategy"
    multiplicity: "OneToMany"
- name: "Decision"
  description: "Target outcome defined by inputs, logic, and policies; may be implemented\
    \ by tables, rules, or scorecards."
  data:
  - name: "name"
    type: "String"
  - name: "decisionType"
    type: "DecisionType"
  - name: "outcomeType"
    type: "OutcomeType"
  - name: "priorityScheme"
    type: "PriorityScheme"
  relations:
  - name: "model"
    type: "DecisionModel"
    multiplicity: "ManyToOne"
  - name: "decisionTable"
    type: "DecisionTable"
    multiplicity: "OneToOne"
  - name: "ruleSet"
    type: "RuleSet"
    multiplicity: "ManyToOne"
  - name: "scorecard"
    type: "Scorecard"
    multiplicity: "ManyToOne"
  - name: "requiredInputs"
    type: "DataStructure"
    multiplicity: "ManyToMany"
  - name: "producedOutputs"
    type: "DataStructure"
    multiplicity: "ManyToMany"
  - name: "invokingServices"
    type: "DecisionService"
    multiplicity: "ManyToMany"
  - name: "policies"
    type: "Policy"
    multiplicity: "ManyToMany"
- name: "DecisionTable"
  description: "Tabular representation of decision logic with inputs, outputs, and\
    \ rule rows governed by a hit policy."
  data:
  - name: "name"
    type: "String"
  - name: "hitPolicy"
    type: "HitPolicy"
  - name: "aggregation"
    type: "AggregationType"
  - name: "ruleOrderStrategy"
    type: "ConflictResolution"
  relations:
  - name: "decision"
    type: "Decision"
    multiplicity: "OneToOne"
  - name: "rules"
    type: "Rule"
    multiplicity: "OneToMany"
  - name: "inputColumns"
    type: "TableColumn"
    multiplicity: "OneToMany"
  - name: "outputColumns"
    type: "TableColumn"
    multiplicity: "OneToMany"
- name: "TableColumn"
  description: "Column definition in a decision table identifying its role and data\
    \ type."
  data:
  - name: "name"
    type: "String"
  - name: "role"
    type: "TableColumnRole"
  - name: "dataType"
    type: "DataType"
  relations:
  - name: "decisionTable"
    type: "DecisionTable"
    multiplicity: "ManyToOne"
- name: "RuleSet"
  description: "Ordered or prioritized collection of rules executed with a defined\
    \ conflict resolution strategy."
  data:
  - name: "name"
    type: "String"
  - name: "evaluationMode"
    type: "EvaluationMode"
  - name: "conflictResolution"
    type: "ConflictResolution"
  - name: "defaultOutcome"
    type: "String"
  relations:
  - name: "model"
    type: "DecisionModel"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "Rule"
    multiplicity: "OneToMany"
  - name: "targetedDecisions"
    type: "Decision"
    multiplicity: "ManyToMany"
- name: "Rule"
  description: "Atomic piece of logic composed of conditions and actions with status\
    \ and temporal effectiveness."
  data:
  - name: "name"
    type: "String"
  - name: "priority"
    type: "Integer"
  - name: "status"
    type: "RuleStatus"
  - name: "effectiveWindow"
    type: "TimeWindow"
  relations:
  - name: "ruleSet"
    type: "RuleSet"
    multiplicity: "ManyToOne"
  - name: "decisionTable"
    type: "DecisionTable"
    multiplicity: "ManyToOne"
  - name: "conditions"
    type: "Condition"
    multiplicity: "OneToMany"
  - name: "actions"
    type: "Action"
    multiplicity: "OneToMany"
  - name: "annotations"
    type: "RuleAnnotation"
    multiplicity: "OneToMany"
- name: "Condition"
  description: "Predicate that evaluates input or intermediate facts to true or false\
    \ during rule execution."
  data:
  - name: "leftOperand"
    type: "Expression"
  - name: "operator_"
    type: "ConditionOperator"
  - name: "rightOperand"
    type: "Expression"
  relations:
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
- name: "Action"
  description: "Effect performed when a rule fires, such as assigning values, routing,\
    \ or emitting events."
  data:
  - name: "actionType"
    type: "ActionType"
  - name: "expression"
    type: "Expression"
  - name: "targetPath"
    type: "String"
  relations:
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
- name: "RuleAnnotation"
  description: "Auxiliary metadata attached to a rule, often used for documentation\
    \ or operational tags."
  data:
  - name: "name"
    type: "String"
  - name: "value"
    type: "String"
  relations:
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
- name: "Scorecard"
  description: "Additive scoring model with characteristics and bins used to derive\
    \ risk, eligibility, or prioritization scores."
  data:
  - name: "name"
    type: "String"
  - name: "baselineScore"
    type: "Decimal"
  - name: "reasonCodesEnabled"
    type: "Boolean"
  relations:
  - name: "model"
    type: "DecisionModel"
    multiplicity: "ManyToOne"
  - name: "characteristics"
    type: "Characteristic"
    multiplicity: "OneToMany"
  - name: "decisions"
    type: "Decision"
    multiplicity: "OneToMany"
- name: "Characteristic"
  description: "Feature evaluated within a scorecard, aggregating bin contributions\
    \ to a partial score."
  data:
  - name: "name"
    type: "String"
  - name: "attributePath"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "partialScoreAggregation"
    type: "AggregationType"
  relations:
  - name: "scorecard"
    type: "Scorecard"
    multiplicity: "ManyToOne"
  - name: "bins"
    type: "AttributeBin"
    multiplicity: "OneToMany"
- name: "AttributeBin"
  description: "Conditional range or category contributing a partial score and optional\
    \ reason code."
  data:
  - name: "label"
    type: "String"
  - name: "condition"
    type: "Expression"
  - name: "partialScore"
    type: "Decimal"
  - name: "reasonCode"
    type: "String"
  relations:
  - name: "characteristic"
    type: "Characteristic"
    multiplicity: "ManyToOne"
- name: "DecisionService"
  description: "Deployable service endpoint that exposes one or more decisions for\
    \ online or batch evaluation."
  data:
  - name: "name"
    type: "String"
  - name: "endpoint"
    type: "String"
  - name: "evaluationMode"
    type: "EvaluationMode"
  - name: "version"
    type: "Version"
  - name: "status"
    type: "ServiceStatus"
  relations:
  - name: "model"
    type: "DecisionModel"
    multiplicity: "ManyToOne"
  - name: "exposedDecisions"
    type: "Decision"
    multiplicity: "ManyToMany"
  - name: "requests"
    type: "DecisionRequest"
    multiplicity: "OneToMany"
  - name: "executions"
    type: "DecisionExecution"
    multiplicity: "OneToMany"
- name: "DecisionRequest"
  description: "Invocation record capturing inbound context and timing for a decision\
    \ service call."
  data:
  - name: "correlationId"
    type: "String"
  - name: "receivedAt"
    type: "Date"
  - name: "channel"
    type: "String"
  relations:
  - name: "service"
    type: "DecisionService"
    multiplicity: "ManyToOne"
  - name: "execution"
    type: "DecisionExecution"
    multiplicity: "OneToOne"
- name: "DecisionExecution"
  description: "Execution trace for a decision evaluation, including timing, status,\
    \ explanations, and rule activity."
  data:
  - name: "startedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  - name: "status"
    type: "ExecutionStatus"
  - name: "outcomeSummary"
    type: "String"
  relations:
  - name: "service"
    type: "DecisionService"
    multiplicity: "ManyToOne"
  - name: "request"
    type: "DecisionRequest"
    multiplicity: "OneToOne"
  - name: "response"
    type: "DecisionResponse"
    multiplicity: "OneToOne"
  - name: "explanations"
    type: "Explanation"
    multiplicity: "OneToMany"
  - name: "ruleEvaluations"
    type: "RuleEvaluation"
    multiplicity: "OneToMany"
- name: "DecisionResponse"
  description: "Outbound result of a decision evaluation containing outcome metadata."
  data:
  - name: "respondedAt"
    type: "Date"
  - name: "outcomeType"
    type: "OutcomeType"
  relations:
  - name: "execution"
    type: "DecisionExecution"
    multiplicity: "OneToOne"
- name: "RuleEvaluation"
  description: "Per-rule execution outcome indicating whether a rule fired and its\
    \ priority at runtime."
  data:
  - name: "ruleName"
    type: "String"
  - name: "fired"
    type: "Boolean"
  - name: "priority"
    type: "Integer"
  relations:
  - name: "execution"
    type: "DecisionExecution"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
- name: "Explanation"
  description: "Human-readable narrative or structured trace explaining how an outcome\
    \ was determined."
  data:
  - name: "explanationType"
    type: "ExplanationType"
  - name: "detail"
    type: "String"
  relations:
  - name: "execution"
    type: "DecisionExecution"
    multiplicity: "ManyToOne"
- name: "FactSource"
  description: "External or internal provider of facts used as inputs to decisions."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "FactSourceType"
  - name: "connection"
    type: "String"
  relations:
  - name: "domain"
    type: "DecisionDomain"
    multiplicity: "ManyToOne"
  - name: "providedStructures"
    type: "DataStructure"
    multiplicity: "ManyToMany"
- name: "Strategy"
  description: "Approach for selecting among alternative decision implementations\
    \ or treatments."
  data:
  - name: "name"
    type: "String"
  - name: "strategyType"
    type: "StrategyType"
  relations:
  - name: "model"
    type: "DecisionModel"
    multiplicity: "ManyToOne"
  - name: "variants"
    type: "StrategyVariant"
    multiplicity: "OneToMany"
- name: "StrategyVariant"
  description: "Executable option within a strategy with allocation and associated\
    \ decision."
  data:
  - name: "name"
    type: "String"
  - name: "allocationPercent"
    type: "Integer"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "strategy"
    type: "Strategy"
    multiplicity: "ManyToOne"
  - name: "decision"
    type: "Decision"
    multiplicity: "ManyToOne"
- name: "TestSuite"
  description: "Collection of test cases ensuring decision logic correctness and stability."
  data:
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "model"
    type: "DecisionModel"
    multiplicity: "ManyToOne"
  - name: "testCases"
    type: "TestCase"
    multiplicity: "OneToMany"
- name: "TestCase"
  description: "Executable verification of a decision with defined inputs and expected\
    \ outcome."
  data:
  - name: "name"
    type: "String"
  - name: "inputSample"
    type: "Expression"
  - name: "expectedOutcome"
    type: "String"
  relations:
  - name: "testSuite"
    type: "TestSuite"
    multiplicity: "ManyToOne"
  - name: "decision"
    type: "Decision"
    multiplicity: "ManyToOne"
  - name: "lastExecution"
    type: "TestExecution"
    multiplicity: "OneToOne"
- name: "TestExecution"
  description: "Result of running a test case, including status and notes."
  data:
  - name: "executedAt"
    type: "Date"
  - name: "status"
    type: "ExecutionStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "testCase"
    type: "TestCase"
    multiplicity: "ManyToOne"
- name: "SimulationScenario"
  description: "What-if analysis configuration for evaluating decision behavior over\
    \ synthetic or historical populations."
  data:
  - name: "name"
    type: "String"
  - name: "populationSize"
    type: "Integer"
  - name: "randomSeed"
    type: "Integer"
  relations:
  - name: "model"
    type: "DecisionModel"
    multiplicity: "ManyToOne"
  - name: "results"
    type: "SimulationResult"
    multiplicity: "OneToMany"
- name: "SimulationResult"
  description: "Aggregated metric produced by a simulation scenario."
  data:
  - name: "metricName"
    type: "String"
  - name: "metricValue"
    type: "Decimal"
  relations:
  - name: "scenario"
    type: "SimulationScenario"
    multiplicity: "ManyToOne"
- name: "EventTrigger"
  description: "Condition linked to incoming events that initiates decision evaluations."
  data:
  - name: "name"
    type: "String"
  - name: "eventType"
    type: "String"
  - name: "condition"
    type: "Expression"
  relations:
  - name: "model"
    type: "DecisionModel"
    multiplicity: "ManyToOne"
  - name: "targetDecision"
    type: "Decision"
    multiplicity: "ManyToOne"
enums:
- name: "DecisionModelType"
  description: "Style of decision model determining primary authoring and execution\
    \ artifacts."
  data:
  - name: "DMN"
  - name: "RuleSet"
  - name: "Scorecard"
  - name: "Composite"
- name: "DecisionType"
  description: "Intent of the decision outcome and how it is used operationally."
  data:
  - name: "Eligibility"
  - name: "Classification"
  - name: "Routing"
  - name: "Scoring"
  - name: "Optimization"
- name: "OutcomeType"
  description: "Structural nature of the decision result."
  data:
  - name: "BooleanOutcome"
  - name: "Categorical"
  - name: "Numeric"
  - name: "Textual"
  - name: "CompositeOutcome"
- name: "HitPolicy"
  description: "Table evaluation policy choosing how multiple matching rules affect\
    \ the outcome."
  data:
  - name: "Unique"
  - name: "First"
  - name: "Priority"
  - name: "Any"
  - name: "CollectSum"
  - name: "CollectMin"
  - name: "CollectMax"
  - name: "CollectCount"
  - name: "CollectList"
  - name: "RuleOrder"
  - name: "OutputOrder"
- name: "AggregationType"
  description: "Method for combining multiple values into a single result."
  data:
  - name: "Sum"
  - name: "Min"
  - name: "Max"
  - name: "Average"
  - name: "Count"
  - name: "List"
- name: "DataType"
  description: "Primitive data types supported by decision artifacts."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime"
- name: "RuleStatus"
  description: "Operational state of a rule during its lifecycle."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Deprecated"
  - name: "Retired"
- name: "LifecycleState"
  description: "Governance state of a decision artifact from creation to retirement."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Approved"
  - name: "Released"
  - name: "Archived"
- name: "EvaluationMode"
  description: "Execution context for evaluating decisions."
  data:
  - name: "RealTime"
  - name: "Batch"
  - name: "EventDriven"
  - name: "Asynchronous"
- name: "ExecutionStatus"
  description: "Runtime status during or after a decision evaluation."
  data:
  - name: "Pending"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Skipped"
- name: "ConditionOperator"
  description: "Operator used to compare or test values in a condition."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "GreaterThan"
  - name: "GreaterOrEqual"
  - name: "LessThan"
  - name: "LessOrEqual"
  - name: "Between"
  - name: "In"
  - name: "Matches"
  - name: "Contains"
  - name: "StartsWith"
  - name: "EndsWith"
  - name: "IsNull"
  - name: "IsNotNull"
- name: "ActionType"
  description: "Category of effect executed when a rule fires."
  data:
  - name: "Assign"
  - name: "Calculate"
  - name: "SetFlag"
  - name: "Route"
  - name: "Approve"
  - name: "Reject"
  - name: "Notify"
- name: "PolicyType"
  description: "Classification of policy governing the intent and constraints of decisions."
  data:
  - name: "Regulatory"
  - name: "Risk"
  - name: "Pricing"
  - name: "Eligibility"
  - name: "Compliance"
- name: "PriorityScheme"
  description: "Method for ordering rule evaluation or conflict resolution."
  data:
  - name: "Explicit"
  - name: "Salience"
  - name: "RuleOrder"
  - name: "Specificity"
- name: "ConflictResolution"
  description: "Strategy for resolving multiple applicable rules."
  data:
  - name: "FirstMatch"
  - name: "HighestPriority"
  - name: "MostSpecific"
  - name: "RuleOrder"
- name: "ExplanationType"
  description: "Structure and purpose of decision explanations for audit and transparency."
  data:
  - name: "RuleTrace"
  - name: "ScoreBreakdown"
  - name: "Why"
  - name: "WhyNot"
- name: "ServiceStatus"
  description: "Operational availability status for a decision service."
  data:
  - name: "Enabled"
  - name: "Disabled"
  - name: "Deprecated"
- name: "FactSourceType"
  description: "Origin of facts supplied to decisions."
  data:
  - name: "API"
  - name: "Database"
  - name: "MessageQueue"
  - name: "File"
  - name: "Manual"
- name: "StrategyType"
  description: "Approach to selecting among alternative treatments or decision variants."
  data:
  - name: "ChampionChallenger"
  - name: "Segmentation"
  - name: "ABTest"
  - name: "MultiArmedBandit"
- name: "StructureKind"
  description: "Structural form of a logical data definition."
  data:
  - name: "Record"
  - name: "Collection"
  - name: "Primitive"
  - name: "Map"
  - name: "Enum"
- name: "TableColumnRole"
  description: "Role played by a decision table column in evaluation or documentation."
  data:
  - name: "Input"
  - name: "Output"
  - name: "Annotation"
  - name: "Priority"
valueObjects:
- name: "Version"
  description: "Semantic version indicating compatibility of a decision artifact."
  data:
  - name: "major"
    type: "Integer"
  - name: "minor"
    type: "Integer"
