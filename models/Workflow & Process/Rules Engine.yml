---
metadata:
  name: "Rules Engine Capabilities Model"
  description: "Canonical HCIDL capabilities model for authoring, managing, deploying,\
    \ and executing business rules and decision logic."
  version: "1.0.0"
  industry: "Enterprise Software"
  category: "Workflow & Process"
  type: "Capability"
  domain: "Rules Engine"
entities:
- name: "RuleProject"
  description: "Logical container for organizing rule assets, data sources, variables,\
    \ and functions across a business domain."
  data:
  - name: "name"
    type: "String"
  - name: "ownerTeam"
    type: "String"
  - name: "domain"
    type: "String"
  - name: "defaultNamespace"
    type: "String"
  - name: "versioningEnabled"
    type: "Boolean"
  relations:
  - name: "ruleSets"
    type: "RuleSet"
    multiplicity: "OneToMany"
  - name: "dataSources"
    type: "DataSource"
    multiplicity: "OneToMany"
  - name: "variables"
    type: "Variable"
    multiplicity: "OneToMany"
  - name: "functions"
    type: "FunctionDefinition"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "OneToMany"
- name: "RuleSet"
  description: "Group of related rules and decision assets evaluated together under\
    \ a defined strategy."
  data:
  - name: "name"
    type: "String"
  - name: "namespace"
    type: "String"
  - name: "evaluationStrategy"
    type: "EvaluationStrategy"
  - name: "conflictResolution"
    type: "ConflictResolutionStrategy"
  - name: "isEnabled"
    type: "Boolean"
  relations:
  - name: "project"
    type: "RuleProject"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "Rule"
    multiplicity: "OneToMany"
  - name: "decisionTables"
    type: "DecisionTable"
    multiplicity: "OneToMany"
  - name: "deployments"
    type: "RuleDeployment"
    multiplicity: "OneToMany"
- name: "Rule"
  description: "Executable decision artifact that evaluates conditions and performs\
    \ actions when matched."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "RuleStatus"
  - name: "severity"
    type: "RuleSeverity"
  - name: "priority"
    type: "Integer"
  - name: "effectiveWindow"
    type: "TimeWindow"
  relations:
  - name: "ruleSet"
    type: "RuleSet"
    multiplicity: "ManyToOne"
  - name: "conditionGroups"
    type: "ConditionGroup"
    multiplicity: "OneToMany"
  - name: "actions"
    type: "Action"
    multiplicity: "OneToMany"
  - name: "versions"
    type: "RuleVersion"
    multiplicity: "OneToMany"
  - name: "triggers"
    type: "RuleTrigger"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "executions"
    type: "RuleExecution"
    multiplicity: "OneToMany"
- name: "ConditionGroup"
  description: "Hierarchical grouping of conditions combined using a logical operator."
  data:
  - name: "groupOrder"
    type: "Integer"
  - name: "operator_"
    type: "LogicalOperator"
  relations:
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
  - name: "parentGroup"
    type: "ConditionGroup"
    multiplicity: "ManyToOne"
  - name: "subGroups"
    type: "ConditionGroup"
    multiplicity: "OneToMany"
  - name: "conditions"
    type: "Condition"
    multiplicity: "OneToMany"
- name: "Condition"
  description: "Atomic predicate comparing operands to determine match results."
  data:
  - name: "leftOperand"
    type: "String"
  - name: "comparison"
    type: "ComparisonOperator"
  - name: "rightOperand"
    type: "String"
  - name: "rightValueType"
    type: "DataType"
  - name: "operandType"
    type: "OperandType"
  - name: "negated"
    type: "Boolean"
  relations:
  - name: "conditionGroup"
    type: "ConditionGroup"
    multiplicity: "ManyToOne"
  - name: "fact"
    type: "Fact"
    multiplicity: "ManyToOne"
  - name: "functionDefinition"
    type: "FunctionDefinition"
    multiplicity: "ManyToOne"
- name: "Action"
  description: "Operation executed when a rule fires, such as setting values or invoking\
    \ an external service."
  data:
  - name: "name"
    type: "String"
  - name: "actionType"
    type: "ActionType"
  - name: "template"
    type: "String"
  - name: "asynchronous"
    type: "Boolean"
  relations:
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
  - name: "outputChannel"
    type: "OutputChannel"
    multiplicity: "ManyToOne"
- name: "OutputChannel"
  description: "Destination used by actions to deliver outcomes, notifications, or\
    \ events."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "OutputChannelType"
  - name: "endpoint"
    type: "String"
  - name: "retryPolicy"
    type: "RetryPolicy"
  relations:
  - name: "actions"
    type: "Action"
    multiplicity: "OneToMany"
  - name: "actionInvocations"
    type: "ActionInvocation"
    multiplicity: "OneToMany"
- name: "RuleVersion"
  description: "Immutable snapshot of a rule at a point in time for testing and deployment."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "changeNotes"
    type: "String"
  - name: "createdDate"
    type: "Date"
  - name: "isPublished"
    type: "Boolean"
  relations:
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
  - name: "deployments"
    type: "RuleDeployment"
    multiplicity: "ManyToMany"
  - name: "testRuns"
    type: "TestRun"
    multiplicity: "OneToMany"
- name: "RuleDeployment"
  description: "Release artifact that promotes rule versions to a target environment."
  data:
  - name: "name"
    type: "String"
  - name: "environment"
    type: "TargetEnvironment"
  - name: "status"
    type: "DeploymentStatus"
  - name: "deployedAt"
    type: "Date"
  relations:
  - name: "ruleSet"
    type: "RuleSet"
    multiplicity: "ManyToOne"
  - name: "ruleVersions"
    type: "RuleVersion"
    multiplicity: "ManyToMany"
- name: "RuleExecution"
  description: "Runtime evaluation record capturing outcomes and timing for a rule."
  data:
  - name: "evaluatedAt"
    type: "Date"
  - name: "status"
    type: "ExecutionStatus"
  - name: "durationMs"
    type: "Integer"
  - name: "matched"
    type: "Boolean"
  relations:
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
  - name: "context"
    type: "ExecutionContext"
    multiplicity: "ManyToOne"
  - name: "actionInvocations"
    type: "ActionInvocation"
    multiplicity: "OneToMany"
- name: "ActionInvocation"
  description: "Detailed record of an action execution attempt and its outcome."
  data:
  - name: "status"
    type: "InvocationStatus"
  - name: "attemptedAt"
    type: "Date"
  - name: "responsePayload"
    type: "String"
  relations:
  - name: "ruleExecution"
    type: "RuleExecution"
    multiplicity: "ManyToOne"
  - name: "action"
    type: "Action"
    multiplicity: "ManyToOne"
  - name: "outputChannel"
    type: "OutputChannel"
    multiplicity: "ManyToOne"
- name: "ExecutionContext"
  description: "Stateful context for a single evaluation request, including inputs\
    \ and initiator."
  data:
  - name: "correlationKey"
    type: "String"
  - name: "receivedAt"
    type: "Date"
  - name: "initiator"
    type: "String"
  - name: "triggerType"
    type: "TriggerType"
  relations:
  - name: "project"
    type: "RuleProject"
    multiplicity: "ManyToOne"
  - name: "ruleExecutions"
    type: "RuleExecution"
    multiplicity: "OneToMany"
  - name: "inputFacts"
    type: "InputFact"
    multiplicity: "OneToMany"
- name: "DataSource"
  description: "External or internal system that provides fact data to the rules engine."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "DataSourceType"
  - name: "connectionUri"
    type: "String"
  - name: "pollingIntervalSeconds"
    type: "Integer"
  - name: "isReadOnly"
    type: "Boolean"
  relations:
  - name: "project"
    type: "RuleProject"
    multiplicity: "ManyToOne"
  - name: "facts"
    type: "Fact"
    multiplicity: "OneToMany"
  - name: "variables"
    type: "Variable"
    multiplicity: "ManyToMany"
- name: "Fact"
  description: "Named piece of input data with a type and optional path within a source\
    \ payload."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "path"
    type: "String"
  - name: "isCollection"
    type: "Boolean"
  relations:
  - name: "dataSource"
    type: "DataSource"
    multiplicity: "ManyToOne"
- name: "Variable"
  description: "Parameterized input available to rules, optionally bound to one or\
    \ more data sources."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "defaultValue"
    type: "String"
  - name: "required"
    type: "Boolean"
  relations:
  - name: "project"
    type: "RuleProject"
    multiplicity: "ManyToOne"
  - name: "dataSources"
    type: "DataSource"
    multiplicity: "ManyToMany"
- name: "FunctionDefinition"
  description: "Reusable function used in conditions or calculations, defined in a\
    \ chosen expression language."
  data:
  - name: "name"
    type: "String"
  - name: "script"
    type: "ScriptSource"
  - name: "isDeterministic"
    type: "Boolean"
  relations:
  - name: "project"
    type: "RuleProject"
    multiplicity: "ManyToOne"
  - name: "conditions"
    type: "Condition"
    multiplicity: "OneToMany"
- name: "DecisionTable"
  description: "Tabular representation of decision logic with a specified hit policy\
    \ and orientation."
  data:
  - name: "name"
    type: "String"
  - name: "hitPolicy"
    type: "HitPolicy"
  - name: "orientation"
    type: "TableOrientation"
  - name: "versionLabel"
    type: "String"
  relations:
  - name: "ruleSet"
    type: "RuleSet"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "Rule"
    multiplicity: "ManyToMany"
- name: "RuleTrigger"
  description: "Mechanism that causes a rule to evaluate, such as an event or scheduled\
    \ time."
  data:
  - name: "triggerType"
    type: "TriggerType"
  - name: "eventType"
    type: "String"
  - name: "schedule"
    type: "CronExpression"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
- name: "InputFact"
  description: "Concrete input value supplied to an execution context for a given\
    \ fact definition."
  data:
  - name: "name"
    type: "String"
  - name: "value"
    type: "String"
  relations:
  - name: "context"
    type: "ExecutionContext"
    multiplicity: "ManyToOne"
  - name: "factDefinition"
    type: "Fact"
    multiplicity: "ManyToOne"
- name: "Tag"
  description: "Label used for organizing, searching, and governing rules and related\
    \ assets."
  data:
  - name: "name"
    type: "String"
  - name: "color"
    type: "String"
  relations:
  - name: "project"
    type: "RuleProject"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "Rule"
    multiplicity: "ManyToMany"
- name: "TestCase"
  description: "Declarative test specification to validate rule behavior against expected\
    \ outcomes."
  data:
  - name: "name"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  - name: "expectedMatch"
    type: "Boolean"
  - name: "notes"
    type: "String"
  relations:
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
  - name: "testRuns"
    type: "TestRun"
    multiplicity: "OneToMany"
- name: "TestRun"
  description: "Execution record of a test case against a specific rule version."
  data:
  - name: "executedAt"
    type: "Date"
  - name: "status"
    type: "TestStatus"
  - name: "durationMs"
    type: "Integer"
  - name: "notes"
    type: "String"
  relations:
  - name: "testCase"
    type: "TestCase"
    multiplicity: "ManyToOne"
  - name: "ruleVersion"
    type: "RuleVersion"
    multiplicity: "ManyToOne"
enums:
- name: "RuleStatus"
  description: "Lifecycle state of a rule from authoring through retirement."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Suspended"
  - name: "Retired"
- name: "RuleSeverity"
  description: "Business impact level used to categorize rule outcomes."
  data:
  - name: "Info"
  - name: "Warning"
  - name: "Error"
  - name: "Critical"
- name: "EvaluationStrategy"
  description: "Strategy that determines how rules within a set are evaluated."
  data:
  - name: "FirstMatch"
  - name: "AllMatch"
  - name: "BestScore"
- name: "ConflictResolutionStrategy"
  description: "Technique for resolving multiple matching rules."
  data:
  - name: "Priority"
  - name: "Recency"
  - name: "Specificity"
  - name: "RuleOrder"
- name: "ComparisonOperator"
  description: "Operators for comparing operands within a condition."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "GreaterThan"
  - name: "GreaterOrEqual"
  - name: "LessThan"
  - name: "LessOrEqual"
  - name: "In"
  - name: "NotIn"
  - name: "Contains"
  - name: "StartsWith"
  - name: "EndsWith"
  - name: "MatchesRegex"
  - name: "Between"
  - name: "IsNull"
  - name: "IsNotNull"
- name: "LogicalOperator"
  description: "Boolean operators used to combine conditions."
  data:
  - name: "And"
  - name: "Or"
  - name: "Not"
  - name: "Xor"
- name: "DataType"
  description: "Primitive and temporal data types supported by the rules engine."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "Time"
  - name: "DateTime"
- name: "ActionType"
  description: "Categories of actions triggered by matching rules."
  data:
  - name: "SetField"
  - name: "InvokeService"
  - name: "PublishEvent"
  - name: "AssignScore"
  - name: "Notify"
- name: "OutputChannelType"
  description: "Available destinations for delivering action outcomes."
  data:
  - name: "Queue"
  - name: "Topic"
  - name: "Webhook"
  - name: "Email"
  - name: "Log"
- name: "HitPolicy"
  description: "Policy that defines how decision table matches are aggregated."
  data:
  - name: "First"
  - name: "Any"
  - name: "Unique"
  - name: "Priority"
  - name: "Collect"
  - name: "RuleOrder"
- name: "TableOrientation"
  description: "Orientation of rules and conditions within a decision table."
  data:
  - name: "RulesAsRows"
  - name: "RulesAsColumns"
- name: "ExecutionStatus"
  description: "Outcome state of a rule evaluation attempt."
  data:
  - name: "Evaluated"
  - name: "Matched"
  - name: "NotMatched"
  - name: "Failed"
- name: "InvocationStatus"
  description: "Result state of an action invocation."
  data:
  - name: "Succeeded"
  - name: "Failed"
  - name: "Skipped"
  - name: "Retried"
- name: "ExpressionLanguage"
  description: "Supported languages for authoring expressions and functions."
  data:
  - name: "MVEL"
  - name: "SpEL"
  - name: "CEL"
  - name: "JEXL"
  - name: "SQL"
  - name: "JavaScript"
- name: "DataSourceType"
  description: "Types of systems from which facts may be sourced."
  data:
  - name: "API"
  - name: "Database"
  - name: "MessageBus"
  - name: "File"
  - name: "Cache"
  - name: "InMemory"
- name: "BackoffStrategy"
  description: "Algorithm used to space retries for failed deliveries."
  data:
  - name: "Fixed"
  - name: "Exponential"
  - name: "Linear"
  - name: "Fibonacci"
- name: "TargetEnvironment"
  description: "Deployment environment classifications for promoting rule versions."
  data:
  - name: "Dev"
  - name: "Test"
  - name: "Staging"
  - name: "Production"
- name: "TriggerType"
  description: "Mechanism that initiates evaluation of a rule or rule set."
  data:
  - name: "Event"
  - name: "Schedule"
  - name: "Manual"
  - name: "API"
- name: "OperandType"
  description: "Source category for the right-hand operand in a condition."
  data:
  - name: "Literal"
  - name: "Fact"
  - name: "Variable"
  - name: "Function"
- name: "TestStatus"
  description: "Result state of executing a test case."
  data:
  - name: "Passed"
  - name: "Failed"
  - name: "Error"
  - name: "Skipped"
- name: "DeploymentStatus"
  description: "Lifecycle status of a rule deployment artifact."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Succeeded"
  - name: "Failed"
  - name: "RolledBack"
valueObjects:
- name: "CronExpression"
  description: "String representation of a cron schedule used for timed evaluations."
  data:
  - name: "value"
    type: "String"
- name: "RetryPolicy"
  description: "Configuration governing action delivery retries and delays."
  data:
  - name: "maxAttempts"
    type: "Integer"
  - name: "backoffStrategy"
    type: "BackoffStrategy"
  - name: "initialDelayMs"
    type: "Integer"
- name: "TimeWindow"
  description: "Temporal interval during which a rule is considered eligible for evaluation."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "ScriptSource"
  description: "Embedded script content and language metadata for a function definition."
  data:
  - name: "language"
    type: "ExpressionLanguage"
  - name: "code"
    type: "String"
