---
metadata:
  name: "HCIDL Capabilities Model - Business Process Management"
  description: "Capability model for defining, executing, monitoring, and improving\
    \ business processes across the enterprise lifecycle."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Workflow & Process"
  type: "Capability"
  domain: "Business Process Management"
entities:
- name: "ProcessCatalog"
  description: "Curated collection of business process definitions organized for governance\
    \ and reuse."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "ownerUnit"
    type: "String"
  relations:
  - name: "processDefinitions"
    type: "ProcessDefinition"
    multiplicity: "OneToMany"
- name: "ProcessDefinition"
  description: "Canonical blueprint describing the intent and structure of a business\
    \ process independent of version."
  data:
  - name: "name"
    type: "String"
  - name: "key"
    type: "String"
  - name: "description"
    type: "String"
  - name: "lifecycleStatus"
    type: "DefinitionStatus"
  relations:
  - name: "catalog"
    type: "ProcessCatalog"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "ProcessVersion"
    multiplicity: "OneToMany"
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
- name: "ProcessVersion"
  description: "Versioned specification of a process including flow elements, variables,\
    \ forms, rules, and SLAs."
  data:
  - name: "versionTag"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "releaseNotes"
    type: "String"
  relations:
  - name: "definition"
    type: "ProcessDefinition"
    multiplicity: "ManyToOne"
  - name: "activities"
    type: "ActivityDefinition"
    multiplicity: "OneToMany"
  - name: "gateways"
    type: "GatewayDefinition"
    multiplicity: "OneToMany"
  - name: "events"
    type: "EventDefinition"
    multiplicity: "OneToMany"
  - name: "transitions"
    type: "Transition"
    multiplicity: "OneToMany"
  - name: "variableDefinitions"
    type: "VariableDefinition"
    multiplicity: "OneToMany"
  - name: "forms"
    type: "FormDefinition"
    multiplicity: "OneToMany"
  - name: "rules"
    type: "BusinessRule"
    multiplicity: "OneToMany"
  - name: "slaPolicies"
    type: "SLA"
    multiplicity: "OneToMany"
- name: "ProcessInstance"
  description: "Runtime execution of a process version with its own state, variables,\
    \ and audit trail."
  data:
  - name: "businessKey"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "ProcessInstanceStatus"
  - name: "priority"
    type: "Priority"
  relations:
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
  - name: "variables"
    type: "VariableInstance"
    multiplicity: "OneToMany"
  - name: "activityInstances"
    type: "ActivityInstance"
    multiplicity: "OneToMany"
  - name: "eventSubscriptions"
    type: "EventSubscription"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "TaskInstance"
    multiplicity: "OneToMany"
  - name: "initiator"
    type: "Participant"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "auditRecords"
    type: "AuditRecord"
    multiplicity: "OneToMany"
- name: "ActivityDefinition"
  description: "Configurable unit of work within a process, such as a user, service,\
    \ or script task."
  data:
  - name: "name"
    type: "String"
  - name: "activityType"
    type: "ActivityType"
  - name: "isBlocking"
    type: "Boolean"
  relations:
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
  - name: "form"
    type: "FormDefinition"
    multiplicity: "ManyToOne"
  - name: "assignmentRules"
    type: "AssignmentRule"
    multiplicity: "OneToMany"
  - name: "outgoingTransitions"
    type: "Transition"
    multiplicity: "OneToMany"
  - name: "incomingTransitions"
    type: "Transition"
    multiplicity: "OneToMany"
  - name: "taskDefinition"
    type: "TaskDefinition"
    multiplicity: "OneToOne"
- name: "ActivityInstance"
  description: "Runtime occurrence of an activity definition within a process instance."
  data:
  - name: "startTime"
    type: "Date"
  - name: "endTime"
    type: "Date"
  - name: "status"
    type: "ActivityInstanceStatus"
  relations:
  - name: "activityDefinition"
    type: "ActivityDefinition"
    multiplicity: "ManyToOne"
  - name: "processInstance"
    type: "ProcessInstance"
    multiplicity: "ManyToOne"
  - name: "taskInstance"
    type: "TaskInstance"
    multiplicity: "OneToOne"
- name: "TaskDefinition"
  description: "User-facing task configuration including assignment strategies, skills,\
    \ and SLAs."
  data:
  - name: "name"
    type: "String"
  - name: "autoAssignStrategy"
    type: "AssignmentStrategy"
  - name: "requiredSkills"
    type: "String"
  relations:
  - name: "activityDefinition"
    type: "ActivityDefinition"
    multiplicity: "ManyToOne"
  - name: "form"
    type: "FormDefinition"
    multiplicity: "ManyToOne"
  - name: "workQueues"
    type: "WorkQueue"
    multiplicity: "ManyToMany"
  - name: "slaPolicies"
    type: "SLA"
    multiplicity: "OneToMany"
- name: "TaskInstance"
  description: "Actionable work item assigned to participants or queues during process\
    \ execution."
  data:
  - name: "subject"
    type: "String"
  - name: "status"
    type: "TaskStatus_"
  - name: "dueDate"
    type: "Date"
  - name: "completionDate"
    type: "Date"
  - name: "priority"
    type: "Priority"
  relations:
  - name: "taskDefinition"
    type: "TaskDefinition"
    multiplicity: "ManyToOne"
  - name: "processInstance"
    type: "ProcessInstance"
    multiplicity: "ManyToOne"
  - name: "activityInstance"
    type: "ActivityInstance"
    multiplicity: "OneToOne"
  - name: "assignee"
    type: "Participant"
    multiplicity: "ManyToOne"
  - name: "candidateParticipants"
    type: "Participant"
    multiplicity: "ManyToMany"
  - name: "workQueue"
    type: "WorkQueue"
    multiplicity: "ManyToOne"
  - name: "attachments"
    type: "Document"
    multiplicity: "OneToMany"
- name: "WorkQueue"
  description: "Logical container of tasks used for routing, balancing, and monitoring\
    \ workload."
  data:
  - name: "name"
    type: "String"
  - name: "queueType"
    type: "WorkQueueType"
  - name: "description"
    type: "String"
  relations:
  - name: "tasks"
    type: "TaskInstance"
    multiplicity: "OneToMany"
  - name: "participants"
    type: "Participant"
    multiplicity: "ManyToMany"
- name: "Participant"
  description: "Human, group, or system actor that initiates processes or performs\
    \ tasks."
  data:
  - name: "name"
    type: "String"
  - name: "participantType"
    type: "ParticipantType"
  - name: "email"
    type: "String"
  relations:
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "queues"
    type: "WorkQueue"
    multiplicity: "ManyToMany"
  - name: "assignedTasks"
    type: "TaskInstance"
    multiplicity: "OneToMany"
  - name: "initiatedInstances"
    type: "ProcessInstance"
    multiplicity: "OneToMany"
- name: "Role"
  description: "Collection of permissions defining what participants may access or\
    \ perform."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "participants"
    type: "Participant"
    multiplicity: "ManyToMany"
  - name: "permissions"
    type: "Permission"
    multiplicity: "OneToMany"
- name: "Permission"
  description: "Fine-grained authorization right applied to roles across process artifacts."
  data:
  - name: "name"
    type: "String"
  - name: "scope"
    type: "PermissionScope"
  - name: "description"
    type: "String"
  relations:
  - name: "role"
    type: "Role"
    multiplicity: "ManyToOne"
- name: "AssignmentRule"
  description: "Policy that determines how tasks are routed to participants or queues."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "AssignmentRuleType"
  - name: "expression"
    type: "Expression"
  relations:
  - name: "taskDefinition"
    type: "TaskDefinition"
    multiplicity: "ManyToOne"
  - name: "fallbackQueue"
    type: "WorkQueue"
    multiplicity: "ManyToOne"
  - name: "targetRole"
    type: "Role"
    multiplicity: "ManyToOne"
- name: "FormDefinition"
  description: "Structured form used to capture or display data for tasks and process\
    \ events."
  data:
  - name: "name"
    type: "String"
  - name: "formKey"
    type: "String"
  - name: "version"
    type: "Integer"
  relations:
  - name: "fields"
    type: "FormField"
    multiplicity: "OneToMany"
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
- name: "FormField"
  description: "Atomic input or display element within a form."
  data:
  - name: "name"
    type: "String"
  - name: "label"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "required"
    type: "Boolean"
  - name: "defaultValue"
    type: "String"
  relations:
  - name: "formDefinition"
    type: "FormDefinition"
    multiplicity: "ManyToOne"
- name: "BusinessRule"
  description: "Executable decision logic used by processes to drive routing, validation,\
    \ and outcomes."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "RuleType"
  - name: "definitionText"
    type: "String"
  relations:
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
  - name: "decisionTables"
    type: "DecisionTable"
    multiplicity: "OneToMany"
- name: "DecisionTable"
  description: "Tabular representation of conditions and actions evaluated with a\
    \ defined hit policy."
  data:
  - name: "name"
    type: "String"
  - name: "hitPolicy"
    type: "HitPolicy"
  - name: "version"
    type: "Integer"
  relations:
  - name: "businessRule"
    type: "BusinessRule"
    multiplicity: "ManyToOne"
- name: "SLA"
  description: "Service-level commitment for process or task performance targets."
  data:
  - name: "name"
    type: "String"
  - name: "targetDuration"
    type: "Duration"
  - name: "breachAction"
    type: "BreachAction"
  relations:
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
  - name: "taskDefinitions"
    type: "TaskDefinition"
    multiplicity: "ManyToMany"
  - name: "escalationPolicies"
    type: "EscalationPolicy"
    multiplicity: "OneToMany"
- name: "EscalationPolicy"
  description: "Configuration that defines when and how to raise attention on at-risk\
    \ or breached work."
  data:
  - name: "name"
    type: "String"
  - name: "triggerType"
    type: "EscalationTriggerType"
  - name: "triggerThreshold"
    type: "Duration"
  - name: "notifyChannels"
    type: "String"
  relations:
  - name: "sla"
    type: "SLA"
    multiplicity: "ManyToOne"
  - name: "escalationEvents"
    type: "EscalationEvent"
    multiplicity: "OneToMany"
  - name: "targetRoles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "targetQueues"
    type: "WorkQueue"
    multiplicity: "ManyToMany"
- name: "EscalationEvent"
  description: "Recorded occurrence of an escalation for traceability and analytics."
  data:
  - name: "occurredAt"
    type: "Date"
  - name: "reason"
    type: "EscalationReason"
  relations:
  - name: "policy"
    type: "EscalationPolicy"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "TaskInstance"
    multiplicity: "ManyToOne"
  - name: "processInstance"
    type: "ProcessInstance"
    multiplicity: "ManyToOne"
- name: "EventDefinition"
  description: "Declarative definition of start, end, and intermediate events within\
    \ a process."
  data:
  - name: "name"
    type: "String"
  - name: "eventType"
    type: "BPMNEventType"
  - name: "eventKey"
    type: "String"
  relations:
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
  - name: "outgoingTransitions"
    type: "Transition"
    multiplicity: "OneToMany"
  - name: "incomingTransitions"
    type: "Transition"
    multiplicity: "OneToMany"
  - name: "timers"
    type: "TimerDefinition"
    multiplicity: "OneToMany"
- name: "EventSubscription"
  description: "Runtime registration to await or consume a specific event occurrence."
  data:
  - name: "subscribedKey"
    type: "String"
  - name: "createdAt"
    type: "Date"
  - name: "status"
    type: "SubscriptionStatus"
  relations:
  - name: "processInstance"
    type: "ProcessInstance"
    multiplicity: "ManyToOne"
  - name: "eventDefinition"
    type: "EventDefinition"
    multiplicity: "ManyToOne"
- name: "TimerDefinition"
  description: "Time-based configuration driving scheduled, duration, or cyclic behavior."
  data:
  - name: "name"
    type: "String"
  - name: "timerType"
    type: "TimerType"
  - name: "schedule"
    type: "Cron"
  - name: "duration"
    type: "Duration"
  relations:
  - name: "eventDefinition"
    type: "EventDefinition"
    multiplicity: "ManyToOne"
  - name: "timerJobs"
    type: "TimerJob"
    multiplicity: "OneToMany"
- name: "TimerJob"
  description: "Concrete timed trigger scheduled for execution at a specific point."
  data:
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "TimerJobStatus"
  relations:
  - name: "timerDefinition"
    type: "TimerDefinition"
    multiplicity: "ManyToOne"
  - name: "processInstance"
    type: "ProcessInstance"
    multiplicity: "ManyToOne"
  - name: "activityInstance"
    type: "ActivityInstance"
    multiplicity: "ManyToOne"
- name: "GatewayDefinition"
  description: "Decision or synchronization point controlling token flow through the\
    \ process."
  data:
  - name: "name"
    type: "String"
  - name: "gatewayType"
    type: "GatewayType"
  relations:
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
  - name: "outgoingTransitions"
    type: "Transition"
    multiplicity: "OneToMany"
  - name: "incomingTransitions"
    type: "Transition"
    multiplicity: "OneToMany"
- name: "Transition"
  description: "Conditional sequence flow connecting events, activities, and gateways."
  data:
  - name: "name"
    type: "String"
  - name: "condition"
    type: "Expression"
  relations:
  - name: "sourceActivity"
    type: "ActivityDefinition"
    multiplicity: "ManyToOne"
  - name: "targetActivity"
    type: "ActivityDefinition"
    multiplicity: "ManyToOne"
  - name: "sourceEvent"
    type: "EventDefinition"
    multiplicity: "ManyToOne"
  - name: "targetEvent"
    type: "EventDefinition"
    multiplicity: "ManyToOne"
  - name: "sourceGateway"
    type: "GatewayDefinition"
    multiplicity: "ManyToOne"
  - name: "targetGateway"
    type: "GatewayDefinition"
    multiplicity: "ManyToOne"
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
- name: "VariableDefinition"
  description: "Declared data element available to a process with type and constraints."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "defaultValue"
    type: "String"
  - name: "isRequired"
    type: "Boolean"
  relations:
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
- name: "VariableInstance"
  description: "Runtime value of a variable bound to a scope such as process, activity,\
    \ or task."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "value"
    type: "String"
  - name: "scope"
    type: "VariableScope"
  relations:
  - name: "processInstance"
    type: "ProcessInstance"
    multiplicity: "ManyToOne"
  - name: "activityInstance"
    type: "ActivityInstance"
    multiplicity: "ManyToOne"
  - name: "taskInstance"
    type: "TaskInstance"
    multiplicity: "ManyToOne"
- name: "Document"
  description: "File or link associated with a task or process instance for context\
    \ and evidence."
  data:
  - name: "name"
    type: "String"
  - name: "uri"
    type: "URI"
  - name: "category"
    type: "DocumentCategory"
  relations:
  - name: "task"
    type: "TaskInstance"
    multiplicity: "ManyToOne"
  - name: "processInstance"
    type: "ProcessInstance"
    multiplicity: "ManyToOne"
- name: "AuditRecord"
  description: "Immutable log entry capturing significant actions during process execution."
  data:
  - name: "eventTime"
    type: "Date"
  - name: "action"
    type: "AuditAction"
  - name: "details"
    type: "String"
  relations:
  - name: "processInstance"
    type: "ProcessInstance"
    multiplicity: "ManyToOne"
  - name: "taskInstance"
    type: "TaskInstance"
    multiplicity: "ManyToOne"
  - name: "participant"
    type: "Participant"
    multiplicity: "ManyToOne"
enums:
- name: "DefinitionStatus"
  description: "Lifecycle state of a process definition for governance and deployment."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Deprecated"
  - name: "Retired"
- name: "ProcessInstanceStatus"
  description: "Execution state of a running or completed process instance."
  data:
  - name: "Running"
  - name: "Suspended"
  - name: "Completed"
  - name: "Terminated"
  - name: "Error"
- name: "ActivityType"
  description: "Category of activity defining how work is executed."
  data:
  - name: "UserTask"
  - name: "ServiceTask"
  - name: "ScriptTask"
  - name: "SubProcess"
  - name: "CallActivity"
  - name: "ReceiveTask"
  - name: "SendTask"
- name: "ActivityInstanceStatus"
  description: "Runtime state of an activity instance."
  data:
  - name: "Ready"
  - name: "InProgress"
  - name: "Completed"
  - name: "Failed"
  - name: "Skipped"
  - name: "Cancelled"
  - name: "Suspended"
- name: "TaskStatus_"
  description: "Operational status of a human task during its lifecycle."
  data:
  - name: "New"
  - name: "Assigned"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Completed"
  - name: "Withdrawn"
  - name: "Cancelled"
  - name: "Failed"
- name: "Priority"
  description: "Relative importance used for routing and SLA evaluation."
  data:
  - name: "Low"
  - name: "Normal"
  - name: "High"
  - name: "Critical"
- name: "WorkQueueType"
  description: "Nature of the queue used for task distribution."
  data:
  - name: "Personal"
  - name: "Shared"
  - name: "System"
- name: "ParticipantType"
  description: "Classification of an actor interacting with the process."
  data:
  - name: "User"
  - name: "Group"
  - name: "System"
- name: "AssignmentStrategy"
  description: "Automated method for selecting an assignee for a task."
  data:
  - name: "RoundRobin"
  - name: "LoadBalanced"
  - name: "SkillBased"
  - name: "Direct"
- name: "PermissionScope"
  description: "Domain within which a permission applies."
  data:
  - name: "Definition"
  - name: "Instance"
  - name: "Task"
  - name: "Administration"
- name: "AssignmentRuleType"
  description: "Mechanism used to evaluate and apply an assignment rule."
  data:
  - name: "Expression"
  - name: "RoleBased"
  - name: "QueueBased"
  - name: "Script"
- name: "DataType"
  description: "Supported primitive or structured types for variables and form fields."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime"
  - name: "JSON"
  - name: "Binary"
- name: "RuleType"
  description: "Type of executable decision artifact."
  data:
  - name: "DecisionTable"
  - name: "Expression"
  - name: "Script"
- name: "HitPolicy"
  description: "Strategy for selecting results when multiple decision table rules\
    \ match."
  data:
  - name: "First"
  - name: "Unique"
  - name: "Any"
  - name: "Priority"
  - name: "Collect"
- name: "BreachAction"
  description: "Automatic response triggered when an SLA is breached."
  data:
  - name: "Notify"
  - name: "Reassign"
  - name: "Escalate"
  - name: "AutoComplete"
  - name: "TriggerEvent"
- name: "EscalationTriggerType"
  description: "Condition that determines when an escalation should occur."
  data:
  - name: "TimeToAcknowledge"
  - name: "TimeToComplete"
  - name: "Inactivity"
  - name: "SLAAtRisk"
- name: "EscalationReason"
  description: "Categorization of why an escalation event was raised."
  data:
  - name: "Breach"
  - name: "NearBreach"
  - name: "ManualEscalation"
- name: "BPMNEventType"
  description: "Standardized event category derived from BPMN semantics."
  data:
  - name: "Start"
  - name: "End"
  - name: "IntermediateCatch"
  - name: "IntermediateThrow"
  - name: "Boundary"
- name: "SubscriptionStatus"
  description: "Lifecycle of an event subscription awaiting or having consumed an\
    \ event."
  data:
  - name: "Active"
  - name: "Consumed"
  - name: "Cancelled"
- name: "TimerType"
  description: "Method by which a timer determines its firing schedule."
  data:
  - name: "Duration"
  - name: "Date"
  - name: "Cycle"
- name: "TimerJobStatus"
  description: "Execution state of a scheduled timer job."
  data:
  - name: "Scheduled"
  - name: "Fired"
  - name: "Cancelled"
  - name: "Error"
- name: "GatewayType"
  description: "Behavior of a flow control gateway."
  data:
  - name: "Exclusive"
  - name: "Parallel"
  - name: "Inclusive"
  - name: "EventBased"
  - name: "Complex"
- name: "VariableScope"
  description: "Context in which a variable value is visible and maintained."
  data:
  - name: "Process"
  - name: "Activity"
  - name: "Task"
- name: "DocumentCategory"
  description: "Purpose of a document attached to work."
  data:
  - name: "Attachment"
  - name: "Evidence"
  - name: "Output"
  - name: "Reference"
- name: "AuditAction"
  description: "Type of auditable event emitted during process operations."
  data:
  - name: "Created"
  - name: "Updated"
  - name: "Assigned"
  - name: "Completed"
  - name: "Reassigned"
  - name: "Escalated"
  - name: "Commented"
  - name: "VariableChanged"
- name: "ExpressionLanguage"
  description: "Language used to evaluate expressions for routing, rules, or assignments."
  data:
  - name: "FEEL"
  - name: "JEXL"
  - name: "SpEL"
  - name: "MVEL"
  - name: "JavaScript"
valueObjects:
- name: "Duration"
  description: "Human-readable ISO 8601 duration representation used for SLAs and\
    \ timers."
  data:
  - name: "iso8601"
    type: "String"
