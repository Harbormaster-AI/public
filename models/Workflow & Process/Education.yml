metadata:
  name: "Education Industry Domain Model"
  version: "1.0.0"
  industry: "Education"
  category: "Workflow & Process"
  description: "HCIDL model capturing core academic structure, programs, enrollments,\
    \ assessments, libraries, admissions, and bursar functions."
  type: "Industry"
  domain: "Education"
enums:
- name: "ProgramLevel"
  description: "Academic level of study for a program or application."
  data:
  - name: "Undergraduate"
  - name: "Graduate"
  - name: "Professional"
  - name: "ContinuingEducation"
- name: "DegreeType"
  description: "Credential conferred upon completion of a program."
  data:
  - name: "BA"
  - name: "BS"
  - name: "MA"
  - name: "MS"
  - name: "PhD"
  - name: "Certificate"
  - name: "Diploma"
- name: "CourseLevel"
  description: "Relative academic level of a course."
  data:
  - name: "LowerDivision"
  - name: "UpperDivision"
  - name: "Graduate"
- name: "DeliveryMode"
  description: "Instructional delivery method for a course or section."
  data:
  - name: "InPerson"
  - name: "OnlineSynchronous"
  - name: "OnlineAsynchronous"
  - name: "Hybrid"
- name: "SectionType"
  description: "Pedagogical format of a course section."
  data:
  - name: "Lecture"
  - name: "Lab"
  - name: "Seminar"
  - name: "Studio"
  - name: "Discussion"
- name: "SectionStatus"
  description: "Availability state of a course section."
  data:
  - name: "Planned"
  - name: "Open"
  - name: "Full"
  - name: "Cancelled"
  - name: "Closed"
- name: "EnrollmentStatus"
  description: "Registration state for a student in a section."
  data:
  - name: "Enrolled"
  - name: "Waitlisted"
  - name: "Dropped"
  - name: "Withdrawn"
  - name: "Audit"
- name: "GradingBasis"
  description: "Evaluation scheme under which a student is graded."
  data:
  - name: "Letter"
  - name: "PassFail"
  - name: "SatisfactoryUnsatisfactory"
