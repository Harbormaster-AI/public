---
metadata:
  name: "Escalation Management Capabilities Model (HCIDL)"
  description: "A comprehensive capabilities model for defining, executing, and governing\
    \ escalation workflows across cases, alerts, policies, and response teams."
  version: "1.0.0"
  industry: "Enterprise Software"
  category: "Workflow & Process"
  type: "Capability"
  domain: "Escalation Management"
entities:
- name: "Organization"
  description: "Administrative boundary that owns teams, policies, and shared escalation\
    \ configuration."
  data:
  - name: "name"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "defaultLocale"
    type: "String"
  - name: "businessHours"
    type: "TimeWindow"
  relations:
  - name: "teams"
    type: "Team"
    multiplicity: "OneToMany"
  - name: "users"
    type: "User"
    multiplicity: "OneToMany"
  - name: "escalationPolicies"
    type: "EscalationPolicy"
    multiplicity: "OneToMany"
  - name: "slas"
    type: "SLA"
    multiplicity: "OneToMany"
  - name: "channels"
    type: "NotificationChannel"
    multiplicity: "OneToMany"
  - name: "suppressionRules"
    type: "SuppressionRule"
    multiplicity: "OneToMany"
- name: "Team"
  description: "Operational group responsible for handling cases and participating\
    \ in escalations."
  data:
  - name: "name"
    type: "String"
  - name: "function"
    type: "String"
  - name: "timeZone"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "members"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "policies"
    type: "EscalationPolicy"
    multiplicity: "ManyToMany"
  - name: "onCallRotations"
    type: "OnCallRotation"
    multiplicity: "OneToMany"
  - name: "cases"
    type: "Case"
    multiplicity: "OneToMany"
- name: "User"
  description: "Individual participant who can receive notifications, acknowledge\
    \ escalations, and own assignments."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "UserRole"
  - name: "preferredChannel"
    type: "ChannelType"
  - name: "outOfOffice"
    type: "Boolean"
  relations:
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "notificationPreferences"
    type: "NotificationPreference"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "Assignment"
    multiplicity: "OneToMany"
  - name: "acknowledgements"
    type: "Acknowledgement"
    multiplicity: "OneToMany"
  - name: "scheduleSegments"
    type: "ScheduleSegment"
    multiplicity: "OneToMany"
- name: "NotificationChannel"
  description: "Configured delivery mechanism used to send notifications during escalations."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "endpoint"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "notifications"
    type: "Notification"
    multiplicity: "OneToMany"
  - name: "preferences"
    type: "NotificationPreference"
    multiplicity: "OneToMany"
- name: "NotificationPreference"
  description: "User-specific channel configuration, quiet hours, and priority thresholds\
    \ for notifications."
  data:
  - name: "enabled"
    type: "Boolean"
  - name: "minPriority"
    type: "Priority"
  - name: "quietHours"
    type: "TimeWindow"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "NotificationChannel"
    multiplicity: "ManyToOne"
- name: "OnCallRotation"
  description: "Rotation plan that defines how coverage is shared among participants\
    \ over time."
  data:
  - name: "name"
    type: "String"
  - name: "rotationType"
    type: "RotationType"
  - name: "handoffHour"
    type: "Integer"
  - name: "interval"
    type: "Duration"
  relations:
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "participants"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "scheduleSegments"
    type: "ScheduleSegment"
    multiplicity: "OneToMany"
- name: "ScheduleSegment"
  description: "Time-bounded assignment within a rotation indicating who is on call."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "isPrimary"
    type: "Boolean"
  relations:
  - name: "rotation"
    type: "OnCallRotation"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "SLA"
  description: "Policy defining response and resolution targets used for breach detection\
    \ and escalation timing."
  data:
  - name: "name"
    type: "String"
  - name: "responseTarget"
    type: "Duration"
  - name: "resolutionTarget"
    type: "Duration"
  - name: "breachGrace"
    type: "Duration"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "policies"
    type: "EscalationPolicy"
    multiplicity: "ManyToMany"
  - name: "cases"
    type: "Case"
    multiplicity: "OneToMany"
- name: "EscalationPolicy"
  description: "Rule-driven playbook that determines when and how escalations are\
    \ executed."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "policyType"
    type: "PolicyType"
  - name: "defaultPriority"
    type: "Priority"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "rules"
    type: "EscalationRule"
    multiplicity: "OneToMany"
  - name: "levels"
    type: "EscalationLevel"
    multiplicity: "OneToMany"
  - name: "sla"
    type: "SLA"
    multiplicity: "ManyToOne"
- name: "EscalationLevel"
  description: "Ordered stage within a policy that targets specific recipients and\
    \ actions after a delay."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "delay"
    type: "Duration"
  - name: "maxRetries"
    type: "Integer"
  - name: "notifyAllTargets"
    type: "Boolean"
  relations:
  - name: "policy"
    type: "EscalationPolicy"
    multiplicity: "ManyToOne"
  - name: "targets"
    type: "EscalationTarget"
    multiplicity: "OneToMany"
  - name: "actions"
    type: "EscalationAction"
    multiplicity: "OneToMany"
- name: "EscalationTarget"
  description: "Destination for a level, which may represent a user, team, or on-call\
    \ role."
  data:
  - name: "targetScope"
    type: "TargetScope"
  relations:
  - name: "level"
    type: "EscalationLevel"
    multiplicity: "ManyToOne"
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "EscalationAction"
  description: "Instruction executed at a level, such as notifying recipients or invoking\
    \ an integration."
  data:
  - name: "actionType"
    type: "ActionType"
  - name: "channel"
    type: "ChannelType"
  - name: "retryInterval"
    type: "Duration"
  - name: "maxAttempts"
    type: "Integer"
  - name: "messageTemplate"
    type: "MessageTemplate"
  - name: "endpointUrl"
    type: "String"
  relations:
  - name: "level"
    type: "EscalationLevel"
    multiplicity: "ManyToOne"
- name: "EscalationRule"
  description: "Conditional logic that selects a target level when specific events\
    \ or attributes match."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "RuleStatus"
  - name: "salience"
    type: "Integer"
  - name: "triggerEvent"
    type: "TriggerEventType"
  - name: "evaluationWindow"
    type: "Duration"
  - name: "matchMode"
    type: "MatchMode"
  relations:
  - name: "policy"
    type: "EscalationPolicy"
    multiplicity: "ManyToOne"
  - name: "predicates"
    type: "RulePredicate"
    multiplicity: "OneToMany"
  - name: "targetLevel"
    type: "EscalationLevel"
    multiplicity: "ManyToOne"
- name: "RulePredicate"
  description: "Atomic comparison used by a rule to evaluate event or case attributes."
  data:
  - name: "attributeName"
    type: "String"
  - name: "operator_"
    type: "ConditionOperator"
  - name: "comparisonValue"
    type: "String"
  - name: "caseInsensitive"
    type: "Boolean"
  relations:
  - name: "rule"
    type: "EscalationRule"
    multiplicity: "ManyToOne"
- name: "Case"
  description: "Managed unit of work subject to SLAs and escalation flows."
  data:
  - name: "title"
    type: "String"
  - name: "summary"
    type: "String"
  - name: "source"
    type: "String"
  - name: "severity"
    type: "SeverityLevel"
  - name: "priority"
    type: "Priority"
  - name: "state"
    type: "CaseState"
  - name: "createdDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "EscalationPolicy"
    multiplicity: "ManyToOne"
  - name: "sla"
    type: "SLA"
    multiplicity: "ManyToOne"
  - name: "escalations"
    type: "EscalationEvent"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "Assignment"
    multiplicity: "OneToMany"
  - name: "acknowledgements"
    type: "Acknowledgement"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
- name: "Alert"
  description: "Incoming signal from monitoring or external systems that may trigger\
    \ or inform escalations."
  data:
  - name: "sourceSystem"
    type: "String"
  - name: "externalRef"
    type: "String"
  - name: "message"
    type: "String"
  - name: "severity"
    type: "SeverityLevel"
  - name: "occurredOn"
    type: "Date"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "escalationEvent"
    type: "EscalationEvent"
    multiplicity: "ManyToOne"
- name: "EscalationEvent"
  description: "Execution record of an escalation, tracking its reason, state, notifications,\
    \ and actions."
  data:
  - name: "reason"
    type: "EscalationReason"
  - name: "status"
    type: "EscalationStatus"
  - name: "triggeredOn"
    type: "Date"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "level"
    type: "EscalationLevel"
    multiplicity: "ManyToOne"
  - name: "notifications"
    type: "Notification"
    multiplicity: "OneToMany"
  - name: "actions"
    type: "PerformedAction"
    multiplicity: "OneToMany"
- name: "Notification"
  description: "Message sent to a recipient or endpoint as part of an escalation."
  data:
  - name: "subject"
    type: "String"
  - name: "body"
    type: "String"
  - name: "status"
    type: "NotificationStatus"
  - name: "sentOn"
    type: "Date"
  relations:
  - name: "escalationEvent"
    type: "EscalationEvent"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "NotificationChannel"
    multiplicity: "ManyToOne"
  - name: "recipient"
    type: "User"
    multiplicity: "ManyToOne"
- name: "PerformedAction"
  description: "Outcome log for an action executed during an escalation event."
  data:
  - name: "actionType"
    type: "ActionType"
  - name: "status"
    type: "ExecutionStatus"
  - name: "performedOn"
    type: "Date"
  - name: "detail"
    type: "String"
  relations:
  - name: "escalationEvent"
    type: "EscalationEvent"
    multiplicity: "ManyToOne"
- name: "Assignment"
  description: "Ownership record linking a case to responsible users or teams."
  data:
  - name: "role"
    type: "AssignmentRole"
  - name: "status"
    type: "AssignmentStatus"
  - name: "assignedOn"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "assigneeUser"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "assigneeTeam"
    type: "Team"
    multiplicity: "ManyToOne"
- name: "Acknowledgement"
  description: "Response from a user indicating awareness or acceptance of responsibility\
    \ for an escalation."
  data:
  - name: "status"
    type: "AcknowledgementStatus"
  - name: "acknowledgedOn"
    type: "Date"
  - name: "comment"
    type: "String"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "escalationEvent"
    type: "EscalationEvent"
    multiplicity: "ManyToOne"
- name: "SuppressionRule"
  description: "Control that prevents or mutes escalations during defined conditions\
    \ or windows."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "RuleStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "predicates"
    type: "SuppressionPredicate"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "EscalationPolicy"
    multiplicity: "ManyToMany"
- name: "SuppressionPredicate"
  description: "Attribute comparison that determines if suppression should apply."
  data:
  - name: "attributeName"
    type: "String"
  - name: "operator_"
    type: "ConditionOperator"
  - name: "comparisonValue"
    type: "String"
  relations:
  - name: "suppressionRule"
    type: "SuppressionRule"
    multiplicity: "ManyToOne"
enums:
- name: "SeverityLevel"
  description: "Relative impact rating used to gauge urgency and potential business\
    \ effect."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "Priority"
  description: "Execution urgency ordering used for queuing work and notifications."
  data:
  - name: "P1"
  - name: "P2"
  - name: "P3"
  - name: "P4"
  - name: "P5"
- name: "CaseState"
  description: "Lifecycle states for a case managed under escalation policies."
  data:
  - name: "New"
  - name: "Triaged"
  - name: "InProgress"
  - name: "AwaitingResponse"
  - name: "Resolved"
  - name: "Closed"
  - name: "Cancelled"
- name: "ChannelType"
  description: "Supported communication or integration channels for notifications\
    \ and actions."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "VoiceCall"
  - name: "Push"
  - name: "ChatOps"
  - name: "Webhook"
- name: "RotationType"
  description: "Pattern determining how on-call coverage rotates among participants."
  data:
  - name: "Daily"
  - name: "Weekly"
  - name: "Custom"
- name: "PolicyType"
  description: "Category of escalation policy that shapes targets and actions."
  data:
  - name: "IncidentResponse"
  - name: "CustomerSupport"
  - name: "SecurityAlert"
  - name: "ComplianceAlert"
- name: "RuleStatus"
  description: "Operational state of a rule controlling whether it participates in\
    \ evaluation."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Suspended"
  - name: "Retired"
- name: "TriggerEventType"
  description: "Events that can initiate rule evaluation and potential escalation."
  data:
  - name: "CaseCreated"
  - name: "CaseUpdated"
  - name: "SLAAtRisk"
  - name: "SLAExceeded"
  - name: "NoAssignee"
  - name: "NoAcknowledgement"
  - name: "Manual"
- name: "MatchMode"
  description: "How multiple predicates must evaluate to consider a rule satisfied."
  data:
  - name: "All"
  - name: "Any"
- name: "ConditionOperator"
  description: "Comparison operators for evaluating predicate expressions."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "GreaterThan"
  - name: "LessThan"
  - name: "Contains"
  - name: "NotContains"
  - name: "MatchesRegex"
  - name: "In"
  - name: "NotIn"
  - name: "Exists"
  - name: "NotExists"
- name: "TargetScope"
  description: "Type of destination that a level should notify or assign."
  data:
  - name: "User"
  - name: "Team"
  - name: "OnCallPrimary"
  - name: "OnCallSecondary"
  - name: "ServiceOwner"
- name: "ActionType"
  description: "Action semantics executed at an escalation level or event."
  data:
  - name: "NotifyUser"
  - name: "NotifyTeam"
  - name: "CreateTicket"
  - name: "RunPlaybook"
  - name: "WebhookCall"
  - name: "AutoAssign"
  - name: "AutoResolve"
  - name: "PostToChat"
- name: "NotificationStatus"
  description: "Delivery lifecycle states for a notification."
  data:
  - name: "Pending"
  - name: "Sent"
  - name: "Delivered"
  - name: "Failed"
  - name: "Bounced"
  - name: "Acknowledged"
  - name: "Skipped"
- name: "EscalationReason"
  description: "Primary cause for initiating an escalation event."
  data:
  - name: "NoResponse"
  - name: "BreachImminent"
  - name: "Breached"
  - name: "ManualRequest"
  - name: "Reassignment"
  - name: "DependencyFailure"
- name: "EscalationStatus"
  description: "Processing state for an escalation event."
  data:
  - name: "Pending"
  - name: "InProgress"
  - name: "Acknowledged"
  - name: "Cancelled"
  - name: "Completed"
  - name: "Failed"
  - name: "Skipped"
- name: "AssignmentRole"
  description: "Role played by an assignee in the handling of a case."
  data:
  - name: "Primary"
  - name: "Secondary"
  - name: "Manager"
  - name: "Observer"
  - name: "Approver"
- name: "AssignmentStatus"
  description: "Lifecycle state of a case assignment."
  data:
  - name: "Active"
  - name: "Released"
  - name: "Transferred"
  - name: "Completed"
  - name: "Failed"
- name: "AcknowledgementStatus"
  description: "Status of a user's response to an escalation notification."
  data:
  - name: "Acknowledged"
  - name: "Declined"
  - name: "TimedOut"
  - name: "Retracted"
- name: "ExecutionStatus"
  description: "Outcome of an action performed during an escalation."
  data:
  - name: "Pending"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Skipped"
- name: "UserRole"
  description: "Functional responsibility assigned to a user within escalation operations."
  data:
  - name: "Agent"
  - name: "Supervisor"
  - name: "Manager"
  - name: "SRE"
  - name: "Analyst"
  - name: "Admin"
- name: "TimeUnit"
  description: "Measurement units for expressing durations and delays."
  data:
  - name: "Minutes"
  - name: "Hours"
  - name: "Days"
valueObjects:
- name: "Duration"
  description: "Length of time expressed as a value and unit for delays and targets."
  data:
  - name: "amount"
    type: "Integer"
  - name: "unit"
    type: "TimeUnit"
- name: "TimeWindow"
  description: "Daily window with start and end times in a specific timezone for operating\
    \ or quiet hours."
  data:
  - name: "startTime"
    type: "String"
  - name: "endTime"
    type: "String"
  - name: "timezone"
    type: "String"
- name: "MessageTemplate"
  description: "Structured content used to render messages for notifications and actions."
  data:
  - name: "subject"
    type: "String"
  - name: "body"
    type: "String"
