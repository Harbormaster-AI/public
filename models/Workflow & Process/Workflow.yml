---
metadata:
  name: "HCIDL Capabilities Model - Workflow"
  description: "Canonical capabilities model for workflow, process and task orchestration\
    \ across their full lifecycle, including design, execution, decisioning, approvals,\
    \ scheduling, and governance."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Workflow & Process"
  type: "Capability"
  domain: "Workflow"
entities:
- name: "Workspace"
  description: "Logical container for workflow assets, users, and operational settings."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "ownerName"
    type: "String"
  relations:
  - name: "processDefinitions"
    type: "ProcessDefinition"
    multiplicity: "OneToMany"
  - name: "users"
    type: "User"
    multiplicity: "OneToMany"
  - name: "workQueues"
    type: "WorkQueue"
    multiplicity: "OneToMany"
- name: "ProcessDefinition"
  description: "Named workflow blueprint used to create process versions and instances."
  data:
  - name: "name"
    type: "String"
  - name: "key"
    type: "String"
  - name: "status"
    type: "ProcessStatus"
  - name: "isPublic"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "ProcessVersion"
    multiplicity: "OneToMany"
  - name: "timers"
    type: "TimerTrigger"
    multiplicity: "OneToMany"
- name: "ProcessVersion"
  description: "Immutable, deployable specification of a workflow for execution."
  data:
  - name: "versionNumber"
    type: "Integer"
  - name: "activationDate"
    type: "Date"
  - name: "status"
    type: "ProcessStatus"
  - name: "description"
    type: "String"
  relations:
  - name: "processDefinition"
    type: "ProcessDefinition"
    multiplicity: "ManyToOne"
  - name: "taskDefinitions"
    type: "TaskDefinition"
    multiplicity: "OneToMany"
  - name: "gateways"
    type: "Gateway"
    multiplicity: "OneToMany"
  - name: "transitions"
    type: "Transition"
    multiplicity: "OneToMany"
  - name: "eventDefinitions"
    type: "EventDefinition"
    multiplicity: "OneToMany"
  - name: "variableDefinitions"
    type: "VariableDefinition"
    multiplicity: "OneToMany"
  - name: "dataMappings"
    type: "DataMapping"
    multiplicity: "OneToMany"
- name: "TaskDefinition"
  description: "Configured unit of work within a process version."
  data:
  - name: "name"
    type: "String"
  - name: "taskType"
    type: "TaskType"
  - name: "priority"
    type: "Priority"
  - name: "sla"
    type: "Duration"
  relations:
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
  - name: "assignmentPolicy"
    type: "AssignmentPolicy"
    multiplicity: "ManyToOne"
  - name: "form"
    type: "FormDefinition"
    multiplicity: "ManyToOne"
  - name: "outgoingTransitions"
    type: "Transition"
    multiplicity: "OneToMany"
  - name: "incomingTransitions"
    type: "Transition"
    multiplicity: "OneToMany"
  - name: "integrationEndpoints"
    type: "IntegrationEndpoint"
    multiplicity: "ManyToMany"
  - name: "variableDefinitions"
    type: "VariableDefinition"
    multiplicity: "OneToMany"
  - name: "slaAgreements"
    type: "SLAAgreement"
    multiplicity: "ManyToMany"
- name: "Gateway"
  description: "Decision or synchronization point controlling alternate and parallel\
    \ flows."
  data:
  - name: "name"
    type: "String"
  - name: "gatewayType"
    type: "GatewayType"
  relations:
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
  - name: "incomingTransitions"
    type: "Transition"
    multiplicity: "OneToMany"
  - name: "outgoingTransitions"
    type: "Transition"
    multiplicity: "OneToMany"
- name: "Transition"
  description: "Directed connection that moves execution from one node to another\
    \ when conditions are met."
  data:
  - name: "name"
    type: "String"
  - name: "condition"
    type: "Expression"
  - name: "evaluationOrder"
    type: "Integer"
  - name: "isDefault"
    type: "Boolean"
  relations:
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
  - name: "fromTask"
    type: "TaskDefinition"
    multiplicity: "ManyToOne"
  - name: "toTask"
    type: "TaskDefinition"
    multiplicity: "ManyToOne"
  - name: "gateway"
    type: "Gateway"
    multiplicity: "ManyToOne"
- name: "FormDefinition"
  description: "Structured input and presentation model for human tasks."
  data:
  - name: "name"
    type: "String"
  - name: "schema"
    type: "JsonDocument"
  - name: "uiSchema"
    type: "JsonDocument"
  relations:
  - name: "taskDefinitions"
    type: "TaskDefinition"
    multiplicity: "OneToMany"
- name: "AssignmentPolicy"
  description: "Strategy and constraints governing how work is routed and assigned."
  data:
  - name: "name"
    type: "String"
  - name: "strategy"
    type: "AssignmentStrategy"
  - name: "useWorkloadBalancing"
    type: "Boolean"
  relations:
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
- name: "Role"
  description: "Group-based capability used for authorization, routing, and reporting."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "assignmentPolicies"
    type: "AssignmentPolicy"
    multiplicity: "ManyToMany"
  - name: "workQueues"
    type: "WorkQueue"
    multiplicity: "ManyToMany"
- name: "User"
  description: "Individual participant who can act on tasks and receive notifications."
  data:
  - name: "username"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "active"
    type: "Boolean"
  - name: "timezone"
    type: "String"
  relations:
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "workQueues"
    type: "WorkQueue"
    multiplicity: "ManyToMany"
- name: "VariableDefinition"
  description: "Declarative schema for variables that can be used within a process\
    \ or task."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "required"
    type: "Boolean"
  - name: "defaultValue"
    type: "String"
  - name: "scope"
    type: "VariableScope"
  relations:
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
  - name: "taskDefinition"
    type: "TaskDefinition"
    multiplicity: "ManyToOne"
- name: "IntegrationEndpoint"
  description: "External system endpoint configuration for service tasks and rules."
  data:
  - name: "name"
    type: "String"
  - name: "method"
    type: "String"
  - name: "uri"
    type: "URI"
  - name: "authType"
    type: "IntegrationAuthType"
  - name: "timeout"
    type: "Duration"
  relations:
  - name: "usedByTasks"
    type: "TaskDefinition"
    multiplicity: "ManyToMany"
- name: "DecisionTable"
  description: "Tabular decision artifact used to evaluate outcomes and set variables."
  data:
  - name: "name"
    type: "String"
  - name: "hitPolicy"
    type: "DecisionHitPolicy"
  - name: "definition"
    type: "JsonDocument"
  relations:
  - name: "ruleSet"
    type: "RuleSet"
    multiplicity: "ManyToOne"
- name: "RuleSet"
  description: "Collection of decision logic assets managed under a common lifecycle."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "RuleSetStatus"
  relations:
  - name: "decisionTables"
    type: "DecisionTable"
    multiplicity: "OneToMany"
  - name: "rules"
    type: "RuleDefinition"
    multiplicity: "OneToMany"
- name: "RuleDefinition"
  description: "Atomic rule consisting of a condition and an effect executed when\
    \ matched."
  data:
  - name: "name"
    type: "String"
  - name: "condition"
    type: "Expression"
  - name: "effect"
    type: "RuleEffectType"
  - name: "payload"
    type: "JsonDocument"
  relations:
  - name: "ruleSet"
    type: "RuleSet"
    multiplicity: "ManyToOne"
- name: "StateMachineDefinition"
  description: "Declarative state model for case and process governance."
  data:
  - name: "name"
    type: "String"
  - name: "initialState"
    type: "String"
  relations:
  - name: "states"
    type: "State"
    multiplicity: "OneToMany"
  - name: "transitions"
    type: "StateTransition"
    multiplicity: "OneToMany"
- name: "State"
  description: "Named status within a state machine."
  data:
  - name: "name"
    type: "String"
  - name: "terminal"
    type: "Boolean"
  relations:
  - name: "stateMachine"
    type: "StateMachineDefinition"
    multiplicity: "ManyToOne"
- name: "StateTransition"
  description: "Allowed movement between states, typically driven by an event."
  data:
  - name: "name"
    type: "String"
  - name: "from"
    type: "String"
  - name: "to"
    type: "String"
  - name: "triggerEvent"
    type: "String"
  relations:
  - name: "stateMachine"
    type: "StateMachineDefinition"
    multiplicity: "ManyToOne"
- name: "SLAAgreement"
  description: "Service level objective with thresholds and policies for breach management."
  data:
  - name: "name"
    type: "String"
  - name: "severity"
    type: "SLASeverity"
  - name: "threshold"
    type: "Duration"
  - name: "reminderBefore"
    type: "Duration"
  relations:
  - name: "taskDefinitions"
    type: "TaskDefinition"
    multiplicity: "ManyToMany"
  - name: "escalationRules"
    type: "EscalationRule"
    multiplicity: "OneToMany"
- name: "EscalationRule"
  description: "Actionable rule that triggers when SLA conditions or timeouts occur."
  data:
  - name: "name"
    type: "String"
  - name: "triggerAfter"
    type: "Duration"
  - name: "action"
    type: "EscalationAction"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "slaAgreement"
    type: "SLAAgreement"
    multiplicity: "ManyToOne"
  - name: "notifyChannels"
    type: "NotificationChannelPolicy"
    multiplicity: "ManyToMany"
  - name: "targetRole"
    type: "Role"
    multiplicity: "ManyToOne"
  - name: "targetUser"
    type: "User"
    multiplicity: "ManyToOne"
- name: "NotificationTemplate"
  description: "Reusable message structure for alerts and escalations."
  data:
  - name: "name"
    type: "String"
  - name: "subjectTemplate"
    type: "String"
  - name: "bodyTemplate"
    type: "String"
  - name: "channel"
    type: "NotificationChannel"
  relations:
  - name: "policies"
    type: "NotificationChannelPolicy"
    multiplicity: "OneToMany"
- name: "NotificationChannelPolicy"
  description: "Delivery policy governing channels, templates, and subscribers."
  data:
  - name: "name"
    type: "String"
  - name: "channel"
    type: "NotificationChannel"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "template"
    type: "NotificationTemplate"
    multiplicity: "ManyToOne"
  - name: "escalationRules"
    type: "EscalationRule"
    multiplicity: "ManyToMany"
  - name: "subscribers"
    type: "User"
    multiplicity: "ManyToMany"
- name: "Schedule"
  description: "Reusable timing construct for initiating workflows and timers."
  data:
  - name: "name"
    type: "String"
  - name: "recurrenceType"
    type: "RecurrenceType"
  - name: "cron"
    type: "CronExpression"
  - name: "startDate"
    type: "DateTime"
  - name: "endDate"
    type: "DateTime"
  - name: "status"
    type: "ScheduleStatus"
  relations:
  - name: "triggers"
    type: "TimerTrigger"
    multiplicity: "OneToMany"
- name: "Calendar"
  description: "Time awareness model for business hours, holidays, and blackout windows."
  data:
  - name: "name"
    type: "String"
  - name: "calendarType"
    type: "CalendarType"
  - name: "timezone"
    type: "String"
  relations:
  - name: "schedules"
    type: "Schedule"
    multiplicity: "OneToMany"
- name: "TimerTrigger"
  description: "Timer-based event that initiates or advances workflow execution."
  data:
  - name: "name"
    type: "String"
  - name: "fireAt"
    type: "DateTime"
  - name: "repeatInterval"
    type: "Duration"
  - name: "maxOccurrences"
    type: "Integer"
  relations:
  - name: "schedule"
    type: "Schedule"
    multiplicity: "ManyToOne"
  - name: "processDefinition"
    type: "ProcessDefinition"
    multiplicity: "ManyToOne"
  - name: "taskDefinition"
    type: "TaskDefinition"
    multiplicity: "ManyToOne"
- name: "DataMapping"
  description: "Declarative mapping between task or process variables."
  data:
  - name: "name"
    type: "String"
  - name: "mappingJson"
    type: "JsonDocument"
  - name: "direction"
    type: "MappingDirection"
  relations:
  - name: "sourceTask"
    type: "TaskDefinition"
    multiplicity: "ManyToOne"
  - name: "targetTask"
    type: "TaskDefinition"
    multiplicity: "ManyToOne"
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
- name: "CaseType"
  description: "Definition of case-managed work with states and associated workflows."
  data:
  - name: "name"
    type: "String"
  - name: "defaultPriority"
    type: "Priority"
  relations:
  - name: "workflows"
    type: "ProcessDefinition"
    multiplicity: "ManyToMany"
  - name: "stateMachine"
    type: "StateMachineDefinition"
    multiplicity: "ManyToOne"
- name: "Case"
  description: "Long-running, context-rich thread of work managed through states."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "CaseStatus"
  - name: "openedAt"
    type: "DateTime"
  - name: "closedAt"
    type: "DateTime"
  relations:
  - name: "caseType"
    type: "CaseType"
    multiplicity: "ManyToOne"
  - name: "primaryProcess"
    type: "ProcessInstance"
    multiplicity: "ManyToOne"
  - name: "relatedProcesses"
    type: "ProcessInstance"
    multiplicity: "OneToMany"
  - name: "assignee"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "watchers"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "variables"
    type: "ProcessVariable"
    multiplicity: "OneToMany"
- name: "ProcessInstance"
  description: "Runtime execution of a process version with its own data and history."
  data:
  - name: "businessKey"
    type: "BusinessKey"
  - name: "startTime"
    type: "DateTime"
  - name: "endTime"
    type: "DateTime"
  - name: "status"
    type: "InstanceStatus"
  - name: "priority"
    type: "Priority"
  relations:
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
  - name: "variables"
    type: "ProcessVariable"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "TaskInstance"
    multiplicity: "OneToMany"
  - name: "events"
    type: "WorkflowEvent"
    multiplicity: "OneToMany"
  - name: "parentInstance"
    type: "ProcessInstance"
    multiplicity: "ManyToOne"
- name: "ProcessVariable"
  description: "Scoped runtime data element associated with a process or task instance."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "value"
    type: "String"
  - name: "scope"
    type: "VariableScope"
  relations:
  - name: "processInstance"
    type: "ProcessInstance"
    multiplicity: "ManyToOne"
  - name: "taskInstance"
    type: "TaskInstance"
    multiplicity: "ManyToOne"
- name: "TaskInstance"
  description: "Executable occurrence of a task within a process instance."
  data:
  - name: "name"
    type: "String"
  - name: "taskType"
    type: "TaskType"
  - name: "status"
    type: "TaskStatus_"
  - name: "dueDate"
    type: "DateTime"
  - name: "assignedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  relations:
  - name: "processInstance"
    type: "ProcessInstance"
    multiplicity: "ManyToOne"
  - name: "definition"
    type: "TaskDefinition"
    multiplicity: "ManyToOne"
  - name: "assignee"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "candidateRoles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "approvals"
    type: "ApprovalRequest"
    multiplicity: "OneToMany"
  - name: "workQueue"
    type: "WorkQueue"
    multiplicity: "ManyToOne"
- name: "ApprovalPolicy"
  description: "Rule controlling how approvals are collected and evaluated."
  data:
  - name: "name"
    type: "String"
  - name: "requiredApprovals"
    type: "Integer"
  - name: "allowAbstain"
    type: "Boolean"
  - name: "autoApproveIfSingle"
    type: "Boolean"
  relations:
  - name: "applicableTasks"
    type: "TaskDefinition"
    multiplicity: "ManyToMany"
- name: "ApprovalRequest"
  description: "Request for one or more approvers to decide on a task."
  data:
  - name: "requestedAt"
    type: "DateTime"
  - name: "status"
    type: "ApprovalStatus"
  relations:
  - name: "taskInstance"
    type: "TaskInstance"
    multiplicity: "ManyToOne"
  - name: "approvers"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "decisions"
    type: "ApprovalDecision"
    multiplicity: "OneToMany"
  - name: "policy"
    type: "ApprovalPolicy"
    multiplicity: "ManyToOne"
- name: "ApprovalDecision"
  description: "Individual approver decision captured for an approval request."
  data:
  - name: "decidedAt"
    type: "DateTime"
  - name: "outcome"
    type: "ApprovalOutcome"
  - name: "comment"
    type: "String"
  relations:
  - name: "approvalRequest"
    type: "ApprovalRequest"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "User"
    multiplicity: "ManyToOne"
- name: "EventDefinition"
  description: "Declarative description of an event that can start or influence workflows."
  data:
  - name: "name"
    type: "String"
  - name: "eventType"
    type: "EventType"
  - name: "payloadSchema"
    type: "JsonDocument"
  relations:
  - name: "processVersion"
    type: "ProcessVersion"
    multiplicity: "ManyToOne"
- name: "EventSubscription"
  description: "Runtime linkage between an event definition and a process instance."
  data:
  - name: "active"
    type: "Boolean"
  - name: "filterExpression"
    type: "Expression"
  relations:
  - name: "eventDefinition"
    type: "EventDefinition"
    multiplicity: "ManyToOne"
  - name: "processInstance"
    type: "ProcessInstance"
    multiplicity: "ManyToOne"
- name: "WorkflowEvent"
  description: "Immutable audit event produced during workflow execution."
  data:
  - name: "occurredAt"
    type: "DateTime"
  - name: "eventType"
    type: "AuditEventType"
  - name: "message"
    type: "String"
  relations:
  - name: "processInstance"
    type: "ProcessInstance"
    multiplicity: "ManyToOne"
- name: "WorkQueue"
  description: "Routable collection that receives and buffers tasks for pull or push\
    \ execution."
  data:
  - name: "name"
    type: "String"
  - name: "queueType"
    type: "WorkQueueType"
  - name: "maxConcurrency"
    type: "Integer"
  relations:
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "taskInstances"
    type: "TaskInstance"
    multiplicity: "OneToMany"
enums:
- name: "ProcessStatus"
  description: "Lifecycle state of process definitions and versions."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Suspended"
  - name: "Retired"
  - name: "Archived"
- name: "InstanceStatus"
  description: "Execution status of a process instance."
  data:
  - name: "Pending"
  - name: "Running"
  - name: "Suspended"
  - name: "Completed"
  - name: "Cancelled"
  - name: "Failed"
- name: "TaskType"
  description: "Classification of the work performed by a task."
  data:
  - name: "User"
  - name: "Service"
  - name: "Script"
  - name: "Manual"
  - name: "Receive"
  - name: "Send"
  - name: "SubProcess"
- name: "TaskStatus_"
  description: "Runtime status for a task instance."
  data:
  - name: "Created"
  - name: "Ready"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
  - name: "Failed"
  - name: "TimedOut"
- name: "AssignmentStrategy"
  description: "Routing mechanism that determines how tasks are assigned."
  data:
  - name: "ByUser"
  - name: "ByRole"
  - name: "RoundRobin"
  - name: "LoadBalanced"
  - name: "CandidateGroup"
- name: "Priority"
  description: "Relative urgency applied to tasks and process instances."
  data:
  - name: "Low"
  - name: "Normal"
  - name: "High"
  - name: "Urgent"
- name: "ApprovalOutcome"
  description: "Possible results of an approver's decision."
  data:
  - name: "Approved"
  - name: "Rejected"
  - name: "Abstained"
  - name: "Reassigned"
  - name: "Escalated"
- name: "ApprovalStatus"
  description: "Aggregated status of an approval request."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
  - name: "Escalated"
  - name: "Withdrawn"
- name: "GatewayType"
  description: "Behavioral type for a gateway node."
  data:
  - name: "Exclusive"
  - name: "Parallel"
  - name: "Inclusive"
  - name: "EventBased"
- name: "DecisionHitPolicy"
  description: "Strategy determining how decision table rules produce outcomes."
  data:
  - name: "First"
  - name: "Unique"
  - name: "Priority"
  - name: "Collect"
- name: "RuleEffectType"
  description: "Action taken when a rule condition evaluates to true."
  data:
  - name: "SetVariable"
  - name: "InvokeEndpoint"
  - name: "ScheduleTask"
  - name: "RaiseEvent"
  - name: "Route"
- name: "EventType"
  description: "Classification of events that can be consumed or produced."
  data:
  - name: "Message"
  - name: "Timer"
  - name: "Signal"
  - name: "Error"
  - name: "Escalation"
- name: "CalendarType"
  description: "Type of time calendar used for scheduling and SLAs."
  data:
  - name: "Business"
  - name: "Holiday"
  - name: "Maintenance"
  - name: "Personal"
- name: "RecurrenceType"
  description: "High-level recurrence pattern for schedules."
  data:
  - name: "Cron"
  - name: "Interval"
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
- name: "DataType"
  description: "Primitive data type for variable definitions and values."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
