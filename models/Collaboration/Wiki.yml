---
metadata:
  name: "HCIDL Wiki Capabilities Model"
  description: "Canonical capabilities model for a collaborative wiki knowledge platform,\
    \ capturing content authoring, organization, access control, discussion, and notification\
    \ behaviors."
  version: "1.0.0"
  industry: "Software"
  category: "Collaboration"
  type: "Capability"
  domain: "Wiki"
entities:
- name: "WikiSite"
  description: "Root container representing a single wiki instance within an organization."
  data:
  - name: "name"
    type: "String"
  - name: "baseUrl"
    type: "String"
  - name: "defaultLocale"
    type: "Locale"
  - name: "defaultTimezone"
    type: "Timezone"
  - name: "visibility"
    type: "VisibilityScope"
  relations:
  - name: "namespaces"
    type: "Namespace"
    multiplicity: "OneToMany"
  - name: "pages"
    type: "Page"
    multiplicity: "OneToMany"
  - name: "templates"
    type: "Template"
    multiplicity: "OneToMany"
  - name: "categories"
    type: "Category"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "Group"
    multiplicity: "OneToMany"
  - name: "members"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "permissionGrants"
    type: "PermissionGrant"
    multiplicity: "OneToMany"
  - name: "interwikiMappings"
    type: "InterwikiMapping"
    multiplicity: "OneToMany"
- name: "Namespace"
  description: "Logical partition used to organize pages within a site."
  data:
  - name: "name"
    type: "String"
  - name: "key"
    type: "Slug"
  - name: "descriptionText"
    type: "String"
  - name: "visibility"
    type: "VisibilityScope"
  relations:
  - name: "site"
    type: "WikiSite"
    multiplicity: "ManyToOne"
  - name: "pages"
    type: "Page"
    multiplicity: "OneToMany"
  - name: "templates"
    type: "Template"
    multiplicity: "OneToMany"
  - name: "managers"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "permissionGrants"
    type: "PermissionGrant"
    multiplicity: "OneToMany"
- name: "Page"
  description: "Primary content unit containing text, media, links, and metadata."
  data:
  - name: "title"
    type: "PageTitle"
  - name: "slug"
    type: "Slug"
  - name: "path"
    type: "PagePath"
  - name: "status"
    type: "PageStatus"
  - name: "contentFormat"
    type: "ContentFormat"
  - name: "protectionLevel"
    type: "PageProtectionLevel"
  - name: "createdDate"
    type: "Date"
  - name: "updatedDate"
    type: "Date"
  relations:
  - name: "namespace"
    type: "Namespace"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "currentRevision"
    type: "Revision"
    multiplicity: "OneToOne"
  - name: "revisions"
    type: "Revision"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "categories"
    type: "Category"
    multiplicity: "ManyToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "links"
    type: "Link"
    multiplicity: "OneToMany"
  - name: "redirect"
    type: "Redirect"
    multiplicity: "OneToOne"
  - name: "properties"
    type: "PageProperty"
    multiplicity: "OneToMany"
  - name: "discussions"
    type: "DiscussionThread"
    multiplicity: "OneToMany"
- name: "Revision"
  description: "Immutable snapshot capturing a change to a page."
  data:
  - name: "revisionNumber"
    type: "Integer"
  - name: "versionLabel"
    type: "VersionLabel"
  - name: "action"
    type: "RevisionAction"
  - name: "message"
    type: "String"
  - name: "scope"
    type: "ChangeScope"
  - name: "content"
    type: "ContentBody"
  - name: "contentFormat"
    type: "ContentFormat"
  - name: "createdDate"
    type: "Date"
  relations:
  - name: "page"
    type: "Page"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "previousRevision"
    type: "Revision"
    multiplicity: "ManyToOne"
- name: "Attachment"
  description: "File associated with a page, such as an image or document."
  data:
  - name: "fileName"
    type: "String"
  - name: "mediaType"
    type: "MediaType"
  - name: "fileSize"
    type: "FileSize"
  - name: "checksum"
    type: "Checksum"
  - name: "uploadedDate"
    type: "Date"
  relations:
  - name: "page"
    type: "Page"
    multiplicity: "ManyToOne"
  - name: "uploader"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Category"
  description: "Curated grouping used to classify related pages."
  data:
  - name: "name"
    type: "String"
  - name: "slug"
    type: "Slug"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "site"
    type: "WikiSite"
    multiplicity: "ManyToOne"
  - name: "pages"
    type: "Page"
    multiplicity: "ManyToMany"
- name: "Tag"
  description: "Free-form label applied to pages for lightweight organization."
  data:
  - name: "name"
    type: "String"
  - name: "slug"
    type: "Slug"
  relations:
  - name: "site"
    type: "WikiSite"
    multiplicity: "ManyToOne"
  - name: "pages"
    type: "Page"
    multiplicity: "ManyToMany"
- name: "Template"
  description: "Reusable content pattern for creating consistent pages."
  data:
  - name: "name"
    type: "String"
  - name: "templateType"
    type: "TemplateType"
  - name: "content"
    type: "ContentBody"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "site"
    type: "WikiSite"
    multiplicity: "ManyToOne"
  - name: "namespace"
    type: "Namespace"
    multiplicity: "ManyToOne"
  - name: "pages"
    type: "Page"
    multiplicity: "ManyToMany"
- name: "User"
  description: "Individual who can read, author, and manage wiki content."
  data:
  - name: "username"
    type: "Username"
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "locale"
    type: "Locale"
  - name: "timezone"
    type: "Timezone"
  - name: "status"
    type: "UserStatus"
  relations:
  - name: "sites"
    type: "WikiSite"
    multiplicity: "ManyToMany"
  - name: "groups"
    type: "Group"
    multiplicity: "ManyToMany"
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "pagesAuthored"
    type: "Page"
    multiplicity: "OneToMany"
  - name: "revisions"
    type: "Revision"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
- name: "Group"
  description: "Collection of users for managing access and collaboration at scale."
  data:
  - name: "name"
    type: "String"
  - name: "groupType"
    type: "GroupType"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "site"
    type: "WikiSite"
    multiplicity: "ManyToOne"
  - name: "members"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
- name: "Role"
  description: "Named bundle of permissions assignable to users and groups."
  data:
  - name: "name"
    type: "String"
  - name: "roleType"
    type: "UserRole"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "permissions"
    type: "Permission"
    multiplicity: "ManyToMany"
  - name: "groups"
    type: "Group"
    multiplicity: "ManyToMany"
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
- name: "Permission"
  description: "Atomic capability that governs what operations are allowed."
  data:
  - name: "name"
    type: "String"
  - name: "permissionType"
    type: "PermissionType"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
- name: "PermissionGrant"
  description: "Assignment of a role within a specific scope to a user or group."
  data:
  - name: "scopeType"
    type: "AccessScopeType"
  - name: "note"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  relations:
  - name: "site"
    type: "WikiSite"
    multiplicity: "ManyToOne"
  - name: "namespace"
    type: "Namespace"
    multiplicity: "ManyToOne"
  - name: "page"
    type: "Page"
    multiplicity: "ManyToOne"
  - name: "role"
    type: "Role"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "group"
    type: "Group"
    multiplicity: "ManyToOne"
- name: "Link"
  description: "Relationship from a source page to an internal or external target."
  data:
  - name: "linkType"
    type: "LinkType"
  - name: "targetUrl"
    type: "URL"
  - name: "anchorText"
    type: "String"
  relations:
  - name: "sourcePage"
    type: "Page"
    multiplicity: "ManyToOne"
  - name: "targetPage"
    type: "Page"
    multiplicity: "ManyToOne"
- name: "Redirect"
  description: "Mapping that forwards a page to another page or external URL."
  data:
  - name: "redirectType"
    type: "RedirectType"
  - name: "targetUrl"
    type: "URL"
  relations:
  - name: "sourcePage"
    type: "Page"
    multiplicity: "OneToOne"
  - name: "targetPage"
    type: "Page"
    multiplicity: "ManyToOne"
- name: "PageProperty"
  description: "Key-value metadata associated with a page."
  data:
  - name: "key"
    type: "String"
  - name: "value"
    type: "String"
  - name: "propertyType"
    type: "PropertyType"
  relations:
  - name: "page"
    type: "Page"
    multiplicity: "ManyToOne"
- name: "DiscussionThread"
  description: "Top-level conversation attached to a page."
  data:
  - name: "subject"
    type: "String"
  - name: "status"
    type: "ThreadStatus"
  - name: "createdDate"
    type: "Date"
  relations:
  - name: "page"
    type: "Page"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
- name: "Comment"
  description: "Message within a discussion thread, optionally replying to another\
    \ comment."
  data:
  - name: "content"
    type: "ContentBody"
  - name: "status"
    type: "CommentStatus"
  - name: "createdDate"
    type: "Date"
  relations:
  - name: "thread"
    type: "DiscussionThread"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "parentComment"
    type: "Comment"
    multiplicity: "ManyToOne"
- name: "Subscription"
  description: "User preference to receive notifications about changes within a scope."
  data:
  - name: "level"
    type: "SubscriptionLevel"
  - name: "channel"
    type: "NotificationChannel"
  - name: "createdDate"
    type: "Date"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "WikiSite"
    multiplicity: "ManyToOne"
  - name: "namespace"
    type: "Namespace"
    multiplicity: "ManyToOne"
  - name: "page"
    type: "Page"
    multiplicity: "ManyToOne"
- name: "InterwikiMapping"
  description: "Prefix rule that expands short links to external wikis."
  data:
  - name: "prefix"
    type: "String"
  - name: "targetUrlPattern"
    type: "String"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "site"
    type: "WikiSite"
    multiplicity: "ManyToOne"
enums:
- name: "VisibilityScope"
  description: "Access exposure for content or containers."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Private"
- name: "PageStatus"
  description: "Lifecycle state of a page."
  data:
  - name: "Draft"
  - name: "Published"
  - name: "Archived"
- name: "ContentFormat"
  description: "Markup language used for page content and revisions."
  data:
  - name: "Wikitext"
  - name: "Markdown"
  - name: "HTML"
  - name: "PlainText"
- name: "PageProtectionLevel"
  description: "Restriction level controlling who may edit or move a page."
  data:
  - name: "None"
  - name: "SemiProtected"
  - name: "FullyProtected"
- name: "RevisionAction"
  description: "Type of change captured by a revision."
  data:
  - name: "Create"
  - name: "Edit"
  - name: "Move"
  - name: "Rename"
  - name: "Revert"
  - name: "Delete"
- name: "ChangeScope"
  description: "Impact level of a change for notification and history purposes."
  data:
  - name: "Minor"
  - name: "Major"
- name: "MediaType"
  description: "General classification of an attachment file."
  data:
  - name: "Document"
  - name: "Image"
  - name: "Video"
  - name: "Audio"
  - name: "Archive"
  - name: "Spreadsheet"
  - name: "Presentation"
  - name: "Other"
- name: "UserStatus"
  description: "Current state of a user account."
  data:
  - name: "Active"
  - name: "Disabled"
  - name: "Invited"
- name: "GroupType"
  description: "Purpose-oriented classification of a group."
  data:
  - name: "Team"
  - name: "Project"
  - name: "System"
- name: "UserRole"
  description: "Canonical role tiers used across the wiki."
  data:
  - name: "Viewer"
  - name: "Author"
  - name: "Editor"
  - name: "Moderator"
  - name: "Administrator"
- name: "PermissionType"
  description: "Discrete operations that can be granted to principals."
  data:
  - name: "Read"
  - name: "Edit"
  - name: "Move"
  - name: "Delete"
  - name: "Protect"
  - name: "Comment"
  - name: "Moderate"
  - name: "Upload"
  - name: "ManageTemplates"
  - name: "ManageCategories"
  - name: "ManageUsers"
  - name: "AdministerSite"
- name: "AccessScopeType"
  description: "Level at which a permission or role applies."
  data:
  - name: "Site"
  - name: "Namespace"
  - name: "Page"
- name: "LinkType"
  description: "Classification of a hyperlink associated with a page."
  data:
  - name: "Internal"
  - name: "External"
  - name: "Interwiki"
  - name: "File"
  - name: "Category"
- name: "RedirectType"
  description: "Semantics of a redirect for clients and caches."
  data:
  - name: "Permanent"
  - name: "Temporary"
- name: "PropertyType"
  description: "Datatype of a page property value."
  data:
  - name: "String"
  - name: "Number"
  - name: "Date"
  - name: "Boolean"
  - name: "URL"
- name: "ThreadStatus"
  description: "State of a discussion thread attached to a page."
  data:
  - name: "Open"
  - name: "Resolved"
  - name: "Archived"
  - name: "Locked"
- name: "CommentStatus"
  description: "Visibility and moderation state of a comment."
  data:
  - name: "Visible"
  - name: "Hidden"
  - name: "Deleted"
- name: "SubscriptionLevel"
  description: "Preferred granularity of updates a user wishes to receive."
  data:
  - name: "AllChanges"
  - name: "MajorChanges"
  - name: "Mentions"
  - name: "Replies"
  - name: "None"
- name: "NotificationChannel"
  description: "Delivery mechanism for sending notifications to users."
  data:
  - name: "Email"
  - name: "InApp"
  - name: "WebPush"
  - name: "Webhook"
- name: "TemplateType"
  description: "Intended use case of a template."
  data:
  - name: "Page"
  - name: "Infobox"
  - name: "Snippet"
  - name: "Macro"
  - name: "Layout"
valueObjects:
- name: "Slug"
  description: "URL-safe short identifier derived from a name or title."
  data:
  - name: "value"
    type: "String"
- name: "PageTitle"
  description: "Human-readable title of a page."
  data:
  - name: "value"
    type: "String"
- name: "PagePath"
  description: "Hierarchical locator of a page within a namespace or site."
  data:
  - name: "value"
    type: "String"
- name: "Username"
  description: "Unique login name selected by a user."
  data:
  - name: "value"
    type: "String"
- name: "EmailAddress"
  description: "Electronic mail address for contacting a user."
  data:
  - name: "value"
    type: "String"
- name: "Locale"
  description: "IETF language tag representing language and region preferences."
  data:
  - name: "code"
    type: "String"
- name: "Timezone"
  description: "IANA time zone identifier used for date and time presentation."
  data:
  - name: "id"
    type: "String"
- name: "ContentBody"
  description: "Raw textual content stored for a page or revision."
  data:
  - name: "text"
    type: "String"
- name: "VersionLabel"
  description: "Human-friendly label associated with a specific revision."
  data:
  - name: "value"
    type: "String"
- name: "FileSize"
  description: "Size of a file including its unit of measure."
  data:
  - name: "amount"
    type: "Integer"
  - name: "unit"
    type: "String"
- name: "Checksum"
  description: "Digest used to verify file integrity."
  data:
  - name: "value"
    type: "String"
  - name: "algorithm"
    type: "String"
- name: "URL"
  description: "Absolute or relative resource location."
  data:
  - name: "value"
    type: "String"
