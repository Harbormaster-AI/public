---
metadata:
  name: "HCIDL Resource Planning Capabilities Model"
  description: "A canonical capabilities model for planning, allocating, and optimizing\
    \ resources across collaborative initiatives, projects, and teams."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Collaboration"
  type: "Capability"
  domain: "Resource Planning"
entities:
- name: "Organization"
  description: "Enterprise or department that governs resource planning policies,\
    \ data, and standards."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "timezone"
    type: "String"
  relations:
  - name: "resourcePools"
    type: "ResourcePool"
    multiplicity: "OneToMany"
  - name: "costCenters"
    type: "CostCenter"
    multiplicity: "OneToMany"
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "holidayCalendars"
    type: "HolidayCalendar"
    multiplicity: "OneToMany"
- name: "ResourcePool"
  description: "Logical grouping of resources for planning purposes based on function,\
    \ location, or service."
  data:
  - name: "name"
    type: "String"
  - name: "poolType"
    type: "PoolType"
  - name: "defaultBookingType"
    type: "BookingType"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "resources"
    type: "Resource"
    multiplicity: "OneToMany"
  - name: "managers"
    type: "Resource"
    multiplicity: "ManyToMany"
  - name: "calendars"
    type: "ResourceCalendar"
    multiplicity: "OneToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "OneToMany"
- name: "Resource"
  description: "Allocatable unit of capacity such as an individual, equipment, or\
    \ facility."
  data:
  - name: "name"
    type: "String"
  - name: "resourceType"
    type: "ResourceType"
  - name: "employmentType"
    type: "EmploymentType"
  - name: "contactEmail"
    type: "EmailAddress"
  - name: "costRate"
    type: "Money"
  - name: "billRate"
    type: "Money"
  relations:
  - name: "resourcePool"
    type: "ResourcePool"
    multiplicity: "ManyToOne"
  - name: "skills"
    type: "Skill"
    multiplicity: "ManyToMany"
  - name: "calendar"
    type: "ResourceCalendar"
    multiplicity: "OneToOne"
  - name: "costCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "assignments"
    type: "ResourceAssignment"
    multiplicity: "OneToMany"
  - name: "timeOffRequests"
    type: "TimeOffRequest"
    multiplicity: "OneToMany"
  - name: "timesheets"
    type: "Timesheet"
    multiplicity: "OneToMany"
  - name: "manager"
    type: "Resource"
    multiplicity: "ManyToOne"
- name: "Skill"
  description: "Competency or technology used to match resource supply with demand."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "String"
  relations:
  - name: "resources"
    type: "Resource"
    multiplicity: "ManyToMany"
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
- name: "Role"
  description: "Standardized capability profile used for planning, costing, and staffing."
  data:
  - name: "name"
    type: "String"
  - name: "discipline"
    type: "String"
  - name: "seniorityLevel"
    type: "SeniorityLevel"
  relations:
  - name: "skills"
    type: "Skill"
    multiplicity: "ManyToMany"
  - name: "rateCardLines"
    type: "RateCardLine"
    multiplicity: "OneToMany"
  - name: "demands"
    type: "ResourceDemand"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "ResourceAssignment"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "WorkTask"
    multiplicity: "OneToMany"
- name: "RateCard"
  description: "Catalog of cost and bill rates by role over a specified effective\
    \ period."
  data:
  - name: "name"
    type: "String"
  - name: "effectivePeriod"
    type: "DateRange"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "RateCardLine"
    multiplicity: "OneToMany"
- name: "RateCardLine"
  description: "Role-specific rate definition within a rate card."
  data:
  - name: "rate"
    type: "Money"
  - name: "unit"
    type: "TimeUnit"
  relations:
  - name: "rateCard"
    type: "RateCard"
    multiplicity: "ManyToOne"
  - name: "role"
    type: "Role"
    multiplicity: "ManyToOne"
- name: "ResourceCalendar"
  description: "Working time calendar defining availability patterns and exceptions\
    \ for resources or pools."
  data:
  - name: "name"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "basePattern"
    type: "WorkingPattern"
  relations:
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "resourcePool"
    type: "ResourcePool"
    multiplicity: "ManyToOne"
  - name: "exceptions"
    type: "CalendarException"
    multiplicity: "OneToMany"
  - name: "holidayCalendar"
    type: "HolidayCalendar"
    multiplicity: "ManyToOne"
- name: "CalendarException"
  description: "Non-standard working time or time-off entry applied to a calendar."
  data:
  - name: "name"
    type: "String"
  - name: "exceptionType"
    type: "CalendarExceptionType"
  - name: "period"
    type: "DateRange"
  - name: "isWorking"
    type: "Boolean"
  relations:
  - name: "calendar"
    type: "ResourceCalendar"
    multiplicity: "ManyToOne"
- name: "HolidayCalendar"
  description: "Regional or organizational set of statutory non-working days."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "dates"
    type: "Holiday"
    multiplicity: "OneToMany"
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "Holiday"
  description: "Specific holiday date entry within a holiday calendar."
  data:
  - name: "date"
    type: "Date"
  - name: "name"
    type: "String"
  relations:
  - name: "holidayCalendar"
    type: "HolidayCalendar"
    multiplicity: "ManyToOne"
- name: "Team"
  description: "Cross-functional group of resources planned as a unit."
  data:
  - name: "name"
    type: "String"
  - name: "teamType"
    type: "TeamType"
  - name: "velocity"
    type: "Decimal"
  relations:
  - name: "members"
    type: "Resource"
    multiplicity: "ManyToMany"
  - name: "resourcePool"
    type: "ResourcePool"
    multiplicity: "ManyToOne"
  - name: "projects"
    type: "Project"
    multiplicity: "ManyToMany"
  - name: "calendar"
    type: "ResourceCalendar"
    multiplicity: "ManyToOne"
  - name: "capacityPlans"
    type: "CapacityPlan"
    multiplicity: "OneToMany"
- name: "Project"
  description: "Planned initiative that consumes resource capacity to deliver outcomes."
  data:
  - name: "name"
    type: "String"
  - name: "projectType"
    type: "ProjectType"
  - name: "priority"
    type: "Priority"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "ProjectStatus"
  relations:
  - name: "sponsor"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "manager"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "workPlans"
    type: "WorkPlan"
    multiplicity: "OneToMany"
  - name: "demands"
    type: "ResourceDemand"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "ResourceAssignment"
    multiplicity: "OneToMany"
  - name: "costCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "timesheets"
    type: "Timesheet"
    multiplicity: "OneToMany"
- name: "WorkPlan"
  description: "Time-phased aggregation of tasks and estimates for a project."
  data:
  - name: "name"
    type: "String"
  - name: "planningHorizon"
    type: "DateRange"
  - name: "estimationMethod"
    type: "EstimationMethod"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "WorkTask"
    multiplicity: "OneToMany"
- name: "WorkTask"
  description: "Plannable unit of work that drives resource demand and assignment."
  data:
  - name: "name"
    type: "String"
  - name: "estimatedEffortHours"
    type: "Decimal"
  - name: "taskType"
    type: "TaskType"
  - name: "priority"
    type: "Priority"
  - name: "targetWindow"
    type: "DateRange"
  relations:
  - name: "workPlan"
    type: "WorkPlan"
    multiplicity: "ManyToOne"
  - name: "role"
    type: "Role"
    multiplicity: "ManyToOne"
  - name: "demand"
    type: "ResourceDemand"
    multiplicity: "ManyToOne"
  - name: "assignments"
    type: "ResourceAssignment"
    multiplicity: "OneToMany"
  - name: "predecessorTasks"
    type: "WorkTask"
    multiplicity: "ManyToMany"
- name: "ResourceDemand"
  description: "Request for capacity by role and skill for a project or task within\
    \ a date range."
  data:
  - name: "requestName"
    type: "String"
  - name: "quantity"
    type: "Integer"
  - name: "effortPerResourceHours"
    type: "Decimal"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "DemandStatus"
  - name: "priority"
    type: "Priority"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "WorkTask"
    multiplicity: "ManyToOne"
  - name: "role"
    type: "Role"
    multiplicity: "ManyToOne"
  - name: "skills"
    type: "Skill"
    multiplicity: "ManyToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "ResourceAssignment"
    multiplicity: "OneToMany"
- name: "Approval"
  description: "Decision record capturing review and authorization outcomes for planning\
    \ actions."
  data:
  - name: "status"
    type: "ApprovalStatus"
  - name: "decisionDate"
    type: "Date"
  - name: "comment"
    type: "String"
  relations:
  - name: "approver"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "demand"
    type: "ResourceDemand"
    multiplicity: "ManyToOne"
  - name: "assignment"
    type: "ResourceAssignment"
    multiplicity: "ManyToOne"
  - name: "timeOffRequest"
    type: "TimeOffRequest"
    multiplicity: "ManyToOne"
- name: "ResourceAssignment"
  description: "Confirmed commitment of a resource to a project or task over a period\
    \ with a defined allocation."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "allocationPercent"
    type: "Percentage"
  - name: "status"
    type: "AllocationStatus"
  relations:
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "WorkTask"
    multiplicity: "ManyToOne"
  - name: "demand"
    type: "ResourceDemand"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "ScenarioPlan"
  description: "Hypothetical allocation scenario used to explore planning alternatives."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "ScenarioStatus"
  - name: "horizon"
    type: "DateRange"
  - name: "notes"
    type: "String"
  relations:
  - name: "allocations"
    type: "ScenarioAllocation"
    multiplicity: "OneToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "ManyToMany"
  - name: "resources"
    type: "Resource"
    multiplicity: "ManyToMany"
- name: "ScenarioAllocation"
  description: "Tentative booking of a resource within a scenario for what-if analysis."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "allocationPercent"
    type: "Percentage"
  - name: "bookingType"
    type: "BookingType"
  relations:
  - name: "scenarioPlan"
    type: "ScenarioPlan"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "WorkTask"
    multiplicity: "ManyToOne"
  - name: "demand"
    type: "ResourceDemand"
    multiplicity: "ManyToOne"
- name: "Timesheet"
  description: "Record of actual hours worked by a resource over a reporting period."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "totalHours"
    type: "Decimal"
  - name: "submissionStatus"
    type: "ApprovalStatus"
  relations:
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "entries"
    type: "TimesheetEntry"
    multiplicity: "OneToMany"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
- name: "TimesheetEntry"
  description: "Detailed time entry against a project or task, including billable\
    \ classification."
  data:
  - name: "workDate"
    type: "Date"
  - name: "hours"
    type: "Decimal"
  - name: "entryType"
    type: "TimesheetEntryType"
  - name: "notes"
    type: "String"
  relations:
  - name: "timesheet"
    type: "Timesheet"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "WorkTask"
    multiplicity: "ManyToOne"
  - name: "role"
    type: "Role"
    multiplicity: "ManyToOne"
- name: "CapacityPlan"
  description: "Time-phased view of available capacity and utilization for a resource,\
    \ team, or pool."
  data:
  - name: "name"
    type: "String"
  - name: "horizon"
    type: "DateRange"
  - name: "granularity"
    type: "TimeUnit"
  - name: "scope"
    type: "ScopeType"
  relations:
  - name: "resourcePool"
    type: "ResourcePool"
    multiplicity: "ManyToOne"
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "snapshots"
    type: "CapacitySnapshot"
    multiplicity: "OneToMany"
- name: "CapacitySnapshot"
  description: "Aggregated capacity metrics for a specific time bucket."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "allocatedHours"
    type: "Decimal"
  - name: "availableHours"
    type: "Decimal"
  - name: "forecastedHours"
    type: "Decimal"
  relations:
  - name: "capacityPlan"
    type: "CapacityPlan"
    multiplicity: "ManyToOne"
- name: "DemandForecast"
  description: "Anticipated resource demand over time by role and initiative."
  data:
  - name: "name"
    type: "String"
  - name: "horizon"
    type: "DateRange"
  - name: "granularity"
    type: "TimeUnit"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "role"
    type: "Role"
    multiplicity: "ManyToOne"
  - name: "snapshots"
    type: "DemandSnapshot"
    multiplicity: "OneToMany"
- name: "DemandSnapshot"
  description: "Time-bucketed demand estimate for hours and headcount."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "requiredHours"
    type: "Decimal"
  - name: "requiredHeadcount"
    type: "Integer"
  relations:
  - name: "forecast"
    type: "DemandForecast"
    multiplicity: "ManyToOne"
- name: "TimeOffRequest"
  description: "Planned absence submitted by a resource for approval and scheduling."
  data:
  - name: "requestType"
    type: "TimeOffType"
  - name: "period"
    type: "DateRange"
  - name: "status"
    type: "ApprovalStatus"
  - name: "comment"
    type: "String"
  relations:
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "calendarException"
    type: "CalendarException"
    multiplicity: "OneToOne"
- name: "Location"
  description: "Physical or virtual place associated with resources and planning context."
  data:
  - name: "name"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "timeZone"
    type: "String"
  - name: "locationType"
    type: "LocationType"
  relations:
  - name: "resources"
    type: "Resource"
    multiplicity: "OneToMany"
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "CostCenter"
  description: "Accounting structure used for budget ownership and cost tracking."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "budget"
    type: "Money"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "resources"
    type: "Resource"
    multiplicity: "OneToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
- name: "Constraint"
  description: "Limitation or rule that impacts how resources can be planned or allocated."
  data:
  - name: "name"
    type: "String"
  - name: "constraintType"
    type: "ConstraintType"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
enums:
- name: "ResourceType"
  description: "Classification of allocatable units for planning."
  data:
  - name: "Person"
  - name: "Equipment"
  - name: "Facility"
  - name: "SoftwareLicense"
  - name: "ServiceAccount"
- name: "EmploymentType"
  description: "Engagement model for a person-type resource."
  data:
  - name: "Employee"
  - name: "Contractor"
  - name: "Vendor"
  - name: "Intern"
  - name: "Temporary"
- name: "PoolType"
  description: "Organizational structure used to group resources."
  data:
  - name: "Functional"
  - name: "ProjectBased"
  - name: "LocationBased"
  - name: "SharedService"
  - name: "CommunityOfPractice"
- name: "BookingType"
  description: "Strength of reservation for planning purposes."
  data:
  - name: "Soft"
  - name: "Hard"
- name: "AllocationStatus"
  description: "Lifecycle of a resource assignment."
  data:
  - name: "Proposed"
  - name: "Confirmed"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
- name: "CalendarExceptionType"
  description: "Reason for deviation from the base working pattern."
  data:
  - name: "Vacation"
  - name: "Holiday"
  - name: "SickLeave"
  - name: "Training"
  - name: "Maintenance"
  - name: "Other"
- name: "TimeOffType"
  description: "Type of planned absence requested by a resource."
  data:
  - name: "Vacation"
  - name: "Sick"
  - name: "ParentalLeave"
  - name: "Bereavement"
  - name: "UnpaidLeave"
  - name: "Training"
- name: "TimesheetEntryType"
  description: "Classification of actual time entry for reporting and billing."
  data:
  - name: "Billable"
  - name: "NonBillable"
  - name: "Overtime"
  - name: "Leave"
- name: "ProjectType"
  description: "Nature of the initiative consuming resources."
  data:
  - name: "NewProduct"
  - name: "Maintenance"
  - name: "Upgrade"
  - name: "Research"
  - name: "Implementation"
- name: "Priority"
  description: "Relative importance guiding allocation decisions."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "ProjectStatus"
  description: "Stage of the project within its lifecycle."
  data:
  - name: "Proposed"
  - name: "Approved"
  - name: "Active"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "EstimationMethod"
  description: "Technique used to estimate effort and capacity."
  data:
  - name: "TopDown"
  - name: "BottomUp"
  - name: "Velocity"
  - name: "Parametric"
- name: "TaskType"
  description: "Category of work influencing required skills and effort."
  data:
  - name: "Feature"
  - name: "Bugfix"
  - name: "Research"
  - name: "Support"
  - name: "Milestone"
- name: "SeniorityLevel"
  description: "Proficiency tier for role definition and costing."
  data:
  - name: "Junior"
  - name: "Mid"
  - name: "Senior"
  - name: "Lead"
  - name: "Principal"
- name: "TimeUnit"
  description: "Time grain used for planning and reporting."
  data:
  - name: "Hour"
  - name: "Day"
  - name: "Week"
  - name: "Month"
  - name: "Quarter"
- name: "ScenarioStatus"
  description: "Lifecycle state of a planning scenario."
  data:
  - name: "Draft"
  - name: "UnderReview"
  - name: "Published"
  - name: "Archived"
- name: "TeamType"
  description: "Structural pattern describing how a team is organized."
  data:
  - name: "Functional"
  - name: "CrossFunctional"
  - name: "ProjectTeam"
  - name: "CenterOfExcellence"
- name: "ScopeType"
  description: "Focus of the capacity plan."
  data:
  - name: "Resource"
  - name: "Team"
  - name: "Pool"
- name: "LocationType"
  description: "Working arrangement associated with a location."
  data:
  - name: "Onsite"
  - name: "Remote"
  - name: "Hybrid"
- name: "ConstraintType"
  description: "Type of limitation affecting planning decisions."
  data:
  - name: "Legal"
  - name: "Budgetary"
  - name: "Skill"
  - name: "Capacity"
  - name: "Schedule"
  - name: "Dependency"
- name: "DemandStatus"
  description: "Lifecycle of a resource demand request."
  data:
  - name: "Draft"
  - name: "Open"
  - name: "Fulfilled"
  - name: "Cancelled"
- name: "ApprovalStatus"
  description: "Decision state for approvals and submissions."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Recalled"
- name: "DayOfWeek"
  description: "Enumerated days used by working patterns and calendars."
  data:
  - name: "Monday"
  - name: "Tuesday"
  - name: "Wednesday"
