---
metadata:
  name: "HCIDL Knowledge Sharing Capabilities Model"
  description: "Canonical capabilities model for collaborative knowledge sharing including\
    \ spaces, knowledge bases, articles, workflows, access control, and engagement."
  version: "1.0.0"
  industry: "Horizontal Collaboration Software"
  category: "Collaboration"
  type: "Capability"
  domain: "Knowledge Sharing"
entities:
- name: "KnowledgeWorkspace"
  description: "Top level collaboration environment that hosts spaces, users, groups,\
    \ and shared policies for knowledge sharing."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "String"
  - name: "defaultLanguage"
    type: "Locale"
  - name: "portalUrl"
    type: "URI"
  relations:
  - name: "spaces"
    type: "Space"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "Group"
    multiplicity: "OneToMany"
  - name: "users"
    type: "User"
    multiplicity: "OneToMany"
  - name: "knowledgePolicies"
    type: "KnowledgePolicy"
    multiplicity: "OneToMany"
- name: "Space"
  description: "Thematic area within a workspace used to organize knowledge bases,\
    \ communities, and curation teams."
  data:
  - name: "name"
    type: "String"
  - name: "slug"
    type: "Slug"
  - name: "summary"
    type: "String"
  - name: "visibility"
    type: "Visibility"
  relations:
  - name: "workspace"
    type: "KnowledgeWorkspace"
    multiplicity: "ManyToOne"
  - name: "knowledgeBases"
    type: "KnowledgeBase"
    multiplicity: "OneToMany"
  - name: "curators"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "followers"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "policies"
    type: "KnowledgePolicy"
    multiplicity: "ManyToMany"
- name: "KnowledgeBase"
  description: "Structured repository within a space that stores articles, categories,\
    \ tags, and templates."
  data:
  - name: "title"
    type: "String"
  - name: "defaultVisibility"
    type: "Visibility"
  - name: "language"
    type: "Locale"
  - name: "defaultFormat"
    type: "ContentFormat"
  relations:
  - name: "space"
    type: "Space"
    multiplicity: "ManyToOne"
  - name: "categories"
    type: "Category"
    multiplicity: "OneToMany"
  - name: "articles"
    type: "Article"
    multiplicity: "OneToMany"
  - name: "templates"
    type: "Template"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "OneToMany"
- name: "Category"
  description: "Hierarchical classification node used to group related articles within\
    \ a knowledge base."
  data:
  - name: "name"
    type: "String"
  - name: "slug"
    type: "Slug"
  - name: "orderIndex"
    type: "Integer"
  relations:
  - name: "knowledgeBase"
    type: "KnowledgeBase"
    multiplicity: "ManyToOne"
  - name: "parentCategory"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "subcategories"
    type: "Category"
    multiplicity: "OneToMany"
  - name: "articles"
    type: "Article"
    multiplicity: "OneToMany"
- name: "Article"
  description: "Primary knowledge asset containing structured content, versions, discussions,\
    \ and workflow state."
  data:
  - name: "title"
    type: "String"
  - name: "contentFormat"
    type: "ContentFormat"
  - name: "status"
    type: "ArticleStatus"
  - name: "summary"
    type: "String"
  - name: "lastUpdated"
    type: "DateTime"
  - name: "visibility"
    type: "Visibility"
  relations:
  - name: "knowledgeBase"
    type: "KnowledgeBase"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "versions"
    type: "ArticleVersion"
    multiplicity: "OneToMany"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "coAuthors"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
  - name: "reviewWorkflow"
    type: "ReviewWorkflow"
    multiplicity: "OneToOne"
  - name: "externalLinks"
    type: "ExternalLink"
    multiplicity: "OneToMany"
  - name: "translations"
    type: "Translation"
    multiplicity: "OneToMany"
  - name: "analytics"
    type: "AnalyticsSnapshot"
    multiplicity: "OneToMany"
- name: "ArticleVersion"
  description: "Immutable snapshot of an article body and metadata at a point in time."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "changeType"
    type: "ChangeType"
  - name: "body"
    type: "TextBody"
  relations:
  - name: "article"
    type: "Article"
    multiplicity: "ManyToOne"
  - name: "editor"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Attachment"
  description: "File or binary asset associated with an article version or article\
    \ for reference."
  data:
  - name: "fileName"
    type: "String"
  - name: "attachmentType"
    type: "AttachmentType"
  - name: "uri"
    type: "URI"
  - name: "sizeBytes"
    type: "Integer"
  relations:
  - name: "article"
    type: "Article"
    multiplicity: "ManyToOne"
- name: "Tag"
  description: "Labeled keyword used for cross-cutting classification and discovery\
    \ across articles."
  data:
  - name: "name"
    type: "String"
  - name: "tagType"
    type: "TagType"
  relations:
  - name: "articles"
    type: "Article"
    multiplicity: "ManyToMany"
  - name: "knowledgeBase"
    type: "KnowledgeBase"
    multiplicity: "ManyToOne"
- name: "Template"
  description: "Reusable content scaffold for authoring standardized knowledge articles."
  data:
  - name: "name"
    type: "String"
  - name: "contentFormat"
    type: "ContentFormat"
  - name: "body"
    type: "TextBody"
  relations:
  - name: "knowledgeBase"
    type: "KnowledgeBase"
    multiplicity: "ManyToOne"
- name: "User"
  description: "Person participating in knowledge creation, curation, and consumption."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "Email"
  - name: "locale"
    type: "Locale"
  - name: "timezone"
    type: "String"
  - name: "profileUrl"
    type: "URI"
  relations:
  - name: "groups"
    type: "Group"
    multiplicity: "ManyToMany"
  - name: "authoredArticles"
    type: "Article"
    multiplicity: "OneToMany"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "badges"
    type: "Badge"
    multiplicity: "ManyToMany"
- name: "Group"
  description: "Collection of users with shared purpose and role assignments within\
    \ a workspace."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "String"
  relations:
  - name: "workspace"
    type: "KnowledgeWorkspace"
    multiplicity: "ManyToOne"
  - name: "members"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "roles"
    type: "Role"
    multiplicity: "OneToMany"
  - name: "spaces"
    type: "Space"
    multiplicity: "ManyToMany"
- name: "Role"
  description: "Named capability profile used to bundle permissions for assignment\
    \ to groups."
  data:
  - name: "name"
    type: "String"
  - name: "roleType"
    type: "RoleType"
  relations:
  - name: "group"
    type: "Group"
    multiplicity: "ManyToOne"
  - name: "permissions"
    type: "Permission"
    multiplicity: "ManyToMany"
- name: "Permission"
  description: "Atomic authorization rule defining an allowed action on a specific\
    \ scope."
  data:
  - name: "action"
    type: "PermissionAction"
  - name: "scope"
    type: "PermissionScope"
  relations:
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
- name: "ReviewWorkflow"
  description: "Controlled process governing the review and approval of an article\
    \ before publication."
  data:
  - name: "workflowState"
    type: "WorkflowState"
  - name: "requiredApprovals"
    type: "Integer"
  - name: "dueDate"
    type: "Date"
  - name: "startedAt"
    type: "DateTime"
  relations:
  - name: "article"
    type: "Article"
    multiplicity: "OneToOne"
  - name: "steps"
    type: "WorkflowStep"
    multiplicity: "OneToMany"
  - name: "reviewers"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "WorkflowStep"
  description: "Individual actionable stage within a review workflow with assigned\
    \ participants."
  data:
  - name: "name"
    type: "String"
  - name: "stepType"
    type: "WorkflowStepType"
  - name: "orderIndex"
    type: "Integer"
  - name: "status"
    type: "StepStatus"
  relations:
  - name: "workflow"
    type: "ReviewWorkflow"
    multiplicity: "ManyToOne"
  - name: "assignees"
    type: "User"
    multiplicity: "ManyToMany"
- name: "Approval"
  description: "Formal decision recorded by a reviewer within the review workflow."
  data:
  - name: "decision"
    type: "ApprovalDecision"
  - name: "decidedAt"
    type: "DateTime"
  - name: "comment"
    type: "String"
  relations:
  - name: "workflow"
    type: "ReviewWorkflow"
    multiplicity: "ManyToOne"
  - name: "reviewer"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Comment"
  description: "Threaded discussion message attached to an article for feedback and\
    \ clarification."
  data:
  - name: "content"
    type: "TextBody"
  - name: "createdAt"
    type: "DateTime"
  - name: "isResolved"
    type: "Boolean"
  - name: "visibility"
    type: "Visibility"
  relations:
  - name: "article"
    type: "Article"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "parentComment"
    type: "Comment"
    multiplicity: "ManyToOne"
  - name: "replies"
    type: "Comment"
    multiplicity: "OneToMany"
  - name: "mentions"
    type: "User"
    multiplicity: "ManyToMany"
- name: "KnowledgePolicy"
  description: "Governance rule defining standards for authoring, classification,\
    \ retention, and sharing."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "PolicyType"
  - name: "content"
    type: "TextBody"
  - name: "effectiveFrom"
    type: "Date"
  relations:
  - name: "workspace"
    type: "KnowledgeWorkspace"
    multiplicity: "ManyToOne"
  - name: "appliesToSpaces"
    type: "Space"
    multiplicity: "ManyToMany"
  - name: "owners"
    type: "User"
    multiplicity: "ManyToMany"
- name: "Subscription"
  description: "User preference to receive notifications about changes to articles\
    \ or spaces."
  data:
  - name: "subscriptionType"
    type: "SubscriptionType"
  - name: "createdAt"
    type: "DateTime"
  - name: "notificationChannel"
    type: "NotificationChannel"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "article"
    type: "Article"
    multiplicity: "ManyToOne"
  - name: "space"
    type: "Space"
    multiplicity: "ManyToOne"
  - name: "knowledgeBase"
    type: "KnowledgeBase"
    multiplicity: "ManyToOne"
- name: "Notification"
  description: "Message delivered to a user to inform about events in the knowledge\
    \ ecosystem."
  data:
  - name: "kind"
    type: "NotificationType"
  - name: "sentAt"
    type: "DateTime"
  - name: "status"
    type: "NotificationStatus"
  - name: "message"
    type: "String"
  relations:
  - name: "recipient"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "relatedArticle"
    type: "Article"
    multiplicity: "ManyToOne"
  - name: "relatedComment"
    type: "Comment"
    multiplicity: "ManyToOne"
  - name: "relatedWorkflow"
    type: "ReviewWorkflow"
    multiplicity: "ManyToOne"
- name: "ExternalLink"
  description: "Reference to an external resource that provides supporting context\
    \ for an article."
  data:
  - name: "title"
    type: "String"
  - name: "linkType"
    type: "LinkType"
  - name: "uri"
    type: "URI"
  relations:
  - name: "article"
    type: "Article"
    multiplicity: "ManyToOne"
- name: "Translation"
  description: "Localized version of an article for a specific language audience."
  data:
  - name: "language"
    type: "Locale"
  - name: "title"
    type: "String"
  - name: "body"
    type: "TextBody"
  - name: "translationStatus"
    type: "TranslationStatus"
  - name: "lastUpdated"
    type: "DateTime"
  relations:
  - name: "article"
    type: "Article"
    multiplicity: "ManyToOne"
  - name: "translator"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Badge"
  description: "Recognition awarded to users for contributions and expertise in knowledge\
    \ sharing."
  data:
  - name: "name"
    type: "String"
  - name: "criteria"
    type: "String"
  - name: "level"
    type: "BadgeLevel"
  relations:
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
- name: "AnalyticsSnapshot"
  description: "Periodic metrics that quantify readership and engagement for an article."
  data:
  - name: "capturedAt"
    type: "DateTime"
  - name: "views"
    type: "Integer"
  - name: "uniqueReaders"
    type: "Integer"
  - name: "likes"
    type: "Integer"
  - name: "readTimeAverageSeconds"
    type: "Integer"
  relations:
  - name: "article"
    type: "Article"
    multiplicity: "ManyToOne"
- name: "ReadingList"
  description: "Curated collection of articles assembled by a user for learning or\
    \ onboarding."
  data:
  - name: "name"
    type: "String"
  - name: "summary"
    type: "String"
  - name: "visibility"
    type: "Visibility"
  relations:
  - name: "owner"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "articles"
    type: "Article"
    multiplicity: "ManyToMany"
  - name: "space"
    type: "Space"
    multiplicity: "ManyToOne"
- name: "GlossaryTerm"
  description: "Controlled vocabulary entry that standardizes definitions for shared\
    \ understanding."
  data:
  - name: "term"
    type: "String"
  - name: "definition"
    type: "TextBody"
  - name: "status"
    type: "GlossaryStatus"
  relations:
  - name: "space"
    type: "Space"
    multiplicity: "ManyToOne"
  - name: "relatedTerms"
    type: "GlossaryTerm"
    multiplicity: "ManyToMany"
- name: "SavedQuery"
  description: "Persisted search expression for quickly finding relevant content."
  data:
  - name: "name"
    type: "String"
  - name: "query"
    type: "String"
  - name: "visibility"
    type: "Visibility"
  - name: "createdAt"
    type: "DateTime"
  relations:
  - name: "owner"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "space"
    type: "Space"
    multiplicity: "ManyToOne"
enums:
- name: "ContentFormat"
  description: "Authoring format used to encode article content and templates."
  data:
  - name: "Markdown"
  - name: "RichText"
  - name: "HTML"
  - name: "PlainText"
- name: "ArticleStatus"
  description: "Lifecycle state representing authoring and publication readiness."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Approved"
  - name: "Published"
  - name: "Archived"
  - name: "Retired"
- name: "Visibility"
  description: "Access level determining who can discover and read the content."
  data:
  - name: "Private"
  - name: "Internal"
  - name: "Public"
  - name: "Restricted"
- name: "ChangeType"
  description: "Classification of the scope of a content update in a version."
  data:
  - name: "Minor"
  - name: "Major"
  - name: "Correction"
- name: "AttachmentType"
  description: "Kind of file associated with an article to provide supplemental material."
  data:
  - name: "Document"
  - name: "Image"
  - name: "Video"
  - name: "Dataset"
  - name: "Diagram"
  - name: "Archive"
- name: "TagType"
  description: "Category of tag used to drive taxonomy and discovery experiences."
  data:
  - name: "Topic"
  - name: "Technology"
  - name: "Audience"
  - name: "Process"
  - name: "Location"
- name: "RoleType"
  description: "Archetypal grouping that communicates the intent of a role assignment."
  data:
  - name: "Owner"
  - name: "Admin"
  - name: "Editor"
  - name: "Viewer"
  - name: "Moderator"
- name: "PermissionAction"
  description: "Atomic action that can be granted within a permission."
  data:
  - name: "Create"
  - name: "Read"
  - name: "Update"
  - name: "Delete"
  - name: "Share"
  - name: "Publish"
  - name: "Comment"
  - name: "Approve"
- name: "PermissionScope"
  description: "Target resource category on which a permission action applies."
  data:
  - name: "Workspace"
  - name: "Space"
  - name: "KnowledgeBase"
  - name: "Article"
  - name: "Comment"
  - name: "Template"
  - name: "Tag"
- name: "WorkflowState"
  description: "Overall progress state for a review workflow."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "WorkflowStepType"
  description: "Nature of activity that a workflow step performs."
  data:
  - name: "Review"
  - name: "Legal"
  - name: "Technical"
  - name: "Editorial"
  - name: "Compliance"
- name: "StepStatus"
  description: "Execution status of an individual workflow step."
  data:
  - name: "Pending"
  - name: "Active"
  - name: "Approved"
  - name: "Rejected"
  - name: "Skipped"
- name: "ApprovalDecision"
  description: "Outcome recorded by a reviewer when evaluating an article."
  data:
  - name: "Approved"
  - name: "Rejected"
  - name: "ChangesRequested"
  - name: "Abstained"
- name: "PolicyType"
  description: "Classification of governance policy applied to content or spaces."
  data:
  - name: "Retention"
  - name: "Classification"
  - name: "Review"
  - name: "Security"
  - name: "Accessibility"
- name: "SubscriptionType"
  description: "Category of updates a user elects to follow."
  data:
  - name: "ArticleUpdates"
  - name: "SpaceDigest"
  - name: "Mentions"
  - name: "ReviewRequests"
  - name: "Comments"
- name: "NotificationChannel"
  description: "Delivery medium used to send notifications."
  data:
  - name: "Email"
  - name: "InApp"
  - name: "SMS"
  - name: "Webhook"
- name: "NotificationType"
  description: "Event classification that triggers a user notification."
  data:
  - name: "ArticlePublished"
  - name: "CommentAdded"
  - name: "Mention"
  - name: "ApprovalRequested"
  - name: "ApprovalDecided"
  - name: "ArticleUpdated"
- name: "LinkType"
  description: "Semantic relationship expressed by an external link."
  data:
  - name: "Reference"
  - name: "Source"
  - name: "Related"
  - name: "Duplicate"
- name: "TranslationStatus"
  description: "Progress of localization for an article translation."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Completed"
  - name: "NeedsReview"
- name: "BadgeLevel"
  description: "Tier assigned to a badge to indicate recognition level."
  data:
  - name: "Bronze"
  - name: "Silver"
  - name: "Gold"
  - name: "Platinum"
- name: "GlossaryStatus"
  description: "Lifecycle state of a glossary term definition."
  data:
  - name: "Proposed"
  - name: "Approved"
  - name: "Deprecated"
- name: "NotificationStatus"
  description: "Delivery and consumption state for a notification message."
  data:
  - name: "Pending"
  - name: "Sent"
  - name: "Failed"
  - name: "Read"
valueObjects:
- name: "Slug"
  description: "URL friendly token used to uniquely reference content within a readable\
    \ path."
  data:
  - name: "value"
    type: "String"
- name: "URI"
  description: "Locator that identifies a resource using a standardized addressing\
    \ scheme."
  data:
  - name: "value"
    type: "String"
- name: "Email"
  description: "Electronic mail address used for user contact and notifications."
  data:
  - name: "value"
    type: "String"
- name: "Locale"
  description: "Language and regional setting used for localization and formatting."
  data:
  - name: "code"
    type: "String"
  - name: "language"
    type: "String"
  - name: "region"
    type: "String"
- name: "TextBody"
  description: "Long form textual content stored as a single opaque value."
  data:
  - name: "value"
    type: "String"
