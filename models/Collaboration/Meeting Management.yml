---
metadata:
  name: "Meeting Management HCIDL Model"
  description: "A capability model for planning, scheduling, conducting, and following\
    \ up on meetings across teams and organizations."
  version: "1.0.0"
  industry: "Collaboration Software"
  category: "Collaboration"
  type: "Capability"
  domain: "Meeting Management"
entities:
- name: "Workspace"
  description: "Top-level collaboration boundary that owns users, teams, rooms, resources,\
    \ and calendars."
  data:
  - name: "name"
    type: "String"
  - name: "domain"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "defaultMeetingAccessLevel"
    type: "MeetingAccessLevel"
  relations:
  - name: "users"
    type: "User"
    multiplicity: "OneToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "OneToMany"
  - name: "rooms"
    type: "Room"
    multiplicity: "OneToMany"
  - name: "resources"
    type: "Resource"
    multiplicity: "OneToMany"
  - name: "calendars"
    type: "Calendar"
    multiplicity: "OneToMany"
  - name: "externalContacts"
    type: "ExternalContact"
    multiplicity: "OneToMany"
- name: "Team"
  description: "Functional group of users that collaborate and share calendars."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "members"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "calendars"
    type: "Calendar"
    multiplicity: "OneToMany"
- name: "User"
  description: "Person with access to calendars, meetings, and collaboration features."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "timeZone"
    type: "String"
  - name: "locale"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "calendars"
    type: "Calendar"
    multiplicity: "OneToMany"
  - name: "organizedMeetings"
    type: "Meeting"
    multiplicity: "OneToMany"
  - name: "actionItems"
    type: "ActionItem"
    multiplicity: "OneToMany"
- name: "Calendar"
  description: "Container for scheduled meetings within a user, team, or workspace\
    \ context."
  data:
  - name: "name"
    type: "String"
  - name: "color"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "visibility"
    type: "CalendarVisibility"
  relations:
  - name: "owner"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "meetings"
    type: "Meeting"
    multiplicity: "OneToMany"
  - name: "series"
    type: "MeetingSeries"
    multiplicity: "OneToMany"
- name: "Room"
  description: "Bookable physical meeting room."
  data:
  - name: "name"
    type: "String"
  - name: "capacity"
    type: "Integer"
  - name: "layout"
    type: "RoomLayout"
  - name: "location"
    type: "MeetingLocation"
  - name: "equipmentNotes"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "bookings"
    type: "ResourceBooking"
    multiplicity: "OneToMany"
- name: "Resource"
  description: "Bookable non-room asset such as equipment or vehicles required for\
    \ meetings."
  data:
  - name: "name"
    type: "String"
  - name: "resourceType"
    type: "ResourceType"
  - name: "capacity"
    type: "Integer"
  - name: "description"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "bookings"
    type: "ResourceBooking"
    multiplicity: "OneToMany"
- name: "MeetingSeries"
  description: "Template and rule set for recurring meetings that produce individual\
    \ occurrences."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "recurrence"
    type: "RecurrenceRule"
  relations:
  - name: "organizer"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
  - name: "meetings"
    type: "Meeting"
    multiplicity: "OneToMany"
- name: "Meeting"
  description: "Scheduled session with participants, content, and resources."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "startDateTime"
    type: "DateTime"
  - name: "endDateTime"
    type: "DateTime"
  - name: "status"
    type: "MeetingStatus"
  - name: "meetingType"
    type: "MeetingType"
  - name: "isAllDay"
    type: "Boolean"
  - name: "accessLevel"
    type: "MeetingAccessLevel"
  - name: "videoLink"
    type: "VideoConferenceLink"
  - name: "locationText"
    type: "String"
  relations:
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
  - name: "series"
    type: "MeetingSeries"
    multiplicity: "ManyToOne"
  - name: "organizer"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "participants"
    type: "Participant"
    multiplicity: "OneToMany"
  - name: "agendaItems"
    type: "AgendaItem"
    multiplicity: "OneToMany"
  - name: "actionItems"
    type: "ActionItem"
    multiplicity: "OneToMany"
  - name: "notes"
    type: "MeetingNote"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "reminders"
    type: "Reminder"
    multiplicity: "OneToMany"
  - name: "resourceBookings"
    type: "ResourceBooking"
    multiplicity: "OneToMany"
  - name: "polls"
    type: "SchedulingPoll"
    multiplicity: "OneToMany"
- name: "Participant"
  description: "Person invited to or attending a meeting, internal or external."
  data:
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "role"
    type: "ParticipantRole"
  - name: "responseStatus"
    type: "AttendanceStatus"
  - name: "joinTime"
    type: "DateTime"
  - name: "leaveTime"
    type: "DateTime"
  relations:
  - name: "meeting"
    type: "Meeting"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "externalContact"
    type: "ExternalContact"
    multiplicity: "ManyToOne"
- name: "ExternalContact"
  description: "Guest or partner who is not a registered user but can participate\
    \ in meetings."
  data:
  - name: "name"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "organization"
    type: "String"
  - name: "phone"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "participants"
    type: "Participant"
    multiplicity: "OneToMany"
- name: "AgendaItem"
  description: "Structured discussion point or activity within a meeting."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "order"
    type: "Integer"
  - name: "timebox"
    type: "AgendaItemTimebox"
  relations:
  - name: "meeting"
    type: "Meeting"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "User"
    multiplicity: "ManyToOne"
- name: "ActionItem"
  description: "Follow-up task or commitment created during a meeting."
  data:
  - name: "summary"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "ActionItemStatus"
  - name: "url"
    type: "String"
  relations:
  - name: "meeting"
    type: "Meeting"
    multiplicity: "ManyToOne"
  - name: "assignee"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "User"
    multiplicity: "ManyToOne"
- name: "MeetingNote"
  description: "Persistent note captured before, during, or after a meeting."
  data:
  - name: "content"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "visibility"
    type: "NoteVisibility"
  relations:
  - name: "meeting"
    type: "Meeting"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Attachment"
  description: "File or link associated with a meeting."
  data:
  - name: "fileName"
    type: "String"
  - name: "url"
    type: "String"
  - name: "fileType"
    type: "String"
  - name: "sizeBytes"
    type: "Integer"
  relations:
  - name: "meeting"
    type: "Meeting"
    multiplicity: "ManyToOne"
  - name: "uploader"
    type: "User"
    multiplicity: "ManyToOne"
- name: "ResourceBooking"
  description: "Reservation of a room or other resource for a meeting occurrence."
  data:
  - name: "startDateTime"
    type: "DateTime"
  - name: "endDateTime"
    type: "DateTime"
  - name: "status"
    type: "BookingStatus"
  relations:
  - name: "meeting"
    type: "Meeting"
    multiplicity: "ManyToOne"
  - name: "room"
    type: "Room"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
- name: "SchedulingPoll"
  description: "Poll used to collect availability for proposed meeting times."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "SchedulingPollStatus"
  - name: "allowAnonymous"
    type: "Boolean"
  relations:
  - name: "meeting"
    type: "Meeting"
    multiplicity: "ManyToOne"
  - name: "options"
    type: "TimeOption"
    multiplicity: "OneToMany"
  - name: "votes"
    type: "PollVote"
    multiplicity: "OneToMany"
  - name: "createdBy"
    type: "User"
    multiplicity: "ManyToOne"
- name: "TimeOption"
  description: "Candidate time block proposed within a scheduling poll."
  data:
  - name: "startDateTime"
    type: "DateTime"
  - name: "endDateTime"
    type: "DateTime"
  - name: "note"
    type: "String"
  relations:
  - name: "poll"
    type: "SchedulingPoll"
    multiplicity: "ManyToOne"
  - name: "votes"
    type: "PollVote"
    multiplicity: "OneToMany"
- name: "PollVote"
  description: "Availability response from a participant for a specific time option."
  data:
  - name: "availability"
    type: "PollAvailability"
  - name: "votedAt"
    type: "DateTime"
  relations:
  - name: "option"
    type: "TimeOption"
    multiplicity: "ManyToOne"
  - name: "voterUser"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "voterExternalContact"
    type: "ExternalContact"
    multiplicity: "ManyToOne"
  - name: "poll"
    type: "SchedulingPoll"
    multiplicity: "ManyToOne"
- name: "Reminder"
  description: "Notification rule sent relative to a meeting start time."
  data:
  - name: "method"
    type: "ReminderMethod"
  - name: "leadTimeMinutes"
    type: "Integer"
  - name: "message"
    type: "String"
  relations:
  - name: "meeting"
    type: "Meeting"
    multiplicity: "ManyToOne"
  - name: "recipientUser"
    type: "User"
    multiplicity: "ManyToOne"
enums:
- name: "MeetingType"
  description: "Classification of the meeting’s purpose and format."
  data:
  - name: "StatusUpdate"
  - name: "Planning"
  - name: "Review"
  - name: "Retrospective"
  - name: "OneOnOne"
  - name: "Workshop"
  - name: "Training"
  - name: "AllHands"
  - name: "Interview"
  - name: "SalesCall"
  - name: "SupportCall"
  - name: "Standup"
- name: "MeetingStatus"
  description: "Lifecycle state of a meeting occurrence."
  data:
  - name: "Draft"
  - name: "Scheduled"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
- name: "ParticipantRole"
  description: "Role a participant plays during the meeting."
  data:
  - name: "Organizer"
  - name: "Presenter"
  - name: "Attendee"
  - name: "NoteTaker"
  - name: "Facilitator"
  - name: "Observer"
- name: "AttendanceStatus"
  description: "Invitation response and attendance outcome."
  data:
  - name: "Invited"
  - name: "Accepted"
  - name: "Tentative"
  - name: "Declined"
  - name: "CheckedIn"
  - name: "NoShow"
- name: "ResourceType"
  description: "Category of a non-room asset that can be booked."
  data:
  - name: "Projector"
  - name: "Whiteboard"
  - name: "Microphone"
  - name: "Speakerphone"
  - name: "VideoConferencingUnit"
  - name: "LaptopCart"
  - name: "Vehicle"
  - name: "Other"
- name: "ActionItemStatus"
  description: "Progress state of an action item."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "Completed"
  - name: "Deferred"
  - name: "Cancelled"
- name: "NoteVisibility"
  description: "Access scope for viewing a meeting note."
  data:
  - name: "PrivateToOrganizers"
  - name: "Attendees"
  - name: "PublicWithinWorkspace"
- name: "VideoProvider"
  description: "Provider of the video conferencing service."
  data:
  - name: "Zoom"
  - name: "MicrosoftTeams"
  - name: "GoogleMeet"
  - name: "Webex"
  - name: "Other"
- name: "ReminderMethod"
  description: "Delivery channel used to send a reminder."
  data:
  - name: "Email"
  - name: "PushNotification"
  - name: "SMS"
  - name: "Webhook"
- name: "RecurrenceFrequency"
  description: "Base repetition interval for recurring meetings."
  data:
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Yearly"
- name: "DayOfWeek"
  description: "Named days used in recurrence rules and scheduling."
  data:
  - name: "Monday"
  - name: "Tuesday"
  - name: "Wednesday"
  - name: "Thursday"
  - name: "Friday"
  - name: "Saturday"
  - name: "Sunday"
- name: "SchedulingPollStatus"
  description: "Current status of a scheduling poll."
  data:
  - name: "Open"
  - name: "Closed"
  - name: "Finalized"
  - name: "Cancelled"
- name: "PollAvailability"
  description: "Availability stance expressed by a voter for a time option."
  data:
  - name: "Available"
  - name: "IfNeeded"
  - name: "Unavailable"
- name: "BookingStatus"
  description: "State of a room or resource reservation."
  data:
  - name: "Requested"
  - name: "Confirmed"
  - name: "InUse"
  - name: "Released"
  - name: "Cancelled"
- name: "CalendarVisibility"
  description: "Sharing scope of a calendar."
  data:
  - name: "Private"
  - name: "Team"
  - name: "Organization"
  - name: "Public"
- name: "RoomLayout"
  description: "Seating or arrangement style available in a room."
  data:
  - name: "Boardroom"
  - name: "Classroom"
  - name: "Theater"
  - name: "UShape"
  - name: "HollowSquare"
  - name: "Huddle"
- name: "MeetingAccessLevel"
  description: "Who can see and join a meeting."
  data:
  - name: "InviteOnly"
  - name: "TeamMembers"
  - name: "Organization"
  - name: "PublicLink"
valueObjects:
- name: "EmailAddress"
  description: "Standardized representation of an email address value."
  data:
  - name: "value"
    type: "String"
- name: "RecurrenceRule"
  description: "Parameters defining how a meeting repeats over time."
  data:
  - name: "frequency"
    type: "RecurrenceFrequency"
  - name: "interval"
    type: "Integer"
  - name: "count"
    type: "Integer"
  - name: "until"
    type: "Date"
  - name: "daysOfWeek"
    type: "String"
- name: "AgendaItemTimebox"
  description: "Planned duration allocated to an agenda item."
  data:
  - name: "minutes"
    type: "Integer"
- name: "MeetingLocation"
  description: "Human-readable physical location details for a meeting place."
  data:
  - name: "building"
    type: "String"
  - name: "floor"
    type: "String"
  - name: "roomLabel"
    type: "String"
  - name: "addressLine"
    type: "String"
  - name: "city"
    type: "String"
- name: "VideoConferenceLink"
  description: "Details required for participants to join a virtual meeting."
  data:
  - name: "provider"
    type: "VideoProvider"
  - name: "url"
    type: "String"
  - name: "meetingCode"
    type: "String"
  - name: "passcode"
    type: "String"
  - name: "dialInNumber"
    type: "String"
