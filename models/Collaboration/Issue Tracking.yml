---
metadata:
  name: "HCIDL Capabilities Model - Issue Tracking"
  description: "A capabilities model capturing core concepts and relationships for\
    \ modern issue tracking, covering projects, issues, workflows, collaboration,\
    \ and configurability."
  version: "1.0.0"
  industry: "Software"
  category: "Collaboration"
  type: "Capability"
  domain: "Issue Tracking"
entities:
- name: "User"
  description: "Person who can report, comment on, or manage issues within projects."
  data:
  - name: "username"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "active"
    type: "Boolean"
  - name: "timeZone"
    type: "String"
  relations:
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "reportedIssues"
    type: "Issue"
    multiplicity: "OneToMany"
  - name: "assignedIssues"
    type: "Issue"
    multiplicity: "OneToMany"
  - name: "watchedIssues"
    type: "Issue"
    multiplicity: "ManyToMany"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "workLogs"
    type: "WorkLog"
    multiplicity: "OneToMany"
- name: "Team"
  description: "Group of users organized to collaborate on projects and issues."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "members"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "ManyToMany"
- name: "Project"
  description: "Container for issues, configurations, workflows, and release planning."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "description"
    type: "String"
  - name: "defaultIssueType"
    type: "IssueType"
  - name: "defaultPriority"
    type: "PriorityLevel"
  relations:
  - name: "lead"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "components"
    type: "Component"
    multiplicity: "OneToMany"
  - name: "releases"
    type: "Release"
    multiplicity: "OneToMany"
  - name: "boards"
    type: "Board"
    multiplicity: "OneToMany"
  - name: "issues"
    type: "Issue"
    multiplicity: "OneToMany"
  - name: "workflow"
    type: "Workflow"
    multiplicity: "ManyToOne"
  - name: "notificationScheme"
    type: "NotificationScheme"
    multiplicity: "ManyToOne"
  - name: "customFields"
    type: "CustomFieldDefinition"
    multiplicity: "OneToMany"
- name: "Component"
  description: "Logical sub-area within a project used to group related issues."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "lead"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "issues"
    type: "Issue"
    multiplicity: "OneToMany"
- name: "Release"
  description: "Version or milestone representing a delivery target for issues."
  data:
  - name: "name"
    type: "String"
  - name: "releaseDate"
    type: "Date"
  - name: "description"
    type: "String"
  - name: "released"
    type: "Boolean"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "issues"
    type: "Issue"
    multiplicity: "OneToMany"
- name: "Board"
  description: "Visual board for planning and monitoring work."
  data:
  - name: "name"
    type: "String"
  - name: "boardType"
    type: "BoardType"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "sprints"
    type: "Sprint"
    multiplicity: "OneToMany"
- name: "Sprint"
  description: "Timeboxed iteration used to plan and track a subset of work."
  data:
  - name: "name"
    type: "String"
  - name: "goal"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "SprintStatus"
  relations:
  - name: "board"
    type: "Board"
    multiplicity: "ManyToOne"
  - name: "issues"
    type: "Issue"
    multiplicity: "OneToMany"
- name: "Issue"
  description: "Trackable work item such as a bug, task, or story."
  data:
  - name: "issueNumber"
    type: "Integer"
  - name: "summary"
    type: "String"
  - name: "description"
    type: "RichText"
  - name: "type"
    type: "IssueType"
  - name: "status"
    type: "IssueStatus"
  - name: "priority"
    type: "PriorityLevel"
  - name: "severity"
    type: "SeverityLevel"
  - name: "createdAt"
    type: "DateTime"
  - name: "updatedAt"
    type: "DateTime"
  - name: "dueDate"
    type: "Date"
  - name: "resolution"
    type: "ResolutionType"
  - name: "storyPoints"
    type: "Decimal"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "reporter"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "assignee"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "Issue"
    multiplicity: "ManyToOne"
  - name: "subTasks"
    type: "Issue"
    multiplicity: "OneToMany"
  - name: "components"
    type: "Component"
    multiplicity: "ManyToMany"
  - name: "fixVersions"
    type: "Release"
    multiplicity: "ManyToMany"
  - name: "affectsVersions"
    type: "Release"
    multiplicity: "ManyToMany"
  - name: "labels"
    type: "Label"
    multiplicity: "ManyToMany"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "links"
    type: "IssueLink"
    multiplicity: "OneToMany"
  - name: "sprint"
    type: "Sprint"
    multiplicity: "ManyToOne"
  - name: "watchers"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "workLogs"
    type: "WorkLog"
    multiplicity: "OneToMany"
  - name: "customFieldValues"
    type: "CustomFieldValue"
    multiplicity: "OneToMany"
- name: "Comment"
  description: "User-supplied remark or note attached to an issue."
  data:
  - name: "body"
    type: "RichText"
  - name: "createdAt"
    type: "DateTime"
  - name: "updatedAt"
    type: "DateTime"
  - name: "isInternal"
    type: "Boolean"
  relations:
  - name: "issue"
    type: "Issue"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Attachment"
  description: "File or asset uploaded to provide additional context for an issue."
  data:
  - name: "fileName"
    type: "String"
  - name: "contentType"
    type: "String"
  - name: "sizeBytes"
    type: "Integer"
  - name: "url"
    type: "Url"
  - name: "checksum"
    type: "String"
  - name: "uploadedAt"
    type: "DateTime"
  relations:
  - name: "issue"
    type: "Issue"
    multiplicity: "ManyToOne"
  - name: "uploader"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Label"
  description: "Free-form tag used to categorize and search issues."
  data:
  - name: "name"
    type: "String"
  - name: "color"
    type: "Color"
  relations:
  - name: "issues"
    type: "Issue"
    multiplicity: "ManyToMany"
- name: "IssueLink"
  description: "Directed relationship capturing dependencies or associations between\
    \ issues."
  data:
  - name: "linkType"
    type: "IssueLinkType"
  - name: "direction"
    type: "LinkDirection"
  relations:
  - name: "source"
    type: "Issue"
    multiplicity: "ManyToOne"
  - name: "target"
    type: "Issue"
    multiplicity: "ManyToOne"
- name: "WorkLog"
  description: "Record of time spent on an issue for tracking and reporting."
  data:
  - name: "startedAt"
    type: "DateTime"
  - name: "timeSpent"
    type: "Duration"
  - name: "comment"
    type: "RichText"
  - name: "billable"
    type: "Boolean"
  relations:
  - name: "issue"
    type: "Issue"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Workflow"
  description: "Lifecycle configuration defining allowable states and transitions\
    \ for issues."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
  - name: "states"
    type: "WorkflowState"
    multiplicity: "OneToMany"
  - name: "transitions"
    type: "Transition"
    multiplicity: "OneToMany"
- name: "WorkflowState"
  description: "Distinct step in a workflow used to reflect issue progress."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "WorkflowStateCategory"
  - name: "isResolutionState"
    type: "Boolean"
  relations:
  - name: "workflow"
    type: "Workflow"
    multiplicity: "ManyToOne"
  - name: "outgoingTransitions"
    type: "Transition"
    multiplicity: "OneToMany"
  - name: "incomingTransitions"
    type: "Transition"
    multiplicity: "OneToMany"
- name: "Transition"
  description: "Permitted movement between workflow states with optional conditions."
  data:
  - name: "name"
    type: "String"
  - name: "conditionExpression"
    type: "String"
  - name: "requiresComment"
    type: "Boolean"
  relations:
  - name: "workflow"
    type: "Workflow"
    multiplicity: "ManyToOne"
  - name: "fromState"
    type: "WorkflowState"
    multiplicity: "ManyToOne"
  - name: "toState"
    type: "WorkflowState"
    multiplicity: "ManyToOne"
- name: "NotificationScheme"
  description: "Collection of notification rules applied to project events."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
  - name: "rules"
    type: "NotificationRule"
    multiplicity: "OneToMany"
- name: "NotificationRule"
  description: "Mapping of an event to recipients with a specific message template."
  data:
  - name: "eventType"
    type: "IssueEvent"
  - name: "notifyOnChange"
    type: "Boolean"
  - name: "templateName"
    type: "String"
  relations:
  - name: "scheme"
    type: "NotificationScheme"
    multiplicity: "ManyToOne"
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
- name: "CustomFieldDefinition"
  description: "Definition and behavior of an additional attribute attachable to issues."
  data:
  - name: "name"
    type: "String"
  - name: "fieldType"
    type: "CustomFieldType"
  - name: "isRequired"
    type: "Boolean"
  - name: "description"
    type: "String"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "options"
    type: "CustomFieldOption"
    multiplicity: "OneToMany"
  - name: "values"
    type: "CustomFieldValue"
    multiplicity: "OneToMany"
- name: "CustomFieldOption"
  description: "Selectable option for single- or multi-select custom fields."
  data:
  - name: "value"
    type: "String"
  - name: "position"
    type: "Integer"
  - name: "isArchived"
    type: "Boolean"
  relations:
  - name: "field"
    type: "CustomFieldDefinition"
    multiplicity: "ManyToOne"
- name: "CustomFieldValue"
  description: "Stored value of a custom field for a particular issue."
  data:
  - name: "fieldName"
    type: "String"
  - name: "stringValue"
    type: "String"
  - name: "numberValue"
    type: "Decimal"
  - name: "dateValue"
    type: "Date"
  - name: "dateTimeValue"
    type: "DateTime"
  - name: "booleanValue"
    type: "Boolean"
  relations:
  - name: "issue"
    type: "Issue"
    multiplicity: "ManyToOne"
  - name: "field"
    type: "CustomFieldDefinition"
    multiplicity: "ManyToOne"
enums:
- name: "IssueType"
  description: "Classification of issues based on purpose and workflow needs."
  data:
  - name: "Bug"
  - name: "Task"
  - name: "Story"
  - name: "Epic"
  - name: "SubTask"
  - name: "Improvement"
- name: "IssueStatus"
  description: "Standard status values used to indicate an issue’s current state."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "InReview"
  - name: "Blocked"
  - name: "Resolved"
  - name: "Closed"
  - name: "Reopened"
- name: "PriorityLevel"
  description: "Ordering of urgency to help with triage and planning."
  data:
  - name: "Lowest"
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Highest"
- name: "SeverityLevel"
  description: "Degree of impact an issue has on functionality or users."
  data:
  - name: "Trivial"
  - name: "Minor"
  - name: "Major"
  - name: "Critical"
  - name: "Blocker"
- name: "ResolutionType"
  description: "Outcome assigned when an issue reaches completion or is closed."
  data:
  - name: "Fixed"
  - name: "WontFix"
  - name: "Duplicate"
  - name: "Incomplete"
  - name: "CannotReproduce"
  - name: "Done"
- name: "IssueLinkType"
  description: "Semantics describing how two issues relate to one another."
  data:
  - name: "RelatesTo"
  - name: "Blocks"
  - name: "IsBlockedBy"
  - name: "Duplicates"
  - name: "IsDuplicatedBy"
  - name: "Causes"
  - name: "IsCausedBy"
  - name: "Clones"
  - name: "IsClonedBy"
- name: "LinkDirection"
  description: "Directional aspect of a relationship from a source to a target issue."
  data:
  - name: "Outbound"
  - name: "Inbound"
- name: "BoardType"
  description: "Style of workflow visualization used by a board."
  data:
  - name: "Scrum"
  - name: "Kanban"
- name: "SprintStatus"
  description: "Lifecycle state of a sprint during planning and execution."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "Completed"
  - name: "Cancelled"
- name: "WorkflowStateCategory"
  description: "High-level grouping of workflow states for reporting and policies."
  data:
  - name: "ToDo"
  - name: "InProgress"
  - name: "Done"
- name: "IssueEvent"
  description: "Domain events that can trigger notifications or automations."
  data:
  - name: "IssueCreated"
  - name: "IssueUpdated"
  - name: "CommentAdded"
  - name: "CommentEdited"
  - name: "CommentDeleted"
  - name: "IssueAssigned"
  - name: "IssueReopened"
  - name: "IssueResolved"
  - name: "StatusChanged"
  - name: "AttachmentAdded"
  - name: "WorkLogged"
- name: "CustomFieldType"
  description: "Data representation used by a custom field definition."
  data:
  - name: "Text"
  - name: "Number"
  - name: "Date"
  - name: "DateTime"
  - name: "Boolean"
  - name: "SingleSelect"
  - name: "MultiSelect"
  - name: "User"
  - name: "Team"
  - name: "Url"
  - name: "Markdown"
valueObjects:
- name: "RichText"
  description: "Formatted text content with an associated markup format."
  data:
  - name: "content"
    type: "String"
  - name: "format"
    type: "String"
- name: "Url"
  description: "Reference to a network resource using a standard URL string."
  data:
  - name: "value"
    type: "String"
- name: "Color"
  description: "Display color encoded for UI tagging and status highlighting."
  data:
  - name: "hex"
    type: "String"
  - name: "name"
    type: "String"
- name: "Duration"
  description: "Length of elapsed time expressed in whole seconds."
  data:
  - name: "seconds"
    type: "Integer"
- name: "EmailAddress"
  description: "Electronic mail address used for user communication."
  data:
  - name: "value"
    type: "String"
