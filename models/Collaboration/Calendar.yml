---
metadata:
  name: "Calendar"
  description: "Capabilities model for collaborative calendaring, scheduling, and\
    \ time management."
  version: "1.0.0"
  industry: "Software"
  category: "Collaboration"
  type: "Capability"
  domain: "Calendar"
entities:
- name: "User"
  description: "Person who owns calendars, organizes events, and participates as an\
    \ attendee."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "timeZone"
    type: "String"
  - name: "locale"
    type: "String"
  relations:
  - name: "calendars"
    type: "Calendar"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "Group"
    multiplicity: "ManyToMany"
  - name: "organizedEvents"
    type: "Event"
    multiplicity: "OneToMany"
  - name: "attendances"
    type: "Attendee"
    multiplicity: "OneToMany"
  - name: "notificationSettings"
    type: "NotificationSetting"
    multiplicity: "OneToMany"
  - name: "workingHours"
    type: "WorkingHours"
    multiplicity: "OneToMany"
- name: "Group"
  description: "Collaborative group used to aggregate members and share calendars."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "color"
    type: "String"
  relations:
  - name: "members"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "calendars"
    type: "Calendar"
    multiplicity: "OneToMany"
- name: "Calendar"
  description: "Container for events with its own time zone, visibility, and sharing\
    \ rules."
  data:
  - name: "name"
    type: "String"
  - name: "color"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "calendarType"
    type: "CalendarType"
  - name: "defaultEventDurationMinutes"
    type: "Integer"
  - name: "visibility"
    type: "CalendarVisibility"
  relations:
  - name: "owner"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "group"
    type: "Group"
    multiplicity: "ManyToOne"
  - name: "events"
    type: "Event"
    multiplicity: "OneToMany"
  - name: "shares"
    type: "CalendarShare"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "CalendarSubscription"
    multiplicity: "OneToMany"
  - name: "availabilityWindows"
    type: "AvailabilityWindow"
    multiplicity: "OneToMany"
- name: "CalendarShare"
  description: "Access grant for a calendar to a specific user, group, or public link."
  data:
  - name: "shareTargetType"
    type: "ShareTargetType"
  - name: "accessLevel"
    type: "CalendarAccessLevel"
  - name: "allowGuestScheduling"
    type: "Boolean"
  relations:
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "group"
    type: "Group"
    multiplicity: "ManyToOne"
- name: "Event"
  description: "Scheduled item on a calendar, optionally recurring and with attendees."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "startDateTime"
    type: "DateTime"
  - name: "endDateTime"
    type: "DateTime"
  - name: "allDay"
    type: "Boolean"
  - name: "status"
    type: "EventStatus"
  - name: "privacy"
    type: "EventPrivacy"
  - name: "location"
    type: "Place"
  - name: "recurrence"
    type: "RecurrencePattern"
  - name: "conferenceLink"
    type: "Url"
  - name: "onlineMeetingProvider"
    type: "OnlineMeetingProvider"
  relations:
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
  - name: "organizer"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "attendees"
    type: "Attendee"
    multiplicity: "OneToMany"
  - name: "reminders"
    type: "Reminder"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "exceptions"
    type: "RecurrenceException"
    multiplicity: "OneToMany"
  - name: "resources"
    type: "Resource"
    multiplicity: "ManyToMany"
- name: "Attendee"
  description: "Participant invited to an event, with role and response status."
  data:
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "role"
    type: "AttendeeRole"
  - name: "responseStatus"
    type: "AttendanceStatus"
  - name: "optional"
    type: "Boolean"
  relations:
  - name: "event"
    type: "Event"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Reminder"
  description: "Notification configuration relative to the start or end of an event."
  data:
  - name: "method"
    type: "ReminderMethod"
  - name: "offsetMinutes"
    type: "Integer"
  - name: "relativeTo"
    type: "ReminderRelativeTo"
  relations:
  - name: "event"
    type: "Event"
    multiplicity: "ManyToOne"
- name: "Attachment"
  description: "File or link associated with an event."
  data:
  - name: "fileName"
    type: "String"
  - name: "mimeType"
    type: "String"
  - name: "sizeBytes"
    type: "Integer"
  - name: "url"
    type: "Url"
  relations:
  - name: "event"
    type: "Event"
    multiplicity: "ManyToOne"
- name: "RecurrenceException"
  description: "Override or cancellation for a specific occurrence in a recurring\
    \ series."
  data:
  - name: "exceptionDate"
    type: "Date"
  - name: "changeType"
    type: "ExceptionChangeType"
  - name: "isCancelled"
    type: "Boolean"
  - name: "newStartDateTime"
    type: "DateTime"
  - name: "newEndDateTime"
    type: "DateTime"
  relations:
  - name: "event"
    type: "Event"
    multiplicity: "ManyToOne"
- name: "AvailabilityWindow"
  description: "Published free or busy time span for a calendar."
  data:
  - name: "startDateTime"
    type: "DateTime"
  - name: "endDateTime"
    type: "DateTime"
  - name: "availabilityType"
    type: "AvailabilityType"
  relations:
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
- name: "Resource"
  description: "Bookable asset such as a room or equipment that can be reserved by\
    \ events."
  data:
  - name: "name"
    type: "String"
  - name: "resourceType"
    type: "ResourceType"
  - name: "capacity"
    type: "Integer"
  - name: "location"
    type: "Place"
  relations:
  - name: "events"
    type: "Event"
    multiplicity: "ManyToMany"
  - name: "calendar"
    type: "Calendar"
    multiplicity: "OneToOne"
- name: "CalendarSubscription"
  description: "External calendar feed synchronized into a local calendar."
  data:
  - name: "sourceUrl"
    type: "Url"
  - name: "format"
    type: "SubscriptionFormat"
  - name: "syncStatus"
    type: "SyncStatus"
  - name: "lastSyncedAt"
    type: "DateTime"
  - name: "refreshIntervalMinutes"
    type: "Integer"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
- name: "NotificationSetting"
  description: "User preference for calendar and event notifications."
  data:
  - name: "defaultReminderMinutes"
    type: "Integer"
  - name: "emailNotificationsEnabled"
    type: "Boolean"
  - name: "mobilePushEnabled"
    type: "Boolean"
  - name: "dailyAgendaTime"
    type: "TimeOfDay"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
- name: "WorkingHours"
  description: "Preferred working schedule for a user, used when proposing meeting\
    \ times."
  data:
  - name: "dayOfWeek"
    type: "DayOfWeek"
  - name: "startTime"
    type: "TimeOfDay"
  - name: "endTime"
    type: "TimeOfDay"
  - name: "timeZone"
    type: "String"
  - name: "isWorking"
    type: "Boolean"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
enums:
- name: "CalendarType"
  description: "Classification of a calendar based on ownership and purpose."
  data:
  - name: "Personal"
  - name: "Team"
  - name: "Shared"
  - name: "Resource"
  - name: "Subscription"
- name: "CalendarVisibility"
  description: "Determines who can discover and view a calendar and its details."
  data:
  - name: "Private"
  - name: "Public"
  - name: "Internal"
  - name: "Restricted"
- name: "CalendarAccessLevel"
  description: "Level of permission granted to a principal for a calendar."
  data:
  - name: "Owner"
  - name: "Editor"
  - name: "Contributor"
  - name: "Viewer"
  - name: "FreeBusyOnly"
- name: "ShareTargetType"
  description: "Principal type receiving access to a calendar."
  data:
  - name: "User"
  - name: "Group"
  - name: "PublicLink"
- name: "EventStatus"
  description: "Lifecycle state of an event."
  data:
  - name: "Confirmed"
  - name: "Tentative"
  - name: "Cancelled"
- name: "EventPrivacy"
  description: "Visibility of event details to others."
  data:
  - name: "Public"
  - name: "Private"
  - name: "Confidential"
- name: "OnlineMeetingProvider"
  description: "Service used to host the event’s online meeting."
  data:
  - name: "Zoom"
  - name: "Teams"
  - name: "Meet"
  - name: "Webex"
  - name: "Other"
- name: "AttendeeRole"
  description: "Role of an attendee in an event."
  data:
  - name: "Required"
  - name: "Optional"
  - name: "Resource"
  - name: "Organizer"
- name: "AttendanceStatus"
  description: "Response of an attendee to an invitation."
  data:
  - name: "NeedsAction"
  - name: "Accepted"
  - name: "Declined"
  - name: "Tentative"
  - name: "Delegated"
- name: "ReminderMethod"
  description: "Delivery channel for a reminder."
  data:
  - name: "Email"
  - name: "Popup"
  - name: "Push"
  - name: "SMS"
- name: "ReminderRelativeTo"
  description: "Reference point from which reminder offset is calculated."
  data:
  - name: "Start"
  - name: "End"
- name: "ExceptionChangeType"
  description: "Type of modification applied to a recurring event occurrence."
  data:
  - name: "Cancelled"
  - name: "TimeChanged"
  - name: "DetailsChanged"
- name: "AvailabilityType"
  description: "Free or busy state published for scheduling."
  data:
  - name: "Free"
  - name: "Busy"
  - name: "Tentative"
  - name: "OutOfOffice"
- name: "ResourceType"
  description: "Kind of reservable resource."
  data:
  - name: "Room"
  - name: "Equipment"
  - name: "Desk"
  - name: "Other"
- name: "SubscriptionFormat"
  description: "Protocol or format of an external calendar feed."
  data:
  - name: "ICS"
  - name: "CalDAV"
  - name: "WebCal"
  - name: "Other"
- name: "SyncStatus"
  description: "State of the most recent synchronization attempt."
  data:
  - name: "Pending"
  - name: "Success"
  - name: "Failed"
  - name: "Disabled"
- name: "RecurrenceFrequency"
  description: "Base frequency for a recurrence pattern."
  data:
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Yearly"
- name: "DayOfWeek"
  description: "Days of the week used for scheduling and recurrence rules."
  data:
  - name: "Monday"
  - name: "Tuesday"
  - name: "Wednesday"
  - name: "Thursday"
  - name: "Friday"
  - name: "Saturday"
  - name: "Sunday"
valueObjects:
- name: "EmailAddress"
  description: "Standard email address for messaging and invitations."
  data:
  - name: "value"
    type: "String"
- name: "Url"
  description: "Fully-qualified URL for links and external resources."
  data:
  - name: "value"
    type: "String"
- name: "Place"
  description: "Physical or virtual location for an event."
  data:
  - name: "name"
    type: "String"
  - name: "address"
    type: "String"
  - name: "room"
    type: "String"
  - name: "latitude"
    type: "Decimal"
  - name: "longitude"
    type: "Decimal"
- name: "RecurrencePattern"
  description: "Rule describing how an event repeats over time."
  data:
  - name: "frequency"
    type: "RecurrenceFrequency"
  - name: "interval"
    type: "Integer"
  - name: "count"
    type: "Integer"
  - name: "until"
    type: "Date"
  - name: "byWeekday"
    type: "DayOfWeek"
  - name: "byMonthDay"
    type: "Integer"
  - name: "byMonth"
    type: "Integer"
- name: "TimeOfDay"
  description: "Wall-clock time independent of date and time zone."
  data:
  - name: "hour"
    type: "Integer"
  - name: "minute"
    type: "Integer"
  - name: "second"
    type: "Integer"
