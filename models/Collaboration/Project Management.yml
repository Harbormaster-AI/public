  - name: "Approved"
  - name: "InProgress"
  - name: "Verified"
  - name: "Deferred"
  - name: "Dropped"
- name: "RiskLikelihood"
  description: "Estimated probability of a risk event occurring."
  data:
  - name: "Rare"
  - name: "Unlikely"
  - name: "Possible"
  - name: "Likely"
  - name: "AlmostCertain"
- name: "RiskImpact"
  description: "Estimated magnitude of effect on objectives if a risk occurs."
  data:
  - name: "Low"
  - name: "Moderate"
  - name: "High"
  - name: "Critical"
- name: "RiskStatus"
  description: "Tracking state for risk handling and closure."
  data:
  - name: "Open"
  - name: "Mitigated"
  - name: "Accepted"
  - name: "Transferred"
  - name: "Closed"
- name: "IssueSeverity"
