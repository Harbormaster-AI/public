  - name: "Major"
  - name: "Critical"
  - name: "Blocker"
- name: "IssueStatus"
  description: "Progress and resolution states for issues."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "Resolved"
  - name: "Verified"
  - name: "Closed"
  - name: "Reopened"
- name: "DependencyType"
  description: "Type of scheduling relationship between tasks."
