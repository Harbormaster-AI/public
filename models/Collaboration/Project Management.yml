    type: "String"
  - name: "purpose"
    type: "String"
  - name: "teamType"
    type: "TeamType"
  - name: "workingAgreement"
    type: "String"
  relations:
  - name: "members"
    type: "Person"
    multiplicity: "ManyToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
- name: "Person"
  description: "Individual contributing to or governing project work, such as managers,\
    \ team members, and stakeholders."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "role"
    type: "Role"
  - name: "location"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "capacityPerWeekHours"
    type: "Decimal"
  - name: "hourlyRate"
    type: "Money"
  relations:
  - name: "manager"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "tasks"
    type: "Task"
    multiplicity: "ManyToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "timesheets"
    type: "Timesheet"
    multiplicity: "OneToMany"
- name: "Phase"
  description: "Major segment of the project lifecycle that groups related activities\
    \ and deliverables."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "PhaseStatus"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "Task"
    multiplicity: "OneToMany"
  - name: "milestones"
    type: "Milestone"
    multiplicity: "OneToMany"
- name: "Milestone"
  description: "Significant point or event in the project schedule used to track progress."
  data:
  - name: "name"
    type: "String"
  - name: "targetDate"
    type: "Date"
  - name: "status"
    type: "MilestoneStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "phase"
    type: "Phase"
    multiplicity: "ManyToOne"
- name: "Sprint"
  description: "Timeboxed iteration for planning, executing, and reviewing a subset\
    \ of work."
  data:
  - name: "name"
    type: "String"
  - name: "sprintNumber"
    type: "Integer"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "goal"
    type: "String"
  - name: "status"
    type: "SprintStatus"
  - name: "capacityHours"
    type: "Decimal"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "Task"
    multiplicity: "OneToMany"
- name: "Task"
  description: "Unit of planned work with defined scope, estimate, and acceptance\
    \ criteria."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "taskNumber"
    type: "String"
  - name: "taskType"
    type: "TaskType"
  - name: "status"
    type: "TaskStatus_"
  - name: "priority"
    type: "Priority"
  - name: "startDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "estimateHours"
    type: "Decimal"
  - name: "remainingHours"
    type: "Decimal"
  - name: "percentComplete"
    type: "Decimal"
  - name: "storyPoints"
    type: "Integer"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "phase"
    type: "Phase"
    multiplicity: "ManyToOne"
  - name: "parentTask"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "subtasks"
    type: "Task"
    multiplicity: "OneToMany"
  - name: "assignees"
    type: "Person"
    multiplicity: "ManyToMany"
  - name: "dependencies"
    type: "Dependency"
    multiplicity: "OneToMany"
  - name: "sprint"
    type: "Sprint"
    multiplicity: "ManyToOne"
  - name: "deliverables"
    type: "Deliverable"
    multiplicity: "ManyToMany"
  - name: "requirements"
    type: "Requirement"
    multiplicity: "ManyToMany"
- name: "Dependency"
  description: "Logical relationship that constrains the scheduling of related tasks."
  data:
  - name: "type"
    type: "DependencyType"
  - name: "lagDays"
    type: "Integer"
  - name: "notes"
    type: "String"
  relations:
  - name: "predecessor"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "successor"
    type: "Task"
    multiplicity: "ManyToOne"
- name: "Deliverable"
  description: "Verifiable outcome or artifact produced by project work."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "acceptanceCriteria"
    type: "String"
  - name: "status"
    type: "DeliverableStatus"
  - name: "dueDate"
    type: "Date"
  - name: "version"
    type: "String"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "Task"
    multiplicity: "ManyToMany"
- name: "Approval"
  description: "Formal decision recorded for a deliverable by an authorized person."
  data:
  - name: "decision"
    type: "ApprovalStatus"
  - name: "decisionDate"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "deliverable"
    type: "Deliverable"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Person"
    multiplicity: "ManyToOne"
- name: "Requirement"
  description: "Condition or capability needed by a stakeholder to solve a problem\
    \ or achieve an objective."
  data:
  - name: "requirementKey"
    type: "String"
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "priority"
    type: "Priority"
  - name: "status"
    type: "RequirementStatus"
  - name: "source"
    type: "String"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "Task"
    multiplicity: "ManyToMany"
- name: "Risk"
  description: "Uncertain event or condition that, if it occurs, has a positive or\
    \ negative effect on project objectives."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "likelihood"
    type: "RiskLikelihood"
  - name: "impact"
    type: "RiskImpact"
  - name: "status"
    type: "RiskStatus"
  - name: "mitigationPlan"
    type: "String"
  - name: "targetResponseDate"
    type: "Date"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "relatedTasks"
    type: "Task"
    multiplicity: "ManyToMany"
  - name: "relatedIssues"
    type: "Issue"
    multiplicity: "ManyToMany"
- name: "Issue"
  description: "Current problem or obstacle requiring action to prevent or resolve\
    \ negative impact on the project."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "severity"
    type: "IssueSeverity"
  - name: "status"
    type: "IssueStatus"
  - name: "reportedDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "relatedRisk"
    type: "Risk"
    multiplicity: "ManyToOne"
  - name: "relatedTask"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "affectedDeliverables"
    type: "Deliverable"
    multiplicity: "ManyToMany"
- name: "ChangeRequest"
  description: "Formal proposal to modify an aspect of the project baseline or scope."
  data:
  - name: "changeNumber"
    type: "String"
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "changeType"
    type: "ChangeType"
  - name: "status"
    type: "ChangeRequestStatus"
  - name: "submittedDate"
    type: "Date"
  - name: "decisionDate"
    type: "Date"
  - name: "costImpact"
    type: "Money"
  - name: "scheduleImpactDays"
    type: "Integer"
  - name: "scopeImpact"
    type: "String"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "requestedBy"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "decisionBy"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "affectedTasks"
    type: "Task"
    multiplicity: "ManyToMany"
  - name: "affectedDeliverables"
    type: "Deliverable"
    multiplicity: "ManyToMany"
- name: "Timesheet"
  description: "Periodic record of hours worked by a person across tasks."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "status"
    type: "TimesheetStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "person"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "entries"
    type: "TimeEntry"
    multiplicity: "OneToMany"
- name: "TimeEntry"
  description: "Daily record of effort applied to a task with classification of work\
    \ type."
  data:
  - name: "entryDate"
    type: "Date"
  - name: "hours"
    type: "Decimal"
  - name: "workType"
    type: "WorkType"
  - name: "notes"
    type: "String"
  - name: "billable"
    type: "Boolean"
  relations:
  - name: "timesheet"
    type: "Timesheet"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "Task"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
- name: "Expense"
  description: "Cost incurred and recorded against a project for budgeting and reimbursement\
    \ purposes."
  data:
  - name: "description"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "expenseDate"
    type: "Date"
  - name: "category"
    type: "ExpenseCategory"
  - name: "status"
    type: "ExpenseStatus"
  - name: "billable"
    type: "Boolean"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "submittedBy"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "approvedBy"
    type: "Person"
    multiplicity: "ManyToOne"
enums:
- name: "PortfolioStatus"
  description: "Lifecycle states for managing a portfolio of investments."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "OnHold"
  - name: "Completed"
  - name: "Archived"
- name: "ProgramStatus"
  description: "Lifecycle states for coordinated programs of projects."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "OnHold"
  - name: "Completed"
  - name: "Archived"
- name: "ProjectStatus"
  description: "Phases and control states indicating project progress."
  data:
  - name: "Initiating"
  - name: "Planning"
  - name: "Executing"
  - name: "Monitoring"
  - name: "Closing"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "ProjectHealth"
  description: "Overall status indicator summarizing delivery risk and performance."
  data:
  - name: "OnTrack"
  - name: "AtRisk"
  - name: "OffTrack"
- name: "DeliveryApproach"
  description: "Framework guiding how work is structured and executed."
  data:
  - name: "Agile"
  - name: "Waterfall"
  - name: "Hybrid"
- name: "PhaseStatus"
  description: "Execution state of a project phase."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Completed"
  - name: "Blocked"
- name: "MilestoneStatus"
  description: "Achievement status of a milestone."
  data:
  - name: "Planned"
  - name: "Achieved"
  - name: "Missed"
  - name: "Deferred"
- name: "TaskStatus_"
  description: "Progress state of a task."
