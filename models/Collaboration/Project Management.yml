  - name: "Feature"
  - name: "Bug"
  - name: "Chore"
  - name: "Research"
  - name: "Spike"
  - name: "Documentation"
- name: "Priority"
  description: "Relative importance used to order execution of work."
  data:
  - name: "Lowest"
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Highest"
- name: "SprintStatus"
  description: "Lifecycle state of an iteration."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "Completed"
  - name: "Cancelled"
- name: "DeliverableStatus"
  description: "Review and release states for deliverables."
  data:
