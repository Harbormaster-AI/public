---
metadata:
  name: "HCIDL Project Management Capabilities Model"
  description: "A capabilities model for planning, executing, and governing portfolios,\
    \ programs, and projects with collaborative controls over scope, schedule, cost,\
    \ resources, risks, and changes."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Collaboration"
  type: "Capability"
  domain: "Project Management"
entities:
- name: "Portfolio"
  description: "Collection of programs and projects aligned to strategic themes and\
    \ investment objectives."
  data:
  - name: "name"
    type: "String"
  - name: "vision"
    type: "String"
  - name: "strategyTheme"
    type: "String"
  - name: "status"
    type: "PortfolioStatus"
  relations:
  - name: "sponsor"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "stakeholders"
    type: "Person"
    multiplicity: "ManyToMany"
  - name: "programs"
    type: "Program"
    multiplicity: "OneToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
- name: "Program"
  description: "Coordinated set of related projects managed to obtain benefits and\
    \ control not available from managing them individually."
  data:
  - name: "name"
    type: "String"
  - name: "summary"
    type: "String"
  - name: "priority"
    type: "Priority"
  - name: "status"
    type: "ProgramStatus"
  - name: "schedule"
    type: "DateRange"
  - name: "budget"
    type: "Money"
  relations:
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
  - name: "manager"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "stakeholders"
    type: "Person"
    multiplicity: "ManyToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
- name: "Project"
  description: "Temporary endeavor undertaken to create a unique product, service,\
    \ or result under defined scope, schedule, and budget."
  data:
  - name: "name"
    type: "String"
  - name: "projectCode"
    type: "String"
  - name: "description"
    type: "String"
  - name: "deliveryApproach"
    type: "DeliveryApproach"
  - name: "priority"
    type: "Priority"
  - name: "status"
    type: "ProjectStatus"
  - name: "health"
    type: "ProjectHealth"
  - name: "startDate"
    type: "Date"
  - name: "targetEndDate"
    type: "Date"
  - name: "baseline"
    type: "DateRange"
  - name: "budget"
    type: "Money"
  relations:
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
  - name: "program"
    type: "Program"
    multiplicity: "ManyToOne"
  - name: "sponsor"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "manager"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "phases"
    type: "Phase"
    multiplicity: "OneToMany"
  - name: "milestones"
    type: "Milestone"
    multiplicity: "OneToMany"
  - name: "sprints"
    type: "Sprint"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "Task"
    multiplicity: "OneToMany"
  - name: "requirements"
    type: "Requirement"
    multiplicity: "OneToMany"
  - name: "deliverables"
    type: "Deliverable"
    multiplicity: "OneToMany"
  - name: "risks"
    type: "Risk"
    multiplicity: "OneToMany"
  - name: "issues"
    type: "Issue"
    multiplicity: "OneToMany"
  - name: "changeRequests"
    type: "ChangeRequest"
    multiplicity: "OneToMany"
  - name: "timesheets"
    type: "Timesheet"
    multiplicity: "OneToMany"
  - name: "expenses"
    type: "Expense"
    multiplicity: "OneToMany"
- name: "Team"
  description: "Group of people with complementary skills collaborating to deliver\
    \ project outcomes."
