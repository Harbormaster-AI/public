---
metadata:
  name: "Message Queue Capabilities Model"
  description: "Canonical HCIDL model for designing, operating, and governing message\
    \ queue platforms, covering brokers, namespaces, queues, exchanges, topics, routing,\
    \ security, and operational telemetry."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Integration"
  type: "Capability"
  domain: "Message Queue"
entities:
- name: "BrokerCluster"
  description: "Logical grouping of broker nodes operated as a single messaging fabric."
  data:
  - name: "name"
    type: "String"
  - name: "vendor"
    type: "String"
  - name: "version"
    type: "String"
  - name: "deploymentType"
    type: "DeploymentType"
  - name: "managementEndpoint"
    type: "String"
  - name: "defaultRetentionHours"
    type: "Integer"
  - name: "encryptionAtRest"
    type: "Boolean"
  relations:
  - name: "brokerNodes"
    type: "BrokerNode"
    multiplicity: "OneToMany"
  - name: "namespaces"
    type: "MessagingNamespace"
    multiplicity: "OneToMany"
  - name: "users"
    type: "UserAccount"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "MonitoringAlert"
    multiplicity: "OneToMany"
  - name: "routes"
    type: "MessageRoute"
    multiplicity: "OneToMany"
- name: "BrokerNode"
  description: "Individual server instance participating in a broker cluster."
  data:
  - name: "hostname"
    type: "String"
  - name: "role"
    type: "NodeRole"
  - name: "status"
    type: "NodeStatus"
  - name: "capacityUnits"
    type: "Integer"
  relations:
  - name: "cluster"
    type: "BrokerCluster"
    multiplicity: "ManyToOne"
  - name: "connections"
    type: "ClientConnection"
    multiplicity: "OneToMany"
- name: "MessagingNamespace"
  description: "Administrative and logical isolation boundary for queues, topics,\
    \ and exchanges."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "maxConnections"
    type: "Integer"
  - name: "tlsSettings"
    type: "TLSSettings"
  relations:
  - name: "cluster"
    type: "BrokerCluster"
    multiplicity: "ManyToOne"
  - name: "exchanges"
    type: "Exchange"
    multiplicity: "OneToMany"
  - name: "queues"
    type: "Queue"
    multiplicity: "OneToMany"
  - name: "topics"
    type: "Topic"
    multiplicity: "OneToMany"
  - name: "accessPolicies"
    type: "AccessControlPolicy"
    multiplicity: "OneToMany"
  - name: "quotaProfiles"
    type: "QuotaProfile"
    multiplicity: "OneToMany"
- name: "Exchange"
  description: "AMQP-style routing component that distributes messages to queues based\
    \ on bindings."
  data:
  - name: "name"
    type: "String"
  - name: "exchangeType"
    type: "ExchangeType"
  - name: "autoDelete"
    type: "Boolean"
  - name: "internal"
    type: "Boolean"
  relations:
  - name: "namespace"
    type: "MessagingNamespace"
    multiplicity: "ManyToOne"
  - name: "bindings"
    type: "Binding"
    multiplicity: "OneToMany"
  - name: "producers"
    type: "ProducerApplication"
    multiplicity: "ManyToMany"
- name: "Queue"
  description: "FIFO buffer that stores messages for reliable, point-to-point consumption."
  data:
  - name: "name"
    type: "String"
  - name: "durability"
    type: "Durability"
  - name: "deliveryMode"
    type: "DeliveryMode"
  - name: "messageTtlSeconds"
    type: "Integer"
  - name: "maxLength"
    type: "Integer"
  relations:
  - name: "namespace"
    type: "MessagingNamespace"
    multiplicity: "ManyToOne"
  - name: "bindings"
    type: "Binding"
    multiplicity: "OneToMany"
  - name: "policy"
    type: "QueuePolicy"
    multiplicity: "OneToOne"
  - name: "deadLetterPolicy"
    type: "DeadLetterPolicy"
    multiplicity: "OneToOne"
  - name: "consumers"
    type: "ConsumerApplication"
    multiplicity: "OneToMany"
  - name: "producers"
    type: "ProducerApplication"
    multiplicity: "ManyToMany"
  - name: "alerts"
    type: "MonitoringAlert"
    multiplicity: "OneToMany"
- name: "Binding"
  description: "Routing rule linking an exchange to a queue with an optional pattern\
    \ or filter."
  data:
  - name: "routingKey"
    type: "String"
  - name: "priority"
    type: "Integer"
  - name: "filterExpression"
    type: "String"
  relations:
  - name: "exchange"
    type: "Exchange"
    multiplicity: "ManyToOne"
  - name: "queue"
    type: "Queue"
    multiplicity: "ManyToOne"
- name: "Topic"
  description: "Publish-subscribe destination that fans out messages to subscribers."
  data:
  - name: "name"
    type: "String"
  - name: "orderingGuarantee"
    type: "OrderingGuarantee"
  - name: "description"
    type: "String"
  relations:
  - name: "namespace"
    type: "MessagingNamespace"
    multiplicity: "ManyToOne"
  - name: "subscriptions"
    type: "TopicSubscription"
    multiplicity: "OneToMany"
  - name: "producers"
    type: "ProducerApplication"
    multiplicity: "ManyToMany"
- name: "TopicSubscription"
  description: "Delivery contract from a topic to a durable or ephemeral consumer\
    \ target."
  data:
  - name: "name"
    type: "String"
  - name: "subscriptionType"
    type: "SubscriptionType"
  - name: "filterExpression"
    type: "String"
  - name: "ackMode"
    type: "AckMode"
  relations:
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
  - name: "targetQueue"
    type: "Queue"
    multiplicity: "ManyToOne"
- name: "ProducerApplication"
  description: "Software component that publishes messages to exchanges, topics, or\
    \ queues."
  data:
  - name: "name"
    type: "String"
  - name: "language"
    type: "String"
  - name: "libraryVersion"
    type: "String"
  - name: "rateLimitPerSecond"
    type: "Integer"
  relations:
  - name: "targetExchanges"
    type: "Exchange"
    multiplicity: "ManyToMany"
  - name: "targetQueues"
    type: "Queue"
    multiplicity: "ManyToMany"
  - name: "topics"
    type: "Topic"
    multiplicity: "ManyToMany"
  - name: "connections"
    type: "ClientConnection"
    multiplicity: "OneToMany"
- name: "ConsumerApplication"
  description: "Software component that receives and acknowledges messages from queues\
    \ or subscriptions."
  data:
  - name: "name"
    type: "String"
  - name: "ackMode"
    type: "AckMode"
  - name: "prefetchCount"
    type: "Integer"
  - name: "maxConcurrency"
    type: "Integer"
  - name: "redeliveryDelaySeconds"
    type: "Integer"
  relations:
  - name: "targetQueues"
    type: "Queue"
    multiplicity: "ManyToMany"
  - name: "subscriptions"
    type: "TopicSubscription"
    multiplicity: "ManyToMany"
  - name: "connections"
    type: "ClientConnection"
    multiplicity: "OneToMany"
- name: "ClientConnection"
  description: "Live or historical network session between a client and the broker."
  data:
  - name: "sessionLabel"
    type: "String"
  - name: "protocol"
    type: "MessagingProtocol"
  - name: "endpoint"
    type: "Endpoint"
  - name: "connectedAt"
    type: "Date"
  - name: "isSecure"
    type: "Boolean"
  relations:
  - name: "namespace"
    type: "MessagingNamespace"
    multiplicity: "ManyToOne"
  - name: "brokerNode"
    type: "BrokerNode"
    multiplicity: "ManyToOne"
  - name: "producer"
    type: "ProducerApplication"
    multiplicity: "ManyToOne"
  - name: "consumer"
    type: "ConsumerApplication"
    multiplicity: "ManyToOne"
- name: "Message"
  description: "Logical representation of a published unit of data managed by the\
    \ broker."
  data:
  - name: "properties"
    type: "MessageProperties"
  - name: "sizeBytes"
    type: "Integer"
  - name: "payloadFormat"
    type: "PayloadFormat"
  - name: "persistence"
    type: "DeliveryMode"
  - name: "priority"
    type: "Integer"
  - name: "expirationSeconds"
    type: "Integer"
  - name: "publishedDate"
    type: "Date"
  relations:
  - name: "queue"
    type: "Queue"
    multiplicity: "ManyToOne"
  - name: "exchange"
    type: "Exchange"
    multiplicity: "ManyToOne"
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
  - name: "producer"
    type: "ProducerApplication"
    multiplicity: "ManyToOne"
  - name: "deliveryAttempts"
    type: "DeliveryAttempt"
    multiplicity: "OneToMany"
- name: "DeliveryAttempt"
  description: "Outcome record for delivering a message to a consumer."
  data:
  - name: "attemptNumber"
    type: "Integer"
  - name: "status"
    type: "DeliveryStatus"
  - name: "deliveryDate"
    type: "Date"
  - name: "redelivered"
    type: "Boolean"
  relations:
  - name: "message"
    type: "Message"
    multiplicity: "ManyToOne"
  - name: "consumer"
    type: "ConsumerApplication"
    multiplicity: "ManyToOne"
  - name: "queue"
    type: "Queue"
    multiplicity: "ManyToOne"
  - name: "connection"
    type: "ClientConnection"
    multiplicity: "ManyToOne"
- name: "DeadLetterPolicy"
  description: "Configuration controlling the handling of undeliverable or expired\
    \ messages."
  data:
  - name: "handlingStrategy"
    type: "DeadLetterHandling"
  - name: "deadLetterQueueName"
    type: "String"
  - name: "maxDeliveryAttempts"
    type: "Integer"
  - name: "requeueDelaySeconds"
    type: "Integer"
  relations:
  - name: "queue"
    type: "Queue"
    multiplicity: "ManyToOne"
  - name: "deadLetterQueue"
    type: "Queue"
    multiplicity: "ManyToOne"
- name: "QueuePolicy"
  description: "Advanced settings that govern retention, ordering, and compression\
    \ behavior for a queue."
  data:
  - name: "retentionHours"
    type: "Integer"
  - name: "orderingGuarantee"
    type: "OrderingGuarantee"
  - name: "maxQueueLength"
    type: "Integer"
  - name: "compressionType"
    type: "CompressionType"
  relations:
  - name: "queue"
    type: "Queue"
    multiplicity: "ManyToOne"
- name: "AccessControlPolicy"
  description: "Authorization rule granting or denying operations on messaging resources."
  data:
  - name: "name"
    type: "String"
  - name: "permission"
    type: "PermissionType"
  - name: "principalType"
    type: "PrincipalType"
  - name: "principalReference"
    type: "String"
  - name: "resourcePattern"
    type: "String"
  - name: "allowed"
    type: "Boolean"
  relations:
  - name: "namespace"
    type: "MessagingNamespace"
    multiplicity: "ManyToOne"
  - name: "queue"
    type: "Queue"
    multiplicity: "ManyToOne"
  - name: "exchange"
    type: "Exchange"
    multiplicity: "ManyToOne"
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "UserAccount"
    multiplicity: "ManyToOne"
- name: "UserAccount"
  description: "Logical user used to authenticate and manage permissions on the broker."
  data:
  - name: "username"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "authMethod"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "cluster"
    type: "BrokerCluster"
    multiplicity: "ManyToOne"
  - name: "namespaces"
    type: "MessagingNamespace"
    multiplicity: "ManyToMany"
  - name: "accessPolicies"
    type: "AccessControlPolicy"
    multiplicity: "OneToMany"
- name: "QuotaProfile"
  description: "Resource limits applied to a namespace to control capacity and throughput."
  data:
  - name: "name"
    type: "String"
  - name: "maxQueues"
    type: "Integer"
  - name: "maxConnections"
    type: "Integer"
  - name: "maxStorageMB"
    type: "Integer"
  - name: "maxThroughputPerSecond"
    type: "Integer"
  relations:
  - name: "namespace"
    type: "MessagingNamespace"
    multiplicity: "ManyToOne"
- name: "MessageRoute"
  description: "Managed bridge that moves messages between messaging resources or\
    \ environments."
  data:
  - name: "name"
    type: "String"
  - name: "routeType"
    type: "RouteType"
  - name: "status"
    type: "RouteStatus"
  - name: "sourceEndpoint"
    type: "Endpoint"
  - name: "targetEndpoint"
    type: "Endpoint"
  - name: "retryPolicy"
    type: "RetryPolicy"
  - name: "transformScript"
    type: "String"
  relations:
  - name: "cluster"
    type: "BrokerCluster"
    multiplicity: "ManyToOne"
  - name: "sourceNamespace"
    type: "MessagingNamespace"
    multiplicity: "ManyToOne"
  - name: "targetNamespace"
    type: "MessagingNamespace"
    multiplicity: "ManyToOne"
  - name: "sourceQueue"
    type: "Queue"
    multiplicity: "ManyToOne"
  - name: "targetQueue"
    type: "Queue"
    multiplicity: "ManyToOne"
- name: "MonitoringAlert"
  description: "Condition and state for operational thresholds across messaging components."
  data:
  - name: "name"
    type: "String"
  - name: "severity"
    type: "AlertSeverity"
  - name: "metric"
    type: "MetricType"
  - name: "threshold"
    type: "Decimal"
  - name: "active"
    type: "Boolean"
  - name: "lastTriggered"
    type: "Date"
  - name: "evaluationWindow"
    type: "TimeWindow"
  relations:
  - name: "cluster"
    type: "BrokerCluster"
    multiplicity: "ManyToOne"
  - name: "namespace"
    type: "MessagingNamespace"
    multiplicity: "ManyToOne"
  - name: "queue"
    type: "Queue"
    multiplicity: "ManyToOne"
- name: "AuditRecord"
  description: "Immutable trace of administrative and client actions for compliance."
  data:
  - name: "actor"
    type: "String"
  - name: "action"
    type: "String"
  - name: "targetResource"
    type: "String"
  - name: "eventDate"
    type: "Date"
  - name: "outcome"
    type: "String"
  - name: "details"
    type: "String"
  relations:
  - name: "namespace"
    type: "MessagingNamespace"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "UserAccount"
    multiplicity: "ManyToOne"
enums:
- name: "DeploymentType"
  description: "Supported deployment models for the broker control plane and data\
    \ plane."
  data:
  - name: "SingleNode"
  - name: "Clustered"
  - name: "ManagedService"
- name: "NodeRole"
  description: "Functional responsibility of a broker node in a clustered environment."
  data:
  - name: "Leader"
  - name: "Follower"
  - name: "Controller"
  - name: "Storage"
- name: "NodeStatus"
  description: "Lifecycle and health state of a broker node."
  data:
  - name: "Starting"
  - name: "Running"
  - name: "Draining"
  - name: "Stopped"
  - name: "Degraded"
- name: "Durability"
  description: "Persistence characteristics of a queue."
  data:
  - name: "Durable"
  - name: "Transient"
- name: "DeliveryMode"
  description: "Persistence behavior for individual messages."
  data:
  - name: "Persistent"
  - name: "NonPersistent"
- name: "ExchangeType"
  description: "Routing semantics implemented by an exchange."
  data:
  - name: "Direct"
  - name: "Fanout"
  - name: "Topic"
  - name: "Headers"
- name: "AckMode"
  description: "Message acknowledgment strategy used by consumers."
  data:
  - name: "Auto"
  - name: "Client"
  - name: "Transaction"
- name: "OrderingGuarantee"
  description: "Ordering promises provided during message delivery."
  data:
  - name: "None"
  - name: "FIFO"
  - name: "PerKey"
- name: "MessagingProtocol"
  description: "Wire protocols supported for client connections."
  data:
  - name: "AMQP091"
  - name: "AMQP10"
  - name: "MQTT"
  - name: "STOMP"
  - name: "JMS"
  - name: "HTTPBridge"
- name: "PermissionType"
  description: "Category of access right that can be granted to a principal."
  data:
  - name: "Publish"
  - name: "Consume"
  - name: "Configure"
  - name: "Manage"
- name: "PrincipalType"
  description: "Type of actor to which an access policy applies."
  data:
  - name: "User"
  - name: "Application"
  - name: "ServiceAccount"
- name: "AlertSeverity"
  description: "Criticality of an operational alert condition."
  data:
  - name: "Info"
  - name: "Warning"
  - name: "Critical"
- name: "MetricType"
  description: "Broker and queue performance indicators monitored for alerts."
  data:
  - name: "QueueDepth"
  - name: "ConsumerLag"
  - name: "ThroughputIn"
  - name: "ThroughputOut"
  - name: "ConnectionCount"
  - name: "MessageRate"
- name: "RouteType"
  description: "Mechanism used to transfer messages between endpoints."
  data:
  - name: "Bridge"
  - name: "Mirror"
  - name: "Shovel"
- name: "RouteStatus"
  description: "Lifecycle status of a configured message route."
  data:
  - name: "Creating"
  - name: "Active"
  - name: "Paused"
  - name: "Failed"
  - name: "Deleted"
- name: "TransactionStatus"
  description: "State transitions for message publishing transactions."
  data:
  - name: "Begun"
  - name: "Committed"
  - name: "RolledBack"
  - name: "TimedOut"
- name: "DeliveryStatus"
  description: "Result of an individual delivery attempt to a consumer."
  data:
  - name: "Pending"
  - name: "Acknowledged"
  - name: "Rejected"
  - name: "Requeued"
  - name: "Expired"
  - name: "DeadLettered"
- name: "SubscriptionType"
  description: "Consumer sharing model for topic subscriptions."
  data:
  - name: "Exclusive"
  - name: "Shared"
  - name: "Failover"
- name: "DeadLetterHandling"
  description: "Policy for processing undeliverable or expired messages."
  data:
  - name: "Requeue"
  - name: "RouteToQueue"
  - name: "Discard"
- name: "PayloadFormat"
  description: "Structure and encoding of message payload content."
  data:
  - name: "Text"
  - name: "Binary"
  - name: "JSON"
  - name: "Avro"
  - name: "Protobuf"
  - name: "XML"
- name: "CompressionType"
  description: "Algorithm applied to compress messages at rest or in transit."
  data:
  - name: "None"
  - name: "Gzip"
  - name: "Snappy"
  - name: "LZ4"
  - name: "Zstd"
valueObjects:
- name: "Endpoint"
  description: "Network location descriptor for connecting to messaging resources."
  data:
  - name: "scheme"
    type: "String"
  - name: "host"
    type: "String"
  - name: "port"
    type: "Integer"
  - name: "path"
    type: "String"
- name: "MessageProperties"
  description: "Common metadata attributes carried alongside a message payload."
  data:
  - name: "contentType"
    type: "String"
  - name: "contentEncoding"
    type: "String"
  - name: "correlationKey"
    type: "String"
  - name: "replyTo"
    type: "String"
- name: "RetryPolicy"
  description: "Rules controlling retry behavior for message transfer operations."
  data:
  - name: "maxAttempts"
    type: "Integer"
  - name: "backoffSeconds"
    type: "Integer"
  - name: "jitterEnabled"
    type: "Boolean"
- name: "TLSSettings"
  description: "Transport layer security configuration applied to client connections."
  data:
  - name: "tlsEnabled"
    type: "Boolean"
  - name: "certificateIssuer"
    type: "String"
  - name: "trustedStoreReference"
    type: "String"
- name: "TimeWindow"
  description: "Time period used when evaluating alert conditions or reports."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
