---
metadata:
  name: "Data Synchronization Capabilities Model"
  description: "Canonical capability model for configuring, executing, monitoring,\
    \ and governing data synchronization across heterogeneous systems and data platforms."
  version: "1.0.0"
  industry: "Information Technology"
  category: "Integration"
  type: "Capability"
  domain: "Data Synchronization"
entities:
- name: "SystemEndpoint"
  description: "Logical representation of an external or internal system participating\
    \ in synchronization, including role, protocol, and connectivity details."
  data:
  - name: "name"
    type: "String"
  - name: "role"
    type: "EndpointRole"
  - name: "protocol"
    type: "TransportProtocol"
  - name: "baseUri"
    type: "URI"
  - name: "status"
    type: "EndpointStatus"
  - name: "vendor"
    type: "String"
  - name: "product"
    type: "String"
  - name: "version"
    type: "String"
  - name: "environment"
    type: "String"
  relations:
  - name: "connectors"
    type: "Connector"
    multiplicity: "ManyToMany"
  - name: "connectionProfiles"
    type: "ConnectionProfile"
    multiplicity: "OneToMany"
  - name: "datasets"
    type: "DataSet"
    multiplicity: "OneToMany"
- name: "Connector"
  description: "Adapter or plugin that enables connectivity and data access for a\
    \ given protocol or platform."
  data:
  - name: "name"
    type: "String"
  - name: "supportedProtocol"
    type: "TransportProtocol"
  - name: "version"
    type: "String"
  - name: "vendor"
    type: "String"
  - name: "supportsChangeDataCapture"
    type: "Boolean"
  - name: "notes"
    type: "String"
  relations:
  - name: "endpoints"
    type: "SystemEndpoint"
    multiplicity: "ManyToMany"
- name: "ConnectionProfile"
  description: "Connection configuration including authentication, encryption, and\
    \ endpoint-specific parameters."
  data:
  - name: "name"
    type: "String"
  - name: "authMethod"
    type: "AuthMethod"
  - name: "credential"
    type: "SecretReference"
  - name: "encryptionMode"
    type: "EncryptionMode"
  - name: "certificateAlias"
    type: "String"
  - name: "parametersYaml"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "endpoint"
    type: "SystemEndpoint"
    multiplicity: "ManyToOne"
- name: "DataSet"
  description: "Logical collection of data to be synchronized such as a table, topic,\
    \ index, or file location."
  data:
  - name: "name"
    type: "String"
  - name: "format"
    type: "DataFormat"
  - name: "locationPath"
    type: "String"
  - name: "primaryKey"
    type: "String"
  - name: "partitioning"
    type: "String"
  - name: "schemaVersion"
    type: "String"
  - name: "cdcMechanism"
    type: "CDCMechanism"
  - name: "retentionDays"
    type: "Integer"
  relations:
  - name: "endpoint"
    type: "SystemEndpoint"
    multiplicity: "ManyToOne"
  - name: "schema"
    type: "DataSchema"
    multiplicity: "ManyToOne"
  - name: "changeFeeds"
    type: "ChangeFeed"
    multiplicity: "OneToMany"
- name: "DataSchema"
  description: "Versioned schema contract describing structure, data types, and constraints\
    \ for a dataset."
  data:
  - name: "name"
    type: "String"
  - name: "schemaDefinition"
    type: "String"
  - name: "checksum"
    type: "String"
  relations:
  - name: "datasets"
    type: "DataSet"
    multiplicity: "OneToMany"
- name: "ChangeFeed"
  description: "Source of incremental changes for a dataset used to drive low-latency\
    \ synchronization."
  data:
  - name: "name"
    type: "String"
  - name: "operationHint"
    type: "String"
  - name: "sequenceField"
    type: "String"
  - name: "initialPosition"
    type: "String"
  - name: "deliverySemantics"
    type: "ConsistencyLevel"
  relations:
  - name: "dataset"
    type: "DataSet"
    multiplicity: "ManyToOne"
  - name: "checkpoints"
    type: "Checkpoint"
    multiplicity: "OneToMany"
- name: "Checkpoint"
  description: "Persisted position and metadata indicating the last processed change\
    \ within a feed for a given job."
  data:
  - name: "token"
    type: "CheckpointToken"
  - name: "lastChangeTime"
    type: "DateTime"
  - name: "lastSequence"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "changeFeed"
    type: "ChangeFeed"
    multiplicity: "ManyToOne"
  - name: "syncJob"
    type: "SyncJob"
    multiplicity: "ManyToOne"
- name: "Transformation"
  description: "Executable logic used to project, cleanse, or enrich data during synchronization."
  data:
  - name: "name"
    type: "String"
  - name: "language"
    type: "TransformationLanguage"
  - name: "script"
    type: "String"
  - name: "version"
    type: "String"
  relations:
  - name: "fieldMappings"
    type: "FieldMapping"
    multiplicity: "OneToMany"
- name: "SchemaMapping"
  description: "Mapping definition between source and target schemas for a synchronization\
    \ job."
  data:
  - name: "name"
    type: "String"
  - name: "mappingVersion"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "sourceSchema"
    type: "DataSchema"
    multiplicity: "ManyToOne"
  - name: "targetSchema"
    type: "DataSchema"
    multiplicity: "ManyToOne"
  - name: "fieldMappings"
    type: "FieldMapping"
    multiplicity: "OneToMany"
- name: "FieldMapping"
  description: "Element-level mapping that links a source path to a target path with\
    \ optional transformation."
  data:
  - name: "sourcePath"
    type: "PathExpression"
  - name: "targetPath"
    type: "PathExpression"
  - name: "defaultValue"
    type: "String"
  - name: "nullable"
    type: "Boolean"
  relations:
  - name: "schemaMapping"
    type: "SchemaMapping"
    multiplicity: "ManyToOne"
  - name: "transformation"
    type: "Transformation"
    multiplicity: "ManyToOne"
- name: "ThrottlePolicy"
  description: "Controls throughput to prevent overloading endpoints, networks, or\
    \ downstream systems."
  data:
  - name: "name"
    type: "String"
  - name: "maxRecordsPerSecond"
    type: "Integer"
  - name: "maxBytesPerSecond"
    type: "Integer"
  - name: "maxConcurrentBatches"
    type: "Integer"
- name: "RetryPolicy"
  description: "Governs how transient failures are retried during synchronization."
  data:
  - name: "name"
    type: "String"
  - name: "strategy"
    type: "RetryStrategy"
  - name: "maxAttempts"
    type: "Integer"
  - name: "backoffInitial"
    type: "Duration"
  - name: "backoffMax"
    type: "Duration"
  - name: "backoffMultiplier"
    type: "Decimal"
  - name: "jitter"
    type: "Boolean"
- name: "SyncPolicy"
  description: "End-to-end policy configuration for a synchronization job including\
    \ mode, direction, batching, and consistency."
  data:
  - name: "name"
    type: "String"
  - name: "mode"
    type: "SyncMode"
  - name: "direction"
    type: "SyncDirection"
  - name: "consistency"
    type: "ConsistencyLevel"
  - name: "conflictStrategy"
    type: "ResolutionStrategy"
  - name: "batchSize"
    type: "Integer"
  - name: "parallelism"
    type: "Integer"
  - name: "compression"
    type: "CompressionType"
  - name: "encryption"
    type: "EncryptionMode"
  - name: "preserveTimestamps"
    type: "Boolean"
  - name: "deleteHandling"
    type: "DeleteHandling"
  relations:
  - name: "throttlePolicy"
    type: "ThrottlePolicy"
    multiplicity: "ManyToOne"
  - name: "retryPolicy"
    type: "RetryPolicy"
    multiplicity: "ManyToOne"
- name: "SynchronizationSchedule"
  description: "Scheduling configuration that determines when a synchronization job\
    \ is triggered."
  data:
  - name: "name"
    type: "String"
  - name: "scheduleType"
    type: "ScheduleType"
  - name: "cron"
    type: "CronExpression"
  - name: "interval"
    type: "Duration"
  - name: "startAfter"
    type: "DateTime"
  - name: "endBefore"
    type: "DateTime"
  - name: "paused"
    type: "Boolean"
- name: "SyncJob"
  description: "Authoritative configuration that binds source and target datasets\
    \ with mapping, policy, and scheduling to perform synchronization."
  data:
  - name: "name"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  - name: "notes"
    type: "String"
  relations:
  - name: "sourceDataset"
    type: "DataSet"
    multiplicity: "ManyToOne"
  - name: "targetDataset"
    type: "DataSet"
    multiplicity: "ManyToOne"
  - name: "mapping"
    type: "SchemaMapping"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "SyncPolicy"
    multiplicity: "ManyToOne"
  - name: "schedule"
    type: "SynchronizationSchedule"
    multiplicity: "ManyToOne"
  - name: "runs"
    type: "SyncRun"
    multiplicity: "OneToMany"
  - name: "checkpoints"
    type: "Checkpoint"
    multiplicity: "OneToMany"
- name: "SyncRun"
  description: "Runtime instance of a synchronization job execution capturing metrics,\
    \ events, and outcomes."
  data:
  - name: "startedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  - name: "status"
    type: "RunStatus"
  - name: "totalRecords"
    type: "Integer"
  - name: "inserted"
    type: "Integer"
  - name: "updated"
    type: "Integer"
  - name: "deleted"
    type: "Integer"
  - name: "skipped"
    type: "Integer"
  - name: "errors"
    type: "Integer"
  - name: "bytesProcessed"
    type: "Integer"
  relations:
  - name: "job"
    type: "SyncJob"
    multiplicity: "ManyToOne"
  - name: "batches"
    type: "SyncBatch"
    multiplicity: "OneToMany"
  - name: "conflicts"
    type: "Conflict"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
  - name: "errorRecords"
    type: "ErrorRecord"
    multiplicity: "OneToMany"
- name: "SyncBatch"
  description: "Sub-unit of a run that groups records for ordered, restartable processing."
  data:
  - name: "sequenceNumber"
    type: "Integer"
  - name: "status"
    type: "BatchStatus"
  - name: "recordCount"
    type: "Integer"
  - name: "byteSize"
    type: "Integer"
  - name: "startedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  relations:
  - name: "run"
    type: "SyncRun"
    multiplicity: "ManyToOne"
- name: "Conflict"
  description: "Detected divergence between source and target changes requiring resolution\
    \ according to policy."
  data:
  - name: "conflictType"
    type: "ConflictType"
  - name: "status"
    type: "ConflictStatus"
  - name: "sourceVersion"
    type: "String"
  - name: "targetVersion"
    type: "String"
  - name: "resolvedStrategy"
    type: "ResolutionStrategy"
  - name: "resolvedAt"
    type: "DateTime"
  - name: "recordKey"
    type: "String"
  relations:
  - name: "run"
    type: "SyncRun"
    multiplicity: "ManyToOne"
- name: "AuditEvent"
  description: "Operational event emitted during synchronization for observability\
    \ and governance."
  data:
  - name: "eventType"
    type: "String"
  - name: "occurredAt"
    type: "DateTime"
  - name: "severity"
    type: "String"
  - name: "message"
    type: "String"
  - name: "details"
    type: "String"
  relations:
  - name: "run"
    type: "SyncRun"
    multiplicity: "ManyToOne"
  - name: "batch"
    type: "SyncBatch"
    multiplicity: "ManyToOne"
- name: "ErrorRecord"
  description: "Failed record with diagnostic information to support replay and troubleshooting."
  data:
  - name: "code"
    type: "String"
  - name: "message"
    type: "String"
  - name: "operation"
    type: "ChangeOperation"
  - name: "recordKey"
    type: "String"
  - name: "payloadPreview"
    type: "String"
  - name: "occurredAt"
    type: "DateTime"
  - name: "suggestion"
    type: "String"
  relations:
  - name: "run"
    type: "SyncRun"
    multiplicity: "ManyToOne"
  - name: "batch"
    type: "SyncBatch"
    multiplicity: "ManyToOne"
enums:
- name: "EndpointRole"
  description: "Role played by an endpoint within a synchronization topology."
  data:
  - name: "Source"
  - name: "Target"
  - name: "Bidirectional"
- name: "TransportProtocol"
  description: "Network or messaging protocol used for data access and transfer."
  data:
  - name: "HTTP"
  - name: "HTTPS"
  - name: "SFTP"
  - name: "JDBC"
  - name: "Kafka"
  - name: "AMQP"
  - name: "MQTT"
  - name: "NATS"
  - name: "SMB"
- name: "EndpointStatus"
  description: "Operational state of an endpoint with respect to synchronization."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Deprecated"
- name: "AuthMethod"
  description: "Authentication mechanism used to access an endpoint."
  data:
  - name: "Basic"
  - name: "OAuth2"
  - name: "ApiKey"
  - name: "AWSIAM"
  - name: "Kerberos"
  - name: "NTLM"
  - name: "SASL"
- name: "DataFormat"
  description: "Data serialization or storage format for a dataset or transfer."
  data:
  - name: "JSON"
  - name: "XML"
  - name: "CSV"
  - name: "Parquet"
  - name: "Avro"
  - name: "Binary"
- name: "CDCMechanism"
  description: "Technique used to identify changes in the source dataset."
  data:
  - name: "Timestamp"
  - name: "VersionNumber"
  - name: "LogBased"
  - name: "TriggerBased"
  - name: "Webhook"
- name: "TransformationLanguage"
  description: "Expression or scripting language used to transform data."
  data:
  - name: "SQL"
  - name: "JQ"
  - name: "JSONata"
  - name: "JMESPath"
  - name: "XPath"
  - name: "Groovy"
- name: "SyncMode"
  description: "Strategy for moving data during synchronization."
  data:
  - name: "FullLoad"
  - name: "IncrementalLoad"
  - name: "ChangeDataCapture"
- name: "SyncDirection"
  description: "Directionality of data movement between source and target systems."
  data:
  - name: "Unidirectional"
  - name: "Bidirectional"
- name: "ConsistencyLevel"
  description: "Delivery and processing guarantees for moved data."
  data:
  - name: "AtLeastOnce"
  - name: "AtMostOnce"
  - name: "ExactlyOnce"
  - name: "Eventual"
  - name: "Strong"
- name: "ResolutionStrategy"
  description: "Policy used to resolve detected conflicts."
  data:
  - name: "LastWriteWins"
  - name: "SourceWins"
  - name: "TargetWins"
  - name: "Custom"
- name: "CompressionType"
  description: "Compression algorithm applied during transfer or storage."
  data:
  - name: "None"
  - name: "Gzip"
  - name: "Snappy"
  - name: "Zstd"
- name: "EncryptionMode"
  description: "Encryption method used for data in transit or at rest."
  data:
  - name: "None"
  - name: "TLS"
  - name: "ClientSide"
  - name: "ServerSide"
- name: "DeleteHandling"
  description: "Behavior when a delete operation is detected in the source."
  data:
  - name: "HardDelete"
  - name: "SoftDelete"
  - name: "Ignore"
- name: "ScheduleType"
  description: "Triggering mode for synchronization execution."
  data:
  - name: "Cron"
  - name: "Interval"
  - name: "EventDriven"
  - name: "Manual"
- name: "RunStatus"
  description: "Lifecycle state of a synchronization run."
  data:
  - name: "Pending"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Cancelled"
  - name: "PartiallySucceeded"
- name: "BatchStatus"
  description: "Processing state of a synchronization batch within a run."
  data:
  - name: "Pending"
  - name: "Processing"
  - name: "Completed"
  - name: "Failed"
  - name: "Retried"
  - name: "Skipped"
- name: "ConflictType"
  description: "Nature of divergence encountered between source and target data."
  data:
  - name: "InsertInsert"
  - name: "UpdateUpdate"
  - name: "DeleteUpdate"
  - name: "SchemaMismatch"
  - name: "DuplicateKey"
- name: "ConflictStatus"
  description: "Resolution progress for a detected conflict."
  data:
  - name: "Detected"
  - name: "Resolved"
  - name: "Unresolved"
  - name: "Ignored"
- name: "ChangeOperation"
  description: "Type of data modification represented in a change feed or batch."
  data:
  - name: "Insert"
  - name: "Update"
  - name: "Delete"
  - name: "SoftDelete"
- name: "RetryStrategy"
  description: "Timing pattern used when retrying failed operations."
  data:
  - name: "None"
  - name: "Fixed"
  - name: "Exponential"
  - name: "Linear"
valueObjects:
- name: "URI"
  description: "Uniform resource identifier representing an endpoint location."
  data:
  - name: "value"
    type: "String"
- name: "CronExpression"
  description: "CRON expression with time zone for scheduling recurring jobs."
  data:
  - name: "expression"
    type: "String"
  - name: "timeZone"
    type: "String"
- name: "Duration"
  description: "Time duration represented using ISO-8601 format."
  data:
  - name: "iso8601"
    type: "String"
- name: "CheckpointToken"
  description: "Encoded position marker used to resume from a specific change event."
  data:
  - name: "token"
    type: "String"
  - name: "algorithm"
    type: "String"
- name: "PathExpression"
  description: "Declarative path to identify a field or element within a record."
  data:
  - name: "expression"
    type: "String"
  - name: "language"
    type: "String"
- name: "SecretReference"
  description: "Reference to a secret stored in an external vault or configuration\
    \ store."
  data:
  - name: "provider"
    type: "String"
  - name: "key"
    type: "String"
