    multiplicity: "ManyToOne"
  - name: "documentConfigurations"
    type: "DocumentConfiguration"
    multiplicity: "OneToMany"
  - name: "serviceLevels"
    type: "ServiceLevelAgreement"
    multiplicity: "OneToMany"
- name: "DocumentConfiguration"
