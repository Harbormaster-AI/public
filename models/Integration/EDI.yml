    \ agreements, envelopes, transaction sets, acknowledgments, transport endpoints,\
    \ guidelines, mapping, validation, and operational controls."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Integration"
  type: "Capability"
  domain: "EDI"
