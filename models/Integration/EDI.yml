- name: "TradingPartner"
  description: "Organization engaged in exchanging EDI messages."
  data:
  - name: "name"
    type: "String"
  - name: "qualifier"
    type: "String"
  - name: "identifier"
    type: "EDIIdentifier"
  - name: "contactEmail"
    type: "EmailAddress"
  - name: "contactPhone"
    type: "PhoneNumber"
  - name: "timezone"
    type: "TimeZone"
  - name: "status"
    type: "PartnerStatus"
  relations:
  - name: "agreements"
    type: "PartnerAgreement"
    multiplicity: "OneToMany"
  - name: "endpoints"
    type: "ProtocolEndpoint"
    multiplicity: "OneToMany"
  - name: "certificates"
    type: "Certificate"
