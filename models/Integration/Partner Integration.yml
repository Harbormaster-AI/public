---
metadata:
  name: "Partner Integration Capabilities Model"
  description: "Canonical capabilities model for establishing, governing, and operating\
    \ external partner integrations across APIs, EDI, events, and file exchanges."
  version: "1.0.0"
  industry: "Cross-Industry Integration"
  category: "Integration"
  type: "Capability"
  domain: "Partner Integration"
entities:
- name: "PartnerOrganization"
  description: "External company engaged in data exchange or process orchestration\
    \ through one or more integration channels."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "PartnerCategory"
  - name: "website"
    type: "Url"
  - name: "headquartersCountry"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "contacts"
    type: "PartnerContact"
    multiplicity: "OneToMany"
  - name: "agreements"
    type: "IntegrationAgreement"
    multiplicity: "OneToMany"
  - name: "endpoints"
    type: "Endpoint"
    multiplicity: "OneToMany"
  - name: "credentials"
    type: "Credential"
    multiplicity: "OneToMany"
  - name: "certifications"
    type: "ComplianceCertification"
    multiplicity: "OneToMany"
  - name: "routingProfiles"
    type: "RoutingProfile"
    multiplicity: "OneToMany"
- name: "PartnerContact"
  description: "Designated individual or group responsible for business, technical,\
    \ or operational coordination."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "Email"
  - name: "phone"
    type: "Phone"
  - name: "role"
    type: "ContactRole"
  - name: "timezone"
    type: "String"
  relations:
  - name: "organization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
- name: "IntegrationAgreement"
  description: "Binding terms, protocols, and expectations that govern how data is\
    \ exchanged with a partner."
  data:
  - name: "name"
    type: "String"
  - name: "agreementNumber"
    type: "String"
  - name: "status"
    type: "AgreementStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "protocol"
    type: "IntegrationProtocol"
  relations:
  - name: "organization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "slas"
    type: "ServiceLevelAgreement"
    multiplicity: "OneToMany"
  - name: "messageFlows"
    type: "MessageFlow"
    multiplicity: "OneToMany"
  - name: "artifacts"
    type: "SharedArtifact"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "SecurityAssessment"
    multiplicity: "OneToMany"
  - name: "apiContracts"
    type: "APIContract"
    multiplicity: "OneToMany"
  - name: "eventSubscriptions"
    type: "EventSubscription"
    multiplicity: "OneToMany"
  - name: "webhooks"
    type: "WebhookSubscription"
    multiplicity: "OneToMany"
  - name: "dataPolicies"
    type: "DataRetentionPolicy"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
- name: "Endpoint"
  description: "Network-accessible destination or source used to exchange information\
    \ with a partner."
  data:
  - name: "name"
    type: "String"
  - name: "endpointType"
    type: "EndpointType"
  - name: "url"
    type: "Url"
  - name: "region"
    type: "RegionCode"
  - name: "environment"
    type: "Environment"
  relations:
  - name: "organization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "certificates"
    type: "Certificate"
    multiplicity: "OneToMany"
  - name: "webhooks"
    type: "WebhookSubscription"
    multiplicity: "OneToMany"
  - name: "eventSubscriptions"
    type: "EventSubscription"
    multiplicity: "OneToMany"
- name: "Credential"
  description: "Authentication secret or key material used to authorize access between\
    \ systems."
  data:
  - name: "name"
    type: "String"
  - name: "authType"
    type: "AuthType"
  - name: "username"
    type: "String"
  - name: "secretRef"
    type: "SecretRef"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  relations:
  - name: "organization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "certificate"
    type: "Certificate"
    multiplicity: "ManyToOne"
  - name: "accessGrants"
    type: "AccessGrant"
    multiplicity: "OneToMany"
- name: "Certificate"
  description: "X.509 certificate metadata used for TLS or message-level security."
  data:
  - name: "commonName"
    type: "String"
  - name: "serialNumber"
    type: "String"
  - name: "issuer"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "fingerprint"
    type: "HashFingerprint"
  relations:
  - name: "owner"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
- name: "ServiceLevelAgreement"
  description: "Defined service objectives and measurement windows overseeing partner\
    \ integrations."
  data:
  - name: "name"
    type: "String"
  - name: "objective"
    type: "SloType"
  - name: "target"
    type: "String"
  - name: "measurementWindow"
    type: "String"
  - name: "penalty"
    type: "String"
  relations:
  - name: "agreement"
    type: "IntegrationAgreement"
    multiplicity: "ManyToOne"
  - name: "monitors"
    type: "Monitor"
    multiplicity: "OneToMany"
- name: "Monitor"
  description: "Automated check evaluating metrics against thresholds to ensure SLA\
    \ compliance."
  data:
  - name: "name"
    type: "String"
  - name: "metric"
    type: "MetricType"
  - name: "threshold"
    type: "Decimal"
  - name: "samplingPeriodSeconds"
    type: "Integer"
  - name: "status"
    type: "MonitorStatus"
  relations:
  - name: "sla"
    type: "ServiceLevelAgreement"
    multiplicity: "ManyToOne"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
- name: "Alert"
  description: "Notification generated when a monitor detects a breach or anomaly."
  data:
  - name: "createdAt"
    type: "Date"
  - name: "severity"
    type: "AlertSeverity"
  - name: "message"
    type: "String"
  - name: "state"
    type: "AlertState"
  relations:
  - name: "monitor"
    type: "Monitor"
    multiplicity: "ManyToOne"
  - name: "incident"
    type: "Incident"
    multiplicity: "ManyToOne"
- name: "Incident"
  description: "Operational record used to coordinate investigation and remediation\
    \ of disruptions."
  data:
  - name: "incidentNumber"
    type: "String"
  - name: "status"
    type: "IncidentStatus"
  - name: "openedAt"
    type: "Date"
  - name: "closedAt"
    type: "Date"
  - name: "summary"
    type: "String"
  relations:
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "tickets"
    type: "SupportTicket"
    multiplicity: "OneToMany"
- name: "SupportTicket"
  description: "Case used to coordinate communication and resolution across teams\
    \ and partners."
  data:
  - name: "ticketNumber"
    type: "String"
  - name: "priority"
    type: "TicketPriority"
  - name: "status"
    type: "TicketStatus"
  - name: "createdAt"
    type: "Date"
  - name: "subject"
    type: "String"
  relations:
  - name: "incident"
    type: "Incident"
    multiplicity: "ManyToOne"
  - name: "contact"
    type: "PartnerContact"
    multiplicity: "ManyToOne"
- name: "DataSchema"
  description: "Formal definition describing payload structure and validation requirements."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "format"
    type: "SchemaFormat"
  - name: "definitionUri"
    type: "Url"
  - name: "checksum"
    type: "Checksum"
  relations:
  - name: "mappings"
    type: "Mapping"
    multiplicity: "OneToMany"
- name: "Mapping"
  description: "Transformation logic converting data between source and target schemas."
  data:
  - name: "name"
    type: "String"
  - name: "mappingLanguage"
    type: "MappingLanguage"
  - name: "version"
    type: "String"
  - name: "documentUri"
    type: "Url"
  relations:
  - name: "sourceSchema"
    type: "DataSchema"
    multiplicity: "ManyToOne"
  - name: "targetSchema"
    type: "DataSchema"
    multiplicity: "ManyToOne"
  - name: "tests"
    type: "TestCase"
    multiplicity: "OneToMany"
- name: "TestCase"
  description: "Test artifact validating mapping logic using representative samples."
  data:
  - name: "name"
    type: "String"
  - name: "inputSampleUri"
    type: "Url"
  - name: "expectedOutputHash"
    type: "String"
  - name: "status"
    type: "TestStatus"
  relations:
  - name: "mapping"
    type: "Mapping"
    multiplicity: "ManyToOne"
- name: "MessageFlow"
  description: "Directed path detailing how messages move between systems, including\
    \ transport and resiliency policies."
  data:
  - name: "name"
    type: "String"
  - name: "direction"
    type: "FlowDirection"
  - name: "transport"
    type: "TransportProtocol"
  - name: "encryption"
    type: "EncryptionMode"
  - name: "retryPolicy"
    type: "RetryPolicy"
  relations:
  - name: "agreement"
    type: "IntegrationAgreement"
    multiplicity: "ManyToOne"
  - name: "sourceEndpoint"
    type: "Endpoint"
    multiplicity: "ManyToOne"
  - name: "targetEndpoint"
    type: "Endpoint"
    multiplicity: "ManyToOne"
  - name: "transformations"
    type: "Transformation"
    multiplicity: "OneToMany"
  - name: "schemas"
    type: "DataSchema"
    multiplicity: "ManyToMany"
- name: "Transformation"
  description: "Ordered processing step applied within a message flow."
  data:
  - name: "name"
    type: "String"
  - name: "stepType"
    type: "TransformationType"
  - name: "configUri"
    type: "Url"
  - name: "order"
    type: "Integer"
  relations:
  - name: "messageFlow"
    type: "MessageFlow"
    multiplicity: "ManyToOne"
  - name: "mapping"
    type: "Mapping"
    multiplicity: "ManyToOne"
- name: "EventSubscription"
  description: "Contract for receiving event notifications with optional filtering\
    \ and delivery preferences."
  data:
  - name: "topic"
    type: "String"
  - name: "filterExpression"
    type: "String"
  - name: "status"
    type: "SubscriptionStatus"
  - name: "deliveryMode"
    type: "DeliveryMode"
  relations:
  - name: "endpoint"
    type: "Endpoint"
    multiplicity: "ManyToOne"
  - name: "agreement"
    type: "IntegrationAgreement"
    multiplicity: "ManyToOne"
  - name: "deliveryChannel"
    type: "DeliveryChannel"
    multiplicity: "ManyToOne"
- name: "WebhookSubscription"
  description: "Outbound callback registration for delivering partner notifications\
    \ via HTTP."
  data:
  - name: "targetUrl"
    type: "Url"
  - name: "secretRef"
    type: "SecretRef"
  - name: "status"
    type: "SubscriptionStatus"
  - name: "retryPolicy"
    type: "RetryPolicy"
  relations:
  - name: "endpoint"
    type: "Endpoint"
    multiplicity: "ManyToOne"
  - name: "agreement"
    type: "IntegrationAgreement"
    multiplicity: "ManyToOne"
  - name: "deliveryChannel"
    type: "DeliveryChannel"
    multiplicity: "ManyToOne"
- name: "DeliveryChannel"
  description: "Logical delivery mechanism used for distributing messages or events."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "description"
    type: "String"
  relations:
  - name: "webhooks"
    type: "WebhookSubscription"
    multiplicity: "OneToMany"
  - name: "eventSubscriptions"
    type: "EventSubscription"
    multiplicity: "OneToMany"
- name: "OnboardingRequest"
  description: "Intake record capturing prerequisites, reviews, and approvals for\
    \ partner enablement."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "status"
    type: "OnboardingStatus"
  - name: "requestedAt"
    type: "Date"
  - name: "approvedAt"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "organization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "agreements"
    type: "IntegrationAgreement"
    multiplicity: "OneToMany"
  - name: "artifacts"
    type: "SharedArtifact"
    multiplicity: "OneToMany"
- name: "SharedArtifact"
  description: "Document, sample, or configuration shared to support design, testing,\
    \ or operations."
  data:
  - name: "name"
    type: "String"
  - name: "artifactType"
    type: "ArtifactType"
  - name: "locationUri"
    type: "Url"
  - name: "checksum"
    type: "Checksum"
  relations:
  - name: "agreement"
    type: "IntegrationAgreement"
    multiplicity: "ManyToOne"
- name: "SecurityAssessment"
  description: "Review of partner controls and risks aligned to a specific framework."
  data:
  - name: "assessmentNumber"
    type: "String"
  - name: "framework"
    type: "SecurityFramework"
  - name: "score"
    type: "Integer"
  - name: "assessedAt"
    type: "Date"
  - name: "reportUri"
    type: "Url"
  relations:
  - name: "agreement"
    type: "IntegrationAgreement"
    multiplicity: "ManyToOne"
  - name: "findings"
    type: "AssessmentFinding"
    multiplicity: "OneToMany"
- name: "AssessmentFinding"
  description: "Individual control gap or observation from a security assessment."
  data:
  - name: "title"
    type: "String"
  - name: "severity"
    type: "FindingSeverity"
  - name: "status"
    type: "FindingStatus"
  - name: "remediationDue"
    type: "Date"
  relations:
  - name: "assessment"
    type: "SecurityAssessment"
    multiplicity: "ManyToOne"
- name: "RoutingProfile"
  description: "Ruleset defining how messages are prioritized and routed to endpoints."
  data:
  - name: "name"
    type: "String"
  - name: "routingKey"
    type: "String"
  - name: "priority"
    type: "Integer"
  - name: "failoverEnabled"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "routes"
    type: "RouteRule"
    multiplicity: "OneToMany"
- name: "RouteRule"
  description: "Conditional action applied to messages matching a routing expression."
  data:
  - name: "name"
    type: "String"
  - name: "matchExpression"
    type: "String"
  - name: "action"
    type: "RouteAction"
  - name: "order"
    type: "Integer"
  relations:
  - name: "routingProfile"
    type: "RoutingProfile"
    multiplicity: "ManyToOne"
  - name: "targetEndpoint"
    type: "Endpoint"
    multiplicity: "ManyToOne"
- name: "DataTransfer"
  description: "Execution record for a single file, message, or batch processed through\
    \ a flow."
  data:
  - name: "transferId"
    type: "String"
  - name: "startedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  - name: "status"
    type: "TransferStatus"
  - name: "sizeBytes"
    type: "Integer"
  relations:
  - name: "messageFlow"
    type: "MessageFlow"
    multiplicity: "ManyToOne"
  - name: "errorLog"
    type: "ErrorLog"
    multiplicity: "OneToOne"
- name: "ErrorLog"
  description: "Diagnostic entry containing error details and references for deeper\
    \ analysis."
  data:
  - name: "occurredAt"
    type: "Date"
  - name: "code"
    type: "String"
  - name: "message"
    type: "String"
  - name: "detailUri"
    type: "Url"
  - name: "severity"
    type: "ErrorSeverity"
  relations:
  - name: "dataTransfer"
    type: "DataTransfer"
    multiplicity: "OneToOne"
- name: "AuditEvent"
  description: "Immutable record of actions taken against integration resources for\
    \ compliance and forensics."
  data:
  - name: "eventTime"
    type: "Date"
  - name: "actor"
    type: "String"
  - name: "action"
    type: "AuditAction"
  - name: "resource"
    type: "String"
  - name: "outcome"
    type: "AuditOutcome"
  relations:
  - name: "organization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "agreement"
    type: "IntegrationAgreement"
    multiplicity: "ManyToOne"
- name: "DataRetentionPolicy"
  description: "Rules specifying how long integration-related data is retained and\
    \ how it is disposed."
  data:
  - name: "name"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  - name: "appliesTo"
    type: "RetentionSubject"
  - name: "deletionMode"
    type: "DeletionMode"
  relations:
  - name: "agreement"
    type: "IntegrationAgreement"
    multiplicity: "ManyToOne"
- name: "ConsentRecord"
  description: "Evidence of partner consent for specific processing purposes and data\
    \ scopes."
  data:
  - name: "consentType"
    type: "ConsentType"
  - name: "grantedAt"
    type: "Date"
  - name: "revokedAt"
    type: "Date"
  - name: "scope"
    type: "String"
  relations:
  - name: "organization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "agreement"
    type: "IntegrationAgreement"
    multiplicity: "ManyToOne"
- name: "EDITradeProfile"
  description: "Setup information enabling EDI exchange with a trading partner."
  data:
  - name: "qualifier"
    type: "String"
  - name: "identifier"
    type: "String"
  - name: "version"
    type: "String"
  - name: "standard"
    type: "EDIStandard"
  - name: "usageIndicator"
    type: "UsageIndicator"
  relations:
  - name: "organization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "agreements"
    type: "IntegrationAgreement"
    multiplicity: "OneToMany"
- name: "APIContract"
  description: "Published interface definition governing request and response structures\
    \ for partner APIs."
  data:
  - name: "name"
    type: "String"
  - name: "basePath"
    type: "String"
  - name: "version"
    type: "String"
  - name: "style"
    type: "APIStyle"
  - name: "specificationUri"
    type: "Url"
  relations:
  - name: "agreement"
    type: "IntegrationAgreement"
    multiplicity: "ManyToOne"
  - name: "endpoints"
    type: "Endpoint"
    multiplicity: "OneToMany"
- name: "AccessGrant"
  description: "Authorization record issued under a credential for scoped and time-bound\
    \ access."
  data:
  - name: "scope"
    type: "String"
  - name: "expiresAt"
    type: "Date"
  - name: "grantType"
    type: "GrantType"
  - name: "status"
    type: "AccessStatus"
  relations:
  - name: "credential"
    type: "Credential"
    multiplicity: "ManyToOne"
  - name: "agreement"
    type: "IntegrationAgreement"
    multiplicity: "ManyToOne"
- name: "ComplianceCertification"
  description: "Attestation or certification held by a partner demonstrating compliance\
    \ with relevant standards."
  data:
  - name: "name"
    type: "String"
  - name: "issuer"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "framework"
    type: "SecurityFramework"
  relations:
  - name: "organization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
enums:
- name: "PartnerCategory"
  description: "Classification of partner business role in the integration ecosystem."
  data:
  - name: "Supplier"
  - name: "Reseller"
  - name: "Distributor"
  - name: "DataProvider"
  - name: "Customer"
  - name: "TechnologyPartner"
- name: "ContactRole"
  description: "The primary responsibility of a partner contact."
  data:
  - name: "Business"
  - name: "Technical"
  - name: "Security"
  - name: "Billing"
  - name: "Support"
- name: "AgreementStatus"
  description: "Lifecycle state of an integration agreement."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Suspended"
  - name: "Terminated"
  - name: "Expired"
- name: "IntegrationProtocol"
  description: "Primary integration interaction style used by the agreement."
  data:
  - name: "REST"
  - name: "SOAP"
  - name: "EDI"
  - name: "SFTP"
  - name: "AS2"
  - name: "GraphQL"
  - name: "MQTT"
  - name: "AMQP"
- name: "EndpointType"
  description: "Directional role of the endpoint within the flow."
  data:
  - name: "Inbound"
  - name: "Outbound"
  - name: "Bidirectional"
- name: "Environment"
  description: "Deployment environment context for an endpoint."
  data:
  - name: "Production"
  - name: "Staging"
  - name: "Testing"
  - name: "Development"
  - name: "Sandbox"
- name: "AuthType"
  description: "Mechanism used for authenticating requests."
  data:
  - name: "Basic"
  - name: "OAuth2"
  - name: "APIKey"
  - name: "MutualTLS"
  - name: "HMAC"
  - name: "SSHKey"
- name: "SloType"
  description: "Objective type targeted by an SLA."
  data:
  - name: "Availability"
  - name: "Latency"
  - name: "Throughput"
  - name: "ErrorRate"
- name: "MetricType"
  description: "Metric observed by a monitor to evaluate performance or reliability."
  data:
  - name: "Availability"
  - name: "ResponseTime"
  - name: "Throughput"
  - name: "ErrorRate"
  - name: "QueueDepth"
- name: "MonitorStatus"
  description: "Operational status of a monitor."
  data:
  - name: "Enabled"
  - name: "Disabled"
  - name: "InMaintenance"
- name: "AlertSeverity"
  description: "Impact level associated with an alert."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "AlertState"
  description: "Workflow state of an alert."
  data:
  - name: "Open"
  - name: "Acknowledged"
  - name: "Resolved"
  - name: "Suppressed"
- name: "IncidentStatus"
  description: "Current phase of incident management."
  data:
  - name: "New"
  - name: "Investigating"
  - name: "Mitigating"
  - name: "Resolved"
  - name: "Closed"
- name: "TicketPriority"
  description: "Urgency level guiding ticket handling."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Urgent"
- name: "TicketStatus"
  description: "Progress state of a support ticket."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "WaitingOnPartner"
  - name: "Resolved"
  - name: "Closed"
- name: "SchemaFormat"
  description: "Formalism used to define payload structure."
  data:
  - name: "JSONSchema"
  - name: "XMLSchema"
  - name: "Avro"
  - name: "Protobuf"
  - name: "CSV"
- name: "MappingLanguage"
  description: "Language or technology used to express data transformations."
