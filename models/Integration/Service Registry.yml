---
metadata:
  name: "Service Registry HCIDL Model"
  description: "Capabilities model for managing, discovering, and governing service\
    \ definitions, versions, endpoints, and runtime instances within an integration\
    \ platform."
  version: "1.0.0"
  industry: "Technology"
  category: "Integration"
  type: "Capability"
  domain: "Service Registry"
entities:
- name: "RegistryNamespace"
  description: "Logical grouping within the registry that organizes services by team,\
    \ domain, or environment boundary."
  data:
  - name: "name"
    type: "String"
  - name: "path"
    type: "String"
  - name: "visibility"
    type: "VisibilityScope"
  relations:
  - name: "owner"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "services"
    type: "Service"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "Policy"
    multiplicity: "ManyToMany"
- name: "Team"
  description: "Organizational unit accountable for owning and maintaining services\
    \ and their registry entries."
  data:
  - name: "name"
    type: "String"
  - name: "contactEmail"
    type: "EmailAddress"
  - name: "onCallChannel"
    type: "String"
  - name: "timeZone"
    type: "String"
  relations:
  - name: "namespaces"
    type: "RegistryNamespace"
    multiplicity: "OneToMany"
  - name: "services"
    type: "Service"
    multiplicity: "OneToMany"
  - name: "approvedExceptions"
    type: "PolicyException"
    multiplicity: "OneToMany"
- name: "Service"
  description: "Canonical catalog entry representing a discrete business or technical\
    \ capability exposed as an API, event stream, job, or library."
  data:
  - name: "name"
    type: "String"
  - name: "shortDescription"
    type: "String"
  - name: "serviceType"
    type: "ServiceType"
  - name: "exposure"
    type: "ExposureType"
  - name: "lifecycleStatus"
    type: "ServiceLifecycleStatus"
  - name: "criticality"
    type: "CriticalityLevel"
  relations:
  - name: "namespace"
    type: "RegistryNamespace"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "ServiceVersion"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "dependencies"
    type: "ServiceDependency"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "Policy"
    multiplicity: "ManyToMany"
- name: "ServiceVersion"
  description: "Immutable snapshot of a service’s interface and runtime characteristics\
    \ for a specific version."
  data:
  - name: "version"
    type: "SemanticVersion"
  - name: "releaseDate"
    type: "Date"
  - name: "changeSummary"
    type: "String"
  - name: "stability"
    type: "ReleaseStability"
  - name: "deprecationDate"
    type: "Date"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "contracts"
    type: "Contract"
    multiplicity: "OneToMany"
  - name: "endpoints"
    type: "Endpoint"
    multiplicity: "OneToMany"
  - name: "artifacts"
    type: "Artifact"
    multiplicity: "OneToMany"
  - name: "runtimeInstances"
    type: "ServiceInstance"
    multiplicity: "OneToMany"
  - name: "compatibilityReports"
    type: "CompatibilityReport"
    multiplicity: "OneToMany"
- name: "Endpoint"
  description: "Network-accessible address and protocol details where a specific service\
    \ version can be reached in a given environment."
  data:
  - name: "name"
    type: "String"
  - name: "protocol"
    type: "EndpointProtocol"
  - name: "uri"
    type: "Url"
  - name: "transportSecurity"
    type: "TransportSecurity"
  - name: "authentication"
    type: "AuthScheme"
  relations:
  - name: "serviceVersion"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
- name: "Contract"
  description: "Machine-readable interface definition that specifies structure, operations,\
    \ and behaviors for a service version."
  data:
  - name: "name"
    type: "String"
  - name: "format"
    type: "ContractFormat"
  - name: "documentUrl"
    type: "Url"
  - name: "checksum"
    type: "Checksum"
  relations:
  - name: "serviceVersion"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
  - name: "schemas"
    type: "Schema"
    multiplicity: "OneToMany"
  - name: "operations"
    type: "Operation"
    multiplicity: "OneToMany"
- name: "Schema"
  description: "Reusable data definition that models request, response, or message\
    \ payload structures referenced by contracts and operations."
  data:
  - name: "name"
    type: "String"
  - name: "schemaType"
    type: "SchemaType"
  - name: "versionTag"
    type: "String"
  - name: "definitionUrl"
    type: "Url"
  - name: "checksum"
    type: "Checksum"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
- name: "Operation"
  description: "An invokable action or message interaction defined by a contract,\
    \ such as an API method or event channel behavior."
  data:
  - name: "name"
    type: "String"
  - name: "action"
    type: "OperationAction"
  - name: "stability"
    type: "OperationStability"
  - name: "summary"
    type: "String"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "requestSchema"
    type: "Schema"
    multiplicity: "ManyToOne"
  - name: "responseSchema"
    type: "Schema"
    multiplicity: "ManyToOne"
- name: "Artifact"
  description: "Supporting asset generated or curated for a service version, such\
    \ as SDKs, stubs, or documentation bundles."
  data:
  - name: "name"
    type: "String"
  - name: "artifactType"
    type: "ArtifactType"
  - name: "uri"
    type: "Url"
  - name: "checksum"
    type: "Checksum"
  relations:
  - name: "serviceVersion"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
- name: "Environment"
  description: "Execution context where services are deployed and reachable, typically\
    \ aligned to delivery stages and regions."
  data:
  - name: "name"
    type: "String"
  - name: "tier"
    type: "DeploymentTier"
  - name: "region"
    type: "String"
  relations:
  - name: "endpoints"
    type: "Endpoint"
    multiplicity: "OneToMany"
  - name: "instances"
    type: "ServiceInstance"
    multiplicity: "OneToMany"
- name: "ServiceInstance"
  description: "Discrete running process or pod that provides the functionality of\
    \ a specific service version."
  data:
  - name: "hostname"
    type: "String"
  - name: "status"
    type: "InstanceHealthStatus"
  - name: "registeredAt"
    type: "Date"
  - name: "lastHeartbeat"
    type: "Date"
  - name: "ipAddress"
    type: "String"
  relations:
  - name: "serviceVersion"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "endpoint"
    type: "Endpoint"
    multiplicity: "ManyToOne"
- name: "ServiceDependency"
  description: "Declares that one service consumes another and records the expected\
    \ version range and dependency characteristics."
  data:
  - name: "dependencyType"
    type: "DependencyType"
  - name: "versionRange"
    type: "VersionRange"
  - name: "notes"
    type: "String"
  relations:
  - name: "consumer"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "viaContract"
    type: "Contract"
    multiplicity: "ManyToOne"
- name: "CompatibilityReport"
  description: "Result of static or runtime analysis that evaluates the compatibility\
    \ of two service versions for a given contract."
  data:
  - name: "result"
    type: "CompatibilityResult"
  - name: "checkedOn"
    type: "Date"
  - name: "toolName"
    type: "String"
  - name: "reportUrl"
    type: "Url"
  relations:
  - name: "subject"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
  - name: "against"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
- name: "Policy"
  description: "Governance rule applied to namespaces and services that directs naming,\
    \ versioning, security, and documentation practices."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "PolicyType"
  - name: "ruleText"
    type: "String"
  - name: "enforcementLevel"
    type: "EnforcementLevel"
  relations:
  - name: "namespaces"
    type: "RegistryNamespace"
    multiplicity: "ManyToMany"
  - name: "services"
    type: "Service"
    multiplicity: "ManyToMany"
- name: "PolicyException"
  description: "Approved waiver that temporarily exempts a service version from a\
    \ specific policy under defined conditions."
  data:
  - name: "reason"
    type: "String"
  - name: "expiresOn"
    type: "Date"
  - name: "approvalReference"
    type: "String"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "serviceVersion"
    type: "ServiceVersion"
    multiplicity: "ManyToOne"
  - name: "approvedBy"
    type: "Team"
    multiplicity: "ManyToOne"
- name: "Tag"
  description: "Curated label used to classify services for discovery, reporting,\
    \ and compliance grouping."
  data:
  - name: "name"
    type: "String"
  - name: "tagType"
    type: "TagType"
  - name: "description"
    type: "String"
  relations:
  - name: "services"
    type: "Service"
    multiplicity: "ManyToMany"
enums:
- name: "VisibilityScope"
  description: "Degree to which a namespace and its contents may be discovered and\
    \ referenced across the organization."
  data:
  - name: "Private"
  - name: "Internal"
  - name: "Public"
- name: "ServiceType"
  description: "Fundamental interaction style or packaging of the service."
  data:
  - name: "API"
  - name: "EventStream"
  - name: "BatchJob"
  - name: "Library"
- name: "ExposureType"
  description: "Intended audience for consuming the service."
  data:
  - name: "Internal"
  - name: "External"
  - name: "Partner"
- name: "ServiceLifecycleStatus"
  description: "Overall maturity and availability phase of a service."
  data:
  - name: "Proposed"
  - name: "Active"
  - name: "Deprecated"
  - name: "Retired"
- name: "CriticalityLevel"
  description: "Business impact associated with service disruption."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "MissionCritical"
- name: "ReleaseStability"
  description: "Qualitative stability classification for a service version."
  data:
  - name: "Snapshot"
  - name: "Beta"
  - name: "Stable"
  - name: "Deprecated"
- name: "EndpointProtocol"
  description: "Transport or interaction protocol exposed at an endpoint."
  data:
  - name: "HTTP"
  - name: "gRPC"
  - name: "GraphQL"
  - name: "AMQP"
  - name: "MQTT"
  - name: "Kafka"
- name: "TransportSecurity"
  description: "Network-level protection mechanism applied at the endpoint."
  data:
  - name: "None"
  - name: "TLS"
  - name: "MutualTLS"
- name: "AuthScheme"
  description: "Authentication approach required for accessing an endpoint."
  data:
  - name: "None"
  - name: "ApiKey"
  - name: "OAuth2"
  - name: "Basic"
  - name: "Custom"
- name: "ContractFormat"
  description: "Specification language used to define the service interface."
  data:
  - name: "OpenAPI"
  - name: "AsyncAPI"
  - name: "WSDL"
  - name: "GraphQLSDL"
  - name: "AvroSchema"
  - name: "Protobuf"
- name: "SchemaType"
  description: "Encoding or schema system for payload definitions."
  data:
  - name: "JSONSchema"
  - name: "Avro"
  - name: "Protobuf"
  - name: "XSD"
- name: "OperationAction"
  description: "Primary interaction pattern communicated by an operation."
  data:
  - name: "Invoke"
  - name: "Publish"
  - name: "Subscribe"
  - name: "Query"
  - name: "Command"
- name: "OperationStability"
  description: "Maturity and change expectations for a specific operation."
  data:
  - name: "Experimental"
  - name: "Stable"
  - name: "Deprecated"
- name: "ArtifactType"
  description: "Kind of auxiliary asset associated with a service version."
  data:
  - name: "ClientSDK"
  - name: "ServerStub"
  - name: "PostmanCollection"
  - name: "PolicyBundle"
  - name: "Documentation"
  - name: "Mapping"
- name: "DeploymentTier"
  description: "Delivery stage aligned to operational controls and release cadence."
  data:
  - name: "Development"
  - name: "Testing"
  - name: "Staging"
  - name: "Production"
- name: "InstanceHealthStatus"
  description: "Observed operational state of a service instance."
  data:
  - name: "Registered"
  - name: "Healthy"
  - name: "Degraded"
  - name: "Unhealthy"
  - name: "Unreachable"
- name: "DependencyType"
  description: "Nature of the dependency relationship between services."
  data:
  - name: "Runtime"
  - name: "BuildTime"
  - name: "Optional"
- name: "CompatibilityResult"
  description: "Outcome of comparing two versions for interface or behavioral compatibility."
  data:
  - name: "Compatible"
  - name: "Incompatible"
  - name: "Unknown"
- name: "PolicyType"
  description: "Policy theme guiding governance actions."
  data:
  - name: "Naming"
  - name: "Versioning"
  - name: "Security"
  - name: "Retention"
  - name: "Ownership"
  - name: "Documentation"
- name: "EnforcementLevel"
  description: "Strength of enforcement that determines whether violations block changes."
  data:
  - name: "Advisory"
  - name: "Required"
  - name: "Blocking"
- name: "TagType"
  description: "Classification intent for tagging services."
  data:
  - name: "Domain"
  - name: "Capability"
  - name: "Compliance"
  - name: "Initiative"
valueObjects:
- name: "SemanticVersion"
  description: "String representation of a semantic version identifier following major.minor.patch\
    \ with optional pre-release and build metadata."
  data:
  - name: "value"
    type: "String"
- name: "Url"
  description: "Absolute locator for network-accessible resources."
  data:
  - name: "value"
    type: "String"
- name: "Checksum"
  description: "Digest that verifies artifact or document integrity."
  data:
  - name: "algorithm"
    type: "String"
  - name: "value"
    type: "String"
- name: "EmailAddress"
  description: "RFC-compliant email address used for contact and ownership."
  data:
  - name: "value"
    type: "String"
- name: "VersionRange"
  description: "Constraint expression indicating acceptable provider versions, such\
    \ as caret, tilde, or interval syntax."
  data:
  - name: "expression"
    type: "String"
