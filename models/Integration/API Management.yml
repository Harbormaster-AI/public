---
metadata:
  name: "API Management Capabilities Model"
  description: "A capabilities model describing the lifecycle, governance, security,\
    \ deployment, and commercialization of APIs across gateways and environments."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Integration"
  type: "Capability"
  domain: "API Management"
entities:
- name: "ProviderOrganization"
  description: "Entity responsible for publishing and operating APIs, managing environments,\
    \ and engaging developer ecosystems."
  data:
  - name: "name"
    type: "String"
  - name: "website"
    type: "URL"
  - name: "supportEmail"
    type: "EmailAddress"
  - name: "complianceTier"
    type: "String"
  relations:
  - name: "apiProducts"
    type: "APIProduct"
    multiplicity: "OneToMany"
  - name: "apis"
    type: "API"
    multiplicity: "OneToMany"
  - name: "environments"
    type: "Environment"
    multiplicity: "OneToMany"
  - name: "gateways"
    type: "Gateway"
    multiplicity: "OneToMany"
  - name: "developers"
    type: "Developer"
    multiplicity: "OneToMany"
- name: "APIProduct"
  description: "Commercial and lifecycle grouping of one or more APIs offered to consumers\
    \ under common plans, policies, and documentation."
  data:
  - name: "name"
    type: "String"
  - name: "audience"
    type: "Visibility"
  - name: "lifecycleState"
    type: "ApiLifecycleState"
  - name: "overview"
    type: "String"
  relations:
  - name: "provider"
    type: "ProviderOrganization"
    multiplicity: "ManyToOne"
  - name: "apis"
    type: "API"
    multiplicity: "ManyToMany"
  - name: "ratePlans"
    type: "RatePlan"
    multiplicity: "OneToMany"
  - name: "slas"
    type: "SLA"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
- name: "API"
  description: "Technical interface specification describing protocols, styles, resources,\
    \ and security for a family of versions."
  data:
  - name: "name"
    type: "String"
  - name: "protocol"
    type: "ProtocolType"
  - name: "apiStyle"
    type: "ApiStyle"
  - name: "basePath"
    type: "String"
  - name: "versioningStrategy"
    type: "VersioningStrategy"
  - name: "deprecated"
    type: "Boolean"
  relations:
  - name: "provider"
    type: "ProviderOrganization"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "APIVersion"
    multiplicity: "OneToMany"
  - name: "products"
    type: "APIProduct"
    multiplicity: "ManyToMany"
- name: "APIVersion"
  description: "A concrete release of an API that can be deployed, governed, and monitored\
    \ independently."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "releaseDate"
    type: "Date"
  - name: "deprecationDate"
    type: "Date"
  - name: "state"
    type: "ApiLifecycleState"
  relations:
  - name: "api"
    type: "API"
    multiplicity: "ManyToOne"
  - name: "operations"
    type: "Operation"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "Policy"
    multiplicity: "ManyToMany"
  - name: "securitySchemes"
    type: "SecurityScheme"
    multiplicity: "ManyToMany"
  - name: "endpoints"
    type: "Endpoint"
    multiplicity: "OneToMany"
  - name: "deployments"
    type: "Deployment"
    multiplicity: "OneToMany"
  - name: "monitors"
    type: "Monitoring"
    multiplicity: "OneToMany"
  - name: "testCases"
    type: "TestCase"
    multiplicity: "OneToMany"
- name: "Operation"
  description: "An addressable action or resource interaction exposed by an API version,\
    \ including inputs, outputs, and constraints."
  data:
  - name: "operationName"
    type: "String"
  - name: "method"
    type: "HttpMethod"
  - name: "pathTemplate"
    type: "String"
  - name: "authType"
    type: "AuthType"
  - name: "idempotent"
    type: "Boolean"
  relations:
  - name: "apiVersion"
    type: "APIVersion"
    multiplicity: "ManyToOne"
  - name: "parameters"
    type: "Parameter"
    multiplicity: "OneToMany"
  - name: "requestBody"
    type: "RequestBody"
    multiplicity: "OneToOne"
  - name: "responses"
    type: "Response"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "Policy"
    multiplicity: "ManyToMany"
  - name: "transformations"
    type: "Transformation"
    multiplicity: "ManyToMany"
- name: "Parameter"
  description: "Typed input definition for an operation, including its location, style,\
    \ and cardinality."
  data:
  - name: "name"
    type: "String"
  - name: "location"
    type: "ParameterLocation"
  - name: "required"
    type: "Boolean"
  - name: "dataType"
    type: "String"
  - name: "style"
    type: "ParameterStyle"
  relations:
  - name: "operation"
    type: "Operation"
    multiplicity: "ManyToOne"
- name: "RequestBody"
  description: "Incoming payload specification for an operation, including content\
    \ type and constraints."
  data:
  - name: "contentType"
    type: "String"
  - name: "schemaRef"
    type: "String"
  - name: "maxPayloadKB"
    type: "Integer"
  relations:
  - name: "operation"
    type: "Operation"
    multiplicity: "OneToOne"
- name: "Response"
  description: "Outbound payload specification including status code, media type,\
    \ and schema reference."
  data:
  - name: "statusCode"
    type: "Integer"
  - name: "contentType"
    type: "String"
  - name: "schemaRef"
    type: "String"
  - name: "error"
    type: "Boolean"
  relations:
  - name: "operation"
    type: "Operation"
    multiplicity: "ManyToOne"
- name: "Endpoint"
  description: "Concrete routing configuration for an API version, mapping gateway\
    \ paths to backend targets."
  data:
  - name: "routePath"
    type: "String"
  - name: "targetUrl"
    type: "URL"
  - name: "timeoutMs"
    type: "Integer"
  - name: "public"
    type: "Boolean"
  relations:
  - name: "apiVersion"
    type: "APIVersion"
    multiplicity: "ManyToOne"
  - name: "backendService"
    type: "BackendService"
    multiplicity: "ManyToOne"
- name: "BackendService"
  description: "Origin system or function that fulfills API requests routed through\
    \ the gateway."
  data:
  - name: "name"
    type: "String"
  - name: "serviceType"
    type: "ServiceType"
  - name: "baseUrl"
    type: "URL"
  - name: "healthCheckPath"
    type: "String"
  relations:
  - name: "endpoints"
    type: "Endpoint"
    multiplicity: "OneToMany"
- name: "Environment"
  description: "Isolated runtime context used for deployment and testing, such as\
    \ development, staging, or production."
  data:
  - name: "name"
    type: "String"
  - name: "stage"
    type: "EnvironmentStage"
  - name: "region"
    type: "String"
  - name: "dnsDomain"
    type: "String"
  relations:
  - name: "provider"
    type: "ProviderOrganization"
    multiplicity: "ManyToOne"
  - name: "gateways"
    type: "Gateway"
    multiplicity: "OneToMany"
  - name: "deployments"
    type: "Deployment"
    multiplicity: "OneToMany"
  - name: "certificates"
    type: "Certificate"
    multiplicity: "OneToMany"
- name: "Gateway"
  description: "API gateway cluster or instance responsible for policy enforcement,\
    \ routing, and observability."
  data:
  - name: "name"
    type: "String"
  - name: "vendor"
    type: "VendorType"
  - name: "version"
    type: "String"
  - name: "capacityRU"
    type: "Integer"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "deployments"
    type: "Deployment"
    multiplicity: "OneToMany"
  - name: "monitors"
    type: "Monitoring"
    multiplicity: "OneToMany"
  - name: "certificates"
    type: "Certificate"
    multiplicity: "OneToMany"
- name: "Deployment"
  description: "Realization of an API version on a gateway within an environment,\
    \ including status and revision."
  data:
  - name: "deploymentDate"
    type: "Date"
  - name: "status"
    type: "DeploymentStatus"
  - name: "revision"
    type: "String"
  relations:
  - name: "apiVersion"
    type: "APIVersion"
    multiplicity: "ManyToOne"
  - name: "gateway"
    type: "Gateway"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
- name: "Policy"
  description: "Reusable enforcement logic applied to API versions or operations to\
    \ manage security, traffic, and behavior."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "PolicyType"
  - name: "configurationText"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "apiVersions"
    type: "APIVersion"
    multiplicity: "ManyToMany"
  - name: "operations"
    type: "Operation"
    multiplicity: "ManyToMany"
- name: "SecurityScheme"
  description: "Authentication and authorization scheme definition such as API key,\
    \ OAuth2, JWT, or mutual TLS."
  data:
  - name: "name"
    type: "String"
  - name: "schemeType"
    type: "SchemeType"
  - name: "authorizationEndpoint"
    type: "URL"
  - name: "tokenEndpoint"
    type: "URL"
  - name: "scopesDefinition"
    type: "String"
  relations:
  - name: "apiVersions"
    type: "APIVersion"
    multiplicity: "ManyToMany"
- name: "Transformation"
  description: "Request and response adaptation logic executed at runtime, including\
    \ mapping and validation scripts."
  data:
  - name: "name"
    type: "String"
  - name: "transformType"
    type: "TransformType"
  - name: "scriptLanguage"
    type: "ScriptLanguage"
  - name: "script"
    type: "String"
  relations:
  - name: "operations"
    type: "Operation"
    multiplicity: "ManyToMany"
  - name: "apiVersions"
    type: "APIVersion"
    multiplicity: "ManyToMany"
- name: "RatePlan"
  description: "Commercial and technical throttling definition for an API product,\
    \ including limits and pricing."
  data:
  - name: "name"
    type: "String"
  - name: "billingPeriod"
    type: "BillingPeriod"
  - name: "quotaPerPeriod"
    type: "Integer"
  - name: "rateLimitRps"
    type: "Integer"
  - name: "overagePolicy"
    type: "OveragePolicy"
  - name: "pricePerPeriod"
    type: "Money"
  relations:
  - name: "apiProduct"
    type: "APIProduct"
    multiplicity: "ManyToOne"
  - name: "slas"
    type: "SLA"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
- name: "SLA"
  description: "Service-level objectives associated with an API product or plan, defining\
    \ availability and performance targets."
  data:
  - name: "name"
    type: "String"
  - name: "availabilityPct"
    type: "Decimal"
  - name: "latencyP95Ms"
    type: "Integer"
  - name: "errorRatePct"
    type: "Decimal"
  relations:
  - name: "apiProduct"
    type: "APIProduct"
    multiplicity: "ManyToOne"
  - name: "ratePlan"
    type: "RatePlan"
    multiplicity: "ManyToOne"
- name: "Subscription"
  description: "Agreement granting an application access to a product under a specific\
    \ plan with defined limits."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "SubscriptionStatus"
  relations:
  - name: "apiProduct"
    type: "APIProduct"
    multiplicity: "ManyToOne"
  - name: "ratePlan"
    type: "RatePlan"
    multiplicity: "ManyToOne"
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "credentials"
    type: "Credential"
    multiplicity: "OneToMany"
  - name: "usageRecords"
    type: "UsageRecord"
    multiplicity: "OneToMany"
- name: "Application"
  description: "Consumer-facing software entity that integrates with published APIs\
    \ and manages its own credentials."
  data:
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  - name: "platform"
    type: "ApplicationPlatform"
  - name: "callbackUrl"
    type: "URL"
  relations:
  - name: "owner"
    type: "Developer"
    multiplicity: "ManyToOne"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "credentials"
    type: "Credential"
    multiplicity: "OneToMany"
- name: "Developer"
  description: "Individual or team responsible for building applications and consuming\
    \ APIs."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "organization"
    type: "String"
  - name: "developerType"
    type: "DeveloperType"
  relations:
  - name: "applications"
    type: "Application"
    multiplicity: "OneToMany"
- name: "Credential"
  description: "Secret material used by an application to authenticate and authorize\
    \ API access."
  data:
  - name: "credentialType"
    type: "AuthType"
  - name: "key"
    type: "String"
  - name: "secret"
    type: "String"
  - name: "createdDate"
    type: "Date"
  - name: "expiresDate"
    type: "Date"
  - name: "scopes"
    type: "String"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
- name: "Monitoring"
  description: "Automated checks and instrumentation for API health, latency, and\
    \ availability tracking."
  data:
  - name: "name"
    type: "String"
  - name: "monitorType"
    type: "MonitorType"
  - name: "frequencyMinutes"
    type: "Integer"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "apiVersion"
    type: "APIVersion"
    multiplicity: "ManyToOne"
  - name: "gateway"
    type: "Gateway"
    multiplicity: "ManyToOne"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
- name: "Alert"
  description: "Notification and action trigger generated when monitoring conditions\
    \ are met or thresholds are exceeded."
  data:
  - name: "name"
    type: "String"
  - name: "severity"
    type: "AlertSeverity"
  - name: "conditionType"
    type: "ConditionType"
  - name: "threshold"
    type: "Decimal"
  - name: "windowMinutes"
    type: "Integer"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "monitoring"
    type: "Monitoring"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
- name: "UsageRecord"
  description: "Aggregated metering data capturing traffic volumes, performance, and\
    \ errors for billing and analytics."
  data:
  - name: "date"
    type: "Date"
  - name: "requestCount"
    type: "Integer"
  - name: "successCount"
    type: "Integer"
  - name: "errorCount"
    type: "Integer"
  - name: "averageLatencyMs"
    type: "Integer"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "operation"
    type: "Operation"
    multiplicity: "ManyToOne"
  - name: "gateway"
    type: "Gateway"
    multiplicity: "ManyToOne"
- name: "Certificate"
  description: "TLS certificate material and metadata used for secure API delivery\
    \ on custom domains."
  data:
  - name: "commonName"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "managedBy"
    type: "ManagedBy"
  - name: "certificateType"
    type: "CertificateType"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "gateway"
    type: "Gateway"
    multiplicity: "ManyToOne"
- name: "AccessRule"
  description: "Fine-grained authorization directive defining which operations and\
    \ paths are permitted under a given subscription or plan."
  data:
  - name: "ruleName"
    type: "String"
  - name: "pathPattern"
    type: "String"
  - name: "allowedMethods"
    type: "String"
  - name: "allow"
    type: "Boolean"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "ratePlan"
    type: "RatePlan"
    multiplicity: "ManyToOne"
enums:
- name: "ProtocolType"
  description: "Supported interface protocols exposed by the API."
  data:
  - name: "REST"
  - name: "GraphQL"
  - name: "gRPC"
  - name: "SOAP"
  - name: "WebSocket"
- name: "ApiStyle"
  description: "Interaction paradigm and resource modeling approach of the API."
  data:
  - name: "ResourceOriented"
  - name: "RPC"
  - name: "EventDriven"
- name: "VersioningStrategy"
  description: "Mechanism used to indicate and resolve API versions at runtime."
  data:
  - name: "URI"
  - name: "Header"
  - name: "QueryParam"
  - name: "ContentNegotiation"
- name: "ApiLifecycleState"
  description: "Publication and support status for APIs and their versions."
  data:
  - name: "Draft"
  - name: "Published"
  - name: "Deprecated"
  - name: "Retired"
- name: "HttpMethod"
  description: "Standard HTTP verbs used to invoke operations."
  data:
  - name: "GET"
  - name: "POST"
  - name: "PUT"
  - name: "PATCH"
  - name: "DELETE"
  - name: "OPTIONS"
  - name: "HEAD"
- name: "AuthType"
  description: "Authentication and authorization mechanisms applied to requests."
  data:
  - name: "None"
  - name: "APIKey"
  - name: "OAuth2"
  - name: "JWT"
  - name: "MutualTLS"
- name: "ParameterLocation"
  description: "Location in the HTTP exchange where a parameter is transmitted."
  data:
  - name: "Query"
  - name: "Path"
  - name: "Header"
  - name: "Cookie"
- name: "ParameterStyle"
  description: "Serialization rules used for parameter encoding."
  data:
  - name: "Simple"
  - name: "Form"
  - name: "Matrix"
  - name: "Label"
  - name: "DeepObject"
  - name: "PipeDelimited"
  - name: "SpaceDelimited"
- name: "PolicyType"
  description: "Category of control or behavior enforced by a policy."
  data:
  - name: "Authentication"
  - name: "Authorization"
  - name: "RateLimiting"
  - name: "Quota"
  - name: "Transformation"
  - name: "CORS"
  - name: "Caching"
  - name: "IPFiltering"
  - name: "JWTValidation"
  - name: "Mocking"
- name: "VendorType"
  description: "Gateway platform on which APIs are deployed and operated."
  data:
  - name: "Apigee"
  - name: "Kong"
  - name: "NGINX"
  - name: "AWSAPIGateway"
  - name: "AzureAPIM"
  - name: "MuleSoft"
  - name: "Tyk"
  - name: "Istio"
- name: "DeploymentStatus"
  description: "Current outcome or stage of a deployment."
  data:
  - name: "Planned"
  - name: "Deployed"
  - name: "Failed"
  - name: "RollingBack"
  - name: "Inactive"
- name: "EnvironmentStage"
  description: "Purpose and maturity of a runtime environment."
  data:
  - name: "Development"
  - name: "Testing"
  - name: "Staging"
  - name: "Production"
  - name: "Sandbox"
- name: "BillingPeriod"
  description: "Frequency at which subscription charges and quotas reset."
  data:
  - name: "Daily"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Yearly"
- name: "OveragePolicy"
  description: "Treatment applied to traffic that exceeds plan limits."
  data:
  - name: "Block"
  - name: "Throttle"
  - name: "Charge"
- name: "SubscriptionStatus"
  description: "Activity and eligibility state of a subscription."
  data:
  - name: "Pending"
  - name: "Active"
  - name: "Suspended"
  - name: "Cancelled"
  - name: "Expired"
- name: "ApplicationPlatform"
  description: "Primary runtime environment in which an application operates."
  data:
  - name: "Web"
  - name: "Mobile"
  - name: "Server"
  - name: "IoT"
- name: "DeveloperType"
  description: "Organizational relationship of the developer to the provider."
  data:
  - name: "Internal"
  - name: "Partner"
  - name: "Public"
- name: "MonitorType"
  description: "Technique used to assess the health and performance of APIs."
  data:
  - name: "Synthetic"
  - name: "HealthCheck"
  - name: "RealUser"
- name: "AlertSeverity"
  description: "Criticality of an alert and the urgency of response required."
  data:
  - name: "Info"
  - name: "Warning"
  - name: "Critical"
- name: "ConditionType"
  description: "Class of signal used to trigger alerts and automations."
  data:
  - name: "Latency"
  - name: "ErrorRate"
  - name: "Traffic"
  - name: "Security"
- name: "ServiceType"
  description: "Kind of backend implementation targeted by an endpoint."
  data:
  - name: "HTTP"
  - name: "Lambda"
  - name: "Function"
  - name: "QueueProxy"
  - name: "GRPCProxy"
- name: "Visibility"
  description: "Audience scope controlling discoverability and access."
  data:
  - name: "Private"
  - name: "Partner"
  - name: "Public"
- name: "ManagedBy"
  description: "Party responsible for provisioning and rotating certificate materials."
  data:
  - name: "Gateway"
  - name: "External"
- name: "CertificateType"
  description: "Usage classification of the certificate in TLS handshakes."
  data:
  - name: "Server"
  - name: "Client"
- name: "SchemeType"
  description: "Security scheme taxonomy for authentication and authorization."
  data:
  - name: "APIKey"
  - name: "OAuth2"
  - name: "JWT"
  - name: "MutualTLS"
- name: "ScriptLanguage"
  description: "Language or expression engine used for transformations."
  data:
  - name: "JQ"
  - name: "JavaScript"
  - name: "Groovy"
  - name: "XSLT"
  - name: "CEL"
- name: "TransformType"
  description: "Category of transformation applied to requests and responses."
  data:
  - name: "RequestRewrite"
  - name: "ResponseRewrite"
  - name: "Mapping"
  - name: "Validation"
valueObjects:
- name: "Money"
  description: "Monetary value representing an amount and its currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "URL"
  description: "Absolute network locator following standard URL formatting."
  data:
  - name: "value"
    type: "String"
- name: "EmailAddress"
  description: "Email string formatted per internet message standards."
  data:
  - name: "value"
    type: "String"
