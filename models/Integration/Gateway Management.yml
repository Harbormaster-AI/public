    multiplicity: "ManyToMany"
  - name: "logSinks"
    type: "LogSink"
    multiplicity: "ManyToMany"
  - name: "metricStreams"
    type: "MetricStream"
    multiplicity: "ManyToMany"
  - name: "accessGroup"
    type: "AccessGroup"
    multiplicity: "ManyToOne"
