  industry: "Technology"
  category: "Integration"
  type: "Capability"
  domain: "Gateway Management"
entities:
- name: "Organization"
  description: "Tenant or administrative boundary owning gateway infrastructure and\
    \ governance."
  data:
  - name: "name"
    type: "String"
  - name: "contactEmail"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "environments"
    type: "Environment"
    multiplicity: "OneToMany"
  - name: "gatewayClusters"
    type: "GatewayCluster"
    multiplicity: "OneToMany"
  - name: "accessGroups"
    type: "AccessGroup"
    multiplicity: "OneToMany"
- name: "Environment"
  description: "Logical stage for deployment and configuration isolation such as development,\
    \ testing, or production."
  data:
  - name: "name"
    type: "String"
  - name: "environmentType"
    type: "EnvironmentType"
  - name: "defaultDomain"
    type: "Hostname"
  - name: "description"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "deployments"
    type: "Deployment"
    multiplicity: "OneToMany"
  - name: "secrets"
    type: "Secret"
    multiplicity: "ManyToMany"
