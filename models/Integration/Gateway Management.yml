  - name: "targets"
    type: "TargetServer"
    multiplicity: "OneToMany"
  - name: "healthCheck"
    type: "HealthCheck"
    multiplicity: "OneToOne"
  - name: "credentials"
    type: "Credential"
    multiplicity: "ManyToOne"
  - name: "serviceAccount"
