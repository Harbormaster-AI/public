  - name: "apiProxy"
    type: "ApiProxy"
    multiplicity: "ManyToOne"
  - name: "virtualHost"
    type: "VirtualHost"
    multiplicity: "ManyToOne"
  - name: "backendService"
    type: "BackendService"
    multiplicity: "ManyToOne"
  - name: "requestMatchers"
    type: "RequestMatcher"
    multiplicity: "OneToMany"
  - name: "policyBindings"
