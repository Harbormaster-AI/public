---
metadata:
  name: "Webhook Management HCIDL"
  description: "Canonical capabilities model for administering webhook subscriptions,\
    \ event delivery, security, observability, and operational controls."
  version: "1.0.0"
  industry: "Software"
  category: "Integration"
  type: "Capability"
  domain: "Webhook Management"
entities:
- name: "Tenant"
  description: "Organization or account that owns webhook configurations, policies,\
    \ and operational data."
  data:
  - name: "name"
    type: "String"
  - name: "contactEmail"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "environments"
    type: "Environment"
    multiplicity: "OneToMany"
  - name: "eventSources"
    type: "EventSource"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "WebhookSubscription"
    multiplicity: "OneToMany"
  - name: "signingKeys"
    type: "SigningKey"
    multiplicity: "OneToMany"
  - name: "rateLimitPolicies"
    type: "RateLimitPolicy"
    multiplicity: "OneToMany"
  - name: "auditLogs"
    type: "AuditLog"
    multiplicity: "OneToMany"
- name: "Environment"
  description: "Logical isolation boundary such as development, staging, or production."
  data:
  - name: "name"
    type: "String"
  - name: "environmentType"
    type: "EnvironmentType"
  - name: "defaultRegion"
    type: "String"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "eventSources"
    type: "EventSource"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "WebhookSubscription"
    multiplicity: "OneToMany"
  - name: "auditLogs"
    type: "AuditLog"
    multiplicity: "OneToMany"
  - name: "suppressionRules"
    type: "SuppressionRule"
    multiplicity: "OneToMany"
- name: "EventSource"
  description: "System or domain that emits events to be delivered via webhooks."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "eventFormat"
    type: "EventFormat"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "eventTypes"
    type: "EventType"
    multiplicity: "OneToMany"
  - name: "messages"
    type: "EventMessage"
    multiplicity: "OneToMany"
- name: "EventType"
  description: "Named category of event with versioning and schema reference."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "schemaUri"
    type: "URL"
  - name: "critical"
    type: "Boolean"
  relations:
  - name: "eventSource"
    type: "EventSource"
    multiplicity: "ManyToOne"
  - name: "subscriptions"
    type: "WebhookSubscription"
    multiplicity: "ManyToMany"
  - name: "transformations"
    type: "Transformation"
    multiplicity: "OneToMany"
- name: "WebhookSubscription"
  description: "Registration that defines which events are delivered to which target\
    \ endpoint and how."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "SubscriptionStatus"
  - name: "targetUrl"
    type: "URL"
  - name: "httpMethod"
    type: "HttpMethod"
  - name: "secret"
    type: "Secret"
  - name: "authType"
    type: "AuthType"
  - name: "compression"
    type: "CompressionType"
  - name: "signingAlgorithm"
    type: "SigningAlgorithm"
  - name: "signatureHeader"
    type: "SignatureHeaderSpec"
  - name: "batchSize"
    type: "Integer"
  - name: "rateLimitOverride"
    type: "RateLimit"
  - name: "deadLetterEnabled"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "eventTypes"
    type: "EventType"
    multiplicity: "ManyToMany"
  - name: "headers"
    type: "HeaderTemplate"
    multiplicity: "OneToMany"
  - name: "retryPolicy"
    type: "RetryPolicy"
    multiplicity: "ManyToOne"
  - name: "endpointCredential"
    type: "EndpointCredential"
    multiplicity: "ManyToOne"
  - name: "signingKey"
    type: "SigningKey"
    multiplicity: "ManyToOne"
  - name: "filterRules"
    type: "FilterRule"
    multiplicity: "OneToMany"
  - name: "transformations"
    type: "Transformation"
    multiplicity: "OneToMany"
  - name: "deliveries"
    type: "Delivery"
    multiplicity: "OneToMany"
  - name: "deadLetters"
    type: "DeadLetterMessage"
    multiplicity: "OneToMany"
  - name: "healthChecks"
    type: "HealthCheck"
    multiplicity: "OneToMany"
- name: "HeaderTemplate"
  description: "Static or sensitive HTTP headers to include with webhook requests."
  data:
  - name: "headerName"
    type: "String"
  - name: "headerValue"
    type: "String"
  - name: "sensitive"
    type: "Boolean"
  relations:
  - name: "subscription"
    type: "WebhookSubscription"
    multiplicity: "ManyToOne"
- name: "RetryPolicy"
  description: "Strategy and parameters controlling redelivery attempts."
  data:
  - name: "name"
    type: "String"
  - name: "strategy"
    type: "RetryStrategy"
  - name: "maxAttempts"
    type: "Integer"
  - name: "initialInterval"
    type: "Duration"
  - name: "maxInterval"
    type: "Duration"
  - name: "jitterPercent"
    type: "Integer"
  relations:
  - name: "subscriptions"
    type: "WebhookSubscription"
    multiplicity: "OneToMany"
- name: "RateLimitPolicy"
  description: "Throttling rules to protect systems from excessive webhook traffic."
  data:
  - name: "name"
    type: "String"
  - name: "scope"
    type: "RateLimitScope"
  - name: "rate"
    type: "RateLimit"
  - name: "enforcementWindow"
    type: "Duration"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "subscriptions"
    type: "WebhookSubscription"
    multiplicity: "OneToMany"
- name: "EndpointCredential"
  description: "Credentials and materials used to authenticate outgoing webhook requests."
  data:
  - name: "name"
    type: "String"
  - name: "authType"
    type: "AuthType"
  - name: "username"
    type: "String"
  - name: "password"
    type: "Secret"
  - name: "apiKey"
    type: "Secret"
  - name: "apiKeyHeader"
    type: "String"
  - name: "oauthTokenUrl"
    type: "URL"
  - name: "oauthClientId"
    type: "String"
  - name: "oauthClientSecret"
    type: "Secret"
  - name: "tlsClientCertificate"
    type: "Certificate"
  - name: "tlsPrivateKey"
    type: "PemPrivateKey"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "subscriptions"
    type: "WebhookSubscription"
    multiplicity: "OneToMany"
- name: "SigningKey"
  description: "Shared secret or key pair used to produce webhook signatures."
  data:
  - name: "name"
    type: "String"
  - name: "algorithm"
    type: "SigningAlgorithm"
  - name: "sharedSecret"
    type: "Secret"
  - name: "publicKey"
    type: "PublicKey"
  - name: "privateKey"
    type: "PemPrivateKey"
  - name: "active"
    type: "Boolean"
  - name: "rotationDate"
    type: "Date"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "subscriptions"
    type: "WebhookSubscription"
    multiplicity: "OneToMany"
- name: "FilterRule"
  description: "Condition that selects or excludes events for a subscription based\
    \ on payload attributes."
  data:
  - name: "attributePath"
    type: "JsonPath"
  - name: "operator_"
    type: "FilterOperator"
  - name: "expectedValue"
    type: "String"
  - name: "negate"
    type: "Boolean"
  relations:
  - name: "subscription"
    type: "WebhookSubscription"
    multiplicity: "ManyToOne"
- name: "Transformation"
  description: "Payload template or expression applied before delivery to the endpoint."
  data:
  - name: "name"
    type: "String"
  - name: "transformationType"
    type: "TransformationType"
  - name: "template"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "eventType"
    type: "EventType"
    multiplicity: "ManyToOne"
  - name: "subscription"
    type: "WebhookSubscription"
    multiplicity: "ManyToOne"
- name: "EventMessage"
  description: "Canonical event instance captured for dispatching, auditing, and replay."
  data:
  - name: "eventTypeName"
    type: "String"
  - name: "occurredAt"
    type: "DateTime"
  - name: "payload"
    type: "String"
  - name: "correlationKey"
    type: "String"
  relations:
  - name: "source"
    type: "EventSource"
    multiplicity: "ManyToOne"
  - name: "deliveries"
    type: "Delivery"
    multiplicity: "OneToMany"
- name: "Delivery"
  description: "Execution record for sending an event message to a specific subscription."
  data:
  - name: "status"
    type: "DeliveryStatus"
  - name: "firstAttemptTime"
    type: "DateTime"
  - name: "lastAttemptTime"
    type: "DateTime"
  - name: "attemptCount"
    type: "Integer"
  - name: "lastResponseCode"
    type: "Integer"
  - name: "lastResponseBody"
    type: "String"
  - name: "nextAttemptTime"
    type: "DateTime"
  - name: "final"
    type: "Boolean"
  relations:
  - name: "subscription"
    type: "WebhookSubscription"
    multiplicity: "ManyToOne"
  - name: "eventMessage"
    type: "EventMessage"
    multiplicity: "ManyToOne"
  - name: "attempts"
    type: "DeliveryAttempt"
    multiplicity: "OneToMany"
  - name: "deadLetter"
    type: "DeadLetterMessage"
    multiplicity: "ManyToOne"
- name: "DeliveryAttempt"
  description: "Individual HTTP invocation attempt including request and response\
    \ details."
  data:
  - name: "attemptTime"
    type: "DateTime"
  - name: "requestHeaders"
    type: "String"
  - name: "requestBody"
    type: "String"
  - name: "responseCode"
    type: "Integer"
  - name: "responseHeaders"
    type: "String"
  - name: "responseBody"
    type: "String"
  - name: "errorMessage"
    type: "String"
  - name: "networkDurationMs"
    type: "Integer"
  relations:
  - name: "delivery"
    type: "Delivery"
    multiplicity: "ManyToOne"
- name: "DeadLetterMessage"
  description: "Persisted message that could not be delivered after retries."
  data:
  - name: "reason"
    type: "String"
  - name: "archivedAt"
    type: "DateTime"
  - name: "retryable"
    type: "Boolean"
  relations:
  - name: "subscription"
    type: "WebhookSubscription"
    multiplicity: "ManyToOne"
  - name: "delivery"
    type: "Delivery"
    multiplicity: "ManyToOne"
  - name: "eventMessage"
    type: "EventMessage"
    multiplicity: "ManyToOne"
  - name: "replayRequests"
    type: "ReplayRequest"
    multiplicity: "OneToMany"
- name: "ReplayRequest"
  description: "Instruction to resend a failed message from dead letter storage."
  data:
  - name: "requestedAt"
    type: "DateTime"
  - name: "requestedBy"
    type: "String"
  - name: "status"
    type: "ReplayStatus"
  - name: "comment"
    type: "String"
  relations:
  - name: "deadLetterMessage"
    type: "DeadLetterMessage"
    multiplicity: "ManyToOne"
  - name: "targetSubscription"
    type: "WebhookSubscription"
    multiplicity: "ManyToOne"
  - name: "newDelivery"
    type: "Delivery"
    multiplicity: "OneToOne"
- name: "SuppressionRule"
  description: "Time-bounded rule that mutes deliveries matching specific criteria."
  data:
  - name: "name"
    type: "String"
  - name: "startsAt"
    type: "DateTime"
  - name: "endsAt"
    type: "DateTime"
  - name: "reason"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  - name: "eventTypeName"
    type: "String"
  - name: "targetUrlPattern"
    type: "String"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
- name: "HealthCheck"
  description: "Periodic assessment of endpoint reachability and TLS posture."
  data:
  - name: "checkedAt"
    type: "DateTime"
  - name: "reachable"
    type: "Boolean"
  - name: "tlsValid"
    type: "Boolean"
  - name: "dnsResolved"
    type: "Boolean"
  - name: "responseTimeMs"
    type: "Integer"
  relations:
  - name: "subscription"
    type: "WebhookSubscription"
    multiplicity: "ManyToOne"
- name: "AuditLog"
  description: "Record of administrative actions and configuration changes within\
    \ the platform."
  data:
  - name: "occurredAt"
    type: "DateTime"
  - name: "actor"
    type: "String"
  - name: "action"
    type: "String"
  - name: "targetType"
    type: "String"
  - name: "targetName"
    type: "String"
  - name: "details"
    type: "String"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
enums:
- name: "EnvironmentType"
  description: "Classification of the environment used to isolate configurations and\
    \ traffic."
  data:
  - name: "Development"
  - name: "Staging"
  - name: "Production"
  - name: "Sandbox"
- name: "SubscriptionStatus"
  description: "Lifecycle state of a webhook subscription."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Paused"
  - name: "PendingVerification"
  - name: "Disabled"
- name: "DeliveryStatus"
  description: "State of a delivery workflow for a single message and subscription."
  data:
  - name: "Scheduled"
  - name: "InProgress"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Retrying"
  - name: "DeadLettered"
  - name: "Cancelled"
  - name: "Skipped"
- name: "HttpMethod"
  description: "HTTP verb used when invoking the webhook endpoint."
  data:
  - name: "POST"
  - name: "PUT"
  - name: "PATCH"
- name: "AuthType"
  description: "Authentication mechanism for outbound webhook requests."
  data:
  - name: "None"
  - name: "Basic"
  - name: "OAuth2ClientCredentials"
  - name: "ApiKey"
  - name: "MTLS"
- name: "SigningAlgorithm"
  description: "Algorithm used to compute request signatures."
  data:
  - name: "None"
  - name: "HMACSHA256"
  - name: "HMACSHA1"
  - name: "RSASHA256"
  - name: "Ed25519"
- name: "RetryStrategy"
  description: "Approach used to schedule subsequent delivery attempts."
  data:
  - name: "None"
  - name: "Fixed"
  - name: "LinearBackoff"
  - name: "ExponentialBackoff"
- name: "FilterOperator"
  description: "Comparison operator applied to event payload attributes during filtering."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "Contains"
  - name: "StartsWith"
  - name: "EndsWith"
  - name: "Regex"
  - name: "GreaterThan"
  - name: "LessThan"
  - name: "Exists"
  - name: "In"
- name: "RateLimitScope"
  description: "Boundary over which rate limiting is measured and enforced."
  data:
  - name: "PerSubscription"
  - name: "PerEndpoint"
  - name: "PerTenant"
  - name: "Global"
- name: "EventFormat"
  description: "Canonical envelope format for captured events."
  data:
  - name: "CloudEventsJson"
  - name: "CustomJson"
- name: "TransformationType"
  description: "Mechanism used to transform event payloads prior to delivery."
  data:
  - name: "None"
  - name: "Liquid"
  - name: "JQ"
  - name: "JMESPath"
  - name: "Velocity"
- name: "CompressionType"
  description: "Compression applied to the HTTP request body."
  data:
  - name: "None"
  - name: "Gzip"
  - name: "Deflate"
- name: "ReplayStatus"
  description: "Processing state of a replay request."
  data:
  - name: "Submitted"
  - name: "InProgress"
  - name: "Completed"
  - name: "Failed"
  - name: "Cancelled"
valueObjects:
- name: "URL"
  description: "Fully qualified URI to an external HTTP or HTTPS endpoint."
  data:
  - name: "value"
    type: "String"
- name: "Secret"
  description: "Confidential text used for webhook signing or outbound authentication."
  data:
  - name: "value"
    type: "String"
- name: "Duration"
  description: "Time span represented in seconds."
  data:
  - name: "seconds"
    type: "Integer"
- name: "RateLimit"
  description: "Throughput constraints used in throttling decisions."
  data:
  - name: "requestsPerMinute"
    type: "Integer"
  - name: "burstCapacity"
    type: "Integer"
- name: "Certificate"
  description: "X.509 certificate encoded in PEM format."
  data:
  - name: "pem"
    type: "String"
- name: "PemPrivateKey"
  description: "Private key material encoded in PEM format."
  data:
  - name: "pem"
    type: "String"
- name: "PublicKey"
  description: "Public key material encoded in PEM format."
  data:
  - name: "pem"
    type: "String"
- name: "JsonPath"
  description: "Expression for addressing elements within a JSON structure."
  data:
  - name: "expression"
    type: "String"
- name: "SignatureHeaderSpec"
  description: "Instruction for placing the computed signature into a request header."
  data:
  - name: "headerName"
    type: "String"
  - name: "schemePrefix"
    type: "String"
