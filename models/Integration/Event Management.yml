---
metadata:
  name: "HCIDL Event Management Capabilities Model"
  description: "Canonical capabilities model for managing event-driven integration,\
    \ covering topics, schemas, producers, consumers, routing, governance, and operations."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Integration"
  type: "Capability"
  domain: "Event Management"
entities:
- name: "EventBus"
  description: "Logical backbone that organizes clusters, topics, schemas, and governance\
    \ for an event-driven integration domain."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "String"
  - name: "transportProtocol"
    type: "TransportProtocol"
  - name: "defaultDeliverySemantics"
    type: "DeliverySemantics"
  relations:
  - name: "clusters"
    type: "BrokerCluster"
    multiplicity: "OneToMany"
  - name: "topics"
    type: "EventTopic"
    multiplicity: "OneToMany"
  - name: "catalog"
    type: "EventCatalog"
    multiplicity: "OneToOne"
  - name: "governancePolicies"
    type: "GovernancePolicy"
    multiplicity: "OneToMany"
- name: "BrokerCluster"
  description: "A managed group of broker nodes that provides capacity, availability,\
    \ and protocol endpoints for event traffic."
  data:
  - name: "name"
    type: "String"
  - name: "protocol"
    type: "TransportProtocol"
  - name: "compression"
    type: "CompressionType"
  - name: "encryption"
    type: "EncryptionType"
  - name: "region"
    type: "String"
  relations:
  - name: "bus"
    type: "EventBus"
    multiplicity: "ManyToOne"
  - name: "brokers"
    type: "BrokerNode"
    multiplicity: "OneToMany"
- name: "BrokerNode"
  description: "A single broker process or appliance participating in a cluster."
  data:
  - name: "host"
    type: "String"
  - name: "port"
    type: "Integer"
  - name: "role"
    type: "BrokerNodeRole"
  - name: "status"
    type: "NodeStatus"
  relations:
  - name: "cluster"
    type: "BrokerCluster"
    multiplicity: "ManyToOne"
- name: "EventCatalog"
  description: "Curated registry of event types, topics, producers, and consumers\
    \ with ownership and documentation."
  data:
  - name: "name"
    type: "String"
  - name: "stewardshipTeam"
    type: "String"
  - name: "documentationUrl"
    type: "String"
  relations:
  - name: "eventTypes"
    type: "EventType"
    multiplicity: "OneToMany"
  - name: "topics"
    type: "EventTopic"
    multiplicity: "OneToMany"
  - name: "producers"
    type: "EventProducer"
    multiplicity: "OneToMany"
  - name: "consumers"
    type: "EventConsumer"
    multiplicity: "OneToMany"
- name: "EventTopic"
  description: "Addressable stream or subject where events are published and consumed."
  data:
  - name: "name"
    type: "String"
  - name: "creationMode"
    type: "TopicCreationMode"
  - name: "partitions"
    type: "Integer"
  - name: "retention"
    type: "RetentionConfig"
  - name: "compactionEnabled"
    type: "Boolean"
  - name: "orderingGuarantee"
    type: "OrderingGuarantee"
  relations:
  - name: "bus"
    type: "EventBus"
    multiplicity: "ManyToOne"
  - name: "partitionsDetail"
    type: "TopicPartition"
    multiplicity: "OneToMany"
  - name: "eventTypes"
    type: "EventType"
    multiplicity: "ManyToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "deadLetter"
    type: "DeadLetterChannel"
    multiplicity: "OneToOne"
- name: "TopicPartition"
  description: "Shard of a topic used to scale throughput and parallelize consumption."
  data:
  - name: "partitionNumber"
    type: "Integer"
  - name: "strategy"
    type: "PartitionStrategy"
  relations:
  - name: "topic"
    type: "EventTopic"
    multiplicity: "ManyToOne"
- name: "EventType"
  description: "Canonical semantic description of an event and its schema lifecycle."
  data:
  - name: "name"
    type: "String"
  - name: "encoding"
    type: "EventEncoding"
  - name: "versioningStrategy"
    type: "VersioningStrategy"
  - name: "summary"
    type: "String"
  relations:
  - name: "schema"
    type: "EventSchema"
    multiplicity: "OneToOne"
  - name: "topics"
    type: "EventTopic"
    multiplicity: "ManyToMany"
  - name: "producers"
    type: "EventProducer"
    multiplicity: "ManyToMany"
  - name: "consumers"
    type: "EventConsumer"
    multiplicity: "ManyToMany"
- name: "EventSchema"
  description: "Logical container for schema versions associated with an event type."
  data:
  - name: "name"
    type: "String"
  - name: "format"
    type: "EventEncoding"
  relations:
  - name: "versions"
    type: "SchemaVersion"
    multiplicity: "OneToMany"
  - name: "eventType"
    type: "EventType"
    multiplicity: "OneToOne"
- name: "SchemaVersion"
  description: "Concrete, immutable version of a schema definition with compatibility\
    \ guarantees."
  data:
  - name: "version"
    type: "String"
  - name: "definition"
    type: "SchemaDefinition"
  - name: "compatibility"
    type: "CompatibilityMode"
  relations:
  - name: "schema"
    type: "EventSchema"
    multiplicity: "ManyToOne"
- name: "EventProducer"
  description: "Application or integration that publishes events to topics."
  data:
  - name: "name"
    type: "String"
  - name: "sourceSystem"
    type: "String"
  - name: "applicationOwner"
    type: "String"
  - name: "deliverySemantics"
    type: "DeliverySemantics"
  - name: "compressMessages"
    type: "Boolean"
  - name: "authentication"
    type: "AuthType"
  relations:
  - name: "topics"
    type: "EventTopic"
    multiplicity: "ManyToMany"
  - name: "eventTypes"
    type: "EventType"
    multiplicity: "ManyToMany"
  - name: "credentials"
    type: "ClientCredential"
    multiplicity: "OneToOne"
- name: "EventConsumer"
  description: "Application or integration that subscribes to and processes events."
  data:
  - name: "name"
    type: "String"
  - name: "applicationOwner"
    type: "String"
  - name: "subscriptionType"
    type: "SubscriptionType"
  - name: "deliverySemantics"
    type: "DeliverySemantics"
  - name: "maxConcurrency"
    type: "Integer"
  relations:
  - name: "topics"
    type: "EventTopic"
    multiplicity: "ManyToMany"
  - name: "eventTypes"
    type: "EventType"
    multiplicity: "ManyToMany"
  - name: "consumerGroup"
    type: "ConsumerGroup"
    multiplicity: "ManyToOne"
  - name: "credentials"
    type: "ClientCredential"
    multiplicity: "OneToOne"
  - name: "deadLetter"
    type: "DeadLetterChannel"
    multiplicity: "ManyToOne"
  - name: "endpoint"
    type: "DeliveryEndpoint"
    multiplicity: "OneToOne"
- name: "ConsumerGroup"
  description: "Coordinated set of consumers that share subscriptions and offsets."
  data:
  - name: "name"
    type: "String"
  - name: "autoOffsetReset"
    type: "OffsetResetStrategy"
  - name: "replay"
    type: "ReplayConfig"
  relations:
  - name: "consumers"
    type: "EventConsumer"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
- name: "Subscription"
  description: "Binding of a consumer group to a topic with delivery, retry, and filtering\
    \ rules."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "SubscriptionStatus"
  - name: "filter"
    type: "EventFilter"
  - name: "maxLagSeconds"
    type: "Integer"
  - name: "retryPolicy"
    type: "RetryPolicy"
  relations:
  - name: "topic"
    type: "EventTopic"
    multiplicity: "ManyToOne"
  - name: "consumerGroup"
    type: "ConsumerGroup"
    multiplicity: "ManyToOne"
  - name: "deadLetter"
    type: "DeadLetterChannel"
    multiplicity: "ManyToOne"
  - name: "route"
    type: "EventRoute"
    multiplicity: "ManyToOne"
- name: "DeliveryEndpoint"
  description: "Addressable destination for push delivery or sink integrations."
  data:
  - name: "name"
    type: "String"
  - name: "endpointType"
    type: "EndpointType"
  - name: "url"
    type: "EndpointURL"
  - name: "auth"
    type: "AuthType"
  - name: "throttling"
    type: "ThrottlePolicy"
  relations:
  - name: "consumers"
    type: "EventConsumer"
    multiplicity: "OneToMany"
  - name: "routes"
    type: "EventRoute"
    multiplicity: "OneToMany"
- name: "EventRoute"
  description: "Declarative rule that connects a source topic to a destination endpoint\
    \ with optional transformation."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  - name: "transformation"
    type: "TransformationSpec"
  - name: "order"
    type: "Integer"
  relations:
  - name: "sourceTopic"
    type: "EventTopic"
    multiplicity: "ManyToOne"
  - name: "destinationEndpoint"
    type: "DeliveryEndpoint"
    multiplicity: "ManyToOne"
  - name: "appliedSchemas"
    type: "SchemaVersion"
    multiplicity: "ManyToMany"
- name: "DeadLetterChannel"
  description: "Configured quarantine for messages that cannot be delivered or processed."
  data:
  - name: "name"
    type: "String"
  - name: "storageType"
    type: "DeadLetterStorageType"
  - name: "retention"
    type: "RetentionConfig"
  - name: "reprocessEnabled"
    type: "Boolean"
  relations:
  - name: "sourceSubscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "topic"
    type: "EventTopic"
    multiplicity: "ManyToOne"
  - name: "endpoint"
    type: "DeliveryEndpoint"
    multiplicity: "ManyToOne"
- name: "ClientCredential"
  description: "Authentication material used by producers, consumers, and endpoints."
  data:
  - name: "name"
    type: "String"
  - name: "authType"
    type: "AuthType"
  - name: "keyId"
    type: "String"
  - name: "secretReference"
    type: "String"
  - name: "certificateFingerprint"
    type: "String"
  relations:
  - name: "producers"
    type: "EventProducer"
    multiplicity: "OneToMany"
  - name: "consumers"
    type: "EventConsumer"
    multiplicity: "OneToMany"
  - name: "endpoints"
    type: "DeliveryEndpoint"
    multiplicity: "OneToMany"
- name: "Connector"
  description: "Managed source or sink that bridges the event bus to external systems."
  data:
  - name: "name"
    type: "String"
  - name: "connectorType"
    type: "ConnectorType"
  - name: "externalSystem"
    type: "String"
  - name: "schedule"
    type: "Schedule"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "topics"
    type: "EventTopic"
    multiplicity: "ManyToMany"
  - name: "bus"
    type: "EventBus"
    multiplicity: "ManyToOne"
  - name: "endpoint"
    type: "DeliveryEndpoint"
    multiplicity: "ManyToOne"
- name: "MonitoringAlert"
  description: "Observable condition with notification targets to ensure reliability\
    \ and performance."
  data:
  - name: "name"
    type: "String"
  - name: "severity"
    type: "AlertSeverity"
  - name: "condition"
    type: "String"
  - name: "notificationChannel"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "topic"
    type: "EventTopic"
    multiplicity: "ManyToOne"
  - name: "consumerGroup"
    type: "ConsumerGroup"
    multiplicity: "ManyToOne"
  - name: "producer"
    type: "EventProducer"
    multiplicity: "ManyToOne"
- name: "GovernancePolicy"
  description: "Enforceable rule set that governs naming, schema, retention, access,\
    \ and lifecycle for event assets."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "GovernancePolicyType"
  - name: "rules"
    type: "String"
  - name: "enforced"
    type: "Boolean"
  relations:
  - name: "eventBus"
    type: "EventBus"
    multiplicity: "ManyToOne"
  - name: "topics"
    type: "EventTopic"
    multiplicity: "ManyToMany"
  - name: "catalog"
    type: "EventCatalog"
    multiplicity: "ManyToOne"
enums:
- name: "TransportProtocol"
  description: "Network and messaging protocol used by the event infrastructure."
  data:
  - name: "Kafka"
  - name: "AMQP"
  - name: "MQTT"
  - name: "NATS"
  - name: "HTTP"
- name: "DeliverySemantics"
  description: "Contract that defines how delivery attempts relate to original publications."
  data:
  - name: "AtMostOnce"
  - name: "AtLeastOnce"
  - name: "ExactlyOnce"
- name: "TopicCreationMode"
  description: "Governance for how a topic is provisioned and maintained."
  data:
  - name: "Managed"
  - name: "External"
- name: "PartitionStrategy"
  description: "Algorithm used to assign events to partitions."
  data:
  - name: "HashKey"
  - name: "RoundRobin"
  - name: "StickyKey"
  - name: "Custom"
- name: "EventEncoding"
  description: "Serialization format for the event payload and schema."
  data:
  - name: "JSON"
  - name: "Avro"
  - name: "Protobuf"
  - name: "XML"
  - name: "CloudEventsJSON"
- name: "VersioningStrategy"
  description: "Approach for progressing schema and event type versions."
  data:
  - name: "SemVer"
  - name: "Calendar"
  - name: "Incremental"
- name: "CompatibilityMode"
  description: "Schema evolution rule that validates new versions against prior versions."
  data:
  - name: "Backward"
  - name: "Forward"
  - name: "Full"
  - name: "None"
  - name: "TransitiveBackward"
  - name: "TransitiveForward"
  - name: "TransitiveFull"
- name: "SubscriptionType"
  description: "Mechanism by which a consumer receives events."
  data:
  - name: "Pull"
  - name: "Push"
  - name: "Stream"
- name: "SubscriptionStatus"
  description: "Lifecycle state of a subscription."
  data:
  - name: "Active"
  - name: "Paused"
  - name: "Suspended"
  - name: "Deleted"
- name: "BrokerNodeRole"
  description: "Functional role a broker node performs within a cluster."
  data:
  - name: "Leader"
  - name: "Follower"
  - name: "Controller"
- name: "NodeStatus"
  description: "Operational readiness of a broker node."
  data:
  - name: "Active"
  - name: "Draining"
  - name: "Down"
  - name: "Maintenance"
- name: "OrderingGuarantee"
  description: "Strength of ordering assurance provided for event consumption."
  data:
  - name: "None"
  - name: "PerPartition"
  - name: "PerKey"
  - name: "Global"
- name: "CompressionType"
  description: "Compression algorithm applied to transported messages."
  data:
  - name: "None"
  - name: "Gzip"
  - name: "Snappy"
  - name: "LZ4"
  - name: "Zstd"
- name: "EncryptionType"
  description: "Encryption mechanism protecting messages in transit."
  data:
  - name: "None"
  - name: "TLS"
  - name: "MTLS"
  - name: "KMS"
- name: "AuthType"
  description: "Authentication approach used by clients and endpoints."
  data:
  - name: "APIKey"
  - name: "OAuth2Client"
  - name: "MutualTLS"
  - name: "SASLPlain"
  - name: "SASLScram"
- name: "OffsetResetStrategy"
  description: "Default offset position used when no committed offset is present."
  data:
  - name: "Earliest"
  - name: "Latest"
  - name: "Timestamp"
- name: "DeadLetterStorageType"
  description: "Storage backing for dead-lettered messages."
  data:
  - name: "Topic"
  - name: "Queue"
  - name: "ObjectStore"
  - name: "Database"
- name: "EndpointType"
  description: "Destination style for push or routed deliveries."
  data:
  - name: "Webhook"
  - name: "Queue"
  - name: "Function"
  - name: "Stream"
  - name: "Storage"
- name: "ConnectorType"
  description: "Direction of data movement for a managed connector."
  data:
  - name: "Source"
  - name: "Sink"
- name: "AlertSeverity"
  description: "Criticality level used to triage operational alerts."
  data:
  - name: "Info"
  - name: "Warning"
  - name: "Critical"
- name: "GovernancePolicyType"
  description: "Area of concern addressed by a governance policy."
  data:
  - name: "Naming"
  - name: "Schema"
  - name: "Security"
  - name: "Retention"
  - name: "AccessControl"
  - name: "Lifecycle"
- name: "BackoffStrategy"
  description: "Timing pattern for successive retry attempts."
  data:
  - name: "None"
  - name: "Fixed"
  - name: "Exponential"
  - name: "ExponentialJitter"
- name: "FilterType"
  description: "Primary method used to match events against a subscription filter."
  data:
  - name: "Header"
  - name: "Payload"
  - name: "Attribute"
  - name: "SchemaPath"
- name: "TransformLanguage"
  description: "Language or engine used to express message transformations."
  data:
  - name: "JQ"
  - name: "JOLT"
  - name: "CEL"
  - name: "JavaScript"
  - name: "XPath"
- name: "ReplayMode"
  description: "Strategy for replaying historical messages to a consumer group."
  data:
  - name: "FromBeginning"
  - name: "FromTimestamp"
  - name: "FromBookmark"
  - name: "LastCommitted"
- name: "RetentionPolicyType"
  description: "Rule determining how long or how much data a topic retains."
  data:
  - name: "Time"
  - name: "Size"
  - name: "Infinite"
  - name: "Compact"
valueObjects:
- name: "SchemaDefinition"
  description: "Serialized schema content and its declared format."
  data:
  - name: "format"
    type: "EventEncoding"
  - name: "definition"
    type: "String"
- name: "RetryPolicy"
  description: "Rules governing redelivery attempts for failed messages."
  data:
  - name: "maxAttempts"
    type: "Integer"
  - name: "backoffStrategy"
    type: "BackoffStrategy"
  - name: "initialIntervalMillis"
    type: "Integer"
  - name: "maxIntervalMillis"
    type: "Integer"
  - name: "jitterPercent"
    type: "Integer"
- name: "ThrottlePolicy"
  description: "Rate limiting configuration for outbound deliveries."
  data:
  - name: "requestsPerSecond"
    type: "Integer"
  - name: "burstCapacity"
    type: "Integer"
- name: "EndpointURL"
  description: "Network location used to reach a push delivery destination."
  data:
  - name: "value"
    type: "String"
- name: "EventFilter"
  description: "Declarative predicate that selects messages for a subscription."
  data:
  - name: "type"
    type: "FilterType"
  - name: "expression"
    type: "String"
- name: "RetentionConfig"
  description: "Topic retention settings governing time or size-based data lifecycle."
  data:
  - name: "policy"
    type: "RetentionPolicyType"
  - name: "timeInHours"
    type: "Integer"
  - name: "sizeInMB"
    type: "Integer"
- name: "ReplayConfig"
  description: "Parameters controlling how a consumer group reprocesses historical\
    \ messages."
  data:
  - name: "mode"
    type: "ReplayMode"
  - name: "timestamp"
    type: "Date"
  - name: "bookmark"
    type: "String"
- name: "Schedule"
  description: "Time-based trigger for connector operations using cron notation."
  data:
  - name: "expression"
    type: "String"
  - name: "timezone"
    type: "String"
- name: "TransformationSpec"
  description: "Portable specification of message transformation logic."
  data:
  - name: "language"
    type: "TransformLanguage"
  - name: "script"
    type: "String"
