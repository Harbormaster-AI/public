---
metadata:
  name: "HCIDL ETL Capabilities Model"
  description: "Capability model for designing, executing, and governing ETL processes\
    \ including connections, pipelines, scheduling, transformations, quality controls,\
    \ lineage, and operational telemetry across heterogeneous data platforms."
  version: "1.0.0"
  industry: "Information Technology"
  category: "Integration"
  type: "Capability"
  domain: "ETL"
entities:
- name: "IntegrationWorkspace"
  description: "Administrative boundary for ETL assets including pipelines, connections,\
    \ environments, staging areas, and shared governance controls."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "owner"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "connections"
    type: "ConnectionProfile"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "DataAsset"
    multiplicity: "OneToMany"
  - name: "pipelines"
    type: "Pipeline"
    multiplicity: "OneToMany"
  - name: "environments"
    type: "Environment"
    multiplicity: "OneToMany"
  - name: "stagingAreas"
    type: "StagingArea"
    multiplicity: "OneToMany"
  - name: "qualityRules"
    type: "DataQualityRule"
    multiplicity: "OneToMany"
- name: "Environment"
  description: "Execution context for deployments and runs such as development, test,\
    \ staging, or production."
  data:
  - name: "name"
    type: "String"
  - name: "environmentType"
    type: "EnvironmentType"
  - name: "description"
    type: "String"
  relations:
  - name: "workspace"
    type: "IntegrationWorkspace"
    multiplicity: "ManyToOne"
  - name: "pipelineRuns"
    type: "PipelineRun"
    multiplicity: "OneToMany"
- name: "ConnectionProfile"
  description: "Reusable connectivity configuration for external systems including\
    \ endpoints, authentication, and options."
  data:
  - name: "name"
    type: "String"
  - name: "connectionType"
    type: "ConnectionType"
  - name: "endpoint"
    type: "Endpoint"
  - name: "authenticationMode"
    type: "AuthenticationMode"
  - name: "secret"
    type: "SecretReference"
  - name: "defaultDatabase"
    type: "String"
  - name: "sslEnabled"
    type: "Boolean"
  - name: "options"
    type: "String"
  relations:
  - name: "workspace"
    type: "IntegrationWorkspace"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "DataAsset"
    multiplicity: "OneToMany"
- name: "DataAsset"
  description: "Logical dataset such as a table, file collection, topic, or stream\
    \ available for extraction or loading."
  data:
  - name: "name"
    type: "String"
  - name: "assetType"
    type: "DataAssetType"
  - name: "format"
    type: "DataFormat"
  - name: "path"
    type: "String"
  - name: "schemaDefinition"
    type: "String"
  - name: "partitionStrategy"
    type: "PartitionStrategy"
  - name: "compression"
    type: "CompressionType"
  - name: "retentionDays"
    type: "Integer"
  - name: "cdcMode"
    type: "ChangeDataCaptureMode"
  relations:
  - name: "workspace"
    type: "IntegrationWorkspace"
    multiplicity: "ManyToOne"
  - name: "connection"
    type: "ConnectionProfile"
    multiplicity: "ManyToOne"
  - name: "profiles"
    type: "DatasetProfile"
    multiplicity: "OneToMany"
  - name: "qualityRules"
    type: "DataQualityRule"
    multiplicity: "OneToMany"
- name: "StagingArea"
  description: "Intermediate storage used for landing or transforming data prior to\
    \ loading into target systems."
  data:
  - name: "name"
    type: "String"
  - name: "storageType"
    type: "StorageType"
  - name: "endpoint"
    type: "Endpoint"
  - name: "fileFormat"
    type: "DataFormat"
  - name: "compression"
    type: "CompressionType"
  - name: "cleanupAfterLoad"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "IntegrationWorkspace"
    multiplicity: "ManyToOne"
  - name: "pipelines"
    type: "Pipeline"
    multiplicity: "ManyToMany"
- name: "Pipeline"
  description: "Orchestrated flow that extracts from sources, applies transformations,\
    \ and loads into targets."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "String"
  - name: "scheduleType"
    type: "ScheduleType"
  - name: "concurrencyLimit"
    type: "Integer"
  - name: "enabled"
    type: "Boolean"
  - name: "retryPolicy"
    type: "RetryPolicy"
  relations:
  - name: "workspace"
    type: "IntegrationWorkspace"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "PipelineVersion"
    multiplicity: "OneToMany"
  - name: "triggers"
    type: "Trigger"
    multiplicity: "OneToMany"
  - name: "stagingAreas"
    type: "StagingArea"
    multiplicity: "ManyToMany"
- name: "PipelineVersion"
  description: "Versioned blueprint of a pipeline capturing tasks, bindings, and transformation\
    \ logic at a point in time."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "createdBy"
    type: "String"
  - name: "createdDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "pipeline"
    type: "Pipeline"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "PipelineTask"
    multiplicity: "OneToMany"
  - name: "sourceBindings"
    type: "SourceBinding"
    multiplicity: "OneToMany"
  - name: "targetBindings"
    type: "TargetBinding"
    multiplicity: "OneToMany"
  - name: "transformations"
    type: "Transformation"
    multiplicity: "OneToMany"
  - name: "runs"
    type: "PipelineRun"
    multiplicity: "OneToMany"
- name: "PipelineTask"
  description: "Executable unit within a pipeline version such as extract, transform,\
    \ load, or quality check."
  data:
  - name: "name"
    type: "String"
  - name: "taskType"
    type: "TaskType"
  - name: "sequence"
    type: "Integer"
  - name: "timeoutSeconds"
    type: "Integer"
  - name: "config"
    type: "String"
  relations:
  - name: "pipelineVersion"
    type: "PipelineVersion"
    multiplicity: "ManyToOne"
  - name: "taskRuns"
    type: "TaskRun"
    multiplicity: "OneToMany"
- name: "SourceBinding"
  description: "Association between a pipeline version and a source dataset including\
    \ filtering and incremental settings."
  data:
  - name: "name"
    type: "String"
  - name: "incremental"
    type: "Boolean"
  - name: "cdcMode"
    type: "ChangeDataCaptureMode"
  - name: "filePattern"
    type: "FilePattern"
  - name: "filterExpression"
    type: "SqlText"
  relations:
  - name: "pipelineVersion"
    type: "PipelineVersion"
    multiplicity: "ManyToOne"
  - name: "sourceAsset"
    type: "DataAsset"
    multiplicity: "ManyToOne"
- name: "TargetBinding"
  description: "Association between a pipeline version and a target dataset including\
    \ load behavior and partitioning directives."
  data:
  - name: "name"
    type: "String"
  - name: "loadMode"
    type: "LoadMode"
  - name: "truncateBeforeLoad"
    type: "Boolean"
  - name: "partitionStrategy"
    type: "PartitionStrategy"
  - name: "preLoadSql"
    type: "SqlText"
  - name: "postLoadSql"
    type: "SqlText"
  relations:
  - name: "pipelineVersion"
    type: "PipelineVersion"
    multiplicity: "ManyToOne"
  - name: "targetAsset"
    type: "DataAsset"
    multiplicity: "ManyToOne"
  - name: "fieldMappings"
    type: "FieldMapping"
    multiplicity: "OneToMany"
- name: "FieldMapping"
  description: "Column level mapping from source values to target fields with optional\
    \ inline transformation."
  data:
  - name: "sourceField"
    type: "String"
  - name: "targetField"
    type: "String"
  - name: "transformExpression"
    type: "String"
  - name: "nullable"
    type: "Boolean"
  relations:
  - name: "targetBinding"
    type: "TargetBinding"
    multiplicity: "ManyToOne"
- name: "Transformation"
  description: "Declarative or scripted transformation applied within a pipeline version."
  data:
  - name: "name"
    type: "String"
  - name: "transformType"
    type: "TransformType"
  - name: "sql"
    type: "SqlText"
  - name: "script"
    type: "Script"
  - name: "description"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "pipelineVersion"
    type: "PipelineVersion"
    multiplicity: "ManyToOne"
  - name: "dependsOn"
    type: "Transformation"
    multiplicity: "ManyToMany"
- name: "DataQualityRule"
  description: "Policy that evaluates dataset quality with thresholds and severity\
    \ for operational governance."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "RuleType"
  - name: "expression"
    type: "SqlText"
  - name: "threshold"
    type: "Decimal"
  - name: "severity"
    type: "SeverityLevel"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "IntegrationWorkspace"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "DataAsset"
    multiplicity: "ManyToOne"
- name: "Trigger"
  description: "Mechanism that initiates pipeline execution based on time, interval,\
    \ or external events."
  data:
  - name: "name"
    type: "String"
  - name: "triggerType"
    type: "ScheduleType"
  - name: "cron"
    type: "CronExpression"
  - name: "intervalSeconds"
    type: "Integer"
  - name: "eventName"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "pipeline"
    type: "Pipeline"
    multiplicity: "ManyToOne"
- name: "PipelineRun"
  description: "Time bound execution of a specific pipeline version with aggregated\
    \ metrics and outcomes."
  data:
  - name: "runNumber"
    type: "String"
  - name: "startTime"
    type: "Date"
  - name: "endTime"
    type: "Date"
  - name: "status"
    type: "JobStatus"
  - name: "rowsRead"
    type: "Integer"
  - name: "rowsWritten"
    type: "Integer"
  - name: "errorCount"
    type: "Integer"
  - name: "warningsCount"
    type: "Integer"
  relations:
  - name: "pipelineVersion"
    type: "PipelineVersion"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "taskRuns"
    type: "TaskRun"
    multiplicity: "OneToMany"
  - name: "validationResults"
    type: "ValidationResult"
    multiplicity: "OneToMany"
  - name: "lineageEvents"
    type: "LineageEvent"
    multiplicity: "OneToMany"
  - name: "errorLogs"
    type: "ErrorLog"
    multiplicity: "OneToMany"
- name: "TaskRun"
  description: "Execution details for a single pipeline task including timing, status,\
    \ and metrics."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "JobStatus"
  - name: "startTime"
    type: "Date"
  - name: "endTime"
    type: "Date"
  - name: "rowsProcessed"
    type: "Integer"
  - name: "errorCount"
    type: "Integer"
  relations:
  - name: "pipelineRun"
    type: "PipelineRun"
    multiplicity: "ManyToOne"
  - name: "task"
    type: "PipelineTask"
    multiplicity: "ManyToOne"
  - name: "validationResults"
    type: "ValidationResult"
    multiplicity: "OneToMany"
  - name: "errorLogs"
    type: "ErrorLog"
    multiplicity: "OneToMany"
- name: "ValidationResult"
  description: "Outcome of applying a data quality rule during a run including measured\
    \ values and status."
  data:
  - name: "evaluatedAt"
    type: "Date"
  - name: "status"
    type: "ValidationStatus"
  - name: "actualValue"
    type: "Decimal"
  - name: "threshold"
    type: "Decimal"
  - name: "message"
    type: "String"
  relations:
  - name: "rule"
    type: "DataQualityRule"
    multiplicity: "ManyToOne"
  - name: "taskRun"
    type: "TaskRun"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "DataAsset"
    multiplicity: "ManyToOne"
- name: "LineageEvent"
  description: "Record of data movement or transformation between datasets produced\
    \ during a run."
  data:
  - name: "eventType"
    type: "LineageEventType"
  - name: "occurredAt"
    type: "Date"
  - name: "detail"
    type: "String"
  relations:
  - name: "pipelineRun"
    type: "PipelineRun"
    multiplicity: "ManyToOne"
  - name: "sourceAsset"
    type: "DataAsset"
    multiplicity: "ManyToOne"
  - name: "targetAsset"
    type: "DataAsset"
    multiplicity: "ManyToOne"
- name: "ErrorLog"
  description: "Diagnostic record captured during execution for failures, warnings,\
    \ and unexpected conditions."
  data:
  - name: "code"
    type: "String"
  - name: "message"
    type: "String"
  - name: "severity"
    type: "SeverityLevel"
  - name: "occurredAt"
    type: "Date"
  - name: "context"
    type: "String"
  relations:
  - name: "pipelineRun"
    type: "PipelineRun"
    multiplicity: "ManyToOne"
  - name: "taskRun"
    type: "TaskRun"
    multiplicity: "ManyToOne"
- name: "DatasetProfile"
  description: "Statistical summary of a dataset computed from a sample or full scan\
    \ to support quality and planning."
  data:
  - name: "profileDate"
    type: "Date"
  - name: "rowCount"
    type: "Integer"
  - name: "columnCount"
    type: "Integer"
  - name: "nullRatio"
    type: "Decimal"
  - name: "distinctRatio"
    type: "Decimal"
  - name: "sampleLocation"
    type: "String"
  relations:
  - name: "asset"
    type: "DataAsset"
    multiplicity: "ManyToOne"
  - name: "pipelineRun"
    type: "PipelineRun"
    multiplicity: "ManyToOne"
enums:
- name: "ConnectionType"
  description: "Supported connector families for reaching data systems."
  data:
  - name: "JDBC"
  - name: "ODBC"
  - name: "REST"
  - name: "S3"
  - name: "AzureBlob"
  - name: "GCS"
  - name: "FTP"
  - name: "Kafka"
  - name: "Filesystem"
  - name: "Snowflake"
  - name: "BigQuery"
- name: "AuthenticationMode"
  description: "Mechanisms used to authenticate against external systems."
  data:
  - name: "None"
  - name: "Basic"
  - name: "OAuth2"
  - name: "ApiKey"
  - name: "KeyPair"
  - name: "IAMRole"
- name: "DataAssetType"
  description: "Classification of the dataset abstraction used by ETL."
  data:
  - name: "Table"
  - name: "View"
  - name: "File"
  - name: "Topic"
  - name: "Stream"
- name: "DataFormat"
  description: "Serialization formats for persisted or transported data."
  data:
  - name: "CSV"
  - name: "JSON"
  - name: "Parquet"
  - name: "Avro"
  - name: "XML"
  - name: "ORC"
  - name: "Text"
- name: "ScheduleType"
  description: "Categories of triggers that initiate pipeline execution."
  data:
  - name: "Manual"
  - name: "Cron"
  - name: "Interval"
  - name: "EventBased"
- name: "TaskType"
  description: "Functional role performed by a pipeline task."
  data:
  - name: "Extract"
  - name: "Transform"
  - name: "Load"
  - name: "QualityCheck"
  - name: "Stage"
  - name: "Custom"
- name: "TransformType"
  description: "Styles of transformation logic expressed within a pipeline."
  data:
  - name: "SQL"
  - name: "Expression"
  - name: "Script"
  - name: "Aggregation"
  - name: "Join"
  - name: "Filter"
  - name: "Pivot"
  - name: "Unpivot"
  - name: "Mapping"
- name: "LoadMode"
  description: "Strategies for applying changes to a target dataset."
  data:
  - name: "Append"
  - name: "Upsert"
  - name: "Overwrite"
  - name: "Merge"
  - name: "Incremental"
- name: "StorageType"
  description: "Storage backends used for staging or persistence."
  data:
  - name: "ObjectStore"
  - name: "Filesystem"
  - name: "Database"
  - name: "MessageQueue"
  - name: "DataWarehouse"
  - name: "DataLake"
- name: "JobStatus"
  description: "Lifecycle states for task and pipeline executions."
  data:
  - name: "Queued"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Cancelled"
  - name: "Skipped"
  - name: "PartialSuccess"
- name: "SeverityLevel"
  description: "Relative importance of an event for monitoring and alerting."
  data:
  - name: "Info"
  - name: "Warning"
  - name: "Error"
  - name: "Critical"
- name: "RuleType"
  description: "Families of data quality checks used to validate datasets."
  data:
  - name: "Uniqueness"
  - name: "Completeness"
  - name: "Range"
  - name: "ReferentialIntegrity"
  - name: "Pattern"
  - name: "Anomaly"
  - name: "Freshness"
  - name: "DuplicateDetection"
- name: "CompressionType"
  description: "Compression algorithms applied to stored files."
  data:
  - name: "None"
  - name: "Gzip"
  - name: "Snappy"
  - name: "Bzip2"
  - name: "Zstd"
- name: "PartitionStrategy"
  description: "Techniques for segmenting data for storage or processing."
  data:
  - name: "None"
  - name: "Date"
  - name: "Hash"
  - name: "Range"
  - name: "List"
- name: "LineageEventType"
  description: "Types of lineage actions captured during execution."
  data:
  - name: "Read"
  - name: "Write"
  - name: "Transform"
  - name: "Copy"
  - name: "Delete"
- name: "EnvironmentType"
  description: "Categories of runtime environments for ETL operations."
  data:
  - name: "Development"
  - name: "Test"
  - name: "Staging"
  - name: "Production"
- name: "ChangeDataCaptureMode"
  description: "Approaches for extracting incremental changes from sources."
  data:
  - name: "None"
  - name: "LogBased"
  - name: "TriggerBased"
  - name: "Timestamp"
  - name: "Snapshot"
- name: "ValidationStatus"
  description: "Outcome states for quality rule evaluation."
  data:
  - name: "Passed"
  - name: "Failed"
  - name: "Skipped"
valueObjects:
- name: "Endpoint"
  description: "Network location descriptor for connecting to a data system."
  data:
  - name: "host"
    type: "String"
  - name: "port"
    type: "Integer"
  - name: "path"
    type: "String"
  - name: "sslEnabled"
    type: "Boolean"
- name: "SecretReference"
  description: "Indirection to credentials managed outside the model such as a vault\
    \ key."
  data:
  - name: "name"
    type: "String"
  - name: "provider"
    type: "String"
  - name: "scope"
    type: "String"
- name: "CronExpression"
  description: "Cron schedule string and timezone for time based triggers."
  data:
  - name: "value"
    type: "String"
  - name: "timezone"
    type: "String"
- name: "SqlText"
  description: "SQL statement body used for filtering, transformation, or control\
    \ statements."
  data:
  - name: "value"
    type: "String"
- name: "Script"
  description: "Scripted transformation or task logic and its language."
  data:
  - name: "language"
    type: "String"
  - name: "code"
    type: "String"
- name: "FilePattern"
  description: "File discovery pattern and options for selecting input files."
  data:
  - name: "pattern"
    type: "String"
  - name: "recursive"
    type: "Boolean"
  - name: "includeHidden"
    type: "Boolean"
- name: "RetryPolicy"
  description: "Parameters controlling retry behavior for failed tasks or pipelines."
  data:
  - name: "maxAttempts"
    type: "Integer"
  - name: "backoffSeconds"
    type: "Integer"
  - name: "jitterSeconds"
    type: "Integer"
