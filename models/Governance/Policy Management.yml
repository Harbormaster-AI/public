---
metadata:
  name: "Policy Management"
  description: "Capabilities model for governing the lifecycle of enterprise policies,\
    \ including creation, review, approval, publication, distribution, attestation,\
    \ exceptions, mappings to authorities and controls, and violation handling."
  version: "1.0.0"
  industry: "Government"
  category: "Identity and Security"
  type: "Capability"
  domain: "Policy Management"
entities:
- name: "Policy"
  description: "Authoritative governance document defining principles, rules, and\
    \ expectations for organizational conduct."
  data:
  - name: "title"
    type: "String"
  - name: "shortCode"
    type: "String"
  - name: "policyCategory"
    type: "PolicyCategory"
  - name: "informationClassification"
    type: "InformationClassification"
  - name: "status"
    type: "PolicyStatus"
  - name: "language"
    type: "Language"
  - name: "summary"
    type: "TextBlock"
  - name: "reviewFrequency"
    type: "ReviewFrequency"
  - name: "lastReviewedOn"
    type: "Date"
  - name: "nextReviewOn"
    type: "Date"
  relations:
  - name: "owner"
    type: "Stakeholder"
    multiplicity: "ManyToOne"
  - name: "custodians"
    type: "Stakeholder"
    multiplicity: "ManyToMany"
  - name: "versions"
    type: "PolicyVersion"
    multiplicity: "OneToMany"
  - name: "relatedPolicies"
    type: "Policy"
    multiplicity: "ManyToMany"
  - name: "authorities"
    type: "AuthorityDocument"
    multiplicity: "ManyToMany"
- name: "PolicyVersion"
  description: "Frozen iteration of a policy containing authoritative content and\
    \ mappings valid for a defined effective period."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "changeSummary"
    type: "TextBlock"
  - name: "effectiveDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "status"
    type: "PolicyStatus"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "previousVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
  - name: "sections"
    type: "PolicySection"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "PolicyApproval"
    multiplicity: "OneToMany"
  - name: "distributions"
    type: "PolicyDistribution"
    multiplicity: "OneToMany"
  - name: "attestations"
    type: "PolicyAttestation"
    multiplicity: "OneToMany"
  - name: "exceptions"
    type: "ExceptionRequest"
    multiplicity: "OneToMany"
  - name: "violations"
    type: "PolicyViolation"
    multiplicity: "OneToMany"
  - name: "mappedRequirements"
    type: "Requirement"
    multiplicity: "ManyToMany"
  - name: "mappedControls"
    type: "Control"
    multiplicity: "ManyToMany"
  - name: "trainingModules"
    type: "TrainingModule"
    multiplicity: "ManyToMany"
  - name: "referenceDocuments"
    type: "ReferenceDocument"
    multiplicity: "ManyToMany"
- name: "PolicySection"
  description: "Structured content block within a policy version, supporting hierarchy\
    \ and citations."
  data:
  - name: "heading"
    type: "String"
  - name: "orderNumber"
    type: "Integer"
  - name: "body"
    type: "TextBlock"
  - name: "referenceTag"
    type: "String"
  relations:
  - name: "policyVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
  - name: "parentSection"
    type: "PolicySection"
    multiplicity: "ManyToOne"
  - name: "subSections"
    type: "PolicySection"
    multiplicity: "OneToMany"
  - name: "citedAuthorities"
    type: "AuthorityDocument"
    multiplicity: "ManyToMany"
- name: "AuthorityDocument"
  description: "External or internal authoritative source such as a law, regulation,\
    \ standard, contract, or corporate directive."
  data:
  - name: "name"
    type: "String"
  - name: "authorityType"
    type: "AuthorityType"
  - name: "issuingBody"
    type: "String"
  - name: "citation"
    type: "String"
  - name: "jurisdiction"
    type: "String"
  - name: "referenceUrl"
    type: "URL"
  - name: "publicationDate"
    type: "Date"
  relations:
  - name: "requirements"
    type: "Requirement"
    multiplicity: "OneToMany"
  - name: "relatedPolicies"
    type: "Policy"
    multiplicity: "ManyToMany"
- name: "Requirement"
  description: "Granular obligation derived from an authority or adopted internally\
    \ that policies and controls aim to satisfy."
  data:
  - name: "code"
    type: "String"
  - name: "statement"
    type: "TextBlock"
  - name: "obligationLevel"
    type: "ObligationLevel"
  - name: "subjectArea"
    type: "String"
  - name: "riskImpact"
    type: "RiskImpact"
  relations:
  - name: "authorityDocument"
    type: "AuthorityDocument"
    multiplicity: "ManyToOne"
  - name: "controls"
    type: "Control"
    multiplicity: "ManyToMany"
  - name: "policies"
    type: "PolicyVersion"
    multiplicity: "ManyToMany"
- name: "Control"
  description: "Preventive, detective, or corrective mechanism implemented to enforce\
    \ policy requirements."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "controlType"
    type: "ControlType"
  - name: "implementationStatus"
    type: "ImplementationTier"
  - name: "ownerNote"
    type: "String"
  relations:
  - name: "controlOwner"
    type: "Stakeholder"
    multiplicity: "ManyToOne"
  - name: "requirements"
    type: "Requirement"
    multiplicity: "ManyToMany"
  - name: "policies"
    type: "PolicyVersion"
    multiplicity: "ManyToMany"
- name: "PolicyApproval"
  description: "Decision record issued by an authorized approver for a specific policy\
    \ version."
  data:
  - name: "decision"
    type: "ApprovalStatus"
  - name: "decisionDate"
    type: "Date"
  - name: "notes"
    type: "TextBlock"
  relations:
  - name: "policyVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Stakeholder"
    multiplicity: "ManyToOne"
- name: "OrganizationalUnit"
  description: "Organizational structure element such as a division, department, or\
    \ region used as a policy audience or owner context."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "unitType"
    type: "UnitType"
  relations:
  - name: "parentUnit"
    type: "OrganizationalUnit"
    multiplicity: "ManyToOne"
  - name: "childUnits"
    type: "OrganizationalUnit"
    multiplicity: "OneToMany"
  - name: "stakeholders"
    type: "Stakeholder"
    multiplicity: "OneToMany"
  - name: "distributions"
    type: "PolicyDistribution"
    multiplicity: "OneToMany"
  - name: "attestations"
    type: "PolicyAttestation"
    multiplicity: "OneToMany"
  - name: "exceptions"
    type: "ExceptionRequest"
    multiplicity: "OneToMany"
  - name: "violations"
    type: "PolicyViolation"
    multiplicity: "OneToMany"
- name: "Stakeholder"
  description: "Individual participating in the policy lifecycle as an owner, custodian,\
    \ approver, or consumer."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "stakeholderRole"
    type: "StakeholderRole"
  - name: "department"
    type: "String"
  relations:
  - name: "organizationalUnit"
    type: "OrganizationalUnit"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "PolicyApproval"
    multiplicity: "OneToMany"
  - name: "submittedChangeRequests"
    type: "ChangeRequest"
    multiplicity: "OneToMany"
  - name: "attestations"
    type: "PolicyAttestation"
    multiplicity: "OneToMany"
  - name: "exceptionRequests"
    type: "ExceptionRequest"
    multiplicity: "OneToMany"
  - name: "reportedViolations"
    type: "PolicyViolation"
    multiplicity: "OneToMany"
  - name: "ownedControls"
    type: "Control"
    multiplicity: "OneToMany"
- name: "PolicyDistribution"
  description: "Targeted release of a policy version to a specific audience through\
    \ a defined communication channel."
  data:
  - name: "channel"
    type: "DistributionChannel"
  - name: "distributedOn"
    type: "Date"
  - name: "requiresAttestation"
    type: "Boolean"
  relations:
  - name: "policyVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
  - name: "audience"
    type: "OrganizationalUnit"
    multiplicity: "ManyToOne"
- name: "PolicyAttestation"
  description: "Acknowledgement by an individual indicating they have read and agree\
    \ to comply with a policy version."
  data:
  - name: "dueDate"
    type: "Date"
  - name: "acknowledgedOn"
    type: "Date"
  - name: "status"
    type: "AttestationStatus"
  - name: "acknowledgementText"
    type: "TextBlock"
  relations:
  - name: "policyVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
  - name: "stakeholder"
    type: "Stakeholder"
    multiplicity: "ManyToOne"
  - name: "organizationalUnit"
    type: "OrganizationalUnit"
    multiplicity: "ManyToOne"
- name: "ExceptionRequest"
  description: "Time-bound request to waive or deviate from policy requirements under\
    \ defined conditions."
  data:
  - name: "referenceCode"
    type: "String"
  - name: "justification"
    type: "TextBlock"
  - name: "requestedPeriod"
    type: "DateRange"
  - name: "approvedPeriod"
    type: "DateRange"
  - name: "decision"
    type: "ExceptionStatus"
  - name: "conditions"
    type: "TextBlock"
  relations:
  - name: "policyVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
  - name: "organizationalUnit"
    type: "OrganizationalUnit"
    multiplicity: "ManyToOne"
  - name: "requester"
    type: "Stakeholder"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Stakeholder"
    multiplicity: "ManyToOne"
- name: "ChangeRequest"
  description: "Formal proposal to create, revise, or retire a policy with supporting\
    \ rationale and workflow state."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "TextBlock"
  - name: "priority"
    type: "Priority"
  - name: "submittedOn"
    type: "Date"
  - name: "status"
    type: "ChangeRequestStatus"
  - name: "targetVersionLabel"
    type: "String"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "submitter"
    type: "Stakeholder"
    multiplicity: "ManyToOne"
  - name: "reviewers"
    type: "Stakeholder"
    multiplicity: "ManyToMany"
- name: "TrainingModule"
  description: "Learning asset designed to educate stakeholders about a policy and\
    \ required behaviors."
  data:
  - name: "code"
    type: "String"
  - name: "title"
    type: "String"
  - name: "durationMinutes"
    type: "Integer"
  - name: "deliveryMethod"
    type: "TrainingDeliveryMethod"
  relations:
  - name: "policies"
    type: "PolicyVersion"
    multiplicity: "ManyToMany"
- name: "PolicyViolation"
  description: "Reported or confirmed instance of non-compliance with a policy."
  data:
  - name: "summary"
    type: "String"
  - name: "details"
    type: "TextBlock"
  - name: "severity"
    type: "ViolationSeverity"
  - name: "status"
    type: "ViolationStatus"
  - name: "reportedOn"
    type: "Date"
  - name: "resolvedOn"
    type: "Date"
  relations:
  - name: "policyVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
  - name: "organizationalUnit"
    type: "OrganizationalUnit"
    multiplicity: "ManyToOne"
  - name: "reporter"
    type: "Stakeholder"
    multiplicity: "ManyToOne"
- name: "ReferenceDocument"
  description: "Supporting internal document such as a standard, guideline, or procedure\
    \ referenced by policies."
  data:
  - name: "title"
    type: "String"
  - name: "documentType"
    type: "ReferenceDocumentType"
  - name: "referenceUrl"
    type: "URL"
  - name: "publishedOn"
    type: "Date"
  relations:
  - name: "policies"
    type: "PolicyVersion"
    multiplicity: "ManyToMany"
enums:
- name: "PolicyStatus"
  description: "Lifecycle state of a policy or policy version from drafting through\
    \ retirement."
  data:
  - name: "Draft"
  - name: "UnderReview"
  - name: "Approved"
  - name: "Published"
  - name: "Retired"
  - name: "Archived"
- name: "PolicyCategory"
  description: "Top-level thematic classification for policies."
  data:
  - name: "Governance"
  - name: "Security"
  - name: "HumanResources"
  - name: "Finance"
  - name: "InformationTechnology"
  - name: "Operations"
  - name: "Privacy"
  - name: "Risk"
- name: "InformationClassification"
  description: "Sensitivity level applied to policy content."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Confidential"
  - name: "Restricted"
- name: "AuthorityType"
  description: "Origin and nature of an authoritative source that drives policy obligations."
  data:
  - name: "Law"
  - name: "Regulation"
  - name: "Standard"
  - name: "Framework"
  - name: "Contractual"
  - name: "InternalDirective"
- name: "ObligationLevel"
  description: "Degree of mandatory adherence for a requirement statement."
  data:
  - name: "Must"
  - name: "Should"
  - name: "May"
  - name: "Prohibited"
- name: "RiskImpact"
  description: "Relative impact rating if a requirement is not met."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "ControlType"
  description: "Nature of a control in enforcing or monitoring compliance."
  data:
  - name: "Preventive"
  - name: "Detective"
  - name: "Corrective"
- name: "ImplementationTier"
  description: "Implementation maturity or status for a control or mapping."
  data:
  - name: "NotRequired"
  - name: "Planned"
  - name: "InProgress"
  - name: "Implemented"
- name: "ApprovalStatus"
  description: "Decision outcome in an approval workflow."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
  - name: "Recalled"
- name: "StakeholderRole"
  description: "Primary role a stakeholder plays in the policy lifecycle."
  data:
  - name: "Owner"
  - name: "Custodian"
  - name: "Approver"
  - name: "Reviewer"
  - name: "Employee"
  - name: "Contractor"
- name: "UnitType"
  description: "Classification of an organizational unit."
  data:
  - name: "Enterprise"
  - name: "Division"
  - name: "Department"
  - name: "Team"
  - name: "Region"
- name: "DistributionChannel"
  description: "Mechanism used to publish and communicate a policy to its audience."
  data:
  - name: "Intranet"
  - name: "Email"
  - name: "EmployeePortal"
  - name: "TownHall"
  - name: "LearningPlatform"
- name: "AttestationStatus"
  description: "Progress state of a policy attestation task."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Acknowledged"
  - name: "Overdue"
- name: "ExceptionStatus"
  description: "Decision state of a policy exception request."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Expired"
- name: "ChangeRequestStatus"
  description: "Workflow state of a policy change request."
  data:
  - name: "Open"
  - name: "InReview"
  - name: "Accepted"
  - name: "Scheduled"
  - name: "Implemented"
  - name: "Declined"
- name: "Priority"
  description: "Relative urgency of action or handling."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Urgent"
- name: "TrainingDeliveryMethod"
  description: "Mode of delivering a training module."
  data:
  - name: "OnlineSelfPaced"
  - name: "VirtualInstructorLed"
  - name: "Classroom"
  - name: "Blended"
- name: "ViolationSeverity"
  description: "Assessed seriousness of a policy violation."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "ViolationStatus"
  description: "Case management state of a policy violation record."
  data:
  - name: "Reported"
  - name: "Investigating"
  - name: "Confirmed"
  - name: "Resolved"
  - name: "Dismissed"
- name: "Language"
  description: "Primary language used to author the policy."
  data:
  - name: "English"
  - name: "Spanish"
  - name: "French"
  - name: "German"
  - name: "Japanese"
  - name: "Chinese"
- name: "ReviewFrequency"
  description: "Expected cadence for policy review."
  data:
  - name: "Annual"
  - name: "Biennial"
  - name: "Quarterly"
  - name: "AdHoc"
- name: "ReferenceDocumentType"
  description: "Kind of supporting internal document referenced by policies."
  data:
  - name: "Standard"
  - name: "Procedure"
  - name: "Guideline"
  - name: "WorkInstruction"
  - name: "Template"
valueObjects:
- name: "TextBlock"
  description: "Rich text content stored as a single block of text."
  data:
  - name: "content"
    type: "String"
- name: "URL"
  description: "Absolute locator to an external or internal resource."
  data:
  - name: "value"
    type: "String"
- name: "DateRange"
  description: "Inclusive time window with a defined start and end date."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
