---
metadata:
  name: "Risk Management Capabilities Model"
  description: "Enterprise capability model for identifying, assessing, treating,\
    \ monitoring, and reporting risks across the organization."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Governance"
  type: "Capability"
  domain: "Risk Management"
entities:
- name: "Organization"
  description: "Legal entity responsible for enterprise-level risk governance."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "businessUnits"
    type: "BusinessUnit"
    multiplicity: "OneToMany"
- name: "BusinessUnit"
  description: "Operational division or function where risks are owned and managed."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "riskRegisters"
    type: "RiskRegister"
    multiplicity: "OneToMany"
  - name: "riskEvents"
    type: "RiskEvent"
    multiplicity: "OneToMany"
- name: "RiskCategory"
  description: "Hierarchical taxonomy used to classify risks."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "definition"
    type: "String"
  relations:
  - name: "parentCategory"
    type: "RiskCategory"
    multiplicity: "ManyToOne"
  - name: "subcategories"
    type: "RiskCategory"
    multiplicity: "OneToMany"
  - name: "risks"
    type: "Risk"
    multiplicity: "OneToMany"
- name: "RiskRegister"
  description: "Scoped collection of risks maintained for a business unit and reporting\
    \ period."
  data:
  - name: "name"
    type: "String"
  - name: "period"
    type: "Period"
  - name: "status"
    type: "RegisterStatus"
  relations:
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "risks"
    type: "Risk"
    multiplicity: "OneToMany"
- name: "Risk"
  description: "Uncertain event or condition with potential to affect objectives."
  data:
  - name: "title"
    type: "String"
  - name: "statement"
    type: "String"
  - name: "nature"
    type: "RiskNature"
  - name: "status"
    type: "RiskStatus"
  - name: "appetiteReference"
    type: "String"
  - name: "velocity"
    type: "RiskVelocity"
  relations:
  - name: "register"
    type: "RiskRegister"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "RiskCategory"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "assessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "controls"
    type: "Control"
    multiplicity: "ManyToMany"
  - name: "treatmentPlans"
    type: "TreatmentPlan"
    multiplicity: "OneToMany"
  - name: "kris"
    type: "KeyRiskIndicator"
    multiplicity: "OneToMany"
  - name: "events"
    type: "RiskEvent"
    multiplicity: "OneToMany"
  - name: "findings"
    type: "Finding"
    multiplicity: "OneToMany"
  - name: "scenarios"
    type: "ScenarioAnalysis"
    multiplicity: "OneToMany"
- name: "RiskAssessment"
  description: "Point-in-time evaluation of inherent and residual risk using a defined\
    \ methodology."
  data:
  - name: "assessmentDate"
    type: "Date"
  - name: "methodology"
    type: "String"
  - name: "inherentLikelihood"
    type: "LikelihoodScale"
  - name: "inherentImpact"
    type: "ImpactScale"
  - name: "inherentRating"
    type: "RiskRating"
  - name: "residualLikelihood"
    type: "LikelihoodScale"
  - name: "residualImpact"
    type: "ImpactScale"
  - name: "residualRating"
    type: "RiskRating"
  - name: "status"
    type: "AssessmentStatus"
  - name: "comments"
    type: "String"
  relations:
  - name: "risk"
    type: "Risk"
    multiplicity: "ManyToOne"
  - name: "assessor"
    type: "Person"
    multiplicity: "ManyToOne"
- name: "Control"
  description: "Measure implemented to modify risk by preventing, detecting, or correcting\
    \ undesired events."
  data:
  - name: "name"
    type: "String"
  - name: "objective"
    type: "String"
  - name: "controlType"
    type: "ControlType"
  - name: "frequency"
    type: "ControlFrequency"
  - name: "automationLevel"
    type: "AutomationLevel"
  - name: "status"
    type: "ControlStatus"
  relations:
  - name: "owner"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "risks"
    type: "Risk"
    multiplicity: "ManyToMany"
  - name: "assessments"
    type: "ControlAssessment"
    multiplicity: "OneToMany"
  - name: "evidence"
    type: "ControlEvidence"
    multiplicity: "OneToMany"
  - name: "relatedActions"
    type: "TreatmentAction"
    multiplicity: "OneToMany"
  - name: "thirdParties"
    type: "ThirdParty"
    multiplicity: "ManyToMany"
- name: "ControlAssessment"
  description: "Testing activity that evaluates the design and operating effectiveness\
    \ of a control."
  data:
  - name: "assessmentDate"
    type: "Date"
  - name: "scope"
    type: "String"
  - name: "method"
    type: "ControlAssessmentMethod"
  - name: "sampleSize"
    type: "Integer"
  - name: "result"
    type: "ControlEffectiveness"
  - name: "status"
    type: "AssessmentStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "control"
    type: "Control"
    multiplicity: "ManyToOne"
  - name: "assessor"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "findings"
    type: "Finding"
    multiplicity: "OneToMany"
  - name: "evidence"
    type: "ControlEvidence"
    multiplicity: "OneToMany"
- name: "ControlEvidence"
  description: "Artifacts that substantiate the performance or effectiveness of a\
    \ control."
  data:
  - name: "name"
    type: "String"
  - name: "evidenceType"
    type: "EvidenceType"
  - name: "period"
    type: "Period"
  - name: "storageLocation"
    type: "String"
  - name: "uri"
    type: "Uri"
  relations:
  - name: "control"
    type: "Control"
    multiplicity: "ManyToOne"
  - name: "controlAssessment"
    type: "ControlAssessment"
    multiplicity: "ManyToOne"
- name: "Finding"
  description: "Deficiency or issue identified during assessments or monitoring that\
    \ requires remediation."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "severity"
    type: "IssueSeverity"
  - name: "status"
    type: "IssueStatus"
  - name: "remediationTargetDate"
    type: "Date"
  - name: "rootCause"
    type: "String"
  relations:
  - name: "controlAssessment"
    type: "ControlAssessment"
    multiplicity: "ManyToOne"
  - name: "risk"
    type: "Risk"
    multiplicity: "ManyToOne"
  - name: "relatedActions"
    type: "TreatmentAction"
    multiplicity: "OneToMany"
  - name: "thirdPartyAssessment"
    type: "ThirdPartyAssessment"
    multiplicity: "ManyToOne"
- name: "TreatmentPlan"
  description: "Planned set of actions to modify risk and achieve a target residual\
    \ rating."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "targetDate"
    type: "Date"
  - name: "targetResidualRisk"
    type: "RiskRating"
  - name: "budget"
    type: "Money"
  - name: "status"
    type: "TreatmentStatus"
  relations:
  - name: "risk"
    type: "Risk"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "actions"
    type: "TreatmentAction"
    multiplicity: "OneToMany"
- name: "TreatmentAction"
  description: "Discrete remediation or mitigation activity executed under a treatment\
    \ plan."
  data:
  - name: "title"
    type: "String"
  - name: "actionType"
    type: "TreatmentActionType"
  - name: "startDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "cost"
    type: "Money"
  - name: "status"
    type: "ActionStatus"
  - name: "progressPercent"
    type: "Integer"
  relations:
  - name: "treatmentPlan"
    type: "TreatmentPlan"
    multiplicity: "ManyToOne"
  - name: "assignee"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "relatedControl"
    type: "Control"
    multiplicity: "ManyToOne"
  - name: "relatedFinding"
    type: "Finding"
    multiplicity: "ManyToOne"
- name: "KeyRiskIndicator"
  description: "Quantitative measure used to monitor changes in risk exposure."
  data:
  - name: "name"
    type: "String"
  - name: "unit"
    type: "String"
  - name: "calculation"
    type: "String"
  - name: "thresholdType"
    type: "ThresholdType"
  - name: "lowerThreshold"
    type: "Decimal"
  - name: "upperThreshold"
    type: "Decimal"
  - name: "direction"
    type: "TrendDirection"
  - name: "currentValue"
    type: "Decimal"
  - name: "observationDate"
    type: "Date"
  - name: "status"
    type: "KRIStatus"
  relations:
  - name: "risk"
    type: "Risk"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Person"
    multiplicity: "ManyToOne"
- name: "RiskEvent"
  description: "Actual occurrence that affected objectives, with recorded losses and\
    \ recovery."
  data:
  - name: "eventDate"
    type: "Date"
  - name: "eventType"
    type: "EventType"
  - name: "description"
    type: "String"
  - name: "severity"
    type: "EventSeverity"
  - name: "impactType"
    type: "ImpactType"
  - name: "actualLoss"
    type: "Money"
  - name: "recoveredAmount"
    type: "Money"
  - name: "netLoss"
    type: "Money"
  - name: "status"
    type: "EventStatus"
  relations:
  - name: "relatedRisk"
    type: "Risk"
    multiplicity: "ManyToOne"
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
- name: "ScenarioAnalysis"
  description: "Forward-looking analysis estimating the frequency and impact of risk\
    \ scenarios."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "frequencyPerYear"
    type: "Decimal"
  - name: "impact"
    type: "Money"
  - name: "likelihood"
    type: "LikelihoodScale"
  - name: "rating"
    type: "RiskRating"
  relations:
  - name: "risk"
    type: "Risk"
    multiplicity: "ManyToOne"
- name: "ThirdParty"
  description: "External organization whose services or activities introduce risk."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "ThirdPartyType"
  - name: "criticality"
    type: "VendorCriticality"
  - name: "country"
    type: "String"
  relations:
  - name: "risks"
    type: "Risk"
    multiplicity: "ManyToMany"
  - name: "controls"
    type: "Control"
    multiplicity: "ManyToMany"
  - name: "assessments"
    type: "ThirdPartyAssessment"
    multiplicity: "OneToMany"
- name: "ThirdPartyAssessment"
  description: "Evaluation of a third party's risk controls and posture."
  data:
  - name: "assessmentDate"
    type: "Date"
  - name: "method"
    type: "ThirdPartyAssessmentMethod"
  - name: "result"
    type: "ThirdPartyAssessmentRating"
  - name: "status"
    type: "AssessmentStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "thirdParty"
    type: "ThirdParty"
    multiplicity: "ManyToOne"
  - name: "assessor"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "findings"
    type: "Finding"
    multiplicity: "OneToMany"
- name: "Person"
  description: "Individual participating in risk governance with assigned responsibilities."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "PersonRole"
  relations:
  - name: "ownedRisks"
    type: "Risk"
    multiplicity: "OneToMany"
  - name: "ownedControls"
    type: "Control"
    multiplicity: "OneToMany"
  - name: "controlAssessments"
    type: "ControlAssessment"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "assignedActions"
    type: "TreatmentAction"
    multiplicity: "OneToMany"
  - name: "ownedKRIs"
    type: "KeyRiskIndicator"
    multiplicity: "OneToMany"
  - name: "thirdPartyAssessments"
    type: "ThirdPartyAssessment"
    multiplicity: "OneToMany"
enums:
- name: "RiskNature"
  description: "High-level domain of the risk describing where and how it arises."
  data:
  - name: "Strategic"
  - name: "Operational"
  - name: "Financial"
  - name: "Compliance"
  - name: "Cybersecurity"
  - name: "Reputational"
  - name: "Safety"
- name: "RiskStatus"
  description: "Lifecycle state of a risk from identification through closure."
  data:
  - name: "Identified"
  - name: "Assessed"
  - name: "Accepted"
  - name: "Monitoring"
  - name: "Treated"
  - name: "Closed"
- name: "RiskVelocity"
  description: "Speed at which a risk materializes and impacts objectives."
  data:
  - name: "Immediate"
  - name: "Rapid"
  - name: "Gradual"
  - name: "LongTerm"
- name: "RegisterStatus"
  description: "Status of a risk register within its reporting cycle."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Archived"
- name: "ControlType"
  description: "Classification of control intent and function."
  data:
  - name: "Preventive"
  - name: "Detective"
  - name: "Corrective"
  - name: "Compensating"
- name: "ControlFrequency"
  description: "How often a control activity is performed."
  data:
  - name: "Continuous"
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "SemiAnnual"
  - name: "Annual"
  - name: "AdHoc"
- name: "AutomationLevel"
  description: "Degree of automation involved in performing the control."
  data:
  - name: "Manual"
  - name: "SemiAutomated"
  - name: "Automated"
- name: "ControlStatus"
  description: "Implementation state of a control."
  data:
  - name: "Proposed"
  - name: "Implemented"
  - name: "Retired"
  - name: "Disabled"
- name: "AssessmentStatus"
  description: "Progress and approval state of an assessment activity."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
  - name: "Approved"
  - name: "Rejected"
  - name: "Cancelled"
- name: "ControlAssessmentMethod"
  description: "Technique used to test the effectiveness of a control."
  data:
  - name: "Inquiry"
  - name: "Observation"
  - name: "Reperformance"
  - name: "Inspection"
  - name: "AnalyticalReview"
- name: "ControlEffectiveness"
  description: "Outcome of control testing based on design and operation."
  data:
  - name: "Effective"
  - name: "PartiallyEffective"
  - name: "Ineffective"
  - name: "NotTested"
- name: "IssueSeverity"
  description: "Level of potential impact posed by a finding if unremediated."
  data:
  - name: "Low"
  - name: "Moderate"
  - name: "High"
  - name: "Critical"
- name: "IssueStatus"
  description: "Remediation lifecycle state of a finding."
  data:
  - name: "Open"
  - name: "InRemediation"
  - name: "Validated"
  - name: "Closed"
  - name: "Deferred"
- name: "LikelihoodScale"
  description: "Ordinal scale expressing the probability of occurrence."
  data:
  - name: "Rare"
  - name: "Unlikely"
  - name: "Possible"
  - name: "Likely"
  - name: "AlmostCertain"
- name: "ImpactScale"
  description: "Ordinal scale expressing the severity of consequences."
  data:
  - name: "Insignificant"
  - name: "Minor"
  - name: "Moderate"
  - name: "Major"
  - name: "Severe"
- name: "RiskRating"
  description: "Composite risk rating derived from likelihood and impact."
  data:
  - name: "VeryLow"
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "VeryHigh"
- name: "TreatmentStatus"
  description: "Execution state of a risk treatment plan."
  data:
  - name: "Draft"
  - name: "InImplementation"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "TreatmentActionType"
  description: "Strategy or activity type applied to modify risk."
  data:
  - name: "Avoid"
  - name: "Reduce"
  - name: "Transfer"
  - name: "Accept"
  - name: "ImproveControl"
  - name: "Contingency"
- name: "ActionStatus"
  description: "Progress state of an individual treatment action."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Blocked"
  - name: "Completed"
  - name: "Cancelled"
- name: "ThresholdType"
  description: "Method used to interpret KRI values against defined limits."
  data:
  - name: "UpperLimit"
  - name: "LowerLimit"
  - name: "Range"
  - name: "Directional"
- name: "TrendDirection"
  description: "Recent movement of a KRI value over time."
  data:
  - name: "Increasing"
  - name: "Decreasing"
  - name: "Stable"
  - name: "Volatile"
- name: "KRIStatus"
  description: "Health indicator comparing KRI to thresholds."
  data:
  - name: "WithinThreshold"
  - name: "NearThreshold"
  - name: "Breached"
- name: "EventType"
  description: "Category describing the nature of a realized event."
  data:
  - name: "Incident"
  - name: "NearMiss"
  - name: "ExternalEvent"
  - name: "InternalFraud"
  - name: "ExternalFraud"
  - name: "SystemFailure"
  - name: "ProcessFailure"
  - name: "NaturalDisaster"
- name: "EventSeverity"
  description: "Magnitude of the realized event's impact."
  data:
  - name: "Minor"
  - name: "Moderate"
  - name: "Major"
  - name: "Catastrophic"
- name: "ImpactType"
  description: "Primary dimension of impact resulting from a risk event."
  data:
  - name: "Financial"
  - name: "Operational"
  - name: "Compliance"
  - name: "Strategic"
  - name: "Reputational"
  - name: "Safety"
- name: "EvidenceType"
  description: "Type of artifact used to substantiate control performance."
  data:
  - name: "Log"
  - name: "Report"
  - name: "Screenshot"
  - name: "Ticket"
  - name: "Configuration"
  - name: "Attestation"
- name: "ThirdPartyType"
  description: "Relationship type describing the nature of external engagement."
  data:
  - name: "Vendor"
  - name: "Outsourcer"
  - name: "Partner"
  - name: "Contractor"
  - name: "SvcProvider"
- name: "VendorCriticality"
  description: "Importance of a third party to the organization based on impact of\
    \ failure."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "ThirdPartyAssessmentMethod"
  description: "Approach used to evaluate third-party risk posture."
  data:
  - name: "Questionnaire"
  - name: "OnsiteReview"
  - name: "EvidenceReview"
  - name: "ExternalCertification"
  - name: "PenetrationTest"
- name: "ThirdPartyAssessmentRating"
  description: "Overall evaluation outcome of a third party."
  data:
  - name: "Strong"
  - name: "Satisfactory"
  - name: "NeedsImprovement"
  - name: "Unsatisfactory"
- name: "PersonRole"
  description: "Primary responsibility held by an individual in risk governance."
  data:
  - name: "RiskOwner"
  - name: "ControlOwner"
  - name: "Assessor"
  - name: "Executive"
  - name: "Analyst"
  - name: "Auditor"
  - name: "ComplianceOfficer"
  - name: "BusinessOwner"
- name: "EventStatus"
  description: "Current handling state of a recorded risk event."
  data:
  - name: "New"
  - name: "UnderInvestigation"
  - name: "Contained"
  - name: "Resolved"
  - name: "Closed"
valueObjects:
- name: "Money"
  description: "Monetary amount represented with explicit currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Uri"
  description: "Reference to an external resource or document location."
  data:
  - name: "value"
    type: "String"
- name: "Period"
  description: "Time interval with a defined start and end date."
  data:
  - name: "start"
    type: "Date"
  - name: "end"
    type: "Date"
