---
metadata:
  name: "HCIDL Compliance Capabilities Model"
  description: "Canonical capability model describing core compliance governance concepts,\
    \ their data, and relationships across regulated organizations."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Governance"
  type: "Capability"
  domain: "Compliance"
entities:
- name: "RegulatedEntity"
  description: "Organization subject to legal, regulatory, or standards-based compliance\
    \ obligations."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "jurisdiction"
    type: "String"
  - name: "industrySector"
    type: "String"
  - name: "complianceMaturity"
    type: "MaturityLevel"
  relations:
  - name: "businessUnits"
    type: "BusinessUnit"
    multiplicity: "OneToMany"
  - name: "compliancePrograms"
    type: "ComplianceProgram"
    multiplicity: "OneToMany"
  - name: "regulatoryAuthorities"
    type: "RegulatoryAuthority"
    multiplicity: "ManyToMany"
  - name: "thirdParties"
    type: "ThirdParty"
    multiplicity: "OneToMany"
- name: "BusinessUnit"
  description: "Internal division with distinct compliance accountability and operating\
    \ scope."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "criticality"
    type: "Criticality"
  relations:
  - name: "regulatedEntity"
    type: "RegulatedEntity"
    multiplicity: "ManyToOne"
  - name: "owners"
    type: "Person"
    multiplicity: "ManyToMany"
  - name: "obligations"
    type: "RegulatoryObligation"
    multiplicity: "OneToMany"
- name: "RegulatoryAuthority"
  description: "Governmental, standards, or oversight body issuing rules and guidance."
  data:
  - name: "name"
    type: "String"
  - name: "jurisdiction"
    type: "String"
  - name: "authorityType"
    type: "AuthorityType"
  - name: "website"
    type: "String"
  relations:
  - name: "regulations"
    type: "Regulation"
    multiplicity: "OneToMany"
  - name: "regulatedEntities"
    type: "RegulatedEntity"
    multiplicity: "ManyToMany"
- name: "Regulation"
  description: "Law, regulation, rule set, or standard applicable to the organization."
  data:
  - name: "code"
    type: "String"
  - name: "title"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "regulationType"
    type: "RegulationType"
  relations:
  - name: "authority"
    type: "RegulatoryAuthority"
    multiplicity: "ManyToOne"
  - name: "obligations"
    type: "RegulatoryObligation"
    multiplicity: "OneToMany"
  - name: "versions"
    type: "RegulationVersion"
    multiplicity: "OneToMany"
- name: "RegulationVersion"
  description: "Published version of a regulation capturing status and change history."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "publishedDate"
    type: "Date"
  - name: "status"
    type: "RegulationStatus"
  relations:
  - name: "regulation"
    type: "Regulation"
    multiplicity: "ManyToOne"
  - name: "changes"
    type: "RegulatoryChange"
    multiplicity: "OneToMany"
- name: "RegulatoryChange"
  description: "Notified or detected change to a regulation requiring impact assessment."
  data:
  - name: "changeReference"
    type: "String"
  - name: "description"
    type: "String"
  - name: "changeType"
    type: "RegulatoryChangeType"
  - name: "effectiveDate"
    type: "Date"
  relations:
  - name: "regulationVersion"
    type: "RegulationVersion"
    multiplicity: "ManyToOne"
  - name: "impactAssessments"
    type: "ImpactAssessment"
    multiplicity: "OneToMany"
- name: "RegulatoryObligation"
  description: "Specific requirement or clause mandating actions, records, or controls."
  data:
  - name: "citation"
    type: "Citation"
  - name: "requirementText"
    type: "String"
  - name: "obligationType"
    type: "ObligationType"
  - name: "applicabilityCriteria"
    type: "String"
  relations:
  - name: "regulation"
    type: "Regulation"
    multiplicity: "ManyToOne"
  - name: "controls"
    type: "Control"
    multiplicity: "ManyToMany"
  - name: "evidenceItems"
    type: "Evidence"
    multiplicity: "OneToMany"
  - name: "businessUnits"
    type: "BusinessUnit"
    multiplicity: "ManyToMany"
- name: "ComplianceProgram"
  description: "Structured set of policies, controls, and activities to meet obligations."
  data:
  - name: "name"
    type: "String"
  - name: "programType"
    type: "ProgramType"
  - name: "scope"
    type: "String"
  - name: "status"
    type: "ProgramStatus"
  relations:
  - name: "regulatedEntity"
    type: "RegulatedEntity"
    multiplicity: "ManyToOne"
  - name: "frameworks"
    type: "ControlFramework"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "Policy"
    multiplicity: "OneToMany"
  - name: "trainingCourses"
    type: "TrainingCourse"
    multiplicity: "OneToMany"
- name: "ControlFramework"
  description: "Referenced or internal framework organizing control domains and practices."
  data:
  - name: "name"
    type: "String"
  - name: "source"
    type: "String"
  - name: "version"
    type: "String"
  - name: "frameworkType"
    type: "FrameworkType"
  relations:
  - name: "program"
    type: "ComplianceProgram"
    multiplicity: "ManyToOne"
  - name: "controlDomains"
    type: "ControlDomain"
    multiplicity: "OneToMany"
- name: "ControlDomain"
  description: "Thematic grouping of related compliance control objectives."
  data:
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "framework"
    type: "ControlFramework"
    multiplicity: "ManyToOne"
  - name: "controlSets"
    type: "ControlSet"
    multiplicity: "OneToMany"
- name: "ControlSet"
  description: "Collection of controls addressing a shared objective or requirement."
  data:
  - name: "name"
    type: "String"
  - name: "objective"
    type: "String"
  - name: "priority"
    type: "PriorityLevel"
  relations:
  - name: "domain"
    type: "ControlDomain"
    multiplicity: "ManyToOne"
  - name: "controls"
    type: "Control"
    multiplicity: "OneToMany"
- name: "Control"
  description: "Discrete measure implemented to achieve compliance or mitigate risk."
  data:
  - name: "controlCode"
    type: "String"
  - name: "name"
    type: "String"
  - name: "controlType"
    type: "ControlType"
  - name: "frequency"
    type: "ControlFrequency"
  - name: "ownerRole"
    type: "String"
  relations:
  - name: "controlSet"
    type: "ControlSet"
    multiplicity: "ManyToOne"
  - name: "procedures"
    type: "ControlProcedure"
    multiplicity: "OneToMany"
  - name: "tests"
    type: "ControlTest"
    multiplicity: "OneToMany"
  - name: "evidence"
    type: "Evidence"
    multiplicity: "OneToMany"
  - name: "obligations"
    type: "RegulatoryObligation"
    multiplicity: "ManyToMany"
  - name: "systems"
    type: "System"
    multiplicity: "ManyToMany"
- name: "ControlProcedure"
  description: "Detailed work instruction describing how a control is performed."
  data:
  - name: "name"
    type: "String"
  - name: "procedureReference"
    type: "DocumentReference"
  - name: "stepCount"
    type: "Integer"
  relations:
  - name: "control"
    type: "Control"
    multiplicity: "ManyToOne"
  - name: "approvers"
    type: "Person"
    multiplicity: "ManyToMany"
- name: "ControlTest"
  description: "Assessment activity evaluating control design or operating effectiveness."
  data:
  - name: "name"
    type: "String"
  - name: "testType"
    type: "TestType"
  - name: "samplingMethod"
    type: "String"
  - name: "status"
    type: "AssessmentStatus"
  relations:
  - name: "control"
    type: "Control"
    multiplicity: "ManyToOne"
  - name: "tester"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "evidence"
    type: "Evidence"
    multiplicity: "OneToMany"
  - name: "findings"
    type: "Finding"
    multiplicity: "OneToMany"
- name: "Evidence"
  description: "Artifact demonstrating performance of a control or fulfillment of\
    \ an obligation."
  data:
  - name: "evidenceReference"
    type: "DocumentReference"
  - name: "evidenceType"
    type: "EvidenceType"
  - name: "collectionDate"
    type: "Date"
  - name: "retentionPeriodMonths"
    type: "Integer"
  relations:
  - name: "control"
    type: "Control"
    multiplicity: "ManyToOne"
  - name: "obligation"
    type: "RegulatoryObligation"
    multiplicity: "ManyToOne"
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "collectedBy"
    type: "Person"
    multiplicity: "ManyToOne"
- name: "Repository"
  description: "System or location where compliance evidence and documents are stored."
  data:
  - name: "name"
    type: "String"
  - name: "repositoryType"
    type: "RepositoryType"
  - name: "locationUri"
    type: "String"
  relations:
  - name: "evidenceItems"
    type: "Evidence"
    multiplicity: "OneToMany"
  - name: "owners"
    type: "Person"
    multiplicity: "ManyToMany"
- name: "ImpactAssessment"
  description: "Evaluation of regulatory change impacts on processes, controls, and\
    \ policies."
  data:
  - name: "assessmentDate"
    type: "Date"
  - name: "impactLevel"
    type: "ImpactLevel"
  - name: "summary"
    type: "String"
  - name: "status"
    type: "AssessmentStatus"
  relations:
  - name: "regulatoryChange"
    type: "RegulatoryChange"
    multiplicity: "ManyToOne"
  - name: "affectedPrograms"
    type: "ComplianceProgram"
    multiplicity: "ManyToMany"
  - name: "owners"
    type: "Person"
    multiplicity: "ManyToMany"
- name: "Policy"
  description: "Formal statement of intent guiding compliance behaviors and decisions."
  data:
  - name: "name"
    type: "String"
  - name: "policyNumber"
    type: "String"
  - name: "status"
    type: "PolicyStatus"
  - name: "approvalDate"
    type: "Date"
  relations:
  - name: "program"
    type: "ComplianceProgram"
    multiplicity: "ManyToOne"
  - name: "standards"
    type: "Standard"
    multiplicity: "OneToMany"
  - name: "owners"
    type: "Person"
    multiplicity: "ManyToMany"
- name: "Standard"
  description: "Internal mandatory requirements derived from policy or external frameworks."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "status"
    type: "StandardStatus"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "procedures"
    type: "ControlProcedure"
    multiplicity: "ManyToMany"
- name: "TrainingCourse"
  description: "Learning content used to educate stakeholders on compliance obligations."
  data:
  - name: "title"
    type: "String"
  - name: "deliveryMethod"
    type: "TrainingDeliveryMethod"
  - name: "durationMinutes"
    type: "Integer"
  - name: "status"
    type: "TrainingStatus"
  relations:
  - name: "program"
    type: "ComplianceProgram"
    multiplicity: "ManyToOne"
  - name: "assignments"
    type: "TrainingAssignment"
    multiplicity: "OneToMany"
- name: "TrainingAssignment"
  description: "Enrollment of a learner to a compliance training course with due dates."
  data:
  - name: "assignedDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "completionStatus"
    type: "CompletionStatus"
  relations:
  - name: "course"
    type: "TrainingCourse"
    multiplicity: "ManyToOne"
  - name: "learner"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "evidence"
    type: "Evidence"
    multiplicity: "ManyToOne"
- name: "Person"
  description: "Individual participating in compliance activities and approvals."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "role"
    type: "RoleType"
- name: "ThirdParty"
  description: "External supplier, vendor, or partner subject to compliance due diligence."
  data:
  - name: "name"
    type: "String"
  - name: "classification"
    type: "ThirdPartyClassification"
  - name: "criticality"
    type: "Criticality"
  relations:
  - name: "assessments"
    type: "ThirdPartyAssessment"
    multiplicity: "OneToMany"
  - name: "contracts"
    type: "Contract"
    multiplicity: "OneToMany"
  - name: "regulatedEntity"
    type: "RegulatedEntity"
    multiplicity: "ManyToOne"
- name: "ThirdPartyAssessment"
  description: "Due diligence evaluation of a third party's compliance posture."
  data:
  - name: "assessmentDate"
    type: "Date"
  - name: "assessmentType"
    type: "AssessmentType"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "status"
    type: "AssessmentStatus"
  relations:
  - name: "thirdParty"
    type: "ThirdParty"
    multiplicity: "ManyToOne"
  - name: "questionnaires"
    type: "QuestionnaireResponse"
    multiplicity: "OneToMany"
  - name: "findings"
    type: "Finding"
    multiplicity: "OneToMany"
- name: "Contract"
  description: "Agreement governing services, data processing roles, and compliance\
    \ clauses."
  data:
  - name: "contractNumber"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "dataProcessingRole"
    type: "DataProcessingRole"
  relations:
  - name: "thirdParty"
    type: "ThirdParty"
    multiplicity: "ManyToOne"
  - name: "obligations"
    type: "RegulatoryObligation"
    multiplicity: "ManyToMany"
- name: "QuestionnaireResponse"
  description: "Response package to a due diligence or compliance questionnaire."
  data:
  - name: "name"
    type: "String"
  - name: "submissionDate"
    type: "Date"
  - name: "score"
    type: "Decimal"
  relations:
  - name: "assessment"
    type: "ThirdPartyAssessment"
    multiplicity: "ManyToOne"
  - name: "responder"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "attachments"
    type: "Evidence"
    multiplicity: "OneToMany"
- name: "Finding"
  description: "Deviation or issue discovered during testing, audits, or assessments."
  data:
  - name: "findingCode"
    type: "String"
  - name: "title"
    type: "String"
  - name: "severity"
    type: "FindingSeverity"
  - name: "status"
    type: "FindingStatus"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "controlTest"
    type: "ControlTest"
    multiplicity: "ManyToOne"
  - name: "assessment"
    type: "ThirdPartyAssessment"
    multiplicity: "ManyToOne"
  - name: "remediationPlan"
    type: "RemediationPlan"
    multiplicity: "OneToOne"
  - name: "owner"
    type: "Person"
    multiplicity: "ManyToOne"
- name: "RemediationPlan"
  description: "Planned corrective actions to resolve a finding within agreed timelines."
  data:
  - name: "planReference"
    type: "DocumentReference"
  - name: "targetDate"
    type: "Date"
  - name: "status"
    type: "RemediationStatus"
  relations:
  - name: "finding"
    type: "Finding"
    multiplicity: "OneToOne"
- name: "System"
  description: "Application or asset subject to compliance controls and monitoring."
  data:
  - name: "name"
    type: "String"
  - name: "systemType"
    type: "SystemType"
  - name: "dataClassification"
    type: "DataClassification"
  - name: "ownerTeam"
    type: "String"
  relations:
  - name: "controls"
    type: "Control"
    multiplicity: "ManyToMany"
  - name: "records"
    type: "DataRecord"
    multiplicity: "OneToMany"
- name: "DataRecord"
  description: "Structured category of records retained to satisfy compliance requirements."
  data:
  - name: "name"
    type: "String"
  - name: "recordType"
    type: "RecordType"
  - name: "retentionMonths"
    type: "Integer"
  relations:
  - name: "system"
    type: "System"
    multiplicity: "ManyToOne"
  - name: "legalHolds"
    type: "LegalHold"
    multiplicity: "ManyToMany"
- name: "LegalHold"
  description: "Directive to preserve records beyond normal retention for legal matters."
  data:
  - name: "holdNumber"
    type: "String"
  - name: "reason"
    type: "String"
  - name: "status"
    type: "LegalHoldStatus"
  - name: "startDate"
    type: "Date"
  - name: "releaseDate"
    type: "Date"
  relations:
  - name: "records"
    type: "DataRecord"
    multiplicity: "ManyToMany"
  - name: "owners"
    type: "Person"
    multiplicity: "ManyToMany"
- name: "Incident"
  description: "Event indicating breach, violation, or inquiry with compliance relevance."
  data:
  - name: "incidentNumber"
    type: "String"
  - name: "incidentType"
    type: "IncidentType"
  - name: "severity"
    type: "IncidentSeverity"
  - name: "status"
    type: "IncidentStatus"
  - name: "discoveryDate"
    type: "Date"
  relations:
  - name: "systems"
    type: "System"
    multiplicity: "ManyToMany"
  - name: "obligations"
    type: "RegulatoryObligation"
    multiplicity: "ManyToMany"
  - name: "investigations"
    type: "Investigation"
    multiplicity: "OneToMany"
- name: "Investigation"
  description: "Structured inquiry into an incident to determine facts and outcomes."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "outcome"
    type: "InvestigationOutcome"
  relations:
  - name: "incident"
    type: "Incident"
    multiplicity: "ManyToOne"
  - name: "lead"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "evidence"
    type: "Evidence"
    multiplicity: "OneToMany"
  - name: "findings"
    type: "Finding"
    multiplicity: "OneToMany"
- name: "Approval"
  description: "Governance decision record for key compliance artifacts and actions."
  data:
  - name: "approvalNumber"
    type: "String"
  - name: "status"
    type: "ApprovalStatus"
  - name: "decisionDate"
    type: "Date"
  relations:
  - name: "approver"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "standard"
    type: "Standard"
    multiplicity: "ManyToOne"
  - name: "procedure"
    type: "ControlProcedure"
    multiplicity: "ManyToOne"
  - name: "remediationPlan"
    type: "RemediationPlan"
    multiplicity: "ManyToOne"
- name: "Attestation"
  description: "Formal statement by a responsible party confirming control performance."
  data:
  - name: "statement"
    type: "String"
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "status"
    type: "AttestationStatus"
  relations:
  - name: "person"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "control"
    type: "Control"
    multiplicity: "ManyToOne"
  - name: "evidence"
    type: "Evidence"
    multiplicity: "OneToMany"
enums:
- name: "MaturityLevel"
  description: "Organizational capability level for operating a compliance program."
  data:
  - name: "Initial"
  - name: "Managed"
  - name: "Defined"
  - name: "QuantitativelyManaged"
  - name: "Optimizing"
- name: "Criticality"
  description: "Relative importance of an entity or activity to compliance outcomes."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "AuthorityType"
  description: "Classification of external bodies that issue obligations."
  data:
  - name: "Regulator"
  - name: "StandardBody"
  - name: "IndustryAssociation"
  - name: "Court"
- name: "RegulationType"
  description: "Nature of the regulatory source driving obligations."
  data:
  - name: "Law"
  - name: "Regulation"
  - name: "Standard"
  - name: "Guideline"
- name: "RegulationStatus"
  description: "Lifecycle status of a regulation version."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Superseded"
  - name: "Repealed"
- name: "RegulatoryChangeType"
  description: "Type of modification introduced to a regulatory source."
  data:
  - name: "New"
  - name: "Amendment"
  - name: "Repeal"
  - name: "GuidanceUpdate"
- name: "ObligationType"
  description: "Category of requirement imposed by a regulation."
  data:
  - name: "Reporting"
  - name: "RecordKeeping"
  - name: "Conduct"
  - name: "Technical"
  - name: "Administrative"
- name: "ProgramType"
  description: "Organizational shape and scope for a compliance program."
  data:
  - name: "Enterprise"
  - name: "Regional"
  - name: "Thematic"
  - name: "Certification"
- name: "ProgramStatus"
  description: "Operational status of a compliance program."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "Suspended"
  - name: "Closed"
- name: "FrameworkType"
  description: "Origin and integration style of a control framework."
  data:
  - name: "Internal"
  - name: "External"
  - name: "Hybrid"
- name: "PriorityLevel"
  description: "Relative priority for implementing or testing controls."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "VeryHigh"
- name: "ControlType"
  description: "Design intent of a control in addressing risks or obligations."
  data:
  - name: "Preventive"
  - name: "Detective"
  - name: "Corrective"
- name: "ControlFrequency"
  description: "Expected cadence for performing a control activity."
  data:
  - name: "Continuous"
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Annually"
  - name: "AdHoc"
- name: "TestType"
  description: "Methodology applied to evaluate a control."
  data:
  - name: "DesignEffectiveness"
  - name: "OperatingEffectiveness"
  - name: "Walkthrough"
  - name: "SampleTest"
- name: "AssessmentStatus"
  description: "Progress state for assessments, tests, and reviews."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
  - name: "Accepted"
  - name: "Rejected"
- name: "EvidenceType"
  description: "Format or origin of evidence supporting compliance activities."
  data:
  - name: "Log"
  - name: "Report"
  - name: "Screenshot"
  - name: "Ticket"
  - name: "Configuration"
  - name: "Attestation"
- name: "RepositoryType"
  description: "Type of system used to store compliance artifacts."
  data:
  - name: "DMS"
  - name: "GRC"
  - name: "ShareDrive"
  - name: "TicketingSystem"
  - name: "DataLake"
- name: "ImpactLevel"
  description: "Degree of change expected from a regulatory update."
  data:
  - name: "Minimal"
  - name: "Moderate"
  - name: "Significant"
  - name: "Critical"
- name: "PolicyStatus"
  description: "Governance status of a policy document."
  data:
  - name: "Draft"
  - name: "UnderReview"
  - name: "Approved"
