---
metadata:
  name: "HCIDL Audit Capabilities"
  description: "Canonical capabilities model for enterprise Audit, including planning,\
    \ fieldwork, evidence management, reporting, and remediation follow-up."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Governance"
  type: "Capability"
  domain: "Audit"
entities:
- name: "AuditProgram"
  description: "Central definition of the internal audit function’s mandate, methodology,\
    \ and quality framework."
  data:
  - name: "name"
    type: "String"
  - name: "methodologyVersion"
    type: "String"
  - name: "qualityAssuranceLastReview"
    type: "Date"
  - name: "charterReference"
    type: "String"
  relations:
  - name: "methodologyDocuments"
    type: "MethodologyDocument"
    multiplicity: "OneToMany"
  - name: "auditPlans"
    type: "AuditPlan"
    multiplicity: "OneToMany"
- name: "MethodologyDocument"
  description: "Governing artifacts such as policies, procedures, templates, and checklists\
    \ used by the audit function."
  data:
  - name: "title"
    type: "String"
  - name: "version"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "documentType"
    type: "MethodologyDocumentType"
  relations:
  - name: "auditProgram"
    type: "AuditProgram"
    multiplicity: "ManyToOne"
- name: "OrganizationUnit"
  description: "Business division, department, or function that can own processes,\
    \ risks, and controls."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "contacts"
    type: "AuditeeContact"
    multiplicity: "OneToMany"
  - name: "universeItems"
    type: "AuditUniverseItem"
    multiplicity: "OneToMany"
- name: "AuditUniverseItem"
  description: "Cataloged auditable entity such as a process, location, system, or\
    \ product line."
  data:
  - name: "name"
    type: "String"
  - name: "entityType"
    type: "AuditableEntityType"
  - name: "inherentRisk"
    type: "RiskLevel"
  - name: "lastAuditedOn"
    type: "Date"
  - name: "isInScope"
    type: "Boolean"
  relations:
  - name: "ownerUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "risks"
    type: "Risk"
    multiplicity: "OneToMany"
  - name: "controls"
    type: "Control"
    multiplicity: "OneToMany"
  - name: "engagements"
    type: "AuditEngagement"
    multiplicity: "ManyToMany"
- name: "Risk"
  description: "Potential event that may adversely affect objectives related to a\
    \ universe item."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "regulatoryDriver"
    type: "String"
  relations:
  - name: "universeItem"
    type: "AuditUniverseItem"
    multiplicity: "ManyToOne"
  - name: "relatedControls"
    type: "Control"
    multiplicity: "ManyToMany"
- name: "RiskAssessment"
  description: "Periodic assessment of risk for an auditable entity to inform the\
    \ audit plan."
  data:
  - name: "assessmentDate"
    type: "Date"
  - name: "residualRisk"
    type: "RiskLevel"
  - name: "approach"
    type: "String"
  - name: "keyDrivers"
    type: "String"
  relations:
  - name: "universeItem"
    type: "AuditUniverseItem"
    multiplicity: "ManyToOne"
  - name: "performedBy"
    type: "Auditor"
    multiplicity: "ManyToOne"
- name: "AuditPlan"
  description: "Time-bound portfolio of planned audit engagements and resources."
  data:
  - name: "name"
    type: "String"
  - name: "planningHorizon"
    type: "DateRange"
  - name: "status"
    type: "PlanStatus"
  relations:
  - name: "auditProgram"
    type: "AuditProgram"
    multiplicity: "ManyToOne"
  - name: "engagements"
    type: "AuditEngagement"
    multiplicity: "OneToMany"
- name: "Auditor"
  description: "Member of the audit team responsible for planning, fieldwork, review,\
    \ and reporting."
  data:
  - name: "personName"
    type: "PersonName"
  - name: "role"
    type: "AuditorRole"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "certifications"
    type: "String"
  relations:
  - name: "leadEngagements"
    type: "AuditEngagement"
    multiplicity: "OneToMany"
  - name: "workpapersReviewed"
    type: "Workpaper"
    multiplicity: "OneToMany"
- name: "AuditeeContact"
  description: "Business stakeholder who provides information and owns or operates\
    \ processes and controls."
  data:
  - name: "personName"
    type: "PersonName"
  - name: "title"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  relations:
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "issuesOwned"
    type: "Issue"
    multiplicity: "OneToMany"
  - name: "actionPlans"
    type: "ActionPlan"
    multiplicity: "OneToMany"
- name: "AuditEngagement"
  description: "Individual audit assignment with defined scope, objectives, and deliverables."
  data:
  - name: "title"
    type: "String"
  - name: "engagementType"
    type: "EngagementType"
  - name: "status"
    type: "EngagementStatus"
  - name: "fieldworkPeriod"
    type: "DateRange"
  - name: "overallOpinion"
    type: "OpinionRating"
  relations:
  - name: "auditPlan"
    type: "AuditPlan"
    multiplicity: "ManyToOne"
  - name: "auditableItems"
    type: "AuditUniverseItem"
    multiplicity: "ManyToMany"
  - name: "leadAuditor"
    type: "Auditor"
    multiplicity: "ManyToOne"
  - name: "team"
    type: "Auditor"
    multiplicity: "ManyToMany"
  - name: "auditeeContacts"
    type: "AuditeeContact"
    multiplicity: "ManyToMany"
  - name: "objectives"
    type: "AuditObjective"
    multiplicity: "OneToMany"
  - name: "procedures"
    type: "AuditProcedure"
    multiplicity: "OneToMany"
  - name: "workpapers"
    type: "Workpaper"
    multiplicity: "OneToMany"
  - name: "findings"
    type: "Finding"
    multiplicity: "OneToMany"
  - name: "report"
    type: "AuditReport"
    multiplicity: "OneToOne"
  - name: "qualityReviews"
    type: "QualityReview"
    multiplicity: "OneToMany"
- name: "AuditObjective"
  description: "Statement of what the engagement aims to verify or conclude."
  data:
  - name: "description"
    type: "String"
  - name: "objectiveType"
    type: "ObjectiveType"
  - name: "priority"
    type: "RecommendationPriority"
  relations:
  - name: "engagement"
    type: "AuditEngagement"
    multiplicity: "ManyToOne"
- name: "Control"
  description: "Policy, process, or technical activity designed to mitigate risk."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "controlType"
    type: "ControlType"
  - name: "controlNature"
    type: "ControlNature"
  - name: "frequency"
    type: "Frequency"
  - name: "ownerTitle"
    type: "String"
  relations:
  - name: "universeItem"
    type: "AuditUniverseItem"
    multiplicity: "ManyToOne"
  - name: "risks"
    type: "Risk"
    multiplicity: "ManyToMany"
  - name: "tests"
    type: "ControlTest"
    multiplicity: "OneToMany"
- name: "AuditProcedure"
  description: "Detailed steps executed to evaluate controls, compliance, or processes."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "samplingMethod"
    type: "SamplingMethod"
  - name: "plannedSampleSize"
    type: "Integer"
  relations:
  - name: "engagement"
    type: "AuditEngagement"
    multiplicity: "ManyToOne"
  - name: "controls"
    type: "Control"
    multiplicity: "ManyToMany"
  - name: "tests"
    type: "ControlTest"
    multiplicity: "OneToMany"
  - name: "workpapers"
    type: "Workpaper"
    multiplicity: "ManyToMany"
- name: "Population"
  description: "Full set of items from which audit samples may be selected."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "populationSource"
    type: "PopulationSource"
  - name: "size"
    type: "Integer"
  - name: "coveragePeriod"
    type: "DateRange"
  - name: "sourceSystem"
    type: "String"
  relations:
  - name: "controlTest"
    type: "ControlTest"
    multiplicity: "ManyToOne"
- name: "ControlTest"
  description: "Test of control design or operating effectiveness performed during\
    \ fieldwork."
  data:
  - name: "testType"
    type: "ControlTestType"
  - name: "description"
    type: "String"
  - name: "samplingParameters"
    type: "SamplingParameters"
  - name: "sampleSize"
    type: "Integer"
  - name: "result"
    type: "TestResult"
  relations:
  - name: "procedure"
    type: "AuditProcedure"
    multiplicity: "ManyToOne"
  - name: "control"
    type: "Control"
    multiplicity: "ManyToOne"
  - name: "population"
    type: "Population"
    multiplicity: "OneToOne"
  - name: "samples"
    type: "SampleItem"
    multiplicity: "OneToMany"
  - name: "evidence"
    type: "Evidence"
    multiplicity: "OneToMany"
  - name: "tester"
    type: "Auditor"
    multiplicity: "ManyToOne"
- name: "SampleItem"
  description: "Selected item from a population used to evaluate a control or transaction\
    \ detail."
  data:
  - name: "reference"
    type: "String"
  - name: "selectionReason"
    type: "String"
  - name: "result"
    type: "TestResult"
  - name: "deviationObserved"
    type: "Boolean"
  - name: "notes"
    type: "String"
  relations:
  - name: "controlTest"
    type: "ControlTest"
    multiplicity: "ManyToOne"
  - name: "evidence"
    type: "Evidence"
    multiplicity: "OneToMany"
- name: "Evidence"
  description: "Collected artifacts supporting audit procedures, testing, and conclusions."
  data:
  - name: "title"
    type: "String"
  - name: "evidenceType"
    type: "EvidenceType"
  - name: "reliability"
    type: "EvidenceReliability"
  - name: "collectedAt"
    type: "DateTime"
  - name: "description"
    type: "String"
  - name: "reference"
    type: "DocumentReference"
  relations:
  - name: "procedure"
    type: "AuditProcedure"
    multiplicity: "ManyToOne"
  - name: "controlTest"
    type: "ControlTest"
    multiplicity: "ManyToOne"
  - name: "sampleItem"
    type: "SampleItem"
    multiplicity: "ManyToOne"
  - name: "workpaper"
    type: "Workpaper"
    multiplicity: "ManyToOne"
  - name: "collectedBy"
    type: "Auditor"
    multiplicity: "ManyToOne"
- name: "Workpaper"
  description: "Structured documentation of planning, procedures, testing, and conclusions."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "WorkpaperStatus"
  - name: "version"
    type: "String"
  - name: "storageLocation"
    type: "String"
  relations:
  - name: "engagement"
    type: "AuditEngagement"
    multiplicity: "ManyToOne"
  - name: "procedures"
    type: "AuditProcedure"
    multiplicity: "ManyToMany"
  - name: "evidence"
    type: "Evidence"
    multiplicity: "OneToMany"
  - name: "preparedBy"
    type: "Auditor"
    multiplicity: "ManyToOne"
  - name: "reviewer"
    type: "Auditor"
    multiplicity: "ManyToOne"
- name: "Finding"
  description: "Substantiated observation resulting from audit procedures that warrants\
    \ management attention."
  data:
  - name: "title"
    type: "String"
  - name: "category"
    type: "FindingCategory"
  - name: "severity"
    type: "SeverityRating"
  - name: "rootCause"
    type: "RootCauseCategory"
  - name: "impactDescription"
    type: "String"
  - name: "recommendationSummary"
    type: "String"
  relations:
  - name: "engagement"
    type: "AuditEngagement"
    multiplicity: "ManyToOne"
  - name: "relatedControls"
    type: "Control"
    multiplicity: "ManyToMany"
  - name: "evidence"
    type: "Evidence"
    multiplicity: "OneToMany"
  - name: "issue"
    type: "Issue"
    multiplicity: "OneToOne"
- name: "Issue"
  description: "Formalized deficiency tracked to remediation and closure."
  data:
  - name: "description"
    type: "String"
  - name: "status"
    type: "IssueStatus"
  - name: "recommendationPriority"
    type: "RecommendationPriority"
  - name: "targetRemediationDate"
    type: "Date"
  - name: "managementResponse"
    type: "String"
  - name: "estimatedRemediationCost"
    type: "CurrencyAmount"
  relations:
  - name: "finding"
    type: "Finding"
    multiplicity: "OneToOne"
  - name: "owner"
    type: "AuditeeContact"
    multiplicity: "ManyToOne"
  - name: "actionPlans"
    type: "ActionPlan"
    multiplicity: "OneToMany"
  - name: "followUps"
    type: "FollowUpReview"
    multiplicity: "OneToMany"
- name: "ActionPlan"
  description: "Management’s committed actions to remediate an issue within a defined\
    \ timeframe."
  data:
  - name: "actionDescription"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "ActionPlanStatus"
  - name: "completionNotes"
    type: "String"
  relations:
  - name: "issue"
    type: "Issue"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "AuditeeContact"
    multiplicity: "ManyToOne"
  - name: "evidence"
    type: "Evidence"
    multiplicity: "OneToMany"
- name: "FollowUpReview"
  description: "Verification activity to assess the effectiveness of implemented remediation."
  data:
  - name: "reviewDate"
    type: "Date"
  - name: "status"
    type: "FollowUpStatus"
  - name: "reviewerComments"
    type: "String"
  relations:
  - name: "issue"
    type: "Issue"
    multiplicity: "ManyToOne"
  - name: "reviewedBy"
    type: "Auditor"
    multiplicity: "ManyToOne"
  - name: "evidence"
    type: "Evidence"
    multiplicity: "OneToMany"
- name: "AuditReport"
  description: "Formal report communicating objectives, scope, findings, and overall\
    \ opinion."
  data:
  - name: "title"
    type: "String"
  - name: "issuedDate"
    type: "Date"
  - name: "overallOpinion"
    type: "OpinionRating"
  - name: "distributionList"
    type: "String"
  relations:
  - name: "engagement"
    type: "AuditEngagement"
    multiplicity: "OneToOne"
  - name: "findings"
    type: "Finding"
    multiplicity: "OneToMany"
- name: "QualityReview"
  description: "Independent review to ensure workpapers and conclusions meet methodology\
    \ and standards."
  data:
  - name: "reviewDate"
    type: "Date"
  - name: "result"
    type: "QAResult"
  - name: "reviewerNotes"
    type: "String"
  relations:
  - name: "engagement"
    type: "AuditEngagement"
    multiplicity: "ManyToOne"
  - name: "workpaper"
    type: "Workpaper"
    multiplicity: "ManyToOne"
  - name: "reviewer"
    type: "Auditor"
    multiplicity: "ManyToOne"
enums:
- name: "AuditableEntityType"
  description: "Classification of items in the audit universe."
  data:
  - name: "Process"
  - name: "BusinessUnit"
  - name: "LegalEntity"
  - name: "ITSystem"
  - name: "Application"
  - name: "DataDomain"
  - name: "SharedService"
  - name: "Location"
  - name: "ThirdParty"
- name: "EngagementType"
  description: "Type of audit assignment based on scope and objective."
  data:
  - name: "InternalAudit"
  - name: "ITAudit"
  - name: "ComplianceAudit"
  - name: "FinancialAudit"
  - name: "OperationalAudit"
  - name: "IntegratedAudit"
  - name: "FollowUp"
- name: "EngagementStatus"
  description: "Lifecycle state of an audit engagement."
  data:
  - name: "Planned"
  - name: "InFieldwork"
  - name: "InReview"
  - name: "Reporting"
  - name: "Closed"
  - name: "Deferred"
  - name: "Cancelled"
- name: "ControlType"
  description: "Purpose-oriented classification of a control."
  data:
  - name: "Preventive"
  - name: "Detective"
  - name: "Corrective"
  - name: "Compensating"
  - name: "ITGeneral"
  - name: "Application"
- name: "ControlNature"
  description: "Nature of how a control operates."
  data:
  - name: "Manual"
  - name: "Automated"
  - name: "Hybrid"
- name: "Frequency"
  description: "How often a control operates or a procedure is performed."
  data:
  - name: "Annual"
  - name: "SemiAnnual"
  - name: "Quarterly"
  - name: "Monthly"
  - name: "Weekly"
  - name: "Daily"
  - name: "Continuous"
  - name: "AdHoc"
- name: "EvidenceType"
  description: "Form of evidence gathered during the audit."
  data:
  - name: "Document"
  - name: "SystemExport"
  - name: "Screenshot"
  - name: "LogFile"
  - name: "InterviewNote"
  - name: "Configuration"
  - name: "Email"
  - name: "Photograph"
  - name: "Observation"
- name: "EvidenceReliability"
  description: "Auditor’s assessment of evidence trustworthiness."
  data:
  - name: "High"
  - name: "Medium"
  - name: "Low"
- name: "WorkpaperStatus"
  description: "Progress state of a workpaper."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Approved"
  - name: "Archived"
- name: "ControlTestType"
  description: "Whether the test assesses control design or operation."
  data:
  - name: "Design"
  - name: "Operating"
- name: "TestResult"
  description: "Outcome of a test or sample evaluation."
  data:
  - name: "Pass"
  - name: "Fail"
  - name: "Partial"
  - name: "NotApplicable"
  - name: "Inconclusive"
- name: "SeverityRating"
  description: "Impact and urgency level associated with a finding."
  data:
  - name: "Critical"
  - name: "High"
  - name: "Moderate"
  - name: "Low"
  - name: "Advisory"
- name: "IssueStatus"
  description: "Current disposition of a tracked issue."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "PendingValidation"
  - name: "Resolved"
  - name: "Closed"
  - name: "Reopened"
  - name: "Deferred"
  - name: "AcceptedRisk"
- name: "RecommendationPriority"
  description: "Priority for implementing a recommendation or action."
  data:
  - name: "Urgent"
  - name: "High"
  - name: "Medium"
  - name: "Low"
- name: "FollowUpStatus"
  description: "Status of remediation verification."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Verified"
  - name: "NotVerified"
- name: "RiskLevel"
  description: "Aggregated risk rating based on likelihood and impact."
  data:
  - name: "VeryHigh"
  - name: "High"
  - name: "Medium"
  - name: "Low"
  - name: "VeryLow"
- name: "SamplingMethod"
  description: "Technique used to select items from a population."
  data:
  - name: "Random"
  - name: "Judgmental"
  - name: "Stratified"
  - name: "Systematic"
  - name: "Haphazard"
- name: "OpinionRating"
  description: "Overall assurance opinion communicated in the report."
  data:
  - name: "Strong"
  - name: "Satisfactory"
  - name: "NeedsImprovement"
  - name: "Unsatisfactory"
  - name: "NoOpinion"
- name: "PopulationSource"
  description: "Origin of the population data set used for sampling."
  data:
  - name: "SystemOfRecord"
  - name: "ThirdParty"
  - name: "ManualRecord"
  - name: "ExternalData"
  - name: "Observation"
- name: "RootCauseCategory"
  description: "Primary underlying reason for the issue."
  data:
  - name: "Process"
  - name: "People"
  - name: "Technology"
  - name: "Policy"
  - name: "Governance"
  - name: "ThirdParty"
  - name: "External"
  - name: "Culture"
- name: "FindingCategory"
  description: "Thematic classification of a finding."
  data:
  - name: "ControlDesign"
  - name: "ControlOperation"
  - name: "Compliance"
  - name: "FinancialReporting"
  - name: "Security"
  - name: "Privacy"
  - name: "Safety"
  - name: "Efficiency"
- name: "PlanStatus"
  description: "Approval and execution state of an audit plan."
  data:
  - name: "Draft"
  - name: "Approved"
  - name: "InExecution"
  - name: "Completed"
  - name: "Closed"
- name: "AuditorRole"
  description: "Functional role performed by an auditor on engagements."
  data:
  - name: "ChiefAuditExecutive"
  - name: "EngagementManager"
  - name: "LeadAuditor"
  - name: "Auditor"
  - name: "Specialist"
  - name: "QAReviewer"
- name: "ObjectiveType"
  description: "Focus area addressed by an audit objective."
  data:
  - name: "ControlEffectiveness"
  - name: "Compliance"
  - name: "OperationalEfficiency"
  - name: "FinancialAccuracy"
  - name: "InformationSecurity"
  - name: "DataIntegrity"
- name: "MethodologyDocumentType"
  description: "Category of methodology artifact maintained by the audit function."
  data:
  - name: "Policy"
  - name: "Procedure"
  - name: "Template"
  - name: "Checklist"
  - name: "Guidance"
- name: "ActionPlanStatus"
  description: "Progress state of a remediation action."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Implemented"
  - name: "Verified"
  - name: "Deferred"
  - name: "Cancelled"
- name: "QAResult"
  description: "Outcome of an independent quality review of audit work."
  data:
  - name: "Satisfactory"
  - name: "NeedsImprovement"
  - name: "Unsatisfactory"
valueObjects:
- name: "DateRange"
  description: "Closed-open interval used to represent a start and end date."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "PersonName"
  description: "Structured representation of a person’s name for consistent display\
    \ and search."
  data:
  - name: "firstName"
    type: "String"
  - name: "middleName"
    type: "String"
  - name: "lastName"
    type: "String"
- name: "EmailAddress"
  description: "RFC-compliant email address expressed as a single string."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "Contact phone number including country and area codes as needed."
  data:
  - name: "value"
    type: "String"
- name: "DocumentReference"
  description: "Pointer to an evidence artifact stored in a document repository."
  data:
  - name: "title"
    type: "String"
  - name: "uri"
    type: "String"
  - name: "uploadedAt"
    type: "DateTime"
  - name: "checksum"
