---
metadata:
  name: "HCIDL Records Management Capabilities Model"
  description: "A capabilities model for governing the lifecycle of records, including\
    \ classification, retention, disposition, legal hold, access, and audit across\
    \ physical and digital repositories."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Governance"
  type: "Capability"
  domain: "Records Management"
entities:
- name: "Repository"
  description: "System of record where content, metadata, and controls for records\
    \ are maintained."
  data:
  - name: "name"
    type: "String"
  - name: "repositoryType"
    type: "RepositoryType"
  - name: "baseUri"
    type: "String"
  - name: "defaultStorageMedium"
    type: "StorageMedium"
  relations:
  - name: "storageLocations"
    type: "StorageLocation"
    multiplicity: "OneToMany"
  - name: "filePlans"
    type: "FilePlan"
    multiplicity: "OneToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "auditLogs"
    type: "AuditLogEntry"
    multiplicity: "OneToMany"
- name: "StorageLocation"
  description: "Physical or logical location used to store records, containers, or\
    \ folders."
  data:
  - name: "name"
    type: "String"
  - name: "locationCode"
    type: "String"
  - name: "storageMedium"
    type: "StorageMedium"
  relations:
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "boxes"
    type: "Box"
    multiplicity: "OneToMany"
  - name: "folders"
    type: "Folder"
    multiplicity: "OneToMany"
- name: "FilePlan"
  description: "Hierarchical framework of record categories that governs classification,\
    \ retention, and disposition."
  data:
  - name: "name"
    type: "String"
  - name: "versionLabel"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  relations:
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "classificationScheme"
    type: "ClassificationScheme"
    multiplicity: "OneToOne"
  - name: "categories"
    type: "RecordCategory"
    multiplicity: "OneToMany"
  - name: "retentionSchedule"
    type: "RetentionSchedule"
    multiplicity: "OneToOne"
- name: "ClassificationScheme"
  description: "Controlled vocabulary and structure used to classify records consistently."
  data:
  - name: "name"
    type: "String"
  - name: "schemeType"
    type: "ClassificationSchemeType"
  relations:
  - name: "filePlan"
    type: "FilePlan"
    multiplicity: "OneToOne"
  - name: "terms"
    type: "ClassificationTerm"
    multiplicity: "OneToMany"
- name: "ClassificationTerm"
  description: "Node in the classification scheme representing a function, activity,\
    \ or subject."
  data:
  - name: "termCode"
    type: "String"
  - name: "label"
    type: "String"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "scheme"
    type: "ClassificationScheme"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "ClassificationTerm"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "ClassificationTerm"
    multiplicity: "OneToMany"
  - name: "categories"
    type: "RecordCategory"
    multiplicity: "ManyToMany"
- name: "RecordCategory"
  description: "Logical grouping within a file plan that determines metadata, access,\
    \ and retention rules for records."
  data:
  - name: "code"
    type: "String"
  - name: "title"
    type: "String"
  - name: "dispositionAuthority"
    type: "String"
  - name: "securityClassification"
    type: "SecurityClassification"
  relations:
  - name: "filePlan"
    type: "FilePlan"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "RecordCategory"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "RecordCategory"
    multiplicity: "OneToMany"
  - name: "retentionRules"
    type: "RetentionRule"
    multiplicity: "OneToMany"
  - name: "records"
    type: "Record"
    multiplicity: "OneToMany"
- name: "RetentionSchedule"
  description: "Authorized set of retention rules defining triggers, periods, and\
    \ dispositions across categories."
  data:
  - name: "name"
    type: "String"
  - name: "versionLabel"
    type: "String"
  - name: "approvedOn"
    type: "Date"
  - name: "status"
    type: "RetentionScheduleStatus"
  relations:
  - name: "filePlan"
    type: "FilePlan"
    multiplicity: "OneToOne"
  - name: "rules"
    type: "RetentionRule"
    multiplicity: "OneToMany"
- name: "RetentionRule"
  description: "Instruction specifying when retention begins, how long to keep records,\
    \ and the final disposition."
  data:
  - name: "ruleCode"
    type: "String"
  - name: "triggerType"
    type: "TriggerType"
  - name: "periodQuantity"
    type: "Integer"
  - name: "periodUnit"
    type: "RetentionPeriodUnit"
  - name: "finalDisposition"
    type: "DispositionType"
  - name: "holdOverridePolicy"
    type: "HoldOverridePolicy"
  relations:
  - name: "schedule"
    type: "RetentionSchedule"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "RecordCategory"
    multiplicity: "ManyToOne"
  - name: "triggers"
    type: "TriggerEventDefinition"
    multiplicity: "OneToMany"
- name: "TriggerEventDefinition"
  description: "Business event definition that starts the retention clock for applicable\
    \ records."
  data:
  - name: "name"
    type: "String"
  - name: "eventType"
    type: "EventType"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "retentionRule"
    type: "RetentionRule"
    multiplicity: "ManyToOne"
- name: "Record"
  description: "Declared document or information object placed under records control."
  data:
  - name: "recordNumber"
    type: "String"
  - name: "title"
    type: "String"
  - name: "recordStatus"
    type: "RecordStatus"
  - name: "format"
    type: "MediaType"
  - name: "captureMethod"
    type: "CaptureMethod"
  - name: "declaredOn"
    type: "Date"
  - name: "closedOn"
    type: "Date"
  - name: "checksum"
    type: "ContentHash"
  - name: "uri"
    type: "URI"
  relations:
  - name: "category"
    type: "RecordCategory"
    multiplicity: "ManyToOne"
  - name: "folder"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "RecordVersion"
    multiplicity: "OneToMany"
  - name: "dispositions"
    type: "DispositionReview"
    multiplicity: "OneToMany"
  - name: "legalHolds"
    type: "LegalHold"
    multiplicity: "ManyToMany"
  - name: "custodians"
    type: "Custodian"
    multiplicity: "ManyToMany"
  - name: "relatedRecords"
    type: "Record"
    multiplicity: "ManyToMany"
- name: "RecordVersion"
  description: "Immutable rendition of a record's content and metadata at a specific\
    \ point in time."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "createdOn"
    type: "DateTime"
  - name: "sizeBytes"
    type: "Integer"
  - name: "checksum"
    type: "ContentHash"
  relations:
  - name: "record"
    type: "Record"
    multiplicity: "ManyToOne"
  - name: "formatProfile"
    type: "ConversionProfile"
    multiplicity: "ManyToOne"
- name: "Folder"
  description: "Logical container for organizing records and applying shared controls."
  data:
  - name: "name"
    type: "String"
  - name: "folderPath"
    type: "String"
  - name: "status"
    type: "FolderStatus"
  relations:
  - name: "parent"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "Folder"
    multiplicity: "OneToMany"
  - name: "records"
    type: "Record"
    multiplicity: "OneToMany"
  - name: "storageLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "box"
    type: "Box"
    multiplicity: "ManyToOne"
- name: "Box"
  description: "Physical container used for storing paper files or media in offsite\
    \ or onsite storage."
  data:
  - name: "boxNumber"
    type: "String"
  - name: "label"
    type: "String"
  - name: "sealed"
    type: "Boolean"
  relations:
  - name: "storageLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "folders"
    type: "Folder"
    multiplicity: "OneToMany"
- name: "IngestionBatch"
  description: "Group of items captured or imported together for processing and declaration."
  data:
  - name: "batchNumber"
    type: "String"
  - name: "receivedOn"
    type: "DateTime"
  - name: "sourceType"
    type: "SourceType"
  - name: "totalItems"
    type: "Integer"
  - name: "status"
    type: "IngestionStatus"
  relations:
  - name: "records"
    type: "Record"
    multiplicity: "OneToMany"
  - name: "captureSource"
    type: "CaptureSource"
    multiplicity: "ManyToOne"
- name: "CaptureSource"
  description: "Origin system, device, or channel from which records are captured."
  data:
  - name: "name"
    type: "String"
  - name: "sourceSystemId"
    type: "String"
  - name: "ownerDepartment"
    type: "String"
  relations:
  - name: "batches"
    type: "IngestionBatch"
    multiplicity: "OneToMany"
- name: "DispositionReview"
  description: "Formal review to authorize disposition of records per the retention\
    \ rule."
  data:
  - name: "reviewDate"
    type: "Date"
  - name: "reviewer"
    type: "String"
  - name: "outcome"
    type: "ReviewOutcome"
  - name: "notes"
    type: "String"
  relations:
  - name: "record"
    type: "Record"
    multiplicity: "ManyToOne"
  - name: "retentionRule"
    type: "RetentionRule"
    multiplicity: "ManyToOne"
  - name: "dispositionAction"
    type: "DispositionAction"
    multiplicity: "OneToOne"
- name: "DispositionAction"
  description: "Executed action resulting from an approved disposition, such as destruction\
    \ or transfer."
  data:
  - name: "executedOn"
    type: "Date"
  - name: "actionType"
    type: "DispositionType"
  - name: "status"
    type: "DispositionStatus"
  - name: "destination"
    type: "String"
  relations:
  - name: "review"
    type: "DispositionReview"
    multiplicity: "ManyToOne"
- name: "LegalHold"
  description: "Directive to suspend disposition and preserve potentially relevant\
    \ records."
  data:
  - name: "holdName"
    type: "String"
  - name: "holdStatus"
    type: "HoldStatus"
  - name: "issuedOn"
    type: "Date"
  - name: "releasedOn"
    type: "Date"
  - name: "reason"
    type: "String"
  relations:
  - name: "custodians"
    type: "Custodian"
    multiplicity: "ManyToMany"
  - name: "records"
    type: "Record"
    multiplicity: "ManyToMany"
  - name: "holdPolicy"
    type: "HoldPolicy"
    multiplicity: "ManyToOne"
- name: "HoldPolicy"
  description: "Reusable policy template that defines scope, notifications, and escalation\
    \ for legal holds."
  data:
  - name: "name"
    type: "String"
  - name: "notificationTemplate"
    type: "String"
  - name: "escalationDays"
    type: "Integer"
  relations:
  - name: "holds"
    type: "LegalHold"
    multiplicity: "OneToMany"
- name: "Custodian"
  description: "Individual or group responsible for records subject to hold or preservation."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "RoleType"
  relations:
  - name: "legalHolds"
    type: "LegalHold"
    multiplicity: "ManyToMany"
  - name: "records"
    type: "Record"
    multiplicity: "ManyToMany"
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
- name: "Department"
  description: "Organizational unit that owns processes and records."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  relations:
  - name: "custodians"
    type: "Custodian"
    multiplicity: "OneToMany"
  - name: "records"
    type: "Record"
    multiplicity: "OneToMany"
- name: "AccessPolicy"
  description: "Access control policy assigning permission levels to roles or directly\
    \ to records and categories."
  data:
  - name: "policyName"
    type: "String"
  - name: "accessLevel"
    type: "AccessLevel"
  - name: "startsOn"
    type: "Date"
  - name: "endsOn"
    type: "Date"
  relations:
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "RecordCategory"
    multiplicity: "ManyToOne"
  - name: "records"
    type: "Record"
    multiplicity: "ManyToMany"
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
- name: "Role"
  description: "Role used to assign permissions for records operations."
  data:
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "ManyToMany"
- name: "User"
  description: "Person authenticated to interact with the repository and subject to\
    \ auditing."
  data:
  - name: "username"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "auditLogs"
    type: "AuditLogEntry"
    multiplicity: "OneToMany"
- name: "AuditLogEntry"
  description: "Immutable evidence of security- and compliance-relevant actions."
  data:
  - name: "occurredOn"
    type: "DateTime"
  - name: "actor"
    type: "String"
  - name: "action"
    type: "AuditAction"
  - name: "targetType"
    type: "String"
  - name: "targetReference"
    type: "String"
  - name: "ipAddress"
    type: "String"
  - name: "outcome"
    type: "AuditOutcome"
  relations:
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "record"
    type: "Record"
    multiplicity: "ManyToOne"
- name: "MetadataTemplate"
  description: "Template that defines structured metadata captured for records."
  data:
  - name: "name"
    type: "String"
  - name: "versionLabel"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "indexFields"
    type: "IndexField"
    multiplicity: "OneToMany"
  - name: "categories"
    type: "RecordCategory"
    multiplicity: "ManyToMany"
  - name: "sources"
    type: "CaptureSource"
    multiplicity: "ManyToMany"
- name: "IndexField"
  description: "Metadata attribute definition including data type and validation."
  data:
  - name: "fieldName"
    type: "String"
  - name: "dataType"
    type: "IndexDataType"
  - name: "required"
    type: "Boolean"
  - name: "multiValued"
    type: "Boolean"
  relations:
  - name: "template"
    type: "MetadataTemplate"
    multiplicity: "ManyToOne"
- name: "ConversionProfile"
  description: "Policy for normalizing formats, creating preservation copies, and\
    \ enabling OCR."
  data:
  - name: "name"
    type: "String"
  - name: "sourceFormat"
    type: "FileFormat"
  - name: "targetFormat"
    type: "FileFormat"
  - name: "ocrEnabled"
    type: "Boolean"
  relations:
  - name: "versions"
    type: "RecordVersion"
    multiplicity: "OneToMany"
- name: "PrivacyRequest"
  description: "Data subject request related to personal data contained within records."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "requestType"
    type: "PrivacyRequestType"
  - name: "submittedOn"
    type: "Date"
  - name: "status"
    type: "PrivacyRequestStatus"
  - name: "requester"
    type: "String"
  relations:
  - name: "records"
    type: "Record"
    multiplicity: "ManyToMany"
- name: "RedactionRequest"
  description: "Request to mask or remove sensitive information from record renditions."
  data:
  - name: "requestedOn"
    type: "Date"
  - name: "requestedBy"
    type: "String"
  - name: "reason"
    type: "String"
  - name: "status"
    type: "RedactionStatus"
  relations:
  - name: "record"
    type: "Record"
    multiplicity: "ManyToOne"
  - name: "actions"
    type: "RedactionAction"
    multiplicity: "OneToMany"
- name: "RedactionAction"
  description: "Executed redaction operation recorded for compliance and auditability."
  data:
  - name: "performedOn"
    type: "Date"
  - name: "tool"
    type: "String"
  - name: "success"
    type: "Boolean"
  - name: "notes"
    type: "String"
  relations:
  - name: "request"
    type: "RedactionRequest"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "RecordVersion"
    multiplicity: "ManyToOne"
enums:
- name: "RepositoryType"
  description: "Type of platform used to manage records."
  data:
  - name: "ContentServices"
  - name: "EnterpriseArchive"
  - name: "DocumentManagement"
  - name: "EmailArchive"
  - name: "FileShare"
  - name: "PhysicalArchive"
- name: "StorageMedium"
  description: "Physical or logical medium on which records are stored."
  data:
  - name: "CloudObjectStorage"
  - name: "NetworkFileShare"
  - name: "LocalDisk"
  - name: "TapeLibrary"
  - name: "Paper"
  - name: "OffsiteStorage"
- name: "ClassificationSchemeType"
  description: "Organizational approach used for record classification."
  data:
  - name: "Functional"
  - name: "Subject"
  - name: "Administrative"
  - name: "Thesaurus"
- name: "SecurityClassification"
  description: "Sensitivity level used to control record access."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Confidential"
  - name: "Restricted"
  - name: "Secret"
- name: "AccessLevel"
  description: "Permission level granted by an access policy."
  data:
  - name: "Read"
  - name: "Contribute"
  - name: "Manage"
- name: "RetentionScheduleStatus"
  description: "Lifecycle state of a retention schedule."
  data:
  - name: "Draft"
  - name: "Approved"
  - name: "Superseded"
  - name: "Retired"
- name: "TriggerType"
  description: "Basis for calculating the start of the retention period."
  data:
  - name: "FromCreation"
  - name: "FromDeclaration"
  - name: "FromClosure"
  - name: "FromEvent"
- name: "RetentionPeriodUnit"
  description: "Unit of time used to express a retention period."
  data:
  - name: "Days"
  - name: "Months"
  - name: "Years"
- name: "DispositionType"
  description: "Final action to be taken when retention ends."
  data:
  - name: "Destroy"
  - name: "Transfer"
  - name: "Archive"
  - name: "Review"
- name: "HoldOverridePolicy"
  description: "Policy for how legal holds affect disposition rules."
  data:
  - name: "ProhibitDisposition"
  - name: "AllowTransferOnly"
  - name: "AllowExportOnly"
- name: "EventType"
  description: "Business event that may trigger or impact retention."
  data:
  - name: "ContractTermination"
  - name: "EmployeeSeparation"
  - name: "CaseClosure"
  - name: "Superseded"
  - name: "FiscalYearEnd"
- name: "RecordStatus"
  description: "Lifecycle state of a record under management."
  data:
  - name: "Draft"
  - name: "Declared"
  - name: "Active"
  - name: "Closed"
  - name: "Superseded"
  - name: "UnderReview"
- name: "MediaType"
  description: "Content type associated with a record."
  data:
  - name: "Document"
  - name: "Email"
  - name: "Image"
  - name: "Audio"
  - name: "Video"
  - name: "Dataset"
  - name: "WebPage"
  - name: "Paper"
- name: "CaptureMethod"
  description: "Method by which a record was captured or declared."
  data:
  - name: "Upload"
  - name: "Scan"
  - name: "EmailIngestion"
  - name: "API"
  - name: "BulkImport"
  - name: "SystemGenerated"
- name: "FolderStatus"
  description: "Administrative status of a folder."
  data:
  - name: "Open"
  - name: "Closed"
  - name: "Archived"
- name: "IngestionStatus"
  description: "Processing status of a capture or import batch."
  data:
  - name: "Pending"
  - name: "Processing"
  - name: "Completed"
  - name: "Failed"
  - name: "Rejected"
- name: "SourceType"
  description: "Origin category of captured items."
  data:
  - name: "Application"
  - name: "Scanner"
  - name: "EmailSystem"
  - name: "FileShare"
  - name: "ExternalPartner"
- name: "ReviewOutcome"
  description: "Decision taken during disposition review."
  data:
  - name: "Approved"
  - name: "Rejected"
  - name: "NeedsMoreInfo"
  - name: "Deferred"
- name: "DispositionStatus"
  description: "Execution status of a disposition action."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
  - name: "Blocked"
- name: "HoldStatus"
  description: "Operational status of a legal hold."
  data:
  - name: "Active"
  - name: "Released"
  - name: "Suspended"
- name: "RoleType"
  description: "Function performed by a custodian or records stakeholder."
  data:
  - name: "RecordsManager"
  - name: "LegalCounsel"
  - name: "Custodian"
  - name: "ComplianceOfficer"
  - name: "BusinessOwner"
  - name: "Administrator"
- name: "IndexDataType"
  description: "Data type used for a structured metadata field."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Date"
  - name: "Boolean"
  - name: "Enumeration"
- name: "FileFormat"
  description: "File format for source or normalized content."
  data:
  - name: "PDF"
  - name: "PDF_A"
  - name: "DOCX"
  - name: "TXT"
  - name: "CSV"
  - name: "TIFF"
  - name: "JPEG"
  - name: "MSG"
  - name: "EML"
  - name: "XML"
  - name: "JSON"
- name: "AuditAction"
  description: "Action types captured in the audit log."
  data:
  - name: "CreateRecord"
  - name: "UpdateMetadata"
  - name: "DeclareRecord"
  - name: "CloseRecord"
  - name: "AddHold"
  - name: "ReleaseHold"
  - name: "Download"
  - name: "View"
  - name: "Delete"
  - name: "Disposition"
- name: "AuditOutcome"
  description: "Result of an audited action."
  data:
  - name: "Success"
  - name: "Failure"
  - name: "Denied"
  - name: "Partial"
- name: "PrivacyRequestType"
  description: "Type of data subject request."
  data:
  - name: "Access"
  - name: "Rectification"
  - name: "Erasure"
  - name: "RestrictProcessing"
  - name: "Portability"
