---
metadata:
  name: "Data Retention HCIDL Capabilities Model"
  description: "Capabilities model for defining, governing, scheduling, and executing\
    \ data retention and disposition across datasets, systems, and jurisdictions."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Governance"
  type: "Capability"
  domain: "Data Retention"
entities:
- name: "RetentionPolicy"
  description: "Governance directive that sets objectives, scope, and control requirements\
    \ for retaining and disposing of enterprise data."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "PolicyStatus"
  - name: "applicability"
    type: "PolicyApplicability"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "owner"
    type: "ContactPoint"
  - name: "reviewCycleMonths"
    type: "Integer"
  relations:
  - name: "rules"
    type: "RetentionRule"
    multiplicity: "OneToMany"
  - name: "jurisdictions"
    type: "Jurisdiction"
    multiplicity: "ManyToMany"
  - name: "reviews"
    type: "PolicyReview"
    multiplicity: "OneToMany"
- name: "RetentionRule"
  description: "Executable instruction that determines retention period, trigger,\
    \ action, and scope for specific data classes and datasets."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "RuleStatus"
  - name: "triggerType"
    type: "RetentionTriggerType"
  - name: "triggerEvent"
    type: "TriggerEventType"
  - name: "retentionPeriod"
    type: "RetentionPeriod"
  - name: "action"
    type: "DispositionAction"
  - name: "legalCitation"
    type: "LegalCitation"
  - name: "reviewRequired"
    type: "Boolean"
  relations:
  - name: "policy"
    type: "RetentionPolicy"
    multiplicity: "ManyToOne"
  - name: "jurisdiction"
    type: "Jurisdiction"
    multiplicity: "ManyToOne"
  - name: "categories"
    type: "DataCategory"
    multiplicity: "ManyToMany"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "exceptions"
    type: "PolicyException"
    multiplicity: "OneToMany"
- name: "Dataset"
  description: "Logical collection of related data records managed as a unit for governance\
    \ and operational purposes."
  data:
  - name: "name"
    type: "String"
  - name: "businessOwner"
    type: "ContactPoint"
  - name: "dataSteward"
    type: "ContactPoint"
  - name: "classification"
    type: "DataClassification"
  - name: "sensitivity"
    type: "DataSensitivity"
  - name: "status"
    type: "DatasetStatus"
  relations:
  - name: "systemOfRecord"
    type: "SystemOfRecord"
    multiplicity: "ManyToOne"
  - name: "dataStores"
    type: "_DataStore"
    multiplicity: "ManyToMany"
  - name: "categories"
    type: "DataCategory"
    multiplicity: "ManyToMany"
  - name: "rules"
    type: "RetentionRule"
    multiplicity: "ManyToMany"
  - name: "legalHolds"
    type: "LegalHold"
    multiplicity: "ManyToMany"
  - name: "dispositionEvents"
    type: "DispositionEvent"
    multiplicity: "OneToMany"
- name: "DataCategory"
  description: "Business-defined class of information used to group records for retention,\
    \ compliance, and operational treatment."
  data:
  - name: "name"
    type: "String"
  - name: "categoryCode"
    type: "String"
  - name: "sensitivity"
    type: "DataSensitivity"
  - name: "defaultAction"
    type: "DispositionAction"
  relations:
  - name: "parentCategory"
    type: "DataCategory"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "RetentionRule"
    multiplicity: "ManyToMany"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "legalHolds"
    type: "LegalHold"
    multiplicity: "ManyToMany"
- name: "SystemOfRecord"
  description: "Authoritative business application or platform responsible for managing\
    \ specific datasets throughout their lifecycle."
  data:
  - name: "name"
    type: "String"
  - name: "businessOwner"
    type: "ContactPoint"
  - name: "purpose"
    type: "String"
  - name: "operationalSince"
    type: "Date"
  - name: "managesBackups"
    type: "Boolean"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "OneToMany"
  - name: "dataStores"
    type: "_DataStore"
    multiplicity: "OneToMany"
- name: "_DataStore"
  description: "Physical or logical storage location where dataset records reside\
    \ or transit."
  data:
  - name: "name"
    type: "String"
  - name: "locationType"
    type: "StorageLocationType"
  - name: "storageTier"
    type: "StorageTier"
  - name: "region"
    type: "String"
  - name: "retentionAutomationCapable"
    type: "Boolean"
  - name: "endpoint"
    type: "String"
  relations:
  - name: "systemOfRecord"
    type: "SystemOfRecord"
    multiplicity: "ManyToOne"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "backupSets"
    type: "BackupSet"
    multiplicity: "OneToMany"
- name: "BackupSet"
  description: "Defined scope of backup data with its own schedule and retention behavior\
    \ distinct from the primary data store."
  data:
  - name: "name"
    type: "String"
  - name: "schedule"
    type: "ScheduleWindow"
  - name: "retentionInBackup"
    type: "RetentionPeriod"
  - name: "includesDisasterRecovery"
    type: "Boolean"
  relations:
  - name: "dataStore"
    type: "_DataStore"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "RetentionRule"
    multiplicity: "ManyToMany"
- name: "Jurisdiction"
  description: "Geographic or regulatory authority under which retention obligations\
    \ are interpreted and enforced."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "policies"
    type: "RetentionPolicy"
    multiplicity: "ManyToMany"
  - name: "rules"
    type: "RetentionRule"
    multiplicity: "OneToMany"
- name: "LegalHold"
  description: "Instruction to preserve relevant information by suspending normal\
    \ disposition until the hold is released."
  data:
  - name: "name"
    type: "String"
  - name: "reason"
    type: "HoldReason"
  - name: "status"
    type: "HoldStatus"
  - name: "issuedDate"
    type: "Date"
  - name: "releasedDate"
    type: "Date"
  - name: "issuer"
    type: "ContactPoint"
  - name: "notes"
    type: "String"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "categories"
    type: "DataCategory"
    multiplicity: "ManyToMany"
- name: "PolicyException"
  description: "Authorized deviation from a retention rule for a defined scope and\
    \ time period."
  data:
  - name: "name"
    type: "String"
  - name: "reason"
    type: "ExceptionReason"
  - name: "status"
    type: "ExceptionStatus"
  - name: "approvedBy"
    type: "ContactPoint"
  - name: "validUntil"
    type: "Date"
  - name: "justification"
    type: "String"
  relations:
  - name: "rule"
    type: "RetentionRule"
    multiplicity: "ManyToOne"
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
- name: "DispositionBatch"
  description: "Operational execution window that groups multiple disposition events\
    \ for coordinated processing."
  data:
  - name: "batchReference"
    type: "String"
  - name: "scheduledFor"
    type: "DateTime"
  - name: "startedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  - name: "status"
    type: "JobStatus"
  relations:
  - name: "rule"
    type: "RetentionRule"
    multiplicity: "ManyToOne"
  - name: "events"
    type: "DispositionEvent"
    multiplicity: "OneToMany"
- name: "DispositionEvent"
  description: "Record of a single retention action planned or performed against a\
    \ specific resource within a dataset."
  data:
  - name: "eventKey"
    type: "String"
  - name: "resource"
    type: "ResourceLocator"
  - name: "action"
    type: "DispositionAction"
  - name: "scheduledFor"
    type: "DateTime"
  - name: "executedAt"
    type: "DateTime"
  - name: "result"
    type: "ExecutionResult"
  - name: "message"
    type: "String"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "batch"
    type: "DispositionBatch"
    multiplicity: "ManyToOne"
  - name: "legalHold"
    type: "LegalHold"
    multiplicity: "ManyToOne"
- name: "DataLifecycleEvent"
  description: "Trace of a significant lifecycle moment used to calculate or update\
    \ retention anchors."
  data:
  - name: "eventType"
    type: "LifecycleEventType"
  - name: "occurredAt"
    type: "DateTime"
  - name: "actor"
    type: "String"
  - name: "source"
    type: "String"
  - name: "resource"
    type: "ResourceLocator"
  - name: "comment"
    type: "String"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
- name: "PolicyReview"
  description: "Periodic assessment of a retention policy’s effectiveness, accuracy,\
    \ and continued applicability."
  data:
  - name: "reviewer"
    type: "ContactPoint"
  - name: "reviewDate"
    type: "Date"
  - name: "outcome"
    type: "String"
  - name: "nextReviewDue"
    type: "Date"
  relations:
  - name: "policy"
    type: "RetentionPolicy"
    multiplicity: "ManyToOne"
enums:
- name: "PolicyStatus"
  description: "Lifecycle state of a retention policy from inception to retirement."
  data:
  - name: "Draft"
  - name: "Approved"
  - name: "Effective"
  - name: "Superseded"
  - name: "Retired"
- name: "PolicyApplicability"
  description: "Organizational scope to which a policy applies."
  data:
  - name: "Global"
  - name: "Regional"
  - name: "Jurisdictional"
  - name: "BusinessUnit"
- name: "RetentionTriggerType"
  description: "High-level mechanism that anchors the start of the retention period."
  data:
  - name: "EventBased"
  - name: "AgeBased"
- name: "TriggerEventType"
  description: "Specific lifecycle event that serves as the anchor for calculating\
    \ retention."
  data:
  - name: "Created"
  - name: "Updated"
  - name: "Accessed"
  - name: "ContractEnd"
  - name: "AccountClosure"
  - name: "ConsentWithdrawal"
- name: "DispositionAction"
  description: "Outcome to be applied when the retention period is satisfied."
  data:
  - name: "Delete"
  - name: "Destroy"
  - name: "Anonymize"
  - name: "Archive"
  - name: "Retain"
  - name: "MoveToArchive"
- name: "RuleStatus"
  description: "Operational status of a retention rule."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Suspended"
  - name: "Superseded"
  - name: "Retired"
- name: "DataClassification"
  description: "Business classification that guides handling and disclosure of data."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Confidential"
  - name: "Restricted"
- name: "DataSensitivity"
  description: "Impact severity if the data is improperly disclosed, altered, or lost."
  data:
  - name: "Low"
  - name: "Moderate"
  - name: "High"
  - name: "Critical"
- name: "StorageLocationType"
  description: "Type of storage technology or service hosting the data."
  data:
  - name: "Database"
  - name: "DataLake"
  - name: "ObjectStore"
  - name: "FileShare"
  - name: "Queue"
  - name: "Stream"
  - name: "SaaS"
  - name: "Log"
  - name: "BackupRepository"
- name: "StorageTier"
  description: "Performance and cost tier of the storage environment."
  data:
  - name: "Hot"
  - name: "Warm"
  - name: "Cold"
  - name: "Archive"
- name: "DatasetStatus"
  description: "Lifecycle state of a dataset within the organization."
  data:
  - name: "Active"
  - name: "Deprecated"
  - name: "Decommissioned"
- name: "HoldStatus"
  description: "Current enforceability of a legal hold."
  data:
  - name: "Active"
  - name: "Released"
- name: "HoldReason"
  description: "Business or legal basis for initiating a legal hold."
  data:
  - name: "Litigation"
  - name: "Investigation"
  - name: "Audit"
  - name: "Regulatory"
  - name: "SecurityIncident"
- name: "ExceptionReason"
  description: "Justification category for deviating from a retention rule."
  data:
  - name: "BusinessNeed"
  - name: "TechnicalLimitation"
  - name: "RegulatoryConflict"
  - name: "DataQuality"
  - name: "Migration"
- name: "ExceptionStatus"
  description: "Authorization and temporal state of a policy exception."
  data:
  - name: "Proposed"
  - name: "Approved"
  - name: "Rejected"
  - name: "Expired"
  - name: "Revoked"
- name: "JobStatus"
  description: "Execution state of a disposition batch."
  data:
  - name: "Scheduled"
  - name: "Running"
  - name: "Completed"
  - name: "Failed"
  - name: "Partial"
- name: "ExecutionResult"
  description: "Outcome of an attempted disposition event."
  data:
  - name: "Success"
  - name: "PartialSuccess"
  - name: "Failed"
  - name: "Skipped"
  - name: "Blocked"
- name: "LifecycleEventType"
  description: "Category of lifecycle occurrence captured for retention anchoring\
    \ and audit."
  data:
  - name: "Creation"
  - name: "Update"
  - name: "Access"
  - name: "Export"
  - name: "Transfer"
  - name: "Deletion"
  - name: "Restoration"
valueObjects:
- name: "RetentionPeriod"
  description: "Expression of the time interval for which data must be retained before\
    \ disposition."
  data:
  - name: "years"
    type: "Integer"
  - name: "months"
    type: "Integer"
  - name: "days"
    type: "Integer"
- name: "ResourceLocator"
  description: "Technical reference to identify a specific resource or record within\
    \ a dataset."
  data:
  - name: "system"
    type: "String"
  - name: "location"
    type: "String"
  - name: "recordKeyPattern"
    type: "String"
- name: "ContactPoint"
  description: "Designated person or group serving as owner, steward, or approver\
    \ for retention activities."
  data:
  - name: "name"
    type: "String"
  - name: "email"
    type: "String"
  - name: "department"
    type: "String"
  - name: "phone"
    type: "String"
- name: "LegalCitation"
  description: "Reference to a legal authority used to justify a retention requirement\
    \ or action."
  data:
  - name: "authority"
    type: "String"
  - name: "instrument"
    type: "String"
  - name: "article"
    type: "String"
- name: "ScheduleWindow"
  description: "Scheduling expression and timezone used to orchestrate disposition\
    \ batches or backup cycles."
  data:
  - name: "cronExpression"
    type: "String"
  - name: "timezone"
    type: "String"
