---
metadata:
  name: "HCIDL Legal Hold"
  description: "Capabilities model for managing legal hold governance, including matters,\
    \ holds, custodians, notices, preservation, collections, and auditability."
  version: "1.0.0"
  industry: "Legal & Compliance"
  category: "Governance"
  type: "Capability"
  domain: "Legal Hold"
entities:
- name: "Organization"
  description: "Enterprise or legal entity subject to legal hold governance."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "jurisdiction"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "departments"
    type: "Department"
    multiplicity: "OneToMany"
  - name: "matters"
    type: "LegalMatter"
    multiplicity: "OneToMany"
  - name: "custodians"
    type: "Custodian"
    multiplicity: "OneToMany"
  - name: "dataSources"
    type: "DataSource"
    multiplicity: "OneToMany"
- name: "Department"
  description: "Internal business unit supporting custodians and legal operations."
  data:
  - name: "name"
    type: "String"
  - name: "costCenter"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "custodians"
    type: "Custodian"
    multiplicity: "OneToMany"
- name: "LegalCounsel"
  description: "Internal or external counsel responsible for legal strategy and communication."
  data:
  - name: "name"
    type: "PersonName"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "firmName"
    type: "String"
  - name: "role"
    type: "CounselRole"
  relations:
  - name: "matters"
    type: "LegalMatter"
    multiplicity: "ManyToMany"
- name: "LegalMatter"
  description: "Case, investigation, or regulatory inquiry that requires preservation\
    \ obligations."
  data:
  - name: "matterNumber"
    type: "String"
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "matterType"
    type: "MatterType"
  - name: "status"
    type: "MatterStatus"
  - name: "openDate"
    type: "Date"
  - name: "jurisdiction"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "counsels"
    type: "LegalCounsel"
    multiplicity: "ManyToMany"
  - name: "legalHolds"
    type: "LegalHold"
    multiplicity: "OneToMany"
  - name: "collectionRequests"
    type: "CollectionRequest"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "LegalHold"
  description: "Directive to preserve potentially relevant information and suspend\
    \ routine disposition."
  data:
  - name: "holdNumber"
    type: "String"
  - name: "name"
    type: "String"
  - name: "status"
    type: "HoldStatus"
  - name: "effectiveDate"
    type: "Date"
  - name: "scopeDescription"
    type: "String"
  relations:
  - name: "matter"
    type: "LegalMatter"
    multiplicity: "ManyToOne"
  - name: "custodians"
    type: "Custodian"
    multiplicity: "ManyToMany"
  - name: "dataSources"
    type: "DataSource"
    multiplicity: "ManyToMany"
  - name: "preservationRules"
    type: "PreservationRule"
    multiplicity: "OneToMany"
  - name: "notices"
    type: "HoldNotice"
    multiplicity: "OneToMany"
  - name: "reminders"
    type: "Reminder"
    multiplicity: "OneToMany"
  - name: "exemptions"
    type: "ExemptionRequest"
    multiplicity: "OneToMany"
  - name: "releases"
    type: "Release"
    multiplicity: "OneToMany"
  - name: "communicationLogs"
    type: "CommunicationLog"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "PreservationRule"
  description: "Instruction defining what to preserve and how to apply in-place hold\
    \ to a data source."
  data:
  - name: "ruleName"
    type: "String"
  - name: "actionType"
    type: "PreservationActionType"
  - name: "query"
    type: "String"
  - name: "preservationWindow"
    type: "DateRange"
  - name: "status"
    type: "PreservationStatus"
  relations:
  - name: "legalHold"
    type: "LegalHold"
    multiplicity: "ManyToOne"
  - name: "dataSource"
    type: "DataSource"
    multiplicity: "ManyToOne"
- name: "DataSource"
  description: "System or repository where potentially relevant information is stored."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "DataSourceType"
  - name: "systemOwnerEmail"
    type: "EmailAddress"
  - name: "baseUrl"
    type: "Uri"
  - name: "administrativeScope"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "holds"
    type: "LegalHold"
    multiplicity: "ManyToMany"
  - name: "accounts"
    type: "DataSourceAccount"
    multiplicity: "OneToMany"
  - name: "preservationRules"
    type: "PreservationRule"
    multiplicity: "OneToMany"
  - name: "collectionRequests"
    type: "CollectionRequest"
    multiplicity: "ManyToMany"
- name: "DataSourceAccount"
  description: "Individual account or mailbox within a data source, often mapped to\
    \ a custodian."
  data:
  - name: "accountName"
    type: "String"
  - name: "accountIdentifier"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "status"
    type: "AccountStatus"
  relations:
  - name: "dataSource"
    type: "DataSource"
    multiplicity: "ManyToOne"
  - name: "custodian"
    type: "Custodian"
    multiplicity: "ManyToOne"
  - name: "holds"
    type: "LegalHold"
    multiplicity: "ManyToMany"
- name: "Custodian"
  description: "Person whose data may be relevant and who must acknowledge hold obligations."
  data:
  - name: "name"
    type: "PersonName"
  - name: "email"
    type: "EmailAddress"
  - name: "employeeNumber"
    type: "String"
  - name: "jobTitle"
    type: "String"
  - name: "status"
    type: "CustodianStatus"
  - name: "managerEmail"
    type: "EmailAddress"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "notices"
    type: "HoldNotice"
    multiplicity: "OneToMany"
  - name: "acknowledgements"
    type: "Acknowledgement"
    multiplicity: "OneToMany"
  - name: "exemptions"
    type: "ExemptionRequest"
    multiplicity: "OneToMany"
  - name: "accounts"
    type: "DataSourceAccount"
    multiplicity: "OneToMany"
  - name: "holds"
    type: "LegalHold"
    multiplicity: "ManyToMany"
- name: "HoldNotice"
  description: "Communication to custodians conveying obligations and requesting acknowledgement."
  data:
  - name: "noticeNumber"
    type: "String"
  - name: "messageSubject"
    type: "String"
  - name: "messageBodyTemplate"
    type: "String"
  - name: "channel"
    type: "CommunicationChannel"
  - name: "status"
    type: "NoticeStatus"
  - name: "sentDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "legalHold"
    type: "LegalHold"
    multiplicity: "ManyToOne"
  - name: "custodian"
    type: "Custodian"
    multiplicity: "ManyToOne"
  - name: "acknowledgements"
    type: "Acknowledgement"
    multiplicity: "OneToMany"
  - name: "reminders"
    type: "Reminder"
    multiplicity: "OneToMany"
  - name: "escalations"
    type: "Escalation"
    multiplicity: "OneToMany"
  - name: "communications"
    type: "CommunicationLog"
    multiplicity: "OneToMany"
- name: "Acknowledgement"
  description: "Record of a custodian confirming understanding and compliance with\
    \ a hold."
  data:
  - name: "status"
    type: "AcknowledgementStatus"
  - name: "method"
    type: "AcknowledgementMethod"
  - name: "date"
    type: "Date"
  - name: "signature"
    type: "Signature"
  relations:
  - name: "notice"
    type: "HoldNotice"
    multiplicity: "ManyToOne"
  - name: "custodian"
    type: "Custodian"
    multiplicity: "ManyToOne"
- name: "Reminder"
  description: "Automated follow-up schedule and attempts to secure custodian acknowledgement."
  data:
  - name: "scheduleName"
    type: "String"
  - name: "intervalDays"
    type: "Integer"
  - name: "maxAttempts"
    type: "Integer"
  - name: "status"
    type: "ReminderStatus"
  relations:
  - name: "legalHold"
    type: "LegalHold"
    multiplicity: "ManyToOne"
  - name: "notice"
    type: "HoldNotice"
    multiplicity: "ManyToOne"
  - name: "communications"
    type: "CommunicationLog"
    multiplicity: "OneToMany"
- name: "Escalation"
  description: "Action taken when a custodian is non-responsive or delivery issues\
    \ arise."
  data:
  - name: "escalatedDate"
    type: "Date"
  - name: "reason"
    type: "EscalationReason"
  - name: "status"
    type: "EscalationStatus"
  - name: "escalationRecipientEmail"
    type: "EmailAddress"
  relations:
  - name: "notice"
    type: "HoldNotice"
    multiplicity: "ManyToOne"
- name: "ExemptionRequest"
  description: "Request to exclude a custodian, account, or data source from hold\
    \ scope."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "reason"
    type: "String"
  - name: "requestedDate"
    type: "Date"
  - name: "decision"
    type: "ExemptionDecision"
  - name: "decisionDate"
    type: "Date"
  relations:
  - name: "legalHold"
    type: "LegalHold"
    multiplicity: "ManyToOne"
  - name: "custodian"
    type: "Custodian"
    multiplicity: "ManyToOne"
  - name: "dataSource"
    type: "DataSource"
    multiplicity: "ManyToOne"
- name: "Release"
  description: "Formal termination or modification of a legal hold with corresponding\
    \ notifications."
  data:
  - name: "releaseNumber"
    type: "String"
  - name: "releaseDate"
    type: "Date"
  - name: "reason"
    type: "String"
  - name: "noticeMessage"
    type: "String"
  relations:
  - name: "legalHold"
    type: "LegalHold"
    multiplicity: "ManyToOne"
- name: "CommunicationLog"
  description: "Trace of outbound and inbound communications related to holds and\
    \ notices."
  data:
  - name: "sentDate"
    type: "Date"
  - name: "channel"
    type: "CommunicationChannel"
  - name: "recipientEmail"
    type: "EmailAddress"
  - name: "subject"
    type: "String"
  - name: "bodyPreview"
    type: "String"
  - name: "status"
    type: "CommunicationStatus"
  - name: "messageId"
    type: "String"
  relations:
  - name: "legalHold"
    type: "LegalHold"
    multiplicity: "ManyToOne"
  - name: "notice"
    type: "HoldNotice"
    multiplicity: "ManyToOne"
- name: "CollectionRequest"
  description: "Directive to collect preserved content for counsel or review, aligned\
    \ to a matter."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "method"
    type: "CollectionMethod"
  - name: "requestedDate"
    type: "Date"
  - name: "status"
    type: "CollectionStatus"
  - name: "scopeDescription"
    type: "String"
  relations:
  - name: "matter"
    type: "LegalMatter"
    multiplicity: "ManyToOne"
  - name: "legalHold"
    type: "LegalHold"
    multiplicity: "ManyToOne"
  - name: "dataSources"
    type: "DataSource"
    multiplicity: "ManyToMany"
  - name: "exportPackages"
    type: "ExportPackage"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "ExportPackage"
  description: "Collected data bundle prepared for review or production."
  data:
  - name: "packageNumber"
    type: "String"
  - name: "format"
    type: "ExportFormat"
  - name: "createdDate"
    type: "Date"
  - name: "checksum"
    type: "FileChecksum"
  - name: "sizeMB"
    type: "Integer"
  - name: "storageLocation"
    type: "Uri"
  relations:
  - name: "collectionRequest"
    type: "CollectionRequest"
    multiplicity: "ManyToOne"
- name: "AuditEvent"
  description: "Immutable record of significant actions across matters, holds, and\
    \ collections."
  data:
  - name: "eventType"
    type: "AuditEventType"
  - name: "eventDate"
    type: "Date"
  - name: "actor"
    type: "String"
  - name: "details"
    type: "String"
  relations:
  - name: "matter"
    type: "LegalMatter"
    multiplicity: "ManyToOne"
  - name: "legalHold"
    type: "LegalHold"
    multiplicity: "ManyToOne"
  - name: "notice"
    type: "HoldNotice"
    multiplicity: "ManyToOne"
  - name: "collectionRequest"
    type: "CollectionRequest"
    multiplicity: "ManyToOne"
enums:
- name: "HoldStatus"
  description: "Lifecycle of a legal hold from initiation to termination."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "PartiallyAcknowledged"
  - name: "Suspended"
  - name: "Released"
  - name: "Closed"
- name: "NoticeStatus"
  description: "State of a hold notice from creation through custodian response."
  data:
  - name: "Pending"
  - name: "Sent"
  - name: "Bounced"
  - name: "Acknowledged"
  - name: "Overdue"
  - name: "Escalated"
  - name: "Withdrawn"
- name: "AcknowledgementStatus"
  description: "Confirmation state for custodian acknowledgement of obligations."
  data:
  - name: "Pending"
  - name: "Confirmed"
  - name: "Declined"
  - name: "Rescinded"
- name: "AcknowledgementMethod"
  description: "Method by which a custodian provided acknowledgement."
  data:
  - name: "EmailLink"
  - name: "Portal"
  - name: "Paper"
  - name: "Verbal"
- name: "EscalationReason"
  description: "Triggers for initiating an escalation workflow."
  data:
  - name: "NonResponsive"
  - name: "DeliveryFailure"
  - name: "ManagerRequested"
  - name: "RoleChange"
  - name: "EmploymentChange"
- name: "EscalationStatus"
  description: "Progress of an escalation action."
  data:
  - name: "Initiated"
  - name: "InProgress"
  - name: "Resolved"
  - name: "Closed"
- name: "DataSourceType"
  description: "Category of information system subject to preservation and collection."
  data:
  - name: "Email"
  - name: "FileShare"
  - name: "Collaboration"
  - name: "Endpoint"
  - name: "CloudStorage"
  - name: "Archive"
  - name: "Database"
  - name: "Backup"
- name: "PreservationActionType"
  description: "Technical mechanism applied to prevent alteration or deletion."
  data:
  - name: "InPlaceHold"
  - name: "RetentionLock"
  - name: "LitigationTag"
  - name: "MailboxHold"
  - name: "LegalHoldAPI"
- name: "PreservationStatus"
  description: "Outcome state for the application of a preservation rule."
  data:
  - name: "Pending"
  - name: "Applied"
  - name: "Failed"
  - name: "Removed"
- name: "CommunicationChannel"
  description: "Medium used to deliver hold-related communications."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "Portal"
  - name: "Letter"
  - name: "InPerson"
- name: "CommunicationStatus"
  description: "Delivery and engagement outcome for a communication."
  data:
  - name: "Queued"
  - name: "Sent"
  - name: "Delivered"
  - name: "Opened"
  - name: "Bounced"
  - name: "Failed"
- name: "MatterType"
  description: "Classification of the underlying legal or regulatory proceeding."
  data:
  - name: "Litigation"
  - name: "Investigation"
  - name: "RegulatoryInquiry"
  - name: "Arbitration"
  - name: "InternalReview"
- name: "MatterStatus"
  description: "Operational state of a legal matter."
  data:
  - name: "Open"
  - name: "OnHold"
  - name: "Stayed"
  - name: "Settled"
  - name: "Closed"
- name: "CounselRole"
  description: "Role of counsel participating in the matter."
  data:
  - name: "InternalCounsel"
  - name: "ExternalCounsel"
  - name: "Paralegal"
  - name: "eDiscoveryManager"
- name: "AccountStatus"
  description: "Availability of an account for preservation and collection."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Deprovisioned"
- name: "CollectionMethod"
  description: "Technique used to gather preserved content."
  data:
  - name: "TargetedExport"
  - name: "FullExport"
  - name: "APICollection"
  - name: "ForensicImage"
  - name: "OnDemandPull"
- name: "CollectionStatus"
  description: "Execution state of a collection request."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
  - name: "Failed"
  - name: "Cancelled"
- name: "AuditEventType"
  description: "Type of auditable action recorded by the system."
  data:
  - name: "Created"
  - name: "Updated"
  - name: "StatusChanged"
  - name: "NoticeSent"
  - name: "Acknowledged"
  - name: "ReminderSent"
  - name: "Escalated"
  - name: "PreservationApplied"
  - name: "CollectionRequested"
  - name: "ExportGenerated"
  - name: "Released"
  - name: "Exempted"
- name: "ExportFormat"
  description: "Packaging format for exported collections."
  data:
  - name: "PST"
  - name: "ZIP"
  - name: "EML"
  - name: "PDF"
  - name: "CSV"
  - name: "JSON"
- name: "CustodianStatus"
  description: "Employment or availability state of a custodian."
  data:
  - name: "Active"
  - name: "OnLeave"
  - name: "Separated"
- name: "ReminderStatus"
  description: "Activation state of a reminder schedule."
  data:
  - name: "Draft"
  - name: "Enabled"
  - name: "Paused"
  - name: "Completed"
- name: "ExemptionDecision"
  description: "Outcome of an exemption evaluation."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Denied"
  - name: "Withdrawn"
valueObjects:
- name: "PersonName"
  description: "Structured representation of a person’s name for consistent display\
    \ and search."
  data:
  - name: "givenName"
    type: "String"
  - name: "familyName"
    type: "String"
  - name: "displayName"
    type: "String"
- name: "EmailAddress"
  description: "Validated electronic mail address used for notifications and routing."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "Dialable number with optional extension for counsel and contacts."
  data:
  - name: "countryCode"
    type: "String"
  - name: "number"
    type: "String"
  - name: "extension"
    type: "String"
- name: "DateRange"
  description: "Inclusive start and end dates defining a time-bound scope."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "Uri"
  description: "Locator used to reference systems or storage locations."
  data:
  - name: "value"
    type: "String"
- name: "Signature"
  description: "Evidence of agreement captured during acknowledgement."
  data:
  - name: "signedByName"
    type: "String"
  - name: "signedDate"
    type: "Date"
  - name: "method"
    type: "AcknowledgementMethod"
- name: "FileChecksum"
  description: "Digest ensuring integrity of exported content."
  data:
  - name: "algorithm"
    type: "String"
  - name: "value"
    type: "String"
