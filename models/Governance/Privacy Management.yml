---
metadata:
  name: "HCIDL Privacy Management Capabilities Model"
  description: "Capabilities model for managing privacy governance, compliance, and\
    \ operations across the data lifecycle, including processing inventories, consents,\
    \ DPIAs, DSARs, cross-border transfers, and breach response."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Governance"
  type: "Capability"
  domain: "Privacy Management"
entities:
- name: "PrivacyProgram"
  description: "Governance construct that organizes the enterprise privacy framework,\
    \ oversight, and operational execution."
  data:
  - name: "name"
    type: "String"
  - name: "ownerDepartment"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "status"
    type: "ProgramStatus"
  relations:
  - name: "policies"
    type: "PrivacyPolicy"
    multiplicity: "OneToMany"
  - name: "notices"
    type: "PrivacyNotice"
    multiplicity: "OneToMany"
  - name: "processingActivities"
    type: "ProcessingActivity"
    multiplicity: "OneToMany"
  - name: "roles"
    type: "PrivacyRole"
    multiplicity: "OneToMany"
- name: "PrivacyPolicy"
  description: "Policy artifact defining privacy principles, standards, and expected\
    \ controls."
  data:
  - name: "title"
    type: "String"
  - name: "version"
    type: "String"
  - name: "policyType"
    type: "PolicyType"
  - name: "approvalDate"
    type: "Date"
  - name: "reviewCycleMonths"
    type: "Integer"
  relations:
  - name: "program"
    type: "PrivacyProgram"
    multiplicity: "ManyToOne"
  - name: "owners"
    type: "PrivacyRole"
    multiplicity: "ManyToMany"
  - name: "evidence"
    type: "EvidenceArtifact"
    multiplicity: "ManyToMany"
- name: "PrivacyNotice"
  description: "Public-facing or internal notice describing personal data practices\
    \ for a given audience and context."
  data:
  - name: "title"
    type: "String"
  - name: "language"
    type: "String"
  - name: "publicationUrl"
    type: "URL"
  - name: "lastUpdated"
    type: "Date"
  relations:
  - name: "program"
    type: "PrivacyProgram"
    multiplicity: "ManyToOne"
  - name: "jurisdictions"
    type: "Jurisdiction"
    multiplicity: "ManyToMany"
  - name: "processingActivities"
    type: "ProcessingActivity"
    multiplicity: "ManyToMany"
- name: "BusinessUnit"
  description: "Organizational unit accountable for privacy obligations within its\
    \ operations and systems."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "processingActivities"
    type: "ProcessingActivity"
    multiplicity: "OneToMany"
  - name: "dpas"
    type: "DataProcessingAgreement"
    multiplicity: "OneToMany"
  - name: "roles"
    type: "PrivacyRole"
    multiplicity: "OneToMany"
- name: "ProcessingActivity"
  description: "Discrete business process that collects, uses, stores, or discloses\
    \ personal data."
  data:
  - name: "name"
    type: "String"
  - name: "overview"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "dataLocationType"
    type: "DataLocationType"
  - name: "automatedDecisionMaking"
    type: "Boolean"
  relations:
  - name: "program"
    type: "PrivacyProgram"
    multiplicity: "ManyToOne"
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "purposes"
    type: "ProcessingPurpose"
    multiplicity: "ManyToMany"
  - name: "personalDataElements"
    type: "PersonalDataElement"
    multiplicity: "ManyToMany"
  - name: "categories"
    type: "PersonalDataCategory"
    multiplicity: "ManyToMany"
  - name: "recipients"
    type: "Recipient"
    multiplicity: "ManyToMany"
  - name: "legalBases"
    type: "LegalBasisRecord"
    multiplicity: "OneToMany"
  - name: "assessments"
    type: "DPIA"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
  - name: "inventories"
    type: "DataInventory"
    multiplicity: "ManyToMany"
  - name: "retentionRules"
    type: "RetentionRule"
    multiplicity: "ManyToMany"
  - name: "transfers"
    type: "CrossBorderTransfer"
    multiplicity: "OneToMany"
  - name: "dsarRequests"
    type: "DataSubjectRequest"
    multiplicity: "OneToMany"
  - name: "evidence"
    type: "EvidenceArtifact"
    multiplicity: "ManyToMany"
- name: "PersonalDataElement"
  description: "Specific type of personal data handled by the organization."
  data:
  - name: "name"
    type: "String"
  - name: "sensitivity"
    type: "DataSensitivity"
  - name: "storageFormat"
    type: "StorageFormat"
  - name: "collectedDirectly"
    type: "Boolean"
  - name: "includesChildren"
    type: "Boolean"
  relations:
  - name: "categories"
    type: "PersonalDataCategory"
    multiplicity: "ManyToMany"
  - name: "processingActivities"
    type: "ProcessingActivity"
    multiplicity: "ManyToMany"
  - name: "retentionRules"
    type: "RetentionRule"
    multiplicity: "ManyToMany"
  - name: "inventories"
    type: "DataInventory"
    multiplicity: "ManyToMany"
  - name: "breaches"
    type: "DataBreach"
    multiplicity: "ManyToMany"
- name: "PersonalDataCategory"
  description: "Taxonomic grouping of personal data elements used for governance and\
    \ reporting."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "elements"
    type: "PersonalDataElement"
    multiplicity: "ManyToMany"
- name: "ProcessingPurpose"
  description: "Declared reason for processing personal data."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "requiresDPIA"
    type: "Boolean"
  relations:
  - name: "processingActivities"
    type: "ProcessingActivity"
    multiplicity: "ManyToMany"
- name: "LegalBasisRecord"
  description: "Declares the lawful basis under which a processing activity operates,\
    \ with supporting details."
  data:
  - name: "basisType"
    type: "LegalBasisType"
  - name: "justification"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validUntil"
    type: "Date"
  - name: "legitimateInterestAssessmentCompleted"
    type: "Boolean"
  relations:
  - name: "processingActivity"
    type: "ProcessingActivity"
    multiplicity: "ManyToOne"
  - name: "evidence"
    type: "EvidenceArtifact"
    multiplicity: "ManyToMany"
- name: "EvidenceArtifact"
  description: "Reference to documentation or proof supporting privacy decisions and\
    \ controls."
  data:
  - name: "title"
    type: "String"
  - name: "artifactType"
    type: "ArtifactType"
  - name: "uri"
    type: "URL"
  - name: "capturedAt"
    type: "DateTime"
  - name: "description"
    type: "String"
  relations:
  - name: "owner"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "relatedProcessingActivities"
    type: "ProcessingActivity"
    multiplicity: "ManyToMany"
- name: "Recipient"
  description: "Party receiving personal data, internal or external, including processors\
    \ and controllers."
  data:
  - name: "name"
    type: "String"
  - name: "recipientType"
    type: "RecipientType"
  - name: "country"
    type: "CountryCode"
  - name: "contactEmail"
    type: "Email"
  - name: "securityCertification"
    type: "String"
  relations:
  - name: "processingActivities"
    type: "ProcessingActivity"
    multiplicity: "ManyToMany"
  - name: "contracts"
    type: "DataProcessingAgreement"
    multiplicity: "OneToMany"
- name: "DataProcessingAgreement"
  description: "Contractual agreement governing processing on behalf of the controller,\
    \ including safeguards and obligations."
  data:
  - name: "title"
    type: "String"
  - name: "dpaType"
    type: "DpaType"
  - name: "status"
    type: "AgreementStatus"
  - name: "effective"
    type: "Date"
  - name: "term"
    type: "DateRange"
  relations:
  - name: "processor"
    type: "Recipient"
    multiplicity: "ManyToOne"
  - name: "controller"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "transfers"
    type: "CrossBorderTransfer"
    multiplicity: "OneToMany"
  - name: "evidence"
    type: "EvidenceArtifact"
    multiplicity: "ManyToMany"
- name: "CrossBorderTransfer"
  description: "Movement of personal data to a third country or international organization\
    \ with applicable transfer mechanism."
  data:
  - name: "destination"
    type: "CountryCode"
  - name: "mechanism"
    type: "TransferMechanism"
  - name: "supplementaryMeasures"
    type: "String"
  relations:
  - name: "dpa"
    type: "DataProcessingAgreement"
    multiplicity: "ManyToOne"
  - name: "processingActivities"
    type: "ProcessingActivity"
    multiplicity: "ManyToMany"
- name: "DataSubject"
  description: "Identified or identifiable natural person whose personal data is processed."
  data:
  - name: "subjectType"
    type: "DataSubjectType"
  - name: "primaryEmail"
    type: "Email"
  - name: "preferredLanguage"
    type: "String"
  - name: "residencyCountry"
    type: "CountryCode"
  relations:
  - name: "identifiers"
    type: "DataSubjectIdentifier"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
  - name: "requests"
    type: "DataSubjectRequest"
    multiplicity: "OneToMany"
- name: "DataSubjectIdentifier"
  description: "Representation used to recognize or match a data subject across systems."
  data:
  - name: "identifierType"
    type: "IdentifierType"
  - name: "value"
    type: "String"
  - name: "isHashed"
    type: "Boolean"
  - name: "hashAlgorithm"
    type: "String"
  relations:
  - name: "dataSubject"
    type: "DataSubject"
    multiplicity: "ManyToOne"
- name: "ConsentRecord"
  description: "Evidence of consent or preference related to processing for specific\
    \ purposes."
  data:
  - name: "status"
    type: "ConsentStatus"
  - name: "consentedAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  - name: "source"
    type: "ChannelType"
  - name: "scope"
    type: "String"
  relations:
  - name: "dataSubject"
    type: "DataSubject"
    multiplicity: "ManyToOne"
  - name: "processingActivity"
    type: "ProcessingActivity"
    multiplicity: "ManyToOne"
  - name: "purposes"
    type: "ProcessingPurpose"
    multiplicity: "ManyToMany"
  - name: "evidence"
    type: "EvidenceArtifact"
    multiplicity: "ManyToMany"
- name: "DataSubjectRequest"
  description: "Request submitted by a data subject to exercise privacy rights."
  data:
  - name: "requestType"
    type: "RequestType"
  - name: "submissionDate"
    type: "Date"
  - name: "status"
    type: "RequestStatus"
  - name: "channel"
    type: "ChannelType"
  - name: "dueDate"
    type: "Date"
  - name: "verificationStatus"
    type: "VerificationStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "dataSubject"
    type: "DataSubject"
    multiplicity: "ManyToOne"
  - name: "processingActivity"
    type: "ProcessingActivity"
    multiplicity: "ManyToOne"
  - name: "outputs"
    type: "RequestOutput"
    multiplicity: "OneToMany"
  - name: "handler"
    type: "PrivacyRole"
    multiplicity: "ManyToOne"
  - name: "evidence"
    type: "EvidenceArtifact"
    multiplicity: "ManyToMany"
- name: "RequestOutput"
  description: "Deliverable produced in response to a data subject request."
  data:
  - name: "outputType"
    type: "OutputType"
  - name: "contentLocation"
    type: "URL"
  - name: "deliveredAt"
    type: "DateTime"
  - name: "redacted"
    type: "Boolean"
  relations:
  - name: "request"
    type: "DataSubjectRequest"
    multiplicity: "ManyToOne"
- name: "DPIA"
  description: "Data protection impact assessment evaluating privacy risks and mitigations\
    \ for a processing activity."
  data:
  - name: "title"
    type: "String"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "status"
    type: "AssessmentStatus"
  - name: "initiatedOn"
    type: "Date"
  - name: "completedOn"
    type: "Date"
  - name: "residualRisk"
    type: "RiskLevel"
  relations:
  - name: "processingActivity"
    type: "ProcessingActivity"
    multiplicity: "ManyToOne"
  - name: "reviewer"
    type: "PrivacyRole"
    multiplicity: "ManyToOne"
  - name: "mitigations"
    type: "MitigationAction"
    multiplicity: "OneToMany"
  - name: "evidence"
    type: "EvidenceArtifact"
    multiplicity: "ManyToMany"
- name: "MitigationAction"
  description: "Action planned or implemented to reduce identified privacy risk."
  data:
  - name: "action"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "ActionStatus"
  - name: "implemented"
    type: "Boolean"
  relations:
  - name: "dpia"
    type: "DPIA"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "PrivacyRole"
    multiplicity: "ManyToOne"
- name: "PrivacyRole"
  description: "Named role with assigned privacy responsibilities and workflow participation."
  data:
  - name: "name"
    type: "String"
  - name: "roleType"
    type: "RoleType"
  - name: "email"
    type: "Email"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "program"
    type: "PrivacyProgram"
    multiplicity: "ManyToOne"
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "responsibilities"
    type: "Responsibility"
    multiplicity: "OneToMany"
  - name: "assignedRequests"
    type: "DataSubjectRequest"
    multiplicity: "OneToMany"
  - name: "reviews"
    type: "DPIA"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "PrivacyPolicy"
    multiplicity: "ManyToMany"
- name: "Responsibility"
  description: "Specific duty or accountability assigned to a privacy role."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "role"
    type: "PrivacyRole"
    multiplicity: "ManyToOne"
- name: "DataInventory"
  description: "Register of systems or repositories that store or process personal\
    \ data."
  data:
  - name: "systemName"
    type: "String"
  - name: "description"
    type: "String"
  - name: "dataLocationType"
    type: "DataLocationType"
  - name: "ownerEmail"
    type: "Email"
  - name: "recordsCount"
    type: "Integer"
  relations:
  - name: "personalDataElements"
    type: "PersonalDataElement"
    multiplicity: "ManyToMany"
  - name: "processingActivities"
    type: "ProcessingActivity"
    multiplicity: "ManyToMany"
- name: "DataBreach"
  description: "Security incident leading to accidental or unlawful destruction, loss,\
    \ alteration, unauthorized disclosure of, or access to personal data."
  data:
  - name: "discoveredAt"
    type: "DateTime"
  - name: "severity"
    type: "BreachSeverity"
  - name: "description"
    type: "String"
  - name: "reportable"
    type: "Boolean"
  - name: "notificationDeadline"
    type: "DateTime"
  - name: "containmentDate"
    type: "Date"
  relations:
  - name: "affectedData"
    type: "PersonalDataElement"
    multiplicity: "ManyToMany"
  - name: "processingActivities"
    type: "ProcessingActivity"
    multiplicity: "ManyToMany"
  - name: "notifications"
    type: "BreachNotification"
    multiplicity: "OneToMany"
  - name: "cause"
    type: "IncidentCause"
    multiplicity: "ManyToOne"
  - name: "evidence"
    type: "EvidenceArtifact"
    multiplicity: "ManyToMany"
- name: "BreachNotification"
  description: "Communication sent to authorities or individuals regarding a data\
    \ breach."
  data:
  - name: "recipientType"
    type: "NotificationRecipientType"
  - name: "sentAt"
    type: "DateTime"
  - name: "method"
    type: "ChannelType"
  - name: "authorityName"
    type: "String"
  - name: "jurisdictionCode"
    type: "String"
  relations:
  - name: "breach"
    type: "DataBreach"
    multiplicity: "ManyToOne"
  - name: "jurisdiction"
    type: "Jurisdiction"
    multiplicity: "ManyToOne"
- name: "IncidentCause"
  description: "Root cause classification for a data breach incident."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "IncidentCauseCategory"
  - name: "description"
    type: "String"
  relations:
  - name: "breaches"
    type: "DataBreach"
    multiplicity: "OneToMany"
- name: "Jurisdiction"
  description: "Geographic or regulatory authority relevant to privacy compliance\
    \ and notifications."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "primaryRegulation"
    type: "String"
  relations:
  - name: "notifications"
    type: "BreachNotification"
    multiplicity: "OneToMany"
  - name: "privacyNotices"
    type: "PrivacyNotice"
    multiplicity: "ManyToMany"
- name: "RetentionRule"
  description: "Policy rule defining how long specific personal data must be retained\
    \ and the trigger for calculation."
  data:
  - name: "name"
    type: "String"
  - name: "retentionPeriod"
    type: "Duration"
  - name: "triggerEvent"
    type: "TriggerEvent"
  - name: "appliesToChildren"
    type: "Boolean"
  relations:
  - name: "processingActivities"
    type: "ProcessingActivity"
    multiplicity: "ManyToMany"
  - name: "personalDataElements"
    type: "PersonalDataElement"
    multiplicity: "ManyToMany"
enums:
- name: "ProgramStatus"
  description: "Lifecycle status for a privacy program."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Suspended"
  - name: "Retired"
- name: "PolicyType"
  description: "Classification of a privacy policy."
  data:
  - name: "Corporate"
  - name: "Product"
  - name: "Website"
  - name: "Supplier"
- name: "LegalBasisType"
  description: "Lawful bases for processing personal data."
  data:
  - name: "Consent"
  - name: "Contract"
  - name: "LegalObligation"
  - name: "VitalInterests"
  - name: "PublicTask"
  - name: "LegitimateInterests"
- name: "ConsentStatus"
  description: "Current state of a consent or preference record."
  data:
  - name: "Granted"
  - name: "Denied"
  - name: "Withdrawn"
  - name: "Expired"
  - name: "Pending"
- name: "DataSubjectType"
  description: "Relationship classification for a data subject."
  data:
  - name: "Customer"
  - name: "Employee"
  - name: "Prospect"
  - name: "Contractor"
  - name: "Partner"
  - name: "WebsiteVisitor"
- name: "IdentifierType"
  description: "Type of identifier used to recognize a data subject."
  data:
  - name: "Email"
  - name: "Phone"
  - name: "AccountNumber"
  - name: "CookieId"
  - name: "DeviceId"
  - name: "NationalId"
- name: "DataSensitivity"
  description: "Sensitivity classification for personal data elements."
  data:
  - name: "Low"
  - name: "Moderate"
  - name: "High"
  - name: "SpecialCategory"
- name: "StorageFormat"
  description: "Format in which personal data is stored."
  data:
  - name: "Structured"
  - name: "Unstructured"
  - name: "SemiStructured"
  - name: "Physical"
- name: "RecipientType"
  description: "Role of the recipient in the data disclosure context."
  data:
  - name: "Internal"
  - name: "Processor"
  - name: "SubProcessor"
  - name: "Controller"
  - name: "PublicAuthority"
- name: "DpaType"
  description: "Agreement structure between parties for processing."
  data:
  - name: "ControllerProcessor"
  - name: "JointControllers"
  - name: "ProcessorSubProcessor"
- name: "AgreementStatus"
  description: "Lifecycle status for a data processing agreement."
  data:
  - name: "Draft"
  - name: "Executed"
  - name: "Suspended"
  - name: "Terminated"
- name: "TransferMechanism"
  description: "Legal mechanism enabling cross-border data transfers."
  data:
  - name: "StandardContractualClauses"
  - name: "AdequacyDecision"
  - name: "BindingCorporateRules"
  - name: "Derogation"
  - name: "Certification"
  - name: "CodesOfConduct"
- name: "RiskLevel"
  description: "Ordinal scale for inherent or residual privacy risk."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "VeryHigh"
- name: "AssessmentStatus"
  description: "Workflow state for a privacy assessment."
  data:
  - name: "NotRequired"
  - name: "Planned"
  - name: "InProgress"
  - name: "Approved"
  - name: "Rejected"
- name: "ActionStatus"
  description: "Execution status for a mitigation action."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "Completed"
  - name: "Deferred"
  - name: "Cancelled"
- name: "RequestType"
  description: "Type of data subject rights request."
  data:
  - name: "Access"
  - name: "Rectification"
  - name: "Erasure"
  - name: "Restriction"
  - name: "Portability"
  - name: "Objection"
  - name: "AutomatedDecisionReview"
- name: "RequestStatus"
  description: "Processing status for a data subject request."
  data:
  - name: "Submitted"
  - name: "InReview"
  - name: "OnHold"
  - name: "Fulfilled"
  - name: "Rejected"
  - name: "Escalated"
- name: "ChannelType"
  description: "Channel used for intake or notification."
  data:
  - name: "WebPortal"
  - name: "Email"
  - name: "PostalMail"
  - name: "Phone"
  - name: "InPerson"
  - name: "API"
- name: "VerificationStatus"
  description: "State of identity verification for a request."
  data:
  - name: "NotStarted"
  - name: "Pending"
  - name: "Verified"
  - name: "Failed"
- name: "OutputType"
  description: "Kind of deliverable provided for a rights request."
  data:
  - name: "DataExport"
  - name: "Confirmation"
  - name: "Explanation"
  - name: "DeletionConfirmation"
- name: "BreachSeverity"
  description: "Impact level associated with a data breach."
  data:
  - name: "Minor"
  - name: "Moderate"
  - name: "Severe"
  - name: "Critical"
- name: "IncidentCauseCategory"
  description: "Taxonomy for root cause analysis of breaches."
  data:
  - name: "HumanError"
  - name: "MaliciousActor"
  - name: "SystemFailure"
  - name: "ThirdParty"
  - name: "ProcessGap"
  - name: "NaturalEvent"
- name: "NotificationRecipientType"
  description: "Party to whom a breach notification is sent."
  data:
  - name: "SupervisoryAuthority"
  - name: "DataSubject"
  - name: "Controller"
  - name: "Processor"
  - name: "Public"
- name: "DataLocationType"
  description: "Hosting posture for systems processing personal data."
  data:
  - name: "OnPremise"
  - name: "Cloud"
  - name: "Hybrid"
  - name: "ThirdCountry"
- name: "RoleType"
  description: "Designation of roles participating in the privacy program."
  data:
  - name: "DPO"
  - name: "PrivacyManager"
  - name: "SecurityOfficer"
  - name: "LegalCounsel"
