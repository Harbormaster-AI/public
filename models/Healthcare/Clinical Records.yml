---
metadata:
  name: "Clinical Records Capabilities Model"
  description: "Capabilities model capturing the structure and relationships of clinical\
    \ records within a healthcare delivery context."
  version: "1.0.0"
  industry: "Healthcare"
  category: "Healthcare"
  type: "Capability"
  domain: "Clinical Records"
entities:
- name: "Organization"
  description: "Healthcare delivery organization such as a hospital, clinic, or integrated\
    \ health system."
  data:
  - name: "name"
    type: "String"
  - name: "type"
    type: "OrganizationType"
  - name: "alias"
    type: "String"
  - name: "mainAddress"
    type: "Address"
  - name: "contact"
    type: "ContactPoint"
  relations:
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "practitioners"
    type: "Practitioner"
    multiplicity: "OneToMany"
  - name: "patients"
    type: "Patient"
    multiplicity: "OneToMany"
- name: "Location"
  description: "Physical site where clinical services are provided."
  data:
  - name: "name"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "type"
    type: "String"
  - name: "status"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "encounters"
    type: "Encounter"
    multiplicity: "OneToMany"
- name: "Practitioner"
  description: "Licensed clinical professional who delivers or supports patient care."
  data:
  - name: "name"
    type: "HumanName"
  - name: "role"
    type: "PractitionerRole"
  - name: "specialty"
    type: "Specialty"
  - name: "telecom"
    type: "ContactPoint"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "careTeams"
    type: "CareTeam"
    multiplicity: "ManyToMany"
  - name: "encounters"
    type: "Encounter"
    multiplicity: "OneToMany"
  - name: "authoredNotes"
    type: "ClinicalNote"
    multiplicity: "OneToMany"
  - name: "medicationRequests"
    type: "MedicationRequest"
    multiplicity: "OneToMany"
- name: "Patient"
  description: "Individual receiving healthcare services whose clinical information\
    \ is recorded and maintained."
  data:
  - name: "medicalRecordNumber"
    type: "String"
  - name: "name"
    type: "HumanName"
  - name: "birthDate"
    type: "Date"
  - name: "administrativeGender"
    type: "AdministrativeGender"
  - name: "maritalStatus"
    type: "MaritalStatus"
  - name: "address"
    type: "Address"
  - name: "telecom"
    type: "ContactPoint"
  - name: "preferredLanguage"
    type: "String"
  - name: "deceased"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "encounters"
    type: "Encounter"
    multiplicity: "OneToMany"
  - name: "episodesOfCare"
    type: "EpisodeOfCare"
    multiplicity: "OneToMany"
  - name: "conditions"
    type: "Condition"
    multiplicity: "OneToMany"
  - name: "allergies"
    type: "AllergyIntolerance"
    multiplicity: "OneToMany"
  - name: "medicationStatements"
    type: "MedicationStatement"
    multiplicity: "OneToMany"
  - name: "medicationRequests"
    type: "MedicationRequest"
    multiplicity: "OneToMany"
  - name: "immunizations"
    type: "Immunization"
    multiplicity: "OneToMany"
  - name: "procedures"
    type: "Procedure"
    multiplicity: "OneToMany"
  - name: "observations"
    type: "Observation"
    multiplicity: "OneToMany"
  - name: "diagnosticReports"
    type: "DiagnosticReport"
    multiplicity: "OneToMany"
  - name: "imagingStudies"
    type: "ImagingStudy"
    multiplicity: "OneToMany"
  - name: "clinicalNotes"
    type: "ClinicalNote"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "Consent"
    multiplicity: "OneToMany"
  - name: "advanceDirectives"
    type: "AdvanceDirective"
    multiplicity: "OneToMany"
  - name: "carePlans"
    type: "CarePlan"
    multiplicity: "OneToMany"
  - name: "goals"
    type: "Goal"
    multiplicity: "OneToMany"
  - name: "devices"
    type: "Device"
    multiplicity: "OneToMany"
  - name: "deviceUseStatements"
    type: "DeviceUseStatement"
    multiplicity: "OneToMany"
  - name: "familyHistories"
    type: "FamilyMemberHistory"
    multiplicity: "OneToMany"
  - name: "socialHistories"
    type: "SocialHistory"
    multiplicity: "OneToMany"
  - name: "careTeams"
    type: "CareTeam"
    multiplicity: "ManyToMany"
- name: "Encounter"
  description: "Interaction between a patient and the healthcare system for the purpose\
    \ of providing healthcare service."
  data:
  - name: "encounterNumber"
    type: "String"
  - name: "class"
    type: "EncounterClass"
  - name: "status"
    type: "EncounterStatus"
  - name: "period"
    type: "DateRange"
  - name: "reason"
    type: "Code"
  - name: "serviceType"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "practitioner"
    type: "Practitioner"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "episodeOfCare"
    type: "EpisodeOfCare"
    multiplicity: "ManyToOne"
  - name: "observations"
    type: "Observation"
    multiplicity: "OneToMany"
  - name: "procedures"
    type: "Procedure"
    multiplicity: "OneToMany"
  - name: "clinicalNotes"
    type: "ClinicalNote"
    multiplicity: "OneToMany"
  - name: "medicationRequests"
    type: "MedicationRequest"
    multiplicity: "OneToMany"
  - name: "diagnosticReports"
    type: "DiagnosticReport"
    multiplicity: "OneToMany"
  - name: "labResults"
    type: "LabResult"
    multiplicity: "OneToMany"
  - name: "immunizations"
    type: "Immunization"
    multiplicity: "OneToMany"
- name: "EpisodeOfCare"
  description: "Managed container representing a period of care for a specific condition\
    \ or set of conditions."
  data:
  - name: "careType"
    type: "String"
  - name: "status"
    type: "EpisodeStatus"
  - name: "period"
    type: "DateRange"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "encounters"
    type: "Encounter"
    multiplicity: "OneToMany"
  - name: "carePlans"
    type: "CarePlan"
    multiplicity: "OneToMany"
- name: "CareTeam"
  description: "Group of people and organizations who participate in the coordination\
    \ and delivery of care."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "CareTeamStatus"
  - name: "category"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "practitioners"
    type: "Practitioner"
    multiplicity: "ManyToMany"
  - name: "carePlan"
    type: "CarePlan"
    multiplicity: "ManyToOne"
- name: "Condition"
  description: "Clinical condition, problem, or diagnosis that is recorded for the\
    \ patient."
  data:
  - name: "code"
    type: "Code"
  - name: "clinicalStatus"
    type: "ConditionClinicalStatus"
  - name: "verificationStatus"
    type: "ConditionVerificationStatus"
  - name: "onsetDate"
    type: "Date"
  - name: "abatementDate"
    type: "Date"
  - name: "severity"
    type: "Severity"
  - name: "bodySite"
    type: "Code"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "encounters"
    type: "Encounter"
    multiplicity: "ManyToMany"
  - name: "carePlans"
    type: "CarePlan"
    multiplicity: "ManyToMany"
  - name: "goals"
    type: "Goal"
    multiplicity: "OneToMany"
- name: "AllergyIntolerance"
  description: "Record of a patient's allergy or intolerance and the associated clinical\
    \ risk."
  data:
  - name: "substance"
    type: "Code"
  - name: "category"
    type: "AllergyCategory"
  - name: "criticality"
    type: "AllergyCriticality"
  - name: "status"
    type: "AllergyStatus"
  - name: "reactionManifestation"
    type: "Code"
  - name: "onsetDate"
    type: "Date"
  - name: "note"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
- name: "MedicationDefinition"
  description: "Canonical description of a medication product or ingredient used in\
    \ prescribing and documentation."
  data:
  - name: "code"
    type: "Code"
  - name: "form"
    type: "String"
  - name: "isControlledSubstance"
    type: "Boolean"
  - name: "manufacturer"
    type: "String"
  relations:
  - name: "medicationRequests"
    type: "MedicationRequest"
    multiplicity: "OneToMany"
  - name: "medicationStatements"
    type: "MedicationStatement"
    multiplicity: "OneToMany"
- name: "MedicationStatement"
  description: "Assertion that a patient is taking, has taken, or will take a medication."
  data:
  - name: "status"
    type: "MedicationStatementStatus"
  - name: "effectivePeriod"
    type: "DateRange"
  - name: "adherence"
    type: "Boolean"
  - name: "dosageInstruction"
    type: "String"
  - name: "route"
    type: "MedicationRoute"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "medication"
    type: "MedicationDefinition"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
- name: "MedicationRequest"
  description: "Instruction to supply and/or administer a medication to a patient."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "status"
    type: "MedicationRequestStatus"
  - name: "intent"
    type: "MedicationRequestIntent"
  - name: "priority"
    type: "RequestPriority"
  - name: "authoredOn"
    type: "Date"
  - name: "dosageInstruction"
    type: "String"
  - name: "route"
    type: "MedicationRoute"
  - name: "dispenseQuantity"
    type: "Quantity"
  - name: "refillsAllowed"
    type: "Integer"
  - name: "substitutionAllowed"
    type: "Boolean"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "medication"
    type: "MedicationDefinition"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "authoredBy"
    type: "Practitioner"
    multiplicity: "ManyToOne"
- name: "Immunization"
  description: "Record of a vaccination event administered to a patient."
  data:
  - name: "vaccineCode"
    type: "Code"
  - name: "status"
    type: "ImmunizationStatus"
  - name: "occurrenceDate"
    type: "Date"
  - name: "lotNumber"
    type: "String"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "performedBy"
    type: "Practitioner"
    multiplicity: "ManyToOne"
- name: "Procedure"
  description: "Diagnostic or therapeutic activity performed on the patient."
  data:
  - name: "code"
    type: "Code"
  - name: "status"
    type: "ProcedureStatus"
  - name: "performed"
    type: "DateRange"
  - name: "reasonCode"
    type: "Code"
  - name: "outcome"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "performer"
    type: "Practitioner"
    multiplicity: "ManyToOne"
  - name: "relatedDevice"
    type: "Device"
    multiplicity: "OneToOne"
- name: "Observation"
  description: "Measurement, calculation, or assertion about a patient's health state\
    \ at a point in time."
  data:
  - name: "code"
    type: "Code"
  - name: "status"
    type: "ObservationStatus"
  - name: "effectiveDate"
    type: "Date"
  - name: "valueType"
    type: "ObservationValueType"
  - name: "valueString"
    type: "String"
  - name: "valueQuantity"
    type: "Quantity"
  - name: "interpretation"
    type: "Code"
  - name: "referenceRangeMin"
    type: "Quantity"
  - name: "referenceRangeMax"
    type: "Quantity"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "performer"
    type: "Practitioner"
    multiplicity: "ManyToOne"
  - name: "diagnosticReport"
    type: "DiagnosticReport"
    multiplicity: "ManyToOne"
- name: "DiagnosticReport"
  description: "Grouped clinical results and interpretations produced by diagnostic\
    \ services."
  data:
  - name: "reportType"
    type: "Code"
  - name: "status"
    type: "DiagnosticReportStatus"
  - name: "issued"
    type: "Date"
  - name: "conclusion"
    type: "String"
  - name: "presentedForm"
    type: "Attachment"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "observations"
    type: "Observation"
    multiplicity: "OneToMany"
  - name: "labResults"
    type: "LabResult"
    multiplicity: "OneToMany"
  - name: "imagingStudies"
    type: "ImagingStudy"
    multiplicity: "OneToMany"
- name: "LabResult"
  description: "Atomic laboratory test outcome linked to a patient and, where applicable,\
    \ an encounter."
  data:
  - name: "testCode"
    type: "Code"
  - name: "status"
    type: "ObservationStatus"
  - name: "effectiveDate"
    type: "Date"
  - name: "valueQuantity"
    type: "Quantity"
  - name: "valueString"
    type: "String"
  - name: "interpretation"
    type: "Code"
  - name: "referenceRangeMin"
    type: "Quantity"
  - name: "referenceRangeMax"
    type: "Quantity"
  - name: "specimenType"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "diagnosticReport"
    type: "DiagnosticReport"
    multiplicity: "ManyToOne"
- name: "ImagingStudy"
  description: "Set of images and associated data produced by an imaging procedure."
  data:
  - name: "accessionNumber"
    type: "String"
  - name: "modality"
    type: "ImagingModality"
  - name: "started"
    type: "Date"
  - name: "numberOfSeries"
    type: "Integer"
  - name: "numberOfInstances"
    type: "Integer"
  - name: "description"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "interpretingPractitioner"
    type: "Practitioner"
    multiplicity: "ManyToOne"
  - name: "diagnosticReport"
    type: "DiagnosticReport"
    multiplicity: "ManyToOne"
- name: "ClinicalNote"
  description: "Authored narrative documenting clinical reasoning, findings, and plans."
  data:
  - name: "noteType"
    type: "DocumentType"
  - name: "authoredOn"
    type: "Date"
  - name: "authorRole"
    type: "PractitionerRole"
  - name: "title"
    type: "String"
  - name: "content"
    type: "NarrativeText"
  - name: "confidentiality"
    type: "ConfidentialityLevel"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "Practitioner"
    multiplicity: "ManyToOne"
  - name: "attachments"
    type: "DocumentReference"
    multiplicity: "ManyToMany"
- name: "DocumentReference"
  description: "Metadata and content pointer to a clinical document or artifact stored\
    \ externally."
  data:
  - name: "docType"
    type: "DocumentType"
  - name: "created"
    type: "Date"
  - name: "description"
    type: "String"
  - name: "content"
    type: "Attachment"
  - name: "confidentiality"
    type: "ConfidentialityLevel"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "Practitioner"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "clinicalNotes"
    type: "ClinicalNote"
    multiplicity: "ManyToMany"
- name: "Consent"
  description: "Patient preferences authorizing or restricting access and use of health\
    \ information."
  data:
  - name: "scope"
    type: "ConsentScope"
  - name: "status"
    type: "ConsentStatus"
  - name: "dateSigned"
    type: "Date"
  - name: "signature"
    type: "Signature"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
- name: "AdvanceDirective"
  description: "Patient instructions regarding future care preferences and treatment\
    \ limitations."
  data:
  - name: "directiveType"
    type: "AdvanceDirectiveType"
  - name: "status"
    type: "AdvanceDirectiveStatus"
  - name: "createdOn"
    type: "Date"
  - name: "content"
    type: "Attachment"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
- name: "Goal"
  description: "Desired clinical outcome or target condition for a patient."
  data:
  - name: "description"
    type: "String"
  - name: "lifecycleStatus"
    type: "GoalLifecycleStatus"
  - name: "targetDate"
    type: "Date"
  - name: "priority"
    type: "GoalPriority"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "carePlan"
    type: "CarePlan"
    multiplicity: "ManyToOne"
  - name: "relatedConditions"
    type: "Condition"
    multiplicity: "ManyToMany"
- name: "CarePlan"
  description: "Plan that outlines proposed or ordered clinical activities for a patient."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "CarePlanStatus"
  - name: "period"
    type: "DateRange"
  - name: "intent"
    type: "CarePlanIntent"
  - name: "category"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "goals"
    type: "Goal"
    multiplicity: "OneToMany"
  - name: "conditions"
    type: "Condition"
    multiplicity: "ManyToMany"
  - name: "careTeam"
    type: "CareTeam"
    multiplicity: "OneToOne"
- name: "Device"
  description: "Medical device used for diagnosis, therapy, monitoring, or support\
    \ in patient care."
  data:
  - name: "deviceName"
    type: "String"
  - name: "type"
    type: "Code"
  - name: "model"
    type: "String"
  - name: "manufacturer"
    type: "String"
  - name: "lotNumber"
    type: "String"
  - name: "serialNumber"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "implantationProcedure"
    type: "Procedure"
    multiplicity: "ManyToOne"
- name: "DeviceUseStatement"
  description: "Documentation of a patient's use of a medical device."
  data:
  - name: "status"
    type: "DeviceUseStatus"
  - name: "timing"
    type: "DateRange"
  - name: "adherence"
    type: "Boolean"
  - name: "bodySite"
    type: "Code"
  - name: "notes"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "Device"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
- name: "FamilyMemberHistory"
  description: "Health conditions in relatives that establish patient risk factors\
    \ and hereditary patterns."
  data:
  - name: "relationship"
    type: "RelationshipType"
  - name: "conditionCode"
    type: "Code"
  - name: "onsetAge"
    type: "Integer"
  - name: "outcome"
    type: "String"
  - name: "note"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
- name: "SocialHistory"
  description: "Social and lifestyle factors relevant to clinical assessment and care\
    \ planning."
  data:
  - name: "smokingStatus"
    type: "SmokingStatus"
  - name: "alcoholUse"
    type: "AlcoholUse"
  - name: "occupation"
    type: "String"
  - name: "housingStatus"
    type: "HousingStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
enums:
- name: "OrganizationType"
  description: "Classification of healthcare delivery organizations by operational\
    \ focus."
  data:
  - name: "Hospital"
  - name: "Clinic"
  - name: "Laboratory"
  - name: "ImagingCenter"
  - name: "Pharmacy"
  - name: "HomeHealth"
  - name: "UrgentCare"
- name: "PractitionerRole"
  description: "Functional role of a clinician within the care team or organization."
  data:
  - name: "Physician"
  - name: "Nurse"
  - name: "Pharmacist"
  - name: "Therapist"
  - name: "Technician"
  - name: "Counselor"
  - name: "SocialWorker"
  - name: "Dentist"
  - name: "Midwife"
  - name: "PhysicianAssistant"
- name: "Specialty"
  description: "Area of clinical expertise practiced by a clinician."
  data:
  - name: "GeneralPractice"
  - name: "Cardiology"
  - name: "Oncology"
  - name: "Pediatrics"
  - name: "Neurology"
  - name: "Orthopedics"
  - name: "Psychiatry"
  - name: "Radiology"
  - name: "Anesthesiology"
  - name: "EmergencyMedicine"
- name: "AdministrativeGender"
  description: "Administrative sex or gender used in patient records."
  data:
  - name: "Female"
  - name: "Male"
  - name: "Other"
  - name: "Unknown"
- name: "MaritalStatus"
  description: "Legal marital status of the patient."
  data:
  - name: "Single"
  - name: "Married"
  - name: "Divorced"
  - name: "Widowed"
  - name: "Separated"
  - name: "DomesticPartner"
  - name: "Unknown"
- name: "EncounterClass"
  description: "High-level classification of the clinical setting of an encounter."
  data:
  - name: "Inpatient"
