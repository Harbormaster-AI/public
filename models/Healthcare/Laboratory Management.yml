---
metadata:
  name: "HCIDL Laboratory Management Capabilities Model"
  description: "Canonical capability model for end-to-end clinical laboratory operations,\
    \ covering test catalog, ordering, accessioning, specimen management, analytical\
    \ processing, quality control, reporting, and supply inventory."
  version: "1.0.0"
  industry: "Healthcare"
  category: "Healthcare"
  type: "Capability"
  domain: "Laboratory Management"
entities:
- name: "LaboratoryNetwork"
  description: "Corporate or regional organization governing one or more laboratories."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "accreditationStandard"
    type: "AccreditationStandard"
  - name: "website"
    type: "String"
  relations:
  - name: "laboratories"
    type: "Laboratory"
    multiplicity: "OneToMany"
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "ManyToMany"
- name: "Laboratory"
  description: "Licensed laboratory facility where clinical testing is performed."
  data:
  - name: "name"
    type: "String"
  - name: "licenseNumber"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "phone"
    type: "String"
  relations:
  - name: "network"
    type: "LaboratoryNetwork"
    multiplicity: "ManyToOne"
  - name: "departments"
    type: "LabDepartment"
    multiplicity: "OneToMany"
  - name: "staffMembers"
    type: "StaffMember"
    multiplicity: "OneToMany"
  - name: "instruments"
    type: "Instrument"
    multiplicity: "OneToMany"
  - name: "storageUnits"
    type: "StorageUnit"
    multiplicity: "OneToMany"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
- name: "LabDepartment"
  description: "Operational section within a laboratory focused on a specialty."
  data:
  - name: "name"
    type: "String"
  - name: "specialty"
    type: "LabSpecialty"
  relations:
  - name: "laboratory"
    type: "Laboratory"
    multiplicity: "ManyToOne"
  - name: "testCatalogItems"
    type: "TestCatalogItem"
    multiplicity: "OneToMany"
  - name: "worklists"
    type: "Worklist"
    multiplicity: "OneToMany"
  - name: "staffMembers"
    type: "StaffMember"
    multiplicity: "OneToMany"
- name: "StaffMember"
  description: "Laboratory personnel authorized to handle specimens, operate instruments,\
    \ and verify results."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "role"
    type: "StaffRole"
  - name: "email"
    type: "String"
  relations:
  - name: "laboratory"
    type: "Laboratory"
    multiplicity: "ManyToOne"
  - name: "department"
    type: "LabDepartment"
    multiplicity: "ManyToOne"
  - name: "competencies"
    type: "Competency"
    multiplicity: "ManyToMany"
  - name: "worklists"
    type: "Worklist"
    multiplicity: "ManyToMany"
- name: "Competency"
  description: "Documented capability or certification required for staff functions."
  data:
  - name: "name"
    type: "String"
  - name: "renewalInterval"
    type: "Duration"
  relations:
  - name: "staffMembers"
    type: "StaffMember"
    multiplicity: "ManyToMany"
  - name: "department"
    type: "LabDepartment"
    multiplicity: "ManyToOne"
- name: "Patient"
  description: "Individual for whom laboratory testing is performed."
  data:
  - name: "givenName"
    type: "String"
  - name: "familyName"
    type: "String"
  - name: "dateOfBirth"
    type: "Date"
  - name: "sex"
    type: "AdministrativeSex"
  - name: "address"
    type: "Address"
  relations:
  - name: "labRequests"
    type: "LabRequest"
    multiplicity: "OneToMany"
  - name: "specimens"
    type: "Specimen"
    multiplicity: "OneToMany"
  - name: "resultReports"
    type: "ResultReport"
    multiplicity: "OneToMany"
- name: "OrderingProvider"
  description: "Clinician or organization responsible for requesting laboratory tests."
  data:
  - name: "givenName"
    type: "String"
  - name: "familyName"
    type: "String"
  - name: "organization"
    type: "String"
  - name: "npi"
    type: "String"
  - name: "contactPhone"
    type: "String"
  relations:
  - name: "labRequests"
    type: "LabRequest"
    multiplicity: "OneToMany"
  - name: "resultReports"
    type: "ResultReport"
    multiplicity: "OneToMany"
- name: "LabRequest"
  description: "Requisition capturing ordered tests and clinical context."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "requestedDate"
    type: "Date"
  - name: "priority"
    type: "Priority"
  - name: "status"
    type: "RequisitionStatus"
  - name: "clinicalNotes"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "orderingProvider"
    type: "OrderingProvider"
    multiplicity: "ManyToOne"
  - name: "requestedTests"
    type: "RequestedTest"
    multiplicity: "OneToMany"
  - name: "specimens"
    type: "Specimen"
    multiplicity: "OneToMany"
  - name: "accession"
    type: "Accession"
    multiplicity: "OneToOne"
- name: "RequestedTest"
  description: "Specific catalog test requested on a requisition."
  data:
  - name: "notes"
    type: "String"
  relations:
  - name: "labRequest"
    type: "LabRequest"
    multiplicity: "ManyToOne"
  - name: "testCatalogItem"
    type: "TestCatalogItem"
    multiplicity: "ManyToOne"
- name: "Accession"
  description: "Operational grouping that controls specimens and test orders under\
    \ a unique accession number."
  data:
  - name: "accessionNumber"
    type: "String"
  - name: "receivedDateTime"
    type: "DateTime"
  - name: "status"
    type: "AccessionStatus"
  relations:
  - name: "labRequest"
    type: "LabRequest"
    multiplicity: "ManyToOne"
  - name: "specimens"
    type: "Specimen"
    multiplicity: "OneToMany"
  - name: "testOrders"
    type: "TestOrder"
    multiplicity: "OneToMany"
  - name: "laboratory"
    type: "Laboratory"
    multiplicity: "ManyToOne"
  - name: "report"
    type: "ResultReport"
    multiplicity: "OneToOne"
- name: "Specimen"
  description: "Biological material collected for testing."
  data:
  - name: "specimenNumber"
    type: "String"
  - name: "specimenType"
    type: "SpecimenType"
  - name: "collectionDateTime"
    type: "DateTime"
  - name: "collectionMethod"
    type: "CollectionMethod"
  - name: "container"
    type: "ContainerType"
  - name: "volume"
    type: "Decimal"
  - name: "volumeUnit"
    type: "UnitOfMeasure"
  - name: "conditionAtReceipt"
    type: "SpecimenCondition"
  - name: "storageTemperature"
    type: "TemperatureRange"
  relations:
  - name: "accession"
    type: "Accession"
    multiplicity: "ManyToOne"
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "collectedBy"
    type: "StaffMember"
    multiplicity: "ManyToOne"
  - name: "parentSpecimen"
    type: "Specimen"
    multiplicity: "ManyToOne"
  - name: "childSpecimens"
    type: "Specimen"
    multiplicity: "OneToMany"
  - name: "storageLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "testOrders"
    type: "TestOrder"
    multiplicity: "OneToMany"
- name: "StorageUnit"
  description: "Controlled environment equipment used to store specimens and supplies."
  data:
  - name: "name"
    type: "String"
  - name: "unitType"
    type: "StorageUnitType"
  - name: "temperatureSetPoint"
    type: "Decimal"
  - name: "temperatureUnit"
    type: "UnitOfMeasure"
  - name: "status"
    type: "StorageUnitStatus"
  relations:
  - name: "laboratory"
    type: "Laboratory"
    multiplicity: "ManyToOne"
  - name: "storageLocations"
    type: "StorageLocation"
    multiplicity: "OneToMany"
  - name: "maintenanceEvents"
    type: "MaintenanceEvent"
    multiplicity: "OneToMany"
- name: "StorageLocation"
  description: "Addressable position within a storage unit, such as a shelf, rack,\
    \ or slot."
  data:
  - name: "label"
    type: "String"
  - name: "capacity"
    type: "Integer"
  relations:
  - name: "storageUnit"
    type: "StorageUnit"
    multiplicity: "ManyToOne"
  - name: "specimens"
    type: "Specimen"
    multiplicity: "OneToMany"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
- name: "TestCatalogItem"
  description: "Defined test offering with requirements and turnaround expectations."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "specimenRequirements"
    type: "String"
  - name: "methodReference"
    type: "String"
  - name: "defaultTurnaround"
    type: "Duration"
  - name: "analyteCount"
    type: "Integer"
  relations:
  - name: "department"
    type: "LabDepartment"
    multiplicity: "ManyToOne"
  - name: "components"
    type: "AnalyteComponent"
    multiplicity: "OneToMany"
  - name: "methods"
    type: "TestMethod"
    multiplicity: "OneToMany"
- name: "TestMethod"
  description: "Analytical method definition applicable to a catalog test."
  data:
  - name: "name"
    type: "String"
  - name: "methodology"
    type: "Methodology"
  - name: "resultType"
    type: "ResultType"
  relations:
  - name: "catalogItem"
    type: "TestCatalogItem"
    multiplicity: "ManyToOne"
  - name: "primaryInstrument"
    type: "Instrument"
    multiplicity: "ManyToOne"
- name: "AnalyteComponent"
  description: "Reportable component or analyte included in a catalog test."
  data:
  - name: "name"
    type: "String"
  - name: "unit"
    type: "UnitOfMeasure"
  relations:
  - name: "catalogItem"
    type: "TestCatalogItem"
    multiplicity: "ManyToOne"
  - name: "referenceIntervals"
    type: "ReferenceInterval"
    multiplicity: "OneToMany"
- name: "ReferenceInterval"
  description: "Demographically qualified normal range for an analyte component."
  data:
  - name: "low"
    type: "Decimal"
  - name: "high"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
  - name: "applicableSex"
    type: "AdministrativeSex"
  - name: "minAge"
    type: "Duration"
  - name: "maxAge"
    type: "Duration"
  - name: "clinicalNote"
    type: "String"
  relations:
  - name: "analyteComponent"
    type: "AnalyteComponent"
    multiplicity: "ManyToOne"
  - name: "laboratory"
    type: "Laboratory"
    multiplicity: "ManyToOne"
- name: "TestOrder"
  description: "Executable order derived from a requested test, tied to a specific\
    \ specimen."
  data:
  - name: "status"
    type: "TestOrderStatus"
  - name: "priority"
    type: "Priority"
  - name: "orderedDateTime"
    type: "DateTime"
  - name: "dueDateTime"
    type: "DateTime"
  relations:
  - name: "accession"
    type: "Accession"
    multiplicity: "ManyToOne"
  - name: "requestedTest"
    type: "RequestedTest"
    multiplicity: "ManyToOne"
  - name: "specimen"
    type: "Specimen"
    multiplicity: "ManyToOne"
  - name: "method"
    type: "TestMethod"
    multiplicity: "ManyToOne"
  - name: "worklist"
    type: "Worklist"
    multiplicity: "ManyToOne"
  - name: "performingDepartment"
    type: "LabDepartment"
    multiplicity: "ManyToOne"
  - name: "results"
    type: "TestResult"
    multiplicity: "OneToMany"
  - name: "approvingStaff"
    type: "StaffMember"
    multiplicity: "ManyToOne"
- name: "Worklist"
  description: "Operational list of test orders scheduled for processing."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "WorklistStatus"
  - name: "scheduledStart"
    type: "DateTime"
  relations:
  - name: "department"
    type: "LabDepartment"
    multiplicity: "ManyToOne"
  - name: "instrument"
    type: "Instrument"
    multiplicity: "ManyToOne"
  - name: "testOrders"
    type: "TestOrder"
    multiplicity: "OneToMany"
  - name: "assignedStaff"
    type: "StaffMember"
    multiplicity: "ManyToMany"
- name: "Instrument"
  description: "Analytical device used in testing and sample processing."
  data:
  - name: "name"
    type: "String"
  - name: "serialNumber"
    type: "String"
  - name: "manufacturer"
    type: "String"
  - name: "model"
    type: "String"
  - name: "instrumentType"
    type: "InstrumentType"
  - name: "status"
    type: "InstrumentStatus"
  - name: "lastServiceDate"
    type: "Date"
  relations:
  - name: "laboratory"
    type: "Laboratory"
    multiplicity: "ManyToOne"
  - name: "instrumentRuns"
    type: "InstrumentRun"
    multiplicity: "OneToMany"
  - name: "maintenanceEvents"
    type: "MaintenanceEvent"
    multiplicity: "OneToMany"
  - name: "reagentsInUse"
    type: "ReagentLotUsage"
    multiplicity: "OneToMany"
- name: "InstrumentRun"
  description: "Executed batch or sequence on an instrument."
  data:
  - name: "runIdentifier"
    type: "String"
  - name: "startTime"
    type: "DateTime"
  - name: "endTime"
    type: "DateTime"
  - name: "status"
    type: "InstrumentRunStatus"
  relations:
  - name: "instrument"
    type: "Instrument"
    multiplicity: "ManyToOne"
  - name: "testOrders"
    type: "TestOrder"
    multiplicity: "OneToMany"
  - name: "controls"
    type: "ControlResult"
    multiplicity: "OneToMany"
  - name: "calibrations"
    type: "Calibration"
    multiplicity: "OneToMany"
  - name: "operator_"
    type: "StaffMember"
    multiplicity: "ManyToOne"
- name: "Calibration"
  description: "Calibration activity confirming instrument accuracy."
  data:
  - name: "calibrationDateTime"
    type: "DateTime"
  - name: "status"
    type: "CalibrationStatus"
  relations:
  - name: "instrumentRun"
    type: "InstrumentRun"
    multiplicity: "ManyToOne"
  - name: "instrument"
    type: "Instrument"
    multiplicity: "ManyToOne"
  - name: "performedBy"
    type: "StaffMember"
    multiplicity: "ManyToOne"
  - name: "reagents"
    type: "ReagentLot"
    multiplicity: "ManyToMany"
- name: "QualityControlMaterial"
  description: "Control material with known characteristics used to monitor analytical\
    \ performance."
  data:
  - name: "name"
    type: "String"
  - name: "level"
    type: "QCLevel"
  - name: "targetValue"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
  - name: "lotNumber"
    type: "String"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "laboratory"
    type: "Laboratory"
    multiplicity: "ManyToOne"
  - name: "controlResults"
    type: "ControlResult"
    multiplicity: "OneToMany"
- name: "ControlResult"
  description: "Measured value and evaluation of a quality control material."
  data:
  - name: "value"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
  - name: "evaluation"
    type: "QCResultEvaluation"
  - name: "measuredAt"
    type: "DateTime"
  relations:
  - name: "instrumentRun"
    type: "InstrumentRun"
    multiplicity: "ManyToOne"
  - name: "qualityControlMaterial"
    type: "QualityControlMaterial"
    multiplicity: "ManyToOne"
  - name: "testMethod"
    type: "TestMethod"
    multiplicity: "ManyToOne"
  - name: "reviewedBy"
    type: "StaffMember"
    multiplicity: "ManyToOne"
- name: "TestResult"
  description: "Resulted value or interpretation for an analyte associated with a\
    \ test order."
  data:
  - name: "analyteName"
    type: "String"
  - name: "value"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
  - name: "flag"
    type: "ResultFlag"
  - name: "referenceLow"
    type: "Decimal"
  - name: "referenceHigh"
    type: "Decimal"
  - name: "interpretation"
    type: "String"
  - name: "status"
    type: "ResultStatus"
  - name: "measuredAt"
    type: "DateTime"
  relations:
  - name: "testOrder"
    type: "TestOrder"
    multiplicity: "ManyToOne"
  - name: "instrumentRun"
    type: "InstrumentRun"
    multiplicity: "ManyToOne"
  - name: "method"
    type: "TestMethod"
    multiplicity: "ManyToOne"
  - name: "performedBy"
    type: "StaffMember"
    multiplicity: "ManyToOne"
  - name: "verifiedBy"
    type: "StaffMember"
    multiplicity: "ManyToOne"
- name: "Reagent"
  description: "Consumable chemical or material used during analytical processing."
  data:
  - name: "name"
    type: "String"
  - name: "reagentType"
    type: "ReagentType"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "reagentLots"
    type: "ReagentLot"
    multiplicity: "OneToMany"
- name: "ReagentLot"
  description: "Traceable lot of a reagent with storage and quality attributes."
  data:
  - name: "lotNumber"
    type: "String"
  - name: "expirationDate"
    type: "Date"
  - name: "storageRequirement"
    type: "TemperatureRange"
  - name: "availableQuantity"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
  - name: "status"
    type: "InventoryStatus"
  relations:
  - name: "reagent"
    type: "Reagent"
    multiplicity: "ManyToOne"
  - name: "laboratory"
    type: "Laboratory"
    multiplicity: "ManyToOne"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
  - name: "usages"
    type: "ReagentLotUsage"
    multiplicity: "OneToMany"
- name: "ReagentLotUsage"
  description: "Consumption record of a reagent lot during testing or maintenance."
  data:
  - name: "consumedQuantity"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
  - name: "usedAt"
    type: "DateTime"
  relations:
  - name: "reagentLot"
    type: "ReagentLot"
    multiplicity: "ManyToOne"
  - name: "instrument"
    type: "Instrument"
    multiplicity: "ManyToOne"
  - name: "instrumentRun"
    type: "InstrumentRun"
    multiplicity: "ManyToOne"
  - name: "testOrder"
    type: "TestOrder"
    multiplicity: "ManyToOne"
- name: "Supplier"
  description: "External vendor providing reagents, consumables, and control materials."
  data:
  - name: "name"
    type: "String"
  - name: "contactEmail"
    type: "String"
  - name: "contactPhone"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "reagents"
    type: "Reagent"
    multiplicity: "OneToMany"
  - name: "qcMaterials"
    type: "QualityControlMaterial"
    multiplicity: "OneToMany"
  - name: "purchaseOrders"
    type: "PurchaseOrder"
    multiplicity: "OneToMany"
- name: "InventoryItem"
  description: "On-hand stock tracking for a reagent lot at a specific location."
  data:
  - name: "quantityOnHand"
    type: "Integer"
  - name: "quantityReserved"
    type: "Integer"
  relations:
  - name: "reagentLot"
    type: "ReagentLot"
    multiplicity: "ManyToOne"
  - name: "storageLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "laboratory"
    type: "Laboratory"
    multiplicity: "ManyToOne"
- name: "PurchaseOrder"
  description: "Commercial order for laboratory supplies and reagents."
  data:
  - name: "poNumber"
    type: "String"
  - name: "orderDate"
    type: "Date"
  - name: "status"
    type: "PurchaseOrderStatus"
  - name: "totalAmount"
    type: "Decimal"
  - name: "currency"
    type: "String"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "laboratory"
    type: "Laboratory"
    multiplicity: "ManyToOne"
  - name: "lineItems"
    type: "PurchaseOrderLine"
    multiplicity: "OneToMany"
  - name: "receipts"
    type: "ShipmentReceipt"
    multiplicity: "OneToMany"
- name: "PurchaseOrderLine"
  description: "Line-level detail for items included on a purchase order."
  data:
  - name: "description"
    type: "String"
  - name: "orderedQuantity"
    type: "Integer"
  - name: "unitPrice"
    type: "Decimal"
  - name: "currency"
    type: "String"
  relations:
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "reagent"
    type: "Reagent"
    multiplicity: "ManyToOne"
- name: "ShipmentReceipt"
  description: "Receiving record documenting delivery of ordered items."
  data:
  - name: "receiptNumber"
    type: "String"
  - name: "receivedDate"
    type: "Date"
  - name: "conditionOnArrival"
    type: "ShipmentCondition"
  relations:
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "receivedBy"
    type: "StaffMember"
    multiplicity: "ManyToOne"
  - name: "reagentLots"
    type: "ReagentLot"
    multiplicity: "OneToMany"
- name: "ResultReport"
  description: "Consolidated clinical report delivered to the ordering provider."
  data:
  - name: "reportNumber"
    type: "String"
  - name: "generatedAt"
    type: "DateTime"
  - name: "deliveryStatus"
    type: "ReportDeliveryStatus"
  - name: "format"
    type: "ReportFormat"
  relations:
  - name: "accession"
    type: "Accession"
    multiplicity: "ManyToOne"
  - name: "testOrders"
    type: "TestOrder"
    multiplicity: "OneToMany"
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "orderingProvider"
    type: "OrderingProvider"
    multiplicity: "ManyToOne"
  - name: "approvedBy"
    type: "StaffMember"
    multiplicity: "ManyToOne"
- name: "ReportDelivery"
  description: "Evidence of transmission of a result report to a destination."
  data:
  - name: "channel"
    type: "DeliveryChannel"
  - name: "deliveredAt"
    type: "DateTime"
  - name: "destination"
    type: "String"
  - name: "status"
    type: "DeliveryStatus"
  relations:
  - name: "resultReport"
    type: "ResultReport"
    multiplicity: "ManyToOne"
- name: "SpecimenRejection"
  description: "Decision to reject a specimen with documented reason."
  data:
  - name: "reason"
    type: "SpecimenRejectionReason"
  - name: "rejectedAt"
    type: "DateTime"
  - name: "notes"
    type: "String"
  relations:
  - name: "specimen"
    type: "Specimen"
    multiplicity: "ManyToOne"
  - name: "recordedBy"
    type: "StaffMember"
    multiplicity: "ManyToOne"
- name: "MaintenanceEvent"
  description: "Service or maintenance activity on instruments or storage units."
  data:
  - name: "eventDate"
