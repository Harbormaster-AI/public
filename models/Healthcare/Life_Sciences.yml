---
metadata:
  name: "Life Sciences Industry Domain Model"
  description: "HCIDL model capturing core life sciences research, clinical trials,\
    \ manufacturing, laboratory, regulatory, and safety capabilities."
  version: "1.0.0"
  industry: "Life Sciences"
  category: "Healthcare"
  language: "English"
  type: "Industry"
  domain: "Life Sciences"
entities:
- name: "Sponsor"
  description: "Legal entity that funds and oversees research, development, and clinical\
    \ studies."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "studies"
    type: "Study"
    multiplicity: "OneToMany"
  - name: "manufacturingFacilities"
    type: "ManufacturingFacility"
    multiplicity: "OneToMany"
  - name: "researchSites"
    type: "ResearchSite"
    multiplicity: "ManyToMany"
  - name: "croPartners"
    type: "ContractResearchOrganization"
    multiplicity: "ManyToMany"
- name: "ContractResearchOrganization"
  description: "Service organization contracted to plan, manage, and monitor studies\
    \ on behalf of sponsors."
  data:
  - name: "name"
    type: "String"
  - name: "accreditation"
    type: "String"
  - name: "specialtyAreas"
    type: "String"
  relations:
  - name: "sponsors"
    type: "Sponsor"
    multiplicity: "ManyToMany"
  - name: "studies"
    type: "Study"
    multiplicity: "OneToMany"
  - name: "monitors"
    type: "ClinicalResearchAssociate"
    multiplicity: "OneToMany"
- name: "ResearchSite"
  description: "Clinical institution authorized to conduct study visits, collect data,\
    \ and dispense investigational products."
  data:
  - name: "name"
    type: "String"
  - name: "siteCode"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "ethicsBoard"
    type: "EthicsReviewBoard"
    multiplicity: "ManyToOne"
  - name: "investigators"
    type: "PrincipalInvestigator"
    multiplicity: "OneToMany"
  - name: "studies"
    type: "Study"
    multiplicity: "ManyToMany"
  - name: "patients"
    type: "Participant"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
- name: "PrincipalInvestigator"
  description: "Qualified physician or scientist responsible for the conduct of the\
    \ study at a research site."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "credentials"
    type: "String"
  - name: "medicalSpecialty"
    type: "String"
  - name: "licenseNumber"
    type: "String"
  relations:
  - name: "site"
    type: "ResearchSite"
    multiplicity: "ManyToOne"
  - name: "studies"
    type: "Study"
    multiplicity: "ManyToMany"
- name: "Study"
  description: "A scientific investigation with a defined protocol to evaluate safety,\
    \ efficacy, or outcomes."
  data:
  - name: "studyId"
    type: "String"
  - name: "title"
    type: "String"
  - name: "phase"
    type: "StudyPhase"
  - name: "studyType"
    type: "StudyType"
  - name: "blinding"
    type: "BlindingType"
  - name: "randomizationMethod"
    type: "RandomizationMethod"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "sponsor"
    type: "Sponsor"
    multiplicity: "ManyToOne"
  - name: "cro"
    type: "ContractResearchOrganization"
    multiplicity: "ManyToOne"
  - name: "protocol"
    type: "Protocol"
    multiplicity: "OneToOne"
  - name: "arms"
    type: "StudyArm"
    multiplicity: "OneToMany"
  - name: "sites"
    type: "ResearchSite"
    multiplicity: "ManyToMany"
  - name: "eligibilityCriteria"
    type: "EligibilityCriterion"
    multiplicity: "OneToMany"
  - name: "studyDrugs"
    type: "InvestigationalProduct"
    multiplicity: "OneToMany"
  - name: "enrollments"
    type: "Enrollment"
    multiplicity: "OneToMany"
  - name: "regulatorySubmissions"
    type: "RegulatorySubmission"
    multiplicity: "OneToMany"
  - name: "monitoringVisits"
    type: "MonitoringVisit"
    multiplicity: "OneToMany"
  - name: "deviations"
    type: "ProtocolDeviation"
    multiplicity: "OneToMany"
  - name: "ethicsApprovals"
    type: "EthicsApproval"
    multiplicity: "OneToMany"
  - name: "endpoints"
    type: "StudyEndpoint"
    multiplicity: "OneToMany"
  - name: "caseReportForms"
    type: "CaseReportForm"
    multiplicity: "OneToMany"
  - name: "proInstruments"
    type: "PatientReportedOutcomeInstrument"
    multiplicity: "OneToMany"
- name: "Protocol"
  description: "The authoritative document that defines the study design, procedures,\
    \ and endpoints."
  data:
  - name: "version"
    type: "String"
  - name: "documentNumber"
    type: "String"
  - name: "approvalDate"
    type: "Date"
  - name: "synopsis"
    type: "String"
  relations:
  - name: "study"
    type: "Study"
    multiplicity: "ManyToOne"
  - name: "scheduleOfActivities"
    type: "VisitSchedule"
    multiplicity: "OneToOne"
  - name: "endpoints"
    type: "StudyEndpoint"
    multiplicity: "OneToMany"
  - name: "ethicsApprovals"
    type: "EthicsApproval"
    multiplicity: "OneToMany"
- name: "StudyArm"
  description: "A planned pathway in a study that specifies a regimen or intervention\
    \ assignment."
  data:
  - name: "name"
    type: "String"
  - name: "armType"
    type: "ArmType"
  - name: "targetEnrollment"
    type: "Integer"
  relations:
  - name: "study"
    type: "Study"
    multiplicity: "ManyToOne"
  - name: "cohorts"
    type: "Cohort"
    multiplicity: "OneToMany"
  - name: "dosingRegimens"
    type: "DosingRegimen"
    multiplicity: "OneToMany"
- name: "Cohort"
  description: "Group of participants within an arm treated or observed under the\
    \ same conditions."
  data:
  - name: "name"
    type: "String"
  - name: "sequenceNumber"
    type: "Integer"
  relations:
  - name: "arm"
    type: "StudyArm"
    multiplicity: "ManyToOne"
  - name: "participants"
    type: "Participant"
    multiplicity: "OneToMany"
- name: "DosingRegimen"
  description: "The specific plan for administering an investigational product."
  data:
  - name: "dose"
    type: "Dose"
  - name: "route"
    type: "RouteOfAdministration"
  - name: "dosageForm"
    type: "DosageForm"
  - name: "frequency"
    type: "String"
  - name: "duration"
    type: "DateRange"
  relations:
  - name: "arm"
    type: "StudyArm"
    multiplicity: "ManyToOne"
  - name: "investigationalProduct"
    type: "InvestigationalProduct"
    multiplicity: "ManyToOne"
- name: "EligibilityCriterion"
  description: "An inclusion or exclusion rule determining participant eligibility."
  data:
  - name: "criterionType"
    type: "EligibilityCriterionType"
  - name: "description"
    type: "String"
  relations:
  - name: "study"
    type: "Study"
    multiplicity: "ManyToOne"
- name: "Participant"
  description: "A human subject who is screened, enrolled, or treated in the study."
  data:
  - name: "subjectId"
    type: "String"
  - name: "sex"
    type: "Sex"
  - name: "dateOfBirth"
    type: "Date"
  - name: "weightKg"
    type: "Decimal"
  - name: "heightCm"
    type: "Decimal"
  relations:
  - name: "site"
    type: "ResearchSite"
    multiplicity: "ManyToOne"
  - name: "cohort"
    type: "Cohort"
    multiplicity: "ManyToOne"
  - name: "enrollments"
    type: "Enrollment"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "InformedConsent"
    multiplicity: "OneToMany"
  - name: "visits"
    type: "Visit"
    multiplicity: "OneToMany"
  - name: "adverseEvents"
    type: "AdverseEvent"
    multiplicity: "OneToMany"
  - name: "labResults"
    type: "LabResult"
    multiplicity: "OneToMany"
  - name: "specimens"
    type: "Specimen"
    multiplicity: "OneToMany"
  - name: "proAssessments"
    type: "PROAssessment"
    multiplicity: "OneToMany"
- name: "Enrollment"
  description: "Record of a participant’s screening, randomization, and ongoing participation\
    \ status."
  data:
  - name: "enrollmentDate"
    type: "Date"
  - name: "status"
    type: "EnrollmentStatus"
  relations:
  - name: "participant"
    type: "Participant"
    multiplicity: "ManyToOne"
  - name: "study"
    type: "Study"
    multiplicity: "ManyToOne"
  - name: "assignedArm"
    type: "StudyArm"
    multiplicity: "ManyToOne"
  - name: "randomization"
    type: "Randomization"
    multiplicity: "OneToOne"
- name: "Randomization"
  description: "Assignment of a participant to a treatment arm according to a predefined\
    \ method."
  data:
  - name: "code"
    type: "String"
  - name: "date"
    type: "Date"
  relations:
  - name: "enrollment"
    type: "Enrollment"
    multiplicity: "OneToOne"
- name: "InformedConsent"
  description: "Documentation of participant consent to take part in study procedures."
  data:
  - name: "consentVersion"
    type: "String"
  - name: "consentDate"
    type: "Date"
  - name: "status"
    type: "ConsentStatus"
  relations:
  - name: "participant"
    type: "Participant"
    multiplicity: "ManyToOne"
  - name: "irb"
    type: "EthicsReviewBoard"
    multiplicity: "ManyToOne"
  - name: "study"
    type: "Study"
    multiplicity: "ManyToOne"
- name: "VisitSchedule"
  description: "Structured plan of visit windows and required procedures across the\
    \ study timeline."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "protocol"
    type: "Protocol"
    multiplicity: "ManyToOne"
  - name: "visitTemplates"
    type: "VisitTemplate"
    multiplicity: "OneToMany"
- name: "VisitTemplate"
  description: "A planned visit window template defining timing and required procedures."
  data:
  - name: "name"
    type: "String"
  - name: "windowBeforeDays"
    type: "Integer"
  - name: "windowAfterDays"
    type: "Integer"
  relations:
  - name: "schedule"
    type: "VisitSchedule"
    multiplicity: "ManyToOne"
  - name: "procedures"
    type: "ProcedureTemplate"
    multiplicity: "ManyToMany"
- name: "Visit"
  description: "An actual participant visit where study activities are performed and\
    \ data are captured."
  data:
  - name: "visitDate"
    type: "Date"
  - name: "status"
    type: "VisitStatus"
  - name: "visitName"
    type: "String"
  relations:
  - name: "participant"
    type: "Participant"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "ResearchSite"
    multiplicity: "ManyToOne"
  - name: "performedProcedures"
    type: "PerformedProcedure"
    multiplicity: "OneToMany"
  - name: "dispenses"
    type: "DrugDispense"
    multiplicity: "OneToMany"
  - name: "samples"
    type: "Specimen"
    multiplicity: "OneToMany"
  - name: "proAssessments"
    type: "PROAssessment"
    multiplicity: "OneToMany"
- name: "ProcedureTemplate"
  description: "Template describing a planned procedure or assessment in the study."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "ProcedureCategory"
  - name: "instructions"
    type: "String"
  relations:
  - name: "labTests"
    type: "LabTestDefinition"
    multiplicity: "OneToMany"
- name: "PerformedProcedure"
  description: "Execution record of a planned procedure during a visit."
  data:
  - name: "status"
    type: "ProcedureStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "visit"
    type: "Visit"
    multiplicity: "ManyToOne"
  - name: "template"
    type: "ProcedureTemplate"
    multiplicity: "ManyToOne"
- name: "LabTestDefinition"
  description: "Definition of a clinical laboratory test including specimen and analytical\
    \ method."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "specimenType"
    type: "SpecimenType"
  - name: "method"
    type: "TestMethod"
  - name: "units"
    type: "String"
  - name: "referenceRange"
    type: "String"
  relations:
  - name: "procedureTemplate"
    type: "ProcedureTemplate"
    multiplicity: "ManyToOne"
- name: "LabResult"
  description: "Quantitative or qualitative outcome of a performed laboratory test."
  data:
  - name: "resultValue"
    type: "Decimal"
  - name: "units"
    type: "String"
  - name: "status"
    type: "LabResultStatus"
  - name: "collectedDate"
    type: "Date"
  - name: "reportedDate"
    type: "Date"
  relations:
  - name: "labTest"
    type: "LabTestDefinition"
    multiplicity: "ManyToOne"
  - name: "participant"
    type: "Participant"
    multiplicity: "ManyToOne"
  - name: "specimen"
    type: "Specimen"
    multiplicity: "ManyToOne"
  - name: "lab"
    type: "Laboratory"
    multiplicity: "ManyToOne"
- name: "Laboratory"
  description: "Certified laboratory performing analyses of study specimens."
  data:
  - name: "name"
    type: "String"
  - name: "cliaNumber"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "results"
    type: "LabResult"
    multiplicity: "OneToMany"
  - name: "specimens"
    type: "Specimen"
    multiplicity: "OneToMany"
- name: "Specimen"
  description: "Biological sample collected from a participant for analysis or storage."
  data:
  - name: "specimenId"
    type: "String"
  - name: "specimenType"
    type: "SpecimenType"
  - name: "collectionDate"
    type: "Date"
  - name: "volume"
    type: "Decimal"
  - name: "volumeUnit"
    type: "String"
  - name: "storageCondition"
    type: "StorageCondition"
  relations:
  - name: "participant"
    type: "Participant"
    multiplicity: "ManyToOne"
  - name: "visit"
    type: "Visit"
    multiplicity: "ManyToOne"
  - name: "lab"
    type: "Laboratory"
    multiplicity: "ManyToOne"
  - name: "container"
    type: "Container"
    multiplicity: "ManyToOne"
  - name: "aliquots"
    type: "SpecimenAliquot"
    multiplicity: "OneToMany"
- name: "Container"
  description: "Physical vessel used to hold, transport, or store specimens."
  data:
  - name: "containerId"
    type: "String"
  - name: "containerType"
    type: "ContainerType"
  - name: "storageTemperature"
    type: "Temperature"
  relations:
  - name: "specimens"
    type: "Specimen"
    multiplicity: "OneToMany"
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
- name: "SpecimenAliquot"
  description: "Subdivision of a parent specimen prepared for analysis or long-term\
    \ storage."
  data:
  - name: "aliquotId"
    type: "String"
  - name: "volume"
    type: "Decimal"
  - name: "volumeUnit"
    type: "String"
  - name: "storageCondition"
    type: "StorageCondition"
  relations:
  - name: "parentSpecimen"
    type: "Specimen"
    multiplicity: "ManyToOne"
  - name: "biobank"
    type: "Biobank"
    multiplicity: "ManyToOne"
- name: "Biobank"
  description: "Facility dedicated to preserving biological materials for research\
    \ under controlled conditions."
  data:
  - name: "name"
    type: "String"
  - name: "location"
    type: "Address"
  relations:
  - name: "aliquots"
    type: "SpecimenAliquot"
    multiplicity: "OneToMany"
- name: "InvestigationalProduct"
  description: "Pharmaceutical product under study, including placebos and comparators."
  data:
  - name: "productCode"
    type: "String"
  - name: "name"
    type: "String"
  - name: "dosageForm"
    type: "DosageForm"
  - name: "strength"
    type: "String"
  - name: "asPlacebo"
    type: "Boolean"
  relations:
  - name: "study"
    type: "Study"
    multiplicity: "ManyToOne"
  - name: "batches"
    type: "Batch"
    multiplicity: "OneToMany"
  - name: "regimens"
    type: "DosingRegimen"
    multiplicity: "OneToMany"
- name: "Batch"
  description: "A manufactured lot of investigational product with a shared production\
    \ history."
  data:
  - name: "lotNumber"
    type: "String"
  - name: "manufactureDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "status"
    type: "ManufacturingStage"
  relations:
  - name: "product"
    type: "InvestigationalProduct"
    multiplicity: "ManyToOne"
  - name: "qcTests"
    type: "QualityControlTest"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
- name: "QualityControlTest"
  description: "Quality assessment performed on a manufactured batch."
  data:
  - name: "testName"
    type: "String"
  - name: "result"
    type: "QCResult"
  - name: "testDate"
    type: "Date"
  relations:
  - name: "batch"
    type: "Batch"
    multiplicity: "ManyToOne"
- name: "ManufacturingFacility"
  description: "GMP-compliant facility where investigational products are produced\
    \ and packaged."
  data:
  - name: "name"
    type: "String"
  - name: "facilityCode"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "gmpCertified"
    type: "Boolean"
  relations:
  - name: "sponsor"
    type: "Sponsor"
    multiplicity: "ManyToOne"
  - name: "products"
    type: "InvestigationalProduct"
    multiplicity: "OneToMany"
  - name: "batches"
    type: "Batch"
    multiplicity: "OneToMany"
- name: "Depot"
  description: "Regional storage and distribution center supporting investigational\
    \ product logistics."
  data:
  - name: "name"
    type: "String"
  - name: "location"
    type: "Address"
  relations:
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
- name: "Shipment"
  description: "Transfer of investigational products or specimens between facilities\
    \ or sites."
  data:
  - name: "shipmentNumber"
    type: "String"
  - name: "shippedDate"
    type: "Date"
  - name: "receivedDate"
    type: "Date"
  - name: "status"
    type: "ShipmentStatus"
  relations:
  - name: "fromDepot"
    type: "Depot"
    multiplicity: "ManyToOne"
  - name: "toSite"
    type: "ResearchSite"
    multiplicity: "ManyToOne"
  - name: "containers"
    type: "Container"
    multiplicity: "OneToMany"
  - name: "batches"
    type: "Batch"
    multiplicity: "ManyToMany"
- name: "InventoryItem"
  description: "Stock-keeping record of investigational products at a depot or site."
  data:
  - name: "quantityOnHand"
    type: "Integer"
  - name: "quantityReserved"
    type: "Integer"
  relations:
  - name: "product"
    type: "InvestigationalProduct"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "ResearchSite"
    multiplicity: "ManyToOne"
  - name: "depot"
    type: "Depot"
    multiplicity: "ManyToOne"
- name: "DrugDispense"
  description: "Issuance of investigational product to a participant as part of a\
    \ visit."
  data:
  - name: "dispenseDate"
    type: "Date"
  - name: "quantity"
    type: "Integer"
  - name: "status"
    type: "IPDispenseStatus"
  relations:
  - name: "visit"
    type: "Visit"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "InvestigationalProduct"
    multiplicity: "ManyToOne"
  - name: "batch"
    type: "Batch"
    multiplicity: "ManyToOne"
  - name: "participant"
    type: "Participant"
    multiplicity: "ManyToOne"
- name: "AdverseEvent"
  description: "Any untoward medical occurrence in a participant administered a medicinal\
    \ product."
  data:
  - name: "eventTerm"
    type: "String"
  - name: "onsetDate"
    type: "Date"
  - name: "severity"
    type: "AdverseEventSeverity"
  - name: "seriousness"
    type: "SeriousnessType"
  - name: "outcome"
    type: "AdverseEventOutcome"
  - name: "relatedToStudyDrug"
    type: "CausalityAssessment"
  relations:
  - name: "participant"
    type: "Participant"
    multiplicity: "ManyToOne"
  - name: "study"
    type: "Study"
    multiplicity: "ManyToOne"
  - name: "suspectProduct"
    type: "InvestigationalProduct"
    multiplicity: "ManyToOne"
- name: "ProtocolDeviation"
  description: "Departure from the approved protocol, GCP, or applicable regulations."
  data:
  - name: "description"
    type: "String"
  - name: "deviationDate"
    type: "Date"
  - name: "severity"
    type: "DeviationSeverity"
  - name: "status"
    type: "DeviationStatus"
  relations:
  - name: "study"
    type: "Study"
    multiplicity: "ManyToOne"
  - name: "participant"
    type: "Participant"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "ResearchSite"
    multiplicity: "ManyToOne"
- name: "CaseReportForm"
  description: "Structured instrument used to capture protocol-defined clinical data."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  relations:
  - name: "study"
    type: "Study"
    multiplicity: "ManyToOne"
  - name: "pages"
    type: "CRFPage"
    multiplicity: "OneToMany"
- name: "CRFPage"
  description: "Logical page within a case report form."
  data:
  - name: "pageNumber"
    type: "Integer"
  - name: "title"
    type: "String"
  relations:
  - name: "form"
    type: "CaseReportForm"
    multiplicity: "ManyToOne"
  - name: "dataPoints"
    type: "DataPoint"
    multiplicity: "OneToMany"
- name: "DataPoint"
  description: "Atomic clinical datum captured on a CRF page."
  data:
  - name: "itemName"
    type: "String"
  - name: "value"
    type: "String"
  - name: "dataType"
    type: "CRFDataType"
  - name: "status"
    type: "DataPointStatus"
  relations:
  - name: "page"
    type: "CRFPage"
    multiplicity: "ManyToOne"
  - name: "queries"
    type: "DataQuery"
    multiplicity: "OneToMany"
- name: "DataQuery"
  description: "Clarification request raised on a data point during review or monitoring."
  data:
  - name: "queryText"
    type: "String"
  - name: "status"
    type: "QueryStatus"
  - name: "createdDate"
    type: "Date"
  - name: "resolvedDate"
    type: "Date"
