---
metadata:
  name: "Scheduling"
  description: "Core healthcare scheduling capability model covering appointments,\
    \ availability, waitlisting, reminders, and booking governance for patients, providers,\
    \ locations, and equipment."
  version: "1.0.0"
  industry: "Healthcare"
  category: "Workflow & Process"
  type: "Capability"
  domain: "Scheduling"
entities:
- name: "HealthcareFacility"
  description: "Physical or virtual healthcare organization where services are delivered\
    \ and schedules are managed."
  data:
  - name: "name"
    type: "String"
  - name: "facilityType"
    type: "FacilityType"
  - name: "timeZone"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "serviceUnits"
    type: "ServiceUnit"
    multiplicity: "OneToMany"
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "calendars"
    type: "Calendar"
    multiplicity: "OneToMany"
- name: "ServiceUnit"
  description: "Operational department or clinic line that offers services and owns\
    \ booking policies and appointment types."
  data:
  - name: "name"
    type: "String"
  - name: "specialty"
    type: "ClinicalSpecialty"
  relations:
  - name: "facility"
    type: "HealthcareFacility"
    multiplicity: "ManyToOne"
  - name: "providers"
    type: "Provider"
    multiplicity: "OneToMany"
  - name: "appointmentTypes"
    type: "AppointmentType"
    multiplicity: "OneToMany"
  - name: "calendar"
    type: "Calendar"
    multiplicity: "OneToOne"
  - name: "bookingPolicies"
    type: "BookingPolicy"
    multiplicity: "OneToMany"
- name: "Provider"
  description: "Clinician or care professional whose time can be scheduled for patient\
    \ care."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "providerType"
    type: "ProviderType"
  - name: "specialty"
    type: "ClinicalSpecialty"
  - name: "credentials"
    type: "String"
  - name: "contactInfo"
    type: "ContactInfo"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "serviceUnit"
    type: "ServiceUnit"
    multiplicity: "ManyToOne"
  - name: "calendar"
    type: "Calendar"
    multiplicity: "OneToOne"
  - name: "availabilities"
    type: "RecurringAvailability"
    multiplicity: "OneToMany"
  - name: "blackoutPeriods"
    type: "BlackoutPeriod"
    multiplicity: "OneToMany"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
- name: "Patient"
  description: "Individual receiving care who can request, book, and attend appointments."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "dateOfBirth"
    type: "Date"
  - name: "address"
    type: "Address"
  - name: "contactInfo"
    type: "ContactInfo"
  - name: "preferredReminderChannel"
    type: "ReminderChannel"
  - name: "preferredLanguage"
    type: "String"
  relations:
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
  - name: "appointmentRequests"
    type: "AppointmentRequest"
    multiplicity: "OneToMany"
  - name: "waitlistEntries"
    type: "WaitlistEntry"
    multiplicity: "OneToMany"
  - name: "reminders"
    type: "Reminder"
    multiplicity: "OneToMany"
- name: "AppointmentType"
  description: "Definition of a schedulable service including duration, mode, and\
    \ resource requirements."
  data:
  - name: "name"
    type: "String"
  - name: "defaultDurationMinutes"
    type: "Integer"
  - name: "visitMode"
    type: "VisitMode"
  - name: "requiresLocation"
    type: "Boolean"
  - name: "requiresEquipment"
    type: "Boolean"
  - name: "bufferMinutesBefore"
    type: "Integer"
  - name: "bufferMinutesAfter"
    type: "Integer"
  relations:
  - name: "serviceUnit"
    type: "ServiceUnit"
    multiplicity: "ManyToOne"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
- name: "Location"
  description: "Bookable place such as an exam or procedure room."
  data:
  - name: "name"
    type: "String"
  - name: "locationType"
    type: "LocationType"
  - name: "capacity"
    type: "Integer"
  - name: "floor"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "facility"
    type: "HealthcareFacility"
    multiplicity: "ManyToOne"
  - name: "calendar"
    type: "Calendar"
    multiplicity: "OneToOne"
  - name: "equipment"
    type: "Equipment"
    multiplicity: "ManyToMany"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
- name: "Equipment"
  description: "Clinical device or asset that must be available for certain appointments."
  data:
  - name: "name"
    type: "String"
  - name: "equipmentType"
    type: "EquipmentType"
  - name: "requiresSetupMinutes"
    type: "Integer"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "locations"
    type: "Location"
    multiplicity: "ManyToMany"
  - name: "calendar"
    type: "Calendar"
    multiplicity: "OneToOne"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "ManyToMany"
- name: "Calendar"
  description: "Schedule container that holds time slots, availability, and blackout\
    \ periods for a resource."
  data:
  - name: "name"
    type: "String"
  - name: "calendarPurpose"
    type: "CalendarPurpose"
  - name: "timeZone"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "facility"
    type: "HealthcareFacility"
    multiplicity: "ManyToOne"
  - name: "timeSlots"
    type: "TimeSlot"
    multiplicity: "OneToMany"
  - name: "availabilities"
    type: "RecurringAvailability"
    multiplicity: "OneToMany"
  - name: "blackoutPeriods"
    type: "BlackoutPeriod"
    multiplicity: "OneToMany"
- name: "TimeSlot"
  description: "Discrete unit of bookable time on a calendar."
  data:
  - name: "startDateTime"
    type: "DateTime"
  - name: "endDateTime"
    type: "DateTime"
  - name: "slotType"
    type: "SlotType"
  - name: "capacity"
    type: "Integer"
  - name: "overbookAllowed"
    type: "Boolean"
  relations:
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
- name: "Appointment"
  description: "Scheduled encounter between a patient and care team with defined resources,\
    \ time, and status."
  data:
  - name: "status"
    type: "AppointmentStatus"
  - name: "startDateTime"
    type: "DateTime"
  - name: "endDateTime"
    type: "DateTime"
  - name: "confirmationCode"
    type: "String"
  - name: "reasonForVisit"
    type: "String"
  - name: "visitMode"
    type: "VisitMode"
  - name: "notes"
    type: "String"
  - name: "telehealthDetails"
    type: "TelehealthDetails"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "appointmentType"
    type: "AppointmentType"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "Provider"
    multiplicity: "ManyToOne"
  - name: "serviceUnit"
    type: "ServiceUnit"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "equipment"
    type: "Equipment"
    multiplicity: "ManyToMany"
  - name: "timeSlot"
    type: "TimeSlot"
    multiplicity: "ManyToOne"
  - name: "reminders"
    type: "Reminder"
    multiplicity: "OneToMany"
  - name: "checkInEvent"
    type: "CheckInEvent"
    multiplicity: "OneToOne"
- name: "RecurringAvailability"
  description: "Pattern that defines recurring open hours and slot structure for a\
    \ calendar."
  data:
  - name: "dayOfWeek"
    type: "DayOfWeek"
  - name: "startTime"
    type: "Time"
  - name: "endTime"
    type: "Time"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "slotDurationMinutes"
    type: "Integer"
  - name: "capacity"
    type: "Integer"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
- name: "BlackoutPeriod"
  description: "Specific time range during which booking is disallowed due to closures\
    \ or time off."
  data:
  - name: "name"
    type: "String"
  - name: "startDateTime"
    type: "DateTime"
  - name: "endDateTime"
    type: "DateTime"
  - name: "reason"
    type: "BlackoutReason"
  relations:
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
- name: "BookingPolicy"
  description: "Governed rules controlling how appointments are created, changed,\
    \ and overbooked within a service unit."
  data:
  - name: "minLeadTimeMinutes"
    type: "Integer"
  - name: "maxLeadTimeDays"
    type: "Integer"
  - name: "cancellationWindowHours"
    type: "Integer"
  - name: "rescheduleWindowHours"
    type: "Integer"
  - name: "allowOverbook"
    type: "Boolean"
  - name: "maxOverbookCount"
    type: "Integer"
  - name: "requiresReferral"
    type: "Boolean"
  relations:
  - name: "serviceUnit"
    type: "ServiceUnit"
    multiplicity: "ManyToOne"
- name: "WaitlistEntry"
  description: "Patient request to be scheduled earlier or within a preferred time\
    \ window when openings occur."
  data:
  - name: "status"
    type: "WaitlistStatus"
  - name: "requestedFromDate"
    type: "Date"
  - name: "requestedToDate"
    type: "Date"
  - name: "urgency"
    type: "UrgencyLevel"
  - name: "notes"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "appointmentType"
    type: "AppointmentType"
    multiplicity: "ManyToOne"
  - name: "preferredProvider"
    type: "Provider"
    multiplicity: "ManyToOne"
  - name: "preferredLocation"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "serviceUnit"
    type: "ServiceUnit"
    multiplicity: "ManyToOne"
  - name: "facility"
    type: "HealthcareFacility"
    multiplicity: "ManyToOne"
- name: "AppointmentRequest"
  description: "Intake record capturing a patient’s scheduling needs prior to booking."
  data:
  - name: "status"
    type: "RequestStatus"
  - name: "requestedStartDateTime"
    type: "DateTime"
  - name: "requestedEndDateTime"
    type: "DateTime"
  - name: "flexibilityMinutes"
    type: "Integer"
  - name: "channel"
    type: "IntakeChannel"
  - name: "preferredWindow"
    type: "TimeRange"
  - name: "notes"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "appointmentType"
    type: "AppointmentType"
    multiplicity: "ManyToOne"
  - name: "preferredProvider"
    type: "Provider"
    multiplicity: "ManyToOne"
  - name: "preferredLocation"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "serviceUnit"
    type: "ServiceUnit"
    multiplicity: "ManyToOne"
  - name: "createdAppointment"
    type: "Appointment"
    multiplicity: "OneToOne"
- name: "Reminder"
  description: "Notification to prompt attendance or preparation for an appointment."
  data:
  - name: "sendDateTime"
    type: "DateTime"
  - name: "deliveryChannel"
    type: "ReminderChannel"
  - name: "status"
    type: "ReminderStatus"
  - name: "messageTemplate"
    type: "String"
  relations:
  - name: "appointment"
    type: "Appointment"
    multiplicity: "ManyToOne"
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
- name: "CheckInEvent"
  description: "Record of a patient’s arrival and check-in method for a scheduled\
    \ appointment."
  data:
  - name: "checkInTime"
    type: "DateTime"
  - name: "method"
    type: "CheckInMethod"
  - name: "status"
    type: "CheckInStatus"
  relations:
  - name: "appointment"
    type: "Appointment"
    multiplicity: "OneToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
enums:
- name: "FacilityType"
  description: "Classification of the facility where scheduling occurs."
  data:
  - name: "Hospital"
  - name: "Clinic"
  - name: "AmbulatorySurgeryCenter"
  - name: "ImagingCenter"
  - name: "Laboratory"
- name: "ProviderType"
  description: "Role of the care professional whose time is scheduled."
  data:
  - name: "Physician"
  - name: "NursePractitioner"
  - name: "PhysicianAssistant"
  - name: "Therapist"
  - name: "Technician"
  - name: "Nurse"
- name: "ClinicalSpecialty"
  description: "Medical discipline associated with providers and service units."
  data:
  - name: "FamilyMedicine"
  - name: "Cardiology"
  - name: "Orthopedics"
  - name: "Pediatrics"
  - name: "Dermatology"
  - name: "Psychiatry"
  - name: "GeneralSurgery"
  - name: "Radiology"
- name: "LocationType"
  description: "Type of room or place that can be booked."
  data:
  - name: "ExamRoom"
  - name: "ProcedureRoom"
  - name: "OperatingRoom"
  - name: "InfusionBay"
  - name: "Telehealth"
  - name: "FrontDesk"
- name: "CalendarPurpose"
  description: "Intended scope of the calendar within scheduling."
  data:
  - name: "Provider"
  - name: "Location"
  - name: "Equipment"
  - name: "ServiceUnit"
  - name: "Operational"
- name: "SlotType"
  description: "Operational state of a time slot."
  data:
  - name: "Open"
  - name: "Reserved"
  - name: "Hold"
  - name: "Blocked"
- name: "AppointmentStatus"
  description: "Lifecycle state of an appointment."
  data:
  - name: "Requested"
  - name: "Scheduled"
  - name: "Arrived"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
  - name: "NoShow"
  - name: "Rescheduled"
- name: "VisitMode"
  description: "Modality used to deliver the visit."
  data:
  - name: "InPerson"
  - name: "Telehealth"
  - name: "HomeVisit"
- name: "EquipmentType"
  description: "Category of schedulable clinical equipment."
  data:
  - name: "Ultrasound"
  - name: "XRay"
  - name: "MRI"
  - name: "CT"
  - name: "ECG"
  - name: "InfusionChair"
  - name: "ExamTable"
- name: "BlackoutReason"
  description: "Reason a calendar is unavailable for booking."
  data:
  - name: "Vacation"
  - name: "Meeting"
  - name: "Maintenance"
  - name: "Holiday"
  - name: "Training"
  - name: "Emergency"
- name: "WaitlistStatus"
  description: "Current state of a waitlist entry."
  data:
  - name: "Active"
  - name: "Offered"
  - name: "Fulfilled"
  - name: "Cancelled"
  - name: "Expired"
- name: "UrgencyLevel"
  description: "Priority associated with a waitlist or scheduling need."
  data:
  - name: "Routine"
  - name: "Priority"
  - name: "Urgent"
- name: "RequestStatus"
  description: "Processing status of an appointment request."
  data:
  - name: "New"
  - name: "Triaged"
  - name: "Offered"
  - name: "Converted"
  - name: "Declined"
  - name: "Cancelled"
- name: "IntakeChannel"
  description: "Channel through which the scheduling request was received."
  data:
  - name: "Phone"
  - name: "PatientPortal"
  - name: "Referral"
  - name: "WalkIn"
  - name: "SecureMessage"
- name: "ReminderChannel"
  description: "Delivery medium for scheduling reminders."
  data:
  - name: "SMS"
  - name: "Email"
  - name: "Voice"
- name: "ReminderStatus"
  description: "Delivery status of a reminder communication."
  data:
  - name: "Pending"
  - name: "Sent"
  - name: "Failed"
  - name: "Cancelled"
- name: "DayOfWeek"
  description: "Day used to define recurring availability."
  data:
  - name: "Monday"
  - name: "Tuesday"
  - name: "Wednesday"
  - name: "Thursday"
  - name: "Friday"
  - name: "Saturday"
  - name: "Sunday"
- name: "CheckInMethod"
  description: "Means by which a patient completed arrival check-in."
  data:
  - name: "Kiosk"
  - name: "StaffAssisted"
  - name: "MobileApp"
- name: "CheckInStatus"
  description: "Outcome of the check-in event."
  data:
  - name: "Completed"
  - name: "Aborted"
valueObjects:
- name: "Address"
  description: "Structured postal address for physical contact and location context."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "ContactInfo"
  description: "Basic electronic and phone contact preferences for communication."
  data:
  - name: "phone"
    type: "String"
  - name: "email"
    type: "String"
  - name: "smsOptIn"
    type: "Boolean"
  - name: "preferredTimeWindow"
    type: "String"
- name: "TelehealthDetails"
  description: "Access information for virtual visits."
  data:
  - name: "meetingUrl"
    type: "String"
  - name: "meetingId"
    type: "String"
  - name: "passcode"
    type: "String"
  - name: "platform"
    type: "String"
- name: "TimeRange"
  description: "Window of time used to express preferences or constraints."
  data:
  - name: "startDateTime"
    type: "DateTime"
  - name: "endDateTime"
    type: "DateTime"
