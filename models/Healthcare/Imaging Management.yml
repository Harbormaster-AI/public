---
metadata:
  name: "Imaging Management Capabilities Model"
  description: "Core capabilities for managing the end-to-end lifecycle of diagnostic\
    \ imaging, including ordering, scheduling, acquisition, archiving, quality, transfer,\
    \ and reporting."
  version: "1.0.0"
  industry: "Healthcare"
  category: "Healthcare"
  type: "Capability"
  domain: "Imaging Management"
entities:
- name: "ImagingFacility"
  description: "Healthcare site where diagnostic imaging services are delivered."
  data:
  - name: "name"
    type: "String"
  - name: "facilityType"
    type: "ImagingFacilityType"
  - name: "address"
    type: "Address"
  - name: "phone"
    type: "String"
  - name: "timezone"
    type: "String"
  relations:
  - name: "rooms"
    type: "ImagingRoom"
    multiplicity: "OneToMany"
  - name: "devices"
    type: "ModalityDevice"
    multiplicity: "OneToMany"
  - name: "staff"
    type: "ImagingStaff"
    multiplicity: "OneToMany"
  - name: "repositories"
    type: "ArchiveRepository"
    multiplicity: "OneToMany"
- name: "ImagingRoom"
  description: "Physical room or suite allocated for imaging procedures."
  data:
  - name: "name"
    type: "String"
  - name: "roomNumber"
    type: "String"
  - name: "occupancyStatus"
    type: "RoomOccupancyStatus"
  relations:
  - name: "facility"
    type: "ImagingFacility"
    multiplicity: "ManyToOne"
  - name: "devices"
    type: "ModalityDevice"
    multiplicity: "OneToMany"
  - name: "appointments"
    type: "ImagingAppointment"
    multiplicity: "OneToMany"
- name: "ModalityDevice"
  description: "Imaging equipment used to acquire diagnostic images and related data."
  data:
  - name: "manufacturer"
    type: "String"
  - name: "modelName"
    type: "String"
  - name: "serialNumber"
    type: "String"
  - name: "modalityType"
    type: "ModalityType"
  - name: "aeTitle"
    type: "AETitle"
  - name: "softwareVersion"
    type: "String"
  - name: "status"
    type: "DeviceStatus"
  relations:
  - name: "facility"
    type: "ImagingFacility"
    multiplicity: "ManyToOne"
  - name: "room"
    type: "ImagingRoom"
    multiplicity: "ManyToOne"
  - name: "worklistItems"
    type: "ModalityWorklistItem"
    multiplicity: "OneToMany"
  - name: "studies"
    type: "ImagingStudy"
    multiplicity: "OneToMany"
  - name: "transferSessions"
    type: "ImageTransferSession"
    multiplicity: "OneToMany"
- name: "ProcedureDefinition"
  description: "Catalog entry defining a standardized diagnostic imaging procedure."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "CodedConcept"
  - name: "modalityType"
    type: "ModalityType"
  - name: "bodyPart"
    type: "BodyPart"
  - name: "laterality"
    type: "Laterality"
  - name: "contrastRequired"
    type: "Boolean"
  - name: "estimatedDurationMinutes"
    type: "Integer"
  relations:
  - name: "protocols"
    type: "ImagingProtocol"
    multiplicity: "OneToMany"
  - name: "orders"
    type: "ImagingOrder"
    multiplicity: "OneToMany"
- name: "ImagingProtocol"
  description: "Technical acquisition parameters and instructions for executing a\
    \ procedure on a modality."
  data:
  - name: "name"
    type: "String"
  - name: "protocolVersion"
    type: "String"
  - name: "kVp"
    type: "Integer"
  - name: "mAs"
    type: "Integer"
  - name: "sliceThickness"
    type: "Decimal"
  - name: "sequenceName"
    type: "String"
  - name: "parametersNote"
    type: "String"
  relations:
  - name: "procedure"
    type: "ProcedureDefinition"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "ModalityDevice"
    multiplicity: "ManyToOne"
  - name: "studies"
    type: "ImagingStudy"
    multiplicity: "OneToMany"
- name: "ReferringProvider"
  description: "Clinician responsible for ordering diagnostic imaging for a patient."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "nationalProviderIdentifier"
    type: "String"
  - name: "specialty"
    type: "ProviderSpecialty"
  - name: "contactPhone"
    type: "String"
  - name: "organization"
    type: "String"
  relations:
  - name: "orders"
    type: "ImagingOrder"
    multiplicity: "OneToMany"
- name: "ImagingStaff"
  description: "Personnel involved in imaging operations, including technologists,\
    \ radiologists, and support roles."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "role"
    type: "StaffRole"
  - name: "credentialNumber"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "facility"
    type: "ImagingFacility"
    multiplicity: "ManyToOne"
  - name: "appointments"
    type: "ImagingAppointment"
    multiplicity: "OneToMany"
  - name: "studiesPerformed"
    type: "ImagingStudy"
    multiplicity: "OneToMany"
  - name: "reportsAuthored"
    type: "RadiologyReport"
    multiplicity: "OneToMany"
  - name: "qualityChecks"
    type: "ImageQualityCheck"
    multiplicity: "OneToMany"
- name: "Patient"
  description: "Individual receiving diagnostic imaging services."
  data:
  - name: "mrn"
    type: "MRN"
  - name: "name"
    type: "HumanName"
  - name: "birthDate"
    type: "Date"
  - name: "sex"
    type: "AdministrativeSex"
  - name: "phone"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "preferredLanguage"
    type: "String"
  relations:
  - name: "orders"
    type: "ImagingOrder"
    multiplicity: "OneToMany"
  - name: "appointments"
    type: "ImagingAppointment"
    multiplicity: "OneToMany"
  - name: "studies"
    type: "ImagingStudy"
    multiplicity: "OneToMany"
  - name: "reports"
    type: "RadiologyReport"
    multiplicity: "OneToMany"
- name: "ImagingOrder"
  description: "Request to perform a diagnostic imaging procedure for a patient."
  data:
  - name: "accessionNumber"
    type: "AccessionNumber"
  - name: "orderDateTime"
    type: "DateTime"
  - name: "priority"
    type: "OrderPriority"
  - name: "status"
    type: "OrderStatus"
  - name: "reasonForStudy"
    type: "String"
  - name: "clinicalNotes"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "referringProvider"
    type: "ReferringProvider"
    multiplicity: "ManyToOne"
  - name: "procedureDefinition"
    type: "ProcedureDefinition"
    multiplicity: "ManyToOne"
  - name: "appointments"
    type: "ImagingAppointment"
    multiplicity: "OneToMany"
  - name: "study"
    type: "ImagingStudy"
    multiplicity: "OneToOne"
- name: "ImagingAppointment"
  description: "Scheduled session allocating resources to fulfill an imaging order."
  data:
  - name: "startTime"
    type: "DateTime"
  - name: "endTime"
    type: "DateTime"
  - name: "status"
    type: "AppointmentStatus"
  - name: "checkInTime"
    type: "DateTime"
  - name: "preparationInstructions"
    type: "String"
  relations:
  - name: "order"
    type: "ImagingOrder"
    multiplicity: "ManyToOne"
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "room"
    type: "ImagingRoom"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "ModalityDevice"
    multiplicity: "ManyToOne"
  - name: "technologist"
    type: "ImagingStaff"
    multiplicity: "ManyToOne"
  - name: "worklistItem"
    type: "ModalityWorklistItem"
    multiplicity: "OneToOne"
- name: "ModalityWorklistItem"
  description: "Worklist entry communicated to imaging devices for scheduled procedure\
    \ steps."
  data:
  - name: "scheduledStart"
    type: "DateTime"
  - name: "scheduledEnd"
    type: "DateTime"
  - name: "stationAETitle"
    type: "AETitle"
  - name: "procedureStepDescription"
    type: "String"
  - name: "status"
    type: "PerformedStepStatus"
  relations:
  - name: "order"
    type: "ImagingOrder"
    multiplicity: "ManyToOne"
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "ModalityDevice"
    multiplicity: "ManyToOne"
  - name: "appointment"
    type: "ImagingAppointment"
    multiplicity: "OneToOne"
  - name: "study"
    type: "ImagingStudy"
    multiplicity: "OneToOne"
- name: "ImagingStudy"
  description: "DICOM study representing a set of images and related evidence for\
    \ a single imaging event."
  data:
  - name: "studyInstanceUID"
    type: "DICOMUID"
  - name: "studyDateTime"
    type: "DateTime"
  - name: "studyDescription"
    type: "String"
  - name: "status"
    type: "StudyStatus"
  - name: "numberOfSeries"
    type: "Integer"
  - name: "numberOfInstances"
    type: "Integer"
  - name: "bodyPart"
    type: "BodyPart"
  - name: "laterality"
    type: "Laterality"
  relations:
  - name: "order"
    type: "ImagingOrder"
    multiplicity: "ManyToOne"
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "ModalityDevice"
    multiplicity: "ManyToOne"
  - name: "protocol"
    type: "ImagingProtocol"
    multiplicity: "ManyToOne"
  - name: "series"
    type: "ImageSeries"
    multiplicity: "OneToMany"
  - name: "report"
    type: "RadiologyReport"
    multiplicity: "OneToOne"
  - name: "doseRecords"
    type: "RadiationDoseRecord"
    multiplicity: "OneToMany"
  - name: "qualityChecks"
    type: "ImageQualityCheck"
    multiplicity: "OneToMany"
  - name: "transferSessions"
    type: "ImageTransferSession"
    multiplicity: "OneToMany"
- name: "ImageSeries"
  description: "DICOM series grouping a set of instances within a study."
  data:
  - name: "seriesInstanceUID"
    type: "DICOMUID"
  - name: "seriesNumber"
    type: "Integer"
  - name: "seriesDescription"
    type: "String"
  - name: "modalityType"
    type: "ModalityType"
  - name: "bodyPart"
    type: "BodyPart"
  - name: "laterality"
    type: "Laterality"
  relations:
  - name: "study"
    type: "ImagingStudy"
    multiplicity: "ManyToOne"
  - name: "instances"
    type: "ImageInstance"
    multiplicity: "OneToMany"
  - name: "doseRecords"
    type: "RadiationDoseRecord"
    multiplicity: "OneToMany"
- name: "ImageInstance"
  description: "Individual DICOM instance such as an image, waveform, or structured\
    \ object."
  data:
  - name: "sopInstanceUID"
    type: "DICOMUID"
  - name: "instanceNumber"
    type: "Integer"
  - name: "imageType"
    type: "String"
  - name: "acquisitionDateTime"
    type: "DateTime"
  - name: "contentDateTime"
    type: "DateTime"
  - name: "photometricInterpretation"
    type: "String"
  relations:
  - name: "series"
    type: "ImageSeries"
    multiplicity: "ManyToOne"
  - name: "storageObjects"
    type: "ImageStorageObject"
    multiplicity: "OneToMany"
  - name: "annotations"
    type: "ImageAnnotation"
    multiplicity: "OneToMany"
- name: "ImageAnnotation"
  description: "Measurement or markup associated with an image or study."
  data:
  - name: "annotationType"
    type: "AnnotationType"
  - name: "label"
    type: "String"
  - name: "measurementValue"
    type: "Decimal"
  - name: "measurementUnit"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "algorithmName"
    type: "String"
  relations:
  - name: "instance"
    type: "ImageInstance"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "ImagingStaff"
    multiplicity: "ManyToOne"
  - name: "study"
    type: "ImagingStudy"
    multiplicity: "ManyToOne"
- name: "RadiologyReport"
  description: "Narrative and coded interpretation of an imaging study by a qualified\
    \ professional."
  data:
  - name: "reportIdentifier"
    type: "ReportIdentifier"
  - name: "status"
    type: "ReportStatus"
  - name: "reportText"
    type: "String"
  - name: "codedConclusion"
    type: "CodedConcept"
  - name: "addendumText"
    type: "String"
  - name: "finalizedAt"
    type: "DateTime"
  - name: "templateName"
    type: "String"
  relations:
  - name: "study"
    type: "ImagingStudy"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "ImagingStaff"
    multiplicity: "ManyToOne"
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "referringProvider"
    type: "ReferringProvider"
    multiplicity: "ManyToOne"
- name: "ImageQualityCheck"
  description: "Quality assessment of acquired images, including protocol adherence\
    \ and artifact review."
  data:
  - name: "status"
    type: "QCStatus"
  - name: "reason"
    type: "String"
  - name: "actionTaken"
    type: "String"
  - name: "checkedAt"
    type: "DateTime"
  - name: "rejectFlag"
    type: "Boolean"
  relations:
  - name: "study"
    type: "ImagingStudy"
    multiplicity: "ManyToOne"
  - name: "technologist"
    type: "ImagingStaff"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "ModalityDevice"
    multiplicity: "ManyToOne"
- name: "RadiationDoseRecord"
  description: "Recorded radiation exposure metrics associated with a study or series."
  data:
  - name: "doseReferenceUID"
    type: "DICOMUID"
  - name: "seriesNumber"
    type: "Integer"
  - name: "ctdiVol"
    type: "Decimal"
  - name: "dlp"
    type: "Decimal"
  - name: "effectiveDose"
    type: "Decimal"
  - name: "doseUnit"
    type: "RadiationDoseUnit"
  - name: "recordedAt"
    type: "DateTime"
  relations:
  - name: "study"
    type: "ImagingStudy"
    multiplicity: "ManyToOne"
  - name: "series"
    type: "ImageSeries"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "ModalityDevice"
    multiplicity: "ManyToOne"
- name: "ArchiveRepository"
  description: "Logical repository managing storage and lifecycle of imaging data."
  data:
  - name: "name"
    type: "String"
  - name: "repositoryType"
    type: "RepositoryType"
  - name: "endpoint"
    type: "NetworkEndpoint"
  - name: "retentionYears"
    type: "Integer"
  - name: "compressionType"
    type: "CompressionType"
  - name: "encryptionEnabled"
    type: "Boolean"
  relations:
  - name: "facility"
    type: "ImagingFacility"
    multiplicity: "ManyToOne"
  - name: "storedObjects"
    type: "ImageStorageObject"
    multiplicity: "OneToMany"
  - name: "transferSessions"
    type: "ImageTransferSession"
    multiplicity: "OneToMany"
- name: "ImageStorageObject"
  description: "Stored file representation of an imaging instance within a repository."
  data:
  - name: "storageClass"
    type: "StorageClass"
  - name: "uri"
    type: "String"
  - name: "sizeMB"
    type: "Decimal"
  - name: "checksum"
    type: "String"
  - name: "availability"
    type: "StorageAvailability"
  relations:
  - name: "instance"
    type: "ImageInstance"
    multiplicity: "ManyToOne"
  - name: "repository"
    type: "ArchiveRepository"
    multiplicity: "ManyToOne"
- name: "ImageTransferSession"
  description: "Record of data movement for imaging objects between systems."
  data:
  - name: "startedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  - name: "protocol"
    type: "TransferProtocol"
  - name: "status"
    type: "TransferStatus"
  - name: "transferredBytes"
    type: "Integer"
  - name: "sourceAETitle"
    type: "AETitle"
  - name: "destinationAETitle"
    type: "AETitle"
  relations:
  - name: "sourceDevice"
    type: "ModalityDevice"
    multiplicity: "ManyToOne"
  - name: "destinationRepository"
    type: "ArchiveRepository"
    multiplicity: "ManyToOne"
  - name: "study"
    type: "ImagingStudy"
    multiplicity: "ManyToOne"
enums:
- name: "ImagingFacilityType"
  description: "Classification of the imaging service location."
  data:
  - name: "Hospital"
  - name: "ImagingCenter"
  - name: "MobileUnit"
- name: "RoomOccupancyStatus"
  description: "Real-time availability state of an imaging room."
  data:
  - name: "Available"
  - name: "InUse"
  - name: "Cleaning"
  - name: "Maintenance"
- name: "ModalityType"
  description: "DICOM modality classification for imaging devices and series."
  data:
  - name: "CT"
  - name: "MR"
  - name: "US"
  - name: "XR"
  - name: "NM"
  - name: "PET"
  - name: "MG"
  - name: "DX"
  - name: "CR"
  - name: "RF"
  - name: "XA"
  - name: "CV"
  - name: "OT"
- name: "DeviceStatus"
  description: "Operational status of an imaging device."
  data:
  - name: "Active"
  - name: "Maintenance"
  - name: "Down"
  - name: "Decommissioned"
- name: "ProviderSpecialty"
  description: "Clinical specialty of the referring provider."
  data:
  - name: "Radiology"
  - name: "Cardiology"
  - name: "Oncology"
  - name: "PrimaryCare"
  - name: "Surgery"
  - name: "EmergencyMedicine"
  - name: "Neurology"
  - name: "Orthopedics"
  - name: "ObstetricsGynecology"
- name: "StaffRole"
  description: "Role of personnel participating in imaging workflows."
  data:
  - name: "Radiologist"
  - name: "Technologist"
  - name: "Nurse"
  - name: "Physicist"
  - name: "Administrator"
- name: "AdministrativeSex"
  description: "Administrative sex classification used for patient records."
  data:
  - name: "Male"
  - name: "Female"
  - name: "Other"
  - name: "Unknown"
- name: "OrderPriority"
  description: "Clinical urgency of an imaging order."
  data:
  - name: "STAT"
  - name: "Urgent"
  - name: "Routine"
  - name: "Low"
- name: "OrderStatus"
  description: "Lifecycle state of an imaging order."
  data:
  - name: "Draft"
  - name: "Placed"
  - name: "Scheduled"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
  - name: "OnHold"
- name: "AppointmentStatus"
  description: "Scheduling and attendance state for an imaging appointment."
  data:
  - name: "Scheduled"
  - name: "CheckedIn"
  - name: "InProgress"
  - name: "Completed"
  - name: "NoShow"
  - name: "Cancelled"
  - name: "Rescheduled"
- name: "PerformedStepStatus"
  description: "Execution status of a performed procedure step on the modality."
  data:
  - name: "Scheduled"
  - name: "InProgress"
  - name: "Completed"
  - name: "Discontinued"
- name: "StudyStatus"
  description: "Operational and clinical status of an imaging study."
  data:
  - name: "Registered"
  - name: "InProgress"
  - name: "Completed"
  - name: "Verified"
  - name: "Archived"
- name: "ReportStatus"
  description: "Editorial and verification state of a radiology report."
  data:
  - name: "Draft"
  - name: "Preliminary"
  - name: "Final"
  - name: "Amended"
  - name: "Corrected"
  - name: "Addendum"
- name: "BodyPart"
  description: "Region of the body examined or imaged."
  data:
  - name: "Head"
  - name: "Brain"
  - name: "Neck"
  - name: "Chest"
  - name: "Abdomen"
  - name: "Pelvis"
  - name: "Spine"
  - name: "UpperExtremity"
  - name: "LowerExtremity"
  - name: "Breast"
  - name: "Cardiac"
  - name: "Vascular"
  - name: "WholeBody"
  - name: "Other"
- name: "Laterality"
  description: "Side of the body relevant to the imaging procedure."
  data:
  - name: "Left"
  - name: "Right"
  - name: "Bilateral"
  - name: "Unspecified"
- name: "QCStatus"
  description: "Outcome of image quality assessment."
  data:
  - name: "Pass"
  - name: "Fail"
  - name: "NeedsReview"
  - name: "Corrected"
- name: "RadiationDoseUnit"
  description: "Units applicable to radiation dose measurements."
  data:
  - name: "mGy"
  - name: "mGycm"
  - name: "mSv"
- name: "RepositoryType"
  description: "Type of repository used for storing imaging data."
  data:
  - name: "PACS"
  - name: "VNA"
  - name: "CloudArchive"
- name: "CompressionType"
  description: "Compression method applied to stored imaging objects."
  data:
  - name: "None"
  - name: "Lossless"
  - name: "Lossy"
- name: "StorageClass"
  description: "Classification of stored imaging objects."
  data:
  - name: "DICOM"
  - name: "NonDICOM"
  - name: "Derived"
- name: "StorageAvailability"
  description: "Accessibility state of stored imaging data."
  data:
  - name: "Online"
  - name: "Nearline"
  - name: "Offline"
  - name: "Unavailable"
- name: "TransferProtocol"
  description: "Protocol used to move imaging data between systems."
  data:
  - name: "DICOM_CSTORE"
  - name: "DICOM_MOVE"
  - name: "DICOM_QR"
  - name: "WADO"
  - name: "DICOMweb"
  - name: "S3"
  - name: "NFS"
- name: "TransferStatus"
  description: "Execution state of a data transfer session."
  data:
  - name: "Pending"
  - name: "InProgress"
  - name: "Completed"
  - name: "Failed"
  - name: "Partial"
- name: "AnnotationType"
  description: "Kind of annotation or measurement associated with images."
  data:
  - name: "Measurement"
  - name: "ROI"
  - name: "KeyImage"
  - name: "Text"
  - name: "Segmentation"
- name: "ReportCodeSystem"
  description: "Terminology system used to code report conclusions or procedures."
  data:
  - name: "LOINC"
  - name: "RadLex"
  - name: "SNOMEDCT"
valueObjects:
- name: "AccessionNumber"
  description: "Institution-assigned unique identifier for an imaging order or study."
  data:
  - name: "value"
    type: "String"
- name: "DICOMUID"
  description: "Globally unique DICOM identifier for study, series, or instance."
  data:
  - name: "value"
    type: "String"
- name: "MRN"
  description: "Medical record number uniquely identifying a patient within a facility."
  data:
  - name: "value"
    type: "String"
- name: "HumanName"
  description: "Structured representation of a person’s name."
  data:
  - name: "given"
    type: "String"
  - name: "family"
    type: "String"
  - name: "middle"
    type: "String"
  - name: "suffix"
    type: "String"
- name: "Address"
  description: "Postal address for a person or organization."
  data:
  - name: "street"
