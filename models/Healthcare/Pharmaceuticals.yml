    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "Money"
  description: "Monetary amount and currency for pricing and valuation."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "ContactInfo"
  description: "Communication details for individuals or organizations."
  data:
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
- name: "PatientIdentifier"
  description: "Pseudonymized unique identifier for a clinical subject or patient."
  data:
  - name: "value"
    type: "String"
- name: "ProtocolNumber"
  description: "Unique identifier for a clinical trial protocol version."
  data:
  - name: "value"
    type: "String"
- name: "SerializationCode"
  description: "Serialized identifier used for track-and-trace at unit or aggregation\
