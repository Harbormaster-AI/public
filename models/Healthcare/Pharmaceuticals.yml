- name: "AdverseEvent"
  description: "Any untoward medical occurrence in a participant temporally associated\
    \ with product use."
  data:
  - name: "eventTerm"
    type: "String"
  - name: "onsetDate"
    type: "Date"
  - name: "severity"
    type: "AdverseEventSeverity"
  - name: "seriousness"
    type: "Seriousness"
  - name: "causality"
    type: "Causality"
  relations:
  - name: "subject"
    type: "Subject"
    multiplicity: "ManyToOne"
  - name: "trial"
    type: "ClinicalTrial"
    multiplicity: "ManyToOne"
  - name: "safetyCase"
    type: "SafetyCase"
    multiplicity: "ManyToOne"
- name: "SafetyCase"
  description: "Pharmacovigilance case aggregating reports and assessments for a suspected\
    \ adverse reaction."
  data:
  - name: "caseNumber"
    type: "String"
  - name: "status"
    type: "PVCaseStatus"
