  - name: "reportType"
    type: "String"
  - name: "submittedDate"
    type: "Date"
  relations:
  - name: "safetyCase"
    type: "SafetyCase"
    multiplicity: "ManyToOne"
  - name: "authority"
    type: "RegulatoryAuthority"
    multiplicity: "ManyToOne"
- name: "Recall"
  description: "Market action to remove or correct a product that violates regulatory\
