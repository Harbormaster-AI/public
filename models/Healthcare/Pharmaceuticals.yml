    multiplicity: "ManyToOne"
  - name: "adverseEvents"
    type: "AdverseEvent"
    multiplicity: "OneToMany"
  - name: "regulatoryReports"
    type: "RegulatoryReport"
    multiplicity: "OneToMany"
- name: "RegulatoryReport"
  description: "Safety or periodic report submitted to an authority in compliance\
    \ with pharmacovigilance obligations."
  data:
  - name: "reportId"
