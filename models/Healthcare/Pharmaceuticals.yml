metadata:
  name: "Pharmaceuticals Industry Domain Model"
  description: "HCIDL model capturing pharmaceutical R&D, manufacturing, quality,\
    \ regulatory, stability, serialization, logistics, clinical, and pharmacovigilance\
    \ capabilities."
  version: "1.0.0"
  industry: "Pharmaceuticals"
  category: "Healthcare"
  language: "English"
  type: "Industry"
  domain: "Pharmaceuticals"
enums:
- name: "CompanyType"
  description: "Classification of pharmaceutical companies by business model or focus."
  data:
  - name: "Innovator"
  - name: "Generic"
  - name: "Biotech"
  - name: "ContractManufacturer"
- name: "MoleculeType"
  description: "Scientific category describing the nature of the active entity."
  data:
  - name: "SmallMolecule"
  - name: "Biologic"
  - name: "Vaccine"
  - name: "CellTherapy"
  - name: "GeneTherapy"
- name: "DosageForm"
  description: "Presentation of the medicinal product for administration."
  data:
  - name: "Tablet"
  - name: "Capsule"
  - name: "Injection"
  - name: "Solution"
  - name: "Suspension"
  - name: "Ointment"
  - name: "Cream"
  - name: "Inhalation"
  - name: "Patch"
  - name: "Suppository"
  - name: "LyophilizedPowder"
- name: "RouteOfAdministration"
  description: "Path by which a drug is taken into the body."
  data:
  - name: "Oral"
  - name: "Intravenous"
  - name: "Subcutaneous"
  - name: "Intramuscular"
  - name: "Topical"
  - name: "Inhalation"
  - name: "Ophthalmic"
  - name: "Nasal"
  - name: "Transdermal"
  - name: "Rectal"
- name: "ClinicalPhase"
  description: "Standard phase gating for human clinical development."
  data:
  - name: "Preclinical"
  - name: "PhaseI"
  - name: "PhaseII"
  - name: "PhaseIII"
  - name: "PhaseIV"
- name: "TrialStatus"
  description: "Operational state of a clinical trial."
  data:
  - name: "Planned"
  - name: "Ongoing"
  - name: "Completed"
  - name: "Terminated"
  - name: "Suspended"
- name: "SubjectStatus"
  description: "Enrollment and participation status of a clinical subject."
  data:
  - name: "Screening"
  - name: "Randomized"
  - name: "OnTreatment"
  - name: "Completed"
  - name: "Withdrawn"
  - name: "LostToFollowUp"
- name: "SubmissionType"
  description: "Regulatory application category."
  data:
  - name: "IND"
  - name: "NDA"
  - name: "BLA"
  - name: "ANDA"
  - name: "MAA"
  - name: "CTA"
  - name: "Variation"
  - name: "Supplement"
- name: "ApprovalStatus"
  description: "Status of regulatory authorization for a submission or product."
  data:
  - name: "Submitted"
  - name: "UnderReview"
  - name: "Approved"
  - name: "Rejected"
  - name: "Withdrawn"
- name: "BatchStatus"
  description: "Lifecycle disposition of a manufactured lot."
  data:
  - name: "Planned"
  - name: "InProcess"
  - name: "Quarantined"
  - name: "Released"
  - name: "Rejected"
  - name: "Recalled"
- name: "OrderStatus"
  description: "Execution state of a manufacturing or logistics order."
  data:
  - name: "Planned"
  - name: "Released"
  - name: "InProgress"
  - name: "Completed"
  - name: "Closed"
  - name: "Cancelled"
- name: "TestResult"
  description: "Outcome category for analytical testing relative to specification."
  data:
  - name: "Pass"
  - name: "Fail"
  - name: "Inconclusive"
- name: "StabilityCondition"
  description: "Storage stress category used in stability programs."
  data:
  - name: "LongTerm"
  - name: "Accelerated"
  - name: "Intermediate"
  - name: "Stress"
- name: "StabilityStudyStatus"
  description: "Operational status for a stability study."
  data:
  - name: "Planned"
  - name: "Ongoing"
  - name: "Completed"
  - name: "Terminated"
- name: "RecallClass"
  description: "Regulatory-defined class indicating the health hazard associated with\
    \ a recall."
  data:
  - name: "ClassI"
  - name: "ClassII"
  - name: "ClassIII"
- name: "RecallStatus"
  description: "Progress state for a recall campaign."
  data:
  - name: "Open"
  - name: "UnderInvestigation"
  - name: "Closed"
- name: "AdverseEventSeverity"
  description: "Intensity of an adverse event based on clinical criteria."
  data:
  - name: "Mild"
  - name: "Moderate"
  - name: "Severe"
  - name: "LifeThreatening"
  - name: "Death"
- name: "Seriousness"
  description: "Regulatory seriousness classification for adverse events."
  data:
  - name: "NonSerious"
  - name: "Serious"
- name: "Causality"
  description: "Assessment of the likelihood that a product caused an adverse event."
  data:
  - name: "Certain"
  - name: "Probable"
  - name: "Possible"
  - name: "Unlikely"
  - name: "Unassessable"
- name: "PackagingLevel"
  description: "Hierarchical level of packaging used for serialization and logistics."
  data:
  - name: "Unit"
  - name: "InnerPack"
  - name: "Carton"
  - name: "Case"
  - name: "Pallet"
- name: "SerializationStatus"
  description: "State of a serialized identifier through its lifecycle."
  data:
  - name: "Commissioned"
  - name: "Aggregated"
  - name: "Decommissioned"
- name: "InventoryStatus"
  description: "Availability or restriction state of inventory."
  data:
  - name: "Available"
  - name: "Reserved"
  - name: "Quarantined"
  - name: "Damaged"
  - name: "Expired"
- name: "SupplierQualificationStatus"
  description: "Qualification standing of a supplier following audits and assessments."
  data:
  - name: "Approved"
  - name: "ConditionallyApproved"
  - name: "Pending"
  - name: "Disqualified"
- name: "GMPComplianceStatus"
  description: "Outcome of regulatory GMP compliance evaluations."
  data:
  - name: "Compliant"
  - name: "NeedsCAPA"
  - name: "NonCompliant"
- name: "StorageCondition"
  description: "Temperature and handling environment required for materials and products."
  data:
  - name: "Ambient"
  - name: "Refrigerated"
  - name: "Frozen"
  - name: "DeepFrozen"
  - name: "ControlledRoomTemp"
- name: "ManufacturingStepType"
  description: "Process category representing a distinct stage in manufacturing."
  data:
  - name: "Granulation"
  - name: "Compression"
  - name: "Coating"
  - name: "Blending"
  - name: "Filling"
  - name: "Lyophilization"
  - name: "Sterilization"
  - name: "Packaging"
- name: "PVCaseStatus"
  description: "Workflow status for pharmacovigilance cases."
  data:
  - name: "New"
  - name: "Ongoing"
  - name: "Closed"
  - name: "Reported"
- name: "ActionStatus"
  description: "Execution status of a corrective action within recall or quality processes."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
- name: "DeviationSeverity"
  description: "Criticality rating for a quality deviation."
  data:
  - name: "Minor"
  - name: "Major"
  - name: "Critical"
- name: "CAPAStatus"
  description: "Progress state of a corrective and preventive action."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "Verified"
  - name: "Closed"
valueObjects:
- name: "CASNumber"
  description: "Registry identifier assigned by the Chemical Abstracts Service for\
    \ unique chemicals."
  data:
  - name: "value"
    type: "String"
- name: "GTIN"
  description: "Global Trade Item Number used to uniquely identify trade items."
  data:
  - name: "value"
    type: "String"
- name: "NDC"
  description: "National Drug Code used to identify drug products in the United States."
  data:
  - name: "value"
    type: "String"
- name: "BatchNumber"
  description: "Unique identifier for a manufactured lot ensuring full traceability."
  data:
  - name: "value"
    type: "String"
- name: "MarketingAuthorizationNumber"
  description: "Official identifier for a granted marketing authorization in a jurisdiction."
  data:
  - name: "value"
    type: "String"
- name: "Strength"
