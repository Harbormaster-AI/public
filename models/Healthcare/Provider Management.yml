- name: "ProviderOrganization"
  description: "Legal entity that employs or contracts with providers and operates\
    \ healthcare facilities and departments."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "taxId"
    type: "String"
  - name: "registeredAddress"
    type: "Address"
  - name: "primaryContact"
    type: "ContactPoint"
  relations:
  - name: "facilities"
    type: "Facility"
    multiplicity: "OneToMany"
  - name: "departments"
    type: "Department"
    multiplicity: "OneToMany"
  - name: "providerGroups"
    type: "ProviderGroup"
    multiplicity: "OneToMany"
  - name: "providers"
    type: "Provider"
    multiplicity: "OneToMany"
  - name: "payerNetworks"
    type: "PayerNetwork"
    multiplicity: "ManyToMany"
