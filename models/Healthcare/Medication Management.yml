---
metadata:
  name: "HCIDL Capabilities Model - Medication Management"
  description: "Canonical capabilities model for managing the lifecycle of medications,\
    \ including ordering, dispensing, administration, reconciliation, and safety controls\
    \ across care settings."
  version: "1.0.0"
  industry: "Healthcare"
  category: "Healthcare"
  type: "Capability"
  domain: "Medication Management"
entities:
- name: "MedicationProduct"
  description: "Medicinal product definition used for prescribing, dispensing, and\
    \ administration."
  data:
  - name: "brandName"
    type: "String"
  - name: "genericName"
    type: "String"
  - name: "dosageForm"
    type: "DosageForm"
  - name: "strengthDescription"
    type: "String"
  - name: "route"
    type: "RouteOfAdministration"
  - name: "rxNormCode"
    type: "String"
  - name: "ndcCode"
    type: "String"
  - name: "status"
    type: "MedicationProductStatus"
  relations:
  - name: "ingredients"
    type: "ActiveIngredient"
    multiplicity: "ManyToMany"
  - name: "formularies"
    type: "MedicationFormulary"
    multiplicity: "ManyToMany"
- name: "ActiveIngredient"
  description: "Pharmacologically active substance that contributes to the clinical\
    \ effect of a medication product."
  data:
  - name: "name"
    type: "String"
  - name: "atcCode"
    type: "String"
  - name: "substanceClass"
    type: "String"
  relations:
  - name: "products"
    type: "MedicationProduct"
    multiplicity: "ManyToMany"
  - name: "interactionRules"
    type: "InteractionRule"
    multiplicity: "ManyToMany"
- name: "Patient"
  description: "Individual receiving care and subject to medication management activities."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "dateOfBirth"
    type: "Date"
  - name: "sex"
    type: "Sex"
  - name: "weightKg"
    type: "Decimal"
  - name: "heightCm"
    type: "Integer"
  relations:
  - name: "medicationOrders"
    type: "MedicationOrder"
    multiplicity: "OneToMany"
  - name: "medicationDispenses"
    type: "MedicationDispense"
    multiplicity: "OneToMany"
  - name: "administrations"
    type: "MedicationAdministration"
    multiplicity: "OneToMany"
  - name: "medicationStatements"
    type: "MedicationStatement"
    multiplicity: "OneToMany"
  - name: "medicationAllergies"
    type: "MedicationAllergy"
    multiplicity: "OneToMany"
  - name: "preferredPharmacy"
    type: "Pharmacy"
    multiplicity: "ManyToOne"
- name: "Practitioner"
  description: "Licensed healthcare professional involved in prescribing, dispensing,\
    \ or administering medications."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "roleType"
    type: "PractitionerRole"
  - name: "licenseNumber"
    type: "String"
  - name: "deaNumber"
    type: "String"
  - name: "specialty"
    type: "String"
  relations:
  - name: "orders"
    type: "MedicationOrder"
    multiplicity: "OneToMany"
  - name: "dispenses"
    type: "MedicationDispense"
    multiplicity: "OneToMany"
  - name: "administrations"
    type: "MedicationAdministration"
    multiplicity: "OneToMany"
  - name: "pharmacy"
    type: "Pharmacy"
    multiplicity: "ManyToOne"
- name: "Pharmacy"
  description: "Licensed dispensing organization that prepares and provides medications\
    \ to patients."
  data:
  - name: "name"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "practitioners"
    type: "Practitioner"
    multiplicity: "OneToMany"
  - name: "dispenseRequests"
    type: "DispenseRequest"
    multiplicity: "OneToMany"
  - name: "dispenses"
    type: "MedicationDispense"
    multiplicity: "OneToMany"
- name: "MedicationOrder"
  description: "Clinically authorized instruction to supply and use a specific medication\
    \ for a patient."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "status"
    type: "MedicationOrderStatus"
  - name: "priority"
    type: "OrderPriority"
  - name: "authoredOn"
    type: "Date"
  - name: "substitution"
    type: "SubstitutionPermission"
  - name: "intendedDurationDays"
    type: "Integer"
  - name: "notes"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "prescriber"
    type: "Practitioner"
    multiplicity: "ManyToOne"
  - name: "medicationProduct"
    type: "MedicationProduct"
    multiplicity: "ManyToOne"
  - name: "dosageInstructions"
    type: "DosageInstruction"
    multiplicity: "OneToMany"
  - name: "dispenseRequests"
    type: "DispenseRequest"
    multiplicity: "OneToMany"
- name: "DosageInstruction"
  description: "Patient-specific directions for how the medication should be taken\
    \ or administered."
  data:
  - name: "text"
    type: "String"
  - name: "dose"
    type: "Dose"
  - name: "frequency"
    type: "Frequency"
  - name: "route"
    type: "RouteOfAdministration"
  - name: "method"
    type: "AdministrationMethod"
  - name: "asNeededIndicator"
    type: "AsNeededIndicator"
  - name: "patientInstruction"
    type: "String"
  relations:
  - name: "medicationOrder"
    type: "MedicationOrder"
    multiplicity: "ManyToOne"
- name: "DispenseRequest"
  description: "Authorization and parameters for a pharmacy to prepare and supply\
    \ medication."
  data:
  - name: "quantity"
    type: "Quantity"
  - name: "numberOfRepeatsAllowed"
    type: "Integer"
  - name: "expectedSupplyDays"
    type: "Integer"
  - name: "validityStart"
    type: "Date"
  - name: "validityEnd"
    type: "Date"
  - name: "deliveryOption"
    type: "DispenseDeliveryOption"
  relations:
  - name: "medicationOrder"
    type: "MedicationOrder"
    multiplicity: "ManyToOne"
  - name: "destination"
    type: "Pharmacy"
    multiplicity: "ManyToOne"
- name: "MedicationDispense"
  description: "Record of medication prepared and provided to a patient or caregiver."
  data:
  - name: "dispenseNumber"
    type: "String"
  - name: "status"
    type: "MedicationDispenseStatus"
  - name: "whenPrepared"
    type: "Date"
  - name: "whenHandedOver"
    type: "Date"
  - name: "quantity"
    type: "Quantity"
  - name: "daysSupply"
    type: "Integer"
  - name: "notes"
    type: "String"
  relations:
  - name: "medicationOrder"
    type: "MedicationOrder"
    multiplicity: "ManyToOne"
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "dispenser"
    type: "Practitioner"
    multiplicity: "ManyToOne"
  - name: "medicationProduct"
    type: "MedicationProduct"
    multiplicity: "ManyToOne"
  - name: "pharmacy"
    type: "Pharmacy"
    multiplicity: "ManyToOne"
- name: "MedicationAdministration"
  description: "Event documenting that a dose of medication was administered to a\
    \ patient."
  data:
  - name: "administrationDate"
    type: "Date"
  - name: "status"
    type: "MedicationAdministrationStatus"
  - name: "route"
    type: "RouteOfAdministration"
  - name: "method"
    type: "AdministrationMethod"
  - name: "dose"
    type: "Dose"
  - name: "site"
    type: "BodySite"
  - name: "reasonNote"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "performer"
    type: "Practitioner"
    multiplicity: "ManyToOne"
  - name: "medicationProduct"
    type: "MedicationProduct"
    multiplicity: "ManyToOne"
  - name: "relatedDispense"
    type: "MedicationDispense"
    multiplicity: "ManyToOne"
- name: "MedicationStatement"
  description: "Record of a medication that a patient is believed to be taking, often\
    \ self-reported or inferred."
  data:
  - name: "status"
    type: "MedicationStatementStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "adherence"
    type: "AdherenceStatus"
  - name: "source"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "medicationProduct"
    type: "MedicationProduct"
    multiplicity: "ManyToOne"
- name: "MedicationAllergy"
  description: "Documented intolerance or allergic reaction risk related to a medication\
    \ or ingredient."
  data:
  - name: "substanceName"
    type: "String"
  - name: "status"
    type: "AllergyStatus"
  - name: "criticality"
    type: "AllergyCriticality"
  - name: "reactionDescription"
    type: "String"
  - name: "onsetDate"
    type: "Date"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
- name: "InteractionRule"
  description: "Clinical rule describing potential interactions between medications\
    \ or ingredients and their management guidance."
  data:
  - name: "description"
    type: "String"
  - name: "severity"
    type: "InteractionSeverity"
  - name: "mechanism"
    type: "String"
  - name: "managementGuidance"
    type: "String"
  relations:
  - name: "relatedIngredients"
    type: "ActiveIngredient"
    multiplicity: "ManyToMany"
  - name: "relatedProducts"
    type: "MedicationProduct"
    multiplicity: "ManyToMany"
- name: "MedicationFormulary"
  description: "Catalog of medications with coverage and usage policies defined by\
    \ a payer or organization."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "managingOrganization"
    type: "String"
  relations:
  - name: "coveredProducts"
    type: "MedicationProduct"
    multiplicity: "ManyToMany"
  - name: "restrictions"
    type: "FormularyRestriction"
    multiplicity: "OneToMany"
- name: "FormularyRestriction"
  description: "Policy constraint applied to a product within a formulary, such as\
    \ prior authorization or quantity limits."
  data:
  - name: "restrictionType"
    type: "FormularyRestrictionType"
  - name: "notes"
    type: "String"
  - name: "maxQuantityPerFill"
    type: "Integer"
  - name: "maxDaysSupply"
    type: "Integer"
  - name: "stepTherapy"
    type: "StepTherapyRequirement"
  relations:
  - name: "formulary"
    type: "MedicationFormulary"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "MedicationProduct"
    multiplicity: "ManyToOne"
  - name: "priorAuthorization"
    type: "PriorAuthorizationCriteria"
    multiplicity: "OneToOne"
- name: "PriorAuthorizationCriteria"
  description: "Clinical and administrative conditions that must be satisfied before\
    \ coverage approval for a medication."
  data:
  - name: "criteriaText"
    type: "String"
  - name: "minAgeYears"
    type: "Integer"
  - name: "requiredDiagnosisCodes"
    type: "String"
  - name: "prescriberQualifications"
    type: "String"
  relations:
  - name: "restriction"
    type: "FormularyRestriction"
    multiplicity: "OneToOne"
enums:
- name: "DosageForm"
  description: "Physical form in which a medication is produced and administered."
  data:
  - name: "Tablet"
  - name: "Capsule"
  - name: "Solution"
  - name: "Suspension"
  - name: "Injection"
  - name: "Ointment"
  - name: "Cream"
  - name: "Inhalation"
  - name: "Suppository"
  - name: "Patch"
- name: "RouteOfAdministration"
  description: "Path by which a medication is introduced into or onto the body."
  data:
  - name: "Oral"
  - name: "Intravenous"
  - name: "Intramuscular"
  - name: "Subcutaneous"
  - name: "Topical"
  - name: "Inhalation"
  - name: "Sublingual"
  - name: "Transdermal"
  - name: "Rectal"
  - name: "Nasal"
  - name: "Ophthalmic"
  - name: "Otic"
- name: "MedicationProductStatus"
  description: "Availability state of a medication product for use."
  data:
  - name: "Active"
  - name: "Discontinued"
- name: "MedicationOrderStatus"
  description: "Lifecycle state of a medication order."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
  - name: "EnteredInError"
  - name: "Stopped"
- name: "OrderPriority"
  description: "Clinical urgency associated with a medication order."
  data:
  - name: "Routine"
  - name: "Urgent"
  - name: "Stat"
  - name: "ASAP"
- name: "SubstitutionPermission"
  description: "Authorization for a pharmacist to substitute equivalent medications."
  data:
  - name: "Allowed"
  - name: "NotAllowed"
  - name: "AllowedFormOnly"
- name: "AdministrationMethod"
  description: "Technique used to administer the medication."
  data:
  - name: "Swallow"
  - name: "Infusion"
  - name: "Injection"
  - name: "Inhalation"
  - name: "Apply"
  - name: "Dissolve"
  - name: "Chew"
  - name: "Rinse"
- name: "MedicationDispenseStatus"
  description: "State of a dispense event from preparation to completion."
  data:
  - name: "Preparation"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
  - name: "EnteredInError"
- name: "MedicationAdministrationStatus"
  description: "Status of a medication administration event."
  data:
  - name: "InProgress"
  - name: "Completed"
  - name: "OnHold"
  - name: "Stopped"
  - name: "NotDone"
  - name: "EnteredInError"
- name: "PractitionerRole"
  description: "Primary professional role of a practitioner in medication processes."
  data:
  - name: "Physician"
  - name: "Pharmacist"
  - name: "Nurse"
  - name: "PhysicianAssistant"
  - name: "NursePractitioner"
  - name: "Dentist"
  - name: "Midwife"
- name: "Sex"
  description: "Administrative sex designation for clinical use."
  data:
  - name: "Female"
  - name: "Male"
  - name: "Other"
  - name: "Unknown"
- name: "AllergyCriticality"
  description: "Estimated clinical risk of a reaction if the patient is exposed."
  data:
  - name: "Low"
  - name: "High"
  - name: "UnableToAssess"
- name: "AllergyStatus"
  description: "Current status of the recorded allergy or intolerance."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Resolved"
  - name: "EnteredInError"
- name: "InteractionSeverity"
  description: "Clinical significance level of a potential drug interaction."
  data:
  - name: "Minor"
  - name: "Moderate"
  - name: "Major"
  - name: "Contraindicated"
- name: "FormularyRestrictionType"
  description: "Category of policy constraint used by a formulary."
  data:
  - name: "PriorAuthorization"
  - name: "QuantityLimit"
  - name: "StepTherapy"
  - name: "AgeLimit"
- name: "StepTherapyRequirement"
  description: "Required sequencing of therapies before coverage is approved."
  data:
  - name: "NotRequired"
  - name: "RequiredFirstLine"
  - name: "RequiredMultiStep"
- name: "BodySite"
  description: "Anatomical location used for administration."
  data:
  - name: "LeftArm"
  - name: "RightArm"
  - name: "LeftThigh"
  - name: "RightThigh"
  - name: "Abdomen"
  - name: "Buttock"
  - name: "UpperChest"
  - name: "Other"
- name: "AsNeededIndicator"
  description: "Whether the medication is taken only as needed or on a schedule."
  data:
  - name: "AsNeeded"
  - name: "Scheduled"
- name: "DispenseDeliveryOption"
  description: "Method by which the dispensed medication is delivered to the patient."
  data:
  - name: "Pickup"
  - name: "Mail"
  - name: "Courier"
- name: "MedicationStatementStatus"
  description: "State of a documented patient-reported or inferred medication use."
  data:
  - name: "Active"
  - name: "Completed"
  - name: "EnteredInError"
  - name: "Intended"
  - name: "Stopped"
  - name: "OnHold"
- name: "AdherenceStatus"
  description: "Degree to which the patient is taking the medication as prescribed."
  data:
  - name: "Taking"
  - name: "NotTaking"
  - name: "Unknown"
valueObjects:
- name: "Dose"
  description: "Quantity of medication administered or to be administered at one time."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "unit"
    type: "String"
- name: "Quantity"
  description: "Measurable amount of a medication product for dispense or supply."
  data:
  - name: "value"
    type: "Decimal"
  - name: "unit"
    type: "String"
- name: "Frequency"
  description: "Repetition pattern specifying how often a dose should be taken."
  data:
  - name: "repeat"
    type: "Integer"
  - name: "period"
    type: "Integer"
  - name: "periodUnit"
    type: "String"
- name: "Address"
  description: "Mailing or physical location used for pharmacy and contact purposes."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
