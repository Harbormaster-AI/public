---
metadata:
  name: "Claims Processing HCIDL Capability Model"
  description: "Capability model for healthcare claims intake, validation, adjudication,\
    \ payment, and post-payment activities across payers, providers, and intermediaries."
  version: "1.0.0"
  industry: "Healthcare"
  category: "Healthcare"
  type: "Capability"
  domain: "Claims Processing"
entities:
- name: "Payer"
  description: "Health insurance organization responsible for funding and adjudicating\
    \ covered services."
  data:
  - name: "name"
    type: "String"
  - name: "payerType"
    type: "PayerType"
  - name: "naicCode"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "plans"
    type: "CoveragePlan"
    multiplicity: "OneToMany"
  - name: "providerContracts"
    type: "ProviderContract"
    multiplicity: "OneToMany"
  - name: "remittanceAdvices"
    type: "RemittanceAdvice"
    multiplicity: "OneToMany"
  - name: "clearinghouses"
    type: "Clearinghouse"
    multiplicity: "ManyToMany"
- name: "Provider"
  description: "Individual practitioner or organization that renders healthcare services\
    \ and submits claims."
  data:
  - name: "name"
    type: "String"
  - name: "npi"
    type: "NPI"
  - name: "taxIdentifier"
    type: "TaxIdentifier"
  - name: "providerType"
    type: "ProviderType"
  - name: "address"
    type: "Address"
  relations:
  - name: "contracts"
    type: "ProviderContract"
    multiplicity: "OneToMany"
  - name: "claims"
    type: "Claim"
    multiplicity: "OneToMany"
  - name: "remittanceAdvices"
    type: "RemittanceAdvice"
    multiplicity: "OneToMany"
- name: "Clearinghouse"
  description: "Intermediary that routes, validates, and translates electronic claim\
    \ and remittance transactions."
  data:
  - name: "name"
    type: "String"
  - name: "tradingPartnerId"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "payers"
    type: "Payer"
    multiplicity: "ManyToMany"
  - name: "providers"
    type: "Provider"
    multiplicity: "ManyToMany"
  - name: "claimSubmissions"
    type: "ClaimSubmission"
    multiplicity: "OneToMany"
- name: "ProviderContract"
  description: "Agreement between payer and provider defining reimbursement terms,\
    \ covered services, and participation."
  data:
  - name: "contractName"
    type: "String"
  - name: "networkStatus"
    type: "NetworkStatus"
  - name: "effectivePeriod"
    type: "DateRange"
  relations:
  - name: "payer"
    type: "Payer"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "Provider"
    multiplicity: "ManyToOne"
  - name: "feeSchedules"
    type: "FeeSchedule"
    multiplicity: "OneToMany"
- name: "FeeSchedule"
  description: "Catalog of procedure or service rates used to price claims under a\
    \ contract."
  data:
  - name: "name"
    type: "String"
  - name: "pricingMethod"
    type: "PricingMethod"
  - name: "effectivePeriod"
    type: "DateRange"
  relations:
  - name: "contract"
    type: "ProviderContract"
    multiplicity: "ManyToOne"
  - name: "entries"
    type: "FeeScheduleEntry"
    multiplicity: "OneToMany"
- name: "FeeScheduleEntry"
  description: "A specific procedure pricing rule within a fee schedule."
  data:
  - name: "procedureCode"
    type: "ProcedureCode"
  - name: "rate"
    type: "Money"
  - name: "modifier"
    type: "String"
  relations:
  - name: "feeSchedule"
    type: "FeeSchedule"
    multiplicity: "ManyToOne"
- name: "Member"
  description: "Person covered under a plan who is eligible to receive benefits and\
    \ for whom claims are processed."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "memberIdentifier"
    type: "MemberIdentifier"
  - name: "dateOfBirth"
    type: "Date"
  - name: "address"
    type: "Address"
  relations:
  - name: "coverages"
    type: "CoverageEnrollment"
    multiplicity: "OneToMany"
  - name: "claims"
    type: "Claim"
    multiplicity: "OneToMany"
  - name: "appeals"
    type: "Appeal"
    multiplicity: "OneToMany"
  - name: "eobs"
    type: "ExplanationOfBenefits"
    multiplicity: "OneToMany"
- name: "CoveragePlan"
  description: "Benefit plan that defines covered services, cost-sharing, and plan\
    \ rules."
  data:
  - name: "name"
    type: "String"
  - name: "planType"
    type: "PlanType"
  - name: "policyNumber"
    type: "PolicyNumber"
  - name: "deductible"
    type: "Money"
  - name: "coinsurancePercent"
    type: "Decimal"
  relations:
  - name: "payer"
    type: "Payer"
    multiplicity: "ManyToOne"
  - name: "enrollments"
    type: "CoverageEnrollment"
    multiplicity: "OneToMany"
- name: "CoverageEnrollment"
  description: "Member’s enrollment record linking a person to a plan and coverage\
    \ level over a time period."
  data:
  - name: "coverageLevel"
    type: "String"
  - name: "effectivePeriod"
    type: "DateRange"
  - name: "groupNumber"
    type: "String"
  - name: "isSubscriber"
    type: "Boolean"
  relations:
  - name: "member"
    type: "Member"
    multiplicity: "ManyToOne"
  - name: "plan"
    type: "CoveragePlan"
    multiplicity: "ManyToOne"
  - name: "primaryCareProvider"
    type: "Provider"
    multiplicity: "ManyToOne"
- name: "PriorAuthorization"
  description: "Approval granted before services are rendered indicating coverage\
    \ intent for specific services."
  data:
  - name: "authorizationNumber"
    type: "String"
  - name: "status"
    type: "AuthorizationStatus"
  - name: "serviceType"
    type: "String"
  - name: "approvedAmount"
    type: "Money"
  - name: "validPeriod"
    type: "DateRange"
  relations:
  - name: "member"
    type: "Member"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "Provider"
    multiplicity: "ManyToOne"
  - name: "plan"
    type: "CoveragePlan"
    multiplicity: "ManyToOne"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "claimLines"
    type: "ClaimLine"
    multiplicity: "OneToMany"
- name: "Claim"
  description: "Request for payment for healthcare services submitted by a provider\
    \ on behalf of a member."
  data:
  - name: "claimNumber"
    type: "ClaimNumber"
  - name: "claimType"
    type: "ClaimType"
  - name: "status"
    type: "ClaimStatus"
  - name: "servicePeriod"
    type: "DateRange"
  - name: "billedAmount"
    type: "Money"
  - name: "placeOfService"
    type: "PlaceOfService"
  - name: "billType"
    type: "String"
  relations:
  - name: "member"
    type: "Member"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "Provider"
    multiplicity: "ManyToOne"
  - name: "plan"
    type: "CoveragePlan"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "ClaimLine"
    multiplicity: "OneToMany"
  - name: "diagnoses"
    type: "Diagnosis"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "priorAuthorization"
    type: "PriorAuthorization"
    multiplicity: "ManyToOne"
  - name: "submissions"
    type: "ClaimSubmission"
    multiplicity: "OneToMany"
  - name: "adjudication"
    type: "ClaimAdjudication"
    multiplicity: "OneToOne"
  - name: "settlements"
    type: "ClaimSettlement"
    multiplicity: "OneToMany"
  - name: "coordinationOfBenefits"
    type: "CoordinationOfBenefits"
    multiplicity: "OneToMany"
  - name: "appeals"
    type: "Appeal"
    multiplicity: "OneToMany"
  - name: "eob"
    type: "ExplanationOfBenefits"
    multiplicity: "OneToOne"
- name: "ClaimLine"
  description: "Line-level detail for a specific service, procedure, or item within\
    \ a claim."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "procedureCode"
    type: "ProcedureCode"
  - name: "units"
    type: "Integer"
  - name: "billedAmount"
    type: "Money"
  - name: "revenueCode"
    type: "String"
  - name: "modifiers"
    type: "String"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "diagnoses"
    type: "Diagnosis"
    multiplicity: "ManyToMany"
  - name: "priorAuthorization"
    type: "PriorAuthorization"
    multiplicity: "ManyToOne"
  - name: "lineAdjudications"
    type: "LineAdjudication"
    multiplicity: "OneToMany"
  - name: "lineSettlements"
    type: "LineSettlement"
    multiplicity: "OneToMany"
- name: "Diagnosis"
  description: "Clinical diagnosis associated with a claim or line used for medical\
    \ necessity and coding."
  data:
  - name: "code"
    type: "DiagnosisCode"
  - name: "diagnosisType"
    type: "DiagnosisType"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "ClaimLine"
    multiplicity: "ManyToMany"
- name: "ClaimEdit"
  description: "Automated validation or policy check result applied to a claim or\
    \ claim line prior to adjudication."
  data:
  - name: "editCode"
    type: "String"
  - name: "editCategory"
    type: "EditCategory"
  - name: "severity"
    type: "EditSeverity"
  - name: "message"
    type: "String"
  - name: "status"
    type: "EditStatus"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "claimLine"
    type: "ClaimLine"
    multiplicity: "ManyToOne"
- name: "ClaimSubmission"
  description: "Transmission event that delivers a claim to a payer, directly or via\
    \ a clearinghouse."
  data:
  - name: "submissionDate"
    type: "Date"
  - name: "channel"
    type: "SubmissionChannel"
  - name: "status"
    type: "SubmissionStatus"
  - name: "controlNumber"
    type: "EDIControlNumber"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "payer"
    type: "Payer"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "Provider"
    multiplicity: "ManyToOne"
  - name: "clearinghouse"
    type: "Clearinghouse"
    multiplicity: "ManyToOne"
- name: "Attachment"
  description: "Supporting documentation such as clinical notes or reports linked\
    \ to a claim or authorization."
  data:
  - name: "attachmentType"
    type: "AttachmentType"
  - name: "fileName"
    type: "String"
  - name: "contentType"
    type: "String"
  - name: "sizeBytes"
    type: "Integer"
  - name: "transmittedVia"
    type: "TransmissionMethod"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "priorAuthorization"
    type: "PriorAuthorization"
    multiplicity: "ManyToOne"
- name: "ClaimAdjudication"
  description: "Claim-level adjudication outcome capturing pricing method, totals,\
    \ and overall status."
  data:
  - name: "status"
    type: "ClaimAdjudicationStatus"
  - name: "pricingMethod"
    type: "PricingMethod"
  - name: "allowedAmount"
    type: "Money"
  - name: "totalPatientResponsibility"
    type: "Money"
  - name: "adjudicatedDate"
    type: "Date"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "OneToOne"
  - name: "lineAdjudications"
    type: "LineAdjudication"
    multiplicity: "OneToMany"
  - name: "adjustmentReasons"
    type: "AdjustmentReason"
    multiplicity: "ManyToMany"
- name: "LineAdjudication"
  description: "Adjudication result for a specific claim line including allowed and\
    \ member liability amounts."
  data:
  - name: "status"
    type: "LineAdjudicationStatus"
  - name: "allowedAmount"
    type: "Money"
  - name: "copay"
    type: "Money"
  - name: "coinsurance"
    type: "Money"
  - name: "deductibleApplied"
    type: "Money"
  relations:
  - name: "claimLine"
    type: "ClaimLine"
    multiplicity: "ManyToOne"
  - name: "adjudication"
    type: "ClaimAdjudication"
    multiplicity: "ManyToOne"
  - name: "reasons"
    type: "AdjustmentReason"
    multiplicity: "ManyToMany"
- name: "AdjustmentReason"
  description: "Code-based explanation for reductions, denials, or other adjudication\
    \ adjustments."
  data:
  - name: "code"
    type: "String"
  - name: "reasonCategory"
    type: "DenialCategory"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "lineAdjudications"
    type: "LineAdjudication"
    multiplicity: "ManyToMany"
  - name: "claimAdjudications"
    type: "ClaimAdjudication"
    multiplicity: "ManyToMany"
  - name: "lineSettlements"
    type: "LineSettlement"
    multiplicity: "ManyToMany"
- name: "CoordinationOfBenefits"
  description: "Information about other coverage used to coordinate payments across\
    \ multiple payers."
  data:
  - name: "cobRole"
    type: "COBRole"
  - name: "otherPayerName"
    type: "String"
  - name: "otherPayerPolicyNumber"
    type: "PolicyNumber"
  - name: "allowedAmount"
    type: "Money"
  - name: "paidAmount"
    type: "Money"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
- name: "RemittanceAdvice"
  description: "Statement from payer detailing adjudication results and payments issued\
    \ to a provider."
  data:
  - name: "remittanceNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "traceNumber"
    type: "String"
  relations:
  - name: "payer"
    type: "Payer"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "Provider"
    multiplicity: "ManyToOne"
  - name: "claimSettlements"
    type: "ClaimSettlement"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
- name: "ClaimSettlement"
  description: "Remittance-level summary amounts for a single claim."
  data:
  - name: "totalBilled"
    type: "Money"
  - name: "totalAllowed"
    type: "Money"
  - name: "totalPaid"
    type: "Money"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "remittanceAdvice"
    type: "RemittanceAdvice"
    multiplicity: "ManyToOne"
  - name: "lineSettlements"
    type: "LineSettlement"
    multiplicity: "OneToMany"
- name: "LineSettlement"
  description: "Paid amounts and member responsibility for an individual adjudicated\
    \ claim line."
  data:
  - name: "paidAmount"
    type: "Money"
  - name: "patientResponsibility"
    type: "Money"
  relations:
  - name: "claimLine"
    type: "ClaimLine"
    multiplicity: "ManyToOne"
  - name: "claimSettlement"
    type: "ClaimSettlement"
    multiplicity: "ManyToOne"
  - name: "adjustmentReasons"
    type: "AdjustmentReason"
    multiplicity: "ManyToMany"
- name: "Payment"
  description: "Financial disbursement made to a provider as part of a remittance\
    \ advice."
  data:
  - name: "amount"
    type: "Money"
  - name: "paymentMethod"
    type: "PaymentMethod"
  - name: "paymentDate"
    type: "Date"
  - name: "referenceNumber"
    type: "String"
  - name: "eftStatus"
    type: "EFTStatus"
  relations:
  - name: "remittanceAdvice"
    type: "RemittanceAdvice"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "Provider"
    multiplicity: "ManyToOne"
- name: "ExplanationOfBenefits"
  description: "Member-facing summary showing how a claim was processed and what amounts\
    \ are owed."
  data:
  - name: "eobNumber"
    type: "String"
  - name: "sentDate"
    type: "Date"
  - name: "totalPatientResponsibility"
    type: "Money"
  relations:
  - name: "member"
    type: "Member"
    multiplicity: "ManyToOne"
  - name: "claim"
    type: "Claim"
    multiplicity: "OneToOne"
  - name: "remittanceAdvice"
    type: "RemittanceAdvice"
    multiplicity: "ManyToOne"
- name: "Appeal"
  description: "Formal request to review and reconsider a claim decision."
  data:
  - name: "appealNumber"
    type: "String"
  - name: "status"
    type: "AppealStatus"
  - name: "reason"
    type: "String"
  - name: "submittedDate"
    type: "Date"
  - name: "outcome"
    type: "AppealOutcome"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "member"
    type: "Member"
    multiplicity: "ManyToOne"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
- name: "OverpaymentRecovery"
  description: "Process to recover funds paid in excess of the correct amount."
  data:
  - name: "recoveryNumber"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "RecoveryStatus"
  - name: "initiatedDate"
    type: "Date"
  relations:
  - name: "provider"
    type: "Provider"
    multiplicity: "ManyToOne"
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "remittanceAdvice"
    type: "RemittanceAdvice"
    multiplicity: "ManyToOne"
  - name: "payment"
    type: "Payment"
    multiplicity: "ManyToOne"
enums:
- name: "PayerType"
  description: "Classification of the organization funding benefits."
  data:
  - name: "Commercial"
  - name: "Government"
  - name: "TPA"
  - name: "SelfFunded"
- name: "ProviderType"
  description: "Primary role or facility type of the service provider."
  data:
  - name: "Professional"
  - name: "Facility"
  - name: "Laboratory"
  - name: "Pharmacy"
  - name: "Ancillary"
- name: "PlanType"
  description: "Structural design of the health plan and network management."
  data:
  - name: "HMO"
  - name: "PPO"
  - name: "EPO"
  - name: "POS"
  - name: "MedicareAdvantage"
  - name: "MedicaidManagedCare"
- name: "NetworkStatus"
  description: "Indicates whether the provider participates under contract terms for\
    \ the plan."
  data:
  - name: "InNetwork"
  - name: "OutOfNetwork"
- name: "ClaimType"
  description: "Claim format and benefit category being billed."
  data:
  - name: "Professional"
  - name: "Institutional"
  - name: "Dental"
  - name: "Pharmacy"
- name: "ClaimStatus"
  description: "Lifecycle state of a claim from intake through completion."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Received"
  - name: "InReview"
  - name: "PendingInfo"
  - name: "Adjudicated"
  - name: "Denied"
  - name: "Adjusted"
  - name: "Paid"
  - name: "Voided"
  - name: "Closed"
- name: "ClaimAdjudicationStatus"
  description: "Outcome of the claim-level adjudication process."
  data:
  - name: "Approved"
  - name: "PartiallyApproved"
  - name: "Denied"
  - name: "Adjusted"
- name: "LineAdjudicationStatus"
  description: "Determination for an individual line item."
  data:
  - name: "Allowed"
  - name: "Denied"
  - name: "Reduced"
  - name: "Bundled"
  - name: "NotCovered"
  - name: "Pending"
- name: "PricingMethod"
  description: "Method used to calculate allowed amounts."
  data:
  - name: "ContractRate"
  - name: "FeeSchedule"
  - name: "UsualCustomary"
  - name: "DRG"
  - name: "APC"
  - name: "PerDiem"
  - name: "PercentOfCharge"
- name: "PlaceOfService"
  description: "CMS-defined location indicating where services were rendered."
  data:
  - name: "Office"
  - name: "InpatientHospital"
  - name: "OutpatientHospital"
  - name: "EmergencyRoom"
  - name: "UrgentCare"
  - name: "Home"
  - name: "Telehealth"
- name: "AttachmentType"
  description: "Category of supporting document associated with a claim or authorization."
  data:
  - name: "ClinicalNotes"
  - name: "OperativeReport"
  - name: "ImagingReport"
  - name: "ReferralLetter"
  - name: "Prescription"
  - name: "ItemizedBill"
- name: "SubmissionChannel"
  description: "Mechanism by which a claim is delivered to the payer."
  data:
  - name: "EDI"
  - name: "Portal"
  - name: "Fax"
  - name: "Mail"
- name: "SubmissionStatus"
  description: "Transmission state for a submitted claim."
  data:
  - name: "Queued"
  - name: "Transmitted"
  - name: "Acknowledged"
  - name: "Rejected"
- name: "PaymentMethod"
  description: "Method used by the payer to disburse funds."
  data:
  - name: "EFT"
  - name: "Check"
  - name: "VirtualCard"
- name: "EFTStatus"
  description: "Settlement state for an electronic funds transfer."
  data:
  - name: "Initiated"
  - name: "Settled"
  - name: "Returned"
- name: "COBRole"
  description: "Payment priority for a payer participating in coordination of benefits."
  data:
  - name: "Primary"
  - name: "Secondary"
  - name: "Tertiary"
- name: "DiagnosisType"
  description: "Role of the diagnosis in clinical coding and adjudication."
  data:
  - name: "Principal"
  - name: "Secondary"
  - name: "Admitting"
- name: "DenialCategory"
  description: "High-level reason grouping for a denial or reduction."
  data:
  - name: "Coverage"
  - name: "MedicalNecessity"
  - name: "Coding"
  - name: "Billing"
  - name: "Eligibility"
  - name: "TimelyFiling"
- name: "AuthorizationStatus"
  description: "Current standing of a prior authorization request."
  data:
  - name: "Requested"
  - name: "Approved"
  - name: "PartiallyApproved"
  - name: "Denied"
  - name: "Expired"
  - name: "Cancelled"
- name: "EditCategory"
  description: "Classification of a claim edit rule."
  data:
  - name: "Validation"
  - name: "Compliance"
  - name: "Coding"
  - name: "MedicalPolicy"
- name: "EditSeverity"
  description: "Impact level of an edit on claim processing."
  data:
  - name: "Error"
  - name: "Warning"
  - name: "Info"
- name: "EditStatus"
  description: "Resolution state of a claim edit after review."
  data:
  - name: "Triggered"
  - name: "Overridden"
  - name: "Resolved"
- name: "AppealStatus"
  description: "Progress state of an appeal case."
  data:
  - name: "Open"
  - name: "InReview"
  - name: "AdditionalInfoRequested"
  - name: "Decided"
  - name: "Closed"
- name: "AppealOutcome"
  description: "Final decision rendered for an appeal."
  data:
  - name: "Upheld"
  - name: "Overturned"
  - name: "PartiallyOverturned"
  - name: "Dismissed"
- name: "RecoveryStatus"
  description: "Stage of an overpayment recovery effort."
  data:
