  - name: "description"
    type: "String"
  - name: "category"
    type: "GoalCategory"
  - name: "targetDate"
    type: "Date"
  - name: "status"
    type: "GoalStatus"
  - name: "targetMeasure"
    type: "String"
  relations:
  - name: "carePlan"
    type: "CarePlan"
    multiplicity: "ManyToOne"
  - name: "outcomes"
    type: "Outcome"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
- name: "Intervention"
  description: "Coordinated action to achieve goals, such as education or navigation."
  data:
  - name: "name"
    type: "String"
  - name: "interventionType"
    type: "InterventionType"
  - name: "frequency"
    type: "String"
  - name: "duration"
    type: "String"
  - name: "status"
    type: "InterventionStatus"
  relations:
  - name: "carePlan"
    type: "CarePlan"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "CareTask"
    multiplicity: "OneToMany"
  - name: "serviceRequests"
    type: "ServiceRequest"
    multiplicity: "OneToMany"
- name: "CareTask"
  description: "Actionable item assigned to stakeholders to advance the care plan."
  data:
  - name: "title"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "TaskStatus_"
  - name: "priority"
    type: "TaskPriority"
  - name: "channel"
    type: "TaskChannel"
  relations:
  - name: "carePlan"
    type: "CarePlan"
    multiplicity: "ManyToOne"
  - name: "intervention"
    type: "Intervention"
    multiplicity: "ManyToOne"
  - name: "assignments"
    type: "TaskAssignment"
    multiplicity: "OneToMany"
  - name: "relatedEncounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
- name: "TaskAssignment"
  description: "Assignment of a task to a specific assignee with acceptance tracking."
  data:
  - name: "assigneeType"
    type: "AssigneeType"
  - name: "note"
    type: "String"
  - name: "accepted"
    type: "Boolean"
  - name: "assignedDate"
    type: "Date"
  relations:
  - name: "task"
    type: "CareTask"
    multiplicity: "ManyToOne"
  - name: "assigneeProfessional"
    type: "CareProfessional"
    multiplicity: "ManyToOne"
  - name: "assigneePatient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "assigneeCaregiver"
    type: "Caregiver"
    multiplicity: "ManyToOne"
- name: "Assessment"
  description: "Standardized or ad hoc evaluation of patient status or risk."
  data:
  - name: "assessmentName"
    type: "String"
  - name: "assessmentType"
    type: "AssessmentType"
  - name: "tool"
    type: "String"
  - name: "score"
    type: "Decimal"
  - name: "scoreInterpretation"
    type: "String"
  - name: "assessmentDate"
    type: "Date"
  relations:
  - name: "carePlan"
    type: "CarePlan"
    multiplicity: "ManyToOne"
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "relatedEncounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "Referral"
  description: "Directed request to another organization or service for patient care."
