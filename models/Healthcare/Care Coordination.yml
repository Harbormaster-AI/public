---
metadata:
  name: "Care Coordination Capabilities Model"
  description: "Core capability model for coordinating patient care across teams,\
    \ settings, services, and time, emphasizing goals, interventions, tasks, referrals,\
    \ transitions, and outcomes."
  version: "1.0.0"
  industry: "Healthcare"
  category: "Healthcare"
  type: "Capability"
  domain: "Care Coordination"
entities:
- name: "Patient"
  description: "Individual receiving care coordination services."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "dateOfBirth"
    type: "Date"
  - name: "gender"
    type: "AdministrativeGender"
  - name: "preferredLanguage"
    type: "String"
  - name: "primaryPhone"
    type: "String"
  - name: "primaryAddress"
    type: "Address"
  relations:
  - name: "careTeams"
    type: "CareTeam"
    multiplicity: "OneToMany"
  - name: "carePlans"
    type: "CarePlan"
    multiplicity: "OneToMany"
  - name: "conditions"
    type: "Condition"
    multiplicity: "OneToMany"
  - name: "referrals"
    type: "Referral"
    multiplicity: "OneToMany"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
  - name: "encounters"
    type: "Encounter"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "Consent"
    multiplicity: "OneToMany"
  - name: "socialRiskScreenings"
    type: "SocialRiskScreening"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "programEnrollments"
    type: "ProgramEnrollment"
    multiplicity: "OneToMany"
  - name: "communications"
    type: "CareCommunication"
    multiplicity: "OneToMany"
  - name: "caregivers"
    type: "Caregiver"
    multiplicity: "OneToMany"
- name: "CareTeam"
  description: "Coordinated group of professionals and lay caregivers supporting a\
    \ patient."
  data:
  - name: "name"
    type: "String"
  - name: "teamType"
    type: "CareTeamType"
  - name: "status"
    type: "CareTeamStatus"
  - name: "activationDate"
    type: "Date"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "memberships"
    type: "CareTeamMembership"
    multiplicity: "OneToMany"
  - name: "carePlans"
    type: "CarePlan"
    multiplicity: "OneToMany"
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "CareTeamMembership"
  description: "Participation of a professional or caregiver within a care team."
  data:
  - name: "role"
    type: "ProfessionalRole"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "participationStatus"
    type: "ParticipationStatus"
  - name: "membershipNote"
    type: "String"
  relations:
  - name: "careTeam"
    type: "CareTeam"
    multiplicity: "ManyToOne"
  - name: "professional"
    type: "CareProfessional"
    multiplicity: "ManyToOne"
  - name: "caregiver"
    type: "Caregiver"
    multiplicity: "ManyToOne"
- name: "CareProfessional"
  description: "Licensed or certified healthcare professional engaged in care coordination."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "role"
    type: "ProfessionalRole"
  - name: "specialty"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "memberships"
    type: "CareTeamMembership"
    multiplicity: "OneToMany"
  - name: "assignedTasks"
    type: "TaskAssignment"
    multiplicity: "OneToMany"
  - name: "authoredCommunications"
    type: "CareCommunication"
    multiplicity: "OneToMany"
- name: "Caregiver"
  description: "Non-professional individual providing support to the patient."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "relationship"
    type: "CaregiverRelationship"
  - name: "contactMethod"
    type: "ContactMethod"
  - name: "phone"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "taskAssignments"
    type: "TaskAssignment"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "Consent"
    multiplicity: "OneToMany"
- name: "Organization"
  description: "Legal entity delivering health or social services."
  data:
  - name: "name"
    type: "String"
  - name: "organizationType"
    type: "OrganizationType"
  - name: "address"
    type: "Address"
  - name: "phone"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "professionals"
    type: "CareProfessional"
    multiplicity: "OneToMany"
  - name: "serviceLocations"
    type: "ServiceLocation"
    multiplicity: "OneToMany"
  - name: "outgoingReferrals"
    type: "Referral"
    multiplicity: "OneToMany"
  - name: "incomingReferrals"
    type: "Referral"
    multiplicity: "OneToMany"
  - name: "benefitAuthorizations"
    type: "BenefitAuthorization"
    multiplicity: "OneToMany"
- name: "ServiceLocation"
  description: "Physical or virtual setting where services are delivered."
  data:
  - name: "name"
    type: "String"
  - name: "locationType"
    type: "LocationType"
  - name: "address"
    type: "Address"
  - name: "hoursOfOperation"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "encounters"
    type: "Encounter"
    multiplicity: "OneToMany"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
- name: "CarePlan"
  description: "Structured plan of goals, interventions, and tasks for a patient."
  data:
  - name: "planName"
    type: "String"
  - name: "status"
    type: "CarePlanStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "priority"
    type: "CarePriority"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "careTeam"
    type: "CareTeam"
    multiplicity: "ManyToOne"
  - name: "goals"
    type: "CareGoal"
    multiplicity: "OneToMany"
  - name: "interventions"
    type: "Intervention"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "CareTask"
    multiplicity: "OneToMany"
  - name: "assessments"
    type: "Assessment"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "episode"
    type: "CareEpisode"
    multiplicity: "ManyToOne"
- name: "CareGoal"
  description: "Desired health or process outcomes guiding the care plan."
