  data:
  - name: "consentType"
    type: "ConsentType"
  - name: "scope"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "status"
    type: "ConsentStatus"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "granteeOrganization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "granteeProfessional"
    type: "CareProfessional"
    multiplicity: "ManyToOne"
  - name: "caregiver"
    type: "Caregiver"
    multiplicity: "ManyToOne"
- name: "CareEpisode"
  description: "Time-bounded span of coordinated activities focused on a purpose."
