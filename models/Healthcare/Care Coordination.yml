  data:
  - name: "title"
    type: "String"
  - name: "documentType"
    type: "DocumentType"
  - name: "createdOn"
    type: "Date"
  - name: "url"
    type: "String"
  - name: "confidentialityLevel"
    type: "ConfidentialityLevel"
