    type: "Date"
  - name: "clinicalStatus"
    type: "ConditionClinicalStatus"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "carePlans"
    type: "CarePlan"
    multiplicity: "ManyToMany"
- name: "RiskAssessment"
  description: "Computed or clinician-assessed risk relevant to coordination decisions."
  data:
  - name: "modelName"
    type: "String"
  - name: "score"
    type: "Decimal"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "assessedDate"
    type: "Date"
