    type: "Date"
  - name: "acknowledged"
    type: "Boolean"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "relatedTask"
    type: "CareTask"
    multiplicity: "ManyToOne"
  - name: "relatedGoal"
    type: "CareGoal"
    multiplicity: "ManyToOne"
- name: "Outcome"
