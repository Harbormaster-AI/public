- name: "AdministrativeGender"
  description: "Administrative recording of sex or gender used for coordination."
  data:
  - name: "Male"
  - name: "Female"
  - name: "Other"
  - name: "Unknown"
- name: "CareTeamType"
  description: "Organizational focus and structure of a care team."
  data:
  - name: "PrimaryCare"
  - name: "TransitionalCare"
  - name: "Palliative"
  - name: "BehavioralHealth"
  - name: "Maternal"
  - name: "Pediatrics"
  - name: "ComplexCare"
  - name: "RemoteMonitoring"
- name: "CareTeamStatus"
  description: "Operational state of a care team or member participation."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "OnHold"
- name: "ProfessionalRole"
  description: "Functional role of a professional in coordinated care."
