  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "carePlan"
    type: "CarePlan"
    multiplicity: "ManyToOne"
  - name: "referral"
    type: "Referral"
    multiplicity: "ManyToOne"
