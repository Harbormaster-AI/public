  - name: "referralReason"
    type: "String"
  - name: "urgency"
    type: "ReferralUrgency"
  - name: "status"
    type: "ReferralStatus"
  - name: "requestedService"
    type: "String"
  - name: "requestedDate"
    type: "Date"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "fromOrganization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "toOrganization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "carePlan"
    type: "CarePlan"
    multiplicity: "ManyToOne"
  - name: "serviceRequests"
    type: "ServiceRequest"
    multiplicity: "OneToMany"
- name: "ServiceRequest"
