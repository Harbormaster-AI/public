  data:
  - name: "programName"
    type: "String"
  - name: "enrollmentStatus"
    type: "ProgramEnrollmentStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "careTeam"
    type: "CareTeam"
    multiplicity: "ManyToOne"
  - name: "carePlans"
    type: "CarePlan"
    multiplicity: "OneToMany"
- name: "BenefitAuthorization"
