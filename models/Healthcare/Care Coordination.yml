  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "ServiceCategory"
  - name: "status"
    type: "ServiceRequestStatus"
  - name: "requestedDate"
    type: "Date"
  - name: "authorizationNumber"
    type: "String"
  relations:
  - name: "referral"
    type: "Referral"
    multiplicity: "ManyToOne"
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "orderingProfessional"
    type: "CareProfessional"
    multiplicity: "ManyToOne"
  - name: "fulfillingOrganization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
- name: "Appointment"
  description: "Scheduled time to deliver services or conduct follow-ups."
  data:
  - name: "appointmentDate"
    type: "Date"
  - name: "durationMinutes"
    type: "Integer"
  - name: "status"
    type: "AppointmentStatus"
  - name: "mode"
    type: "EncounterMode"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "serviceRequest"
    type: "ServiceRequest"
    multiplicity: "ManyToOne"
  - name: "serviceLocation"
    type: "ServiceLocation"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "OneToOne"
- name: "Encounter"
  description: "Interaction between patient and care team members, virtual or in-person."
  data:
  - name: "encounterDate"
    type: "Date"
  - name: "type"
    type: "EncounterType"
  - name: "disposition"
    type: "EncounterDisposition"
  - name: "notes"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "serviceLocation"
    type: "ServiceLocation"
    multiplicity: "ManyToOne"
  - name: "appointment"
    type: "Appointment"
    multiplicity: "OneToOne"
  - name: "communications"
    type: "CareCommunication"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "CareCommunication"
  description: "Information exchange supporting coordination, education, or handoffs."
  data:
  - name: "communicationType"
    type: "CommunicationType"
  - name: "channel"
    type: "CommunicationChannel"
  - name: "content"
    type: "String"
  - name: "timestamp"
    type: "Date"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "fromProfessional"
    type: "CareProfessional"
    multiplicity: "ManyToOne"
  - name: "toProfessional"
    type: "CareProfessional"
    multiplicity: "ManyToOne"
  - name: "carePlan"
    type: "CarePlan"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
- name: "Consent"
