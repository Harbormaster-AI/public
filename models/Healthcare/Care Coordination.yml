  - name: "Hospital"
  - name: "Clinic"
  - name: "HomeHealthAgency"
  - name: "BehavioralHealthCenter"
  - name: "CommunityBasedOrg"
  - name: "Payer"
  - name: "Pharmacy"
- name: "LocationType"
