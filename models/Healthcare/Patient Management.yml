  - name: "relationshipToPatient"
    type: "RelationshipToPatient"
  - name: "role"
    type: "ContactRole"
  - name: "address"
    type: "Address"
  - name: "phone"
    type: "PhoneNumber"
  - name: "email"
    type: "EmailAddress"
  - name: "preferred"
