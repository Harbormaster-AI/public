---
metadata:
  name: "Patient Management Capabilities Model"
  description: "Canonical HCIDL capabilities model for managing patient demographics,\
    \ identity, coverage, consents, care team assignments, encounters, and related\
    \ administrative processes across healthcare organizations."
  version: "1.0.0"
  industry: "Healthcare"
  category: "Healthcare"
  type: "Capability"
  domain: "Patient Management"
entities:
- name: "Patient"
  description: "Person receiving care and administrative services within the healthcare\
    \ system."
  data:
  - name: "legalName"
    type: "HumanName"
  - name: "dateOfBirth"
    type: "Date"
  - name: "gender"
    type: "AdministrativeGender"
  - name: "maritalStatus"
    type: "MaritalStatus"
  - name: "deceased"
    type: "Boolean"
  relations:
  - name: "managingOrganization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "identifiers"
    type: "PatientIdentifier"
    multiplicity: "OneToMany"
  - name: "contacts"
    type: "PatientContact"
    multiplicity: "OneToMany"
  - name: "coverages"
    type: "Coverage"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "ConsentDirective"
    multiplicity: "OneToMany"
  - name: "communicationPreferences"
    type: "CommunicationPreference"
    multiplicity: "OneToMany"
  - name: "episodesOfCare"
    type: "EpisodeOfCare"
    multiplicity: "OneToMany"
  - name: "encounters"
    type: "Encounter"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "PatientAlert"
    multiplicity: "OneToMany"
  - name: "careTeamMemberships"
    type: "CareTeamMembership"
    multiplicity: "OneToMany"
  - name: "portalAccount"
    type: "PatientPortalAccount"
    multiplicity: "OneToOne"
  - name: "referrals"
    type: "Referral"
    multiplicity: "OneToMany"
  - name: "identityVerifications"
    type: "IdentityVerification"
    multiplicity: "OneToMany"
  - name: "mergeEvents"
    type: "PatientMergeEvent"
    multiplicity: "OneToMany"
- name: "Organization"
  description: "Legal healthcare entity such as a hospital, clinic, or department\
    \ responsible for patient administration."
  data:
  - name: "name"
    type: "String"
  - name: "organizationType"
    type: "OrganizationType"
  - name: "registrationNumber"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "phone"
    type: "PhoneNumber"
  - name: "website"
    type: "String"
  relations:
  - name: "parentOrganization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "childOrganizations"
    type: "Organization"
    multiplicity: "OneToMany"
  - name: "practitioners"
    type: "Practitioner"
    multiplicity: "OneToMany"
  - name: "patients"
    type: "Patient"
    multiplicity: "OneToMany"
  - name: "locations"
    type: "FacilityLocation"
    multiplicity: "OneToMany"
- name: "Practitioner"
