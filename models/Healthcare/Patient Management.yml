  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "isPrimary"
    type: "Boolean"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "practitioner"
    type: "Practitioner"
    multiplicity: "ManyToOne"
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "episodeOfCare"
    type: "EpisodeOfCare"
    multiplicity: "ManyToOne"
- name: "EpisodeOfCare"
  description: "Administrative grouping of care over a period for a specific purpose\
