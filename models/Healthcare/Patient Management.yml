  - name: "groupNumber"
    type: "String"
  - name: "status"
    type: "CoverageStatus"
  - name: "coverageLevel"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "planType"
    type: "PlanType"
  - name: "subscriberRelationship"
    type: "SubscriberRelationship"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "payer"
    type: "Payer"
    multiplicity: "ManyToOne"
  - name: "plan"
    type: "InsurancePlan"
    multiplicity: "ManyToOne"
- name: "ConsentDirective"
