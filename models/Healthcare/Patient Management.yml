    type: "Organization"
    multiplicity: "ManyToMany"
  - name: "careTeamMemberships"
    type: "CareTeamMembership"
    multiplicity: "OneToMany"
  - name: "encounters"
    type: "Encounter"
    multiplicity: "OneToMany"
  - name: "referralsAuthored"
    type: "Referral"
    multiplicity: "OneToMany"
- name: "PatientIdentifier"
