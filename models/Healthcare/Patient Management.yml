    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "episodeOfCare"
    type: "EpisodeOfCare"
    multiplicity: "ManyToOne"
  - name: "practitioner"
    type: "Practitioner"
    multiplicity: "ManyToOne"
  - name: "serviceLocation"
