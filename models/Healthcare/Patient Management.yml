    type: "String"
  - name: "planCode"
    type: "String"
  - name: "networkName"
    type: "String"
  - name: "metalLevel"
    type: "MetalLevel"
  - name: "requiresReferral"
    type: "Boolean"
  relations:
  - name: "payer"
    type: "Payer"
    multiplicity: "ManyToOne"
  - name: "coverages"
    type: "Coverage"
    multiplicity: "OneToMany"
- name: "Coverage"
