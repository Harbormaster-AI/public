    type: "String"
  - name: "issuer"
    type: "String"
  - name: "status"
    type: "IdentifierStatus"
  - name: "period"
    type: "Period"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
