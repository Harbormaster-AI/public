    type: "EpisodeOfCareType"
  - name: "status"
    type: "EpisodeStatus"
  - name: "period"
    type: "Period"
  - name: "reason"
    type: "String"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "managingOrganization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "careTeamMemberships"
    type: "CareTeamMembership"
    multiplicity: "OneToMany"
  - name: "encounters"
    type: "Encounter"
    multiplicity: "OneToMany"
  - name: "referrals"
    type: "Referral"
    multiplicity: "OneToMany"
- name: "Encounter"
