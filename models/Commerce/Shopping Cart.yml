---
metadata:
  name: "Shopping Cart HCIDL"
  description: "Capabilities model for managing shopper baskets, pricing, promotions,\
    \ and related catalog context prior to checkout."
  version: "1.0.0"
  industry: "Retail and eCommerce"
  category: "Commerce"
  type: "Capability"
  domain: "Shopping Cart"
entities:
- name: "Store"
  description: "Digital storefront that provides the shopping context including catalogs,\
    \ products, and pricing policies."
  data:
  - name: "name"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "baseUrl"
    type: "String"
  - name: "taxCalculationMethod"
    type: "TaxCalculationMethod"
  relations:
  - name: "catalogs"
    type: "Catalog"
    multiplicity: "OneToMany"
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "OneToMany"
  - name: "shippingMethods"
    type: "ShippingMethod"
    multiplicity: "OneToMany"
- name: "Catalog"
  description: "Logical grouping of products and categories for navigation and merchandising."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "activeFrom"
    type: "Date"
  - name: "activeTo"
    type: "Date"
  relations:
  - name: "store"
    type: "Store"
    multiplicity: "ManyToOne"
  - name: "categories"
    type: "Category"
    multiplicity: "OneToMany"
- name: "Category"
  description: "Hierarchical classification used to organize products within a catalog."
  data:
  - name: "name"
    type: "String"
  - name: "slug"
    type: "String"
  - name: "sortOrder"
    type: "Integer"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "catalog"
    type: "Catalog"
    multiplicity: "ManyToOne"
  - name: "parentCategory"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
- name: "Product"
  description: "Sellable item definition independent of specific SKUs or variant attributes."
  data:
  - name: "name"
    type: "String"
  - name: "subtitle"
    type: "String"
  - name: "productStatus"
    type: "ProductStatus"
  - name: "brand"
    type: "String"
  relations:
  - name: "store"
    type: "Store"
    multiplicity: "ManyToOne"
  - name: "catalog"
    type: "Catalog"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "variants"
    type: "ProductVariant"
    multiplicity: "OneToMany"
  - name: "upsellProducts"
    type: "Product"
    multiplicity: "ManyToMany"
- name: "ProductVariant"
  description: "Concrete purchasable SKU with specific attributes and pricing."
  data:
  - name: "sku"
    type: "String"
  - name: "title"
    type: "String"
  - name: "isDefault"
    type: "Boolean"
  - name: "weight"
    type: "Decimal"
  - name: "taxClass"
    type: "String"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "prices"
    type: "Price"
    multiplicity: "OneToMany"
- name: "Price"
  description: "Monetary value associated with a product variant for a given purpose\
    \ and time window."
  data:
  - name: "priceType"
    type: "PriceType"
  - name: "amount"
    type: "Money"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  relations:
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
- name: "Shopper"
  description: "Person or organization browsing and building carts."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "shopperType"
    type: "ShopperType"
  - name: "locale"
    type: "String"
  relations:
  - name: "carts"
    type: "Cart"
    multiplicity: "OneToMany"
  - name: "savedItems"
    type: "SavedItem"
    multiplicity: "OneToMany"
- name: "Cart"
  description: "Collection of items, pricing, and adjustments representing shopper\
    \ intent prior to checkout."
  data:
  - name: "status"
    type: "CartStatus"
  - name: "createdDate"
    type: "Date"
  - name: "lastUpdatedDate"
    type: "Date"
  - name: "expiresDate"
    type: "Date"
  - name: "subtotal"
    type: "Money"
  - name: "discountTotal"
    type: "Money"
  - name: "taxTotal"
    type: "Money"
  - name: "shippingTotal"
    type: "Money"
  - name: "grandTotal"
    type: "Money"
  - name: "billingAddress"
    type: "Address"
  - name: "shippingAddress"
    type: "Address"
  - name: "notes"
    type: "String"
  relations:
  - name: "store"
    type: "Store"
    multiplicity: "ManyToOne"
  - name: "shopper"
    type: "Shopper"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "CartItem"
    multiplicity: "OneToMany"
  - name: "adjustments"
    type: "CartAdjustment"
    multiplicity: "OneToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
  - name: "coupons"
    type: "Coupon"
    multiplicity: "ManyToMany"
  - name: "selectedShippingMethod"
    type: "ShippingMethod"
    multiplicity: "ManyToOne"
- name: "CartItem"
  description: "Line-level entry in a cart representing a selected variant, quantity,\
    \ and computed amounts."
  data:
  - name: "itemType"
    type: "CartItemType"
  - name: "quantity"
    type: "Integer"
  - name: "listPrice"
    type: "Money"
  - name: "unitPrice"
    type: "Money"
  - name: "discountTotal"
    type: "Money"
  - name: "taxTotal"
    type: "Money"
  - name: "lineTotal"
    type: "Money"
  - name: "personalization"
    type: "String"
  relations:
  - name: "cart"
    type: "Cart"
    multiplicity: "ManyToOne"
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
  - name: "adjustments"
    type: "CartAdjustment"
    multiplicity: "OneToMany"
- name: "SavedItem"
  description: "Product variant saved by the shopper for later consideration outside\
    \ the active cart."
  data:
  - name: "quantity"
    type: "Integer"
  - name: "addedDate"
    type: "Date"
  - name: "note"
    type: "String"
  relations:
  - name: "shopper"
    type: "Shopper"
    multiplicity: "ManyToOne"
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
  - name: "store"
    type: "Store"
    multiplicity: "ManyToOne"
- name: "Promotion"
  description: "Business rule that reduces price or modifies shipping when conditions\
    \ are satisfied."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "promotionType"
    type: "PromotionType"
  - name: "status"
    type: "PromotionStatus"
  - name: "stackingBehavior"
    type: "PromotionStackingBehavior"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "maxRedemptions"
    type: "Integer"
  - name: "maxRedemptionsPerShopper"
    type: "Integer"
  - name: "discountAmount"
    type: "Money"
  - name: "discountPercent"
    type: "Decimal"
  relations:
  - name: "store"
    type: "Store"
    multiplicity: "ManyToOne"
  - name: "products"
    type: "Product"
    multiplicity: "ManyToMany"
  - name: "categories"
    type: "Category"
    multiplicity: "ManyToMany"
  - name: "appliedCarts"
    type: "Cart"
    multiplicity: "ManyToMany"
  - name: "coupons"
    type: "Coupon"
    multiplicity: "OneToMany"
- name: "Coupon"
  description: "Redeemable code that links to a promotion and can be applied to carts."
  data:
  - name: "code"
    type: "String"
  - name: "status"
    type: "CouponStatus"
  - name: "usageLimit"
    type: "Integer"
  - name: "uses"
    type: "Integer"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "carts"
    type: "Cart"
    multiplicity: "ManyToMany"
- name: "CartAdjustment"
  description: "Monetary change applied to a cart or item, such as promotion, shipping,\
    \ tax, or manual override."
  data:
  - name: "adjustmentType"
    type: "AdjustmentType"
  - name: "description"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "appliedDate"
    type: "Date"
  relations:
  - name: "cart"
    type: "Cart"
    multiplicity: "ManyToOne"
  - name: "cartItem"
    type: "CartItem"
    multiplicity: "ManyToOne"
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "coupon"
    type: "Coupon"
    multiplicity: "ManyToOne"
- name: "ShippingMethod"
  description: "Deliverable service option selectable during cart stage for estimating\
    \ shipping costs and timelines."
  data:
  - name: "name"
    type: "String"
  - name: "carrier"
    type: "String"
  - name: "serviceLevel"
    type: "String"
  - name: "flatRate"
    type: "Money"
  - name: "isEnabled"
    type: "Boolean"
  - name: "deliveryEstimateDays"
    type: "Integer"
  relations:
  - name: "store"
    type: "Store"
    multiplicity: "ManyToOne"
enums:
- name: "CartStatus"
  description: "Lifecycle state of a cart from creation to conversion or expiry."
  data:
  - name: "Active"
  - name: "Merged"
  - name: "Converted"
  - name: "Abandoned"
  - name: "Expired"
  - name: "Archived"
- name: "ProductStatus"
  description: "Availability and publication state of a product."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Discontinued"
- name: "PriceType"
  description: "Purpose of a price record for a variant."
  data:
  - name: "List"
  - name: "Sale"
  - name: "CompareAt"
  - name: "Member"
- name: "ShopperType"
  description: "Classification of the shopper’s identity context."
  data:
  - name: "Guest"
  - name: "Registered"
- name: "CartItemType"
  description: "Nature of the line item in the cart."
  data:
  - name: "Physical"
  - name: "Digital"
  - name: "Service"
  - name: "GiftCard"
  - name: "Subscription"
- name: "PromotionType"
  description: "Mechanism used by a promotion to alter pricing or shipping."
  data:
  - name: "PercentageOff"
  - name: "AmountOff"
  - name: "BuyXGetY"
  - name: "FreeShipping"
- name: "PromotionStatus"
  description: "Operational state of a promotion within its lifecycle."
  data:
  - name: "Scheduled"
  - name: "Active"
  - name: "Paused"
  - name: "Expired"
- name: "PromotionStackingBehavior"
  description: "Rules governing whether promotions can be combined."
  data:
  - name: "Stackable"
  - name: "Exclusive"
- name: "AdjustmentType"
  description: "Classification of a monetary adjustment applied to cart totals or\
    \ lines."
  data:
  - name: "Promotion"
  - name: "Manual"
  - name: "Tax"
  - name: "Shipping"
  - name: "Rounding"
- name: "CouponStatus"
  description: "State of a coupon code with respect to redemption."
  data:
  - name: "Active"
  - name: "Redeemed"
  - name: "Void"
  - name: "Expired"
- name: "TaxCalculationMethod"
  description: "Pricing policy indicating whether prices include tax."
  data:
  - name: "Inclusive"
  - name: "Exclusive"
valueObjects:
- name: "Money"
  description: "Monetary amount paired with an ISO currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address used for billing and shipping in cart context."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
