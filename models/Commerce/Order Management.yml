---
metadata:
  name: "Order Management"
  description: "HCIDL capabilities model for managing the end-to-end lifecycle of\
    \ commerce orders, from capture and pricing through allocation, fulfillment, invoicing,\
    \ and payment orchestration."
  version: "1.0.0"
  industry: "Retail"
  category: "Commerce"
  type: "Capability"
  domain: "Order Management"
entities:
- name: "Merchant"
  description: "Business entity that sells goods and services and governs order policies,\
    \ pricing rules, and fulfillment nodes."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "salesChannels"
    type: "SalesChannel"
    multiplicity: "OneToMany"
  - name: "orders"
    type: "Order"
    multiplicity: "OneToMany"
  - name: "fulfillmentCenters"
    type: "FulfillmentCenter"
    multiplicity: "OneToMany"
- name: "SalesChannel"
  description: "Point of order capture such as web storefront, mobile app, marketplace,\
    \ call center, or physical store."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "SalesChannelType"
  - name: "region"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "orders"
    type: "Order"
    multiplicity: "OneToMany"
- name: "CustomerAccount"
  description: "Account representing the buyer placing orders, including preferences\
    \ and default addresses."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "buyerType"
    type: "BuyerType"
  - name: "defaultBillingAddress"
    type: "Address"
  - name: "defaultShippingAddress"
    type: "Address"
  relations:
  - name: "orders"
    type: "Order"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
- name: "Order"
  description: "Commercial document committing the merchant to deliver goods or services\
    \ to a customer under agreed terms."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "orderDate"
    type: "Date"
  - name: "status"
    type: "OrderStatus"
  - name: "currency"
    type: "String"
  - name: "billingAddress"
    type: "Address"
  - name: "shippingAddress"
    type: "Address"
  - name: "orderTotal"
    type: "Money"
  - name: "notes"
    type: "String"
  relations:
  - name: "customer"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "salesChannel"
    type: "SalesChannel"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "OrderLine"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
  - name: "fulfillmentRequests"
    type: "FulfillmentRequest"
    multiplicity: "OneToMany"
  - name: "taxDetails"
    type: "TaxDetail"
    multiplicity: "OneToMany"
  - name: "promotions"
    type: "PromotionApplication"
    multiplicity: "OneToMany"
  - name: "statusHistory"
    type: "OrderStatusEvent"
    multiplicity: "OneToMany"
- name: "OrderLine"
  description: "Individual purchasable item or service within an order with pricing,\
    \ quantity, and fulfillment attributes."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "sku"
    type: "String"
  - name: "productName"
    type: "String"
  - name: "fulfillmentType"
    type: "FulfillmentType"
  - name: "quantity"
    type: "Integer"
  - name: "unitPrice"
    type: "Money"
  - name: "lineTotal"
    type: "Money"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "taxDetails"
    type: "TaxDetail"
    multiplicity: "OneToMany"
  - name: "promotions"
    type: "PromotionApplication"
    multiplicity: "OneToMany"
  - name: "inventoryReservations"
    type: "InventoryReservation"
    multiplicity: "OneToMany"
  - name: "fulfillmentRequest"
    type: "FulfillmentRequest"
    multiplicity: "ManyToOne"
- name: "OrderStatusEvent"
  description: "Time-stamped record of changes to an order’s lifecycle state for audit\
    \ and customer communication."
  data:
  - name: "status"
    type: "OrderStatus"
  - name: "eventTime"
    type: "DateTime"
  - name: "reason"
    type: "String"
  - name: "actor"
    type: "String"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
- name: "FulfillmentRequest"
  description: "Grouping of order lines to be allocated, picked, packed, and dispatched\
    \ to a destination."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "status"
    type: "FulfillmentRequestStatus"
  - name: "shipToAddress"
    type: "Address"
  - name: "requestedShipDate"
    type: "Date"
  - name: "shippingMethod"
    type: "String"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "OrderLine"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "fulfillmentCenter"
    type: "FulfillmentCenter"
    multiplicity: "ManyToOne"
- name: "Shipment"
  description: "Physical package or consignment created to satisfy a fulfillment request\
    \ and sent via a carrier."
  data:
  - name: "shipmentNumber"
    type: "String"
  - name: "carrier"
    type: "String"
  - name: "serviceLevel"
    type: "String"
  - name: "trackingNumber"
    type: "String"
  - name: "shippedDate"
    type: "Date"
  relations:
  - name: "fulfillmentRequest"
    type: "FulfillmentRequest"
    multiplicity: "ManyToOne"
  - name: "fulfillmentCenter"
    type: "FulfillmentCenter"
    multiplicity: "ManyToOne"
- name: "FulfillmentCenter"
  description: "Node such as a warehouse or store that allocates inventory and prepares\
    \ shipments."
  data:
  - name: "name"
    type: "String"
  - name: "locationCode"
    type: "String"
  - name: "country"
    type: "String"
  - name: "timeZone"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "fulfillmentRequests"
    type: "FulfillmentRequest"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "inventoryReservations"
    type: "InventoryReservation"
    multiplicity: "OneToMany"
- name: "InventoryReservation"
  description: "Temporary hold of a quantity at a fulfillment node to ensure availability\
    \ for an order line."
  data:
  - name: "reservedQuantity"
    type: "Integer"
  - name: "status"
    type: "ReservationStatus"
  - name: "expiresAt"
    type: "DateTime"
  relations:
  - name: "orderLine"
    type: "OrderLine"
    multiplicity: "ManyToOne"
  - name: "fulfillmentCenter"
    type: "FulfillmentCenter"
    multiplicity: "ManyToOne"
- name: "Payment"
  description: "Financial arrangement used to authorize and capture funds for an order."
  data:
  - name: "referenceNumber"
    type: "String"
  - name: "method"
    type: "PaymentMethodType"
  - name: "status"
    type: "PaymentStatus"
  - name: "amount"
    type: "Money"
  - name: "authorizedAt"
    type: "DateTime"
  - name: "capturedAt"
    type: "DateTime"
  - name: "paymentCard"
    type: "PaymentCardSummary"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "PaymentTransaction"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "ManyToMany"
  - name: "customer"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
- name: "PaymentTransaction"
  description: "Gateway-level financial event such as authorization, capture, refund,\
    \ or void."
  data:
  - name: "transactionType"
    type: "PaymentTransactionType"
  - name: "status"
    type: "PaymentStatus"
  - name: "amount"
    type: "Money"
  - name: "gatewayReference"
    type: "String"
  - name: "processedAt"
    type: "DateTime"
  - name: "message"
    type: "String"
  relations:
  - name: "payment"
    type: "Payment"
    multiplicity: "ManyToOne"
- name: "Invoice"
  description: "Receivable document issued for goods or services, supporting reconciliation\
    \ and payment application."
  data:
  - name: "invoiceNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "InvoiceStatus"
  - name: "total"
    type: "Money"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "payments"
    type: "Payment"
    multiplicity: "ManyToMany"
  - name: "taxDetails"
    type: "TaxDetail"
    multiplicity: "OneToMany"
  - name: "customer"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
- name: "TaxDetail"
  description: "Computed tax component for an order, line, or invoice by jurisdiction\
    \ and tax category."
  data:
  - name: "jurisdiction"
    type: "String"
  - name: "taxType"
    type: "TaxType"
  - name: "taxableAmount"
    type: "Money"
  - name: "taxAmount"
    type: "Money"
  - name: "includedInPrice"
    type: "Boolean"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "orderLine"
    type: "OrderLine"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "PromotionApplication"
  description: "Result of applying a promotion or coupon to reduce the order or line\
    \ price."
  data:
  - name: "code"
    type: "String"
  - name: "description"
    type: "String"
  - name: "promotionType"
    type: "PromotionType"
  - name: "amount"
    type: "Money"
  - name: "appliedScope"
    type: "AdjustmentScope"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "orderLines"
    type: "OrderLine"
    multiplicity: "ManyToMany"
- name: "OrderCommunication"
  description: "Customer-facing or internal message linked to an order for notifications\
    \ and collaboration."
  data:
  - name: "channel"
    type: "CommunicationChannel"
  - name: "subject"
    type: "String"
  - name: "body"
    type: "String"
  - name: "sentAt"
    type: "DateTime"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
- name: "CancellationRequest"
  description: "Request to cancel all or part of an order, evaluated against allocation\
    \ and shipment status."
  data:
  - name: "reason"
    type: "CancellationReason"
  - name: "requestedAt"
    type: "DateTime"
  - name: "status"
    type: "CancellationStatus"
  - name: "scope"
    type: "AdjustmentScope"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "orderLines"
    type: "OrderLine"
    multiplicity: "ManyToMany"
enums:
- name: "SalesChannelType"
  description: "Classification of the point of order capture."
  data:
  - name: "Web"
  - name: "MobileApp"
  - name: "Store"
  - name: "Marketplace"
  - name: "CallCenter"
  - name: "Social"
- name: "BuyerType"
  description: "Type of customer account based on purchasing context."
  data:
  - name: "Consumer"
  - name: "Business"
- name: "OrderStatus"
  description: "Lifecycle state of an order in the management process."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Confirmed"
  - name: "PartiallyFulfilled"
  - name: "Fulfilled"
  - name: "Invoiced"
  - name: "Completed"
  - name: "Cancelled"
- name: "FulfillmentType"
  description: "Method by which the order line will be delivered to the customer."
  data:
  - name: "ShipToAddress"
  - name: "PickupInStore"
  - name: "DigitalDelivery"
- name: "FulfillmentRequestStatus"
  description: "Operational status of a fulfillment request through the warehouse\
    \ workflow."
  data:
  - name: "Pending"
  - name: "Allocated"
  - name: "Picked"
  - name: "Packed"
  - name: "Shipped"
  - name: "Cancelled"
- name: "PaymentStatus"
  description: "State of payment or transaction processing."
  data:
  - name: "Pending"
  - name: "Authorized"
  - name: "Captured"
  - name: "PartiallyCaptured"
  - name: "Voided"
  - name: "Refunded"
  - name: "Failed"
- name: "PaymentMethodType"
  description: "Mechanism used by the customer to pay for the order."
  data:
  - name: "Card"
  - name: "PayPal"
  - name: "BankTransfer"
  - name: "CashOnDelivery"
  - name: "StoreCredit"
  - name: "GiftCard"
  - name: "BuyNowPayLater"
- name: "PaymentTransactionType"
  description: "Type of financial event recorded against a payment."
  data:
  - name: "Authorization"
  - name: "Capture"
  - name: "Refund"
  - name: "Void"
  - name: "Sale"
- name: "InvoiceStatus"
  description: "Accounting status of an invoice from issuance to settlement."
  data:
  - name: "Draft"
  - name: "Issued"
  - name: "Paid"
  - name: "PartiallyPaid"
  - name: "Overdue"
  - name: "Cancelled"
- name: "TaxType"
  description: "Category of indirect tax applied to goods or services."
  data:
  - name: "VAT"
  - name: "GST"
  - name: "SalesTax"
  - name: "UseTax"
  - name: "EcoTax"
- name: "ReservationStatus"
  description: "State of an inventory reservation throughout its lifecycle."
  data:
  - name: "Created"
  - name: "Released"
  - name: "Failed"
  - name: "Expired"
- name: "PromotionType"
  description: "Strategy used to discount an order or line."
  data:
  - name: "Coupon"
  - name: "Automatic"
  - name: "BOGO"
  - name: "FreeShipping"
  - name: "Loyalty"
- name: "AdjustmentScope"
  description: "The scope to which a pricing or cancellation action applies."
  data:
  - name: "OrderLevel"
  - name: "LineLevel"
- name: "CommunicationChannel"
  description: "Channel used to communicate order-related messages."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "Push"
  - name: "Phone"
  - name: "Portal"
- name: "CancellationReason"
  description: "Reason provided when an order or line is cancelled."
  data:
  - name: "CustomerRequest"
  - name: "OutOfStock"
  - name: "PaymentIssue"
  - name: "AddressProblem"
  - name: "FraudSuspected"
  - name: "Other"
- name: "CancellationStatus"
  description: "Processing status of a cancellation request."
  data:
  - name: "Requested"
  - name: "Approved"
  - name: "Rejected"
  - name: "Completed"
- name: "CardBrand"
  description: "Brand of payment card used for a card-based payment."
  data:
  - name: "Visa"
  - name: "MasterCard"
  - name: "AmericanExpress"
  - name: "Discover"
  - name: "JCB"
  - name: "UnionPay"
valueObjects:
- name: "Money"
  description: "Monetary value consisting of an amount and currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address used for billing or shipping."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "PaymentCardSummary"
  description: "Non-sensitive summary of a payment card used for display and reconciliation."
  data:
  - name: "holderName"
    type: "String"
  - name: "maskedNumber"
    type: "String"
  - name: "brand"
    type: "CardBrand"
  - name: "expiryMonth"
    type: "Integer"
  - name: "expiryYear"
    type: "Integer"
