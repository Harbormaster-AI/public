---
metadata:
  name: "HCIDL Capabilities Model - Subscription Commerce"
  description: "Canonical capability model for managing subscription products, plans,\
    \ lifecycle, billing, payments, and entitlements in subscription commerce."
  version: "1.0.0"
  industry: "Commerce and Digital Services"
  category: "Commerce"
  type: "Capability"
  domain: "Subscription Commerce"
entities:
- name: "Merchant"
  description: "Commercial entity that offers subscription products and manages billing\
    \ operations."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "taxIdentification"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "website"
    type: "String"
  - name: "countryOfOperation"
    type: "String"
  relations:
  - name: "products"
    type: "SubscriptionProduct"
    multiplicity: "OneToMany"
  - name: "paymentProviderAccounts"
    type: "PaymentProviderAccount"
    multiplicity: "OneToMany"
  - name: "dunningPolicies"
    type: "DunningPolicy"
    multiplicity: "OneToMany"
  - name: "taxRegistrations"
    type: "TaxRegistration"
    multiplicity: "OneToMany"
  - name: "salesChannels"
    type: "SalesChannel"
    multiplicity: "OneToMany"
  - name: "coupons"
    type: "Coupon"
    multiplicity: "OneToMany"
- name: "SalesChannel"
  description: "Distribution channel through which subscriptions are sold or billed."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "SalesChannelType"
  - name: "externalMarketplace"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
  - name: "coupons"
    type: "Coupon"
    multiplicity: "OneToMany"
- name: "Subscriber"
  description: "End customer or account holder who owns subscriptions."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "companyName"
    type: "String"
  - name: "subscriberType"
    type: "SubscriberType"
  - name: "preferredCurrency"
    type: "String"
  - name: "locale"
    type: "String"
  - name: "billingAddress"
    type: "Address"
  - name: "shippingAddress"
    type: "Address"
  - name: "taxExempt"
    type: "Boolean"
  relations:
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "paymentMethods"
    type: "PaymentMethod"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
  - name: "taxExemptions"
    type: "TaxExemption"
    multiplicity: "OneToMany"
  - name: "contracts"
    type: "SubscriptionContract"
    multiplicity: "OneToMany"
- name: "SubscriptionProduct"
  description: "Sellable catalog item that defines the overarching service or package."
  data:
  - name: "sku"
    type: "String"
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "productType"
    type: "ProductType"
  - name: "requiresShipping"
    type: "Boolean"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "plans"
    type: "Plan"
    multiplicity: "OneToMany"
  - name: "addOns"
    type: "AddOnDefinition"
    multiplicity: "OneToMany"
  - name: "featureBundles"
    type: "FeatureBundle"
    multiplicity: "OneToMany"
  - name: "meters"
    type: "MeterDefinition"
    multiplicity: "OneToMany"
  - name: "licenseKeys"
    type: "LicenseKey"
    multiplicity: "OneToMany"
- name: "Plan"
  description: "Commercial package for a product defining billing cadence and eligibility."
  data:
  - name: "planCode"
    type: "String"
  - name: "name"
    type: "String"
  - name: "billingFrequency"
    type: "BillingFrequency"
  - name: "intervalCount"
    type: "Integer"
  - name: "termType"
    type: "TermType"
  - name: "trialAvailable"
    type: "Boolean"
  relations:
  - name: "product"
    type: "SubscriptionProduct"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "PlanVersion"
    multiplicity: "OneToMany"
  - name: "compatibleAddOns"
    type: "AddOnDefinition"
    multiplicity: "ManyToMany"
  - name: "featureBundles"
    type: "FeatureBundle"
    multiplicity: "ManyToMany"
  - name: "dunningPolicy"
    type: "DunningPolicy"
    multiplicity: "ManyToOne"
- name: "PlanVersion"
  description: "Time-bounded specification of pricing, taxation and billing rules\
    \ for a plan."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "billingMode"
    type: "BillingMode"
  - name: "prorationStrategy"
    type: "ProrationStrategy"
  - name: "taxInclusive"
    type: "Boolean"
  - name: "basePrice"
    type: "Money"
  - name: "minimumQuantity"
    type: "Integer"
  relations:
  - name: "plan"
    type: "Plan"
    multiplicity: "ManyToOne"
  - name: "pricingTiers"
    type: "PriceTier"
    multiplicity: "OneToMany"
  - name: "featureGrants"
    type: "Entitlement"
    multiplicity: "OneToMany"
- name: "PriceTier"
  description: "Pricing rule specifying unit ranges and price for usage or seats."
  data:
  - name: "unitFrom"
    type: "Integer"
  - name: "unitTo"
    type: "Integer"
  - name: "tierType"
    type: "TierType"
  - name: "billingMeasure"
    type: "BillingMeasure"
  - name: "price"
    type: "Money"
  relations:
  - name: "planVersion"
    type: "PlanVersion"
    multiplicity: "ManyToOne"
  - name: "meterDefinition"
    type: "MeterDefinition"
    multiplicity: "ManyToOne"
- name: "AddOnDefinition"
  description: "Optional purchasable component that augments a subscription."
  data:
  - name: "addOnCode"
    type: "String"
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "chargeType"
    type: "AddOnChargeType"
  - name: "billingFrequency"
    type: "BillingFrequency"
  - name: "price"
    type: "Money"
  relations:
  - name: "product"
    type: "SubscriptionProduct"
    multiplicity: "ManyToOne"
  - name: "applicablePlans"
    type: "Plan"
    multiplicity: "ManyToMany"
- name: "FeatureDefinition"
  description: "Capability or limit that can be granted to a subscription."
  data:
  - name: "featureKey"
    type: "String"
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "measurementType"
    type: "MeasurementType"
  - name: "defaultLimit"
    type: "Integer"
  relations:
  - name: "products"
    type: "SubscriptionProduct"
    multiplicity: "ManyToMany"
  - name: "bundles"
    type: "FeatureBundle"
    multiplicity: "ManyToMany"
- name: "FeatureBundle"
  description: "Curated group of features attached to products and plans."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "product"
    type: "SubscriptionProduct"
    multiplicity: "ManyToOne"
  - name: "features"
    type: "FeatureDefinition"
    multiplicity: "ManyToMany"
  - name: "plans"
    type: "Plan"
    multiplicity: "ManyToMany"
- name: "Entitlement"
  description: "Grant of a specific feature to a subscription with an optional limit."
  data:
  - name: "limit"
    type: "Integer"
  - name: "state"
    type: "EntitlementState"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "feature"
    type: "FeatureDefinition"
    multiplicity: "ManyToOne"
  - name: "originatingPlanVersion"
    type: "PlanVersion"
    multiplicity: "ManyToOne"
- name: "Coupon"
  description: "Discount instrument applicable to eligible plans or products."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "discountType"
    type: "DiscountType"
  - name: "discountValue"
    type: "Decimal"
  - name: "maxRedemptions"
    type: "Integer"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "status"
    type: "CouponStatus"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "salesChannel"
    type: "SalesChannel"
    multiplicity: "ManyToOne"
  - name: "applicableProducts"
    type: "SubscriptionProduct"
    multiplicity: "ManyToMany"
  - name: "applicablePlans"
    type: "Plan"
    multiplicity: "ManyToMany"
  - name: "redemptions"
    type: "CouponRedemption"
    multiplicity: "OneToMany"
- name: "CouponRedemption"
  description: "Application of a coupon to a subscription or invoice."
  data:
  - name: "redeemedAt"
    type: "DateTime"
  - name: "discountApplied"
    type: "Money"
  relations:
  - name: "coupon"
    type: "Coupon"
    multiplicity: "ManyToOne"
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "subscriber"
    type: "Subscriber"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "PaymentProviderAccount"
  description: "Merchant’s configured account with a payment service provider."
  data:
  - name: "providerName"
    type: "PaymentProviderName"
  - name: "merchantAccountReference"
    type: "String"
  - name: "status"
    type: "IntegrationStatus"
  - name: "defaultCurrency"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
- name: "PaymentMethod"
  description: "Funding instrument authorized for subscriber charges."
  data:
  - name: "methodType"
    type: "PaymentMethodType"
  - name: "status"
    type: "PaymentMethodStatus"
  - name: "cardBrand"
    type: "String"
  - name: "last4"
    type: "String"
  - name: "expiryMonth"
    type: "Integer"
  - name: "expiryYear"
    type: "Integer"
  - name: "billingAddress"
    type: "Address"
  relations:
  - name: "subscriber"
    type: "Subscriber"
    multiplicity: "ManyToOne"
  - name: "providerAccount"
    type: "PaymentProviderAccount"
    multiplicity: "ManyToOne"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
- name: "BillingSchedule"
  description: "Rules that determine when and how often invoices are generated."
  data:
  - name: "anchorDate"
    type: "Date"
  - name: "frequency"
    type: "BillingFrequency"
  - name: "intervalCount"
    type: "Integer"
  - name: "timezone"
    type: "String"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
- name: "Subscription"
  description: "Ongoing commercial agreement tying a subscriber to a plan and billing\
    \ terms."
  data:
  - name: "subscriptionNumber"
    type: "String"
  - name: "status"
    type: "SubscriptionStatus"
  - name: "startDate"
    type: "Date"
  - name: "currentTermStart"
    type: "Date"
  - name: "currentTermEnd"
    type: "Date"
  - name: "autoRenew"
    type: "Boolean"
  - name: "billingAlignment"
    type: "BillingAlignment"
  - name: "quantity"
    type: "Integer"
  - name: "seatMode"
    type: "SeatMode"
  - name: "renewalPolicy"
    type: "RenewalPolicyType"
  - name: "cancellationPolicy"
    type: "CancellationPolicyType"
  - name: "trialEnd"
    type: "Date"
  relations:
  - name: "subscriber"
    type: "Subscriber"
    multiplicity: "ManyToOne"
  - name: "plan"
    type: "Plan"
    multiplicity: "ManyToOne"
  - name: "planVersion"
    type: "PlanVersion"
    multiplicity: "ManyToOne"
  - name: "billingSchedule"
    type: "BillingSchedule"
    multiplicity: "OneToOne"
  - name: "paymentMethod"
    type: "PaymentMethod"
    multiplicity: "ManyToOne"
  - name: "addOns"
    type: "SubscriptionAddOn"
    multiplicity: "OneToMany"
  - name: "entitlements"
    type: "Entitlement"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
  - name: "usageEvents"
    type: "UsageEvent"
    multiplicity: "OneToMany"
  - name: "ratedUsage"
    type: "RatedUsage"
    multiplicity: "OneToMany"
  - name: "salesChannel"
    type: "SalesChannel"
    multiplicity: "ManyToOne"
  - name: "contract"
    type: "SubscriptionContract"
    multiplicity: "OneToOne"
  - name: "dunningPolicy"
    type: "DunningPolicy"
    multiplicity: "ManyToOne"
- name: "SubscriptionAddOn"
  description: "Instance of an add-on attached to a specific subscription."
  data:
  - name: "code"
    type: "String"
  - name: "quantity"
    type: "Integer"
  - name: "status"
    type: "SubscriptionAddOnStatus"
  - name: "price"
    type: "Money"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "addOnDefinition"
    type: "AddOnDefinition"
    multiplicity: "ManyToOne"
- name: "MeterDefinition"
  description: "Definition of a measurable usage dimension for metered billing."
  data:
  - name: "meterKey"
    type: "String"
  - name: "name"
    type: "String"
  - name: "unitName"
    type: "String"
  - name: "aggregationType"
    type: "AggregationType"
  - name: "billingMeasure"
    type: "BillingMeasure"
  - name: "resetFrequency"
    type: "ResetFrequency"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "product"
    type: "SubscriptionProduct"
    multiplicity: "ManyToOne"
  - name: "usageEvents"
    type: "UsageEvent"
    multiplicity: "OneToMany"
  - name: "ratedUsage"
    type: "RatedUsage"
    multiplicity: "OneToMany"
- name: "UsageEvent"
  description: "Raw usage record captured for metered billing."
  data:
  - name: "eventTime"
    type: "DateTime"
  - name: "amount"
    type: "Decimal"
  - name: "source"
    type: "String"
  - name: "idempotencyKey"
    type: "String"
  relations:
  - name: "meterDefinition"
    type: "MeterDefinition"
    multiplicity: "ManyToOne"
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
- name: "RatedUsage"
  description: "Aggregated and priced usage for a billing period."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "usage"
    type: "Decimal"
  - name: "ratedAmount"
    type: "Money"
  - name: "ratingStatus"
    type: "RatingStatus"
  relations:
  - name: "meterDefinition"
    type: "MeterDefinition"
    multiplicity: "ManyToOne"
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "priceTier"
    type: "PriceTier"
    multiplicity: "ManyToOne"
- name: "Invoice"
  description: "Commercial document requesting payment for recurring and one-time\
    \ charges."
  data:
  - name: "invoiceNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "InvoiceStatus"
  - name: "subtotal"
    type: "Money"
  - name: "tax"
    type: "Money"
  - name: "total"
    type: "Money"
  - name: "balanceDue"
    type: "Money"
  - name: "collectionBehavior"
    type: "CollectionBehavior"
  relations:
  - name: "subscriber"
    type: "Subscriber"
    multiplicity: "ManyToOne"
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "InvoiceLine"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "refunds"
    type: "Refund"
    multiplicity: "OneToMany"
  - name: "couponRedemptions"
    type: "CouponRedemption"
    multiplicity: "OneToMany"
  - name: "salesChannel"
    type: "SalesChannel"
    multiplicity: "ManyToOne"
  - name: "creditNotes"
    type: "CreditNote"
    multiplicity: "OneToMany"
  - name: "ratedUsage"
    type: "RatedUsage"
    multiplicity: "OneToMany"
- name: "InvoiceLine"
  description: "Line-level detail contributing to invoice totals."
  data:
  - name: "description"
    type: "String"
  - name: "lineType"
    type: "InvoiceLineType"
  - name: "quantity"
    type: "Decimal"
  - name: "unitPrice"
    type: "Money"
  - name: "amount"
    type: "Money"
  - name: "taxRate"
    type: "Decimal"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "priceTier"
    type: "PriceTier"
    multiplicity: "ManyToOne"
  - name: "addOnDefinition"
    type: "AddOnDefinition"
    multiplicity: "ManyToOne"
  - name: "meterDefinition"
    type: "MeterDefinition"
    multiplicity: "ManyToOne"
  - name: "planVersion"
    type: "PlanVersion"
    multiplicity: "ManyToOne"
- name: "Payment"
  description: "Financial transaction attempting to settle an invoice."
  data:
  - name: "paymentReference"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "PaymentStatus"
  - name: "attemptCount"
    type: "Integer"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "paymentMethod"
    type: "PaymentMethod"
    multiplicity: "ManyToOne"
  - name: "providerAccount"
    type: "PaymentProviderAccount"
    multiplicity: "ManyToOne"
  - name: "refunds"
    type: "Refund"
    multiplicity: "OneToMany"
- name: "Refund"
  description: "Return of funds to a subscriber after a payment."
  data:
  - name: "refundReference"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "amount"
    type: "Money"
  - name: "reason"
    type: "RefundReason"
  - name: "status"
    type: "RefundStatus"
  relations:
  - name: "payment"
    type: "Payment"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "CreditNote"
  description: "Document reducing amounts owed on an invoice."
  data:
  - name: "creditNoteNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "reason"
    type: "CreditReason"
  - name: "total"
    type: "Money"
  - name: "status"
    type: "CreditNoteStatus"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "subscriber"
    type: "Subscriber"
    multiplicity: "ManyToOne"
- name: "DunningPolicy"
  description: "Strategy and rules for handling failed collections."
  data:
  - name: "name"
    type: "String"
  - name: "strategy"
    type: "DunningStrategy"
  - name: "maxRetries"
    type: "Integer"
  - name: "totalDurationDays"
    type: "Integer"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "steps"
    type: "DunningStep"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
- name: "DunningStep"
  description: "Ordered action executed during the dunning process."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "waitDays"
    type: "Integer"
  - name: "action"
    type: "DunningAction"
  - name: "retryAmountType"
    type: "RetryAmountType"
  - name: "fee"
    type: "Money"
  relations:
  - name: "policy"
    type: "DunningPolicy"
    multiplicity: "ManyToOne"
- name: "CollectionAttempt"
  description: "Recorded attempt to collect payment during dunning."
  data:
  - name: "attemptTime"
    type: "DateTime"
  - name: "outcome"
    type: "CollectionOutcome"
  - name: "gatewayResponseCode"
    type: "String"
  - name: "gatewayResponseText"
    type: "String"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "payment"
    type: "Payment"
    multiplicity: "ManyToOne"
  - name: "dunningPolicy"
    type: "DunningPolicy"
    multiplicity: "ManyToOne"
- name: "SubscriptionAmendment"
  description: "Change request that alters the configuration of an active subscription."
  data:
  - name: "amendmentNumber"
    type: "String"
  - name: "type"
    type: "AmendmentType"
  - name: "requestedDate"
    type: "Date"
  - name: "effectiveDate"
    type: "Date"
  - name: "prorationApplied"
    type: "Boolean"
  - name: "note"
    type: "String"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "originalPlan"
    type: "Plan"
    multiplicity: "ManyToOne"
  - name: "newPlan"
    type: "Plan"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "Suspension"
  description: "Temporary halt of service or billing for a subscription."
  data:
  - name: "reason"
    type: "SuspensionReason"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "SuspensionStatus"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
- name: "CancellationRequest"
  description: "Instruction to terminate a subscription with a stated policy and reason."
  data:
  - name: "cancellationDate"
    type: "Date"
  - name: "policy"
    type: "CancellationPolicyType"
  - name: "reason"
    type: "CancellationReason"
  - name: "initiatedBy"
    type: "InitiatorType"
  - name: "feedback"
    type: "String"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
- name: "LicenseKey"
  description: "Digital license token granting access to product functionality."
  data:
  - name: "key"
    type: "String"
