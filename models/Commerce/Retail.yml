metadata:
  name: "Retail Industry Domain Model"
  description: "HCIDL model capturing core retail merchandising, supply, pricing,\
    \ order management, and fulfillment capabilities."
  version: "1.0.0"
  industry: "Retail"
  category: "Commerce"
  language: "English"
  type: "Industry"
  domain: "Retail"
