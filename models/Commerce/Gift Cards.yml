---
metadata:
  name: "HCIDL Capabilities Model - Gift Cards"
  description: "Domain model for managing gift card programs, issuance, balance, redemption,\
    \ settlement, and compliance across commerce channels."
  version: "1.0.0"
  industry: "Retail"
  category: "Commerce"
  type: "Capability"
  domain: "Gift Cards"
entities:
- name: "GiftCardProgram"
  description: "Business program that governs how gift cards are issued, funded, redeemed,\
    \ and expired."
  data:
  - name: "name"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "reloadable"
    type: "Boolean"
  - name: "expirationPolicy"
    type: "ExpirationPolicyType"
  - name: "activationType"
    type: "ActivationType"
  - name: "minLoadAmount"
    type: "Money"
  - name: "maxLoadAmount"
    type: "Money"
  - name: "breakagePolicy"
    type: "BreakagePolicyType"
  relations:
  - name: "issuers"
    type: "GiftCardIssuer"
    multiplicity: "OneToMany"
  - name: "terms"
    type: "ProgramTerms"
    multiplicity: "OneToOne"
  - name: "cards"
    type: "GiftCard"
    multiplicity: "OneToMany"
  - name: "salesChannels"
    type: "SalesChannel"
    multiplicity: "ManyToMany"
  - name: "feeSchedules"
    type: "FeeSchedule"
    multiplicity: "OneToMany"
- name: "GiftCardIssuer"
  description: "Legal or operational entity responsible for issuing and settling gift\
    \ cards within a program."
  data:
  - name: "name"
    type: "String"
  - name: "legalEntityName"
    type: "String"
  - name: "contactEmail"
    type: "EmailAddress"
  - name: "settlementSchedule"
    type: "SettlementScheduleType"
  relations:
  - name: "program"
    type: "GiftCardProgram"
    multiplicity: "ManyToOne"
  - name: "merchants"
    type: "Merchant"
    multiplicity: "OneToMany"
  - name: "settlements"
    type: "SettlementRecord"
    multiplicity: "OneToMany"
- name: "Merchant"
  description: "Retailer or brand that sells and/or accepts gift cards."
  data:
  - name: "name"
    type: "String"
  - name: "merchantCategory"
    type: "String"
  - name: "defaultSettlementCurrency"
    type: "String"
  relations:
  - name: "issuer"
    type: "GiftCardIssuer"
    multiplicity: "ManyToOne"
  - name: "locations"
    type: "MerchantLocation"
    multiplicity: "OneToMany"
  - name: "redemptions"
    type: "GiftCardRedemption"
    multiplicity: "OneToMany"
  - name: "settlements"
    type: "SettlementRecord"
    multiplicity: "OneToMany"
- name: "MerchantLocation"
  description: "Specific place or channel where gift cards are sold or redeemed."
  data:
  - name: "name"
    type: "String"
  - name: "locationType"
    type: "LocationType"
  - name: "country"
    type: "String"
  - name: "timezone"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "terminals"
    type: "PosTerminal"
    multiplicity: "OneToMany"
- name: "PosTerminal"
  description: "Point-of-sale terminal or e-commerce gateway used for gift card operations."
  data:
  - name: "name"
    type: "String"
  - name: "terminalType"
    type: "TerminalType"
  - name: "integrationKey"
    type: "String"
  relations:
  - name: "location"
    type: "MerchantLocation"
    multiplicity: "ManyToOne"
- name: "ProgramTerms"
  description: "Versioned terms and conditions governing gift card use."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "termsText"
    type: "String"
  relations:
  - name: "program"
    type: "GiftCardProgram"
    multiplicity: "ManyToOne"
- name: "SalesChannel"
  description: "Commercial channel through which gift cards are marketed, sold, or\
    \ delivered."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "SalesChannelType"
  relations:
  - name: "orders"
    type: "GiftCardOrder"
    multiplicity: "OneToMany"
  - name: "programs"
    type: "GiftCardProgram"
    multiplicity: "ManyToMany"
- name: "Cardholder"
  description: "Person or organization that receives and uses gift cards."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "customerType"
    type: "CustomerType"
  relations:
  - name: "cards"
    type: "GiftCard"
    multiplicity: "OneToMany"
- name: "GiftCard"
  description: "Stored-value instrument associated with a program and used for payment."
  data:
  - name: "cardNumber"
    type: "GiftCardNumber"
  - name: "pin"
    type: "GiftCardPIN"
  - name: "status"
    type: "GiftCardStatus"
  - name: "currentBalance"
    type: "Money"
  - name: "expirationDate"
    type: "Date"
  - name: "isReloadable"
    type: "Boolean"
  - name: "isVirtual"
    type: "Boolean"
  relations:
  - name: "program"
    type: "GiftCardProgram"
    multiplicity: "ManyToOne"
  - name: "issuance"
    type: "GiftCardIssuance"
    multiplicity: "OneToOne"
  - name: "transactions"
    type: "GiftCardTransaction"
    multiplicity: "OneToMany"
  - name: "holds"
    type: "AuthorizationHold"
    multiplicity: "OneToMany"
  - name: "owner"
    type: "Cardholder"
    multiplicity: "ManyToOne"
  - name: "batch"
    type: "CardBatch"
    multiplicity: "ManyToOne"
  - name: "delivery"
    type: "DigitalDelivery"
    multiplicity: "OneToOne"
- name: "GiftCardIssuance"
  description: "Record of creating a card and applying the initial load."
  data:
  - name: "issuanceDate"
    type: "Date"
  - name: "channel"
    type: "IssueChannel"
  - name: "initialAmount"
    type: "Money"
  - name: "purchaserNote"
    type: "String"
  relations:
  - name: "program"
    type: "GiftCardProgram"
    multiplicity: "ManyToOne"
  - name: "card"
    type: "GiftCard"
    multiplicity: "OneToOne"
  - name: "purchaser"
    type: "BuyerProfile"
    multiplicity: "ManyToOne"
  - name: "order"
    type: "GiftCardOrder"
    multiplicity: "ManyToOne"
  - name: "delivery"
    type: "DigitalDelivery"
    multiplicity: "OneToOne"
- name: "BuyerProfile"
  description: "Customer or organization that purchases gift cards."
  data:
  - name: "name"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "billingAddress"
    type: "Address"
  relations:
  - name: "orders"
    type: "GiftCardOrder"
    multiplicity: "OneToMany"
  - name: "issuances"
    type: "GiftCardIssuance"
    multiplicity: "OneToMany"
- name: "GiftCardOrder"
  description: "Commercial order capturing the sale of one or more gift cards."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "orderDate"
    type: "Date"
  - name: "status"
    type: "OrderStatus"
  - name: "totalAmount"
    type: "Money"
  relations:
  - name: "buyer"
    type: "BuyerProfile"
    multiplicity: "ManyToOne"
  - name: "lineItems"
    type: "GiftCardOrderLine"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "OrderPayment"
    multiplicity: "OneToMany"
  - name: "salesChannel"
    type: "SalesChannel"
    multiplicity: "ManyToOne"
  - name: "issuances"
    type: "GiftCardIssuance"
    multiplicity: "OneToMany"
- name: "GiftCardOrderLine"
  description: "Line item requesting issuance of specific gift card values."
  data:
  - name: "quantity"
    type: "Integer"
  - name: "unitAmount"
    type: "Money"
  - name: "message"
    type: "String"
  relations:
  - name: "order"
    type: "GiftCardOrder"
    multiplicity: "ManyToOne"
  - name: "program"
    type: "GiftCardProgram"
    multiplicity: "ManyToOne"
  - name: "issuedCards"
    type: "GiftCard"
    multiplicity: "OneToMany"
- name: "OrderPayment"
  description: "Payment record used to fund a gift card order."
  data:
  - name: "paymentMethod"
    type: "PaymentMethodType"
  - name: "amount"
    type: "Money"
  - name: "paymentDate"
    type: "Date"
  - name: "status"
    type: "PaymentStatus"
  relations:
  - name: "order"
    type: "GiftCardOrder"
    multiplicity: "ManyToOne"
- name: "DigitalDelivery"
  description: "Digital fulfillment of e-gift cards via electronic channels."
  data:
  - name: "deliveryMethod"
    type: "DeliveryMethod"
  - name: "recipientEmail"
    type: "EmailAddress"
  - name: "recipientPhone"
    type: "PhoneNumber"
  - name: "personalMessage"
    type: "String"
  - name: "sentAt"
    type: "Date"
  - name: "status"
    type: "DeliveryStatus"
  relations:
  - name: "issuance"
    type: "GiftCardIssuance"
    multiplicity: "OneToOne"
  - name: "card"
    type: "GiftCard"
    multiplicity: "OneToOne"
- name: "CardBatch"
  description: "Group of cards created, printed, or activated together."
  data:
  - name: "batchCode"
    type: "String"
  - name: "creationDate"
    type: "Date"
  - name: "activationMode"
    type: "BatchActivationMode"
  - name: "status"
    type: "BatchStatus"
  relations:
  - name: "program"
    type: "GiftCardProgram"
    multiplicity: "ManyToOne"
  - name: "cards"
    type: "GiftCard"
    multiplicity: "OneToMany"
  - name: "supplier"
    type: "PrintSupplier"
    multiplicity: "ManyToOne"
- name: "PrintSupplier"
  description: "Third-party vendor that manufactures physical gift cards."
  data:
  - name: "name"
    type: "String"
  - name: "contactEmail"
    type: "EmailAddress"
  - name: "productionLeadDays"
    type: "Integer"
  relations:
  - name: "batches"
    type: "CardBatch"
    multiplicity: "OneToMany"
- name: "GiftCardLoad"
  description: "Post-issuance load that increases card balance."
  data:
  - name: "loadDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "channel"
    type: "LoadChannel"
  - name: "fundingSource"
    type: "FundingSourceType"
  relations:
  - name: "card"
    type: "GiftCard"
    multiplicity: "ManyToOne"
  - name: "order"
    type: "GiftCardOrder"
    multiplicity: "ManyToOne"
- name: "AuthorizationHold"
  description: "Temporary authorization placed against a card balance prior to capture."
  data:
  - name: "holdDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "HoldStatus"
  - name: "expiresOn"
    type: "Date"
  relations:
  - name: "card"
    type: "GiftCard"
    multiplicity: "ManyToOne"
  - name: "redemption"
    type: "GiftCardRedemption"
    multiplicity: "OneToOne"
- name: "GiftCardRedemption"
  description: "Use of card value to pay for goods or services at a merchant."
  data:
  - name: "redemptionDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "RedemptionStatus"
  - name: "authorizationCode"
    type: "String"
  relations:
  - name: "card"
    type: "GiftCard"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "MerchantLocation"
    multiplicity: "ManyToOne"
  - name: "hold"
    type: "AuthorizationHold"
    multiplicity: "ManyToOne"
  - name: "settlement"
    type: "SettlementRecord"
    multiplicity: "ManyToOne"
- name: "GiftCardRefund"
  description: "Credit back to a card resulting from a return or cancellation."
  data:
  - name: "refundDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "reason"
    type: "RefundReason"
  relations:
  - name: "card"
    type: "GiftCard"
    multiplicity: "ManyToOne"
  - name: "originalRedemption"
    type: "GiftCardRedemption"
    multiplicity: "ManyToOne"
- name: "GiftCardTransfer"
  description: "Movement of balance from one card to another card."
  data:
  - name: "transferDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "reason"
    type: "TransferReason"
  relations:
  - name: "sourceCard"
    type: "GiftCard"
    multiplicity: "ManyToOne"
  - name: "targetCard"
    type: "GiftCard"
    multiplicity: "ManyToOne"
- name: "GiftCardTransaction"
  description: "Immutable ledger entry reflecting a change to card balance."
  data:
  - name: "postedAt"
    type: "Date"
  - name: "type"
    type: "GiftCardTransactionType"
  - name: "amount"
    type: "Money"
  - name: "reference"
    type: "String"
  - name: "description"
    type: "String"
  - name: "resultingBalance"
    type: "Money"
  relations:
  - name: "card"
    type: "GiftCard"
    multiplicity: "ManyToOne"
  - name: "redemption"
    type: "GiftCardRedemption"
    multiplicity: "ManyToOne"
  - name: "adjustment"
    type: "AdjustmentCase"
    multiplicity: "ManyToOne"
  - name: "refund"
    type: "GiftCardRefund"
    multiplicity: "ManyToOne"
  - name: "load"
    type: "GiftCardLoad"
    multiplicity: "ManyToOne"
  - name: "transfer"
    type: "GiftCardTransfer"
    multiplicity: "ManyToOne"
- name: "AdjustmentCase"
  description: "Case-driven process for reviewing and applying manual balance corrections."
  data:
  - name: "openedDate"
    type: "Date"
  - name: "status"
    type: "AdjustmentStatus"
  - name: "reasonCode"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "card"
    type: "GiftCard"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "GiftCardTransaction"
    multiplicity: "OneToMany"
  - name: "agent"
    type: "SupportAgent"
    multiplicity: "ManyToOne"
- name: "SupportAgent"
  description: "Authorized associate who administers programs and resolves customer\
    \ issues."
  data:
  - name: "name"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "role"
    type: "AgentRole"
  relations:
  - name: "adjustments"
    type: "AdjustmentCase"
    multiplicity: "OneToMany"
- name: "SettlementRecord"
  description: "Financial settlement aggregation between issuer and merchant for redemptions."
  data:
  - name: "settlementDate"
    type: "Date"
  - name: "grossAmount"
    type: "Money"
  - name: "feeAmount"
    type: "Money"
  - name: "netAmount"
    type: "Money"
  - name: "status"
    type: "SettlementStatus"
  relations:
  - name: "issuer"
    type: "GiftCardIssuer"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "redemptions"
    type: "GiftCardRedemption"
    multiplicity: "OneToMany"
- name: "ComplianceReport"
  description: "Regulatory reporting record for escheatment and related filings."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "reportType"
    type: "ComplianceReportType"
  - name: "filingJurisdiction"
    type: "String"
  - name: "submitted"
    type: "Boolean"
  relations:
  - name: "program"
    type: "GiftCardProgram"
    multiplicity: "ManyToOne"
  - name: "cards"
    type: "GiftCard"
    multiplicity: "OneToMany"
- name: "FeeSchedule"
  description: "Rules for charging activation, dormancy, or service fees for a program."
  data:
  - name: "feeType"
    type: "FeeType"
  - name: "amount"
    type: "Money"
  - name: "cadence"
    type: "FeeCadence"
  - name: "startsAfterMonths"
    type: "Integer"
  relations:
  - name: "program"
    type: "GiftCardProgram"
    multiplicity: "ManyToOne"
enums:
- name: "ExpirationPolicyType"
  description: "Rules for how and when a card expires."
  data:
  - name: "None"
  - name: "FixedDate"
  - name: "MonthsAfterActivation"
  - name: "JurisdictionDriven"
- name: "ActivationType"
  description: "Method by which a card becomes active for use."
  data:
  - name: "AutoOnSale"
  - name: "PostSaleActivation"
  - name: "BatchActivation"
- name: "BreakagePolicyType"
  description: "Accounting treatment for unredeemed balances."
  data:
  - name: "RecognizeOnRedemption"
  - name: "RecognizeOnExpected"
  - name: "DeferUntilExpiration"
- name: "SettlementScheduleType"
  description: "Frequency at which settlement is performed."
  data:
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
- name: "LocationType"
  description: "Nature of the place where transactions occur."
  data:
  - name: "Storefront"
  - name: "Online"
  - name: "Kiosk"
- name: "TerminalType"
  description: "Type of terminal or integration performing the transaction."
  data:
  - name: "POS"
  - name: "ECommerceGateway"
  - name: "MobilePOS"
- name: "GiftCardStatus"
  description: "Lifecycle state of a gift card."
  data:
  - name: "Inactive"
  - name: "Active"
  - name: "Suspended"
  - name: "Expired"
  - name: "Closed"
- name: "CustomerType"
  description: "Classification of the cardholder."
  data:
  - name: "Individual"
  - name: "Business"
- name: "IssueChannel"
  description: "Channel through which the card was issued."
  data:
  - name: "InStore"
  - name: "Online"
  - name: "ThirdParty"
  - name: "CorporateBulk"
- name: "OrderStatus"
  description: "Lifecycle of a gift card order."
  data:
  - name: "Draft"
  - name: "PendingPayment"
  - name: "Paid"
  - name: "PartiallyFulfilled"
  - name: "Fulfilled"
  - name: "Cancelled"
- name: "PaymentMethodType"
  description: "Method used to pay for a gift card order."
  data:
  - name: "CreditCard"
  - name: "BankTransfer"
  - name: "Cash"
  - name: "Invoice"
  - name: "ExternalWallet"
- name: "PaymentStatus"
  description: "Processing state of an order payment."
  data:
  - name: "Authorized"
  - name: "Captured"
  - name: "Failed"
  - name: "Refunded"
  - name: "Voided"
- name: "DeliveryMethod"
  description: "Channel used to deliver an e-gift card."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "DownloadLink"
  - name: "None"
- name: "DeliveryStatus"
  description: "Status of a digital delivery attempt."
  data:
  - name: "Pending"
  - name: "Sent"
  - name: "Failed"
  - name: "Cancelled"
- name: "BatchActivationMode"
  description: "How cards within a batch are activated."
  data:
  - name: "PreActivated"
  - name: "ActivateOnSale"
  - name: "ActivateOnFulfillment"
- name: "BatchStatus"
  description: "Lifecycle of a card batch."
  data:
  - name: "Created"
  - name: "InProduction"
  - name: "Shipped"
  - name: "Completed"
  - name: "Archived"
- name: "GiftCardTransactionType"
  description: "Classification of a ledger entry affecting balance."
  data:
  - name: "Issue"
  - name: "Load"
  - name: "Redemption"
  - name: "Refund"
  - name: "AdjustmentCredit"
  - name: "AdjustmentDebit"
  - name: "Expiration"
  - name: "Fee"
  - name: "TransferIn"
  - name: "TransferOut"
  - name: "Reversal"
- name: "LoadChannel"
  description: "Channel used to apply a post-issuance load."
  data:
  - name: "InStore"
  - name: "Online"
  - name: "CustomerService"
- name: "FundingSourceType"
  description: "Source of funds for loads."
  data:
  - name: "CardPayment"
  - name: "Cash"
  - name: "BankTransfer"
  - name: "ExternalSettlement"
- name: "RedemptionStatus"
  description: "State of a redemption transaction."
  data:
  - name: "Authorized"
  - name: "Captured"
  - name: "Reversed"
  - name: "Declined"
- name: "HoldStatus"
  description: "State of an authorization hold."
  data:
  - name: "Open"
  - name: "Captured"
  - name: "Released"
  - name: "Expired"
- name: "RefundReason"
  description: "Reason a refund was credited to a card."
  data:
  - name: "Return"
  - name: "OrderCancellation"
  - name: "PriceAdjustment"
  - name: "Goodwill"
- name: "TransferReason"
  description: "Purpose for moving balance between cards."
  data:
  - name: "Consolidation"
  - name: "Replacement"
  - name: "CustomerRequest"
  - name: "FraudMitigation"
- name: "AdjustmentStatus"
  description: "Status of a manual adjustment case."
  data:
  - name: "Open"
  - name: "Approved"
  - name: "Rejected"
  - name: "Applied"
  - name: "Cancelled"
- name: "AgentRole"
  description: "Role of the support agent."
  data:
  - name: "Support"
  - name: "Finance"
  - name: "Compliance"
  - name: "Admin"
- name: "SettlementStatus"
  description: "Settlement processing state."
  data:
  - name: "Pending"
  - name: "Settled"
  - name: "Failed"
  - name: "Disputed"
- name: "ComplianceReportType"
  description: "Reporting category required by regulation."
  data:
  - name: "Escheatment"
  - name: "UnclaimedProperty"
  - name: "AntiMoneyLaundering"
- name: "FeeType"
  description: "Type of fee charged to the card or purchaser."
  data:
  - name: "ActivationFee"
  - name: "DormancyFee"
  - name: "ServiceFee"
  - name: "ReplacementFee"
- name: "FeeCadence"
  description: "Frequency with which a fee is applied."
  data:
  - name: "OneTime"
  - name: "Monthly"
  - name: "Annually"
- name: "SalesChannelType"
  description: "Classification of a channel where gift cards are sold."
  data:
  - name: "POS"
  - name: "WebStore"
  - name: "MobileApp"
  - name: "Marketplace"
  - name: "BulkCorporate"
valueObjects:
- name: "GiftCardNumber"
  description: "Tokenized or masked number that uniquely represents a gift card for\
    \ processing."
  data:
  - name: "value"
    type: "String"
- name: "GiftCardPIN"
  description: "Secret code used to authenticate access to a card’s balance."
  data:
  - name: "value"
    type: "String"
- name: "Money"
  description: "Monetary value with decimal precision and currency code."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "EmailAddress"
  description: "RFC-compliant email address string."
  data:
  - name: "value"
