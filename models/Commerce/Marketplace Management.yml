---
metadata:
  name: "Marketplace Management Capabilities Model"
  description: "Capabilities for operating a multi-tenant online marketplace including\
    \ seller administration, catalog governance, listings and offers, pricing, and\
    \ inventory."
  version: "1.0.0"
  industry: "Retail and eCommerce"
  category: "Commerce"
  type: "Industry"
  domain: "Marketplace Management"
entities:
- name: "Marketplace"
  description: "Commercial platform where multiple sellers list and sell products\
    \ to customers."
  data:
  - name: "name"
    type: "String"
  - name: "domain"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "categories"
    type: "CatalogCategory"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "Policy"
    multiplicity: "OneToMany"
  - name: "sellers"
    type: "Seller"
    multiplicity: "OneToMany"
  - name: "commissionPlans"
    type: "CommissionPlan"
    multiplicity: "OneToMany"
  - name: "shippingTemplates"
    type: "ShippingTemplate"
    multiplicity: "OneToMany"
  - name: "apiClients"
    type: "APIClient"
    multiplicity: "OneToMany"
  - name: "payoutBatches"
    type: "PayoutBatch"
    multiplicity: "OneToMany"
  - name: "taxonomyMappings"
    type: "TaxonomyMapping"
    multiplicity: "OneToMany"
- name: "Policy"
  description: "Rule or guideline that governs marketplace behavior and participation."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "PolicyType"
  - name: "contentURL"
    type: "URL"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "marketplace"
    type: "Marketplace"
    multiplicity: "ManyToOne"
  - name: "acceptances"
    type: "SellerPolicyAcceptance"
    multiplicity: "OneToMany"
- name: "Seller"
  description: "Independent merchant participating in the marketplace."
  data:
  - name: "displayName"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "status"
    type: "SellerStatus"
  - name: "onboardingDate"
    type: "Date"
  - name: "primaryCountry"
    type: "String"
  - name: "contactEmail"
    type: "String"
  - name: "contactPhone"
    type: "String"
  relations:
  - name: "marketplace"
    type: "Marketplace"
    multiplicity: "ManyToOne"
  - name: "payoutProfile"
    type: "PayoutProfile"
    multiplicity: "OneToOne"
  - name: "listings"
    type: "Listing"
    multiplicity: "OneToMany"
  - name: "offers"
    type: "Offer"
    multiplicity: "OneToMany"
  - name: "fulfillmentNodes"
    type: "FulfillmentNode"
    multiplicity: "OneToMany"
  - name: "inventories"
    type: "Inventory"
    multiplicity: "OneToMany"
  - name: "complianceDocuments"
    type: "ComplianceDocument"
    multiplicity: "OneToMany"
  - name: "reviewsReceived"
    type: "Review"
    multiplicity: "OneToMany"
  - name: "messageThreads"
    type: "MessageThread"
    multiplicity: "OneToMany"
  - name: "suspensions"
    type: "Suspension"
    multiplicity: "OneToMany"
  - name: "commissionPlan"
    type: "CommissionPlan"
    multiplicity: "ManyToOne"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
- name: "SellerPolicyAcceptance"
  description: "Evidence that a seller has accepted a specific marketplace policy."
  data:
  - name: "acceptedAt"
    type: "DateTime"
  - name: "version"
    type: "String"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
- name: "CommissionPlan"
  description: "Structure defining marketplace fees, commissions, and effective periods."
  data:
  - name: "name"
    type: "String"
  - name: "feeModel"
    type: "CommissionFeeModel"
  - name: "commissionRate"
    type: "Percentage"
  - name: "fixedFee"
    type: "Money"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "marketplace"
    type: "Marketplace"
    multiplicity: "ManyToOne"
  - name: "categories"
    type: "CatalogCategory"
    multiplicity: "ManyToMany"
  - name: "sellers"
    type: "Seller"
    multiplicity: "OneToMany"
- name: "CatalogCategory"
  description: "Node in the marketplace product taxonomy."
  data:
  - name: "name"
    type: "String"
  - name: "slug"
    type: "String"
  - name: "isLeaf"
    type: "Boolean"
  - name: "path"
    type: "String"
  relations:
  - name: "marketplace"
    type: "Marketplace"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "CatalogCategory"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "CatalogCategory"
    multiplicity: "OneToMany"
  - name: "attributeDefinitions"
    type: "AttributeDefinition"
    multiplicity: "ManyToMany"
  - name: "catalogItems"
    type: "CatalogItem"
    multiplicity: "OneToMany"
  - name: "commissionPlans"
    type: "CommissionPlan"
    multiplicity: "ManyToMany"
- name: "AttributeDefinition"
  description: "Definition of a structured attribute used to describe catalog items\
    \ and listings."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "AttributeDataType"
  - name: "required"
    type: "Boolean"
  - name: "unit"
    type: "String"
  - name: "searchable"
    type: "Boolean"
  - name: "facetable"
    type: "Boolean"
  relations:
  - name: "categories"
    type: "CatalogCategory"
    multiplicity: "ManyToMany"
  - name: "options"
    type: "AttributeOption"
    multiplicity: "OneToMany"
- name: "AttributeOption"
  description: "Allowed option for an attribute with constrained values."
  data:
  - name: "value"
    type: "String"
  - name: "displayOrder"
    type: "Integer"
  relations:
  - name: "attributeDefinition"
    type: "AttributeDefinition"
    multiplicity: "ManyToOne"
- name: "CatalogItem"
  description: "Canonical catalog representation of a product shared across sellers."
  data:
  - name: "title"
    type: "String"
  - name: "brand"
    type: "String"
  - name: "gtin"
    type: "String"
  - name: "manufacturerPartNumber"
    type: "String"
  - name: "condition"
    type: "Condition"
  - name: "description"
    type: "String"
  relations:
  - name: "categories"
    type: "CatalogCategory"
    multiplicity: "ManyToMany"
  - name: "listings"
    type: "Listing"
    multiplicity: "OneToMany"
- name: "Listing"
  description: "Seller-authored presentation of a catalog item in the marketplace."
  data:
  - name: "listingCode"
    type: "String"
  - name: "title"
    type: "String"
  - name: "status"
    type: "ListingStatus"
  - name: "condition"
    type: "Condition"
  - name: "createdDate"
    type: "DateTime"
  - name: "lastUpdated"
    type: "DateTime"
  relations:
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "catalogItem"
    type: "CatalogItem"
    multiplicity: "ManyToOne"
  - name: "offers"
    type: "Offer"
    multiplicity: "OneToMany"
  - name: "images"
    type: "ImageAsset"
    multiplicity: "OneToMany"
  - name: "attributeValues"
    type: "ListingAttributeValue"
    multiplicity: "OneToMany"
  - name: "moderationCases"
    type: "ModerationCase"
    multiplicity: "OneToMany"
  - name: "reviews"
    type: "Review"
    multiplicity: "OneToMany"
  - name: "questions"
    type: "CustomerQuestion"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
- name: "ListingAttributeValue"
  description: "Concrete value for a listing’s attribute based on its definition."
  data:
  - name: "normalizedValue"
    type: "String"
  relations:
  - name: "listing"
    type: "Listing"
    multiplicity: "ManyToOne"
  - name: "attributeDefinition"
    type: "AttributeDefinition"
    multiplicity: "ManyToOne"
- name: "ImageAsset"
  description: "Visual asset associated with a listing."
  data:
  - name: "url"
    type: "URL"
  - name: "altText"
    type: "String"
  - name: "position"
    type: "Integer"
  - name: "status"
    type: "AssetStatus"
  relations:
  - name: "listing"
    type: "Listing"
    multiplicity: "ManyToOne"
- name: "Offer"
  description: "Commercial terms under which a listing is sold."
  data:
  - name: "sku"
    type: "SKU"
  - name: "status"
    type: "OfferStatus"
  - name: "price"
    type: "Money"
  - name: "minQuantity"
    type: "Integer"
  - name: "maxQuantity"
    type: "Integer"
  - name: "shippingLeadTimeDays"
    type: "Integer"
  - name: "isPreorder"
    type: "Boolean"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "listing"
    type: "Listing"
    multiplicity: "ManyToOne"
  - name: "inventory"
    type: "Inventory"
    multiplicity: "ManyToOne"
  - name: "shippingTemplate"
    type: "ShippingTemplate"
    multiplicity: "ManyToOne"
  - name: "pricingRules"
    type: "PricingRule"
    multiplicity: "ManyToMany"
- name: "FulfillmentNode"
  description: "Physical or virtual node responsible for storing inventory and shipping\
    \ orders."
  data:
  - name: "name"
    type: "String"
  - name: "country"
    type: "String"
  - name: "region"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "inventories"
    type: "Inventory"
    multiplicity: "OneToMany"
  - name: "shippingTemplates"
    type: "ShippingTemplate"
    multiplicity: "ManyToMany"
- name: "Inventory"
  description: "Stock availability for a SKU at a fulfillment node."
  data:
  - name: "quantityOnHand"
    type: "Integer"
  - name: "quantityReserved"
    type: "Integer"
  - name: "restockDate"
    type: "Date"
  - name: "backorderAllowed"
    type: "Boolean"
  relations:
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "fulfillmentNode"
    type: "FulfillmentNode"
    multiplicity: "ManyToOne"
- name: "ShippingTemplate"
  description: "Seller-defined shipping configuration applied to offers or nodes."
  data:
  - name: "name"
    type: "String"
  - name: "handlingTimeDays"
    type: "Integer"
  - name: "defaultCarrier"
    type: "String"
  - name: "regionRestrictions"
    type: "String"
  relations:
  - name: "marketplace"
    type: "Marketplace"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "shippingRates"
    type: "ShippingRate"
    multiplicity: "OneToMany"
  - name: "offers"
    type: "Offer"
    multiplicity: "ManyToMany"
  - name: "fulfillmentNodes"
    type: "FulfillmentNode"
    multiplicity: "ManyToMany"
- name: "ShippingRate"
  description: "Price and transit time for a specific shipping service level."
  data:
  - name: "serviceLevel"
    type: "ServiceLevel"
  - name: "minTransitDays"
    type: "Integer"
  - name: "maxTransitDays"
    type: "Integer"
  - name: "rate"
    type: "Money"
  - name: "destinationCountry"
    type: "String"
  relations:
  - name: "shippingTemplate"
    type: "ShippingTemplate"
    multiplicity: "ManyToOne"
- name: "PricingRule"
  description: "Configurable logic that adjusts offer pricing based on conditions."
  data:
  - name: "ruleName"
    type: "String"
  - name: "ruleType"
    type: "PricingRuleType"
  - name: "isActive"
    type: "Boolean"
  - name: "priority"
    type: "Integer"
  relations:
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "offers"
    type: "Offer"
    multiplicity: "ManyToMany"
- name: "Review"
  description: "Customer feedback assessing product and seller experience."
  data:
  - name: "rating"
    type: "Integer"
  - name: "title"
    type: "String"
  - name: "content"
    type: "String"
  - name: "status"
    type: "ReviewStatus"
  - name: "createdAt"
    type: "DateTime"
  - name: "helpfulVotes"
    type: "Integer"
  relations:
  - name: "listing"
    type: "Listing"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "moderationCase"
    type: "ModerationCase"
    multiplicity: "ManyToOne"
- name: "CustomerQuestion"
  description: "Question posed by a customer regarding a listing."
  data:
  - name: "questionText"
    type: "String"
  - name: "askedAt"
    type: "DateTime"
  - name: "status"
    type: "QuestionStatus"
  relations:
  - name: "listing"
    type: "Listing"
    multiplicity: "ManyToOne"
  - name: "answers"
    type: "Answer"
    multiplicity: "OneToMany"
- name: "Answer"
  description: "Seller or moderator response to a customer question."
  data:
  - name: "answerText"
    type: "String"
  - name: "answeredAt"
    type: "DateTime"
  - name: "authorType"
    type: "AnswerAuthorType"
  - name: "status"
    type: "AnswerStatus"
  relations:
  - name: "question"
    type: "CustomerQuestion"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "moderator"
    type: "Moderator"
    multiplicity: "ManyToOne"
- name: "ModerationCase"
  description: "Case tracking for review and enforcement of marketplace content standards."
  data:
  - name: "caseNumber"
    type: "String"
  - name: "reason"
    type: "ModerationReason"
  - name: "status"
    type: "ModerationStatus"
  - name: "openedAt"
    type: "DateTime"
  - name: "closedAt"
    type: "DateTime"
  - name: "notes"
    type: "String"
  relations:
  - name: "listing"
    type: "Listing"
    multiplicity: "ManyToOne"
  - name: "catalogItem"
    type: "CatalogItem"
    multiplicity: "ManyToOne"
  - name: "review"
    type: "Review"
    multiplicity: "ManyToOne"
  - name: "openedBy"
    type: "Moderator"
    multiplicity: "ManyToOne"
  - name: "closedBy"
    type: "Moderator"
    multiplicity: "ManyToOne"
- name: "Moderator"
  description: "Marketplace staff member who reviews content and enforces policies."
  data:
  - name: "name"
    type: "String"
  - name: "email"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "marketplace"
    type: "Marketplace"
    multiplicity: "ManyToOne"
  - name: "moderationCases"
    type: "ModerationCase"
    multiplicity: "OneToMany"
  - name: "messages"
    type: "Message"
    multiplicity: "OneToMany"
- name: "ComplianceDocument"
  description: "Documentation provided by a seller to meet regulatory or marketplace\
    \ requirements."
  data:
  - name: "documentType"
    type: "ComplianceDocumentType"
  - name: "status"
    type: "ComplianceStatus"
  - name: "fileURL"
    type: "URL"
  - name: "submittedAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "Date"
  relations:
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "reviews"
    type: "ComplianceReview"
    multiplicity: "OneToMany"
- name: "ComplianceReview"
  description: "Review activity and decision on a compliance document."
  data:
  - name: "status"
    type: "ComplianceStatus"
  - name: "reviewedAt"
    type: "DateTime"
  - name: "reviewerNotes"
    type: "String"
  relations:
  - name: "complianceDocument"
    type: "ComplianceDocument"
    multiplicity: "ManyToOne"
  - name: "reviewer"
    type: "Moderator"
    multiplicity: "ManyToOne"
- name: "APIClient"
  description: "Registered integration client used by the marketplace or sellers."
  data:
  - name: "name"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  - name: "accessType"
    type: "APIAccessType"
  - name: "createdAt"
    type: "DateTime"
  relations:
  - name: "marketplace"
    type: "Marketplace"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "webhookSubscriptions"
    type: "WebhookSubscription"
    multiplicity: "OneToMany"
  - name: "feedSubmissions"
    type: "FeedSubmission"
    multiplicity: "OneToMany"
- name: "WebhookSubscription"
  description: "Outbound event subscription for asynchronous notifications."
  data:
  - name: "topic"
    type: "WebhookTopic"
  - name: "targetURL"
    type: "URL"
  - name: "active"
    type: "Boolean"
  - name: "secret"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  relations:
  - name: "apiClient"
    type: "APIClient"
    multiplicity: "ManyToOne"
  - name: "marketplace"
    type: "Marketplace"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
- name: "FeedSubmission"
  description: "Batch file submission for creating or updating listings, offers, or\
    \ inventory."
  data:
  - name: "feedType"
    type: "FeedType"
  - name: "submittedAt"
    type: "DateTime"
  - name: "status"
    type: "FeedStatus"
  - name: "fileURL"
    type: "URL"
  - name: "processingSummary"
    type: "String"
  relations:
  - name: "apiClient"
    type: "APIClient"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "FeedItemResult"
    multiplicity: "OneToMany"
- name: "FeedItemResult"
  description: "Result of processing an individual record within a feed submission."
  data:
  - name: "recordNumber"
    type: "Integer"
  - name: "status"
    type: "FeedItemStatus"
  - name: "message"
    type: "String"
  relations:
  - name: "feedSubmission"
    type: "FeedSubmission"
    multiplicity: "ManyToOne"
  - name: "listing"
    type: "Listing"
    multiplicity: "ManyToOne"
  - name: "offer"
    type: "Offer"
    multiplicity: "ManyToOne"
- name: "PayoutProfile"
  description: "Seller’s configuration for payout schedule and thresholds."
  data:
  - name: "payoutSchedule"
    type: "PayoutSchedule"
  - name: "minimumPayout"
    type: "Money"
  - name: "beneficiaryName"
    type: "String"
  - name: "bankCountry"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "payouts"
    type: "Payout"
    multiplicity: "OneToMany"
- name: "PayoutBatch"
  description: "Group of payouts processed together by the marketplace."
  data:
  - name: "batchReference"
    type: "String"
  - name: "status"
    type: "PayoutBatchStatus"
  - name: "scheduledFor"
    type: "Date"
  - name: "totalAmount"
    type: "Money"
  relations:
  - name: "marketplace"
    type: "Marketplace"
    multiplicity: "ManyToOne"
  - name: "payouts"
    type: "Payout"
    multiplicity: "OneToMany"
- name: "Payout"
  description: "Funds remitted by the marketplace to a seller."
  data:
  - name: "payoutReference"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "PayoutStatus"
  - name: "createdAt"
    type: "DateTime"
  - name: "paidAt"
    type: "DateTime"
  relations:
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "payoutBatch"
    type: "PayoutBatch"
    multiplicity: "ManyToOne"
  - name: "payoutProfile"
    type: "PayoutProfile"
    multiplicity: "ManyToOne"
- name: "MessageThread"
  description: "Communication channel between a seller and marketplace staff."
  data:
  - name: "subject"
    type: "String"
  - name: "status"
    type: "MessageStatus"
  - name: "createdAt"
    type: "DateTime"
  relations:
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "moderator"
    type: "Moderator"
    multiplicity: "ManyToOne"
  - name: "messages"
    type: "Message"
    multiplicity: "OneToMany"
- name: "Message"
  description: "Individual message posted within a thread."
  data:
  - name: "senderType"
    type: "MessageSenderType"
  - name: "body"
    type: "String"
  - name: "sentAt"
    type: "DateTime"
  relations:
  - name: "thread"
    type: "MessageThread"
    multiplicity: "ManyToOne"
- name: "Suspension"
  description: "Restriction imposed on a seller for violating marketplace policies."
  data:
  - name: "reason"
    type: "SuspensionReason"
  - name: "status"
    type: "SuspensionStatus"
  - name: "effectiveFrom"
    type: "DateTime"
  - name: "effectiveTo"
    type: "DateTime"
  - name: "notes"
    type: "String"
  relations:
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "moderator"
    type: "Moderator"
    multiplicity: "ManyToOne"
- name: "AuditEvent"
  description: "Immutable record of notable actions within the marketplace."
  data:
  - name: "eventType"
    type: "AuditEventType"
  - name: "occurredAt"
    type: "DateTime"
  - name: "actorType"
    type: "ActorType"
  - name: "description"
    type: "String"
  relations:
  - name: "marketplace"
    type: "Marketplace"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "listing"
    type: "Listing"
    multiplicity: "ManyToOne"
  - name: "offer"
    type: "Offer"
    multiplicity: "ManyToOne"
- name: "TaxonomyMapping"
  description: "Mapping of an external source category to the marketplace taxonomy."
  data:
  - name: "sourceSystem"
    type: "String"
  - name: "sourceCategoryPath"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "marketplace"
    type: "Marketplace"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "CatalogCategory"
    multiplicity: "ManyToOne"
- name: "Tag"
  description: "Label used to group and annotate sellers or listings for operational\
