---
metadata:
  name: "Fulfillment"
  description: "Capabilities model for warehouse and logistics fulfillment, covering\
    \ sourcing, allocation, picking, packing, and carrier handoff for customer orders."
  version: "1.0.0"
  industry: "Retail and Logistics"
  category: "Commerce"
  type: "Capability"
  domain: "Fulfillment"
entities:
- name: "FulfillmentCenter"
  description: "Facility that receives inventory, stores goods, and executes picking,\
    \ packing, and shipping operations."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "defaultTemperatureZone"
    type: "TemperatureZone"
  relations:
  - name: "storageAreas"
    type: "StorageArea"
    multiplicity: "OneToMany"
  - name: "packStations"
    type: "PackStation"
    multiplicity: "OneToMany"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
  - name: "carrierContracts"
    type: "CarrierContract"
    multiplicity: "OneToMany"
- name: "StorageArea"
  description: "Logical zone within a fulfillment center used to group bins for storage,\
    \ picking, or staging."
  data:
  - name: "name"
    type: "String"
  - name: "areaType"
    type: "StorageAreaType"
  relations:
  - name: "fulfillmentCenter"
    type: "FulfillmentCenter"
    multiplicity: "ManyToOne"
  - name: "bins"
    type: "Bin"
    multiplicity: "OneToMany"
- name: "Bin"
  description: "Physical storage location used to hold inventory and guide picking."
  data:
  - name: "code"
    type: "String"
  - name: "binType"
    type: "BinType"
  - name: "capacityUnits"
    type: "Integer"
  - name: "temperatureZone"
    type: "TemperatureZone"
  relations:
  - name: "storageArea"
    type: "StorageArea"
    multiplicity: "ManyToOne"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
- name: "Item"
  description: "Fulfillable catalog entity that defines stock-keeping and handling\
    \ characteristics."
  data:
  - name: "sku"
    type: "String"
  - name: "name"
    type: "String"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  - name: "serialTracking"
    type: "Boolean"
  - name: "perishable"
    type: "Boolean"
  relations:
  - name: "orderLines"
    type: "OrderLine"
    multiplicity: "OneToMany"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
- name: "InventoryItem"
  description: "Inventory position for a specific item and bin, tracking on-hand and\
    \ reserved quantities."
  data:
  - name: "lotNumber"
    type: "String"
  - name: "expirationDate"
    type: "Date"
  - name: "quantityOnHand"
    type: "Integer"
  - name: "quantityReserved"
    type: "Integer"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "bin"
    type: "Bin"
    multiplicity: "ManyToOne"
- name: "CustomerOrder"
  description: "Customer purchase that is sourced and executed by fulfillment operations."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "channel"
    type: "OrderChannel"
  - name: "requestedShipDate"
    type: "Date"
  - name: "priority"
    type: "FulfillmentPriority"
  - name: "destination"
    type: "Address"
  relations:
  - name: "orderLines"
    type: "OrderLine"
    multiplicity: "OneToMany"
  - name: "allocations"
    type: "Allocation"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "deliveryPromise"
    type: "DeliveryPromise"
    multiplicity: "OneToOne"
  - name: "holds"
    type: "OrderHold"
    multiplicity: "OneToMany"
  - name: "wave"
    type: "Wave"
    multiplicity: "ManyToOne"
- name: "OrderLine"
  description: "Line-level request for a specific item and quantity within an order."
  data:
  - name: "sku"
    type: "String"
  - name: "quantity"
    type: "Integer"
  - name: "backorderAllowed"
    type: "Boolean"
  relations:
  - name: "order"
    type: "CustomerOrder"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "allocations"
    type: "Allocation"
    multiplicity: "OneToMany"
  - name: "pickTasks"
    type: "PickTask"
    multiplicity: "OneToMany"
  - name: "packTasks"
    type: "PackTask"
    multiplicity: "OneToMany"
  - name: "shipmentItems"
    type: "ShipmentItem"
    multiplicity: "OneToMany"
- name: "SourcingRule"
  description: "Policy that determines how demand is matched to supply across facilities\
    \ and inventory."
  data:
  - name: "name"
    type: "String"
  - name: "method"
    type: "AllocationMethod"
  - name: "region"
    type: "String"
  - name: "priority"
    type: "Integer"
  relations:
  - name: "fulfillmentCenters"
    type: "FulfillmentCenter"
    multiplicity: "ManyToMany"
- name: "Allocation"
  description: "Reservation of inventory to satisfy an order line using a selected\
    \ method."
  data:
  - name: "quantity"
    type: "Integer"
  - name: "status"
    type: "AllocationStatus"
  - name: "method"
    type: "AllocationMethod"
  relations:
  - name: "orderLine"
    type: "OrderLine"
    multiplicity: "ManyToOne"
  - name: "inventoryItem"
    type: "InventoryItem"
    multiplicity: "ManyToOne"
  - name: "wave"
    type: "Wave"
    multiplicity: "ManyToOne"
- name: "Wave"
  description: "Grouping of orders and tasks released together for coordinated picking."
  data:
  - name: "waveNumber"
    type: "String"
  - name: "scheduledDate"
    type: "Date"
  - name: "status"
    type: "WaveStatus"
  relations:
  - name: "orders"
    type: "CustomerOrder"
    multiplicity: "OneToMany"
  - name: "pickBatches"
    type: "PickBatch"
    multiplicity: "OneToMany"
  - name: "allocations"
    type: "Allocation"
    multiplicity: "OneToMany"
- name: "PickBatch"
  description: "Assigned set of pick tasks grouped for a worker or device."
  data:
  - name: "batchNumber"
    type: "String"
  - name: "pickMethod"
    type: "PickMethod"
  - name: "status"
    type: "PickingStatus"
  relations:
  - name: "wave"
    type: "Wave"
    multiplicity: "ManyToOne"
  - name: "picker"
    type: "Worker"
    multiplicity: "ManyToOne"
  - name: "pickTasks"
    type: "PickTask"
    multiplicity: "OneToMany"
- name: "PickTask"
  description: "Instruction to retrieve a quantity of an item from a bin for an order."
  data:
  - name: "quantity"
    type: "Integer"
  - name: "status"
    type: "PickingStatus"
  relations:
  - name: "pickBatch"
    type: "PickBatch"
    multiplicity: "ManyToOne"
  - name: "orderLine"
    type: "OrderLine"
    multiplicity: "ManyToOne"
  - name: "bin"
    type: "Bin"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
- name: "PackSession"
  description: "Packaging workflow instance that prepares items and documents for\
    \ shipment."
  data:
  - name: "sessionNumber"
    type: "String"
  - name: "packagingType"
    type: "PackagingType"
  - name: "status"
    type: "PackingStatus"
  relations:
  - name: "order"
    type: "CustomerOrder"
    multiplicity: "ManyToOne"
  - name: "packStation"
    type: "PackStation"
    multiplicity: "ManyToOne"
  - name: "packTasks"
    type: "PackTask"
    multiplicity: "OneToMany"
  - name: "parcels"
    type: "Parcel"
    multiplicity: "OneToMany"
- name: "PackTask"
  description: "Instruction to place a quantity of an order line into a parcel."
  data:
  - name: "quantity"
    type: "Integer"
  - name: "status"
    type: "PackingStatus"
  relations:
  - name: "packSession"
    type: "PackSession"
    multiplicity: "ManyToOne"
  - name: "orderLine"
    type: "OrderLine"
    multiplicity: "ManyToOne"
- name: "PackStation"
  description: "Work area equipped for packing, labeling, and documentation."
  data:
  - name: "stationCode"
    type: "String"
  - name: "capability"
    type: "String"
  relations:
  - name: "fulfillmentCenter"
    type: "FulfillmentCenter"
    multiplicity: "ManyToOne"
  - name: "sessions"
    type: "PackSession"
    multiplicity: "OneToMany"
- name: "Shipment"
  description: "Outbound movement of one or more parcels consigned to a carrier."
  data:
  - name: "shipDate"
    type: "Date"
  - name: "status"
    type: "ShipmentStatus"
  - name: "shippingCost"
    type: "Money"
  relations:
  - name: "order"
    type: "CustomerOrder"
    multiplicity: "ManyToOne"
  - name: "shipmentItems"
    type: "ShipmentItem"
    multiplicity: "OneToMany"
  - name: "parcels"
    type: "Parcel"
    multiplicity: "OneToMany"
  - name: "carrierService"
    type: "CarrierService"
    multiplicity: "ManyToOne"
- name: "ShipmentItem"
  description: "Portion of an order line included within a shipment."
  data:
  - name: "quantity"
    type: "Integer"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "orderLine"
    type: "OrderLine"
    multiplicity: "ManyToOne"
- name: "Parcel"
  description: "Individual package with defined physical attributes and labels."
  data:
  - name: "packageReference"
    type: "String"
  - name: "packagingType"
    type: "PackagingType"
  - name: "weight"
    type: "Weight"
  - name: "dimensions"
    type: "Dimensions"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "labels"
    type: "ShippingLabel"
    multiplicity: "OneToMany"
- name: "ShippingLabel"
  description: "Carrier-compliant label artifact used to identify and route a parcel."
  data:
  - name: "labelFormat"
    type: "LabelFormat"
  - name: "labelUrl"
    type: "String"
  relations:
  - name: "parcel"
    type: "Parcel"
    multiplicity: "ManyToOne"
- name: "Carrier"
  description: "Third-party transportation provider for parcel and freight movements."
  data:
  - name: "name"
    type: "String"
  - name: "scac"
    type: "String"
  relations:
  - name: "contracts"
    type: "CarrierContract"
    multiplicity: "OneToMany"
- name: "CarrierContract"
  description: "Agreement defining available services, rates, and terms between a\
    \ facility and a carrier."
  data:
  - name: "contractCode"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "services"
    type: "CarrierService"
    multiplicity: "OneToMany"
  - name: "fulfillmentCenter"
    type: "FulfillmentCenter"
    multiplicity: "ManyToOne"
- name: "CarrierService"
  description: "Specific shipping service with a defined service level and expected\
    \ transit time."
  data:
  - name: "name"
    type: "String"
  - name: "serviceLevel"
    type: "ServiceLevelType"
  - name: "transitTimeDays"
    type: "Integer"
  relations:
  - name: "carrierContract"
    type: "CarrierContract"
    multiplicity: "ManyToOne"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
- name: "DeliveryPromise"
  description: "Commitment of when an order will ship and arrive based on capacity\
    \ and carrier performance."
  data:
  - name: "promisedShipDate"
    type: "Date"
  - name: "promisedDeliveryDate"
    type: "Date"
  - name: "promiseType"
    type: "PromiseType"
  - name: "status"
    type: "PromiseStatus"
  relations:
  - name: "order"
    type: "CustomerOrder"
    multiplicity: "ManyToOne"
- name: "OrderHold"
  description: "Operational block that prevents an order from progressing until resolved."
  data:
  - name: "reason"
    type: "HoldReason"
  - name: "status"
    type: "HoldStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "order"
    type: "CustomerOrder"
    multiplicity: "ManyToOne"
- name: "Worker"
  description: "Human resource performing warehouse tasks such as picking and packing."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "role"
    type: "WorkerRole"
  relations:
  - name: "pickBatches"
    type: "PickBatch"
    multiplicity: "OneToMany"
  - name: "packSessions"
    type: "PackSession"
    multiplicity: "OneToMany"
enums:
- name: "OrderChannel"
  description: "Origin channel through which a customer order was captured."
  data:
  - name: "Ecommerce"
  - name: "Marketplace"
  - name: "RetailStore"
  - name: "B2B"
  - name: "Subscription"
- name: "FulfillmentPriority"
  description: "Operational urgency assigned to an order for planning and execution."
  data:
  - name: "Low"
  - name: "Normal"
  - name: "High"
  - name: "Rush"
- name: "StorageAreaType"
  description: "Functional classification of a storage area within a facility."
  data:
  - name: "Receiving"
  - name: "BulkStorage"
  - name: "PickFace"
  - name: "Replenishment"
  - name: "Staging"
  - name: "Dock"
- name: "BinType"
  description: "Physical or logical type of a bin used for storage or picking."
  data:
  - name: "Pallet"
  - name: "Shelf"
  - name: "FlowRack"
  - name: "Bin"
  - name: "Floor"
  - name: "ColdStorage"
- name: "TemperatureZone"
  description: "Environmental condition required for storing temperature-sensitive\
    \ goods."
  data:
  - name: "Ambient"
  - name: "Chilled"
  - name: "Frozen"
  - name: "ControlledRoomTemp"
- name: "UnitOfMeasure"
  description: "Units used to express quantity and dimensions for logistics."
  data:
  - name: "Each"
  - name: "Case"
  - name: "Pallet"
  - name: "Kilogram"
  - name: "Pound"
  - name: "Gram"
  - name: "Ounce"
  - name: "Centimeter"
  - name: "Inch"
- name: "AllocationMethod"
  description: "Strategy used to source and reserve inventory for demand."
  data:
  - name: "FIFO"
  - name: "FEFO"
  - name: "LIFO"
  - name: "OptimalPath"
  - name: "Manual"
- name: "AllocationStatus"
  description: "Lifecycle state of an allocation from reservation to release."
  data:
  - name: "Pending"
  - name: "Reserved"
  - name: "Released"
  - name: "Shorted"
  - name: "Cancelled"
- name: "WaveStatus"
  description: "Execution state of a wave used to coordinate picking."
  data:
  - name: "Planned"
  - name: "Released"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
- name: "PickMethod"
  description: "Operational technique used to organize and execute picking."
  data:
  - name: "Discrete"
  - name: "Batch"
  - name: "Cluster"
  - name: "Zone"
  - name: "Wave"
- name: "PickingStatus"
  description: "Progress state for picking work."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Completed"
  - name: "Exception"
- name: "PackagingType"
  description: "Type of packaging material or container used for parcels."
  data:
  - name: "PolyMail"
  - name: "Box"
  - name: "Satchel"
  - name: "Tube"
  - name: "Crate"
- name: "PackingStatus"
  description: "Progress state for packing activities."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Packed"
  - name: "Exception"
- name: "ShipmentStatus"
  description: "Carrier movement state for a shipment lifecycle."
  data:
  - name: "Ready"
  - name: "Manifested"
  - name: "InTransit"
  - name: "Delivered"
  - name: "Exception"
  - name: "Cancelled"
- name: "LabelFormat"
  description: "Output format for printed or digital shipping labels."
  data:
  - name: "PDF"
  - name: "ZPL"
  - name: "PNG"
- name: "ServiceLevelType"
  description: "Service tier defining transit speed and delivery commitment."
  data:
  - name: "Economy"
  - name: "Standard"
  - name: "Expedited"
  - name: "Overnight"
  - name: "SameDay"
- name: "PromiseType"
  description: "Kind of commitment communicated to the customer for fulfillment timing."
  data:
  - name: "ShipDate"
  - name: "DeliveryDate"
  - name: "DeliveryWindow"
- name: "PromiseStatus"
  description: "State of an order promise in relation to execution outcomes."
  data:
  - name: "Estimated"
  - name: "Committed"
  - name: "Breached"
  - name: "Kept"
  - name: "Revoked"
- name: "HoldReason"
  description: "Business justification for placing an order on hold."
  data:
  - name: "PaymentVerification"
  - name: "AddressIssue"
  - name: "FraudReview"
  - name: "InventoryShortage"
  - name: "CustomerRequest"
- name: "HoldStatus"
  description: "Lifecycle state of a hold applied to an order."
  data:
  - name: "Open"
  - name: "Released"
  - name: "Voided"
- name: "WorkerRole"
  description: "Primary function of a warehouse worker within fulfillment operations."
  data:
  - name: "Picker"
  - name: "Packer"
  - name: "Lead"
  - name: "Supervisor"
  - name: "Clerk"
valueObjects:
- name: "Money"
  description: "Monetary value expressed as an amount and currency for pricing and\
    \ costs."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal destination used for shipping, routing, and documentation."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "Weight"
  description: "Measure of mass used for rate shopping and carrier compliance."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
- name: "Dimensions"
  description: "Physical size measurements used for packaging selection and carrier\
    \ rating."
  data:
  - name: "length"
    type: "Decimal"
  - name: "width"
    type: "Decimal"
  - name: "height"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
- name: "TimeWindow"
  description: "Period between two dates representing a delivery or operation window."
  data:
  - name: "start"
    type: "Date"
  - name: "end"
    type: "Date"
