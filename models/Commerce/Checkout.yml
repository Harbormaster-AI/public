---
metadata:
  name: "Checkout"
  description: "Capabilities model for orchestrating checkout, pricing, taxes, shipping\
    \ selection, risk, and payments prior to order creation."
  version: "1.0.0"
  industry: "Retail"
  category: "Commerce"
  type: "Capability"
  domain: "Checkout"
entities:
- name: "Merchant"
  description: "Commercial entity offering goods or services and configuring checkout\
    \ behavior."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "domain"
    type: "String"
  relations:
  - name: "paymentGateways"
    type: "PaymentGatewayConfig"
    multiplicity: "OneToMany"
  - name: "shippingProfiles"
    type: "ShippingProfile"
    multiplicity: "OneToMany"
  - name: "taxProfiles"
    type: "TaxProfile"
    multiplicity: "OneToMany"
  - name: "riskRulesets"
    type: "RiskRuleset"
    multiplicity: "OneToMany"
  - name: "feesSchedules"
    type: "FeesSchedule"
    multiplicity: "OneToMany"
  - name: "checkoutSessions"
    type: "CheckoutSession"
    multiplicity: "OneToMany"
- name: "PaymentGatewayConfig"
  description: "Connection settings and capabilities for a payment processor."
  data:
  - name: "name"
    type: "String"
  - name: "provider"
    type: "PaymentProvider"
  - name: "captureMode"
    type: "CaptureMode"
  - name: "transactionCurrencyMode"
    type: "CurrencyMode"
  - name: "threeDSMode"
    type: "ThreeDSMode"
  - name: "settlementDelayDays"
    type: "Integer"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
- name: "CheckoutSession"
  description: "Transaction context where a buyer confirms items, addresses, shipping,\
    \ taxes, and payment before order submission."
  data:
  - name: "status"
    type: "CheckoutStatus"
  - name: "locale"
    type: "String"
  - name: "currency"
    type: "String"
  - name: "createdDate"
    type: "Date"
  - name: "billingAddress"
    type: "Address"
  - name: "shippingAddress"
    type: "Address"
  - name: "channel"
    type: "SalesChannel"
  - name: "grandTotal"
    type: "Money"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "lineItems"
    type: "CheckoutLineItem"
    multiplicity: "OneToMany"
  - name: "selectedShippingOption"
    type: "ShippingOption"
    multiplicity: "ManyToOne"
  - name: "paymentInstructions"
    type: "PaymentInstruction"
    multiplicity: "OneToMany"
  - name: "appliedPromotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "OneToOne"
  - name: "taxSummary"
    type: "TaxSummary"
    multiplicity: "OneToOne"
  - name: "orderReview"
    type: "OrderReview"
    multiplicity: "OneToOne"
  - name: "complianceCheck"
    type: "ComplianceCheck"
    multiplicity: "OneToOne"
  - name: "shippingRateQuotes"
    type: "ShippingRateQuote"
    multiplicity: "OneToMany"
  - name: "surcharges"
    type: "Surcharge"
    multiplicity: "OneToMany"
  - name: "giftCardRedemptions"
    type: "GiftCardRedemption"
    multiplicity: "OneToMany"
  - name: "taxExemption"
    type: "TaxExemption"
    multiplicity: "ManyToOne"
  - name: "addressValidation"
    type: "AddressValidation"
    multiplicity: "OneToOne"
- name: "CheckoutLineItem"
  description: "Product or service selection included in the checkout session."
  data:
  - name: "sku"
    type: "String"
  - name: "name"
    type: "String"
  - name: "quantity"
    type: "Integer"
  - name: "unitPrice"
    type: "Money"
  - name: "subtotal"
    type: "Money"
  - name: "itemType"
    type: "LineItemType"
  relations:
  - name: "checkoutSession"
    type: "CheckoutSession"
    multiplicity: "ManyToOne"
  - name: "taxes"
    type: "LineItemTaxLine"
    multiplicity: "OneToMany"
  - name: "discounts"
    type: "LineItemDiscount"
    multiplicity: "OneToMany"
- name: "LineItemTaxLine"
  description: "Calculated tax component attached to a specific line item."
  data:
  - name: "taxName"
    type: "String"
  - name: "rate"
    type: "Decimal"
  - name: "amount"
    type: "Money"
  - name: "jurisdiction"
    type: "String"
  - name: "taxType"
    type: "TaxType"
  relations:
  - name: "lineItem"
    type: "CheckoutLineItem"
    multiplicity: "ManyToOne"
  - name: "taxSummary"
    type: "TaxSummary"
    multiplicity: "ManyToOne"
- name: "LineItemDiscount"
  description: "Discount benefit applied to a specific line item."
  data:
  - name: "description"
    type: "String"
  - name: "discountType"
    type: "DiscountType"
  - name: "calculationBasis"
    type: "DiscountBasis"
  - name: "amount"
    type: "Money"
  relations:
  - name: "lineItem"
    type: "CheckoutLineItem"
    multiplicity: "ManyToOne"
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
- name: "TaxSummary"
  description: "Aggregated tax computation for the checkout session."
  data:
  - name: "totalTax"
    type: "Money"
  - name: "calculationMethod"
    type: "TaxCalculationMethod"
  - name: "taxableAmount"
    type: "Money"
  relations:
  - name: "checkoutSession"
    type: "CheckoutSession"
    multiplicity: "ManyToOne"
  - name: "taxLines"
    type: "SummaryTaxLine"
    multiplicity: "OneToMany"
- name: "SummaryTaxLine"
  description: "Rollup of a tax component across items and shipping."
  data:
  - name: "taxName"
    type: "String"
  - name: "rate"
    type: "Decimal"
  - name: "amount"
    type: "Money"
  - name: "jurisdiction"
    type: "String"
  - name: "scope"
    type: "TaxScope"
  relations:
  - name: "taxSummary"
    type: "TaxSummary"
    multiplicity: "ManyToOne"
- name: "ShippingProfile"
  description: "Merchant-defined shipping configuration and origins."
  data:
  - name: "name"
    type: "String"
  - name: "originCountry"
    type: "String"
  - name: "originPostalCode"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "options"
    type: "ShippingOption"
    multiplicity: "OneToMany"
- name: "ShippingOption"
  description: "Purchasable delivery option offered at checkout."
  data:
  - name: "name"
    type: "String"
  - name: "carrier"
    type: "String"
  - name: "serviceLevel"
    type: "ShippingServiceLevel"
  - name: "cost"
    type: "Money"
  - name: "estimatedDeliveryDays"
    type: "Integer"
  relations:
  - name: "shippingProfile"
    type: "ShippingProfile"
    multiplicity: "ManyToOne"
- name: "ShippingRateQuote"
  description: "Carrier rate and delivery estimate returned for the session."
  data:
  - name: "carrier"
    type: "String"
  - name: "serviceLevel"
    type: "ShippingServiceLevel"
  - name: "cost"
    type: "Money"
  - name: "deliveryDays"
    type: "Integer"
  - name: "quoteId"
    type: "String"
  - name: "expiresOn"
    type: "Date"
  relations:
  - name: "checkoutSession"
    type: "CheckoutSession"
    multiplicity: "ManyToOne"
- name: "PaymentInstruction"
  description: "Allocation of the payable amount to a specific payment method."
  data:
  - name: "methodType"
    type: "PaymentMethodType"
  - name: "amount"
    type: "Money"
  - name: "requiresAuthentication"
    type: "AuthenticationRequirement"
  relations:
  - name: "checkoutSession"
    type: "CheckoutSession"
    multiplicity: "ManyToOne"
  - name: "authorization"
    type: "PaymentAuthorization"
    multiplicity: "OneToOne"
  - name: "capture"
    type: "PaymentCapture"
    multiplicity: "OneToOne"
  - name: "gateway"
    type: "PaymentGatewayConfig"
    multiplicity: "ManyToOne"
  - name: "paymentSource"
    type: "PaymentSource"
    multiplicity: "ManyToOne"
- name: "PaymentSource"
  description: "Buyer-provided payment instrument reference used for authorizations\
    \ and captures."
  data:
  - name: "sourceType"
    type: "PaymentSourceType"
  - name: "token"
    type: "String"
  - name: "last4"
    type: "String"
  - name: "brand"
    type: "String"
  - name: "expiryMonth"
    type: "Integer"
  - name: "expiryYear"
    type: "Integer"
  - name: "cardholderName"
    type: "String"
  - name: "billingAddress"
    type: "Address"
  relations:
  - name: "customer"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
- name: "PaymentAuthorization"
  description: "Authorization hold created with a payment gateway."
  data:
  - name: "status"
    type: "AuthorizationStatus"
  - name: "authorizedAmount"
    type: "Money"
  - name: "avsResult"
    type: "AvsResult"
  - name: "cvvResult"
    type: "CvvResult"
  - name: "externalReference"
    type: "String"
  - name: "performedAt"
    type: "Date"
  relations:
  - name: "instruction"
    type: "PaymentInstruction"
    multiplicity: "ManyToOne"
  - name: "gateway"
    type: "PaymentGatewayConfig"
    multiplicity: "ManyToOne"
  - name: "threeDSChallenge"
    type: "ThreeDSChallenge"
    multiplicity: "OneToOne"
- name: "ThreeDSChallenge"
  description: "3-D Secure authentication interaction associated with a payment attempt."
  data:
  - name: "status"
    type: "ThreeDSStatus"
  - name: "version"
    type: "String"
  - name: "methodUrl"
    type: "String"
  - name: "acsTransactionId"
    type: "String"
  - name: "eci"
    type: "String"
  relations:
  - name: "authorization"
    type: "PaymentAuthorization"
    multiplicity: "ManyToOne"
- name: "PaymentCapture"
  description: "Settlement transaction that finalizes collection of funds."
  data:
  - name: "status"
    type: "CaptureStatus"
  - name: "capturedAmount"
    type: "Money"
  - name: "externalReference"
    type: "String"
  - name: "capturedAt"
    type: "Date"
  relations:
  - name: "instruction"
    type: "PaymentInstruction"
    multiplicity: "ManyToOne"
  - name: "gateway"
    type: "PaymentGatewayConfig"
    multiplicity: "ManyToOne"
- name: "Promotion"
  description: "Rule-driven incentive that provides a discount or benefit during checkout."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "promotionType"
    type: "PromotionType"
  - name: "scope"
    type: "DiscountScope"
  - name: "value"
    type: "Decimal"
  - name: "currency"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "conditions"
    type: "PromotionCondition"
    multiplicity: "OneToMany"
- name: "PromotionCondition"
  description: "Constraint that must be satisfied for a promotion to apply."
  data:
  - name: "conditionType"
    type: "PromotionConditionType"
  - name: "operator_"
    type: "ConditionOperator"
  - name: "leftOperand"
    type: "String"
  - name: "rightOperand"
    type: "String"
  relations:
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
- name: "CustomerProfile"
  description: "Shopper identity and preferences used during checkout."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "Email"
  - name: "phone"
    type: "Phone"
  - name: "customerType"
    type: "ShopperType"
  - name: "defaultCurrency"
    type: "String"
  relations:
  - name: "paymentSources"
    type: "PaymentSource"
    multiplicity: "OneToMany"
  - name: "checkoutSessions"
    type: "CheckoutSession"
    multiplicity: "OneToMany"
  - name: "addresses"
    type: "SavedAddress"
    multiplicity: "OneToMany"
- name: "SavedAddress"
  description: "Address stored in a customer profile for quick checkout."
  data:
  - name: "label"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "addressType"
    type: "AddressKind"
  - name: "defaultFor"
    type: "AddressDefault"
  relations:
  - name: "customer"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
- name: "RiskAssessment"
  description: "Automated evaluation of fraud and compliance risk for the session."
  data:
  - name: "score"
    type: "Decimal"
  - name: "result"
    type: "RiskResult"
  - name: "reasonCode"
    type: "String"
  - name: "provider"
    type: "String"
  - name: "performedAt"
    type: "Date"
  relations:
  - name: "checkoutSession"
    type: "CheckoutSession"
    multiplicity: "ManyToOne"
  - name: "signals"
    type: "RiskSignal"
    multiplicity: "OneToMany"
  - name: "decisionRuleset"
    type: "RiskRuleset"
    multiplicity: "ManyToOne"
- name: "RiskSignal"
  description: "Individual data point used to inform a risk decision."
  data:
  - name: "name"
    type: "String"
  - name: "value"
    type: "String"
  - name: "severity"
    type: "RiskSignalSeverity"
  relations:
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
- name: "RiskRuleset"
  description: "Merchant-configurable rules guiding risk evaluation and decisions."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "RulesetStatus"
  - name: "version"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
- name: "BuyerConsent"
  description: "Acknowledgements and preferences captured from the buyer during checkout."
  data:
  - name: "termsAccepted"
    type: "TermsAcceptance"
  - name: "marketingOptIn"
    type: "OptInPreference"
  - name: "privacyNoticeVersion"
    type: "String"
  - name: "acceptedAt"
    type: "Date"
  relations:
  - name: "checkoutSession"
    type: "CheckoutSession"
    multiplicity: "ManyToOne"
- name: "GiftCard"
  description: "Stored value instrument that can be applied to reduce the amount due."
  data:
  - name: "code"
    type: "String"
  - name: "issuer"
    type: "String"
  - name: "balance"
    type: "Money"
  - name: "status"
    type: "GiftCardStatus"
  - name: "currency"
    type: "String"
  relations:
  - name: "redemptions"
    type: "GiftCardRedemption"
    multiplicity: "OneToMany"
- name: "GiftCardRedemption"
  description: "Application of a gift card balance to a checkout session."
  data:
  - name: "amount"
    type: "Money"
  - name: "redemptionStatus"
    type: "RedemptionStatus"
  - name: "performedAt"
    type: "Date"
  relations:
  - name: "giftCard"
    type: "GiftCard"
    multiplicity: "ManyToOne"
  - name: "instruction"
    type: "PaymentInstruction"
    multiplicity: "ManyToOne"
  - name: "checkoutSession"
    type: "CheckoutSession"
    multiplicity: "ManyToOne"
- name: "TaxProfile"
  description: "Merchant settings controlling tax calculation behavior."
  data:
  - name: "name"
    type: "String"
  - name: "taxProvider"
    type: "TaxProvider"
  - name: "calculationMethod"
    type: "TaxCalculationMethod"
  - name: "nexusCountries"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
- name: "AddressValidation"
  description: "Deliverability and normalization results for an address used in checkout."
  data:
  - name: "status"
    type: "AddressValidationStatus"
  - name: "normalizedAddress"
    type: "Address"
  - name: "messages"
    type: "String"
  relations:
  - name: "checkoutSession"
    type: "CheckoutSession"
    multiplicity: "ManyToOne"
- name: "FeesSchedule"
  description: "Configuration of surcharges or service fees applied during checkout."
  data:
  - name: "name"
    type: "String"
  - name: "feeType"
    type: "FeeType"
  - name: "rate"
    type: "Decimal"
  - name: "currency"
    type: "String"
  - name: "applicationScope"
    type: "FeeScope"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
- name: "Surcharge"
  description: "Additional fee applied to the checkout total according to policy."
  data:
  - name: "name"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "reason"
    type: "SurchargeReason"
  relations:
  - name: "checkoutSession"
    type: "CheckoutSession"
    multiplicity: "ManyToOne"
  - name: "feesSchedule"
    type: "FeesSchedule"
    multiplicity: "ManyToOne"
- name: "OrderReview"
  description: "Final summary presented to the buyer before confirming the purchase."
  data:
  - name: "presentedTotal"
    type: "Money"
  - name: "createdAt"
    type: "Date"
  - name: "acknowledgement"
    type: "String"
  relations:
  - name: "checkoutSession"
    type: "CheckoutSession"
    multiplicity: "ManyToOne"
- name: "ComplianceCheck"
  description: "Evaluation of regulatory constraints such as export controls or age\
    \ restrictions."
  data:
  - name: "status"
    type: "ComplianceStatus"
  - name: "category"
    type: "ComplianceCategory"
  - name: "performedAt"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "checkoutSession"
    type: "CheckoutSession"
    multiplicity: "ManyToOne"
- name: "TaxExemption"
  description: "Documented status allowing reduced or zero tax treatment."
  data:
  - name: "certificateNumber"
    type: "String"
  - name: "issuingJurisdiction"
    type: "String"
  - name: "exemptionType"
    type: "ExemptionType"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  relations:
  - name: "customer"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "checkoutSession"
    type: "CheckoutSession"
    multiplicity: "ManyToOne"
enums:
- name: "CheckoutStatus"
  description: "Lifecycle states of a checkout session."
  data:
  - name: "Draft"
  - name: "AddressProvided"
  - name: "ShippingSelected"
  - name: "PaymentPending"
  - name: "Authorized"
  - name: "Completed"
  - name: "Abandoned"
  - name: "Cancelled"
- name: "SalesChannel"
  description: "Channel through which checkout is performed."
  data:
  - name: "Web"
  - name: "MobileApp"
  - name: "POS"
  - name: "Marketplace"
- name: "LineItemType"
  description: "Category of item being purchased."
  data:
  - name: "Product"
  - name: "Service"
  - name: "Digital"
  - name: "GiftCard"
  - name: "Fee"
- name: "TaxType"
  description: "Kind of indirect tax applied."
  data:
  - name: "VAT"
  - name: "SalesTax"
  - name: "GST"
  - name: "HST"
  - name: "Excise"
- name: "TaxScope"
  description: "Portion of the transaction to which a tax line applies."
  data:
  - name: "Item"
  - name: "Shipping"
  - name: "Order"
- name: "TaxCalculationMethod"
  description: "Method for computing taxes relative to prices."
  data:
  - name: "Exclusive"
  - name: "Inclusive"
- name: "ShippingServiceLevel"
  description: "Service level commitment offered by carrier."
  data:
  - name: "Standard"
  - name: "Expedited"
  - name: "TwoDay"
  - name: "NextDay"
  - name: "SameDay"
  - name: "Pickup"
- name: "PaymentMethodType"
  description: "Type of payment method used to settle the checkout."
  data:
  - name: "Card"
  - name: "Wallet"
  - name: "BankRedirect"
  - name: "BankDebit"
  - name: "CashOnDelivery"
  - name: "GiftCard"
  - name: "StoreCredit"
  - name: "BuyNowPayLater"
- name: "PaymentSourceType"
  description: "Representation of the buyer’s payment instrument."
  data:
  - name: "Card"
  - name: "Wallet"
  - name: "BankAccount"
  - name: "Tokenized"
  - name: "GiftCard"
- name: "AuthorizationStatus"
  description: "Outcome of a payment authorization attempt."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Declined"
  - name: "Error"
  - name: "Voided"
  - name: "Expired"
- name: "CaptureStatus"
  description: "State of fund capture for a payment."
  data:
  - name: "Pending"
  - name: "Completed"
  - name: "PartiallyCompleted"
  - name: "Failed"
- name: "AvsResult"
  description: "Address Verification Service outcome."
  data:
  - name: "Match"
  - name: "Partial"
  - name: "NoMatch"
  - name: "NotChecked"
- name: "CvvResult"
  description: "Card verification value outcome."
  data:
  - name: "Match"
  - name: "NoMatch"
  - name: "NotChecked"
- name: "ThreeDSStatus"
  description: "Status of 3-D Secure authentication."
  data:
  - name: "NotRequired"
  - name: "Attempted"
  - name: "Challenged"
  - name: "Succeeded"
  - name: "Failed"
- name: "PromotionType"
  description: "Mechanism by which a promotion is applied."
  data:
  - name: "Coupon"
  - name: "Automatic"
  - name: "Loyalty"
- name: "DiscountScope"
  description: "Portion of the transaction to which a discount is applied."
  data:
  - name: "Order"
  - name: "LineItem"
  - name: "Shipping"
- name: "DiscountType"
  description: "Method used to compute the discount value."
  data:
  - name: "AmountOff"
  - name: "PercentageOff"
  - name: "FreeShipping"
- name: "DiscountBasis"
  description: "Basis against which the discount is calculated."
  data:
  - name: "ItemPrice"
  - name: "Subtotal"
  - name: "ShippingAmount"
- name: "PromotionConditionType"
  description: "Condition that must be true for a promotion to apply."
  data:
  - name: "MinimumSubtotal"
  - name: "CustomerSegment"
  - name: "FirstPurchase"
  - name: "ProductInclusion"
  - name: "ProductExclusion"
  - name: "QuantityThreshold"
  - name: "TimeWindow"
- name: "ConditionOperator"
  description: "Operator used to evaluate a promotion condition."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "GreaterThanOrEqual"
  - name: "LessThanOrEqual"
  - name: "Contains"
- name: "ShopperType"
  description: "Classification of shopper identity."
  data:
  - name: "Guest"
  - name: "Registered"
  - name: "Business"
- name: "AddressKind"
  description: "Purpose of the address."
  data:
  - name: "Shipping"
  - name: "Billing"
- name: "AddressDefault"
  description: "Default usage preference for a saved address."
  data:
  - name: "None"
  - name: "Shipping"
  - name: "Billing"
