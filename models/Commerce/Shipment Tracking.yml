  - name: "AddressChangeByCustomer"
  - name: "AddressCorrectionByCarrier"
  - name: "RerouteToPickupPoint"
  - name: "RecipientMoved"
- name: "RedirectStatus"
  description: "Processing status of a redirect request."
  data:
  - name: "Requested"
  - name: "InReview"
  - name: "Approved"
  - name: "Rejected"
  - name: "Completed"
  - name: "Failed"
- name: "PickupRequestStatus"
  description: "Status of a scheduled carrier pickup."
  data:
  - name: "Requested"
  - name: "Scheduled"
  - name: "InTransit"
  - name: "Collected"
  - name: "Missed"
  - name: "Cancelled"
- name: "NotificationChannel"
  description: "Medium used to send tracking notifications."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "Push"
  - name: "Webhook"
- name: "NotificationStatus"
  description: "Delivery status of a notification message."
  data:
  - name: "Queued"
  - name: "Sent"
  - name: "Delivered"
  - name: "Failed"
  - name: "Retried"
- name: "PromiseSource"
  description: "Origin of the delivery promise calculation."
  data:
  - name: "CarrierAPI"
  - name: "PlatformEstimator"
  - name: "HistoricalModel"
  - name: "SLA"
- name: "LabelFormat"
  description: "File encoding used for a shipping label."
  data:
  - name: "PDF"
  - name: "ZPL"
  - name: "PNG"
  - name: "EPL"
  - name: "SVG"
- name: "RouteLegMode"
  description: "Transport mode used for a route segment."
  data:
  - name: "Air"
  - name: "Ground"
  - name: "Sea"
  - name: "Rail"
  - name: "Courier"
  - name: "Drone"
  - name: "Bicycle"
- name: "FacilityType"
  description: "Operational role of a logistics facility."
  data:
  - name: "Hub"
  - name: "SortCenter"
  - name: "DeliveryStation"
  - name: "LockerBank"
  - name: "PostOffice"
  - name: "Airport"
  - name: "Seaport"
  - name: "RailYard"
  - name: "PickupPoint"
- name: "CustomsContentsType"
  description: "Declared nature of the shipment contents for customs."
  data:
  - name: "Merchandise"
  - name: "Documents"
  - name: "Gift"
  - name: "Sample"
  - name: "Return"
  - name: "Repair"
- name: "NonDeliveryOption"
  description: "Instruction if delivery cannot be completed."
  data:
  - name: "ReturnToSender"
  - name: "Abandon"
  - name: "Redirect"
- name: "EventSource"
  description: "Originating system or device for a tracking event."
  data:
  - name: "CarrierScan"
  - name: "IoTDevice"
  - name: "ManualEntry"
  - name: "APIWebhook"
- name: "Incoterm"
  description: "International commercial term defining delivery responsibilities."
  data:
  - name: "EXW"
  - name: "FCA"
  - name: "CPT"
  - name: "CIP"
  - name: "DAP"
