---
metadata:
  name: "Shipment Tracking"
  description: "Capability model for tracking shipments, packages, and delivery progress\
    \ across carriers, facilities, and service levels."
  version: "1.0.0"
  industry: "Retail and Logistics"
  category: "Commerce"
  type: "Capability"
  domain: "Shipment Tracking"
entities:
- name: "Carrier"
  description: "Licensed transportation provider offering shipping services and tracking\
    \ visibility."
  data:
  - name: "name"
    type: "String"
  - name: "scacCode"
    type: "String"
  - name: "website"
    type: "String"
  - name: "contactPhone"
    type: "String"
  - name: "supportsTrackAndTrace"
    type: "Boolean"
  relations:
  - name: "serviceLevels"
    type: "ServiceLevel"
    multiplicity: "OneToMany"
  - name: "facilities"
    type: "Facility"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "shipperAccounts"
    type: "ShipperAccount"
    multiplicity: "OneToMany"
- name: "ServiceLevel"
  description: "Published transport offering defining speed, handling, and confirmation\
    \ requirements."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "transitTimeDays"
    type: "Integer"
  - name: "deliveryConfirmation"
    type: "DeliveryConfirmationType"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
- name: "ShipperAccount"
  description: "Merchant’s billing and configuration profile with a carrier."
  data:
  - name: "accountNumber"
    type: "String"
  - name: "billingPostalCode"
    type: "String"
  - name: "contactEmail"
    type: "String"
  - name: "pickupInstructions"
    type: "String"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "webhookSubscriptions"
    type: "WebhookSubscription"
    multiplicity: "OneToMany"
- name: "Shipment"
  description: "End-to-end consignment composed of one or more packages moving from\
    \ origin to destination."
  data:
  - name: "trackingNumber"
    type: "TrackingCode"
  - name: "referenceNumber"
    type: "String"
  - name: "status"
    type: "ShipmentStatus"
  - name: "direction"
    type: "ShipmentDirection"
  - name: "origin"
    type: "Address"
  - name: "destination"
    type: "Address"
  - name: "shipDate"
    type: "Date"
  - name: "promisedDeliveryDate"
    type: "Date"
  - name: "declaredValue"
    type: "Money"
  - name: "deliveryConfirmation"
    type: "DeliveryConfirmationType"
  - name: "requiresCustoms"
    type: "Boolean"
  - name: "fragile"
    type: "Boolean"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "serviceLevel"
    type: "ServiceLevel"
    multiplicity: "ManyToOne"
  - name: "shipperAccount"
    type: "ShipperAccount"
    multiplicity: "ManyToOne"
  - name: "packages"
    type: "Package"
    multiplicity: "OneToMany"
  - name: "route"
    type: "Route"
    multiplicity: "OneToOne"
  - name: "trackingEvents"
    type: "TrackingEvent"
    multiplicity: "OneToMany"
  - name: "customsDeclaration"
    type: "CustomsDeclaration"
    multiplicity: "OneToOne"
  - name: "pickupRequest"
    type: "PickupRequest"
    multiplicity: "OneToOne"
  - name: "holdRequests"
    type: "HoldRequest"
    multiplicity: "OneToMany"
  - name: "redirectRequests"
    type: "RedirectRequest"
    multiplicity: "OneToMany"
  - name: "deliveryAttempts"
    type: "DeliveryAttempt"
    multiplicity: "OneToMany"
  - name: "proofOfDelivery"
    type: "ProofOfDelivery"
    multiplicity: "OneToOne"
  - name: "notifications"
    type: "Notification"
    multiplicity: "OneToMany"
  - name: "deliveryPromise"
    type: "DeliveryPromise"
    multiplicity: "OneToOne"
  - name: "exceptionCases"
    type: "ExceptionCase"
    multiplicity: "OneToMany"
- name: "Package"
  description: "Discrete parcel unit within a shipment, with its own metrics and label."
  data:
  - name: "packageCode"
    type: "String"
  - name: "packagingType"
    type: "PackagingType"
  - name: "weight"
    type: "Weight"
  - name: "dimensions"
    type: "Dimensions"
  - name: "insuredValue"
    type: "Money"
  - name: "barcode"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "ParcelItem"
    multiplicity: "OneToMany"
  - name: "label"
    type: "ShippingLabel"
    multiplicity: "OneToOne"
  - name: "trackingEvents"
    type: "TrackingEvent"
    multiplicity: "OneToMany"
- name: "ParcelItem"
  description: "Declared contents of a package for tracking visibility and customs\
    \ support."
  data:
  - name: "sku"
    type: "String"
  - name: "description"
    type: "String"
  - name: "quantity"
    type: "Integer"
  - name: "countryOfOrigin"
    type: "String"
  - name: "unitPrice"
    type: "Money"
  - name: "hsCode"
    type: "String"
  relations:
  - name: "package"
    type: "Package"
    multiplicity: "ManyToOne"
- name: "TrackingEvent"
  description: "Timestamped progress update or scan associated with a shipment or\
    \ package."
  data:
  - name: "eventType"
    type: "TrackingEventType"
  - name: "eventTime"
    type: "DateTime"
  - name: "description"
    type: "String"
  - name: "source"
    type: "EventSource"
  - name: "statusAfter"
    type: "ShipmentStatus"
  - name: "locationDescription"
    type: "String"
  - name: "latitude"
    type: "Decimal"
  - name: "longitude"
    type: "Decimal"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "package"
    type: "Package"
    multiplicity: "ManyToOne"
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "routeLeg"
    type: "RouteLeg"
    multiplicity: "ManyToOne"
  - name: "exceptionCase"
    type: "ExceptionCase"
    multiplicity: "ManyToOne"
- name: "Route"
  description: "Planned or observed path a shipment takes across network nodes."
  data:
  - name: "isPlanned"
    type: "Boolean"
  - name: "createdAt"
    type: "DateTime"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "legs"
    type: "RouteLeg"
    multiplicity: "OneToMany"
- name: "RouteLeg"
  description: "Segment of transport between two facilities with a defined mode."
  data:
  - name: "legNumber"
    type: "Integer"
  - name: "mode"
    type: "RouteLegMode"
  - name: "departedAt"
    type: "DateTime"
  - name: "arrivedAt"
    type: "DateTime"
  - name: "distanceKm"
    type: "Decimal"
  relations:
  - name: "route"
    type: "Route"
    multiplicity: "ManyToOne"
  - name: "originFacility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "destinationFacility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
- name: "Facility"
  description: "Physical processing node such as a hub, station, or locker bank."
  data:
  - name: "name"
    type: "String"
  - name: "facilityCode"
    type: "String"
  - name: "facilityType"
    type: "FacilityType"
  - name: "address"
    type: "Address"
  - name: "geo"
    type: "GeoCoordinate"
  - name: "timezone"
    type: "String"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "originForLegs"
    type: "RouteLeg"
    multiplicity: "OneToMany"
  - name: "destinationForLegs"
    type: "RouteLeg"
    multiplicity: "OneToMany"
- name: "ShippingLabel"
  description: "Machine-readable label used to route and tender a package."
  data:
  - name: "labelNumber"
    type: "String"
  - name: "format"
    type: "LabelFormat"
  - name: "fileUri"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  relations:
  - name: "package"
    type: "Package"
    multiplicity: "ManyToOne"
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
- name: "CustomsDeclaration"
  description: "Cross-border clearance document detailing shipment contents and value."
  data:
  - name: "contentsType"
    type: "CustomsContentsType"
  - name: "nonDeliveryOption"
    type: "NonDeliveryOption"
  - name: "invoiceNumber"
    type: "String"
  - name: "termsOfTrade"
    type: "Incoterm"
  - name: "totalDeclaredValue"
    type: "Money"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "CustomsItem"
    multiplicity: "OneToMany"
  - name: "dutiesAndTaxes"
    type: "DutiesAndTaxes"
    multiplicity: "OneToOne"
- name: "CustomsItem"
  description: "Commodity line declared for customs, including value and classification."
  data:
  - name: "description"
    type: "String"
  - name: "hsCode"
    type: "String"
  - name: "quantity"
    type: "Integer"
  - name: "unitValue"
    type: "Money"
  - name: "countryOfOrigin"
    type: "String"
  - name: "weight"
    type: "Weight"
  relations:
  - name: "customsDeclaration"
    type: "CustomsDeclaration"
    multiplicity: "ManyToOne"
- name: "DutiesAndTaxes"
  description: "Assessment and payment instructions for import charges."
  data:
  - name: "paymentType"
    type: "DutyPaymentType"
  - name: "amount"
    type: "Money"
  - name: "payerName"
    type: "String"
  - name: "reference"
    type: "String"
  relations:
  - name: "customsDeclaration"
    type: "CustomsDeclaration"
    multiplicity: "OneToOne"
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
- name: "ProofOfDelivery"
  description: "Evidence confirming delivery completion and handoff."
  data:
  - name: "type"
    type: "ProofOfDeliveryType"
  - name: "signedBy"
    type: "String"
  - name: "signedAt"
    type: "DateTime"
  - name: "photoUri"
    type: "String"
  - name: "geo"
    type: "GeoCoordinate"
  - name: "deliveryNotes"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "deliveryAttempt"
    type: "DeliveryAttempt"
    multiplicity: "ManyToOne"
- name: "DeliveryAttempt"
  description: "Recorded effort to deliver the shipment to the recipient."
  data:
  - name: "attemptTime"
    type: "DateTime"
  - name: "outcome"
    type: "DeliveryAttemptOutcome"
  - name: "notes"
    type: "String"
  - name: "cardLeft"
    type: "Boolean"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "proofOfDelivery"
    type: "ProofOfDelivery"
    multiplicity: "OneToOne"
- name: "ExceptionCase"
  description: "Managed issue that interrupts normal transit and requires resolution."
  data:
  - name: "reason"
    type: "ExceptionReason"
  - name: "status"
    type: "ExceptionStatus"
  - name: "openedAt"
    type: "DateTime"
  - name: "closedAt"
    type: "DateTime"
  - name: "notes"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "trackingEvents"
    type: "TrackingEvent"
    multiplicity: "OneToMany"
  - name: "updates"
    type: "CaseUpdate"
    multiplicity: "OneToMany"
- name: "CaseUpdate"
  description: "Log entry describing actions and communications on an exception case."
  data:
  - name: "updateTime"
    type: "DateTime"
  - name: "updateBy"
    type: "String"
  - name: "action"
    type: "String"
  - name: "publicMessage"
    type: "String"
  relations:
  - name: "exceptionCase"
    type: "ExceptionCase"
    multiplicity: "ManyToOne"
- name: "HoldRequest"
  description: "Instruction to hold the shipment at a facility or locker for pickup."
  data:
  - name: "holdType"
    type: "HoldType"
  - name: "requestedAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  - name: "status"
    type: "HoldRequestStatus"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
- name: "RedirectRequest"
  description: "Request to change the delivery address or reroute to a pickup point."
  data:
  - name: "reason"
    type: "RedirectReason"
  - name: "requestedAt"
    type: "DateTime"
  - name: "status"
    type: "RedirectStatus"
  - name: "newAddress"
    type: "Address"
  - name: "approved"
    type: "Boolean"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
- name: "PickupRequest"
  description: "Request for a carrier to collect packages from the shipper."
  data:
  - name: "pickupDate"
    type: "Date"
  - name: "timeWindow"
    type: "TimeWindow"
  - name: "instructions"
    type: "String"
  - name: "status"
    type: "PickupRequestStatus"
  - name: "locationNote"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
- name: "Notification"
  description: "Outbound message sent to stakeholders about shipment progress or changes."
  data:
  - name: "channel"
    type: "NotificationChannel"
  - name: "sentAt"
    type: "DateTime"
  - name: "subject"
    type: "String"
  - name: "body"
    type: "String"
  - name: "deliveryStatus"
    type: "NotificationStatus"
  - name: "recipient"
    type: "String"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "webhookSubscription"
    type: "WebhookSubscription"
    multiplicity: "ManyToOne"
- name: "WebhookSubscription"
  description: "Configuration to receive real-time tracking updates via callbacks."
  data:
  - name: "endpointUrl"
    type: "String"
  - name: "secret"
    type: "String"
  - name: "eventFilter"
    type: "String"
  - name: "active"
    type: "Boolean"
  - name: "createdAt"
    type: "DateTime"
  relations:
  - name: "shipperAccount"
    type: "ShipperAccount"
    multiplicity: "ManyToOne"
  - name: "notifications"
    type: "Notification"
    multiplicity: "OneToMany"
- name: "DeliveryPromise"
  description: "Commitment window and confidence for when a shipment will arrive."
  data:
  - name: "promisedWindow"
    type: "TimeWindow"
  - name: "confidencePercent"
    type: "Integer"
  - name: "source"
    type: "PromiseSource"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "serviceLevel"
    type: "ServiceLevel"
    multiplicity: "ManyToOne"
- name: "SensorReading"
  description: "Telemetry captured from sensors attached to packages or transport\
    \ equipment."
  data:
  - name: "readingTime"
    type: "DateTime"
  - name: "temperatureC"
    type: "Decimal"
  - name: "humidityPercent"
    type: "Decimal"
  - name: "shockG"
    type: "Decimal"
  - name: "batteryLevelPercent"
    type: "Integer"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "package"
    type: "Package"
    multiplicity: "ManyToOne"
enums:
- name: "ShipmentStatus"
  description: "Lifecycle states representing the progress of a shipment."
  data:
  - name: "Created"
  - name: "LabelGenerated"
  - name: "Manifested"
  - name: "PickedUp"
  - name: "InTransit"
  - name: "AtFacility"
  - name: "OutForDelivery"
  - name: "Delivered"
  - name: "DeliveryFailed"
  - name: "Exception"
  - name: "Held"
  - name: "Returned"
  - name: "Cancelled"
  - name: "Lost"
  - name: "Damaged"
  - name: "CustomsClearance"
  - name: "CustomsHold"
- name: "ShipmentDirection"
  description: "Indicates whether the shipment is outbound, a return, or an internal\
    \ transfer."
  data:
  - name: "Outbound"
  - name: "Return"
  - name: "Transfer"
- name: "PackagingType"
  description: "Physical container type used for a package."
  data:
  - name: "Box"
  - name: "Polybag"
  - name: "Envelope"
  - name: "Tube"
  - name: "Pallet"
  - name: "Crate"
  - name: "Roll"
- name: "TrackingEventType"
  description: "Type classification of a tracking scan or update."
  data:
  - name: "LabelCreated"
  - name: "Manifested"
  - name: "PickupScheduled"
  - name: "PickedUp"
  - name: "DepartedFacility"
  - name: "ArrivedAtFacility"
  - name: "ProcessedAtFacility"
  - name: "LinehaulDeparture"
  - name: "LinehaulArrival"
  - name: "CustomsClearanceStarted"
  - name: "CustomsCleared"
  - name: "CustomsHold"
  - name: "OutForDelivery"
  - name: "DeliveryAttempted"
  - name: "Delivered"
  - name: "AddressCorrected"
  - name: "HeldAtLocation"
  - name: "Redirected"
  - name: "Exception"
  - name: "ReturnInitiated"
  - name: "ReturnedToSender"
- name: "DeliveryConfirmationType"
  description: "Required confirmation method at delivery."
  data:
  - name: "NoSignature"
  - name: "SignatureRequired"
  - name: "AdultSignatureRequired"
  - name: "PIN"
  - name: "RecipientCode"
- name: "DutyPaymentType"
  description: "Responsibility for payment of duties and taxes."
  data:
  - name: "SenderPays"
  - name: "RecipientPays"
  - name: "ThirdParty"
- name: "ProofOfDeliveryType"
  description: "Format of evidence used to confirm delivery."
  data:
  - name: "Signature"
  - name: "Photo"
  - name: "CodeScan"
  - name: "Geostamp"
  - name: "RecipientName"
- name: "DeliveryAttemptOutcome"
  description: "Result of a delivery attempt."
  data:
  - name: "Successful"
  - name: "NotHome"
  - name: "AddressIssue"
  - name: "RefusedByRecipient"
  - name: "SecurityRestriction"
  - name: "WeatherDelay"
  - name: "ClosedBusiness"
- name: "ExceptionReason"
  description: "Primary cause for an exception event."
  data:
  - name: "AddressInvalid"
  - name: "RecipientUnavailable"
  - name: "Weather"
  - name: "CustomsHold"
  - name: "Damaged"
  - name: "Lost"
  - name: "RestrictedContents"
  - name: "PaymentDue"
  - name: "Security"
  - name: "OperationalDelay"
- name: "ExceptionStatus"
  description: "Tracking of exception case resolution progress."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "Resolved"
  - name: "Cancelled"
- name: "HoldType"
  description: "Strategy for placing a shipment on hold."
  data:
  - name: "HoldAtLocation"
  - name: "VacationHold"
  - name: "CustomsHold"
- name: "HoldRequestStatus"
  description: "Lifecycle of a hold instruction."
  data:
  - name: "Requested"
  - name: "Accepted"
  - name: "InEffect"
  - name: "Released"
  - name: "Rejected"
  - name: "Expired"
- name: "RedirectReason"
  description: "Justification for redirecting a shipment."
