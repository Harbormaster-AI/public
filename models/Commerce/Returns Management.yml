---
metadata:
  name: "HCIDL Returns Management"
  description: "Capability model for managing product returns, exchanges, dispositions,\
    \ and refunds across commerce channels and facilities."
  version: "1.0.0"
  industry: "Retail and Consumer Commerce"
  category: "Commerce"
  type: "Capability"
  domain: "Returns Management"
entities:
- name: "Merchant"
  description: "Commercial entity that sells products and defines return policies,\
    \ carriers, and facilities for handling returns."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "website"
    type: "String"
  - name: "primaryContactEmail"
    type: "String"
  relations:
  - name: "returnPolicies"
    type: "ReturnPolicy"
    multiplicity: "OneToMany"
  - name: "returnCenters"
    type: "ReturnCenter"
    multiplicity: "OneToMany"
  - name: "salesChannels"
    type: "SalesChannel"
    multiplicity: "OneToMany"
  - name: "carriers"
    type: "Carrier"
    multiplicity: "ManyToMany"
- name: "SalesChannel"
  description: "Point of sale through which orders are placed and returns are initiated,\
    \ such as online store, marketplace, or physical store."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "SalesChannelType"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "orders"
    type: "Order"
    multiplicity: "OneToMany"
  - name: "returnPolicies"
    type: "ReturnPolicy"
    multiplicity: "ManyToMany"
- name: "Product"
  description: "Sellable catalog item eligible for return or exchange subject to policy\
    \ constraints."
  data:
  - name: "sku"
    type: "String"
  - name: "name"
    type: "String"
  - name: "productType"
    type: "ProductType"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
- name: "Customer"
  description: "Person or organization that purchased items and may request returns,\
    \ exchanges, or refunds."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "defaultShippingAddress"
    type: "Address"
  relations:
  - name: "orders"
    type: "Order"
    multiplicity: "OneToMany"
  - name: "returnRequests"
    type: "ReturnRequest"
    multiplicity: "OneToMany"
  - name: "communications"
    type: "Communication"
    multiplicity: "OneToMany"
- name: "Order"
  description: "Completed purchase transaction used as the source of truth for return\
    \ eligibility, quantities, and refund calculations."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "orderDate"
    type: "Date"
  - name: "totalAmount"
    type: "Money"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "salesChannel"
    type: "SalesChannel"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "OrderLine"
    multiplicity: "OneToMany"
  - name: "refunds"
    type: "Refund"
    multiplicity: "OneToMany"
  - name: "returnRequests"
    type: "ReturnRequest"
    multiplicity: "OneToMany"
- name: "OrderLine"
  description: "Individual purchased item line capturing product, quantity, and price,\
    \ which may be partially or fully returned."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Integer"
  - name: "unitPrice"
    type: "Money"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "returnLines"
    type: "ReturnLine"
    multiplicity: "OneToMany"
- name: "ReturnPolicy"
  description: "Business rules defining eligibility, windows, fees, shipping methods,\
    \ and processing expectations for returns."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "ReturnPolicyType"
  - name: "maxReturnWindowDays"
    type: "Integer"
  - name: "allowOpenBox"
    type: "Boolean"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "applicableChannels"
    type: "SalesChannel"
    multiplicity: "ManyToMany"
  - name: "feeSchedule"
    type: "ReturnFeeSchedule"
    multiplicity: "OneToOne"
  - name: "slas"
    type: "SLA"
    multiplicity: "OneToMany"
- name: "ReturnFeeSchedule"
  description: "Configuration that determines when and how return-related fees are\
    \ assessed, including basis and limits."
  data:
  - name: "feeType"
    type: "FeeType"
  - name: "feeBasis"
    type: "FeeBasisType"
  - name: "feeValue"
    type: "Decimal"
  - name: "minimumFee"
    type: "Money"
  - name: "maximumFee"
    type: "Money"
  relations:
  - name: "policy"
    type: "ReturnPolicy"
    multiplicity: "ManyToOne"
- name: "ReturnRequest"
  description: "Customer-initiated request to return, exchange, or seek a refund for\
    \ one or more order lines."
  data:
  - name: "referenceNumber"
    type: "String"
  - name: "requestedDate"
    type: "Date"
  - name: "status"
    type: "ReturnStatus"
  - name: "returnMethod"
    type: "ReturnMethod"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "ReturnLine"
    multiplicity: "OneToMany"
  - name: "authorization"
    type: "ReturnAuthorization"
    multiplicity: "OneToOne"
  - name: "shipments"
    type: "ReturnShipment"
    multiplicity: "OneToMany"
  - name: "events"
    type: "ReturnEvent"
    multiplicity: "OneToMany"
  - name: "communications"
    type: "Communication"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "policy"
    type: "ReturnPolicy"
    multiplicity: "ManyToOne"
  - name: "pickupAppointment"
    type: "PickupAppointment"
    multiplicity: "OneToOne"
  - name: "returnCenter"
    type: "ReturnCenter"
    multiplicity: "ManyToOne"
  - name: "refund"
    type: "Refund"
    multiplicity: "OneToOne"
  - name: "exchangeOrder"
    type: "ExchangeOrder"
    multiplicity: "OneToOne"
  - name: "giftReturnDetail"
    type: "GiftReturnDetail"
    multiplicity: "OneToOne"
- name: "ReturnLine"
  description: "Line-level details for what is being returned, including quantity,\
    \ reason, and observed condition."
  data:
  - name: "requestedQuantity"
    type: "Integer"
  - name: "reason"
    type: "ReturnReason"
  - name: "condition"
    type: "ItemCondition"
  - name: "comments"
    type: "String"
  relations:
  - name: "returnRequest"
    type: "ReturnRequest"
    multiplicity: "ManyToOne"
  - name: "orderLine"
    type: "OrderLine"
    multiplicity: "ManyToOne"
  - name: "inspections"
    type: "Inspection"
    multiplicity: "OneToMany"
  - name: "dispositions"
    type: "Disposition"
    multiplicity: "OneToMany"
  - name: "fees"
    type: "Fee"
    multiplicity: "OneToMany"
- name: "ReturnAuthorization"
  description: "Authorization decision and credentials that permit the return to proceed\
    \ according to policy."
  data:
  - name: "rmaNumber"
    type: "String"
  - name: "issuedDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "status"
    type: "AuthorizationStatus"
  relations:
  - name: "returnRequest"
    type: "ReturnRequest"
    multiplicity: "ManyToOne"
- name: "Carrier"
  description: "Logistics provider responsible for transporting returned parcels between\
    \ customer and return center."
  data:
  - name: "name"
    type: "String"
  - name: "serviceLevel"
    type: "CarrierServiceLevel"
  - name: "trackingUrlTemplate"
    type: "String"
  relations:
  - name: "labels"
    type: "ReturnLabel"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "ReturnShipment"
    multiplicity: "OneToMany"
  - name: "merchants"
    type: "Merchant"
    multiplicity: "ManyToMany"
- name: "ReturnLabel"
  description: "Document or code used to tender the return shipment with a carrier,\
    \ including cost and format."
  data:
  - name: "labelNumber"
    type: "String"
  - name: "labelType"
    type: "LabelType"
  - name: "cost"
    type: "Money"
  - name: "barcode"
    type: "String"
  relations:
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "returnShipment"
    type: "ReturnShipment"
    multiplicity: "ManyToOne"
- name: "ReturnShipment"
  description: "Physical movement of returned goods from customer to facility, including\
    \ packages and tracking."
  data:
  - name: "shipmentReference"
    type: "String"
  - name: "status"
    type: "ShipmentStatus"
  - name: "shippedDate"
    type: "Date"
  - name: "expectedArrivalDate"
    type: "Date"
  relations:
  - name: "returnRequest"
    type: "ReturnRequest"
    multiplicity: "ManyToOne"
  - name: "label"
    type: "ReturnLabel"
    multiplicity: "OneToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
  - name: "packages"
    type: "Package"
    multiplicity: "OneToMany"
  - name: "returnCenter"
    type: "ReturnCenter"
    multiplicity: "ManyToOne"
  - name: "receipt"
    type: "ReturnReceipt"
    multiplicity: "OneToOne"
- name: "Package"
  description: "Individual parcel within a return shipment, including dimensions,\
    \ weight, and observed condition."
  data:
  - name: "packageNumber"
    type: "String"
  - name: "lengthCm"
    type: "Decimal"
  - name: "widthCm"
    type: "Decimal"
  - name: "heightCm"
    type: "Decimal"
  - name: "weightKg"
    type: "Decimal"
  - name: "packageCondition"
    type: "PackageCondition"
  relations:
  - name: "shipment"
    type: "ReturnShipment"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "PackageItem"
    multiplicity: "OneToMany"
- name: "PackageItem"
  description: "Quantity of a specific return line contained within a package of the\
    \ return shipment."
  data:
  - name: "quantity"
    type: "Integer"
  relations:
  - name: "package"
    type: "Package"
    multiplicity: "ManyToOne"
  - name: "returnLine"
    type: "ReturnLine"
    multiplicity: "ManyToOne"
- name: "ReturnCenter"
  description: "Facility where returned goods are received, inspected, and processed\
    \ for disposition and restocking."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "shipments"
    type: "ReturnShipment"
    multiplicity: "OneToMany"
  - name: "inspections"
    type: "Inspection"
    multiplicity: "OneToMany"
  - name: "receipts"
    type: "ReturnReceipt"
    multiplicity: "OneToMany"
  - name: "dispositions"
    type: "Disposition"
    multiplicity: "OneToMany"
  - name: "inventoryAdjustments"
    type: "InventoryAdjustment"
    multiplicity: "OneToMany"
- name: "ReturnReceipt"
  description: "Check-in record confirming arrival of a return shipment and reconciliation\
    \ against expectations."
  data:
  - name: "receivedDate"
    type: "Date"
  - name: "discrepanciesNote"
    type: "String"
  relations:
  - name: "shipment"
    type: "ReturnShipment"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "ReturnReceiptLine"
    multiplicity: "OneToMany"
  - name: "returnCenter"
    type: "ReturnCenter"
    multiplicity: "ManyToOne"
- name: "ReturnReceiptLine"
  description: "Line-level confirmation of quantities and condition noted during receipt\
    \ of the return."
  data:
  - name: "receivedQuantity"
    type: "Integer"
  - name: "condition"
    type: "ItemCondition"
  relations:
  - name: "receipt"
    type: "ReturnReceipt"
    multiplicity: "ManyToOne"
  - name: "returnLine"
    type: "ReturnLine"
    multiplicity: "ManyToOne"
- name: "Inspection"
  description: "Evaluation of returned items to determine condition, completeness,\
    \ and potential fraud or misuse."
  data:
  - name: "inspectionDate"
    type: "Date"
  - name: "inspectorName"
    type: "String"
  - name: "result"
    type: "InspectionResult"
  - name: "notes"
    type: "String"
  relations:
  - name: "returnLine"
    type: "ReturnLine"
    multiplicity: "ManyToOne"
  - name: "returnCenter"
    type: "ReturnCenter"
    multiplicity: "ManyToOne"
  - name: "photos"
    type: "Attachment"
    multiplicity: "OneToMany"
- name: "Disposition"
  description: "Decision about what to do with a returned item after inspection, such\
    \ as restock, refurbish, or recycle."
  data:
  - name: "dispositionType"
    type: "DispositionType"
  - name: "dispositionDate"
    type: "Date"
  - name: "reason"
    type: "String"
  relations:
  - name: "returnLine"
    type: "ReturnLine"
    multiplicity: "ManyToOne"
  - name: "returnCenter"
    type: "ReturnCenter"
    multiplicity: "ManyToOne"
  - name: "inventoryAdjustment"
    type: "InventoryAdjustment"
    multiplicity: "OneToOne"
- name: "InventoryAdjustment"
  description: "Stock movement or status change prompted by a return disposition,\
    \ including increases, decreases, or holds."
  data:
  - name: "adjustmentType"
    type: "InventoryAdjustmentType"
  - name: "quantity"
    type: "Integer"
  - name: "reasonCode"
    type: "String"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "returnCenter"
    type: "ReturnCenter"
    multiplicity: "ManyToOne"
  - name: "disposition"
    type: "Disposition"
    multiplicity: "ManyToOne"
- name: "Refund"
  description: "Monetary reimbursement associated with a return, inclusive of fees,\
    \ taxes, and destination."
  data:
  - name: "refundNumber"
    type: "String"
  - name: "totalAmount"
    type: "Money"
  - name: "status"
    type: "RefundStatus"
  - name: "method"
    type: "RefundMethod"
  - name: "initiatedDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "returnRequest"
    type: "ReturnRequest"
    multiplicity: "ManyToOne"
  - name: "allocations"
    type: "RefundAllocation"
    multiplicity: "OneToMany"
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "fees"
    type: "Fee"
    multiplicity: "OneToMany"
  - name: "taxCredits"
    type: "TaxCredit"
    multiplicity: "OneToMany"
- name: "RefundAllocation"
  description: "Breakdown of a refund by destination or tender, including tax portions\
    \ and ledger implications."
  data:
  - name: "amount"
    type: "Money"
  - name: "taxPortion"
    type: "Money"
  - name: "destination"
    type: "RefundDestination"
  relations:
  - name: "refund"
    type: "Refund"
    multiplicity: "ManyToOne"
- name: "Fee"
  description: "Charge or deduction related to a return, such as restocking or label\
    \ fees, which may be taxable."
  data:
  - name: "name"
    type: "String"
  - name: "feeType"
    type: "FeeType"
  - name: "amount"
    type: "Money"
  - name: "taxable"
    type: "Boolean"
  relations:
  - name: "returnLine"
    type: "ReturnLine"
    multiplicity: "ManyToOne"
  - name: "refund"
    type: "Refund"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "ReturnPolicy"
    multiplicity: "ManyToOne"
- name: "ExchangeOrder"
  description: "Replacement order issued in response to a return, used to fulfill\
    \ exchanges rather than monetary refunds."
  data:
  - name: "reference"
    type: "String"
  - name: "status"
    type: "ExchangeStatus"
  - name: "createdDate"
    type: "Date"
  relations:
  - name: "returnRequest"
    type: "ReturnRequest"
    multiplicity: "ManyToOne"
  - name: "replacementItems"
    type: "ReplacementItem"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "ReplacementShipment"
    multiplicity: "OneToMany"
- name: "ReplacementItem"
  description: "Product and quantity details to be shipped as part of an exchange\
    \ order."
  data:
  - name: "quantity"
    type: "Integer"
  - name: "reason"
    type: "String"
  relations:
  - name: "exchangeOrder"
    type: "ExchangeOrder"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "ReplacementShipment"
  description: "Shipment that delivers replacement items to the customer as part of\
    \ an exchange."
  data:
  - name: "shipmentReference"
    type: "String"
  - name: "status"
    type: "ShipmentStatus"
  - name: "shippedDate"
    type: "Date"
  - name: "carrierTrackingNumber"
    type: "String"
  relations:
  - name: "exchangeOrder"
    type: "ExchangeOrder"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
- name: "PickupAppointment"
  description: "Scheduled visit by a carrier to collect return parcels from the customer."
  data:
  - name: "scheduledDate"
    type: "Date"
  - name: "windowStart"
    type: "Date"
  - name: "windowEnd"
    type: "Date"
  - name: "instructions"
    type: "String"
  relations:
  - name: "returnRequest"
    type: "ReturnRequest"
    multiplicity: "ManyToOne"
  - name: "carrier"
    type: "Carrier"
    multiplicity: "ManyToOne"
- name: "Communication"
  description: "Customer-facing or internal message related to a return, including\
    \ channel and direction."
  data:
  - name: "eventDate"
    type: "Date"
  - name: "channel"
    type: "CommunicationChannel"
  - name: "direction"
    type: "MessageDirection"
  - name: "content"
    type: "String"
  relations:
  - name: "returnRequest"
    type: "ReturnRequest"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
- name: "Attachment"
  description: "Supporting artifact such as photo evidence, receipts, or documents\
    \ tied to a return process."
  data:
  - name: "fileName"
    type: "String"
  - name: "fileType"
    type: "String"
  - name: "url"
    type: "String"
  - name: "category"
    type: "AttachmentCategory"
  relations:
  - name: "returnRequest"
    type: "ReturnRequest"
    multiplicity: "ManyToOne"
  - name: "inspection"
    type: "Inspection"
    multiplicity: "ManyToOne"
  - name: "communication"
    type: "Communication"
    multiplicity: "ManyToOne"
- name: "ReturnEvent"
  description: "Auditable milestone or activity recorded during the lifecycle of a\
    \ return."
  data:
  - name: "eventType"
    type: "ReturnEventType"
  - name: "eventDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "returnRequest"
    type: "ReturnRequest"
    multiplicity: "ManyToOne"
  - name: "shipment"
    type: "ReturnShipment"
    multiplicity: "ManyToOne"
- name: "SLA"
  description: "Service-level target defining timelines for stages such as authorization,\
    \ check-in, inspection, and refund."
  data:
  - name: "name"
    type: "String"
  - name: "targetDays"
    type: "Integer"
  - name: "appliesTo"
    type: "SlaScope"
  relations:
  - name: "policy"
    type: "ReturnPolicy"
    multiplicity: "ManyToOne"
- name: "GiftReturnDetail"
  description: "Additional information governing returns for gifted purchases, including\
    \ privacy preferences."
  data:
  - name: "originalPayerVisibility"
    type: "GiftReturnVisibility"
  - name: "contactEmail"
    type: "String"
  relations:
  - name: "returnRequest"
    type: "ReturnRequest"
    multiplicity: "ManyToOne"
- name: "TaxCredit"
  description: "Amount of tax recovered or adjusted as part of the refund associated\
    \ with a return."
  data:
  - name: "amount"
    type: "Money"
  - name: "jurisdiction"
    type: "String"
  relations:
  - name: "refund"
    type: "Refund"
    multiplicity: "ManyToOne"
enums:
- name: "SalesChannelType"
  description: "Classification of how and where the sale occurred, impacting return\
    \ methods and policies."
  data:
  - name: "OnlineStore"
  - name: "Marketplace"
  - name: "PhysicalStore"
  - name: "SocialCommerce"
- name: "ProductType"
  description: "Category of sellable item determining eligibility and handling rules\
    \ for returns."
  data:
  - name: "PhysicalGood"
  - name: "DigitalGood"
  - name: "Service"
  - name: "Bundle"
- name: "ReturnPolicyType"
  description: "Style of return policy that sets the context for rules and exceptions."
  data:
  - name: "Standard"
  - name: "HolidayExtended"
  - name: "FinalSaleExclusion"
  - name: "WarrantyReturn"
- name: "FeeType"
  description: "Types of charges that may be applied to a return process."
  data:
  - name: "Restocking"
  - name: "ReturnLabel"
  - name: "Damage"
  - name: "Processing"
- name: "FeeBasisType"
  description: "Method for computing a fee amount."
  data:
  - name: "Flat"
  - name: "Percentage"
  - name: "Tiered"
- name: "ReturnStatus"
  description: "Overall lifecycle state of a return request."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Authorized"
  - name: "InTransit"
  - name: "Received"
  - name: "Inspected"
  - name: "Completed"
  - name: "Rejected"
  - name: "Cancelled"
  - name: "PartiallyCompleted"
- name: "ReturnMethod"
  description: "Way in which the customer provides the returned items."
  data:
  - name: "MailIn"
  - name: "InStoreDropOff"
  - name: "CarrierPickup"
  - name: "LockerDrop"
- name: "ReturnReason"
  description: "Customer-stated motivation for returning an item."
  data:
  - name: "Defective"
  - name: "DamagedInTransit"
  - name: "NotAsDescribed"
  - name: "WrongItemShipped"
  - name: "BetterPriceFound"
  - name: "NoLongerNeeded"
  - name: "SizeFitIssue"
  - name: "GiftReturn"
  - name: "Other"
- name: "ItemCondition"
  description: "Observed state of the returned item that influences disposition and\
    \ refund amount."
  data:
  - name: "NewSealed"
  - name: "OpenBox"
  - name: "UsedGood"
  - name: "UsedPoor"
  - name: "Damaged"
  - name: "MissingParts"
- name: "AuthorizationStatus"
  description: "Decision state of the return authorization."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Declined"
  - name: "Expired"
  - name: "Revoked"
- name: "ShipmentStatus"
  description: "Tracking state of a shipment carrying returned or replacement goods."
  data:
  - name: "LabelCreated"
