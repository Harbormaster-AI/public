---
metadata:
  name: "Loyalty HCIDL Capability Model"
  description: "Canonical capability model for loyalty programs, tiers, accrual, redemptions,\
    \ promotions, and partner engagement across commerce channels."
  version: "1.0.0"
  industry: "Commerce"
  category: "Commerce"
  type: "Capability"
  domain: "Loyalty"
entities:
- name: "LoyaltyProgram"
  description: "Defines a loyalty program with rules for earning, redeeming, tiering,\
    \ and member engagement."
  data:
  - name: "name"
    type: "String"
  - name: "programCode"
    type: "String"
  - name: "programType"
    type: "ProgramType"
  - name: "pointsCurrencyName"
    type: "String"
  - name: "defaultEnrollmentChannel"
    type: "ChannelType"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "tiers"
    type: "LoyaltyTier"
    multiplicity: "OneToMany"
  - name: "memberships"
    type: "Membership"
    multiplicity: "OneToMany"
  - name: "earningRules"
    type: "EarningRule"
    multiplicity: "OneToMany"
  - name: "redemptionRules"
    type: "RedemptionRule"
    multiplicity: "OneToMany"
  - name: "rewardCatalog"
    type: "RewardCatalog"
    multiplicity: "OneToOne"
  - name: "partners"
    type: "Partner"
    multiplicity: "ManyToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "OneToMany"
  - name: "expirationPolicies"
    type: "ExpirationPolicy"
    multiplicity: "OneToMany"
- name: "LoyaltyTier"
  description: "Tier within a program representing member status and associated benefits."
  data:
  - name: "name"
    type: "String"
  - name: "level"
    type: "Integer"
  - name: "thresholdPoints"
    type: "Integer"
  - name: "thresholdSpend"
    type: "Money"
  - name: "validityMonths"
    type: "Integer"
  - name: "autoDowngradeEnabled"
    type: "Boolean"
  relations:
  - name: "program"
    type: "LoyaltyProgram"
    multiplicity: "ManyToOne"
  - name: "benefits"
    type: "Benefit"
    multiplicity: "ManyToMany"
- name: "Benefit"
  description: "Configurable perk or entitlement associated with a tier or promotion."
  data:
  - name: "name"
    type: "String"
  - name: "benefitType"
    type: "BenefitType"
  - name: "descriptionText"
    type: "String"
  - name: "value"
    type: "String"
  - name: "recurring"
    type: "Boolean"
  relations:
  - name: "tiers"
    type: "LoyaltyTier"
    multiplicity: "ManyToMany"
- name: "Member"
  description: "Individual or organization participating in one or more loyalty programs."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phoneNumber"
    type: "String"
  - name: "birthDate"
    type: "Date"
  - name: "marketingOptIn"
    type: "Boolean"
  - name: "locale"
    type: "String"
  - name: "memberSegment"
    type: "String"
  relations:
  - name: "memberships"
    type: "Membership"
    multiplicity: "OneToMany"
  - name: "activities"
    type: "ActivityEvent"
    multiplicity: "OneToMany"
  - name: "transferRequests"
    type: "TransferRequest"
    multiplicity: "OneToMany"
  - name: "preferences"
    type: "MemberPreference"
    multiplicity: "OneToOne"
- name: "MemberPreference"
  description: "Communication and statement delivery preferences for a member."
  data:
  - name: "preferredChannel"
    type: "ChannelType"
  - name: "statementPreference"
    type: "StatementPreference"
  - name: "emailOptIn"
    type: "Boolean"
  - name: "smsOptIn"
    type: "Boolean"
  - name: "pushOptIn"
    type: "Boolean"
  - name: "language"
    type: "String"
  relations:
  - name: "member"
    type: "Member"
    multiplicity: "ManyToOne"
- name: "Membership"
  description: "Enrollment of a member in a specific program with current status and\
    \ tier."
  data:
  - name: "enrollmentDate"
    type: "Date"
  - name: "status"
    type: "MembershipStatus"
  - name: "referralCode"
    type: "String"
  - name: "enrollmentChannel"
    type: "ChannelType"
  - name: "anniversaryMonth"
    type: "Integer"
  relations:
  - name: "member"
    type: "Member"
    multiplicity: "ManyToOne"
  - name: "program"
    type: "LoyaltyProgram"
    multiplicity: "ManyToOne"
  - name: "currentTier"
    type: "LoyaltyTier"
    multiplicity: "ManyToOne"
  - name: "pointAccount"
    type: "PointAccount"
    multiplicity: "OneToOne"
  - name: "vouchers"
    type: "Voucher"
    multiplicity: "OneToMany"
  - name: "redemptionOrders"
    type: "RedemptionOrder"
    multiplicity: "OneToMany"
  - name: "tierQualifications"
    type: "TierQualification"
    multiplicity: "OneToMany"
- name: "PointAccount"
  description: "Ledger summarizing points balance and expiration for a membership."
  data:
  - name: "balance"
    type: "Integer"
  - name: "availableBalance"
    type: "Integer"
  - name: "pendingBalance"
    type: "Integer"
  - name: "lastActivityDate"
    type: "Date"
  - name: "nextExpirationDate"
    type: "Date"
  relations:
  - name: "membership"
    type: "Membership"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "PointTransaction"
    multiplicity: "OneToMany"
  - name: "balanceSnapshots"
    type: "BalanceSnapshot"
    multiplicity: "OneToMany"
- name: "PointTransaction"
  description: "Atomic movement of points representing accrual, redemption, expiration,\
    \ or adjustment."
  data:
  - name: "transactionDate"
    type: "Date"
  - name: "transactionType"
    type: "PointTransactionType"
  - name: "points"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "source"
    type: "TransactionSourceType"
  - name: "status"
    type: "TransactionStatus"
  - name: "adjustmentReason"
    type: "AdjustmentReason"
  - name: "externalReference"
    type: "String"
  relations:
  - name: "pointAccount"
    type: "PointAccount"
    multiplicity: "ManyToOne"
  - name: "activityEvent"
    type: "ActivityEvent"
    multiplicity: "ManyToOne"
  - name: "partner"
    type: "Partner"
    multiplicity: "ManyToOne"
  - name: "redemptionOrder"
    type: "RedemptionOrder"
    multiplicity: "ManyToOne"
  - name: "transferRequest"
    type: "TransferRequest"
    multiplicity: "ManyToOne"
- name: "EarningRule"
  description: "Configuration describing how members earn points from activities or\
    \ spend."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "EarningRuleType"
  - name: "multiplier"
    type: "Decimal"
  - name: "fixedPoints"
    type: "Integer"
  - name: "conditionExpression"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "RuleStatus"
  - name: "applyOncePerMember"
    type: "Boolean"
  relations:
  - name: "program"
    type: "LoyaltyProgram"
    multiplicity: "ManyToOne"
  - name: "eligibleTiers"
    type: "LoyaltyTier"
    multiplicity: "ManyToMany"
  - name: "partners"
    type: "Partner"
    multiplicity: "ManyToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
- name: "RedemptionRule"
  description: "Policy defining how points can be spent and the value they provide."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "RedemptionRuleType"
  - name: "minPoints"
    type: "Integer"
  - name: "pointsStep"
    type: "Integer"
  - name: "valuePerPoint"
    type: "Decimal"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "RuleStatus"
  - name: "allowPartial"
    type: "Boolean"
  relations:
  - name: "program"
    type: "LoyaltyProgram"
    multiplicity: "ManyToOne"
  - name: "eligibleTiers"
    type: "LoyaltyTier"
    multiplicity: "ManyToMany"
  - name: "partners"
    type: "Partner"
    multiplicity: "ManyToMany"
  - name: "rewardCatalog"
    type: "RewardCatalog"
    multiplicity: "ManyToOne"
- name: "RewardCatalog"
  description: "Collection of redeemable rewards curated for a program and region."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "currency"
    type: "String"
  relations:
  - name: "program"
    type: "LoyaltyProgram"
    multiplicity: "ManyToOne"
  - name: "rewards"
    type: "Reward"
    multiplicity: "OneToMany"
- name: "Reward"
  description: "Redeemable item offered to members, such as vouchers, products, or\
    \ experiences."
  data:
  - name: "name"
    type: "String"
  - name: "rewardType"
    type: "RewardType"
  - name: "costInPoints"
    type: "Integer"
  - name: "faceValue"
    type: "Money"
  - name: "inventoryQuantity"
    type: "Integer"
  - name: "isDigital"
    type: "Boolean"
  - name: "terms"
    type: "String"
  - name: "status"
    type: "RewardStatus"
  relations:
  - name: "catalog"
    type: "RewardCatalog"
    multiplicity: "ManyToOne"
  - name: "partner"
    type: "Partner"
    multiplicity: "ManyToOne"
- name: "Voucher"
  description: "Token issued to a member upon redemption, representing stored value\
    \ or entitlement."
  data:
  - name: "voucherCode"
    type: "String"
  - name: "status"
    type: "VoucherStatus"
  - name: "issueDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "value"
    type: "Money"
  - name: "pointsSpent"
    type: "Integer"
  - name: "redemptionChannel"
    type: "ChannelType"
  relations:
  - name: "membership"
    type: "Membership"
    multiplicity: "ManyToOne"
  - name: "reward"
    type: "Reward"
    multiplicity: "ManyToOne"
  - name: "redemptionOrder"
    type: "RedemptionOrder"
    multiplicity: "ManyToOne"
- name: "RedemptionOrder"
  description: "Member-initiated request to redeem points for one or more rewards."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "status"
    type: "RedemptionOrderStatus"
  - name: "createdDate"
    type: "Date"
  - name: "totalPoints"
    type: "Integer"
  - name: "totalValue"
    type: "Money"
  - name: "channel"
    type: "ChannelType"
  relations:
  - name: "membership"
    type: "Membership"
    multiplicity: "ManyToOne"
  - name: "vouchers"
    type: "Voucher"
    multiplicity: "OneToMany"
  - name: "pointTransactions"
    type: "PointTransaction"
    multiplicity: "OneToMany"
- name: "Promotion"
  description: "Time-bound initiative that enhances earning or redemption for targeted\
    \ segments."
  data:
  - name: "name"
    type: "String"
  - name: "promotionCode"
    type: "String"
  - name: "descriptionText"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "PromotionStatus"
  - name: "offerType"
    type: "OfferType"
  - name: "maxUsesPerMember"
    type: "Integer"
  - name: "globalCap"
    type: "Integer"
  relations:
  - name: "program"
    type: "LoyaltyProgram"
    multiplicity: "ManyToOne"
  - name: "eligibleTiers"
    type: "LoyaltyTier"
    multiplicity: "ManyToMany"
  - name: "partners"
    type: "Partner"
    multiplicity: "ManyToMany"
  - name: "earningRules"
    type: "EarningRule"
    multiplicity: "ManyToMany"
- name: "Partner"
  description: "External entity collaborating for earning or redemption, such as merchants\
    \ or travel partners."
  data:
  - name: "name"
    type: "String"
  - name: "partnerType"
    type: "PartnerType"
  - name: "website"
    type: "String"
  - name: "settlementCurrency"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "programs"
    type: "LoyaltyProgram"
    multiplicity: "ManyToMany"
  - name: "offers"
    type: "PartnerOffer"
    multiplicity: "OneToMany"
  - name: "earningRules"
    type: "EarningRule"
    multiplicity: "ManyToMany"
  - name: "redemptionRules"
    type: "RedemptionRule"
    multiplicity: "ManyToMany"
  - name: "pointTransactions"
    type: "PointTransaction"
    multiplicity: "OneToMany"
  - name: "rewards"
    type: "Reward"
    multiplicity: "OneToMany"
- name: "PartnerOffer"
  description: "Specific partner proposition enabling earn or burn under defined terms."
  data:
  - name: "name"
    type: "String"
  - name: "offerType"
    type: "OfferType"
  - name: "offerCode"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "OfferStatus"
  - name: "earnMultiplier"
    type: "Decimal"
  - name: "discountPercent"
    type: "Decimal"
  - name: "terms"
    type: "String"
  relations:
  - name: "partner"
    type: "Partner"
    multiplicity: "ManyToOne"
  - name: "program"
    type: "LoyaltyProgram"
    multiplicity: "ManyToOne"
  - name: "eligibleTiers"
    type: "LoyaltyTier"
    multiplicity: "ManyToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
- name: "ExpirationPolicy"
  description: "Rules controlling when and how points expire for a program."
  data:
  - name: "policyType"
    type: "ExpirationPolicyType"
  - name: "validityMonths"
    type: "Integer"
  - name: "inactivityMonths"
    type: "Integer"
  - name: "windowDays"
    type: "Integer"
  - name: "descriptionText"
    type: "String"
  - name: "status"
    type: "PolicyStatus"
  relations:
  - name: "program"
    type: "LoyaltyProgram"
    multiplicity: "ManyToOne"
- name: "TierQualification"
  description: "Evaluation record determining a member’s tier outcome for a period."
  data:
  - name: "evaluationDate"
    type: "Date"
  - name: "evaluationType"
    type: "EvaluationType"
  - name: "metric"
    type: "QualificationMetric"
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "qualifyingPoints"
    type: "Integer"
  - name: "qualifyingSpend"
    type: "Money"
  - name: "outcomeTierLevel"
    type: "Integer"
  - name: "outcomeNote"
    type: "String"
  relations:
  - name: "membership"
    type: "Membership"
    multiplicity: "ManyToOne"
  - name: "resultingTier"
    type: "LoyaltyTier"
    multiplicity: "ManyToOne"
- name: "ActivityEvent"
  description: "Member engagement signal such as purchase, review, or app action used\
    \ for accrual or targeting."
  data:
  - name: "eventType"
    type: "ActivityType"
  - name: "eventDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "channel"
    type: "ChannelType"
  - name: "sourceReference"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "membership"
    type: "Membership"
    multiplicity: "ManyToOne"
  - name: "partner"
    type: "Partner"
    multiplicity: "ManyToOne"
  - name: "pointTransactions"
    type: "PointTransaction"
    multiplicity: "OneToMany"
- name: "BalanceSnapshot"
  description: "Historical capture of a point account’s balances and upcoming expirations."
  data:
  - name: "snapshotDate"
    type: "Date"
  - name: "balance"
    type: "Integer"
  - name: "availableBalance"
    type: "Integer"
  - name: "pendingBalance"
    type: "Integer"
  - name: "expiringPoints"
    type: "Integer"
  - name: "nextExpirationDate"
    type: "Date"
  relations:
  - name: "pointAccount"
    type: "PointAccount"
    multiplicity: "ManyToOne"
- name: "TransferRequest"
  description: "Request to transfer points between memberships or to a partner program."
  data:
  - name: "requestDate"
    type: "Date"
  - name: "status"
    type: "TransferStatus"
  - name: "fromMemberReference"
    type: "String"
  - name: "toMemberReference"
    type: "String"
  - name: "points"
    type: "Integer"
  - name: "reason"
    type: "String"
  relations:
  - name: "membership"
    type: "Membership"
    multiplicity: "ManyToOne"
  - name: "pointTransactions"
    type: "PointTransaction"
    multiplicity: "OneToMany"
- name: "RedemptionReservation"
  description: "Temporary hold of points while a redemption is being confirmed."
  data:
  - name: "reservationNumber"
    type: "String"
  - name: "status"
    type: "ReservationStatus"
  - name: "holdPoints"
    type: "Integer"
  - name: "createdDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "membership"
    type: "Membership"
    multiplicity: "ManyToOne"
  - name: "reward"
    type: "Reward"
    multiplicity: "ManyToOne"
  - name: "redemptionOrder"
    type: "RedemptionOrder"
    multiplicity: "OneToOne"
enums:
- name: "ProgramType"
  description: "Classification of the loyalty program’s primary value unit and structure."
  data:
  - name: "Points"
  - name: "Miles"
  - name: "Stamps"
  - name: "TieredOnly"
- name: "MembershipStatus"
  description: "Current standing of a member’s enrollment in a program."
  data:
  - name: "Active"
  - name: "Paused"
  - name: "Suspended"
  - name: "Closed"
  - name: "Pending"
- name: "RuleStatus"
  description: "Lifecycle state of an earning or redemption rule."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Paused"
  - name: "Retired"
- name: "EarningRuleType"
  description: "Mechanism by which points are accrued."
  data:
  - name: "PurchaseMultiplier"
  - name: "FixedBonus"
  - name: "EventBased"
  - name: "TierBonus"
  - name: "PartnerMultiplier"
- name: "RedemptionRuleType"
  description: "Method defining how points can be redeemed and valued."
  data:
  - name: "FixedValueVoucher"
  - name: "CatalogItem"
  - name: "CashBack"
  - name: "Donation"
  - name: "DiscountAtCheckout"
- name: "PointTransactionType"
  description: "Type of points movement recorded in the ledger."
  data:
  - name: "Accrual"
  - name: "Redemption"
  - name: "Expiration"
  - name: "Adjustment"
  - name: "Reversal"
  - name: "TransferIn"
  - name: "TransferOut"
- name: "TransactionSourceType"
  description: "Originating context for a points transaction."
  data:
  - name: "Purchase"
  - name: "Manual"
  - name: "Promotion"
  - name: "Partner"
  - name: "Referral"
  - name: "ServiceRecovery"
- name: "TransactionStatus"
  description: "Processing state of a points transaction."
  data:
  - name: "Pending"
  - name: "Posted"
  - name: "Voided"
  - name: "Reversed"
- name: "AdjustmentReason"
  description: "Business rationale for manual point corrections."
  data:
  - name: "Goodwill"
  - name: "FraudCorrection"
  - name: "SystemError"
  - name: "DataReconciliation"
  - name: "PolicyException"
- name: "RewardType"
  description: "Category of redeemable reward."
  data:
  - name: "Voucher"
  - name: "PhysicalItem"
  - name: "DigitalItem"
  - name: "Experience"
  - name: "Coupon"
  - name: "GiftCard"
- name: "RewardStatus"
  description: "Availability state of a reward in the catalog."
  data:
  - name: "Active"
  - name: "OutOfStock"
  - name: "Discontinued"
  - name: "Hidden"
- name: "VoucherStatus"
  description: "Lifecycle state of an issued voucher."
  data:
  - name: "Issued"
  - name: "Active"
  - name: "Redeemed"
  - name: "Expired"
  - name: "Cancelled"
  - name: "Void"
- name: "PromotionStatus"
  description: "Activation status of a promotion."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Paused"
  - name: "Ended"
- name: "OfferType"
  description: "Indicates whether an offer enables earning or burning."
  data:
  - name: "Earn"
  - name: "Burn"
- name: "OfferStatus"
  description: "Operational state of a partner offer."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Paused"
  - name: "Ended"
- name: "ChannelType"
  description: "Commerce or engagement channel used by the member."
  data:
  - name: "Online"
  - name: "InStore"
  - name: "MobileApp"
  - name: "CallCenter"
  - name: "Marketplace"
- name: "ActivityType"
  description: "Type of member action or event considered for loyalty processing."
  data:
  - name: "Purchase"
  - name: "Signup"
  - name: "Review"
  - name: "CheckIn"
  - name: "AppInstall"
  - name: "SocialShare"
  - name: "Birthday"
  - name: "Anniversary"
- name: "ExpirationPolicyType"
  description: "Strategy by which points validity is determined."
  data:
  - name: "FixedDate"
  - name: "InactivityPeriod"
  - name: "RollingWindow"
- name: "PolicyStatus"
  description: "Activation state of an expiration policy."
  data:
  - name: "Active"
  - name: "Paused"
  - name: "Retired"
- name: "EvaluationType"
  description: "Mode by which tier evaluations are triggered."
  data:
  - name: "Scheduled"
  - name: "Manual"
  - name: "RealTime"
- name: "QualificationMetric"
  description: "Primary metric used to determine tier outcomes."
  data:
  - name: "Points"
  - name: "Spend"
  - name: "Visits"
  - name: "Transactions"
- name: "PartnerType"
  description: "Business classification of a loyalty partner."
  data:
  - name: "Retailer"
  - name: "Airline"
  - name: "Hotel"
  - name: "Restaurant"
  - name: "Payment"
  - name: "Marketplace"
  - name: "SvcProvider"
- name: "TransferStatus"
  description: "Processing state of a points transfer request."
  data:
  - name: "Requested"
  - name: "Approved"
  - name: "Rejected"
  - name: "Completed"
  - name: "Cancelled"
- name: "StatementPreference"
  description: "Delivery preference for loyalty statements."
  data:
  - name: "Paperless"
  - name: "Email"
  - name: "Paper"
- name: "RedemptionOrderStatus"
  description: "Processing state of a redemption order."
  data:
  - name: "Submitted"
  - name: "Confirmed"
  - name: "Fulfilled"
  - name: "Cancelled"
