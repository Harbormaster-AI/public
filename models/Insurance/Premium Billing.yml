---
metadata:
  name: "HCIDL Premium Billing Capabilities Model"
  description: "Canonical capabilities model for Premium Billing within insurance,\
    \ covering accounts, invoicing, payments, adjustments, bill runs, statements,\
    \ and collections."
  version: "1.0.0"
  industry: "Insurance"
  category: "Insurance"
  type: "Capability"
  domain: "Premium Billing"
entities:
- name: "Payer"
  description: "Person or organization responsible for paying premiums and authorizing\
    \ payment methods."
  data:
  - name: "payerType"
    type: "PayerType"
  - name: "organizationName"
    type: "String"
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "taxIdentifier"
    type: "String"
  - name: "billingAddress"
    type: "Address"
  relations:
  - name: "billingAccounts"
    type: "BillingAccount"
    multiplicity: "OneToMany"
  - name: "storedPaymentMethods"
    type: "StoredPaymentMethod"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
- name: "BillingAccount"
  description: "Consolidated account for billing one or more policies, managing invoices,\
    \ payments, statements, and collections."
  data:
  - name: "accountNumber"
    type: "String"
  - name: "accountName"
    type: "String"
  - name: "status"
    type: "BillingAccountStatus"
  - name: "billToName"
    type: "String"
  - name: "billToAddress"
    type: "Address"
  - name: "preferredDeliveryMethod"
    type: "DeliveryMethod"
  - name: "paymentTermDays"
    type: "Integer"
  - name: "autopayEnabled"
    type: "Boolean"
  relations:
  - name: "payer"
    type: "Payer"
    multiplicity: "ManyToOne"
  - name: "defaultPaymentMethod"
    type: "StoredPaymentMethod"
    multiplicity: "ManyToOne"
  - name: "policies"
    type: "Policy"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "adjustments"
    type: "Adjustment"
    multiplicity: "OneToMany"
  - name: "dunningCases"
    type: "DunningCase"
    multiplicity: "OneToMany"
  - name: "statements"
    type: "Statement"
    multiplicity: "OneToMany"
- name: "Policy"
  description: "Policy summary for billing, including term details and billing channel\
    \ applicable to premium collection."
  data:
  - name: "policyNumber"
    type: "String"
  - name: "lineOfBusiness"
    type: "String"
  - name: "billingChannel"
    type: "BillingChannel"
  - name: "term"
    type: "Period"
  - name: "ratingCurrency"
    type: "String"
  relations:
  - name: "billingAccount"
    type: "BillingAccount"
    multiplicity: "ManyToOne"
  - name: "billingSchedule"
    type: "BillingSchedule"
    multiplicity: "OneToOne"
  - name: "invoiceLines"
    type: "InvoiceLine"
    multiplicity: "OneToMany"
- name: "BillingSchedule"
  description: "Rules defining frequency, timing, and proration for invoicing premiums\
    \ at the policy or account level."
  data:
  - name: "frequency"
    type: "BillingFrequency"
  - name: "dayOfMonth"
    type: "Integer"
  - name: "installmentCount"
    type: "Integer"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "prorationMethod"
    type: "ProrationMethod"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "billingAccount"
    type: "BillingAccount"
    multiplicity: "ManyToOne"
- name: "BillRun"
  description: "Batch process that evaluates accounts and generates invoices based\
    \ on schedules and eligibility."
  data:
  - name: "runReference"
    type: "String"
  - name: "runDate"
    type: "Date"
  - name: "cycle"
    type: "BillingCycle"
  - name: "status"
    type: "BillRunStatus"
  - name: "initiatedBy"
    type: "String"
  relations:
  - name: "runItems"
    type: "BillRunItem"
    multiplicity: "OneToMany"
- name: "BillRunItem"
  description: "Evaluation outcome for a single billing account during a bill run."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "result"
    type: "BillRunResult"
  - name: "message"
    type: "String"
  relations:
  - name: "billRun"
    type: "BillRun"
    multiplicity: "ManyToOne"
  - name: "billingAccount"
    type: "BillingAccount"
    multiplicity: "ManyToOne"
  - name: "generatedInvoices"
    type: "Invoice"
    multiplicity: "OneToMany"
- name: "Invoice"
  description: "Document requesting payment for premiums, fees, and surcharges, including\
    \ taxes and adjustments."
  data:
  - name: "invoiceNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "InvoiceStatus"
  - name: "totalDue"
    type: "Money"
  - name: "totalTax"
    type: "Money"
  - name: "balance"
    type: "Money"
  - name: "deliveryMethod"
    type: "DeliveryMethod"
  relations:
  - name: "billingAccount"
    type: "BillingAccount"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "invoiceLines"
    type: "InvoiceLine"
    multiplicity: "OneToMany"
  - name: "adjustments"
    type: "Adjustment"
    multiplicity: "OneToMany"
  - name: "allocations"
    type: "PaymentAllocation"
    multiplicity: "OneToMany"
  - name: "statement"
    type: "Statement"
    multiplicity: "ManyToOne"
- name: "InvoiceLine"
  description: "Itemized charge or credit on an invoice representing premium components\
    \ and related charges."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "chargeType"
    type: "ChargeType"
  - name: "chargeTiming"
    type: "ChargeTiming"
  - name: "unitAmount"
    type: "Money"
  - name: "quantity"
    type: "Decimal"
  - name: "subtotal"
    type: "Money"
  - name: "taxTreatment"
    type: "TaxTreatment"
  - name: "servicePeriod"
    type: "Period"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "taxes"
    type: "TaxLine"
    multiplicity: "OneToMany"
  - name: "allocations"
    type: "PaymentAllocation"
    multiplicity: "OneToMany"
- name: "TaxLine"
  description: "Tax component calculated for a specific invoice line."
  data:
  - name: "jurisdiction"
    type: "String"
  - name: "taxType"
    type: "TaxType"
  - name: "rate"
    type: "Decimal"
  - name: "amount"
    type: "Money"
  relations:
  - name: "invoiceLine"
    type: "InvoiceLine"
    multiplicity: "ManyToOne"
- name: "Statement"
  description: "Periodic summary of invoices, payments, and open balances for a billing\
    \ account."
  data:
  - name: "statementNumber"
    type: "String"
  - name: "period"
    type: "Period"
  - name: "issueDate"
    type: "Date"
  - name: "totalDue"
    type: "Money"
  - name: "minimumPayment"
    type: "Money"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "StatementStatus"
  relations:
  - name: "billingAccount"
    type: "BillingAccount"
    multiplicity: "ManyToOne"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
- name: "Payment"
  description: "Monetary remittance recorded against a billing account and allocated\
    \ to open items."
  data:
  - name: "paymentReference"
    type: "String"
  - name: "receivedDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "method"
    type: "PaymentMethodType"
  - name: "status"
    type: "PaymentStatus"
  - name: "externalProcessor"
    type: "String"
  relations:
  - name: "billingAccount"
    type: "BillingAccount"
    multiplicity: "ManyToOne"
  - name: "payer"
    type: "Payer"
    multiplicity: "ManyToOne"
  - name: "allocations"
    type: "PaymentAllocation"
    multiplicity: "OneToMany"
  - name: "refunds"
    type: "Refund"
    multiplicity: "OneToMany"
  - name: "remittanceAdvice"
    type: "RemittanceAdvice"
    multiplicity: "ManyToOne"
- name: "PaymentAllocation"
  description: "Allocation of a payment amount to an invoice, invoice line, or adjustment."
  data:
  - name: "amount"
    type: "Money"
  - name: "allocationDate"
    type: "Date"
  - name: "targetType"
    type: "AllocationTargetType"
  - name: "sequence"
    type: "Integer"
  relations:
  - name: "payment"
    type: "Payment"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "invoiceLine"
    type: "InvoiceLine"
    multiplicity: "ManyToOne"
  - name: "adjustment"
    type: "Adjustment"
    multiplicity: "ManyToOne"
- name: "Adjustment"
  description: "Manual credit or debit applied to correct balances or reflect policy\
    \ changes."
  data:
  - name: "adjustmentNumber"
    type: "String"
  - name: "adjustmentType"
    type: "AdjustmentType"
  - name: "reason"
    type: "AdjustmentReason"
  - name: "amount"
    type: "Money"
  - name: "effectiveDate"
    type: "Date"
  - name: "status"
    type: "AdjustmentStatus"
  relations:
  - name: "billingAccount"
    type: "BillingAccount"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
- name: "Refund"
  description: "Return of funds to a payer arising from overpayment or credit balance."
  data:
  - name: "refundNumber"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "reason"
    type: "RefundReason"
  - name: "status"
    type: "RefundStatus"
  - name: "initiatedDate"
    type: "Date"
  - name: "processedDate"
    type: "Date"
  relations:
  - name: "payment"
    type: "Payment"
    multiplicity: "ManyToOne"
  - name: "billingAccount"
    type: "BillingAccount"
    multiplicity: "ManyToOne"
- name: "WriteOff"
  description: "Accounting measure to remove amounts deemed uncollectible after collection\
    \ efforts."
  data:
  - name: "writeOffNumber"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "reason"
    type: "WriteOffReason"
  - name: "approvalStatus"
    type: "ApprovalStatus"
  - name: "writeOffDate"
    type: "Date"
  relations:
  - name: "billingAccount"
    type: "BillingAccount"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "DunningCase"
  description: "Collections case tracking outreach and enforcement actions for past-due\
    \ balances."
  data:
  - name: "caseNumber"
    type: "String"
  - name: "openedDate"
    type: "Date"
  - name: "status"
    type: "DunningStatus"
  - name: "currentStage"
    type: "Integer"
  - name: "totalPastDue"
    type: "Money"
  - name: "strategy"
    type: "DunningStrategy"
  relations:
  - name: "billingAccount"
    type: "BillingAccount"
    multiplicity: "ManyToOne"
  - name: "dunningSteps"
    type: "DunningStep"
    multiplicity: "OneToMany"
- name: "DunningStep"
  description: "Action or event performed within a dunning case, with timing and outcome."
  data:
  - name: "stepNumber"
    type: "Integer"
  - name: "action"
    type: "DunningActionType"
  - name: "actionDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "outcome"
    type: "DunningOutcome"
  - name: "note"
    type: "String"
  relations:
  - name: "dunningCase"
    type: "DunningCase"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "StoredPaymentMethod"
  description: "Tokenized and authorized payment instrument available for collecting\
    \ premiums."
  data:
  - name: "methodType"
    type: "PaymentMethodType"
  - name: "maskedDetails"
    type: "String"
  - name: "expiryMonth"
    type: "Integer"
  - name: "expiryYear"
    type: "Integer"
  - name: "billingAddress"
    type: "Address"
  - name: "isDefault"
    type: "Boolean"
  - name: "status"
    type: "PaymentMethodStatus"
  relations:
  - name: "payer"
    type: "Payer"
    multiplicity: "ManyToOne"
  - name: "billingAccounts"
    type: "BillingAccount"
    multiplicity: "ManyToMany"
- name: "RemittanceAdvice"
  description: "Document from a payer or intermediary detailing intended allocations\
    \ and references for a payment."
  data:
  - name: "referenceNumber"
    type: "String"
  - name: "remitterName"
    type: "String"
  - name: "receivedDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "notes"
    type: "String"
  relations:
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
enums:
- name: "PayerType"
  description: "Classification of the entity responsible for paying premiums."
  data:
  - name: "Individual"
  - name: "Organization"
  - name: "Broker"
  - name: "GroupSponsor"
- name: "BillingAccountStatus"
  description: "Lifecycle state of a billing account."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Collections"
  - name: "Closed"
- name: "DeliveryMethod"
  description: "Method used to deliver invoices and statements."
  data:
  - name: "Email"
  - name: "PostalMail"
  - name: "Portal"
- name: "BillingChannel"
  description: "Channel through which premium is billed and collected."
  data:
  - name: "DirectBill"
  - name: "AgencyBill"
  - name: "ListBill"
- name: "BillingFrequency"
  description: "Frequency at which premium is billed."
  data:
  - name: "Monthly"
  - name: "Quarterly"
  - name: "SemiAnnual"
  - name: "Annual"
- name: "ProrationMethod"
  description: "Method used to prorate charges for partial periods."
  data:
  - name: "DailyProration"
  - name: "ExactDays"
  - name: "HalfMonthConvention"
  - name: "None"
- name: "BillingCycle"
  description: "Cycle designation used to group accounts for bill runs."
  data:
  - name: "CycleA"
  - name: "CycleB"
  - name: "CycleC"
  - name: "OffCycle"
- name: "BillRunStatus"
  description: "Processing status of a bill run."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
  - name: "CompletedWithErrors"
  - name: "Cancelled"
- name: "BillRunResult"
  description: "Outcome of evaluating an account during a bill run."
  data:
  - name: "Success"
  - name: "Warning"
  - name: "Error"
  - name: "Skipped"
- name: "InvoiceStatus"
  description: "Lifecycle state of an invoice."
  data:
  - name: "Draft"
  - name: "Issued"
  - name: "PartiallyPaid"
  - name: "Paid"
  - name: "PastDue"
  - name: "Cancelled"
  - name: "WrittenOff"
- name: "ChargeType"
  description: "Classification of a billed line item on an invoice."
  data:
  - name: "BasePremium"
  - name: "Endorsement"
  - name: "PolicyFee"
  - name: "ServiceFee"
  - name: "Surcharge"
  - name: "Discount"
  - name: "Adjustment"
- name: "ChargeTiming"
  description: "Timing context associated with the billed charge."
  data:
  - name: "Upfront"
  - name: "Installment"
  - name: "MidTerm"
  - name: "Renewal"
- name: "TaxTreatment"
  description: "Tax applicability and handling for a line item."
  data:
  - name: "Taxable"
  - name: "Exempt"
  - name: "OutOfScope"
- name: "TaxType"
  description: "Type of tax applied to insurance premiums."
  data:
  - name: "StatePremiumTax"
  - name: "FederalExcise"
  - name: "StampDuty"
  - name: "MunicipalSurcharge"
- name: "StatementStatus"
  description: "Lifecycle state of a statement."
  data:
  - name: "Draft"
  - name: "Issued"
  - name: "Paid"
  - name: "PastDue"
- name: "PaymentMethodType"
  description: "Type of payment instrument used to remit funds."
  data:
  - name: "ACH"
  - name: "CreditCard"
  - name: "DebitCard"
  - name: "Wire"
  - name: "Check"
  - name: "Cash"
- name: "PaymentStatus"
  description: "Settlement status of a recorded payment."
  data:
  - name: "Pending"
  - name: "Settled"
  - name: "PartiallySettled"
  - name: "Returned"
  - name: "Cancelled"
- name: "PaymentMethodStatus"
  description: "Usability and authorization status of a stored payment method."
  data:
  - name: "Active"
  - name: "Expired"
  - name: "Revoked"
  - name: "Suspended"
- name: "AllocationTargetType"
  description: "Type of item to which payment is allocated."
  data:
  - name: "Invoice"
  - name: "InvoiceLine"
  - name: "Adjustment"
- name: "AdjustmentType"
  description: "Financial direction of an adjustment."
  data:
  - name: "Credit"
  - name: "Debit"
- name: "AdjustmentReason"
  description: "Business rationale for posting an adjustment."
  data:
  - name: "PolicyCancellation"
  - name: "MidTermChange"
  - name: "Rounding"
  - name: "Goodwill"
  - name: "Correction"
- name: "AdjustmentStatus"
  description: "Approval and posting status of an adjustment."
  data:
  - name: "Draft"
  - name: "Approved"
  - name: "Posted"
  - name: "Rejected"
- name: "RefundStatus"
  description: "Processing status of a refund."
  data:
  - name: "Requested"
  - name: "Approved"
  - name: "Issued"
  - name: "Cancelled"
- name: "RefundReason"
  description: "Reason for returning funds to the payer."
  data:
  - name: "Overpayment"
  - name: "PolicyCancellation"
  - name: "DuplicatePayment"
  - name: "Correction"
- name: "WriteOffReason"
  description: "Reason for writing off a balance as uncollectible."
  data:
  - name: "Bankruptcy"
  - name: "Deceased"
  - name: "DisputedUnresolved"
  - name: "SmallBalance"
- name: "ApprovalStatus"
  description: "Authorization state for actions requiring review."
  data:
  - name: "Requested"
  - name: "Approved"
  - name: "Rejected"
- name: "DunningStatus"
  description: "Overall status of a dunning case."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Closed"
- name: "DunningStrategy"
  description: "Strategy defining sequencing of dunning actions."
  data:
  - name: "Standard"
  - name: "Accelerated"
  - name: "HighRisk"
  - name: "Gentle"
- name: "DunningActionType"
  description: "Type of collection action executed during dunning."
  data:
  - name: "EmailNotice"
  - name: "SMSNotice"
  - name: "Letter"
  - name: "PhoneCall"
  - name: "SuspendPolicy"
  - name: "CancelPolicy"
  - name: "SendToCollections"
- name: "DunningOutcome"
  description: "Result of a dunning action."
  data:
  - name: "Sent"
  - name: "Reached"
  - name: "NoResponse"
  - name: "PromiseToPay"
  - name: "Paid"
  - name: "Escalated"
valueObjects:
- name: "Money"
  description: "Monetary amount paired with an ISO currency code."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address used for billing and correspondence."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "Period"
  description: "Time interval with a start and end date, inclusive of start and exclusive\
    \ of end."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
