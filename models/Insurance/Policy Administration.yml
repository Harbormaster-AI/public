---
metadata:
  name: "HCIDL Policy Administration Capabilities Model"
  description: "Canonical capability model for insurance policy administration covering\
    \ product setup, policy lifecycle, coverages, endorsements, rating, documents,\
    \ and compliance."
  version: "1.0.0"
  industry: "Insurance"
  category: "Insurance"
  type: "Capability"
  domain: "Policy Administration"
entities:
- name: "Insurer"
  description: "Licensed insurance carrier responsible for issuing and servicing policies."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "domicileCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
  - name: "distributionChannels"
    type: "DistributionChannel"
    multiplicity: "OneToMany"
  - name: "intermediaries"
    type: "Intermediary"
    multiplicity: "OneToMany"
- name: "DistributionChannel"
  description: "Route to market used to distribute insurance products and policies."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "DistributionChannelType"
  relations:
  - name: "insurer"
    type: "Insurer"
    multiplicity: "ManyToOne"
  - name: "intermediaries"
    type: "Intermediary"
    multiplicity: "OneToMany"
- name: "Intermediary"
  description: "Licensed producer or brokerage entity that places business with the\
    \ insurer."
  data:
  - name: "name"
    type: "String"
  - name: "licenseNumber"
    type: "String"
  - name: "intermediaryType"
    type: "IntermediaryType"
  relations:
  - name: "insurer"
    type: "Insurer"
    multiplicity: "ManyToOne"
  - name: "distributionChannel"
    type: "DistributionChannel"
    multiplicity: "ManyToOne"
  - name: "policies"
    type: "Policy"
    multiplicity: "OneToMany"
- name: "Product"
  description: "Configurable insurance offering defining terms, eligibility, and coverages."
  data:
  - name: "name"
    type: "String"
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
  - name: "termType"
    type: "PolicyTermType"
  relations:
  - name: "insurer"
    type: "Insurer"
    multiplicity: "ManyToOne"
  - name: "coverageDefinitions"
    type: "CoverageDefinition"
    multiplicity: "OneToMany"
  - name: "ratePlans"
    type: "RatePlan"
    multiplicity: "ManyToMany"
- name: "CoverageDefinition"
  description: "Template describing a standard coverage available within a product."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "coverageType"
    type: "CoverageType"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "allowedPerils"
    type: "PerilDefinition"
    multiplicity: "ManyToMany"
- name: "PerilDefinition"
  description: "Defined cause of loss used to determine covered events and exclusions."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "coverageDefinitions"
    type: "CoverageDefinition"
    multiplicity: "ManyToMany"
- name: "Policyholder"
  description: "Party assuming contractual responsibility for premium and policy obligations."
  data:
  - name: "name"
    type: "String"
  - name: "partyType"
    type: "PartyType"
  - name: "taxIdentifier"
    type: "String"
  - name: "primaryAddress"
    type: "Address"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  relations:
  - name: "policies"
    type: "Policy"
    multiplicity: "OneToMany"
- name: "Policy"
  description: "Issued insurance contract composed of terms, coverages, and conditions."
  data:
  - name: "policyNumber"
    type: "String"
  - name: "status"
    type: "PolicyStatus"
  - name: "term"
    type: "DateRange"
  - name: "totalPremium"
    type: "Money"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "policyholder"
    type: "Policyholder"
    multiplicity: "ManyToOne"
  - name: "intermediary"
    type: "Intermediary"
    multiplicity: "ManyToOne"
  - name: "insuredAssets"
    type: "InsuredAsset"
    multiplicity: "OneToMany"
  - name: "policyVersions"
    type: "PolicyVersion"
    multiplicity: "OneToMany"
  - name: "coverages"
    type: "Coverage"
    multiplicity: "OneToMany"
  - name: "interestedParties"
    type: "InterestedParty"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "PolicyTransaction"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "PolicyDocument"
    multiplicity: "OneToMany"
  - name: "paymentPlan"
    type: "PaymentPlan"
    multiplicity: "ManyToOne"
  - name: "complianceChecks"
    type: "ComplianceCheck"
    multiplicity: "OneToMany"
  - name: "premiumAudits"
    type: "PremiumAudit"
    multiplicity: "OneToMany"
- name: "PolicyVersion"
  description: "Snapshot of a policy at a specific point in time used for issuance\
    \ and servicing."
  data:
  - name: "versionNumber"
    type: "Integer"
  - name: "status"
    type: "PolicyVersionStatus"
  - name: "issuedDate"
    type: "Date"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "coverages"
    type: "Coverage"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "PolicyDocument"
    multiplicity: "OneToMany"
- name: "InsuredAsset"
  description: "Item, person, or interest that is the subject of insurance under the\
    \ policy."
  data:
  - name: "description"
    type: "String"
  - name: "assetType"
    type: "InsuredAssetType"
  - name: "serialOrUniqueRef"
    type: "String"
  - name: "riskAddress"
    type: "Address"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "coverages"
    type: "Coverage"
    multiplicity: "OneToMany"
  - name: "riskExposures"
    type: "RiskExposure"
    multiplicity: "OneToMany"
- name: "Coverage"
  description: "Bound coverage instance specifying limits, deductibles, and insured\
    \ interests."
  data:
  - name: "coverageCode"
    type: "String"
  - name: "status"
    type: "CoverageStatus"
  - name: "limitAmount"
    type: "Money"
  - name: "deductibleAmount"
    type: "Money"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "policyVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
  - name: "coverageDefinition"
    type: "CoverageDefinition"
    multiplicity: "ManyToOne"
  - name: "insuredAsset"
    type: "InsuredAsset"
    multiplicity: "ManyToOne"
  - name: "endorsements"
    type: "Endorsement"
    multiplicity: "OneToMany"
- name: "Endorsement"
  description: "Change request that modifies terms or data on an active policy or\
    \ coverage."
  data:
  - name: "endorsementNumber"
    type: "String"
  - name: "endorsementType"
    type: "EndorsementType"
  - name: "effectiveDate"
    type: "Date"
  - name: "status"
    type: "EndorsementStatus"
  - name: "description"
    type: "String"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "coverageChanges"
    type: "CoverageChange"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "PolicyDocument"
    multiplicity: "OneToMany"
- name: "CoverageChange"
  description: "Atomic modification applied to a coverage as part of an endorsement."
  data:
  - name: "changeType"
    type: "CoverageChangeType"
  - name: "attributeName"
    type: "String"
  - name: "previousValue"
    type: "String"
  - name: "newValue"
    type: "String"
  relations:
  - name: "endorsement"
    type: "Endorsement"
    multiplicity: "ManyToOne"
  - name: "coverage"
    type: "Coverage"
    multiplicity: "ManyToOne"
- name: "PolicyTransaction"
  description: "Business event representing a change to policy state and premium."
  data:
  - name: "transactionNumber"
    type: "String"
  - name: "transactionType"
    type: "PolicyTransactionType"
  - name: "effectiveDate"
    type: "Date"
  - name: "status"
    type: "PolicyTransactionStatus"
  - name: "reason"
    type: "String"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "endorsements"
    type: "Endorsement"
    multiplicity: "OneToMany"
  - name: "premiumCalculation"
    type: "PremiumCalculation"
    multiplicity: "OneToOne"
  - name: "documents"
    type: "PolicyDocument"
    multiplicity: "OneToMany"
  - name: "complianceChecks"
    type: "ComplianceCheck"
    multiplicity: "OneToMany"
- name: "PremiumCalculation"
  description: "Result of rating logic producing premium and related charges for a\
    \ transaction."
  data:
  - name: "ratingDate"
    type: "Date"
  - name: "ratePlanName"
    type: "String"
  - name: "writtenPremium"
    type: "Money"
  - name: "earnedPremium"
    type: "Money"
  - name: "fees"
    type: "Money"
  - name: "taxes"
    type: "Money"
  relations:
  - name: "policyTransaction"
    type: "PolicyTransaction"
    multiplicity: "OneToOne"
  - name: "components"
    type: "RatingComponent"
    multiplicity: "OneToMany"
  - name: "ratePlan"
    type: "RatePlan"
    multiplicity: "ManyToOne"
- name: "RatingComponent"
  description: "Detailed premium element derived from rating basis, factors, and limits."
  data:
  - name: "name"
    type: "String"
  - name: "ratingBasis"
    type: "RatingBasis"
  - name: "factor"
    type: "Decimal"
  - name: "baseAmount"
    type: "Money"
  - name: "resultingAmount"
    type: "Money"
  relations:
  - name: "premiumCalculation"
    type: "PremiumCalculation"
    multiplicity: "ManyToOne"
  - name: "coverage"
    type: "Coverage"
    multiplicity: "ManyToOne"
- name: "RatePlan"
  description: "Versioned set of rules and tables governing premium calculation."
  data:
  - name: "name"
    type: "String"
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
  - name: "effectivePeriod"
    type: "DateRange"
  - name: "jurisdiction"
    type: "String"
  relations:
  - name: "products"
    type: "Product"
    multiplicity: "ManyToMany"
  - name: "premiumCalculations"
    type: "PremiumCalculation"
    multiplicity: "OneToMany"
- name: "PaymentPlan"
  description: "Installment arrangement defining how premium is billed over the term."
  data:
  - name: "planName"
    type: "String"
  - name: "paymentMode"
    type: "PaymentMode"
  - name: "numberOfInstallments"
    type: "Integer"
  - name: "downPaymentPercentage"
    type: "Decimal"
  relations:
  - name: "policies"
    type: "Policy"
    multiplicity: "OneToMany"
- name: "InterestedParty"
  description: "Non-policyholder party with a financial or legal interest in the policy."
  data:
  - name: "name"
    type: "String"
  - name: "role"
    type: "InterestedPartyRole"
  - name: "address"
    type: "Address"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
- name: "PolicyDocument"
  description: "Formal document generated during policy lifecycle for regulatory or\
    \ customer use."
  data:
  - name: "documentNumber"
    type: "String"
  - name: "documentType"
    type: "PolicyDocumentType"
  - name: "issuedDate"
    type: "Date"
  - name: "reference"
    type: "DocumentReference"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "policyVersion"
    type: "PolicyVersion"
    multiplicity: "ManyToOne"
  - name: "policyTransaction"
    type: "PolicyTransaction"
    multiplicity: "ManyToOne"
  - name: "endorsement"
    type: "Endorsement"
    multiplicity: "ManyToOne"
- name: "ComplianceCheck"
  description: "Automated or manual validation ensuring policy and transaction conformance."
  data:
  - name: "checkType"
    type: "ComplianceCheckType"
  - name: "status"
    type: "ComplianceStatus"
  - name: "runDate"
    type: "Date"
  - name: "details"
    type: "String"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "policyTransaction"
    type: "PolicyTransaction"
    multiplicity: "ManyToOne"
  - name: "policyholder"
    type: "Policyholder"
    multiplicity: "ManyToOne"
- name: "RiskExposure"
  description: "Quantified measure of hazard or exposure used for underwriting and\
    \ rating."
  data:
  - name: "exposureType"
    type: "ExposureType"
  - name: "exposureValue"
    type: "Decimal"
  - name: "unitOfMeasure"
    type: "String"
  - name: "effectivePeriod"
    type: "DateRange"
  relations:
  - name: "insuredAsset"
    type: "InsuredAsset"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
- name: "PremiumAudit"
  description: "Post-issuance assessment to reconcile estimated exposures to actuals."
  data:
  - name: "auditType"
    type: "PremiumAuditType"
  - name: "status"
    type: "PremiumAuditStatus"
  - name: "auditPeriod"
    type: "DateRange"
  - name: "estimatedExposure"
    type: "Decimal"
  - name: "finalExposure"
    type: "Decimal"
  - name: "notes"
    type: "String"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "PolicyDocument"
    multiplicity: "OneToMany"
enums:
- name: "DistributionChannelType"
  description: "Categorization of the route through which insurance products are sold."
  data:
  - name: "Agency"
  - name: "Broker"
  - name: "Direct"
  - name: "Bancassurance"
  - name: "Affinity"
  - name: "Wholesale"
- name: "IntermediaryType"
  description: "Type of licensed entity authorized to place or service policies."
  data:
  - name: "Agent"
  - name: "Broker"
  - name: "MGA"
  - name: "Producer"
- name: "PartyType"
  description: "Legal nature of a party participating in a policy."
  data:
  - name: "Individual"
  - name: "Organization"
- name: "LineOfBusiness"
  description: "Insurance line classification used for product and rate governance."
  data:
  - name: "CommercialProperty"
  - name: "GeneralLiability"
  - name: "WorkersCompensation"
  - name: "ProfessionalLiability"
  - name: "Homeowners"
  - name: "Marine"
  - name: "Life"
  - name: "Health"
  - name: "Travel"
- name: "PolicyTermType"
  description: "Standard duration pattern of a policy term."
  data:
  - name: "Annual"
  - name: "SemiAnnual"
  - name: "Quarterly"
  - name: "Monthly"
  - name: "ShortTerm"
  - name: "MultiYear"
- name: "CoverageType"
  description: "High-level classification of insurance protection granted."
  data:
  - name: "PropertyDamage"
  - name: "Liability"
  - name: "PersonalAccident"
  - name: "BusinessInterruption"
  - name: "Theft"
  - name: "Catastrophe"
  - name: "LegalExpenses"
  - name: "Cyber"
- name: "CoverageStatus"
  description: "Operational state of a bound coverage component."
  data:
