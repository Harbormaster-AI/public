  - name: "Rated"
  - name: "Approved"
  - name: "Issued"
  - name: "Voided"
- name: "PaymentMode"
  description: "Frequency by which premium installments are arranged."
  data:
  - name: "PayInFull"
  - name: "SemiAnnual"
  - name: "Quarterly"
  - name: "Monthly"
  - name: "TwoPay"
  - name: "Custom"
- name: "InterestedPartyRole"
  description: "Nature of stakeholder interest in a policy."
  data:
  - name: "Mortgagee"
  - name: "Lienholder"
  - name: "AdditionalInsured"
  - name: "LossPayee"
  - name: "CertificateHolder"
  - name: "AdditionalInterest"
- name: "PolicyDocumentType"
  description: "Type of document generated or stored for a policy."
  data:
  - name: "Declarations"
  - name: "Endorsement"
  - name: "ScheduleOfCoverages"
  - name: "CancellationNotice"
  - name: "RenewalOffer"
  - name: "CertificateOfInsurance"
  - name: "PolicyContract"
  - name: "BillingNotice"
- name: "ComplianceCheckType"
  description: "Kind of validation executed to ensure regulatory and operational compliance."
  data:
  - name: "SanctionsScreening"
  - name: "LicensingValidation"
  - name: "Eligibility"
  - name: "FormSelection"
  - name: "StateRegulation"
  - name: "FraudScreening"
  - name: "DataCompleteness"
- name: "ComplianceStatus"
  description: "Result of a compliance validation."
  data:
  - name: "Pending"
  - name: "Passed"
  - name: "Failed"
  - name: "Waived"
- name: "InsuredAssetType"
  description: "Category of risk object insured under a policy."
  data:
  - name: "Building"
  - name: "Contents"
  - name: "Equipment"
  - name: "Inventory"
  - name: "Vessel"
  - name: "Aircraft"
  - name: "FineArt"
  - name: "Person"
  - name: "BusinessLocation"
  - name: "CyberAsset"
- name: "ExposureType"
  description: "Metric used to quantify exposure for underwriting or rating."
  data:
  - name: "Headcount"
  - name: "Payroll"
  - name: "Revenue"
  - name: "SquareFootage"
  - name: "ProductionVolume"
  - name: "DaysOfOperation"
  - name: "NumberOfLocations"
- name: "RatingBasis"
  description: "Method by which a rating component is derived."
  data:
  - name: "Flat"
  - name: "PerUnit"
  - name: "PerExposure"
  - name: "PercentageOfPremium"
  - name: "PercentageOfLimit"
  - name: "Tiered"
  - name: "MinimumPremium"
- name: "PolicyVersionStatus"
  description: "State of a versioned snapshot of the policy."
  data:
  - name: "Draft"
  - name: "Current"
  - name: "Superseded"
  - name: "Archived"
- name: "PremiumAuditType"
  description: "Method employed to determine final exposure and premium."
  data:
  - name: "Voluntary"
  - name: "Physical"
  - name: "Estimated"
  - name: "Final"
- name: "PremiumAuditStatus"
  description: "Progress state of a premium audit."
  data:
  - name: "Scheduled"
  - name: "InProgress"
  - name: "Completed"
  - name: "Disputed"
  - name: "Closed"
valueObjects:
- name: "Money"
  description: "Monetary amount represented with a numeric value and currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address used for correspondence and risk locations."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "DateRange"
  description: "Inclusive date interval with a defined start and end."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "DocumentReference"
  description: "Reference to a stored document artifact and associated metadata."
  data:
  - name: "uri"
    type: "String"
  - name: "fileName"
    type: "String"
  - name: "mimeType"
    type: "String"
  - name: "sizeBytes"
    type: "Integer"
