  - name: "Active"
  - name: "Suspended"
  - name: "Terminated"
  - name: "Expired"
- name: "EndorsementType"
  description: "Nature of a change applied to an in-force policy."
  data:
  - name: "CoverageAddition"
  - name: "CoverageRemoval"
  - name: "LimitChange"
  - name: "DeductibleChange"
  - name: "NamedInsuredChange"
  - name: "AddressChange"
  - name: "InsuredAssetChange"
  - name: "ExclusionAdded"
  - name: "ConditionAdded"
  - name: "Other"
- name: "EndorsementStatus"
  description: "Processing state of a policy endorsement."
  data:
  - name: "Draft"
  - name: "Proposed"
  - name: "Approved"
  - name: "Issued"
  - name: "Withdrawn"
- name: "CoverageChangeType"
  description: "Specific operation performed on a coverage attribute."
  data:
  - name: "Add"
  - name: "Remove"
  - name: "UpdateLimit"
  - name: "UpdateDeductible"
  - name: "UpdateInsuredAsset"
  - name: "AddExclusion"
  - name: "RemoveExclusion"
  - name: "UpdateCondition"
  - name: "UpdateNamedInsured"
  - name: "UpdateAddress"
  - name: "OtherChange"
- name: "PolicyStatus"
  description: "Lifecycle state of a policy."
  data:
  - name: "Draft"
  - name: "Quoted"
  - name: "Bound"
  - name: "Active"
  - name: "PendingCancellation"
  - name: "Cancelled"
  - name: "Lapsed"
  - name: "Reinstated"
  - name: "Expired"
  - name: "NonRenewed"
  - name: "PendingRenewal"
- name: "PolicyTransactionType"
  description: "Classification of a business event that changes policy terms or premium."
  data:
  - name: "NewBusiness"
  - name: "Endorsement"
  - name: "Renewal"
  - name: "Cancellation"
  - name: "Reinstatement"
  - name: "Rewrite"
  - name: "OutOfSequenceEndorsement"
  - name: "Audit"
- name: "PolicyTransactionStatus"
  description: "Processing status of a policy transaction."
  data:
