---
metadata:
  name: "Underwriting"
  description: "Capabilities model for insurance underwriting, covering submission\
    \ intake, risk evaluation, pricing, decisioning, and bind workflows."
  version: "1.0.0"
  industry: "Insurance"
  category: "Insurance"
  type: "Capability"
  domain: "Underwriting"
entities:
- name: "UnderwritingUnit"
  description: "Organizational group responsible for underwriting operations within\
    \ a defined scope, region, or product portfolio."
  data:
  - name: "name"
    type: "String"
  - name: "operatingRegion"
    type: "String"
  - name: "timezone"
    type: "String"
  relations:
  - name: "underwriters"
    type: "Underwriter"
    multiplicity: "OneToMany"
  - name: "appetiteStatements"
    type: "AppetiteStatement"
    multiplicity: "OneToMany"
  - name: "authorityProfiles"
    type: "AuthorityProfile"
    multiplicity: "OneToMany"
  - name: "productLines"
    type: "ProductLine"
    multiplicity: "OneToMany"
- name: "ProductLine"
  description: "Defined line of business with specific underwriting guidelines, rates,\
    \ and coverage constructs."
  data:
  - name: "name"
    type: "String"
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
  relations:
  - name: "underwritingUnit"
    type: "UnderwritingUnit"
    multiplicity: "ManyToOne"
  - name: "submissions"
    type: "Submission"
    multiplicity: "OneToMany"
  - name: "ratingModels"
    type: "RatingModel"
    multiplicity: "OneToMany"
- name: "Underwriter"
  description: "Licensed underwriting professional who evaluates risk, sets terms,\
    \ and issues decisions within delegated authority."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "role"
    type: "UnderwriterRole"
  - name: "email"
    type: "String"
  relations:
  - name: "underwritingUnit"
    type: "UnderwritingUnit"
    multiplicity: "ManyToOne"
  - name: "authorityProfile"
    type: "AuthorityProfile"
    multiplicity: "ManyToOne"
  - name: "submissions"
    type: "Submission"
    multiplicity: "OneToMany"
  - name: "referrals"
    type: "Referral"
    multiplicity: "OneToMany"
- name: "Broker"
  description: "Intermediary representing the applicant, submitting information and\
    \ negotiating terms with the insurer."
  data:
  - name: "name"
    type: "String"
  - name: "brokerType"
    type: "BrokerType"
  - name: "licenseJurisdiction"
    type: "String"
  - name: "contactInfo"
    type: "ContactInfo"
  - name: "firmAddress"
    type: "Address"
  relations:
  - name: "submissions"
    type: "Submission"
    multiplicity: "OneToMany"
- name: "Applicant"
  description: "Individual or organization seeking insurance coverage."
  data:
  - name: "legalName"
    type: "String"
  - name: "organizationType"
    type: "OrganizationType"
  - name: "yearsInBusiness"
    type: "Integer"
  - name: "mailingAddress"
    type: "Address"
  - name: "primaryContact"
    type: "ContactInfo"
  relations:
  - name: "submissions"
    type: "Submission"
    multiplicity: "OneToMany"
  - name: "risks"
    type: "RiskItem"
    multiplicity: "OneToMany"
- name: "Submission"
  description: "Core underwriting work item containing applicant details, exposures,\
    \ requested coverages, and processing status."
  data:
  - name: "submissionNumber"
    type: "String"
  - name: "receivedDate"
    type: "Date"
  - name: "status"
    type: "SubmissionStatus"
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
  - name: "effectiveDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "channel"
    type: "SubmissionChannel"
  relations:
  - name: "applicant"
    type: "Applicant"
    multiplicity: "ManyToOne"
  - name: "broker"
    type: "Broker"
    multiplicity: "ManyToOne"
  - name: "underwriter"
    type: "Underwriter"
    multiplicity: "ManyToOne"
  - name: "productLine"
    type: "ProductLine"
    multiplicity: "ManyToOne"
  - name: "risks"
    type: "RiskItem"
    multiplicity: "OneToMany"
  - name: "coverages"
    type: "Coverage"
    multiplicity: "OneToMany"
  - name: "questionnaires"
    type: "Questionnaire"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "quotes"
    type: "Quote"
    multiplicity: "OneToMany"
  - name: "referrals"
    type: "Referral"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
  - name: "inspections"
    type: "InspectionOrder"
    multiplicity: "OneToMany"
  - name: "reinsuranceRequests"
    type: "ReinsuranceRequest"
    multiplicity: "OneToMany"
  - name: "scorecards"
    type: "Scorecard"
    multiplicity: "OneToMany"
  - name: "pricingWorksheets"
    type: "PricingWorksheet"
    multiplicity: "OneToMany"
- name: "RiskItem"
  description: "Specific unit of exposure or location being underwritten and priced."
  data:
  - name: "name"
    type: "String"
  - name: "riskType"
    type: "RiskType"
  - name: "location"
    type: "Address"
  - name: "priorLossesCount"
    type: "Integer"
  - name: "hasHighHazardOperations"
    type: "Boolean"
  relations:
  - name: "applicant"
    type: "Applicant"
    multiplicity: "ManyToOne"
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
  - name: "exposures"
    type: "Exposure"
    multiplicity: "OneToMany"
  - name: "hazards"
    type: "Hazard"
    multiplicity: "ManyToMany"
  - name: "inspections"
    type: "InspectionOrder"
    multiplicity: "OneToMany"
  - name: "ratingFactors"
    type: "RatingFactor"
    multiplicity: "OneToMany"
  - name: "scorecards"
    type: "Scorecard"
    multiplicity: "OneToMany"
  - name: "assessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
- name: "Exposure"
  description: "Quantified basis used for rating and underwriting, such as revenue,\
    \ payroll, or area."
  data:
  - name: "exposureType"
    type: "ExposureType"
  - name: "basis"
    type: "String"
  - name: "units"
    type: "Decimal"
  - name: "reportingFrequency"
    type: "ReportingFrequency"
  relations:
  - name: "riskItem"
    type: "RiskItem"
    multiplicity: "ManyToOne"
- name: "Hazard"
  description: "Condition that increases the likelihood or severity of loss associated\
    \ with a risk."
  data:
  - name: "description"
    type: "String"
  - name: "hazardType"
    type: "HazardType"
  - name: "severity"
    type: "HazardSeverity"
  - name: "controlMeasures"
    type: "String"
  relations:
  - name: "riskItems"
    type: "RiskItem"
    multiplicity: "ManyToMany"
- name: "Questionnaire"
  description: "Structured information request supporting risk assessment and eligibility\
    \ rules."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "sectionCount"
    type: "Integer"
  relations:
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
  - name: "questions"
    type: "Question"
    multiplicity: "OneToMany"
  - name: "responses"
    type: "Response"
    multiplicity: "OneToMany"
- name: "Question"
  description: "Individual query within a questionnaire, used to gather underwriting\
    \ information."
  data:
  - name: "text"
    type: "String"
  - name: "responseType"
    type: "ResponseType"
  - name: "required"
    type: "Boolean"
  - name: "helpText"
    type: "String"
  relations:
  - name: "questionnaire"
    type: "Questionnaire"
    multiplicity: "ManyToOne"
- name: "Response"
  description: "Recorded answer to a specific underwriting question."
  data:
  - name: "answer"
    type: "String"
  - name: "answeredDate"
    type: "Date"
  - name: "isAffirmative"
    type: "Boolean"
  relations:
  - name: "question"
    type: "Question"
    multiplicity: "ManyToOne"
  - name: "questionnaire"
    type: "Questionnaire"
    multiplicity: "ManyToOne"
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
  - name: "riskItem"
    type: "RiskItem"
    multiplicity: "ManyToOne"
- name: "RatingModel"
  description: "Defined pricing construct or algorithm applied to determine indicated\
    \ premium."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "method"
    type: "PricingMethod"
  - name: "description"
    type: "String"
  relations:
  - name: "productLine"
    type: "ProductLine"
    multiplicity: "ManyToOne"
  - name: "factors"
    type: "RatingFactor"
    multiplicity: "OneToMany"
- name: "RatingFactor"
  description: "Specific rating element or modifier contributing to premium calculation."
  data:
  - name: "name"
    type: "String"
  - name: "factorType"
    type: "FactorType"
  - name: "value"
    type: "Decimal"
  - name: "source"
    type: "FactorSource"
  relations:
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
  - name: "riskItem"
    type: "RiskItem"
    multiplicity: "ManyToOne"
  - name: "ratingModel"
    type: "RatingModel"
    multiplicity: "ManyToOne"
- name: "Scorecard"
  description: "Aggregated scoring result summarizing underwriting view of risk quality."
  data:
  - name: "name"
    type: "String"
  - name: "totalScore"
    type: "Integer"
  - name: "scoreBand"
    type: "ScoreBand"
  - name: "rationale"
    type: "String"
  relations:
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
  - name: "riskItem"
    type: "RiskItem"
    multiplicity: "ManyToOne"
  - name: "factors"
    type: "RatingFactor"
    multiplicity: "OneToMany"
- name: "RiskAssessment"
  description: "Underwriter’s documented evaluation of a risk, citing key drivers\
    \ and outcome."
  data:
  - name: "assessmentDate"
    type: "Date"
  - name: "outcome"
    type: "AssessmentOutcome"
  - name: "comments"
    type: "String"
  relations:
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
  - name: "riskItem"
    type: "RiskItem"
    multiplicity: "ManyToOne"
  - name: "scorecard"
    type: "Scorecard"
    multiplicity: "ManyToOne"
- name: "InspectionOrder"
  description: "Request to an inspection vendor to assess and verify risk characteristics."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "scheduledDate"
    type: "Date"
  - name: "status"
    type: "InspectionStatus"
  - name: "vendorName"
    type: "String"
  relations:
  - name: "riskItem"
    type: "RiskItem"
    multiplicity: "ManyToOne"
  - name: "reports"
    type: "InspectionReport"
    multiplicity: "OneToMany"
- name: "InspectionReport"
  description: "Findings and recommendations resulting from a completed inspection."
  data:
  - name: "reportNumber"
    type: "String"
  - name: "findingsSummary"
    type: "String"
  - name: "deficiencyCount"
    type: "Integer"
  - name: "recommendation"
    type: "String"
  relations:
  - name: "inspectionOrder"
    type: "InspectionOrder"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "Coverage"
  description: "Requested or offered insurance protection with associated limits and\
    \ terms."
  data:
  - name: "coverageCode"
    type: "String"
  - name: "coverageType"
    type: "CoverageType"
  - name: "limit"
    type: "Money"
  - name: "deductible"
    type: "Money"
  - name: "coinsurance"
    type: "Percentage"
  - name: "formNumber"
    type: "String"
  relations:
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
  - name: "quotes"
    type: "Quote"
    multiplicity: "ManyToMany"
- name: "Condition"
  description: "Subjectivity, warranty, or other term that must be satisfied or is\
    \ imposed on coverage."
  data:
  - name: "description"
    type: "String"
  - name: "conditionType"
    type: "ConditionType"
  - name: "isPrecedent"
    type: "Boolean"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
- name: "Quote"
  description: "Formal offer of coverage, limits, and premium for a submission."
  data:
  - name: "quoteNumber"
    type: "String"
  - name: "premium"
    type: "Money"
  - name: "fees"
    type: "Money"
  - name: "taxes"
    type: "Money"
  - name: "validThrough"
    type: "Date"
  - name: "quoteStatus"
    type: "QuoteStatus"
  - name: "version"
    type: "Integer"
  relations:
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
  - name: "coverages"
    type: "Coverage"
    multiplicity: "ManyToMany"
  - name: "conditions"
    type: "Condition"
    multiplicity: "OneToMany"
  - name: "bindOrder"
    type: "BindOrder"
    multiplicity: "OneToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "BindOrder"
  description: "Instruction to bind coverage according to an accepted quote and terms."
  data:
  - name: "bindOrderNumber"
    type: "String"
  - name: "requestedDate"
    type: "Date"
  - name: "decision"
    type: "BindDecision"
  - name: "boundDate"
    type: "Date"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "OneToOne"
  - name: "underwriter"
    type: "Underwriter"
    multiplicity: "ManyToOne"
  - name: "policyIssuanceRequest"
    type: "PolicyIssuanceRequest"
    multiplicity: "OneToOne"
- name: "PolicyIssuanceRequest"
  description: "Request to create a policy record downstream based on a bound order."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "status"
    type: "PolicyIssuanceStatus"
  - name: "issueDate"
    type: "Date"
  relations:
  - name: "bindOrder"
    type: "BindOrder"
    multiplicity: "OneToOne"
- name: "Document"
  description: "Artifact supporting underwriting, such as applications, loss runs,\
    \ and inspection results."
  data:
  - name: "documentType"
    type: "DocumentType"
  - name: "fileName"
    type: "String"
  - name: "receivedDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
  - name: "inspectionReport"
    type: "InspectionReport"
    multiplicity: "ManyToOne"
- name: "Note"
  description: "Internal commentary or communication related to underwriting activity."
  data:
  - name: "content"
    type: "String"
  - name: "authorName"
    type: "String"
  - name: "createdDate"
    type: "Date"
  - name: "visibility"
    type: "String"
  relations:
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
  - name: "riskItem"
    type: "RiskItem"
    multiplicity: "ManyToOne"
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
- name: "AuthorityProfile"
  description: "Delegation of underwriting authority defining monetary and decision\
    \ limits."
  data:
  - name: "name"
    type: "String"
  - name: "authorityLevel"
    type: "AuthorityLevel"
  - name: "maxWrittenPremium"
    type: "Money"
  - name: "maxSingleRiskLimit"
    type: "Money"
  - name: "referralThreshold"
    type: "Money"
  relations:
  - name: "underwritingUnit"
    type: "UnderwritingUnit"
    multiplicity: "ManyToOne"
  - name: "underwriters"
    type: "Underwriter"
    multiplicity: "OneToMany"
- name: "AppetiteStatement"
  description: "Guidance describing preferred, acceptable, and declined risks for\
    \ a product or segment."
  data:
  - name: "narrative"
    type: "String"
  - name: "appetiteLevel"
    type: "AppetiteLevel"
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
  - name: "geography"
    type: "String"
  relations:
  - name: "underwritingUnit"
    type: "UnderwritingUnit"
    multiplicity: "ManyToOne"
- name: "AuditEvent"
  description: "Immutable record of significant underwriting actions and changes."
  data:
  - name: "eventType"
    type: "AuditEventType"
  - name: "eventDate"
    type: "Date"
  - name: "userName"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
- name: "ReinsuranceRequest"
  description: "Facultative reinsurance placement request related to a submission\
    \ or risk."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "status"
    type: "ReinsuranceRequestStatus"
  - name: "cededPercentage"
    type: "Percentage"
  - name: "reason"
    type: "String"
  relations:
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
- name: "PricingWorksheet"
  description: "Structured calculation record supporting indicated premium and selected\
    \ pricing."
  data:
  - name: "method"
    type: "PricingMethod"
  - name: "baseRate"
    type: "Decimal"
  - name: "indicatedPremium"
    type: "Money"
  - name: "modeledLossRatio"
    type: "Percentage"
  relations:
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
  - name: "riskItem"
    type: "RiskItem"
    multiplicity: "ManyToOne"
  - name: "ratingModel"
    type: "RatingModel"
    multiplicity: "ManyToOne"
- name: "Referral"
  description: "Escalation event requiring higher-level review due to authority limits\
    \ or risk concerns."
  data:
  - name: "reason"
    type: "String"
  - name: "referralType"
    type: "ReferralType"
  - name: "status"
    type: "ReferralStatus"
  - name: "referredTo"
    type: "String"
  - name: "createdDate"
    type: "Date"
  relations:
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
  - name: "underwriter"
    type: "Underwriter"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "Approval"
  description: "Decision record documenting the outcome of a referral review."
  data:
  - name: "approverName"
    type: "String"
  - name: "approvalStatus"
    type: "ApprovalStatus"
  - name: "approvalDate"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "referral"
    type: "Referral"
    multiplicity: "ManyToOne"
enums:
- name: "UnderwriterRole"
  description: "Role classification for underwriting staff indicating responsibility\
    \ and seniority."
  data:
  - name: "AssistantUnderwriter"
  - name: "Underwriter"
  - name: "SeniorUnderwriter"
  - name: "Manager"
- name: "BrokerType"
  description: "Classification of intermediary organizational model."
  data:
  - name: "Retail"
  - name: "Wholesale"
  - name: "MGA"
- name: "OrganizationType"
  description: "Legal structure of the applicant organization."
  data:
  - name: "Individual"
  - name: "Partnership"
  - name: "Corporation"
  - name: "Nonprofit"
  - name: "Government"
- name: "SubmissionStatus"
  description: "Lifecycle state tracking progress of underwriting work."
  data:
  - name: "Draft"
  - name: "Received"
  - name: "InReview"
  - name: "Referred"
  - name: "Quoted"
  - name: "Declined"
  - name: "Withdrawn"
  - name: "Bound"
  - name: "Lapsed"
- name: "SubmissionChannel"
  description: "Inbound channel through which a submission is received."
  data:
  - name: "BrokerPortal"
  - name: "Email"
  - name: "API"
  - name: "ManualEntry"
  - name: "BatchUpload"
- name: "LineOfBusiness"
  description: "Insurance product family under which the submission is processed."
  data:
  - name: "CommercialProperty"
  - name: "GeneralLiability"
  - name: "WorkersCompensation"
  - name: "ProfessionalLiability"
  - name: "Cyber"
  - name: "Marine"
  - name: "InlandMarine"
  - name: "DirectorsAndOfficers"
- name: "RiskType"
  description: "Category of risk being evaluated."
  data:
  - name: "Property"
  - name: "Liability"
  - name: "Cyber"
  - name: "Marine"
  - name: "Professional"
  - name: "WorkersCompensation"
- name: "HazardType"
  description: "Nature of hazard contributing to potential loss."
  data:
  - name: "Physical"
  - name: "Moral"
  - name: "Legal"
  - name: "Catastrophe"
- name: "HazardSeverity"
  description: "Relative magnitude of hazard impact on loss potential."
  data:
  - name: "Low"
  - name: "Moderate"
  - name: "High"
  - name: "Critical"
- name: "ResponseType"
  description: "Expected format of an answer to an underwriting question."
  data:
  - name: "YesNo"
  - name: "Text"
  - name: "Number"
  - name: "Date"
  - name: "Choice"
- name: "FactorType"
  description: "Classification of rating factor effect on premium."
  data:
  - name: "Relativity"
  - name: "Modifier"
  - name: "Credit"
  - name: "Debit"
  - name: "Surcharge"
- name: "FactorSource"
  description: "Origin of rating factor values."
  data:
  - name: "ManualRule"
  - name: "PredictiveModel"
  - name: "ScheduleRating"
  - name: "ExternalData"
- name: "ScoreBand"
  description: "Grouping of score ranges for interpretability."
  data:
  - name: "Excellent"
  - name: "Good"
  - name: "Fair"
  - name: "Poor"
- name: "ReferralType"
  description: "Triggering reason for escalation to higher authority or committee."
  data:
  - name: "AuthorityExceedance"
  - name: "AppetiteConflict"
  - name: "CatExposure"
  - name: "AdverseHistory"
  - name: "PricingDeviation"
- name: "ReferralStatus"
  description: "Processing state of a referral case."
  data:
  - name: "Open"
  - name: "Approved"
  - name: "Rejected"
  - name: "Withdrawn"
- name: "ApprovalStatus"
  description: "Outcome state of a referral approval decision."
  data:
  - name: "Approved"
  - name: "Rejected"
  - name: "Pending"
- name: "QuoteStatus"
  description: "State of a quote throughout negotiation and binding."
  data:
  - name: "Draft"
  - name: "Proposed"
  - name: "Revised"
  - name: "Bound"
  - name: "Declined"
  - name: "Expired"
- name: "ConditionType"
  description: "Type of term or requirement applied to coverage."
