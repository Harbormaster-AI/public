---
metadata:
  name: "HCIDL Claims Management Capabilities Model"
  description: "Canonical HCIDL capabilities model for insurance claims management,\
    \ spanning intake, investigation, coverage, financials, and closure."
  version: "1.0.0"
  industry: "Insurance"
  category: "Insurance"
  type: "Capability"
  domain: "Claims Management"
entities:
- name: "Policy"
  description: "Insurance policy providing coverage context for claims."
  data:
  - name: "policyNumber"
    type: "PolicyNumber"
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
  - name: "effectiveDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "deductibleDefault"
    type: "Money"
  relations:
  - name: "policyHolder"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "coverages"
    type: "PolicyCoverage"
    multiplicity: "OneToMany"
  - name: "claims"
    type: "Claim"
    multiplicity: "OneToMany"
- name: "PolicyCoverage"
  description: "Specific coverage term and limit defined under a policy."
  data:
  - name: "coverageType"
    type: "CoverageType"
  - name: "limitAmount"
    type: "Money"
  - name: "deductibleAmount"
    type: "Money"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "coverageDecisions"
    type: "CoverageDecision"
    multiplicity: "OneToMany"
- name: "Party"
  description: "Individual or organization participating in a policy or claim."
  data:
  - name: "partyType"
    type: "PartyType"
  - name: "legalName"
    type: "String"
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "dateOfBirth"
    type: "Date"
  - name: "taxIdentifier"
    type: "String"
  - name: "primaryAddress"
    type: "Address"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "contactPreference"
    type: "ContactPreference"
  relations:
  - name: "policies"
    type: "Policy"
    multiplicity: "OneToMany"
  - name: "claimParticipations"
    type: "ClaimParticipant"
    multiplicity: "OneToMany"
- name: "Claim"
  description: "End-to-end record of a reported loss from intake through closure."
  data:
  - name: "claimNumber"
    type: "ClaimNumber"
  - name: "claimType"
    type: "ClaimType"
  - name: "status"
    type: "ClaimStatus"
  - name: "reportedDate"
    type: "Date"
  - name: "lossDate"
    type: "Date"
  - name: "severity"
    type: "SeverityLevel"
  - name: "jurisdiction"
    type: "String"
  - name: "description"
    type: "String"
  - name: "catastropheCode"
    type: "String"
  relations:
  - name: "policy"
    type: "Policy"
    multiplicity: "ManyToOne"
  - name: "intake"
    type: "FirstNoticeOfLoss"
    multiplicity: "OneToOne"
  - name: "lossEvent"
    type: "LossEvent"
    multiplicity: "OneToOne"
  - name: "participants"
    type: "ClaimParticipant"
    multiplicity: "OneToMany"
  - name: "exposures"
    type: "Exposure"
    multiplicity: "OneToMany"
  - name: "reserves"
    type: "Reserve"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "recoveries"
    type: "Recovery"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "ClaimDocument"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "ClaimTask"
    multiplicity: "OneToMany"
  - name: "litigationCases"
    type: "LitigationCase"
    multiplicity: "OneToMany"
  - name: "notes"
    type: "ClaimNote"
    multiplicity: "OneToMany"
  - name: "events"
    type: "ClaimEvent"
    multiplicity: "OneToMany"
  - name: "serviceProviders"
    type: "SvcProvider"
    multiplicity: "ManyToMany"
- name: "FirstNoticeOfLoss"
  description: "Initial notification capturing preliminary loss details."
  data:
  - name: "intakeDate"
    type: "Date"
  - name: "intakeChannel"
    type: "CommunicationChannel"
  - name: "reporterName"
    type: "String"
  - name: "reporterContact"
    type: "String"
  - name: "narrative"
    type: "String"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "OneToOne"
- name: "LossEvent"
  description: "Circumstances and facts surrounding the loss occurrence."
  data:
  - name: "causeOfLoss"
    type: "CauseOfLoss"
  - name: "lossLocation"
    type: "Address"
  - name: "incidentDescription"
    type: "String"
  - name: "policeReportNumber"
    type: "String"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "inspections"
    type: "ClaimInspection"
    multiplicity: "OneToMany"
- name: "ClaimParticipant"
  description: "Party associated to the claim with a specific role."
  data:
  - name: "role"
    type: "ClaimParticipantRole"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "preferredContact"
    type: "ContactPreference"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "exposures"
    type: "Exposure"
    multiplicity: "ManyToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
- name: "Exposure"
  description: "Unit of liability or benefit evaluated and settled separately."
  data:
  - name: "exposureType"
    type: "ExposureType"
  - name: "status"
    type: "ExposureStatus"
  - name: "severity"
    type: "SeverityLevel"
  - name: "claimedAmount"
    type: "Money"
  - name: "evaluatedAmount"
    type: "Money"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "involvedParties"
    type: "ClaimParticipant"
    multiplicity: "ManyToMany"
  - name: "coverageDecisions"
    type: "CoverageDecision"
    multiplicity: "OneToMany"
  - name: "reserves"
    type: "Reserve"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "ClaimDocument"
    multiplicity: "OneToMany"
  - name: "assessments"
    type: "LossAssessment"
    multiplicity: "OneToMany"
  - name: "medicalBills"
    type: "MedicalBill"
    multiplicity: "OneToMany"
- name: "CoverageDecision"
  description: "Determination of coverage applicability and extent."
  data:
  - name: "position"
    type: "CoveragePosition"
  - name: "rationale"
    type: "String"
  - name: "decidedDate"
    type: "Date"
  relations:
  - name: "exposure"
    type: "Exposure"
    multiplicity: "ManyToOne"
  - name: "policyCoverage"
    type: "PolicyCoverage"
    multiplicity: "ManyToOne"
- name: "Reserve"
  description: "Financial estimate set aside for anticipated claim obligations."
  data:
  - name: "reserveType"
    type: "ReserveType"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "ReserveStatus"
  - name: "establishedDate"
    type: "Date"
  - name: "lastAdjustedDate"
    type: "Date"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "exposure"
    type: "Exposure"
    multiplicity: "ManyToOne"
- name: "Payment"
  description: "Disbursement made to satisfy claim-related obligations."
  data:
  - name: "paymentNumber"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "method"
    type: "PaymentMethod"
  - name: "status"
    type: "PaymentStatus"
  - name: "scheduledDate"
    type: "Date"
  - name: "disbursedDate"
    type: "Date"
  - name: "payeeName"
    type: "String"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "exposure"
    type: "Exposure"
    multiplicity: "ManyToOne"
  - name: "payee"
    type: "ClaimParticipant"
    multiplicity: "ManyToOne"
  - name: "medicalBills"
    type: "MedicalBill"
    multiplicity: "ManyToMany"
- name: "Recovery"
  description: "Funds recouped from responsible parties or salvage."
  data:
  - name: "recoveryType"
    type: "RecoveryType"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "RecoveryStatus"
  - name: "source"
    type: "String"
  - name: "receivedDate"
    type: "Date"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "exposure"
    type: "Exposure"
    multiplicity: "ManyToOne"
  - name: "counterparty"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "ClaimAdjuster"
  description: "Claims professional responsible for investigation and settlement."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "officeLocation"
    type: "String"
  relations:
  - name: "assignments"
    type: "AdjusterAssignment"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "ClaimTask"
    multiplicity: "OneToMany"
  - name: "assessments"
    type: "LossAssessment"
    multiplicity: "OneToMany"
- name: "AdjusterAssignment"
  description: "Assignment of a claim to an adjuster with role and status."
  data:
  - name: "assignmentDate"
    type: "Date"
  - name: "role"
    type: "AdjusterRole"
  - name: "status"
    type: "AssignmentStatus"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "adjuster"
    type: "ClaimAdjuster"
    multiplicity: "ManyToOne"
- name: "ClaimTask"
  description: "Discrete work item tracked during claim handling."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "TaskStatus_"
  - name: "priority"
    type: "TaskPriority"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "assignee"
    type: "ClaimAdjuster"
    multiplicity: "ManyToOne"
  - name: "svcProvider"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
- name: "ClaimDocument"
  description: "Evidence or correspondence stored as part of the claim record."
  data:
  - name: "documentType"
    type: "DocumentType"
  - name: "file"
    type: "FileReference"
  - name: "description"
    type: "String"
  - name: "receivedDate"
    type: "Date"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "exposure"
    type: "Exposure"
    multiplicity: "ManyToOne"
  - name: "submittedBy"
    type: "ClaimParticipant"
    multiplicity: "ManyToOne"
- name: "ClaimNote"
  description: "Narrative entry capturing context or decisions."
  data:
  - name: "createdDate"
    type: "Date"
  - name: "authorName"
    type: "String"
  - name: "visibility"
    type: "NoteVisibility"
  - name: "text"
    type: "String"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
- name: "ClaimEvent"
  description: "Significant occurrence within the claim lifecycle."
  data:
  - name: "eventType"
    type: "ClaimEventType"
  - name: "eventDate"
    type: "Date"
  - name: "details"
    type: "String"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
- name: "LitigationCase"
  description: "Legal proceeding related to a claim."
  data:
  - name: "caseNumber"
    type: "String"
  - name: "status"
    type: "LitigationStatus"
  - name: "filingDate"
    type: "Date"
  - name: "courtName"
    type: "String"
  - name: "strategyNotes"
    type: "String"
  relations:
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "plaintiff"
    type: "ClaimParticipant"
    multiplicity: "ManyToOne"
  - name: "defenseCounsel"
    type: "LegalCounsel"
    multiplicity: "ManyToOne"
  - name: "hearings"
    type: "LegalHearing"
    multiplicity: "OneToMany"
- name: "LegalCounsel"
  description: "Legal representative engaged for a claim or case."
  data:
  - name: "firmName"
    type: "String"
  - name: "attorneyName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  relations:
  - name: "litigationCases"
    type: "LitigationCase"
    multiplicity: "OneToMany"
- name: "LegalHearing"
  description: "Scheduled legal event within a litigation case."
  data:
  - name: "hearingDate"
    type: "Date"
  - name: "hearingType"
    type: "String"
  - name: "outcome"
    type: "String"
  relations:
  - name: "litigationCase"
    type: "LitigationCase"
    multiplicity: "ManyToOne"
- name: "ClaimInspection"
  description: "On-site or virtual inspection performed to evaluate the loss."
  data:
  - name: "inspectionType"
    type: "InspectionType"
  - name: "scheduledDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  - name: "inspectorName"
    type: "String"
  - name: "outcomeSummary"
    type: "String"
  relations:
  - name: "lossEvent"
    type: "LossEvent"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "ClaimDocument"
    multiplicity: "OneToMany"
- name: "LossAssessment"
  description: "Professional estimate of damages, liability, or quantum."
  data:
  - name: "assessmentDate"
    type: "Date"
  - name: "estimatedAmount"
    type: "Money"
  - name: "notes"
    type: "String"
  relations:
  - name: "exposure"
    type: "Exposure"
    multiplicity: "ManyToOne"
  - name: "assessor"
    type: "ClaimAdjuster"
    multiplicity: "ManyToOne"
- name: "MedicalProvider"
  description: "Healthcare entity that renders services to a claimant."
  data:
  - name: "providerName"
    type: "String"
  - name: "specialty"
    type: "MedicalSpecialty"
  - name: "taxIdentifier"
    type: "String"
  - name: "npi"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "bills"
    type: "MedicalBill"
    multiplicity: "OneToMany"
- name: "MedicalBill"
  description: "Itemized statement for medical services related to a claim."
  data:
  - name: "billNumber"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "BillStatus"
  - name: "serviceFrom"
    type: "Date"
  - name: "serviceTo"
    type: "Date"
  - name: "diagnosisCode"
    type: "String"
  relations:
  - name: "exposure"
    type: "Exposure"
    multiplicity: "ManyToOne"
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "MedicalProvider"
    multiplicity: "ManyToOne"
  - name: "linkedPayments"
    type: "Payment"
    multiplicity: "ManyToMany"
- name: "SvcProvider"
  description: "Vendor delivering services such as remediation, appraisal, or housing."
  data:
  - name: "providerName"
    type: "String"
  - name: "serviceType"
    type: "ServiceType"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "claims"
    type: "Claim"
    multiplicity: "ManyToMany"
  - name: "tasks"
    type: "ClaimTask"
    multiplicity: "OneToMany"
- name: "BenefitDetermination"
  description: "Decision detailing payable benefits for an eligible exposure."
  data:
  - name: "benefitType"
    type: "BenefitType"
  - name: "payableAmount"
    type: "Money"
  - name: "decisionDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "exposure"
    type: "Exposure"
    multiplicity: "ManyToOne"
  - name: "payee"
    type: "ClaimParticipant"
    multiplicity: "ManyToOne"
enums:
- name: "ClaimStatus"
  description: "Lifecycle states of a claim."
  data:
  - name: "Reported"
  - name: "Open"
  - name: "PendingCoverage"
  - name: "Investigation"
  - name: "Evaluation"
  - name: "Negotiation"
  - name: "Litigation"
  - name: "Closed"
  - name: "Reopened"
- name: "ClaimType"
  description: "Classification of claim by line or nature of loss."
  data:
  - name: "Property"
  - name: "Liability"
  - name: "WorkersComp"
  - name: "Life"
  - name: "Health"
  - name: "Marine"
  - name: "Travel"
- name: "SeverityLevel"
  description: "Relative magnitude of loss or impact."
  data:
  - name: "Catastrophic"
  - name: "Major"
  - name: "Moderate"
  - name: "Minor"
  - name: "Trivial"
- name: "CommunicationChannel"
  description: "Channel used to communicate or report the loss."
  data:
