---
metadata:
  name: "HCIDL Risk Assessment Capabilities Model"
  description: "A capability model for insurance risk assessment covering exposure\
    \ analysis, hazard and control evaluation, scoring workflows, surveys, recommendations,\
    \ and underwriting referral."
  version: "1.0.0"
  industry: "Insurance"
  category: "Insurance"
  type: "Capability"
  domain: "Risk Assessment"
entities:
- name: "ExposurePortfolio"
  description: "A grouping of exposure units for aggregated risk analysis and reporting."
  data:
  - name: "name"
    type: "String"
  - name: "portfolioType"
    type: "PortfolioType"
  - name: "ownerOrganization"
    type: "String"
  relations:
  - name: "exposureUnits"
    type: "ExposureUnit"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
- name: "ExposureUnit"
  description: "The insurable subject of risk assessment such as a facility, operation,\
    \ or digital asset."
  data:
  - name: "name"
    type: "String"
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
  - name: "occupancyType"
    type: "String"
  - name: "operationsDescription"
    type: "String"
  - name: "coverageForm"
    type: "String"
  - name: "primaryNAICS"
    type: "String"
  - name: "totalEmployees"
    type: "Integer"
  - name: "yearEstablished"
    type: "Integer"
  relations:
  - name: "portfolio"
    type: "ExposurePortfolio"
    multiplicity: "ManyToOne"
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "lossHistoryRecords"
    type: "LossHistory"
    multiplicity: "OneToMany"
  - name: "assessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "exposureMeasures"
    type: "ExposureMeasure"
    multiplicity: "OneToMany"
- name: "Location"
  description: "A physical site associated with an exposure unit, used for peril,\
    \ hazard, and protection analysis."
  data:
  - name: "address"
    type: "Address"
  - name: "latitude"
    type: "Decimal"
  - name: "longitude"
    type: "Decimal"
  - name: "locationType"
    type: "LocationType"
  - name: "fireProtectionClass"
    type: "String"
  - name: "floodZone"
    type: "String"
  relations:
  - name: "exposureUnit"
    type: "ExposureUnit"
    multiplicity: "ManyToOne"
  - name: "surveys"
    type: "Survey"
    multiplicity: "OneToMany"
  - name: "lossHistoryRecords"
    type: "LossHistory"
    multiplicity: "OneToMany"
  - name: "exposureMeasures"
    type: "ExposureMeasure"
    multiplicity: "OneToMany"
- name: "RiskAssessment"
  description: "A comprehensive evaluation of risk for a given exposure unit and scope,\
    \ resulting in findings, scores, and recommendations."
  data:
  - name: "assessmentNumber"
    type: "String"
  - name: "status"
    type: "RiskAssessmentStatus"
  - name: "assessmentDate"
    type: "Date"
  - name: "effectiveDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "methodology"
    type: "AssessmentMethod"
  - name: "overallScore"
    type: "Decimal"
  - name: "assessorName"
    type: "String"
  - name: "assessmentNotes"
    type: "String"
  relations:
  - name: "exposureUnit"
    type: "ExposureUnit"
    multiplicity: "ManyToOne"
  - name: "locations"
    type: "Location"
    multiplicity: "ManyToMany"
  - name: "perils"
    type: "Peril"
    multiplicity: "ManyToMany"
  - name: "hazards"
    type: "Hazard"
    multiplicity: "OneToMany"
  - name: "controls"
    type: "Control"
    multiplicity: "OneToMany"
  - name: "findings"
    type: "AssessmentFinding"
    multiplicity: "OneToMany"
  - name: "recommendations"
    type: "Recommendation"
    multiplicity: "OneToMany"
  - name: "mitigationPlan"
    type: "MitigationPlan"
    multiplicity: "OneToOne"
  - name: "scoringModel"
    type: "ScoringModel"
    multiplicity: "ManyToOne"
  - name: "surveys"
    type: "Survey"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "AssessmentDocument"
    multiplicity: "OneToMany"
  - name: "lossHistoryRecords"
    type: "LossHistory"
    multiplicity: "OneToMany"
  - name: "dataSources"
    type: "ThirdPartyDataSource"
    multiplicity: "ManyToMany"
  - name: "catastropheModels"
    type: "CatastropheModel"
    multiplicity: "ManyToMany"
  - name: "exposureMeasures"
    type: "ExposureMeasure"
    multiplicity: "OneToMany"
  - name: "underwritingReferral"
    type: "UnderwritingReferral"
    multiplicity: "OneToOne"
- name: "Peril"
  description: "A source of potential loss considered in the assessment, such as fire,\
    \ flood, or cyber attack."
  data:
  - name: "name"
    type: "String"
  - name: "perilType"
    type: "PerilType"
  relations:
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "ManyToMany"
  - name: "hazards"
    type: "Hazard"
    multiplicity: "OneToMany"
- name: "Hazard"
  description: "A condition or activity that increases the likelihood or severity\
    \ of loss."
  data:
  - name: "title"
    type: "String"
  - name: "hazardCategory"
    type: "HazardCategory"
  - name: "inherentSeverity"
    type: "SeverityLevel"
  - name: "inherentLikelihood"
    type: "LikelihoodLevel"
  - name: "description"
    type: "String"
  relations:
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
  - name: "peril"
    type: "Peril"
    multiplicity: "ManyToOne"
  - name: "controls"
    type: "Control"
    multiplicity: "ManyToMany"
  - name: "findings"
    type: "AssessmentFinding"
    multiplicity: "OneToMany"
- name: "Control"
  description: "A risk control measure designed to prevent, detect, or mitigate loss."
  data:
  - name: "name"
    type: "String"
  - name: "controlType"
    type: "ControlType"
  - name: "implementationStatus"
    type: "ImplementationStatus"
  - name: "effectivenessRating"
    type: "EffectivenessLevel"
  - name: "lastVerifiedDate"
    type: "Date"
  relations:
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
  - name: "hazards"
    type: "Hazard"
    multiplicity: "ManyToMany"
  - name: "findings"
    type: "AssessmentFinding"
    multiplicity: "OneToMany"
- name: "ExposureMeasure"
  description: "Quantitative measures used to characterize exposure magnitude and\
    \ dependency."
  data:
  - name: "measureDate"
    type: "Date"
  - name: "totalInsuredValue"
    type: "Money"
  - name: "replacementCost"
    type: "Money"
  - name: "buildingAreaSqFt"
    type: "Decimal"
  - name: "annualRevenue"
    type: "Money"
  - name: "employeeCount"
    type: "Integer"
  - name: "criticalDependencies"
    type: "String"
  relations:
  - name: "exposureUnit"
    type: "ExposureUnit"
    multiplicity: "ManyToOne"
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "ScoringModel"
  description: "A defined method for computing risk scores based on weighted factors\
    \ and analytics."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "modelType"
    type: "ModelType"
  - name: "calibrationDate"
    type: "Date"
  - name: "scoringMethod"
    type: "ScoringMethod"
  relations:
  - name: "riskFactors"
    type: "RiskFactor"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
- name: "RiskFactor"
  description: "A measurable attribute that influences the risk score."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "factorType"
    type: "FactorType"
  - name: "weight"
    type: "Decimal"
  - name: "direction"
    type: "FactorDirection"
  - name: "inputUnit"
    type: "String"
  relations:
  - name: "scoringModel"
    type: "ScoringModel"
    multiplicity: "ManyToOne"
- name: "AssessmentFinding"
  description: "An assessment conclusion or observation linked to hazards and controls."
  data:
  - name: "findingType"
    type: "FindingType"
  - name: "description"
    type: "String"
  - name: "severity"
    type: "SeverityLevel"
  - name: "likelihood"
    type: "LikelihoodLevel"
  - name: "residualRiskLevel"
    type: "SeverityLevel"
  - name: "residualRiskScore"
    type: "Decimal"
  relations:
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
  - name: "hazard"
    type: "Hazard"
    multiplicity: "ManyToOne"
  - name: "control"
    type: "Control"
    multiplicity: "ManyToOne"
  - name: "recommendations"
    type: "Recommendation"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "AssessmentDocument"
    multiplicity: "OneToMany"
- name: "Recommendation"
  description: "A proposed action to reduce risk or improve control effectiveness."
  data:
  - name: "title"
    type: "String"
  - name: "recommendationType"
    type: "RecommendationType"
  - name: "priority"
    type: "Priority"
  - name: "targetDate"
    type: "Date"
  - name: "status"
    type: "RecommendationStatus"
  - name: "estimatedCost"
    type: "Money"
  - name: "expectedRiskReductionPercent"
    type: "Percentage"
  relations:
  - name: "finding"
    type: "AssessmentFinding"
    multiplicity: "ManyToOne"
  - name: "mitigationPlan"
    type: "MitigationPlan"
    multiplicity: "ManyToOne"
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
- name: "MitigationPlan"
  description: "A coordinated plan to implement multiple recommendations over time."
  data:
  - name: "planName"
    type: "String"
  - name: "planStatus"
    type: "PlanStatus"
  - name: "owner"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "targetCompletionDate"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
  - name: "recommendations"
    type: "Recommendation"
    multiplicity: "OneToMany"
- name: "Survey"
  description: "A site or remote review conducted to gather evidence for the assessment."
  data:
  - name: "surveyDate"
    type: "Date"
  - name: "surveyMethod"
    type: "SurveyMethod"
  - name: "outcome"
    type: "SurveyOutcome"
  - name: "surveyorName"
    type: "String"
  relations:
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "observations"
    type: "SurveyObservation"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "AssessmentDocument"
    multiplicity: "OneToMany"
- name: "SurveyObservation"
  description: "A discrete observation recorded during a survey."
  data:
  - name: "note"
    type: "String"
  - name: "observationType"
    type: "ObservationType"
  - name: "severity"
    type: "SeverityLevel"
  relations:
  - name: "survey"
    type: "Survey"
    multiplicity: "ManyToOne"
  - name: "hazard"
    type: "Hazard"
    multiplicity: "ManyToOne"
- name: "LossHistory"
  description: "Historical loss or claim information relevant to risk assessment."
  data:
  - name: "lossDate"
    type: "Date"
  - name: "perilType"
    type: "PerilType"
  - name: "causeOfLoss"
    type: "String"
  - name: "amountPaid"
    type: "Money"
  - name: "amountReserved"
    type: "Money"
  - name: "claimOutcome"
    type: "ClaimOutcome"
  relations:
  - name: "exposureUnit"
    type: "ExposureUnit"
    multiplicity: "ManyToOne"
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "AssessmentDocument"
  description: "A document or media artifact supporting the assessment, such as reports\
    \ or photos."
  data:
  - name: "documentName"
    type: "String"
  - name: "documentType"
    type: "DocumentType"
  - name: "uri"
    type: "String"
  - name: "uploadedDate"
    type: "Date"
  relations:
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
  - name: "survey"
    type: "Survey"
    multiplicity: "ManyToOne"
  - name: "finding"
    type: "AssessmentFinding"
    multiplicity: "ManyToOne"
- name: "UnderwritingReferral"
  description: "A handoff of assessment outcomes to underwriting for decision and\
    \ conditions."
  data:
  - name: "referralReason"
    type: "String"
  - name: "referralPriority"
    type: "Priority"
  - name: "referralStatus"
    type: "ReferralStatus"
  - name: "underwritingDecision"
    type: "UnderwritingDecision"
  - name: "decisionDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "OneToOne"
- name: "AssessmentSchedule"
  description: "A timetable and trigger configuration for periodic or event-driven\
    \ reassessment."
  data:
  - name: "frequency"
    type: "AssessmentFrequency"
  - name: "nextAssessmentDate"
    type: "Date"
  - name: "triggerType"
    type: "TriggerType"
  - name: "status"
    type: "ScheduleStatus"
  relations:
  - name: "exposureUnit"
    type: "ExposureUnit"
    multiplicity: "ManyToOne"
- name: "ThirdPartyDataSource"
  description: "An external dataset used to enrich or validate assessment inputs."
  data:
  - name: "name"
    type: "String"
  - name: "provider"
    type: "String"
  - name: "dataType"
    type: "ExternalDataType"
  - name: "referenceDate"
    type: "Date"
  - name: "licenseReference"
    type: "String"
  relations:
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "ManyToMany"
- name: "CatastropheModel"
  description: "A hazard and loss modeling tool used to quantify catastrophe risk."
  data:
  - name: "name"
    type: "String"
  - name: "vendor"
    type: "String"
  - name: "modelVersion"
    type: "String"
  - name: "perilType"
    type: "PerilType"
  relations:
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "ManyToMany"
enums:
- name: "RiskAssessmentStatus"
  description: "Lifecycle states for a risk assessment from initiation to archival."
  data:
  - name: "Draft"
  - name: "InProgress"
  - name: "Completed"
  - name: "Approved"
  - name: "Rejected"
  - name: "Archived"
- name: "AssessmentMethod"
  description: "Approaches used to conduct a risk assessment."
  data:
  - name: "DesktopReview"
  - name: "OnsiteSurvey"
  - name: "Hybrid"
  - name: "AutomatedModel"
- name: "LineOfBusiness"
  description: "Insurance product categories relevant to exposure units."
  data:
  - name: "Property"
  - name: "GeneralLiability"
  - name: "WorkersComp"
  - name: "Marine"
  - name: "Cyber"
  - name: "ProfessionalLiability"
- name: "LocationType"
  description: "Classifications for the role of a location within operations."
  data:
  - name: "Primary"
  - name: "Secondary"
  - name: "Storage"
  - name: "Operations"
  - name: "Headquarters"
- name: "PerilType"
  description: "Standard peril categories considered in insurance risk assessment."
  data:
  - name: "Fire"
  - name: "Flood"
  - name: "Windstorm"
  - name: "Earthquake"
  - name: "Theft"
  - name: "CyberAttack"
  - name: "Liability"
- name: "HazardCategory"
  description: "Groupings of hazards by nature and origin."
  data:
  - name: "Physical"
  - name: "Operational"
  - name: "Environmental"
  - name: "Cyber"
  - name: "Human"
  - name: "Financial"
- name: "SeverityLevel"
  description: "Ordinal scale describing potential loss magnitude."
  data:
  - name: "Low"
  - name: "Moderate"
  - name: "High"
  - name: "Critical"
- name: "LikelihoodLevel"
  description: "Ordinal scale describing probability of occurrence."
  data:
  - name: "Rare"
  - name: "Unlikely"
  - name: "Possible"
  - name: "Likely"
  - name: "AlmostCertain"
- name: "ControlType"
  description: "Types of risk controls implemented to prevent or mitigate loss."
  data:
  - name: "Engineering"
  - name: "Administrative"
  - name: "ProtectiveEquipment"
  - name: "Transfer"
  - name: "Monitoring"
- name: "ImplementationStatus"
  description: "The current implementation stage of a risk control."
  data:
  - name: "NotPlanned"
  - name: "Planned"
  - name: "InProgress"
  - name: "Implemented"
  - name: "NotEffective"
- name: "EffectivenessLevel"
  description: "Degree to which a control reduces risk when functioning as intended."
  data:
  - name: "Ineffective"
  - name: "PartiallyEffective"
  - name: "Effective"
  - name: "HighlyEffective"
- name: "ModelType"
  description: "Categories of models used for risk scoring and analysis."
  data:
  - name: "Scorecard"
  - name: "Statistical"
  - name: "Catastrophe"
  - name: "MachineLearning"
  - name: "RuleBased"
- name: "ScoringMethod"
  description: "Algorithms applied to combine factors into a risk score."
  data:
  - name: "WeightedSum"
  - name: "LogisticRegression"
  - name: "DecisionTree"
  - name: "NeuralNetwork"
- name: "FactorType"
  description: "Class of driver represented by a risk factor."
  data:
  - name: "Exposure"
  - name: "Hazard"
  - name: "Control"
  - name: "Vulnerability"
  - name: "Financial"
- name: "FactorDirection"
  description: "Relationship between factor magnitude and overall risk."
  data:
  - name: "IncreasesRisk"
  - name: "DecreasesRisk"
  - name: "NonMonotonic"
- name: "FindingType"
  description: "Types of conclusions derived during assessment analysis."
  data:
  - name: "Observation"
  - name: "NonCompliance"
  - name: "ControlGap"
  - name: "Strength"
- name: "RecommendationType"
  description: "Categories of remedial or preventive actions."
  data:
  - name: "ControlImplementation"
  - name: "ProcessChange"
  - name: "Training"
  - name: "Maintenance"
  - name: "Transfer"
  - name: "Monitoring"
- name: "Priority"
  description: "Relative urgency for action or review."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Urgent"
- name: "RecommendationStatus"
  description: "Workflow states for implementing a recommendation."
  data:
  - name: "Proposed"
  - name: "Accepted"
  - name: "InProgress"
  - name: "Completed"
  - name: "Deferred"
  - name: "Rejected"
- name: "PlanStatus"
  description: "Lifecycle states for a mitigation plan."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "SurveyMethod"
  description: "Techniques used to perform a survey during assessment."
  data:
  - name: "Onsite"
  - name: "RemoteInterview"
  - name: "DesktopReview"
  - name: "DroneInspection"
  - name: "SensorDataReview"
- name: "SurveyOutcome"
  description: "Access and completion result of a scheduled survey."
  data:
  - name: "AccessGranted"
  - name: "AccessLimited"
  - name: "NotPermitted"
  - name: "Completed"
  - name: "Rescheduled"
- name: "ObservationType"
  description: "Areas of focus commonly examined during surveys."
  data:
  - name: "Housekeeping"
  - name: "Equipment"
  - name: "Process"
  - name: "Documentation"
  - name: "Security"
  - name: "Compliance"
- name: "ClaimOutcome"
  description: "Disposition status of a claim related to loss history."
  data:
  - name: "Open"
  - name: "ClosedWithPayment"
  - name: "ClosedWithoutPayment"
- name: "DocumentType"
  description: "Classification of documents associated with assessments."
  data:
  - name: "Photo"
  - name: "Report"
  - name: "Checklist"
  - name: "Diagram"
  - name: "Certificate"
  - name: "Drawing"
- name: "ReferralStatus"
  description: "Processing state of an underwriting referral."
  data:
  - name: "Submitted"
  - name: "UnderReview"
  - name: "Approved"
  - name: "Declined"
  - name: "Returned"
- name: "UnderwritingDecision"
  description: "Underwriting outcome based on assessment results."
  data:
  - name: "Bind"
  - name: "BindWithConditions"
  - name: "Decline"
  - name: "ReferToSenior"
- name: "AssessmentFrequency"
  description: "Cadence for scheduled reassessments."
  data:
  - name: "Annual"
  - name: "SemiAnnual"
  - name: "Quarterly"
  - name: "Biennial"
  - name: "OneTime"
- name: "TriggerType"
  description: "Events that initiate an out-of-cycle assessment."
  data:
  - name: "Scheduled"
  - name: "PostLoss"
  - name: "MaterialChange"
  - name: "NewBusiness"
  - name: "Renewal"
- name: "ScheduleStatus"
  description: "Lifecycle states for an assessment schedule."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "Suspended"
  - name: "Completed"
- name: "PortfolioType"
  description: "Classification of exposure portfolios by ownership or scope."
  data:
  - name: "Client"
  - name: "Broker"
  - name: "InternalProgram"
  - name: "Region"
- name: "ExternalDataType"
  description: "Categories of third-party data that augment assessments."
  data:
  - name: "CatHazard"
  - name: "CrimeStats"
  - name: "FireProtection"
  - name: "FloodZone"
  - name: "Weather"
  - name: "SupplyChain"
valueObjects:
- name: "Money"
  description: "Monetary value represented by amount and currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Mailing or site address for a location under assessment."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "Percentage"
  description: "A fractional value expressed as a percentage between 0 and 100."
  data:
  - name: "value"
    type: "Decimal"
