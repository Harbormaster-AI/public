---
metadata:
  name: "Actuarial Analysis HCIDL"
  description: "Capabilities model for actuarial pricing, reserving, trend, and model\
    \ governance within insurance enterprises."
  version: "1.0.0"
  industry: "Insurance"
  category: "Insurance"
  type: "Capability"
  domain: "Actuarial Analysis"
entities:
- name: "ActuarialUnit"
  description: "Organizational group responsible for actuarial planning, pricing,\
    \ reserving, and governance."
  data:
  - name: "name"
    type: "String"
  - name: "remit"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "rateIndications"
    type: "RateIndication"
    multiplicity: "OneToMany"
  - name: "reservingRuns"
    type: "ReservingRun"
    multiplicity: "OneToMany"
  - name: "experienceStudies"
    type: "ExperienceStudy"
    multiplicity: "OneToMany"
  - name: "analyticalModels"
    type: "AnalyticalModel"
    multiplicity: "OneToMany"
- name: "LineOfBusiness"
  description: "Insurance product line over which pricing, reserving, and experience\
    \ analysis are organized."
  data:
  - name: "name"
    type: "String"
  - name: "lobType"
    type: "LOBType"
  - name: "regulatoryJurisdiction"
    type: "String"
  relations:
  - name: "segments"
    type: "ActuarialSegment"
    multiplicity: "OneToMany"
  - name: "ratingPlans"
    type: "RatingPlan"
    multiplicity: "OneToMany"
  - name: "exposureDefinitions"
    type: "ExposureDefinition"
    multiplicity: "OneToMany"
  - name: "lossTriangles"
    type: "LossTriangle"
    multiplicity: "OneToMany"
  - name: "reinsurancePrograms"
    type: "ReinsuranceProgram"
    multiplicity: "OneToMany"
- name: "ActuarialSegment"
  description: "Analytical grouping used for indications and reserves such as territory,\
    \ class, limit or deductible bands."
  data:
  - name: "name"
    type: "String"
  - name: "territoryType"
    type: "TerritoryType"
  - name: "classCode"
    type: "String"
  - name: "limitBand"
    type: "String"
  - name: "deductibleBand"
    type: "String"
  relations:
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
    multiplicity: "ManyToOne"
- name: "ExposureDefinition"
  description: "Definition of the exposure basis used for pricing and monitoring in\
    \ a line of business."
  data:
  - name: "name"
    type: "String"
  - name: "exposureUnit"
    type: "ExposureUnit"
  - name: "description"
    type: "String"
  - name: "defaultMeasure"
    type: "ExposureMeasure"
  relations:
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
    multiplicity: "ManyToOne"
- name: "RatingPlan"
  description: "Structure of factors, relativities and algorithms used to determine\
    \ premiums."
  data:
  - name: "name"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "status"
    type: "AssumptionStatus"
  - name: "algorithmReference"
    type: "String"
  relations:
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
    multiplicity: "ManyToOne"
  - name: "factors"
    type: "RatingFactor"
    multiplicity: "OneToMany"
  - name: "ratingTables"
    type: "RatingTable"
    multiplicity: "OneToMany"
- name: "RatingFactor"
  description: "Variable in the rating plan that influences premium through a relativity\
    \ or load."
  data:
  - name: "factorName"
    type: "String"
  - name: "factorType"
    type: "FactorType"
  - name: "dataType"
    type: "String"
  - name: "selectionMethod"
    type: "String"
  relations:
  - name: "ratingPlan"
    type: "RatingPlan"
    multiplicity: "ManyToOne"
  - name: "ratingTable"
    type: "RatingTable"
    multiplicity: "ManyToOne"
- name: "RatingTable"
  description: "Tabular mapping of factor attributes to relativities or loads."
  data:
  - name: "tableName"
    type: "String"
  - name: "factorType"
    type: "FactorType"
  - name: "interpolationMethod"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "ratingPlan"
    type: "RatingPlan"
    multiplicity: "ManyToOne"
  - name: "rows"
    type: "RatingTableRow"
    multiplicity: "OneToMany"
- name: "RatingTableRow"
  description: "A single row entry in a rating table representing a category or range\
    \ with its relativity."
  data:
  - name: "category"
    type: "String"
  - name: "rangeStart"
    type: "Decimal"
  - name: "rangeEnd"
    type: "Decimal"
  - name: "relativity"
    type: "Relativity"
  relations:
  - name: "ratingTable"
    type: "RatingTable"
    multiplicity: "ManyToOne"
- name: "ExperienceStudy"
  description: "Analytical study of historical premium, exposure, and losses to support\
    \ indications."
  data:
  - name: "studyName"
    type: "String"
  - name: "period"
    type: "DateRange"
  - name: "method"
    type: "StudyMethod"
  - name: "status"
    type: "AssumptionStatus"
  relations:
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
    multiplicity: "ManyToOne"
  - name: "exposureDataset"
    type: "ExposureDataset"
    multiplicity: "ManyToOne"
  - name: "claimDataset"
    type: "ClaimDataset"
    multiplicity: "ManyToOne"
  - name: "trendAssumptions"
    type: "TrendAssumptionSet"
    multiplicity: "ManyToOne"
  - name: "expenseAssumptions"
    type: "ExpenseAssumptionSet"
    multiplicity: "ManyToOne"
- name: "ExposureDataset"
  description: "Curated exposure and premium data snapshot used for actuarial studies."
  data:
  - name: "name"
    type: "String"
  - name: "sourceSystem"
    type: "String"
  - name: "asOfDate"
    type: "Date"
  - name: "recordCount"
    type: "Integer"
- name: "ClaimDataset"
  description: "Curated claim transaction or summary data used in pricing and reserving\
    \ analyses."
  data:
  - name: "name"
    type: "String"
  - name: "sourceSystem"
    type: "String"
  - name: "asOfDate"
    type: "Date"
  - name: "recordCount"
    type: "Integer"
- name: "LossTriangle"
  description: "Structured development triangle for losses, claims, or premium."
  data:
  - name: "triangleCode"
    type: "String"
  - name: "triangleType"
    type: "TriangleType"
  - name: "originPeriodType"
    type: "String"
  - name: "valuationDate"
    type: "Date"
  relations:
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
    multiplicity: "ManyToOne"
  - name: "points"
    type: "TrianglePoint"
    multiplicity: "OneToMany"
- name: "TrianglePoint"
  description: "Cell value within a triangle identified by origin and development\
    \ age."
  data:
  - name: "originPeriod"
    type: "YearMonth"
  - name: "developmentAge"
    type: "Integer"
  - name: "amount"
    type: "Money"
  relations:
  - name: "triangle"
    type: "LossTriangle"
    multiplicity: "ManyToOne"
- name: "DevelopmentFactorSet"
  description: "Selected age-to-age factors and implied age-to-ultimate pattern for\
    \ a given triangle type."
  data:
  - name: "name"
    type: "String"
  - name: "triangleType"
    type: "TriangleType"
  - name: "selectionMethod"
    type: "String"
  - name: "status"
    type: "AssumptionStatus"
  relations:
  - name: "factors"
    type: "DevelopmentFactor"
    multiplicity: "OneToMany"
- name: "DevelopmentFactor"
  description: "Individual development factor from one age to the next."
  data:
  - name: "fromAge"
    type: "Integer"
  - name: "toAge"
    type: "Integer"
  - name: "factor"
    type: "Decimal"
  - name: "credibilityWeight"
    type: "Decimal"
  relations:
  - name: "factorSet"
    type: "DevelopmentFactorSet"
    multiplicity: "ManyToOne"
- name: "TailFactorAssumption"
  description: "Selected tail factor and notes for development beyond observed ages."
  data:
  - name: "name"
    type: "String"
  - name: "tailFactor"
    type: "Decimal"
  - name: "selectionMethod"
    type: "String"
  - name: "status"
    type: "AssumptionStatus"
- name: "TrendAssumptionSet"
  description: "A collection of selected trend rates by segment and period."
  data:
  - name: "name"
    type: "String"
  - name: "horizonMonths"
    type: "Integer"
  - name: "status"
    type: "AssumptionStatus"
  relations:
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
    multiplicity: "ManyToOne"
  - name: "trends"
    type: "TrendAssumption"
    multiplicity: "OneToMany"
- name: "TrendAssumption"
  description: "Selected annual trend rate applicable to a specific metric and segment."
  data:
  - name: "trendType"
    type: "TrendType"
  - name: "rate"
    type: "Percentage"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "assumptionSet"
    type: "TrendAssumptionSet"
    multiplicity: "ManyToOne"
  - name: "segment"
    type: "ActuarialSegment"
    multiplicity: "ManyToOne"
- name: "ExpenseAssumptionSet"
  description: "Selected underwriting and claim expense assumptions used in indications."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "AssumptionStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "components"
    type: "ExpenseComponent"
    multiplicity: "OneToMany"
- name: "ExpenseComponent"
  description: "Individual expense component expressed as a percentage or per-unit\
    \ amount."
  data:
  - name: "componentType"
    type: "ExpenseType"
  - name: "basis"
    type: "String"
  - name: "percentage"
    type: "Percentage"
  - name: "perUnit"
    type: "Money"
  relations:
  - name: "assumptionSet"
    type: "ExpenseAssumptionSet"
    multiplicity: "ManyToOne"
- name: "TargetReturnAssumption"
  description: "Profit or target return assumption used to derive overall indicated\
    \ change."
  data:
  - name: "name"
    type: "String"
  - name: "targetReturn"
    type: "Percentage"
  - name: "premiumLeverage"
    type: "Decimal"
  - name: "status"
    type: "AssumptionStatus"
  relations:
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
    multiplicity: "ManyToOne"
- name: "RateIndication"
  description: "Result of a pricing review producing indicated changes by segment\
    \ and overall."
  data:
  - name: "name"
    type: "String"
  - name: "indicationDate"
    type: "Date"
  - name: "status"
    type: "IndicationStatus"
  - name: "overallChange"
    type: "Percentage"
  relations:
  - name: "actuarialUnit"
    type: "ActuarialUnit"
    multiplicity: "ManyToOne"
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
    multiplicity: "ManyToOne"
  - name: "experienceStudy"
    type: "ExperienceStudy"
    multiplicity: "ManyToOne"
  - name: "targetReturn"
    type: "TargetReturnAssumption"
    multiplicity: "ManyToOne"
  - name: "expenseAssumptions"
    type: "ExpenseAssumptionSet"
    multiplicity: "ManyToOne"
  - name: "trendAssumptions"
    type: "TrendAssumptionSet"
    multiplicity: "ManyToOne"
  - name: "rateChangeProposals"
    type: "RateChangeProposal"
    multiplicity: "OneToMany"
  - name: "scenarios"
    type: "PricingScenario"
    multiplicity: "OneToMany"
- name: "RateChangeProposal"
  description: "Proposed set of filed or internal rate actions derived from an indication."
  data:
  - name: "name"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "status"
    type: "RateReviewStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "rateIndication"
    type: "RateIndication"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "RateChangeItem"
    multiplicity: "OneToMany"
- name: "RateChangeItem"
  description: "Segment-level proposed rate action and magnitude."
  data:
  - name: "action"
    type: "RateActionType"
  - name: "change"
    type: "Percentage"
  relations:
  - name: "proposal"
    type: "RateChangeProposal"
    multiplicity: "ManyToOne"
  - name: "segment"
    type: "ActuarialSegment"
    multiplicity: "ManyToOne"
- name: "PricingScenario"
  description: "What-if scenario comparing alternative assumptions or reinsurance\
    \ structures."
  data:
  - name: "scenarioName"
    type: "String"
  - name: "scenarioType"
    type: "ScenarioType"
  - name: "description"
    type: "String"
  relations:
  - name: "rateIndication"
    type: "RateIndication"
    multiplicity: "ManyToOne"
  - name: "reinsuranceProgram"
    type: "ReinsuranceProgram"
    multiplicity: "ManyToOne"
- name: "ReservingRun"
  description: "Execution of a reserving analysis for selected triangles and methods."
  data:
  - name: "runName"
    type: "String"
  - name: "asOfDate"
    type: "Date"
  - name: "method"
    type: "ReservingMethod"
  - name: "status"
    type: "ReservingRunStatus"
  relations:
  - name: "actuarialUnit"
    type: "ActuarialUnit"
    multiplicity: "ManyToOne"
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
    multiplicity: "ManyToOne"
  - name: "lossTriangle"
    type: "LossTriangle"
    multiplicity: "ManyToOne"
  - name: "developmentFactors"
    type: "DevelopmentFactorSet"
    multiplicity: "ManyToOne"
  - name: "tailAssumption"
    type: "TailFactorAssumption"
    multiplicity: "ManyToOne"
  - name: "reserveEstimates"
    type: "ReserveEstimate"
    multiplicity: "OneToMany"
- name: "ReserveEstimate"
  description: "Estimated ultimate losses and reserve components for a segment at\
    \ a valuation date."
  data:
  - name: "asOfDate"
    type: "Date"
  - name: "ultimateLoss"
    type: "Money"
  - name: "caseOutstanding"
    type: "Money"
  - name: "ibnr"
    type: "Money"
  - name: "selectionNotes"
    type: "String"
  relations:
  - name: "reservingRun"
    type: "ReservingRun"
    multiplicity: "ManyToOne"
  - name: "segment"
    type: "ActuarialSegment"
    multiplicity: "ManyToOne"
- name: "AnalyticalModel"
  description: "Predictive or credibility model used in actuarial analysis."
  data:
  - name: "name"
    type: "String"
  - name: "modelType"
    type: "ModelType"
  - name: "distributionFamily"
    type: "DistributionFamily"
  - name: "objective"
    type: "String"
  - name: "status"
    type: "GovernanceStatus"
  relations:
  - name: "actuarialUnit"
    type: "ActuarialUnit"
    multiplicity: "ManyToOne"
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "ModelVersion"
    multiplicity: "OneToMany"
  - name: "validations"
    type: "ModelValidation"
    multiplicity: "OneToMany"
- name: "ModelVersion"
  description: "Specific version of an analytical model with training configuration."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "trainingEndDate"
    type: "Date"
  - name: "featureList"
    type: "String"
  - name: "hyperparameters"
    type: "String"
  relations:
  - name: "model"
    type: "AnalyticalModel"
    multiplicity: "ManyToOne"
- name: "ModelValidation"
  description: "Validation report and metrics for a model or version."
  data:
  - name: "validationDate"
    type: "Date"
  - name: "result"
    type: "ValidationResultStatus"
  - name: "gini"
    type: "Decimal"
  - name: "rmse"
    type: "Decimal"
  - name: "notes"
    type: "String"
  relations:
  - name: "model"
    type: "AnalyticalModel"
    multiplicity: "ManyToOne"
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
- name: "ExternalIndex"
  description: "External economic or judicial index used in trend selection."
  data:
  - name: "name"
    type: "String"
  - name: "indexType"
    type: "IndexType"
  - name: "provider"
    type: "String"
  - name: "baseDate"
    type: "Date"
  - name: "baseValue"
    type: "Decimal"
  relations:
  - name: "observations"
    type: "IndexObservation"
    multiplicity: "OneToMany"
- name: "IndexObservation"
  description: "Single observed value for an external index at a given date."
  data:
  - name: "observationDate"
    type: "Date"
  - name: "value"
    type: "Decimal"
  relations:
  - name: "index"
    type: "ExternalIndex"
    multiplicity: "ManyToOne"
- name: "ReinsuranceProgram"
  description: "Program describing ceded reinsurance applicable to pricing or reserve\
    \ analyses."
  data:
  - name: "programName"
    type: "String"
  - name: "reinsuranceType"
    type: "ReinsuranceType"
  - name: "effectiveStart"
    type: "Date"
  - name: "effectiveEnd"
    type: "Date"
  relations:
  - name: "lineOfBusiness"
    type: "LineOfBusiness"
    multiplicity: "ManyToOne"
  - name: "layers"
    type: "ReinsuranceLayer"
    multiplicity: "OneToMany"
- name: "ReinsuranceLayer"
  description: "Individual layer terms within a reinsurance program."
  data:
  - name: "layerName"
    type: "String"
  - name: "attachment"
    type: "Money"
  - name: "limit"
    type: "Money"
  - name: "share"
    type: "Percentage"
  - name: "attachmentType"
    type: "LayerAttachmentType"
  - name: "reinstatementCount"
    type: "Integer"
  relations:
  - name: "program"
    type: "ReinsuranceProgram"
    multiplicity: "ManyToOne"
- name: "DataQualityIssue"
  description: "Issue identified during actuarial data preparation and validation."
  data:
  - name: "issueCode"
    type: "String"
  - name: "severity"
    type: "DataQualitySeverity"
  - name: "description"
    type: "String"
  - name: "detectedDate"
    type: "Date"
  - name: "status"
    type: "AssumptionStatus"
  relations:
  - name: "exposureDataset"
    type: "ExposureDataset"
    multiplicity: "ManyToOne"
  - name: "claimDataset"
    type: "ClaimDataset"
    multiplicity: "ManyToOne"
  - name: "experienceStudy"
    type: "ExperienceStudy"
    multiplicity: "ManyToOne"
- name: "MethodologyDocument"
  description: "Reference document describing methods, assumptions, and controls."
  data:
  - name: "documentTitle"
    type: "String"
  - name: "documentType"
    type: "MethodologyDocumentType"
  - name: "version"
    type: "String"
  - name: "publicationDate"
    type: "Date"
  - name: "url"
    type: "String"
  relations:
  - name: "applicableToIndication"
    type: "RateIndication"
    multiplicity: "ManyToOne"
  - name: "applicableToReserving"
    type: "ReservingRun"
    multiplicity: "ManyToOne"
- name: "AssumptionChangeLog"
  description: "Governance log capturing rationale and timing of assumption updates."
  data:
  - name: "changeDate"
    type: "Date"
  - name: "author"
    type: "String"
  - name: "rationale"
    type: "String"
  relations:
  - name: "trendAssumptions"
    type: "TrendAssumptionSet"
    multiplicity: "ManyToOne"
  - name: "expenseAssumptions"
    type: "ExpenseAssumptionSet"
    multiplicity: "ManyToOne"
  - name: "developmentFactors"
    type: "DevelopmentFactorSet"
    multiplicity: "ManyToOne"
  - name: "tailAssumption"
    type: "TailFactorAssumption"
    multiplicity: "ManyToOne"
  - name: "targetReturn"
    type: "TargetReturnAssumption"
    multiplicity: "ManyToOne"
enums:
- name: "LOBType"
  description: "Common insurance lines for which actuarial analysis is performed."
  data:
  - name: "PersonalAuto"
  - name: "Homeowners"
  - name: "CommercialProperty"
  - name: "GeneralLiability"
  - name: "WorkersCompensation"
  - name: "CommercialAuto"
  - name: "ProfessionalLiability"
  - name: "InlandMarine"
  - name: "Health"
  - name: "Life"
- name: "TerritoryType"
  description: "Types of geographic segmentation used in actuarial analysis."
  data:
  - name: "State"
  - name: "Province"
  - name: "Region"
  - name: "Country"
  - name: "RatingTerritory"
  - name: "PostalArea"
- name: "FactorType"
  description: "Categorization of rating factor behaviors and structures."
  data:
  - name: "Categorical"
  - name: "OrderedCategorical"
  - name: "Continuous"
  - name: "Relativity"
  - name: "Surcharge"
  - name: "Discount"
  - name: "Cap"
  - name: "Floor"
- name: "StudyMethod"
  description: "Methods used to derive indicated rates from historical experience."
  data:
  - name: "PurePremium"
  - name: "LossRatio"
  - name: "FrequencySeverity"
  - name: "CredibilityWeighted"
  - name: "GLM"
  - name: "ExperienceRating"
- name: "TriangleType"
  description: "Types of development triangles constructed for analysis."
  data:
  - name: "PaidLoss"
  - name: "IncurredLoss"
  - name: "ReportedClaims"
  - name: "ClosedClaims"
  - name: "PaidALAE"
  - name: "IncurredALAE"
  - name: "EarnedPremium"
  - name: "Exposure"
- name: "ReservingMethod"
  description: "Methods applied to estimate ultimate losses and reserves."
  data:
  - name: "ChainLadder"
  - name: "BornhuetterFerguson"
  - name: "CapeCod"
  - name: "MunichChainLadder"
  - name: "FrequencySeverity"
  - name: "StochasticMack"
- name: "AssumptionStatus"
  description: "Lifecycle status for actuarial assumptions."
  data:
  - name: "Draft"
  - name: "Proposed"
  - name: "Approved"
  - name: "Retired"
- name: "IndicationStatus"
  description: "Workflow status for a rate indication."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Finalized"
  - name: "Superseded"
- name: "ReservingRunStatus"
  description: "Execution status of a reserving run."
  data:
  - name: "Pending"
  - name: "Running"
  - name: "Completed"
  - name: "Failed"
- name: "ModelType"
  description: "Types of analytical models applied in actuarial work."
  data:
  - name: "GLM"
  - name: "GBM"
  - name: "Credibility"
  - name: "Survival"
  - name: "Frequency"
  - name: "Severity"
  - name: "Tweedie"
- name: "DistributionFamily"
  description: "Statistical distributions used in actuarial modeling."
  data:
  - name: "Poisson"
  - name: "NegativeBinomial"
  - name: "Binomial"
  - name: "Gamma"
  - name: "Lognormal"
  - name: "Weibull"
  - name: "Pareto"
  - name: "Tweedie"
- name: "TrendType"
  description: "Measured quantity subject to trend assumptions."
  data:
  - name: "Frequency"
  - name: "Severity"
  - name: "PurePremium"
  - name: "Exposure"
  - name: "Price"
  - name: "ClaimCost"
- name: "ExpenseType"
  description: "Categories of expenses incorporated into pricing."
  data:
  - name: "Fixed"
  - name: "Variable"
  - name: "ULAE"
  - name: "ALAE"
  - name: "Commission"
  - name: "TaxesFees"
- name: "ScenarioType"
  description: "Scenario categorization for sensitivity and what-if analyses."
