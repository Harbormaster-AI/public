---
metadata:
  name: "HCIDL Reinsurance Capabilities Model"
  description: "Canonical capability and information model for reinsurance operations\
    \ across placement, contract administration, cessions, accounting, claims, recoveries,\
    \ collateral, and events."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Insurance"
  type: "Capability"
  domain: "Reinsurance"
entities:
- name: "Reinsurer"
  description: "Legal entity that assumes reinsurance risk from cedents."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "domicileCountry"
    type: "String"
  - name: "isLloydsSyndicate"
    type: "Boolean"
  relations:
  - name: "signings"
    type: "Signing"
    multiplicity: "OneToMany"
  - name: "ratings"
    type: "Rating"
    multiplicity: "OneToMany"
  - name: "recoveries"
    type: "Recovery"
    multiplicity: "OneToMany"
  - name: "collateral"
    type: "Collateral"
    multiplicity: "OneToMany"
- name: "Cedent"
  description: "Insurance company that transfers a portion of its risk to reinsurers."
  data:
  - name: "name"
    type: "String"
  - name: "legalEntityType"
    type: "String"
  - name: "domicileCountry"
    type: "String"
  - name: "regulatoryIdentifier"
    type: "String"
  relations:
  - name: "programs"
    type: "ReinsuranceProgram"
    multiplicity: "OneToMany"
  - name: "claims"
    type: "CedentClaim"
    multiplicity: "OneToMany"
- name: "Broker"
  description: "Intermediary that places reinsurance between cedents and reinsurers."
  data:
  - name: "name"
    type: "String"
  - name: "brokerCode"
    type: "String"
  - name: "contact"
    type: "ContactInfo"
  relations:
  - name: "submissions"
    type: "Submission"
    multiplicity: "OneToMany"
  - name: "treaties"
    type: "Treaty"
    multiplicity: "OneToMany"
  - name: "settlements"
    type: "Settlement"
    multiplicity: "OneToMany"
  - name: "signings"
    type: "Signing"
    multiplicity: "OneToMany"
- name: "ReinsuranceProgram"
  description: "Annual or multi-year structure of treaties supporting a cedent’s lines\
    \ of business."
  data:
  - name: "programName"
    type: "String"
  - name: "underwritingYear"
    type: "Integer"
  - name: "primaryLineOfBusiness"
    type: "LineOfBusiness"
  - name: "description"
    type: "String"
  relations:
  - name: "cedent"
    type: "Cedent"
    multiplicity: "ManyToOne"
  - name: "treaties"
    type: "Treaty"
    multiplicity: "OneToMany"
- name: "Treaty"
  description: "Contractual agreement governing the cession and assumption of risk."
  data:
  - name: "treatyNumber"
    type: "String"
  - name: "treatyType"
    type: "TreatyType"
  - name: "basis"
    type: "ReinsuranceBasis"
  - name: "placementStatus"
    type: "PlacementStatus"
  - name: "inceptionDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "contractCurrency"
    type: "String"
  - name: "brokerage"
    type: "Percentage"
  - name: "governingLaw"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "program"
    type: "ReinsuranceProgram"
    multiplicity: "ManyToOne"
  - name: "broker"
    type: "Broker"
    multiplicity: "ManyToOne"
  - name: "cedent"
    type: "Cedent"
    multiplicity: "ManyToOne"
  - name: "layers"
    type: "TreatyLayer"
    multiplicity: "OneToMany"
  - name: "endorsements"
    type: "Endorsement"
    multiplicity: "OneToMany"
  - name: "statements"
    type: "StatementOfAccount"
    multiplicity: "OneToMany"
  - name: "submissions"
    type: "Submission"
    multiplicity: "OneToMany"
  - name: "commissionSchemes"
    type: "CommissionScheme"
    multiplicity: "OneToMany"
  - name: "contractWordings"
    type: "ContractWording"
    multiplicity: "OneToMany"
- name: "TreatyLayer"
  description: "Discrete layer within a treaty defining attachment, limits, and participant\
    \ shares."
  data:
  - name: "layerNumber"
    type: "Integer"
  - name: "attachmentPoint"
    type: "Money"
  - name: "limit"
    type: "Money"
  - name: "aggregateLimit"
    type: "Money"
  - name: "coinsuranceShare"
    type: "Percentage"
  - name: "rateOnLine"
    type: "Percentage"
  - name: "reinstatementCount"
    type: "Integer"
  relations:
  - name: "treaty"
    type: "Treaty"
    multiplicity: "ManyToOne"
  - name: "signings"
    type: "Signing"
    multiplicity: "OneToMany"
  - name: "premiums"
    type: "PremiumTransaction"
    multiplicity: "OneToMany"
  - name: "reinsuranceClaims"
    type: "ReinsuranceClaim"
    multiplicity: "OneToMany"
  - name: "bordereaux"
    type: "Bordereau"
    multiplicity: "OneToMany"
  - name: "cessions"
    type: "Cession"
    multiplicity: "OneToMany"
  - name: "aggregateTrackers"
    type: "AggregateLimitTracker"
    multiplicity: "OneToMany"
- name: "Submission"
  description: "Marketing package sent to reinsurers detailing terms and exposures\
    \ for placement."
  data:
  - name: "submissionReference"
    type: "String"
  - name: "submissionDate"
    type: "Date"
  - name: "status"
    type: "SubmissionStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "treaty"
    type: "Treaty"
    multiplicity: "ManyToOne"
  - name: "broker"
    type: "Broker"
    multiplicity: "ManyToOne"
  - name: "quotes"
    type: "Quote"
    multiplicity: "OneToMany"
- name: "Quote"
  description: "Indicative or firm terms offered by a reinsurer for a specific layer."
  data:
  - name: "quoteReference"
    type: "String"
  - name: "quoteDate"
    type: "Date"
  - name: "status"
    type: "QuoteStatus"
  - name: "offeredShare"
    type: "Percentage"
  - name: "quotedRateOnLine"
    type: "Percentage"
  - name: "notes"
    type: "String"
  relations:
  - name: "submission"
    type: "Submission"
    multiplicity: "ManyToOne"
  - name: "layer"
    type: "TreatyLayer"
    multiplicity: "ManyToOne"
  - name: "reinsurer"
    type: "Reinsurer"
    multiplicity: "ManyToOne"
- name: "FirmOrder"
  description: "Instruction from the cedent or broker to bind a reinsurer’s share\
    \ at agreed terms."
  data:
  - name: "orderReference"
    type: "String"
  - name: "orderDate"
    type: "Date"
  - name: "orderedShare"
    type: "Percentage"
  - name: "notes"
    type: "String"
  relations:
  - name: "layer"
    type: "TreatyLayer"
    multiplicity: "ManyToOne"
  - name: "reinsurer"
    type: "Reinsurer"
    multiplicity: "ManyToOne"
  - name: "broker"
    type: "Broker"
    multiplicity: "ManyToOne"
- name: "Signing"
  description: "Final record of bound participations and lines for a treaty layer."
  data:
  - name: "signedShare"
    type: "Percentage"
  - name: "signingDate"
    type: "Date"
  - name: "leader"
    type: "Boolean"
  - name: "orderOfSigning"
    type: "Integer"
  - name: "status"
    type: "SigningStatus"
  relations:
  - name: "layer"
    type: "TreatyLayer"
    multiplicity: "ManyToOne"
  - name: "reinsurer"
    type: "Reinsurer"
    multiplicity: "ManyToOne"
  - name: "firmOrder"
    type: "FirmOrder"
    multiplicity: "ManyToOne"
- name: "Endorsement"
  description: "Agreed amendment to the treaty that alters terms, limits, or conditions."
  data:
  - name: "endorsementNumber"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "status"
    type: "EndorsementStatus"
  - name: "description"
    type: "String"
  relations:
  - name: "treaty"
    type: "Treaty"
    multiplicity: "ManyToOne"
- name: "CommissionScheme"
  description: "Definition of brokerage, overriding, profit commission, or sliding\
    \ scale arrangements."
  data:
  - name: "schemeType"
    type: "CommissionType"
  - name: "rate"
    type: "Percentage"
  - name: "description"
    type: "String"
  relations:
  - name: "treaty"
    type: "Treaty"
    multiplicity: "ManyToOne"
- name: "ContractWording"
  description: "Structured wording content and clauses that define contractual obligations."
  data:
  - name: "title"
    type: "String"
  - name: "version"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "text"
    type: "String"
  relations:
  - name: "treaty"
    type: "Treaty"
    multiplicity: "ManyToOne"
- name: "Cession"
  description: "Allocation of specific policies or risks to a treaty or layer under\
    \ proportional terms or reporting arrangements."
  data:
  - name: "cessionNumber"
    type: "String"
  - name: "effectivePeriod"
    type: "DateRange"
  - name: "share"
    type: "Percentage"
  - name: "subjectPremium"
    type: "Money"
  - name: "description"
    type: "String"
  relations:
  - name: "treatyLayer"
    type: "TreatyLayer"
    multiplicity: "ManyToOne"
  - name: "exposureItems"
    type: "ExposureItem"
    multiplicity: "OneToMany"
  - name: "premiums"
    type: "PremiumTransaction"
    multiplicity: "OneToMany"
- name: "ExposureItem"
  description: "Insured risk or policy element reported under a cession, including\
    \ location and values."
  data:
  - name: "policyNumber"
    type: "String"
  - name: "insuredName"
    type: "String"
  - name: "riskLocation"
    type: "Address"
  - name: "classOfBusiness"
    type: "LineOfBusiness"
  - name: "sumInsured"
    type: "Money"
  - name: "attachment"
    type: "Money"
  - name: "limit"
    type: "Money"
  - name: "inceptionDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  relations:
  - name: "cession"
    type: "Cession"
    multiplicity: "ManyToOne"
- name: "Bordereau"
  description: "Periodic report listing risks, premiums, or claims for treaty administration."
  data:
  - name: "reference"
    type: "String"
  - name: "period"
    type: "DateRange"
  - name: "type"
    type: "BordereauType"
  - name: "receivedDate"
    type: "Date"
  - name: "status"
    type: "BordereauStatus"
  - name: "sourceSystem"
    type: "String"
  relations:
  - name: "layer"
    type: "TreatyLayer"
    multiplicity: "ManyToOne"
  - name: "rows"
    type: "BordereauRow"
    multiplicity: "OneToMany"
- name: "BordereauRow"
  description: "Row-level record within a bordereau containing premium and loss details."
  data:
  - name: "rowNumber"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "writtenPremium"
    type: "Money"
  - name: "brokerage"
    type: "Money"
  - name: "commission"
    type: "Money"
  - name: "tax"
    type: "Money"
  - name: "incurredLoss"
    type: "Money"
  relations:
  - name: "bordereau"
    type: "Bordereau"
    multiplicity: "ManyToOne"
  - name: "exposureItem"
    type: "ExposureItem"
    multiplicity: "ManyToOne"
- name: "PremiumTransaction"
  description: "Accounting transaction representing ceded premium activity for a layer\
    \ or cession."
  data:
  - name: "transactionReference"
    type: "String"
  - name: "transactionType"
    type: "PremiumTransactionType"
  - name: "bookingDate"
    type: "Date"
  - name: "accountingPeriod"
    type: "String"
  - name: "writtenPremium"
    type: "Money"
  - name: "earnedPremium"
    type: "Money"
  - name: "commissionRate"
    type: "Percentage"
  - name: "brokerageRate"
    type: "Percentage"
  - name: "taxAmount"
    type: "Money"
  - name: "netPremium"
    type: "Money"
  relations:
  - name: "treatyLayer"
    type: "TreatyLayer"
    multiplicity: "ManyToOne"
  - name: "statementOfAccount"
    type: "StatementOfAccount"
    multiplicity: "ManyToOne"
  - name: "cession"
    type: "Cession"
    multiplicity: "ManyToOne"
- name: "StatementOfAccount"
  description: "Periodic statement summarizing premium, claims, and net due for settlement."
  data:
  - name: "statementReference"
    type: "String"
  - name: "period"
    type: "DateRange"
  - name: "status"
    type: "StatementStatus"
  - name: "preparedDate"
    type: "Date"
  - name: "netDue"
    type: "Money"
  - name: "remarks"
    type: "String"
  relations:
  - name: "treaty"
    type: "Treaty"
    multiplicity: "ManyToOne"
  - name: "premiums"
    type: "PremiumTransaction"
    multiplicity: "OneToMany"
  - name: "claimMovements"
    type: "ClaimMovement"
    multiplicity: "OneToMany"
  - name: "cashCalls"
    type: "CashCall"
    multiplicity: "OneToMany"
  - name: "settlements"
    type: "Settlement"
    multiplicity: "OneToMany"
  - name: "technicalAccount"
    type: "TechnicalAccount"
    multiplicity: "OneToOne"
- name: "TechnicalAccount"
  description: "Ledger view of treaty results for a period including premium, commissions,\
    \ and loss activity."
  data:
  - name: "period"
    type: "DateRange"
  - name: "writtenPremium"
    type: "Money"
  - name: "earnedPremium"
    type: "Money"
  - name: "commissions"
    type: "Money"
  - name: "brokerage"
    type: "Money"
  - name: "claimsPaid"
    type: "Money"
  - name: "changeInReserves"
    type: "Money"
  - name: "recoveries"
    type: "Money"
  - name: "netResult"
    type: "Money"
  relations:
  - name: "treaty"
    type: "Treaty"
    multiplicity: "ManyToOne"
  - name: "statementOfAccount"
    type: "StatementOfAccount"
    multiplicity: "ManyToOne"
- name: "CedentClaim"
  description: "Underlying cedent claim record that may trigger reinsurance recoveries."
  data:
  - name: "claimNumber"
    type: "String"
  - name: "lossDate"
    type: "Date"
  - name: "notificationDate"
    type: "Date"
  - name: "policyNumber"
    type: "String"
  - name: "grossLoss"
    type: "Money"
  - name: "status"
    type: "CedentClaimStatus"
  - name: "description"
    type: "String"
  relations:
  - name: "cedent"
    type: "Cedent"
    multiplicity: "ManyToOne"
  - name: "event"
    type: "CatEvent"
    multiplicity: "ManyToOne"
  - name: "exposureItem"
    type: "ExposureItem"
    multiplicity: "ManyToOne"
  - name: "reinsuranceClaims"
    type: "ReinsuranceClaim"
    multiplicity: "OneToMany"
- name: "ReinsuranceClaim"
  description: "Ceded claim under a treaty layer with associated reserves, movements,\
    \ and recoveries."
  data:
  - name: "claimReference"
    type: "String"
  - name: "reportedDate"
    type: "Date"
  - name: "status"
    type: "ClaimStatus"
  - name: "cededLoss"
    type: "Money"
  - name: "allocatedLossExpense"
    type: "Money"
  - name: "description"
    type: "String"
  relations:
  - name: "treatyLayer"
    type: "TreatyLayer"
    multiplicity: "ManyToOne"
  - name: "cedentClaim"
    type: "CedentClaim"
    multiplicity: "ManyToOne"
  - name: "claimMovements"
    type: "ClaimMovement"
    multiplicity: "OneToMany"
  - name: "reserves"
    type: "Reserve"
    multiplicity: "OneToMany"
  - name: "recoveries"
    type: "Recovery"
    multiplicity: "OneToMany"
- name: "ClaimMovement"
  description: "Transactional change to a reinsurance claim including reserve adjustments\
    \ and payments."
  data:
  - name: "movementDate"
    type: "Date"
  - name: "movementType"
    type: "ClaimMovementType"
  - name: "amount"
    type: "Money"
  - name: "notes"
    type: "String"
  relations:
  - name: "reinsuranceClaim"
    type: "ReinsuranceClaim"
    multiplicity: "ManyToOne"
  - name: "statementOfAccount"
    type: "StatementOfAccount"
    multiplicity: "ManyToOne"
- name: "Reserve"
  description: "Balance representing expected future payments on a reinsurance claim."
  data:
  - name: "reserveType"
    type: "ReserveType"
  - name: "asOfDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  relations:
  - name: "reinsuranceClaim"
    type: "ReinsuranceClaim"
    multiplicity: "ManyToOne"
- name: "Recovery"
  description: "Amount collected or due from a reinsurer in respect of ceded losses."
  data:
  - name: "recoveryReference"
    type: "String"
  - name: "recoveryDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "method"
    type: "RecoveryMethod"
  relations:
  - name: "reinsuranceClaim"
    type: "ReinsuranceClaim"
    multiplicity: "ManyToOne"
  - name: "reinsurer"
    type: "Reinsurer"
    multiplicity: "ManyToOne"
  - name: "settlement"
    type: "Settlement"
    multiplicity: "ManyToOne"
- name: "CashCall"
  description: "Request for accelerated funding from reinsurers prior to final settlement."
  data:
  - name: "callReference"
    type: "String"
  - name: "callDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "CashCallStatus"
  - name: "reason"
    type: "String"
  relations:
  - name: "treaty"
    type: "Treaty"
    multiplicity: "ManyToOne"
  - name: "reinsuranceClaim"
    type: "ReinsuranceClaim"
    multiplicity: "ManyToOne"
  - name: "reinsurer"
    type: "Reinsurer"
    multiplicity: "ManyToOne"
  - name: "statementOfAccount"
    type: "StatementOfAccount"
    multiplicity: "ManyToOne"
- name: "Settlement"
  description: "Financial settlement of amounts due between cedent, broker, and reinsurer."
  data:
  - name: "settlementReference"
    type: "String"
  - name: "valueDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "direction"
    type: "SettlementDirection"
  - name: "status"
    type: "SettlementStatus"
  relations:
  - name: "statementOfAccount"
    type: "StatementOfAccount"
    multiplicity: "ManyToOne"
  - name: "broker"
    type: "Broker"
    multiplicity: "ManyToOne"
  - name: "reinsurer"
    type: "Reinsurer"
    multiplicity: "ManyToOne"
  - name: "recoveries"
    type: "Recovery"
    multiplicity: "OneToMany"
  - name: "collateral"
    type: "Collateral"
    multiplicity: "ManyToOne"
- name: "Collateral"
  description: "Security provided to mitigate counterparty credit risk on reinsurance\
    \ obligations."
  data:
  - name: "collateralReference"
    type: "String"
  - name: "collateralType"
    type: "CollateralType"
  - name: "amount"
    type: "Money"
  - name: "issueDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "status"
    type: "CollateralStatus"
  - name: "provider"
    type: "String"
  relations:
  - name: "treaty"
    type: "Treaty"
    multiplicity: "ManyToOne"
  - name: "reinsurer"
    type: "Reinsurer"
    multiplicity: "ManyToOne"
- name: "Rating"
  description: "External financial strength assessment assigned to a reinsurer."
  data:
  - name: "agencyName"
    type: "String"
  - name: "ratingGrade"
    type: "RatingGrade"
  - name: "outlook"
    type: "RatingOutlook"
  - name: "effectiveDate"
    type: "Date"
  relations:
  - name: "reinsurer"
    type: "Reinsurer"
    multiplicity: "ManyToOne"
- name: "CatEvent"
  description: "Catastrophic or notable event used to aggregate and allocate losses."
  data:
  - name: "eventCode"
    type: "String"
  - name: "name"
    type: "String"
  - name: "eventDate"
    type: "Date"
  - name: "peril"
    type: "Peril"
  - name: "region"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "cedentClaims"
    type: "CedentClaim"
    multiplicity: "OneToMany"
  - name: "reinsuranceClaims"
    type: "ReinsuranceClaim"
    multiplicity: "OneToMany"
- name: "AggregateLimitTracker"
  description: "Tracking of aggregate deductibles and limits consumed within a period\
    \ for a layer."
  data:
  - name: "period"
    type: "DateRange"
  - name: "aggregateLimit"
    type: "Money"
  - name: "aggregateDeductible"
    type: "Money"
  - name: "usedAmount"
    type: "Money"
  - name: "remainingAmount"
    type: "Money"
  relations:
  - name: "treatyLayer"
    type: "TreatyLayer"
    multiplicity: "ManyToOne"
enums:
- name: "TreatyType"
  description: "Categories of reinsurance structures commonly used in the market."
  data:
  - name: "QuotaShare"
  - name: "SurplusShare"
  - name: "WorkingExcessOfLoss"
  - name: "CatastropheExcessOfLoss"
  - name: "AggregateExcessOfLoss"
  - name: "StopLoss"
- name: "ReinsuranceBasis"
  description: "Basis on which coverage attaches and responds to losses."
  data:
  - name: "LossesOccurringDuring"
  - name: "RiskAttachingDuring"
  - name: "ClaimsMade"
- name: "PlacementStatus"
  description: "Lifecycle state of treaty placement."
  data:
  - name: "Draft"
  - name: "Marketed"
  - name: "Quoted"
  - name: "FirmOrder"
  - name: "Bound"
  - name: "Declined"
  - name: "NotTakenUp"
- name: "SubmissionStatus"
  description: "Status of a placement submission."
  data:
  - name: "Open"
  - name: "Quoted"
  - name: "Closed"
  - name: "Declined"
- name: "QuoteStatus"
  description: "Standing of a reinsurer’s quote."
  data:
  - name: "Offered"
  - name: "Withdrawn"
  - name: "FirmOrderReceived"
  - name: "Declined"
- name: "SigningStatus"
  description: "State of a reinsurer’s bound share on a layer."
  data:
  - name: "Pending"
  - name: "Signed"
  - name: "NotSigned"
- name: "EndorsementStatus"
  description: "Status of a treaty endorsement."
  data:
  - name: "Proposed"
  - name: "Agreed"
  - name: "Superseded"
- name: "LineOfBusiness"
  description: "High-level insurance classes supported by reinsurance programs."
  data:
  - name: "Property"
  - name: "Casualty"
  - name: "Marine"
  - name: "Energy"
  - name: "Aviation"
  - name: "CreditSurety"
  - name: "Life"
  - name: "Health"
  - name: "Agriculture"
- name: "BordereauType"
  description: "Type of data reported within a bordereau."
