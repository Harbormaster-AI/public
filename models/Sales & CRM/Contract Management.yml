---
metadata:
  name: "HCIDL Contract Management Capabilities Model"
  description: "Capability model for authoring, negotiating, approving, executing,\
    \ and governing commercial contracts, including obligations, pricing, renewals,\
    \ and termination."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Sales & CRM"
  type: "Capability"
  domain: "Contract Management"
entities:
- name: "Organization"
  description: "Legal entity that can author, approve, or sign contracts and that\
    \ may serve as a contracting party."
  data:
  - name: "legalName"
    type: "String"
  - name: "tradeName"
    type: "String"
  - name: "registeredAddress"
    type: "Address"
  - name: "website"
    type: "String"
  - name: "industry"
    type: "String"
  relations:
  - name: "contacts"
    type: "Contact"
    multiplicity: "OneToMany"
  - name: "contractParties"
    type: "ContractParty"
    multiplicity: "OneToMany"
- name: "Contact"
  description: "Individual person associated with an organization who participates\
    \ in negotiations, approvals, or signatures."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "jobTitle"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "contractRoles"
    type: "ContractParty"
    multiplicity: "OneToMany"
- name: "ClauseLibrary"
  description: "Curated collection of standard and alternative clauses used to assemble\
    \ templates and contracts."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "String"
  - name: "language"
    type: "String"
  relations:
  - name: "clauses"
    type: "Clause"
    multiplicity: "OneToMany"
  - name: "templates"
    type: "ContractTemplate"
    multiplicity: "OneToMany"
- name: "Clause"
  description: "Reusable contractual provision with standard wording and categorization."
  data:
  - name: "referenceCode"
    type: "String"
  - name: "title"
    type: "String"
  - name: "clauseCategory"
    type: "ClauseCategory"
  - name: "bodyText"
    type: "String"
  - name: "defaultJurisdiction"
    type: "String"
  - name: "isMandatory"
    type: "Boolean"
  relations:
  - name: "library"
    type: "ClauseLibrary"
    multiplicity: "ManyToOne"
  - name: "templates"
    type: "ContractTemplate"
    multiplicity: "ManyToMany"
- name: "ContractTemplate"
  description: "Structured blueprint of a contract including layout, clause set, and\
    \ default terms."
  data:
  - name: "name"
    type: "String"
  - name: "templateType"
    type: "ContractType"
  - name: "versionLabel"
    type: "String"
  - name: "isDefault"
    type: "Boolean"
  - name: "jurisdiction"
    type: "String"
  - name: "governingLaw"
    type: "String"
  relations:
  - name: "clauses"
    type: "Clause"
    multiplicity: "ManyToMany"
- name: "Contract"
  description: "Executable agreement between parties defining obligations, pricing,\
    \ and terms over a specified period."
  data:
  - name: "contractNumber"
    type: "String"
  - name: "title"
    type: "String"
  - name: "contractType"
    type: "ContractType"
  - name: "status"
    type: "ContractStatus"
  - name: "confidentiality"
    type: "ConfidentialityLevel"
  - name: "governingLaw"
    type: "String"
  - name: "jurisdiction"
    type: "String"
  - name: "effectivePeriod"
    type: "DateRange"
  - name: "totalValue"
    type: "Money"
  - name: "autoRenew"
    type: "Boolean"
  relations:
  - name: "template"
    type: "ContractTemplate"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "ContractVersion"
    multiplicity: "OneToMany"
  - name: "parties"
    type: "ContractParty"
    multiplicity: "OneToMany"
  - name: "lineItems"
    type: "ContractLineItem"
    multiplicity: "OneToMany"
  - name: "approvalWorkflow"
    type: "ApprovalWorkflow"
    multiplicity: "OneToOne"
  - name: "signatures"
    type: "Signature"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "obligations"
    type: "Obligation"
    multiplicity: "OneToMany"
  - name: "milestones"
    type: "Milestone"
    multiplicity: "OneToMany"
  - name: "serviceLevels"
    type: "ServiceLevel"
    multiplicity: "OneToMany"
  - name: "paymentSchedule"
    type: "PaymentSchedule"
    multiplicity: "OneToOne"
  - name: "amendments"
    type: "Amendment"
    multiplicity: "OneToMany"
  - name: "renewalOptions"
    type: "RenewalOption"
    multiplicity: "OneToMany"
  - name: "termination"
    type: "Termination"
    multiplicity: "OneToOne"
  - name: "complianceRequirements"
    type: "ComplianceRequirement"
    multiplicity: "ManyToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "auditTrail"
    type: "AuditEvent"
    multiplicity: "OneToMany"
  - name: "envelope"
    type: "ESignatureEnvelope"
    multiplicity: "OneToOne"
- name: "ContractVersion"
  description: "Snapshot of the contract text, clauses, and terms at a specific revision\
    \ during drafting or negotiation."
  data:
  - name: "versionNumber"
    type: "String"
  - name: "status"
    type: "VersionStatus"
  - name: "createdDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "negotiationThreads"
    type: "NegotiationThread"
    multiplicity: "OneToMany"
  - name: "redlines"
    type: "RedlineChange"
    multiplicity: "OneToMany"
  - name: "previousVersion"
    type: "ContractVersion"
    multiplicity: "ManyToOne"
- name: "ContractParty"
  description: "Role-based association of an organization or contact to a specific\
    \ contract instance."
  data:
  - name: "role"
    type: "PartyRole"
  - name: "signingAuthority"
    type: "String"
  - name: "contactEmail"
    type: "EmailAddress"
  - name: "contactPhone"
    type: "PhoneNumber"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "ContractLineItem"
  description: "Commercial component of the contract representing a product, service,\
    \ fee, discount, or tax."
  data:
  - name: "lineType"
    type: "LineItemType"
  - name: "description"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "unitOfMeasure"
    type: "String"
  - name: "unitPrice"
    type: "Money"
  - name: "lineAmount"
    type: "Money"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
- name: "ApprovalWorkflow"
  description: "Orchestrated sequence of approval steps governing contract authorization."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "WorkflowStatus"
  - name: "startedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "steps"
    type: "ApprovalStep"
    multiplicity: "OneToMany"
- name: "ApprovalStep"
  description: "Discrete approval task assigned to a specific approver with due dates\
    \ and decision outcome."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "approverType"
    type: "ApproverType"
  - name: "status"
    type: "ApprovalStatus"
  - name: "dueDate"
    type: "Date"
  - name: "decisionDate"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "workflow"
    type: "ApprovalWorkflow"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "ESignatureEnvelope"
  description: "Electronic signature container issued by a provider to route and collect\
    \ signatures."
  data:
  - name: "provider"
    type: "String"
  - name: "envelopeNumber"
    type: "String"
  - name: "status"
    type: "EnvelopeStatus"
  - name: "sentAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "signatures"
    type: "Signature"
    multiplicity: "OneToMany"
- name: "Signature"
  description: "Evidence of execution captured via wet ink, electronic acceptance,\
    \ or digital certificate."
  data:
  - name: "method"
    type: "SignatureMethod"
  - name: "signatureStatus"
    type: "SignatureStatus"
  - name: "signedAt"
    type: "Date"
  - name: "reason"
    type: "String"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "signer"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "envelope"
    type: "ESignatureEnvelope"
    multiplicity: "ManyToOne"
- name: "Document"
  description: "File artifact stored with the contract such as drafts, executed copies,\
    \ or supporting exhibits."
  data:
  - name: "title"
    type: "String"
  - name: "fileName"
    type: "String"
  - name: "mimeType"
    type: "String"
  - name: "versionLabel"
    type: "String"
  - name: "uploadedAt"
    type: "Date"
  - name: "isExecutedCopy"
    type: "Boolean"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "uploadedBy"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "contractVersion"
    type: "ContractVersion"
    multiplicity: "ManyToOne"
- name: "NegotiationThread"
  description: "Topic-based channel capturing exchanges during redlining and discussions."
  data:
  - name: "topic"
    type: "String"
  - name: "openedAt"
    type: "Date"
  - name: "closedAt"
    type: "Date"
  - name: "status"
    type: "NegotiationStatus"
  relations:
  - name: "contractVersion"
    type: "ContractVersion"
    multiplicity: "ManyToOne"
  - name: "messages"
    type: "NegotiationMessage"
    multiplicity: "OneToMany"
- name: "NegotiationMessage"
  description: "Single communication posted within a negotiation thread, with audience\
    \ visibility."
  data:
  - name: "postedAt"
    type: "Date"
  - name: "authorRole"
    type: "PartyRole"
  - name: "visibility"
    type: "MessageVisibility"
  - name: "content"
    type: "String"
  relations:
  - name: "thread"
    type: "NegotiationThread"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "RedlineChange"
  description: "Structured representation of edits proposed to contract language during\
    \ negotiation."
  data:
  - name: "sectionReference"
    type: "String"
  - name: "changeType"
    type: "ChangeType"
  - name: "beforeText"
    type: "String"
  - name: "afterText"
    type: "String"
  - name: "resolved"
    type: "Boolean"
  relations:
  - name: "contractVersion"
    type: "ContractVersion"
    multiplicity: "ManyToOne"
  - name: "proposedBy"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "Obligation"
  description: "Actionable duty resulting from contract terms with due dates and completion\
    \ tracking."
  data:
  - name: "name"
    type: "String"
  - name: "obligationType"
    type: "ObligationType"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "ObligationStatus"
  - name: "monetaryImpact"
    type: "Money"
  - name: "description"
    type: "String"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "responsibleParty"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "relatedMilestone"
    type: "Milestone"
    multiplicity: "ManyToOne"
- name: "Milestone"
  description: "Key date or event used to coordinate deliverables, obligations, or\
    \ billing."
  data:
  - name: "name"
    type: "String"
  - name: "targetDate"
    type: "Date"
  - name: "status"
    type: "MilestoneStatus"
  - name: "description"
    type: "String"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "obligations"
    type: "Obligation"
    multiplicity: "OneToMany"
- name: "ServiceLevel"
  description: "Commitment within the contract that defines measurable performance\
    \ targets."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "measurementPeriodDays"
    type: "Integer"
  - name: "breachImpact"
    type: "String"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "metrics"
    type: "ServiceLevelMetric"
    multiplicity: "OneToMany"
  - name: "breaches"
    type: "BreachRecord"
    multiplicity: "OneToMany"
- name: "ServiceLevelMetric"
  description: "Quantitative definition of a service level including target and unit."
  data:
  - name: "metricName"
    type: "String"
  - name: "targetValue"
    type: "Decimal"
  - name: "comparator"
    type: "ComparisonOperator"
  - name: "unit"
    type: "String"
  relations:
  - name: "serviceLevel"
    type: "ServiceLevel"
    multiplicity: "ManyToOne"
- name: "BreachRecord"
  description: "Observation of performance against a service level indicating compliance\
    \ or breach."
  data:
  - name: "observedAt"
    type: "Date"
  - name: "measuredValue"
    type: "Decimal"
  - name: "status"
    type: "BreachStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "serviceLevel"
    type: "ServiceLevel"
    multiplicity: "ManyToOne"
- name: "PaymentSchedule"
  description: "Plan that structures the timing and frequency of payments under the\
    \ contract."
  data:
  - name: "scheduleName"
    type: "String"
  - name: "totalAmount"
    type: "Money"
  - name: "frequency"
    type: "PaymentFrequency"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "installments"
    type: "Installment"
    multiplicity: "OneToMany"
- name: "Installment"
  description: "Specific payment due under a payment schedule with status tracking."
  data:
  - name: "dueDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "PaymentStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "paymentSchedule"
    type: "PaymentSchedule"
    multiplicity: "ManyToOne"
- name: "Amendment"
  description: "Authorized modification to an executed contract that alters scope,\
    \ price, or terms."
  data:
  - name: "amendmentNumber"
    type: "String"
  - name: "reason"
    type: "AmendmentReason"
  - name: "effectiveDate"
    type: "Date"
  - name: "status"
    type: "AmendmentStatus"
  - name: "summary"
    type: "String"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "affectedVersion"
    type: "ContractVersion"
    multiplicity: "ManyToOne"
- name: "RenewalOption"
  description: "Provision defining how a contract can renew, including term, notice,\
    \ and decision status."
  data:
  - name: "renewalType"
    type: "RenewalType"
  - name: "noticePeriodDays"
    type: "Integer"
  - name: "termMonths"
    type: "Integer"
  - name: "isAutoRenew"
    type: "Boolean"
  - name: "status"
    type: "RenewalStatus"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
- name: "Termination"
  description: "Record of contract cessation including cause, effective date, and\
    \ any fees."
  data:
  - name: "terminationType"
    type: "TerminationType"
  - name: "effectiveDate"
    type: "Date"
  - name: "cause"
    type: "String"
  - name: "fees"
    type: "Money"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "initiatedBy"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "ComplianceRequirement"
  description: "Regulatory or policy obligation that the contract must satisfy."
  data:
  - name: "name"
    type: "String"
  - name: "regulation"
    type: "String"
  - name: "description"
    type: "String"
  - name: "required"
    type: "Boolean"
  relations:
  - name: "contracts"
    type: "Contract"
    multiplicity: "ManyToMany"
  - name: "owner"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "RiskAssessment"
  description: "Evaluation of contractual risk based on content, counterparty profile,\
    \ and deviations from standards."
  data:
  - name: "score"
    type: "Integer"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "assessedAt"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "assessedBy"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "AuditEvent"
  description: "Immutable event log entry capturing key lifecycle actions for traceability."
  data:
  - name: "eventType"
    type: "AuditEventType"
  - name: "occurredAt"
    type: "Date"
  - name: "actorName"
    type: "String"
  - name: "details"
    type: "String"
  relations:
  - name: "contract"
    type: "Contract"
    multiplicity: "ManyToOne"
  - name: "actor"
    type: "Contact"
    multiplicity: "ManyToOne"
enums:
- name: "ContractType"
  description: "Classification of contract purpose and commercial construct."
  data:
  - name: "MasterServiceAgreement"
  - name: "SubscriptionAgreement"
  - name: "StatementOfWork"
  - name: "PurchaseAgreement"
  - name: "PartnershipAgreement"
  - name: "NonDisclosureAgreement"
  - name: "LicenseAgreement"
- name: "ContractStatus"
  description: "Overall lifecycle state of the contract."
  data:
  - name: "Draft"
  - name: "UnderReview"
  - name: "PendingApproval"
  - name: "Approved"
  - name: "Active"
  - name: "Suspended"
  - name: "Expired"
  - name: "Terminated"
  - name: "Archived"
- name: "ConfidentialityLevel"
  description: "Sensitivity classification controlling contract visibility and handling."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Confidential"
  - name: "Restricted"
- name: "ClauseCategory"
  description: "Thematic grouping used to organize clauses in libraries and templates."
  data:
  - name: "Confidentiality"
  - name: "PaymentTerms"
  - name: "Termination"
  - name: "Liability"
  - name: "Warranty"
  - name: "IntellectualProperty"
  - name: "GoverningLaw"
  - name: "Delivery"
  - name: "ServiceLevels"
- name: "VersionStatus"
  description: "Editorial state of a specific contract revision."
  data:
  - name: "Draft"
  - name: "InNegotiation"
  - name: "Approved"
  - name: "Superseded"
  - name: "Rejected"
- name: "WorkflowStatus"
  description: "Progress of the approval workflow controlling authorization to execute."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
- name: "ApproverType"
  description: "Mechanism by which approver responsibility is assigned."
  data:
  - name: "RoleBased"
  - name: "NamedUser"
  - name: "Group"
  - name: "External"
- name: "ApprovalStatus"
  description: "Outcome state of an approval step."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
  - name: "Skipped"
- name: "SignatureMethod"
  description: "Technique used to capture execution consent."
  data:
  - name: "WetInk"
  - name: "Electronic"
  - name: "DigitalCertificate"
  - name: "Clickwrap"
- name: "SignatureStatus"
  description: "Lifecycle state of an individual signature."
  data:
  - name: "Requested"
  - name: "Signed"
  - name: "Declined"
  - name: "Withdrawn"
- name: "EnvelopeStatus"
  description: "Routing status of an e-signature envelope at the provider."
  data:
  - name: "Created"
  - name: "Sent"
  - name: "PartiallySigned"
  - name: "Completed"
  - name: "Void"
- name: "PartyRole"
  description: "Contractual capacity assigned to a participant."
  data:
  - name: "Buyer"
  - name: "Seller"
  - name: "Customer"
  - name: "Supplier"
  - name: "Guarantor"
  - name: "Signer"
  - name: "Approver"
- name: "ObligationType"
  description: "Category of duty arising under the agreement."
  data:
  - name: "Payment"
  - name: "Delivery"
  - name: "Reporting"
  - name: "Compliance"
  - name: "Notice"
- name: "ObligationStatus"
  description: "Fulfillment progress of a contractual obligation."
  data:
  - name: "Pending"
  - name: "InProgress"
  - name: "Fulfilled"
  - name: "Overdue"
  - name: "Waived"
- name: "MilestoneStatus"
  description: "Achievement state of a milestone that anchors obligations or billing."
  data:
  - name: "Planned"
  - name: "Achieved"
  - name: "Missed"
  - name: "Cancelled"
- name: "PaymentFrequency"
  description: "Cadence applied to recurring invoices or scheduled payments."
  data:
  - name: "OneTime"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Yearly"
  - name: "MilestoneBased"
- name: "PaymentStatus"
  description: "Settlement state of a scheduled installment."
  data:
  - name: "Scheduled"
  - name: "Invoiced"
  - name: "Paid"
  - name: "PartiallyPaid"
  - name: "Overdue"
  - name: "Waived"
- name: "LineItemType"
  description: "Commercial classification of a contract line."
  data:
  - name: "Product"
  - name: "Service"
  - name: "Fee"
  - name: "Discount"
  - name: "Tax"
- name: "AmendmentReason"
  description: "Business driver that prompted a contract amendment."
  data:
  - name: "ScopeChange"
  - name: "PricingUpdate"
  - name: "TermExtension"
  - name: "Correction"
  - name: "Regulatory"
  - name: "Other"
- name: "AmendmentStatus"
  description: "Lifecycle state of an amendment record."
  data:
  - name: "Proposed"
  - name: "Accepted"
  - name: "Rejected"
  - name: "Implemented"
  - name: "Withdrawn"
- name: "RenewalType"
