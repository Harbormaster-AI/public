---
metadata:
  name: "Opportunity Management Capability Model"
  description: "Canonical HCIDL model describing the lifecycle, data, and relationships\
    \ used to qualify, advance, and close sales opportunities."
  version: "1.0.0"
  industry: "All industries"
  category: "Sales & CRM"
  type: "Capability"
  domain: "Opportunity Management"
entities:
- name: "Account"
  description: "Organization or household that may purchase products or services and\
    \ is the primary commercial party for opportunities."
  data:
  - name: "name"
    type: "String"
  - name: "accountType"
    type: "AccountType"
  - name: "industry"
    type: "String"
  - name: "website"
    type: "String"
  - name: "billingAddress"
    type: "Address"
  - name: "shippingAddress"
    type: "Address"
  - name: "annualRevenue"
    type: "Money"
  - name: "numberOfEmployees"
    type: "Integer"
  relations:
  - name: "contacts"
    type: "Contact"
    multiplicity: "OneToMany"
  - name: "opportunities"
    type: "Opportunity"
    multiplicity: "OneToMany"
  - name: "parentAccount"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "childAccounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "salesTerritory"
    type: "SalesTerritory"
    multiplicity: "ManyToOne"
- name: "Contact"
  description: "Individual person associated with an account who has a role in the\
    \ buying process."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "jobTitle"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "PhoneNumber"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "opportunityRoles"
    type: "OpportunityContactRole"
    multiplicity: "OneToMany"
  - name: "engagements"
    type: "Engagement"
    multiplicity: "OneToMany"
- name: "Seller"
  description: "Internal or partner salesperson responsible for developing and closing\
    \ opportunities."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "PhoneNumber"
  - name: "role"
    type: "SellerRole"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "ownedOpportunities"
    type: "Opportunity"
    multiplicity: "OneToMany"
  - name: "teamMemberships"
    type: "SalesTeamMember"
    multiplicity: "OneToMany"
  - name: "engagements"
    type: "Engagement"
    multiplicity: "OneToMany"
  - name: "territories"
    type: "SalesTerritory"
    multiplicity: "ManyToMany"
- name: "SalesTerritory"
  description: "Logical selling area used to assign accounts and opportunities to\
    \ sellers."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "sellers"
    type: "Seller"
    multiplicity: "ManyToMany"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "opportunities"
    type: "Opportunity"
    multiplicity: "OneToMany"
- name: "Opportunity"
  description: "Qualified sales initiative with defined scope, amount, and expected\
    \ close date."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "OpportunityStatus"
  - name: "leadSource"
    type: "LeadSource"
  - name: "closeDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "winProbability"
    type: "Percentage"
  - name: "forecastCategory"
    type: "ForecastCategory"
  - name: "closeReason"
    type: "CloseReason"
  - name: "notes"
    type: "String"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "salesStage"
    type: "SalesStage"
    multiplicity: "ManyToOne"
  - name: "lineItems"
    type: "OpportunityLineItem"
    multiplicity: "OneToMany"
  - name: "teamMembers"
    type: "SalesTeamMember"
    multiplicity: "OneToMany"
  - name: "competitorAssessments"
    type: "CompetitorAssessment"
    multiplicity: "OneToMany"
  - name: "engagements"
    type: "Engagement"
    multiplicity: "OneToMany"
  - name: "changeHistory"
    type: "OpportunityChange"
    multiplicity: "OneToMany"
  - name: "sourceCampaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
  - name: "territory"
    type: "SalesTerritory"
    multiplicity: "ManyToOne"
- name: "SalesStage"
  description: "Configurable milestone in the sales process reflecting customer commitment\
    \ and seller activities."
  data:
  - name: "name"
    type: "String"
  - name: "sequence"
    type: "Integer"
  - name: "stageType"
    type: "StageType"
  - name: "defaultProbability"
    type: "Percentage"
  - name: "forecastCategory"
    type: "ForecastCategory"
  - name: "exitCriteria"
    type: "String"
  relations:
  - name: "nextStages"
    type: "SalesStage"
    multiplicity: "ManyToMany"
  - name: "opportunities"
    type: "Opportunity"
    multiplicity: "OneToMany"
- name: "OpportunityLineItem"
  description: "Product or service entry associated with an opportunity including\
    \ pricing and discounts."
  data:
  - name: "quantity"
    type: "Decimal"
  - name: "unitPrice"
    type: "Money"
  - name: "discountPercent"
    type: "Percentage"
  - name: "discountAmount"
    type: "Money"
  - name: "lineAmount"
    type: "Money"
  - name: "productName"
    type: "String"
  relations:
  - name: "opportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "priceBookEntry"
    type: "PriceBookEntry"
    multiplicity: "ManyToOne"
- name: "Product"
  description: "Sellable item or service available for inclusion in opportunities."
  data:
  - name: "name"
    type: "String"
  - name: "sku"
    type: "String"
  - name: "productFamily"
    type: "ProductFamily"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "priceBookEntries"
    type: "PriceBookEntry"
    multiplicity: "OneToMany"
  - name: "lineItems"
    type: "OpportunityLineItem"
    multiplicity: "OneToMany"
- name: "PriceBook"
  description: "Catalog of list prices for products in a specific currency and timeframe."
  data:
  - name: "name"
    type: "String"
  - name: "currency"
    type: "String"
  - name: "effective"
    type: "DateRange"
  - name: "isDefault"
    type: "Boolean"
  relations:
  - name: "entries"
    type: "PriceBookEntry"
    multiplicity: "OneToMany"
- name: "PriceBookEntry"
  description: "Price definition of a product within a specific price book."
  data:
  - name: "unitPrice"
    type: "Money"
  - name: "effective"
    type: "DateRange"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "priceBook"
    type: "PriceBook"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "lineItems"
    type: "OpportunityLineItem"
    multiplicity: "OneToMany"
- name: "OpportunityContactRole"
  description: "Association of a contact to an opportunity with a defined buying role\
    \ and influence."
  data:
  - name: "buyingRole"
    type: "BuyingRole"
  - name: "influenceLevel"
    type: "InfluenceLevel"
  - name: "primary"
    type: "Boolean"
  relations:
  - name: "opportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "Competitor"
  description: "Alternative supplier or solution considered by the customer in the\
    \ deal."
  data:
  - name: "name"
    type: "String"
  - name: "website"
    type: "String"
  - name: "description"
    type: "String"
  - name: "typicalStrengths"
    type: "String"
  - name: "typicalWeaknesses"
    type: "String"
  relations:
  - name: "assessments"
    type: "CompetitorAssessment"
    multiplicity: "OneToMany"
- name: "CompetitorAssessment"
  description: "Evaluation of a competitor within the context of a specific opportunity."
  data:
  - name: "position"
    type: "CompetitorPosition"
  - name: "perceivedRisk"
    type: "RiskLevel"
  - name: "notes"
    type: "String"
  relations:
  - name: "opportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
  - name: "competitor"
    type: "Competitor"
    multiplicity: "ManyToOne"
- name: "SalesTeamMember"
  description: "Member of the extended deal team with a defined role and access level\
    \ for an opportunity."
  data:
  - name: "teamRole"
    type: "TeamRole"
  - name: "accessLevel"
    type: "AccessLevel"
  relations:
  - name: "opportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
- name: "Engagement"
  description: "Planned or completed activity used to advance the opportunity, such\
    \ as calls, meetings, or demos."
  data:
  - name: "subject"
    type: "String"
  - name: "activityType"
    type: "ActivityType"
  - name: "status"
    type: "ActivityStatus"
  - name: "dueDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "owner"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "opportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "OpportunityChange"
  description: "Immutable log of significant updates to an opportunity for audit and\
    \ analysis."
  data:
  - name: "changeType"
    type: "OpportunityChangeType"
  - name: "changedAt"
    type: "Date"
  - name: "fieldName"
    type: "String"
  - name: "fromValue"
    type: "String"
  - name: "toValue"
    type: "String"
  relations:
  - name: "opportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
  - name: "changedBy"
    type: "Seller"
    multiplicity: "ManyToOne"
- name: "Campaign"
  description: "Marketing initiative that may generate or influence opportunities."
  data:
  - name: "name"
    type: "String"
  - name: "channel"
    type: "CampaignChannel"
  - name: "schedule"
    type: "DateRange"
  - name: "budget"
    type: "Money"
  - name: "description"
    type: "String"
  relations:
  - name: "opportunities"
    type: "Opportunity"
    multiplicity: "OneToMany"
enums:
- name: "OpportunityStatus"
  description: "Lifecycle states used to indicate the overall disposition of an opportunity."
  data:
  - name: "Draft"
  - name: "Open"
  - name: "OnHold"
  - name: "Won"
  - name: "Lost"
  - name: "Abandoned"
- name: "ForecastCategory"
  description: "Classification of an opportunity for forecasting accuracy and roll-up."
  data:
  - name: "Pipeline"
  - name: "BestCase"
  - name: "Commit"
  - name: "Omitted"
  - name: "Closed"
- name: "StageType"
  description: "Semantic category of a sales stage within the selling methodology."
  data:
  - name: "Qualification"
  - name: "Discovery"
  - name: "Solutioning"
  - name: "Proposal"
  - name: "Evaluation"
  - name: "Negotiation"
  - name: "Closure"
- name: "BuyingRole"
  description: "Role a contact plays within the customer’s buying group."
  data:
  - name: "DecisionMaker"
  - name: "EconomicBuyer"
  - name: "TechnicalEvaluator"
  - name: "Influencer"
  - name: "EndUser"
  - name: "Coach"
  - name: "Blocker"
- name: "InfluenceLevel"
  description: "Degree of influence a contact has on the purchase decision."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "ActivityType"
  description: "Type of engagement used to progress a deal."
  data:
  - name: "Call"
  - name: "Meeting"
  - name: "Email"
  - name: "Task"
  - name: "Demo"
  - name: "Workshop"
- name: "ActivityStatus"
  description: "Execution status of an engagement activity."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
  - name: "Deferred"
  - name: "Cancelled"
- name: "CloseReason"
  description: "Outcome reason for deal closure, whether won or lost."
  data:
  - name: "WonByValue"
  - name: "WonByRelationship"
  - name: "LostOnPrice"
  - name: "LostOnCapability"
  - name: "LostToCompetitor"
  - name: "NoDecision"
  - name: "Withdrawn"
- name: "UnitOfMeasure"
  description: "Units used to quantify product line items."
  data:
  - name: "Each"
  - name: "Hour"
  - name: "License"
  - name: "Seat"
  - name: "Bundle"
- name: "ProductFamily"
  description: "Logical grouping of products for reporting and pricing policy."
  data:
  - name: "Software"
  - name: "Service"
  - name: "Hardware"
  - name: "Subscription"
  - name: "Training"
- name: "SellerRole"
  description: "Functional role of a seller participating in an opportunity."
  data:
  - name: "SalesRep"
  - name: "SalesManager"
  - name: "SalesEngineer"
  - name: "Executive"
  - name: "PartnerRep"
- name: "AccountType"
  description: "Relationship classification between the selling organization and the\
    \ account."
  data:
  - name: "Prospect"
  - name: "Customer"
  - name: "Partner"
- name: "OpportunityChangeType"
  description: "Categories of tracked updates recorded in the opportunity change log."
  data:
  - name: "StageChanged"
  - name: "AmountUpdated"
  - name: "ProbabilityUpdated"
  - name: "OwnerChanged"
  - name: "TerritoryChanged"
  - name: "CloseDateUpdated"
  - name: "CompetitorAdded"
  - name: "CompetitorRemoved"
- name: "CompetitorPosition"
  description: "Relative standing of a competitor within a deal context."
  data:
  - name: "Primary"
  - name: "Secondary"
  - name: "Incumbent"
  - name: "Emerging"
- name: "RiskLevel"
  description: "Assessment of risk posed to winning the opportunity."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
- name: "CampaignChannel"
  description: "Primary channel through which a marketing campaign engages prospects."
  data:
  - name: "Email"
  - name: "Event"
  - name: "Webinar"
  - name: "Social"
  - name: "Advertising"
  - name: "Partner"
- name: "TeamRole"
  description: "Functional responsibility a team member holds on the deal team."
  data:
  - name: "Owner"
  - name: "CoOwner"
  - name: "SalesEngineer"
  - name: "ExecutiveSponsor"
  - name: "PartnerRep"
- name: "AccessLevel"
  description: "Level of access granted to a team member for an opportunity."
  data:
  - name: "View"
  - name: "Edit"
  - name: "Manage"
- name: "LeadSource"
  description: "Origin of the opportunity indicating how the selling motion was initiated."
  data:
  - name: "Inbound"
  - name: "Outbound"
  - name: "Referral"
  - name: "Partner"
  - name: "Event"
  - name: "Campaign"
  - name: "Other"
valueObjects:
- name: "Money"
  description: "Monetary amount expressed in a specific currency using major units."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Percentage"
  description: "Numeric percentage value expressed as a decimal between 0 and 100."
  data:
  - name: "value"
    type: "Decimal"
- name: "DateRange"
  description: "Inclusive date interval with a defined start and end."
  data:
  - name: "start"
    type: "Date"
  - name: "end"
    type: "Date"
- name: "Address"
  description: "Postal address used for correspondence and fulfillment."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "region"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "PhoneNumber"
  description: "Dialable telephone number stored as entered, including country and\
    \ area codes."
  data:
  - name: "value"
    type: "String"
