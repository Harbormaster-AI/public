metadata:
  name: "Marketing Industry Domain Model"
  description: "HCIDL model capturing core marketing strategy, planning, activation,\
    \ audiences, content, data collection, experimentation, and measurement capabilities."
  version: "1.0.0"
  industry: "Marketing"
  category: "Sales & CRM"
  language: "English"
  type: "Industry"
  domain: "Marketing"
enums:
- name: "IndustryVertical"
  description: "Classification of the advertiser’s business domain."
  data:
  - name: "Retail"
  - name: "Ecommerce"
  - name: "SaaS"
  - name: "Finance"
  - name: "Healthcare"
  - name: "Travel"
  - name: "Education"
  - name: "Media"
  - name: "Nonprofit"
  - name: "B2B"
  - name: "B2C"
- name: "AgencyType"
