    type: "String"
  - name: "legalName"
    type: "String"
  - name: "website"
    type: "URL"
  - name: "industry"
    type: "IndustryVertical"
  relations:
  - name: "brands"
    type: "Brand"
    multiplicity: "OneToMany"
  - name: "platformAccounts"
    type: "PlatformAccount"
    multiplicity: "OneToMany"
  - name: "agencies"
    type: "Agency"
    multiplicity: "ManyToMany"
  - name: "campaigns"
    type: "Campaign"
    multiplicity: "OneToMany"
- name: "Agency"
