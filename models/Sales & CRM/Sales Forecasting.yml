---
metadata:
  name: "Sales Forecasting Capabilities Model"
  description: "Canonical capability model for sales forecasting, covering pipeline,\
    \ quotas, rollups, adjustments, and scenario planning across sales organizations."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Sales & CRM"
  type: "Capability"
  domain: "Sales Forecasting"
entities:
- name: "SalesOrganization"
  description: "Enterprise-level sales context that contains forecasting settings\
    \ and master data."
  data:
  - name: "name"
    type: "String"
  - name: "industrySector"
    type: "String"
  - name: "baseCurrency"
    type: "String"
  - name: "forecastGranularity"
    type: "TimeGranularity"
  - name: "defaultForecastCategory"
    type: "ForecastCategory"
  relations:
  - name: "salesUnits"
    type: "SalesUnit"
    multiplicity: "OneToMany"
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "forecastCycles"
    type: "ForecastCycle"
    multiplicity: "OneToMany"
- name: "SalesUnit"
  description: "Hierarchical team or regional structure that owns quota and forecast\
    \ rollups."
  data:
  - name: "name"
    type: "String"
  - name: "unitType"
    type: "SalesUnitType"
  - name: "capacityHeadcount"
    type: "Integer"
  relations:
  - name: "organization"
    type: "SalesOrganization"
    multiplicity: "ManyToOne"
  - name: "parentUnit"
    type: "SalesUnit"
    multiplicity: "ManyToOne"
  - name: "members"
    type: "Seller"
    multiplicity: "OneToMany"
  - name: "territories"
    type: "SalesTerritory"
    multiplicity: "OneToMany"
  - name: "quotas"
    type: "Quota"
    multiplicity: "OneToMany"
  - name: "forecasts"
    type: "Forecast"
    multiplicity: "OneToMany"
- name: "Seller"
  description: "Individual contributor or manager responsible for pipeline, quota,\
    \ and forecast submissions."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "role"
    type: "SellerRole"
  - name: "email"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "salesUnit"
    type: "SalesUnit"
    multiplicity: "ManyToOne"
  - name: "territories"
    type: "SalesTerritory"
    multiplicity: "ManyToMany"
  - name: "opportunities"
    type: "Opportunity"
    multiplicity: "OneToMany"
  - name: "quotas"
    type: "Quota"
    multiplicity: "OneToMany"
  - name: "forecasts"
    type: "Forecast"
    multiplicity: "OneToMany"
- name: "Account"
  description: "Customer or prospect entity used for opportunity, forecast, and bookings."
  data:
  - name: "name"
    type: "String"
  - name: "industry"
    type: "String"
  - name: "segmentation"
    type: "AccountSegment"
  - name: "headquartersCountry"
    type: "String"
  relations:
  - name: "opportunities"
    type: "Opportunity"
    multiplicity: "OneToMany"
  - name: "territory"
    type: "SalesTerritory"
    multiplicity: "ManyToOne"
- name: "ProductFamily"
  description: "Logical grouping of related products for forecasting and quota rollups."
  data:
  - name: "name"
    type: "String"
  - name: "familyCode"
    type: "String"
  relations:
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
- name: "Product"
  description: "Sellable product or service referenced by opportunities and forecasts."
  data:
  - name: "name"
    type: "String"
  - name: "productCode"
    type: "String"
  - name: "category"
    type: "ProductCategory"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "family"
    type: "ProductFamily"
    multiplicity: "ManyToOne"
  - name: "opportunityLines"
    type: "OpportunityLine"
    multiplicity: "OneToMany"
- name: "SalesTerritory"
  description: "Geographic or account-based coverage area assigned to sellers and\
    \ accounts."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "coverageType"
    type: "CoverageType"
  relations:
  - name: "salesUnit"
    type: "SalesUnit"
    multiplicity: "ManyToOne"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "sellers"
    type: "Seller"
    multiplicity: "ManyToMany"
- name: "Opportunity"
  description: "Potential revenue tracked through stages and forecast categories."
  data:
  - name: "name"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "closeDate"
    type: "Date"
  - name: "stage"
    type: "OpportunityStage"
  - name: "probability"
    type: "Percentage"
  - name: "forecastCategory"
    type: "ForecastCategory"
  - name: "isRenewal"
    type: "Boolean"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "territory"
    type: "SalesTerritory"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "OpportunityLine"
    multiplicity: "OneToMany"
- name: "OpportunityLine"
  description: "Line item within an opportunity representing a product, quantity,\
    \ and price."
  data:
  - name: "quantity"
    type: "Decimal"
  - name: "unitPrice"
    type: "Money"
  - name: "expectedCloseDate"
    type: "Date"
  relations:
  - name: "opportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "ForecastCycle"
  description: "Time-bounded forecasting window governing submissions, rollups, and\
    \ locks."
  data:
  - name: "name"
    type: "String"
  - name: "period"
    type: "Period"
  - name: "status"
    type: "ForecastCycleStatus"
  - name: "lockDate"
    type: "Date"
  relations:
  - name: "organization"
    type: "SalesOrganization"
    multiplicity: "ManyToOne"
  - name: "forecasts"
    type: "Forecast"
    multiplicity: "OneToMany"
  - name: "pipelineSnapshots"
    type: "PipelineSnapshot"
    multiplicity: "OneToMany"
  - name: "bookings"
    type: "Booking"
    multiplicity: "OneToMany"
  - name: "scenarios"
    type: "ScenarioPlan"
    multiplicity: "OneToMany"
- name: "Forecast"
  description: "Aggregated outlook of expected bookings for a scope, category, and\
    \ period."
  data:
  - name: "category"
    type: "ForecastCategory"
  - name: "currency"
    type: "String"
  - name: "committedAmount"
    type: "Money"
  - name: "upsideAmount"
    type: "Money"
  - name: "pipelineAmount"
    type: "Money"
  - name: "expectedBookings"
    type: "Money"
  - name: "confidence"
    type: "ConfidenceLevel"
  - name: "notes"
    type: "String"
  relations:
  - name: "cycle"
    type: "ForecastCycle"
    multiplicity: "ManyToOne"
  - name: "salesUnit"
    type: "SalesUnit"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "territory"
    type: "SalesTerritory"
    multiplicity: "ManyToOne"
  - name: "productFamily"
    type: "ProductFamily"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "ForecastLine"
    multiplicity: "OneToMany"
  - name: "adjustments"
    type: "ForecastAdjustment"
    multiplicity: "OneToMany"
  - name: "quota"
    type: "Quota"
    multiplicity: "ManyToOne"
- name: "ForecastLine"
  description: "Granular forecast component associated with opportunities and products."
  data:
  - name: "bucket"
    type: "TimeBucket"
  - name: "amount"
    type: "Money"
  - name: "category"
    type: "ForecastCategory"
  - name: "probability"
    type: "Percentage"
  relations:
  - name: "forecast"
    type: "Forecast"
    multiplicity: "ManyToOne"
  - name: "opportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "territory"
    type: "SalesTerritory"
    multiplicity: "ManyToOne"
- name: "ForecastAdjustment"
  description: "Manual change applied to a forecast or line with justification and\
    \ approver."
  data:
  - name: "reason"
    type: "AdjustmentReason"
  - name: "amountDelta"
    type: "Money"
  - name: "comment"
    type: "String"
  - name: "appliedAt"
    type: "Date"
  relations:
  - name: "forecast"
    type: "Forecast"
    multiplicity: "ManyToOne"
  - name: "forecastLine"
    type: "ForecastLine"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Seller"
    multiplicity: "ManyToOne"
- name: "Quota"
  description: "Sales target assigned for a given period and segmentation."
  data:
  - name: "period"
    type: "Period"
  - name: "targetAmount"
    type: "Money"
  - name: "status"
    type: "QuotaStatus"
  relations:
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "salesUnit"
    type: "SalesUnit"
    multiplicity: "ManyToOne"
  - name: "territory"
    type: "SalesTerritory"
    multiplicity: "ManyToOne"
  - name: "productFamily"
    type: "ProductFamily"
    multiplicity: "ManyToOne"
- name: "PipelineSnapshot"
  description: "Time-stamped capture of the opportunity pipeline for change analysis."
  data:
  - name: "snapshotDate"
    type: "Date"
  - name: "snapshotName"
    type: "String"
  relations:
  - name: "cycle"
    type: "ForecastCycle"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "PipelineSnapshotLine"
    multiplicity: "OneToMany"
- name: "PipelineSnapshotLine"
  description: "Opportunity-level state at a snapshot, preserving key forecasting\
    \ attributes."
  data:
  - name: "amount"
    type: "Money"
  - name: "probability"
    type: "Percentage"
  - name: "stage"
    type: "OpportunityStage"
  - name: "expectedCloseDate"
    type: "Date"
  relations:
  - name: "snapshot"
    type: "PipelineSnapshot"
    multiplicity: "ManyToOne"
  - name: "opportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "Booking"
  description: "Recognized order or revenue actual used for forecast accuracy measurements."
  data:
  - name: "bookingDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "currency"
    type: "String"
  relations:
  - name: "cycle"
    type: "ForecastCycle"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "territory"
    type: "SalesTerritory"
    multiplicity: "ManyToOne"
  - name: "salesUnit"
    type: "SalesUnit"
    multiplicity: "ManyToOne"
- name: "ScenarioPlan"
  description: "What-if configuration for modeling upside, downside, and stretch outcomes."
  data:
  - name: "name"
    type: "String"
  - name: "scenarioType"
    type: "ScenarioType"
  - name: "description"
    type: "String"
  relations:
  - name: "cycle"
    type: "ForecastCycle"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "ScenarioPlanLine"
    multiplicity: "OneToMany"
- name: "ScenarioPlanLine"
  description: "Scenario parameter applied to a forecast slice for a specific bucket\
    \ and dimension."
  data:
  - name: "bucket"
    type: "TimeBucket"
  - name: "upliftPercent"
    type: "Percentage"
  - name: "notes"
    type: "String"
  relations:
  - name: "scenario"
    type: "ScenarioPlan"
    multiplicity: "ManyToOne"
  - name: "productFamily"
    type: "ProductFamily"
    multiplicity: "ManyToOne"
  - name: "territory"
    type: "SalesTerritory"
    multiplicity: "ManyToOne"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
- name: "MarketSignal"
  description: "External indicator recorded to inform forecasting assumptions and\
    \ weighting."
  data:
  - name: "name"
    type: "String"
  - name: "signalType"
    type: "SignalType"
  - name: "value"
    type: "Decimal"
  - name: "observationDate"
    type: "Date"
  - name: "source"
    type: "String"
  relations:
  - name: "territory"
    type: "SalesTerritory"
    multiplicity: "ManyToOne"
  - name: "productFamily"
    type: "ProductFamily"
    multiplicity: "ManyToOne"
  - name: "cycle"
    type: "ForecastCycle"
    multiplicity: "ManyToOne"
enums:
- name: "SalesUnitType"
  description: "Classification of the sales unit within the organization."
  data:
  - name: "Region"
  - name: "Team"
  - name: "Overlay"
  - name: "Channel"
- name: "SellerRole"
  description: "Functional role held by a sales user."
  data:
  - name: "Seller"
  - name: "Manager"
  - name: "Executive"
  - name: "Analyst"
- name: "AccountSegment"
  description: "Market segment classification used for accounts."
  data:
  - name: "Enterprise"
  - name: "MidMarket"
  - name: "SMB"
  - name: "PublicSector"
- name: "ProductCategory"
  description: "Category of product for forecasting and reporting."
  data:
  - name: "Software"
  - name: "Hardware"
  - name: "Service"
  - name: "Subscription"
  - name: "Maintenance"
- name: "CoverageType"
  description: "Method by which a territory is defined and covered."
  data:
  - name: "Geographic"
  - name: "Industry"
  - name: "NamedAccount"
  - name: "Inbound"
- name: "OpportunityStage"
  description: "Standardized progression states for opportunities."
  data:
  - name: "Prospecting"
  - name: "Qualification"
  - name: "Proposal"
  - name: "Negotiation"
  - name: "ClosedWon"
  - name: "ClosedLost"
- name: "ForecastCategory"
  description: "Category used to classify forecasted amounts."
  data:
  - name: "Pipeline"
  - name: "BestCase"
  - name: "Commit"
  - name: "Closed"
  - name: "Omitted"
- name: "ForecastCycleStatus"
  description: "Lifecycle state of a forecasting cycle."
  data:
  - name: "Planned"
  - name: "Open"
  - name: "Submitted"
  - name: "Locked"
  - name: "Archived"
- name: "ConfidenceLevel"
  description: "Qualitative confidence attached to a forecast or component."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Certain"
- name: "AdjustmentReason"
  description: "Reason code explaining a manual forecast adjustment."
  data:
  - name: "Judgment"
  - name: "Seasonality"
  - name: "Promotion"
  - name: "SupplyConstraint"
  - name: "DataCorrection"
- name: "QuotaStatus"
  description: "Publication and applicability state for a quota."
  data:
  - name: "Draft"
  - name: "Published"
  - name: "InForce"
  - name: "Revised"
  - name: "Retired"
- name: "ScenarioType"
  description: "Scenario modeling posture for what-if planning."
  data:
  - name: "Baseline"
  - name: "Upside"
  - name: "Downside"
  - name: "Stretch"
- name: "SignalType"
  description: "Type of external indicator used to inform forecasts."
  data:
  - name: "EconomicIndex"
  - name: "WebTraffic"
  - name: "LeadVolume"
  - name: "WinRateShift"
  - name: "SeasonalityIndex"
- name: "TimeGranularity"
  description: "Time bucket size used for planning and rollups."
  data:
  - name: "Weekly"
  - name: "Monthly"
  - name: "Quarterly"
valueObjects:
- name: "Money"
  description: "Monetary value consisting of an amount and a currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Percentage"
  description: "Proportional value from 0 to 100 represented as a decimal."
  data:
  - name: "value"
    type: "Decimal"
- name: "Period"
  description: "Continuous date range used to define a forecasting window."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "TimeBucket"
  description: "Discrete planning bucket identified by year and period number with\
    \ a defined granularity."
  data:
  - name: "year"
    type: "Integer"
  - name: "periodNumber"
    type: "Integer"
  - name: "granularity"
    type: "TimeGranularity"
