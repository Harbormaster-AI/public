---
metadata:
  name: "HCIDL Proposal Management Capabilities Model"
  description: "Capability model for managing sales proposals from drafting through\
    \ approval, e-signature, delivery, and acceptance, including content, pricing,\
    \ and collaboration."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Sales & CRM"
  type: "Capability"
  domain: "Proposal Management"
entities:
- name: "Account"
  description: "Organization or client company to whom a proposal is addressed."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "website"
    type: "String"
  - name: "billingAddress"
    type: "PostalAddress"
  - name: "shippingAddress"
    type: "PostalAddress"
  - name: "industrySegment"
    type: "String"
  relations:
  - name: "contacts"
    type: "Contact"
    multiplicity: "OneToMany"
  - name: "opportunities"
    type: "Opportunity"
    multiplicity: "OneToMany"
  - name: "proposals"
    type: "Proposal"
    multiplicity: "OneToMany"
- name: "Contact"
  description: "Individual person at an account involved in proposal communication\
    \ or signing."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "jobTitle"
    type: "String"
  - name: "preferredLanguage"
    type: "String"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "recipients"
    type: "Recipient"
    multiplicity: "OneToMany"
- name: "Opportunity"
  description: "Sales opportunity providing commercial context and linkage for proposals."
  data:
  - name: "name"
    type: "String"
  - name: "stage"
    type: "OpportunityStage"
  - name: "expectedCloseDate"
    type: "Date"
  - name: "probability"
    type: "Decimal"
  - name: "budget"
    type: "MonetaryAmount"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "proposals"
    type: "Proposal"
    multiplicity: "OneToMany"
- name: "Proposal"
  description: "Commercial offer document representing a solution, scope, and price\
    \ for an account."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "ProposalStatus"
  - name: "createdOn"
    type: "Date"
  - name: "validUntil"
    type: "Date"
  - name: "grandTotal"
    type: "MonetaryAmount"
  - name: "discountTotal"
    type: "MonetaryAmount"
  - name: "taxTotal"
    type: "MonetaryAmount"
  - name: "notes"
    type: "String"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "primaryContact"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "opportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
  - name: "teamMembers"
    type: "ProposalTeamMember"
    multiplicity: "OneToMany"
  - name: "versions"
    type: "ProposalVersion"
    multiplicity: "OneToMany"
- name: "ProposalVersion"
  description: "Snapshot of proposal content and pricing at a point in time."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "contentStatus"
    type: "ContentStatus"
  - name: "createdOn"
    type: "Date"
  - name: "language"
    type: "String"
  - name: "subtotal"
    type: "MonetaryAmount"
  - name: "totalDiscount"
    type: "MonetaryAmount"
  - name: "totalTax"
    type: "MonetaryAmount"
  - name: "totalDue"
    type: "MonetaryAmount"
  relations:
  - name: "proposal"
    type: "Proposal"
    multiplicity: "ManyToOne"
  - name: "sections"
    type: "ProposalSection"
    multiplicity: "OneToMany"
  - name: "lineItems"
    type: "ProposalLineItem"
    multiplicity: "OneToMany"
  - name: "pricingSchedules"
    type: "PricingSchedule"
    multiplicity: "OneToMany"
  - name: "approvalWorkflow"
    type: "ApprovalWorkflow"
    multiplicity: "OneToOne"
  - name: "eSignatureEnvelope"
    type: "ESignatureEnvelope"
    multiplicity: "OneToOne"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "terms"
    type: "Term"
    multiplicity: "OneToMany"
  - name: "deliveryRecords"
    type: "DeliveryRecord"
    multiplicity: "OneToMany"
  - name: "paymentMilestones"
    type: "PaymentMilestone"
    multiplicity: "OneToMany"
- name: "ProposalSection"
  description: "Structured content block within a proposal version."
  data:
  - name: "title"
    type: "String"
  - name: "sectionType"
    type: "SectionType"
  - name: "content"
    type: "String"
  - name: "displayOrder"
    type: "Integer"
  relations:
  - name: "proposalVersion"
    type: "ProposalVersion"
    multiplicity: "ManyToOne"
  - name: "templateSection"
    type: "TemplateSection"
    multiplicity: "ManyToOne"
  - name: "contentLibraryItems"
    type: "ContentLibraryItem"
    multiplicity: "ManyToMany"
- name: "ProposalLineItem"
  description: "Commercial line item representing a product, service, or fee."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "unitOfMeasure"
    type: "String"
  - name: "unitPrice"
    type: "MonetaryAmount"
  - name: "lineSubtotal"
    type: "MonetaryAmount"
  - name: "taxCategory"
    type: "TaxType"
  relations:
  - name: "proposalVersion"
    type: "ProposalVersion"
    multiplicity: "ManyToOne"
  - name: "discounts"
    type: "Discount"
    multiplicity: "OneToMany"
  - name: "taxes"
    type: "TaxItem"
    multiplicity: "OneToMany"
- name: "Discount"
  description: "Price reduction applied to a line item based on rules or negotiation."
  data:
  - name: "name"
    type: "String"
  - name: "discountType"
    type: "DiscountType"
  - name: "value"
    type: "Decimal"
  - name: "description"
    type: "String"
  - name: "reason"
    type: "String"
  relations:
  - name: "lineItem"
    type: "ProposalLineItem"
    multiplicity: "ManyToOne"
- name: "TaxItem"
  description: "Tax calculation detail applied to a line item."
  data:
  - name: "name"
    type: "String"
  - name: "taxType"
    type: "TaxType"
  - name: "rate"
    type: "Decimal"
  - name: "taxable"
    type: "Boolean"
  - name: "amount"
    type: "MonetaryAmount"
  relations:
  - name: "lineItem"
    type: "ProposalLineItem"
    multiplicity: "ManyToOne"
- name: "PricingSchedule"
  description: "Recurring or milestone-based billing plan for a proposal version."
  data:
  - name: "model"
    type: "PricingModel"
  - name: "billingFrequency"
    type: "BillingFrequency"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "upfrontAmount"
    type: "MonetaryAmount"
  - name: "recurringAmount"
    type: "MonetaryAmount"
  - name: "numberOfPeriods"
    type: "Integer"
  - name: "description"
    type: "String"
  relations:
  - name: "proposalVersion"
    type: "ProposalVersion"
    multiplicity: "ManyToOne"
  - name: "lineItems"
    type: "ProposalLineItem"
    multiplicity: "ManyToMany"
- name: "ApprovalWorkflow"
  description: "Structured approval process controlling proposal release."
  data:
  - name: "status"
    type: "ApprovalStatus"
  - name: "initiatedOn"
    type: "Date"
  - name: "lastUpdated"
    type: "Date"
  relations:
  - name: "proposalVersion"
    type: "ProposalVersion"
    multiplicity: "OneToOne"
  - name: "approvalRequests"
    type: "ApprovalRequest"
    multiplicity: "OneToMany"
- name: "ApprovalRequest"
  description: "Individual approver decision step within a workflow."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "status"
    type: "ApprovalStatus"
  - name: "requestedOn"
    type: "Date"
  - name: "decisionOn"
    type: "Date"
  - name: "comment"
    type: "String"
  relations:
  - name: "workflow"
    type: "ApprovalWorkflow"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Approver"
    multiplicity: "ManyToOne"
- name: "Approver"
  description: "Person or role authorized to approve or reject a proposal."
  data:
  - name: "name"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "String"
  - name: "canDelegate"
    type: "Boolean"
  relations:
  - name: "approvalRequests"
    type: "ApprovalRequest"
    multiplicity: "OneToMany"
- name: "Comment"
  description: "Collaboration note or discussion entry associated with a proposal\
    \ version."
  data:
  - name: "authorName"
    type: "String"
  - name: "message"
    type: "String"
  - name: "createdOn"
    type: "Date"
  - name: "visibility"
    type: "String"
  relations:
  - name: "proposalVersion"
    type: "ProposalVersion"
    multiplicity: "ManyToOne"
- name: "Template"
  description: "Reusable blueprint for creating proposals with standardized content."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "status"
    type: "TemplateStatus"
  - name: "defaultLanguage"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  relations:
  - name: "templateSections"
    type: "TemplateSection"
    multiplicity: "OneToMany"
- name: "TemplateSection"
  description: "Predefined section pattern within a template."
  data:
  - name: "name"
    type: "String"
  - name: "sectionType"
    type: "SectionType"
  - name: "bodyTemplate"
    type: "String"
  - name: "displayOrder"
    type: "Integer"
  relations:
  - name: "template"
    type: "Template"
    multiplicity: "ManyToOne"
  - name: "contentItems"
    type: "ContentLibraryItem"
    multiplicity: "ManyToMany"
- name: "ContentLibraryItem"
  description: "Managed content asset available for insertion into proposals and templates."
  data:
  - name: "name"
    type: "String"
  - name: "contentType"
    type: "ContentType"
  - name: "body"
    type: "String"
  - name: "lastUpdated"
    type: "Date"
  - name: "ownerTeam"
    type: "String"
  relations:
  - name: "usedInSections"
    type: "TemplateSection"
    multiplicity: "ManyToMany"
- name: "ESignatureEnvelope"
  description: "Digital signature transaction used to route a proposal for signing."
  data:
  - name: "provider"
    type: "String"
  - name: "status"
    type: "SignatureStatus"
  - name: "sentOn"
    type: "Date"
  - name: "completedOn"
    type: "Date"
  - name: "subject"
    type: "String"
  relations:
  - name: "proposalVersion"
    type: "ProposalVersion"
    multiplicity: "OneToOne"
  - name: "recipients"
    type: "Recipient"
    multiplicity: "OneToMany"
  - name: "events"
    type: "ESignatureEvent"
    multiplicity: "OneToMany"
- name: "Recipient"
  description: "Participant in an e-signature envelope such as signer, approver, or\
    \ viewer."
  data:
  - name: "fullName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "SignerRole"
  - name: "signingOrder"
    type: "Integer"
  - name: "viewedOn"
    type: "Date"
  - name: "signedOn"
    type: "Date"
  relations:
  - name: "envelope"
    type: "ESignatureEnvelope"
    multiplicity: "ManyToOne"
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "ESignatureEvent"
  description: "Audit event generated during the lifecycle of an e-signature envelope."
  data:
  - name: "eventType"
    type: "String"
  - name: "occurredOn"
    type: "Date"
  - name: "metadata"
    type: "String"
  relations:
  - name: "envelope"
    type: "ESignatureEnvelope"
    multiplicity: "ManyToOne"
- name: "DeliveryRecord"
  description: "Evidence of proposal distribution to recipients with engagement tracking."
  data:
  - name: "method"
    type: "DeliveryMethod"
  - name: "sentOn"
    type: "Date"
  - name: "message"
    type: "String"
  - name: "openedOn"
    type: "Date"
  relations:
  - name: "proposalVersion"
    type: "ProposalVersion"
    multiplicity: "ManyToOne"
  - name: "recipients"
    type: "Recipient"
    multiplicity: "ManyToMany"
- name: "Attachment"
  description: "Supporting document or artifact associated with a proposal version."
  data:
  - name: "fileName"
    type: "String"
  - name: "fileType"
    type: "String"
  - name: "sizeKB"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "uploadedOn"
    type: "Date"
  relations:
  - name: "proposalVersion"
    type: "ProposalVersion"
    multiplicity: "ManyToOne"
- name: "Term"
  description: "Contractual clause or condition presented within a proposal."
  data:
  - name: "title"
    type: "String"
  - name: "body"
    type: "String"
  - name: "termType"
    type: "TermType"
  - name: "required"
    type: "Boolean"
  relations:
  - name: "proposalVersion"
    type: "ProposalVersion"
    multiplicity: "ManyToOne"
- name: "PaymentMilestone"
  description: "Defined payment checkpoint tied to deliverables or dates."
  data:
  - name: "name"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "amount"
    type: "MonetaryAmount"
  - name: "description"
    type: "String"
  - name: "status"
    type: "MilestoneStatus"
  relations:
  - name: "proposalVersion"
    type: "ProposalVersion"
    multiplicity: "ManyToOne"
- name: "ProposalTeamMember"
  description: "Internal participant contributing to proposal creation and negotiation."
  data:
  - name: "name"
    type: "String"
  - name: "role"
    type: "String"
  - name: "email"
    type: "String"
  - name: "responsibility"
    type: "String"
  relations:
  - name: "proposal"
    type: "Proposal"
    multiplicity: "ManyToOne"
enums:
- name: "ProposalStatus"
  description: "Lifecycle states for a proposal from creation to outcome."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "PendingApproval"
  - name: "Approved"
  - name: "Rejected"
  - name: "Sent"
  - name: "Viewed"
  - name: "Accepted"
  - name: "Declined"
  - name: "Expired"
  - name: "Withdrawn"
- name: "ContentStatus"
  description: "Editorial readiness of proposal content."
  data:
  - name: "Draft"
  - name: "Final"
  - name: "Locked"
- name: "SectionType"
  description: "Classification of proposal sections for presentation and reporting."
  data:
  - name: "ExecutiveSummary"
  - name: "Scope"
  - name: "Deliverables"
  - name: "Timeline"
  - name: "Pricing"
  - name: "Terms"
  - name: "AboutUs"
  - name: "CaseStudies"
  - name: "Custom"
- name: "DiscountType"
  description: "Method used to calculate a discount value."
  data:
  - name: "Percentage"
  - name: "Amount"
- name: "TaxType"
  description: "Category of tax applicable to a line item."
  data:
  - name: "VAT"
  - name: "SalesTax"
  - name: "GST"
  - name: "ServiceTax"
  - name: "None"
- name: "PricingModel"
  description: "Structure for charging the customer over time."
  data:
  - name: "OneTime"
  - name: "Recurring"
  - name: "Milestone"
  - name: "Mixed"
- name: "BillingFrequency"
  description: "Recurrence interval for repeated billing."
  data:
  - name: "OneTime"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Annually"
- name: "ApprovalStatus"
  description: "State of an approval workflow or step."
  data:
  - name: "NotStarted"
  - name: "Requested"
  - name: "Approved"
  - name: "Rejected"
  - name: "Escalated"
  - name: "Cancelled"
- name: "SignatureStatus"
  description: "Progress of an electronic signature transaction."
  data:
  - name: "NotSent"
  - name: "Sent"
  - name: "Viewed"
  - name: "Completed"
  - name: "Declined"
  - name: "Voided"
- name: "ContentType"
  description: "Type of reusable content asset."
  data:
  - name: "Text"
  - name: "Image"
  - name: "Table"
  - name: "Chart"
  - name: "Attachment"
  - name: "HTML"
  - name: "Snippet"
- name: "DeliveryMethod"
  description: "Channel used to deliver the proposal to recipients."
  data:
  - name: "Email"
  - name: "Link"
  - name: "Portal"
  - name: "Print"
- name: "TemplateStatus"
  description: "Availability state for a proposal template."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Archived"
- name: "SignerRole"
  description: "Participant role within an e-signature envelope."
  data:
  - name: "Signer"
  - name: "Approver"
  - name: "Viewer"
  - name: "CC"
- name: "TermType"
  description: "Classification of contractual terms included in proposals."
  data:
  - name: "Payment"
  - name: "Legal"
  - name: "SLA"
  - name: "Confidentiality"
  - name: "Cancellation"
  - name: "Acceptance"
- name: "MilestoneStatus"
  description: "Progress state of a payment milestone."
  data:
  - name: "Planned"
  - name: "Due"
  - name: "Paid"
  - name: "Overdue"
  - name: "Cancelled"
- name: "OpportunityStage"
  description: "Standardized stage of a sales opportunity linked to proposals."
  data:
  - name: "Qualification"
  - name: "Proposal"
  - name: "Negotiation"
  - name: "ClosedWon"
  - name: "ClosedLost"
  - name: "OnHold"
valueObjects:
- name: "MonetaryAmount"
  description: "Representation of a monetary value in a specified currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "PostalAddress"
  description: "Structured postal address used for billing and shipping."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
