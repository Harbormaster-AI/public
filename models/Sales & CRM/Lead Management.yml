---
metadata:
  name: "Lead Management HCIDL"
  description: "Capabilities model capturing the structure and relationships required\
    \ to manage inbound and outbound sales leads across their lifecycle from capture\
    \ to qualification and conversion."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Sales & CRM"
  type: "Capability"
  domain: "Lead Management"
entities:
- name: "Lead"
  description: "Prospective individual or organization that has expressed interest\
    \ and requires qualification."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "company"
    type: "String"
  - name: "jobTitle"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "website"
    type: "String"
  - name: "status"
    type: "LeadStatus"
  - name: "priority"
    type: "LeadPriority"
  - name: "source"
    type: "LeadSource"
  - name: "consentStatus"
    type: "ConsentStatus"
  - name: "industry"
    type: "String"
  - name: "score"
    type: "Integer"
  - name: "createdDate"
    type: "Date"
  - name: "lastActivityDate"
    type: "Date"
  - name: "timezone"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "utm"
    type: "UTMParameters"
  relations:
  - name: "owner"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "queue"
    type: "LeadQueue"
    multiplicity: "ManyToOne"
  - name: "campaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
  - name: "activities"
    type: "LeadActivity"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "LeadAssignment"
    multiplicity: "OneToMany"
  - name: "statusHistory"
    type: "LeadStatusChange"
    multiplicity: "OneToMany"
  - name: "scorecards"
    type: "LeadScorecard"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "formSubmissions"
    type: "FormSubmission"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "enrichmentEvents"
    type: "EnrichmentEvent"
    multiplicity: "OneToMany"
  - name: "consentRecords"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
  - name: "duplicateSets"
    type: "DuplicateSet"
    multiplicity: "ManyToMany"
- name: "User"
  description: "Human user such as a sales or marketing practitioner who works and\
    \ owns leads."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "role"
    type: "UserRole"
  - name: "active"
    type: "Boolean"
  - name: "timezone"
    type: "String"
  relations:
  - name: "ownedLeads"
    type: "Lead"
    multiplicity: "OneToMany"
  - name: "activities"
    type: "LeadActivity"
    multiplicity: "OneToMany"
  - name: "assignmentsGiven"
    type: "LeadAssignment"
    multiplicity: "OneToMany"
  - name: "assignmentsReceived"
    type: "LeadAssignment"
    multiplicity: "OneToMany"
  - name: "teams"
    type: "SalesTeam"
    multiplicity: "ManyToMany"
- name: "SalesTeam"
  description: "Group of users organized for lead response, qualification, or territory\
    \ coverage."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "members"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "queues"
    type: "LeadQueue"
    multiplicity: "OneToMany"
  - name: "campaigns"
    type: "Campaign"
    multiplicity: "OneToMany"
- name: "LeadQueue"
  description: "Shared work queue where unassigned or re-routed leads are placed for\
    \ pickup."
  data:
  - name: "name"
    type: "String"
  - name: "routingMode"
    type: "RoutingMode"
  - name: "capacity"
    type: "Integer"
  - name: "description"
    type: "String"
  relations:
  - name: "leads"
    type: "Lead"
    multiplicity: "OneToMany"
  - name: "team"
    type: "SalesTeam"
    multiplicity: "ManyToOne"
- name: "LeadRoutingRule"
  description: "Automated rule that evaluates criteria and assigns or routes leads\
    \ to targets."
  data:
  - name: "name"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  - name: "priority"
    type: "Integer"
  - name: "criteriaExpression"
    type: "String"
  - name: "assignmentStrategy"
    type: "AssignmentStrategy"
  - name: "targetType"
    type: "LeadRoutingTarget"
  relations:
  - name: "targetUser"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "targetTeam"
    type: "SalesTeam"
    multiplicity: "ManyToOne"
  - name: "targetQueue"
    type: "LeadQueue"
    multiplicity: "ManyToOne"
- name: "Campaign"
  description: "Marketing initiative or program that generates and nurtures leads."
  data:
  - name: "name"
    type: "String"
  - name: "channel"
    type: "MarketingChannel"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "budget"
    type: "Decimal"
  - name: "currency"
    type: "String"
  relations:
  - name: "leads"
    type: "Lead"
    multiplicity: "OneToMany"
  - name: "activities"
    type: "LeadActivity"
    multiplicity: "OneToMany"
  - name: "parentCampaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
  - name: "childCampaigns"
    type: "Campaign"
    multiplicity: "OneToMany"
  - name: "formSubmissions"
    type: "FormSubmission"
    multiplicity: "OneToMany"
- name: "LeadActivity"
  description: "Logged interaction or touchpoint with a lead across channels."
  data:
  - name: "activityType"
    type: "ActivityType"
  - name: "subject"
    type: "String"
  - name: "occurredAt"
    type: "Date"
  - name: "direction"
    type: "InteractionDirection"
  - name: "outcome"
    type: "InteractionOutcome"
  - name: "durationMinutes"
    type: "Integer"
  - name: "notes"
    type: "String"
  relations:
  - name: "lead"
    type: "Lead"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "campaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
- name: "LeadAssignment"
  description: "Historical record of a lead ownership or queue change and its method."
  data:
  - name: "assignedAt"
    type: "Date"
  - name: "method"
    type: "AssignmentMethod"
  - name: "notes"
    type: "String"
  relations:
  - name: "lead"
    type: "Lead"
    multiplicity: "ManyToOne"
  - name: "fromUser"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "toUser"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "toQueue"
    type: "LeadQueue"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "LeadRoutingRule"
    multiplicity: "ManyToOne"
- name: "ScoringModel"
  description: "Configuration that defines how lead scores are calculated and decayed."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "ModelStatus"
  - name: "description"
    type: "String"
  - name: "decayRate"
    type: "Decimal"
  - name: "maxScore"
    type: "Integer"
  relations:
  - name: "rules"
    type: "ScoringRule"
    multiplicity: "OneToMany"
  - name: "scorecards"
    type: "LeadScorecard"
    multiplicity: "OneToMany"
- name: "ScoringRule"
  description: "Rule within a model that contributes weighted points when conditions\
    \ match."
  data:
  - name: "name"
    type: "String"
  - name: "weight"
    type: "Integer"
  - name: "conditionExpression"
    type: "String"
  - name: "category"
    type: "ScoreCategory"
  - name: "description"
    type: "String"
  relations:
  - name: "model"
    type: "ScoringModel"
    multiplicity: "ManyToOne"
- name: "LeadScorecard"
  description: "Calculated scoring snapshot for a lead under a specific model."
  data:
  - name: "calculatedAt"
    type: "Date"
  - name: "totalScore"
    type: "Integer"
  - name: "grade"
    type: "LeadGrade"
  relations:
  - name: "lead"
    type: "Lead"
    multiplicity: "ManyToOne"
  - name: "model"
    type: "ScoringModel"
    multiplicity: "ManyToOne"
- name: "LeadStatusChange"
  description: "Audit entry capturing a lead’s status transition and rationale."
  data:
  - name: "fromStatus"
    type: "LeadStatus"
  - name: "toStatus"
    type: "LeadStatus"
  - name: "changedAt"
    type: "Date"
  - name: "reason"
    type: "DispositionReason"
  - name: "notes"
    type: "String"
  relations:
  - name: "lead"
    type: "Lead"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Form"
  description: "Web or in-app capture mechanism that collects lead information."
  data:
  - name: "name"
    type: "String"
  - name: "url"
    type: "String"
  - name: "captchaEnabled"
    type: "Boolean"
  - name: "description"
    type: "String"
  relations:
  - name: "submissions"
    type: "FormSubmission"
    multiplicity: "OneToMany"
  - name: "campaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
- name: "FormSubmission"
  description: "Instance of data submitted via a form attributed to a lead and campaign."
  data:
  - name: "submittedAt"
    type: "Date"
  - name: "ipAddress"
    type: "String"
  - name: "userAgent"
    type: "String"
  - name: "referrerUrl"
    type: "String"
  - name: "payload"
    type: "String"
  relations:
  - name: "form"
    type: "Form"
    multiplicity: "ManyToOne"
  - name: "lead"
    type: "Lead"
    multiplicity: "ManyToOne"
  - name: "campaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
- name: "EnrichmentEvent"
  description: "Third-party or automated augmentation of a lead’s profile data."
  data:
  - name: "providerName"
    type: "String"
  - name: "occurredAt"
    type: "Date"
  - name: "fieldsUpdated"
    type: "Integer"
  - name: "notes"
    type: "String"
  relations:
  - name: "lead"
    type: "Lead"
    multiplicity: "ManyToOne"
- name: "Tag"
  description: "Label used to classify and segment leads for workflow and reporting."
  data:
  - name: "name"
    type: "String"
  - name: "color"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "leads"
    type: "Lead"
    multiplicity: "ManyToMany"
- name: "Attachment"
  description: "File or document associated with a lead or a specific activity."
  data:
  - name: "fileName"
    type: "String"
  - name: "fileType"
    type: "String"
  - name: "url"
    type: "String"
  - name: "uploadedAt"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "lead"
    type: "Lead"
    multiplicity: "ManyToOne"
  - name: "activity"
    type: "LeadActivity"
    multiplicity: "ManyToOne"
- name: "ConsentRecord"
  description: "Evidence of communication consent or restriction for compliance purposes."
  data:
  - name: "status"
    type: "ConsentStatus"
  - name: "capturedAt"
    type: "Date"
  - name: "source"
    type: "String"
  - name: "ipAddress"
    type: "String"
  - name: "channel"
    type: "CommunicationChannel"
  - name: "notes"
    type: "String"
  relations:
  - name: "lead"
    type: "Lead"
    multiplicity: "ManyToOne"
  - name: "formSubmission"
    type: "FormSubmission"
    multiplicity: "ManyToOne"
- name: "DuplicateSet"
  description: "Grouping of suspected duplicate leads under a designated primary record."
  data:
  - name: "mergeStatus"
    type: "MergeStatus"
  - name: "createdDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "primaryLead"
    type: "Lead"
    multiplicity: "ManyToOne"
  - name: "candidateLeads"
    type: "Lead"
    multiplicity: "ManyToMany"
  - name: "mergedInto"
    type: "Lead"
    multiplicity: "ManyToOne"
enums:
- name: "LeadStatus"
  description: "Lifecycle status used to track lead progress toward qualification."
  data:
  - name: "New"
  - name: "Open"
  - name: "Contacted"
  - name: "Nurturing"
  - name: "Qualified"
  - name: "Disqualified"
  - name: "Converted"
  - name: "Recycled"
- name: "LeadPriority"
  description: "Urgency level indicating relative response order or importance."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Urgent"
- name: "LeadSource"
  description: "Origin of the lead for attribution and routing."
  data:
  - name: "WebForm"
  - name: "Referral"
  - name: "Event"
  - name: "InboundCall"
  - name: "Outbound"
  - name: "PaidSearch"
  - name: "OrganicSearch"
  - name: "Social"
  - name: "Partner"
  - name: "EmailCampaign"
  - name: "Import"
  - name: "Other"
- name: "ConsentStatus"
  description: "Legal permission status governing allowed communications."
  data:
  - name: "Unknown"
  - name: "Granted"
  - name: "Revoked"
  - name: "Restricted"
- name: "UserRole"
  description: "Functional role of a user in the selling or marketing process."
  data:
  - name: "SDR"
  - name: "AE"
  - name: "Marketing"
  - name: "Manager"
  - name: "Admin"
  - name: "PartnerRep"
- name: "RoutingMode"
  description: "Mode by which a queue allocates leads to users."
  data:
  - name: "RoundRobin"
  - name: "Weighted"
  - name: "LoadBalanced"
  - name: "PriorityOnly"
- name: "LeadRoutingTarget"
  description: "Type of destination that a routing rule can assign a lead to."
  data:
  - name: "User"
  - name: "SalesTeam"
  - name: "LeadQueue"
- name: "AssignmentStrategy"
  description: "Strategy used when a rule assigns a lead to eligible recipients."
  data:
  - name: "RoundRobin"
  - name: "Weighted"
  - name: "Territory"
  - name: "Availability"
- name: "MarketingChannel"
  description: "Primary channel through which a campaign runs or is attributed."
  data:
  - name: "Email"
  - name: "Social"
  - name: "PaidSearch"
  - name: "Organic"
  - name: "Event"
  - name: "Webinar"
  - name: "Referral"
  - name: "Partner"
  - name: "OutboundCall"
- name: "ActivityType"
  description: "Category of interaction logged against a lead."
  data:
  - name: "Call"
  - name: "Email"
  - name: "Meeting"
  - name: "SMS"
  - name: "Note"
  - name: "SocialMessage"
  - name: "Task"
- name: "InteractionDirection"
  description: "Directionality of the communication event."
  data:
  - name: "Inbound"
  - name: "Outbound"
- name: "InteractionOutcome"
  description: "Result of the interaction, used for follow-up decisions."
  data:
  - name: "Connected"
  - name: "LeftVoicemail"
  - name: "NoAnswer"
  - name: "Bounced"
  - name: "Replied"
  - name: "MeetingScheduled"
  - name: "Completed"
- name: "AssignmentMethod"
  description: "Mechanism by which a lead was assigned or re-assigned."
  data:
  - name: "Manual"
  - name: "Rule"
  - name: "API"
  - name: "Import"
  - name: "Reassign"
- name: "ModelStatus"
  description: "Lifecycle state of a scoring model configuration."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Draft"
- name: "ScoreCategory"
  description: "Conceptual grouping of scoring rules."
  data:
  - name: "Fit"
  - name: "Engagement"
  - name: "Behavior"
  - name: "Firmographic"
  - name: "Demographic"
  - name: "Intent"
- name: "LeadGrade"
  description: "Alphabetic grade derived from total score thresholds."
  data:
  - name: "A"
  - name: "B"
  - name: "C"
  - name: "D"
  - name: "E"
  - name: "F"
- name: "DispositionReason"
  description: "Reason explaining qualification or disqualification decisions."
  data:
  - name: "NotInterested"
  - name: "NoBudget"
  - name: "NoAuthority"
  - name: "NotReady"
  - name: "NotInTerritory"
  - name: "Duplicate"
  - name: "Invalid"
  - name: "Spam"
- name: "CommunicationChannel"
  description: "Channel for consent scope and outreach."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "Phone"
  - name: "Social"
  - name: "Postal"
- name: "MergeStatus"
  description: "Progress of a duplicate review and consolidation effort."
  data:
  - name: "Open"
  - name: "Merged"
  - name: "Dismissed"
- name: "PhoneType"
  description: "Classification of a phone number for contactability and compliance."
  data:
  - name: "Mobile"
  - name: "Landline"
  - name: "VoIP"
  - name: "Fax"
valueObjects:
- name: "EmailAddress"
  description: "Structured representation of an email address and its verification\
    \ state."
  data:
  - name: "address"
    type: "String"
  - name: "isVerified"
    type: "Boolean"
- name: "PhoneNumber"
  description: "Structured representation of a dialable number with country context."
  data:
  - name: "number"
    type: "String"
  - name: "countryCode"
    type: "String"
  - name: "type"
    type: "PhoneType"
- name: "Address"
  description: "Postal location details used for correspondence and territory alignment."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "stateOrProvince"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "UTMParameters"
  description: "Attribution parameters used to track digital campaign performance."
  data:
  - name: "source"
    type: "String"
  - name: "medium"
    type: "String"
  - name: "campaign"
    type: "String"
  - name: "term"
    type: "String"
  - name: "content"
    type: "String"
