---
metadata:
  name: "Partner Management"
  description: "Capability model for managing partner ecosystems across recruitment,\
    \ onboarding, enablement, joint selling, incentives, compliance, and performance\
    \ measurement."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Sales & CRM"
  type: "Capability"
  domain: "Partner Management"
entities:
- name: "PartnerOrganization"
  description: "External organization participating in the partner ecosystem."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "partnerCategory"
    type: "PartnerCategory"
  - name: "lifecycleStatus"
    type: "PartnerLifecycleStatus"
  - name: "website"
    type: "Url"
  - name: "primaryEmail"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "taxIdentifier"
    type: "TaxIdentifier"
  - name: "establishedDate"
    type: "Date"
  - name: "primaryAddress"
    type: "Address"
  relations:
  - name: "contacts"
    type: "PartnerContact"
    multiplicity: "OneToMany"
  - name: "users"
    type: "PartnerUser"
    multiplicity: "OneToMany"
  - name: "programEnrollments"
    type: "ProgramEnrollment"
    multiplicity: "OneToMany"
  - name: "agreements"
    type: "PartnerAgreement"
    multiplicity: "OneToMany"
  - name: "certifications"
    type: "PartnerCertification"
    multiplicity: "OneToMany"
  - name: "territories"
    type: "PartnerTerritory"
    multiplicity: "ManyToMany"
  - name: "dealRegistrations"
    type: "DealRegistration"
    multiplicity: "OneToMany"
  - name: "mdfRequests"
    type: "MDFRequest"
    multiplicity: "OneToMany"
  - name: "businessPlans"
    type: "JointBusinessPlan"
    multiplicity: "OneToMany"
  - name: "supportCases"
    type: "PartnerSupportCase"
    multiplicity: "OneToMany"
  - name: "incentivePayouts"
    type: "IncentivePayout"
    multiplicity: "OneToMany"
  - name: "referrals"
    type: "PartnerReferral"
    multiplicity: "OneToMany"
- name: "PartnerContact"
  description: "Individual contact at a partner organization used for business and\
    \ operational communication."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "jobTitle"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "department"
    type: "String"
  - name: "isPrimary"
    type: "Boolean"
  relations:
  - name: "partnerOrganization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
- name: "PartnerUser"
  description: "Authenticated user representing a partner member with portal access."
  data:
  - name: "username"
    type: "String"
  - name: "active"
    type: "Boolean"
  - name: "role"
    type: "PartnerUserRole"
  - name: "lastLoginAt"
    type: "DateTime"
  relations:
  - name: "partnerOrganization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
- name: "PartnerProgram"
  description: "Structured program defining eligibility, benefits, and obligations\
    \ for partners."
  data:
  - name: "name"
    type: "String"
  - name: "summary"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "tiers"
    type: "ProgramTier"
    multiplicity: "OneToMany"
  - name: "enrollments"
    type: "ProgramEnrollment"
    multiplicity: "OneToMany"
  - name: "incentivePlans"
    type: "IncentivePlan"
    multiplicity: "OneToMany"
- name: "ProgramTier"
  description: "Level within a partner program representing achievement and benefits."
  data:
  - name: "name"
    type: "String"
  - name: "level"
    type: "ProgramTierLevel"
  - name: "minAnnualRevenue"
    type: "Money"
  - name: "requiredCertificationCount"
    type: "Integer"
  relations:
  - name: "program"
    type: "PartnerProgram"
    multiplicity: "ManyToOne"
- name: "ProgramEnrollment"
  description: "Enrollment record linking a partner organization to a specific partner\
    \ program."
  data:
  - name: "enrollmentDate"
    type: "Date"
  - name: "status"
    type: "EnrollmentStatus"
  - name: "currentTier"
    type: "ProgramTierLevel"
  - name: "renewalDate"
    type: "Date"
  relations:
  - name: "partnerOrganization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "program"
    type: "PartnerProgram"
    multiplicity: "ManyToOne"
- name: "PartnerApplication"
  description: "Application submitted by a prospective partner seeking admission to\
    \ a program."
  data:
  - name: "applicationNumber"
    type: "String"
  - name: "submittedDate"
    type: "Date"
  - name: "status"
    type: "ApplicationStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "partnerOrganization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "program"
    type: "PartnerProgram"
    multiplicity: "ManyToOne"
- name: "PartnerAgreement"
  description: "Contractual agreement governing the relationship between the company\
    \ and the partner."
  data:
  - name: "agreementNumber"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "AgreementStatus"
  relations:
  - name: "partnerOrganization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "program"
    type: "PartnerProgram"
    multiplicity: "ManyToOne"
- name: "TrainingCourse"
  description: "Enablement course offered to partner personnel for skills development\
    \ and accreditation."
  data:
  - name: "title"
    type: "String"
  - name: "mode"
    type: "TrainingMode"
  - name: "durationHours"
    type: "Integer"
  - name: "passingScore"
    type: "Integer"
  relations:
  - name: "certifications"
    type: "PartnerCertification"
    multiplicity: "OneToMany"
- name: "PartnerCertification"
  description: "Certification attained by a partner organization as recognition of\
    \ capability."
  data:
  - name: "name"
    type: "String"
  - name: "certificationStatus"
    type: "CertificationStatus"
  - name: "achievedDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  relations:
  - name: "partnerOrganization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "course"
    type: "TrainingCourse"
    multiplicity: "ManyToOne"
- name: "DealRegistration"
  description: "Claim by a partner to register a customer sales opportunity for protection\
    \ and support."
  data:
  - name: "registrationNumber"
    type: "String"
  - name: "customerName"
    type: "String"
  - name: "opportunityAmount"
    type: "Money"
  - name: "expectedCloseDate"
    type: "Date"
  - name: "status"
    type: "DealRegistrationStatus"
  relations:
  - name: "partnerOrganization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "program"
    type: "PartnerProgram"
    multiplicity: "ManyToOne"
- name: "MDFRequest"
  description: "Funding request by a partner for marketing development activities."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "activityName"
    type: "String"
  - name: "activityPeriod"
    type: "DateRange"
  - name: "budgetRequested"
    type: "Money"
  - name: "status"
    type: "MDFRequestStatus"
  relations:
  - name: "partnerOrganization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "program"
    type: "PartnerProgram"
    multiplicity: "ManyToOne"
  - name: "claims"
    type: "MDFClaim"
    multiplicity: "OneToMany"
- name: "MDFClaim"
  description: "Claim submitted by a partner to reimburse approved marketing activity\
    \ expenses."
  data:
  - name: "claimNumber"
    type: "String"
  - name: "amountClaimed"
    type: "Money"
  - name: "status"
    type: "MDFClaimStatus"
  - name: "submittedDate"
    type: "Date"
  - name: "supportingDocumentUrl"
    type: "Url"
  relations:
  - name: "request"
    type: "MDFRequest"
    multiplicity: "ManyToOne"
- name: "IncentivePlan"
  description: "Program-defined incentive scheme used to reward partner performance."
  data:
  - name: "name"
    type: "String"
  - name: "incentiveType"
    type: "IncentiveType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "program"
    type: "PartnerProgram"
    multiplicity: "ManyToOne"
  - name: "payouts"
    type: "IncentivePayout"
    multiplicity: "OneToMany"
- name: "IncentivePayout"
  description: "Calculated incentive payment issued to a partner."
  data:
  - name: "referenceNumber"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "PayoutStatus"
  - name: "calculatedDate"
    type: "Date"
  - name: "payableDate"
    type: "Date"
  relations:
  - name: "partnerOrganization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "incentivePlan"
    type: "IncentivePlan"
    multiplicity: "ManyToOne"
- name: "PartnerTerritory"
  description: "Territory or segment assigned to one or more partner organizations."
  data:
  - name: "name"
    type: "String"
  - name: "territoryType"
    type: "TerritoryType"
  - name: "regionCode"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "partners"
    type: "PartnerOrganization"
    multiplicity: "ManyToMany"
- name: "JointBusinessPlan"
  description: "Collaborative plan outlining shared goals and initiatives with a partner\
    \ for a defined period."
  data:
  - name: "planPeriod"
    type: "DateRange"
  - name: "status"
    type: "BusinessPlanStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "partnerOrganization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "goals"
    type: "BusinessPlanGoal"
    multiplicity: "OneToMany"
  - name: "kpis"
    type: "BusinessPlanKPI"
    multiplicity: "OneToMany"
- name: "BusinessPlanGoal"
  description: "Target outcome within a joint business plan."
  data:
  - name: "name"
    type: "String"
  - name: "targetValue"
    type: "Decimal"
  - name: "unit"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "ownerName"
    type: "String"
  - name: "progress"
    type: "Percentage"
  relations:
  - name: "businessPlan"
    type: "JointBusinessPlan"
    multiplicity: "ManyToOne"
- name: "BusinessPlanKPI"
  description: "Key performance indicator tracked for a joint business plan."
  data:
  - name: "kpiType"
    type: "KPIType"
  - name: "baselineValue"
    type: "Decimal"
  - name: "targetValue"
    type: "Decimal"
  - name: "currentValue"
    type: "Decimal"
  relations:
  - name: "businessPlan"
    type: "JointBusinessPlan"
    multiplicity: "ManyToOne"
- name: "PartnerSupportCase"
  description: "Support inquiry or issue raised by a partner."
  data:
  - name: "caseNumber"
    type: "String"
  - name: "subject"
    type: "String"
  - name: "status"
    type: "SupportCaseStatus"
  - name: "priority"
    type: "CasePriority"
  - name: "createdAt"
    type: "DateTime"
  relations:
  - name: "partnerOrganization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
- name: "PartnerReferral"
  description: "Referral submitted by a partner introducing a prospect or lead."
  data:
  - name: "referralCode"
    type: "String"
  - name: "prospectName"
    type: "String"
  - name: "prospectEmail"
    type: "EmailAddress"
  - name: "referredDate"
    type: "Date"
  - name: "status"
    type: "ReferralStatus"
  relations:
  - name: "partnerOrganization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "resultingDeal"
    type: "DealRegistration"
    multiplicity: "ManyToOne"
- name: "PartnerDueDiligence"
  description: "Risk and compliance review performed during partner qualification."
  data:
  - name: "completedDate"
    type: "Date"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "backgroundCheckReference"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "partnerOrganization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
  - name: "application"
    type: "PartnerApplication"
    multiplicity: "OneToOne"
- name: "ComplianceDocument"
  description: "Document evidencing a partner’s compliance with policies or regulations."
  data:
  - name: "documentName"
    type: "String"
  - name: "documentType"
    type: "ComplianceDocumentType"
  - name: "version"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "uri"
    type: "Url"
  relations:
  - name: "partnerOrganization"
    type: "PartnerOrganization"
    multiplicity: "ManyToOne"
enums:
- name: "PartnerCategory"
  description: "Classification of partner business model."
  data:
  - name: "Reseller"
  - name: "Distributor"
  - name: "MSP"
  - name: "ISV"
  - name: "SystemIntegrator"
  - name: "Referral"
  - name: "OEM"
  - name: "Consulting"
- name: "PartnerLifecycleStatus"
  description: "Stage of the partner relationship."
  data:
  - name: "Prospect"
  - name: "Applied"
  - name: "Onboarding"
  - name: "Active"
  - name: "Suspended"
  - name: "Terminated"
- name: "ProgramTierLevel"
  description: "Standardized ranking of partner achievement."
  data:
  - name: "Registered"
  - name: "Silver"
  - name: "Gold"
  - name: "Platinum"
  - name: "Elite"
- name: "EnrollmentStatus"
  description: "Current standing of a partner’s enrollment in a program."
  data:
  - name: "Pending"
  - name: "Active"
  - name: "OnHold"
  - name: "Suspended"
  - name: "Cancelled"
  - name: "Expired"
- name: "ApplicationStatus"
  description: "Review outcome for a partner application."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "UnderReview"
  - name: "Approved"
  - name: "Rejected"
  - name: "Withdrawn"
- name: "AgreementStatus"
  description: "State of a contractual agreement with a partner."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Expired"
  - name: "Terminated"
  - name: "Superseded"
- name: "DealRegistrationStatus"
  description: "Lifecycle state of a partner-registered deal."
  data:
  - name: "PendingReview"
  - name: "Approved"
  - name: "Rejected"
  - name: "Expired"
  - name: "Won"
  - name: "Lost"
  - name: "Withdrawn"
- name: "MDFRequestStatus"
  description: "Approval state of an MDF funding request."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Cancelled"
- name: "MDFClaimStatus"
  description: "Processing state of an MDF reimbursement claim."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Paid"
  - name: "Denied"
- name: "CertificationStatus"
  description: "Validity status of a partner certification."
  data:
  - name: "Active"
  - name: "Expired"
  - name: "Revoked"
  - name: "Pending"
- name: "TrainingMode"
  description: "Delivery format of a training course."
  data:
  - name: "Online"
  - name: "InstructorLed"
  - name: "SelfPaced"
  - name: "Webinar"
  - name: "Blended"
- name: "TerritoryType"
  description: "Basis for defining partner territories."
  data:
  - name: "Geography"
  - name: "Industry"
  - name: "Segment"
  - name: "NamedAccount"
  - name: "Channel"
- name: "IncentiveType"
  description: "Category of incentive used to reward partners."
  data:
  - name: "Rebate"
  - name: "SPIFF"
  - name: "Bonus"
  - name: "CoOpFund"
  - name: "GrowthAccelerator"
- name: "PayoutStatus"
  description: "Fulfillment state of an incentive payout."
  data:
  - name: "Pending"
  - name: "InProcess"
  - name: "Paid"
  - name: "OnHold"
  - name: "Cancelled"
- name: "KPIType"
  description: "Metric type tracked in partner business plans."
  data:
  - name: "Revenue"
  - name: "Pipeline"
  - name: "CertificationCount"
  - name: "WinRate"
  - name: "ActivityVolume"
  - name: "NewLogos"
- name: "SupportCaseStatus"
  description: "Progress state of a partner support case."
  data:
  - name: "New"
  - name: "InProgress"
  - name: "WaitingOnPartner"
  - name: "Resolved"
  - name: "Closed"
- name: "CasePriority"
  description: "Urgency level for support case handling."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "ReferralStatus"
  description: "Outcome state of a partner-submitted referral."
  data:
  - name: "Submitted"
  - name: "Qualified"
  - name: "ConvertedToDeal"
  - name: "Disqualified"
  - name: "Expired"
- name: "RiskLevel"
  description: "Assessed level of risk for a partner during due diligence."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "ComplianceDocumentType"
  description: "Type of compliance evidence required from partners."
  data:
  - name: "InsuranceCertificate"
  - name: "SecurityAssessment"
  - name: "CodeOfConductAcknowledgement"
  - name: "DataProcessingAddendum"
  - name: "ExportCompliance"
  - name: "TaxResidencyCertificate"
- name: "PartnerUserRole"
  description: "Access role assigned to a partner portal user."
  data:
  - name: "Administrator"
  - name: "Sales"
  - name: "Marketing"
  - name: "Technical"
  - name: "Finance"
  - name: "Executive"
- name: "BusinessPlanStatus"
  description: "State of a joint business plan throughout its lifecycle."
  data:
  - name: "Draft"
  - name: "Approved"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
valueObjects:
- name: "Money"
  description: "Monetary value expressed in a specific currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Physical mailing address used for correspondence and contracts."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "EmailAddress"
  description: "Formatted email address for electronic communication."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "Telephone number with optional country code and extension."
  data:
  - name: "countryCode"
    type: "String"
  - name: "number"
    type: "String"
  - name: "extension"
    type: "String"
- name: "Url"
  description: "Web address referencing an online resource."
  data:
  - name: "value"
    type: "String"
- name: "TaxIdentifier"
  description: "Government-issued tax identification reference with issuing country."
  data:
  - name: "value"
    type: "String"
  - name: "issuingCountry"
    type: "String"
- name: "DateRange"
  description: "Inclusive date interval indicating a start and end."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "Percentage"
  description: "Fractional representation of a percent value."
  data:
  - name: "value"
    type: "Decimal"
