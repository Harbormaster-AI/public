---
metadata:
  name: "Customer Onboard Capabilities Model"
  description: "Canonical capabilities model describing entities, relationships, and\
    \ value structures required to onboard new customers from post-sale through activation\
    \ and early value realization."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Sales & CRM"
  type: "Capability"
  domain: "Customer Onboard"
entities:
- name: "Customer"
  description: "Primary party being onboarded, representing either an individual or\
    \ an organization."
  data:
  - name: "customerType"
    type: "CustomerType"
  - name: "personName"
    type: "PersonName"
  - name: "organizationName"
    type: "String"
  - name: "primaryEmail"
    type: "EmailAddress"
  - name: "primaryPhone"
    type: "PhoneNumber"
  - name: "primaryAddress"
    type: "Address"
  - name: "billingAddress"
    type: "Address"
  - name: "preferredLanguage"
    type: "String"
  - name: "dateOfBirth"
    type: "Date"
  - name: "industry"
    type: "String"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "OneToOne"
  - name: "journeys"
    type: "OnboardingJourney"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
  - name: "contactPoints"
    type: "ContactPoint"
    multiplicity: "OneToMany"
  - name: "productSubscriptions"
    type: "ProductSubscription"
    multiplicity: "OneToMany"
  - name: "billingSetup"
    type: "BillingSetup"
    multiplicity: "OneToOne"
  - name: "touchpoints"
    type: "Touchpoint"
    multiplicity: "OneToMany"
  - name: "identityVerifications"
    type: "IdentityVerification"
    multiplicity: "OneToMany"
  - name: "communicationPreferences"
    type: "CommunicationPreference"
    multiplicity: "OneToMany"
- name: "Account"
  description: "Customer account record used to manage commercial relationship, teams,\
    \ and lifecycle."
  data:
  - name: "accountName"
    type: "String"
  - name: "accountType"
    type: "AccountType"
  - name: "lifecycle"
    type: "AccountLifecycle"
  - name: "billingAddress"
    type: "Address"
  - name: "domain"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "OneToOne"
  - name: "teamMembers"
    type: "AccountTeamMember"
    multiplicity: "OneToMany"
  - name: "journeys"
    type: "OnboardingJourney"
    multiplicity: "OneToMany"
  - name: "productSubscriptions"
    type: "ProductSubscription"
    multiplicity: "OneToMany"
- name: "OnboardingJourney"
  description: "Orchestrated program guiding the customer through milestones, tasks,\
    \ and approvals until go-live."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "OnboardingStatus"
  - name: "startDate"
    type: "Date"
  - name: "targetGoLiveDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  - name: "priority"
    type: "TaskPriority"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "stages"
    type: "JourneyStage"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "OnboardingTask"
    multiplicity: "OneToMany"
  - name: "owner"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "OneToOne"
  - name: "productSubscriptions"
    type: "ProductSubscription"
    multiplicity: "OneToMany"
  - name: "provisioningOrders"
    type: "ProvisioningOrder"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
  - name: "communications"
    type: "WelcomeCommunication"
    multiplicity: "OneToMany"
  - name: "identityVerifications"
    type: "IdentityVerification"
    multiplicity: "OneToMany"
  - name: "documentRequests"
    type: "DocumentRequest"
    multiplicity: "OneToMany"
  - name: "touchpoints"
    type: "Touchpoint"
    multiplicity: "OneToMany"
- name: "JourneyStage"
  description: "Logical phase within the onboarding journey capturing progress and\
    \ sequencing."
  data:
  - name: "stageName"
    type: "String"
  - name: "stageType"
    type: "StageType"
  - name: "sequenceNumber"
    type: "Integer"
  - name: "status"
    type: "StageStatus"
  - name: "startedDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "journey"
    type: "OnboardingJourney"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "OnboardingTask"
    multiplicity: "OneToMany"
- name: "OnboardingTask"
  description: "Unit of work required to advance onboarding, assignable with due dates\
    \ and dependencies."
  data:
  - name: "title"
    type: "String"
  - name: "taskType"
    type: "TaskType"
  - name: "status"
    type: "TaskStatus_"
  - name: "priority"
    type: "TaskPriority"
  - name: "dueDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "journey"
    type: "OnboardingJourney"
    multiplicity: "ManyToOne"
  - name: "stage"
    type: "JourneyStage"
    multiplicity: "ManyToOne"
  - name: "assignedTo"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "relatedRequests"
    type: "DocumentRequest"
    multiplicity: "ManyToMany"
  - name: "provisioningOrder"
    type: "ProvisioningOrder"
    multiplicity: "ManyToOne"
- name: "User"
  description: "Internal user participating in onboarding as owner, assignee, or reviewer."
  data:
  - name: "displayName"
    type: "String"
  - name: "role"
    type: "UserRole"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "timezone"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "assignedTasks"
    type: "OnboardingTask"
    multiplicity: "OneToMany"
  - name: "ownedJourneys"
    type: "OnboardingJourney"
    multiplicity: "OneToMany"
  - name: "reviewedSubmissions"
    type: "DocumentSubmission"
    multiplicity: "OneToMany"
  - name: "accountTeamMemberships"
    type: "AccountTeamMember"
    multiplicity: "OneToMany"
  - name: "touchpoints"
    type: "Touchpoint"
    multiplicity: "OneToMany"
- name: "ContactPoint"
  description: "Additional contact detail for a customer, scoped by channel with primary\
    \ designation."
  data:
  - name: "channel"
    type: "CommunicationChannel"
  - name: "detail"
    type: "String"
  - name: "isPrimary"
    type: "Boolean"
  - name: "notes"
    type: "String"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
- name: "ConsentRecord"
  description: "Evidence of customer consent for policies, communications, and data\
    \ processing."
  data:
  - name: "consentType"
    type: "ConsentType"
  - name: "granted"
    type: "Boolean"
  - name: "channel"
    type: "CommunicationChannel"
  - name: "capturedAt"
    type: "Date"
  - name: "source"
    type: "String"
  - name: "remarks"
    type: "String"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "journey"
    type: "OnboardingJourney"
    multiplicity: "ManyToOne"
- name: "IdentityVerification"
  description: "Process and outcome of verifying the customer's identity or business\
    \ legitimacy."
  data:
  - name: "method"
    type: "VerificationMethod"
  - name: "status"
    type: "VerificationStatus"
  - name: "referenceNumber"
    type: "String"
  - name: "verifiedName"
    type: "String"
  - name: "verifiedDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "journey"
    type: "OnboardingJourney"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "DocumentSubmission"
    multiplicity: "OneToMany"
  - name: "reviewer"
    type: "User"
    multiplicity: "ManyToOne"
- name: "DocumentRequest"
  description: "Formal request for a specific document required to proceed with onboarding."
  data:
  - name: "documentType"
    type: "DocumentType"
  - name: "instruction"
    type: "String"
  - name: "required"
    type: "Boolean"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "DocumentRequestStatus"
  relations:
  - name: "journey"
    type: "OnboardingJourney"
    multiplicity: "ManyToOne"
  - name: "submissions"
    type: "DocumentSubmission"
    multiplicity: "OneToMany"
- name: "DocumentSubmission"
  description: "Customer-provided document uploaded in response to a request and reviewed\
    \ for adequacy."
  data:
  - name: "file"
    type: "DocumentFile"
  - name: "submittedAt"
    type: "Date"
  - name: "status"
    type: "DocumentStatus"
  - name: "reviewerNotes"
    type: "String"
  relations:
  - name: "request"
    type: "DocumentRequest"
    multiplicity: "ManyToOne"
  - name: "reviewedBy"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "identityVerification"
    type: "IdentityVerification"
    multiplicity: "ManyToOne"
- name: "RiskAssessment"
  description: "Aggregated onboarding risk evaluation based on checks and contextual\
    \ signals."
  data:
  - name: "riskScore"
    type: "Integer"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "status"
    type: "RiskAssessmentStatus"
  - name: "assessmentDate"
    type: "Date"
  - name: "summary"
    type: "String"
  relations:
  - name: "journey"
    type: "OnboardingJourney"
    multiplicity: "ManyToOne"
  - name: "complianceChecks"
    type: "ComplianceCheck"
    multiplicity: "OneToMany"
  - name: "reviewer"
    type: "User"
    multiplicity: "ManyToOne"
- name: "ComplianceCheck"
  description: "Discrete regulatory or policy screening performed during onboarding."
  data:
  - name: "checkType"
    type: "ComplianceCheckType"
  - name: "status"
    type: "ComplianceStatus"
  - name: "details"
    type: "String"
  - name: "checkedAt"
    type: "Date"
  relations:
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
- name: "ProductSubscription"
  description: "Purchased product or service configuration to be activated during\
    \ onboarding."
  data:
  - name: "productName"
    type: "String"
  - name: "planName"
    type: "String"
  - name: "status"
    type: "SubscriptionStatus"
  - name: "startDate"
    type: "Date"
  - name: "trialEndDate"
    type: "Date"
  - name: "price"
    type: "Money"
  - name: "quantity"
    type: "Integer"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "journey"
    type: "OnboardingJourney"
    multiplicity: "ManyToOne"
  - name: "provisioningOrders"
    type: "ProvisioningOrder"
    multiplicity: "OneToMany"
- name: "ProvisioningOrder"
  description: "Instruction set to configure or enable product capabilities for the\
    \ customer."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "status"
    type: "ProvisioningStatus"
  - name: "requestedDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "subscription"
    type: "ProductSubscription"
    multiplicity: "ManyToOne"
  - name: "journey"
    type: "OnboardingJourney"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "OnboardingTask"
    multiplicity: "OneToMany"
- name: "BillingSetup"
  description: "Commercial configuration governing invoicing, taxation, and payment\
    \ arrangements for onboarding."
  data:
  - name: "billingCycle"
    type: "BillingCycle"
  - name: "invoiceDelivery"
    type: "InvoiceDeliveryMethod"
  - name: "paymentTerms"
    type: "String"
  - name: "taxExempt"
    type: "Boolean"
  - name: "effectivePeriod"
    type: "DateRange"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "journey"
    type: "OnboardingJourney"
    multiplicity: "ManyToOne"
  - name: "paymentMethods"
    type: "PaymentMethod"
    multiplicity: "OneToMany"
- name: "PaymentMethod"
  description: "Method available to settle invoices, including card and bank-based\
    \ instruments."
  data:
  - name: "methodType"
    type: "PaymentMethodType"
  - name: "status"
    type: "PaymentMethodStatus"
  - name: "nameOnAccount"
    type: "String"
  - name: "preferred"
    type: "Boolean"
  - name: "card"
    type: "PaymentCard"
  - name: "bankAccount"
    type: "BankAccount"
  relations:
  - name: "billingSetup"
    type: "BillingSetup"
    multiplicity: "ManyToOne"
- name: "WelcomeCommunication"
  description: "Outbound message welcoming the customer and orienting them to the\
    \ onboarding experience."
  data:
  - name: "channel"
    type: "CommunicationChannel"
  - name: "subject"
    type: "String"
  - name: "templateName"
    type: "String"
  - name: "status"
    type: "CommunicationStatus"
  - name: "sentAt"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "journey"
    type: "OnboardingJourney"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "sender"
    type: "User"
    multiplicity: "ManyToOne"
- name: "CommunicationPreference"
  description: "Customer’s configured preferences for contact channels, languages,\
    \ and quiet hours."
  data:
  - name: "preferredChannel"
    type: "CommunicationChannel"
  - name: "allowMarketing"
    type: "Boolean"
  - name: "allowTransactional"
    type: "Boolean"
  - name: "language"
    type: "String"
  - name: "quietHours"
    type: "DateRange"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
- name: "AccountTeamMember"
  description: "Named individual contributing to the account with a defined onboarding\
    \ role."
  data:
  - name: "role"
    type: "AccountTeamRole"
  - name: "memberName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Touchpoint"
  description: "Recorded interaction between the onboarding team and the customer."
  data:
  - name: "interactionType"
    type: "InteractionType"
  - name: "channel"
    type: "CommunicationChannel"
  - name: "occurredAt"
    type: "Date"
  - name: "outcome"
    type: "InteractionOutcome"
  - name: "notes"
    type: "String"
  relations:
  - name: "journey"
    type: "OnboardingJourney"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
enums:
- name: "CustomerType"
  description: "Classification of the party being onboarded."
  data:
  - name: "Individual"
  - name: "Business"
  - name: "NonProfit"
  - name: "Government"
- name: "AccountType"
  description: "Nature of the account record relative to the customer’s organization."
  data:
  - name: "Company"
  - name: "Household"
  - name: "Partner"
  - name: "Subsidiary"
- name: "AccountLifecycle"
  description: "High-level state of the account through the onboarding continuum."
  data:
  - name: "Prospect"
  - name: "Onboarding"
  - name: "Active"
  - name: "Suspended"
  - name: "Closed"
- name: "OnboardingStatus"
  description: "Overall progress indicator for the onboarding journey."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Blocked"
  - name: "Completed"
  - name: "Cancelled"
- name: "StageType"
  description: "Canonical phase categories used to structure onboarding."
  data:
  - name: "Discovery"
  - name: "Compliance"
  - name: "Configuration"
  - name: "Training"
  - name: "GoLive"
  - name: "FollowUp"
- name: "StageStatus"
  description: "Execution status of a journey stage."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Blocked"
  - name: "Completed"
- name: "TaskType"
  description: "Kind of onboarding activity represented by a task."
  data:
  - name: "DocumentCollection"
  - name: "DataMigration"
  - name: "Configuration"
  - name: "TrainingSession"
  - name: "KickoffCall"
  - name: "ReviewMeeting"
  - name: "Provisioning"
  - name: "Verification"
- name: "TaskStatus_"
  description: "Lifecycle state of an onboarding task."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
  - name: "Failed"
- name: "TaskPriority"
  description: "Relative urgency used to triage and schedule tasks."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "ConsentType"
  description: "Category of consent captured from the customer."
  data:
  - name: "PrivacyPolicy"
  - name: "TermsOfService"
  - name: "MarketingEmails"
  - name: "DataProcessing"
  - name: "Cookie"
- name: "CommunicationChannel"
  description: "Medium used to communicate with the customer during onboarding."
  data:
  - name: "Email"
  - name: "Phone"
  - name: "SMS"
  - name: "InApp"
  - name: "PostalMail"
  - name: "Meeting"
- name: "VerificationMethod"
  description: "Technique used to verify identity or business legitimacy."
  data:
  - name: "DocumentScan"
  - name: "BankMicroDeposit"
  - name: "eKYC"
  - name: "VideoCall"
  - name: "GovernmentDatabase"
- name: "VerificationStatus"
  description: "Result state of the verification process."
  data:
  - name: "Pending"
  - name: "Verified"
  - name: "Rejected"
  - name: "Expired"
- name: "DocumentType"
  description: "Document categories typically requested during onboarding."
  data:
  - name: "GovernmentID"
  - name: "ProofOfAddress"
  - name: "BusinessLicense"
  - name: "TaxCertificate"
  - name: "BankStatement"
  - name: "IncorporationDocument"
- name: "DocumentRequestStatus"
  description: "Status of a document request as it progresses to completion."
  data:
  - name: "Requested"
  - name: "Received"
  - name: "UnderReview"
  - name: "Approved"
  - name: "Rejected"
  - name: "Waived"
- name: "DocumentStatus"
  description: "Outcome of reviewing a submitted document."
  data:
  - name: "Submitted"
  - name: "Accepted"
  - name: "Rejected"
  - name: "NeedsResubmission"
- name: "RiskLevel"
  description: "Normalized risk tier assigned during onboarding."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Severe"
- name: "RiskAssessmentStatus"
  description: "Processing status for overall risk evaluation."
  data:
  - name: "Pending"
  - name: "InReview"
  - name: "Completed"
- name: "ComplianceCheckType"
  description: "Types of regulatory or policy checks executed."
  data:
  - name: "AML"
  - name: "Sanctions"
  - name: "PEP"
  - name: "Credit"
  - name: "IndustryRegulation"
- name: "ComplianceStatus"
  description: "Result state for a compliance screening."
  data:
  - name: "Pending"
  - name: "Passed"
  - name: "Failed"
  - name: "Exempt"
- name: "SubscriptionStatus"
  description: "Activation lifecycle of a purchased product or plan."
  data:
  - name: "PendingActivation"
  - name: "Active"
  - name: "Trial"
  - name: "Suspended"
  - name: "Cancelled"
- name: "ProvisioningStatus"
  description: "Execution state of a provisioning order."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Provisioned"
  - name: "Failed"
  - name: "RolledBack"
- name: "BillingCycle"
  description: "Recurrence period defining invoice generation cadence."
  data:
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Annually"
- name: "InvoiceDeliveryMethod"
  description: "Mechanism by which invoices are sent to the customer."
  data:
  - name: "Email"
  - name: "Portal"
  - name: "PostalMail"
  - name: "EDI"
- name: "PaymentMethodType"
  description: "Supported types of payment instruments."
  data:
  - name: "CreditCard"
  - name: "BankTransfer"
  - name: "DirectDebit"
  - name: "DigitalWallet"
- name: "PaymentMethodStatus"
  description: "Operational readiness of a payment method."
  data:
  - name: "Active"
  - name: "Expired"
  - name: "Suspended"
  - name: "Verified"
  - name: "Unverified"
- name: "CommunicationStatus"
  description: "Delivery lifecycle for outbound communications."
  data:
  - name: "Draft"
  - name: "Queued"
  - name: "Sent"
  - name: "Failed"
  - name: "Delivered"
  - name: "Opened"
- name: "AccountTeamRole"
  description: "Role performed by team members supporting onboarding."
  data:
  - name: "AccountOwner"
  - name: "SolutionEngineer"
  - name: "CustomerSuccessManager"
  - name: "ImplementationLead"
  - name: "SupportLead"
- name: "InteractionType"
  description: "Form of customer engagement captured as a touchpoint."
  data:
  - name: "Call"
  - name: "Email"
  - name: "Meeting"
  - name: "Chat"
  - name: "Ticket"
  - name: "Survey"
- name: "InteractionOutcome"
  description: "Qualitative or procedural result of an interaction."
  data:
  - name: "Positive"
  - name: "Neutral"
  - name: "Negative"
  - name: "ActionRequired"
  - name: "Resolved"
- name: "UserRole"
  description: "Functional role of an internal user within onboarding."
  data:
  - name: "SalesRep"
  - name: "OnboardingSpecialist"
  - name: "CustomerSuccessManager"
  - name: "ComplianceAnalyst"
  - name: "BillingAnalyst"
  - name: "Administrator"
valueObjects:
- name: "Money"
  description: "Monetary value represented with a numeric amount and currency code."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Physical or mailing location used for contact and billing."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
