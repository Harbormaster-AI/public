---
metadata:
  name: "Territory Management"
  description: "Canonical capability model for defining, planning, assigning, and\
    \ governing sales territories, including geography, account coverage, quotas,\
    \ and realignment."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Sales & CRM"
  type: "Capability"
  domain: "Territory Management"
entities:
- name: "SalesOrganization"
  description: "Commercial entity that owns territory structures, quotas, and sales\
    \ teams."
  data:
  - name: "name"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "primaryRegion"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "territories"
    type: "Territory"
    multiplicity: "OneToMany"
  - name: "fiscalPeriods"
    type: "FiscalPeriod"
    multiplicity: "OneToMany"
  - name: "salesTeams"
    type: "SalesTeam"
    multiplicity: "OneToMany"
  - name: "territoryModels"
    type: "TerritoryModel"
    multiplicity: "OneToMany"
- name: "SalesTeam"
  description: "Group of sales representatives operating under a shared go-to-market\
    \ motion."
  data:
  - name: "name"
    type: "String"
  - name: "teamType"
    type: "SalesTeamType"
  relations:
  - name: "organization"
    type: "SalesOrganization"
    multiplicity: "ManyToOne"
  - name: "members"
    type: "TeamMembership"
    multiplicity: "OneToMany"
  - name: "manager"
    type: "SalesRepresentative"
    multiplicity: "ManyToOne"
- name: "SalesRepresentative"
  description: "Individual salesperson responsible for selling and managing customer\
    \ relationships."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "salesRole"
    type: "SalesRole"
  - name: "employmentType"
    type: "EmploymentType"
  relations:
  - name: "teamMemberships"
    type: "TeamMembership"
    multiplicity: "OneToMany"
  - name: "territoryMemberships"
    type: "TerritoryMembership"
    multiplicity: "OneToMany"
  - name: "manager"
    type: "SalesRepresentative"
    multiplicity: "ManyToOne"
- name: "TeamMembership"
  description: "Association of a sales representative to a sales team for a given\
    \ time window."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "team"
    type: "SalesTeam"
    multiplicity: "ManyToOne"
  - name: "representative"
    type: "SalesRepresentative"
    multiplicity: "ManyToOne"
- name: "TerritoryModel"
  description: "Versioned structure defining territories and coverage for a specific\
    \ effective period."
  data:
  - name: "name"
    type: "String"
  - name: "effectiveStart"
    type: "Date"
  - name: "effectiveEnd"
    type: "Date"
  - name: "status"
    type: "ModelStatus"
  relations:
  - name: "organization"
    type: "SalesOrganization"
    multiplicity: "ManyToOne"
  - name: "territories"
    type: "Territory"
    multiplicity: "OneToMany"
  - name: "realignments"
    type: "TerritoryRealignment"
    multiplicity: "OneToMany"
- name: "Territory"
  description: "Logical sales coverage unit defined by geography, named accounts,\
    \ or attributes."
  data:
  - name: "name"
    type: "String"
  - name: "territoryType"
    type: "TerritoryType"
  - name: "coverageType"
    type: "CoverageType"
  - name: "status"
    type: "TerritoryStatus"
  - name: "boundary"
    type: "GeoBoundary"
  relations:
  - name: "model"
    type: "TerritoryModel"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "Territory"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "Territory"
    multiplicity: "OneToMany"
  - name: "geoUnits"
    type: "GeoUnit"
    multiplicity: "ManyToMany"
  - name: "rules"
    type: "TerritoryRule"
    multiplicity: "OneToMany"
  - name: "members"
    type: "TerritoryMembership"
    multiplicity: "OneToMany"
  - name: "quotas"
    type: "TerritoryQuota"
    multiplicity: "OneToMany"
  - name: "productCoverages"
    type: "TerritoryProductCoverage"
    multiplicity: "OneToMany"
  - name: "accountAssignments"
    type: "AccountTerritoryAssignment"
    multiplicity: "OneToMany"
  - name: "performances"
    type: "TerritoryPerformance"
    multiplicity: "OneToMany"
- name: "GeoUnit"
  description: "Standardized geographic unit used for territorial rollups and coverage\
    \ mapping."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "unitType"
    type: "GeoUnitType"
  relations:
  - name: "territories"
    type: "Territory"
    multiplicity: "ManyToMany"
  - name: "parent"
    type: "GeoUnit"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "GeoUnit"
    multiplicity: "OneToMany"
- name: "TerritoryRule"
  description: "Logical rule determining whether a record falls within a territory’\
    s coverage."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "RuleType"
  - name: "scope"
    type: "AssignmentScope"
  - name: "priority"
    type: "Integer"
  - name: "description"
    type: "String"
  relations:
  - name: "territory"
    type: "Territory"
    multiplicity: "ManyToOne"
  - name: "criteria"
    type: "RuleCriterion"
    multiplicity: "OneToMany"
- name: "RuleCriterion"
  description: "Atomic conditional expression used within a territory rule."
  data:
  - name: "attribute"
    type: "String"
  - name: "operator_"
    type: "ComparisonOperator"
  - name: "value"
    type: "String"
  relations:
  - name: "rule"
    type: "TerritoryRule"
    multiplicity: "ManyToOne"
- name: "Account"
  description: "Customer or prospect organization that may be covered by a territory."
  data:
  - name: "name"
    type: "String"
  - name: "industry"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "annualRevenue"
    type: "Money"
  relations:
  - name: "accountAssignments"
    type: "AccountTerritoryAssignment"
    multiplicity: "OneToMany"
  - name: "coverageExceptions"
    type: "CoverageException"
    multiplicity: "OneToMany"
- name: "AccountTerritoryAssignment"
  description: "Time-bound linkage of an account to a territory with optional share."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "reason"
    type: "AssignmentReason"
  - name: "coverageShare"
    type: "Decimal"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "territory"
    type: "Territory"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "TerritoryRule"
    multiplicity: "ManyToOne"
- name: "TerritoryMembership"
  description: "Association of a sales representative to a territory with allocation."
  data:
  - name: "role"
    type: "TerritoryMemberRole"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "allocationPercent"
    type: "Decimal"
  relations:
  - name: "territory"
    type: "Territory"
    multiplicity: "ManyToOne"
  - name: "representative"
    type: "SalesRepresentative"
    multiplicity: "ManyToOne"
- name: "TerritoryQuota"
  description: "Performance target for a territory over a specified fiscal period."
  data:
  - name: "target"
    type: "Money"
  - name: "measure"
    type: "QuotaMeasure"
  relations:
  - name: "territory"
    type: "Territory"
    multiplicity: "ManyToOne"
  - name: "fiscalPeriod"
    type: "FiscalPeriod"
    multiplicity: "ManyToOne"
  - name: "splits"
    type: "QuotaSplit"
    multiplicity: "OneToMany"
- name: "QuotaSplit"
  description: "Allocation of a territory quota to an individual representative."
  data:
  - name: "percentage"
    type: "Decimal"
  relations:
  - name: "quota"
    type: "TerritoryQuota"
    multiplicity: "ManyToOne"
  - name: "representative"
    type: "SalesRepresentative"
    multiplicity: "ManyToOne"
- name: "TerritoryRealignment"
  description: "Planned change to territory definitions, memberships, or assignments."
  data:
  - name: "name"
    type: "String"
  - name: "reason"
    type: "RealignmentReason"
  - name: "scheduledDate"
    type: "Date"
  - name: "status"
    type: "RealignmentStatus"
  relations:
  - name: "model"
    type: "TerritoryModel"
    multiplicity: "ManyToOne"
  - name: "actions"
    type: "RealignmentAction"
    multiplicity: "OneToMany"
  - name: "requestedBy"
    type: "SalesRepresentative"
    multiplicity: "ManyToOne"
  - name: "approvedBy"
    type: "SalesRepresentative"
    multiplicity: "ManyToOne"
- name: "RealignmentAction"
  description: "Executable step within a territory realignment plan."
  data:
  - name: "actionType"
    type: "RealignmentActionType"
  - name: "notes"
    type: "String"
  relations:
  - name: "realignment"
    type: "TerritoryRealignment"
    multiplicity: "ManyToOne"
  - name: "fromTerritory"
    type: "Territory"
    multiplicity: "ManyToOne"
  - name: "toTerritory"
    type: "Territory"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "Product"
  description: "Sellable item or service relevant for territory product coverage."
  data:
  - name: "name"
    type: "String"
  - name: "sku"
    type: "String"
  - name: "category"
    type: "ProductCategory"
  relations:
  - name: "territoryCoverages"
    type: "TerritoryProductCoverage"
    multiplicity: "OneToMany"
- name: "TerritoryProductCoverage"
  description: "Product-level inclusion for a territory with optional timing and priority."
  data:
  - name: "priority"
    type: "Integer"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "territory"
    type: "Territory"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "FiscalPeriod"
  description: "Financial time window used for quotas, performance, and rollups."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "fiscalYear"
    type: "Integer"
  - name: "fiscalQuarter"
    type: "String"
  relations:
  - name: "quotas"
    type: "TerritoryQuota"
    multiplicity: "OneToMany"
  - name: "performances"
    type: "TerritoryPerformance"
    multiplicity: "OneToMany"
  - name: "organization"
    type: "SalesOrganization"
    multiplicity: "ManyToOne"
- name: "TerritoryPerformance"
  description: "Measured outcomes for a territory over a fiscal period."
  data:
  - name: "bookings"
    type: "Money"
  - name: "revenue"
    type: "Money"
  - name: "attainment"
    type: "Decimal"
  relations:
  - name: "territory"
    type: "Territory"
    multiplicity: "ManyToOne"
  - name: "fiscalPeriod"
    type: "FiscalPeriod"
    multiplicity: "ManyToOne"
- name: "CoverageException"
  description: "Approved deviation from standard territory coverage rules for a specific\
    \ account."
  data:
  - name: "description"
    type: "String"
  - name: "effectiveStart"
    type: "Date"
  - name: "effectiveEnd"
    type: "Date"
  - name: "status"
    type: "ExceptionStatus"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "territory"
    type: "Territory"
    multiplicity: "ManyToOne"
  - name: "approvedBy"
    type: "SalesRepresentative"
    multiplicity: "ManyToOne"
enums:
- name: "TerritoryType"
  description: "Classification of territory by organizing principle."
  data:
  - name: "Geographic"
  - name: "AccountBased"
  - name: "Overlay"
  - name: "Channel"
  - name: "Partner"
  - name: "Vertical"
- name: "CoverageType"
  description: "Method used to determine territorial inclusion."
  data:
  - name: "Geography"
  - name: "NamedAccounts"
  - name: "Attributes"
  - name: "Product"
  - name: "Mixed"
- name: "TerritoryStatus"
  description: "Lifecycle state of a territory."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "Frozen"
  - name: "Retired"
- name: "ModelStatus"
  description: "Lifecycle state of a territory model version."
  data:
  - name: "Draft"
  - name: "Proposed"
  - name: "Active"
  - name: "Archived"
- name: "SalesRole"
  description: "Primary responsibility of a sales representative."
  data:
  - name: "AccountExecutive"
  - name: "SalesManager"
  - name: "SalesDevelopment"
  - name: "OverlaySpecialist"
  - name: "ChannelManager"
- name: "EmploymentType"
  description: "Engagement model for a sales representative."
  data:
  - name: "Employee"
  - name: "Contractor"
  - name: "PartnerRep"
- name: "SalesTeamType"
  description: "Operating model characterizing a sales team."
  data:
  - name: "Direct"
  - name: "InsideSales"
  - name: "Channel"
  - name: "Overlay"
- name: "AssignmentScope"
  description: "Record type evaluated by territory rules."
  data:
  - name: "Account"
  - name: "Lead"
  - name: "Opportunity"
- name: "RuleType"
  description: "Inclusion semantics for records matching a rule."
  data:
  - name: "Inclusion"
  - name: "Exclusion"
- name: "ComparisonOperator"
  description: "Operator used to compare attribute values in criteria."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "GreaterThan"
  - name: "LessThan"
  - name: "GreaterOrEqual"
  - name: "LessOrEqual"
  - name: "Contains"
  - name: "StartsWith"
  - name: "EndsWith"
  - name: "In"
- name: "AssignmentReason"
  description: "Rationale for establishing an account-to-territory assignment."
  data:
  - name: "RuleBased"
  - name: "Manual"
  - name: "Exception"
  - name: "Inheritance"
  - name: "Realignment"
- name: "QuotaMeasure"
  description: "Metric against which territory performance is targeted."
  data:
  - name: "Revenue"
  - name: "Bookings"
  - name: "Units"
  - name: "Margin"
- name: "RealignmentReason"
  description: "Business driver for restructuring territories."
  data:
  - name: "TerritoryBalancing"
  - name: "OrgChange"
  - name: "MarketExpansion"
  - name: "ProductLaunch"
  - name: "PerformanceIssue"
- name: "RealignmentStatus"
  description: "Execution status of a territory realignment."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
- name: "RealignmentActionType"
  description: "Type of operation performed during realignment."
  data:
  - name: "MoveAccount"
  - name: "SplitAccount"
  - name: "MergeTerritories"
  - name: "CloseTerritory"
  - name: "OpenTerritory"
  - name: "ReassignRepresentative"
- name: "ProductCategory"
  description: "High-level classification of a sellable offering."
  data:
  - name: "Hardware"
  - name: "Software"
  - name: "Services"
  - name: "Subscription"
  - name: "Support"
- name: "TerritoryMemberRole"
  description: "Capacity in which a representative participates in a territory."
  data:
  - name: "Owner"
  - name: "Member"
  - name: "Overlay"
  - name: "Approver"
- name: "ExceptionStatus"
  description: "Review and approval state of a coverage exception."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Expired"
- name: "GeoUnitType"
  description: "Granularity of the geographic unit."
  data:
  - name: "Country"
  - name: "Region"
  - name: "State"
  - name: "County"
  - name: "City"
  - name: "PostalCode"
valueObjects:
- name: "Money"
  description: "Monetary value with associated currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal location for accounts and contacts."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "GeoBoundary"
  description: "Geographic boundary represented as a well-known text polygon."
  data:
  - name: "referenceSystem"
    type: "String"
  - name: "wkt"
    type: "String"
