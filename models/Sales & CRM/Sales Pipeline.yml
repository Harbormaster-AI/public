---
metadata:
  name: "Sales Pipeline Capabilities Model"
  description: "Structured capability model for defining, managing, and tracking sales\
    \ pipeline processes from qualification through close."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Sales & CRM"
  type: "Capability"
  domain: "Sales Pipeline"
entities:
- name: "SalesPipeline"
  description: "Definition of a sales process and its sequence of stages."
  data:
  - name: "name"
    type: "String"
  - name: "pipelineType"
    type: "PipelineType"
  - name: "isDefault"
    type: "Boolean"
  relations:
  - name: "stages"
    type: "PipelineStage"
    multiplicity: "OneToMany"
  - name: "salesTeams"
    type: "SalesTeam"
    multiplicity: "ManyToMany"
  - name: "probabilityModel"
    type: "ProbabilityModel"
    multiplicity: "ManyToOne"
- name: "PipelineStage"
  description: "A named step within a pipeline with ordering, semantics, and default\
    \ probabilities."
  data:
  - name: "name"
    type: "String"
  - name: "orderIndex"
    type: "Integer"
  - name: "stageType"
    type: "StageType"
  - name: "defaultWinProbability"
    type: "Probability"
  - name: "isForecastIncluded"
    type: "Boolean"
  relations:
  - name: "pipeline"
    type: "SalesPipeline"
    multiplicity: "ManyToOne"
  - name: "qualificationChecklist"
    type: "QualificationChecklist"
    multiplicity: "OneToOne"
  - name: "outboundTransitions"
    type: "StageTransitionRule"
    multiplicity: "OneToMany"
  - name: "inboundTransitions"
    type: "StageTransitionRule"
    multiplicity: "OneToMany"
- name: "StageTransitionRule"
  description: "Governance for moving an opportunity between stages within a pipeline."
  data:
  - name: "name"
    type: "String"
  - name: "policy"
    type: "StageTransitionPolicy"
  - name: "entryCriteria"
    type: "String"
  - name: "exitCriteria"
    type: "String"
  - name: "isRequired"
    type: "Boolean"
  relations:
  - name: "fromStage"
    type: "PipelineStage"
    multiplicity: "ManyToOne"
  - name: "toStage"
    type: "PipelineStage"
    multiplicity: "ManyToOne"
  - name: "pipeline"
    type: "SalesPipeline"
    multiplicity: "ManyToOne"
- name: "Opportunity"
  description: "A qualified sales pursuit tracked through pipeline stages until closure."
  data:
  - name: "name"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "expectedCloseDate"
    type: "Date"
  - name: "forecastCategory"
    type: "ForecastCategory"
  - name: "status"
    type: "OpportunityStatus"
  - name: "probability"
    type: "Probability"
  - name: "lossReason"
    type: "LossReason"
  - name: "nextStep"
    type: "String"
  relations:
  - name: "pipeline"
    type: "SalesPipeline"
    multiplicity: "ManyToOne"
  - name: "currentStage"
    type: "PipelineStage"
    multiplicity: "ManyToOne"
  - name: "stageHistory"
    type: "OpportunityStage"
    multiplicity: "OneToMany"
  - name: "owner"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "primaryContact"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "stakeholders"
    type: "Contact"
    multiplicity: "ManyToMany"
  - name: "activities"
    type: "Activity"
    multiplicity: "OneToMany"
  - name: "collaborators"
    type: "Seller"
    multiplicity: "ManyToMany"
  - name: "competitors"
    type: "Competitor"
    multiplicity: "ManyToMany"
  - name: "risks"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "originatingLead"
    type: "Lead"
    multiplicity: "ManyToOne"
- name: "OpportunityStage"
  description: "Historical record of an opportunity’s progression through a specific\
    \ pipeline stage."
  data:
  - name: "enteredAt"
    type: "Date"
  - name: "exitedAt"
    type: "Date"
  - name: "exitStatus"
    type: "StageExitStatus"
  - name: "durationDays"
    type: "Integer"
  relations:
  - name: "opportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
  - name: "stage"
    type: "PipelineStage"
    multiplicity: "ManyToOne"
  - name: "changedBy"
    type: "Seller"
    multiplicity: "ManyToOne"
- name: "Seller"
  description: "Sales user responsible for owning, advancing, and closing opportunities."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "salesRole"
    type: "SalesRole"
  relations:
  - name: "team"
    type: "SalesTeam"
    multiplicity: "ManyToOne"
  - name: "opportunities"
    type: "Opportunity"
    multiplicity: "OneToMany"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "activities"
    type: "Activity"
    multiplicity: "OneToMany"
- name: "SalesTeam"
  description: "Collaborative group of sellers that share goals, territories, and\
    \ pipelines."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "members"
    type: "Seller"
    multiplicity: "OneToMany"
  - name: "pipelines"
    type: "SalesPipeline"
    multiplicity: "ManyToMany"
  - name: "pipelineSnapshots"
    type: "PipelineSnapshot"
    multiplicity: "OneToMany"
- name: "Account"
  description: "Customer or prospect organization engaged by the sales team."
  data:
  - name: "name"
    type: "String"
  - name: "accountTier"
    type: "AccountTier"
  - name: "website"
    type: "String"
  - name: "billingAddress"
    type: "Address"
  relations:
  - name: "owner"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "contacts"
    type: "Contact"
    multiplicity: "OneToMany"
  - name: "opportunities"
    type: "Opportunity"
    multiplicity: "OneToMany"
- name: "Contact"
  description: "Individual associated with an account and engaged during the sales\
    \ cycle."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "jobTitle"
    type: "String"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "activities"
    type: "Activity"
    multiplicity: "OneToMany"
  - name: "opportunities"
    type: "Opportunity"
    multiplicity: "ManyToMany"
- name: "Activity"
  description: "Planned or completed action that advances a lead or opportunity."
  data:
  - name: "activityType"
    type: "ActivityType"
  - name: "subject"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "ActivityStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "opportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "Lead"
  description: "Unqualified prospect that may be worked and converted into an opportunity."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "company"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "source"
    type: "LeadSource"
  - name: "status"
    type: "LeadStatus"
  relations:
  - name: "owner"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "convertedOpportunity"
    type: "Opportunity"
    multiplicity: "OneToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "QualificationChecklist"
  description: "Set of verifications required to progress an opportunity through a\
    \ stage."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "stage"
    type: "PipelineStage"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "ChecklistItem"
    multiplicity: "OneToMany"
- name: "ChecklistItem"
  description: "Individual criterion that must be satisfied for stage progression."
  data:
  - name: "name"
    type: "String"
  - name: "isRequired"
    type: "Boolean"
  - name: "guidance"
    type: "String"
  - name: "status"
    type: "ChecklistStatus"
  relations:
  - name: "checklist"
    type: "QualificationChecklist"
    multiplicity: "ManyToOne"
  - name: "verifiedBy"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "relatedOpportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
- name: "Competitor"
  description: "Alternative vendor or solution evaluated against the offering."
  data:
  - name: "name"
    type: "String"
  - name: "strengths"
    type: "String"
  - name: "weaknesses"
    type: "String"
  relations:
  - name: "opportunities"
    type: "Opportunity"
    multiplicity: "ManyToMany"
- name: "RiskAssessment"
  description: "Evaluation of potential impediments to winning an opportunity."
  data:
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "summary"
    type: "String"
  - name: "nextActionDate"
    type: "Date"
  relations:
  - name: "opportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Seller"
    multiplicity: "ManyToOne"
- name: "ProbabilityModel"
  description: "Methodology used to compute opportunity win probability and weighted\
    \ forecasts."
  data:
  - name: "name"
    type: "String"
  - name: "method"
    type: "ProbabilityMethod"
  - name: "description"
    type: "String"
  relations:
  - name: "pipelines"
    type: "SalesPipeline"
    multiplicity: "OneToMany"
- name: "PipelineSnapshot"
  description: "Periodic summary of pipeline metrics for a specific date and context."
  data:
  - name: "snapshotDate"
    type: "Date"
  - name: "openDealCount"
    type: "Integer"
  - name: "totalOpenAmount"
    type: "Money"
  - name: "weightedOpenAmount"
    type: "Money"
  relations:
  - name: "pipeline"
    type: "SalesPipeline"
    multiplicity: "ManyToOne"
  - name: "team"
    type: "SalesTeam"
    multiplicity: "ManyToOne"
enums:
- name: "PipelineType"
  description: "Classification of the pipeline based on go-to-market motion."
  data:
  - name: "Standard"
  - name: "Enterprise"
  - name: "Channel"
  - name: "InsideSales"
  - name: "PartnerLed"
- name: "StageType"
  description: "Semantic category for a pipeline stage."
  data:
  - name: "Qualification"
  - name: "Discovery"
  - name: "Evaluation"
  - name: "Proposal"
  - name: "Negotiation"
  - name: "Closing"
- name: "StageTransitionPolicy"
  description: "Degree of enforcement when moving opportunities between stages."
  data:
  - name: "Strict"
  - name: "Guided"
  - name: "Flexible"
- name: "OpportunityStatus"
  description: "Lifecycle state of an opportunity."
  data:
  - name: "Open"
  - name: "Won"
  - name: "Lost"
  - name: "OnHold"
  - name: "Abandoned"
- name: "ForecastCategory"
  description: "Forecast grouping assigned for rollups and commit tracking."
  data:
  - name: "Pipeline"
  - name: "BestCase"
  - name: "Commit"
  - name: "Omitted"
  - name: "Closed"
- name: "StageExitStatus"
  description: "Outcome recorded when leaving a stage."
  data:
  - name: "Progressed"
  - name: "Recycled"
  - name: "ClosedWon"
  - name: "ClosedLost"
- name: "ActivityType"
  description: "Type of action taken during the sales process."
  data:
  - name: "Call"
  - name: "Email"
  - name: "Meeting"
  - name: "Demo"
  - name: "Task"
  - name: "SocialTouch"
- name: "ActivityStatus"
  description: "Execution state of an activity."
  data:
  - name: "Planned"
  - name: "Completed"
  - name: "Canceled"
  - name: "Deferred"
- name: "LeadSource"
  description: "Origin of a lead."
  data:
  - name: "Website"
  - name: "Referral"
  - name: "Event"
  - name: "Partner"
  - name: "Outbound"
  - name: "Inbound"
  - name: "Social"
  - name: "Advertising"
- name: "LeadStatus"
  description: "Current working state of a lead."
  data:
  - name: "New"
  - name: "Working"
  - name: "Nurturing"
  - name: "Qualified"
  - name: "Disqualified"
  - name: "Converted"
- name: "SalesRole"
  description: "Functional role of a seller within the sales organization."
  data:
  - name: "SDR"
  - name: "AE"
  - name: "SalesManager"
  - name: "SalesOps"
  - name: "CSM"
- name: "AccountTier"
  description: "Priority classification of an account based on strategic value."
  data:
  - name: "Strategic"
  - name: "Major"
  - name: "MidMarket"
  - name: "SMB"
- name: "RiskLevel"
  description: "Assessed severity of risk affecting deal progress."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "ProbabilityMethod"
  description: "Approach for calculating opportunity win probability."
  data:
  - name: "Manual"
  - name: "StageBased"
  - name: "AIModel"
  - name: "Historical"
- name: "ChecklistStatus"
  description: "Completion state of a checklist item."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Completed"
  - name: "Waived"
- name: "LossReason"
  description: "Primary explanation for why an opportunity was lost."
  data:
  - name: "Price"
  - name: "Competitor"
  - name: "NoDecision"
  - name: "Timing"
  - name: "FeatureGap"
  - name: "Budget"
  - name: "Authority"
valueObjects:
- name: "Money"
  description: "Monetary value represented by an amount and currency code."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Probability"
  description: "Likelihood expressed as a decimal between 0 and 1."
  data:
  - name: "value"
    type: "Decimal"
- name: "Address"
  description: "Physical or mailing address for an organization."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
