---
metadata:
  name: "Quote Management"
  description: "Capabilities model for end-to-end creation, pricing, approval, and\
    \ delivery of sales quotes."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Sales & CRM"
  type: "Capability"
  domain: "Quote Management"
entities:
- name: "Account"
  description: "Customer organization or buying entity that receives quotes."
  data:
  - name: "name"
    type: "String"
  - name: "industry"
    type: "String"
  - name: "billingAddress"
    type: "Address"
  - name: "shippingAddress"
    type: "Address"
  - name: "taxExemptionNumber"
    type: "String"
  - name: "defaultPaymentTerm"
    type: "PaymentTerm"
  relations:
  - name: "contacts"
    type: "Contact"
    multiplicity: "OneToMany"
  - name: "quotes"
    type: "Quote"
    multiplicity: "OneToMany"
  - name: "opportunities"
    type: "Opportunity"
    multiplicity: "OneToMany"
  - name: "priceAgreements"
    type: "AccountPriceAgreement"
    multiplicity: "OneToMany"
- name: "Contact"
  description: "Individual associated with an account who can request, receive, or\
    \ approve quotes."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "title"
    type: "String"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "quotes"
    type: "Quote"
    multiplicity: "OneToMany"
- name: "Opportunity"
  description: "Sales opportunity that may be supported by one or more quotes."
  data:
  - name: "name"
    type: "String"
  - name: "stage"
    type: "OpportunityStage"
  - name: "expectedCloseDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "quotes"
    type: "Quote"
    multiplicity: "OneToMany"
- name: "Product"
  description: "Sellable good, service, or subscription that can be quoted."
  data:
  - name: "name"
    type: "String"
  - name: "sku"
    type: "String"
  - name: "productType"
    type: "ProductType"
  - name: "unitOfMeasure"
    type: "String"
  - name: "active"
    type: "Boolean"
  - name: "description"
    type: "String"
  relations:
  - name: "priceBookItems"
    type: "PriceBookItem"
    multiplicity: "OneToMany"
  - name: "quoteLines"
    type: "QuoteLine"
    multiplicity: "OneToMany"
  - name: "priceAgreements"
    type: "AccountPriceAgreement"
    multiplicity: "OneToMany"
- name: "PriceBook"
  description: "Catalog of prices used to derive quoted pricing."
  data:
  - name: "name"
    type: "String"
  - name: "active"
    type: "Boolean"
  - name: "currency"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "items"
    type: "PriceBookItem"
    multiplicity: "OneToMany"
  - name: "quotes"
    type: "Quote"
    multiplicity: "OneToMany"
  - name: "pricingRules"
    type: "PricingRule"
    multiplicity: "OneToMany"
- name: "PriceBookItem"
  description: "Price entry for a specific product within a price book."
  data:
  - name: "unitOfMeasure"
    type: "String"
  - name: "listPrice"
    type: "Money"
  - name: "minPrice"
    type: "Money"
  - name: "maxPrice"
    type: "Money"
  - name: "priceSource"
    type: "PriceSource"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "priceBook"
    type: "PriceBook"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "Quote"
  description: "Commercial offer containing priced items, terms, and approvals presented\
    \ to a buyer."
  data:
  - name: "quoteNumber"
    type: "String"
  - name: "status"
    type: "QuoteStatus"
  - name: "issueDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "pricingDate"
    type: "Date"
  - name: "subtotal"
    type: "Money"
  - name: "discountTotal"
    type: "Money"
  - name: "taxTotal"
    type: "Money"
  - name: "shippingTotal"
    type: "Money"
  - name: "grandTotal"
    type: "Money"
  - name: "paymentTerm"
    type: "PaymentTerm"
  - name: "notes"
    type: "String"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "opportunity"
    type: "Opportunity"
    multiplicity: "ManyToOne"
  - name: "priceBook"
    type: "PriceBook"
    multiplicity: "ManyToOne"
  - name: "priceAgreement"
    type: "AccountPriceAgreement"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "QuoteLine"
    multiplicity: "OneToMany"
  - name: "adjustments"
    type: "PriceAdjustment"
    multiplicity: "OneToMany"
  - name: "terms"
    type: "QuoteTerm"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "QuoteApproval"
    multiplicity: "OneToMany"
  - name: "revisions"
    type: "QuoteRevision"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "QuoteDocument"
    multiplicity: "OneToMany"
  - name: "recipients"
    type: "QuoteRecipient"
    multiplicity: "OneToMany"
  - name: "shippingMethod"
    type: "ShippingMethod"
    multiplicity: "ManyToOne"
  - name: "eSignatureEnvelope"
    type: "ESignatureEnvelope"
    multiplicity: "OneToOne"
- name: "QuoteLine"
  description: "Line item within a quote representing a product, service, or charge."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "lineType"
    type: "QuoteLineType"
  - name: "description"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "unitPrice"
    type: "Money"
  - name: "listPrice"
    type: "Money"
  - name: "extendedAmount"
    type: "Money"
  - name: "discountPercent"
    type: "Decimal"
  - name: "discountAmount"
    type: "Money"
  - name: "taxPercent"
    type: "Percentage"
  - name: "taxAmount"
    type: "Money"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "billingFrequency"
    type: "BillingFrequency"
  - name: "chargeType"
    type: "ChargeType"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "taxRate"
    type: "TaxRate"
    multiplicity: "ManyToOne"
  - name: "adjustments"
    type: "PriceAdjustment"
    multiplicity: "OneToMany"
- name: "PriceAdjustment"
  description: "Discount, surcharge, or promotional change applied at line or quote\
    \ level."
  data:
  - name: "name"
    type: "String"
  - name: "adjustmentType"
    type: "AdjustmentType"
  - name: "method"
    type: "CalculationMethod"
  - name: "value"
    type: "Decimal"
  - name: "appliedAmount"
    type: "Money"
  - name: "reason"
    type: "String"
  - name: "scope"
    type: "AdjustmentScope"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
  - name: "line"
    type: "QuoteLine"
    multiplicity: "ManyToOne"
- name: "TaxRate"
  description: "Jurisdictional tax definition used to calculate taxes on quoted amounts."
  data:
  - name: "name"
    type: "String"
  - name: "jurisdiction"
    type: "String"
  - name: "rate"
    type: "Percentage"
  - name: "taxType"
    type: "TaxType"
  - name: "effectiveDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "quoteLines"
    type: "QuoteLine"
    multiplicity: "OneToMany"
- name: "ShippingMethod"
  description: "Shipping option available for delivery of goods included on a quote."
  data:
  - name: "name"
    type: "String"
  - name: "carrier"
    type: "String"
  - name: "leadTimeDays"
    type: "Integer"
  - name: "cost"
    type: "Money"
  - name: "active"
    type: "Boolean"
  - name: "terms"
    type: "String"
  relations:
  - name: "quotes"
    type: "Quote"
    multiplicity: "OneToMany"
- name: "QuoteTerm"
  description: "Clause or condition included in the quote."
  data:
  - name: "name"
    type: "String"
  - name: "content"
    type: "String"
  - name: "termType"
    type: "TermType"
  - name: "displayOrder"
    type: "Integer"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
- name: "QuoteApproval"
  description: "Approval checkpoint and decision associated with a quote."
  data:
  - name: "stepName"
    type: "String"
  - name: "status"
    type: "ApprovalStatus"
  - name: "approverName"
    type: "String"
  - name: "approverEmail"
    type: "EmailAddress"
  - name: "decisionDate"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
- name: "QuoteRevision"
  description: "Snapshot of a quote at a point in time for version control."
  data:
  - name: "revisionNumber"
    type: "Integer"
  - name: "status"
    type: "RevisionStatus"
  - name: "revisionReason"
    type: "String"
  - name: "createdDate"
    type: "Date"
  - name: "total"
    type: "Money"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
- name: "QuoteDocument"
  description: "Generated document representation of the quote."
  data:
  - name: "fileName"
    type: "String"
  - name: "format"
    type: "DocumentFormat"
  - name: "templateName"
    type: "String"
  - name: "generatedDate"
    type: "Date"
  - name: "versionLabel"
    type: "String"
  - name: "deliveryMethod"
    type: "DeliveryMethod"
  - name: "publicUrl"
    type: "String"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
  - name: "eSignatureEnvelope"
    type: "ESignatureEnvelope"
    multiplicity: "ManyToOne"
- name: "QuoteRecipient"
  description: "Person who receives the quote for review, approval, or signature."
  data:
  - name: "recipientName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "role"
    type: "RecipientRole"
  - name: "deliveryStatus"
    type: "DeliveryStatus"
  - name: "viewedDate"
    type: "Date"
  - name: "signedDate"
    type: "Date"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "ManyToOne"
  - name: "eSignatureEnvelope"
    type: "ESignatureEnvelope"
    multiplicity: "ManyToOne"
- name: "ESignatureEnvelope"
  description: "Electronic signature transaction containing recipients and quote documents."
  data:
  - name: "provider"
    type: "String"
  - name: "envelopeReference"
    type: "String"
  - name: "status"
    type: "ESignatureStatus"
  - name: "sentDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "quote"
    type: "Quote"
    multiplicity: "OneToOne"
  - name: "recipients"
    type: "QuoteRecipient"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "QuoteDocument"
    multiplicity: "OneToMany"
- name: "PricingRule"
  description: "Configurable logic used to derive or adjust pricing during quote calculation."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "PricingRuleType"
  - name: "conditionExpression"
    type: "String"
  - name: "method"
    type: "CalculationMethod"
  - name: "value"
    type: "Decimal"
  - name: "active"
    type: "Boolean"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "priceBook"
    type: "PriceBook"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "AccountPriceAgreement"
  description: "Pre-negotiated pricing arrangement between an account and the seller."
  data:
  - name: "agreementNumber"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "discountPercent"
    type: "Decimal"
  - name: "status"
    type: "AgreementStatus"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "quotes"
    type: "Quote"
    multiplicity: "OneToMany"
enums:
- name: "QuoteStatus"
  description: "Lifecycle state of a quote from creation to acceptance or closure."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Approved"
  - name: "Rejected"
  - name: "Presented"
  - name: "Accepted"
  - name: "Signed"
  - name: "Expired"
  - name: "Withdrawn"
  - name: "Cancelled"
- name: "QuoteLineType"
  description: "Classification of a quote line to inform pricing and presentation\
    \ behavior."
  data:
  - name: "Product"
  - name: "Service"
  - name: "Subscription"
  - name: "Charge"
  - name: "Comment"
  - name: "Section"
- name: "BillingFrequency"
  description: "Recurrence interval used for subscription or service billing."
  data:
  - name: "OneTime"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "SemiAnnual"
  - name: "Annual"
- name: "ChargeType"
  description: "Nature of the charge determining how it is applied and recognized."
  data:
  - name: "OneTime"
  - name: "Recurring"
  - name: "Usage"
- name: "PriceSource"
  description: "Origin of the price used to quote a line or item."
  data:
  - name: "Manual"
  - name: "PriceBook"
  - name: "Contract"
  - name: "Promotion"
  - name: "Override"
  - name: "Rule"
- name: "ApprovalStatus"
  description: "Decision state for a quote approval step."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
  - name: "Escalated"
  - name: "Cancelled"
- name: "TermType"
  description: "Category of legal or commercial clause included in a quote."
  data:
  - name: "Payment"
  - name: "Delivery"
  - name: "Warranty"
  - name: "Cancellation"
  - name: "GoverningLaw"
  - name: "Confidentiality"
  - name: "Custom"
- name: "RevisionStatus"
  description: "Publication state for a stored quote version."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Superseded"
  - name: "Archived"
- name: "DocumentFormat"
  description: "File format used for generated quote documents."
  data:
  - name: "PDF"
  - name: "DOCX"
  - name: "HTML"
- name: "DeliveryMethod"
  description: "Mode used to deliver the quote document to recipients."
  data:
  - name: "Download"
  - name: "Email"
  - name: "ESignature"
  - name: "Print"
- name: "RecipientRole"
  description: "Functional role of a quote recipient within the buying process."
  data:
  - name: "DecisionMaker"
  - name: "Influencer"
  - name: "Legal"
  - name: "Finance"
  - name: "Technical"
  - name: "Other"
- name: "DeliveryStatus"
  description: "Status of the quote distribution to a recipient."
  data:
  - name: "Pending"
  - name: "Sent"
  - name: "Viewed"
  - name: "Bounced"
  - name: "Failed"
- name: "ESignatureStatus"
  description: "Current state of the e-signature transaction for a quote."
  data:
  - name: "Created"
  - name: "Sent"
  - name: "Completed"
  - name: "Declined"
  - name: "Voided"
- name: "TaxType"
  description: "Type of indirect tax applicable to quoted items."
  data:
  - name: "VAT"
  - name: "GST"
  - name: "SalesTax"
  - name: "ServiceTax"
  - name: "Withholding"
- name: "OpportunityStage"
  description: "Stage of the associated sales opportunity lifecycle."
  data:
  - name: "Prospecting"
  - name: "Qualification"
  - name: "Proposal"
  - name: "Negotiation"
  - name: "ClosedWon"
  - name: "ClosedLost"
- name: "PaymentTerm"
  description: "Agreed timeline for payment of the quoted amount."
  data:
  - name: "DueOnReceipt"
  - name: "Net15"
  - name: "Net30"
  - name: "Net45"
  - name: "Net60"
  - name: "Advance"
  - name: "Milestone"
- name: "ProductType"
  description: "Type of product that determines pricing and fulfillment approach."
  data:
  - name: "Goods"
  - name: "Service"
  - name: "Subscription"
  - name: "Bundle"
- name: "PricingRuleType"
  description: "Category of pricing logic used during price calculation."
  data:
  - name: "Volume"
  - name: "Tiered"
  - name: "TimeBound"
  - name: "Contract"
  - name: "Promotional"
- name: "RenewalType"
  description: "Renewal policy for subscription lines quoted to the customer."
  data:
  - name: "AutoRenew"
  - name: "Manual"
  - name: "NonRenewing"
- name: "AdjustmentScope"
  description: "Level at which an adjustment is applied during pricing."
  data:
  - name: "Line"
  - name: "Quote"
- name: "AdjustmentType"
  description: "Kind of adjustment modifying price or totals."
  data:
  - name: "Discount"
  - name: "Surcharge"
  - name: "Promotion"
  - name: "Rounding"
- name: "CalculationMethod"
  description: "Method used to compute the effect of an adjustment."
  data:
  - name: "Amount"
  - name: "Percent"
  - name: "Unit"
  - name: "PriceOverride"
- name: "AgreementStatus"
  description: "Lifecycle state of an account pricing agreement."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Expired"
  - name: "Terminated"
valueObjects:
- name: "Money"
  description: "Monetary amount expressed in a specific currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal location used for billing or shipping purposes."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "EmailAddress"
  description: "Electronic mail address for a person or organization."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "Dialable telephone number with optional country code."
  data:
  - name: "countryCode"
    type: "String"
  - name: "number"
    type: "String"
- name: "Percentage"
  description: "Fractional value expressed as a percentage for rates and proportions."
  data:
  - name: "value"
    type: "Decimal"
