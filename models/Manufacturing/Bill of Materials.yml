---
metadata:
  name: "HCIDL Capabilities Model - Bill of Materials"
  description: "Canonical capability model for managing items, revisions, and structured\
    \ bills of materials, including alternates, substitutes, effectivity, and change\
    \ control across the product lifecycle."
  version: "1.0.0"
  industry: "Manufacturing"
  category: "Manufacturing"
  type: "Capability"
  domain: "Bill of Materials"
entities:
- name: "Item"
  description: "Master definition of a part, material, or service controlled for use\
    \ in bills of materials."
  data:
  - name: "itemNumber"
    type: "String"
  - name: "name"
    type: "String"
  - name: "itemType"
    type: "ItemType"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  - name: "lifecycleState"
    type: "LifecycleState"
  - name: "sourceType"
    type: "SourceType"
  relations:
  - name: "revisions"
    type: "ItemRevision"
    multiplicity: "OneToMany"
  - name: "specifications"
    type: "ControlledDocument"
    multiplicity: "OneToMany"
  - name: "approvedSources"
    type: "ApprovedSource"
    multiplicity: "OneToMany"
- name: "ItemRevision"
  description: "Versioned definition of an item capturing releasable design and manufacturing\
    \ intent."
  data:
  - name: "revisionCode"
    type: "String"
  - name: "description"
    type: "String"
  - name: "releaseStatus"
    type: "ReleaseStatus"
  - name: "releaseDate"
    type: "Date"
  - name: "obsoleteDate"
    type: "Date"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "billsOfMaterial"
    type: "BillOfMaterial"
    multiplicity: "OneToMany"
  - name: "governedBy"
    type: "ChangeOrder"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "ControlledDocument"
    multiplicity: "ManyToMany"
- name: "BillOfMaterial"
  description: "Structured list of components required to build a specific parent\
    \ item revision."
  data:
  - name: "name"
    type: "String"
  - name: "bomType"
    type: "BomType"
  - name: "effectivity"
    type: "Effectivity"
  - name: "defaultUnitOfMeasure"
    type: "UnitOfMeasure"
  relations:
  - name: "parentRevision"
    type: "ItemRevision"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "BomLine"
    multiplicity: "OneToMany"
  - name: "changeOrder"
    type: "ChangeOrder"
    multiplicity: "ManyToOne"
- name: "BomLine"
  description: "Component line defining quantity, usage, and conditions for inclusion\
    \ within a bill of materials."
  data:
  - name: "findNumber"
    type: "String"
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Quantity"
  - name: "componentRole"
    type: "ComponentRole"
  - name: "scrapFactorPercent"
    type: "Decimal"
  - name: "effectivity"
    type: "Effectivity"
  - name: "notes"
    type: "TextNote"
  relations:
  - name: "billOfMaterial"
    type: "BillOfMaterial"
    multiplicity: "ManyToOne"
  - name: "componentRevision"
    type: "ItemRevision"
    multiplicity: "ManyToOne"
  - name: "alternates"
    type: "AlternateItem"
    multiplicity: "OneToMany"
  - name: "substitutes"
    type: "SubstituteComponent"
    multiplicity: "OneToMany"
- name: "AlternateItem"
  description: "Interchangeable component designated as an alternate for a BOM line\
    \ with defined preference."
  data:
  - name: "rank"
    type: "Integer"
  - name: "approvalStatus"
    type: "ApprovalStatus"
  - name: "conditions"
    type: "String"
  relations:
  - name: "bomLine"
    type: "BomLine"
    multiplicity: "ManyToOne"
  - name: "alternateRevision"
    type: "ItemRevision"
    multiplicity: "ManyToOne"
- name: "SubstituteComponent"
  description: "Replacement component permitted under specified conditions for a BOM\
    \ line."
  data:
  - name: "substitutionRatio"
    type: "Decimal"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "reason"
    type: "String"
  relations:
  - name: "bomLine"
    type: "BomLine"
    multiplicity: "ManyToOne"
  - name: "substituteRevision"
    type: "ItemRevision"
    multiplicity: "ManyToOne"
- name: "ControlledDocument"
  description: "Managed specification, drawing, or instruction associated with an\
    \ item or item revision."
  data:
  - name: "documentNumber"
    type: "String"
  - name: "title"
    type: "String"
  - name: "documentType"
    type: "DocumentType"
  - name: "revision"
    type: "String"
  - name: "url"
    type: "String"
  relations:
  - name: "relatedItems"
    type: "Item"
    multiplicity: "ManyToMany"
  - name: "relatedRevisions"
    type: "ItemRevision"
    multiplicity: "ManyToMany"
  - name: "changeOrder"
    type: "ChangeOrder"
    multiplicity: "ManyToOne"
- name: "ChangeOrder"
  description: "Formal change record controlling creation and modification of items,\
    \ revisions, and bills of materials."
  data:
  - name: "changeNumber"
    type: "String"
  - name: "title"
    type: "String"
  - name: "changeType"
    type: "ChangeType"
  - name: "status"
    type: "ChangeStatus"
  - name: "plannedEffective"
    type: "Date"
  - name: "actualEffective"
    type: "Date"
  relations:
  - name: "impactedItems"
    type: "Item"
    multiplicity: "ManyToMany"
  - name: "impactedRevisions"
    type: "ItemRevision"
    multiplicity: "ManyToMany"
  - name: "impactedBoms"
    type: "BillOfMaterial"
    multiplicity: "ManyToMany"
  - name: "impacts"
    type: "ChangeImpact"
    multiplicity: "OneToMany"
- name: "ChangeImpact"
  description: "Assessed impact details for a change order including area, disposition,\
    \ and estimated cost."
  data:
  - name: "area"
    type: "ImpactArea"
  - name: "disposition"
    type: "DispositionType"
  - name: "estimatedCost"
    type: "CurrencyAmount"
  - name: "notes"
    type: "TextNote"
  relations:
  - name: "changeOrder"
    type: "ChangeOrder"
    multiplicity: "ManyToOne"
- name: "ApprovedSource"
  description: "Approved external source for procuring a specific item or item revision."
  data:
  - name: "sourceName"
    type: "String"
  - name: "manufacturerPartNumber"
    type: "String"
  - name: "status"
    type: "ApprovalStatus"
  - name: "leadTimeDays"
    type: "Integer"
  - name: "countryOfOrigin"
    type: "String"
  relations:
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "itemRevision"
    type: "ItemRevision"
    multiplicity: "ManyToOne"
enums:
- name: "ItemType"
  description: "Classification of an item based on sourcing and usage."
  data:
  - name: "Purchased"
  - name: "Manufactured"
  - name: "Phantom"
  - name: "Tooling"
  - name: "Service"
  - name: "Software"
- name: "UnitOfMeasure"
  description: "Standard units used for quantities within items and BOM lines."
  data:
  - name: "Each"
  - name: "Set"
  - name: "Pair"
  - name: "Gram"
  - name: "Kilogram"
  - name: "Pound"
  - name: "Millilitre"
  - name: "Litre"
  - name: "Inch"
  - name: "Centimetre"
  - name: "Metre"
  - name: "SquareMetre"
  - name: "CubicMetre"
  - name: "Hour"
  - name: "Sheet"
  - name: "Roll"
- name: "LifecycleState"
  description: "High-level lifecycle stage of an item."
  data:
  - name: "Concept"
  - name: "Prototype"
  - name: "Released"
  - name: "Obsolete"
- name: "SourceType"
  description: "Procurement or production source designation for an item."
  data:
  - name: "Make"
  - name: "Buy"
  - name: "BuyToOrder"
  - name: "Subcontract"
- name: "ReleaseStatus"
  description: "Approval and availability state of an item revision."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Released"
  - name: "Obsolete"
- name: "BomType"
  description: "Purpose and context for a bill of materials."
  data:
  - name: "Engineering"
  - name: "Manufacturing"
  - name: "Service"
  - name: "Planning"
- name: "ComponentRole"
  description: "Usage intent of a component within a BOM line."
  data:
  - name: "Mandatory"
  - name: "Optional"
  - name: "Reference"
- name: "ApprovalStatus"
  description: "Authorization state used for alternates and approved sources."
  data:
  - name: "Proposed"
  - name: "Approved"
  - name: "Rejected"
  - name: "Deprecated"
- name: "DocumentType"
  description: "Categorization of controlled documents linked to items and revisions."
  data:
  - name: "Specification"
  - name: "Drawing"
  - name: "WorkInstruction"
  - name: "TestProcedure"
  - name: "ComplianceCertificate"
- name: "ChangeType"
  description: "Nature of a change order in the product structure domain."
  data:
  - name: "EngineeringChange"
  - name: "ManufacturingChange"
  - name: "DocumentChange"
  - name: "CorrectiveAction"
- name: "ChangeStatus"
  description: "Workflow state of a change order."
  data:
  - name: "Open"
  - name: "InApproval"
  - name: "Scheduled"
  - name: "Effective"
  - name: "Closed"
  - name: "Cancelled"
- name: "ImpactArea"
  description: "Domain of impact considered during change assessment."
  data:
  - name: "Cost"
  - name: "Quality"
  - name: "Safety"
  - name: "Compliance"
  - name: "SupplyChain"
  - name: "Service"
- name: "DispositionType"
  description: "Resulting action prescribed for affected items or inventory."
  data:
  - name: "UseAsIs"
  - name: "Rework"
  - name: "Scrap"
  - name: "Replace"
  - name: "ReturnToVendor"
- name: "EffectivityType"
  description: "Method used to bound applicability of structures and components."
  data:
  - name: "Date"
  - name: "Serial"
  - name: "Lot"
valueObjects:
- name: "Quantity"
  description: "Measured amount of a component with an associated unit."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
- name: "Effectivity"
  description: "Applicability window controlling when a structure or line is valid."
  data:
  - name: "type"
    type: "EffectivityType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "startSerial"
    type: "String"
  - name: "endSerial"
    type: "String"
  - name: "startLot"
    type: "String"
  - name: "endLot"
    type: "String"
- name: "CurrencyAmount"
  description: "Monetary amount paired with an explicit currency code."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "TextNote"
  description: "Free-form explanatory text captured for documentation and clarity."
  data:
  - name: "text"
    type: "String"
