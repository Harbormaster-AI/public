---
metadata:
  name: "Food and Beverage Industry Domain Model"
  description: "HCIDL model capturing core food and beverage manufacturing, sourcing,\
    \ formulation, quality, distribution, hospitality, and compliance capabilities."
  version: "1.0.0"
  industry: "FoodAndBeverage"
  category: "Manufacturing"
  language: "en-US"
  type: "Industry"
  domain: "Food And Beverage"
entities:
- name: "FoodManufacturer"
  description: "Legal entity responsible for developing and producing food and beverage\
    \ products."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "brands"
    type: "Brand"
    multiplicity: "OneToMany"
  - name: "plants"
    type: "Plant"
    multiplicity: "OneToMany"
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "ManyToMany"
  - name: "distributors"
    type: "Distributor"
    multiplicity: "OneToMany"
- name: "Brand"
  description: "Commercial brand under which products or restaurants are marketed."
  data:
  - name: "name"
    type: "String"
  - name: "marketSegment"
    type: "MarketSegment"
  relations:
  - name: "manufacturer"
    type: "FoodManufacturer"
    multiplicity: "ManyToOne"
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
  - name: "restaurants"
    type: "Restaurant"
    multiplicity: "OneToMany"
- name: "Product"
  description: "Master consumer-facing food or beverage item that may have multiple\
    \ variants (SKUs)."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "ProductCategory"
  - name: "beverageType"
    type: "BeverageType"
  - name: "gtin"
    type: "GTIN"
  - name: "primaryDietClaim"
    type: "DietType"
  relations:
  - name: "brand"
    type: "Brand"
    multiplicity: "ManyToOne"
  - name: "recipe"
    type: "Recipe"
    multiplicity: "ManyToOne"
  - name: "variants"
    type: "ProductVariant"
    multiplicity: "OneToMany"
  - name: "certifications"
    type: "Certification"
    multiplicity: "OneToMany"
  - name: "allergenStatements"
    type: "AllergenStatement"
    multiplicity: "OneToMany"
- name: "ProductVariant"
  description: "Sellable SKU variant of a product defined by size, packaging, and\
    \ other attributes."
  data:
  - name: "skuCode"
    type: "String"
  - name: "flavor"
    type: "String"
  - name: "packagingType"
    type: "PackagingType"
  - name: "packagingMaterial"
    type: "PackagingMaterial"
  - name: "upc"
    type: "GTIN"
  - name: "netWeight"
    type: "Weight"
  - name: "netVolume"
    type: "Volume"
  - name: "shelfLifeDays"
    type: "Integer"
  - name: "storageCondition"
    type: "StorageConditionType"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "packagingComponents"
    type: "PackagingComponent"
    multiplicity: "ManyToMany"
  - name: "batches"
    type: "ProductionBatch"
    multiplicity: "OneToMany"
- name: "Recipe"
  description: "Standard formulation outlining ingredients, quantities, and process\
    \ steps."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "yieldSize"
    type: "ServingSize"
  - name: "instructions"
    type: "String"
  relations:
  - name: "components"
    type: "RecipeComponent"
    multiplicity: "OneToMany"
- name: "RecipeComponent"
  description: "Ingredient component and quantity required for a recipe."
  data:
  - name: "quantity"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
  - name: "preparationNote"
    type: "String"
  - name: "lossFactor"
    type: "Decimal"
  relations:
  - name: "recipe"
    type: "Recipe"
    multiplicity: "ManyToOne"
  - name: "ingredient"
    type: "Ingredient"
    multiplicity: "ManyToOne"
- name: "Ingredient"
  description: "Approved raw material used in production and menu items."
  data:
  - name: "name"
    type: "String"
  - name: "ingredientType"
    type: "IngredientType"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  - name: "primaryAllergen"
    type: "Allergen"
  - name: "nutrition"
    type: "NutritionFacts"
  relations:
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "ManyToMany"
  - name: "lots"
    type: "IngredientLot"
    multiplicity: "OneToMany"
  - name: "certifications"
    type: "Certification"
    multiplicity: "ManyToMany"
  - name: "substituteIngredients"
    type: "Ingredient"
    multiplicity: "ManyToMany"
- name: "IngredientLot"
  description: "Traceable lot of an ingredient with receipt and expiry details."
  data:
  - name: "lotCode"
    type: "LotCode"
  - name: "receivedDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "countryOfOrigin"
    type: "String"
  - name: "organicCertified"
    type: "Boolean"
  - name: "storageCondition"
    type: "StorageConditionType"
  - name: "temperatureOnReceipt"
    type: "Temperature"
  relations:
  - name: "ingredient"
    type: "Ingredient"
    multiplicity: "ManyToOne"
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "qualityTests"
    type: "QualityTest"
    multiplicity: "OneToMany"
  - name: "inboundShipmentItems"
    type: "InboundShipmentItem"
    multiplicity: "OneToMany"
- name: "Supplier"
  description: "Organization providing ingredients, packaging, or contract services."
  data:
  - name: "name"
    type: "String"
  - name: "supplierTier"
    type: "SupplierTier"
  - name: "website"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "ingredients"
    type: "Ingredient"
    multiplicity: "OneToMany"
  - name: "providedLots"
    type: "IngredientLot"
    multiplicity: "OneToMany"
  - name: "certifications"
    type: "Certification"
    multiplicity: "OneToMany"
  - name: "manufacturers"
    type: "FoodManufacturer"
    multiplicity: "ManyToMany"
- name: "Certification"
  description: "Third-party certificate validating claims or standards compliance."
  data:
  - name: "certificationType"
    type: "CertificationType"
  - name: "certificateNumber"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "issuingBody"
    type: "String"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "plant"
    type: "Plant"
    multiplicity: "ManyToOne"
  - name: "ingredient"
    type: "Ingredient"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "PackagingComponent"
  description: "Individual packaging item such as bottle, cap, label, or case."
  data:
  - name: "name"
    type: "String"
  - name: "packagingType"
    type: "PackagingType"
  - name: "material"
    type: "PackagingMaterial"
  - name: "unitCost"
    type: "Money"
  relations:
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "ManyToMany"
  - name: "variants"
    type: "ProductVariant"
    multiplicity: "ManyToMany"
- name: "Plant"
  description: "Facility where food or beverage production takes place."
  data:
  - name: "name"
    type: "String"
  - name: "plantCode"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "manufacturer"
    type: "FoodManufacturer"
    multiplicity: "ManyToOne"
  - name: "productionLines"
    type: "ProductionLine"
    multiplicity: "OneToMany"
  - name: "warehouses"
    type: "Warehouse"
    multiplicity: "OneToMany"
  - name: "haccpPlans"
    type: "HACCPPlan"
    multiplicity: "OneToMany"
- name: "ProductionLine"
  description: "Production line dedicated to specific processes or formats."
  data:
  - name: "name"
    type: "String"
  - name: "capability"
    type: "String"
  relations:
  - name: "plant"
    type: "Plant"
    multiplicity: "ManyToOne"
  - name: "workCenters"
    type: "WorkCenter"
    multiplicity: "OneToMany"
- name: "WorkCenter"
  description: "Station performing a discrete step such as mixing, cooking, filling,\
    \ or packing."
  data:
  - name: "name"
    type: "String"
  - name: "function"
    type: "String"
  relations:
  - name: "productionLine"
    type: "ProductionLine"
    multiplicity: "ManyToOne"
- name: "ProductionBatch"
  description: "Executed manufacturing batch producing finished goods tied to a recipe."
  data:
  - name: "batchNumber"
    type: "String"
  - name: "status"
    type: "BatchStatus"
  - name: "startDate"
    type: "DateTime"
  - name: "endDate"
    type: "DateTime"
  - name: "plannedQuantity"
    type: "Integer"
  - name: "actualQuantity"
    type: "Integer"
  relations:
  - name: "productVariant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
  - name: "plant"
    type: "Plant"
    multiplicity: "ManyToOne"
  - name: "usedLots"
    type: "IngredientLot"
    multiplicity: "ManyToMany"
  - name: "qualityTests"
    type: "QualityTest"
    multiplicity: "OneToMany"
  - name: "outboundShipmentItems"
    type: "OutboundShipmentItem"
    multiplicity: "OneToMany"
  - name: "traceRecords"
    type: "TraceRecord"
    multiplicity: "OneToMany"
- name: "QualityTest"
  description: "Quality control test performed on ingredient lots or production batches."
  data:
  - name: "testType"
    type: "QualityTestType"
  - name: "result"
    type: "QualityResult"
  - name: "performedAt"
    type: "DateTime"
  - name: "notes"
    type: "String"
  relations:
  - name: "ingredientLot"
    type: "IngredientLot"
    multiplicity: "ManyToOne"
  - name: "productionBatch"
    type: "ProductionBatch"
    multiplicity: "ManyToOne"
- name: "HACCPPlan"
  description: "Hazard analysis and critical control plan governing a process or product\
    \ family."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "primaryHazardType"
    type: "HazardType"
  relations:
  - name: "plant"
    type: "Plant"
    multiplicity: "ManyToOne"
  - name: "ccpPoints"
    type: "CriticalControlPoint"
    multiplicity: "OneToMany"
- name: "CriticalControlPoint"
  description: "Defined point where controls are applied to prevent or reduce a food\
    \ safety hazard."
  data:
  - name: "name"
    type: "String"
  - name: "monitoringMethod"
    type: "String"
  - name: "criticalLimitMin"
    type: "Decimal"
  - name: "criticalLimitMax"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
  relations:
  - name: "haccpPlan"
    type: "HACCPPlan"
    multiplicity: "ManyToOne"
  - name: "records"
    type: "CCPRecord"
    multiplicity: "OneToMany"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
- name: "CCPRecord"
  description: "Monitoring record evidencing control at a critical control point."
  data:
  - name: "recordedAt"
    type: "DateTime"
  - name: "measuredValue"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
  - name: "status"
    type: "CCPStatus"
  - name: "correctiveAction"
    type: "String"
  relations:
  - name: "ccp"
    type: "CriticalControlPoint"
    multiplicity: "ManyToOne"
  - name: "productionBatch"
    type: "ProductionBatch"
    multiplicity: "ManyToOne"
- name: "Warehouse"
  description: "Storage facility for raw materials and finished goods."
  data:
  - name: "name"
    type: "String"
  - name: "temperatureControl"
    type: "StorageConditionType"
  - name: "address"
    type: "Address"
  relations:
  - name: "plant"
    type: "Plant"
    multiplicity: "ManyToOne"
  - name: "rawMaterialInventory"
    type: "RawMaterialInventoryItem"
    multiplicity: "OneToMany"
  - name: "finishedGoodsInventory"
    type: "FinishedGoodsInventoryItem"
    multiplicity: "OneToMany"
  - name: "temperatureSensors"
    type: "TemperatureSensor"
    multiplicity: "OneToMany"
- name: "RawMaterialInventoryItem"
  description: "Inventory position representing available quantity of an ingredient\
    \ lot."
  data:
  - name: "quantityOnHand"
    type: "Decimal"
  - name: "quantityReserved"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
  relations:
  - name: "ingredientLot"
    type: "IngredientLot"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
- name: "FinishedGoodsInventoryItem"
  description: "Inventory position representing on-hand finished goods from a batch."
  data:
  - name: "casesOnHand"
    type: "Integer"
  - name: "casesReserved"
    type: "Integer"
  - name: "caseSize"
    type: "Integer"
  relations:
  - name: "productionBatch"
    type: "ProductionBatch"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
- name: "TemperatureSensor"
  description: "Device installed in storage areas to capture temperature readings."
  data:
  - name: "sensorId"
    type: "String"
  - name: "model"
    type: "String"
  - name: "unit"
    type: "TemperatureUnit"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "readings"
    type: "TemperatureReading"
    multiplicity: "OneToMany"
- name: "TemperatureReading"
  description: "Time-stamped measurement from a temperature sensor."
  data:
  - name: "recordedAt"
    type: "DateTime"
  - name: "value"
    type: "Temperature"
  relations:
  - name: "sensor"
    type: "TemperatureSensor"
    multiplicity: "ManyToOne"
- name: "Distributor"
  description: "Logistics or wholesale partner responsible for distributing finished\
    \ goods."
  data:
  - name: "name"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "website"
    type: "String"
  relations:
  - name: "manufacturer"
    type: "FoodManufacturer"
    multiplicity: "ManyToOne"
  - name: "retailers"
    type: "Retailer"
    multiplicity: "OneToMany"
  - name: "outboundShipments"
    type: "OutboundShipment"
    multiplicity: "OneToMany"
- name: "Retailer"
  description: "Sales channel partner such as a grocery chain or independent store."
  data:
  - name: "name"
    type: "String"
  - name: "channel"
    type: "DistributionChannel"
  - name: "address"
    type: "Address"
  relations:
  - name: "distributor"
    type: "Distributor"
    multiplicity: "ManyToOne"
  - name: "salesOrders"
    type: "SalesOrder"
    multiplicity: "OneToMany"
- name: "Customer"
  description: "Buying entity for finished goods or guest in a foodservice context."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "organizationName"
    type: "String"
  - name: "customerType"
    type: "CustomerType"
  relations:
  - name: "salesOrders"
    type: "SalesOrder"
    multiplicity: "OneToMany"
  - name: "diningReservations"
    type: "Reservation"
    multiplicity: "OneToMany"
  - name: "diningOrders"
    type: "DiningOrder"
    multiplicity: "OneToMany"
- name: "SalesOrder"
  description: "Commercial order for finished goods."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "status"
    type: "SalesOrderStatus"
  - name: "orderDate"
    type: "Date"
  - name: "totalAmount"
    type: "Money"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "retailer"
    type: "Retailer"
    multiplicity: "ManyToOne"
  - name: "orderLines"
    type: "SalesOrderLine"
    multiplicity: "OneToMany"
  - name: "outboundShipment"
    type: "OutboundShipment"
    multiplicity: "OneToOne"
- name: "SalesOrderLine"
  description: "Line item on a sales order referencing a product variant."
  data:
  - name: "quantity"
    type: "Integer"
  - name: "unitPrice"
    type: "Money"
  relations:
  - name: "salesOrder"
    type: "SalesOrder"
    multiplicity: "ManyToOne"
  - name: "productVariant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
- name: "PurchaseOrder"
  description: "Procurement order for ingredients or packaging issued to a supplier."
  data:
  - name: "poNumber"
    type: "String"
  - name: "status"
    type: "PurchaseOrderStatus"
  - name: "orderDate"
    type: "Date"
  - name: "expectedDate"
    type: "Date"
  - name: "totalAmount"
    type: "Money"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "plant"
    type: "Plant"
    multiplicity: "ManyToOne"
  - name: "orderLines"
    type: "PurchaseOrderLine"
    multiplicity: "OneToMany"
  - name: "inboundShipment"
    type: "InboundShipment"
    multiplicity: "OneToOne"
- name: "PurchaseOrderLine"
  description: "Specification of materials to procure on a purchase order."
  data:
  - name: "quantity"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
  - name: "unitPrice"
    type: "Money"
  relations:
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "ingredient"
    type: "Ingredient"
    multiplicity: "ManyToOne"
  - name: "packagingComponent"
    type: "PackagingComponent"
    multiplicity: "ManyToOne"
- name: "InboundShipment"
  description: "Shipment received for a purchase order."
  data:
  - name: "shipmentNumber"
    type: "String"
  - name: "status"
    type: "ShipmentStatus"
  - name: "shippedDate"
    type: "Date"
  - name: "receivedDate"
    type: "Date"
  - name: "carrierName"
    type: "String"
  - name: "trackingNumber"
    type: "String"
  relations:
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "InboundShipmentItem"
    multiplicity: "OneToMany"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
- name: "InboundShipmentItem"
  description: "Item within an inbound shipment linked to a specific ingredient lot."
  data:
  - name: "quantityReceived"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
  relations:
  - name: "inboundShipment"
    type: "InboundShipment"
    multiplicity: "ManyToOne"
  - name: "ingredientLot"
    type: "IngredientLot"
    multiplicity: "ManyToOne"
  - name: "purchaseOrderLine"
    type: "PurchaseOrderLine"
    multiplicity: "ManyToOne"
- name: "OutboundShipment"
  description: "Shipment dispatched to a customer, retailer, or distributor."
  data:
  - name: "shipmentNumber"
    type: "String"
  - name: "status"
    type: "ShipmentStatus"
  - name: "shippedDate"
    type: "Date"
  - name: "deliveredDate"
    type: "Date"
  - name: "carrierName"
    type: "String"
  - name: "trackingNumber"
    type: "String"
  relations:
  - name: "salesOrder"
    type: "SalesOrder"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "OutboundShipmentItem"
    multiplicity: "OneToMany"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "distributor"
    type: "Distributor"
    multiplicity: "ManyToOne"
- name: "OutboundShipmentItem"
  description: "Item within an outbound shipment sourced from a production batch."
  data:
  - name: "quantityShipped"
    type: "Integer"
  - name: "caseSize"
    type: "Integer"
  relations:
  - name: "outboundShipment"
    type: "OutboundShipment"
    multiplicity: "ManyToOne"
  - name: "productionBatch"
    type: "ProductionBatch"
    multiplicity: "ManyToOne"
  - name: "salesOrderLine"
    type: "SalesOrderLine"
    multiplicity: "ManyToOne"
- name: "TraceRecord"
  description: "Traceability linkage showing how an ingredient lot was used in a batch."
  data:
  - name: "usageQuantity"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
  relations:
  - name: "ingredientLot"
    type: "IngredientLot"
    multiplicity: "ManyToOne"
  - name: "productionBatch"
    type: "ProductionBatch"
    multiplicity: "ManyToOne"
- name: "Restaurant"
  description: "Foodservice location operating under a brand."
  data:
  - name: "name"
    type: "String"
  - name: "serviceType"
    type: "RestaurantServiceType"
  - name: "address"
    type: "Address"
  relations:
  - name: "brand"
    type: "Brand"
    multiplicity: "ManyToOne"
  - name: "menus"
    type: "Menu"
    multiplicity: "OneToMany"
  - name: "reservations"
    type: "Reservation"
    multiplicity: "OneToMany"
  - name: "diningOrders"
    type: "DiningOrder"
    multiplicity: "OneToMany"
- name: "Menu"
  description: "Dated collection of menu items offered at a restaurant."
  data:
  - name: "name"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "restaurant"
    type: "Restaurant"
    multiplicity: "ManyToOne"
  - name: "menuItems"
    type: "MenuItem"
    multiplicity: "OneToMany"
- name: "MenuItem"
  description: "Prepared dish or beverage available for sale."
  data:
  - name: "name"
    type: "String"
  - name: "menuItemType"
    type: "MenuItemType"
  - name: "basePrice"
    type: "Money"
  - name: "primaryDietType"
    type: "DietType"
  - name: "nutrition"
    type: "NutritionFacts"
  relations:
  - name: "menu"
    type: "Menu"
    multiplicity: "ManyToOne"
  - name: "recipe"
    type: "Recipe"
    multiplicity: "ManyToOne"
  - name: "allergenStatements"
    type: "AllergenStatement"
    multiplicity: "OneToMany"
- name: "DiningOrder"
  description: "Order placed at a restaurant for dine-in, takeout, or delivery."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "status"
    type: "DiningOrderStatus"
  - name: "orderDateTime"
    type: "DateTime"
  - name: "totalAmount"
