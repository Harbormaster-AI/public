---
metadata:
  name: "Manufacturing Execution HCIDL"
  description: "Canonical capability model describing core concepts, data and relationships\
    \ required to execute, monitor, and control discrete and process manufacturing\
    \ on the shop floor."
  version: "1.0.0"
  industry: "Manufacturing"
  category: "Manufacturing"
  type: "Capability"
  domain: "Manufacturing Execution"
entities:
- name: "Enterprise"
  description: "Legal organization that governs multiple factories and common manufacturing\
    \ standards across sites."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "factories"
    type: "Factory"
    multiplicity: "OneToMany"
- name: "Factory"
  description: "Physical manufacturing site with shared workforce, equipment and infrastructure."
  data:
  - name: "name"
    type: "String"
  - name: "factoryCode"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "enterprise"
    type: "Enterprise"
    multiplicity: "ManyToOne"
  - name: "productionLines"
    type: "ProductionLine"
    multiplicity: "OneToMany"
  - name: "schedules"
    type: "ProductionSchedule"
    multiplicity: "OneToMany"
  - name: "wipLocations"
    type: "WIPLocation"
    multiplicity: "OneToMany"
- name: "ProductionLine"
  description: "Coordinated sequence of work centers dedicated to a specific product\
    \ family or process."
  data:
  - name: "name"
    type: "String"
  - name: "lineType"
    type: "ProductionLineType"
  - name: "cycleTimeTarget"
    type: "Duration"
  relations:
  - name: "factory"
    type: "Factory"
    multiplicity: "ManyToOne"
  - name: "workCenters"
    type: "WorkCenter"
    multiplicity: "OneToMany"
  - name: "schedules"
    type: "ProductionSchedule"
    multiplicity: "OneToMany"
- name: "WorkCenter"
  description: "Logical production unit where operations are executed by people, machines\
    \ or robots."
  data:
  - name: "name"
    type: "String"
  - name: "workCenterType"
    type: "WorkCenterType"
  - name: "capability"
    type: "String"
  - name: "status"
    type: "WorkCenterStatus"
  relations:
  - name: "productionLine"
    type: "ProductionLine"
    multiplicity: "ManyToOne"
  - name: "equipment"
    type: "Equipment"
    multiplicity: "OneToMany"
  - name: "operators"
    type: "Operator_"
    multiplicity: "ManyToMany"
  - name: "wipLocations"
    type: "WIPLocation"
    multiplicity: "OneToMany"
- name: "Equipment"
  description: "Physical asset used to perform manufacturing operations such as machines,\
    \ robots or test stations."
  data:
  - name: "name"
    type: "String"
  - name: "assetTag"
    type: "String"
  - name: "equipmentType"
    type: "EquipmentType"
  - name: "status"
    type: "EquipmentStatus"
  - name: "oeeTarget"
    type: "Decimal"
  relations:
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "downtimeEvents"
    type: "DowntimeEvent"
    multiplicity: "OneToMany"
  - name: "tools"
    type: "Tool"
    multiplicity: "OneToMany"
- name: "Operator_"
  description: "Individual performing production activities such as setup, operation,\
    \ inspection and material handling."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "badgeNumber"
    type: "String"
  - name: "skillLevel"
    type: "SkillLevel"
  relations:
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "qualifications"
    type: "Qualification"
    multiplicity: "ManyToMany"
  - name: "shifts"
    type: "Shift"
    multiplicity: "ManyToMany"
  - name: "operationExecutions"
    type: "OperationExecution"
    multiplicity: "OneToMany"
- name: "Qualification"
  description: "Certification or authorization allowing an operator to perform specific\
    \ operations or use equipment."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "operators"
    type: "Operator_"
    multiplicity: "ManyToMany"
  - name: "operations"
    type: "OperationDefinition"
    multiplicity: "ManyToMany"
- name: "Shift"
  description: "Planned period of production with defined staffing and work center\
    \ availability."
  data:
  - name: "name"
    type: "String"
  - name: "shiftType"
    type: "ShiftType"
  - name: "plannedHours"
    type: "Duration"
  - name: "effectiveDates"
    type: "TimeRange"
  relations:
  - name: "factory"
    type: "Factory"
    multiplicity: "ManyToOne"
  - name: "operators"
    type: "Operator_"
    multiplicity: "ManyToMany"
  - name: "workCenters"
    type: "WorkCenter"
    multiplicity: "ManyToMany"
- name: "ProductionSchedule"
  description: "Time-phased plan for executing production orders on lines and work\
    \ centers."
  data:
  - name: "scheduleNumber"
    type: "String"
  - name: "status"
    type: "ProductionScheduleStatus"
  - name: "horizonDays"
    type: "Integer"
  relations:
  - name: "factory"
    type: "Factory"
    multiplicity: "ManyToOne"
  - name: "productionOrders"
    type: "ProductionOrder"
    multiplicity: "OneToMany"
  - name: "productionLine"
    type: "ProductionLine"
    multiplicity: "ManyToOne"
- name: "MaterialDefinition"
  description: "Master definition of a manufactured or consumed item relevant to execution."
  data:
  - name: "itemNumber"
    type: "String"
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "defaultUoM"
    type: "String"
  - name: "version"
    type: "String"
  relations:
  - name: "routings"
    type: "Routing"
    multiplicity: "ManyToMany"
- name: "MaterialLot"
  description: "Traceable batch of material with consistent properties used or produced\
    \ during execution."
  data:
  - name: "lotNumber"
    type: "String"
  - name: "status"
    type: "MaterialLotStatus"
  - name: "quantity"
    type: "Quantity"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "material"
    type: "MaterialDefinition"
    multiplicity: "ManyToOne"
  - name: "factory"
    type: "Factory"
    multiplicity: "ManyToOne"
  - name: "wipLocation"
    type: "WIPLocation"
    multiplicity: "ManyToOne"
  - name: "serialUnits"
    type: "SerialUnit"
    multiplicity: "OneToMany"
  - name: "consumedIn"
    type: "OperationExecution"
    multiplicity: "ManyToMany"
- name: "SerialUnit"
  description: "Individually serialized unit that progresses through operations and\
    \ may be shipped or scrapped."
  data:
  - name: "serialNumber"
    type: "SerialNumber"
  - name: "status"
    type: "SerialUnitStatus"
  - name: "manufacturedOn"
    type: "DateTime"
  relations:
  - name: "materialLot"
    type: "MaterialLot"
    multiplicity: "ManyToOne"
  - name: "productionOrder"
    type: "ProductionOrder"
    multiplicity: "ManyToOne"
  - name: "operationExecutions"
    type: "OperationExecution"
    multiplicity: "OneToMany"
  - name: "currentLocation"
    type: "WIPLocation"
    multiplicity: "ManyToOne"
- name: "Routing"
  description: "Definition of the sequence of operations required to manufacture a\
    \ material."
  data:
  - name: "name"
    type: "String"
  - name: "routingCode"
    type: "String"
  - name: "version"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "steps"
    type: "RoutingStep"
    multiplicity: "OneToMany"
  - name: "materials"
    type: "MaterialDefinition"
    multiplicity: "ManyToMany"
- name: "RoutingStep"
  description: "Ordered step within a routing referencing an operation and target\
    \ resources."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "queueTime"
    type: "Duration"
  - name: "moveTime"
    type: "Duration"
  - name: "standardCycleTime"
    type: "Duration"
  relations:
  - name: "routing"
    type: "Routing"
    multiplicity: "ManyToOne"
  - name: "operation"
    type: "OperationDefinition"
    multiplicity: "ManyToOne"
  - name: "primaryWorkCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "alternateWorkCenters"
    type: "WorkCenter"
    multiplicity: "ManyToMany"
- name: "OperationDefinition"
  description: "Standardized description of a manufacturing operation with timing\
    \ and qualification requirements."
  data:
  - name: "operationCode"
    type: "String"
  - name: "name"
    type: "String"
  - name: "standardSetupTime"
    type: "Duration"
  - name: "standardRunRate"
    type: "Decimal"
  - name: "requiresQualification"
    type: "Boolean"
  relations:
  - name: "routings"
    type: "Routing"
    multiplicity: "ManyToMany"
  - name: "qualifiedBy"
    type: "Qualification"
    multiplicity: "ManyToMany"
  - name: "workInstructions"
    type: "WorkInstruction"
    multiplicity: "OneToMany"
- name: "ProductionOrder"
  description: "Authorization to manufacture a specified quantity of a material within\
    \ a timeframe."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "productCode"
    type: "String"
  - name: "status"
    type: "ProductionOrderStatus"
  - name: "priority"
    type: "Integer"
  - name: "dueDate"
    type: "Date"
  - name: "orderedQuantity"
    type: "Quantity"
  relations:
  - name: "factory"
    type: "Factory"
    multiplicity: "ManyToOne"
  - name: "routing"
    type: "Routing"
    multiplicity: "ManyToOne"
  - name: "schedule"
    type: "ProductionSchedule"
    multiplicity: "ManyToOne"
  - name: "jobs"
    type: "ManufacturingJob"
    multiplicity: "OneToMany"
  - name: "serialUnits"
    type: "SerialUnit"
    multiplicity: "OneToMany"
  - name: "materialLots"
    type: "MaterialLot"
    multiplicity: "ManyToMany"
- name: "ManufacturingJob"
  description: "Executable packet of work derived from a production order, typically\
    \ aligned to a work center."
  data:
  - name: "jobNumber"
    type: "String"
  - name: "status"
    type: "ManufacturingJobStatus"
  - name: "scheduledStart"
    type: "DateTime"
  - name: "scheduledEnd"
    type: "DateTime"
  - name: "plannedQuantity"
    type: "Quantity"
  relations:
  - name: "productionOrder"
    type: "ProductionOrder"
    multiplicity: "ManyToOne"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "operations"
    type: "OperationExecution"
    multiplicity: "OneToMany"
- name: "OperationExecution"
  description: "Runtime record of an operation being performed, including labor, equipment\
    \ and outputs."
  data:
  - name: "status"
    type: "OperationExecutionStatus"
  - name: "startTime"
    type: "DateTime"
  - name: "endTime"
    type: "DateTime"
  - name: "goodQuantity"
    type: "Quantity"
  - name: "scrapQuantity"
    type: "Quantity"
  - name: "notes"
    type: "String"
  relations:
  - name: "job"
    type: "ManufacturingJob"
    multiplicity: "ManyToOne"
  - name: "routingStep"
    type: "RoutingStep"
    multiplicity: "ManyToOne"
  - name: "operator_"
    type: "Operator_"
    multiplicity: "ManyToOne"
  - name: "equipment"
    type: "Equipment"
    multiplicity: "ManyToOne"
  - name: "usedTools"
    type: "Tool"
    multiplicity: "ManyToMany"
  - name: "inputLots"
    type: "MaterialLot"
    multiplicity: "ManyToMany"
  - name: "outputSerialUnits"
    type: "SerialUnit"
    multiplicity: "OneToMany"
  - name: "checks"
    type: "InProcessCheck"
    multiplicity: "OneToMany"
  - name: "scrapRecords"
    type: "ScrapRecord"
    multiplicity: "OneToMany"
- name: "Tool"
  description: "Calibrated implement or fixture required to perform specific operations."
  data:
  - name: "name"
    type: "String"
  - name: "toolNumber"
    type: "String"
  - name: "toolType"
    type: "ToolType"
  - name: "calibrated"
    type: "Boolean"
  - name: "lastCalibration"
    type: "Date"
  relations:
  - name: "storedAtWorkCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "usedInOperations"
    type: "OperationExecution"
    multiplicity: "ManyToMany"
  - name: "equipment"
    type: "Equipment"
    multiplicity: "ManyToOne"
- name: "WIPLocation"
  description: "Designated physical or logical location used to stage, buffer or queue\
    \ work-in-process."
  data:
  - name: "name"
    type: "String"
  - name: "locationType"
    type: "WIPLocationType"
  - name: "aisle"
    type: "String"
  - name: "position"
    type: "String"
  relations:
  - name: "factory"
    type: "Factory"
    multiplicity: "ManyToOne"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "materialLots"
    type: "MaterialLot"
    multiplicity: "OneToMany"
  - name: "serialUnits"
    type: "SerialUnit"
    multiplicity: "OneToMany"
- name: "WorkInstruction"
  description: "Controlled document that guides operators in executing an operation."
  data:
  - name: "title"
    type: "String"
  - name: "revision"
    type: "String"
  - name: "document"
    type: "DocumentReference"
  - name: "effectiveFrom"
    type: "Date"
  relations:
  - name: "operationDefinition"
    type: "OperationDefinition"
    multiplicity: "ManyToOne"
  - name: "factory"
    type: "Factory"
    multiplicity: "ManyToOne"
- name: "DowntimeEvent"
  description: "Logged interruption or reduction of equipment or work center availability."
  data:
  - name: "startTime"
    type: "DateTime"
  - name: "endTime"
    type: "DateTime"
  - name: "reason"
    type: "DowntimeReason"
  - name: "category"
    type: "DowntimeCategory"
  - name: "planned"
    type: "Boolean"
  - name: "comment"
    type: "String"
  relations:
  - name: "equipment"
    type: "Equipment"
    multiplicity: "ManyToOne"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "productionOrder"
    type: "ProductionOrder"
    multiplicity: "ManyToOne"
- name: "InProcessCheck"
  description: "Measurement or verification performed during production to ensure\
    \ conformance."
  data:
  - name: "checkType"
    type: "CheckType"
  - name: "result"
    type: "CheckResult"
  - name: "measuredValue"
    type: "Decimal"
  - name: "uom"
    type: "String"
  - name: "timestamp"
    type: "DateTime"
  - name: "specificationLimitLow"
    type: "Decimal"
  - name: "specificationLimitHigh"
    type: "Decimal"
  relations:
  - name: "operationExecution"
    type: "OperationExecution"
    multiplicity: "ManyToOne"
  - name: "operator_"
    type: "Operator_"
    multiplicity: "ManyToOne"
  - name: "serialUnit"
    type: "SerialUnit"
    multiplicity: "ManyToOne"
- name: "ScrapRecord"
  description: "Record of nonconforming or discarded material generated during an\
    \ operation."
  data:
  - name: "quantity"
    type: "Quantity"
  - name: "reason"
    type: "ScrapReason"
  - name: "timestamp"
    type: "DateTime"
  - name: "comment"
    type: "String"
  relations:
  - name: "operationExecution"
    type: "OperationExecution"
    multiplicity: "ManyToOne"
  - name: "serialUnit"
    type: "SerialUnit"
    multiplicity: "ManyToOne"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
enums:
- name: "ProductionLineType"
  description: "Classification of production line based on processing focus and configuration."
  data:
  - name: "Assembly"
  - name: "Processing"
  - name: "Packaging"
  - name: "Test"
  - name: "MixedModel"
- name: "WorkCenterType"
  description: "Nature of the work performed at the work center and degree of automation."
  data:
  - name: "Manual"
  - name: "Automated"
  - name: "Robotic"
  - name: "Inspection"
  - name: "Test"
  - name: "Cell"
- name: "WorkCenterStatus"
  description: "Real-time availability and flow state of a work center."
  data:
  - name: "Available"
  - name: "Running"
  - name: "Starved"
  - name: "Blocked"
  - name: "Maintenance"
  - name: "Down"
- name: "EquipmentType"
  description: "Category of equipment used in manufacturing operations."
  data:
  - name: "Machine"
  - name: "Robot"
  - name: "Conveyor"
  - name: "Tester"
  - name: "Oven"
  - name: "Press"
  - name: "CNC"
- name: "EquipmentStatus"
  description: "Operational state of an equipment asset."
  data:
  - name: "Available"
  - name: "InSetup"
  - name: "Running"
  - name: "Idle"
  - name: "Maintenance"
  - name: "Down"
- name: "SkillLevel"
  description: "Proficiency level of an operator for a specific task domain."
  data:
  - name: "Trainee"
  - name: "Qualified"
  - name: "Expert"
- name: "ShiftType"
  description: "Pattern of working hours used to structure production time."
  data:
  - name: "Day"
  - name: "Swing"
  - name: "Night"
  - name: "Weekend"
  - name: "Custom"
- name: "ProductionScheduleStatus"
  description: "Lifecycle of a production schedule from planning to completion."
  data:
  - name: "Draft"
  - name: "Approved"
  - name: "Released"
  - name: "Closed"
- name: "ProductionOrderStatus"
  description: "Progress state of a production order during execution."
  data:
  - name: "Planned"
  - name: "Released"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "ManufacturingJobStatus"
  description: "Execution readiness and completion state of a manufacturing job."
  data:
  - name: "Pending"
  - name: "Ready"
  - name: "Running"
  - name: "Paused"
  - name: "Completed"
  - name: "Aborted"
- name: "OperationExecutionStatus"
  description: "Real-time state of an operation as it is executed on the shop floor."
  data:
  - name: "NotStarted"
  - name: "Running"
  - name: "Completed"
  - name: "Interrupted"
  - name: "Aborted"
- name: "MaterialLotStatus"
  description: "Availability and quality disposition of a material lot."
  data:
  - name: "Available"
  - name: "Reserved"
  - name: "Consumed"
  - name: "Quarantined"
  - name: "Expired"
- name: "SerialUnitStatus"
  description: "Current lifecycle state of a serialized unit in production."
  data:
  - name: "InWIP"
  - name: "Completed"
  - name: "Scrapped"
  - name: "Rework"
- name: "WIPLocationType"
  description: "Functional classification of a WIP location in the production flow."
  data:
  - name: "Buffer"
  - name: "Queue"
  - name: "Storage"
  - name: "LineSide"
  - name: "KanbanRack"
- name: "DowntimeReason"
  description: "Root cause category for recorded downtime."
  data:
  - name: "Setup"
  - name: "Changeover"
  - name: "Breakdown"
  - name: "NoMaterial"
  - name: "QualityHold"
  - name: "PlannedMaintenance"
  - name: "UnplannedMaintenance"
- name: "DowntimeCategory"
  description: "Whether the downtime was expected or not."
  data:
  - name: "Planned"
  - name: "Unplanned"
- name: "ToolType"
  description: "Classification of tool or fixture used during operations."
  data:
  - name: "Bit"
  - name: "Die"
  - name: "Mold"
  - name: "Cutter"
  - name: "Fixture"
  - name: "Gauge"
- name: "CheckType"
  description: "Kind of in-process verification performed during production."
  data:
  - name: "Dimensional"
  - name: "Visual"
  - name: "Functional"
  - name: "Torque"
  - name: "Weight"
- name: "CheckResult"
  description: "Outcome of an in-process check relative to specification."
  data:
  - name: "Pass"
  - name: "Fail"
  - name: "ConditionalPass"
- name: "ScrapReason"
  description: "Primary reason for scrapping material or units."
  data:
  - name: "Defect"
  - name: "Damage"
  - name: "ProcessFailure"
  - name: "ComponentShortage"
  - name: "SetupLoss"
valueObjects:
- name: "Quantity"
  description: "Numeric value paired with a unit of measure to express amount."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "unit"
    type: "String"
- name: "Duration"
  description: "Length of time expressed in whole seconds for planning and measurement."
  data:
  - name: "seconds"
    type: "Integer"
- name: "SerialNumber"
  description: "Unique manufacturer-assigned identifier for a single serialized unit."
  data:
  - name: "value"
    type: "String"
- name: "TimeRange"
  description: "Inclusive interval between a start and end point in time."
  data:
  - name: "start"
    type: "DateTime"
  - name: "end"
    type: "DateTime"
- name: "Address"
  description: "Physical mailing address for a manufacturing site."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "DocumentReference"
  description: "Linkage to a controlled document stored in a content system."
  data:
  - name: "url"
    type: "String"
  - name: "fileName"
    type: "String"
  - name: "mediaType"
    type: "String"
