---
metadata:
  name: "HCIDL Capabilities Model - Quality Management"
  description: "Capability model for Quality Management functions within manufacturing,\
    \ covering inspection, nonconformance, CAPA, audits, SPC, calibration, and supplier\
    \ quality."
  version: "1.0.0"
  industry: "Manufacturing"
  category: "Manufacturing"
  type: "Capability"
  domain: "Quality Management"
entities:
- name: "QualityProgram"
  description: "Governance construct that defines quality policy, objectives, and\
    \ oversight across the enterprise."
  data:
  - name: "name"
    type: "String"
  - name: "policyStatement"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "status"
    type: "QualityProgramStatus"
  relations:
  - name: "qualityManuals"
    type: "QualityDocument"
    multiplicity: "OneToMany"
  - name: "sites"
    type: "Site"
    multiplicity: "OneToMany"
  - name: "audits"
    type: "QualityAudit"
    multiplicity: "OneToMany"
- name: "Site"
  description: "Physical manufacturing or service location under the quality management\
    \ system."
  data:
  - name: "name"
    type: "String"
  - name: "siteCode"
    type: "String"
  - name: "country"
    type: "String"
  relations:
  - name: "qualityProgram"
    type: "QualityProgram"
    multiplicity: "ManyToOne"
  - name: "processes"
    type: "ManufacturingProcess"
    multiplicity: "OneToMany"
  - name: "labs"
    type: "QualityLab"
    multiplicity: "OneToMany"
  - name: "inspectionPlans"
    type: "InspectionPlan"
    multiplicity: "OneToMany"
  - name: "equipment"
    type: "MeasurementDevice"
    multiplicity: "OneToMany"
  - name: "audits"
    type: "QualityAudit"
    multiplicity: "OneToMany"
- name: "ManufacturingProcess"
  description: "Defined production or service process subject to quality control and\
    \ monitoring."
  data:
  - name: "name"
    type: "String"
  - name: "processFamily"
    type: "String"
  - name: "criticality"
    type: "CriticalityLevel"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "controlPlans"
    type: "ControlPlan"
    multiplicity: "OneToMany"
  - name: "inspectionPlans"
    type: "InspectionPlan"
    multiplicity: "OneToMany"
  - name: "spcStudies"
    type: "ProcessCapabilityStudy"
    multiplicity: "OneToMany"
  - name: "nonconformances"
    type: "Nonconformance"
    multiplicity: "OneToMany"
- name: "ControlPlan"
  description: "Structured plan defining controls, monitoring methods, and reaction\
    \ plans for a process or product."
  data:
  - name: "controlPlanNumber"
    type: "String"
  - name: "version"
    type: "String"
  - name: "approvalStatus"
    type: "ApprovalStatus"
  relations:
  - name: "process"
    type: "ManufacturingProcess"
    multiplicity: "ManyToOne"
  - name: "characteristics"
    type: "QualityCharacteristic"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "QualityDocument"
    multiplicity: "ManyToMany"
- name: "QualityCharacteristic"
  description: "Measurable or attribute characteristic controlled by specification\
    \ and verification methods."
  data:
  - name: "name"
    type: "String"
  - name: "characteristicType"
    type: "CharacteristicType"
  - name: "specification"
    type: "SpecificationLimit"
  - name: "measurementMethod"
    type: "String"
  relations:
  - name: "controlPlan"
    type: "ControlPlan"
    multiplicity: "ManyToOne"
  - name: "inspectionPlans"
    type: "InspectionPlan"
    multiplicity: "ManyToMany"
  - name: "measurements"
    type: "MeasurementRecord"
    multiplicity: "OneToMany"
- name: "InspectionPlan"
  description: "Defined plan for sampling, inspection points, and acceptance criteria\
    \ for a product or process."
  data:
  - name: "planNumber"
    type: "String"
  - name: "inspectionType"
    type: "InspectionType"
  - name: "samplingMethod"
    type: "SamplingMethod"
  - name: "acceptanceCriteria"
    type: "String"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "process"
    type: "ManufacturingProcess"
    multiplicity: "ManyToOne"
  - name: "characteristics"
    type: "QualityCharacteristic"
    multiplicity: "OneToMany"
  - name: "inspectionLots"
    type: "InspectionLot"
    multiplicity: "OneToMany"
- name: "InspectionLot"
  description: "Executable inspection instance for a received batch, in-process batch,\
    \ or finished goods lot."
  data:
  - name: "lotNumber"
    type: "String"
  - name: "lotSize"
    type: "Integer"
  - name: "status"
    type: "InspectionLotStatus"
  relations:
  - name: "inspectionPlan"
    type: "InspectionPlan"
    multiplicity: "ManyToOne"
  - name: "results"
    type: "InspectionResult"
    multiplicity: "OneToMany"
  - name: "disposition"
    type: "Disposition"
    multiplicity: "OneToOne"
  - name: "nonconformances"
    type: "Nonconformance"
    multiplicity: "OneToMany"
- name: "InspectionResult"
  description: "Consolidated outcome of executing an inspection lot against its plan."
  data:
  - name: "verdict"
    type: "InspectionVerdict"
  - name: "inspectedQuantity"
    type: "Integer"
  - name: "acceptedQuantity"
    type: "Integer"
  - name: "rejectedQuantity"
    type: "Integer"
  relations:
  - name: "inspectionLot"
    type: "InspectionLot"
    multiplicity: "ManyToOne"
  - name: "measurements"
    type: "MeasurementRecord"
    multiplicity: "OneToMany"
- name: "MeasurementRecord"
  description: "Captured measurement or attribute check associated with a characteristic\
    \ during inspection."
  data:
  - name: "characteristicName"
    type: "String"
  - name: "resultType"
    type: "ResultType"
  - name: "measuredValue"
    type: "MeasurementValue"
  - name: "isConforming"
    type: "Boolean"
  - name: "timestamp"
    type: "DateTime"
  relations:
  - name: "inspectionResult"
    type: "InspectionResult"
    multiplicity: "ManyToOne"
  - name: "characteristic"
    type: "QualityCharacteristic"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "MeasurementDevice"
    multiplicity: "ManyToOne"
- name: "MeasurementDevice"
  description: "Measuring instrument or gauge used for inspection, subject to calibration\
    \ and MSA."
  data:
  - name: "assetTag"
    type: "String"
  - name: "deviceType"
    type: "String"
  - name: "status"
    type: "EquipmentStatus"
  - name: "calibrationDueDate"
    type: "Date"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "calibrations"
    type: "CalibrationRecord"
    multiplicity: "OneToMany"
  - name: "measurementRecords"
    type: "MeasurementRecord"
    multiplicity: "OneToMany"
  - name: "msaStudies"
    type: "MeasurementSystemAnalysis"
    multiplicity: "OneToMany"
- name: "CalibrationRecord"
  description: "Record of calibration service performed on a measurement device, including\
    \ outcome."
  data:
  - name: "certificateNumber"
    type: "String"
  - name: "datePerformed"
    type: "Date"
  - name: "status"
    type: "CalibrationStatus"
  - name: "technician"
    type: "String"
  - name: "resultsSummary"
    type: "String"
  relations:
  - name: "device"
    type: "MeasurementDevice"
    multiplicity: "ManyToOne"
  - name: "lab"
    type: "QualityLab"
    multiplicity: "ManyToOne"
- name: "QualityLab"
  description: "Laboratory providing testing and calibration services, internal or\
    \ external."
  data:
  - name: "name"
    type: "String"
  - name: "accreditation"
    type: "String"
  - name: "isExternal"
    type: "Boolean"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "calibrations"
    type: "CalibrationRecord"
    multiplicity: "OneToMany"
  - name: "testReports"
    type: "TestReport"
    multiplicity: "OneToMany"
- name: "TestReport"
  description: "Documented results of laboratory testing with verdict and supporting\
    \ data."
  data:
  - name: "reportNumber"
    type: "String"
  - name: "testType"
    type: "String"
  - name: "verdict"
    type: "TestVerdict"
  - name: "completionDate"
    type: "Date"
  relations:
  - name: "lab"
    type: "QualityLab"
    multiplicity: "ManyToOne"
  - name: "process"
    type: "ManufacturingProcess"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "Product"
  description: "Material, component, or finished product governed by specifications\
    \ and quality controls."
  data:
  - name: "name"
    type: "String"
  - name: "productCode"
    type: "String"
  - name: "revision"
    type: "String"
  - name: "category"
    type: "String"
  relations:
  - name: "specifications"
    type: "ProductSpecification"
    multiplicity: "OneToMany"
  - name: "inspectionPlans"
    type: "InspectionPlan"
    multiplicity: "OneToMany"
  - name: "nonconformances"
    type: "Nonconformance"
    multiplicity: "OneToMany"
- name: "ProductSpecification"
  description: "Controlled specification defining product requirements and acceptance\
    \ criteria."
  data:
  - name: "specNumber"
    type: "String"
  - name: "version"
    type: "String"
  - name: "status"
    type: "SpecificationStatus"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "QualityDocument"
    multiplicity: "ManyToMany"
- name: "Nonconformance"
  description: "Documented deviation from specified requirements detected in materials,\
    \ processes, or products."
  data:
  - name: "referenceNumber"
    type: "String"
  - name: "source"
    type: "DefectSource"
  - name: "severity"
    type: "SeverityLevel"
  - name: "status"
    type: "NonconformanceStatus"
  - name: "descriptionText"
    type: "String"
  - name: "discoveryDate"
    type: "Date"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "process"
    type: "ManufacturingProcess"
    multiplicity: "ManyToOne"
  - name: "inspectionLot"
    type: "InspectionLot"
    multiplicity: "ManyToOne"
  - name: "containmentActions"
    type: "ContainmentAction"
    multiplicity: "OneToMany"
  - name: "dispositions"
    type: "Disposition"
    multiplicity: "OneToMany"
  - name: "capa"
    type: "CAPA"
    multiplicity: "OneToOne"
- name: "ContainmentAction"
  description: "Immediate action to isolate suspect product and prevent further impact."
  data:
  - name: "actionCode"
    type: "String"
  - name: "description"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "status"
    type: "ActionStatus"
  relations:
  - name: "nonconformance"
    type: "Nonconformance"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Person"
    multiplicity: "ManyToOne"
- name: "Disposition"
  description: "Decision specifying handling of nonconforming material and associated\
    \ quantity."
  data:
  - name: "dispositionType"
    type: "DispositionType"
  - name: "quantity"
    type: "Integer"
  - name: "notes"
    type: "String"
  - name: "decisionDate"
    type: "Date"
  relations:
  - name: "nonconformance"
    type: "Nonconformance"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Person"
    multiplicity: "ManyToOne"
- name: "CAPA"
  description: "Corrective and preventive action record to remove causes of actual\
    \ or potential nonconformities."
  data:
  - name: "capaNumber"
    type: "String"
  - name: "status"
    type: "CAPAStatus"
  - name: "initiationDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "effectivenessReviewDate"
    type: "Date"
  relations:
  - name: "nonconformance"
    type: "Nonconformance"
    multiplicity: "OneToOne"
  - name: "rootCauseAnalysis"
    type: "RootCauseAnalysis"
    multiplicity: "OneToOne"
  - name: "actions"
    type: "CAPAAction"
    multiplicity: "OneToMany"
  - name: "owner"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "ApprovalRecord"
    multiplicity: "OneToMany"
- name: "RootCauseAnalysis"
  description: "Structured method to determine underlying causes of a problem and\
    \ verify root cause."
  data:
  - name: "method"
    type: "RCAType"
  - name: "summary"
    type: "String"
  - name: "verified"
    type: "Boolean"
  relations:
  - name: "capa"
    type: "CAPA"
    multiplicity: "OneToOne"
- name: "CAPAAction"
  description: "Specific corrective, preventive, or containment task tracked within\
    \ a CAPA."
  data:
  - name: "actionDescription"
    type: "String"
  - name: "actionType"
    type: "ActionType"
  - name: "status"
    type: "ActionStatus"
  - name: "targetDate"
    type: "Date"
  - name: "completionDate"
    type: "Date"
  relations:
  - name: "capa"
    type: "CAPA"
    multiplicity: "ManyToOne"
  - name: "responsible"
    type: "Person"
    multiplicity: "ManyToOne"
- name: "ApprovalRecord"
  description: "Formal decision and sign-off for quality actions or controlled documents."
  data:
  - name: "approverName"
    type: "String"
  - name: "role"
    type: "String"
  - name: "approvalDate"
    type: "Date"
  - name: "decision"
    type: "ApprovalDecision"
  - name: "comments"
    type: "String"
  relations:
  - name: "capa"
    type: "CAPA"
    multiplicity: "ManyToOne"
  - name: "document"
    type: "QualityDocument"
    multiplicity: "ManyToOne"
- name: "QualityDocument"
  description: "Controlled document such as procedures, work instructions, forms,\
    \ or records."
  data:
  - name: "title"
    type: "String"
  - name: "documentNumber"
    type: "String"
  - name: "revision"
    type: "String"
  - name: "status"
    type: "DocumentStatus"
  - name: "effectiveDate"
    type: "Date"
  relations:
  - name: "owners"
    type: "Person"
    multiplicity: "ManyToMany"
  - name: "relatedDocuments"
    type: "QualityDocument"
    multiplicity: "ManyToMany"
- name: "Person"
  description: "Individual responsible for or participating in quality-related activities."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "department"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "String"
  relations:
  - name: "actions"
    type: "CAPAAction"
    multiplicity: "OneToMany"
  - name: "dispositions"
    type: "Disposition"
    multiplicity: "OneToMany"
  - name: "auditsConducted"
    type: "QualityAudit"
    multiplicity: "OneToMany"
- name: "AuditProgram"
  description: "Planned schedule and scope for conducting internal and supplier audits."
  data:
  - name: "name"
    type: "String"
  - name: "cycleMonths"
    type: "Integer"
  - name: "scope"
    type: "String"
  relations:
  - name: "qualityProgram"
    type: "QualityProgram"
    multiplicity: "ManyToOne"
  - name: "audits"
    type: "QualityAudit"
    multiplicity: "OneToMany"
- name: "QualityAudit"
  description: "Systematic, independent examination of processes, products, or systems."
  data:
  - name: "auditCode"
    type: "String"
  - name: "auditType"
    type: "AuditType"
  - name: "scheduledDate"
    type: "Date"
  - name: "status"
    type: "AuditStatus"
  relations:
  - name: "auditProgram"
    type: "AuditProgram"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "process"
    type: "ManufacturingProcess"
    multiplicity: "ManyToOne"
  - name: "findings"
    type: "AuditFinding"
    multiplicity: "OneToMany"
  - name: "auditor"
    type: "Person"
    multiplicity: "ManyToOne"
- name: "AuditFinding"
  description: "Observation or nonconformity identified during an audit with severity\
    \ and status."
  data:
  - name: "description"
    type: "String"
  - name: "severity"
    type: "FindingSeverity"
  - name: "status"
    type: "FindingStatus"
  relations:
  - name: "audit"
    type: "QualityAudit"
    multiplicity: "ManyToOne"
  - name: "nonconformance"
    type: "Nonconformance"
    multiplicity: "ManyToOne"
- name: "Supplier"
  description: "External provider of goods or services subject to quality requirements\
    \ and evaluation."
  data:
  - name: "name"
    type: "String"
  - name: "supplierCode"
    type: "String"
  - name: "category"
    type: "String"
  - name: "status"
    type: "SupplierStatus"
  relations:
  - name: "assessments"
    type: "SupplierAssessment"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "IncomingShipment"
    multiplicity: "OneToMany"
- name: "SupplierAssessment"
  description: "Formal evaluation of supplier capability, quality system, and performance."
  data:
  - name: "assessmentNumber"
    type: "String"
  - name: "rating"
    type: "SupplierRating"
  - name: "assessmentDate"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "relatedAudits"
    type: "QualityAudit"
    multiplicity: "OneToMany"
- name: "IncomingShipment"
  description: "Receipt of materials from a supplier that may trigger incoming inspection."
  data:
  - name: "shipmentNumber"
    type: "String"
  - name: "arrivalDate"
    type: "Date"
  - name: "quantity"
    type: "Integer"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "inspectionLot"
    type: "InspectionLot"
    multiplicity: "OneToOne"
- name: "MeasurementSystemAnalysis"
  description: "Study evaluating measurement system variation such as GRR, bias, and\
    \ linearity."
  data:
  - name: "studyNumber"
    type: "String"
  - name: "msaType"
    type: "MSAType"
  - name: "resultSummary"
    type: "String"
  - name: "status"
    type: "StudyStatus"
  - name: "studyDate"
    type: "Date"
  relations:
  - name: "device"
    type: "MeasurementDevice"
    multiplicity: "ManyToOne"
  - name: "process"
    type: "ManufacturingProcess"
    multiplicity: "ManyToOne"
- name: "ProcessCapabilityStudy"
  description: "Statistical evaluation of process capability and performance indices."
  data:
  - name: "studyNumber"
    type: "String"
  - name: "cp"
    type: "Decimal"
  - name: "cpk"
    type: "Decimal"
  - name: "pp"
    type: "Decimal"
  - name: "ppk"
    type: "Decimal"
  - name: "studyDate"
    type: "Date"
  relations:
  - name: "process"
    type: "ManufacturingProcess"
    multiplicity: "ManyToOne"
  - name: "characteristic"
    type: "QualityCharacteristic"
    multiplicity: "ManyToOne"
enums:
- name: "QualityProgramStatus"
  description: "Lifecycle status of a quality program from planning through retirement."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "Suspended"
  - name: "Retired"
- name: "ApprovalStatus"
  description: "Review and release status of plans and controlled content."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Approved"
  - name: "Rejected"
  - name: "Obsolete"
- name: "CriticalityLevel"
  description: "Relative criticality of a process to product quality and compliance."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "CharacteristicType"
  description: "Type of quality characteristic measured or evaluated."
  data:
  - name: "Dimensional"
  - name: "Attribute"
  - name: "Functional"
  - name: "Visual"
- name: "InspectionType"
  description: "Stage of manufacturing at which inspection occurs."
  data:
  - name: "Incoming"
  - name: "InProcess"
  - name: "Final"
- name: "SamplingMethod"
  description: "Method used to determine sample size and selection."
  data:
  - name: "Fixed"
  - name: "Percentage"
  - name: "AQL"
- name: "InspectionLotStatus"
  description: "Execution state of an inspection lot."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "Completed"
  - name: "Closed"
  - name: "OnHold"
- name: "InspectionVerdict"
  description: "Overall acceptance decision for an inspection lot."
  data:
  - name: "Accept"
  - name: "Reject"
  - name: "ConditionalAccept"
- name: "ResultType"
  description: "Nature of measurement captured during inspection."
  data:
  - name: "Variable"
  - name: "Attribute"
- name: "EquipmentStatus"
  description: "Availability and lifecycle state of a measurement device."
  data:
  - name: "Available"
  - name: "InService"
  - name: "OutOfService"
  - name: "Retired"
- name: "CalibrationStatus"
  description: "Outcome state of a calibration activity."
  data:
  - name: "Passed"
  - name: "Adjusted"
  - name: "Failed"
- name: "TestVerdict"
  description: "Outcome of a laboratory test."
  data:
  - name: "Pass"
  - name: "Fail"
  - name: "Inconclusive"
- name: "SpecificationStatus"
  description: "Release state of a product specification."
  data:
  - name: "Draft"
  - name: "Released"
  - name: "Superseded"
- name: "DefectSource"
  description: "Origin point where a defect or deviation was detected."
  data:
  - name: "Incoming"
  - name: "InProcess"
  - name: "FinalInspection"
  - name: "CustomerReturn"
  - name: "Field"
- name: "SeverityLevel"
  description: "Significance of impact posed by a nonconformance."
  data:
  - name: "Minor"
  - name: "Major"
  - name: "Critical"
- name: "NonconformanceStatus"
  description: "Progress state of a nonconformance record."
  data:
  - name: "Open"
  - name: "Contained"
  - name: "UnderInvestigation"
  - name: "Closed"
- name: "ActionStatus"
  description: "Execution status for actions within quality processes."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
- name: "DispositionType"
  description: "Decision category for handling nonconforming material."
  data:
  - name: "UseAsIs"
  - name: "Rework"
  - name: "Repair"
  - name: "Scrap"
  - name: "ReturnToSupplier"
  - name: "Sort"
- name: "CAPAStatus"
  description: "Lifecycle status of a corrective and preventive action."
  data:
  - name: "Open"
  - name: "Implementing"
  - name: "EffectivenessReview"
  - name: "Verified"
  - name: "Closed"
  - name: "Cancelled"
- name: "RCAType"
  description: "Method applied to determine root cause."
