---
metadata:
  name: "HCIDL Capabilities Model - Production Planning"
  description: "Canonical capability model for Production Planning covering demand,\
    \ supply, capacity, and scheduling constructs used to plan manufacturing operations."
  version: "1.0.0"
  industry: "Manufacturing"
  category: "Manufacturing"
  type: "Capability"
  domain: "Production Planning"
entities:
- name: "Enterprise"
  description: "Legal entity that owns manufacturing operations and oversees planning\
    \ across sites and product portfolios."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "sites"
    type: "Site"
    multiplicity: "OneToMany"
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "OneToMany"
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
  - name: "planningScenarios"
    type: "PlanningScenario"
    multiplicity: "OneToMany"
- name: "Site"
  description: "Geographical location where manufacturing, warehousing, or distribution\
    \ activities occur and where plans are executed."
  data:
  - name: "name"
    type: "String"
  - name: "siteCode"
    type: "String"
  - name: "country"
    type: "String"
  - name: "timezone"
    type: "String"
  relations:
  - name: "enterprise"
    type: "Enterprise"
    multiplicity: "ManyToOne"
  - name: "plants"
    type: "Plant"
    multiplicity: "OneToMany"
  - name: "calendars"
    type: "Calendar"
    multiplicity: "OneToMany"
  - name: "products"
    type: "Product"
    multiplicity: "ManyToMany"
  - name: "demandSignals"
    type: "DemandSignal"
    multiplicity: "OneToMany"
  - name: "planningRuns"
    type: "PlanningRun"
    multiplicity: "OneToMany"
  - name: "capacityPlans"
    type: "CapacityPlan"
    multiplicity: "OneToMany"
  - name: "inventoryPositions"
    type: "InventoryPosition"
    multiplicity: "OneToMany"
- name: "Plant"
  description: "Operational unit within a site that performs manufacturing activities\
    \ and is the focus of detailed production planning."
  data:
  - name: "name"
    type: "String"
  - name: "plantCode"
    type: "String"
  - name: "planningHorizonDays"
    type: "Integer"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "productionLines"
    type: "ProductionLine"
    multiplicity: "OneToMany"
  - name: "workCenters"
    type: "WorkCenter"
    multiplicity: "OneToMany"
  - name: "calendars"
    type: "Calendar"
    multiplicity: "OneToMany"
- name: "ProductionLine"
  description: "Sequence of equipment and stations organized to produce specific items\
    \ or families of items."
  data:
  - name: "name"
    type: "String"
  - name: "lineType"
    type: "ProductionLineType"
  - name: "efficiencyPercent"
    type: "Decimal"
  relations:
  - name: "plant"
    type: "Plant"
    multiplicity: "ManyToOne"
  - name: "workCenters"
    type: "WorkCenter"
    multiplicity: "OneToMany"
  - name: "capacityPlans"
    type: "CapacityPlan"
    multiplicity: "OneToMany"
- name: "WorkCenter"
  description: "Logical grouping of resources with similar capabilities used for scheduling\
    \ and capacity planning."
  data:
  - name: "name"
    type: "String"
  - name: "workCenterCode"
    type: "String"
  - name: "capability"
    type: "String"
  relations:
  - name: "productionLine"
    type: "ProductionLine"
    multiplicity: "ManyToOne"
  - name: "resources"
    type: "Resource"
    multiplicity: "OneToMany"
  - name: "capacityBuckets"
    type: "CapacityBucket"
    multiplicity: "OneToMany"
  - name: "operations"
    type: "Operation"
    multiplicity: "OneToMany"
- name: "Resource"
  description: "Individual machine, labor team, or tool group that provides capacity\
    \ for operations."
  data:
  - name: "name"
    type: "String"
  - name: "resourceCode"
    type: "String"
  - name: "resourceType"
    type: "ResourceType"
  - name: "availableHoursPerDay"
    type: "Decimal"
  relations:
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "calendars"
    type: "Calendar"
    multiplicity: "ManyToMany"
  - name: "capacityBuckets"
    type: "CapacityBucket"
    multiplicity: "OneToMany"
- name: "Calendar"
  description: "Time structure defining working and non-working time, shifts, and\
    \ planning buckets for a planning entity."
  data:
  - name: "name"
    type: "String"
  - name: "calendarType"
    type: "CalendarType"
  - name: "timeBucketType"
    type: "TimeBucketType"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "plant"
    type: "Plant"
    multiplicity: "ManyToOne"
  - name: "shiftPatterns"
    type: "ShiftPattern"
    multiplicity: "OneToMany"
  - name: "exceptions"
    type: "CalendarException"
    multiplicity: "OneToMany"
- name: "ShiftPattern"
  description: "Repeating time pattern defining shifts used for capacity and scheduling."
  data:
  - name: "name"
    type: "String"
  - name: "startTime"
    type: "String"
  - name: "endTime"
    type: "String"
  - name: "daysOfWeek"
    type: "String"
  relations:
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
- name: "CalendarException"
  description: "Non-standard time such as holidays, shutdowns, and unplanned downtime."
  data:
  - name: "name"
    type: "String"
  - name: "exceptionType"
    type: "CalendarExceptionType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "calendar"
    type: "Calendar"
    multiplicity: "ManyToOne"
- name: "ProductFamily"
  description: "Grouping of related products for planning and reporting purposes."
  data:
  - name: "name"
    type: "String"
  - name: "segment"
    type: "String"
  relations:
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
- name: "Product"
  description: "Planned item manufactured or procured, with attributes relevant to\
    \ planning."
  data:
  - name: "name"
    type: "String"
  - name: "productCode"
    type: "String"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  relations:
  - name: "productFamily"
    type: "ProductFamily"
    multiplicity: "ManyToOne"
  - name: "sites"
    type: "Site"
    multiplicity: "ManyToMany"
  - name: "routings"
    type: "Routing"
    multiplicity: "OneToMany"
- name: "Supplier"
  description: "External source that provides materials or services used to satisfy\
    \ planned supply."
  data:
  - name: "name"
    type: "String"
  - name: "supplierCode"
    type: "String"
  - name: "standardLeadTimeDays"
    type: "Integer"
  relations:
  - name: "enterprise"
    type: "Enterprise"
    multiplicity: "ManyToOne"
  - name: "supplySources"
    type: "SupplySource"
    multiplicity: "OneToMany"
- name: "SupplySource"
  description: "Sourcing rule defining how a product is supplied to a site via make,\
    \ buy, or transfer."
  data:
  - name: "sourceType"
    type: "SupplySourceType"
  - name: "priority"
    type: "Integer"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "receivingSite"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "supplyingPlant"
    type: "Plant"
    multiplicity: "ManyToOne"
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "leadTimeProfile"
    type: "LeadTimeProfile"
    multiplicity: "ManyToOne"
- name: "LeadTimeProfile"
  description: "Lead time parameters used for planning supply across sourcing methods."
  data:
  - name: "name"
    type: "String"
  - name: "procurementLeadTimeDays"
    type: "Integer"
  - name: "manufacturingLeadTimeDays"
    type: "Integer"
  - name: "transferLeadTimeDays"
    type: "Integer"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
- name: "LotSizingPolicy"
  description: "Lot sizing configuration controlling how planned supply quantities\
    \ are calculated."
  data:
  - name: "name"
    type: "String"
  - name: "method"
    type: "LotSizingMethod"
  - name: "minLotSize"
    type: "Decimal"
  - name: "fixedLotSize"
    type: "Decimal"
  - name: "roundingValue"
    type: "Decimal"
  - name: "reviewPeriodDays"
    type: "Integer"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
- name: "InventoryPolicy"
  description: "Service and stock policies guiding safety stock and reorder behavior."
  data:
  - name: "safetyStockQuantity"
    type: "Decimal"
  - name: "safetyDays"
    type: "Integer"
  - name: "reorderPoint"
    type: "Decimal"
  - name: "reorderQuantity"
    type: "Decimal"
  - name: "serviceLevelPercent"
    type: "Decimal"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
- name: "TimeFencePolicy"
  description: "Time-fence rules that protect near-term plans and control changes."
  data:
  - name: "demandFenceDays"
    type: "Integer"
  - name: "planningFenceDays"
    type: "Integer"
  - name: "releaseFenceDays"
    type: "Integer"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
- name: "ItemPlanningPolicy"
  description: "Item-level planning strategy and policy associations for a given site."
  data:
  - name: "planningStrategy"
    type: "PlanningStrategy"
  - name: "planningTimeFenceDays"
    type: "Integer"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "lotSizingPolicy"
    type: "LotSizingPolicy"
    multiplicity: "ManyToOne"
  - name: "timeFencePolicy"
    type: "TimeFencePolicy"
    multiplicity: "ManyToOne"
  - name: "leadTimeProfile"
    type: "LeadTimeProfile"
    multiplicity: "ManyToOne"
  - name: "primarySupplySource"
    type: "SupplySource"
    multiplicity: "ManyToOne"
- name: "SalesForecast"
  description: "Time-phased prediction of future demand used as an input to planning."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "horizonStart"
    type: "Date"
  - name: "horizonEnd"
    type: "Date"
  - name: "status"
    type: "PlanStatus"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "forecastLines"
    type: "SalesForecastLine"
    multiplicity: "OneToMany"
- name: "SalesForecastLine"
  description: "Period-level forecast quantity for a specific product."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "quantity"
    type: "Decimal"
  relations:
  - name: "forecast"
    type: "SalesForecast"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "DemandSignal"
  description: "Independent or dependent demand record used for pegging and planning."
  data:
  - name: "name"
    type: "String"
  - name: "demandType"
    type: "DemandType"
  - name: "quantity"
    type: "Quantity"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
- name: "DemandPlan"
  description: "Consolidated time-phased demand across forecasts and orders for planning."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "status"
    type: "PlanStatus"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "salesForecast"
    type: "SalesForecast"
    multiplicity: "ManyToOne"
  - name: "demandPlanItems"
    type: "DemandPlanItem"
    multiplicity: "OneToMany"
- name: "DemandPlanItem"
  description: "Product and period-specific demand quantity within a demand plan."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "quantity"
    type: "Decimal"
  - name: "demandType"
    type: "DemandType"
  relations:
  - name: "demandPlan"
    type: "DemandPlan"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "MasterProductionSchedule"
  description: "Time-phased planned production for key items balancing demand and\
    \ capacity at an aggregate level."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "status"
    type: "PlanStatus"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "demandPlan"
    type: "DemandPlan"
    multiplicity: "ManyToOne"
  - name: "mpsItems"
    type: "MPSItem"
    multiplicity: "OneToMany"
- name: "MPSItem"
  description: "Product-period record within an MPS specifying planned build quantities."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "quantity"
    type: "Decimal"
  - name: "frozen"
    type: "Boolean"
  relations:
  - name: "mps"
    type: "MasterProductionSchedule"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "Routing"
  description: "Definition of the sequence of operations required to manufacture a\
    \ product."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "operations"
    type: "Operation"
    multiplicity: "OneToMany"
- name: "Operation"
  description: "Step within a routing that consumes capacity and time on a work center."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "standardTimeMinutes"
    type: "Decimal"
  - name: "batchSize"
    type: "Decimal"
  relations:
  - name: "routing"
    type: "Routing"
    multiplicity: "ManyToOne"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
- name: "CapacityPlan"
  description: "Planned capacity availability and requirements over time for work\
    \ centers and resources."
  data:
  - name: "name"
    type: "String"
  - name: "level"
    type: "CapacityPlanningLevel"
  - name: "status"
    type: "PlanStatus"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "capacityBuckets"
    type: "CapacityBucket"
    multiplicity: "OneToMany"
- name: "CapacityBucket"
  description: "Time bucket capturing available and required capacity for a specific\
    \ work center or resource."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "availableHours"
    type: "Decimal"
  - name: "requiredHours"
    type: "Decimal"
  - name: "overloadHours"
    type: "Decimal"
  relations:
  - name: "capacityPlan"
    type: "CapacityPlan"
    multiplicity: "ManyToOne"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
- name: "PlanningScenario"
  description: "Collection of planning assumptions and results used for baseline or\
    \ what-if analysis."
  data:
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  - name: "isWhatIf"
    type: "Boolean"
  - name: "version"
    type: "String"
  relations:
  - name: "enterprise"
    type: "Enterprise"
    multiplicity: "ManyToOne"
  - name: "planningRuns"
    type: "PlanningRun"
    multiplicity: "OneToMany"
  - name: "overrides"
    type: "ScenarioOverride"
    multiplicity: "OneToMany"
- name: "ScenarioOverride"
  description: "Targeted adjustment applied to a scenario to test alternative planning\
    \ assumptions."
  data:
  - name: "name"
    type: "String"
  - name: "overrideType"
    type: "ScenarioOverrideType"
  - name: "value"
    type: "Decimal"
  - name: "textValue"
    type: "String"
  relations:
  - name: "scenario"
    type: "PlanningScenario"
    multiplicity: "ManyToOne"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
- name: "PlanningRun"
  description: "Execution record of a planning algorithm with parameters and generated\
    \ outputs."
  data:
  - name: "name"
    type: "String"
  - name: "runTimestamp"
    type: "DateTime"
  - name: "planningHorizonDays"
    type: "Integer"
  - name: "sourceOfDemand"
    type: "PlanningSource"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "scenario"
    type: "PlanningScenario"
    multiplicity: "ManyToOne"
  - name: "generatedPlannedOrders"
    type: "PlannedOrder"
    multiplicity: "OneToMany"
  - name: "exceptionMessages"
    type: "ExceptionMessage"
    multiplicity: "OneToMany"
- name: "PlannedOrder"
  description: "Proposed supply order created by planning that may be firmed or converted\
    \ for execution."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "orderType"
    type: "PlannedOrderType"
  - name: "status"
    type: "PlannedOrderStatus"
  - name: "quantity"
    type: "Decimal"
  - name: "startDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "supplySource"
    type: "SupplySource"
    multiplicity: "ManyToOne"
  - name: "planningRun"
    type: "PlanningRun"
    multiplicity: "ManyToOne"
  - name: "peggings"
    type: "PeggingLink"
    multiplicity: "OneToMany"
- name: "PeggingLink"
  description: "Association between a supply proposal and the demand it fulfills for\
    \ traceability."
  data:
  - name: "allocatedQuantity"
    type: "Decimal"
  relations:
  - name: "plannedOrder"
    type: "PlannedOrder"
    multiplicity: "ManyToOne"
  - name: "demandSignal"
    type: "DemandSignal"
    multiplicity: "ManyToOne"
  - name: "mpsItem"
    type: "MPSItem"
    multiplicity: "ManyToOne"
  - name: "demandPlanItem"
    type: "DemandPlanItem"
    multiplicity: "ManyToOne"
- name: "ExceptionMessage"
  description: "Alert or recommendation generated by planning to highlight issues\
    \ or actions."
  data:
  - name: "messageCode"
    type: "String"
  - name: "severity"
    type: "PlanningExceptionSeverity"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "planningRun"
    type: "PlanningRun"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "plannedOrder"
    type: "PlannedOrder"
    multiplicity: "ManyToOne"
- name: "InventoryPosition"
  description: "Snapshot of item stock levels at a site used during planning."
  data:
  - name: "asOfDate"
    type: "Date"
  - name: "quantityOnHand"
    type: "Decimal"
  - name: "quantityOnOrder"
    type: "Decimal"
  - name: "quantityReserved"
    type: "Decimal"
  - name: "safetyStock"
    type: "Decimal"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
- name: "TransferRoute"
  description: "Planned logistics path between sites with standard transit parameters."
  data:
  - name: "name"
    type: "String"
  - name: "transitTimeDays"
    type: "Integer"
  - name: "transferBatchSize"
    type: "Decimal"
  relations:
  - name: "fromSite"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "toSite"
    type: "Site"
    multiplicity: "ManyToOne"
enums:
- name: "ProductionLineType"
  description: "Classification of production lines by primary function."
  data:
  - name: "Assembly"
  - name: "Fabrication"
  - name: "Packaging"
  - name: "Mixing"
  - name: "Finishing"
- name: "ResourceType"
  description: "Category of capacity-providing resource."
  data:
  - name: "Machine"
  - name: "Labor"
  - name: "Tool"
  - name: "WorkCell"
- name: "CalendarType"
  description: "Scope of calendar application within planning."
  data:
  - name: "SiteCalendar"
  - name: "PlantCalendar"
  - name: "ResourceCalendar"
- name: "TimeBucketType"
  description: "Granularity used to bucket time-phased plans."
  data:
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
- name: "CalendarExceptionType"
  description: "Reason for deviation from standard working time."
  data:
  - name: "Holiday"
  - name: "PlannedShutdown"
  - name: "UnplannedDowntime"
- name: "DemandType"
  description: "Nature of the demand signal driving supply."
  data:
  - name: "Forecast"
  - name: "CustomerOrder"
  - name: "DependentDemand"
  - name: "SafetyStockReplenishment"
- name: "PlanStatus"
  description: "Lifecycle status of a plan or version."
  data:
  - name: "Draft"
  - name: "Proposed"
  - name: "Approved"
  - name: "Released"
  - name: "Archived"
- name: "LotSizingMethod"
  description: "Algorithm used to determine planned lot quantities."
  data:
  - name: "LotForLot"
  - name: "FixedLot"
  - name: "EOQ"
  - name: "PeriodOrderQuantity"
  - name: "MinMax"
- name: "PlanningStrategy"
  description: "Fulfillment strategy guiding how demand is met."
  data:
  - name: "MakeToStock"
  - name: "MakeToOrder"
  - name: "AssembleToOrder"
  - name: "EngineerToOrder"
- name: "SupplySourceType"
  description: "Method used to supply demand for an item."
  data:
  - name: "Make"
  - name: "Buy"
  - name: "Transfer"
- name: "CapacityPlanningLevel"
  description: "Detail level used to assess and balance capacity."
  data:
  - name: "RoughCut"
  - name: "Detailed"
