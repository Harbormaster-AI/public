---
metadata:
  name: "Shop Floor Control HCIDL Model"
  description: "A comprehensive capability model for managing execution, tracking,\
    \ dispatch, labor, equipment, and WIP control on the shop floor."
  version: "1.0.0"
  industry: "Manufacturing"
  category: "Manufacturing"
  type: "Capability"
  domain: "Shop Floor Control"
entities:
- name: "Factory"
  description: "Physical production site where shop floor activities occur."
  data:
  - name: "name"
    type: "String"
  - name: "siteCode"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "areas"
    type: "Area"
    multiplicity: "OneToMany"
  - name: "shifts"
    type: "Shift"
    multiplicity: "OneToMany"
  - name: "workOrders"
    type: "WorkOrder"
    multiplicity: "OneToMany"
- name: "Area"
  description: "Logical production area grouping work centers within a factory."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "factory"
    type: "Factory"
    multiplicity: "ManyToOne"
  - name: "workCenters"
    type: "WorkCenter"
    multiplicity: "OneToMany"
- name: "WorkCenter"
  description: "Resource group that performs defined operations, often a cell or line\
    \ segment."
  data:
  - name: "name"
    type: "String"
  - name: "workCenterType"
    type: "WorkCenterType"
  - name: "taktTimeSeconds"
    type: "Integer"
  relations:
  - name: "area"
    type: "Area"
    multiplicity: "ManyToOne"
  - name: "machines"
    type: "Machine"
    multiplicity: "OneToMany"
  - name: "dispatchLists"
    type: "DispatchList"
    multiplicity: "OneToMany"
  - name: "workOrderOperations"
    type: "WorkOrderOperation"
    multiplicity: "OneToMany"
  - name: "andonEvents"
    type: "AndonEvent"
    multiplicity: "OneToMany"
  - name: "performanceMetrics"
    type: "PerformanceMetric"
    multiplicity: "OneToMany"
- name: "Machine"
  description: "Individual piece of equipment or station capable of performing work."
  data:
  - name: "assetTag"
    type: "String"
  - name: "serialNumber"
    type: "String"
  - name: "machineType"
    type: "MachineType"
  - name: "status"
    type: "EquipmentStatus"
  relations:
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "tools"
    type: "Tool"
    multiplicity: "ManyToMany"
  - name: "timeEntries"
    type: "MachineTimeEntry"
    multiplicity: "OneToMany"
  - name: "andonEvents"
    type: "AndonEvent"
    multiplicity: "OneToMany"
  - name: "performanceMetrics"
    type: "PerformanceMetric"
    multiplicity: "OneToMany"
- name: "Tool"
  description: "Tooling or fixture used by machines or work centers to execute operations."
  data:
  - name: "toolNumber"
    type: "String"
  - name: "toolType"
    type: "ToolType"
  - name: "calibrationDue"
    type: "Date"
  relations:
  - name: "machines"
    type: "Machine"
    multiplicity: "ManyToMany"
- name: "Operator_"
  description: "Shop floor worker who performs operational tasks and data collection."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "employeeNumber"
    type: "String"
  - name: "badge"
    type: "EmployeeBadge"
  - name: "skillGrade"
    type: "SkillGrade"
  relations:
  - name: "qualifications"
    type: "Qualification"
    multiplicity: "ManyToMany"
  - name: "laborTimeEntries"
    type: "LaborTimeEntry"
    multiplicity: "OneToMany"
  - name: "acknowledgedAndonEvents"
    type: "AndonEvent"
    multiplicity: "OneToMany"
- name: "Qualification"
  description: "Certification or authorization required to perform specific operations."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "String"
  - name: "expiryDate"
    type: "Date"
  relations:
  - name: "operators"
    type: "Operator_"
    multiplicity: "ManyToMany"
  - name: "operationDefinitions"
    type: "OperationDefinition"
    multiplicity: "ManyToMany"
- name: "Shift"
  description: "Defined production time block for staffing and performance tracking."
  data:
  - name: "name"
    type: "String"
  - name: "startTime"
    type: "Time"
  - name: "endTime"
    type: "Time"
  - name: "shiftType"
    type: "ShiftType"
  relations:
  - name: "factory"
    type: "Factory"
    multiplicity: "ManyToOne"
  - name: "laborTimeEntries"
    type: "LaborTimeEntry"
    multiplicity: "OneToMany"
  - name: "performanceMetrics"
    type: "PerformanceMetric"
    multiplicity: "OneToMany"
- name: "WorkOrder"
  description: "Instruction to manufacture a specified quantity by a due date."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "status"
    type: "WorkOrderStatus"
  - name: "priority"
    type: "Integer"
  - name: "dueDate"
    type: "Date"
  - name: "quantity"
    type: "Decimal"
  - name: "uom"
    type: "String"
  relations:
  - name: "factory"
    type: "Factory"
    multiplicity: "ManyToOne"
  - name: "routing"
    type: "Routing"
    multiplicity: "ManyToOne"
  - name: "operations"
    type: "WorkOrderOperation"
    multiplicity: "OneToMany"
  - name: "moveTransactions"
    type: "MoveTransaction"
    multiplicity: "OneToMany"
  - name: "materialConsumptions"
    type: "MaterialConsumption"
    multiplicity: "OneToMany"
- name: "Routing"
  description: "Definition of the operational sequence used to fulfill a work order."
  data:
  - name: "name"
    type: "String"
  - name: "revision"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "steps"
    type: "OperationDefinition"
    multiplicity: "OneToMany"
  - name: "workOrders"
    type: "WorkOrder"
    multiplicity: "OneToMany"
- name: "OperationDefinition"
  description: "Standard operation step including sequence, time standards, and requirements."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "name"
    type: "String"
  - name: "operationType"
    type: "OperationType"
  - name: "standardCycleTimeSeconds"
    type: "Integer"
  - name: "setupTimeMinutes"
    type: "Integer"
  - name: "yieldPercent"
    type: "Decimal"
  relations:
  - name: "routing"
    type: "Routing"
    multiplicity: "ManyToOne"
  - name: "requiredQualifications"
    type: "Qualification"
    multiplicity: "ManyToMany"
- name: "WorkOrderOperation"
  description: "Execution instance of a routing step for a specific work order."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "plannedStart"
    type: "Date"
  - name: "plannedFinish"
    type: "Date"
  - name: "status"
    type: "OperationStatus"
  - name: "quantityToMake"
    type: "Decimal"
  - name: "quantityCompleted"
    type: "Decimal"
  - name: "quantityScrapped"
    type: "Decimal"
  relations:
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "ManyToOne"
  - name: "operationDefinition"
    type: "OperationDefinition"
    multiplicity: "ManyToOne"
  - name: "assignedWorkCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "assignedMachine"
    type: "Machine"
    multiplicity: "ManyToOne"
  - name: "laborTimeEntries"
    type: "LaborTimeEntry"
    multiplicity: "OneToMany"
  - name: "machineTimeEntries"
    type: "MachineTimeEntry"
    multiplicity: "OneToMany"
  - name: "qualityChecks"
    type: "QualityCheck"
    multiplicity: "OneToMany"
  - name: "dispatchEntries"
    type: "DispatchEntry"
    multiplicity: "OneToMany"
  - name: "materialConsumptions"
    type: "MaterialConsumption"
    multiplicity: "OneToMany"
  - name: "scrapRecords"
    type: "ScrapRecord"
    multiplicity: "OneToMany"
  - name: "reworkOrders"
    type: "ReworkOrder"
    multiplicity: "OneToMany"
- name: "DispatchList"
  description: "Prioritized queue of work for a work center."
  data:
  - name: "name"
    type: "String"
  - name: "dispatchStrategy"
    type: "DispatchStrategy"
  relations:
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "entries"
    type: "DispatchEntry"
    multiplicity: "OneToMany"
- name: "DispatchEntry"
  description: "Positioned reference to a work order operation within a dispatch list."
  data:
  - name: "position"
    type: "Integer"
  - name: "releaseStatus"
    type: "ReleaseStatus"
  - name: "comment"
    type: "String"
  relations:
  - name: "dispatchList"
    type: "DispatchList"
    multiplicity: "ManyToOne"
  - name: "workOrderOperation"
    type: "WorkOrderOperation"
    multiplicity: "ManyToOne"
- name: "MaterialLot"
  description: "Tracked quantity of material or WIP identified by lot."
  data:
  - name: "lotNumber"
    type: "String"
  - name: "materialCode"
    type: "String"
  - name: "quantityOnHand"
    type: "Decimal"
  - name: "uom"
    type: "String"
  - name: "qualityStatus"
    type: "QualityStatus"
  relations:
  - name: "currentWorkOrderOperation"
    type: "WorkOrderOperation"
    multiplicity: "ManyToOne"
  - name: "container"
    type: "Container"
    multiplicity: "ManyToOne"
  - name: "qualityChecks"
    type: "QualityCheck"
    multiplicity: "OneToMany"
  - name: "materialConsumptions"
    type: "MaterialConsumption"
    multiplicity: "OneToMany"
  - name: "moveTransactions"
    type: "MoveTransaction"
    multiplicity: "OneToMany"
- name: "Container"
  description: "Physical container or carrier holding one or more material lots."
  data:
  - name: "containerCode"
    type: "String"
  - name: "containerType"
    type: "ContainerType"
  - name: "status"
    type: "ContainerStatus"
  - name: "maxLoad"
    type: "Decimal"
  relations:
  - name: "contents"
    type: "MaterialLot"
    multiplicity: "OneToMany"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "Location"
  description: "Defined point on the shop floor for storage, staging, or processing."
  data:
  - name: "name"
    type: "String"
  - name: "locationType"
    type: "LocationType"
  relations:
  - name: "parent"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "containers"
    type: "Container"
    multiplicity: "OneToMany"
- name: "LaborTimeEntry"
  description: "Recorded labor effort associated with executing an operation."
  data:
  - name: "startTime"
    type: "Date"
  - name: "endTime"
    type: "Date"
  - name: "laborType"
    type: "LaborType"
  - name: "quantityCompleted"
    type: "Decimal"
  - name: "comments"
    type: "String"
  relations:
  - name: "operator_"
    type: "Operator_"
    multiplicity: "ManyToOne"
  - name: "workOrderOperation"
    type: "WorkOrderOperation"
    multiplicity: "ManyToOne"
  - name: "shift"
    type: "Shift"
    multiplicity: "ManyToOne"
- name: "MachineTimeEntry"
  description: "Time classification for machine utilization, including production\
    \ and downtime."
  data:
  - name: "startTime"
    type: "Date"
  - name: "endTime"
    type: "Date"
  - name: "timeCategory"
    type: "MachineTimeCategory"
  - name: "notes"
    type: "String"
  relations:
  - name: "machine"
    type: "Machine"
    multiplicity: "ManyToOne"
  - name: "workOrderOperation"
    type: "WorkOrderOperation"
    multiplicity: "ManyToOne"
  - name: "downtimeReason"
    type: "DowntimeReason"
    multiplicity: "ManyToOne"
- name: "DowntimeReason"
  description: "Catalog of reasons used to classify equipment downtime."
  data:
  - name: "code"
    type: "String"
  - name: "description"
    type: "String"
  - name: "category"
    type: "DowntimeCategory"
  relations:
  - name: "machineTimeEntries"
    type: "MachineTimeEntry"
    multiplicity: "OneToMany"
- name: "QualityCheck"
  description: "Inspection or verification performed during or after an operation."
  data:
  - name: "checkType"
    type: "QualityCheckType"
  - name: "sampleSize"
    type: "Integer"
  - name: "result"
    type: "QualityResult"
  - name: "recordedAt"
    type: "Date"
  - name: "inspector"
    type: "String"
  relations:
  - name: "workOrderOperation"
    type: "WorkOrderOperation"
    multiplicity: "ManyToOne"
  - name: "materialLot"
    type: "MaterialLot"
    multiplicity: "ManyToOne"
  - name: "nonconformances"
    type: "Nonconformance"
    multiplicity: "OneToMany"
- name: "Nonconformance"
  description: "Recorded deviation from specifications identified by a quality check."
  data:
  - name: "code"
    type: "String"
  - name: "severity"
    type: "NonconformanceSeverity"
  - name: "disposition"
    type: "Disposition"
  - name: "quantity"
    type: "Decimal"
  - name: "createdAt"
    type: "Date"
  relations:
  - name: "qualityCheck"
    type: "QualityCheck"
    multiplicity: "ManyToOne"
  - name: "reworkOrder"
    type: "ReworkOrder"
    multiplicity: "ManyToOne"
- name: "ReworkOrder"
  description: "Instruction to perform corrective work to address a nonconformance."
  data:
  - name: "ticketNumber"
    type: "String"
  - name: "status"
    type: "ReworkStatus"
  - name: "quantity"
    type: "Decimal"
  - name: "actionDescription"
    type: "String"
  relations:
  - name: "sourceNonconformance"
    type: "Nonconformance"
    multiplicity: "ManyToOne"
  - name: "targetWorkOrderOperation"
    type: "WorkOrderOperation"
    multiplicity: "ManyToOne"
- name: "MoveTransaction"
  description: "Movement of WIP or materials between operations or locations."
  data:
  - name: "movedQuantity"
    type: "Decimal"
  - name: "moveDate"
    type: "Date"
  - name: "moveType"
    type: "MoveType"
  - name: "fromSequence"
    type: "Integer"
  - name: "toSequence"
    type: "Integer"
  relations:
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "ManyToOne"
  - name: "fromOperation"
    type: "WorkOrderOperation"
    multiplicity: "ManyToOne"
  - name: "toOperation"
    type: "WorkOrderOperation"
    multiplicity: "ManyToOne"
  - name: "materialLot"
    type: "MaterialLot"
    multiplicity: "ManyToOne"
  - name: "fromLocation"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "toLocation"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "MaterialConsumption"
  description: "Recording of material usage against an operation."
  data:
  - name: "materialCode"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "uom"
    type: "String"
  - name: "consumptionType"
    type: "ConsumptionType"
  relations:
  - name: "workOrderOperation"
    type: "WorkOrderOperation"
    multiplicity: "ManyToOne"
  - name: "materialLot"
    type: "MaterialLot"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
- name: "AndonEvent"
  description: "Real-time signal indicating issues or assistance requests on the shop\
    \ floor."
  data:
  - name: "eventType"
    type: "AndonEventType"
  - name: "triggeredAt"
    type: "Date"
  - name: "message"
    type: "String"
  - name: "status"
    type: "AndonStatus"
  relations:
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "machine"
    type: "Machine"
    multiplicity: "ManyToOne"
  - name: "workOrderOperation"
    type: "WorkOrderOperation"
    multiplicity: "ManyToOne"
  - name: "acknowledgedBy"
    type: "Operator_"
    multiplicity: "ManyToOne"
- name: "PerformanceMetric"
  description: "Aggregated operational performance indicators such as OEE."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "availability"
    type: "Decimal"
  - name: "performance"
    type: "Decimal"
  - name: "quality"
    type: "Decimal"
  - name: "oee"
    type: "Decimal"
  relations:
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "machine"
    type: "Machine"
    multiplicity: "ManyToOne"
  - name: "shift"
    type: "Shift"
    multiplicity: "ManyToOne"
- name: "ScrapRecord"
  description: "Documentation of scrapped quantity and reason during execution."
  data:
  - name: "quantity"
    type: "Decimal"
  - name: "reasonCode"
    type: "String"
  - name: "recordedAt"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "workOrderOperation"
    type: "WorkOrderOperation"
    multiplicity: "ManyToOne"
  - name: "materialLot"
    type: "MaterialLot"
    multiplicity: "ManyToOne"
  - name: "operator_"
    type: "Operator_"
    multiplicity: "ManyToOne"
enums:
- name: "WorkCenterType"
  description: "Classification of work center configuration and function."
  data:
  - name: "AssemblyCell"
  - name: "MachiningCell"
  - name: "PaintBooth"
  - name: "TestStation"
  - name: "PackagingLine"
- name: "MachineType"
  description: "Category of equipment used on the shop floor."
  data:
  - name: "CNC"
  - name: "Press"
  - name: "Robot"
  - name: "Conveyor"
  - name: "Tester"
- name: "EquipmentStatus"
  description: "High-level machine or equipment availability state."
  data:
  - name: "Available"
  - name: "Running"
  - name: "Idle"
  - name: "Down"
  - name: "Setup"
  - name: "Maintenance"
- name: "ShiftType"
  description: "Scheduling pattern for shop floor shifts."
  data:
  - name: "Day"
  - name: "Swing"
  - name: "Night"
  - name: "Weekend"
- name: "WorkOrderStatus"
  description: "Lifecycle states for a work order."
  data:
  - name: "Planned"
  - name: "Released"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Completed"
  - name: "Closed"
  - name: "Cancelled"
- name: "OperationType"
  description: "Nature of the operation performed at a step."
  data:
  - name: "Setup"
  - name: "Run"
  - name: "Inspection"
  - name: "Pack"
  - name: "Transfer"
- name: "OperationStatus"
  description: "Execution state of a work order operation."
  data:
  - name: "NotStarted"
  - name: "Ready"
  - name: "Running"
  - name: "Paused"
  - name: "Completed"
  - name: "Scrapped"
  - name: "Reworked"
- name: "DispatchStrategy"
  description: "Logic used to prioritize work in a dispatch list."
  data:
  - name: "FIFO"
  - name: "LIFO"
  - name: "Priority"
  - name: "DueDate"
  - name: "ShortestProcessingTime"
- name: "ReleaseStatus"
  description: "Readiness of a dispatch entry for execution."
  data:
  - name: "Pending"
  - name: "Released"
  - name: "Deferred"
  - name: "Blocked"
- name: "QualityStatus"
  description: "Material lot quality disposition state."
  data:
  - name: "Accepted"
  - name: "Quarantined"
  - name: "Rejected"
  - name: "PendingInspection"
- name: "ContainerType"
  description: "Physical format of a material container."
  data:
  - name: "Bin"
  - name: "Pallet"
  - name: "Tote"
  - name: "Cart"
- name: "ContainerStatus"
  description: "Current usage condition of a container."
  data:
  - name: "Empty"
  - name: "InUse"
  - name: "Sealed"
  - name: "Damaged"
- name: "LocationType"
  description: "Functional classification of a shop floor location."
  data:
  - name: "Workstation"
  - name: "Buffer"
  - name: "Warehouse"
  - name: "LineSide"
  - name: "Dock"
- name: "ToolType"
  description: "Category of production tool or fixture."
  data:
  - name: "Fixture"
  - name: "CuttingTool"
  - name: "Gauge"
  - name: "Mold"
  - name: "Die"
- name: "SkillGrade"
  description: "Competency level for operators based on experience or certification."
  data:
  - name: "Apprentice"
  - name: "Journeyman"
  - name: "Expert"
  - name: "Master"
- name: "LaborType"
  description: "Classification of labor time entry."
  data:
  - name: "Direct"
  - name: "Indirect"
  - name: "Setup"
  - name: "Rework"
  - name: "Training"
- name: "MachineTimeCategory"
  description: "Categorization of machine time usage for OEE and reporting."
  data:
  - name: "Production"
  - name: "Setup"
  - name: "Idle"
  - name: "Downtime"
  - name: "Maintenance"
  - name: "Changeover"
- name: "DowntimeCategory"
  description: "High-level grouping for downtime reasons."
  data:
  - name: "Planned"
  - name: "Unplanned"
  - name: "MinorStop"
- name: "QualityCheckType"
  description: "Type of inspection performed in the process."
  data:
  - name: "Incoming"
  - name: "InProcess"
  - name: "Final"
  - name: "Audit"
- name: "QualityResult"
  description: "Outcome status of an inspection or test."
  data:
  - name: "Pass"
  - name: "Fail"
  - name: "ConditionalPass"
- name: "NonconformanceSeverity"
  description: "Impact level associated with a detected nonconformance."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "Disposition"
  description: "Action to be taken for nonconforming material."
  data:
  - name: "UseAsIs"
  - name: "Rework"
  - name: "Scrap"
  - name: "ReturnToVendor"
  - name: "Hold"
- name: "ReworkStatus"
  description: "Progress state of a rework order."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
- name: "MoveType"
  description: "Type of movement recorded for WIP tracking."
  data:
  - name: "StartOperation"
  - name: "EndOperation"
  - name: "Transfer"
  - name: "ScrapMove"
  - name: "ReworkMove"
- name: "ConsumptionType"
  description: "Method by which material is issued to production."
  data:
  - name: "Issue"
  - name: "Backflush"
  - name: "Return"
  - name: "Adjust"
- name: "AndonEventType"
  description: "Category of andon alert raised on the shop floor."
  data:
  - name: "Quality"
  - name: "Material"
  - name: "Safety"
  - name: "Equipment"
  - name: "HelpCall"
- name: "AndonStatus"
  description: "Current handling state of an andon event."
  data:
  - name: "Raised"
  - name: "Acknowledged"
  - name: "Resolved"
  - name: "Escalated"
valueObjects:
- name: "EmployeeBadge"
  description: "Unique badge reference used for operator identification."
  data:
  - name: "value"
    type: "String"
- name: "Address"
  description: "Structured location for a factory site or facility."
  data:
  - name: "street"
