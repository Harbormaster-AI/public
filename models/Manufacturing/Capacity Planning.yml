---
metadata:
  name: "HCIDL Capacity Planning"
  description: "Canonical capabilities model for capacity planning across manufacturing\
    \ sites, resources, calendars, routings, and planning scenarios."
  version: "1.0.0"
  industry: "Industrial Manufacturing"
  category: "Manufacturing"
  type: "Capability"
  domain: "Capacity Planning"
entities:
- name: "Enterprise"
  description: "Legal entity that owns and operates one or more manufacturing sites."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "sites"
    type: "Site"
    multiplicity: "OneToMany"
- name: "Site"
  description: "Physical manufacturing location used for planning and execution of\
    \ capacity."
  data:
  - name: "name"
    type: "String"
  - name: "siteCode"
    type: "String"
  - name: "timezone"
    type: "String"
  relations:
  - name: "enterprise"
    type: "Enterprise"
    multiplicity: "ManyToOne"
  - name: "productionAreas"
    type: "ProductionArea"
    multiplicity: "OneToMany"
  - name: "workCenters"
    type: "WorkCenter"
    multiplicity: "OneToMany"
  - name: "calendars"
    type: "WorkCalendar"
    multiplicity: "OneToMany"
- name: "ProductionArea"
  description: "Logical subdivision of a site grouping related work centers for planning\
    \ purposes."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "workCenters"
    type: "WorkCenter"
    multiplicity: "OneToMany"
- name: "WorkCenter"
  description: "Primary capacity unit where operations are performed and scheduled."
  data:
  - name: "name"
    type: "String"
  - name: "workCenterType"
    type: "WorkCenterType"
  - name: "capacityUnit"
    type: "CapacityUnit"
  - name: "standardHoursPerDay"
    type: "Decimal"
  - name: "efficiencyPercent"
    type: "Decimal"
  - name: "utilizationBasis"
    type: "UtilizationBasis"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "productionArea"
    type: "ProductionArea"
    multiplicity: "ManyToOne"
  - name: "calendar"
    type: "WorkCalendar"
    multiplicity: "ManyToOne"
  - name: "equipment"
    type: "Equipment"
    multiplicity: "OneToMany"
  - name: "laborPools"
    type: "LaborPool"
    multiplicity: "OneToMany"
  - name: "setupGroup"
    type: "SetupGroup"
    multiplicity: "ManyToOne"
  - name: "alternateWorkCenters"
    type: "WorkCenter"
    multiplicity: "ManyToMany"
- name: "Equipment"
  description: "Machine or tool set providing capacity within a work center."
  data:
  - name: "name"
    type: "String"
  - name: "assetTag"
    type: "String"
  - name: "status"
    type: "ResourceStatus"
  - name: "ratedCapacityPerHour"
    type: "Decimal"
  relations:
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "skills"
    type: "Skill"
    multiplicity: "ManyToMany"
  - name: "calendar"
    type: "WorkCalendar"
    multiplicity: "ManyToOne"
- name: "LaborPool"
  description: "Group of workers planned as a shared labor capacity for a work center."
  data:
  - name: "name"
    type: "String"
  - name: "headcount"
    type: "Integer"
  - name: "skillLevel"
    type: "SkillLevel"
  relations:
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "skills"
    type: "Skill"
    multiplicity: "ManyToMany"
  - name: "calendar"
    type: "WorkCalendar"
    multiplicity: "ManyToOne"
- name: "Skill"
  description: "Capability or qualification required to perform an operation or run\
    \ equipment."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "String"
  relations:
  - name: "requiredByOperations"
    type: "Operation"
    multiplicity: "ManyToMany"
  - name: "possessedByEquipment"
    type: "Equipment"
    multiplicity: "ManyToMany"
  - name: "possessedByLaborPools"
    type: "LaborPool"
    multiplicity: "ManyToMany"
- name: "WorkCalendar"
  description: "Working and non-working time definition applied to resources and work\
    \ centers."
  data:
  - name: "name"
    type: "String"
  - name: "calendarType"
    type: "String"
  - name: "timezone"
    type: "String"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "shifts"
    type: "Shift"
    multiplicity: "OneToMany"
  - name: "exceptions"
    type: "CalendarException"
    multiplicity: "OneToMany"
  - name: "workCenters"
    type: "WorkCenter"
    multiplicity: "OneToMany"
  - name: "equipment"
    type: "Equipment"
    multiplicity: "OneToMany"
  - name: "laborPools"
    type: "LaborPool"
    multiplicity: "OneToMany"
- name: "Shift"
  description: "Repeating time period within a calendar defining planned working hours."
  data:
  - name: "name"
    type: "String"
  - name: "startTime"
    type: "LocalTime"
  - name: "endTime"
    type: "LocalTime"
  - name: "plannedHours"
    type: "Decimal"
  relations:
  - name: "calendar"
    type: "WorkCalendar"
    multiplicity: "ManyToOne"
- name: "CalendarException"
  description: "Date-specific override to a work calendar such as a holiday, shutdown,\
    \ or overtime."
  data:
  - name: "name"
    type: "String"
  - name: "date"
    type: "Date"
  - name: "exceptionType"
    type: "CalendarExceptionType"
  - name: "workingHours"
    type: "Decimal"
  relations:
  - name: "calendar"
    type: "WorkCalendar"
    multiplicity: "ManyToOne"
- name: "Product"
  description: "Manufactured item for which capacity is planned."
  data:
  - name: "name"
    type: "String"
  - name: "itemCode"
    type: "String"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  relations:
  - name: "routings"
    type: "Routing"
    multiplicity: "OneToMany"
  - name: "demandItems"
    type: "Demand"
    multiplicity: "OneToMany"
  - name: "plannedOrders"
    type: "PlannedOrder"
    multiplicity: "OneToMany"
  - name: "masterProductionSchedules"
    type: "MasterProductionSchedule"
    multiplicity: "OneToMany"
- name: "Routing"
  description: "Sequence of operations defining how a product is manufactured."
  data:
  - name: "name"
    type: "String"
  - name: "revision"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "operations"
    type: "Operation"
    multiplicity: "OneToMany"
- name: "Operation"
  description: "Executable step in a routing that consumes capacity."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "operationCode"
    type: "String"
  - name: "runTimePerUnit"
    type: "Decimal"
  - name: "setupTime"
    type: "Decimal"
  - name: "batchSize"
    type: "Integer"
  relations:
  - name: "routing"
    type: "Routing"
    multiplicity: "ManyToOne"
  - name: "primaryWorkCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "alternateWorkCenters"
    type: "WorkCenter"
    multiplicity: "ManyToMany"
  - name: "requiredSkills"
    type: "Skill"
    multiplicity: "ManyToMany"
  - name: "requiredTools"
    type: "Tool"
    multiplicity: "ManyToMany"
  - name: "setupGroup"
    type: "SetupGroup"
    multiplicity: "ManyToOne"
- name: "Tool"
  description: "Constrained tool or fixture required by certain operations."
  data:
  - name: "name"
    type: "String"
  - name: "toolType"
    type: "ToolType"
  - name: "quantityAvailable"
    type: "Integer"
  relations:
  - name: "operations"
    type: "Operation"
    multiplicity: "ManyToMany"
  - name: "calendar"
    type: "WorkCalendar"
    multiplicity: "ManyToOne"
- name: "SetupGroup"
  description: "Family classification used to minimize changeovers between operations."
  data:
  - name: "name"
    type: "String"
  - name: "familyCode"
    type: "String"
  relations:
  - name: "operations"
    type: "Operation"
    multiplicity: "OneToMany"
  - name: "changeoverRules"
    type: "ChangeoverRule"
    multiplicity: "OneToMany"
- name: "ChangeoverRule"
  description: "Rule defining the time required to switch from one setup group to\
    \ another."
  data:
  - name: "fromGroup"
    type: "String"
  - name: "toGroup"
    type: "String"
  - name: "changeoverTimeHours"
    type: "Decimal"
  relations:
  - name: "setupGroup"
    type: "SetupGroup"
    multiplicity: "ManyToOne"
- name: "Demand"
  description: "Planned or committed requirement that drives capacity needs."
  data:
  - name: "demandNumber"
    type: "String"
  - name: "demandType"
    type: "DemandType"
  - name: "quantity"
    type: "Decimal"
  - name: "dueDate"
    type: "Date"
  - name: "priority"
    type: "Priority"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "originatingSchedule"
    type: "MasterProductionSchedule"
    multiplicity: "ManyToOne"
- name: "MasterProductionSchedule"
  description: "Time-phased production plan that balances demand and supply at the\
    \ product level."
  data:
  - name: "scheduleNumber"
    type: "String"
  - name: "horizon"
    type: "TimeWindow"
  - name: "status"
    type: "PlanStatus"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "demands"
    type: "Demand"
    multiplicity: "OneToMany"
  - name: "capacityPlan"
    type: "CapacityPlan"
    multiplicity: "ManyToOne"
  - name: "plannedOrders"
    type: "PlannedOrder"
    multiplicity: "OneToMany"
- name: "CapacityPlan"
  description: "Scenario-driven capacity model across a site for a defined planning\
    \ horizon."
  data:
  - name: "name"
    type: "String"
  - name: "planningLevel"
    type: "PlanningLevel"
  - name: "status"
    type: "PlanStatus"
  - name: "version"
    type: "String"
  - name: "horizon"
    type: "TimeWindow"
  - name: "schedulingStrategy"
    type: "SchedulingStrategy"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "scenarios"
    type: "PlanningScenario"
    multiplicity: "OneToMany"
  - name: "masterSchedules"
    type: "MasterProductionSchedule"
    multiplicity: "OneToMany"
  - name: "capacityBuckets"
    type: "CapacityBucket"
    multiplicity: "OneToMany"
- name: "PlanningScenario"
  description: "What-if or baseline configuration of parameters and assumptions for\
    \ capacity planning."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "isWhatIf"
    type: "Boolean"
  relations:
  - name: "capacityPlan"
    type: "CapacityPlan"
    multiplicity: "ManyToOne"
  - name: "adjustments"
    type: "PerformanceAdjustment"
    multiplicity: "OneToMany"
  - name: "plannedOrders"
    type: "PlannedOrder"
    multiplicity: "OneToMany"
  - name: "allocations"
    type: "OperationAllocation"
    multiplicity: "OneToMany"
- name: "CapacityBucket"
  description: "Time-phased capacity supply record for a work center within a plan."
  data:
  - name: "bucketDate"
    type: "Date"
  - name: "granularity"
    type: "BucketGranularity"
  - name: "availableHours"
    type: "Decimal"
  - name: "adjustedHours"
    type: "Decimal"
  relations:
  - name: "capacityPlan"
    type: "CapacityPlan"
    multiplicity: "ManyToOne"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "loads"
    type: "CapacityLoad"
    multiplicity: "OneToMany"
  - name: "downtimeEvents"
    type: "DowntimeEvent"
    multiplicity: "OneToMany"
  - name: "overtimeRequests"
    type: "OvertimeRequest"
    multiplicity: "OneToMany"
- name: "CapacityLoad"
  description: "Aggregated capacity requirement attributed to a work center and time\
    \ bucket."
  data:
  - name: "requiredHours"
    type: "Decimal"
  - name: "status"
    type: "AllocationStatus"
  relations:
  - name: "capacityBucket"
    type: "CapacityBucket"
    multiplicity: "ManyToOne"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "sourceAllocation"
    type: "OperationAllocation"
    multiplicity: "ManyToOne"
- name: "PlannedOrder"
  description: "Time-phased planned production order derived from master scheduling\
    \ or material planning."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "PlannedOrderStatus"
  - name: "priority"
    type: "Priority"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "routing"
    type: "Routing"
    multiplicity: "ManyToOne"
  - name: "masterSchedule"
    type: "MasterProductionSchedule"
    multiplicity: "ManyToOne"
  - name: "scenario"
    type: "PlanningScenario"
    multiplicity: "ManyToOne"
  - name: "allocations"
    type: "OperationAllocation"
    multiplicity: "OneToMany"
- name: "OperationAllocation"
  description: "Scheduled assignment of an operation from a planned order to a work\
    \ center and time bucket."
  data:
  - name: "allocatedHours"
    type: "Decimal"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "AllocationStatus"
  relations:
  - name: "plannedOrder"
    type: "PlannedOrder"
    multiplicity: "ManyToOne"
  - name: "operation"
    type: "Operation"
    multiplicity: "ManyToOne"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "capacityBucket"
    type: "CapacityBucket"
    multiplicity: "ManyToOne"
- name: "PerformanceAdjustment"
  description: "Override to efficiency or utilization used to tune capacity in a scenario."
  data:
  - name: "name"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "efficiencyPercent"
    type: "Decimal"
  - name: "utilizationPercent"
    type: "Decimal"
  relations:
  - name: "scenario"
    type: "PlanningScenario"
    multiplicity: "ManyToOne"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
- name: "DowntimeEvent"
  description: "Planned or unplanned interruption that reduces available capacity."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "reason"
    type: "String"
  - name: "planned"
    type: "Boolean"
  relations:
  - name: "capacityBucket"
    type: "CapacityBucket"
    multiplicity: "ManyToOne"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "equipment"
    type: "Equipment"
    multiplicity: "ManyToOne"
- name: "OvertimeRequest"
  description: "Proposal to increase capacity hours within a bucket, subject to approval."
  data:
  - name: "requestedHours"
    type: "Decimal"
  - name: "approved"
    type: "Boolean"
  - name: "reason"
    type: "String"
  relations:
  - name: "capacityBucket"
    type: "CapacityBucket"
    multiplicity: "ManyToOne"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
- name: "ConstraintViolation"
  description: "Identified issue where capacity or related constraints prevent a feasible\
    \ plan."
  data:
  - name: "name"
    type: "String"
  - name: "constraintType"
    type: "ConstraintType"
  - name: "severity"
    type: "Integer"
  - name: "message"
    type: "String"
  relations:
  - name: "scenario"
    type: "PlanningScenario"
    multiplicity: "ManyToOne"
  - name: "workCenter"
    type: "WorkCenter"
    multiplicity: "ManyToOne"
  - name: "plannedOrder"
    type: "PlannedOrder"
    multiplicity: "ManyToOne"
- name: "CapacitySnapshot"
  description: "Point-in-time capture of capacity supply and load for analysis and\
    \ comparison."
  data:
  - name: "snapshotDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "capacityPlan"
    type: "CapacityPlan"
    multiplicity: "ManyToOne"
  - name: "buckets"
    type: "CapacityBucket"
    multiplicity: "OneToMany"
  - name: "loads"
    type: "CapacityLoad"
    multiplicity: "OneToMany"
enums:
- name: "WorkCenterType"
  description: "Classification of the capacity unit by the nature of its resources."
  data:
  - name: "Machine"
  - name: "Labor"
  - name: "Mixed"
- name: "CapacityUnit"
  description: "Unit used to express capacity and load quantities."
  data:
  - name: "Hours"
  - name: "Minutes"
  - name: "Shifts"
- name: "CalendarExceptionType"
  description: "Type of calendar override applied on a specific date."
  data:
  - name: "Holiday"
  - name: "Maintenance"
  - name: "Shutdown"
  - name: "Overtime"
- name: "PlanStatus"
  description: "Lifecycle state of a plan or schedule."
  data:
  - name: "Draft"
  - name: "Proposed"
  - name: "Approved"
  - name: "Archived"
- name: "PlanningLevel"
  description: "Level of detail and capacity assumption used in the plan."
  data:
  - name: "RoughCut"
  - name: "Infinite"
  - name: "DetailedFinite"
- name: "Priority"
  description: "Relative urgency used to influence scheduling and allocation."
  data:
  - name: "Low"
  - name: "Normal"
  - name: "High"
  - name: "Expedite"
- name: "PlannedOrderStatus"
  description: "Status of a planned order within the planning process."
  data:
  - name: "Planned"
  - name: "FirmPlanned"
  - name: "Released"
  - name: "Cancelled"
- name: "BucketGranularity"
  description: "Time resolution of capacity buckets."
  data:
  - name: "Shift"
  - name: "Day"
  - name: "Week"
  - name: "Month"
- name: "ResourceStatus"
  description: "Availability state of a capacity-providing resource."
  data:
  - name: "Available"
  - name: "Down"
  - name: "Constrained"
- name: "DemandType"
  description: "Source classification for demand that drives capacity."
  data:
  - name: "Forecast"
  - name: "CustomerOrder"
  - name: "SafetyStock"
  - name: "Replenishment"
- name: "ToolType"
  description: "Category of constrained tool required by operations."
  data:
  - name: "Fixture"
  - name: "Mold"
  - name: "Die"
  - name: "Gauge"
- name: "SkillLevel"
  description: "Proficiency tier associated with a labor pool or requirement."
  data:
  - name: "Novice"
  - name: "Competent"
  - name: "Expert"
  - name: "Master"
- name: "SchedulingStrategy"
  description: "Direction used to compute operation start and end dates."
  data:
  - name: "Forward"
  - name: "Backward"
- name: "AllocationStatus"
  description: "Commitment state of a capacity allocation or load."
  data:
  - name: "Tentative"
  - name: "Committed"
- name: "ConstraintType"
  description: "Kind of limitation detected by the planning process."
  data:
  - name: "Capacity"
  - name: "Material"
  - name: "Calendar"
  - name: "Skill"
  - name: "Tool"
- name: "UnitOfMeasure"
  description: "Measurement unit for product quantities."
  data:
  - name: "Each"
  - name: "Kg"
  - name: "Litre"
  - name: "Metre"
  - name: "Pack"
- name: "UtilizationBasis"
  description: "Basis used to compute utilization percentages for capacity."
  data:
  - name: "ScheduledHours"
  - name: "AvailableHours"
  - name: "CalendarHours"
valueObjects:
- name: "TimeWindow"
  description: "Inclusive time span used to define horizons for plans and schedules."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "LocalTime"
  description: "Time-of-day representation without a date or timezone."
  data:
  - name: "value"
    type: "String"
- name: "Quantity"
  description: "Numeric amount paired with an associated unit label."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "unit"
    type: "String"
- name: "Rate"
  description: "Throughput expression defining output per hour."
  data:
  - name: "unitsPerHour"
    type: "Decimal"
  - name: "unit"
    type: "String"
