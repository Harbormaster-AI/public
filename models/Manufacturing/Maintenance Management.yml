---
metadata:
  name: "HCIDL Capabilities Model - Maintenance Management"
  description: "Canonical capabilities model for maintenance management across manufacturing\
    \ operations, covering assets, planning, work execution, materials, safety, compliance,\
    \ and reliability."
  version: "1.0.0"
  industry: "Manufacturing"
  category: "Manufacturing"
  type: "Capability"
  domain: "Maintenance Management"
entities:
- name: "MaintenanceOrganization"
  description: "Enterprise or division responsible for maintenance policy, budget,\
    \ and governance."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "sites"
    type: "Site"
    multiplicity: "OneToMany"
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "ManyToMany"
  - name: "technicians"
    type: "Technician"
    multiplicity: "OneToMany"
- name: "Site"
  description: "Physical campus where maintenance activities and assets are located."
  data:
  - name: "name"
    type: "String"
  - name: "siteCode"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "organization"
    type: "MaintenanceOrganization"
    multiplicity: "ManyToOne"
  - name: "workshops"
    type: "MaintenanceWorkshop"
    multiplicity: "OneToMany"
  - name: "locations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "stockLocations"
    type: "StockLocation"
    multiplicity: "OneToMany"
  - name: "routes"
    type: "InspectionRoute"
    multiplicity: "OneToMany"
- name: "MaintenanceWorkshop"
  description: "Dedicated maintenance area or shop with specialized resources."
  data:
  - name: "name"
    type: "String"
  - name: "specialization"
    type: "String"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "crews"
    type: "Crew"
    multiplicity: "OneToMany"
  - name: "workOrders"
    type: "WorkOrder"
    multiplicity: "OneToMany"
- name: "Location"
  description: "Logical or physical place within a site where assets may reside or\
    \ work is performed."
  data:
  - name: "name"
    type: "String"
  - name: "locationCode"
    type: "String"
  - name: "locationType"
    type: "LocationType"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "parentLocation"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "childLocations"
    type: "Location"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "inspectionPoints"
    type: "InspectionPoint"
    multiplicity: "OneToMany"
- name: "AssetClass"
  description: "Standardized classification of assets to drive strategies, job plans,\
    \ and reporting."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "String"
  - name: "defaultMaintenanceType"
    type: "MaintenanceType"
  relations:
  - name: "jobPlans"
    type: "JobPlan"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
- name: "Asset"
  description: "Physical equipment or instrument requiring maintenance and monitoring."
  data:
  - name: "name"
    type: "String"
  - name: "assetTag"
    type: "String"
  - name: "status"
    type: "AssetStatus"
  - name: "criticality"
    type: "Criticality"
  - name: "installDate"
    type: "Date"
  - name: "expectedLifetimeMonths"
    type: "Integer"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "assetClass"
    type: "AssetClass"
    multiplicity: "ManyToOne"
  - name: "parentAsset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "childAssets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "meters"
    type: "AssetMeter"
    multiplicity: "OneToMany"
  - name: "maintenancePlans"
    type: "MaintenancePlan"
    multiplicity: "ManyToMany"
  - name: "workOrders"
    type: "WorkOrder"
    multiplicity: "OneToMany"
  - name: "downtimeEvents"
    type: "DowntimeEvent"
    multiplicity: "OneToMany"
  - name: "conditionPoints"
    type: "ConditionPoint"
    multiplicity: "OneToMany"
  - name: "calibrationSpecifications"
    type: "CalibrationSpecification"
    multiplicity: "OneToMany"
  - name: "serviceContracts"
    type: "ServiceContract"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "ManyToMany"
- name: "Supplier"
  description: "External provider of spare parts or maintenance services."
  data:
  - name: "name"
    type: "String"
  - name: "supplierType"
    type: "String"
  - name: "contact"
    type: "ContactInfo"
  relations:
  - name: "organizations"
    type: "MaintenanceOrganization"
    multiplicity: "ManyToMany"
  - name: "spareParts"
    type: "SparePart"
    multiplicity: "OneToMany"
  - name: "serviceContracts"
    type: "ServiceContract"
    multiplicity: "OneToMany"
- name: "SparePart"
  description: "Material item used for maintenance, repair, or operations."
  data:
  - name: "partNumber"
    type: "String"
  - name: "name"
    type: "String"
  - name: "sparePartType"
    type: "SparePartType"
  - name: "unitOfMeasure"
    type: "String"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
  - name: "compatibleAssets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "StockLocation"
  description: "Storeroom or warehouse location where spare parts are kept."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
- name: "InventoryItem"
  description: "On-hand stock record for a spare part at a specific stock location."
  data:
  - name: "quantityOnHand"
    type: "Integer"
  - name: "quantityReserved"
    type: "Integer"
  - name: "reorderPoint"
    type: "Integer"
  relations:
  - name: "sparePart"
    type: "SparePart"
    multiplicity: "ManyToOne"
  - name: "stockLocation"
    type: "StockLocation"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "InventoryTransaction"
    multiplicity: "OneToMany"
  - name: "reservations"
    type: "Reservation"
    multiplicity: "OneToMany"
- name: "InventoryTransaction"
  description: "Movement or adjustment record affecting inventory balance."
  data:
  - name: "transactionNumber"
    type: "String"
  - name: "transactionType"
    type: "InventoryTransactionType"
  - name: "quantity"
    type: "Integer"
  - name: "transactionDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "inventoryItem"
    type: "InventoryItem"
    multiplicity: "ManyToOne"
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "ManyToOne"
  - name: "reservation"
    type: "Reservation"
    multiplicity: "ManyToOne"
- name: "Reservation"
  description: "Allocation of inventory to a specific work order."
  data:
  - name: "reservedQuantity"
    type: "Integer"
  - name: "neededByDate"
    type: "Date"
  relations:
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "ManyToOne"
  - name: "inventoryItem"
    type: "InventoryItem"
    multiplicity: "ManyToOne"
- name: "JobPlan"
  description: "Reusable maintenance procedure template with steps, labor, and materials."
  data:
  - name: "name"
    type: "String"
  - name: "estimatedDuration"
    type: "Duration"
  - name: "maintenanceType"
    type: "MaintenanceType"
  - name: "requiredClearance"
    type: "Boolean"
  relations:
  - name: "steps"
    type: "JobStep"
    multiplicity: "OneToMany"
  - name: "jobMaterials"
    type: "JobMaterial"
    multiplicity: "OneToMany"
  - name: "jobLabors"
    type: "JobLabor"
    multiplicity: "OneToMany"
  - name: "assetClass"
    type: "AssetClass"
    multiplicity: "ManyToOne"
- name: "JobStep"
  description: "Sequenced instruction within a job plan."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "instruction"
    type: "String"
  - name: "safetyNote"
    type: "String"
  relations:
  - name: "jobPlan"
    type: "JobPlan"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "JobMaterial"
  description: "Material requirement defined by a job plan."
  data:
  - name: "quantity"
    type: "Decimal"
  - name: "notes"
    type: "String"
  relations:
  - name: "jobPlan"
    type: "JobPlan"
    multiplicity: "ManyToOne"
  - name: "sparePart"
    type: "SparePart"
    multiplicity: "ManyToOne"
- name: "JobLabor"
  description: "Labor requirement defined by a job plan."
  data:
  - name: "workers"
    type: "Integer"
  - name: "hours"
    type: "Decimal"
  relations:
  - name: "jobPlan"
    type: "JobPlan"
    multiplicity: "ManyToOne"
  - name: "craft"
    type: "Craft"
    multiplicity: "ManyToOne"
- name: "MaintenancePlan"
  description: "Strategy defining when and how preventive or predictive work is generated."
  data:
  - name: "name"
    type: "String"
  - name: "scheduleFrequency"
    type: "ScheduleFrequency"
  - name: "maintenanceType"
    type: "MaintenanceType"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "jobPlan"
    type: "JobPlan"
    multiplicity: "ManyToOne"
  - name: "generatedWorkOrders"
    type: "WorkOrder"
    multiplicity: "OneToMany"
- name: "WorkRequest"
  description: "Initial maintenance request raised by operations or stakeholders."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "status"
    type: "WorkRequestStatus"
  - name: "reportedDate"
    type: "Date"
  - name: "priority"
    type: "Priority"
  - name: "description"
    type: "String"
  - name: "requestedDueDate"
    type: "Date"
  - name: "requesterContact"
    type: "ContactInfo"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "linkedWorkOrder"
    type: "WorkOrder"
    multiplicity: "OneToOne"
- name: "WorkOrder"
  description: "Authorized instruction to perform maintenance tasks."
  data:
  - name: "workOrderNumber"
    type: "String"
  - name: "status"
    type: "WorkOrderStatus"
  - name: "class"
    type: "WorkOrderClass"
  - name: "priority"
    type: "Priority"
  - name: "plannedStart"
    type: "Date"
  - name: "plannedFinish"
    type: "Date"
  - name: "actualStart"
    type: "Date"
  - name: "actualFinish"
    type: "Date"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "originatingRequest"
    type: "WorkRequest"
    multiplicity: "OneToOne"
  - name: "tasks"
    type: "WorkOrderTask"
    multiplicity: "OneToMany"
  - name: "assignedCrew"
    type: "Crew"
    multiplicity: "ManyToOne"
  - name: "assignedTechnicians"
    type: "Technician"
    multiplicity: "ManyToMany"
  - name: "materials"
    type: "InventoryTransaction"
    multiplicity: "OneToMany"
  - name: "logs"
    type: "WorkLog"
    multiplicity: "OneToMany"
  - name: "costs"
    type: "CostRecord"
    multiplicity: "OneToMany"
  - name: "permits"
    type: "PermitToWork"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "failureReport"
    type: "FailureReport"
    multiplicity: "OneToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "ManyToMany"
- name: "WorkOrderTask"
  description: "Executable unit of work within a work order."
  data:
  - name: "description"
    type: "String"
  - name: "sequence"
    type: "Integer"
  - name: "status"
    type: "TaskStatus_"
  relations:
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "ManyToOne"
  - name: "technician"
    type: "Technician"
    multiplicity: "ManyToOne"
  - name: "jobStep"
    type: "JobStep"
    multiplicity: "ManyToOne"
- name: "Crew"
  description: "Team of technicians assigned to execute work."
  data:
  - name: "name"
    type: "String"
  - name: "crewCode"
    type: "String"
  relations:
  - name: "workshop"
    type: "MaintenanceWorkshop"
    multiplicity: "ManyToOne"
  - name: "technicians"
    type: "Technician"
    multiplicity: "ManyToMany"
  - name: "shifts"
    type: "Shift"
    multiplicity: "OneToMany"
  - name: "workOrders"
    type: "WorkOrder"
    multiplicity: "OneToMany"
- name: "Shift"
  description: "Time window defining crew or technician working hours."
  data:
  - name: "name"
    type: "String"
  - name: "shiftType"
    type: "ShiftType"
  - name: "startTime"
    type: "String"
  - name: "endTime"
    type: "String"
  relations:
  - name: "crew"
    type: "Crew"
    multiplicity: "ManyToOne"
- name: "Technician"
  description: "Skilled maintenance person who performs and records work."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "grade"
    type: "TechnicianGrade"
  - name: "contact"
    type: "ContactInfo"
  relations:
  - name: "crafts"
    type: "Craft"
    multiplicity: "ManyToMany"
  - name: "crews"
    type: "Crew"
    multiplicity: "ManyToMany"
  - name: "workLogs"
    type: "WorkLog"
    multiplicity: "OneToMany"
  - name: "assignedWorkOrders"
    type: "WorkOrder"
    multiplicity: "ManyToMany"
  - name: "certifications"
    type: "Certification"
    multiplicity: "OneToMany"
  - name: "meterReadings"
    type: "MeterReading"
    multiplicity: "OneToMany"
  - name: "inspectionResults"
    type: "InspectionResult"
    multiplicity: "OneToMany"
- name: "Craft"
  description: "Trade or skill classification applicable to labor planning."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "technicians"
    type: "Technician"
    multiplicity: "ManyToMany"
  - name: "jobLabors"
    type: "JobLabor"
    multiplicity: "OneToMany"
- name: "Certification"
  description: "Credential demonstrating a technician’s qualification or authorization."
  data:
  - name: "name"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  relations:
  - name: "technician"
    type: "Technician"
    multiplicity: "ManyToOne"
- name: "WorkLog"
  description: "Time and narrative entry documenting work performed."
  data:
  - name: "logDate"
    type: "Date"
  - name: "hours"
    type: "Decimal"
  - name: "comment"
    type: "String"
  relations:
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "ManyToOne"
  - name: "technician"
    type: "Technician"
    multiplicity: "ManyToOne"
  - name: "crew"
    type: "Crew"
    multiplicity: "ManyToOne"
- name: "CostRecord"
  description: "Financial entry capturing costs related to a work order or asset."
  data:
  - name: "costType"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "recordedDate"
    type: "Date"
  relations:
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
- name: "Document"
  description: "Controlled document or reference associated with maintenance information."
  data:
  - name: "documentNumber"
    type: "String"
  - name: "title"
    type: "String"
  - name: "documentType"
    type: "DocumentType"
  - name: "link"
    type: "DocumentLink"
  relations:
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "jobSteps"
    type: "JobStep"
    multiplicity: "ManyToMany"
  - name: "workOrders"
    type: "WorkOrder"
    multiplicity: "ManyToMany"
  - name: "spareParts"
    type: "SparePart"
    multiplicity: "ManyToMany"
- name: "AssetMeter"
  description: "Counter attached to an asset used for usage-based maintenance triggers."
  data:
  - name: "name"
    type: "String"
  - name: "meterType"
    type: "MeterType"
  - name: "unit"
    type: "String"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "readings"
    type: "MeterReading"
    multiplicity: "OneToMany"
- name: "MeterReading"
  description: "Recorded value for an asset meter at a point in time."
  data:
  - name: "readingValue"
    type: "Decimal"
  - name: "readingDate"
    type: "Date"
  relations:
  - name: "meter"
    type: "AssetMeter"
    multiplicity: "ManyToOne"
  - name: "recordedBy"
    type: "Technician"
    multiplicity: "ManyToOne"
- name: "ConditionPoint"
  description: "Measurable condition parameter tied to an asset for monitoring health."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "thresholdHigh"
    type: "Decimal"
  - name: "thresholdLow"
    type: "Decimal"
  - name: "severity"
    type: "ConditionSeverity"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "readings"
    type: "ConditionReading"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "ConditionAlert"
    multiplicity: "OneToMany"
- name: "ConditionReading"
  description: "Observation or measurement recorded for a condition point."
  data:
  - name: "value"
    type: "Decimal"
  - name: "observedAt"
    type: "Date"
  - name: "note"
    type: "String"
  relations:
  - name: "conditionPoint"
    type: "ConditionPoint"
    multiplicity: "ManyToOne"
  - name: "technician"
    type: "Technician"
    multiplicity: "ManyToOne"
- name: "ConditionAlert"
  description: "Threshold breach or anomaly detected for a condition point."
  data:
  - name: "alertCode"
    type: "String"
  - name: "severity"
    type: "ConditionSeverity"
  - name: "message"
    type: "String"
  - name: "status"
    type: "AlertStatus"
  relations:
  - name: "conditionPoint"
    type: "ConditionPoint"
    multiplicity: "ManyToOne"
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "ManyToOne"
- name: "InspectionRoute"
  description: "Sequenced tour of inspection points for routine checks."
  data:
  - name: "name"
    type: "String"
  - name: "frequency"
    type: "ScheduleFrequency"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "points"
    type: "InspectionPoint"
    multiplicity: "OneToMany"
  - name: "generatedWorkOrders"
    type: "WorkOrder"
    multiplicity: "OneToMany"
  - name: "technicians"
    type: "Technician"
    multiplicity: "ManyToMany"
- name: "InspectionPoint"
  description: "Specific checkpoint on a route associated with a location or asset."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "checkpointName"
    type: "String"
  - name: "instruction"
    type: "String"
  relations:
  - name: "route"
    type: "InspectionRoute"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "Location"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "results"
    type: "InspectionResult"
    multiplicity: "OneToMany"
- name: "InspectionResult"
  description: "Outcome of an inspection at a specific checkpoint."
  data:
  - name: "result"
    type: "InspectionOutcome"
  - name: "remarks"
    type: "String"
  - name: "observedAt"
    type: "Date"
  relations:
  - name: "inspectionPoint"
    type: "InspectionPoint"
    multiplicity: "ManyToOne"
  - name: "technician"
    type: "Technician"
    multiplicity: "ManyToOne"
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "ManyToOne"
- name: "DowntimeEvent"
  description: "Period when an asset is unavailable for intended use."
  data:
  - name: "startTime"
    type: "Date"
  - name: "endTime"
    type: "Date"
  - name: "type"
    type: "DowntimeType"
  - name: "description"
    type: "String"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "relatedWorkOrder"
    type: "WorkOrder"
    multiplicity: "ManyToOne"
- name: "FailureReport"
  description: "Structured record of a failure with problem, cause, and remedy coding."
  data:
  - name: "problemDescription"
    type: "String"
  - name: "failureDate"
    type: "Date"
  - name: "severity"
    type: "ConditionSeverity"
  relations:
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "OneToOne"
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "problemCode"
    type: "ProblemCode"
    multiplicity: "ManyToOne"
  - name: "causeCode"
    type: "CauseCode"
    multiplicity: "ManyToOne"
  - name: "remedyCode"
    type: "RemedyCode"
    multiplicity: "ManyToOne"
  - name: "downtimeEvent"
    type: "DowntimeEvent"
    multiplicity: "ManyToOne"
- name: "ProblemCode"
  description: "Taxonomy entry describing observable problem symptoms."
  data:
  - name: "code"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "failureReports"
    type: "FailureReport"
    multiplicity: "OneToMany"
- name: "CauseCode"
  description: "Taxonomy entry describing underlying failure causes."
  data:
  - name: "code"
    type: "String"
  - name: "description"
    type: "String"
  relations:
