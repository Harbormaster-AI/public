---
metadata:
  name: "Observability"
  description: "Capability model describing how telemetry is collected, processed,\
    \ analyzed, and acted upon to understand system behavior and reliability."
  version: 1.0
  industry: "Software"
  category: "Operations"
  type: "Capability"
  domain: "Observability"
entities:
- name: "Service"
  description: "Logical application or system component that is instrumented and observed."
  data:
  - name: "name"
    type: "String"
  - name: "serviceType"
    type: "ServiceType"
  - name: "ownerTeam"
    type: "String"
  - name: "runtime"
    type: "String"
  - name: "repositoryUrl"
    type: "String"
  relations:
  - name: "environments"
    type: "Environment"
    multiplicity: "OneToMany"
  - name: "telemetryPipelines"
    type: "TelemetryPipeline"
    multiplicity: "OneToMany"
  - name: "metricDefinitions"
    type: "MetricDefinition"
    multiplicity: "OneToMany"
  - name: "logStreams"
    type: "LogStream"
    multiplicity: "OneToMany"
  - name: "spanDefinitions"
    type: "SpanDefinition"
    multiplicity: "OneToMany"
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "OneToMany"
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "OneToMany"
  - name: "slos"
    type: "SLO"
    multiplicity: "OneToMany"
- name: "Environment"
  description: "Execution context in which a service runs, such as production or staging."
  data:
  - name: "name"
    type: "String"
  - name: "environmentType"
    type: "EnvironmentType"
  - name: "region"
    type: "String"
  - name: "deploymentVersion"
    type: "String"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "OneToMany"
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "OneToMany"
  - name: "metricDefinitions"
    type: "MetricDefinition"
    multiplicity: "OneToMany"
  - name: "logStreams"
    type: "LogStream"
    multiplicity: "OneToMany"
  - name: "spanDefinitions"
    type: "SpanDefinition"
    multiplicity: "OneToMany"
  - name: "samplingPolicies"
    type: "SamplingPolicy"
    multiplicity: "OneToMany"
- name: "TelemetryPipeline"
  description: "Configured flow through which telemetry is received, processed, and\
    \ exported."
  data:
  - name: "name"
    type: "String"
  - name: "pipelineType"
    type: "PipelineType"
  - name: "status"
    type: "PipelineStatus"
  - name: "samplingRate"
    type: "Decimal"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "collectors"
    type: "Collector"
    multiplicity: "OneToMany"
  - name: "sources"
    type: "TelemetrySource"
    multiplicity: "ManyToMany"
  - name: "sinks"
    type: "TelemetrySink"
    multiplicity: "ManyToMany"
  - name: "samplingPolicies"
    type: "SamplingPolicy"
    multiplicity: "ManyToMany"
- name: "Collector"
  description: "Agent or gateway responsible for receiving and forwarding telemetry."
  data:
  - name: "name"
    type: "String"
  - name: "collectorType"
    type: "CollectorType"
  - name: "version"
    type: "String"
  - name: "runtimePlatform"
    type: "String"
  relations:
  - name: "pipeline"
    type: "TelemetryPipeline"
    multiplicity: "ManyToOne"
  - name: "sources"
    type: "TelemetrySource"
    multiplicity: "ManyToMany"
- name: "TelemetrySource"
  description: "Instrumented producer of telemetry signals."
  data:
  - name: "name"
    type: "String"
  - name: "sourceKind"
    type: "SourceKind"
  - name: "namespace"
    type: "String"
  - name: "labelSet"
    type: "LabelSet"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "pipelines"
    type: "TelemetryPipeline"
    multiplicity: "ManyToMany"
- name: "TelemetrySink"
  description: "Destination system where telemetry is stored or analyzed."
  data:
  - name: "name"
    type: "String"
  - name: "sinkType"
    type: "SinkType"
  - name: "endpoint"
    type: "String"
  - name: "authentication"
    type: "AuthMethod"
  relations:
  - name: "pipelines"
    type: "TelemetryPipeline"
    multiplicity: "ManyToMany"
  - name: "retentionPolicies"
    type: "RetentionPolicy"
    multiplicity: "ManyToMany"
- name: "MetricDefinition"
  description: "Describes a metric, its type, and how it should be interpreted."
  data:
  - name: "name"
    type: "String"
  - name: "metricType"
    type: "MetricType"
  - name: "unit"
    type: "Unit"
  - name: "helpText"
    type: "String"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "series"
    type: "MetricSeries"
    multiplicity: "OneToMany"
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "ManyToMany"
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "ManyToMany"
  - name: "slis"
    type: "SLI"
    multiplicity: "ManyToMany"
  - name: "retentionPolicies"
    type: "RetentionPolicy"
    multiplicity: "ManyToMany"
- name: "MetricSeries"
  description: "Concrete time series associated with a metric definition and label\
    \ set."
  data:
  - name: "aggregation"
    type: "AggregationType"
  - name: "temporality"
    type: "Temporality"
  - name: "retention"
    type: "Duration"
  relations:
  - name: "metricDefinition"
    type: "MetricDefinition"
    multiplicity: "ManyToOne"
- name: "LogStream"
  description: "Logical grouping of logs that share schema, purpose, or lifecycle."
  data:
  - name: "name"
    type: "String"
  - name: "logFormat"
    type: "LogFormat"
  - name: "retentionDays"
    type: "Integer"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "ManyToMany"
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "ManyToMany"
  - name: "retentionPolicies"
    type: "RetentionPolicy"
    multiplicity: "ManyToMany"
- name: "SpanDefinition"
  description: "Canonical description of a trace span, its role, and key attributes."
  data:
  - name: "name"
    type: "String"
  - name: "spanKind"
    type: "SpanKind"
  - name: "helpText"
    type: "String"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "ManyToMany"
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "ManyToMany"
  - name: "slis"
    type: "SLI"
    multiplicity: "ManyToMany"
  - name: "retentionPolicies"
    type: "RetentionPolicy"
    multiplicity: "ManyToMany"
- name: "Dashboard"
  description: "Visual workspace presenting telemetry insights for a specific context."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "DashboardCategory"
  - name: "refreshInterval"
    type: "Duration"
  relations:
  - name: "panels"
    type: "DashboardPanel"
    multiplicity: "OneToMany"
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
- name: "DashboardPanel"
  description: "Individual visualization or widget on a dashboard."
  data:
  - name: "title"
    type: "String"
  - name: "visualizationType"
    type: "VisualizationType"
  - name: "query"
    type: "Query"
  relations:
  - name: "dashboard"
    type: "Dashboard"
    multiplicity: "ManyToOne"
  - name: "metricDefinitions"
    type: "MetricDefinition"
    multiplicity: "ManyToMany"
  - name: "logStreams"
    type: "LogStream"
    multiplicity: "ManyToMany"
  - name: "spanDefinitions"
    type: "SpanDefinition"
    multiplicity: "ManyToMany"
  - name: "slos"
    type: "SLO"
    multiplicity: "ManyToMany"
- name: "AlertRule"
  description: "Automated condition that evaluates telemetry and generates alert events."
  data:
  - name: "name"
    type: "String"
  - name: "severity"
    type: "AlertSeverity"
  - name: "conditionType"
    type: "ConditionType"
  - name: "operator_"
    type: "Comparator"
  - name: "threshold"
    type: "Threshold"
  - name: "evaluationWindow"
    type: "Duration"
  - name: "evaluationFrequency"
    type: "Duration"
  - name: "muteStatus"
    type: "MuteStatus"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "metricDefinitions"
    type: "MetricDefinition"
    multiplicity: "ManyToMany"
  - name: "logStreams"
    type: "LogStream"
    multiplicity: "ManyToMany"
  - name: "spanDefinitions"
    type: "SpanDefinition"
    multiplicity: "ManyToMany"
  - name: "notificationChannels"
    type: "NotificationChannel"
    multiplicity: "ManyToMany"
  - name: "maintenanceWindows"
    type: "MaintenanceWindow"
    multiplicity: "ManyToMany"
  - name: "runbooks"
    type: "Runbook"
    multiplicity: "ManyToMany"
  - name: "sloTargets"
    type: "SLO"
    multiplicity: "ManyToMany"
- name: "AlertEvent"
  description: "Outcome of an alert rule evaluation that tracks lifecycle and status."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "AlertStatus"
  - name: "startedAt"
    type: "Date"
  - name: "endedAt"
    type: "Date"
  - name: "currentSeverity"
    type: "AlertSeverity"
  relations:
  - name: "alertRule"
    type: "AlertRule"
    multiplicity: "ManyToOne"
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
- name: "NotificationChannel"
  description: "Destination used to notify stakeholders about alert events."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "destination"
    type: "String"
  relations:
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "ManyToMany"
- name: "Runbook"
  description: "Operational guide describing steps to triage and resolve issues."
  data:
  - name: "title"
    type: "String"
  - name: "url"
    type: "String"
  - name: "ownerTeam"
    type: "String"
  relations:
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "ManyToMany"
  - name: "dashboardPanels"
    type: "DashboardPanel"
    multiplicity: "ManyToMany"
- name: "SLO"
  description: "Target reliability level defined for a service over a time window."
  data:
  - name: "name"
    type: "String"
  - name: "objectivePercent"
    type: "Decimal"
  - name: "timeWindow"
    type: "Duration"
  - name: "budgetingMethod"
    type: "BudgetingMethod"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "slis"
    type: "SLI"
    multiplicity: "OneToMany"
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "ManyToMany"
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "ManyToMany"
- name: "SLI"
  description: "Measurable indicator used to assess an SLO, derived from telemetry."
  data:
  - name: "name"
    type: "String"
  - name: "indicatorType"
    type: "SLIType"
  - name: "query"
    type: "Query"
  - name: "successThreshold"
    type: "Threshold"
  relations:
  - name: "slo"
    type: "SLO"
    multiplicity: "ManyToOne"
  - name: "metricDefinitions"
    type: "MetricDefinition"
    multiplicity: "ManyToMany"
  - name: "logStreams"
    type: "LogStream"
    multiplicity: "ManyToMany"
  - name: "spanDefinitions"
    type: "SpanDefinition"
    multiplicity: "ManyToMany"
- name: "MaintenanceWindow"
  description: "Scheduled period during which alerts are suppressed."
  data:
  - name: "name"
    type: "String"
  - name: "schedule"
    type: "TimeRange"
  - name: "scope"
    type: "MaintenanceScope"
  - name: "reason"
    type: "String"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "ManyToMany"
- name: "RetentionPolicy"
  description: "Policy controlling how long telemetry data is retained and at what\
    \ tier."
  data:
  - name: "name"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  - name: "storageTier"
    type: "StorageTier"
  relations:
  - name: "metricDefinitions"
    type: "MetricDefinition"
    multiplicity: "ManyToMany"
  - name: "logStreams"
    type: "LogStream"
    multiplicity: "ManyToMany"
  - name: "spanDefinitions"
    type: "SpanDefinition"
    multiplicity: "ManyToMany"
  - name: "sinks"
    type: "TelemetrySink"
    multiplicity: "ManyToMany"
- name: "SamplingPolicy"
  description: "Rules that determine which traces are kept or discarded."
  data:
  - name: "name"
    type: "String"
  - name: "strategy"
    type: "SamplingStrategy"
  - name: "rate"
    type: "Decimal"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "telemetryPipelines"
    type: "TelemetryPipeline"
    multiplicity: "ManyToMany"
enums:
- name: "ServiceType"
  description: "Classification of service role within a system."
  data:
  - name: "API"
  - name: "WebApp"
  - name: "Worker"
  - name: "BatchJob"
  - name: "DataPipeline"
- name: "EnvironmentType"
  description: "Distinct runtime contexts for services."
  data:
  - name: "Production"
  - name: "Staging"
  - name: "Testing"
  - name: "Development"
  - name: "Sandbox"
- name: "PipelineStatus"
  description: "Lifecycle state of a telemetry pipeline."
  data:
  - name: "Active"
  - name: "Paused"
  - name: "Failed"
  - name: "Degraded"
- name: "PipelineType"
  description: "Primary telemetry signal category handled by a pipeline."
  data:
  - name: "Metrics"
  - name: "Logs"
  - name: "Traces"
  - name: "Unified"
- name: "CollectorType"
  description: "Deployment pattern for telemetry collectors."
  data:
  - name: "Agent"
  - name: "Gateway"
  - name: "Sidecar"
  - name: "DaemonSet"
- name: "SourceKind"
  description: "Origin classification of telemetry producers."
  data:
  - name: "Application"
  - name: "Host"
  - name: "Kubernetes"
  - name: "Function"
  - name: "Database"
  - name: "LoadBalancer"
- name: "SinkType"
  description: "Destination technology used to store or analyze telemetry."
  data:
  - name: "TimeseriesDB"
  - name: "LogStore"
  - name: "TraceBackend"
  - name: "APM"
  - name: "DataLake"
- name: "AuthMethod"
  description: "Authentication mechanism used when exporting telemetry."
  data:
  - name: "None"
  - name: "Basic"
  - name: "APIKey"
  - name: "OAuth2"
  - name: "SigV4"
- name: "MetricType"
  description: "Metric semantic type according to instrumentation model."
  data:
  - name: "Counter"
  - name: "Gauge"
  - name: "Histogram"
  - name: "Summary"
- name: "Unit"
  description: "Units used to express metric magnitude or threshold values."
  data:
  - name: "Seconds"
  - name: "Milliseconds"
  - name: "Bytes"
  - name: "Percent"
  - name: "Count"
  - name: "RequestsPerSecond"
  - name: "ErrorsPerSecond"
  - name: "Megabytes"
  - name: "Gigabytes"
- name: "AggregationType"
  description: "Method used to combine or transform metric samples."
  data:
  - name: "Sum"
  - name: "Average"
  - name: "Min"
  - name: "Max"
  - name: "Count"
  - name: "Rate"
  - name: "Percentile"
- name: "Temporality"
  description: "Metric accumulation model for counters and histograms."
  data:
  - name: "Cumulative"
  - name: "Delta"
- name: "LogFormat"
  description: "Structure applied to log entries within a stream."
  data:
  - name: "Text"
  - name: "JSON"
  - name: "Structured"
- name: "SpanKind"
  description: "Role a span plays in a distributed trace."
  data:
  - name: "Server"
  - name: "Client"
  - name: "Producer"
  - name: "Consumer"
  - name: "Internal"
- name: "DashboardCategory"
  description: "Primary purpose of a dashboard."
  data:
  - name: "Operational"
  - name: "Reliability"
  - name: "Business"
  - name: "Security"
- name: "VisualizationType"
  description: "Visual representation used by a panel."
  data:
  - name: "TimeSeries"
  - name: "Table"
  - name: "SingleValue"
  - name: "Heatmap"
  - name: "Histogram"
  - name: "TopN"
- name: "QueryLanguage"
  description: "Language used to query telemetry backends."
  data:
  - name: "PromQL"
  - name: "SQL"
  - name: "LogQL"
  - name: "Lucene"
  - name: "Kusto"
- name: "AlertSeverity"
  description: "Impact level associated with an alert rule or event."
  data:
  - name: "Critical"
  - name: "High"
  - name: "Medium"
  - name: "Low"
  - name: "Info"
- name: "ConditionType"
  description: "Strategy used to evaluate alerting conditions."
  data:
  - name: "Threshold"
  - name: "RateOfChange"
  - name: "Anomaly"
  - name: "Absent"
- name: "Comparator"
  description: "Operator applied when comparing signals to thresholds."
  data:
  - name: "GreaterThan"
  - name: "LessThan"
  - name: "GreaterThanOrEqual"
  - name: "LessThanOrEqual"
  - name: "Equal"
  - name: "NotEqual"
- name: "MuteStatus"
  description: "Whether an alert rule is currently suppressed from notifying."
  data:
  - name: "Muted"
  - name: "Unmuted"
- name: "AlertStatus"
  description: "Current lifecycle state of an alert event."
  data:
  - name: "Firing"
  - name: "Acknowledged"
  - name: "Resolved"
  - name: "Silenced"
- name: "ChannelType"
  description: "Communication medium used for alert notifications."
  data:
  - name: "Email"
  - name: "Slack"
  - name: "PagerDuty"
  - name: "Webhook"
  - name: "Teams"
  - name: "SMS"
- name: "SLIType"
  description: "Category of service behavior measured by an indicator."
  data:
  - name: "Availability"
  - name: "Latency"
  - name: "ErrorRate"
  - name: "Throughput"
  - name: "Saturation"
- name: "BudgetingMethod"
  description: "Approach used to compute remaining error budget for an SLO."
  data:
  - name: "Occurrences"
  - name: "TimeSlices"
  - name: "Requests"
- name: "MaintenanceScope"
  description: "Coverage of alert suppression during maintenance."
  data:
  - name: "AllAlerts"
  - name: "ServiceOnly"
  - name: "EnvironmentOnly"
  - name: "SelectedRules"
- name: "StorageTier"
  description: "Cost and performance tier where telemetry is retained."
  data:
  - name: "Hot"
  - name: "Warm"
  - name: "Cold"
  - name: "Archive"
- name: "SamplingStrategy"
  description: "Method used to decide whether to keep or drop a trace."
  data:
  - name: "AlwaysOn"
  - name: "AlwaysOff"
  - name: "TraceIdRatio"
  - name: "ParentBased"
valueObjects:
- name: "Duration"
  description: "Length of time expressed in whole seconds."
  data:
  - name: "seconds"
    type: "Integer"
- name: "Threshold"
  description: "Numeric boundary used when evaluating alerting or SLI conditions."
  data:
  - name: "value"
    type: "Decimal"
  - name: "unit"
    type: "Unit"
- name: "Query"
  description: "Query definition used to retrieve or compute telemetry."
  data:
  - name: "language"
    type: "QueryLanguage"
  - name: "expression"
    type: "String"
- name: "TimeRange"
  description: "Inclusive interval defining a start and end date."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "LabelSet"
  description: "Encoded key-value pairs that tag telemetry with context."
  data:
  - name: "text"
    type: "String"
