---
metadata:
  name: "Metrics Capabilities Model"
  description: "Canonical capability model for managing the lifecycle of metrics across\
    \ collection, ingestion, storage, querying, and visualization."
  version: "1.0.0"
  industry: "Technology"
  category: "Operations"
  type: "Capability"
  domain: "Metrics"
entities:
- name: "MetricsWorkspace"
  description: "Logical workspace that scopes metrics collection, storage, rules,\
    \ and visualization for a team or product area."
  data:
  - name: "name"
    type: "String"
  - name: "ownerTeam"
    type: "String"
  - name: "region"
    type: "String"
  - name: "purpose"
    type: "String"
  relations:
  - name: "metricNamespaces"
    type: "MetricNamespace"
    multiplicity: "OneToMany"
  - name: "collectors"
    type: "MetricsCollector"
    multiplicity: "OneToMany"
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "OneToMany"
  - name: "ruleGroups"
    type: "RuleGroup"
    multiplicity: "OneToMany"
  - name: "dataStores"
    type: "MetricsStore"
    multiplicity: "OneToMany"
  - name: "scrapeConfigs"
    type: "ScrapeConfig"
    multiplicity: "OneToMany"
- name: "MetricNamespace"
  description: "Organizational boundary for related metrics that share label policies\
    \ and retention preferences."
  data:
  - name: "name"
    type: "String"
  - name: "prefix"
    type: "String"
  - name: "lifecycleStage"
    type: "LifecycleStage"
  - name: "retentionTier"
    type: "RetentionTier"
  relations:
  - name: "workspace"
    type: "MetricsWorkspace"
    multiplicity: "ManyToOne"
  - name: "metricDefinitions"
    type: "MetricDefinition"
    multiplicity: "OneToMany"
  - name: "labelConstraints"
    type: "NamespaceLabelConstraint"
    multiplicity: "OneToMany"
- name: "MetricDefinition"
  description: "Canonical definition of a metric including name, type, unit, labels,\
    \ and stability."
  data:
  - name: "metricName"
    type: "String"
  - name: "metricType"
    type: "MetricType"
  - name: "unit"
    type: "UnitSymbol"
  - name: "temporality"
    type: "MetricTemporality"
  - name: "help"
    type: "String"
  - name: "isMonotonic"
    type: "Boolean"
  - name: "stability"
    type: "MetricStability"
  relations:
  - name: "namespace"
    type: "MetricNamespace"
    multiplicity: "ManyToOne"
  - name: "instruments"
    type: "MetricInstrument"
    multiplicity: "OneToMany"
  - name: "timeSeries"
    type: "TimeSeries"
    multiplicity: "OneToMany"
  - name: "aggregations"
    type: "AggregationPolicy"
    multiplicity: "OneToMany"
  - name: "recordingRules"
    type: "RecordingRule"
    multiplicity: "ManyToMany"
  - name: "exemplarPolicy"
    type: "ExemplarPolicy"
    multiplicity: "OneToOne"
- name: "MetricInstrument"
  description: "Instrument configuration that records a metric from a source using\
    \ a specific protocol and cadence."
  data:
  - name: "instrumentType"
    type: "InstrumentType"
  - name: "protocol"
    type: "MetricsProtocol"
  - name: "dataSource"
    type: "DataSourceType"
  - name: "scrapeInterval"
    type: "Duration"
  - name: "exemplarEnabled"
    type: "Boolean"
  relations:
  - name: "metricDefinition"
    type: "MetricDefinition"
    multiplicity: "ManyToOne"
  - name: "targets"
    type: "ScrapeTarget"
    multiplicity: "ManyToMany"
  - name: "exporters"
    type: "MetricsExporter"
    multiplicity: "ManyToMany"
  - name: "pipelines"
    type: "IngestionPipeline"
    multiplicity: "ManyToMany"
- name: "ScrapeTarget"
  description: "Endpoint exposing metrics for collection, often grouped into jobs\
    \ with shared configuration."
  data:
  - name: "jobName"
    type: "String"
  - name: "targetAddress"
    type: "URL"
  - name: "scheme"
    type: "String"
  - name: "scrapePath"
    type: "String"
  - name: "tlsEnabled"
    type: "Boolean"
  - name: "scrapeInterval"
    type: "Duration"
  - name: "authType"
    type: "ScrapeAuthType"
  relations:
  - name: "instruments"
    type: "MetricInstrument"
    multiplicity: "ManyToMany"
  - name: "scrapeConfig"
    type: "ScrapeConfig"
    multiplicity: "ManyToOne"
- name: "LabelKey"
  description: "Declarative label key with constraints that may be attached to metric\
    \ definitions to manage cardinality."
  data:
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  - name: "cardinalityLimit"
    type: "Integer"
  - name: "valuePattern"
    type: "Regex"
  relations:
  - name: "metricDefinitions"
    type: "MetricDefinition"
    multiplicity: "ManyToMany"
- name: "NamespaceLabelConstraint"
  description: "Label policy scoped to a namespace that governs allowed values and\
    \ required presence."
  data:
  - name: "isRequired"
    type: "Boolean"
  - name: "allowedPattern"
    type: "Regex"
  relations:
  - name: "namespace"
    type: "MetricNamespace"
    multiplicity: "ManyToOne"
  - name: "labelKey"
    type: "LabelKey"
    multiplicity: "ManyToOne"
- name: "TimeSeries"
  description: "Unique stream of metric samples identified by metric definition and\
    \ a specific label set."
  data:
  - name: "seriesKey"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "active"
    type: "Boolean"
  - name: "sampleCount"
    type: "Integer"
  relations:
  - name: "metricDefinition"
    type: "MetricDefinition"
    multiplicity: "ManyToOne"
  - name: "samples"
    type: "MetricSample"
    multiplicity: "OneToMany"
  - name: "histogramSamples"
    type: "HistogramSample"
    multiplicity: "OneToMany"
- name: "MetricSample"
  description: "Single numeric measurement at a point in time, optionally annotated\
    \ with an exemplar reference."
  data:
  - name: "timestamp"
    type: "DateTime"
  - name: "value"
    type: "Decimal"
  - name: "exemplarTraceId"
    type: "String"
  - name: "source"
    type: "String"
  relations:
  - name: "timeSeries"
    type: "TimeSeries"
    multiplicity: "ManyToOne"
- name: "HistogramSample"
  description: "Aggregated histogram observation at a point in time containing bucket\
    \ counts and summary statistics."
  data:
  - name: "timestamp"
    type: "DateTime"
  - name: "count"
    type: "Integer"
  - name: "sum"
    type: "Decimal"
  relations:
  - name: "timeSeries"
    type: "TimeSeries"
    multiplicity: "ManyToOne"
  - name: "buckets"
    type: "HistogramBucket"
    multiplicity: "OneToMany"
- name: "HistogramBucket"
  description: "Bucket boundary and count comprising a portion of a histogram sample."
  data:
  - name: "upperBound"
    type: "Decimal"
  - name: "count"
    type: "Integer"
  relations:
  - name: "histogramSample"
    type: "HistogramSample"
    multiplicity: "ManyToOne"
- name: "AggregationPolicy"
  description: "Rule describing how to aggregate raw series into rollups using a function\
    \ and window."
  data:
  - name: "name"
    type: "String"
  - name: "function"
    type: "AggregationFunction"
  - name: "window"
    type: "Duration"
  - name: "groupBy"
    type: "String"
  - name: "emitAsNewSeries"
    type: "Boolean"
  relations:
  - name: "metricDefinition"
    type: "MetricDefinition"
    multiplicity: "ManyToOne"
  - name: "recordingRules"
    type: "RecordingRule"
    multiplicity: "ManyToMany"
- name: "RecordingRule"
  description: "Scheduled computation that evaluates a query and writes the result\
    \ as a new metric series."
  data:
  - name: "name"
    type: "String"
  - name: "query"
    type: "QueryExpression"
  - name: "outputMetricName"
    type: "String"
  - name: "evaluationInterval"
    type: "Duration"
  - name: "labelsToSet"
    type: "String"
  relations:
  - name: "ruleGroup"
    type: "RuleGroup"
    multiplicity: "ManyToOne"
  - name: "metricDefinitions"
    type: "MetricDefinition"
    multiplicity: "ManyToMany"
  - name: "workspace"
    type: "MetricsWorkspace"
    multiplicity: "ManyToOne"
- name: "RuleGroup"
  description: "Collection of rules that execute together with shared scheduling and\
    \ concurrency controls."
  data:
  - name: "name"
    type: "String"
  - name: "concurrency"
    type: "Integer"
  relations:
  - name: "workspace"
    type: "MetricsWorkspace"
    multiplicity: "ManyToOne"
  - name: "recordingRules"
    type: "RecordingRule"
    multiplicity: "OneToMany"
- name: "MetricQuery"
  description: "Saved query used for analysis, alert engineering, or dashboard visualization."
  data:
  - name: "name"
    type: "String"
  - name: "query"
    type: "QueryExpression"
  - name: "purpose"
    type: "String"
  - name: "maxDataPoints"
    type: "Integer"
  relations:
  - name: "workspace"
    type: "MetricsWorkspace"
    multiplicity: "ManyToOne"
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "ManyToMany"
  - name: "queryEngine"
    type: "QueryEngine"
    multiplicity: "ManyToOne"
- name: "Dashboard"
  description: "Visualization surface organizing panels to communicate metric insights."
  data:
  - name: "title"
    type: "String"
  - name: "layoutStyle"
    type: "String"
  - name: "isPublic"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "MetricsWorkspace"
    multiplicity: "ManyToOne"
  - name: "panels"
    type: "Panel"
    multiplicity: "OneToMany"
- name: "Panel"
  description: "Configurable visualization that renders one or more metric queries."
  data:
  - name: "title"
    type: "String"
  - name: "visualizationType"
    type: "VisualizationType"
  - name: "unit"
    type: "UnitSymbol"
  - name: "yAxisScale"
    type: "ScaleType"
  - name: "referenceLines"
    type: "String"
  relations:
  - name: "dashboard"
    type: "Dashboard"
    multiplicity: "ManyToOne"
  - name: "queries"
    type: "MetricQuery"
    multiplicity: "ManyToMany"
- name: "MetricsCollector"
  description: "Agent responsible for discovering targets and scraping or receiving\
    \ metrics from sources."
  data:
  - name: "name"
    type: "String"
  - name: "agentType"
    type: "CollectorType"
  - name: "version"
    type: "String"
  - name: "scrapeConcurrency"
    type: "Integer"
  relations:
  - name: "workspace"
    type: "MetricsWorkspace"
    multiplicity: "ManyToOne"
  - name: "targets"
    type: "ScrapeTarget"
    multiplicity: "OneToMany"
  - name: "pipelines"
    type: "IngestionPipeline"
    multiplicity: "OneToMany"
- name: "IngestionPipeline"
  description: "Configured path that batches, transforms, and routes metrics from\
    \ collectors to exporters."
  data:
  - name: "name"
    type: "String"
  - name: "batchingEnabled"
    type: "Boolean"
  - name: "batchMaxBytes"
    type: "Integer"
  - name: "retryBackoff"
    type: "Duration"
  - name: "dropHighCardinality"
    type: "Boolean"
  relations:
  - name: "collector"
    type: "MetricsCollector"
    multiplicity: "ManyToOne"
  - name: "processors"
    type: "MetricProcessor"
    multiplicity: "OneToMany"
  - name: "exporters"
    type: "MetricsExporter"
    multiplicity: "OneToMany"
- name: "MetricProcessor"
  description: "Processing step that mutates or filters metrics within an ingestion\
    \ pipeline."
  data:
  - name: "name"
    type: "String"
  - name: "processorType"
    type: "ProcessorType"
  - name: "configText"
    type: "String"
  relations:
  - name: "pipeline"
    type: "IngestionPipeline"
    multiplicity: "ManyToOne"
- name: "MetricsExporter"
  description: "Component responsible for transmitting metrics to a storage backend\
    \ or remote endpoint."
  data:
  - name: "name"
    type: "String"
  - name: "protocol"
    type: "MetricsProtocol"
  - name: "endpoint"
    type: "URL"
  - name: "timeout"
    type: "Duration"
  relations:
  - name: "pipelines"
    type: "IngestionPipeline"
    multiplicity: "ManyToMany"
  - name: "dataStore"
    type: "MetricsStore"
    multiplicity: "ManyToOne"
  - name: "remoteEndpoints"
    type: "RemoteWriteEndpoint"
    multiplicity: "OneToMany"
- name: "RemoteWriteEndpoint"
  description: "Remote storage or federation endpoint that accepts metrics in a specific\
    \ protocol."
  data:
  - name: "name"
    type: "String"
  - name: "endpoint"
    type: "URL"
  - name: "authType"
    type: "EndpointAuthType"
  - name: "compression"
    type: "CompressionType"
  relations:
  - name: "exporter"
    type: "MetricsExporter"
    multiplicity: "ManyToOne"
  - name: "dataStore"
    type: "MetricsStore"
    multiplicity: "ManyToOne"
- name: "MetricsStore"
  description: "Metrics-optimized datastore providing write, retention, compaction,\
    \ and query services."
  data:
  - name: "name"
    type: "String"
  - name: "storageType"
    type: "StorageType"
  - name: "retention"
    type: "RetentionPeriod"
  - name: "shardCount"
    type: "Integer"
  - name: "replicationFactor"
    type: "Integer"
  - name: "compactionWindow"
    type: "Duration"
  relations:
  - name: "workspace"
    type: "MetricsWorkspace"
    multiplicity: "ManyToOne"
  - name: "retentionPolicies"
    type: "RetentionPolicy"
    multiplicity: "OneToMany"
  - name: "queryEngines"
    type: "QueryEngine"
    multiplicity: "OneToMany"
  - name: "exporters"
    type: "MetricsExporter"
    multiplicity: "ManyToMany"
- name: "RetentionPolicy"
  description: "Policy assigning retention and downsampling for selected series within\
    \ a store."
  data:
  - name: "name"
    type: "String"
  - name: "matchSelector"
    type: "String"
  - name: "retention"
    type: "RetentionPeriod"
  - name: "downsampleAfter"
    type: "Duration"
  - name: "downsampleFunction"
    type: "AggregationFunction"
  relations:
  - name: "dataStore"
    type: "MetricsStore"
    multiplicity: "ManyToOne"
- name: "QueryEngine"
  description: "Execution engine that evaluates metric queries against one or more\
    \ data stores."
  data:
  - name: "name"
    type: "String"
  - name: "engineType"
    type: "QueryEngineType"
  - name: "maxQueryDuration"
    type: "Duration"
  - name: "concurrency"
    type: "Integer"
  relations:
  - name: "dataStore"
    type: "MetricsStore"
    multiplicity: "ManyToOne"
  - name: "queries"
    type: "MetricQuery"
    multiplicity: "OneToMany"
- name: "ExemplarPolicy"
  description: "Policy controlling exemplar sampling behavior for a metric."
  data:
  - name: "enabled"
    type: "Boolean"
  - name: "samplingFraction"
    type: "Percentage"
  relations:
  - name: "metricDefinition"
    type: "MetricDefinition"
    multiplicity: "ManyToOne"
- name: "ScrapeConfig"
  description: "Job-level configuration controlling scrape cadence, limits, and label\
    \ handling."
  data:
  - name: "name"
    type: "String"
  - name: "scrapeInterval"
    type: "Duration"
  - name: "sampleLimit"
    type: "Integer"
  - name: "honorLabels"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "MetricsWorkspace"
    multiplicity: "ManyToOne"
  - name: "targets"
    type: "ScrapeTarget"
    multiplicity: "OneToMany"
  - name: "relabelings"
    type: "RelabelingRule"
    multiplicity: "OneToMany"
- name: "RelabelingRule"
  description: "Transformation applied to target or sample labels during discovery\
    \ or ingestion."
  data:
  - name: "action"
    type: "RelabelAction"
  - name: "sourceLabels"
    type: "String"
  - name: "targetLabel"
    type: "String"
  - name: "regex"
    type: "Regex"
  - name: "replacement"
    type: "String"
  relations:
  - name: "scrapeConfig"
    type: "ScrapeConfig"
    multiplicity: "ManyToOne"
enums:
- name: "MetricType"
  description: "Classification of metric semantics and aggregation behavior."
  data:
  - name: "Counter"
  - name: "Gauge"
  - name: "Histogram"
  - name: "Summary"
  - name: "Info"
  - name: "StateSet"
- name: "InstrumentType"
  description: "Instrument kind used to record metric observations."
  data:
  - name: "Counter"
  - name: "UpDownCounter"
  - name: "ObservableGauge"
  - name: "Histogram"
- name: "AggregationFunction"
  description: "Function applied to compute aggregate values from raw series."
  data:
  - name: "Sum"
  - name: "Average"
  - name: "Min"
  - name: "Max"
  - name: "Rate"
  - name: "Increase"
  - name: "Count"
  - name: "Quantile"
  - name: "StdDev"
  - name: "StdVar"
  - name: "Last"
  - name: "TopK"
- name: "MetricsProtocol"
  description: "Protocol used to ingest, scrape, or export metrics."
  data:
  - name: "Prometheus"
  - name: "OTLP"
  - name: "StatsD"
  - name: "Graphite"
  - name: "InfluxLine"
- name: "DataSourceType"
  description: "Method by which metrics are obtained from a source."
  data:
  - name: "Pull"
  - name: "Push"
- name: "ScrapeAuthType"
  description: "Authentication mechanism used when scraping a target."
  data:
  - name: "None"
  - name: "Basic"
  - name: "BearerToken"
  - name: "OAuth2"
  - name: "MTLS"
  - name: "APIKey"
- name: "ProcessorType"
  description: "Category of transformation applied in an ingestion pipeline."
  data:
  - name: "Filter"
  - name: "Relabel"
  - name: "Drop"
  - name: "Keep"
  - name: "Rename"
  - name: "UnitConvert"
  - name: "Deduplicate"
  - name: "LimitCardinality"
  - name: "RateLimit"
- name: "VisualizationType"
  description: "Rendering style for a dashboard panel."
  data:
  - name: "Line"
  - name: "Area"
  - name: "Bar"
  - name: "Heatmap"
  - name: "Table"
  - name: "SingleValue"
  - name: "Histogram"
- name: "ScaleType"
  description: "Axis scaling used to map values to pixels."
  data:
  - name: "Linear"
  - name: "Logarithmic"
- name: "CollectorType"
  description: "Deployment topology or role of a metrics collector."
  data:
  - name: "DaemonSet"
  - name: "Sidecar"
  - name: "Process"
  - name: "Gateway"
  - name: "Service"
- name: "StorageType"
  description: "Storage architecture for metrics persistence."
  data:
  - name: "TSDB"
  - name: "DistributedTSDB"
  - name: "CloudService"
  - name: "InMemory"
- name: "EndpointAuthType"
  description: "Authentication scheme used for remote write endpoints."
  data:
  - name: "None"
  - name: "Basic"
  - name: "BearerToken"
  - name: "MTLS"
- name: "CompressionType"
  description: "Compression codec applied to metrics payloads."
  data:
  - name: "None"
  - name: "Gzip"
  - name: "Snappy"
  - name: "Zstd"
- name: "QueryEngineType"
  description: "Query language and execution engine used to evaluate metrics."
  data:
  - name: "PromQL"
  - name: "OTLP"
  - name: "Flux"
  - name: "Graphite"
- name: "RelabelAction"
  description: "Action performed when transforming labels."
  data:
  - name: "Keep"
  - name: "Drop"
  - name: "Replace"
  - name: "LabelMap"
  - name: "LabelDrop"
  - name: "LabelKeep"
  - name: "HashMod"
- name: "RetentionTier"
  description: "Storage temperature tier indicating performance and cost profile."
  data:
  - name: "Hot"
  - name: "Warm"
  - name: "Cold"
- name: "MetricTemporality"
  description: "Aggregation window semantics for accumulating metric values."
  data:
  - name: "Cumulative"
  - name: "Delta"
- name: "MetricStability"
  description: "Lifecycle maturity of a metric definition."
  data:
  - name: "Alpha"
  - name: "Beta"
  - name: "Stable"
- name: "LifecycleStage"
  description: "Environment or release stage associated with a namespace."
  data:
  - name: "Development"
  - name: "Testing"
  - name: "Staging"
  - name: "Production"
valueObjects:
- name: "Duration"
  description: "Length of time represented as total seconds."
  data:
  - name: "seconds"
    type: "Integer"
- name: "URL"
  description: "Locator for a network-accessible resource."
  data:
  - name: "value"
    type: "String"
- name: "RetentionPeriod"
  description: "Retention expressed as an integer number of days."
  data:
  - name: "days"
    type: "Integer"
- name: "Percentage"
  description: "Numeric percentage between 0 and 100."
  data:
  - name: "value"
    type: "Decimal"
- name: "UnitSymbol"
  description: "Measurement unit metadata used to interpret numeric values."
  data:
  - name: "symbol"
    type: "String"
  - name: "name"
    type: "String"
- name: "QueryExpression"
  description: "Text of a query in the engine’s native language."
  data:
  - name: "expression"
    type: "String"
- name: "Regex"
  description: "Regular expression pattern used for matching or filtering."
  data:
  - name: "pattern"
    type: "String"
