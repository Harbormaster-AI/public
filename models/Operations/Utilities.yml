---
entities:
- name: "UtilityCompany"
  description: "Legal entity responsible for providing utility services and operating\
    \ assets within defined territories."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "serviceTerritories"
    type: "ServiceTerritory"
    multiplicity: "OneToMany"
  - name: "customers"
    type: "CustomerAccount"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "generationFacilities"
    type: "GenerationFacility"
    multiplicity: "OneToMany"
  - name: "tariffs"
    type: "Tariff"
    multiplicity: "OneToMany"
  - name: "crews"
    type: "Crew"
    multiplicity: "OneToMany"
  - name: "marketRegistrations"
    type: "MarketRegistration"
    multiplicity: "OneToMany"
  - name: "billingCycles"
    type: "BillingCycle"
    multiplicity: "OneToMany"
- name: "ServiceTerritory"
  description: "Geographic area where a utility company is authorized to provide services."
  data:
  - name: "name"
    type: "String"
  - name: "regionCode"
    type: "String"
  - name: "country"
    type: "String"
  - name: "timezone"
    type: "String"
  relations:
  - name: "utilityCompany"
    type: "UtilityCompany"
    multiplicity: "ManyToOne"
  - name: "substations"
    type: "Substation"
    multiplicity: "OneToMany"
  - name: "feeders"
    type: "Feeder"
    multiplicity: "OneToMany"
  - name: "servicePoints"
    type: "ServicePoint"
    multiplicity: "OneToMany"
  - name: "billingCycles"
    type: "BillingCycle"
    multiplicity: "OneToMany"
- name: "Substation"
  description: "Electrical facility stepping voltage levels and routing power to distribution\
    \ feeders."
  data:
  - name: "name"
    type: "String"
  - name: "substationCode"
    type: "String"
  - name: "voltageLevel"
    type: "VoltageLevel"
  - name: "location"
    type: "GeoLocation"
  relations:
  - name: "serviceTerritory"
    type: "ServiceTerritory"
    multiplicity: "ManyToOne"
  - name: "feeders"
    type: "Feeder"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
- name: "Feeder"
  description: "Distribution circuit delivering electricity from a substation to service\
    \ points."
  data:
  - name: "feederId"
    type: "String"
  - name: "name"
    type: "String"
  - name: "voltageLevel"
    type: "VoltageLevel"
  - name: "phaseType"
    type: "PhaseType"
  relations:
  - name: "substation"
    type: "Substation"
    multiplicity: "ManyToOne"
  - name: "serviceTerritory"
    type: "ServiceTerritory"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "servicePoints"
    type: "ServicePoint"
    multiplicity: "OneToMany"
- name: "Asset"
  description: "Physical infrastructure used to deliver utility services, including\
    \ lines, switches, and transformers."
  data:
  - name: "assetId"
    type: "String"
  - name: "assetType"
    type: "AssetType"
  - name: "status"
    type: "AssetStatus"
  - name: "installDate"
    type: "Date"
  - name: "inServiceDate"
    type: "Date"
  - name: "location"
    type: "GeoLocation"
  - name: "manufacturer"
    type: "String"
  - name: "model"
    type: "String"
  - name: "serialNumber"
    type: "String"
  - name: "voltageLevel"
    type: "VoltageLevel"
  - name: "phaseType"
    type: "PhaseType"
  relations:
  - name: "serviceTerritory"
    type: "ServiceTerritory"
    multiplicity: "ManyToOne"
  - name: "parentAsset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "childAssets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "workOrders"
    type: "WorkOrder"
    multiplicity: "ManyToMany"
  - name: "feeders"
    type: "Feeder"
    multiplicity: "ManyToMany"
- name: "CustomerAccount"
  description: "Party responsible for billing, payments, and contractual service relationships\
    \ with the utility."
  data:
  - name: "accountNumber"
    type: "String"
  - name: "customerType"
    type: "CustomerType"
  - name: "status"
    type: "AccountStatus"
  - name: "name"
    type: "String"
  - name: "billingAddress"
    type: "Address"
  - name: "contact"
    type: "ContactInfo"
  relations:
  - name: "utilityCompany"
    type: "UtilityCompany"
    multiplicity: "ManyToOne"
  - name: "serviceAgreements"
    type: "ServiceAgreement"
    multiplicity: "OneToMany"
  - name: "bills"
    type: "Bill"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "programEnrollments"
    type: "ProgramEnrollment"
    multiplicity: "OneToMany"
  - name: "outageReports"
    type: "Outage"
    multiplicity: "OneToMany"
- name: "ServicePoint"
  description: "Physical delivery location where a commodity is provided and metered."
  data:
  - name: "servicePointId"
    type: "String"
  - name: "commodityType"
    type: "CommodityType"
  - name: "connectionType"
    type: "ConnectionType"
  - name: "phaseType"
    type: "PhaseType"
  - name: "voltageLevel"
    type: "VoltageLevel"
  - name: "address"
    type: "Address"
  - name: "geoLocation"
    type: "GeoLocation"
  - name: "status"
    type: "ServiceStatus"
  relations:
  - name: "serviceTerritory"
    type: "ServiceTerritory"
    multiplicity: "ManyToOne"
  - name: "feeder"
    type: "Feeder"
    multiplicity: "ManyToOne"
  - name: "serviceAgreements"
    type: "ServiceAgreement"
    multiplicity: "OneToMany"
  - name: "meters"
    type: "Meter"
    multiplicity: "OneToMany"
  - name: "outages"
    type: "Outage"
    multiplicity: "ManyToMany"
  - name: "distributedEnergyResources"
    type: "DistributedEnergyResource"
    multiplicity: "OneToMany"
- name: "Meter"
  description: "Device that measures commodity usage and communicates readings."
  data:
  - name: "serialNumber"
    type: "String"
  - name: "meterType"
    type: "MeterType"
  - name: "status"
    type: "MeterStatus"
  - name: "firmwareVersion"
    type: "String"
  - name: "multiplier"
    type: "Decimal"
  - name: "communicationProtocol"
    type: "CommunicationProtocol"
  relations:
  - name: "servicePoint"
    type: "ServicePoint"
    multiplicity: "ManyToOne"
  - name: "usageReadings"
    type: "UsageReading"
    multiplicity: "OneToMany"
  - name: "meterEvents"
    type: "MeterEvent"
    multiplicity: "OneToMany"
- name: "UsageReading"
  description: "Time-stamped measurement of usage or demand captured by a meter."
  data:
  - name: "readingTimestamp"
    type: "DateTime"
  - name: "readingType"
    type: "ReadingType"
  - name: "value"
    type: "Decimal"
  - name: "quality"
    type: "ReadingQuality"
  - name: "intervalMinutes"
    type: "Integer"
  relations:
  - name: "meter"
    type: "Meter"
    multiplicity: "ManyToOne"
  - name: "servicePoint"
    type: "ServicePoint"
    multiplicity: "ManyToOne"
- name: "MeterEvent"
  description: "Diagnostic or operational event reported by a meter or communications\
    \ module."
  data:
  - name: "eventCode"
    type: "String"
  - name: "severity"
    type: "EventSeverity"
  - name: "occurredAt"
    type: "DateTime"
  - name: "description"
    type: "String"
  relations:
  - name: "meter"
    type: "Meter"
    multiplicity: "ManyToOne"
- name: "Tariff"
  description: "Published schedule of prices, terms, and conditions for service."
  data:
  - name: "name"
    type: "String"
  - name: "commodityType"
    type: "CommodityType"
  - name: "description"
    type: "String"
  - name: "effectivePeriod"
    type: "DateRange"
  relations:
  - name: "utilityCompany"
    type: "UtilityCompany"
    multiplicity: "ManyToOne"
  - name: "components"
    type: "TariffComponent"
    multiplicity: "OneToMany"
- name: "TariffComponent"
  description: "Charge element within a tariff, such as energy, demand, or fixed charges."
  data:
  - name: "name"
    type: "String"
  - name: "rateType"
    type: "RateType"
  - name: "unitOfMeasure"
    type: "String"
  - name: "pricePerUnit"
    type: "Money"
  - name: "fixedCharge"
    type: "Money"
  - name: "tiered"
    type: "Boolean"
  - name: "minQuantity"
    type: "Decimal"
  - name: "maxQuantity"
    type: "Decimal"
  relations:
  - name: "tariff"
    type: "Tariff"
    multiplicity: "ManyToOne"
  - name: "timeOfUsePeriods"
    type: "TimeOfUsePeriod"
    multiplicity: "ManyToMany"
  - name: "seasons"
    type: "Season"
    multiplicity: "ManyToMany"
- name: "TimeOfUsePeriod"
  description: "Window of time during a day when specific tariff components apply."
  data:
  - name: "name"
    type: "String"
  - name: "startTime"
    type: "String"
  - name: "endTime"
    type: "String"
  relations:
  - name: "components"
    type: "TariffComponent"
    multiplicity: "ManyToMany"
- name: "Season"
  description: "Seasonal applicability window for rate components."
  data:
  - name: "name"
    type: "String"
  - name: "startMonth"
    type: "Integer"
  - name: "endMonth"
    type: "Integer"
  relations:
  - name: "components"
    type: "TariffComponent"
    multiplicity: "ManyToMany"
- name: "ServiceAgreement"
  description: "Contract binding a customer to receive service at a specific service\
    \ point under a tariff."
  data:
  - name: "agreementNumber"
    type: "String"
  - name: "status"
    type: "ServiceAgreementStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "depositRequired"
    type: "Money"
  relations:
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "servicePoint"
    type: "ServicePoint"
    multiplicity: "ManyToOne"
  - name: "tariff"
    type: "Tariff"
    multiplicity: "ManyToOne"
  - name: "bills"
    type: "Bill"
    multiplicity: "OneToMany"
- name: "Bill"
  description: "Statement of charges for services rendered during a billing period."
  data:
  - name: "billNumber"
    type: "String"
  - name: "billingPeriodStart"
    type: "Date"
  - name: "billingPeriodEnd"
    type: "Date"
  - name: "issueDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "InvoiceStatus"
  - name: "totalAmount"
    type: "Money"
  relations:
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "serviceAgreement"
    type: "ServiceAgreement"
    multiplicity: "ManyToOne"
  - name: "invoiceLines"
    type: "InvoiceLine"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "billingCycle"
    type: "BillingCycle"
    multiplicity: "ManyToOne"
- name: "InvoiceLine"
  description: "Itemized charge or credit appearing on a bill."
  data:
  - name: "description"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "unitOfMeasure"
    type: "String"
  - name: "unitPrice"
    type: "Money"
  - name: "amount"
    type: "Money"
  relations:
  - name: "bill"
    type: "Bill"
    multiplicity: "ManyToOne"
  - name: "tariffComponent"
    type: "TariffComponent"
    multiplicity: "ManyToOne"
- name: "Payment"
  description: "Monetary settlement applied against one or more bills."
  data:
  - name: "paymentNumber"
    type: "String"
  - name: "paymentDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "method"
    type: "PaymentMethod"
  - name: "status"
    type: "PaymentStatus"
  - name: "reference"
    type: "String"
  relations:
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "bill"
    type: "Bill"
    multiplicity: "ManyToOne"
- name: "BillingCycle"
  description: "Recurring schedule defining when accounts in a territory are billed."
  data:
  - name: "name"
    type: "String"
  - name: "cycleDay"
    type: "Integer"
  - name: "periodLengthDays"
    type: "Integer"
  - name: "commodityType"
    type: "CommodityType"
  relations:
  - name: "utilityCompany"
    type: "UtilityCompany"
    multiplicity: "ManyToOne"
  - name: "serviceTerritory"
    type: "ServiceTerritory"
    multiplicity: "ManyToOne"
  - name: "bills"
    type: "Bill"
    multiplicity: "OneToMany"
- name: "Outage"
  description: "Interruption of service affecting one or more service points."
  data:
  - name: "outageId"
    type: "String"
  - name: "status"
    type: "OutageStatus"
  - name: "cause"
    type: "OutageCause"
  - name: "startedAt"
    type: "DateTime"
  - name: "estimatedRestoration"
    type: "DateTime"
  - name: "restoredAt"
    type: "DateTime"
  - name: "description"
    type: "String"
  relations:
  - name: "serviceTerritory"
    type: "ServiceTerritory"
    multiplicity: "ManyToOne"
  - name: "servicePoints"
    type: "ServicePoint"
    multiplicity: "ManyToMany"
  - name: "reportedBy"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "workOrders"
    type: "WorkOrder"
    multiplicity: "OneToMany"
- name: "WorkOrder"
  description: "Executable job for field or plant crews to perform specific work."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "type"
    type: "WorkOrderType"
  - name: "status"
    type: "WorkOrderStatus"
  - name: "priority"
    type: "PriorityLevel"
  - name: "scheduledStart"
    type: "DateTime"
  - name: "scheduledEnd"
    type: "DateTime"
  - name: "actualStart"
    type: "DateTime"
  - name: "actualEnd"
    type: "DateTime"
  relations:
  - name: "outage"
    type: "Outage"
    multiplicity: "ManyToOne"
  - name: "crew"
    type: "Crew"
    multiplicity: "ManyToOne"
  - name: "servicePoint"
    type: "ServicePoint"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "WorkOrderTask"
    multiplicity: "OneToMany"
- name: "WorkOrderTask"
  description: "Unit of work within a work order, such as inspect, replace, or test."
  data:
  - name: "description"
    type: "String"
  - name: "status"
    type: "WorkOrderStatus"
  - name: "durationHours"
    type: "Decimal"
  - name: "materialNotes"
    type: "String"
  relations:
  - name: "workOrder"
    type: "WorkOrder"
    multiplicity: "ManyToOne"
- name: "Crew"
  description: "Team of technicians assigned to execute work orders."
  data:
  - name: "crewId"
    type: "String"
  - name: "name"
    type: "String"
  - name: "status"
    type: "CrewStatus"
  - name: "depot"
    type: "Address"
  - name: "capability"
    type: "String"
  relations:
  - name: "utilityCompany"
    type: "UtilityCompany"
    multiplicity: "ManyToOne"
  - name: "workOrders"
    type: "WorkOrder"
    multiplicity: "OneToMany"
- name: "GenerationFacility"
  description: "Plant or site producing electrical energy for the grid."
  data:
  - name: "name"
    type: "String"
  - name: "facilityCode"
    type: "String"
  - name: "generationType"
    type: "GenerationType"
  - name: "location"
    type: "GeoLocation"
  - name: "nameplateCapacityMW"
    type: "Decimal"
  - name: "operator_"
    type: "String"
  relations:
  - name: "utilityCompany"
    type: "UtilityCompany"
    multiplicity: "ManyToOne"
  - name: "units"
    type: "GenerationUnit"
    multiplicity: "OneToMany"
- name: "GenerationUnit"
  description: "Individual generating unit with specific capacity and fuel."
  data:
  - name: "unitCode"
    type: "String"
  - name: "fuelType"
    type: "FuelType"
  - name: "capacityMW"
    type: "Decimal"
  - name: "status"
    type: "UnitStatus"
  - name: "commercialOperationDate"
    type: "Date"
  relations:
  - name: "facility"
    type: "GenerationFacility"
    multiplicity: "ManyToOne"
- name: "MarketOperator"
  description: "Organization operating wholesale electricity markets and balancing\
    \ authority areas."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "marketType"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "marketRegistrations"
    type: "MarketRegistration"
    multiplicity: "OneToMany"
- name: "MarketRegistration"
  description: "Registration of a utility or facility to participate in a market with\
    \ a defined role."
  data:
  - name: "registrationId"
    type: "String"
  - name: "role"
    type: "MarketRole"
  - name: "status"
    type: "RegistrationStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "marketOperator"
    type: "MarketOperator"
    multiplicity: "ManyToOne"
  - name: "utilityCompany"
    type: "UtilityCompany"
    multiplicity: "ManyToOne"
- name: "Program"
  description: "Customer-facing initiative such as demand response, energy efficiency,\
    \ or green power."
  data:
  - name: "name"
    type: "String"
  - name: "programType"
    type: "ProgramType"
  - name: "description"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "utilityCompany"
    type: "UtilityCompany"
    multiplicity: "ManyToOne"
  - name: "enrollments"
    type: "ProgramEnrollment"
    multiplicity: "OneToMany"
- name: "ProgramEnrollment"
  description: "Enrollment record linking a customer to a specific program."
  data:
  - name: "enrollmentId"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "String"
  relations:
  - name: "program"
    type: "Program"
    multiplicity: "ManyToOne"
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "serviceAgreement"
    type: "ServiceAgreement"
    multiplicity: "ManyToOne"
- name: "DistributedEnergyResource"
  description: "Customer-sited generation or storage interconnected at a service point."
  data:
  - name: "resourceId"
    type: "String"
  - name: "derType"
    type: "DERType"
  - name: "capacityKW"
    type: "Decimal"
  - name: "installationDate"
    type: "Date"
  - name: "interconnectionApproved"
    type: "Boolean"
  relations:
  - name: "servicePoint"
    type: "ServicePoint"
    multiplicity: "ManyToOne"
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
metadata:
  name: "Utilities Industry Domain Model"
  description: "HCIDL model capturing core utility operations across customer, metering,\
    \ billing, outage management, asset management, and market participation."
  version: "1.0.0"
  industry: "Utilities"
  category: "Operations"
  language: "English"
  type: "Industry"
  domain: "Utilities"
enums:
- name: "CustomerType"
  description: "Classification of the customer based on usage characteristics and\
    \ service needs."
  data:
  - name: "Residential"
  - name: "Commercial"
  - name: "Industrial"
  - name: "Government"
  - name: "Agricultural"
- name: "AccountStatus"
  description: "Lifecycle state of a customer account."
  data:
  - name: "Active"
  - name: "Pending"
  - name: "Closed"
  - name: "Suspended"
- name: "CommodityType"
  description: "Type of commodity delivered by the utility."
  data:
  - name: "Electricity"
  - name: "NaturalGas"
  - name: "Water"
  - name: "DistrictHeat"
- name: "ConnectionType"
  description: "Physical connection method for delivering the commodity to the service\
    \ point."
  data:
  - name: "Overhead"
  - name: "Underground"
  - name: "ServicePipe"
  - name: "ServiceLateral"
- name: "PhaseType"
  description: "Electrical phase configuration at the service point or asset."
  data:
  - name: "SinglePhase"
  - name: "TwoPhase"
  - name: "ThreePhase"
- name: "VoltageLevel"
  description: "Nominal voltage classification used for planning and operations."
  data:
  - name: "LowVoltage"
  - name: "MediumVoltage"
  - name: "HighVoltage"
  - name: "ExtraHighVoltage"
- name: "MeterType"
  description: "Functional category of meter based on measurement and communication\
    \ capabilities."
  data:
  - name: "SmartMeter"
  - name: "IntervalMeter"
  - name: "Mechanical"
  - name: "GasMeter"
  - name: "WaterMeter"
- name: "MeterStatus"
  description: "Operational state of a meter device."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Decommissioned"
  - name: "Maintenance"
- name: "CommunicationProtocol"
  description: "Communication protocol or network technology used by field devices."
  data:
  - name: "DLMS_COSEM"
  - name: "Modbus"
  - name: "DNP3"
  - name: "Zigbee"
  - name: "LTE"
  - name: "NB_IoT"
  - name: "LoRaWAN"
- name: "ReadingType"
  description: "Category of measurement captured from metrology."
  data:
  - name: "Energy"
  - name: "Demand"
  - name: "ReactiveEnergy"
  - name: "Volume"
  - name: "FlowRate"
- name: "ReadingQuality"
  description: "Data validation and estimation status associated with a reading."
  data:
  - name: "Validated"
  - name: "Estimated"
  - name: "Missing"
  - name: "Suspect"
  - name: "Substituted"
- name: "RateType"
  description: "Method used to calculate charges within a tariff component."
  data:
  - name: "Fixed"
  - name: "Tiered"
  - name: "TimeOfUse"
  - name: "DemandCharge"
  - name: "FuelAdjustment"
- name: "ServiceAgreementStatus"
  description: "Contractual status indicating eligibility and activation for service."
  data:
  - name: "Active"
  - name: "PendingActivation"
  - name: "Suspended"
  - name: "Terminated"
- name: "InvoiceStatus"
  description: "Billing document state within the invoicing lifecycle."
  data:
  - name: "Draft"
  - name: "Issued"
  - name: "Due"
  - name: "Paid"
  - name: "Overdue"
  - name: "Cancelled"
- name: "PaymentMethod"
  description: "Channel or instrument used to make a payment."
