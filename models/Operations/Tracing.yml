---
metadata:
  name: "Tracing Capabilities Model"
  description: "Canonical capabilities model for distributed tracing, covering services,\
    \ traces, spans, events, links, resources, instrumentation, sampling, and export\
    \ workflows."
  version: "1.0.0"
  industry: "Software"
  category: "Operations"
  type: "Capability"
  domain: "Tracing"
entities:
- name: "Service"
  description: "Logical application or microservice that emits tracing telemetry."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "environment"
    type: "Environment"
  - name: "namespace"
    type: "String"
  relations:
  - name: "endpoints"
    type: "Endpoint"
    multiplicity: "OneToMany"
  - name: "resources"
    type: "Resource"
    multiplicity: "OneToMany"
  - name: "instrumentationLibraries"
    type: "InstrumentationLibrary"
    multiplicity: "OneToMany"
  - name: "spans"
    type: "Span"
    multiplicity: "OneToMany"
  - name: "samplers"
    type: "Sampler"
    multiplicity: "ManyToMany"
  - name: "exporters"
    type: "Exporter"
    multiplicity: "ManyToMany"
- name: "Endpoint"
  description: "Addressable operation exposed by a service, such as an API route or\
    \ RPC method."
  data:
  - name: "name"
    type: "String"
  - name: "protocol"
    type: "Protocol"
  - name: "route"
    type: "String"
  - name: "operation"
    type: "String"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "spans"
    type: "Span"
    multiplicity: "OneToMany"
  - name: "samplers"
    type: "Sampler"
    multiplicity: "ManyToMany"
- name: "Resource"
  description: "Describes the entity producing telemetry, including host, process,\
    \ container, and cloud metadata."
  data:
  - name: "hostName"
    type: "String"
  - name: "processExecutable"
    type: "String"
  - name: "processPid"
    type: "Integer"
  - name: "containerId"
    type: "String"
  - name: "cloudProvider"
    type: "String"
  - name: "cloudRegion"
    type: "String"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "spans"
    type: "Span"
    multiplicity: "OneToMany"
  - name: "attributes"
    type: "ResourceAttribute"
    multiplicity: "OneToMany"
- name: "InstrumentationLibrary"
  description: "Library or SDK that instruments code to create spans and traces."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "schemaUrl"
    type: "Url"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "spans"
    type: "Span"
    multiplicity: "OneToMany"
- name: "Trace"
  description: "End-to-end transaction composed of a set of causally related spans."
  data:
  - name: "traceKey"
    type: "TraceKey"
  - name: "samplingDecision"
    type: "SamplingDecision"
  - name: "startTime"
    type: "DateTime_"
  - name: "endTime"
    type: "DateTime_"
  - name: "duration"
    type: "DurationMillis"
  relations:
  - name: "spans"
    type: "Span"
    multiplicity: "OneToMany"
  - name: "rootSpan"
    type: "Span"
    multiplicity: "OneToOne"
- name: "Span"
  description: "Timed operation within a trace that captures work performed by a service\
    \ or component."
  data:
  - name: "spanKey"
    type: "SpanKey"
  - name: "name"
    type: "String"
  - name: "kind"
    type: "SpanKind"
  - name: "startTime"
    type: "DateTime_"
  - name: "endTime"
    type: "DateTime_"
  - name: "duration"
    type: "DurationMillis"
  - name: "statusCode"
    type: "SpanStatus"
  - name: "statusMessage"
    type: "String"
  relations:
  - name: "trace"
    type: "Trace"
    multiplicity: "ManyToOne"
  - name: "parentSpan"
    type: "Span"
    multiplicity: "ManyToOne"
  - name: "childSpans"
    type: "Span"
    multiplicity: "OneToMany"
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "endpoint"
    type: "Endpoint"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
  - name: "instrumentationLibrary"
    type: "InstrumentationLibrary"
    multiplicity: "ManyToOne"
  - name: "attributes"
    type: "SpanAttribute"
    multiplicity: "OneToMany"
  - name: "events"
    type: "SpanEvent"
    multiplicity: "OneToMany"
  - name: "links"
    type: "SpanLink"
    multiplicity: "OneToMany"
- name: "SpanEvent"
  description: "Timestamped annotation attached to a span that captures a notable\
    \ instant."
  data:
  - name: "name"
    type: "String"
  - name: "time"
    type: "DateTime_"
  - name: "description"
    type: "String"
  relations:
  - name: "span"
    type: "Span"
    multiplicity: "ManyToOne"
  - name: "attributes"
    type: "EventAttribute"
    multiplicity: "OneToMany"
- name: "SpanLink"
  description: "Causal reference from one span to another span in the same or a different\
    \ trace."
  data:
  - name: "traceKey"
    type: "TraceKey"
  - name: "spanKey"
    type: "SpanKey"
  - name: "traceState"
    type: "TraceStateHeader"
  relations:
  - name: "span"
    type: "Span"
    multiplicity: "ManyToOne"
- name: "SpanAttribute"
  description: "Key-value attribute providing additional context to a span."
  data:
  - name: "key"
    type: "String"
  - name: "valueType"
    type: "AttributeValueType"
  - name: "stringValue"
    type: "String"
  - name: "longValue"
    type: "Integer"
  - name: "doubleValue"
    type: "Decimal"
  - name: "booleanValue"
    type: "Boolean"
  relations:
  - name: "span"
    type: "Span"
    multiplicity: "ManyToOne"
- name: "EventAttribute"
  description: "Key-value attribute attached to a span event."
  data:
  - name: "key"
    type: "String"
  - name: "valueType"
    type: "AttributeValueType"
  - name: "stringValue"
    type: "String"
  - name: "longValue"
    type: "Integer"
  - name: "doubleValue"
    type: "Decimal"
  - name: "booleanValue"
    type: "Boolean"
  relations:
  - name: "spanEvent"
    type: "SpanEvent"
    multiplicity: "ManyToOne"
- name: "ResourceAttribute"
  description: "Key-value attribute describing a telemetry-producing resource."
  data:
  - name: "key"
    type: "String"
  - name: "valueType"
    type: "AttributeValueType"
  - name: "stringValue"
    type: "String"
  - name: "longValue"
    type: "Integer"
  - name: "doubleValue"
    type: "Decimal"
  - name: "booleanValue"
    type: "Boolean"
  relations:
  - name: "resource"
    type: "Resource"
    multiplicity: "ManyToOne"
- name: "Sampler"
  description: "Policy component that decides which traces or spans to record and\
    \ export."
  data:
  - name: "name"
    type: "String"
  - name: "strategy"
    type: "SamplingStrategy"
  - name: "targetRate"
    type: "Decimal"
  - name: "description"
    type: "String"
  relations:
  - name: "services"
    type: "Service"
    multiplicity: "ManyToMany"
  - name: "endpoints"
    type: "Endpoint"
    multiplicity: "ManyToMany"
- name: "Exporter"
  description: "Component that sends traces to an external backend or collector."
  data:
  - name: "name"
    type: "String"
  - name: "type"
    type: "ExporterType"
  - name: "endpoint"
    type: "Url"
  - name: "authType"
    type: "AuthType"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "services"
    type: "Service"
    multiplicity: "ManyToMany"
  - name: "jobs"
    type: "TraceExportJob"
    multiplicity: "OneToMany"
- name: "TraceExportJob"
  description: "Execution record for exporting one or more traces to a destination."
  data:
  - name: "exportFormat"
    type: "ExportFormat"
  - name: "status"
    type: "ExportStatus"
  - name: "startedAt"
    type: "DateTime_"
  - name: "finishedAt"
    type: "DateTime__"
  - name: "batchSize"
    type: "Integer"
  - name: "destination"
    type: "Url"
  - name: "errorMessage"
    type: "String"
  relations:
  - name: "exporter"
    type: "Exporter"
    multiplicity: "ManyToOne"
  - name: "traces"
    type: "Trace"
    multiplicity: "OneToMany"
enums:
- name: "SpanKind"
  description: "Role of a span in a trace topology."
  data:
  - name: "Internal"
  - name: "Server"
  - name: "Client"
  - name: "Producer"
  - name: "Consumer"
- name: "SpanStatus"
  description: "Final outcome of a span."
  data:
  - name: "Unset"
  - name: "Ok"
  - name: "Error"
- name: "Environment"
  description: "Deployment classification for a service."
  data:
  - name: "Development"
  - name: "Testing"
  - name: "Staging"
  - name: "Production"
- name: "SamplingStrategy"
  description: "Algorithm used to determine whether telemetry is recorded and exported."
  data:
  - name: "AlwaysOn"
  - name: "AlwaysOff"
  - name: "TraceIdRatio"
  - name: "RateLimiting"
  - name: "ParentBased"
- name: "SamplingDecision"
  description: "Result of applying a sampler to a trace or span."
  data:
  - name: "RecordAndSample"
  - name: "Drop"
  - name: "RecordOnly"
- name: "Protocol"
  description: "Communication protocol associated with an endpoint or span."
  data:
  - name: "HTTP"
  - name: "gRPC"
  - name: "RPC"
  - name: "Messaging"
  - name: "Database"
  - name: "GraphQL"
  - name: "Custom"
- name: "ExportFormat"
  description: "Wire format used when sending trace data."
  data:
  - name: "OTLP"
  - name: "JaegerThrift"
  - name: "Zipkin"
  - name: "OpenTelemetryProto"
- name: "ExportStatus"
  description: "Lifecycle status of a trace export job."
  data:
  - name: "Pending"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Cancelled"
- name: "ExporterType"
  description: "Type of destination integration for exporting traces."
  data:
  - name: "OTLP"
  - name: "Jaeger"
  - name: "Zipkin"
  - name: "Console"
  - name: "Custom"
- name: "AttributeValueType"
  description: "Primitive type of an attribute value."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Double"
  - name: "Boolean"
- name: "AuthType"
  description: "Authentication scheme used by an exporter."
  data:
  - name: "None"
  - name: "Basic"
  - name: "ApiKey"
  - name: "OAuth2"
valueObjects:
- name: "TraceKey"
  description: "Opaque identifier used to correlate spans within a trace."
  data:
  - name: "value"
    type: "String"
- name: "SpanKey"
  description: "Opaque identifier that uniquely distinguishes a span within its trace."
  data:
  - name: "value"
    type: "String"
- name: "Url"
  description: "Absolute URL representing a network endpoint or destination."
  data:
  - name: "value"
    type: "String"
- name: "DurationMillis"
  description: "Duration measured in milliseconds."
  data:
  - name: "value"
    type: "Integer"
- name: "DateTime_"
  description: "Point in time represented in ISO 8601 format with timezone."
  data:
  - name: "value"
    type: "String"
- name: "TraceStateHeader"
  description: "Vendor-specific tracing state propagated across process boundaries."
  data:
  - name: "value"
    type: "String"
