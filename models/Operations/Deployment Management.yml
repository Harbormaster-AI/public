---
metadata:
  name: "HCIDL Deployment Management Capabilities Model"
  description: "Canonical capability model describing entities, relationships, and\
    \ data required to manage software deployments across environments."
  version: "1.0.0"
  industry: "Software"
  category: "Operations"
  type: "Capability"
  domain: "Deployment Management"
entities:
- name: "ApplicationService"
  description: "Deployable software service or application component managed through\
    \ release and deployment processes."
  data:
  - name: "name"
    type: "String"
  - name: "serviceType"
    type: "ServiceType"
  - name: "repository"
    type: "RepositoryRef"
  relations:
  - name: "pipelines"
    type: "DeploymentPipeline"
    multiplicity: "OneToMany"
  - name: "releases"
    type: "Release"
    multiplicity: "OneToMany"
  - name: "environments"
    type: "Environment"
    multiplicity: "ManyToMany"
  - name: "dependencies"
    type: "ServiceDependency"
    multiplicity: "OneToMany"
- name: "ServiceDependency"
  description: "Declares a runtime or optional dependency between services that influences\
    \ deployment sequencing and risk."
  data:
  - name: "name"
    type: "String"
  - name: "dependencyType"
    type: "DependencyType"
  relations:
  - name: "applicationService"
    type: "ApplicationService"
    multiplicity: "ManyToOne"
  - name: "dependsOn"
    type: "ApplicationService"
    multiplicity: "ManyToMany"
- name: "DeploymentPipeline"
  description: "Orchestrated flow that governs how releases are promoted and deployed\
    \ through stages and environments."
  data:
  - name: "name"
    type: "String"
  - name: "pipelineType"
    type: "PipelineType"
  - name: "status"
    type: "PipelineStatus"
  - name: "description"
    type: "String"
  relations:
  - name: "applicationService"
    type: "ApplicationService"
    multiplicity: "ManyToOne"
  - name: "stages"
    type: "PipelineStage"
    multiplicity: "OneToMany"
  - name: "environments"
    type: "Environment"
    multiplicity: "ManyToMany"
  - name: "policies"
    type: "DeploymentPolicy"
    multiplicity: "ManyToMany"
  - name: "freezePeriods"
    type: "FreezePeriod"
    multiplicity: "ManyToMany"
  - name: "notifications"
    type: "Notification"
    multiplicity: "ManyToMany"
  - name: "deployments"
    type: "Deployment"
    multiplicity: "OneToMany"
- name: "PipelineStage"
  description: "Ordered step within a deployment pipeline representing a major phase\
    \ such as pre-deploy, deploy, or verify."
  data:
  - name: "name"
    type: "String"
  - name: "sequence"
    type: "Integer"
  - name: "stageType"
    type: "StageType"
  relations:
  - name: "pipeline"
    type: "DeploymentPipeline"
    multiplicity: "ManyToOne"
  - name: "rolloutStrategy"
    type: "RolloutStrategy"
    multiplicity: "ManyToOne"
  - name: "gates"
    type: "ReleaseGate"
    multiplicity: "OneToMany"
  - name: "runbook"
    type: "Runbook"
    multiplicity: "ManyToOne"
  - name: "stageExecutions"
    type: "DeploymentStageExecution"
    multiplicity: "OneToMany"
- name: "Runbook"
  description: "Operational procedure containing scripts and instructions used during\
    \ deploy, verify, or rollback."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "script"
    type: "Script"
  relations:
  - name: "pipelineStages"
    type: "PipelineStage"
    multiplicity: "OneToMany"
- name: "RolloutStrategy"
  description: "Prescriptive approach for rolling out a release, including batch sizing\
    \ and surge/unavailable thresholds."
  data:
  - name: "name"
    type: "String"
  - name: "strategyType"
    type: "StrategyType"
  - name: "batchSizePercent"
    type: "Decimal"
  - name: "intervalMinutes"
    type: "Integer"
  - name: "maxUnavailable"
    type: "Integer"
  - name: "maxSurge"
    type: "Integer"
  - name: "trafficPolicy"
    type: "TrafficPolicy"
  relations:
  - name: "pipelineStages"
    type: "PipelineStage"
    multiplicity: "OneToMany"
  - name: "deployments"
    type: "Deployment"
    multiplicity: "OneToMany"
- name: "ReleaseChannel"
  description: "Progression ring that controls audience exposure and promotion order\
    \ for releases."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "description"
    type: "String"
  - name: "precedence"
    type: "Integer"
  relations:
  - name: "releases"
    type: "Release"
    multiplicity: "OneToMany"
  - name: "environments"
    type: "Environment"
    multiplicity: "ManyToMany"
  - name: "freezePeriods"
    type: "FreezePeriod"
    multiplicity: "ManyToMany"
- name: "Release"
  description: "Versioned package of changes eligible for deployment with associated\
    \ artifacts and approvals."
  data:
  - name: "version"
    type: "Version"
  - name: "releaseNotes"
    type: "String"
  - name: "sourceCommit"
    type: "String"
  - name: "createdDate"
    type: "Date"
  - name: "releaseType"
    type: "ReleaseType"
  relations:
  - name: "applicationService"
    type: "ApplicationService"
    multiplicity: "ManyToOne"
  - name: "artifacts"
    type: "Artifact"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "deployments"
    type: "Deployment"
    multiplicity: "OneToMany"
  - name: "channel"
    type: "ReleaseChannel"
    multiplicity: "ManyToOne"
  - name: "changeRequests"
    type: "ChangeRequest"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "Artifact"
  description: "Deployable unit produced by build or packaging, such as an image,\
    \ chart, or manifest."
  data:
  - name: "name"
    type: "String"
  - name: "artifactType"
    type: "ArtifactType"
  - name: "uri"
    type: "URI"
  - name: "digest"
    type: "Checksum"
  - name: "sizeBytes"
    type: "Integer"
  - name: "buildNumber"
    type: "String"
  relations:
  - name: "release"
    type: "Release"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "DeploymentTask"
    multiplicity: "ManyToMany"
- name: "Environment"
  description: "Operational context where services are deployed, configured, and verified."
  data:
  - name: "name"
    type: "String"
  - name: "environmentType"
    type: "EnvironmentType"
  - name: "region"
    type: "String"
  relations:
  - name: "targets"
    type: "DeploymentTarget"
    multiplicity: "OneToMany"
  - name: "clusters"
    type: "ComputeCluster"
    multiplicity: "OneToMany"
  - name: "pipelines"
    type: "DeploymentPipeline"
    multiplicity: "ManyToMany"
  - name: "maintenanceWindows"
    type: "MaintenanceWindow"
    multiplicity: "OneToMany"
  - name: "releaseChannels"
    type: "ReleaseChannel"
    multiplicity: "ManyToMany"
  - name: "configurationSets"
    type: "ConfigurationSet"
    multiplicity: "ManyToMany"
  - name: "deployments"
    type: "Deployment"
    multiplicity: "OneToMany"
  - name: "runners"
    type: "Runner"
    multiplicity: "ManyToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
  - name: "targetGroups"
    type: "TargetGroup"
    multiplicity: "OneToMany"
  - name: "notifications"
    type: "Notification"
    multiplicity: "ManyToMany"
  - name: "policies"
    type: "DeploymentPolicy"
    multiplicity: "ManyToMany"
  - name: "freezePeriods"
    type: "FreezePeriod"
    multiplicity: "ManyToMany"
- name: "ComputeCluster"
  description: "Compute substrate that hosts deployment targets and provides an API\
    \ endpoint for orchestration."
  data:
  - name: "name"
    type: "String"
  - name: "clusterType"
    type: "ClusterType"
  - name: "apiEndpoint"
    type: "Endpoint"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "targets"
    type: "DeploymentTarget"
    multiplicity: "OneToMany"
- name: "DeploymentTarget"
  description: "Addressable unit within a cluster or infrastructure where artifacts\
    \ are applied."
  data:
  - name: "name"
    type: "String"
  - name: "targetType"
    type: "TargetType"
  - name: "namespace"
    type: "String"
  - name: "selector"
    type: "String"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "cluster"
    type: "ComputeCluster"
    multiplicity: "ManyToOne"
  - name: "targetGroups"
    type: "TargetGroup"
    multiplicity: "ManyToMany"
  - name: "tasks"
    type: "DeploymentTask"
    multiplicity: "OneToMany"
- name: "TargetGroup"
  description: "Logical grouping of deployment targets used for staged rollouts and\
    \ traffic shifting."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "targets"
    type: "DeploymentTarget"
    multiplicity: "ManyToMany"
  - name: "deployments"
    type: "Deployment"
    multiplicity: "ManyToMany"
  - name: "trafficShifts"
    type: "TrafficShift"
    multiplicity: "OneToMany"
- name: "MaintenanceWindow"
  description: "Time-bounded period that controls whether deployments are allowed,\
    \ blocked, or require approval."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "policy"
    type: "MaintenancePolicy"
  - name: "reason"
    type: "String"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
- name: "FreezePeriod"
  description: "Scheduled change freeze that restricts deployment actions across pipelines,\
    \ environments, or channels."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "scope"
    type: "FreezeScope"
  - name: "reason"
    type: "String"
  relations:
  - name: "pipelines"
    type: "DeploymentPipeline"
    multiplicity: "ManyToMany"
  - name: "environments"
    type: "Environment"
    multiplicity: "ManyToMany"
  - name: "releaseChannels"
    type: "ReleaseChannel"
    multiplicity: "ManyToMany"
- name: "ConfigurationSet"
  description: "Named collection of configuration values applied during deployment\
    \ to parameterize behavior."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "configItems"
    type: "ConfigItem"
    multiplicity: "OneToMany"
  - name: "environments"
    type: "Environment"
    multiplicity: "ManyToMany"
  - name: "tasks"
    type: "DeploymentTask"
    multiplicity: "OneToMany"
  - name: "releases"
    type: "Release"
    multiplicity: "ManyToMany"
- name: "ConfigItem"
  description: "Individual configuration entry representing a key-value pair with\
    \ sensitivity classification."
  data:
  - name: "key"
    type: "String"
  - name: "value"
    type: "String"
  - name: "sensitivity"
    type: "Sensitivity"
  - name: "secret"
    type: "SecretRef"
  relations:
  - name: "configurationSet"
    type: "ConfigurationSet"
    multiplicity: "ManyToOne"
- name: "Approval"
  description: "Formal decision record provided by a person or group to authorize\
    \ a release or deployment action."
  data:
  - name: "approverRole"
    type: "String"
  - name: "status"
    type: "ApprovalStatus"
  - name: "comment"
    type: "String"
  - name: "decisionDate"
    type: "Date"
  relations:
  - name: "release"
    type: "Release"
    multiplicity: "ManyToOne"
  - name: "deployment"
    type: "Deployment"
    multiplicity: "ManyToOne"
  - name: "stageExecution"
    type: "DeploymentStageExecution"
    multiplicity: "ManyToOne"
- name: "ReleaseGate"
  description: "Automated or manual checkpoint that evaluates conditions before advancing\
    \ a stage."
  data:
  - name: "name"
    type: "String"
  - name: "gateType"
    type: "GateType"
  - name: "condition"
    type: "String"
  - name: "result"
    type: "GateResult"
  relations:
  - name: "pipelineStage"
    type: "PipelineStage"
    multiplicity: "ManyToOne"
  - name: "stageExecution"
    type: "DeploymentStageExecution"
    multiplicity: "ManyToOne"
- name: "ChangeRequest"
  description: "External change control record linked to releases and deployments\
    \ for governance and audit."
  data:
  - name: "changeNumber"
    type: "String"
  - name: "system"
    type: "String"
  - name: "status"
    type: "ChangeStatus"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "scheduledDate"
    type: "Date"
  relations:
  - name: "deployments"
    type: "Deployment"
    multiplicity: "OneToMany"
  - name: "releases"
    type: "Release"
    multiplicity: "OneToMany"
- name: "Deployment"
  description: "Execution instance that applies a release to an environment according\
    \ to pipeline and strategy."
  data:
  - name: "deploymentNumber"
    type: "String"
  - name: "status"
    type: "DeploymentStatus"
  - name: "startedDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  - name: "triggerType"
    type: "TriggerType"
  - name: "summary"
    type: "String"
  relations:
  - name: "release"
    type: "Release"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "pipeline"
    type: "DeploymentPipeline"
    multiplicity: "ManyToOne"
  - name: "stages"
    type: "DeploymentStageExecution"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "rolloutStrategy"
    type: "RolloutStrategy"
    multiplicity: "ManyToOne"
  - name: "targetGroups"
    type: "TargetGroup"
    multiplicity: "ManyToMany"
  - name: "rollback"
    type: "Rollback"
    multiplicity: "OneToOne"
  - name: "changeRequest"
    type: "ChangeRequest"
    multiplicity: "ManyToOne"
  - name: "trafficShifts"
    type: "TrafficShift"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
  - name: "notifications"
    type: "Notification"
    multiplicity: "ManyToMany"
  - name: "artifacts"
    type: "Artifact"
    multiplicity: "ManyToMany"
- name: "DeploymentStageExecution"
  description: "Runtime record for a single pipeline stage within a deployment, including\
    \ tasks and approvals."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "StageExecutionStatus"
  - name: "startedDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "deployment"
    type: "Deployment"
    multiplicity: "ManyToOne"
  - name: "stage"
    type: "PipelineStage"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "DeploymentTask"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "releaseGates"
    type: "ReleaseGate"
    multiplicity: "OneToMany"
- name: "DeploymentTask"
  description: "Atomic unit of work executed during a stage, such as applying manifests\
    \ or running scripts."
  data:
  - name: "name"
    type: "String"
  - name: "taskType"
    type: "TaskType"
  - name: "status"
    type: "TaskStatus_"
  - name: "script"
    type: "Script"
  - name: "startedDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "stageExecution"
    type: "DeploymentStageExecution"
    multiplicity: "ManyToOne"
  - name: "runner"
    type: "Runner"
    multiplicity: "ManyToOne"
  - name: "target"
    type: "DeploymentTarget"
    multiplicity: "ManyToOne"
  - name: "artifacts"
    type: "Artifact"
    multiplicity: "ManyToMany"
  - name: "configurationSet"
    type: "ConfigurationSet"
    multiplicity: "ManyToOne"
- name: "Runner"
  description: "Execution agent or worker responsible for performing deployment tasks."
  data:
  - name: "name"
    type: "String"
  - name: "runnerType"
    type: "RunnerType"
  - name: "endpoint"
    type: "Endpoint"
  - name: "capacity"
    type: "Integer"
  relations:
  - name: "tasks"
    type: "DeploymentTask"
    multiplicity: "OneToMany"
  - name: "labels"
    type: "AgentLabel"
    multiplicity: "ManyToMany"
  - name: "environments"
    type: "Environment"
    multiplicity: "ManyToMany"
- name: "AgentLabel"
  description: "Label assigned to runners used for targeting tasks to compatible capabilities\
    \ or locations."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "runners"
    type: "Runner"
    multiplicity: "ManyToMany"
- name: "TrafficShift"
  description: "Movement of traffic between target groups during canary or blue-green\
    \ rollouts."
  data:
  - name: "percentage"
    type: "Decimal"
  - name: "startedDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  - name: "status"
    type: "TrafficShiftStatus"
  relations:
  - name: "deployment"
    type: "Deployment"
    multiplicity: "ManyToOne"
  - name: "sourceTargetGroup"
    type: "TargetGroup"
    multiplicity: "ManyToOne"
  - name: "destinationTargetGroup"
    type: "TargetGroup"
    multiplicity: "ManyToOne"
- name: "DeploymentPolicy"
  description: "Rule that constrains or guides deployments, such as concurrency limits\
    \ or change controls."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "PolicyType"
  - name: "rule"
    type: "String"
  - name: "enforcement"
    type: "EnforcementLevel"
  relations:
  - name: "environments"
    type: "Environment"
    multiplicity: "ManyToMany"
  - name: "pipelines"
    type: "DeploymentPipeline"
    multiplicity: "ManyToMany"
- name: "Notification"
  description: "Outbound communication template and routing for deployment-related\
    \ events."
  data:
  - name: "channel"
    type: "NotificationChannel"
  - name: "recipient"
    type: "String"
  - name: "messageTemplate"
    type: "String"
  relations:
  - name: "pipelines"
    type: "DeploymentPipeline"
    multiplicity: "ManyToMany"
  - name: "deployments"
    type: "Deployment"
    multiplicity: "ManyToMany"
  - name: "releases"
    type: "Release"
    multiplicity: "ManyToMany"
  - name: "environments"
    type: "Environment"
    multiplicity: "ManyToMany"
- name: "Rollback"
  description: "Action and outcome for reverting a deployment to a prior release or\
    \ state."
  data:
  - name: "reason"
    type: "String"
  - name: "status"
    type: "RollbackStatus"
  - name: "initiatedDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "deployment"
    type: "Deployment"
    multiplicity: "OneToOne"
  - name: "toRelease"
    type: "Release"
    multiplicity: "ManyToOne"
- name: "AuditEvent"
  description: "Immutable record of significant actions and outcomes for governance\
    \ and traceability."
  data:
  - name: "eventType"
    type: "AuditEventType"
  - name: "message"
    type: "String"
  - name: "occurredDate"
    type: "Date"
  - name: "actor"
    type: "String"
  relations:
  - name: "deployment"
    type: "Deployment"
    multiplicity: "ManyToOne"
  - name: "release"
    type: "Release"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
enums:
- name: "ServiceType"
  description: "Classification of deployable service forms to inform deployment strategies\
    \ and targeting."
  data:
  - name: "WebService"
  - name: "BackendService"
  - name: "BatchJob"
  - name: "Worker"
  - name: "Function"
- name: "PipelineType"
  description: "Primary use of the pipeline with respect to automation breadth and\
    \ orchestration scope."
  data:
  - name: "ContinuousDelivery"
  - name: "ReleaseOrchestration"
- name: "PipelineStatus"
  description: "Lifecycle state indicating whether a pipeline is active for promotions\
    \ and runs."
  data:
  - name: "Active"
  - name: "Paused"
  - name: "Archived"
- name: "StageType"
  description: "Category of pipeline stage reflecting the lifecycle phase of a deployment."
  data:
  - name: "Plan"
  - name: "PreDeploy"
  - name: "Deploy"
  - name: "PostDeploy"
  - name: "Verify"
- name: "ReleaseType"
  description: "Semantic category of a release used for risk and scheduling."
  data:
  - name: "Major"
  - name: "Minor"
  - name: "Patch"
  - name: "Hotfix"
- name: "ArtifactType"
  description: "Kind of deployable unit produced and distributed with a release."
  data:
  - name: "ContainerImage"
  - name: "Package"
  - name: "HelmChart"
  - name: "Manifest"
  - name: "ScriptBundle"
- name: "EnvironmentType"
  description: "Operational purpose of an environment to guide policies and protections."
  data:
  - name: "Development"
  - name: "Test"
  - name: "Staging"
  - name: "Production"
  - name: "Sandbox"
- name: "DeploymentStatus"
  description: "Overall state of a deployment execution."
  data:
  - name: "Pending"
  - name: "Running"
  - name: "Succeeded"
  - name: "PartiallySucceeded"
  - name: "Failed"
  - name: "Cancelled"
  - name: "RolledBack"
- name: "TriggerType"
  description: "Mechanism that initiated the deployment."
  data:
  - name: "Manual"
  - name: "Scheduled"
  - name: "Webhook"
  - name: "AutoPromote"
- name: "StageExecutionStatus"
  description: "Runtime status of a specific pipeline stage within a deployment."
  data:
  - name: "Pending"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Skipped"
- name: "TaskType"
  description: "Functional category of a deployment task."
  data:
  - name: "ApplyManifest"
  - name: "RunScript"
  - name: "DatabaseMigration"
  - name: "HealthCheck"
  - name: "TrafficShift"
- name: "TaskStatus_"
  description: "Execution state of an individual deployment task."
  data:
  - name: "Pending"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Skipped"
  - name: "Cancelled"
- name: "RunnerType"
  description: "Hosting model for the agent performing tasks."
  data:
  - name: "Hosted"
  - name: "SelfHosted"
  - name: "KubernetesJob"
  - name: "VM"
- name: "TargetType"
  description: "Category of infrastructure target used for deployments."
  data:
  - name: "KubernetesNamespace"
  - name: "VMScaleSet"
  - name: "ServerGroup"
  - name: "FunctionApp"
  - name: "EdgeCluster"
- name: "ClusterType"
  description: "Type of compute orchestration platform used by a cluster."
  data:
