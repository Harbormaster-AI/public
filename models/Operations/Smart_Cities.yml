metadata:
  name: "Smart Cities Industry Domain Model"
  description: "HCIDL model capturing municipal operations, infrastructure, mobility,\
    \ utilities, open data, and public service capabilities."
  version: "1.0.0"
  industry: "Smart Cities"
  category: "Operations"
  language: "en-US"
  type: "Industry"
  domain: "Smart Cities"
enums:
- name: "AgencyType"
  description: "Types of municipal departments and public authorities."
  data:
  - name: "Transportation"
  - name: "Utilities"
  - name: "PublicSafety"
  - name: "Parks"
  - name: "Health"
  - name: "WasteManagement"
  - name: "Planning"
  - name: "InformationTechnology"
- name: "AssetType"
  description: "Categories of urban assets deployed by the city."
  data:
  - name: "TrafficSignal"
  - name: "Streetlight"
  - name: "CCTV"
  - name: "ParkingMeter"
  - name: "EVCharger"
  - name: "AirQualitySensor"
  - name: "NoiseSensor"
  - name: "WeatherStation"
  - name: "WaterMeter"
  - name: "SmartWasteBin"
  - name: "BikeShareDock"
  - name: "BusShelter"
  - name: "SolarPanel"
  - name: "Transformer"
  - name: "VariableMessageSign"
- name: "OperationalStatus"
  description: "Lifecycle and run-state for assets and devices."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Maintenance"
  - name: "Faulted"
  - name: "Decommissioned"
- name: "SensorType"
  description: "Types of sensing capabilities used in the urban environment."
  data:
  - name: "AirQuality"
  - name: "Noise"
  - name: "Temperature"
  - name: "Humidity"
  - name: "TrafficFlow"
  - name: "VehicleCount"
  - name: "PedestrianCount"
  - name: "Occupancy"
  - name: "PowerConsumption"
  - name: "WaterLevel"
  - name: "Vibration"
  - name: "FloodDetection"
  - name: "Wind"
  - name: "Precipitation"
- name: "DataQuality"
  description: "Validation and processing state of collected measurements."
  data:
  - name: "Raw"
  - name: "Validated"
  - name: "Estimated"
