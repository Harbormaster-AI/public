---
metadata:
  name: "Feature Flags HCIDL"
  description: "Capability model for managing feature flags, targeting rules, progressive\
    \ delivery, experiments, and evaluation telemetry across application environments."
  version: "1.0.0"
  industry: "Software"
  category: "Operations"
  type: "Capability"
  domain: "Feature Flags"
entities:
- name: "Project"
  description: "Logical container for feature management assets across applications\
    \ and teams."
  data:
  - name: "name"
    type: "String"
  - name: "key"
    type: "String"
  - name: "description"
    type: "String"
  - name: "ownerTeam"
    type: "String"
  relations:
  - name: "environments"
    type: "Environment"
    multiplicity: "OneToMany"
  - name: "featureFlags"
    type: "FeatureFlag"
    multiplicity: "OneToMany"
  - name: "segments"
    type: "Segment"
    multiplicity: "OneToMany"
  - name: "targetLists"
    type: "TargetList"
    multiplicity: "OneToMany"
  - name: "experiments"
    type: "Experiment"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "Environment"
  description: "Runtime context in which flags are evaluated and delivered to clients."
  data:
  - name: "name"
    type: "String"
  - name: "type"
    type: "EnvironmentType"
  - name: "sdkKey"
    type: "SDKKey"
  - name: "isProduction"
    type: "Boolean"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "flagEnvironments"
    type: "FlagEnvironment"
    multiplicity: "OneToMany"
  - name: "sdkClients"
    type: "SDKClient"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "FeatureFlag"
  description: "Configurable control that gates code paths, experiences, or configurations."
  data:
  - name: "key"
    type: "String"
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "kind"
    type: "FlagKind"
  - name: "permanent"
    type: "Boolean"
  - name: "archived"
    type: "Boolean"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "variations"
    type: "FlagVariation"
    multiplicity: "OneToMany"
  - name: "prerequisites"
    type: "Prerequisite"
    multiplicity: "OneToMany"
  - name: "flagEnvironments"
    type: "FlagEnvironment"
    multiplicity: "OneToMany"
  - name: "changeRequests"
    type: "ChangeRequest"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "FlagVariation"
  description: "Named outcome a flag can serve, carrying a typed value."
  data:
  - name: "name"
    type: "String"
  - name: "value"
    type: "String"
  - name: "variationType"
    type: "VariationType"
  - name: "description"
    type: "String"
  relations:
  - name: "featureFlag"
    type: "FeatureFlag"
    multiplicity: "ManyToOne"
  - name: "allocations"
    type: "VariationAllocation"
    multiplicity: "OneToMany"
- name: "FlagEnvironment"
  description: "Environment-specific state and targeting for a feature flag."
  data:
  - name: "enabled"
    type: "Boolean"
  - name: "trackEvents"
    type: "Boolean"
  - name: "evaluationTtlSeconds"
    type: "Integer"
  relations:
  - name: "featureFlag"
    type: "FeatureFlag"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "defaultServeVariation"
    type: "FlagVariation"
    multiplicity: "ManyToOne"
  - name: "fallthroughRollout"
    type: "PercentageRollout"
    multiplicity: "OneToOne"
  - name: "targetRules"
    type: "TargetRule"
    multiplicity: "OneToMany"
  - name: "schedules"
    type: "FlagSchedule"
    multiplicity: "OneToMany"
  - name: "changeRequests"
    type: "ChangeRequest"
    multiplicity: "OneToMany"
  - name: "experiments"
    type: "Experiment"
    multiplicity: "OneToMany"
  - name: "evaluationEvents"
    type: "EvaluationEvent"
    multiplicity: "OneToMany"
- name: "TargetRule"
  description: "Ordered rule that selects targets and determines the served variation\
    \ or rollout."
  data:
  - name: "name"
    type: "String"
  - name: "rank"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "flagEnvironment"
    type: "FlagEnvironment"
    multiplicity: "ManyToOne"
  - name: "conditions"
    type: "RuleCondition"
    multiplicity: "OneToMany"
  - name: "serveVariation"
    type: "FlagVariation"
    multiplicity: "ManyToOne"
  - name: "rollout"
    type: "PercentageRollout"
    multiplicity: "OneToOne"
  - name: "includeSegments"
    type: "Segment"
    multiplicity: "ManyToMany"
  - name: "includeTargetLists"
    type: "TargetList"
    multiplicity: "ManyToMany"
- name: "RuleCondition"
  description: "Predicate that evaluates a target attribute during rule matching."
  data:
  - name: "attribute"
    type: "String"
  - name: "operator_"
    type: "ComparisonOperator"
  - name: "value"
    type: "String"
  - name: "negate"
    type: "Boolean"
  relations:
  - name: "targetRule"
    type: "TargetRule"
    multiplicity: "ManyToOne"
- name: "PercentageRollout"
  description: "Strategy distributing traffic to variations based on allocations and\
    \ stickiness."
  data:
  - name: "method"
    type: "TrafficAllocationMethod"
  - name: "seed"
    type: "HashSeed"
  - name: "hashAttribute"
    type: "String"
  relations:
  - name: "allocations"
    type: "VariationAllocation"
    multiplicity: "OneToMany"
  - name: "flagEnvironment"
    type: "FlagEnvironment"
    multiplicity: "OneToOne"
  - name: "targetRule"
    type: "TargetRule"
    multiplicity: "OneToOne"
- name: "VariationAllocation"
  description: "Percentage of traffic assigned to a specific variation within a rollout."
  data:
  - name: "percentage"
    type: "Percentage"
  relations:
  - name: "rollout"
    type: "PercentageRollout"
    multiplicity: "ManyToOne"
  - name: "variation"
    type: "FlagVariation"
    multiplicity: "ManyToOne"
- name: "Prerequisite"
  description: "Dependency requiring another flag to serve a particular variation\
    \ before evaluation continues."
  data:
  - name: "description"
    type: "String"
  relations:
  - name: "parentFlag"
    type: "FeatureFlag"
    multiplicity: "ManyToOne"
  - name: "requiredFlag"
    type: "FeatureFlag"
    multiplicity: "ManyToOne"
  - name: "expectedVariation"
    type: "FlagVariation"
    multiplicity: "ManyToOne"
- name: "Segment"
  description: "Reusable audience definition based on attributes and lists of target\
    \ identifiers."
  data:
  - name: "name"
    type: "String"
  - name: "key"
    type: "String"
  - name: "description"
    type: "String"
  - name: "unbounded"
    type: "Boolean"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "SegmentRule"
    multiplicity: "OneToMany"
  - name: "includeTargetLists"
    type: "TargetList"
    multiplicity: "ManyToMany"
- name: "SegmentRule"
  description: "Ordered set of conditions used to include targets in a segment."
  data:
  - name: "rank"
    type: "Integer"
  - name: "description"
    type: "String"
  relations:
  - name: "segment"
    type: "Segment"
    multiplicity: "ManyToOne"
  - name: "conditions"
    type: "SegmentCondition"
    multiplicity: "OneToMany"
- name: "SegmentCondition"
  description: "Predicate that evaluates target attributes for segment membership."
  data:
  - name: "attribute"
    type: "String"
  - name: "operator_"
    type: "ComparisonOperator"
  - name: "value"
    type: "String"
  - name: "negate"
    type: "Boolean"
  relations:
  - name: "segmentRule"
    type: "SegmentRule"
    multiplicity: "ManyToOne"
- name: "TargetList"
  description: "Named collection of target identifiers used for allowlists or blocklists."
  data:
  - name: "name"
    type: "String"
  - name: "key"
    type: "String"
  - name: "description"
    type: "String"
  - name: "kind"
    type: "TargetListKind"
  - name: "entriesCount"
    type: "Integer"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
- name: "FlagSchedule"
  description: "Time-based action to change a flag’s environment configuration."
  data:
  - name: "action"
    type: "ScheduleAction"
  - name: "executeAt"
    type: "Date"
  - name: "createdBy"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "flagEnvironment"
    type: "FlagEnvironment"
    multiplicity: "ManyToOne"
  - name: "serveVariation"
    type: "FlagVariation"
    multiplicity: "ManyToOne"
  - name: "rollout"
    type: "PercentageRollout"
    multiplicity: "OneToOne"
  - name: "changeRequest"
    type: "ChangeRequest"
    multiplicity: "ManyToOne"
- name: "ChangeRequest"
  description: "Governed proposal to modify flag configuration with workflow and approvals."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "status"
    type: "ChangeRequestStatus"
  - name: "submittedAt"
    type: "Date"
  - name: "executedAt"
    type: "Date"
  relations:
  - name: "featureFlag"
    type: "FeatureFlag"
    multiplicity: "ManyToOne"
  - name: "flagEnvironment"
    type: "FlagEnvironment"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "schedules"
    type: "FlagSchedule"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "Approval"
  description: "Decision record from a reviewer on a change request."
  data:
  - name: "approver"
    type: "String"
  - name: "decision"
    type: "ApprovalOutcome"
  - name: "decidedAt"
    type: "Date"
  - name: "comment"
    type: "String"
  relations:
  - name: "changeRequest"
    type: "ChangeRequest"
    multiplicity: "ManyToOne"
- name: "AuditEvent"
  description: "Immutable record of actions taken against projects, environments,\
    \ and flags."
  data:
  - name: "action"
    type: "AuditActionType"
  - name: "actor"
    type: "String"
  - name: "occurredAt"
    type: "Date"
  - name: "message"
    type: "String"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "featureFlag"
    type: "FeatureFlag"
    multiplicity: "ManyToOne"
  - name: "changeRequest"
    type: "ChangeRequest"
    multiplicity: "ManyToOne"
- name: "SDKClient"
  description: "Remote client that evaluates flags using an SDK."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "platform"
    type: "String"
  - name: "lastSeen"
    type: "Date"
  - name: "online"
    type: "Boolean"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "evaluationEvents"
    type: "EvaluationEvent"
    multiplicity: "OneToMany"
- name: "EvaluationEvent"
  description: "Telemetry capturing a single flag evaluation performed by an SDK client."
  data:
  - name: "targetKey"
    type: "String"
  - name: "flagKey"
    type: "String"
  - name: "variationServed"
    type: "String"
  - name: "reason"
    type: "EvaluationReason"
  - name: "timestamp"
    type: "Date"
  - name: "track"
    type: "Boolean"
  - name: "value"
    type: "String"
  relations:
  - name: "sdkClient"
    type: "SDKClient"
    multiplicity: "ManyToOne"
  - name: "flagEnvironment"
    type: "FlagEnvironment"
    multiplicity: "ManyToOne"
  - name: "experiment"
    type: "Experiment"
    multiplicity: "ManyToOne"
- name: "Experiment"
  description: "Controlled study that measures outcomes of serving different flag\
    \ variations."
  data:
  - name: "name"
    type: "String"
  - name: "hypothesis"
    type: "String"
  - name: "status"
    type: "ExperimentStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "flagEnvironment"
    type: "FlagEnvironment"
    multiplicity: "ManyToOne"
  - name: "metrics"
    type: "ExperimentMetric"
    multiplicity: "OneToMany"
  - name: "results"
    type: "ExperimentResult"
    multiplicity: "OneToMany"
- name: "MetricDefinition"
  description: "Reusable definition of a business or technical metric collected for\
    \ experiments."
  data:
  - name: "name"
    type: "String"
  - name: "key"
    type: "String"
  - name: "description"
    type: "String"
  - name: "unit"
    type: "String"
  - name: "eventKey"
    type: "String"
  - name: "aggregation"
    type: "MetricAggregation"
  relations:
  - name: "experimentMetrics"
    type: "ExperimentMetric"
    multiplicity: "OneToMany"
- name: "ExperimentMetric"
  description: "Experiment-specific configuration for how a metric is interpreted."
  data:
  - name: "desiredDirection"
    type: "MetricDirection"
  relations:
  - name: "experiment"
    type: "Experiment"
    multiplicity: "ManyToOne"
  - name: "metric"
    type: "MetricDefinition"
    multiplicity: "ManyToOne"
- name: "ExperimentResult"
  description: "Statistical outcome for a metric within an experiment."
  data:
  - name: "metricKey"
    type: "String"
  - name: "winningVariation"
    type: "String"
  - name: "pValue"
    type: "Decimal"
  - name: "lift"
    type: "Decimal"
  - name: "computedAt"
    type: "Date"
  relations:
  - name: "experiment"
    type: "Experiment"
    multiplicity: "ManyToOne"
enums:
- name: "FlagKind"
  description: "Types of flags determining how variations are defined and evaluated."
  data:
  - name: "Boolean"
  - name: "Multivariate"
- name: "VariationType"
  description: "Data types supported by variation values."
  data:
  - name: "Boolean"
  - name: "String"
  - name: "Number"
  - name: "JSON"
- name: "EnvironmentType"
  description: "Classification of deployment contexts for evaluation."
  data:
  - name: "Development"
  - name: "Testing"
  - name: "Staging"
  - name: "Production"
- name: "ComparisonOperator"
  description: "Operators used to compare target attributes during evaluation."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "In"
  - name: "NotIn"
  - name: "Contains"
  - name: "NotContains"
  - name: "StartsWith"
  - name: "EndsWith"
  - name: "GreaterThan"
  - name: "GreaterOrEqual"
  - name: "LessThan"
  - name: "LessOrEqual"
  - name: "RegexMatch"
  - name: "SemverSatisfies"
- name: "TrafficAllocationMethod"
  description: "Method for distributing traffic among variations."
  data:
  - name: "Random"
  - name: "Sticky"
- name: "ScheduleAction"
  description: "Supported changes that can be scheduled for a flag environment."
  data:
  - name: "Enable"
  - name: "Disable"
  - name: "SetVariation"
  - name: "SetRollout"
- name: "ChangeRequestStatus"
  description: "Lifecycle stages of a change request."
  data:
  - name: "Draft"
  - name: "PendingApproval"
  - name: "Approved"
  - name: "Rejected"
  - name: "Cancelled"
  - name: "Executed"
- name: "ApprovalOutcome"
  description: "Possible reviewer decisions on a change request."
  data:
  - name: "Approve"
  - name: "Reject"
- name: "ExperimentStatus"
  description: "Current state of an experiment."
  data:
  - name: "Draft"
  - name: "Running"
  - name: "Paused"
  - name: "Completed"
  - name: "Cancelled"
- name: "EvaluationReason"
  description: "Reason explaining how a particular variation was selected."
  data:
  - name: "TargetMatch"
  - name: "RuleMatch"
  - name: "Fallthrough"
  - name: false
  - name: "PrerequisiteFailed"
  - name: "Error"
- name: "TargetListKind"
  description: "Behavior of a target list when applied during evaluation."
  data:
  - name: "Allow"
  - name: "Deny"
- name: "MetricAggregation"
  description: "Aggregation strategy applied to captured metric events."
  data:
  - name: "Sum"
  - name: "Average"
  - name: "Count"
  - name: "Percentile95"
  - name: "UniqueCount"
  - name: "Ratio"
- name: "MetricDirection"
  description: "Desired movement direction for a metric in an experiment."
  data:
  - name: "HigherIsBetter"
  - name: "LowerIsBetter"
- name: "AuditActionType"
  description: "Types of auditable actions across projects, environments, and flags."
  data:
  - name: "CreateProject"
  - name: "UpdateProject"
  - name: "CreateEnvironment"
  - name: "UpdateEnvironment"
  - name: "CreateFlag"
  - name: "UpdateFlag"
  - name: "ArchiveFlag"
  - name: "RestoreFlag"
  - name: "UpdateRules"
  - name: "UpdateTargeting"
  - name: "ChangeDefault"
  - name: "CreateSegment"
  - name: "UpdateSegment"
  - name: "CreateExperiment"
  - name: "UpdateExperiment"
  - name: "SubmitChangeRequest"
  - name: "ApproveChangeRequest"
  - name: "ExecuteChangeRequest"
valueObjects:
- name: "SDKKey"
  description: "Confidential token used by SDK clients to authenticate and fetch flag\
    \ configurations."
  data:
  - name: "value"
    type: "String"
- name: "Percentage"
  description: "Numeric percentage used for traffic allocations in rollouts."
  data:
  - name: "value"
    type: "Decimal"
- name: "HashSeed"
  description: "Seed value to ensure stable hashing and stickiness for rollouts."
  data:
  - name: "value"
    type: "String"
- name: "TimeWindow"
  description: "Temporal interval with optional start and end boundaries."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "Semver"
  description: "Semantic version string used in version-based comparisons."
  data:
  - name: "value"
    type: "String"
