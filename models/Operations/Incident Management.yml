    multiplicity: "ManyToOne"
  - name: "events"
    type: "IncidentEvent"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "ManyToMany"
  - name: "statusUpdates"
    type: "IncidentStatusUpdate"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "IncidentTask"
    multiplicity: "OneToMany"
  - name: "collaborationRoom"
    type: "CollaborationRoom"
    multiplicity: "OneToOne"
  - name: "impactedAssets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "postIncidentReview"
    type: "PostIncidentReview"
    multiplicity: "OneToOne"
  - name: "relatedIncidents"
    type: "Incident"
    multiplicity: "ManyToMany"
