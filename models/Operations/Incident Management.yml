  - name: "conductedAt"
    type: "DateTime"
  - name: "summary"
    type: "Markdown"
  - name: "lessonsLearned"
    type: "Markdown"
  - name: "followUpActions"
    type: "Markdown"
  relations:
  - name: "incident"
    type: "Incident"
    multiplicity: "OneToOne"
  - name: "rootCauses"
    type: "RootCause"
    multiplicity: "OneToMany"
  - name: "mitigations"
    type: "Mitigation"
    multiplicity: "OneToMany"
  - name: "evidence"
    type: "Evidence"
    multiplicity: "OneToMany"
  - name: "changeRecords"
    type: "ChangeRecord"
    multiplicity: "OneToMany"
- name: "RootCause"
  description: "The underlying reason or contributing factor that led to the incident."
  data:
  - name: "category"
    type: "RootCauseCategory"
  - name: "description"
    type: "Markdown"
  - name: "confidencePercentage"
    type: "Integer"
  relations:
  - name: "postIncidentReview"
    type: "PostIncidentReview"
    multiplicity: "ManyToOne"
  - name: "contributingAlerts"
    type: "Alert"
    multiplicity: "ManyToMany"
  - name: "affectedServices"
    type: "Service"
    multiplicity: "ManyToMany"
- name: "Mitigation"
  description: "A change made to reduce impact or restore service during the incident."
  data:
  - name: "description"
    type: "Markdown"
  - name: "appliedAt"
    type: "DateTime"
  - name: "effectivenessRating"
    type: "Integer"
  relations:
  - name: "postIncidentReview"
    type: "PostIncidentReview"
    multiplicity: "ManyToOne"
  - name: "implementedBy"
    type: "Responder"
    multiplicity: "ManyToOne"
  - name: "relatedChange"
    type: "ChangeRecord"
    multiplicity: "ManyToOne"
- name: "Evidence"
  description: "Artifacts captured to support investigation and post-incident analysis."
  data:
  - name: "evidenceType"
    type: "EvidenceType"
  - name: "description"
    type: "String"
  - name: "url"
    type: "URL"
  - name: "capturedAt"
    type: "DateTime"
  relations:
  - name: "postIncidentReview"
    type: "PostIncidentReview"
    multiplicity: "ManyToOne"
  - name: "incident"
    type: "Incident"
