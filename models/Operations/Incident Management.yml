valueObjects:
- name: "Markdown"
  description: "Rich-text content formatted using Markdown for human-readable notes."
  data:
  - name: "text"
    type: "String"
- name: "URL"
  description: "A universal resource locator for linking to external systems or documents."
  data:
  - name: "value"
    type: "String"
- name: "Email"
  description: "An electronic mail address used for notifications and contacts."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "A phone number used for voice or SMS notifications."
  data:
  - name: "value"
    type: "String"
- name: "Duration"
  description: "A span of time represented in whole minutes."
  data:
  - name: "totalMinutes"
    type: "Integer"
- name: "SLA"
  description: "Service level targets for response and resolution timelines."
  data:
  - name: "targetResponseMinutes"
    type: "Integer"
  - name: "targetResolutionMinutes"
    type: "Integer"
- name: "DateTimeRange"
  description: "A bounded time window defined by start and end timestamps."
  data:
  - name: "start"
    type: "DateTime"
  - name: "end"
    type: "DateTime"
