    type: "Team"
    multiplicity: "ManyToMany"
  - name: "communicationEndpoints"
    type: "CommunicationEndpoint"
    multiplicity: "OneToMany"
  - name: "incidentsAsCommander"
    type: "Incident"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "IncidentTask"
    multiplicity: "OneToMany"
  - name: "capturedEvidence"
    type: "Evidence"
    multiplicity: "OneToMany"
- name: "CommunicationEndpoint"
