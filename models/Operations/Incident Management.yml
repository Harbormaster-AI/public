    type: "ChannelType"
  - name: "address"
    type: "String"
  - name: "verified"
    type: "Boolean"
  - name: "priority"
    type: "Integer"
  relations:
  - name: "responder"
    type: "Responder"
    multiplicity: "ManyToOne"
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
- name: "OnCallSchedule"
