    type: "Responder"
    multiplicity: "ManyToMany"
  - name: "services"
    type: "Service"
    multiplicity: "OneToMany"
  - name: "onCallSchedules"
    type: "OnCallSchedule"
    multiplicity: "OneToMany"
  - name: "escalationPolicies"
    type: "EscalationPolicy"
    multiplicity: "OneToMany"
  - name: "communicationEndpoints"
    type: "CommunicationEndpoint"
    multiplicity: "OneToMany"
- name: "Responder"
  description: "An individual who participates in on-call rotations and incident response."
  data:
