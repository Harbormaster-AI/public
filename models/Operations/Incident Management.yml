  - name: "VM"
  - name: "Container"
  - name: "Pod"
  - name: "Cluster"
  - name: "Database"
  - name: "Queue"
  - name: "Cache"
  - name: "LoadBalancer"
  - name: "API"
  - name: "Function"
  - name: "NetworkDevice"
- name: "Environment"
