    type: "DateTime"
  - name: "audience"
    type: "CommunicationAudience"
  - name: "status"
    type: "IncidentStatus"
  - name: "message"
    type: "Markdown"
  relations:
  - name: "incident"
    type: "Incident"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "Responder"
    multiplicity: "ManyToOne"
  - name: "channels"
    type: "CommunicationChannel"
    multiplicity: "ManyToMany"
  - name: "statusPages"
    type: "StatusPage"
    multiplicity: "ManyToMany"
- name: "IncidentTask"
