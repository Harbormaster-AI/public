    type: "Integer"
  - name: "delayMinutes"
    type: "Integer"
  - name: "actionType"
    type: "EscalationActionType"
  relations:
  - name: "escalationPolicy"
    type: "EscalationPolicy"
    multiplicity: "ManyToOne"
  - name: "targetResponders"
    type: "Responder"
    multiplicity: "ManyToMany"
  - name: "targetTeams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "targetChannels"
    type: "CommunicationChannel"
    multiplicity: "ManyToMany"
- name: "Runbook"
