    type: "DateTime"
  - name: "eventType"
    type: "IncidentEventType"
  - name: "message"
    type: "String"
  relations:
  - name: "incident"
    type: "Incident"
    multiplicity: "ManyToOne"
  - name: "actor"
    type: "Responder"
    multiplicity: "ManyToOne"
  - name: "relatedAlert"
    type: "Alert"
    multiplicity: "ManyToOne"
  - name: "relatedTask"
    type: "IncidentTask"
    multiplicity: "ManyToOne"
- name: "Alert"
  description: "A signal from monitoring or observability that may correlate to an\
    \ incident."
