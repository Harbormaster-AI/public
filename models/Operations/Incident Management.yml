  - name: "ConfigurationError"
  - name: "Capacity"
  - name: "DependencyFailure"
  - name: "ChangeRelated"
  - name: "InfrastructureFailure"
  - name: "SecurityIncident"
  - name: "HumanError"
  - name: "ExternalService"
  - name: "Unknown"
- name: "CommunicationAudience"
  description: "The intended reader group for an incident communication."
  data:
  - name: "Internal"
  - name: "Customers"
  - name: "Public"
- name: "Visibility"
  description: "The access scope determining who can view incident details."
  data:
  - name: "Internal"
  - name: "Public"
- name: "RunbookType"
  description: "The level of automation defined for a runbook."
  data:
  - name: "Manual"
  - name: "Automated"
  - name: "Hybrid"
- name: "ChangeType"
  description: "The change governance category reflecting risk and urgency."
