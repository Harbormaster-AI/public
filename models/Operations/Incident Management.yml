  - name: "services"
    type: "Service"
    multiplicity: "ManyToMany"
  - name: "tasks"
    type: "IncidentTask"
    multiplicity: "OneToMany"
  - name: "incidents"
    type: "Incident"
    multiplicity: "ManyToMany"
- name: "Incident"
  description: "A disruption or degradation of service that requires coordinated response."
