  - name: "source"
    type: "String"
  - name: "fingerprint"
    type: "String"
  - name: "status"
    type: "AlertStatus"
  - name: "firstSeen"
    type: "DateTime"
  - name: "lastSeen"
    type: "DateTime"
  - name: "count"
    type: "Integer"
  - name: "observedSeverity"
    type: "IncidentSeverity"
  relations:
  - name: "incidents"
    type: "Incident"
    multiplicity: "ManyToMany"
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
- name: "CommunicationChannel"
  description: "A broadcast medium used for incident communications."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "address"
    type: "String"
  relations:
  - name: "incidents"
    type: "Incident"
    multiplicity: "ManyToMany"
  - name: "statusUpdates"
    type: "IncidentStatusUpdate"
    multiplicity: "ManyToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
- name: "CollaborationRoom"
  description: "A dedicated real-time collaboration space used during an incident."
  data:
  - name: "platform"
    type: "String"
  - name: "url"
    type: "URL"
  - name: "createdAt"
    type: "DateTime"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "incident"
    type: "Incident"
    multiplicity: "OneToOne"
  - name: "participants"
    type: "Responder"
    multiplicity: "ManyToMany"
  - name: "channels"
    type: "CommunicationChannel"
    multiplicity: "ManyToMany"
- name: "IncidentStatusUpdate"
  description: "A stakeholder communication issued during an incident."
  data:
