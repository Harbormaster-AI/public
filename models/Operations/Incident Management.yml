---
metadata:
  name: "HCIDL Capabilities Model - Incident Management"
  description: "Domain model for operating incident management at scale, covering\
    \ detection, triage, response coordination, stakeholder communications, and continuous\
    \ improvement through reviews."
  version: "1.0.0"
  industry: "Information Technology"
  category: "Operations"
  type: "Capability"
  domain: "Incident Management"
entities:
- name: "Service"
  description: "A business or technical service that is monitored and may be impacted\
    \ by incidents."
  data:
  - name: "name"
    type: "String"
  - name: "tier"
    type: "ServiceTier"
  - name: "summary"
    type: "Markdown"
  - name: "ownershipModel"
    type: "String"
  relations:
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "incidents"
    type: "Incident"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "runbooks"
    type: "Runbook"
    multiplicity: "ManyToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "escalationPolicies"
    type: "EscalationPolicy"
    multiplicity: "ManyToMany"
  - name: "dependencies"
    type: "Service"
    multiplicity: "ManyToMany"
- name: "Team"
