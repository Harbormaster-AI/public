    type: "String"
  - name: "summary"
    type: "Markdown"
  - name: "severity"
    type: "IncidentSeverity"
  - name: "status"
    type: "IncidentStatus"
  - name: "impactScope"
    type: "ImpactScope"
  - name: "visibility"
    type: "Visibility"
  - name: "detectedAt"
    type: "DateTime"
  - name: "acknowledgedAt"
    type: "DateTime"
  - name: "mitigatedAt"
    type: "DateTime"
  - name: "resolvedAt"
    type: "DateTime"
  - name: "customerFacing"
    type: "Boolean"
  - name: "sla"
    type: "SLA"
