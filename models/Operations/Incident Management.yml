    type: "Incident"
    multiplicity: "ManyToOne"
  - name: "assignees"
    type: "Responder"
    multiplicity: "ManyToMany"
  - name: "runbook"
    type: "Runbook"
    multiplicity: "ManyToOne"
  - name: "relatedAlerts"
    type: "Alert"
    multiplicity: "ManyToMany"
- name: "StatusPage"
  description: "A communication surface for service availability and incident updates."
  data:
  - name: "name"
    type: "String"
  - name: "url"
    type: "URL"
  - name: "isPublic"
    type: "Boolean"
  relations:
  - name: "incidents"
    type: "Incident"
    multiplicity: "ManyToMany"
  - name: "updates"
    type: "IncidentStatusUpdate"
    multiplicity: "OneToMany"
- name: "Asset"
  description: "An infrastructure or application component that can be impacted by\
    \ an incident."
  data:
  - name: "name"
    type: "String"
  - name: "assetType"
    type: "AssetType"
  - name: "environment"
    type: "Environment"
  - name: "region"
    type: "String"
  - name: "endpoint"
    type: "URL"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "incidents"
    type: "Incident"
    multiplicity: "ManyToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
- name: "Tag"
  description: "A key-value label used to categorize and filter incident data."
  data:
  - name: "key"
    type: "String"
  - name: "value"
    type: "String"
  relations:
  - name: "services"
    type: "Service"
    multiplicity: "ManyToMany"
  - name: "incidents"
    type: "Incident"
    multiplicity: "ManyToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "ManyToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
- name: "PostIncidentReview"
