  - name: "description"
    type: "Markdown"
  - name: "startedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  - name: "reference"
    type: "String"
  relations:
  - name: "services"
    type: "Service"
    multiplicity: "ManyToMany"
  - name: "incidents"
    type: "Incident"
    multiplicity: "ManyToMany"
  - name: "runbooks"
    type: "Runbook"
    multiplicity: "ManyToMany"
enums:
- name: "IncidentSeverity"
  description: "The assessed urgency and impact level guiding response priority."
  data:
  - name: "Critical"
  - name: "High"
  - name: "Medium"
  - name: "Low"
  - name: "Informational"
- name: "IncidentStatus"
  description: "The lifecycle state of an incident from detection to closure."
  data:
  - name: "Detected"
  - name: "Acknowledged"
  - name: "Investigating"
  - name: "Mitigating"
  - name: "Monitoring"
  - name: "Resolved"
  - name: "Closed"
- name: "ImpactScope"
  description: "The breadth of impact across users, services, or geographies."
  data:
  - name: "SingleUser"
  - name: "MultiUser"
  - name: "SingleService"
  - name: "MultiService"
  - name: "Region"
  - name: "Global"
- name: "IncidentEventType"
  description: "The type of timeline entry associated with an incident."
  data:
  - name: "Detection"
  - name: "Notification"
  - name: "Acknowledgement"
  - name: "Escalation"
  - name: "Assignment"
  - name: "Mitigation"
  - name: "Workaround"
  - name: "Resolution"
  - name: "Verification"
  - name: "Communication"
  - name: "TaskCreated"
  - name: "TaskCompleted"
  - name: "RunbookExecuted"
  - name: "EvidenceCaptured"
- name: "AlertStatus"
  description: "The current handling state of an alert generated by monitoring."
  data:
  - name: "Open"
  - name: "Acknowledged"
  - name: "Silenced"
  - name: "Resolved"
- name: "ChannelType"
  description: "The medium through which notifications or communications are sent."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "Phone"
  - name: "Slack"
  - name: "Teams"
  - name: "Pager"
  - name: "Webhook"
- name: "ScheduleRotationType"
  description: "The pattern used to rotate on-call responsibility."
  data:
  - name: "Daily"
  - name: "Weekly"
  - name: "BiWeekly"
  - name: "Custom"
- name: "EscalationActionType"
  description: "The action taken when an escalation rule triggers."
  data:
  - name: "NotifyUsers"
  - name: "NotifyTeams"
  - name: "CreateIncident"
  - name: "PageOnCall"
  - name: "ReassignCommander"
- name: "TaskStatus_"
  description: "The progress state of a task tracked during an incident."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "Blocked"
  - name: "Completed"
  - name: "Cancelled"
- name: "EvidenceType"
  description: "The kind of artifact collected to support investigation."
  data:
  - name: "Screenshot"
  - name: "Log"
  - name: "MetricGraph"
  - name: "Trace"
  - name: "PacketCapture"
  - name: "ConfigSnapshot"
  - name: "ChatTranscript"
  - name: "ExternalLink"
  - name: "Document"
- name: "RootCauseCategory"
  description: "A high-level classification for the primary contributing factor."
