---
metadata:
  name: "Environment Management Capabilities Model"
  description: "Domain model for planning, provisioning, operating, and governing\
    \ application runtime environments across platforms and clouds."
  version: "1.0.0"
  industry: "Technology"
  category: "Operations"
  type: "Capability"
  domain: "Environment Management"
entities:
- name: "Platform"
  description: "Central platform under which projects, templates, and policies are\
    \ governed."
  data:
  - name: "name"
    type: "String"
  - name: "ownerTeam"
    type: "String"
  - name: "defaultCloudProvider"
    type: "CloudProvider"
  - name: "defaultRegion"
    type: "Region"
  relations:
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
  - name: "templates"
    type: "EnvironmentTemplate"
    multiplicity: "OneToMany"
  - name: "compliancePolicies"
    type: "CompliancePolicy"
    multiplicity: "OneToMany"
  - name: "identities"
    type: "Identity"
    multiplicity: "OneToMany"
- name: "Project"
  description: "Product or team space grouping related environments, budgets, and\
    \ access controls."
  data:
  - name: "name"
    type: "String"
  - name: "businessUnit"
    type: "String"
  - name: "costCenter"
    type: "String"
  relations:
  - name: "platform"
    type: "Platform"
    multiplicity: "ManyToOne"
  - name: "environments"
    type: "Environment"
    multiplicity: "OneToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "configSets"
    type: "ConfigSet"
    multiplicity: "OneToMany"
  - name: "budgets"
    type: "EnvironmentBudget"
    multiplicity: "OneToMany"
  - name: "identities"
    type: "Identity"
    multiplicity: "ManyToMany"
- name: "Identity"
  description: "Human user, group, or service account eligible for access to environments."
  data:
  - name: "displayName"
    type: "String"
  - name: "identityType"
    type: "IdentityType"
  - name: "email"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "ManyToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "changeRequests"
    type: "ChangeRequest"
    multiplicity: "OneToMany"
- name: "EnvironmentTemplate"
  description: "Standardized blueprint defining default resources, configurations,\
    \ and guardrails for environments."
  data:
  - name: "name"
    type: "String"
  - name: "templateType"
    type: "TemplateType"
  - name: "defaultEnvironmentType"
    type: "EnvironmentType"
  - name: "version"
    type: "VersionTag"
  - name: "purpose"
    type: "String"
  relations:
  - name: "platform"
    type: "Platform"
    multiplicity: "ManyToOne"
  - name: "resourceBlueprints"
    type: "ResourceBlueprint"
    multiplicity: "OneToMany"
  - name: "environments"
    type: "Environment"
    multiplicity: "OneToMany"
- name: "ResourceBlueprint"
  description: "Declarative resource pattern with defaults used to instantiate concrete\
    \ infrastructure resources."
  data:
  - name: "name"
    type: "String"
  - name: "resourceType"
    type: "ResourceType"
  - name: "defaultSize"
    type: "String"
  - name: "networkZone"
    type: "NetworkZone"
  - name: "haEnabled"
    type: "Boolean"
  relations:
  - name: "template"
    type: "EnvironmentTemplate"
    multiplicity: "ManyToOne"
- name: "Environment"
  description: "Isolated runtime context for applications, data, and supporting infrastructure."
  data:
  - name: "name"
    type: "String"
  - name: "type"
    type: "EnvironmentType"
  - name: "status"
    type: "EnvironmentStatus"
  - name: "region"
    type: "Region"
  - name: "cloudProvider"
    type: "CloudProvider"
  - name: "createdDate"
    type: "Date"
  - name: "sensitivity"
    type: "SensitivityLevel"
  - name: "lifecycleStage"
    type: "LifecycleStage"
  - name: "purpose"
    type: "String"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "template"
    type: "EnvironmentTemplate"
    multiplicity: "ManyToOne"
  - name: "resourceGroups"
    type: "ResourceGroup"
    multiplicity: "OneToMany"
  - name: "resources"
    type: "InfrastructureResource"
    multiplicity: "OneToMany"
  - name: "configSets"
    type: "ConfigSet"
    multiplicity: "ManyToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "maintenanceWindows"
    type: "MaintenanceWindow"
    multiplicity: "OneToMany"
  - name: "provisioningRuns"
    type: "ProvisioningRun"
    multiplicity: "OneToMany"
  - name: "complianceAssessments"
    type: "ComplianceAssessment"
    multiplicity: "OneToMany"
  - name: "quotas"
    type: "EnvironmentQuota"
    multiplicity: "OneToMany"
  - name: "secrets"
    type: "Secret"
    multiplicity: "OneToMany"
  - name: "endpoints"
    type: "ServiceEndpoint"
    multiplicity: "OneToMany"
  - name: "changeRequests"
    type: "ChangeRequest"
    multiplicity: "OneToMany"
  - name: "budgets"
    type: "EnvironmentBudget"
    multiplicity: "OneToMany"
  - name: "networkSegments"
    type: "NetworkSegment"
    multiplicity: "OneToMany"
- name: "ResourceGroup"
  description: "Logical grouping of infrastructure resources within an environment\
    \ for management and cost allocation."
  data:
  - name: "name"
    type: "String"
  - name: "networkZone"
    type: "NetworkZone"
  - name: "allocationTag"
    type: "Tag"
  - name: "purpose"
    type: "String"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "resources"
    type: "InfrastructureResource"
    multiplicity: "OneToMany"
- name: "InfrastructureResource"
  description: "Concrete provisioned component such as compute, storage, database,\
    \ or network artifact."
  data:
  - name: "name"
    type: "String"
  - name: "resourceType"
    type: "ResourceType"
  - name: "providerResourceId"
    type: "ResourceIdentifier"
  - name: "region"
    type: "Region"
  - name: "availabilityZone"
    type: "String"
  - name: "size"
    type: "String"
  - name: "provisioningStatus"
    type: "ProvisioningStatus"
  - name: "managedByPlatform"
    type: "Boolean"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "resourceGroup"
    type: "ResourceGroup"
    multiplicity: "ManyToOne"
  - name: "dependencies"
    type: "InfrastructureResource"
    multiplicity: "ManyToMany"
  - name: "endpoints"
    type: "ServiceEndpoint"
    multiplicity: "OneToMany"
  - name: "networkSegments"
    type: "NetworkSegment"
    multiplicity: "ManyToMany"
- name: "ConfigSet"
  description: "Versioned collection of configuration values that can be applied to\
    \ multiple environments."
  data:
  - name: "name"
    type: "String"
  - name: "scope"
    type: "VariableScope"
  - name: "version"
    type: "VersionTag"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "entries"
    type: "ConfigurationEntry"
    multiplicity: "OneToMany"
  - name: "environments"
    type: "Environment"
    multiplicity: "ManyToMany"
- name: "ConfigurationEntry"
  description: "Individual key-value configuration item with optional linkage to a\
    \ managed secret."
  data:
  - name: "key"
    type: "String"
  - name: "value"
    type: "String"
  - name: "isSecret"
    type: "Boolean"
  - name: "notes"
    type: "String"
  relations:
  - name: "configSet"
    type: "ConfigSet"
    multiplicity: "ManyToOne"
  - name: "secret"
    type: "Secret"
    multiplicity: "ManyToOne"
- name: "Secret"
  description: "Confidential datum with governance for rotation and usage within an\
    \ environment."
  data:
  - name: "name"
    type: "String"
  - name: "secretType"
    type: "SecretType"
  - name: "sensitivity"
    type: "SensitivityLevel"
  - name: "rotationIntervalDays"
    type: "Integer"
  - name: "lastRotated"
    type: "Date"
  - name: "managedExternally"
    type: "Boolean"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "configurationEntries"
    type: "ConfigurationEntry"
    multiplicity: "OneToMany"
- name: "AccessPolicy"
  description: "Binding of identities to roles granting scoped permissions over environments\
    \ or projects."
  data:
  - name: "name"
    type: "String"
  - name: "role"
    type: "AccessRole"
  - name: "expiresOn"
    type: "Date"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "identities"
    type: "Identity"
    multiplicity: "ManyToMany"
- name: "MaintenanceWindow"
  description: "Scheduled time window for planned work or change freeze in an environment."
  data:
  - name: "name"
    type: "String"
  - name: "schedule"
    type: "TimeWindow"
  - name: "status"
    type: "MaintenanceStatus"
  - name: "changeFreeze"
    type: "Boolean"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "changeRequests"
    type: "ChangeRequest"
    multiplicity: "OneToMany"
- name: "ProvisioningRun"
  description: "Executed operation that provisions or modifies environment resources."
  data:
  - name: "runNumber"
    type: "String"
  - name: "changeType"
    type: "ChangeType"
  - name: "status"
    type: "ProvisioningStatus"
  - name: "startedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "changeRequest"
    type: "ChangeRequest"
    multiplicity: "ManyToOne"
  - name: "affectedResources"
    type: "InfrastructureResource"
    multiplicity: "ManyToMany"
- name: "ChangeRequest"
  description: "Governed request to alter an environment, including approvals and\
    \ scheduling."
  data:
  - name: "changeNumber"
    type: "String"
  - name: "title"
    type: "String"
  - name: "reason"
    type: "String"
  - name: "risk"
    type: "RiskLevel"
  - name: "status"
    type: "ApprovalStatus"
  - name: "scheduledWindow"
    type: "TimeWindow"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "requestedBy"
    type: "Identity"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "provisioningRun"
    type: "ProvisioningRun"
    multiplicity: "OneToOne"
  - name: "maintenanceWindow"
    type: "MaintenanceWindow"
    multiplicity: "ManyToOne"
- name: "Approval"
  description: "Decision record from an authorized reviewer regarding a change request."
  data:
  - name: "decision"
    type: "ApprovalStatus"
  - name: "decidedAt"
    type: "DateTime"
  - name: "comment"
    type: "String"
  relations:
  - name: "changeRequest"
    type: "ChangeRequest"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Identity"
    multiplicity: "ManyToOne"
- name: "CompliancePolicy"
  description: "Control defining configuration or process requirements that environments\
    \ must meet."
  data:
  - name: "name"
    type: "String"
  - name: "severity"
    type: "PolicySeverity"
  - name: "descriptionText"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "platform"
    type: "Platform"
    multiplicity: "ManyToOne"
  - name: "assessments"
    type: "ComplianceAssessment"
    multiplicity: "OneToMany"
- name: "ComplianceAssessment"
  description: "Evaluation outcome for a given environment against a specific policy."
  data:
  - name: "assessedAt"
    type: "DateTime"
  - name: "result"
    type: "ComplianceResult"
  - name: "details"
    type: "String"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "CompliancePolicy"
    multiplicity: "ManyToOne"
- name: "EnvironmentQuota"
  description: "Capacity limit and usage tracking for a specific metric within an\
    \ environment."
  data:
  - name: "metric"
    type: "QuotaMetric"
  - name: "limit"
    type: "Decimal"
  - name: "used"
    type: "Decimal"
  - name: "enforced"
    type: "Boolean"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
- name: "ServiceEndpoint"
  description: "Reachable interface exposed by a resource within an environment."
  data:
  - name: "name"
    type: "String"
  - name: "endpointType"
    type: "EndpointType"
  - name: "url"
    type: "Url"
  - name: "dnsName"
    type: "DnsName"
  - name: "healthy"
    type: "Boolean"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "InfrastructureResource"
    multiplicity: "ManyToOne"
- name: "EnvironmentBudget"
  description: "Financial guardrail defining cost expectations and alerting period\
    \ for an environment or project."
  data:
  - name: "period"
    type: "BudgetPeriod"
  - name: "limit"
    type: "Money"
  - name: "alertsEnabled"
    type: "Boolean"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
- name: "NetworkSegment"
  description: "Addressable subnet or segment allocated to an environment for isolation\
    \ and routing."
  data:
  - name: "name"
    type: "String"
  - name: "cidr"
    type: "CIDR"
  - name: "networkZone"
    type: "NetworkZone"
  - name: "internetEgressAllowed"
    type: "Boolean"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "resources"
    type: "InfrastructureResource"
    multiplicity: "ManyToMany"
enums:
- name: "EnvironmentType"
  description: "Classification indicating the purpose and strictness level of an environment."
  data:
  - name: "Development"
  - name: "Testing"
  - name: "Staging"
  - name: "Production"
  - name: "Sandbox"
  - name: "Preview"
- name: "EnvironmentStatus"
  description: "Lifecycle condition describing the operational readiness of an environment."
  data:
  - name: "Provisioning"
  - name: "Active"
  - name: "Suspended"
  - name: "Decommissioning"
  - name: "Decommissioned"
  - name: "Failed"
- name: "ProvisioningStatus"
  description: "State of an infrastructure operation or resource creation workflow."
  data:
  - name: "Pending"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Cancelled"
- name: "ChangeType"
  description: "Category of action executed against an environment."
  data:
  - name: "Provision"
  - name: "Update"
  - name: "Scale"
  - name: "Patch"
  - name: "RotateSecrets"
  - name: "Migrate"
  - name: "Decommission"
- name: "ResourceType"
  description: "Kind of infrastructure component managed within an environment."
  data:
  - name: "Compute"
  - name: "ContainerCluster"
  - name: "Database"
  - name: "Cache"
  - name: "MessageQueue"
  - name: "ObjectStorage"
  - name: "FileStorage"
  - name: "LoadBalancer"
  - name: "Network"
  - name: "DNS"
  - name: "Certificate"
- name: "NetworkZone"
  description: "Connectivity exposure level applied to resources or groups."
  data:
  - name: "Public"
  - name: "Private"
  - name: "Restricted"
- name: "AccessRole"
  description: "Permission set granting capabilities within the environment management\
    \ domain."
  data:
  - name: "Administrator"
  - name: "Maintainer"
  - name: "Operator_"
  - name: "Viewer"
  - name: "Auditor"
  - name: "Deployer"
- name: "ApprovalStatus"
  description: "Decision or state in the approval workflow for a change."
  data:
  - name: "Requested"
  - name: "Approved"
  - name: "Rejected"
  - name: "Revoked"
  - name: "Expired"
- name: "MaintenanceStatus"
  description: "Progress indicator for a scheduled maintenance activity."
  data:
  - name: "Scheduled"
  - name: "InProgress"
  - name: "Completed"
  - name: "Skipped"
  - name: "Cancelled"
- name: "EndpointType"
  description: "Functional role of a published service endpoint."
  data:
  - name: "Web"
  - name: "API"
  - name: "Metrics"
  - name: "Health"
  - name: "SSH"
  - name: "RDP"
- name: "PolicySeverity"
  description: "Criticality of a policy requirement when violated."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "ComplianceResult"
  description: "Outcome of evaluating an environment against a policy."
  data:
  - name: "Compliant"
  - name: "NonCompliant"
  - name: "Waived"
- name: "CloudProvider"
  description: "Infrastructure substrate where environments are provisioned."
  data:
  - name: "AWS"
  - name: "Azure"
  - name: "GCP"
  - name: "OnPrem"
  - name: "MultiCloud"
- name: "SensitivityLevel"
  description: "Data classification indicating handling constraints for an environment."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Confidential"
  - name: "Restricted"
  - name: "Secret"
- name: "SecretType"
  description: "Type of confidential material under management."
  data:
  - name: "Password"
  - name: "APIKey"
  - name: "Certificate"
  - name: "Token"
  - name: "SSHKey"
  - name: "ConnectionString"
- name: "VariableScope"
  description: "Context level at which a configuration set applies."
  data:
  - name: "Environment"
  - name: "Project"
  - name: "Template"
- name: "QuotaMetric"
  description: "Measured resource category for which limits are enforced."
  data:
  - name: "CPUCores"
  - name: "MemoryGB"
  - name: "StorageGB"
  - name: "NetworkBandwidthMbps"
  - name: "IPAddresses"
  - name: "Pods"
  - name: "Services"
- name: "BudgetPeriod"
  description: "Financial cadence used for setting cost limits and alerts."
  data:
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Yearly"
- name: "Region"
  description: "Geographic location code relevant to the hosting provider."
  data:
  - name: "us-east"
  - name: "us-west"
  - name: "eu-west"
  - name: "eu-central"
  - name: "ap-southeast"
- name: "TemplateType"
  description: "Classification of environment blueprint intent."
  data:
  - name: "Baseline"
  - name: "ComplianceHardened"
  - name: "HighAvailability"
  - name: "CostOptimized"
- name: "IdentityType"
  description: "Category of principal eligible for access policies."
  data:
  - name: "User"
  - name: "Group"
  - name: "ServiceAccount"
- name: "LifecycleStage"
  description: "High-level operational posture of an environment over time."
  data:
  - name: "Build"
  - name: "Operate"
  - name: "Sunset"
- name: "RiskLevel"
  description: "Relative likelihood and impact rating for a proposed change."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
valueObjects:
- name: "Money"
  description: "Monetary value expressed as an amount and ISO currency code."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "TimeWindow"
  description: "Inclusive start and end timestamps representing a scheduled period."
  data:
  - name: "start"
    type: "DateTime"
  - name: "end"
    type: "DateTime"
- name: "CIDR"
  description: "IP address range denoted in Classless Inter-Domain Routing notation."
  data:
  - name: "value"
    type: "String"
- name: "Url"
  description: "Absolute URL representing an endpoint location."
  data:
  - name: "value"
    type: "String"
- name: "DnsName"
  description: "Fully qualified domain name assigned to a service or resource."
  data:
  - name: "value"
    type: "String"
- name: "ResourceIdentifier"
  description: "Provider-native unique reference for a managed resource."
  data:
  - name: "value"
    type: "String"
- name: "VersionTag"
  description: "Opaque version label for templates, configurations, or images."
  data:
  - name: "value"
    type: "String"
- name: "Tag"
  description: "Arbitrary key-value label applied for organization or cost allocation."
  data:
  - name: "key"
    type: "String"
  - name: "value"
    type: "String"
