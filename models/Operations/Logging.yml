---
metadata:
  name: "Logging HCIDL Model"
  description: "Canonical capability model for centralized log collection, processing,\
    \ storage, governance, and alerting across distributed systems and services."
  version: "1.0.0"
  industry: "Cross-Industry IT Operations"
  category: "Operations"
  type: "Capability"
  domain: "Logging"
entities:
- name: "LoggingWorkspace"
  description: "Administrative boundary that organizes logging configurations, resources,\
    \ and policies for a team or tenant."
  data:
  - name: "name"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "ownerTeam"
    type: "String"
  - name: "defaultRetentionDays"
    type: "Integer"
  - name: "allowPublicEndpoints"
    type: "Boolean"
  relations:
  - name: "logSources"
    type: "LogSource"
    multiplicity: "OneToMany"
  - name: "nodes"
    type: "Node"
    multiplicity: "OneToMany"
  - name: "agents"
    type: "LogAgent"
    multiplicity: "OneToMany"
  - name: "ingestionPipelines"
    type: "LogIngestionPipeline"
    multiplicity: "OneToMany"
  - name: "logSinks"
    type: "LogSink"
    multiplicity: "OneToMany"
  - name: "schemas"
    type: "LogSchema"
    multiplicity: "OneToMany"
  - name: "parsers"
    type: "LogParser"
    multiplicity: "OneToMany"
  - name: "maskingRules"
    type: "LogMaskingRule"
    multiplicity: "OneToMany"
  - name: "enrichmentRules"
    type: "LogEnrichmentRule"
    multiplicity: "OneToMany"
  - name: "samplingPolicies"
    type: "LogSamplingPolicy"
    multiplicity: "OneToMany"
  - name: "retentionPolicies"
    type: "LogRetentionPolicy"
    multiplicity: "OneToMany"
  - name: "archives"
    type: "LogArchive"
    multiplicity: "OneToMany"
  - name: "alertRules"
    type: "LogAlertRule"
    multiplicity: "OneToMany"
  - name: "notificationChannels"
    type: "NotificationChannel"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "LogAlert"
    multiplicity: "OneToMany"
  - name: "queries"
    type: "LogQuery"
    multiplicity: "OneToMany"
- name: "LogSource"
  description: "Origin of log events such as an application, service, container, or\
    \ system component."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "SourceType"
  - name: "environment"
    type: "EnvironmentType"
  - name: "serviceName"
    type: "String"
  - name: "serviceVersion"
    type: "String"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "streams"
    type: "LogStream"
    multiplicity: "OneToMany"
  - name: "pipelines"
    type: "LogIngestionPipeline"
    multiplicity: "ManyToMany"
  - name: "agents"
    type: "LogAgent"
    multiplicity: "ManyToMany"
  - name: "nodes"
    type: "Node"
    multiplicity: "ManyToMany"
- name: "Node"
  description: "Compute node or platform instance hosting sources and collection agents."
  data:
  - name: "address"
    type: "HostAddress"
  - name: "platform"
    type: "PlatformType"
  - name: "osName"
    type: "String"
  - name: "environment"
    type: "EnvironmentType"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "agents"
    type: "LogAgent"
    multiplicity: "OneToMany"
  - name: "sources"
    type: "LogSource"
    multiplicity: "ManyToMany"
- name: "LogAgent"
  description: "Deployed collector responsible for harvesting, buffering, and shipping\
    \ logs from nodes to pipelines."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "status"
    type: "AgentStatus"
  - name: "lastHeartbeat"
    type: "DateTime"
  - name: "supportsAutodiscovery"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "node"
    type: "Node"
    multiplicity: "ManyToOne"
  - name: "sources"
    type: "LogSource"
    multiplicity: "ManyToMany"
  - name: "pipelines"
    type: "LogIngestionPipeline"
    multiplicity: "ManyToMany"
- name: "LogStream"
  description: "Logical stream of log events from a source through a pipeline into\
    \ a sink with consistent schema and policies."
  data:
  - name: "name"
    type: "String"
  - name: "streamKey"
    type: "String"
  - name: "logFormat"
    type: "LogFormat"
  - name: "encoding"
    type: "EncodingType"
  - name: "isEphemeral"
    type: "Boolean"
  - name: "samplingPercentage"
    type: "Decimal"
  - name: "shardCount"
    type: "Integer"
  relations:
  - name: "source"
    type: "LogSource"
    multiplicity: "ManyToOne"
  - name: "pipeline"
    type: "LogIngestionPipeline"
    multiplicity: "ManyToOne"
  - name: "sink"
    type: "LogSink"
    multiplicity: "ManyToOne"
  - name: "schema"
    type: "LogSchema"
    multiplicity: "ManyToOne"
  - name: "retentionPolicy"
    type: "LogRetentionPolicy"
    multiplicity: "ManyToOne"
  - name: "archive"
    type: "LogArchive"
    multiplicity: "ManyToOne"
  - name: "alerts"
    type: "LogAlert"
    multiplicity: "OneToMany"
  - name: "queries"
    type: "LogQuery"
    multiplicity: "ManyToMany"
- name: "LogIngestionPipeline"
  description: "Configured flow that collects, parses, enriches, filters, and routes\
    \ logs from sources to sinks."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "PipelineStatus"
  - name: "batchSize"
    type: "Integer"
  - name: "compression"
    type: "CompressionType"
  - name: "dropOnOverload"
    type: "Boolean"
  - name: "rateLimit"
    type: "RateLimit"
  - name: "retryPolicy"
    type: "RetryPolicy"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "sources"
    type: "LogSource"
    multiplicity: "ManyToMany"
  - name: "sinks"
    type: "LogSink"
    multiplicity: "ManyToMany"
  - name: "parser"
    type: "LogParser"
    multiplicity: "ManyToOne"
  - name: "maskingRules"
    type: "LogMaskingRule"
    multiplicity: "ManyToMany"
  - name: "enrichmentRules"
    type: "LogEnrichmentRule"
    multiplicity: "ManyToMany"
  - name: "samplingPolicy"
    type: "LogSamplingPolicy"
    multiplicity: "ManyToOne"
  - name: "agents"
    type: "LogAgent"
    multiplicity: "ManyToMany"
  - name: "streams"
    type: "LogStream"
    multiplicity: "OneToMany"
- name: "LogSink"
  description: "Destination system where logs are stored or indexed for search, analytics,\
    \ and compliance."
  data:
  - name: "name"
    type: "String"
  - name: "sinkType"
    type: "SinkType"
  - name: "location"
    type: "StorageLocation"
  - name: "defaultIndex"
    type: "String"
  - name: "compression"
    type: "CompressionType"
  - name: "tls"
    type: "TLSConfiguration"
  - name: "retentionDays"
    type: "Integer"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "pipelines"
    type: "LogIngestionPipeline"
    multiplicity: "ManyToMany"
  - name: "retentionPolicy"
    type: "LogRetentionPolicy"
    multiplicity: "ManyToOne"
  - name: "archives"
    type: "LogArchive"
    multiplicity: "OneToMany"
  - name: "streams"
    type: "LogStream"
    multiplicity: "OneToMany"
- name: "LogSchema"
  description: "Formal definition of fields, types, and mapping for a particular class\
    \ of log events."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "definition"
    type: "String"
  - name: "isStrict"
    type: "Boolean"
  - name: "timestampField"
    type: "String"
  - name: "levelField"
    type: "String"
  - name: "messageField"
    type: "String"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "streams"
    type: "LogStream"
    multiplicity: "OneToMany"
- name: "LogParser"
  description: "Parser configuration responsible for extracting structured fields\
    \ from raw log messages."
  data:
  - name: "name"
    type: "String"
  - name: "parserType"
    type: "ParserType"
  - name: "pattern"
    type: "RegexPattern"
  - name: "timeFormat"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "dropMalformed"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "pipelines"
    type: "LogIngestionPipeline"
    multiplicity: "OneToMany"
- name: "LogMaskingRule"
  description: "Redaction rule that prevents sensitive data from being persisted or\
    \ exposed."
  data:
  - name: "name"
    type: "String"
  - name: "method"
    type: "RedactionMethod"
  - name: "targetField"
    type: "String"
  - name: "matchPattern"
    type: "RegexPattern"
  - name: "replacement"
    type: "String"
  - name: "isEnabled"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "pipelines"
    type: "LogIngestionPipeline"
    multiplicity: "ManyToMany"
- name: "LogEnrichmentRule"
  description: "Rule that adds static or derived context to log events to improve\
    \ searchability and correlation."
  data:
  - name: "name"
    type: "String"
  - name: "matchExpression"
    type: "String"
  - name: "staticFieldName"
    type: "String"
  - name: "staticFieldValue"
    type: "String"
  - name: "isEnabled"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "pipelines"
    type: "LogIngestionPipeline"
    multiplicity: "ManyToMany"
- name: "LogSamplingPolicy"
  description: "Policy that controls event volume by sampling based on probability\
    \ or rules."
  data:
  - name: "name"
    type: "String"
  - name: "strategy"
    type: "SamplingStrategy"
  - name: "sampleRate"
    type: "Decimal"
  - name: "matchExpression"
    type: "String"
  - name: "isEnabled"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "pipelines"
    type: "LogIngestionPipeline"
    multiplicity: "OneToMany"
- name: "LogRetentionPolicy"
  description: "Data lifecycle policy defining retention, archival, and deletion behavior\
    \ for stored logs."
  data:
  - name: "name"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  - name: "archiveAfterDays"
    type: "Integer"
  - name: "deleteAfterDays"
    type: "Integer"
  - name: "legalHoldEnabled"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "streams"
    type: "LogStream"
    multiplicity: "OneToMany"
  - name: "sinks"
    type: "LogSink"
    multiplicity: "OneToMany"
  - name: "archives"
    type: "LogArchive"
    multiplicity: "OneToMany"
- name: "LogArchive"
  description: "Long-term, lower-cost storage tier for infrequently accessed logs\
    \ under compliance controls."
  data:
  - name: "name"
    type: "String"
  - name: "storageClass"
    type: "StorageClass"
  - name: "location"
    type: "StorageLocation"
  - name: "retentionYears"
    type: "Integer"
  - name: "encryptionKeyAlias"
    type: "String"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "streams"
    type: "LogStream"
    multiplicity: "ManyToMany"
  - name: "sink"
    type: "LogSink"
    multiplicity: "ManyToOne"
- name: "LogAlertRule"
  description: "Condition that evaluates log data and generates alerts when thresholds\
    \ or patterns are met."
  data:
  - name: "name"
    type: "String"
  - name: "severity"
    type: "AlertSeverity"
  - name: "isEnabled"
    type: "Boolean"
  - name: "query"
    type: "String"
  - name: "thresholdCount"
    type: "Integer"
  - name: "windowMinutes"
    type: "Integer"
  - name: "muteUntil"
    type: "DateTime"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "streams"
    type: "LogStream"
    multiplicity: "ManyToMany"
  - name: "notificationChannels"
    type: "NotificationChannel"
    multiplicity: "ManyToMany"
  - name: "alerts"
    type: "LogAlert"
    multiplicity: "OneToMany"
  - name: "queries"
    type: "LogQuery"
    multiplicity: "ManyToMany"
- name: "NotificationChannel"
  description: "Delivery endpoint used to send alert notifications to people or systems."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "NotificationChannelType"
  - name: "destination"
    type: "String"
  - name: "templateName"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "alertRules"
    type: "LogAlertRule"
    multiplicity: "ManyToMany"
  - name: "alerts"
    type: "LogAlert"
    multiplicity: "ManyToMany"
- name: "LogAlert"
  description: "Realized alert instance produced by an alert rule evaluation over\
    \ log data."
  data:
  - name: "title"
    type: "String"
  - name: "message"
    type: "String"
  - name: "severity"
    type: "AlertSeverity"
  - name: "status"
    type: "AlertStatus"
  - name: "triggeredAt"
    type: "DateTime"
  - name: "acknowledgedAt"
    type: "DateTime"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "LogAlertRule"
    multiplicity: "ManyToOne"
  - name: "stream"
    type: "LogStream"
    multiplicity: "ManyToOne"
  - name: "notificationChannels"
    type: "NotificationChannel"
    multiplicity: "ManyToMany"
- name: "LogQuery"
  description: "Saved search used for investigations, dashboards, and alert rules\
    \ over log data."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "queryString"
    type: "String"
  - name: "timeRangeStart"
    type: "DateTime"
  - name: "timeRangeEnd"
    type: "DateTime"
  - name: "isPinned"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "streams"
    type: "LogStream"
    multiplicity: "ManyToMany"
  - name: "alertRules"
    type: "LogAlertRule"
    multiplicity: "ManyToMany"
- name: "LogEventSample"
  description: "Representative log record captured for troubleshooting parser, schema,\
    \ and pipeline behavior."
  data:
  - name: "capturedAt"
    type: "DateTime"
  - name: "level"
    type: "LogLevel"
  - name: "message"
    type: "String"
  - name: "payload"
    type: "String"
  - name: "host"
    type: "String"
  - name: "loggerName"
    type: "String"
  relations:
  - name: "workspace"
    type: "LoggingWorkspace"
    multiplicity: "ManyToOne"
  - name: "stream"
    type: "LogStream"
    multiplicity: "ManyToOne"
  - name: "pipeline"
    type: "LogIngestionPipeline"
    multiplicity: "ManyToOne"
enums:
- name: "LogLevel"
  description: "Standard logging severity levels used by emitters and processors."
  data:
  - name: "Trace"
  - name: "Debug"
  - name: "Info"
  - name: "Warn"
  - name: "Error"
  - name: "Fatal"
- name: "SourceType"
  description: "Classification of log sources by runtime or system component."
  data:
  - name: "Application"
  - name: "Service"
  - name: "Container"
  - name: "Function"
  - name: "BatchJob"
  - name: "Database"
  - name: "NetworkDevice"
  - name: "OperatingSystem"
- name: "PlatformType"
  description: "Platform or host type where logs are generated and agents operate."
  data:
  - name: "Linux"
  - name: "Windows"
  - name: "MacOS"
  - name: "Kubernetes"
  - name: "Serverless"
  - name: "NetworkAppliance"
- name: "AgentStatus"
  description: "Lifecycle and health state of a log collection agent."
  data:
  - name: "Installed"
  - name: "Running"
  - name: "Stopped"
  - name: "Unreachable"
  - name: "Error"
- name: "PipelineStatus"
  description: "Operational readiness state of an ingestion pipeline."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Paused"
  - name: "Degraded"
  - name: "Disabled"
- name: "LogFormat"
  description: "Structure of incoming log messages as parsed by the pipeline."
  data:
  - name: "JSON"
  - name: "Text"
  - name: "Syslog"
  - name: "Structured"
  - name: "Protobuf"
  - name: "GELF"
- name: "EncodingType"
  description: "Character encoding of inbound or stored log payloads."
  data:
  - name: "UTF8"
  - name: "UTF16"
  - name: "ASCII"
  - name: "Base64"
- name: "SinkType"
  description: "Destination technology used to store or index logs."
  data:
  - name: "ObjectStorage"
  - name: "SearchCluster"
  - name: "TimeSeriesDatabase"
  - name: "DataWarehouse"
  - name: "MessageQueue"
- name: "CompressionType"
  description: "Compression algorithm applied during transport or storage."
  data:
  - name: "None"
  - name: "Gzip"
  - name: "Snappy"
  - name: "Zstd"
- name: "AlertSeverity"
  description: "Impact level assigned to an alert rule or alert instance."
  data:
  - name: "Info"
  - name: "Warning"
  - name: "Minor"
  - name: "Major"
  - name: "Critical"
- name: "AlertStatus"
  description: "Current handling state of an alert instance."
  data:
  - name: "Triggered"
  - name: "Acknowledged"
  - name: "Resolved"
  - name: "Suppressed"
- name: "NotificationChannelType"
  description: "Mechanism used to deliver alert notifications."
  data:
  - name: "Email"
  - name: "Slack"
  - name: "Teams"
  - name: "PagerDuty"
  - name: "Webhook"
- name: "StorageClass"
  description: "Durability and access tier for archived log data."
  data:
  - name: "Hot"
  - name: "Warm"
  - name: "Cold"
  - name: "Archive"
  - name: "DeepArchive"
- name: "SamplingStrategy"
  description: "Method used to reduce event volume during ingestion."
  data:
  - name: "None"
  - name: "Probabilistic"
  - name: "RateLimit"
  - name: "RuleBased"
- name: "ParserType"
  description: "Parsing engine that structures raw log messages."
  data:
  - name: "Regex"
  - name: "JSON"
  - name: "XML"
  - name: "Grok"
  - name: "Protobuf"
- name: "EnvironmentType"
  description: "Deployment environment in which the source or node operates."
  data:
  - name: "Development"
  - name: "Test"
  - name: "Staging"
  - name: "Production"
- name: "RedactionMethod"
  description: "Technique applied to sanitize sensitive data within logs."
  data:
  - name: "Mask"
  - name: "Hash"
  - name: "Remove"
  - name: "Tokenize"
valueObjects:
- name: "StorageLocation"
  description: "Addressable storage reference indicating where logs are written or\
    \ archived."
  data:
  - name: "uri"
    type: "String"
  - name: "region"
    type: "String"
- name: "RateLimit"
  description: "Throttling configuration limiting event throughput for a pipeline."
  data:
  - name: "limitPerSecond"
    type: "Integer"
  - name: "burst"
    type: "Integer"
- name: "RetryPolicy"
  description: "Strategy for retrying failed deliveries during ingestion or export."
  data:
  - name: "maxAttempts"
    type: "Integer"
  - name: "backoffSeconds"
    type: "Integer"
- name: "HostAddress"
  description: "Network addressing information for a compute node."
  data:
  - name: "hostname"
    type: "String"
  - name: "ipAddress"
    type: "String"
- name: "RegexPattern"
  description: "Regular expression used for parsing, matching, or masking log content."
  data:
  - name: "value"
    type: "String"
- name: "TLSConfiguration"
  description: "Transport security settings controlling encryption and peer verification."
  data:
  - name: "enabled"
    type: "Boolean"
  - name: "verifyPeer"
    type: "Boolean"
