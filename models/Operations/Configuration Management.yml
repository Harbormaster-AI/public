---
metadata:
  name: "Configuration Management"
  description: "Capability model for defining, governing, versioning, and auditing\
    \ configuration across systems and services."
  version: "1.0.0"
  industry: "Information Technology"
  category: "Product & Catalog"
  type: "Capability"
  domain: "Configuration Management"
entities:
- name: "ConfigurationItem"
  description: "Managed resource whose configuration is controlled, such as a service,\
    \ host, database, or network device."
  data:
  - name: "name"
    type: "String"
  - name: "configurationItemType"
    type: "ConfigurationItemType"
  - name: "lifecycleStatus"
    type: "LifecycleStatus"
  - name: "criticality"
    type: "Criticality"
  - name: "ownerTeam"
    type: "String"
  - name: "ownerContact"
    type: "EmailAddress"
  - name: "currentVersion"
    type: "SemanticVersion"
  - name: "location"
    type: "String"
  - name: "managed"
    type: "Boolean"
  relations:
  - name: "parent"
    type: "ConfigurationItem"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "ConfigurationItem"
    multiplicity: "OneToMany"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "parameterSets"
    type: "ParameterSet"
    multiplicity: "ManyToMany"
  - name: "baselines"
    type: "ConfigurationBaseline"
    multiplicity: "ManyToMany"
  - name: "source"
    type: "ConfigurationSource"
    multiplicity: "ManyToOne"
- name: "Environment"
  description: "Logical deployment context used to scope and resolve configuration."
  data:
  - name: "name"
    type: "String"
  - name: "stage"
    type: "Stage"
  - name: "region"
    type: "String"
  - name: "purpose"
    type: "String"
  relations:
  - name: "configurationItems"
    type: "ConfigurationItem"
    multiplicity: "OneToMany"
  - name: "parameterSets"
    type: "ParameterSet"
    multiplicity: "ManyToMany"
  - name: "baselines"
    type: "ConfigurationBaseline"
    multiplicity: "OneToMany"
- name: "ParameterSet"
  description: "Named grouping of parameters applied together to a scope such as an\
    \ environment or configuration item."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "SemanticVersion"
  - name: "locked"
    type: "Boolean"
  - name: "format"
    type: "ConfigFormat"
  - name: "purpose"
    type: "String"
  relations:
  - name: "parameters"
    type: "ConfigurationParameter"
    multiplicity: "OneToMany"
  - name: "environments"
    type: "Environment"
    multiplicity: "ManyToMany"
  - name: "configurationItems"
    type: "ConfigurationItem"
    multiplicity: "ManyToMany"
  - name: "template"
    type: "ConfigTemplate"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "ConfigurationVersion"
    multiplicity: "OneToMany"
- name: "ConfigurationParameter"
  description: "Individual configuration value with metadata including type and sensitivity."
  data:
  - name: "key"
    type: "String"
  - name: "value"
    type: "String"
  - name: "parameterType"
    type: "ParameterType"
  - name: "secret"
    type: "Boolean"
  - name: "required"
    type: "Boolean"
  - name: "description"
    type: "String"
  - name: "lastModified"
    type: "Date"
  relations:
  - name: "parameterSet"
    type: "ParameterSet"
    multiplicity: "ManyToOne"
  - name: "changeSets"
    type: "ChangeSet"
    multiplicity: "ManyToMany"
- name: "ConfigTemplate"
  description: "Reusable rendering template for producing configuration artifacts\
    \ from parameters."
  data:
  - name: "name"
    type: "String"
  - name: "templateEngine"
    type: "TemplateEngine"
  - name: "contentUri"
    type: "URI"
  - name: "contentChecksum"
    type: "Checksum"
  - name: "format"
    type: "ConfigFormat"
  relations:
  - name: "parameterSets"
    type: "ParameterSet"
    multiplicity: "OneToMany"
- name: "ConfigurationVersion"
  description: "Immutable, addressable configuration artifact produced for a given\
    \ scope and time."
  data:
  - name: "version"
    type: "SemanticVersion"
  - name: "contentUri"
    type: "URI"
  - name: "contentChecksum"
    type: "Checksum"
  - name: "createdAt"
    type: "Date"
  - name: "format"
    type: "ConfigFormat"
  - name: "message"
    type: "String"
  relations:
  - name: "parameterSet"
    type: "ParameterSet"
    multiplicity: "ManyToOne"
  - name: "configurationItem"
    type: "ConfigurationItem"
    multiplicity: "ManyToOne"
  - name: "baseline"
    type: "ConfigurationBaseline"
    multiplicity: "ManyToOne"
  - name: "source"
    type: "ConfigurationSource"
    multiplicity: "ManyToOne"
- name: "ConfigurationBaseline"
  description: "Approved snapshot of configuration for a defined scope, used as a\
    \ reference for drift and release."
  data:
  - name: "name"
    type: "String"
  - name: "baselineType"
    type: "BaselineType"
  - name: "createdAt"
    type: "Date"
  - name: "note"
    type: "String"
  relations:
  - name: "items"
    type: "ConfigurationItem"
    multiplicity: "ManyToMany"
  - name: "versions"
    type: "ConfigurationVersion"
    multiplicity: "OneToMany"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
- name: "ConfigurationPolicy"
  description: "Rule that governs desired configuration states, conventions, and constraints."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "PolicyType"
  - name: "description"
    type: "String"
  - name: "ruleText"
    type: "String"
  - name: "severity"
    type: "Severity"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "assignments"
    type: "PolicyAssignment"
    multiplicity: "OneToMany"
  - name: "source"
    type: "ConfigurationSource"
    multiplicity: "ManyToOne"
- name: "PolicyAssignment"
  description: "Binding of a policy to a specific target, optionally constrained by\
    \ selector expressions."
  data:
  - name: "targetType"
    type: "PolicyTargetType"
  - name: "targetSelector"
    type: "SelectorExpression"
  - name: "active"
    type: "Boolean"
  - name: "note"
    type: "String"
  relations:
  - name: "policy"
    type: "ConfigurationPolicy"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "configurationItem"
    type: "ConfigurationItem"
    multiplicity: "ManyToOne"
  - name: "parameterSet"
    type: "ParameterSet"
    multiplicity: "ManyToOne"
  - name: "complianceRuns"
    type: "ComplianceRun"
    multiplicity: "OneToMany"
- name: "ComplianceRun"
  description: "Execution instance of policy evaluations against a scope producing\
    \ findings."
  data:
  - name: "runDate"
    type: "Date"
  - name: "status"
    type: "ComplianceStatus"
  - name: "summary"
    type: "String"
  relations:
  - name: "assignment"
    type: "PolicyAssignment"
    multiplicity: "ManyToOne"
  - name: "findings"
    type: "ComplianceFinding"
    multiplicity: "OneToMany"
- name: "ComplianceFinding"
  description: "Result of a single rule evaluation with context for remediation and\
    \ tracking."
  data:
  - name: "status"
    type: "ComplianceStatus"
  - name: "severity"
    type: "Severity"
  - name: "message"
    type: "String"
  - name: "ruleName"
    type: "String"
  relations:
  - name: "run"
    type: "ComplianceRun"
    multiplicity: "ManyToOne"
  - name: "configurationItem"
    type: "ConfigurationItem"
    multiplicity: "ManyToOne"
  - name: "parameterSet"
    type: "ParameterSet"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
- name: "ChangeRequest"
  description: "Proposed modification to configuration with governance, planning,\
    \ and approval data."
  data:
  - name: "title"
    type: "String"
  - name: "changeType"
    type: "ChangeType"
  - name: "status"
    type: "ChangeStatus"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "plannedStart"
    type: "Date"
  - name: "plannedEnd"
    type: "Date"
  - name: "justification"
    type: "String"
  relations:
  - name: "changeSets"
    type: "ChangeSet"
    multiplicity: "OneToMany"
  - name: "configurationItems"
    type: "ConfigurationItem"
    multiplicity: "ManyToMany"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "source"
    type: "ConfigurationSource"
    multiplicity: "ManyToOne"
- name: "ChangeSet"
  description: "Group of concrete configuration edits applied together under a change\
    \ request."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "createdAt"
    type: "Date"
  relations:
  - name: "changeRequest"
    type: "ChangeRequest"
    multiplicity: "ManyToOne"
  - name: "parameters"
    type: "ConfigurationParameter"
    multiplicity: "ManyToMany"
  - name: "parameterSet"
    type: "ParameterSet"
    multiplicity: "ManyToOne"
  - name: "configurationItem"
    type: "ConfigurationItem"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "ConfigurationVersion"
    multiplicity: "OneToMany"
- name: "AuditRecord"
  description: "Immutable trail of configuration-related events for accountability\
    \ and forensics."
  data:
  - name: "eventTime"
    type: "Date"
  - name: "actor"
    type: "String"
  - name: "action"
    type: "String"
  - name: "resourceType"
    type: "String"
  - name: "resourceName"
    type: "String"
  - name: "success"
    type: "Boolean"
  - name: "details"
    type: "String"
  relations:
  - name: "configurationItem"
    type: "ConfigurationItem"
    multiplicity: "ManyToOne"
  - name: "parameterSet"
    type: "ParameterSet"
    multiplicity: "ManyToOne"
  - name: "changeRequest"
    type: "ChangeRequest"
    multiplicity: "ManyToOne"
  - name: "source"
    type: "ConfigurationSource"
    multiplicity: "ManyToOne"
- name: "ConfigurationSource"
  description: "System of record or tooling that maintains or generates configuration\
    \ artifacts."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "SourceType"
  - name: "repositoryUri"
    type: "URI"
  - name: "defaultBranch"
    type: "String"
  - name: "maintainedBy"
    type: "String"
  relations:
  - name: "policies"
    type: "ConfigurationPolicy"
    multiplicity: "OneToMany"
  - name: "versions"
    type: "ConfigurationVersion"
    multiplicity: "OneToMany"
  - name: "changeRequests"
    type: "ChangeRequest"
    multiplicity: "OneToMany"
  - name: "configurationItems"
    type: "ConfigurationItem"
    multiplicity: "OneToMany"
enums:
- name: "ConfigurationItemType"
  description: "Classification of managed resources subject to configuration control."
  data:
  - name: "Server"
  - name: "VirtualMachine"
  - name: "Container"
  - name: "NetworkDevice"
  - name: "Database"
  - name: "ApplicationService"
  - name: "Microservice"
  - name: "Queue"
  - name: "Topic"
  - name: "StorageBucket"
  - name: "Function"
  - name: "LoadBalancer"
  - name: "Namespace"
- name: "LifecycleStatus"
  description: "State of a configuration item across its management lifecycle."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "Deprecated"
  - name: "Retired"
- name: "Criticality"
  description: "Business impact level associated with a configuration item."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "ParameterType"
  description: "Declared data type of a configuration parameter for validation and\
    \ tooling."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Json"
  - name: "Yaml"
  - name: "List"
  - name: "Map"
- name: "ConfigFormat"
  description: "Serialization format used to represent configuration artifacts."
  data:
  - name: "Properties"
  - name: "YAML"
  - name: "JSON"
  - name: "HCL"
  - name: "XML"
  - name: "INI"
  - name: "TOML"
- name: "PolicyType"
  description: "Category describing the intent of a configuration policy."
  data:
  - name: "Security"
  - name: "Compliance"
  - name: "Drift"
  - name: "Naming"
  - name: "Ownership"
  - name: "ResourceLimits"
- name: "ComplianceStatus"
  description: "Outcome of evaluating configuration against policy rules."
  data:
  - name: "Pass"
  - name: "Fail"
  - name: "Warning"
  - name: "Error"
  - name: "Skipped"
- name: "Severity"
  description: "Impact scale used for policy violations and findings."
  data:
  - name: "Info"
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "ChangeStatus"
  description: "Workflow state of a configuration change request."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Scheduled"
  - name: "InProgress"
  - name: "Completed"
  - name: "Failed"
  - name: "Cancelled"
- name: "ChangeType"
  description: "Nature of the modification being introduced to configuration."
  data:
  - name: "ParameterUpdate"
  - name: "TemplateChange"
  - name: "ItemAddition"
  - name: "ItemRemoval"
  - name: "PolicyChange"
  - name: "BaselineCreation"
  - name: "Rollback"
- name: "RiskLevel"
  description: "Estimated risk associated with enacting the change."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
- name: "Stage"
  description: "Deployment stage used to organize environments and rollout order."
  data:
  - name: "Development"
  - name: "Test"
  - name: "Staging"
  - name: "Production"
  - name: "DisasterRecovery"
- name: "SourceType"
  description: "Originating system responsible for storing or generating configuration."
  data:
  - name: "Git"
  - name: "CMDB"
  - name: "IaCTool"
  - name: "API"
  - name: "Manual"
- name: "TemplateEngine"
  description: "Rendering engine or tool used to transform templates into artifacts."
  data:
  - name: "Jinja2"
  - name: "Helm"
  - name: "Mustache"
  - name: "Terraform"
  - name: "Ansible"
- name: "BaselineType"
  description: "Purpose or provenance of a configuration baseline snapshot."
  data:
  - name: "Golden"
  - name: "Snapshot"
  - name: "Regulatory"
  - name: "Release"
- name: "PolicyTargetType"
  description: "Kind of target to which a policy assignment applies."
  data:
  - name: "ConfigurationItem"
  - name: "ParameterSet"
  - name: "Environment"
valueObjects:
- name: "SemanticVersion"
  description: "Human-readable version label following semantic versioning conventions."
  data:
  - name: "value"
    type: "String"
- name: "URI"
  description: "Global identifier that locates a configuration artifact or template."
  data:
  - name: "value"
    type: "String"
- name: "Checksum"
  description: "Digest used to verify integrity of configuration content."
  data:
  - name: "value"
    type: "String"
  - name: "algorithm"
    type: "String"
- name: "EmailAddress"
  description: "Contact address for accountable owners of configuration items."
  data:
  - name: "value"
    type: "String"
- name: "SelectorExpression"
  description: "Expression used to select targets for configuration or policy application."
  data:
  - name: "value"
    type: "String"
