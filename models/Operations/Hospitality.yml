---
entities:
- name: "HospitalityGroup"
  description: "Corporate entity that owns or manages multiple hotel brands and properties."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "brands"
    type: "Brand"
    multiplicity: "OneToMany"
  - name: "properties"
    type: "Property"
    multiplicity: "OneToMany"
- name: "Brand"
  description: "Consumer-facing hospitality brand under a hospitality group."
  data:
  - name: "name"
    type: "String"
  - name: "marketSegment"
    type: "MarketSegment"
  relations:
  - name: "group"
    type: "HospitalityGroup"
    multiplicity: "ManyToOne"
  - name: "properties"
    type: "Property"
    multiplicity: "OneToMany"
- name: "Property"
  description: "Individual hotel or resort location offering rooms, amenities, and\
    \ services."
