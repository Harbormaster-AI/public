    multiplicity: "ManyToOne"
  - name: "ratePlan"
    type: "RatePlan"
    multiplicity: "ManyToOne"
  - name: "distributionChannel"
    type: "DistributionChannel"
    multiplicity: "ManyToOne"
  - name: "folio"
    type: "Folio"
    multiplicity: "OneToOne"
  - name: "serviceRequests"
    type: "ServiceRequest"
    multiplicity: "OneToMany"
- name: "Folio"
  description: "Financial ledger for a reservation capturing charges and payments."
