    type: "Reservation"
    multiplicity: "ManyToOne"
  - name: "folio"
    type: "Folio"
    multiplicity: "ManyToOne"
- name: "EventSpace"
  description: "Bookable meeting or banquet space within a property."
  data:
  - name: "name"
