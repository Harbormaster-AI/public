    type: "String"
  - name: "amount"
    type: "Money"
  - name: "chargeCategory"
    type: "ChargeCategory"
  - name: "taxAmount"
    type: "Money"
  - name: "postedDate"
    type: "Date"
  relations:
  - name: "folio"
    type: "Folio"
    multiplicity: "ManyToOne"
  - name: "outlet"
    type: "Outlet"
    multiplicity: "ManyToOne"
- name: "Payment"
  description: "Settlement transaction applied to a folio."
