    type: "String"
  - name: "occupancyAdults"
    type: "Integer"
  - name: "occupancyChildren"
    type: "Integer"
  - name: "bedType"
    type: "BedType"
  - name: "viewType"
    type: "ViewType"
  - name: "smokingPolicy"
    type: "SmokingPolicy"
  relations:
  - name: "property"
    type: "Property"
    multiplicity: "ManyToOne"
  - name: "rooms"
    type: "Room"
    multiplicity: "OneToMany"
  - name: "ratePlans"
    type: "RatePlan"
    multiplicity: "ManyToMany"
- name: "Room"
