  - name: "numberOfChildren"
    type: "Integer"
  - name: "guaranteeType"
    type: "GuaranteeType"
  - name: "createdDate"
    type: "Date"
  relations:
  - name: "guest"
    type: "Guest"
    multiplicity: "ManyToOne"
  - name: "property"
    type: "Property"
    multiplicity: "ManyToOne"
  - name: "roomType"
    type: "RoomType"
    multiplicity: "ManyToOne"
  - name: "room"
