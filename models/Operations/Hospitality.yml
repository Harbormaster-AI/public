    type: "Property"
    multiplicity: "ManyToOne"
  - name: "roomType"
    type: "RoomType"
    multiplicity: "ManyToOne"
  - name: "reservations"
    type: "Reservation"
    multiplicity: "OneToMany"
  - name: "housekeepingTasks"
    type: "HousekeepingTask"
    multiplicity: "OneToMany"
  - name: "maintenanceWorkOrders"
    type: "MaintenanceWorkOrder"
    multiplicity: "OneToMany"
- name: "RatePlan"
  description: "Pricing and policy construct that governs how a room type is sold."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "ratePlanType"
    type: "RatePlanType"
  - name: "mealPlan"
    type: "MealPlan"
  - name: "cancellationPolicy"
    type: "CancellationPolicy"
  - name: "currency"
    type: "String"
  relations:
  - name: "property"
    type: "Property"
    multiplicity: "ManyToOne"
  - name: "roomTypes"
    type: "RoomType"
    multiplicity: "ManyToMany"
  - name: "pricingRules"
    type: "RatePlanPrice"
    multiplicity: "OneToMany"
  - name: "distributionChannels"
    type: "DistributionChannel"
    multiplicity: "ManyToMany"
- name: "RatePlanPrice"
