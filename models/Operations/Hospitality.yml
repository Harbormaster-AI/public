    type: "String"
  - name: "status"
    type: "FolioStatus"
  - name: "totalCharges"
    type: "Money"
  - name: "totalPayments"
    type: "Money"
  relations:
  - name: "reservation"
    type: "Reservation"
    multiplicity: "OneToOne"
  - name: "charges"
    type: "Charge"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "OneToOne"
- name: "Charge"
  description: "Billable item posted to a folio with optional tax component."
  data:
