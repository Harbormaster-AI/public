    type: "Property"
    multiplicity: "ManyToOne"
  - name: "roomType"
    type: "RoomType"
    multiplicity: "ManyToOne"
  - name: "distributionChannel"
    type: "DistributionChannel"
    multiplicity: "ManyToOne"
- name: "Guest"
