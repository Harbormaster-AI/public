    type: "String"
  - name: "propertyCode"
    type: "String"
  - name: "starRating"
    type: "Integer"
  - name: "timezone"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "checkInTime"
    type: "String"
  - name: "checkOutTime"
    type: "String"
  relations:
  - name: "brand"
    type: "Brand"
    multiplicity: "ManyToOne"
  - name: "roomTypes"
    type: "RoomType"
    multiplicity: "OneToMany"
  - name: "rooms"
    type: "Room"
    multiplicity: "OneToMany"
  - name: "ratePlans"
    type: "RatePlan"
    multiplicity: "OneToMany"
  - name: "outlets"
    type: "Outlet"
    multiplicity: "OneToMany"
  - name: "eventSpaces"
    type: "EventSpace"
    multiplicity: "OneToMany"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
- name: "RoomType"
