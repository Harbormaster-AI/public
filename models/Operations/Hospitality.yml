    multiplicity: "OneToOne"
  - name: "guest"
    type: "Guest"
    multiplicity: "ManyToOne"
  - name: "companyAccount"
    type: "CompanyAccount"
    multiplicity: "ManyToOne"
- name: "HousekeepingTask"
  description: "Scheduled cleaning or inspection activity for a room."
  data:
