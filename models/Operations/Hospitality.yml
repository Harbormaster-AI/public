metadata:
  name: "Hospitality Industry Domain Model"
  version: "1.0.0"
  industry: "Hospitality"
  category: "Operations"
  description: "HCIDL model capturing core hospitality capabilities across brands,\
    \ properties, rooms, reservations, pricing, operations, events, F&B, and loyalty."
  type: "Industry"
  domain: "Hospitality"
enums:
- name: "MarketSegment"
  description: "Target positioning of a hospitality brand or offering."
  data:
  - name: "Economy"
  - name: "Midscale"
  - name: "Upscale"
  - name: "Luxury"
  - name: "ExtendedStay"
  - name: "Boutique"
  - name: "Resort"
  - name: "Conference"
- name: "BedType"
  description: "Bed configurations available in guest rooms."
  data:
  - name: "King"
  - name: "Queen"
  - name: "Twin"
  - name: "Double"
  - name: "Bunk"
  - name: "SofaBed"
- name: "ViewType"
  description: "Primary external view associated with a room."
  data:
  - name: "City"
  - name: "Ocean"
  - name: "Garden"
  - name: "Mountain"
  - name: "Courtyard"
  - name: "Pool"
  - name: "River"
- name: "SmokingPolicy"
  description: "Smoking policy designation for a room type or room."
  data:
  - name: "NonSmoking"
  - name: "Smoking"
  - name: "DesignatedArea"
- name: "RoomStatus"
  description: "Operational readiness state of a room."
  data:
  - name: "VacantReady"
  - name: "Occupied"
  - name: "OutOfOrder"
  - name: "OutOfService"
  - name: "Dirty"
  - name: "CleanInspected"
- name: "RatePlanType"
  description: "Commercial classification of a rate plan."
  data:
  - name: "BAR"
  - name: "Corporate"
  - name: "Package"
  - name: "AdvancePurchase"
  - name: "NonRefundable"
  - name: "Government"
  - name: "AAA"
- name: "MealPlan"
  description: "Included meal entitlements for a rate plan."
  data:
  - name: "RoomOnly"
  - name: "BedAndBreakfast"
  - name: "HalfBoard"
  - name: "FullBoard"
  - name: "AllInclusive"
- name: "CancellationPolicy"
  description: "Level of refundability and penalties on cancellations."
  data:
  - name: "Flexible"
  - name: "Moderate"
  - name: "Strict"
  - name: "NonRefundable"
- name: "GuaranteeType"
  description: "Method used to secure a reservation."
  data:
  - name: "CreditCard"
  - name: "Deposit"
  - name: "CompanyGuarantee"
  - name: "None"
- name: "ChannelType"
  description: "Channel classification for marketing and distribution."
  data:
  - name: "Direct"
  - name: "OTA"
  - name: "GDS"
  - name: "TravelAgent"
  - name: "CorporatePortal"
  - name: "WalkIn"
  - name: "CallCenter"
- name: "ReservationStatus"
  description: "Lifecycle state of a reservation."
  data:
  - name: "Tentative"
  - name: "Confirmed"
  - name: "CheckedIn"
  - name: "CheckedOut"
  - name: "NoShow"
  - name: "Cancelled"
- name: "FolioStatus"
  description: "Accounting state of a guest folio."
  data:
  - name: "Open"
  - name: "Closed"
  - name: "Invoiced"
  - name: "Disputed"
- name: "ChargeCategory"
  description: "Revenue classification for posted charges."
  data:
  - name: "Room"
  - name: "FoodAndBeverage"
  - name: "Spa"
  - name: "Parking"
  - name: "Minibar"
  - name: "Telephone"
  - name: "Other"
- name: "PaymentMethod"
  description: "Method by which a payment is collected."
  data:
  - name: "CreditCard"
  - name: "DebitCard"
  - name: "Cash"
  - name: "BankTransfer"
  - name: "MobileWallet"
  - name: "OnAccount"
  - name: "Voucher"
- name: "PaymentStatus"
  description: "Processing state of a payment transaction."
  data:
  - name: "Authorized"
  - name: "Captured"
  - name: "Refunded"
  - name: "Voided"
  - name: "Declined"
  - name: "Pending"
- name: "HousekeepingTaskType"
  description: "Type of housekeeping activity to be performed."
  data:
  - name: "StayoverClean"
  - name: "CheckoutClean"
  - name: "DeepClean"
  - name: "Inspection"
  - name: "Turndown"
- name: "HousekeepingStatus"
  description: "Progress state of a housekeeping task."
  data:
  - name: "Pending"
  - name: "InProgress"
  - name: "Completed"
  - name: "Delayed"
- name: "MaintenanceCategory"
  description: "Technical domain of maintenance work orders."
  data:
  - name: "Electrical"
  - name: "Plumbing"
  - name: "HVAC"
  - name: "Carpentry"
  - name: "Appliance"
  - name: "IT"
