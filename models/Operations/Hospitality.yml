  relations:
  - name: "reservations"
    type: "Reservation"
    multiplicity: "OneToMany"
  - name: "eventBookings"
    type: "EventBooking"
    multiplicity: "OneToMany"
  - name: "contractRates"
    type: "ContractRate"
    multiplicity: "OneToMany"
  - name: "invoices"
