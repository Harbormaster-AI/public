---
metadata:
  name: "Health Management Capabilities Model"
  description: "Canonical capabilities model for managing the operational health of\
    \ services and components across environments, including checks, rules, objectives,\
    \ maintenance, and remediation workflows."
  version: "1.0.0"
  industry: "Technology Operations"
  category: "Operations"
  type: "Capability"
  domain: "Health Management"
entities:
- name: "Service"
  description: "Logical product or application whose health is managed across environments."
  data:
  - name: "name"
    type: "String"
  - name: "businessOwner"
    type: "String"
  - name: "technicalOwner"
    type: "String"
  - name: "lifecycleStage"
    type: "LifecycleStage"
  - name: "criticality"
    type: "Criticality"
  relations:
  - name: "components"
    type: "ServiceComponent"
    multiplicity: "OneToMany"
  - name: "environments"
    type: "Environment"
    multiplicity: "ManyToMany"
  - name: "healthProfiles"
    type: "HealthProfile"
    multiplicity: "OneToMany"
  - name: "statusPages"
    type: "StatusPage"
    multiplicity: "OneToMany"
  - name: "levelReports"
    type: "ServiceLevelReport"
    multiplicity: "OneToMany"
- name: "ServiceComponent"
  description: "Deployable or runnable unit that composes a service and is individually\
    \ monitored for health."
  data:
  - name: "name"
    type: "String"
  - name: "componentType"
    type: "ComponentType"
  - name: "runtime"
    type: "RuntimePlatform"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "endpoints"
    type: "Endpoint"
    multiplicity: "OneToMany"
  - name: "healthChecks"
    type: "HealthCheck"
    multiplicity: "OneToMany"
  - name: "outboundDependencies"
    type: "Dependency"
    multiplicity: "OneToMany"
  - name: "monitorConfigurations"
    type: "MonitorConfiguration"
    multiplicity: "OneToMany"
- name: "Environment"
  description: "Execution context in which services operate, such as production or\
    \ staging."
  data:
  - name: "name"
    type: "String"
  - name: "environmentType"
    type: "EnvironmentType"
  - name: "region"
    type: "String"
  relations:
  - name: "services"
    type: "Service"
    multiplicity: "ManyToMany"
  - name: "maintenanceWindows"
    type: "MaintenanceWindow"
    multiplicity: "OneToMany"
  - name: "healthDashboards"
    type: "HealthDashboard"
    multiplicity: "OneToMany"
- name: "Endpoint"
  description: "Network-accessible resource exposed by a component and targeted by\
    \ health checks."
  data:
  - name: "name"
    type: "String"
  - name: "url"
    type: "Url"
  - name: "method"
    type: "HttpMethod"
  - name: "authType"
    type: "AuthType"
  relations:
  - name: "component"
    type: "ServiceComponent"
    multiplicity: "ManyToOne"
  - name: "healthChecks"
    type: "HealthCheck"
    multiplicity: "OneToMany"
- name: "HealthProfile"
  description: "Scoped set of rules, objectives, and policies defining how health\
    \ is evaluated for a service in an environment."
  data:
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  - name: "evaluationMode"
    type: "EvaluationMode"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "HealthRule"
    multiplicity: "OneToMany"
  - name: "objectives"
    type: "HealthObjective"
    multiplicity: "OneToMany"
  - name: "healthPolicies"
    type: "HealthPolicy"
    multiplicity: "OneToMany"
- name: "HealthRule"
  description: "Declarative condition evaluated against checks or indicators to determine\
    \ health state."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "RuleType"
  - name: "threshold"
    type: "NumericThreshold"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "profile"
    type: "HealthProfile"
    multiplicity: "ManyToOne"
  - name: "targetCheck"
    type: "HealthCheck"
    multiplicity: "ManyToOne"
  - name: "remediationActions"
    type: "RemediationAction"
    multiplicity: "ManyToMany"
- name: "HealthCheck"
  description: "Executable probe that tests liveness, readiness, or synthetic behavior\
    \ of a component or dependency."
  data:
  - name: "name"
    type: "String"
  - name: "checkKind"
    type: "HealthCheckKind"
  - name: "intervalSeconds"
    type: "Integer"
  - name: "timeoutSeconds"
    type: "Integer"
  relations:
  - name: "component"
    type: "ServiceComponent"
    multiplicity: "ManyToOne"
  - name: "endpoint"
    type: "Endpoint"
    multiplicity: "ManyToOne"
  - name: "monitorConfiguration"
    type: "MonitorConfiguration"
    multiplicity: "ManyToOne"
  - name: "lastExecutions"
    type: "CheckExecution"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "HealthAlert"
    multiplicity: "OneToMany"
- name: "CheckExecution"
  description: "Recorded outcome of a single health check run."
  data:
  - name: "startTime"
    type: "DateTime"
  - name: "endTime"
    type: "DateTime"
  - name: "outcome"
    type: "CheckOutcome"
  - name: "responseCode"
    type: "Integer"
  - name: "latencyMs"
    type: "Integer"
  - name: "errorMessage"
    type: "String"
  relations:
  - name: "check"
    type: "HealthCheck"
    multiplicity: "ManyToOne"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
- name: "Dependency"
  description: "Directed reliance of one component on another internal or external\
    \ capability."
  data:
  - name: "dependencyType"
    type: "DependencyType"
  - name: "importance"
    type: "DependencyImportance"
  relations:
  - name: "sourceComponent"
    type: "ServiceComponent"
    multiplicity: "ManyToOne"
  - name: "targetComponent"
    type: "ServiceComponent"
    multiplicity: "ManyToOne"
  - name: "healthContracts"
    type: "HealthContract"
    multiplicity: "OneToMany"
- name: "HealthObjective"
  description: "Targeted health outcome expressed as a service level objective over\
    \ a defined window."
  data:
  - name: "name"
    type: "String"
  - name: "objectiveType"
    type: "ObjectiveType"
  - name: "targetPercentage"
    type: "Decimal"
  - name: "timeWindowDays"
    type: "Integer"
  relations:
  - name: "profile"
    type: "HealthProfile"
    multiplicity: "ManyToOne"
  - name: "indicators"
    type: "HealthIndicator"
    multiplicity: "OneToMany"
  - name: "errorBudget"
    type: "ErrorBudget"
    multiplicity: "OneToOne"
- name: "HealthIndicator"
  description: "Quantitative measurement definition used to evaluate a health objective."
  data:
  - name: "name"
    type: "String"
  - name: "indicatorType"
    type: "IndicatorType"
  - name: "query"
    type: "Query"
  - name: "unit"
    type: "String"
  relations:
  - name: "objective"
    type: "HealthObjective"
    multiplicity: "ManyToOne"
- name: "ErrorBudget"
  description: "Allowable unreliability within a period for a given health objective,\
    \ tracking consumption and status."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "budgetMinutes"
    type: "Integer"
  - name: "consumedMinutes"
    type: "Integer"
  - name: "status"
    type: "BudgetStatus"
  relations:
  - name: "objective"
    type: "HealthObjective"
    multiplicity: "OneToOne"
- name: "MaintenanceWindow"
  description: "Scheduled or emergency period during which health signaling and availability\
    \ may be intentionally impacted."
  data:
  - name: "name"
    type: "String"
  - name: "startTime"
    type: "DateTime"
  - name: "endTime"
    type: "DateTime"
  - name: "maintenanceType"
    type: "MaintenanceType"
  - name: "isGlobal"
    type: "Boolean"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "services"
    type: "Service"
    multiplicity: "ManyToMany"
  - name: "suppressionPolicies"
    type: "SuppressionPolicy"
    multiplicity: "OneToMany"
- name: "SuppressionPolicy"
  description: "Rules for muting or downgrading health alerts during specific scopes\
    \ or windows."
  data:
  - name: "name"
    type: "String"
  - name: "scope"
    type: "SuppressionScope"
  - name: "reason"
    type: "String"
  relations:
  - name: "maintenanceWindow"
    type: "MaintenanceWindow"
    multiplicity: "ManyToOne"
  - name: "suppressedAlerts"
    type: "HealthAlert"
    multiplicity: "OneToMany"
- name: "HealthPolicy"
  description: "Governance settings controlling how health signals aggregate, stabilize,\
    \ and trigger remediation."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "HealthPolicyType"
  - name: "gracePeriodSeconds"
    type: "Integer"
  - name: "rollbackOnFailure"
    type: "Boolean"
  relations:
  - name: "profile"
    type: "HealthProfile"
    multiplicity: "ManyToOne"
  - name: "linkedRules"
    type: "HealthRule"
    multiplicity: "ManyToMany"
  - name: "remediationPlan"
    type: "RemediationPlan"
    multiplicity: "OneToOne"
- name: "RemediationPlan"
  description: "Structured set of actions to restore or improve health when policies\
    \ or rules are breached."
  data:
  - name: "name"
    type: "String"
  - name: "strategy"
    type: "RemediationStrategy"
  - name: "maxAttempts"
    type: "Integer"
  - name: "cooldownSeconds"
    type: "Integer"
  relations:
  - name: "actions"
    type: "RemediationAction"
    multiplicity: "OneToMany"
  - name: "policy"
    type: "HealthPolicy"
    multiplicity: "OneToOne"
- name: "RemediationAction"
  description: "Executable operation such as restart, scale, or script run used within\
    \ a remediation plan or rule."
  data:
  - name: "name"
    type: "String"
  - name: "actionType"
    type: "RemediationActionType"
  - name: "command"
    type: "ShellCommand"
  - name: "timeoutSeconds"
    type: "Integer"
  - name: "continueOnError"
    type: "Boolean"
  relations:
  - name: "plan"
    type: "RemediationPlan"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "HealthRule"
    multiplicity: "ManyToMany"
- name: "HealthAlert"
  description: "Notification entity created from failing checks or rules indicating\
    \ a health condition."
  data:
  - name: "title"
    type: "String"
  - name: "severity"
    type: "AlertSeverity"
  - name: "state"
    type: "AlertState"
  - name: "createdAt"
    type: "DateTime"
  - name: "acknowledged"
    type: "Boolean"
  relations:
  - name: "check"
    type: "HealthCheck"
    multiplicity: "ManyToOne"
  - name: "execution"
    type: "CheckExecution"
    multiplicity: "ManyToOne"
  - name: "suppressionPolicy"
    type: "SuppressionPolicy"
    multiplicity: "ManyToOne"
  - name: "statusPage"
    type: "StatusPage"
    multiplicity: "ManyToOne"
- name: "StatusPage"
  description: "Communication surface summarizing current and historical service health."
  data:
  - name: "name"
    type: "String"
  - name: "visibility"
    type: "StatusPageVisibility"
  - name: "url"
    type: "Url"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "components"
    type: "ServiceComponent"
    multiplicity: "ManyToMany"
  - name: "announcements"
    type: "StatusAnnouncement"
    multiplicity: "OneToMany"
- name: "StatusAnnouncement"
  description: "Public or internal message describing health impact, recovery, or\
    \ maintenance context."
  data:
  - name: "title"
    type: "String"
  - name: "message"
    type: "String"
  - name: "publishedAt"
    type: "DateTime"
  - name: "status"
    type: "ServiceStatus"
  relations:
  - name: "statusPage"
    type: "StatusPage"
    multiplicity: "ManyToOne"
  - name: "relatedMaintenance"
    type: "MaintenanceWindow"
    multiplicity: "ManyToOne"
- name: "HealthDashboard"
  description: "Visual aggregation of health indicators, checks, and objectives for\
    \ a given scope."
  data:
  - name: "name"
    type: "String"
  - name: "layout"
    type: "LayoutType"
  - name: "refreshIntervalSeconds"
    type: "Integer"
  relations:
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
  - name: "widgets"
    type: "DashboardWidget"
    multiplicity: "OneToMany"
- name: "DashboardWidget"
  description: "Configurable visualization unit on a health dashboard."
  data:
  - name: "name"
    type: "String"
  - name: "widgetType"
    type: "WidgetType"
  - name: "query"
    type: "Query"
  - name: "width"
    type: "Integer"
  - name: "height"
    type: "Integer"
  relations:
  - name: "dashboard"
    type: "HealthDashboard"
    multiplicity: "ManyToOne"
- name: "MonitorConfiguration"
  description: "Scheduling, retry, and backoff settings controlling how checks are\
    \ executed."
  data:
  - name: "name"
    type: "String"
  - name: "checkScheduling"
    type: "SchedulingPolicy"
  - name: "retryCount"
    type: "Integer"
  - name: "backoffStrategy"
    type: "BackoffStrategy"
  relations:
  - name: "component"
    type: "ServiceComponent"
    multiplicity: "ManyToOne"
  - name: "healthChecks"
    type: "HealthCheck"
    multiplicity: "OneToMany"
- name: "HealthContract"
  description: "Agreed health expectations for a dependency, including latency and\
    \ availability targets."
  data:
  - name: "name"
    type: "String"
  - name: "expectedAvailability"
    type: "Decimal"
  - name: "maxLatencyMs"
    type: "Integer"
  relations:
  - name: "dependency"
    type: "Dependency"
    multiplicity: "ManyToOne"
  - name: "monitoringRules"
    type: "HealthRule"
    multiplicity: "OneToMany"
- name: "ServiceLevelReport"
  description: "Periodic summary of conformance to health objectives for a service."
  data:
  - name: "name"
    type: "String"
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "availabilityPercentage"
    type: "Decimal"
  - name: "conformanceStatus"
    type: "ConformanceStatus"
  relations:
  - name: "service"
    type: "Service"
    multiplicity: "ManyToOne"
  - name: "objectives"
    type: "HealthObjective"
    multiplicity: "ManyToMany"
enums:
- name: "LifecycleStage"
  description: "Maturity phase of a service from inception through retirement."
  data:
  - name: "Prototype"
  - name: "Development"
  - name: "Staging"
  - name: "Production"
  - name: "Retired"
- name: "Criticality"
  description: "Business impact classification used to prioritize health management\
    \ activities."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "MissionCritical"
- name: "ComponentType"
  description: "Functional role of a component within a service architecture."
  data:
  - name: "API"
  - name: "Worker"
  - name: "Database"
  - name: "Cache"
  - name: "MessageBroker"
  - name: "Frontend"
- name: "RuntimePlatform"
  description: "Execution substrate on which a component runs."
  data:
  - name: "Kubernetes"
  - name: "Serverless"
  - name: "VM"
  - name: "BareMetal"
  - name: "PaaS"
- name: "EnvironmentType"
  description: "Classification of environment purpose and stability expectations."
  data:
  - name: "Development"
  - name: "Test"
  - name: "Staging"
  - name: "Production"
  - name: "DisasterRecovery"
- name: "HttpMethod"
  description: "HTTP verb used when invoking an endpoint for health probing."
  data:
  - name: "GET"
  - name: "POST"
  - name: "PUT"
  - name: "PATCH"
  - name: "DELETE"
  - name: "HEAD"
  - name: "OPTIONS"
- name: "AuthType"
  description: "Authentication approach applied when executing endpoint-based checks."
  data:
  - name: "None"
  - name: "Basic"
  - name: "OAuth2"
  - name: "ApiKey"
  - name: "MTLS"
- name: "EvaluationMode"
  description: "Strategy for aggregating rule outcomes into a profile-level health\
    \ result."
  data:
  - name: "AllRules"
  - name: "AnyRule"
  - name: "Weighted"
- name: "RuleType"
  description: "Category of condition evaluated for health determination."
  data:
  - name: "Threshold"
  - name: "Deadman"
  - name: "Compound"
  - name: "RateOfChange"
- name: "HealthCheckKind"
  description: "Nature of health verification performed by a check."
  data:
  - name: "Liveness"
  - name: "Readiness"
  - name: "Startup"
  - name: "Synthetic"
  - name: "DependencyProbe"
  - name: "ResourceProbe"
- name: "CheckOutcome"
  description: "Result classification of a single health check execution."
  data:
  - name: "Pass"
  - name: "Fail"
  - name: "Degraded"
  - name: "Unknown"
- name: "DependencyType"
  description: "Interaction style or resource category for a dependency."
  data:
  - name: "Synchronous"
  - name: "Asynchronous"
  - name: "DataStore"
  - name: "ExternalService"
  - name: "InternalService"
- name: "DependencyImportance"
  description: "Relative necessity of a dependency in achieving service objectives."
  data:
  - name: "Informational"
  - name: "Supporting"
  - name: "Critical"
- name: "ObjectiveType"
  description: "Health dimension targeted by a service level objective."
  data:
  - name: "Availability"
  - name: "Latency"
  - name: "Freshness"
  - name: "ErrorRate"
  - name: "Saturation"
- name: "IndicatorType"
  description: "Measurement form used for a health indicator."
  data:
  - name: "Ratio"
  - name: "Gauge"
  - name: "Histogram"
  - name: "Counter"
- name: "BudgetStatus"
  description: "Current standing of the remaining error budget for the objective period."
  data:
  - name: "Healthy"
  - name: "AtRisk"
  - name: "Exhausted"
- name: "MaintenanceType"
  description: "Purpose or trigger for a maintenance window."
  data:
  - name: "Planned"
  - name: "Emergency"
  - name: "Migration"
  - name: "SecurityPatch"
- name: "SuppressionScope"
  description: "Target domain where alert suppression rules apply."
  data:
  - name: "Environment"
  - name: "Service"
  - name: "Component"
  - name: "Check"
- name: "HealthPolicyType"
  description: "Policy behavior controlling how health signals are processed and acted\
    \ upon."
  data:
  - name: "FailureAggregation"
  - name: "FlappingDetection"
  - name: "AutoRemediation"
  - name: "PromotionGate"
- name: "RemediationStrategy"
  description: "Execution coordination model for a set of remediation actions."
  data:
  - name: "Sequential"
  - name: "Parallel"
  - name: "Conditional"
- name: "RemediationActionType"
  description: "Mechanism employed to effect a remediation change."
  data:
  - name: "Script"
  - name: "Runbook"
  - name: "Scaling"
  - name: "Restart"
  - name: "TrafficShift"
- name: "AlertSeverity"
  description: "Impact magnitude associated with a health alert."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "AlertState"
  description: "Lifecycle status of an alert from creation through closure."
  data:
  - name: "Open"
  - name: "Acknowledged"
  - name: "Resolved"
  - name: "Suppressed"
- name: "StatusPageVisibility"
  description: "Audience scope for viewing a status page."
  data:
  - name: "Public"
  - name: "Private"
  - name: "Internal"
- name: "ServiceStatus"
  description: "Communicated operational state for a service or component."
  data:
  - name: "Operational"
  - name: "DegradedPerformance"
  - name: "PartialOutage"
  - name: "MajorOutage"
  - name: "Maintenance"
- name: "LayoutType"
  description: "Arrangement style for rendering a health dashboard."
  data:
  - name: "Grid"
  - name: "Single"
  - name: "Custom"
- name: "WidgetType"
  description: "Visualization form supported on a dashboard."
  data:
  - name: "SingleStat"
  - name: "TimeSeries"
  - name: "Table"
  - name: "StatusGrid"
  - name: "Heatmap"
- name: "SchedulingPolicy"
  description: "Approach used to time the execution of health checks."
  data:
  - name: "FixedInterval"
  - name: "Cron"
  - name: "EventDriven"
- name: "BackoffStrategy"
  description: "Retry delay method applied after failed check executions."
  data:
  - name: "None"
  - name: "Linear"
  - name: "Exponential"
  - name: "Jitter"
- name: "ConformanceStatus"
  description: "Summary result for objective adherence over a reporting period."
  data:
  - name: "Met"
  - name: "Missed"
  - name: "Partial"
- name: "ComparisonOperator"
  description: "Comparator used to evaluate a numeric threshold."
  data:
  - name: "GreaterThan"
  - name: "GreaterThanOrEqual"
  - name: "LessThan"
  - name: "LessThanOrEqual"
  - name: "Equal"
  - name: "NotEqual"
- name: "QueryLanguage"
  description: "Domain language used to express indicator computations or widget queries."
  data:
  - name: "PromQL"
  - name: "SQL"
  - name: "Lucene"
  - name: "KQL"
  - name: "LogQL"
  - name: "Custom"
valueObjects:
- name: "Url"
  description: "Structured representation of a network resource location."
  data:
  - name: "scheme"
    type: "String"
  - name: "host"
    type: "String"
  - name: "port"
    type: "Integer"
  - name: "path"
    type: "String"
- name: "NumericThreshold"
  description: "Numeric boundary and window used to evaluate health conditions."
  data:
  - name: "operator_"
    type: "ComparisonOperator"
  - name: "value"
    type: "Decimal"
  - name: "windowSeconds"
    type: "Integer"
- name: "Query"
  description: "Expression and language defining how to compute a metric or indicator."
  data:
  - name: "language"
    type: "QueryLanguage"
  - name: "expression"
    type: "String"
- name: "ShellCommand"
  description: "Executable instruction including interpreter and working directory\
    \ context."
  data:
  - name: "interpreter"
    type: "String"
  - name: "commandText"
    type: "String"
  - name: "workingDirectory"
    type: "String"
