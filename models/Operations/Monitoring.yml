---
metadata:
  name: "Monitoring"
  description: "Capability model for configuring, collecting, evaluating, and visualizing\
    \ monitoring data across systems and services."
  version: "1.0.0"
  industry: "Information Technology"
  category: "Operations"
  type: "Capability"
  domain: "Monitoring"
entities:
- name: "MonitoringWorkspace"
  description: "Administrative boundary that organizes monitoring configuration, assets,\
    \ and evaluations for a given scope such as a product or environment."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "defaultSeverity"
    type: "AlertSeverity"
  relations:
  - name: "dataSources"
    type: "DataSource"
    multiplicity: "OneToMany"
  - name: "agents"
    type: "Agent"
    multiplicity: "OneToMany"
  - name: "resources"
    type: "MonitoredResource"
    multiplicity: "OneToMany"
  - name: "alertPolicies"
    type: "AlertPolicy"
    multiplicity: "OneToMany"
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "OneToMany"
  - name: "notificationChannels"
    type: "NotificationChannel"
    multiplicity: "OneToMany"
  - name: "maintenanceWindows"
    type: "MaintenanceWindow"
    multiplicity: "OneToMany"
  - name: "syntheticMonitors"
    type: "SyntheticMonitor"
    multiplicity: "OneToMany"
  - name: "sloDefinitions"
    type: "SLODefinition"
    multiplicity: "OneToMany"
- name: "DataSource"
  description: "Integration that ingests or scrapes telemetry from platforms, agents,\
    \ or external services."
  data:
  - name: "name"
    type: "String"
  - name: "dataSourceType"
    type: "DataSourceType"
  - name: "endpoint"
    type: "Url"
  - name: "authMethod"
    type: "AuthMethod"
  - name: "collectionIntervalSeconds"
    type: "Integer"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "MonitoringWorkspace"
    multiplicity: "ManyToOne"
  - name: "agents"
    type: "Agent"
    multiplicity: "OneToMany"
  - name: "metricDefinitions"
    type: "MetricDefinition"
    multiplicity: "OneToMany"
- name: "Agent"
  description: "Deployed collector responsible for gathering metrics from hosts, containers,\
    \ or services."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "osType"
    type: "OSType"
  - name: "status"
    type: "AgentStatus"
  - name: "hostname"
    type: "String"
  - name: "lastHeartbeat"
    type: "DateTime"
  relations:
  - name: "workspace"
    type: "MonitoringWorkspace"
    multiplicity: "ManyToOne"
  - name: "dataSource"
    type: "DataSource"
    multiplicity: "ManyToOne"
  - name: "resources"
    type: "MonitoredResource"
    multiplicity: "OneToMany"
- name: "MonitoredResource"
  description: "Any identifiable target being observed, such as a host, service, cluster,\
    \ or database."
  data:
  - name: "name"
    type: "String"
  - name: "resourceType"
    type: "ResourceType"
  - name: "environment"
    type: "EnvironmentType"
  - name: "region"
    type: "String"
  - name: "serviceName"
    type: "String"
  - name: "clusterName"
    type: "String"
  - name: "ipAddress"
    type: "String"
  relations:
  - name: "workspace"
    type: "MonitoringWorkspace"
    multiplicity: "ManyToOne"
  - name: "agent"
    type: "Agent"
    multiplicity: "ManyToOne"
  - name: "metricStreams"
    type: "MetricStream"
    multiplicity: "OneToMany"
  - name: "alertEvents"
    type: "AlertEvent"
    multiplicity: "OneToMany"
- name: "MetricDefinition"
  description: "Canonical description of a metric including unit and sampling semantics."
  data:
  - name: "name"
    type: "String"
  - name: "unit"
    type: "MetricUnit"
  - name: "description"
    type: "String"
  - name: "isCounter"
    type: "Boolean"
  - name: "sampling"
    type: "SamplingType"
  relations:
  - name: "dataSource"
    type: "DataSource"
    multiplicity: "ManyToOne"
  - name: "metricStreams"
    type: "MetricStream"
    multiplicity: "OneToMany"
- name: "MetricStream"
  description: "Concrete time series for a metric scoped to a specific resource and\
    \ label set."
  data:
  - name: "retentionDays"
    type: "Integer"
  - name: "aggregation"
    type: "AggregationType"
  relations:
  - name: "resource"
    type: "MonitoredResource"
    multiplicity: "ManyToOne"
  - name: "metricDefinition"
    type: "MetricDefinition"
    multiplicity: "ManyToOne"
  - name: "dataPoints"
    type: "DataPoint"
    multiplicity: "OneToMany"
- name: "DataPoint"
  description: "Single sampled value within a time series."
  data:
  - name: "timestamp"
    type: "DateTime"
  - name: "value"
    type: "Decimal"
  relations:
  - name: "metricStream"
    type: "MetricStream"
    multiplicity: "ManyToOne"
- name: "AlertPolicy"
  description: "Evaluation logic and routing behavior that determines when and how\
    \ alerts fire."
  data:
  - name: "name"
    type: "String"
  - name: "severity"
    type: "AlertSeverity"
  - name: "evaluationWindow"
    type: "Duration"
  - name: "enabled"
    type: "Boolean"
  - name: "description"
    type: "String"
  relations:
  - name: "workspace"
    type: "MonitoringWorkspace"
    multiplicity: "ManyToOne"
  - name: "conditions"
    type: "AlertCondition"
    multiplicity: "OneToMany"
  - name: "notificationChannels"
    type: "NotificationChannel"
    multiplicity: "ManyToMany"
  - name: "silences"
    type: "Silence"
    multiplicity: "OneToMany"
- name: "AlertCondition"
  description: "Thresholds and comparisons applied to selected metrics and resources."
  data:
  - name: "comparator"
    type: "Comparator"
  - name: "threshold"
    type: "Decimal"
  - name: "aggregation"
    type: "AggregationType"
  - name: "metricSelector"
    type: "MetricSelector"
  - name: "resourceFilter"
    type: "ResourceFilter"
  - name: "forDuration"
    type: "Duration"
  relations:
  - name: "policy"
    type: "AlertPolicy"
    multiplicity: "ManyToOne"
  - name: "metricDefinition"
    type: "MetricDefinition"
    multiplicity: "ManyToOne"
- name: "AlertEvent"
  description: "Instance of a condition breach with lifecycle and routing history."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "AlertStatus"
  - name: "severity"
    type: "AlertSeverity"
  - name: "startedAt"
    type: "DateTime"
  - name: "endedAt"
    type: "DateTime"
  relations:
  - name: "policy"
    type: "AlertPolicy"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "MonitoredResource"
    multiplicity: "ManyToOne"
  - name: "condition"
    type: "AlertCondition"
    multiplicity: "ManyToOne"
  - name: "notifications"
    type: "Notification"
    multiplicity: "OneToMany"
- name: "NotificationChannel"
  description: "Destination used to deliver alert notifications."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "destination"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  - name: "description"
    type: "String"
  relations:
  - name: "workspace"
    type: "MonitoringWorkspace"
    multiplicity: "ManyToOne"
  - name: "policies"
    type: "AlertPolicy"
    multiplicity: "ManyToMany"
  - name: "notifications"
    type: "Notification"
    multiplicity: "OneToMany"
- name: "Notification"
  description: "Delivery record of an alert message to a channel."
  data:
  - name: "sentAt"
    type: "DateTime"
  - name: "deliveryStatus"
    type: "DeliveryStatus"
  - name: "responseCode"
    type: "String"
  - name: "externalReference"
    type: "String"
  relations:
  - name: "alertEvent"
    type: "AlertEvent"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "NotificationChannel"
    multiplicity: "ManyToOne"
- name: "Dashboard"
  description: "Curated visualization surface composed of query-driven widgets."
  data:
  - name: "name"
    type: "String"
  - name: "layout"
    type: "DashboardLayoutType"
  - name: "description"
    type: "String"
  relations:
  - name: "workspace"
    type: "MonitoringWorkspace"
    multiplicity: "ManyToOne"
  - name: "widgets"
    type: "Widget"
    multiplicity: "OneToMany"
- name: "Widget"
  description: "Visual component on a dashboard rendering query results."
  data:
  - name: "title"
    type: "String"
  - name: "widgetType"
    type: "WidgetType"
  - name: "visualization"
    type: "VisualizationType"
  - name: "query"
    type: "QueryString"
  - name: "refreshIntervalSeconds"
    type: "Integer"
  relations:
  - name: "dashboard"
    type: "Dashboard"
    multiplicity: "ManyToOne"
  - name: "metricDefinitions"
    type: "MetricDefinition"
    multiplicity: "ManyToMany"
- name: "SyntheticMonitor"
  description: "Active probe that simulates user or network actions on a schedule."
  data:
  - name: "name"
    type: "String"
  - name: "checkType"
    type: "CheckType"
  - name: "schedule"
    type: "Schedule"
  - name: "target"
    type: "Url"
  - name: "expectedStatus"
    type: "Integer"
  - name: "timeoutSeconds"
    type: "Integer"
  - name: "followRedirects"
    type: "Boolean"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "MonitoringWorkspace"
    multiplicity: "ManyToOne"
  - name: "runs"
    type: "SyntheticRun"
    multiplicity: "OneToMany"
  - name: "alertPolicies"
    type: "AlertPolicy"
    multiplicity: "ManyToMany"
- name: "SyntheticRun"
  description: "Execution result of a synthetic monitor, including timing and outcome."
  data:
  - name: "startedAt"
    type: "DateTime"
  - name: "durationMs"
    type: "Integer"
  - name: "result"
    type: "CheckResult"
  - name: "httpStatus"
    type: "Integer"
  - name: "errorMessage"
    type: "String"
  relations:
  - name: "syntheticMonitor"
    type: "SyntheticMonitor"
    multiplicity: "ManyToOne"
  - name: "resource"
    type: "MonitoredResource"
    multiplicity: "ManyToOne"
- name: "MaintenanceWindow"
  description: "Defined time range to suppress or redirect alerts for planned work."
  data:
  - name: "name"
    type: "String"
  - name: "scope"
    type: "MaintenanceScope"
  - name: "startTime"
    type: "DateTime"
  - name: "endTime"
    type: "DateTime"
  - name: "reason"
    type: "String"
  - name: "status"
    type: "MaintenanceStatus"
  relations:
  - name: "workspace"
    type: "MonitoringWorkspace"
    multiplicity: "ManyToOne"
  - name: "policies"
    type: "AlertPolicy"
    multiplicity: "ManyToMany"
  - name: "resources"
    type: "MonitoredResource"
    multiplicity: "ManyToMany"
  - name: "silences"
    type: "Silence"
    multiplicity: "OneToMany"
- name: "Silence"
  description: "Association that mutes a policy or scope during a maintenance window."
  data:
  - name: "createdAt"
    type: "DateTime"
  - name: "comment"
    type: "String"
  relations:
  - name: "maintenanceWindow"
    type: "MaintenanceWindow"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "AlertPolicy"
    multiplicity: "ManyToOne"
- name: "SLODefinition"
  description: "Target for service performance backed by an SLI and evaluation period."
  data:
  - name: "name"
    type: "String"
  - name: "objectiveType"
    type: "SLOType"
  - name: "target"
    type: "Decimal"
  - name: "period"
    type: "SLOPeriod"
  - name: "sliQuery"
    type: "QueryString"
  - name: "description"
    type: "String"
  relations:
  - name: "workspace"
    type: "MonitoringWorkspace"
    multiplicity: "ManyToOne"
  - name: "errorBudget"
    type: "ErrorBudget"
    multiplicity: "OneToOne"
- name: "ErrorBudget"
  description: "Allowable amount of unreliability within the SLO period and its consumption."
  data:
  - name: "periodStart"
    type: "DateTime"
  - name: "periodEnd"
    type: "DateTime"
  - name: "totalBudgetMinutes"
    type: "Integer"
  - name: "remainingBudgetMinutes"
    type: "Integer"
  - name: "status"
    type: "ErrorBudgetStatus"
  relations:
  - name: "sloDefinition"
    type: "SLODefinition"
    multiplicity: "OneToOne"
  - name: "burnRates"
    type: "BurnRate"
    multiplicity: "OneToMany"
- name: "BurnRate"
  description: "Measured rate of error budget consumption over a sliding window."
  data:
  - name: "window"
    type: "Duration"
  - name: "rate"
    type: "Decimal"
  relations:
  - name: "errorBudget"
    type: "ErrorBudget"
    multiplicity: "ManyToOne"
enums:
- name: "DataSourceType"
  description: "Type of telemetry source or collection backend."
  data:
  - name: "Prometheus"
  - name: "OpenTelemetryCollector"
  - name: "CloudWatch"
  - name: "AzureMonitor"
  - name: "Stackdriver"
  - name: "InfluxDB"
  - name: "Graphite"
- name: "AuthMethod"
  description: "Mechanism used to authenticate with the data source."
  data:
  - name: "None"
  - name: "ApiKey"
  - name: "OAuth2"
  - name: "BasicAuth"
  - name: "IAMRole"
- name: "OSType"
  description: "Operating system or runtime environment where the agent runs."
  data:
  - name: "Linux"
  - name: "Windows"
  - name: "Container"
  - name: "KubernetesNode"
  - name: "MacOS"
- name: "AgentStatus"
  description: "Health and connectivity state of a monitoring agent."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Degraded"
  - name: "Unknown"
- name: "ResourceType"
  description: "Classification of monitored targets within the estate."
  data:
  - name: "Host"
  - name: "Container"
  - name: "Pod"
  - name: "Cluster"
  - name: "Service"
  - name: "Database"
  - name: "Queue"
  - name: "LoadBalancer"
  - name: "Function"
- name: "EnvironmentType"
  description: "Operational context for a monitored resource."
  data:
  - name: "Production"
  - name: "Staging"
  - name: "Testing"
  - name: "Development"
- name: "MetricUnit"
  description: "Units used to interpret metric values."
  data:
  - name: "Count"
  - name: "Percent"
  - name: "Seconds"
  - name: "Milliseconds"
  - name: "Bytes"
  - name: "BitsPerSecond"
  - name: "RequestsPerSecond"
  - name: "Celsius"
- name: "SamplingType"
  description: "Statistical nature of how a metric is sampled or accumulated."
  data:
  - name: "Gauge"
  - name: "Counter"
  - name: "Histogram"
  - name: "Summary"
- name: "AggregationType"
  description: "Function used to combine metric samples over time or dimensions."
  data:
  - name: "Avg"
  - name: "Sum"
  - name: "Min"
  - name: "Max"
  - name: "P95"
  - name: "P99"
  - name: "Rate"
- name: "Comparator"
  description: "Operator used to compare metric values against thresholds."
  data:
  - name: "GreaterThan"
  - name: "GreaterThanOrEqual"
  - name: "LessThan"
  - name: "LessThanOrEqual"
  - name: "Equal"
  - name: "NotEqual"
- name: "AlertSeverity"
  description: "Importance level used to prioritize alerts."
  data:
  - name: "Critical"
  - name: "High"
  - name: "Medium"
  - name: "Low"
  - name: "Info"
- name: "AlertStatus"
  description: "Lifecycle state of an alert event."
  data:
  - name: "Firing"
  - name: "Acknowledged"
  - name: "Resolved"
  - name: "Suppressed"
- name: "ChannelType"
  description: "Kind of destination used for alert delivery."
  data:
  - name: "Email"
  - name: "Slack"
  - name: "PagerDuty"
  - name: "Webhook"
  - name: "SMS"
  - name: "Teams"
- name: "DeliveryStatus"
  description: "Outcome of attempting to deliver a notification."
  data:
  - name: "Sent"
  - name: "Queued"
  - name: "Failed"
  - name: "Suppressed"
- name: "DashboardLayoutType"
  description: "Strategy for placing and sizing widgets on a dashboard."
  data:
  - name: "Freeform"
  - name: "Grid"
- name: "WidgetType"
  description: "High-level template dictating data structure and interactions for\
    \ a widget."
  data:
  - name: "TimeSeries"
  - name: "SingleStat"
  - name: "Heatmap"
  - name: "Table"
  - name: "Gauge"
- name: "VisualizationType"
  description: "Rendering style applied to widget data."
  data:
  - name: "Line"
  - name: "Area"
  - name: "Bar"
  - name: "Pie"
  - name: "Gauge"
- name: "CheckType"
  description: "Mode of active probing used by a synthetic monitor."
  data:
  - name: "HTTP"
  - name: "Ping"
  - name: "TCP"
  - name: "DNS"
  - name: "TLS"
- name: "CheckResult"
  description: "Outcome classification for a synthetic run."
  data:
  - name: "Success"
  - name: "Failure"
  - name: "Degraded"
- name: "MaintenanceScope"
  description: "Coverage of assets or policies affected by a maintenance window."
  data:
  - name: "AllPolicies"
  - name: "SpecificPolicies"
  - name: "SpecificResources"
  - name: "Workspace"
- name: "MaintenanceStatus"
  description: "Execution state of a maintenance window."
  data:
  - name: "Scheduled"
  - name: "InProgress"
  - name: "Completed"
  - name: "Cancelled"
- name: "SLOType"
  description: "Category of service objective being targeted."
  data:
  - name: "Availability"
  - name: "Latency"
  - name: "ErrorRate"
  - name: "Throughput"
- name: "SLOPeriod"
  description: "Time horizon used for evaluating SLO compliance."
  data:
  - name: "SevenDays"
  - name: "ThirtyDays"
  - name: "NinetyDays"
  - name: "CalendarMonth"
- name: "ErrorBudgetStatus"
  description: "Health of the remaining error budget within the evaluation period."
  data:
  - name: "Healthy"
  - name: "Warning"
  - name: "Exhausted"
valueObjects:
- name: "Url"
  description: "Absolute network location including scheme and host."
  data:
  - name: "value"
    type: "String"
- name: "Duration"
  description: "Length of time expressed in ISO-8601 or human-readable format."
  data:
  - name: "iso8601"
    type: "String"
- name: "QueryString"
  description: "Persisted query used to retrieve or compute monitoring data."
  data:
  - name: "value"
    type: "String"
- name: "Schedule"
  description: "Recurrence pattern defining when a task should run."
  data:
  - name: "cron"
    type: "String"
  - name: "timezone"
    type: "String"
- name: "MetricSelector"
  description: "Expression identifying a metric and optional label matchers."
  data:
  - name: "expression"
    type: "String"
- name: "ResourceFilter"
  description: "Predicate string that narrows evaluation to matching resources."
  data:
  - name: "expression"
    type: "String"
