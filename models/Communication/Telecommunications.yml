---
entities:
- name: "Operator_"
  description: "Legal entity that owns network assets and markets telecommunications\
    \ services to customers."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  - name: "mcc"
    type: "String"
  - name: "mnc"
    type: "String"
  relations:
  - name: "brands"
    type: "Brand"
    multiplicity: "OneToMany"
  - name: "networkDomains"
    type: "NetworkDomain"
    multiplicity: "OneToMany"
  - name: "retailOutlets"
    type: "RetailOutlet"
    multiplicity: "OneToMany"
  - name: "interconnectAgreements"
    type: "InterconnectAgreement"
    multiplicity: "OneToMany"
  - name: "roamingAgreements"
    type: "RoamingAgreement"
    multiplicity: "OneToMany"
  - name: "partners"
    type: "PartnerCarrier"
    multiplicity: "ManyToMany"
- name: "Brand"
  description: "Commercial brand under which the operator sells services."
  data:
