metadata:
  name: "Telecommunications Industry Domain Model"
  description: "HCIDL model capturing core telecommunications operator, product, subscription,\
    \ network, billing, and service management capabilities."
  version: "1.0.0"
  industry: "Telecommunications"
  category: "Communication"
  language: "en-US"
  type: "Industry"
  domain: "Telecommunications"
enums:
- name: "TelcoMarketSegment"
  description: "Market focus of a telco brand."
  data:
  - name: "Consumer"
  - name: "Business"
  - name: "Wholesale"
  - name: "IoT"
- name: "ServiceType"
  description: "Category of telecommunications service provided to the customer."
  data:
  - name: "MobileVoice"
  - name: "MobileData"
  - name: "SMS"
  - name: "FixedBroadband"
  - name: "VoIP"
  - name: "IPTV"
  - name: "IoTConnectivity"
- name: "ChargingType"
  description: "Primary charging modality for the plan."
  data:
  - name: "Prepaid"
  - name: "Postpaid"
- name: "UsageType"
  description: "Type of usage event used for rating and charging."
  data:
  - name: "Voice"
  - name: "SMS"
  - name: "Data"
  - name: "Roaming"
  - name: "International"
- name: "UsageUnit"
  description: "Units used to measure allowances and usage."
  data:
  - name: "Minute"
  - name: "Message"
  - name: "Megabyte"
  - name: "Gigabyte"
- name: "RolloverPolicy"
  description: "Policy governing carry-over of unused allowances."
  data:
  - name: "None"
  - name: "Limited"
  - name: "Unlimited"
- name: "AddOnType"
  description: "Classification of add-on features."
  data:
  - name: "ExtraData"
  - name: "InternationalCalling"
  - name: "RoamingPack"
  - name: "Voicemail"
  - name: "StaticIP"
  - name: "ContentBundle"
- name: "CustomerType"
  description: "Classification of the customer entity."
  data:
  - name: "Individual"
  - name: "Business"
  - name: "Government"
  - name: "Wholesale"
- name: "AccountType"
  description: "Type of commercial account."
  data:
  - name: "Individual"
  - name: "Corporate"
  - name: "Wholesale"
- name: "AccountStatus"
  description: "Lifecycle state of an account."
  data:
  - name: "Prospect"
  - name: "Active"
  - name: "Suspended"
  - name: "Closed"
- name: "SIMType"
  description: "Physical form of the subscriber identity module."
  data:
  - name: "Physical"
  - name: "eSIM"
- name: "SIMStatus"
  description: "Lifecycle state of a SIM."
  data:
  - name: "Inventory"
  - name: "Active"
  - name: "Suspended"
  - name: "Retired"
- name: "SubscriptionStatus"
  description: "Lifecycle state of a subscription."
  data:
  - name: "PendingActivation"
  - name: "Active"
  - name: "Suspended"
  - name: "Cancelled"
  - name: "PortedOut"
- name: "DeviceType"
  description: "Category of customer equipment."
  data:
  - name: "Smartphone"
  - name: "Tablet"
  - name: "Router"
  - name: "Wearable"
  - name: "IoTModule"
- name: "NumberType"
  description: "Kind of telephone number."
  data:
  - name: "MSISDN"
  - name: "TollFree"
  - name: "ShortCode"
