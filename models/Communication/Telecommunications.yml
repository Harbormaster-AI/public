    multiplicity: "OneToOne"
  - name: "services"
    type: "ServiceInstance"
    multiplicity: "OneToMany"
  - name: "apns"
    type: "APN"
    multiplicity: "ManyToMany"
  - name: "qosProfile"
    type: "QoSProfile"
    multiplicity: "ManyToOne"
  - name: "ipLeases"
    type: "IPLease"
    multiplicity: "OneToMany"
  - name: "usageRecords"
    type: "UsageRecord"
    multiplicity: "OneToMany"
- name: "SIM"
