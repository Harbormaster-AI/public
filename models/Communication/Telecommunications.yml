  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "orders"
    type: "ServiceOrder"
    multiplicity: "OneToMany"
  - name: "retailOutlet"
    type: "RetailOutlet"
    multiplicity: "ManyToOne"
- name: "ServiceOrder"
