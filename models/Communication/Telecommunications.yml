    type: "String"
  - name: "marketSegment"
    type: "TelcoMarketSegment"
  relations:
  - name: "operator_"
    type: "Operator_"
    multiplicity: "ManyToOne"
  - name: "productCatalogs"
    type: "ProductCatalog"
    multiplicity: "OneToMany"
  - name: "retailOutlets"
    type: "RetailOutlet"
    multiplicity: "OneToMany"
- name: "ProductCatalog"
  description: "Versioned catalog of marketable offerings."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  relations:
  - name: "brand"
    type: "Brand"
    multiplicity: "ManyToOne"
  - name: "offerings"
    type: "ProductOffering"
    multiplicity: "OneToMany"
- name: "ProductOffering"
  description: "Market-facing product that bundles services, plans, and add-ons."
  data:
  - name: "name"
    type: "String"
  - name: "serviceType"
    type: "ServiceType"
  - name: "description"
    type: "String"
  relations:
  - name: "catalog"
    type: "ProductCatalog"
    multiplicity: "ManyToOne"
  - name: "plans"
    type: "TariffPlan"
    multiplicity: "OneToMany"
  - name: "addOns"
    type: "AddOn"
    multiplicity: "ManyToMany"
- name: "TariffPlan"
  description: "Commercial plan defining pricing, charging model, term, and included\
    \ allowances."
  data:
  - name: "name"
    type: "String"
  - name: "chargingType"
    type: "ChargingType"
  - name: "contractTermMonths"
    type: "Integer"
  - name: "basePrice"
    type: "Money"
  relations:
  - name: "offering"
    type: "ProductOffering"
    multiplicity: "ManyToOne"
  - name: "allowances"
    type: "Allowance"
    multiplicity: "OneToMany"
  - name: "addOns"
    type: "AddOn"
    multiplicity: "ManyToMany"
- name: "Allowance"
  description: "Included usage entitlement within a plan expressed in standardized\
    \ units."
  data:
  - name: "allowanceType"
    type: "UsageType"
  - name: "includedUnits"
    type: "Decimal"
  - name: "unit"
    type: "UsageUnit"
  - name: "rolloverPolicy"
    type: "RolloverPolicy"
  relations:
  - name: "tariffPlan"
    type: "TariffPlan"
    multiplicity: "ManyToOne"
- name: "AddOn"
  description: "Optional chargeable feature that augments a base plan."
  data:
  - name: "name"
    type: "String"
  - name: "addOnType"
    type: "AddOnType"
  - name: "price"
    type: "Money"
  relations:
  - name: "offerings"
    type: "ProductOffering"
    multiplicity: "ManyToMany"
  - name: "tariffPlans"
    type: "TariffPlan"
    multiplicity: "ManyToMany"
- name: "Customer"
