---
metadata:
  name: "Alerting HCIDL Model"
  description: "Capability model for defining, generating, routing, and managing operational\
    \ alerts across communication channels."
  version: "1.0.0"
  industry: "Software"
  category: "Communication"
  type: "Capability"
  domain: "Alerting"
entities:
- name: "MonitoredService"
  description: "Application or component that is monitored and for which alerts may\
    \ be generated."
  data:
  - name: "name"
    type: "String"
  - name: "environment"
    type: "Environment"
  - name: "serviceTier"
    type: "ServiceTier"
  - name: "ownerTeam"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "alertPolicies"
    type: "AlertPolicy"
    multiplicity: "OneToMany"
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "OneToMany"
  - name: "integrations"
    type: "Integration"
    multiplicity: "OneToMany"
  - name: "incidents"
    type: "Incident"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "maintenanceWindows"
    type: "MaintenanceWindow"
    multiplicity: "ManyToMany"
  - name: "escalationPolicy"
    type: "EscalationPolicy"
    multiplicity: "ManyToOne"
- name: "AlertPolicy"
  description: "Policy describing alert lifecycle behavior, routing, deduplication,\
    \ and resolution rules."
  data:
  - name: "name"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  - name: "defaultSeverity"
    type: "Severity"
  - name: "autoResolveAfter"
    type: "IsoDuration"
  - name: "deduplicationWindow"
    type: "IsoDuration"
  - name: "description"
    type: "String"
  relations:
  - name: "service"
    type: "MonitoredService"
    multiplicity: "ManyToOne"
  - name: "escalationPolicy"
    type: "EscalationPolicy"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "AlertRule"
    multiplicity: "OneToMany"
  - name: "suppressionRules"
    type: "SuppressionRule"
    multiplicity: "OneToMany"
  - name: "routingRules"
    type: "RoutingRule"
    multiplicity: "OneToMany"
  - name: "templates"
    type: "MessageTemplate"
    multiplicity: "ManyToMany"
  - name: "maintenanceWindows"
    type: "MaintenanceWindow"
    multiplicity: "ManyToMany"
- name: "AlertRule"
  description: "Condition set that evaluates signals and triggers alerts when criteria\
    \ are met."
  data:
  - name: "name"
    type: "String"
  - name: "query"
    type: "String"
  - name: "matchType"
    type: "MatchType"
  - name: "aggregation"
    type: "AggregationFunction"
  - name: "operator_"
    type: "ConditionOperator"
  - name: "threshold"
    type: "Decimal"
  - name: "evaluationWindow"
    type: "IsoDuration"
  - name: "samplingInterval"
    type: "IsoDuration"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "policy"
    type: "AlertPolicy"
    multiplicity: "ManyToOne"
  - name: "service"
    type: "MonitoredService"
    multiplicity: "ManyToOne"
  - name: "integration"
    type: "Integration"
    multiplicity: "ManyToOne"
  - name: "maintenanceWindows"
    type: "MaintenanceWindow"
    multiplicity: "ManyToMany"
- name: "Alert"
  description: "Instance of a triggered alert generated from a rule evaluation."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "severity"
    type: "Severity"
  - name: "status"
    type: "AlertStatus"
  - name: "startedAt"
    type: "Date"
  - name: "endedAt"
    type: "Date"
  - name: "deduplicationKey"
    type: "String"
  - name: "sourceEventKey"
    type: "String"
  relations:
  - name: "rule"
    type: "AlertRule"
    multiplicity: "ManyToOne"
  - name: "service"
    type: "MonitoredService"
    multiplicity: "ManyToOne"
  - name: "incident"
    type: "Incident"
    multiplicity: "ManyToOne"
  - name: "notifications"
    type: "Notification"
    multiplicity: "OneToMany"
  - name: "acknowledgements"
    type: "Acknowledgement"
    multiplicity: "OneToMany"
- name: "Incident"
  description: "Aggregated operational event representing the broader impact of one\
    \ or more related alerts."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "IncidentStatus"
  - name: "severity"
    type: "Severity"
  - name: "impactScore"
    type: "Integer"
  - name: "openedAt"
    type: "Date"
  - name: "resolvedAt"
    type: "Date"
  - name: "summary"
    type: "String"
  relations:
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "commander"
    type: "Responder"
    multiplicity: "ManyToOne"
  - name: "service"
    type: "MonitoredService"
    multiplicity: "ManyToOne"
- name: "Acknowledgement"
  description: "Confirmation by a responder that an alert has been seen and is being\
    \ worked."
  data:
  - name: "acknowledgedAt"
    type: "Date"
  - name: "comment"
    type: "String"
  relations:
  - name: "alert"
    type: "Alert"
    multiplicity: "ManyToOne"
  - name: "responder"
    type: "Responder"
    multiplicity: "ManyToOne"
- name: "EscalationPolicy"
  description: "Ordered set of steps defining whom to notify and when if an alert\
    \ remains unaddressed."
  data:
  - name: "name"
    type: "String"
  - name: "repeatCount"
    type: "Integer"
  - name: "autoCloseAfter"
    type: "IsoDuration"
  - name: "description"
    type: "String"
  relations:
  - name: "steps"
    type: "EscalationStep"
    multiplicity: "OneToMany"
  - name: "services"
    type: "MonitoredService"
    multiplicity: "OneToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
- name: "EscalationStep"
  description: "Individual escalation action with a delay and targets to notify."
  data:
  - name: "stepOrder"
    type: "Integer"
  - name: "delayBeforeAction"
    type: "IsoDuration"
  - name: "actionType"
    type: "EscalationActionType"
  - name: "notifyAll"
    type: "Boolean"
  relations:
  - name: "escalationPolicy"
    type: "EscalationPolicy"
    multiplicity: "ManyToOne"
  - name: "targets"
    type: "Responder"
    multiplicity: "ManyToMany"
  - name: "channels"
    type: "DeliveryChannel"
    multiplicity: "ManyToMany"
- name: "Responder"
  description: "Person, team representative, or schedule target that can receive and\
    \ act on alerts."
  data:
  - name: "displayName"
    type: "String"
  - name: "responderType"
    type: "ResponderType"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "timeZone"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "onCallSchedules"
    type: "OnCallSchedule"
    multiplicity: "ManyToMany"
  - name: "contactPreferences"
    type: "ContactPreference"
    multiplicity: "OneToMany"
  - name: "acknowledgements"
    type: "Acknowledgement"
    multiplicity: "OneToMany"
  - name: "notifications"
    type: "Notification"
    multiplicity: "OneToMany"
- name: "Team"
  description: "Group of responders responsible for a set of services and alert handling."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "defaultChannel"
    type: "ChannelType"
  relations:
  - name: "responders"
    type: "Responder"
    multiplicity: "OneToMany"
  - name: "onCallSchedules"
    type: "OnCallSchedule"
    multiplicity: "OneToMany"
  - name: "escalationPolicies"
    type: "EscalationPolicy"
    multiplicity: "ManyToMany"
  - name: "channels"
    type: "DeliveryChannel"
    multiplicity: "ManyToMany"
- name: "OnCallSchedule"
  description: "Calendar and rotation configuration defining who is on duty to receive\
    \ escalations."
  data:
  - name: "name"
    type: "String"
  - name: "rotationType"
    type: "ScheduleRotationType"
  - name: "timeZone"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "horizonDays"
    type: "Integer"
  relations:
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "rotations"
    type: "OnCallRotation"
    multiplicity: "OneToMany"
  - name: "overrides"
    type: "OnCallOverride"
    multiplicity: "OneToMany"
  - name: "participants"
    type: "Responder"
    multiplicity: "ManyToMany"
- name: "OnCallRotation"
  description: "Rotating assignment segment determining the order and duration of\
    \ on-call participants."
  data:
  - name: "name"
    type: "String"
  - name: "shiftDuration"
    type: "IsoDuration"
  - name: "handoffTime"
    type: "String"
  relations:
  - name: "schedule"
    type: "OnCallSchedule"
    multiplicity: "ManyToOne"
  - name: "participants"
    type: "Responder"
    multiplicity: "ManyToMany"
- name: "OnCallOverride"
  description: "Temporary adjustment to on-call coverage for a specific time range."
  data:
  - name: "start"
    type: "Date"
  - name: "end"
    type: "Date"
  - name: "reason"
    type: "String"
  relations:
  - name: "schedule"
    type: "OnCallSchedule"
    multiplicity: "ManyToOne"
  - name: "assignee"
    type: "Responder"
    multiplicity: "ManyToOne"
- name: "ContactPreference"
  description: "Preferred contact method and ordering for notifying a responder."
  data:
  - name: "channelType"
    type: "ChannelType"
  - name: "priority"
    type: "Integer"
  - name: "throttleWindow"
    type: "IsoDuration"
  - name: "destination"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "responder"
    type: "Responder"
    multiplicity: "ManyToOne"
- name: "DeliveryChannel"
  description: "Configured communication channel and provider used to send notifications."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "endpoint"
    type: "Url"
  - name: "providerName"
    type: "String"
  - name: "rateLimit"
    type: "RateLimit"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "notifications"
    type: "Notification"
    multiplicity: "OneToMany"
- name: "Notification"
  description: "Outbound message sent to a destination in response to an alert or\
    \ escalation."
  data:
  - name: "sentAt"
    type: "Date"
  - name: "status"
    type: "NotificationStatus"
  - name: "subject"
    type: "String"
  - name: "bodyFormat"
    type: "TemplateFormat"
  - name: "body"
    type: "String"
  - name: "destination"
    type: "String"
  relations:
  - name: "alert"
    type: "Alert"
    multiplicity: "ManyToOne"
  - name: "recipient"
    type: "Responder"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "DeliveryChannel"
    multiplicity: "ManyToOne"
  - name: "template"
    type: "MessageTemplate"
    multiplicity: "ManyToOne"
- name: "MessageTemplate"
  description: "Reusable subject and body patterns for alert notifications across\
    \ channels."
  data:
  - name: "name"
    type: "String"
  - name: "format"
    type: "TemplateFormat"
  - name: "language"
    type: "String"
  - name: "subjectTemplate"
    type: "String"
  - name: "bodyTemplate"
    type: "String"
  relations:
  - name: "policies"
    type: "AlertPolicy"
    multiplicity: "ManyToMany"
  - name: "channels"
    type: "DeliveryChannel"
    multiplicity: "ManyToMany"
- name: "RoutingRule"
  description: "Decision rule that evaluates alert attributes and routes notifications\
    \ to destinations."
  data:
  - name: "name"
    type: "String"
  - name: "matchType"
    type: "MatchType"
  - name: "expression"
    type: "String"
  - name: "destination"
    type: "RoutingDestinationType"
  - name: "setSeverity"
    type: "Severity"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "policy"
    type: "AlertPolicy"
    multiplicity: "ManyToOne"
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "DeliveryChannel"
    multiplicity: "ManyToOne"
- name: "SuppressionRule"
  description: "Criteria and time bounds to mute, throttle, or deduplicate alerts."
  data:
  - name: "name"
    type: "String"
  - name: "suppressionType"
    type: "SuppressionType"
  - name: "reason"
    type: "String"
  - name: "active"
    type: "Boolean"
  - name: "timeRange"
    type: "TimeRange"
  - name: "matchExpression"
    type: "String"
  relations:
  - name: "policy"
    type: "AlertPolicy"
    multiplicity: "ManyToOne"
  - name: "service"
    type: "MonitoredService"
    multiplicity: "ManyToOne"
- name: "MaintenanceWindow"
  description: "Defined period in which alerting is adjusted or silenced for services\
    \ or rules."
  data:
  - name: "name"
    type: "String"
  - name: "windowType"
    type: "MaintenanceWindowType"
  - name: "description"
    type: "String"
  - name: "timeRange"
    type: "TimeRange"
  relations:
  - name: "services"
    type: "MonitoredService"
    multiplicity: "ManyToMany"
  - name: "policies"
    type: "AlertPolicy"
    multiplicity: "ManyToMany"
  - name: "rules"
    type: "AlertRule"
    multiplicity: "ManyToMany"
- name: "Integration"
  description: "Configuration for ingesting signals or events from external monitoring\
    \ systems."
  data:
  - name: "name"
    type: "String"
  - name: "integrationType"
    type: "IntegrationType"
  - name: "endpoint"
    type: "Url"
  - name: "credential"
    type: "ApiCredential"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "service"
    type: "MonitoredService"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "AlertRule"
    multiplicity: "OneToMany"
enums:
- name: "Severity"
  description: "Relative importance and urgency of an alert or incident."
  data:
  - name: "Critical"
  - name: "High"
  - name: "Medium"
  - name: "Low"
  - name: "Info"
- name: "AlertStatus"
  description: "Lifecycle state of an alert from creation to closure."
  data:
  - name: "Open"
  - name: "Acknowledged"
  - name: "Resolved"
  - name: "Suppressed"
  - name: "Closed"
- name: "IncidentStatus"
  description: "State of an incident representing broader operational impact."
  data:
  - name: "Open"
  - name: "Mitigated"
  - name: "Resolved"
  - name: "Closed"
- name: "ChannelType"
  description: "Communication mediums available for delivering notifications."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "Push"
  - name: "Chat"
  - name: "Voice"
  - name: "Webhook"
- name: "TemplateFormat"
  description: "Content format for rendering notification messages."
  data:
  - name: "Text"
  - name: "HTML"
  - name: "Markdown"
- name: "MatchType"
  description: "Logical mode for evaluating multiple conditions within a rule."
  data:
  - name: "Any"
  - name: "All"
- name: "AggregationFunction"
  description: "Statistic applied to signals over an evaluation window."
  data:
  - name: "Avg"
  - name: "Sum"
  - name: "Min"
  - name: "Max"
  - name: "Count"
  - name: "P95"
  - name: "P99"
- name: "ConditionOperator"
  description: "Comparator applied to aggregated values or event attributes."
  data:
  - name: "GreaterThan"
  - name: "GreaterThanOrEqual"
  - name: "LessThan"
  - name: "LessThanOrEqual"
  - name: "EqualTo"
  - name: "NotEqualTo"
  - name: "IncreasesBy"
  - name: "DecreasesBy"
  - name: "MatchesRegex"
  - name: "Absent"
- name: "EscalationActionType"
  description: "Action performed when an escalation step is executed."
  data:
  - name: "NotifyUser"
  - name: "NotifyTeam"
  - name: "NotifyChannel"
  - name: "CreateTicket"
  - name: "TriggerWebhook"
  - name: "AutoRemediate"
- name: "ScheduleRotationType"
  description: "Pattern used to rotate on-call coverage."
  data:
  - name: "Daily"
  - name: "Weekly"
  - name: "BiWeekly"
  - name: "Custom"
- name: "SuppressionType"
  description: "Mechanism used to reduce alert noise."
  data:
  - name: "Mute"
  - name: "Throttle"
  - name: "Deduplicate"
  - name: "TimeWindow"
- name: "MaintenanceWindowType"
  description: "Classification of a maintenance window that modifies alerting behavior."
  data:
  - name: "Planned"
  - name: "Emergency"
  - name: "Recurring"
- name: "IntegrationType"
  description: "Supported external systems for ingesting or evaluating signals."
  data:
  - name: "Prometheus"
  - name: "CloudWatch"
  - name: "Datadog"
  - name: "NewRelic"
  - name: "GrafanaAlerting"
  - name: "Zabbix"
  - name: "CustomWebhook"
- name: "ResponderType"
  description: "Kind of target that can receive notifications and take action."
  data:
  - name: "User"
  - name: "Team"
  - name: "Schedule"
- name: "NotificationStatus"
  description: "Delivery outcome for a sent notification."
  data:
  - name: "Pending"
  - name: "Sent"
  - name: "Delivered"
  - name: "Failed"
  - name: "Bounced"
  - name: "Read"
- name: "RoutingDestinationType"
  description: "Destination selected when a routing rule matches."
  data:
  - name: "Policy"
  - name: "Team"
  - name: "Channel"
  - name: "Silence"
  - name: "Incident"
- name: "Environment"
  description: "Deployment context for a monitored service."
  data:
  - name: "Production"
  - name: "Staging"
  - name: "Development"
  - name: "Testing"
- name: "ServiceTier"
  description: "Tier indicating business criticality of a service."
  data:
  - name: "Tier1"
  - name: "Tier2"
  - name: "Tier3"
valueObjects:
- name: "EmailAddress"
  description: "Structured representation of an email address for messaging."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "E.164-compliant phone number used for voice or SMS notifications."
  data:
  - name: "value"
    type: "String"
- name: "Url"
  description: "Absolute URL used for webhooks or provider endpoints."
  data:
  - name: "value"
    type: "String"
- name: "ApiCredential"
  description: "Reference to external provider credentials without storing raw secrets."
  data:
  - name: "keyId"
    type: "String"
  - name: "secretReference"
    type: "String"
- name: "RateLimit"
  description: "Constraints for outbound notification throughput."
  data:
  - name: "maxPerMinute"
    type: "Integer"
  - name: "burst"
    type: "Integer"
- name: "IsoDuration"
  description: "ISO 8601 duration string representing a period of time."
  data:
  - name: "value"
    type: "String"
- name: "TimeRange"
  description: "Bounded time interval used for silencing or scheduling."
  data:
  - name: "start"
    type: "Date"
  - name: "end"
    type: "Date"
