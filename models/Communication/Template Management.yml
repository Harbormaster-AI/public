---
metadata:
  name: "Template Management Capabilities Model"
  description: "Capability model for creating, organizing, localizing, approving,\
    \ publishing, and testing communication templates across channels."
  version: "1.0.0"
  industry: "Communications Technology"
  category: "Communication"
  type: "Capability"
  domain: "Template Management"
entities:
- name: "Workspace"
  description: "Administrative boundary that groups templates, assets, policies, and\
    \ related resources for a product, brand, or tenant."
  data:
  - name: "name"
    type: "String"
  - name: "key"
    type: "String"
  - name: "timezone"
    type: "String"
  relations:
  - name: "templates"
    type: "Template"
    multiplicity: "OneToMany"
  - name: "folders"
    type: "TemplateFolder"
    multiplicity: "OneToMany"
  - name: "snippets"
    type: "Snippet"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "ContentPolicy"
    multiplicity: "OneToMany"
  - name: "sampleDataSets"
    type: "SampleDataSet"
    multiplicity: "OneToMany"
  - name: "publications"
    type: "Publication"
    multiplicity: "OneToMany"
  - name: "eventMappings"
    type: "EventMapping"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "OneToMany"
- name: "Template"
  description: "Canonical communication blueprint that is versioned, localized, and\
    \ published to deliver messages across channels."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "TemplateCode"
  - name: "purpose"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "folder"
    type: "TemplateFolder"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "TemplateVersion"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "experiments"
    type: "TemplateExperiment"
    multiplicity: "OneToMany"
  - name: "usageRecords"
    type: "TemplateUsage"
    multiplicity: "OneToMany"
- name: "TemplateFolder"
  description: "Hierarchical container used to organize templates logically within\
    \ a workspace."
  data:
  - name: "name"
    type: "String"
  - name: "path"
    type: "String"
  - name: "summary"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "parentFolder"
    type: "TemplateFolder"
    multiplicity: "ManyToOne"
  - name: "subfolders"
    type: "TemplateFolder"
    multiplicity: "OneToMany"
  - name: "templates"
    type: "Template"
    multiplicity: "OneToMany"
- name: "TemplateVersion"
  description: "Immutable snapshot of a template’s content and configuration that\
    \ can be localized, approved, and published."
  data:
  - name: "versionLabel"
    type: "VersionLabel"
  - name: "status"
    type: "TemplateVersionStatus"
  - name: "templatingSyntax"
    type: "TemplatingSyntax"
  - name: "primaryChannel"
    type: "CommunicationChannel"
  - name: "contentFormat"
    type: "ContentFormat"
  - name: "defaultLocale"
    type: "LocaleCode"
  - name: "createdAt"
    type: "Date"
  - name: "lastModifiedAt"
    type: "Date"
  relations:
  - name: "template"
    type: "Template"
    multiplicity: "ManyToOne"
  - name: "variableDefinitions"
    type: "VariableDefinition"
    multiplicity: "OneToMany"
  - name: "localeVariants"
    type: "LocaleVariant"
    multiplicity: "OneToMany"
  - name: "snippets"
    type: "Snippet"
    multiplicity: "ManyToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "approvalRequests"
    type: "ApprovalRequest"
    multiplicity: "OneToMany"
  - name: "publications"
    type: "Publication"
    multiplicity: "OneToMany"
  - name: "renderingTests"
    type: "RenderingTest"
    multiplicity: "OneToMany"
- name: "LocaleVariant"
  description: "Localized rendition of a template version containing channel-appropriate\
    \ content for a specific locale."
  data:
  - name: "locale"
    type: "LocaleCode"
  - name: "contentFormat"
    type: "ContentFormat"
  - name: "subject"
    type: "SubjectLine"
  - name: "preheader"
    type: "PreheaderText"
  - name: "body"
    type: "String"
  relations:
  - name: "templateVersion"
    type: "TemplateVersion"
    multiplicity: "ManyToOne"
- name: "VariableDefinition"
  description: "Declared placeholder required by a template version with type, requirement,\
    \ and default behavior."
  data:
  - name: "name"
    type: "String"
  - name: "variableType"
    type: "VariableType"
  - name: "required"
    type: "Boolean"
  - name: "defaultValue"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "templateVersion"
    type: "TemplateVersion"
    multiplicity: "ManyToOne"
- name: "Snippet"
  description: "Reusable content fragment or partial that can be inserted into multiple\
    \ templates."
  data:
  - name: "name"
    type: "String"
  - name: "templatingSyntax"
    type: "TemplatingSyntax"
  - name: "contentFormat"
    type: "ContentFormat"
  - name: "body"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "usedByVersions"
    type: "TemplateVersion"
    multiplicity: "ManyToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
- name: "Asset"
  description: "Managed media or file artifact referenced by templates and snippets."
  data:
  - name: "name"
    type: "String"
  - name: "assetType"
    type: "AssetType"
  - name: "uri"
    type: "ResourceURI"
  - name: "contentType"
    type: "String"
  - name: "checksum"
    type: "Checksum"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "usedByVersions"
    type: "TemplateVersion"
    multiplicity: "ManyToMany"
- name: "Tag"
  description: "Taxonomic label used to classify templates and snippets for discovery\
    \ and governance."
  data:
  - name: "name"
    type: "String"
  - name: "color"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "templates"
    type: "Template"
    multiplicity: "ManyToMany"
  - name: "snippets"
    type: "Snippet"
    multiplicity: "ManyToMany"
- name: "ApprovalRequest"
  description: "Formal review request for a template version used to capture sign-off\
    \ before publication."
  data:
  - name: "requestedBy"
    type: "String"
  - name: "requestedAt"
    type: "Date"
  - name: "status"
    type: "ApprovalStatus"
  - name: "reviewerComments"
    type: "String"
  relations:
  - name: "templateVersion"
    type: "TemplateVersion"
    multiplicity: "ManyToOne"
- name: "Publication"
  description: "Release record that makes a template version available in a specific\
    \ environment and timeframe."
  data:
  - name: "environment"
    type: "Environment"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "isDefault"
    type: "Boolean"
  - name: "audience"
    type: "String"
  relations:
  - name: "templateVersion"
    type: "TemplateVersion"
    multiplicity: "ManyToOne"
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
- name: "EventMapping"
  description: "Association between a business event and a publication used to drive\
    \ message selection at runtime."
  data:
  - name: "eventKey"
    type: "String"
  - name: "eventDescription"
    type: "String"
  - name: "channel"
    type: "CommunicationChannel"
  relations:
  - name: "publication"
    type: "Publication"
    multiplicity: "ManyToOne"
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
- name: "SampleDataSet"
  description: "Curated example payload used to preview and validate templates during\
    \ development and testing."
  data:
  - name: "name"
    type: "String"
  - name: "payload"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "renderingTests"
    type: "RenderingTest"
    multiplicity: "OneToMany"
- name: "RenderingTest"
  description: "Execution result of rendering a template version with a sample data\
    \ set for a specific locale and channel."
  data:
  - name: "name"
    type: "String"
  - name: "locale"
    type: "LocaleCode"
  - name: "channel"
    type: "CommunicationChannel"
  - name: "status"
    type: "RenderTestStatus"
  - name: "renderedAt"
    type: "Date"
  - name: "errorMessage"
    type: "String"
  relations:
  - name: "templateVersion"
    type: "TemplateVersion"
    multiplicity: "ManyToOne"
  - name: "sampleDataSet"
    type: "SampleDataSet"
    multiplicity: "ManyToOne"
- name: "ContentPolicy"
  description: "Governance rule that constrains the content or structure of templates\
    \ for compliance and quality."
  data:
  - name: "name"
    type: "String"
  - name: "channel"
    type: "CommunicationChannel"
  - name: "ruleType"
    type: "PolicyRuleType"
  - name: "parameter"
    type: "String"
  - name: "severity"
    type: "PolicySeverity"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
- name: "TemplateExperiment"
  description: "Controlled test that compares multiple template versions to evaluate\
    \ performance against a hypothesis."
  data:
  - name: "name"
    type: "String"
  - name: "hypothesis"
    type: "String"
  - name: "allocationPercentA"
    type: "Integer"
  - name: "allocationPercentB"
    type: "Integer"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "ExperimentStatus"
  relations:
  - name: "template"
    type: "Template"
    multiplicity: "ManyToOne"
  - name: "versionA"
    type: "TemplateVersion"
    multiplicity: "ManyToOne"
  - name: "versionB"
    type: "TemplateVersion"
    multiplicity: "ManyToOne"
- name: "TemplateUsage"
  description: "Aggregated metrics that summarize how often and where a template is\
    \ invoked."
  data:
  - name: "usageCount"
    type: "Integer"
  - name: "lastUsedAt"
    type: "Date"
  - name: "lastChannel"
    type: "CommunicationChannel"
  relations:
  - name: "template"
    type: "Template"
    multiplicity: "ManyToOne"
  - name: "lastPublication"
    type: "Publication"
    multiplicity: "ManyToOne"
enums:
- name: "CommunicationChannel"
  description: "Delivery medium supported by templates and publications."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "Push"
  - name: "Chat"
  - name: "InApp"
  - name: "Voice"
- name: "ContentFormat"
  description: "Representation format used to store and render template content."
  data:
  - name: "HTML"
  - name: "PlainText"
  - name: "Markdown"
  - name: "JSON"
  - name: "XML"
  - name: "MJML"
  - name: "RichText"
- name: "TemplatingSyntax"
  description: "Interpolation and control-flow language used to express dynamic content."
  data:
  - name: "Liquid"
  - name: "Handlebars"
  - name: "Mustache"
  - name: "Velocity"
  - name: "FreeMarker"
- name: "VariableType"
  description: "Data type constraints applied to template variables."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime"
  - name: "Url"
  - name: "Email"
  - name: "Phone"
  - name: "Json"
- name: "TemplateVersionStatus"
  description: "Lifecycle state that governs editability and publication readiness\
    \ of a version."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Approved"
  - name: "Published"
  - name: "Deprecated"
  - name: "Archived"
- name: "Environment"
  description: "Runtime context where a publication is exposed."
  data:
  - name: "Development"
  - name: "Staging"
  - name: "Production"
- name: "ApprovalStatus"
  description: "Review outcome recorded for an approval request."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
  - name: "Cancelled"
- name: "RenderTestStatus"
  description: "Result classification produced by a rendering test."
  data:
  - name: "Passed"
  - name: "Failed"
  - name: "RenderingError"
  - name: "DataError"
- name: "PolicyRuleType"
  description: "Constraint category evaluated by a content policy."
  data:
  - name: "MaxLength"
  - name: "ProhibitedPhrase"
  - name: "AllowedDomains"
  - name: "RequiresUnsubscribeLink"
  - name: "NoExternalImages"
  - name: "MaxImageWeightKB"
  - name: "MaxSmsSegments"
- name: "PolicySeverity"
  description: "Enforcement strength applied when a policy is violated."
  data:
  - name: "Warning"
  - name: "Error"
- name: "AssetType"
  description: "Classification of managed assets referenced by templates."
  data:
  - name: "Image"
  - name: "Document"
  - name: "Icon"
  - name: "Stylesheet"
  - name: "TemplateArchive"
  - name: "Font"
- name: "ExperimentStatus"
  description: "Operational state governing allocation and analysis for an experiment."
  data:
  - name: "Planned"
  - name: "Running"
  - name: "Paused"
  - name: "Completed"
  - name: "Cancelled"
valueObjects:
- name: "TemplateCode"
  description: "Human-readable, unique code used to reference a template across systems."
  data:
  - name: "value"
    type: "String"
- name: "ResourceURI"
  description: "Address that locates an external or internal resource used by a template\
    \ or asset."
  data:
  - name: "value"
    type: "String"
- name: "Checksum"
  description: "Integrity descriptor for file content using a specific hashing algorithm."
  data:
  - name: "algorithm"
    type: "String"
  - name: "hash"
    type: "String"
- name: "LocaleCode"
  description: "BCP 47 style locale identifier used for selecting localized content."
  data:
  - name: "value"
    type: "String"
- name: "VersionLabel"
  description: "Semantic or human-friendly label identifying a specific template version."
  data:
  - name: "value"
    type: "String"
- name: "SubjectLine"
  description: "Short line of text displayed as the subject of a message where supported."
  data:
  - name: "value"
    type: "String"
- name: "PreheaderText"
  description: "Supplemental preview text shown by some clients after the subject\
    \ where supported."
  data:
  - name: "value"
    type: "String"
