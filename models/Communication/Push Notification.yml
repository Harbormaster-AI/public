---
metadata:
  name: "Push Notification HCIDL"
  description: "Canonical capabilities model for managing push notifications across\
    \ platforms, including registration, topics, templates, audience targeting, dispatch\
    \ orchestration, delivery tracking, engagement analytics, and user preferences."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Communication"
  type: "Capability"
  domain: "Push Notification"
entities:
- name: "Application"
  description: "Logical application integrating push notifications across one or more\
    \ platforms."
  data:
  - name: "name"
    type: "String"
  - name: "platform"
    type: "PushPlatform"
  - name: "bundleIdentifier"
    type: "String"
  - name: "defaultLocale"
    type: "String"
  - name: "defaultTimeZone"
    type: "String"
  relations:
  - name: "credentials"
    type: "PushProviderCredential"
    multiplicity: "OneToMany"
  - name: "topics"
    type: "NotificationTopic"
    multiplicity: "OneToMany"
  - name: "deviceRegistrations"
    type: "DeviceRegistration"
    multiplicity: "OneToMany"
  - name: "templates"
    type: "NotificationTemplate"
    multiplicity: "OneToMany"
  - name: "segments"
    type: "AudienceSegment"
    multiplicity: "OneToMany"
  - name: "dispatches"
    type: "PushDispatch"
    multiplicity: "OneToMany"
  - name: "deliveryPolicies"
    type: "DeliveryPolicy"
    multiplicity: "OneToMany"
  - name: "platformConfigurations"
    type: "PlatformConfiguration"
    multiplicity: "OneToMany"
  - name: "preferences"
    type: "NotificationPreference"
    multiplicity: "OneToMany"
  - name: "localizationResources"
    type: "LocalizationResource"
    multiplicity: "OneToMany"
- name: "PushProviderCredential"
  description: "Credentials and configuration required to authenticate and send via\
    \ an external push provider."
  data:
  - name: "providerType"
    type: "PushProvider"
  - name: "displayName"
    type: "String"
  - name: "key"
    type: "String"
  - name: "secret"
    type: "String"
  - name: "projectOrTeam"
    type: "String"
  - name: "certificate"
    type: "String"
  - name: "environment"
    type: "ProviderEnvironment"
  - name: "tokenAuth"
    type: "Boolean"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
- name: "DeviceRegistration"
  description: "Registered device or browser endpoint eligible to receive push notifications."
  data:
  - name: "token"
    type: "PushToken"
  - name: "platform"
    type: "PushPlatform"
  - name: "osVersion"
    type: "String"
  - name: "appVersion"
    type: "String"
  - name: "locale"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "status"
    type: "DeviceRegistrationStatus"
  - name: "installedAt"
    type: "DateTime"
  - name: "lastActiveAt"
    type: "DateTime"
  - name: "receiveMarketing"
    type: "Boolean"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "UserProfile"
    multiplicity: "ManyToOne"
  - name: "topics"
    type: "NotificationTopic"
    multiplicity: "ManyToMany"
  - name: "deliveries"
    type: "PushDelivery"
    multiplicity: "OneToMany"
  - name: "consentRecords"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
- name: "UserProfile"
  description: "End-user representation for targeting, consent, and preference management."
  data:
  - name: "externalUserRef"
    type: "String"
  - name: "locale"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "marketingOptIn"
    type: "Boolean"
  - name: "region"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  relations:
  - name: "deviceRegistrations"
    type: "DeviceRegistration"
    multiplicity: "OneToMany"
  - name: "segments"
    type: "AudienceSegment"
    multiplicity: "ManyToMany"
  - name: "preferences"
    type: "NotificationPreference"
    multiplicity: "OneToMany"
  - name: "engagementEvents"
    type: "EngagementEvent"
    multiplicity: "OneToMany"
  - name: "consentRecords"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
- name: "NotificationTopic"
  description: "Named category to which users and devices can subscribe to receive\
    \ specific notifications."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "description"
    type: "String"
  - name: "defaultOptIn"
    type: "Boolean"
  - name: "critical"
    type: "Boolean"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "subscribers"
    type: "UserProfile"
    multiplicity: "ManyToMany"
  - name: "deviceRegistrations"
    type: "DeviceRegistration"
    multiplicity: "ManyToMany"
  - name: "templates"
    type: "NotificationTemplate"
    multiplicity: "OneToMany"
- name: "AudienceSegment"
  description: "Rule-based or static cohort used to target notifications."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "isDynamic"
    type: "Boolean"
  - name: "filterExpression"
    type: "String"
  - name: "estimatedSize"
    type: "Integer"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "members"
    type: "UserProfile"
    multiplicity: "ManyToMany"
  - name: "dispatches"
    type: "PushDispatch"
    multiplicity: "ManyToMany"
- name: "NotificationTemplate"
  description: "Reusable, parameterized content and presentation options for push\
    \ notifications."
  data:
  - name: "name"
    type: "String"
  - name: "titleTemplate"
    type: "String"
  - name: "bodyTemplate"
    type: "String"
  - name: "dataPayloadTemplate"
    type: "String"
  - name: "image"
    type: "ImageReference"
  - name: "actionUrl"
    type: "Url"
  - name: "sound"
    type: "String"
  - name: "categoryKey"
    type: "String"
  - name: "badge"
    type: "Integer"
  - name: "priority"
    type: "PushPriority"
  - name: "timeToLiveSeconds"
    type: "Integer"
  - name: "collapseKey"
    type: "String"
  - name: "mutableContent"
    type: "Boolean"
  - name: "contentAvailable"
    type: "Boolean"
  - name: "format"
    type: "TemplateFormat"
  - name: "localizable"
    type: "Boolean"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "topics"
    type: "NotificationTopic"
    multiplicity: "ManyToMany"
  - name: "localizationResources"
    type: "LocalizationResource"
    multiplicity: "OneToMany"
- name: "PushNotification"
  description: "Fully rendered push content snapshot prepared for dispatch."
  data:
  - name: "title"
    type: "String"
  - name: "body"
    type: "String"
  - name: "dataPayload"
    type: "String"
  - name: "image"
    type: "ImageReference"
  - name: "actionUrl"
    type: "Url"
  - name: "sound"
    type: "String"
  - name: "categoryKey"
    type: "String"
  - name: "badge"
    type: "Integer"
  - name: "priority"
    type: "PushPriority"
  - name: "timeToLiveSeconds"
    type: "Integer"
  - name: "collapseKey"
    type: "String"
  - name: "mutableContent"
    type: "Boolean"
  - name: "contentAvailable"
    type: "Boolean"
  - name: "createdAt"
    type: "DateTime"
  relations:
  - name: "template"
    type: "NotificationTemplate"
    multiplicity: "ManyToOne"
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "dispatches"
    type: "PushDispatch"
    multiplicity: "OneToMany"
  - name: "deliveries"
    type: "PushDelivery"
    multiplicity: "OneToMany"
- name: "PushDispatch"
  description: "Execution plan that targets recipients and schedules the sending of\
    \ a push notification."
  data:
  - name: "requestedAt"
    type: "DateTime"
  - name: "scheduledAt"
    type: "DateTime"
  - name: "status"
    type: "DispatchStatus"
  - name: "dryRun"
    type: "Boolean"
  - name: "maxRecipients"
    type: "Integer"
  - name: "rateLimitPerSecond"
    type: "Integer"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "notification"
    type: "PushNotification"
    multiplicity: "ManyToOne"
  - name: "audienceSegments"
    type: "AudienceSegment"
    multiplicity: "ManyToMany"
  - name: "topics"
    type: "NotificationTopic"
    multiplicity: "ManyToMany"
  - name: "deviceRegistrations"
    type: "DeviceRegistration"
    multiplicity: "ManyToMany"
  - name: "deliveries"
    type: "PushDelivery"
    multiplicity: "OneToMany"
- name: "PushDelivery"
  description: "Per-device attempt to deliver a notification, including status and\
    \ provider feedback."
  data:
  - name: "providerMessageId"
    type: "String"
  - name: "status"
    type: "DeliveryStatus"
  - name: "sentAt"
    type: "DateTime"
  - name: "deliveredAt"
    type: "DateTime"
  - name: "failureCode"
    type: "String"
  - name: "failureReason"
    type: "String"
  - name: "retryCount"
    type: "Integer"
  - name: "expiryAt"
    type: "DateTime"
  relations:
  - name: "dispatch"
    type: "PushDispatch"
    multiplicity: "ManyToOne"
  - name: "deviceRegistration"
    type: "DeviceRegistration"
    multiplicity: "ManyToOne"
  - name: "notification"
    type: "PushNotification"
    multiplicity: "ManyToOne"
  - name: "engagementEvents"
    type: "EngagementEvent"
    multiplicity: "OneToMany"
- name: "EngagementEvent"
  description: "User interaction or device feedback associated with a delivered push."
  data:
  - name: "eventType"
    type: "EngagementType"
  - name: "eventTime"
    type: "DateTime"
  - name: "actionKey"
    type: "String"
  - name: "screen"
    type: "String"
  - name: "metadata"
    type: "String"
  relations:
  - name: "delivery"
    type: "PushDelivery"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "UserProfile"
    multiplicity: "ManyToOne"
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
- name: "NotificationPreference"
  description: "User-level push settings controlling eligibility, frequency, and quiet\
    \ hours."
  data:
  - name: "receivesPush"
    type: "Boolean"
  - name: "receivesMarketing"
    type: "Boolean"
  - name: "quietHours"
    type: "QuietHours"
  - name: "maxPerDay"
    type: "Integer"
  - name: "preferredHour"
    type: "Integer"
  relations:
  - name: "user"
    type: "UserProfile"
    multiplicity: "ManyToOne"
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "topic"
    type: "NotificationTopic"
    multiplicity: "ManyToOne"
- name: "DeliveryPolicy"
  description: "Application-level rules for prioritization, retry, deduplication,\
    \ and throttling."
  data:
  - name: "name"
    type: "String"
  - name: "defaultPriority"
    type: "PushPriority"
  - name: "defaultTtlSeconds"
    type: "Integer"
  - name: "throttlePerMinute"
    type: "Integer"
  - name: "retryEnabled"
    type: "Boolean"
  - name: "maxRetryAttempts"
    type: "Integer"
  - name: "deduplicationWindowSeconds"
    type: "Integer"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
- name: "PlatformConfiguration"
  description: "Platform-specific capabilities and payload constraints for a given\
    \ application."
  data:
  - name: "platform"
    type: "PushPlatform"
  - name: "soundSupport"
    type: "Boolean"
  - name: "imageSupport"
    type: "Boolean"
  - name: "richActionsSupport"
    type: "Boolean"
  - name: "maxPayloadBytes"
    type: "Integer"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
- name: "ConsentRecord"
  description: "Audit record of a user’s consent decision related to push communications."
  data:
  - name: "consentType"
    type: "ConsentType"
  - name: "granted"
    type: "Boolean"
  - name: "reason"
    type: "String"
  - name: "source"
    type: "String"
  - name: "recordedAt"
    type: "DateTime"
  relations:
  - name: "user"
    type: "UserProfile"
    multiplicity: "ManyToOne"
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "deviceRegistration"
    type: "DeviceRegistration"
    multiplicity: "ManyToOne"
- name: "LocalizationResource"
  description: "Localized string resource for parameterizing notification templates."
  data:
  - name: "locale"
    type: "LocaleCode"
  - name: "namespace"
    type: "String"
  - name: "key"
    type: "String"
  - name: "value"
    type: "String"
  relations:
  - name: "application"
    type: "Application"
    multiplicity: "ManyToOne"
  - name: "template"
    type: "NotificationTemplate"
    multiplicity: "ManyToOne"
enums:
- name: "PushPlatform"
  description: "Supported runtime platforms for push delivery."
  data:
  - name: "iOS"
  - name: "Android"
  - name: "Web"
  - name: "Windows"
- name: "PushProvider"
  description: "External push messaging providers."
  data:
  - name: "APNs"
  - name: "FCM"
  - name: "WebPush"
  - name: "HMS"
- name: "ProviderEnvironment"
  description: "Provider environment indicating sandbox or production usage."
  data:
  - name: "Sandbox"
  - name: "Production"
- name: "DeviceRegistrationStatus"
  description: "Lifecycle state of a device registration."
  data:
  - name: "Active"
  - name: "Disabled"
  - name: "Uninstalled"
  - name: "TokenInvalid"
  - name: "OptedOut"
- name: "PushPriority"
  description: "Delivery urgency influencing provider handling."
  data:
  - name: "High"
  - name: "Normal"
  - name: "Low"
- name: "DeliveryStatus"
  description: "State of a per-device delivery attempt."
  data:
  - name: "Queued"
  - name: "Sent"
  - name: "Delivered"
  - name: "Failed"
  - name: "Throttled"
  - name: "Expired"
  - name: "Unsubscribed"
  - name: "Dropped"
- name: "DispatchStatus"
  description: "Progress of a dispatch execution."
  data:
  - name: "Draft"
  - name: "Scheduled"
  - name: "Running"
  - name: "Paused"
  - name: "Completed"
  - name: "Cancelled"
  - name: "Failed"
- name: "EngagementType"
  description: "Type of user interaction or feedback event."
  data:
  - name: "Received"
  - name: "Opened"
  - name: "Clicked"
  - name: "Dismissed"
  - name: "Bounced"
  - name: "Converted"
- name: "TemplateFormat"
  description: "Authoring format for templated content."
  data:
  - name: "PlainText"
  - name: "RichText"
  - name: "Markdown"
- name: "ConsentType"
  description: "Purpose category for which consent is recorded."
  data:
  - name: "Operational"
  - name: "Marketing"
  - name: "ThirdParty"
  - name: "Analytics"
valueObjects:
- name: "PushToken"
  description: "Opaque device or browser endpoint token used for push delivery."
  data:
  - name: "value"
    type: "String"
- name: "Url"
  description: "HTTP or custom scheme destination used for deep linking or actions."
  data:
  - name: "value"
    type: "String"
- name: "ImageReference"
  description: "Reference to an image asset displayed with a notification."
  data:
  - name: "url"
    type: "String"
  - name: "altText"
    type: "String"
- name: "QuietHours"
  description: "Local-time window during which notifications should be suppressed."
  data:
  - name: "startLocalTime"
    type: "String"
  - name: "endLocalTime"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "days"
    type: "String"
- name: "LocaleCode"
  description: "BCP 47 language tag indicating locale for content rendering."
  data:
  - name: "value"
    type: "String"
