  - name: "MessageUpdated"
  - name: "MessageDeleted"
  - name: "ReactionAdded"
  - name: "ReactionRemoved"
  - name: "MemberJoined"
  - name: "MemberLeft"
  - name: "ChannelCreated"
  - name: "ChannelArchived"
- name: "PermissionType"
  description: "Discrete capability that can be controlled by policy."
  data:
  - name: "SendMessage"
  - name: "EditOwnMessage"
  - name: "DeleteAnyMessage"
  - name: "PinMessage"
  - name: "ManageMembers"
  - name: "ManageChannels"
  - name: "ManageIntegrations"
  - name: "ReadChannelHistory"
  - name: "CreatePrivateChannel"
  - name: "InviteUsers"
- name: "PermissionScope"
  description: "Context within which a permission applies."
  data:
  - name: "Workspace"
  - name: "Channel"
  - name: "Conversation"
  - name: "Message"
- name: "ActorType"
