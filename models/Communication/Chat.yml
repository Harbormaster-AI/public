---
metadata:
  name: "Chat"
  description: "HCIDL capabilities model for real-time chat, direct messaging, channels,\
    \ and collaboration features."
  version: "1.0.0"
  industry: "Software"
  category: "Communication"
  type: "Capability"
  domain: "Chat"
entities:
- name: "ChatWorkspace"
  description: "Logical tenant that groups users, channels, bots, and policies for\
    \ a chat deployment."
  data:
  - name: "name"
    type: "String"
  - name: "domain"
    type: "String"
  - name: "defaultLanguage"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "visibility"
    type: "WorkspaceVisibility"
  relations:
  - name: "owners"
    type: "UserAccount"
    multiplicity: "ManyToMany"
  - name: "members"
    type: "UserAccount"
    multiplicity: "ManyToMany"
  - name: "channels"
    type: "Channel"
    multiplicity: "OneToMany"
  - name: "bots"
    type: "Bot"
    multiplicity: "OneToMany"
  - name: "retentionPolicy"
    type: "RetentionPolicy"
    multiplicity: "ManyToOne"
  - name: "roles"
    type: "Role"
    multiplicity: "OneToMany"
  - name: "customEmoji"
    type: "CustomEmoji"
    multiplicity: "OneToMany"
  - name: "integrations"
    type: "Integration"
    multiplicity: "OneToMany"
- name: "UserAccount"
  description: "End user or service identity that participates in conversations and\
    \ channels."
  data:
  - name: "username"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "avatarUrl"
    type: "Url"
  - name: "presenceState"
    type: "PresenceState"
  - name: "locale"
    type: "Locale"
  - name: "about"
    type: "String"
  relations:
  - name: "workspaces"
    type: "ChatWorkspace"
    multiplicity: "ManyToMany"
  - name: "roles"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
  - name: "devices"
    type: "Device"
    multiplicity: "OneToMany"
  - name: "memberships"
    type: "Participant"
    multiplicity: "OneToMany"
  - name: "messages"
    type: "Message"
    multiplicity: "OneToMany"
  - name: "reactions"
    type: "Reaction"
    multiplicity: "OneToMany"
  - name: "presenceSessions"
    type: "PresenceSession"
    multiplicity: "OneToMany"
  - name: "notificationPreferences"
    type: "NotificationPreference"
    multiplicity: "OneToMany"
  - name: "moderationActions"
    type: "ModerationAction"
    multiplicity: "OneToMany"
- name: "Device"
  description: "Client device used to access chat, used for presence and delivery\
    \ logic."
  data:
  - name: "deviceType"
    type: "DeviceType"
  - name: "operatingSystem"
    type: "String"
  - name: "appVersion"
    type: "String"
  - name: "pushToken"
    type: "String"
  - name: "lastActiveAt"
    type: "Date"
  relations:
  - name: "user"
    type: "UserAccount"
    multiplicity: "ManyToOne"
- name: "Channel"
  description: "Topical or team-based room where members exchange messages."
  data:
  - name: "name"
    type: "String"
  - name: "topic"
    type: "String"
  - name: "purpose"
    type: "String"
  - name: "channelVisibility"
    type: "ChannelVisibility"
  - name: "slowModeIntervalSeconds"
    type: "Integer"
  - name: "isArchived"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "ChatWorkspace"
    multiplicity: "ManyToOne"
  - name: "participants"
    type: "Participant"
    multiplicity: "OneToMany"
  - name: "messages"
    type: "Message"
    multiplicity: "OneToMany"
  - name: "moderators"
    type: "UserAccount"
    multiplicity: "ManyToMany"
  - name: "pinnedMessages"
    type: "MessagePin"
    multiplicity: "OneToMany"
  - name: "retentionPolicy"
    type: "RetentionPolicy"
    multiplicity: "ManyToOne"
- name: "Conversation"
  description: "Private direct or group conversation outside of channels."
  data:
  - name: "title"
    type: "String"
  - name: "conversationType"
    type: "ConversationType"
  - name: "encryptionMode"
    type: "EncryptionMode"
  - name: "isMuted"
    type: "Boolean"
  - name: "createdAt"
    type: "Date"
  relations:
  - name: "participants"
    type: "Participant"
    multiplicity: "OneToMany"
  - name: "messages"
    type: "Message"
    multiplicity: "OneToMany"
  - name: "owner"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "retentionPolicy"
    type: "RetentionPolicy"
    multiplicity: "ManyToOne"
- name: "Participant"
  description: "Membership of a user within a channel or conversation with specific\
    \ roles and notification settings."
  data:
  - name: "role"
    type: "RoleType"
  - name: "joinDate"
    type: "Date"
  - name: "notificationLevel"
    type: "NotificationLevel"
  - name: "isMuted"
    type: "Boolean"
  relations:
  - name: "user"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "conversation"
    type: "Conversation"
    multiplicity: "ManyToOne"
- name: "Message"
  description: "Unit of communication posted by a user or bot into a channel, thread,\
    \ or conversation."
  data:
  - name: "sentAt"
    type: "Date"
  - name: "editedAt"
    type: "Date"
  - name: "messageType"
    type: "MessageType"
  - name: "bodyFormat"
    type: "MessageFormat"
  - name: "content"
    type: "TextContent"
  - name: "deliveryStatus"
    type: "DeliveryStatus"
  - name: "language"
    type: "String"
  relations:
  - name: "sender"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "conversation"
    type: "Conversation"
    multiplicity: "ManyToOne"
  - name: "thread"
    type: "Thread"
    multiplicity: "ManyToOne"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "reactions"
    type: "Reaction"
    multiplicity: "OneToMany"
  - name: "mentions"
    type: "Mention"
    multiplicity: "OneToMany"
  - name: "pins"
    type: "MessagePin"
    multiplicity: "OneToMany"
  - name: "readReceipts"
    type: "ReadReceipt"
    multiplicity: "OneToMany"
  - name: "deliveryReceipts"
    type: "DeliveryReceipt"
    multiplicity: "OneToMany"
- name: "Thread"
  description: "Discussion branch connected to a root message."
  data:
  - name: "state"
    type: "ThreadState"
  - name: "lastActivityAt"
    type: "Date"
  relations:
  - name: "rootMessage"
    type: "Message"
    multiplicity: "OneToOne"
  - name: "messages"
    type: "Message"
    multiplicity: "OneToMany"
  - name: "subscribers"
    type: "UserAccount"
    multiplicity: "ManyToMany"
- name: "Attachment"
  description: "File or media object linked to a message."
  data:
  - name: "name"
    type: "String"
  - name: "sizeBytes"
    type: "Integer"
  - name: "contentType"
    type: "String"
  - name: "attachmentType"
    type: "AttachmentType"
  - name: "url"
    type: "Url"
  - name: "thumbnailUrl"
    type: "Url"
  - name: "status"
    type: "MediaProcessingStatus"
  relations:
  - name: "message"
    type: "Message"
    multiplicity: "ManyToOne"
- name: "Reaction"
  description: "Lightweight response to a message using an emoji or symbol."
  data:
  - name: "emoji"
    type: "String"
  - name: "createdAt"
    type: "Date"
  relations:
  - name: "message"
    type: "Message"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "UserAccount"
    multiplicity: "ManyToOne"
- name: "Mention"
  description: "Reference to a user or channel within message content."
  data:
  - name: "offset"
    type: "Integer"
  - name: "length"
    type: "Integer"
  - name: "mentionType"
    type: "MentionType"
  relations:
  - name: "message"
    type: "Message"
    multiplicity: "ManyToOne"
  - name: "mentionedUser"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "mentionedChannel"
    type: "Channel"
    multiplicity: "ManyToOne"
- name: "MessagePin"
  description: "Pin highlighting an important message in a channel."
  data:
  - name: "reason"
    type: "String"
  - name: "pinnedAt"
    type: "Date"
  relations:
  - name: "message"
    type: "Message"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "pinnedBy"
    type: "UserAccount"
    multiplicity: "ManyToOne"
- name: "ReadReceipt"
  description: "Acknowledgement that a user has read a specific message."
  data:
  - name: "readAt"
    type: "Date"
  - name: "deviceType"
    type: "DeviceType"
  relations:
  - name: "message"
    type: "Message"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "Device"
    multiplicity: "ManyToOne"
- name: "DeliveryReceipt"
  description: "Indicator that a message was delivered to a device or client."
  data:
  - name: "deliveredAt"
    type: "Date"
  - name: "provider"
    type: "String"
  relations:
  - name: "message"
    type: "Message"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "Device"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "UserAccount"
    multiplicity: "ManyToOne"
- name: "Bot"
  description: "Automated participant that can process events and post messages."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "botType"
    type: "BotType"
  - name: "commandPrefix"
    type: "String"
  - name: "isEnabled"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "ChatWorkspace"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "integrations"
    type: "Integration"
    multiplicity: "OneToMany"
- name: "Integration"
  description: "Configurable connection to external systems for automation and data\
    \ exchange."
  data:
  - name: "name"
    type: "String"
  - name: "configurationJson"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "bot"
    type: "Bot"
    multiplicity: "ManyToOne"
  - name: "workspace"
    type: "ChatWorkspace"
    multiplicity: "ManyToOne"
  - name: "webhooks"
    type: "WebhookEndpoint"
    multiplicity: "OneToMany"
- name: "WebhookEndpoint"
  description: "Outbound HTTP endpoint used to deliver event notifications."
  data:
  - name: "url"
    type: "Url"
  - name: "secret"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  - name: "lastStatusCode"
    type: "Integer"
  relations:
  - name: "integration"
    type: "Integration"
    multiplicity: "ManyToOne"
  - name: "subscribedEventTypes"
    type: "EventTypeSubscription"
    multiplicity: "OneToMany"
- name: "EventTypeSubscription"
  description: "Declaration of an event type that a webhook endpoint should receive."
  data:
  - name: "eventType"
    type: "WebhookEventType"
  - name: "isEnabled"
    type: "Boolean"
  relations:
  - name: "webhook"
    type: "WebhookEndpoint"
    multiplicity: "ManyToOne"
- name: "ModerationRule"
  description: "Policy that detects and handles prohibited or risky content."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "ruleType"
    type: "ModerationRuleType"
  - name: "thresholdPerMinute"
    type: "Integer"
  - name: "actionOnMatch"
    type: "ModerationActionType"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "ChatWorkspace"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "UserAccount"
    multiplicity: "ManyToOne"
- name: "ModerationAction"
  description: "Action taken in response to a rule violation or report."
  data:
  - name: "actionType"
    type: "ModerationActionType"
  - name: "reason"
    type: "String"
  - name: "createdAt"
    type: "Date"
  - name: "durationMinutes"
    type: "Integer"
  relations:
  - name: "rule"
    type: "ModerationRule"
    multiplicity: "ManyToOne"
  - name: "message"
    type: "Message"
    multiplicity: "ManyToOne"
  - name: "targetUser"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "performedBy"
    type: "UserAccount"
    multiplicity: "ManyToOne"
- name: "ReportedContent"
  description: "User-submitted report about potentially inappropriate content."
  data:
  - name: "reasonCategory"
    type: "ReportReason"
  - name: "details"
    type: "String"
  - name: "reportedAt"
    type: "Date"
  - name: "status"
    type: "ReportStatus"
  relations:
  - name: "message"
    type: "Message"
    multiplicity: "ManyToOne"
  - name: "reporter"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "reviewedBy"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "actions"
    type: "ModerationAction"
    multiplicity: "OneToMany"
- name: "RetentionPolicy"
  description: "Rules governing how long messages and files are kept."
  data:
  - name: "policyType"
    type: "RetentionPolicyType"
  - name: "retentionDays"
    type: "Integer"
  - name: "allowOverrides"
    type: "Boolean"
  - name: "legalHold"
    type: "Boolean"
  relations:
  - name: "workspaces"
    type: "ChatWorkspace"
    multiplicity: "OneToMany"
  - name: "channels"
    type: "Channel"
    multiplicity: "OneToMany"
  - name: "conversations"
    type: "Conversation"
    multiplicity: "OneToMany"
- name: "Role"
  description: "Named set of permissions that can be assigned to users."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "roleType"
    type: "RoleType"
  relations:
  - name: "workspace"
    type: "ChatWorkspace"
    multiplicity: "ManyToOne"
  - name: "permissions"
    type: "PermissionGrant"
    multiplicity: "OneToMany"
  - name: "assignments"
    type: "RoleAssignment"
    multiplicity: "OneToMany"
- name: "Permission"
  description: "Atomic capability that can be granted to a role."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "permissionType"
    type: "PermissionType"
  relations:
  - name: "grants"
    type: "PermissionGrant"
    multiplicity: "OneToMany"
- name: "PermissionGrant"
  description: "Link between a role and a permission with a specific scope."
  data:
  - name: "scope"
    type: "PermissionScope"
  - name: "isAllowed"
    type: "Boolean"
  relations:
  - name: "role"
    type: "Role"
    multiplicity: "ManyToOne"
  - name: "permission"
    type: "Permission"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "conversation"
    type: "Conversation"
    multiplicity: "ManyToOne"
- name: "RoleAssignment"
  description: "Assignment of a role to a user within a workspace."
  data:
  - name: "assignedAt"
    type: "Date"
  relations:
  - name: "role"
    type: "Role"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "workspace"
    type: "ChatWorkspace"
    multiplicity: "ManyToOne"
- name: "NotificationPreference"
  description: "Per-user preferences controlling how notifications are delivered."
  data:
  - name: "notificationLevel"
    type: "NotificationLevel"
  - name: "muteUntil"
    type: "Date"
  - name: "sound"
    type: "String"
  - name: "pushEnabled"
    type: "Boolean"
  - name: "emailEnabled"
    type: "Boolean"
  relations:
  - name: "user"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "conversation"
    type: "Conversation"
    multiplicity: "ManyToOne"
- name: "PresenceSession"
  description: "Real-time status of a user on a specific device."
  data:
  - name: "state"
    type: "PresenceState"
  - name: "since"
    type: "Date"
  - name: "deviceType"
    type: "DeviceType"
  - name: "clientIp"
    type: "String"
  relations:
  - name: "user"
    type: "UserAccount"
    multiplicity: "ManyToOne"
- name: "AuditEvent"
  description: "Immutable record of significant actions for compliance and traceability."
  data:
  - name: "occurredAt"
    type: "Date"
  - name: "eventName"
    type: "String"
  - name: "actorType"
    type: "ActorType"
  - name: "details"
    type: "String"
  relations:
  - name: "workspace"
    type: "ChatWorkspace"
    multiplicity: "ManyToOne"
  - name: "actorUser"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "targetChannel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "targetConversation"
    type: "Conversation"
    multiplicity: "ManyToOne"
  - name: "targetMessage"
    type: "Message"
    multiplicity: "ManyToOne"
- name: "CustomEmoji"
  description: "Workspace-scoped emoji available for reactions and messages."
  data:
  - name: "shortcode"
    type: "String"
  - name: "imageUrl"
    type: "Url"
  - name: "isAnimated"
    type: "Boolean"
  - name: "createdAt"
    type: "Date"
  relations:
  - name: "workspace"
    type: "ChatWorkspace"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "UserAccount"
    multiplicity: "ManyToOne"
enums:
- name: "WorkspaceVisibility"
  description: "Exposure level of a workspace and how users can join."
  data:
  - name: "Private"
  - name: "Restricted"
  - name: "Open"
- name: "ConversationType"
  description: "Structure of a non-channel conversation."
  data:
  - name: "Direct"
  - name: "Group"
- name: "MessageType"
  description: "High-level classification of a message’s payload."
  data:
  - name: "Text"
  - name: "Image"
  - name: "File"
  - name: "System"
  - name: "Audio"
  - name: "Video"
  - name: "Location"
  - name: "Poll"
- name: "MessageFormat"
  description: "Markup or formatting model used for the message body."
  data:
  - name: "PlainText"
  - name: "Markdown"
  - name: "HTML"
- name: "DeliveryStatus"
  description: "Transport lifecycle state of a message."
