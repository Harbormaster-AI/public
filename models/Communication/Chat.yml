  - name: "Uploaded"
  - name: "Scanning"
  - name: "Ready"
  - name: "Blocked"
- name: "MentionType"
  description: "Target referenced by a mention."
  data:
  - name: "User"
  - name: "Channel"
  - name: "All"
  - name: "Here"
- name: "NotificationLevel"
  description: "Degree of alerting for new activity."
