  - name: "Online"
  - name: "Offline"
  - name: "Away"
  - name: "DoNotDisturb"
  - name: "Invisible"
- name: "RoleType"
  description: "Common role archetypes used for access control."
  data:
  - name: "Owner"
  - name: "Admin"
  - name: "Moderator"
  - name: "Member"
  - name: "Guest"
  - name: "Bot"
- name: "ChannelVisibility"
  description: "Membership and posting rules for a channel."
  data:
  - name: "Public"
  - name: "Private"
  - name: "ReadOnly"
  - name: "Announcement"
- name: "ThreadState"
  description: "Lifecycle state of a message thread."
