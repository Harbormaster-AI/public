---
metadata:
  name: "Document Delivery"
  description: "Capabilities model for preparing, routing, delivering, and tracking\
    \ documents across multiple communication channels with governance and compliance."
  version: "1.0.0"
  industry: "Communications"
  category: "Communication"
  type: "Capability"
  domain: "Document Delivery"
entities:
- name: "Sender"
  description: "Business unit or application initiating document delivery operations."
  data:
  - name: "name"
    type: "String"
  - name: "preferredChannel"
    type: "DeliveryChannel"
  - name: "replyToName"
    type: "String"
  - name: "replyToEmail"
    type: "String"
  - name: "timezone"
    type: "String"
  relations:
  - name: "channelEndpoints"
    type: "ChannelEndpoint"
    multiplicity: "OneToMany"
  - name: "templates"
    type: "Template"
    multiplicity: "OneToMany"
  - name: "requests"
    type: "DeliveryRequest"
    multiplicity: "OneToMany"
  - name: "compliancePolicies"
    type: "CompliancePolicy"
    multiplicity: "OneToMany"
- name: "ChannelProvider"
  description: "Third-party or internal system that performs final-mile delivery for\
    \ a given channel."
  data:
  - name: "name"
    type: "String"
  - name: "providerType"
    type: "ProviderType"
  - name: "region"
    type: "String"
  - name: "reliabilityRating"
    type: "Integer"
  relations:
  - name: "endpoints"
    type: "ChannelEndpoint"
    multiplicity: "OneToMany"
  - name: "serviceLevels"
    type: "ServiceLevelAgreement"
    multiplicity: "OneToMany"
  - name: "attempts"
    type: "DeliveryAttempt"
    multiplicity: "OneToMany"
  - name: "manifests"
    type: "Manifest"
    multiplicity: "OneToMany"
- name: "ChannelEndpoint"
  description: "Configured and verified endpoint used to dispatch documents through\
    \ a specific channel."
  data:
  - name: "name"
    type: "String"
  - name: "channel"
    type: "DeliveryChannel"
  - name: "address"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "provider"
    type: "ChannelProvider"
    multiplicity: "ManyToOne"
  - name: "sender"
    type: "Sender"
    multiplicity: "ManyToOne"
- name: "ServiceLevelAgreement"
  description: "Service commitment defining delivery timeliness and success targets."
  data:
  - name: "name"
    type: "String"
  - name: "targetFirstAttemptMinutes"
    type: "Integer"
  - name: "successRateTarget"
    type: "Decimal"
  - name: "deliveryWindow"
    type: "DeliveryWindow"
  relations:
  - name: "provider"
    type: "ChannelProvider"
    multiplicity: "ManyToOne"
- name: "Template"
  description: "Reusable layout and merge instructions for document composition."
  data:
  - name: "name"
    type: "String"
  - name: "engine"
    type: "TemplateEngine"
  - name: "version"
    type: "String"
  - name: "locale"
    type: "String"
  relations:
  - name: "mergeFields"
    type: "MergeField"
    multiplicity: "OneToMany"
  - name: "sender"
    type: "Sender"
    multiplicity: "ManyToOne"
- name: "MergeField"
  description: "Placeholder definition populated during document rendering."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "FieldDataType"
  - name: "required"
    type: "Boolean"
  - name: "defaultValue"
    type: "String"
  relations:
  - name: "template"
    type: "Template"
    multiplicity: "ManyToOne"
- name: "DocumentSource"
  description: "Origin of content to be delivered, such as an uploaded file or generated\
    \ report."
  data:
  - name: "title"
    type: "String"
  - name: "mediaType"
    type: "String"
  - name: "contentHash"
    type: "String"
  - name: "sizeBytes"
    type: "Integer"
  - name: "classification"
    type: "DocumentClassification"
  relations:
  - name: "documents"
    type: "DocumentAsset"
    multiplicity: "OneToMany"
- name: "DocumentAsset"
  description: "Immutable, delivery-ready document file."
  data:
  - name: "fileName"
    type: "String"
  - name: "mediaType"
    type: "String"
  - name: "checksum"
    type: "String"
  - name: "pageCount"
    type: "Integer"
  - name: "language"
    type: "String"
  relations:
  - name: "source"
    type: "DocumentSource"
    multiplicity: "ManyToOne"
  - name: "renditions"
    type: "DocumentRendition"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "CompliancePolicy"
    multiplicity: "ManyToMany"
- name: "DocumentRendition"
  description: "Transformed output of a document tailored to a specific channel or\
    \ standard."
  data:
  - name: "format"
    type: "String"
  - name: "widthPixels"
    type: "Integer"
  - name: "heightPixels"
    type: "Integer"
  - name: "dpi"
    type: "Integer"
  relations:
  - name: "document"
    type: "DocumentAsset"
    multiplicity: "ManyToOne"
  - name: "conversionProfile"
    type: "ConversionProfile"
    multiplicity: "ManyToOne"
- name: "ConversionProfile"
  description: "Rules and parameters for converting documents into delivery-specific\
    \ formats."
  data:
  - name: "name"
    type: "String"
  - name: "targetFormat"
    type: "String"
  - name: "colorProfile"
    type: "String"
  - name: "encryptionMode"
    type: "EncryptionMode"
  relations:
  - name: "renditions"
    type: "DocumentRendition"
    multiplicity: "OneToMany"
  - name: "renderJobs"
    type: "RenderJob"
    multiplicity: "OneToMany"
- name: "Recipient"
  description: "Human, organization, or system designated to receive delivered documents."
  data:
  - name: "displayName"
    type: "String"
  - name: "contactType"
    type: "RecipientType"
  - name: "preferredChannel"
    type: "DeliveryChannel"
  - name: "email"
    type: "EmailAddress"
  - name: "postalAddress"
    type: "PostalAddress"
  - name: "phoneNumber"
    type: "PhoneNumber"
  relations:
  - name: "consentRecords"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
  - name: "verificationResults"
    type: "AddressVerification"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "ConsentRecord"
  description: "Record of a recipient’s consent and its status for delivery and storage."
  data:
  - name: "consentType"
    type: "ConsentType"
  - name: "status"
    type: "ConsentStatus"
  - name: "consentTimestamp"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "recipient"
    type: "Recipient"
    multiplicity: "ManyToOne"
- name: "AddressVerification"
  description: "Result of validating and standardizing a recipient’s postal address."
  data:
  - name: "status"
    type: "AddressVerificationStatus"
  - name: "verifiedAt"
    type: "Date"
  - name: "provider"
    type: "String"
  - name: "confidence"
    type: "Decimal"
  relations:
  - name: "recipient"
    type: "Recipient"
    multiplicity: "ManyToOne"
- name: "DeliveryRequest"
  description: "Instruction to deliver one or more documents to designated recipients."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "priority"
    type: "DeliveryPriority"
  - name: "requestedChannel"
    type: "DeliveryChannel"
  - name: "requestedDeliveryDate"
    type: "Date"
  - name: "sensitivity"
    type: "SensitivityLevel"
  relations:
  - name: "sender"
    type: "Sender"
    multiplicity: "ManyToOne"
  - name: "recipients"
    type: "Recipient"
    multiplicity: "ManyToMany"
  - name: "documents"
    type: "DocumentAsset"
    multiplicity: "ManyToMany"
  - name: "batch"
    type: "DeliveryBatch"
    multiplicity: "ManyToOne"
  - name: "attempts"
    type: "DeliveryAttempt"
    multiplicity: "OneToMany"
  - name: "envelope"
    type: "Envelope"
    multiplicity: "ManyToOne"
  - name: "template"
    type: "Template"
    multiplicity: "ManyToOne"
  - name: "archiveLocation"
    type: "ArchiveLocation"
    multiplicity: "ManyToOne"
- name: "Envelope"
  description: "Logical container that groups documents and recipients for coordinated\
    \ delivery."
  data:
  - name: "envelopeNumber"
    type: "String"
  - name: "sealType"
    type: "SealType"
  - name: "totalItems"
    type: "Integer"
  relations:
  - name: "requests"
    type: "DeliveryRequest"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
- name: "Attachment"
  description: "Supplemental file included alongside primary documents in an envelope."
  data:
  - name: "name"
    type: "String"
  - name: "mediaType"
    type: "String"
  - name: "sizeBytes"
    type: "Integer"
  relations:
  - name: "envelope"
    type: "Envelope"
    multiplicity: "ManyToOne"
- name: "RenderJob"
  description: "Execution record for composing and converting documents prior to delivery."
  data:
  - name: "status"
    type: "RenderJobStatus"
  - name: "startedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  - name: "errorCode"
    type: "String"
  relations:
  - name: "request"
    type: "DeliveryRequest"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "DocumentAsset"
    multiplicity: "ManyToMany"
  - name: "conversionProfile"
    type: "ConversionProfile"
    multiplicity: "ManyToOne"
- name: "DeliveryBatch"
  description: "Batch of delivery requests processed together for optimization and\
    \ manifesting."
  data:
  - name: "batchNumber"
    type: "String"
  - name: "status"
    type: "BatchStatus"
  - name: "scheduledStart"
    type: "Date"
  - name: "scheduledEnd"
    type: "Date"
  relations:
  - name: "requests"
    type: "DeliveryRequest"
    multiplicity: "OneToMany"
  - name: "manifest"
    type: "Manifest"
    multiplicity: "OneToOne"
- name: "Manifest"
  description: "Statement of items handed off to a channel provider, typically for\
    \ physical delivery."
  data:
  - name: "manifestNumber"
    type: "String"
  - name: "manifestDate"
    type: "Date"
  - name: "handoffLocation"
    type: "String"
  relations:
  - name: "batch"
    type: "DeliveryBatch"
    multiplicity: "OneToOne"
  - name: "provider"
    type: "ChannelProvider"
    multiplicity: "ManyToOne"
- name: "DeliveryAttempt"
  description: "Single attempt to deliver a request through a specific channel and\
    \ provider."
  data:
  - name: "attemptNumber"
    type: "Integer"
  - name: "status"
    type: "AttemptStatus"
  - name: "channel"
    type: "DeliveryChannel"
  - name: "attemptedAt"
    type: "Date"
  - name: "responseCode"
    type: "String"
  - name: "latencyMs"
    type: "Integer"
  - name: "cost"
    type: "Money"
  relations:
  - name: "request"
    type: "DeliveryRequest"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "ChannelProvider"
    multiplicity: "ManyToOne"
  - name: "receipt"
    type: "DeliveryReceipt"
    multiplicity: "OneToOne"
  - name: "bounce"
    type: "Bounce"
    multiplicity: "OneToOne"
- name: "DeliveryReceipt"
  description: "Evidence returned by the channel upon acceptance or completion of\
    \ delivery."
  data:
  - name: "receiptType"
    type: "ReceiptType"
  - name: "receivedAt"
    type: "Date"
  - name: "rawPayload"
    type: "String"
  - name: "proofUrl"
    type: "String"
  relations:
  - name: "attempt"
    type: "DeliveryAttempt"
    multiplicity: "OneToOne"
  - name: "proof"
    type: "ProofOfDelivery"
    multiplicity: "OneToOne"
  - name: "archiveLocation"
    type: "ArchiveLocation"
    multiplicity: "ManyToOne"
- name: "ProofOfDelivery"
  description: "Verifiable confirmation that the recipient received, accessed, or\
    \ acknowledged the content."
  data:
  - name: "proofType"
    type: "ProofType"
  - name: "occurredAt"
    type: "Date"
  - name: "verifier"
    type: "String"
  - name: "details"
    type: "String"
  relations:
  - name: "receipt"
    type: "DeliveryReceipt"
    multiplicity: "OneToOne"
  - name: "signature"
    type: "ElectronicSignature"
    multiplicity: "OneToOne"
- name: "ElectronicSignature"
  description: "Captured approval or acknowledgment associated with a delivered document."
  data:
  - name: "signatureType"
    type: "SignatureType"
  - name: "signerName"
    type: "String"
  - name: "signingTimestamp"
    type: "Date"
  - name: "method"
    type: "String"
  relations:
  - name: "proof"
    type: "ProofOfDelivery"
    multiplicity: "OneToOne"
  - name: "recipient"
    type: "Recipient"
    multiplicity: "ManyToOne"
- name: "Bounce"
  description: "Negative delivery outcome indicating failure or deferral from the\
    \ channel."
  data:
  - name: "bounceType"
    type: "BounceType"
  - name: "reason"
    type: "String"
  - name: "occurredAt"
    type: "Date"
  - name: "retriable"
    type: "Boolean"
  relations:
  - name: "attempt"
    type: "DeliveryAttempt"
    multiplicity: "OneToOne"
- name: "CompliancePolicy"
  description: "Governance rules controlling retention, redaction, and delivery restrictions."
  data:
  - name: "name"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  - name: "requiresWatermark"
    type: "Boolean"
  - name: "geographicRestrictions"
    type: "String"
  relations:
  - name: "appliesTo"
    type: "DocumentAsset"
    multiplicity: "ManyToMany"
  - name: "sender"
    type: "Sender"
    multiplicity: "ManyToOne"
  - name: "redactionRules"
    type: "RedactionRule"
    multiplicity: "OneToMany"
  - name: "watermarkPolicies"
    type: "WatermarkPolicy"
    multiplicity: "OneToMany"
- name: "RedactionRule"
  description: "Pattern-based masking applied to documents before delivery."
  data:
  - name: "name"
    type: "String"
  - name: "pattern"
    type: "String"
  - name: "replacement"
    type: "String"
  - name: "scope"
    type: "RedactionScope"
  relations:
  - name: "policy"
    type: "CompliancePolicy"
    multiplicity: "ManyToOne"
- name: "WatermarkPolicy"
  description: "Configuration for dynamic watermarks applied during rendering."
  data:
  - name: "name"
    type: "String"
  - name: "textTemplate"
    type: "String"
  - name: "opacity"
    type: "Integer"
  - name: "position"
    type: "WatermarkPosition"
  relations:
  - name: "policy"
    type: "CompliancePolicy"
    multiplicity: "ManyToOne"
- name: "ArchiveLocation"
  description: "Storage destination for delivered artifacts, proofs, and logs."
  data:
  - name: "name"
    type: "String"
  - name: "storageType"
    type: "StorageType"
  - name: "uri"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "requests"
    type: "DeliveryRequest"
    multiplicity: "OneToMany"
  - name: "receipts"
    type: "DeliveryReceipt"
    multiplicity: "OneToMany"
- name: "AuditEvent"
  description: "Immutable record of lifecycle activities for traceability and compliance."
  data:
  - name: "eventType"
    type: "AuditEventType"
  - name: "occurredAt"
    type: "Date"
  - name: "actor"
    type: "String"
  - name: "context"
    type: "String"
  - name: "severity"
    type: "AuditSeverity"
  relations:
  - name: "request"
    type: "DeliveryRequest"
    multiplicity: "ManyToOne"
  - name: "recipient"
    type: "Recipient"
    multiplicity: "ManyToOne"
- name: "RetentionRecord"
  description: "Tracking for retention decisions and purge actions applied to delivery\
    \ artifacts."
  data:
  - name: "status"
    type: "RetentionStatus"
  - name: "effectiveDate"
    type: "Date"
  - name: "purgeDate"
    type: "Date"
  relations:
  - name: "request"
    type: "DeliveryRequest"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "CompliancePolicy"
    multiplicity: "ManyToOne"
enums:
- name: "DeliveryChannel"
  description: "Medium through which documents are delivered to recipients."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "Push"
  - name: "Fax"
  - name: "Print"
  - name: "SFTP"
  - name: "API"
- name: "RecipientType"
  description: "Classification of the receiving party for a delivery."
  data:
  - name: "Person"
  - name: "Organization"
  - name: "System"
- name: "ConsentType"
  description: "Purpose for which recipient consent is managed."
  data:
  - name: "Marketing"
  - name: "Transactional"
  - name: "Archival"
- name: "ConsentStatus"
  description: "State of the recipient’s consent."
  data:
  - name: "Granted"
  - name: "Revoked"
  - name: "Expired"
  - name: "Pending"
- name: "DeliveryPriority"
  description: "Urgency level that influences delivery sequencing and SLAs."
  data:
  - name: "Low"
  - name: "Normal"
  - name: "High"
  - name: "Urgent"
- name: "SensitivityLevel"
  description: "Confidentiality classification impacting processing and access controls."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Confidential"
  - name: "Restricted"
- name: "DocumentClassification"
  description: "Business categorization of documents for routing and compliance."
  data:
  - name: "Statement"
  - name: "Invoice"
  - name: "Notice"
  - name: "Policy"
  - name: "Report"
  - name: "Letter"
  - name: "Contract"
- name: "RenderJobStatus"
  description: "Lifecycle status of a document rendering process."
  data:
  - name: "Queued"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Cancelled"
- name: "EncryptionMode"
  description: "Level and context of encryption applied during processing."
  data:
  - name: "None"
  - name: "AtRest"
  - name: "InTransit"
  - name: "EndToEnd"
- name: "SealType"
  description: "Type of integrity seal applied to an envelope."
  data:
  - name: "None"
  - name: "ElectronicSeal"
  - name: "TamperEvident"
- name: "ProviderType"
  description: "Category of delivery service provider."
  data:
  - name: "Internal"
  - name: "ThirdParty"
  - name: "PostalOperator"
  - name: "EmailGateway"
  - name: "SmsAggregator"
- name: "BatchStatus"
  description: "Processing state of a delivery batch."
  data:
  - name: "Planned"
  - name: "Assembling"
  - name: "Manifested"
  - name: "InTransit"
  - name: "Completed"
  - name: "Failed"
- name: "AttemptStatus"
  description: "Outcome state of an individual delivery attempt."
  data:
  - name: "Pending"
  - name: "Sent"
  - name: "Deferred"
  - name: "Failed"
  - name: "Delivered"
  - name: "Rejected"
- name: "ReceiptType"
  description: "Type of receipt returned by the channel."
  data:
  - name: "Accepted"
  - name: "Delivered"
  - name: "Read"
  - name: "Processed"
  - name: "Failed"
- name: "ProofType"
  description: "Evidence category confirming delivery or recipient action."
  data:
  - name: "OpenTracking"
  - name: "LinkClick"
  - name: "PrintCertificate"
  - name: "DeliveryScan"
  - name: "Signature"
- name: "BounceType"
  description: "Classification of negative delivery response."
  data:
  - name: "Hard"
  - name: "Soft"
  - name: "Blocked"
  - name: "Complaint"
- name: "SignatureType"
  description: "Method used to capture or apply a signature."
  data:
  - name: "Drawn"
  - name: "Typed"
  - name: "Stamp"
  - name: "DigitalCertificate"
- name: "RedactionScope"
  description: "Extent and approach applied when masking content."
  data:
  - name: "Full"
  - name: "Partial"
  - name: "PatternMatch"
  - name: "Region"
- name: "WatermarkPosition"
  description: "Placement of a watermark on rendered pages."
  data:
  - name: "Diagonal"
  - name: "Center"
  - name: "TopLeft"
  - name: "TopRight"
  - name: "BottomLeft"
  - name: "BottomRight"
- name: "StorageType"
  description: "Storage technology used for archiving delivery artifacts."
  data:
  - name: "ObjectStorage"
  - name: "FileSystem"
  - name: "WORM"
  - name: "ContentService"
- name: "AuditEventType"
  description: "Types of auditable actions within the delivery lifecycle."
  data:
  - name: "RequestCreated"
  - name: "DocumentAttached"
  - name: "AttemptStarted"
  - name: "AttemptCompleted"
  - name: "ReceiptReceived"
  - name: "BounceReceived"
  - name: "ProofRecorded"
  - name: "StatusChanged"
  - name: "PolicyApplied"
  - name: "Archived"
- name: "AuditSeverity"
  description: "Importance level assigned to an audit event."
  data:
  - name: "Info"
  - name: "Warning"
  - name: "Error"
  - name: "Critical"
- name: "TemplateEngine"
  description: "Technology used to merge data and render documents."
  data:
  - name: "Mustache"
  - name: "Liquid"
  - name: "Freemarker"
  - name: "XslFo"
  - name: "HtmlToPdf"
- name: "FieldDataType"
  description: "Data type permitted for a merge field value."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime"
- name: "AddressVerificationStatus"
  description: "Outcome of postal address standardization and validation."
  data:
  - name: "Verified"
  - name: "Standardized"
  - name: "NotFound"
  - name: "Ambiguous"
  - name: "Failed"
- name: "RetentionStatus"
  description: "Current disposition of a delivery artifact under retention policy."
  data:
  - name: "Active"
  - name: "RetainUntil"
  - name: "Purged"
  - name: "ScheduledForPurge"
valueObjects:
- name: "Money"
  description: "Monetary amount expressed in a specific currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "PostalAddress"
  description: "Structured physical mailing address suitable for postal delivery and\
    \ verification."
  data:
  - name: "addressLine1"
    type: "String"
  - name: "addressLine2"
    type: "String"
  - name: "city"
    type: "String"
  - name: "region"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "EmailAddress"
  description: "Electronic mail address in RFC-compliant format."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "E.164-compatible telephone number representation."
  data:
  - name: "countryCode"
    type: "String"
  - name: "number"
    type: "String"
- name: "DeliveryWindow"
  description: "Preferred or committed time interval for delivery operations."
  data:
  - name: "startTime"
    type: "Date"
  - name: "endTime"
    type: "Date"
