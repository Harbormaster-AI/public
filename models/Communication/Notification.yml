---
metadata:
  name: "Notification"
  description: "Capabilities model for omni-channel notification authoring, routing,\
    \ delivery, preferences, and compliance."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Communication"
  type: "Capability"
  domain: "Notification"
entities:
- name: "Subscriber"
  description: "Person or system intended to receive notifications."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "preferredLocale"
    type: "Locale"
  - name: "timezone"
    type: "String"
  - name: "active"
    type: "Boolean"
  - name: "createdDate"
    type: "Date"
  relations:
  - name: "endpoints"
    type: "DeliveryEndpoint"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "channelPreferences"
    type: "ChannelPreference"
    multiplicity: "OneToMany"
  - name: "consentRecords"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
  - name: "suppressions"
    type: "SuppressionRule"
    multiplicity: "OneToMany"
- name: "DeliveryEndpoint"
  description: "Addressable destination for a subscriber on a specific channel."
  data:
  - name: "channelType"
    type: "ChannelType"
  - name: "address"
    type: "String"
  - name: "label"
    type: "String"
  - name: "verified"
    type: "Boolean"
  - name: "lastVerified"
    type: "Date"
  relations:
  - name: "subscriber"
    type: "Subscriber"
    multiplicity: "ManyToOne"
- name: "Topic"
  description: "Logical grouping of notifications by subject area or purpose."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "defaultPriority"
    type: "Priority"
  - name: "retentionDays"
    type: "Integer"
  relations:
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "templates"
    type: "NotificationTemplate"
    multiplicity: "OneToMany"
  - name: "events"
    type: "NotificationEvent"
    multiplicity: "OneToMany"
  - name: "digests"
    type: "Digest"
    multiplicity: "OneToMany"
- name: "Subscription"
  description: "Agreement enabling notifications for a subscriber on a topic."
  data:
  - name: "status"
    type: "SubscriptionStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "deliverySchedule"
    type: "DeliverySchedule"
  relations:
  - name: "subscriber"
    type: "Subscriber"
    multiplicity: "ManyToOne"
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
  - name: "channels"
    type: "SubscriptionChannel"
    multiplicity: "OneToMany"
- name: "SubscriptionChannel"
  description: "Channel-specific enablement and fallback ordering for a subscription."
  data:
  - name: "channelType"
    type: "ChannelType"
  - name: "enabled"
    type: "Boolean"
  - name: "fallbackOrder"
    type: "Integer"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
- name: "ChannelPreference"
  description: "Subscriber-level channel preference and quiet hours."
  data:
  - name: "channelType"
    type: "ChannelType"
  - name: "enabled"
    type: "Boolean"
  - name: "quietHours"
    type: "TimeWindow"
  relations:
  - name: "subscriber"
    type: "Subscriber"
    multiplicity: "ManyToOne"
- name: "ChannelProvider"
  description: "External service that delivers notifications for a channel."
  data:
  - name: "name"
    type: "String"
  - name: "providerType"
    type: "ProviderType"
  - name: "baseUrl"
    type: "Url"
  - name: "isSandbox"
    type: "Boolean"
  relations:
  - name: "channelConfigurations"
    type: "ChannelConfiguration"
    multiplicity: "OneToMany"
  - name: "deliveryAttempts"
    type: "DeliveryAttempt"
    multiplicity: "OneToMany"
  - name: "bounceEvents"
    type: "BounceEvent"
    multiplicity: "OneToMany"
- name: "ChannelConfiguration"
  description: "Sending configuration for a specific channel and provider."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "senderIdentity"
    type: "String"
  - name: "rateLimit"
    type: "RateLimit"
  - name: "signingKeyReference"
    type: "String"
  relations:
  - name: "provider"
    type: "ChannelProvider"
    multiplicity: "ManyToOne"
  - name: "notifications"
    type: "Notification"
    multiplicity: "OneToMany"
  - name: "deliveryAttempts"
    type: "DeliveryAttempt"
    multiplicity: "OneToMany"
  - name: "routingRules"
    type: "RoutingRule"
    multiplicity: "OneToMany"
- name: "NotificationTemplate"
  description: "Reusable message blueprint with variables and formatting."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "Integer"
  - name: "format"
    type: "TemplateFormat"
  - name: "localeStrategy"
    type: "LocaleStrategy"
  - name: "defaultSubject"
    type: "String"
  - name: "defaultBody"
    type: "String"
  - name: "isArchived"
    type: "Boolean"
  relations:
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
  - name: "variants"
    type: "TemplateVariant"
    multiplicity: "OneToMany"
  - name: "suppressions"
    type: "SuppressionRule"
    multiplicity: "OneToMany"
- name: "TemplateVariant"
  description: "Locale-specific content for a template."
  data:
  - name: "locale"
    type: "Locale"
  - name: "subject"
    type: "String"
  - name: "body"
    type: "String"
  - name: "format"
    type: "TemplateFormat"
  relations:
  - name: "template"
    type: "NotificationTemplate"
    multiplicity: "ManyToOne"
- name: "NotificationEvent"
  description: "Business occurrence that triggers notification creation."
  data:
  - name: "eventName"
    type: "String"
  - name: "intent"
    type: "NotificationIntent"
  - name: "occurredAt"
    type: "Date"
  - name: "payload"
    type: "String"
  relations:
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
  - name: "notifications"
    type: "Notification"
    multiplicity: "OneToMany"
- name: "Notification"
  description: "Instance of a message prepared and sent to recipients."
  data:
  - name: "status"
    type: "NotificationStatus"
  - name: "priority"
    type: "Priority"
  - name: "scheduledTime"
    type: "Date"
  - name: "sentTime"
    type: "Date"
  - name: "expirationTime"
    type: "Date"
  - name: "deduplicationKey"
    type: "String"
  - name: "intent"
    type: "NotificationIntent"
  relations:
  - name: "template"
    type: "NotificationTemplate"
    multiplicity: "ManyToOne"
  - name: "event"
    type: "NotificationEvent"
    multiplicity: "ManyToOne"
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
  - name: "channelConfiguration"
    type: "ChannelConfiguration"
    multiplicity: "ManyToOne"
  - name: "recipients"
    type: "NotificationRecipient"
    multiplicity: "OneToMany"
  - name: "deliveryAttempts"
    type: "DeliveryAttempt"
    multiplicity: "OneToMany"
  - name: "digests"
    type: "Digest"
    multiplicity: "ManyToMany"
  - name: "bounceEvents"
    type: "BounceEvent"
    multiplicity: "OneToMany"
- name: "NotificationRecipient"
  description: "Target recipient information resolved at send time."
  data:
  - name: "role"
    type: "RecipientRole"
  - name: "channelType"
    type: "ChannelType"
  - name: "address"
    type: "String"
  - name: "locale"
    type: "Locale"
  - name: "personalizationData"
    type: "String"
  relations:
  - name: "notification"
    type: "Notification"
    multiplicity: "ManyToOne"
  - name: "subscriber"
    type: "Subscriber"
    multiplicity: "ManyToOne"
  - name: "endpoint"
    type: "DeliveryEndpoint"
    multiplicity: "ManyToOne"
  - name: "deliveryAttempts"
    type: "DeliveryAttempt"
    multiplicity: "OneToMany"
  - name: "bounceEvents"
    type: "BounceEvent"
    multiplicity: "OneToMany"
- name: "DeliveryAttempt"
  description: "Single try to deliver a notification via a provider and channel."
  data:
  - name: "status"
    type: "DeliveryStatus"
  - name: "attemptNumber"
    type: "Integer"
  - name: "providerResponseCode"
    type: "String"
  - name: "providerResponseMessage"
    type: "String"
  - name: "sentAt"
    type: "Date"
  - name: "latencyMs"
    type: "Integer"
  - name: "errorType"
    type: "DeliveryErrorType"
  relations:
  - name: "notification"
    type: "Notification"
    multiplicity: "ManyToOne"
  - name: "recipient"
    type: "NotificationRecipient"
    multiplicity: "ManyToOne"
  - name: "channelConfiguration"
    type: "ChannelConfiguration"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "ChannelProvider"
    multiplicity: "ManyToOne"
- name: "SuppressionRule"
  description: "Constraint preventing delivery based on scope and reason."
  data:
  - name: "scope"
    type: "SuppressionScope"
  - name: "reason"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  - name: "createdDate"
    type: "Date"
  - name: "channelType"
    type: "ChannelType"
  relations:
  - name: "subscriber"
    type: "Subscriber"
    multiplicity: "ManyToOne"
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
  - name: "template"
    type: "NotificationTemplate"
    multiplicity: "ManyToOne"
- name: "Digest"
  description: "Aggregated bundle of notifications sent on a schedule."
  data:
  - name: "frequency"
    type: "DeliverySchedule"
  - name: "status"
    type: "DigestStatus"
  - name: "scheduledFor"
    type: "Date"
  - name: "sentAt"
    type: "Date"
  relations:
  - name: "subscriber"
    type: "Subscriber"
    multiplicity: "ManyToOne"
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
  - name: "notifications"
    type: "Notification"
    multiplicity: "ManyToMany"
- name: "ConsentRecord"
  description: "Evidence of a subscriber’s consent decision for notifications."
  data:
  - name: "consentType"
    type: "ConsentType"
  - name: "granted"
    type: "Boolean"
  - name: "channelType"
    type: "ChannelType"
  - name: "recordedAt"
    type: "Date"
  - name: "source"
    type: "String"
  relations:
  - name: "subscriber"
    type: "Subscriber"
    multiplicity: "ManyToOne"
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
- name: "BounceEvent"
  description: "Feedback event indicating non-delivery or complaint."
  data:
  - name: "bounceType"
    type: "BounceType"
  - name: "description"
    type: "String"
  - name: "occurredAt"
    type: "Date"
  - name: "channelType"
    type: "ChannelType"
  - name: "remoteCode"
    type: "String"
  relations:
  - name: "recipient"
    type: "NotificationRecipient"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "ChannelProvider"
    multiplicity: "ManyToOne"
  - name: "notification"
    type: "Notification"
    multiplicity: "ManyToOne"
- name: "RoutingRule"
  description: "Conditional directive that selects channel or alters delivery."
  data:
  - name: "name"
    type: "String"
  - name: "precedence"
    type: "Integer"
  - name: "isEnabled"
    type: "Boolean"
  - name: "matchExpression"
    type: "String"
  - name: "action"
    type: "RoutingAction"
  relations:
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
  - name: "channelConfiguration"
    type: "ChannelConfiguration"
    multiplicity: "ManyToOne"
enums:
- name: "ChannelType"
  description: "Communication mediums supported for notification delivery."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "Push"
  - name: "InApp"
  - name: "Webhook"
- name: "ProviderType"
  description: "Classification of external delivery providers by integration model."
  data:
  - name: "SMTP"
  - name: "SMSAggregator"
  - name: "PushService"
  - name: "WebhookRelay"
  - name: "InAppService"
- name: "NotificationStatus"
  description: "Lifecycle state of a notification instance."
  data:
  - name: "Draft"
  - name: "Queued"
  - name: "Preparing"
  - name: "Sending"
  - name: "Sent"
  - name: "Failed"
  - name: "Cancelled"
  - name: "Suppressed"
  - name: "Expired"
- name: "DeliveryStatus"
  description: "Outcome of a specific delivery attempt."
  data:
  - name: "Pending"
  - name: "Attempting"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Bounced"
  - name: "Throttled"
  - name: "Deferred"
- name: "Priority"
  description: "Urgency level influencing routing and scheduling."
  data:
  - name: "Low"
  - name: "Normal"
  - name: "High"
  - name: "Critical"
- name: "TemplateFormat"
  description: "Markup or structure used to render template content."
  data:
  - name: "PlainText"
  - name: "HTML"
  - name: "Markdown"
  - name: "JSON"
- name: "SubscriptionStatus"
  description: "Current state of a subscriber’s enrollment on a topic."
  data:
  - name: "Active"
  - name: "Paused"
  - name: "Unsubscribed"
  - name: "Bounced"
- name: "RecipientRole"
  description: "Recipient addressing role used by certain channels."
  data:
  - name: "To"
  - name: "Cc"
  - name: "Bcc"
- name: "NotificationIntent"
  description: "Purpose that guides content, compliance, and routing."
  data:
  - name: "Transactional"
  - name: "Marketing"
  - name: "Operational"
  - name: "Security"
  - name: "Alert"
- name: "LocaleStrategy"
  description: "Strategy for resolving locale when rendering templates."
  data:
  - name: "FallbackToDefault"
  - name: "StrictLocaleMatch"
- name: "DeliveryErrorType"
  description: "Categorization of errors encountered during delivery."
  data:
  - name: "None"
  - name: "Temporary"
  - name: "Permanent"
  - name: "Configuration"
  - name: "Provider"
  - name: "Recipient"
- name: "SuppressionScope"
  description: "Level at which a suppression rule blocks delivery."
  data:
  - name: "Global"
  - name: "Topic"
  - name: "Channel"
  - name: "Template"
- name: "DigestStatus"
  description: "Processing state of a notification digest."
  data:
  - name: "Pending"
  - name: "Assembled"
  - name: "Sent"
  - name: "Cancelled"
- name: "DeliverySchedule"
  description: "Timing policy for dispatching notifications to a subscriber."
  data:
  - name: "Immediate"
  - name: "HourlyDigest"
  - name: "DailyDigest"
  - name: "WeeklyDigest"
- name: "ConsentType"
  description: "Category of consent governing notification permissions."
  data:
  - name: "Marketing"
  - name: "Transactional"
  - name: "System"
  - name: "Research"
- name: "BounceType"
  description: "Type of non-delivery or negative feedback event."
  data:
  - name: "Hard"
  - name: "Soft"
  - name: "Complaint"
  - name: "Unsubscribe"
- name: "RoutingAction"
  description: "Operation performed when a routing rule matches."
  data:
  - name: "ChooseChannel"
  - name: "Suppress"
  - name: "RouteToProvider"
  - name: "Escalate"
valueObjects:
- name: "Locale"
  description: "Language and region information for content and formatting."
  data:
  - name: "code"
    type: "String"
  - name: "language"
    type: "String"
  - name: "region"
    type: "String"
- name: "TimeWindow"
  description: "Daily time range used to limit delivery."
  data:
  - name: "startTime"
    type: "String"
  - name: "endTime"
    type: "String"
  - name: "timezone"
    type: "String"
- name: "RateLimit"
  description: "Concurrency and pacing constraints for outbound traffic."
  data:
  - name: "maxPerMinute"
    type: "Integer"
  - name: "maxPerHour"
    type: "Integer"
  - name: "burstCapacity"
    type: "Integer"
- name: "Url"
  description: "Network address referencing an HTTP or HTTPS endpoint."
  data:
  - name: "value"
    type: "String"
