---
metadata:
  name: "Messaging"
  description: "HCIDL capabilities model for enterprise messaging, covering channels,\
    \ conversations, messages, delivery, routing, compliance, automation, and storage."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Communication"
  type: "Capability"
  domain: "Messaging"
entities:
- name: "MessagingWorkspace"
  description: "Logical boundary for messaging configurations, governance, and assets\
    \ across channels."
  data:
  - name: "name"
    type: "String"
  - name: "defaultLocale"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "retentionDefaultDays"
    type: "Integer"
  relations:
  - name: "users"
    type: "User"
    multiplicity: "OneToMany"
  - name: "channels"
    type: "Channel"
    multiplicity: "OneToMany"
  - name: "templates"
    type: "MessageTemplate"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "RetentionPolicy"
    multiplicity: "OneToMany"
  - name: "routingRules"
    type: "RoutingRule"
    multiplicity: "OneToMany"
  - name: "mediaStores"
    type: "MediaStore"
    multiplicity: "OneToMany"
  - name: "integrationEndpoints"
    type: "IntegrationEndpoint"
    multiplicity: "OneToMany"
  - name: "queues"
    type: "MessageQueue"
    multiplicity: "OneToMany"
  - name: "conversations"
    type: "Conversation"
    multiplicity: "OneToMany"
  - name: "bots"
    type: "Bot"
    multiplicity: "OneToMany"
  - name: "labels"
    type: "Label"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "User"
  description: "Person or system account that participates in messaging."
  data:
  - name: "displayName"
    type: "String"
  - name: "preferredLocale"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "avatarUrl"
    type: "String"
  relations:
  - name: "workspace"
    type: "MessagingWorkspace"
    multiplicity: "ManyToOne"
  - name: "endpoints"
    type: "ChannelEndpoint"
    multiplicity: "OneToMany"
  - name: "participants"
    type: "Participant"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "Channel"
  description: "Configured pathway for message transport such as SMS, Email, Push,\
    \ or Chat."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "enabledState"
    type: "ChannelState"
  - name: "connectionInfo_"
    type: "String"
  relations:
  - name: "workspace"
    type: "MessagingWorkspace"
    multiplicity: "ManyToOne"
  - name: "endpoints"
    type: "ChannelEndpoint"
    multiplicity: "OneToMany"
  - name: "conversations"
    type: "Conversation"
    multiplicity: "OneToMany"
  - name: "routingRules"
    type: "RoutingRule"
    multiplicity: "OneToMany"
  - name: "templates"
    type: "MessageTemplate"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
  - name: "integrationEndpoints"
    type: "IntegrationEndpoint"
    multiplicity: "ManyToMany"
- name: "ChannelEndpoint"
  description: "Addressable identity on a specific channel used for sending and receiving\
    \ messages."
  data:
  - name: "address"
    type: "EndpointAddress"
  - name: "label"
    type: "String"
  - name: "verificationStatus"
    type: "VerificationStatus"
  relations:
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "receipts"
    type: "DeliveryReceipt"
    multiplicity: "OneToMany"
- name: "Conversation"
  description: "Threaded exchange of messages among participants within a channel\
    \ and workspace."
  data:
  - name: "subject"
    type: "String"
  - name: "topic"
    type: "String"
  - name: "status"
    type: "ConversationStatus"
  - name: "createdOn"
    type: "Date"
  - name: "lastActivityOn"
    type: "Date"
  - name: "privacyLevel"
    type: "PrivacyLevel"
  relations:
  - name: "workspace"
    type: "MessagingWorkspace"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "messages"
    type: "Message"
    multiplicity: "OneToMany"
  - name: "participants"
    type: "Participant"
    multiplicity: "OneToMany"
  - name: "labels"
    type: "Label"
    multiplicity: "ManyToMany"
  - name: "assignedQueue"
    type: "MessageQueue"
    multiplicity: "ManyToOne"
  - name: "bot"
    type: "Bot"
    multiplicity: "ManyToOne"
  - name: "retentionPolicy"
    type: "RetentionPolicy"
    multiplicity: "ManyToOne"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "Participant"
  description: "Membership of a user or automated agent within a conversation."
  data:
  - name: "displayName"
    type: "String"
  - name: "participantRole"
    type: "ParticipantRole"
  - name: "notificationPreference"
    type: "NotificationPreference"
  - name: "joinedOn"
    type: "Date"
  relations:
  - name: "conversation"
    type: "Conversation"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "endpoint"
    type: "ChannelEndpoint"
    multiplicity: "ManyToOne"
  - name: "messages"
    type: "Message"
    multiplicity: "OneToMany"
  - name: "receipts"
    type: "DeliveryReceipt"
    multiplicity: "OneToMany"
  - name: "reactions"
    type: "Reaction"
    multiplicity: "OneToMany"
- name: "Message"
  description: "Discrete unit of communication within a conversation."
  data:
  - name: "direction"
    type: "MessageDirection"
  - name: "sentOn"
    type: "Date"
  - name: "body"
    type: "MessageBody"
  - name: "priority"
    type: "MessagePriority"
  relations:
  - name: "conversation"
    type: "Conversation"
    multiplicity: "ManyToOne"
  - name: "sender"
    type: "Participant"
    multiplicity: "ManyToOne"
  - name: "attachments"
    type: "MessageAttachment"
    multiplicity: "OneToMany"
  - name: "receipts"
    type: "DeliveryReceipt"
    multiplicity: "OneToMany"
  - name: "labels"
    type: "Label"
    multiplicity: "ManyToMany"
  - name: "queue"
    type: "MessageQueue"
    multiplicity: "ManyToOne"
  - name: "template"
    type: "MessageTemplate"
    multiplicity: "ManyToOne"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "MessageAttachment"
  description: "Binary content associated with a message, such as images or documents."
  data:
  - name: "fileName"
    type: "String"
  - name: "mediaType"
    type: "String"
  - name: "sizeBytes"
    type: "Integer"
  - name: "location"
    type: "Url"
  relations:
  - name: "message"
    type: "Message"
    multiplicity: "ManyToOne"
  - name: "mediaStore"
    type: "MediaStore"
    multiplicity: "ManyToOne"
- name: "DeliveryReceipt"
  description: "Per-recipient delivery state of a message across transport hops."
  data:
  - name: "status"
    type: "DeliveryStatus"
  - name: "statusDetail"
    type: "String"
  - name: "updatedOn"
    type: "Date"
  relations:
  - name: "message"
    type: "Message"
    multiplicity: "ManyToOne"
  - name: "participant"
    type: "Participant"
    multiplicity: "ManyToOne"
  - name: "channelEndpoint"
    type: "ChannelEndpoint"
    multiplicity: "ManyToOne"
- name: "MessageQueue"
  description: "Workstream for routing, prioritization, and SLA tracking of conversations\
    \ and messages."
  data:
  - name: "name"
    type: "String"
  - name: "queueType"
    type: "QueueType"
  - name: "description"
    type: "String"
  - name: "slaSeconds"
    type: "Integer"
  relations:
  - name: "workspace"
    type: "MessagingWorkspace"
    multiplicity: "ManyToOne"
  - name: "conversations"
    type: "Conversation"
    multiplicity: "OneToMany"
  - name: "messages"
    type: "Message"
    multiplicity: "OneToMany"
- name: "ScheduledMessage"
  description: "Instruction to publish a message at a future time or cadence."
  data:
  - name: "plannedSendDate"
    type: "Date"
  - name: "status"
    type: "ScheduledMessageStatus"
  - name: "schedulePattern"
    type: "SchedulePattern"
  - name: "timezone"
    type: "String"
  relations:
  - name: "workspace"
    type: "MessagingWorkspace"
    multiplicity: "ManyToOne"
  - name: "conversation"
    type: "Conversation"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "Participant"
    multiplicity: "ManyToOne"
  - name: "message"
    type: "Message"
    multiplicity: "OneToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "template"
    type: "MessageTemplate"
    multiplicity: "ManyToOne"
- name: "MessageTemplate"
  description: "Reusable content blueprint for composing messages in a given language\
    \ and channel."
  data:
  - name: "name"
    type: "String"
  - name: "language"
    type: "LanguageTag"
  - name: "bodyTemplate"
    type: "String"
  - name: "description"
    type: "String"
  - name: "versionLabel"
    type: "String"
  relations:
  - name: "workspace"
    type: "MessagingWorkspace"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "messages"
    type: "Message"
    multiplicity: "OneToMany"
- name: "ConsentRecord"
  description: "Customer permission state for receiving messages on a specific channel."
  data:
  - name: "consentState"
    type: "ConsentState"
  - name: "capturedOn"
    type: "Date"
  - name: "source"
    type: "String"
  - name: "expiresOn"
    type: "Date"
  relations:
  - name: "workspace"
    type: "MessagingWorkspace"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
- name: "RetentionPolicy"
  description: "Rules controlling how long messages and artifacts are preserved."
  data:
  - name: "name"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  - name: "status"
    type: "PolicyStatus"
  - name: "purgeAction"
    type: "PurgeAction"
  relations:
  - name: "workspace"
    type: "MessagingWorkspace"
    multiplicity: "ManyToOne"
  - name: "channels"
    type: "Channel"
    multiplicity: "ManyToMany"
- name: "AuditEvent"
  description: "Immutable log of key activities and state transitions across the messaging\
    \ system."
  data:
  - name: "eventType"
    type: "AuditEventType"
  - name: "occurredOn"
    type: "Date"
  - name: "actorType"
    type: "ActorType"
  - name: "details"
    type: "String"
  relations:
  - name: "workspace"
    type: "MessagingWorkspace"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "conversation"
    type: "Conversation"
    multiplicity: "ManyToOne"
  - name: "message"
    type: "Message"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
- name: "RoutingRule"
  description: "Conditional logic used to classify and direct inbound messages."
  data:
  - name: "name"
    type: "String"
  - name: "priority"
    type: "Integer"
  - name: "matchExpression"
    type: "String"
  - name: "action"
    type: "RoutingAction"
  - name: "status"
    type: "RuleStatus"
  relations:
  - name: "workspace"
    type: "MessagingWorkspace"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "targetQueue"
    type: "MessageQueue"
    multiplicity: "ManyToOne"
  - name: "targetBot"
    type: "Bot"
    multiplicity: "ManyToOne"
  - name: "integrationEndpoint"
    type: "IntegrationEndpoint"
    multiplicity: "ManyToOne"
- name: "Bot"
  description: "Automated agent capable of responding to or routing messages."
  data:
  - name: "name"
    type: "String"
  - name: "botType"
    type: "BotType"
  - name: "description"
    type: "String"
  - name: "status"
    type: "BotStatus"
  relations:
  - name: "workspace"
    type: "MessagingWorkspace"
    multiplicity: "ManyToOne"
  - name: "channels"
    type: "Channel"
    multiplicity: "ManyToMany"
  - name: "conversations"
    type: "Conversation"
    multiplicity: "OneToMany"
  - name: "routingRules"
    type: "RoutingRule"
    multiplicity: "OneToMany"
- name: "IntegrationEndpoint"
  description: "External integration target for webhooks and APIs used in messaging\
    \ flows."
  data:
  - name: "name"
    type: "String"
  - name: "endpointType"
    type: "IntegrationType"
  - name: "url"
    type: "Url"
  - name: "secretReference"
    type: "String"
  relations:
  - name: "workspace"
    type: "MessagingWorkspace"
    multiplicity: "ManyToOne"
  - name: "channels"
    type: "Channel"
    multiplicity: "ManyToMany"
  - name: "routingRules"
    type: "RoutingRule"
    multiplicity: "OneToMany"
- name: "MediaStore"
  description: "Backing storage service used to host message attachments."
  data:
  - name: "name"
    type: "String"
  - name: "storeType"
    type: "MediaStoreType"
  - name: "baseUrl"
    type: "Url"
  - name: "region"
    type: "String"
  relations:
  - name: "workspace"
    type: "MessagingWorkspace"
    multiplicity: "ManyToOne"
  - name: "attachments"
    type: "MessageAttachment"
    multiplicity: "OneToMany"
- name: "Label"
  description: "User-defined categorization applied to conversations and messages."
  data:
  - name: "name"
    type: "String"
  - name: "color"
    type: "String"
  - name: "visibility"
    type: "LabelVisibility"
  relations:
  - name: "workspace"
    type: "MessagingWorkspace"
    multiplicity: "ManyToOne"
  - name: "conversations"
    type: "Conversation"
    multiplicity: "ManyToMany"
  - name: "messages"
    type: "Message"
    multiplicity: "ManyToMany"
- name: "Reaction"
  description: "Lightweight response such as an emoji applied to a message."
  data:
  - name: "emoji"
    type: "String"
  - name: "createdOn"
    type: "Date"
  relations:
  - name: "message"
    type: "Message"
    multiplicity: "ManyToOne"
  - name: "participant"
    type: "Participant"
    multiplicity: "ManyToOne"
enums:
- name: "ChannelType"
  description: "Transport category describing how messages are delivered."
  data:
  - name: "SMS"
  - name: "MMS"
  - name: "Email"
  - name: "Push"
  - name: "InApp"
  - name: "WhatsApp"
  - name: "Slack"
  - name: "WebChat"
- name: "ChannelState"
  description: "Operational readiness of a channel configuration."
  data:
  - name: "Enabled"
  - name: "Disabled"
  - name: "Suspended"
- name: "VerificationStatus"
  description: "Verification state of an addressable endpoint."
  data:
  - name: "Verified"
  - name: "Unverified"
  - name: "Pending"
- name: "ConversationStatus"
  description: "Lifecycle state of a conversation thread."
  data:
  - name: "Active"
  - name: "Resolved"
  - name: "Archived"
  - name: "Closed"
  - name: "Muted"
- name: "PrivacyLevel"
  description: "Access sensitivity classification for a conversation."
  data:
  - name: "Public"
  - name: "Private"
  - name: "Confidential"
- name: "ParticipantRole"
  description: "Functional role a participant plays in a conversation."
  data:
  - name: "Member"
  - name: "Admin"
  - name: "Agent"
  - name: "Bot"
  - name: "Observer"
- name: "NotificationPreference"
  description: "Degree of notification a participant opts to receive."
  data:
  - name: "All"
  - name: "MentionsOnly"
  - name: "None"
- name: "MessageDirection"
  description: "Flow of the message relative to the platform."
  data:
  - name: "Inbound"
  - name: "Outbound"
  - name: "System"
- name: "MessagePriority"
  description: "Relative urgency used for routing and presentation."
  data:
  - name: "Low"
  - name: "Normal"
  - name: "High"
  - name: "Urgent"
- name: "DeliveryStatus"
  description: "Transport and user-delivery state of a message."
  data:
  - name: "Queued"
  - name: "Sent"
  - name: "Delivered"
  - name: "Failed"
  - name: "Bounced"
  - name: "Read"
- name: "QueueType"
  description: "Purpose classification for a message or conversation queue."
  data:
  - name: "Inbox"
  - name: "Outbox"
  - name: "DeadLetter"
  - name: "Escalation"
- name: "ScheduledMessageStatus"
  description: "Execution state of a scheduled message job."
  data:
  - name: "Pending"
  - name: "Scheduled"
  - name: "Paused"
  - name: "Sent"
  - name: "Cancelled"
  - name: "Failed"
- name: "ConsentState"
  description: "Current permission status for messaging a user on a channel."
  data:
  - name: "Granted"
  - name: "Denied"
  - name: "Revoked"
  - name: "Pending"
- name: "PolicyStatus"
  description: "Governance state of a retention policy."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Suspended"
  - name: "Retired"
- name: "PurgeAction"
  description: "Disposition to apply when records exceed retention."
  data:
  - name: "Delete"
  - name: "Anonymize"
  - name: "ExportAndDelete"
- name: "AuditEventType"
  description: "Canonical categories of auditable messaging events."
  data:
  - name: "MessageSent"
  - name: "MessageReceived"
  - name: "MessageFailed"
  - name: "MessageRead"
  - name: "ConversationCreated"
  - name: "ConversationClosed"
  - name: "ConsentUpdated"
  - name: "TemplatePublished"
  - name: "TemplateRetired"
  - name: "RoutingRuleMatched"
  - name: "UserJoined"
  - name: "UserLeft"
  - name: "AttachmentUploaded"
- name: "ActorType"
  description: "Originator classification for an event."
  data:
  - name: "User"
  - name: "System"
  - name: "Bot"
  - name: "Integration"
- name: "RoutingAction"
  description: "Outcome to apply when a routing rule matches."
  data:
  - name: "AssignToQueue"
  - name: "AutoReply"
  - name: "Escalate"
  - name: "InvokeWebhook"
  - name: "HandOffToAgent"
- name: "RuleStatus"
  description: "Activation state of a routing rule."
  data:
  - name: "Enabled"
  - name: "Disabled"
- name: "BotType"
  description: "Functional specialization of a bot."
  data:
  - name: "FAQ"
  - name: "Transactional"
  - name: "Routing"
  - name: "Assistant"
  - name: "Notification"
- name: "BotStatus"
  description: "Operational state of a bot."
  data:
  - name: "Active"
  - name: "Disabled"
  - name: "Maintenance"
- name: "IntegrationType"
  description: "Protocol or pattern used by an integration endpoint."
  data:
  - name: "Webhook"
  - name: "REST"
  - name: "SMTP"
  - name: "SMPP"
  - name: "XMPP"
  - name: "GraphQL"
- name: "MediaStoreType"
  description: "Deployment and access model for attachment storage."
  data:
  - name: "Cloud"
  - name: "OnPrem"
  - name: "CDN"
- name: "LabelVisibility"
  description: "Audience scope for a label applied to records."
  data:
  - name: "Private"
  - name: "Workspace"
  - name: "Public"
valueObjects:
- name: "MessageBody"
  description: "Structured representation of message text and its encoding."
  data:
  - name: "text"
    type: "String"
  - name: "contentType"
    type: "String"
  - name: "charset"
    type: "String"
- name: "Url"
  description: "Network location expressed as a URI or URL string."
  data:
  - name: "value"
    type: "String"
- name: "LanguageTag"
  description: "IETF BCP 47 language identifier for localization."
  data:
  - name: "value"
    type: "String"
- name: "EndpointAddress"
  description: "Opaque address used by a channel to route messages."
  data:
  - name: "value"
    type: "String"
- name: "SchedulePattern"
  description: "Recurrence definition for scheduled message execution."
  data:
  - name: "expression"
    type: "String"
