---
metadata:
  name: "Email Capabilities Model"
  description: "Domain model of capabilities for enterprise email service, encompassing\
    \ mail flow, mailbox management, security, and compliance controls."
  version: "1.0.0"
  industry: "Software"
  category: "Communication"
  type: "Capability"
  domain: "Email"
entities:
- name: "EmailServiceProvider"
  description: "Organization that operates and manages the email infrastructure and\
    \ services offered to tenants."
  data:
  - name: "name"
    type: "String"
  - name: "website"
    type: "String"
  - name: "supportContactEmail"
    type: "EmailAddress"
  - name: "defaultRetentionDays"
    type: "Integer"
  relations:
  - name: "tenants"
    type: "EmailTenant"
    multiplicity: "OneToMany"
  - name: "inboundServers"
    type: "InboundServer"
    multiplicity: "OneToMany"
  - name: "outboundServers"
    type: "OutboundServer"
    multiplicity: "OneToMany"
- name: "EmailTenant"
  description: "Customer account and administrative boundary for domains, users, policies,\
    \ and services."
  data:
  - name: "name"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "outboundSendingEnabled"
    type: "Boolean"
  - name: "maxMailboxSizeMB"
    type: "Integer"
  relations:
  - name: "provider"
    type: "EmailServiceProvider"
    multiplicity: "ManyToOne"
  - name: "domains"
    type: "EmailDomain"
    multiplicity: "OneToMany"
  - name: "users"
    type: "MailboxUser"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "DistributionGroup"
    multiplicity: "OneToMany"
  - name: "spamPolicies"
    type: "SpamFilterPolicy"
    multiplicity: "OneToMany"
  - name: "retentionPolicies"
    type: "RetentionPolicy"
    multiplicity: "OneToMany"
  - name: "legalHolds"
    type: "LegalHold"
    multiplicity: "OneToMany"
  - name: "archiveService"
    type: "ArchiveService"
    multiplicity: "OneToOne"
  - name: "tlsPolicies"
    type: "TLSPolicy"
    multiplicity: "OneToMany"
- name: "EmailDomain"
  description: "DNS domain used for email addresses, authentication, and routing configurations."
  data:
  - name: "domainName"
    type: "DomainName"
  - name: "mxConfigured"
    type: "Boolean"
  - name: "dkimSigningEnabled"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "EmailTenant"
    multiplicity: "ManyToOne"
  - name: "dkimKeys"
    type: "DKIMKey"
    multiplicity: "OneToMany"
  - name: "spfRecords"
    type: "SPFRecord"
    multiplicity: "OneToMany"
  - name: "inboundServers"
    type: "InboundServer"
    multiplicity: "ManyToMany"
  - name: "outboundServers"
    type: "OutboundServer"
    multiplicity: "ManyToMany"
  - name: "tlsPolicies"
    type: "TLSPolicy"
    multiplicity: "ManyToMany"
  - name: "spamPolicies"
    type: "SpamFilterPolicy"
    multiplicity: "ManyToMany"
  - name: "aliases"
    type: "Alias"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "DistributionGroup"
    multiplicity: "OneToMany"
- name: "MailboxUser"
  description: "End user with authentication credentials and a primary mailbox."
  data:
  - name: "username"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "primaryEmail"
    type: "EmailAddress"
  - name: "recoveryEmail"
    type: "EmailAddress"
  - name: "twoFactorEnabled"
    type: "Boolean"
  - name: "timeZone"
    type: "String"
  - name: "locale"
    type: "String"
  - name: "signature"
    type: "String"
  relations:
  - name: "tenant"
    type: "EmailTenant"
    multiplicity: "ManyToOne"
  - name: "mailbox"
    type: "Mailbox"
    multiplicity: "OneToOne"
  - name: "groups"
    type: "DistributionGroup"
    multiplicity: "ManyToMany"
  - name: "aliases"
    type: "Alias"
    multiplicity: "OneToMany"
  - name: "contactLists"
    type: "ContactList"
    multiplicity: "OneToMany"
- name: "Mailbox"
  description: "Storage container for a user’s email, folders, and server-side rules."
  data:
  - name: "mailboxQuotaMB"
    type: "Integer"
  - name: "sizeMB"
    type: "Integer"
  - name: "status"
    type: "MailboxStatus"
  - name: "retentionPolicyDays"
    type: "Integer"
  - name: "journalingEnabled"
    type: "Boolean"
  relations:
  - name: "user"
    type: "MailboxUser"
    multiplicity: "OneToOne"
  - name: "folders"
    type: "Folder"
    multiplicity: "OneToMany"
  - name: "delegates"
    type: "MailboxUser"
    multiplicity: "ManyToMany"
  - name: "autoReply"
    type: "AutoReply"
    multiplicity: "OneToOne"
  - name: "forwardingRules"
    type: "ForwardingRule"
    multiplicity: "OneToMany"
  - name: "filterRules"
    type: "FilterRule"
    multiplicity: "OneToMany"
  - name: "quarantineItems"
    type: "QuarantineItem"
    multiplicity: "OneToMany"
  - name: "complaints"
    type: "Complaint"
    multiplicity: "OneToMany"
  - name: "readReceipts"
    type: "ReadReceipt"
    multiplicity: "OneToMany"
  - name: "legalHolds"
    type: "LegalHold"
    multiplicity: "ManyToMany"
  - name: "inboundServer"
    type: "InboundServer"
    multiplicity: "ManyToOne"
  - name: "smtpCredentials"
    type: "SmtpCredential"
    multiplicity: "OneToMany"
- name: "Folder"
  description: "Logical container within a mailbox that organizes email messages."
  data:
  - name: "name"
    type: "String"
  - name: "folderType"
    type: "FolderType"
  relations:
  - name: "mailbox"
    type: "Mailbox"
    multiplicity: "ManyToOne"
  - name: "messages"
    type: "EmailMessage"
    multiplicity: "OneToMany"
  - name: "retentionPolicy"
    type: "RetentionPolicy"
    multiplicity: "ManyToOne"
- name: "EmailMessage"
  description: "Individual email message with content, headers, and delivery state."
  data:
  - name: "internetMessageId"
    type: "MessageId"
  - name: "subject"
    type: "String"
  - name: "priority"
    type: "MessagePriority"
  - name: "sensitivity"
    type: "MessageSensitivity"
  - name: "contentType"
    type: "ContentType"
  - name: "sizeBytes"
    type: "Integer"
  - name: "hasAttachments"
    type: "Boolean"
  - name: "sentAt"
    type: "DateTime"
  - name: "receivedAt"
    type: "DateTime"
  - name: "readReceiptRequested"
    type: "Boolean"
  - name: "deliveryStatus"
    type: "MessageDeliveryStatus"
  - name: "fromAddress"
    type: "EmailAddress"
  - name: "replyToAddress"
    type: "EmailAddress"
  relations:
  - name: "folder"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "recipients"
    type: "Recipient"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "headers"
    type: "MessageHeader"
    multiplicity: "OneToMany"
  - name: "deliveryAttempts"
    type: "DeliveryAttempt"
    multiplicity: "OneToMany"
  - name: "bounces"
    type: "Bounce"
    multiplicity: "OneToMany"
  - name: "complaints"
    type: "Complaint"
    multiplicity: "OneToMany"
  - name: "quarantineItem"
    type: "QuarantineItem"
    multiplicity: "OneToOne"
  - name: "readReceipts"
    type: "ReadReceipt"
    multiplicity: "OneToMany"
- name: "Recipient"
  description: "Party receiving a message, categorized by To, Cc, or Bcc."
  data:
  - name: "address"
    type: "EmailAddress"
  - name: "recipientType"
    type: "RecipientType"
  - name: "displayName"
    type: "String"
  relations:
  - name: "message"
    type: "EmailMessage"
    multiplicity: "ManyToOne"
- name: "Attachment"
  description: "File or binary content included with an email message."
  data:
  - name: "fileName"
    type: "String"
  - name: "mimeType"
    type: "MimeType"
  - name: "sizeBytes"
    type: "Integer"
  - name: "contentHash"
    type: "Hash"
  relations:
  - name: "message"
    type: "EmailMessage"
    multiplicity: "ManyToOne"
- name: "MessageHeader"
  description: "Name-value pair within the internet message header set."
  data:
  - name: "headerName"
    type: "String"
  - name: "headerValue"
    type: "String"
  relations:
  - name: "message"
    type: "EmailMessage"
    multiplicity: "ManyToOne"
- name: "DeliveryAttempt"
  description: "Record of an SMTP submission or reception event for a message."
  data:
  - name: "direction"
    type: "Direction"
  - name: "remoteHost"
    type: "String"
  - name: "timestamp"
    type: "DateTime"
  - name: "result"
    type: "DeliveryResult"
  - name: "statusCode"
    type: "String"
  - name: "responseText"
    type: "String"
  - name: "tlsMode"
    type: "TLSMode"
  - name: "authenticated"
    type: "Boolean"
  - name: "remoteIp"
    type: "IPAddress"
  relations:
  - name: "message"
    type: "EmailMessage"
    multiplicity: "ManyToOne"
  - name: "outboundServer"
    type: "OutboundServer"
    multiplicity: "ManyToOne"
  - name: "inboundServer"
    type: "InboundServer"
    multiplicity: "ManyToOne"
- name: "Bounce"
  description: "Delivery failure notification associated with a message."
  data:
  - name: "bounceType"
    type: "BounceType"
  - name: "diagnosticCode"
    type: "String"
  - name: "occurredAt"
    type: "DateTime"
  - name: "remoteMTA"
    type: "String"
  - name: "statusCode"
    type: "String"
  relations:
  - name: "message"
    type: "EmailMessage"
    multiplicity: "ManyToOne"
- name: "Complaint"
  description: "Recipient-reported abuse or feedback loop event tied to a message."
  data:
  - name: "source"
    type: "ComplaintSource"
  - name: "complaintAt"
    type: "DateTime"
  - name: "userAgent"
    type: "String"
  - name: "feedbackType"
    type: "String"
  relations:
  - name: "message"
    type: "EmailMessage"
    multiplicity: "ManyToOne"
  - name: "mailbox"
    type: "Mailbox"
    multiplicity: "ManyToOne"
- name: "QuarantineItem"
  description: "Message held due to spam, malware, or policy enforcement for review."
  data:
  - name: "reason"
    type: "QuarantineReason"
  - name: "score"
    type: "Decimal"
  - name: "quarantineAt"
    type: "DateTime"
  - name: "status"
    type: "QuarantineStatus"
  relations:
  - name: "mailbox"
    type: "Mailbox"
    multiplicity: "ManyToOne"
  - name: "message"
    type: "EmailMessage"
    multiplicity: "OneToOne"
  - name: "spamPolicy"
    type: "SpamFilterPolicy"
    multiplicity: "ManyToOne"
- name: "FilterRule"
  description: "Server-side message processing rule with conditions and actions."
  data:
  - name: "name"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  - name: "conditionExpression"
    type: "String"
  - name: "action"
    type: "RuleAction"
  - name: "stopProcessing"
    type: "Boolean"
  relations:
  - name: "mailbox"
    type: "Mailbox"
    multiplicity: "ManyToOne"
  - name: "targetFolder"
    type: "Folder"
    multiplicity: "ManyToOne"
- name: "ForwardingRule"
  description: "Automatic forwarding configuration for a mailbox."
  data:
  - name: "enabled"
    type: "Boolean"
  - name: "destination"
    type: "EmailAddress"
  - name: "keepCopy"
    type: "Boolean"
  relations:
  - name: "mailbox"
    type: "Mailbox"
    multiplicity: "ManyToOne"
- name: "AutoReply"
  description: "Automatic response settings such as out-of-office messages."
  data:
  - name: "enabled"
    type: "Boolean"
  - name: "subject"
    type: "String"
  - name: "message"
    type: "String"
  - name: "startAt"
    type: "DateTime"
  - name: "endAt"
    type: "DateTime"
  - name: "externalOnly"
    type: "Boolean"
  relations:
  - name: "mailbox"
    type: "Mailbox"
    multiplicity: "ManyToOne"
- name: "DistributionGroup"
  description: "Group address that distributes messages to multiple members."
  data:
  - name: "name"
    type: "String"
  - name: "address"
    type: "EmailAddress"
  - name: "allowExternalSenders"
    type: "Boolean"
  - name: "moderationEnabled"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "EmailTenant"
    multiplicity: "ManyToOne"
  - name: "members"
    type: "MailboxUser"
    multiplicity: "ManyToMany"
  - name: "owners"
    type: "MailboxUser"
    multiplicity: "ManyToMany"
  - name: "domain"
    type: "EmailDomain"
    multiplicity: "ManyToOne"
- name: "Alias"
  description: "Additional email address that delivers to a target mailbox."
  data:
  - name: "address"
    type: "EmailAddress"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "domain"
    type: "EmailDomain"
    multiplicity: "ManyToOne"
  - name: "mailbox"
    type: "Mailbox"
    multiplicity: "ManyToOne"
- name: "DKIMKey"
  description: "Cryptographic key and selector used to sign outbound email for a domain."
  data:
  - name: "selector"
    type: "String"
  - name: "publicKey"
    type: "PublicKey"
  - name: "status"
    type: "KeyStatus"
  - name: "createdAt"
    type: "DateTime"
  - name: "rotatedAt"
    type: "DateTime"
  relations:
  - name: "domain"
    type: "EmailDomain"
    multiplicity: "ManyToOne"
- name: "DMARCPolicy"
  description: "Domain-based Message Authentication, Reporting, and Conformance settings."
  data:
  - name: "policy"
    type: "DMARCPolicyDisposition"
  - name: "rua"
    type: "URI"
  - name: "ruf"
    type: "URI"
  - name: "pct"
    type: "Integer"
  - name: "alignmentMode"
    type: "DMARCAlignment"
  relations:
  - name: "domain"
    type: "EmailDomain"
    multiplicity: "ManyToOne"
- name: "SPFRecord"
  description: "Sender Policy Framework configuration published for a domain."
  data:
  - name: "record"
    type: "String"
  - name: "active"
    type: "Boolean"
  - name: "lastCheckedAt"
    type: "DateTime"
  relations:
  - name: "domain"
    type: "EmailDomain"
    multiplicity: "ManyToOne"
- name: "OutboundServer"
  description: "SMTP relay endpoint responsible for sending messages to remote systems."
  data:
  - name: "hostname"
    type: "String"
  - name: "port"
    type: "Integer"
  - name: "protocol"
    type: "ProtocolType"
  - name: "tlsMode"
    type: "TLSMode"
  - name: "authentication"
    type: "AuthMechanism"
  - name: "sendingLimitPerHour"
    type: "Integer"
  relations:
  - name: "provider"
    type: "EmailServiceProvider"
    multiplicity: "ManyToOne"
  - name: "credentials"
    type: "SmtpCredential"
    multiplicity: "OneToMany"
  - name: "domains"
    type: "EmailDomain"
    multiplicity: "ManyToMany"
  - name: "tlsPolicies"
    type: "TLSPolicy"
    multiplicity: "ManyToMany"
- name: "InboundServer"
  description: "IMAP or POP endpoint providing mailbox access for clients."
  data:
  - name: "hostname"
    type: "String"
  - name: "port"
    type: "Integer"
  - name: "protocol"
    type: "ProtocolType"
  - name: "tlsMode"
    type: "TLSMode"
  relations:
  - name: "provider"
    type: "EmailServiceProvider"
    multiplicity: "ManyToOne"
  - name: "domains"
    type: "EmailDomain"
    multiplicity: "ManyToMany"
- name: "SmtpCredential"
  description: "Authentication material used to submit messages to an outbound server."
  data:
  - name: "username"
    type: "String"
  - name: "secretType"
    type: "SecretType"
  - name: "createdAt"
    type: "DateTime"
  - name: "lastUsedAt"
    type: "DateTime"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "server"
    type: "OutboundServer"
    multiplicity: "ManyToOne"
  - name: "domain"
    type: "EmailDomain"
    multiplicity: "ManyToOne"
  - name: "mailbox"
    type: "Mailbox"
    multiplicity: "ManyToOne"
  - name: "tenant"
    type: "EmailTenant"
    multiplicity: "ManyToOne"
- name: "SpamFilterPolicy"
  description: "Scoring thresholds and settings used to detect and mitigate unwanted\
    \ email."
  data:
  - name: "name"
    type: "String"
  - name: "threshold"
    type: "Decimal"
  - name: "quarantineEnabled"
    type: "Boolean"
  - name: "blockAttachments"
    type: "Boolean"
  - name: "spoofProtectionEnabled"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "EmailTenant"
    multiplicity: "ManyToOne"
  - name: "domains"
    type: "EmailDomain"
    multiplicity: "ManyToMany"
- name: "RetentionPolicy"
  description: "Policy defining how long messages are retained and what action to\
    \ take afterward."
  data:
  - name: "name"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  - name: "deleteAction"
    type: "RetentionAction"
  - name: "permanent"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "EmailTenant"
    multiplicity: "ManyToOne"
  - name: "mailboxes"
    type: "Mailbox"
    multiplicity: "ManyToMany"
  - name: "folders"
    type: "Folder"
    multiplicity: "ManyToMany"
- name: "LegalHold"
  description: "Preservation control that prevents content deletion for compliance\
    \ or litigation."
  data:
  - name: "name"
    type: "String"
  - name: "reason"
    type: "String"
  - name: "startAt"
    type: "DateTime"
  - name: "endAt"
    type: "DateTime"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "EmailTenant"
    multiplicity: "ManyToOne"
  - name: "mailboxes"
    type: "Mailbox"
    multiplicity: "ManyToMany"
- name: "ArchiveService"
  description: "Configuration for journaling or archiving messages to an external\
    \ system."
  data:
  - name: "targetUri"
    type: "URI"
  - name: "enabled"
    type: "Boolean"
  - name: "journalingMode"
    type: "JournalingMode"
  - name: "includeInternal"
    type: "Boolean"
  - name: "includeExternal"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "EmailTenant"
    multiplicity: "ManyToOne"
  - name: "domains"
    type: "EmailDomain"
    multiplicity: "ManyToMany"
- name: "ContactList"
  description: "User-maintained collection of external contacts for addressing messages."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "mailbox"
    type: "Mailbox"
    multiplicity: "ManyToOne"
  - name: "contacts"
    type: "ExternalContact"
    multiplicity: "OneToMany"
- name: "ExternalContact"
  description: "Non-tenant contact entry used for addressing and reference."
  data:
  - name: "displayName"
    type: "String"
  - name: "address"
    type: "EmailAddress"
  - name: "company"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "contactList"
    type: "ContactList"
    multiplicity: "ManyToOne"
  - name: "mailbox"
    type: "Mailbox"
    multiplicity: "ManyToOne"
- name: "ReadReceipt"
  description: "Message Disposition Notification indicating recipient interaction."
  data:
  - name: "disposition"
    type: "ReadDisposition"
  - name: "reportedAt"
    type: "DateTime"
  - name: "recipientAddress"
    type: "EmailAddress"
  relations:
  - name: "message"
    type: "EmailMessage"
    multiplicity: "ManyToOne"
  - name: "mailbox"
    type: "Mailbox"
    multiplicity: "ManyToOne"
- name: "TLSPolicy"
  description: "Policy specifying TLS requirements for message transport."
  data:
  - name: "mode"
    type: "TLSPolicyMode"
  - name: "minVersion"
    type: "TLSVersion"
  - name: "mtaStsRequired"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "EmailTenant"
    multiplicity: "ManyToOne"
  - name: "domains"
    type: "EmailDomain"
    multiplicity: "ManyToMany"
  - name: "outboundServers"
    type: "OutboundServer"
    multiplicity: "ManyToMany"
enums:
- name: "MailboxStatus"
  description: "Lifecycle state of a mailbox affecting accessibility and delivery."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Closed"
- name: "FolderType"
  description: "Classification of standard and user-created mail folders."
  data:
  - name: "Inbox"
  - name: "Sent"
  - name: "Drafts"
  - name: "Trash"
  - name: "Spam"
  - name: "Archive"
  - name: "Custom"
- name: "RecipientType"
  description: "Role of a recipient address on a message."
  data:
  - name: "To"
  - name: "Cc"
  - name: "Bcc"
- name: "MessagePriority"
  description: "Relative importance assigned to a message for display or processing."
  data:
  - name: "Low"
  - name: "Normal"
  - name: "High"
- name: "MessageSensitivity"
  description: "Confidentiality indicator used by clients and policies."
  data:
  - name: "Normal"
  - name: "Personal"
  - name: "Private"
  - name: "Confidential"
- name: "ContentType"
  description: "High-level content format of the message body."
  data:
  - name: "PlainText"
  - name: "HTML"
  - name: "Mixed"
  - name: "Calendar"
- name: "MessageDeliveryStatus"
  description: "Delivery lifecycle state for a message."
  data:
  - name: "Draft"
  - name: "Queued"
  - name: "Sent"
  - name: "Delivered"
  - name: "Deferred"
  - name: "Bounced"
  - name: "Failed"
  - name: "Read"
  - name: "Replied"
  - name: "Forwarded"
  - name: "Archived"
  - name: "Deleted"
  - name: "Quarantined"
- name: "ProtocolType"
  description: "Protocol used for mail submission or access."
  data:
  - name: "SMTP"
  - name: "IMAP"
  - name: "POP3"
- name: "TLSMode"
  description: "Transport Layer Security requirement for connections."
  data:
  - name: "None"
  - name: "OpportunisticTLS"
  - name: "RequiredTLS"
- name: "AuthMechanism"
  description: "Authentication approach used by clients and servers."
  data:
  - name: "Password"
  - name: "OAuth2"
  - name: "ClientCertificate"
  - name: "Anonymous"
- name: "KeyStatus"
  description: "Lifecycle state of a cryptographic key."
  data:
  - name: "Pending"
  - name: "Active"
  - name: "Rotating"
  - name: "Retired"
  - name: "Revoked"
- name: "DMARCPolicyDisposition"
  description: "Action requested by DMARC evaluation for failing messages."
