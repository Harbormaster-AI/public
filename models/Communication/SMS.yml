---
metadata:
  name: "SMS Capabilities Model"
  description: "Capabilities model for Short Message Service covering sender identities,\
    \ routing providers, audience management, messaging flows, compliance, scheduling,\
    \ and delivery reporting."
  version: "1.0.0"
  industry: "Telecommunications"
  category: "Communication"
  type: "Capability"
  domain: "SMS"
entities:
- name: "MessagingTenant"
  description: "Administrative boundary representing an organization using the SMS\
    \ platform."
  data:
  - name: "name"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "complianceRegion"
    type: "String"
  - name: "defaultEncoding"
    type: "EncodingType"
  relations:
  - name: "providerAccounts"
    type: "ProviderAccount"
    multiplicity: "OneToMany"
  - name: "senderProfiles"
    type: "SenderProfile"
    multiplicity: "OneToMany"
  - name: "contacts"
    type: "Contact"
    multiplicity: "OneToMany"
  - name: "audienceLists"
    type: "AudienceList"
    multiplicity: "OneToMany"
  - name: "campaigns"
    type: "Campaign"
    multiplicity: "OneToMany"
  - name: "templates"
    type: "Template"
    multiplicity: "OneToMany"
  - name: "rateLimitPolicies"
    type: "RateLimitPolicy"
    multiplicity: "OneToMany"
  - name: "complianceRules"
    type: "ComplianceRule"
    multiplicity: "OneToMany"
- name: "SvcProvider"
  description: "Third-party SMS aggregator or gateway enabling message delivery to\
    \ mobile networks."
  data:
  - name: "name"
    type: "String"
  - name: "baseUrl"
    type: "String"
  - name: "supportsConcatenation"
    type: "Boolean"
  - name: "supportsAlphanumericSender"
    type: "Boolean"
  relations:
  - name: "networks"
    type: "Network"
    multiplicity: "ManyToMany"
  - name: "accounts"
    type: "ProviderAccount"
    multiplicity: "OneToMany"
- name: "ProviderAccount"
  description: "Configured connection from a tenant to a specific service provider."
  data:
  - name: "label"
    type: "String"
  - name: "status"
    type: "ProviderAccountStatus"
  - name: "throughputPerSecond"
    type: "Integer"
  - name: "callbackUrl"
    type: "String"
  - name: "signatureMethod"
    type: "SignatureMethod"
  relations:
  - name: "tenant"
    type: "MessagingTenant"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "SvcProvider"
    multiplicity: "ManyToOne"
  - name: "senderProfiles"
    type: "SenderProfile"
    multiplicity: "OneToMany"
  - name: "rateLimitPolicies"
    type: "RateLimitPolicy"
    multiplicity: "OneToMany"
- name: "SenderProfile"
  description: "Sending identity used for SMS, such as a long code, short code, toll-free\
    \ number, or alphanumeric sender ID."
  data:
  - name: "name"
    type: "String"
  - name: "senderType"
    type: "SenderType"
  - name: "address"
    type: "SenderAddress"
  - name: "country"
    type: "String"
  - name: "defaultEncoding"
    type: "EncodingType"
  - name: "optOutKeyword"
    type: "String"
  - name: "helpKeyword"
    type: "String"
  relations:
  - name: "tenant"
    type: "MessagingTenant"
    multiplicity: "ManyToOne"
  - name: "providerAccount"
    type: "ProviderAccount"
    multiplicity: "ManyToOne"
  - name: "campaigns"
    type: "Campaign"
    multiplicity: "OneToMany"
  - name: "outboundBatches"
    type: "OutboundBatch"
    multiplicity: "OneToMany"
  - name: "outboundMessages"
    type: "OutboundMessage"
    multiplicity: "OneToMany"
  - name: "inboundMessages"
    type: "InboundMessage"
    multiplicity: "OneToMany"
  - name: "conversations"
    type: "Conversation"
    multiplicity: "OneToMany"
  - name: "keywordRules"
    type: "KeywordRule"
    multiplicity: "OneToMany"
  - name: "rateLimitPolicies"
    type: "RateLimitPolicy"
    multiplicity: "OneToMany"
- name: "Network"
  description: "Mobile network operator identified by MCC and MNC codes."
  data:
  - name: "name"
    type: "String"
  - name: "mcc"
    type: "String"
  - name: "mnc"
    type: "String"
  - name: "country"
    type: "String"
  relations:
  - name: "serviceProviders"
    type: "SvcProvider"
    multiplicity: "ManyToMany"
  - name: "deliveryReports"
    type: "DeliveryReport"
    multiplicity: "OneToMany"
  - name: "campaignRegistrations"
    type: "CampaignRegistration"
    multiplicity: "ManyToMany"
- name: "Contact"
  description: "End recipient of SMS messages, represented by an MSISDN and associated\
    \ profile."
  data:
  - name: "msisdn"
    type: "E164Number"
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "locale"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "consentStatus"
    type: "ConsentStatus"
  relations:
  - name: "tenant"
    type: "MessagingTenant"
    multiplicity: "ManyToOne"
  - name: "consents"
    type: "OptInConsent"
    multiplicity: "OneToMany"
  - name: "lists"
    type: "AudienceList"
    multiplicity: "ManyToMany"
  - name: "conversations"
    type: "Conversation"
    multiplicity: "OneToMany"
  - name: "inboundMessages"
    type: "InboundMessage"
    multiplicity: "OneToMany"
  - name: "outboundMessages"
    type: "OutboundMessage"
    multiplicity: "OneToMany"
- name: "AudienceList"
  description: "Managed collection of contacts used for bulk sends and campaigns."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "isDynamic"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "MessagingTenant"
    multiplicity: "ManyToOne"
  - name: "contacts"
    type: "Contact"
    multiplicity: "ManyToMany"
  - name: "campaigns"
    type: "Campaign"
    multiplicity: "OneToMany"
- name: "Campaign"
  description: "Program defining purpose, compliance settings, and audience for ongoing\
    \ SMS communications."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "useCase"
    type: "UseCaseType"
  - name: "status"
    type: "CampaignStatus"
  - name: "primaryKeyword"
    type: "String"
  relations:
  - name: "tenant"
    type: "MessagingTenant"
    multiplicity: "ManyToOne"
  - name: "senderProfile"
    type: "SenderProfile"
    multiplicity: "ManyToOne"
  - name: "audienceList"
    type: "AudienceList"
    multiplicity: "ManyToOne"
  - name: "registrations"
    type: "CampaignRegistration"
    multiplicity: "OneToMany"
  - name: "outboundBatches"
    type: "OutboundBatch"
    multiplicity: "OneToMany"
  - name: "inboundMessages"
    type: "InboundMessage"
    multiplicity: "OneToMany"
  - name: "keywordRules"
    type: "KeywordRule"
    multiplicity: "OneToMany"
- name: "CampaignRegistration"
  description: "Regulatory or carrier registration associated with a campaign and\
    \ applicable networks."
  data:
  - name: "registrationReference"
    type: "String"
  - name: "status"
    type: "RegistrationStatus"
  - name: "jurisdiction"
    type: "String"
  - name: "vertical"
    type: "String"
  relations:
  - name: "campaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
  - name: "networks"
    type: "Network"
    multiplicity: "ManyToMany"
- name: "OutboundBatch"
  description: "Logical grouping of outbound messages intended to be sent together\
    \ or on a schedule."
  data:
  - name: "name"
    type: "String"
  - name: "scheduleStatus"
    type: "ScheduleStatus"
  - name: "scheduledDate"
    type: "Date"
  - name: "scheduledTime"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "totalRequested"
    type: "Integer"
  relations:
  - name: "campaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
  - name: "senderProfile"
    type: "SenderProfile"
    multiplicity: "ManyToOne"
  - name: "messages"
    type: "OutboundMessage"
    multiplicity: "OneToMany"
- name: "OutboundMessage"
  description: "Single outbound SMS transmission to a specific contact."
  data:
  - name: "externalReference"
    type: "String"
  - name: "content"
    type: "MessageText"
  - name: "encoding"
    type: "EncodingType"
  - name: "segmentCount"
    type: "Integer"
  - name: "status"
    type: "MessageStatus"
  - name: "requestDate"
    type: "Date"
  - name: "scheduledDate"
    type: "Date"
  relations:
  - name: "batch"
    type: "OutboundBatch"
    multiplicity: "ManyToOne"
  - name: "recipient"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "senderProfile"
    type: "SenderProfile"
    multiplicity: "ManyToOne"
  - name: "deliveryReports"
    type: "DeliveryReport"
    multiplicity: "OneToMany"
  - name: "parts"
    type: "MessagePart"
    multiplicity: "OneToMany"
  - name: "conversation"
    type: "Conversation"
    multiplicity: "ManyToOne"
  - name: "template"
    type: "Template"
    multiplicity: "ManyToOne"
- name: "MessagePart"
  description: "Segment of a concatenated SMS containing user data header information."
  data:
  - name: "partNumber"
    type: "Integer"
  - name: "byteLength"
    type: "Integer"
  - name: "udh"
    type: "String"
  relations:
  - name: "message"
    type: "OutboundMessage"
    multiplicity: "ManyToOne"
- name: "DeliveryReport"
  description: "Status notification from the network or provider regarding message\
    \ delivery outcome."
  data:
  - name: "state"
    type: "DeliveryState"
  - name: "description"
    type: "String"
  - name: "errorCode"
    type: "String"
  - name: "providerTimestamp"
    type: "Date"
  relations:
  - name: "message"
    type: "OutboundMessage"
    multiplicity: "ManyToOne"
  - name: "network"
    type: "Network"
    multiplicity: "ManyToOne"
  - name: "providerAccount"
    type: "ProviderAccount"
    multiplicity: "ManyToOne"
- name: "InboundMessage"
  description: "SMS received from a contact, potentially triggering keyword rules\
    \ or replies."
  data:
  - name: "content"
    type: "MessageText"
  - name: "receivedDate"
    type: "Date"
  - name: "encoding"
    type: "EncodingType"
  - name: "keywordMatched"
    type: "String"
  relations:
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "senderProfile"
    type: "SenderProfile"
    multiplicity: "ManyToOne"
  - name: "conversation"
    type: "Conversation"
    multiplicity: "ManyToOne"
  - name: "campaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
- name: "Conversation"
  description: "Ongoing message thread between a sender profile and a single contact."
  data:
  - name: "topic"
    type: "String"
  - name: "lastActivity"
    type: "Date"
  - name: "status"
    type: "ConversationStatus"
  relations:
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "senderProfile"
    type: "SenderProfile"
    multiplicity: "ManyToOne"
  - name: "inboundMessages"
    type: "InboundMessage"
    multiplicity: "OneToMany"
  - name: "outboundMessages"
    type: "OutboundMessage"
    multiplicity: "OneToMany"
- name: "OptInConsent"
  description: "Record of a contact’s permission to receive SMS messages for a specific\
    \ context."
  data:
  - name: "status"
    type: "ConsentStatus"
  - name: "method"
    type: "ConsentMethod"
  - name: "captureDate"
    type: "Date"
  - name: "proofReference"
    type: "String"
  relations:
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "senderProfile"
    type: "SenderProfile"
    multiplicity: "ManyToOne"
  - name: "campaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
  - name: "tenant"
    type: "MessagingTenant"
    multiplicity: "ManyToOne"
- name: "KeywordRule"
  description: "Matching rule that associates inbound keywords with automated responses\
    \ or routing."
  data:
  - name: "keyword"
    type: "String"
  - name: "matchType"
    type: "KeywordMatchType"
  - name: "caseSensitive"
    type: "Boolean"
  - name: "autoReplyEnabled"
    type: "Boolean"
  relations:
  - name: "senderProfile"
    type: "SenderProfile"
    multiplicity: "ManyToOne"
  - name: "campaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
  - name: "template"
    type: "Template"
    multiplicity: "ManyToOne"
- name: "Template"
  description: "Reusable SMS text with placeholders for personalization."
  data:
  - name: "name"
    type: "String"
  - name: "body"
    type: "TemplateText"
  - name: "variableCount"
    type: "Integer"
  - name: "language"
    type: "String"
  relations:
  - name: "tenant"
    type: "MessagingTenant"
    multiplicity: "ManyToOne"
- name: "RateLimitPolicy"
  description: "Throttling configuration controlling message throughput across scopes."
  data:
  - name: "name"
    type: "String"
  - name: "scope"
    type: "RateLimitScope"
  - name: "maxMessagesPerSecond"
    type: "Integer"
  - name: "burstSize"
    type: "Integer"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "MessagingTenant"
    multiplicity: "ManyToOne"
  - name: "providerAccount"
    type: "ProviderAccount"
    multiplicity: "ManyToOne"
  - name: "senderProfile"
    type: "SenderProfile"
    multiplicity: "ManyToOne"
  - name: "campaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
- name: "ComplianceRule"
  description: "Policy controlling message eligibility based on content or delivery\
    \ constraints."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "ComplianceRuleType"
  - name: "parameter"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "MessagingTenant"
    multiplicity: "ManyToOne"
  - name: "campaigns"
    type: "Campaign"
    multiplicity: "ManyToMany"
  - name: "senderProfiles"
    type: "SenderProfile"
    multiplicity: "ManyToMany"
- name: "ScheduleRestriction"
  description: "Quiet hours or time-window limits applied to sending behavior."
  data:
  - name: "name"
    type: "String"
  - name: "startLocalTime"
    type: "String"
  - name: "endLocalTime"
    type: "String"
  - name: "timeZone"
    type: "String"
  relations:
  - name: "tenant"
    type: "MessagingTenant"
    multiplicity: "ManyToOne"
  - name: "campaigns"
    type: "Campaign"
    multiplicity: "ManyToMany"
  - name: "senderProfiles"
    type: "SenderProfile"
    multiplicity: "ManyToMany"
enums:
- name: "SenderType"
  description: "Classification of sender identity used to deliver SMS."
  data:
  - name: "LongCode"
  - name: "ShortCode"
  - name: "TollFree"
  - name: "Alphanumeric"
- name: "EncodingType"
  description: "Character encoding strategy applied to SMS content."
  data:
  - name: "GSM7"
  - name: "UCS2"
  - name: "Auto"
- name: "MessageStatus"
  description: "Lifecycle state of an outbound message within the platform."
  data:
  - name: "Draft"
  - name: "Queued"
  - name: "Sending"
  - name: "Sent"
  - name: "Delivered"
  - name: "Undeliverable"
  - name: "Failed"
  - name: "Rejected"
  - name: "Expired"
- name: "DeliveryState"
  description: "Provider or network-reported delivery outcome for an outbound message."
  data:
  - name: "Submitted"
  - name: "Delivered"
  - name: "Failed"
  - name: "Rejected"
  - name: "Buffered"
  - name: "Unknown"
- name: "ConsentStatus"
  description: "Current permission state for contacting a recipient via SMS."
  data:
  - name: "OptedIn"
  - name: "OptedOut"
  - name: "Pending"
- name: "ConsentMethod"
  description: "Mechanism by which consent was obtained or updated."
  data:
  - name: "SMSKeyword"
  - name: "WebForm"
  - name: "Voice"
  - name: "Paper"
  - name: "API"
- name: "CampaignStatus"
  description: "Operational state of an SMS campaign."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Suspended"
  - name: "Active"
  - name: "Paused"
  - name: "Closed"
- name: "UseCaseType"
  description: "Primary messaging purpose defined for a campaign."
  data:
  - name: "Marketing"
  - name: "Transactional"
  - name: "OneTimePasscode"
  - name: "Alerts"
  - name: "CustomerCare"
- name: "RegistrationStatus"
  description: "Status of a carrier or regulatory registration record."
  data:
  - name: "NotSubmitted"
  - name: "Submitted"
  - name: "InReview"
  - name: "Approved"
  - name: "Rejected"
  - name: "Suspended"
- name: "ProviderAccountStatus"
  description: "Availability and verification state of a provider account."
  data:
  - name: "Active"
  - name: "Disabled"
  - name: "PendingVerification"
- name: "KeywordMatchType"
  description: "Rule used to match inbound text to a configured keyword."
  data:
  - name: "Exact"
  - name: "Prefix"
  - name: "Contains"
  - name: "Regex"
- name: "ConversationStatus"
  description: "Progress state of a two-way message thread."
  data:
  - name: "Open"
  - name: "Idle"
  - name: "Closed"
- name: "ScheduleStatus"
  description: "Execution progress for a scheduled batch of messages."
  data:
  - name: "Pending"
  - name: "Scheduled"
  - name: "Executing"
  - name: "Completed"
  - name: "Cancelled"
  - name: "Failed"
- name: "RateLimitScope"
  description: "Context in which a throughput limit is enforced."
  data:
  - name: "Tenant"
  - name: "ProviderAccount"
  - name: "SenderProfile"
  - name: "Campaign"
- name: "SignatureMethod"
  description: "Method used to verify callback requests from a provider."
  data:
  - name: "None"
  - name: "BasicAuth"
  - name: "HMACSHA256"
  - name: "OAuth2"
- name: "ComplianceRuleType"
  description: "Policy types applied to govern sending and content."
  data:
  - name: "QuietHours"
  - name: "GeographicRestriction"
  - name: "AgeGating"
  - name: "ContentFilter"
valueObjects:
- name: "E164Number"
  description: "Normalized international telephone number formatted per E.164."
  data:
  - name: "value"
    type: "String"
- name: "SenderAddress"
  description: "Sender identity value as presented to recipients, including numbers\
    \ and alphanumeric IDs."
  data:
  - name: "value"
    type: "String"
- name: "MessageText"
  description: "SMS text payload used for inbound or outbound messages."
  data:
  - name: "text"
    type: "String"
- name: "TemplateText"
  description: "Reusable template body containing zero or more placeholders."
  data:
  - name: "body"
    type: "String"
