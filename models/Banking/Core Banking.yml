---
metadata:
  name: "Core Banking Capabilities Model"
  description: "Canonical HCIDL capabilities model for core banking operations covering\
    \ customers, deposit accounts, interest, fees, transactions, and ledger posting."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Banking"
  type: "Capability"
  domain: "Core Banking"
entities:
- name: "Bank"
  description: "Regulated financial institution providing core banking services."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "country"
    type: "String"
  - name: "swiftBic"
    type: "SwiftBic"
  - name: "website"
    type: "String"
  relations:
  - name: "branches"
    type: "Branch"
    multiplicity: "OneToMany"
  - name: "customers"
    type: "Customer"
    multiplicity: "OneToMany"
  - name: "products"
    type: "DepositProduct"
    multiplicity: "OneToMany"
  - name: "ledgerAccounts"
    type: "LedgerAccount"
    multiplicity: "OneToMany"
  - name: "exchangeRates"
    type: "ExchangeRate"
    multiplicity: "OneToMany"
- name: "Branch"
  description: "Physical or logical operating unit of a bank serving customers and\
    \ accounts."
  data:
  - name: "name"
    type: "String"
  - name: "branchCode"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "phone"
    type: "PhoneNumber"
  - name: "timeZone"
    type: "String"
  relations:
  - name: "bank"
    type: "Bank"
    multiplicity: "ManyToOne"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "customers"
    type: "Customer"
    multiplicity: "OneToMany"
- name: "Customer"
  description: "Person or organization holding deposit relationships with the bank."
  data:
  - name: "fullName"
    type: "String"
  - name: "customerType"
    type: "CustomerType"
  - name: "dateOfBirth"
    type: "Date"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "address"
    type: "Address"
  - name: "residenceCountry"
    type: "String"
  relations:
  - name: "bank"
    type: "Bank"
    multiplicity: "ManyToOne"
  - name: "homeBranch"
    type: "Branch"
    multiplicity: "ManyToOne"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "beneficiaries"
    type: "Beneficiary"
    multiplicity: "OneToMany"
  - name: "mandates"
    type: "Mandate"
    multiplicity: "OneToMany"
  - name: "kycRecord"
    type: "KYCRecord"
    multiplicity: "OneToOne"
- name: "KYCRecord"
  description: "Compliance profile capturing customer verification and risk assessment."
  data:
  - name: "status"
    type: "KYCStatus"
  - name: "riskRating"
    type: "RiskRating"
  - name: "assessmentDate"
    type: "Date"
  - name: "politicallyExposedPerson"
    type: "Boolean"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "OneToOne"
  - name: "documents"
    type: "KYCDocument"
    multiplicity: "OneToMany"
- name: "KYCDocument"
  description: "Document used to verify customer identity or address for compliance\
    \ purposes."
  data:
  - name: "documentType"
    type: "KYCDocumentType"
  - name: "documentNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "countryOfIssue"
    type: "String"
  relations:
  - name: "kycRecord"
    type: "KYCRecord"
    multiplicity: "ManyToOne"
- name: "DepositProduct"
  description: "Configurable offering defining features of a class of deposit accounts."
  data:
  - name: "name"
    type: "String"
  - name: "productCode"
    type: "String"
  - name: "accountType"
    type: "AccountType"
  - name: "currency"
    type: "String"
  - name: "minimumOpeningDeposit"
    type: "Money"
  - name: "minimumBalance"
    type: "Money"
  - name: "overdraftAllowed"
    type: "Boolean"
  relations:
  - name: "bank"
    type: "Bank"
    multiplicity: "ManyToOne"
  - name: "interestPlan"
    type: "InterestPlan"
    multiplicity: "ManyToOne"
  - name: "feePolicy"
    type: "FeePolicy"
    multiplicity: "ManyToOne"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
- name: "InterestPlan"
  description: "Rules governing interest accrual, calculation, and compounding for\
    \ a product."
  data:
  - name: "name"
    type: "String"
  - name: "calculationMethod"
    type: "InterestBasis"
  - name: "dayCountConvention"
    type: "DayCountConvention"
  - name: "accrualMethod"
    type: "AccrualMethod"
  - name: "annualRate"
    type: "Percentage"
  - name: "compoundingFrequency"
    type: "Frequency"
  relations:
  - name: "products"
    type: "DepositProduct"
    multiplicity: "OneToMany"
  - name: "rateTiers"
    type: "InterestTier"
    multiplicity: "OneToMany"
- name: "InterestTier"
  description: "Balance-based tier defining an annual interest rate within an interest\
    \ plan."
  data:
  - name: "minBalance"
    type: "Money"
  - name: "maxBalance"
    type: "Money"
  - name: "annualRate"
    type: "Percentage"
  relations:
  - name: "interestPlan"
    type: "InterestPlan"
    multiplicity: "ManyToOne"
- name: "FeePolicy"
  description: "Grouping of fee rules applied to accounts under a product."
  data:
  - name: "name"
    type: "String"
  - name: "policyDescription"
    type: "String"
  relations:
  - name: "feeDefinitions"
    type: "FeeDefinition"
    multiplicity: "OneToMany"
  - name: "products"
    type: "DepositProduct"
    multiplicity: "OneToMany"
- name: "FeeDefinition"
  description: "Specific fee configuration including trigger and charge method."
  data:
  - name: "name"
    type: "String"
  - name: "feeType"
    type: "FeeType"
  - name: "chargeMethod"
    type: "FeeChargeMethod"
  - name: "flatAmount"
    type: "Money"
  - name: "rate"
    type: "Percentage"
  - name: "triggerEvent"
    type: "FeeTriggerEvent"
  relations:
  - name: "feePolicy"
    type: "FeePolicy"
    multiplicity: "ManyToOne"
- name: "Account"
  description: "Customer-held deposit ledger supporting balances, transactions, and\
    \ servicing."
  data:
  - name: "accountNumber"
    type: "AccountNumber"
  - name: "accountType"
    type: "AccountType"
  - name: "status"
    type: "AccountStatus"
  - name: "openedDate"
    type: "Date"
  - name: "currentBalance"
    type: "Money"
  - name: "availableBalance"
    type: "Money"
  - name: "interestAccrued"
    type: "Money"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "branch"
    type: "Branch"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "DepositProduct"
    multiplicity: "ManyToOne"
  - name: "overdraftArrangement"
    type: "OverdraftArrangement"
    multiplicity: "OneToOne"
  - name: "transactionLimit"
    type: "TransactionLimit"
    multiplicity: "OneToOne"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
  - name: "statements"
    type: "Statement"
    multiplicity: "OneToMany"
  - name: "standingOrders"
    type: "StandingOrder"
    multiplicity: "OneToMany"
- name: "OverdraftArrangement"
  description: "Authorized negative balance facility attached to a deposit account."
  data:
  - name: "limitAmount"
    type: "Money"
  - name: "interestRate"
    type: "Percentage"
  - name: "reviewDate"
    type: "Date"
  - name: "status"
    type: "OverdraftStatus"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "OneToOne"
- name: "TransactionLimit"
  description: "Operational limits constraining transaction amounts on an account."
  data:
  - name: "dailyLimit"
    type: "Money"
  - name: "perTransactionLimit"
    type: "Money"
  - name: "currency"
    type: "String"
  - name: "lastResetDate"
    type: "Date"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "OneToOne"
- name: "Transaction"
  description: "Monetary movement posted to an account ledger."
  data:
  - name: "transactionReference"
    type: "String"
  - name: "bookingDate"
    type: "Date"
  - name: "valueDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "transactionType"
    type: "TransactionType"
  - name: "status"
    type: "TransactionStatus"
  - name: "description"
    type: "String"
  - name: "channel"
    type: "ChannelType"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "counterpartyBeneficiary"
    type: "Beneficiary"
    multiplicity: "ManyToOne"
  - name: "journalEntry"
    type: "JournalEntry"
    multiplicity: "OneToOne"
  - name: "statement"
    type: "Statement"
    multiplicity: "ManyToOne"
- name: "Statement"
  description: "Periodic report of account activity and balances."
  data:
  - name: "statementNumber"
    type: "String"
  - name: "period"
    type: "DateRange"
  - name: "openingBalance"
    type: "Money"
  - name: "closingBalance"
    type: "Money"
  - name: "generatedAt"
    type: "DateTime"
  - name: "format"
    type: "StatementFormat"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
- name: "StandingOrder"
  description: "Pre-authorized, recurring payment instruction from a source account."
  data:
  - name: "reference"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "frequency"
    type: "Frequency"
  - name: "status"
    type: "StandingOrderStatus"
  - name: "nextExecutionDate"
    type: "Date"
  relations:
  - name: "sourceAccount"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "beneficiary"
    type: "Beneficiary"
    multiplicity: "ManyToOne"
- name: "Beneficiary"
  description: "Counterparty payee information used for transfers and standing orders."
  data:
  - name: "name"
    type: "String"
  - name: "accountNumber"
    type: "AccountNumber"
  - name: "bankName"
    type: "String"
  - name: "bankSwiftBic"
    type: "SwiftBic"
  - name: "country"
    type: "String"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
- name: "Mandate"
  description: "Authorization allowing a creditor to initiate direct debit collections."
  data:
  - name: "mandateReference"
    type: "String"
  - name: "mandateType"
    type: "MandateType"
  - name: "status"
    type: "MandateStatus"
  - name: "signatureDate"
    type: "Date"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "creditor"
    type: "Creditor"
    multiplicity: "ManyToOne"
  - name: "sourceAccount"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "Creditor"
  description: "Organization authorized to collect funds from customers under mandates."
  data:
  - name: "name"
    type: "String"
  - name: "creditorIdentifier"
    type: "String"
  - name: "country"
    type: "String"
  relations:
  - name: "mandates"
    type: "Mandate"
    multiplicity: "OneToMany"
- name: "JournalEntry"
  description: "Double-entry accounting record representing a balanced posting."
  data:
  - name: "entryNumber"
    type: "String"
  - name: "entryDate"
    type: "DateTime"
  - name: "description"
    type: "String"
  - name: "status"
    type: "JournalStatus"
  relations:
  - name: "transaction"
    type: "Transaction"
    multiplicity: "OneToOne"
  - name: "lines"
    type: "JournalLine"
    multiplicity: "OneToMany"
- name: "JournalLine"
  description: "Line within a journal entry specifying debit or credit to a ledger\
    \ account."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "side"
    type: "LedgerSide"
  - name: "amount"
    type: "Money"
  - name: "memo"
    type: "String"
  relations:
  - name: "journalEntry"
    type: "JournalEntry"
    multiplicity: "ManyToOne"
  - name: "ledgerAccount"
    type: "LedgerAccount"
    multiplicity: "ManyToOne"
- name: "LedgerAccount"
  description: "General ledger account used for financial reporting and control."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "accountType"
    type: "GLAccountType"
  - name: "isBalanceSheet"
    type: "Boolean"
  relations:
  - name: "bank"
    type: "Bank"
    multiplicity: "ManyToOne"
  - name: "parentAccount"
    type: "LedgerAccount"
    multiplicity: "ManyToOne"
  - name: "childAccounts"
    type: "LedgerAccount"
    multiplicity: "OneToMany"
  - name: "journalLines"
    type: "JournalLine"
    multiplicity: "OneToMany"
- name: "ExchangeRate"
  description: "FX rate used for currency conversions within the bank."
  data:
  - name: "baseCurrency"
    type: "String"
  - name: "counterCurrency"
    type: "String"
  - name: "rate"
    type: "Decimal"
  - name: "effectiveDate"
    type: "Date"
  relations:
  - name: "bank"
    type: "Bank"
    multiplicity: "ManyToOne"
enums:
- name: "AccountType"
  description: "Classification of deposit accounts by purpose and features."
  data:
  - name: "Checking"
  - name: "Savings"
  - name: "Current"
  - name: "TimeDeposit"
  - name: "MoneyMarket"
- name: "AccountStatus"
  description: "Lifecycle state of a deposit account."
  data:
  - name: "Active"
  - name: "Dormant"
  - name: "Frozen"
  - name: "Closed"
- name: "CustomerType"
  description: "Category of customer based on legal nature."
  data:
  - name: "Individual"
  - name: "Business"
  - name: "Government"
  - name: "NonProfit"
- name: "KYCStatus"
  description: "Verification and ongoing monitoring status for compliance."
  data:
  - name: "Pending"
  - name: "Verified"
  - name: "Expired"
  - name: "FailedReview"
- name: "RiskRating"
  description: "Assessed financial crime risk level of a customer."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
- name: "KYCDocumentType"
  description: "Types of documents accepted for customer verification."
  data:
  - name: "Passport"
  - name: "NationalID"
  - name: "DriverLicense"
  - name: "UtilityBill"
  - name: "BusinessRegistration"
- name: "TransactionType"
  description: "Nature of monetary movement recorded on an account."
  data:
  - name: "Credit"
  - name: "Debit"
  - name: "Interest"
  - name: "Fee"
  - name: "Adjustment"
  - name: "Chargeback"
  - name: "FXConversion"
- name: "TransactionStatus"
  description: "Processing state of a transaction in the ledger."
  data:
  - name: "Pending"
  - name: "Posted"
  - name: "Reversed"
  - name: "Rejected"
- name: "ChannelType"
  description: "Channel through which a banking activity was initiated."
  data:
  - name: "Branch"
  - name: "ATM"
  - name: "OnlineBanking"
  - name: "MobileBanking"
  - name: "API"
- name: "JournalStatus"
  description: "Status of a journal entry in the accounting lifecycle."
  data:
  - name: "Draft"
  - name: "Posted"
  - name: "Reversed"
- name: "LedgerSide"
  description: "Accounting side of a journal line."
  data:
  - name: "Debit"
  - name: "Credit"
- name: "GLAccountType"
  description: "Financial classification of a general ledger account."
  data:
  - name: "Asset"
  - name: "Liability"
  - name: "Equity"
  - name: "Income"
  - name: "Expense"
- name: "StandingOrderStatus"
  description: "Lifecycle state of a recurring payment instruction."
  data:
  - name: "Active"
  - name: "Paused"
  - name: "Cancelled"
  - name: "Expired"
- name: "Frequency"
  description: "Recurrence pattern for scheduled activities."
  data:
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Annually"
- name: "FeeType"
  description: "Classification of service charges applied to accounts."
  data:
  - name: "Maintenance"
  - name: "ATMWithdrawal"
  - name: "Transfer"
  - name: "Overdraft"
  - name: "Inactivity"
- name: "FeeChargeMethod"
  description: "Method by which a fee amount is determined."
  data:
  - name: "Flat"
  - name: "Percentage"
- name: "InterestBasis"
  description: "Method used to compute interest on balances."
  data:
  - name: "Simple"
  - name: "Compound"
- name: "DayCountConvention"
  description: "Basis for determining the accrual fraction of a year."
  data:
  - name: "Actual360"
  - name: "Actual365"
  - name: "Thirty360"
- name: "AccrualMethod"
  description: "Balance measurement used for interest accrual."
  data:
  - name: "EndOfDayBalance"
  - name: "AverageDailyBalance"
- name: "MandateType"
  description: "Type of authorization enabling pull-based payments."
  data:
  - name: "DirectDebit"
- name: "MandateStatus"
  description: "Current state of a payment mandate."
  data:
  - name: "Active"
  - name: "Revoked"
  - name: "Expired"
- name: "StatementFormat"
  description: "Output format in which account statements are produced."
  data:
  - name: "PDF"
  - name: "CSV"
  - name: "XML"
- name: "OverdraftStatus"
  description: "Operational state of an overdraft facility."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Closed"
- name: "FeeTriggerEvent"
  description: "Event or condition that causes a fee to be assessed."
  data:
  - name: "AccountMaintenance"
  - name: "ATMWithdrawal"
  - name: "DomesticTransfer"
  - name: "InternationalTransfer"
  - name: "OverdraftUsage"
  - name: "InactivityPeriod"
valueObjects:
- name: "Money"
  description: "Monetary value composed of an amount and its currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal location details used for correspondence and KYC."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "EmailAddress"
  description: "Electronic mail address in standard internet format."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "Telephone contact number with country prefix."
  data:
  - name: "countryCode"
    type: "String"
  - name: "number"
    type: "String"
- name: "AccountNumber"
  description: "Bank-issued identifier for a deposit account."
  data:
  - name: "value"
    type: "String"
- name: "Percentage"
  description: "Proportion expressed as a percent of 100."
  data:
  - name: "value"
    type: "Decimal"
- name: "DateRange"
  description: "Inclusive period between a start and end date."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "SwiftBic"
  description: "Bank identifier code used for international payments."
  data:
  - name: "value"
    type: "String"
