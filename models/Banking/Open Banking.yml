---
metadata:
  name: "HCIDL Open Banking Capabilities Model"
  description: "Capability model for regulated Open Banking ecosystems covering data\
    \ sharing, consented access, and payment initiation between data holders and accredited\
    \ third parties."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Banking"
  type: "Capability"
  domain: "Open Banking"
entities:
- name: "DataHolder"
  description: "Regulated institution that exposes Open Banking APIs and holds customer\
    \ accounts."
  data:
  - name: "name"
    type: "String"
  - name: "legalEntityIdentifier"
    type: "String"
  - name: "country"
    type: "String"
  - name: "baseApiUrl"
    type: "URL"
  - name: "sandboxAvailable"
    type: "Boolean"
  relations:
  - name: "apiProducts"
    type: "APIProduct"
    multiplicity: "OneToMany"
  - name: "apiClients"
    type: "APIClient"
    multiplicity: "OneToMany"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "paymentInitiations"
    type: "PaymentInitiation"
    multiplicity: "OneToMany"
- name: "DataRecipient"
  description: "Accredited third-party provider that consumes Open Banking APIs as\
    \ an AISP, PISP, or CBPII."
  data:
  - name: "name"
    type: "String"
  - name: "registrationNumber"
    type: "String"
  - name: "role"
    type: "TPPRole"
  - name: "softwareStatement"
    type: "String"
  - name: "website"
    type: "URL"
  relations:
  - name: "apiClients"
    type: "APIClient"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "Consent"
    multiplicity: "OneToMany"
  - name: "paymentInitiations"
    type: "PaymentInitiation"
    multiplicity: "OneToMany"
  - name: "webhookEndpoints"
    type: "WebhookEndpoint"
    multiplicity: "OneToMany"
  - name: "directoryRegistrations"
    type: "DirectoryRegistration"
    multiplicity: "OneToMany"
- name: "PSU"
  description: "Payment service user whose data may be shared and who authorises actions\
    \ under Open Banking."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "residencyCountry"
    type: "String"
  relations:
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "Consent"
    multiplicity: "OneToMany"
  - name: "paymentInitiations"
    type: "PaymentInitiation"
    multiplicity: "OneToMany"
- name: "APIProduct"
  description: "Versioned grouping of APIs and scopes published by a data holder for\
    \ accredited clients."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "status"
    type: "ProductStatus"
  relations:
  - name: "dataHolder"
    type: "DataHolder"
    multiplicity: "ManyToOne"
  - name: "apiClients"
    type: "APIClient"
    multiplicity: "ManyToMany"
  - name: "usageQuotas"
    type: "APIUsageQuota"
    multiplicity: "OneToMany"
- name: "APIClient"
  description: "OAuth client configuration used by a data recipient to access a specific\
    \ data holder."
  data:
  - name: "name"
    type: "String"
  - name: "clientType"
    type: "ClientType"
  - name: "redirectUri"
    type: "URL"
  - name: "certificateSubject"
    type: "String"
  - name: "jwkSetUrl"
    type: "URL"
  relations:
  - name: "dataHolder"
    type: "DataHolder"
    multiplicity: "ManyToOne"
  - name: "dataRecipient"
    type: "DataRecipient"
    multiplicity: "ManyToOne"
  - name: "apiProducts"
    type: "APIProduct"
    multiplicity: "ManyToMany"
  - name: "accessGrants"
    type: "OAuthAccessGrant"
    multiplicity: "OneToMany"
  - name: "accessRequests"
    type: "DataAccessRequest"
    multiplicity: "OneToMany"
- name: "Account"
  description: "Bank account made accessible through Open Banking APIs."
  data:
  - name: "name"
    type: "String"
  - name: "accountType"
    type: "AccountType"
  - name: "currency"
    type: "String"
  - name: "iban"
    type: "IBAN"
  - name: "bic"
    type: "BIC"
  - name: "domesticAccount"
    type: "DomesticAccount"
  relations:
  - name: "dataHolder"
    type: "DataHolder"
    multiplicity: "ManyToOne"
  - name: "psu"
    type: "PSU"
    multiplicity: "ManyToOne"
  - name: "balances"
    type: "AccountBalance"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "AccountTransaction"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "Consent"
    multiplicity: "ManyToMany"
- name: "AccountBalance"
  description: "Reported balance for an account at a point in time."
  data:
  - name: "balanceType"
    type: "BalanceType"
  - name: "amount"
    type: "Money"
  - name: "timestamp"
    type: "DateTime"
  - name: "isCleared"
    type: "Boolean"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "AccountTransaction"
  description: "Monetary movement posted or pending on an account."
  data:
  - name: "bookingDate"
    type: "Date"
  - name: "valueDate"
    type: "Date"
  - name: "status"
    type: "TransactionStatus"
  - name: "amount"
    type: "Money"
  - name: "creditorName"
    type: "String"
  - name: "debtorName"
    type: "String"
  - name: "remittanceInformation"
    type: "String"
  - name: "merchantCategoryCode"
    type: "String"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "paymentInitiation"
    type: "PaymentInitiation"
    multiplicity: "ManyToOne"
- name: "Consent"
  description: "Permission granted by the PSU to a data recipient to access resources\
    \ at a data holder."
  data:
  - name: "status"
    type: "ConsentStatus"
  - name: "durationDays"
    type: "Integer"
  - name: "createdAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  - name: "revocationReason"
    type: "String"
  relations:
  - name: "dataHolder"
    type: "DataHolder"
    multiplicity: "ManyToOne"
  - name: "dataRecipient"
    type: "DataRecipient"
    multiplicity: "ManyToOne"
  - name: "psu"
    type: "PSU"
    multiplicity: "ManyToOne"
  - name: "permissions"
    type: "ConsentPermission"
    multiplicity: "OneToMany"
  - name: "accounts"
    type: "Account"
    multiplicity: "ManyToMany"
  - name: "authorisations"
    type: "ConsentAuthorisation"
    multiplicity: "OneToMany"
  - name: "accessGrants"
    type: "OAuthAccessGrant"
    multiplicity: "OneToMany"
  - name: "accessRequests"
    type: "DataAccessRequest"
    multiplicity: "OneToMany"
  - name: "eventNotifications"
    type: "EventNotification"
    multiplicity: "OneToMany"
- name: "ConsentPermission"
  description: "Individual permission granted within a consent."
  data:
  - name: "permission"
    type: "Permission"
  relations:
  - name: "consent"
    type: "Consent"
    multiplicity: "ManyToOne"
- name: "ConsentAuthorisation"
  description: "Strong customer authentication session for a consent."
  data:
  - name: "method"
    type: "SCAApproach"
  - name: "status"
    type: "AuthorisationStatus"
  - name: "createdAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  - name: "ipAddress"
    type: "String"
  relations:
  - name: "consent"
    type: "Consent"
    multiplicity: "ManyToOne"
  - name: "scaChallenges"
    type: "SCAChallenge"
    multiplicity: "OneToMany"
- name: "SCAChallenge"
  description: "Verification step executed during SCA, such as OTP or app approval."
  data:
  - name: "channel"
    type: "SCAChannel"
  - name: "result"
    type: "ChallengeResult"
  - name: "reference"
    type: "String"
  - name: "issuedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  relations:
  - name: "consentAuthorisation"
    type: "ConsentAuthorisation"
    multiplicity: "ManyToOne"
- name: "OAuthAccessGrant"
  description: "OAuth grant record including tokens associated to a consented client."
  data:
  - name: "grantType"
    type: "GrantType"
  - name: "accessToken"
    type: "String"
  - name: "refreshToken"
    type: "String"
  - name: "expiresAt"
    type: "DateTime"
  - name: "scope"
    type: "String"
  relations:
  - name: "apiClient"
    type: "APIClient"
    multiplicity: "ManyToOne"
  - name: "consent"
    type: "Consent"
    multiplicity: "ManyToOne"
  - name: "paymentSubmissions"
    type: "PaymentSubmission"
    multiplicity: "OneToMany"
- name: "DataAccessRequest"
  description: "Invocation attempt by a client to retrieve or modify resources under\
    \ a consent."
  data:
  - name: "resourceType"
    type: "ResourceType"
  - name: "requestTime"
    type: "DateTime"
  - name: "outcome"
    type: "AccessOutcome"
  - name: "traceId"
    type: "String"
  relations:
  - name: "apiClient"
    type: "APIClient"
    multiplicity: "ManyToOne"
  - name: "consent"
    type: "Consent"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "accessLogs"
    type: "ResourceAccessLog"
    multiplicity: "OneToMany"
- name: "ResourceAccessLog"
  description: "Immutable audit event detailing the result of a resource access."
  data:
  - name: "eventTime"
    type: "DateTime"
  - name: "action"
    type: "AccessAction"
  - name: "result"
    type: "AccessOutcome"
  - name: "requesterIp"
    type: "String"
  - name: "userAgent"
    type: "String"
  relations:
  - name: "dataAccessRequest"
    type: "DataAccessRequest"
    multiplicity: "ManyToOne"
- name: "PaymentInitiation"
  description: "Payment order created by a PISP for execution at a data holder."
  data:
  - name: "paymentType"
    type: "PaymentType"
  - name: "scheme"
    type: "PaymentScheme"
  - name: "instructedAmount"
    type: "Money"
  - name: "requestedExecutionDate"
    type: "Date"
  - name: "status"
    type: "PaymentStatus"
  - name: "remittanceInformation"
    type: "String"
  relations:
  - name: "dataHolder"
    type: "DataHolder"
    multiplicity: "ManyToOne"
  - name: "dataRecipient"
    type: "DataRecipient"
    multiplicity: "ManyToOne"
  - name: "psu"
    type: "PSU"
    multiplicity: "ManyToOne"
  - name: "debtorAccount"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "payee"
    type: "Payee"
    multiplicity: "ManyToOne"
  - name: "submissions"
    type: "PaymentSubmission"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "AccountTransaction"
    multiplicity: "OneToMany"
  - name: "eventNotifications"
    type: "EventNotification"
    multiplicity: "OneToMany"
- name: "PaymentSubmission"
  description: "Submission attempt of a payment initiation to the data holder."
  data:
  - name: "submissionTime"
    type: "DateTime"
  - name: "channel"
    type: "SubmissionChannel"
  - name: "status"
    type: "SubmissionStatus"
  - name: "providerReference"
    type: "String"
  - name: "errorCode"
    type: "String"
  relations:
  - name: "paymentInitiation"
    type: "PaymentInitiation"
    multiplicity: "ManyToOne"
  - name: "accessGrant"
    type: "OAuthAccessGrant"
    multiplicity: "ManyToOne"
- name: "Payee"
  description: "Recipient party for a payment, including account coordinates."
  data:
  - name: "name"
    type: "String"
  - name: "accountHolderType"
    type: "PartyType"
  - name: "iban"
    type: "IBAN"
  - name: "bic"
    type: "BIC"
  - name: "domesticAccount"
    type: "DomesticAccount"
  - name: "address"
    type: "Address"
  relations:
  - name: "paymentInitiations"
    type: "PaymentInitiation"
    multiplicity: "OneToMany"
- name: "WebhookEndpoint"
  description: "Callback endpoint where event notifications are delivered."
  data:
  - name: "url"
    type: "URL"
  - name: "description"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  - name: "secret"
    type: "String"
  relations:
  - name: "dataRecipient"
    type: "DataRecipient"
    multiplicity: "ManyToOne"
  - name: "notifications"
    type: "EventNotification"
    multiplicity: "OneToMany"
- name: "EventNotification"
  description: "Delivery record for an event sent to a webhook endpoint."
  data:
  - name: "eventTime"
    type: "DateTime"
  - name: "eventType"
    type: "EventType"
  - name: "payloadSignature"
    type: "String"
  - name: "deliveryStatus"
    type: "DeliveryStatus"
  - name: "retryCount"
    type: "Integer"
  relations:
  - name: "webhookEndpoint"
    type: "WebhookEndpoint"
    multiplicity: "ManyToOne"
  - name: "consent"
    type: "Consent"
    multiplicity: "ManyToOne"
  - name: "paymentInitiation"
    type: "PaymentInitiation"
    multiplicity: "ManyToOne"
- name: "APIUsageQuota"
  description: "Throttling policy linking a product to a client."
  data:
  - name: "timeUnit"
    type: "QuotaUnit"
  - name: "requestLimit"
    type: "Integer"
  - name: "burstLimit"
    type: "Integer"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "apiProduct"
    type: "APIProduct"
    multiplicity: "ManyToOne"
  - name: "apiClient"
    type: "APIClient"
    multiplicity: "ManyToOne"
- name: "DirectoryRegistration"
  description: "Compliance registration details of a data recipient in an industry\
    \ directory."
  data:
  - name: "authorityName"
    type: "String"
  - name: "registrationStatus"
    type: "RegistrationStatus"
  - name: "certificateFingerprint"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "dataRecipient"
    type: "DataRecipient"
    multiplicity: "ManyToOne"
enums:
- name: "TPPRole"
  description: "Regulated role of the data recipient under Open Banking."
  data:
  - name: "AISP"
  - name: "PISP"
  - name: "CBPII"
- name: "ProductStatus"
  description: "Lifecycle state of an API product exposed by a data holder."
  data:
  - name: "Active"
  - name: "Beta"
  - name: "Deprecated"
  - name: "Retired"
- name: "ClientType"
  description: "OAuth client classification indicating credential handling and confidentiality."
  data:
  - name: "Confidential"
  - name: "Public"
- name: "ConsentStatus"
  description: "Current state of a consent granted by a PSU."
  data:
  - name: "Pending"
  - name: "Authorised"
  - name: "Rejected"
  - name: "Revoked"
  - name: "Expired"
- name: "SCAApproach"
  description: "Method used to conduct strong customer authentication."
  data:
  - name: "Redirect"
  - name: "Embedded"
  - name: "Decoupled"
- name: "AuthorisationStatus"
  description: "Processing status of an SCA authorisation session."
  data:
  - name: "Initiated"
  - name: "InProgress"
  - name: "Completed"
  - name: "Failed"
  - name: "Abandoned"
- name: "SCAChannel"
  description: "Delivery channel used to challenge the PSU during SCA."
  data:
  - name: "SMS"
  - name: "App"
  - name: "Push"
  - name: "Email"
  - name: "Voice"
- name: "ChallengeResult"
  description: "Outcome of an individual SCA challenge step."
  data:
  - name: "Succeeded"
  - name: "Failed"
  - name: "Cancelled"
  - name: "Timeout"
- name: "AccountType"
  description: "Classification of bank account supported in Open Banking."
  data:
  - name: "Current"
  - name: "Savings"
  - name: "CreditCard"
  - name: "Loan"
  - name: "EMoney"
- name: "BalanceType"
  description: "Balance measurement category for an account."
  data:
  - name: "ClosingBooked"
  - name: "InterimBooked"
  - name: "InterimAvailable"
  - name: "Expected"
- name: "TransactionStatus"
  description: "Posting and processing status of an account transaction."
  data:
  - name: "Pending"
  - name: "Booked"
  - name: "Reversed"
- name: "ResourceType"
  description: "API resource category accessed under a consent."
  data:
  - name: "Accounts"
  - name: "Transactions"
  - name: "Balances"
  - name: "Payments"
  - name: "Consents"
- name: "AccessOutcome"
  description: "Result of an access attempt against the Open Banking APIs."
  data:
  - name: "Success"
  - name: "Denied"
  - name: "Error"
- name: "AccessAction"
  description: "Operation performed against a protected resource."
  data:
  - name: "Read"
  - name: "Create"
  - name: "Update"
  - name: "Delete"
- name: "GrantType"
  description: "OAuth grant mechanism used to obtain tokens."
  data:
  - name: "AuthorizationCode"
  - name: "ClientCredentials"
  - name: "RefreshToken"
- name: "PaymentType"
  description: "Category of payment initiation supported by Open Banking."
  data:
  - name: "Domestic"
  - name: "SEPA"
  - name: "International"
  - name: "Immediate"
  - name: "Scheduled"
- name: "PaymentScheme"
  description: "Payment rail or clearing scheme used to execute the payment."
  data:
  - name: "FasterPayments"
  - name: "SEPAInstant"
  - name: "SEPACreditTransfer"
  - name: "ACH"
  - name: "Wire"
- name: "PaymentStatus"
  description: "Processing status of a payment initiation across its lifecycle."
  data:
  - name: "InitiationPending"
  - name: "AcceptedCustomerProfile"
  - name: "AcceptedTechnicalValidation"
  - name: "Rejected"
  - name: "Completed"
- name: "SubmissionChannel"
  description: "Channel used to submit the payment order to the data holder."
  data:
  - name: "API"
  - name: "File"
- name: "SubmissionStatus"
  description: "Outcome of a payment submission attempt."
  data:
  - name: "Submitted"
  - name: "Acknowledged"
  - name: "Failed"
  - name: "Settled"
  - name: "Cancelled"
- name: "PartyType"
  description: "Legal nature of the counterparty receiving funds."
  data:
  - name: "Individual"
  - name: "Organisation"
- name: "EventType"
  description: "Type of business event emitted for webhook notification."
  data:
  - name: "ConsentRevoked"
  - name: "ConsentExpired"
  - name: "PaymentCompleted"
  - name: "PaymentRejected"
  - name: "AccountAccessed"
- name: "DeliveryStatus"
  description: "Delivery state of an event notification to a webhook endpoint."
  data:
  - name: "Delivered"
  - name: "Retrying"
  - name: "Failed"
  - name: "Discarded"
- name: "QuotaUnit"
  description: "Time granularity used for API throttling limits."
  data:
  - name: "Minute"
  - name: "Hour"
  - name: "Day"
- name: "RegistrationStatus"
  description: "Status of a data recipient within a supervisory or industry directory."
  data:
  - name: "Registered"
  - name: "Suspended"
  - name: "Revoked"
- name: "Permission"
  description: "Fine-grained scope authorising access to specific data or capabilities."
  data:
  - name: "ReadAccountsBasic"
  - name: "ReadAccountsDetail"
  - name: "ReadBalances"
  - name: "ReadTransactionsBasic"
  - name: "ReadTransactionsDetail"
  - name: "ReadBeneficiaries"
  - name: "CreatePayments"
  - name: "ReadPayments"
valueObjects:
- name: "IBAN"
  description: "International Bank Account Number identifying an account in the SEPA\
    \ region."
  data:
  - name: "value"
    type: "String"
- name: "BIC"
  description: "Bank Identifier Code designating a financial institution in messaging\
    \ networks."
  data:
  - name: "value"
    type: "String"
- name: "DomesticAccount"
  description: "National account identification used for domestic payments."
  data:
  - name: "sortCode"
    type: "String"
  - name: "accountNumber"
    type: "String"
- name: "Money"
  description: "Monetary amount paired with an ISO currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address for counterparties and account holders."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "URL"
  description: "Absolute URL value used for endpoints and redirects."
  data:
  - name: "value"
    type: "String"
