---
metadata:
  name: "Commercial Banking Capabilities Model"
  description: "A domain capability model capturing core commercial banking functions\
    \ including corporate client management, cash management, payments, lending, and\
    \ treasury services."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Banking"
  type: "Capability"
  domain: "Commercial Banking"
entities:
- name: "CommercialBank"
  description: "Legal banking entity providing commercial banking services to corporate\
    \ and institutional clients."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "swiftBic"
    type: "String"
  - name: "domicileCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "businessUnits"
    type: "BusinessUnit"
    multiplicity: "OneToMany"
  - name: "clients"
    type: "CorporateClient"
    multiplicity: "OneToMany"
- name: "BusinessUnit"
  description: "Organizational division responsible for a portfolio of products, services,\
    \ or client segments."
  data:
  - name: "name"
    type: "String"
  - name: "unitType"
    type: "BusinessUnitType"
  - name: "region"
    type: "String"
  relations:
  - name: "bank"
    type: "CommercialBank"
    multiplicity: "ManyToOne"
  - name: "relationshipManagers"
    type: "RelationshipManager"
    multiplicity: "OneToMany"
- name: "RelationshipManager"
  description: "Bank employee responsible for the primary relationship with assigned\
    \ corporate clients."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "territory"
    type: "String"
  relations:
  - name: "businessUnit"
    type: "BusinessUnit"
    multiplicity: "ManyToOne"
  - name: "clients"
    type: "CorporateClient"
    multiplicity: "OneToMany"
- name: "CorporateClient"
  description: "Corporate or institutional customer of the bank."
  data:
  - name: "legalName"
    type: "String"
  - name: "taxIdentifier"
    type: "TaxIdentifier"
  - name: "industrySector"
    type: "String"
  - name: "companySize"
    type: "CompanySize"
  - name: "incorporationCountry"
    type: "String"
  - name: "registeredAddress"
    type: "Address"
  - name: "kycStatus"
    type: "KYCStatus"
  - name: "riskGrade"
    type: "RiskGrade"
  - name: "leiCode"
    type: "String"
  relations:
  - name: "relationshipManager"
    type: "RelationshipManager"
    multiplicity: "ManyToOne"
  - name: "accounts"
    type: "DepositAccount"
    multiplicity: "OneToMany"
  - name: "creditFacilities"
    type: "CreditFacility"
    multiplicity: "OneToMany"
  - name: "signatories"
    type: "Signatory"
    multiplicity: "OneToMany"
  - name: "parentClient"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "subsidiaries"
    type: "CorporateClient"
    multiplicity: "OneToMany"
  - name: "treasuryServices"
    type: "TreasuryService"
    multiplicity: "OneToMany"
  - name: "pricingAgreements"
    type: "PricingAgreement"
    multiplicity: "OneToMany"
  - name: "serviceRequests"
    type: "ServiceRequest"
    multiplicity: "OneToMany"
  - name: "onboardingPackages"
    type: "OnboardingPackage"
    multiplicity: "OneToMany"
  - name: "fxContracts"
    type: "FXContract"
    multiplicity: "OneToMany"
  - name: "accountAnalysisStatements"
    type: "AccountAnalysisStatement"
    multiplicity: "OneToMany"
- name: "Signatory"
  description: "Authorized individual representing the corporate client for banking\
    \ instructions."
  data:
  - name: "fullName"
    type: "String"
  - name: "roleTitle"
    type: "String"
  - name: "contact"
    type: "ContactDetails"
  - name: "authorizationLevel"
    type: "AuthorizationLevel"
  - name: "activeFrom"
    type: "Date"
  - name: "activeTo"
    type: "Date"
  relations:
  - name: "client"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "mandates"
    type: "Mandate"
    multiplicity: "OneToMany"
- name: "Mandate"
  description: "Authorization rule set defining how signatories may operate an account."
  data:
  - name: "mandateReference"
    type: "String"
  - name: "ruleType"
    type: "MandateRuleType"
  - name: "thresholdAmount"
    type: "Money"
  - name: "jointSignaturesRequired"
    type: "Integer"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "account"
    type: "DepositAccount"
    multiplicity: "ManyToOne"
  - name: "signatories"
    type: "Signatory"
    multiplicity: "ManyToMany"
- name: "DepositAccount"
  description: "Demand or savings deposit used for operating, escrow, or other commercial\
    \ purposes."
  data:
  - name: "accountNumber"
    type: "AccountNumber"
  - name: "accountName"
    type: "String"
  - name: "accountType"
    type: "AccountType"
  - name: "accountStatus"
    type: "AccountStatus"
  - name: "baseCurrency"
    type: "String"
  - name: "interestRate"
    type: "Percentage"
  - name: "openedDate"
    type: "Date"
  relations:
  - name: "client"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
  - name: "statements"
    type: "AccountStatement"
    multiplicity: "OneToMany"
  - name: "balances"
    type: "AccountBalance"
    multiplicity: "OneToMany"
  - name: "mandates"
    type: "Mandate"
    multiplicity: "OneToMany"
  - name: "sweepArrangements"
    type: "SweepArrangement"
    multiplicity: "OneToMany"
- name: "AccountBalance"
  description: "Dated monetary balance record for a deposit account."
  data:
  - name: "balanceDate"
    type: "Date"
  - name: "balanceType"
    type: "BalanceType"
  - name: "amount"
    type: "Money"
  relations:
  - name: "account"
    type: "DepositAccount"
    multiplicity: "ManyToOne"
- name: "AccountStatement"
  description: "Periodic statement summarizing account activity and balances."
  data:
  - name: "statementNumber"
    type: "String"
  - name: "period"
    type: "DateRange"
  - name: "frequency"
    type: "StatementFrequency"
  - name: "generatedDate"
    type: "Date"
  - name: "openingBalance"
    type: "Money"
  - name: "closingBalance"
    type: "Money"
  relations:
  - name: "account"
    type: "DepositAccount"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
- name: "Transaction"
  description: "Posted or pending movement of funds on a deposit account."
  data:
  - name: "bookingDate"
    type: "Date"
  - name: "valueDate"
    type: "Date"
  - name: "transactionType"
    type: "TransactionType"
  - name: "description"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "creditDebit"
    type: "CreditDebit"
  - name: "status"
    type: "TransactionStatus"
  - name: "reference"
    type: "PaymentReference"
  relations:
  - name: "account"
    type: "DepositAccount"
    multiplicity: "ManyToOne"
  - name: "paymentInstruction"
    type: "PaymentInstruction"
    multiplicity: "ManyToOne"
- name: "PaymentBatch"
  description: "Group of payment instructions processed together for a client."
  data:
  - name: "batchReference"
    type: "String"
  - name: "creationDate"
    type: "Date"
  - name: "totalAmount"
    type: "Money"
  - name: "paymentCount"
    type: "Integer"
  - name: "status"
    type: "PaymentBatchStatus"
  relations:
  - name: "client"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "payments"
    type: "PaymentInstruction"
    multiplicity: "OneToMany"
- name: "PaymentInstruction"
  description: "Instruction to move funds via a specific rail such as wire, ACH, or\
    \ RTP."
  data:
  - name: "instructionReference"
    type: "String"
  - name: "paymentMethod"
    type: "PaymentMethod"
  - name: "paymentChannel"
    type: "PaymentChannel"
  - name: "requestedExecutionDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "debtorAccountNumber"
    type: "AccountNumber"
  - name: "creditorName"
    type: "String"
  - name: "creditorAccountNumber"
    type: "AccountNumber"
  - name: "creditorBankBIC"
    type: "BIC"
  - name: "status"
    type: "PaymentStatus"
  - name: "purposeCode"
    type: "String"
  relations:
  - name: "batch"
    type: "PaymentBatch"
    multiplicity: "ManyToOne"
  - name: "originatingClient"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
- name: "SweepArrangement"
  description: "Automated funds transfer rule between accounts for liquidity optimization."
  data:
  - name: "sweepType"
    type: "SweepType"
  - name: "triggerBalance"
    type: "Money"
  - name: "targetBalance"
    type: "Money"
  - name: "frequency"
    type: "SweepFrequency"
  - name: "activeFrom"
    type: "Date"
  - name: "activeTo"
    type: "Date"
  relations:
  - name: "sourceAccount"
    type: "DepositAccount"
    multiplicity: "ManyToOne"
  - name: "targetAccount"
    type: "DepositAccount"
    multiplicity: "ManyToOne"
  - name: "client"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
- name: "NotionalPool"
  description: "Virtual pooling of balances for interest optimization without physical\
    \ funds movement."
  data:
  - name: "poolName"
    type: "String"
  - name: "currency"
    type: "String"
  - name: "interestAllocationMethod"
    type: "InterestAllocationMethod"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "masterAccount"
    type: "DepositAccount"
    multiplicity: "ManyToOne"
  - name: "participantAccounts"
    type: "DepositAccount"
    multiplicity: "ManyToMany"
  - name: "client"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
- name: "TreasuryService"
  description: "Cash management service subscribed by the client to manage payables,\
    \ receivables, and liquidity."
  data:
  - name: "serviceName"
    type: "String"
  - name: "serviceType"
    type: "TreasuryServiceType"
  - name: "activationDate"
    type: "Date"
  - name: "status"
    type: "ServiceStatus"
  relations:
  - name: "client"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "accounts"
    type: "DepositAccount"
    multiplicity: "ManyToMany"
  - name: "pricingAgreement"
    type: "PricingAgreement"
    multiplicity: "ManyToOne"
- name: "PricingAgreement"
  description: "Contractual pricing terms governing fees for services provided to\
    \ the client."
  data:
  - name: "agreementReference"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "billingMethod"
    type: "BillingMethod"
  - name: "discountRate"
    type: "Percentage"
  relations:
  - name: "client"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "feeSchedules"
    type: "FeeSchedule"
    multiplicity: "OneToMany"
  - name: "services"
    type: "TreasuryService"
    multiplicity: "OneToMany"
- name: "FeeSchedule"
  description: "Specific fee rule and rate for a defined service or charge type."
  data:
  - name: "chargeType"
    type: "ChargeType"
  - name: "calculationMethod"
    type: "FeeCalculationMethod"
  - name: "unitPrice"
    type: "Money"
  - name: "minimumCharge"
    type: "Money"
  - name: "thresholdVolume"
    type: "Integer"
  - name: "currency"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "pricingAgreement"
    type: "PricingAgreement"
    multiplicity: "ManyToOne"
- name: "AccountAnalysisStatement"
  description: "Periodic billing statement itemizing service usage, fees, and earnings\
    \ credit."
  data:
  - name: "statementReference"
    type: "String"
  - name: "period"
    type: "DateRange"
  - name: "generatedDate"
    type: "Date"
  - name: "totalFees"
    type: "Money"
  - name: "adjustments"
    type: "Money"
  relations:
  - name: "client"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "feeItems"
    type: "FeeItem"
    multiplicity: "OneToMany"
- name: "FeeItem"
  description: "Detailed line item representing a fee charge for a service during\
    \ the billing period."
  data:
  - name: "serviceName"
    type: "String"
  - name: "chargeType"
    type: "ChargeType"
  - name: "quantity"
    type: "Integer"
  - name: "unitPrice"
    type: "Money"
  - name: "amount"
    type: "Money"
  relations:
  - name: "accountAnalysisStatement"
    type: "AccountAnalysisStatement"
    multiplicity: "ManyToOne"
  - name: "relatedService"
    type: "TreasuryService"
    multiplicity: "ManyToOne"
- name: "CreditFacility"
  description: "Credit arrangement providing the client with borrowing capacity under\
    \ defined terms."
  data:
  - name: "facilityReference"
    type: "String"
  - name: "facilityType"
    type: "FacilityType"
  - name: "status"
    type: "FacilityStatus"
  - name: "currency"
    type: "String"
  - name: "limitAmount"
    type: "Money"
  - name: "startDate"
    type: "Date"
  - name: "maturityDate"
    type: "Date"
  - name: "interestRateType"
    type: "InterestRateType"
  - name: "spreadBps"
    type: "Integer"
  - name: "collateralRequired"
    type: "Boolean"
  relations:
  - name: "client"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "covenants"
    type: "Covenant"
    multiplicity: "OneToMany"
  - name: "collaterals"
    type: "Collateral"
    multiplicity: "OneToMany"
  - name: "loans"
    type: "Loan"
    multiplicity: "OneToMany"
  - name: "guarantors"
    type: "Guarantor"
    multiplicity: "ManyToMany"
  - name: "pricingGrids"
    type: "PricingGrid"
    multiplicity: "OneToMany"
- name: "Loan"
  description: "Drawn borrowing under a facility with specific repayment terms."
  data:
  - name: "loanReference"
    type: "String"
  - name: "loanType"
    type: "LoanType"
  - name: "principalAmount"
    type: "Money"
  - name: "outstandingPrincipal"
    type: "Money"
  - name: "originationDate"
    type: "Date"
  - name: "maturityDate"
    type: "Date"
  - name: "interestRateType"
    type: "InterestRateType"
  - name: "rateIndex"
    type: "String"
  - name: "spreadBps"
    type: "Integer"
  - name: "repaymentFrequency"
    type: "RepaymentFrequency"
  - name: "status"
    type: "LoanStatus"
  relations:
  - name: "facility"
    type: "CreditFacility"
    multiplicity: "ManyToOne"
  - name: "schedules"
    type: "RepaymentSchedule"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "LoanTransaction"
    multiplicity: "OneToMany"
- name: "RepaymentSchedule"
  description: "Scheduled repayment obligations for a loan."
  data:
  - name: "installmentNumber"
    type: "Integer"
  - name: "dueDate"
    type: "Date"
  - name: "principalDue"
    type: "Money"
  - name: "interestDue"
    type: "Money"
  - name: "feesDue"
    type: "Money"
  - name: "status"
    type: "InstallmentStatus"
  relations:
  - name: "loan"
    type: "Loan"
    multiplicity: "ManyToOne"
- name: "LoanTransaction"
  description: "Monetary event affecting the loan balance or accruals."
  data:
  - name: "postingDate"
    type: "Date"
  - name: "transactionType"
    type: "LoanTransactionType"
  - name: "amount"
    type: "Money"
  - name: "description"
    type: "String"
  relations:
  - name: "loan"
    type: "Loan"
    multiplicity: "ManyToOne"
- name: "Covenant"
  description: "Contractual obligation or ratio requirement attached to a credit facility."
  data:
  - name: "covenantType"
    type: "CovenantType"
  - name: "thresholdValue"
    type: "Decimal"
  - name: "measurementFrequency"
    type: "CovenantFrequency"
  - name: "graceDays"
    type: "Integer"
  - name: "status"
    type: "CovenantStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "facility"
    type: "CreditFacility"
    multiplicity: "ManyToOne"
  - name: "measurements"
    type: "CovenantMeasurement"
    multiplicity: "OneToMany"
- name: "CovenantMeasurement"
  description: "Recorded measurement of a covenant for a defined period."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "measuredValue"
    type: "Decimal"
  - name: "inCompliance"
    type: "Boolean"
  - name: "comment"
    type: "String"
  relations:
  - name: "covenant"
    type: "Covenant"
    multiplicity: "ManyToOne"
- name: "Collateral"
  description: "Asset pledged as security for a facility."
  data:
  - name: "collateralType"
    type: "CollateralType"
  - name: "description"
    type: "String"
  - name: "appraisedValue"
    type: "Money"
  - name: "jurisdiction"
    type: "String"
  - name: "perfected"
    type: "Boolean"
  relations:
  - name: "facility"
    type: "CreditFacility"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
- name: "Guarantor"
  description: "Party providing a guarantee to support the client’s obligations."
  data:
  - name: "name"
    type: "String"
  - name: "guaranteeType"
    type: "GuaranteeType"
  - name: "guaranteeAmount"
    type: "Money"
  relations:
  - name: "facilities"
    type: "CreditFacility"
    multiplicity: "ManyToMany"
  - name: "client"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
- name: "PricingGrid"
  description: "Tiered pricing schedule for a facility based on defined metrics."
  data:
  - name: "tierName"
    type: "String"
  - name: "leverageFrom"
    type: "Decimal"
  - name: "leverageTo"
    type: "Decimal"
  - name: "spreadBps"
    type: "Integer"
  - name: "commitmentFeeBps"
    type: "Integer"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "facility"
    type: "CreditFacility"
    multiplicity: "ManyToOne"
- name: "ServiceRequest"
  description: "Client-initiated request or case for service or support."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "category"
    type: "ServiceRequestCategory"
  - name: "description"
    type: "String"
  - name: "creationDate"
    type: "Date"
  - name: "status"
    type: "ServiceRequestStatus"
  - name: "priority"
    type: "PriorityLevel"
  relations:
  - name: "client"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "relatedAccount"
    type: "DepositAccount"
    multiplicity: "ManyToOne"
  - name: "relatedPayment"
    type: "PaymentInstruction"
    multiplicity: "ManyToOne"
- name: "OnboardingPackage"
  description: "Collection of documents, data, and approvals required to onboard a\
    \ client."
  data:
  - name: "packageReference"
    type: "String"
  - name: "submissionDate"
    type: "Date"
  - name: "status"
    type: "OnboardingStatus"
  - name: "reviewDeadline"
    type: "Date"
  relations:
  - name: "client"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "requiredDocuments"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "Document"
  description: "Artefact provided or generated during onboarding or periodic reviews."
  data:
  - name: "documentName"
    type: "String"
  - name: "documentType"
    type: "DocumentType"
  - name: "receivedDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "status"
    type: "DocumentStatus"
  relations:
  - name: "onboardingPackage"
    type: "OnboardingPackage"
    multiplicity: "ManyToOne"
- name: "Approval"
  description: "Decision record from an authorized reviewer for an onboarding or service\
    \ change."
  data:
  - name: "approverName"
    type: "String"
  - name: "role"
    type: "String"
  - name: "approvalDate"
    type: "Date"
  - name: "outcome"
    type: "ApprovalOutcome"
  - name: "comments"
    type: "String"
  relations:
  - name: "onboardingPackage"
    type: "OnboardingPackage"
    multiplicity: "ManyToOne"
- name: "FXContract"
  description: "Foreign exchange deal executed on behalf of a client."
  data:
  - name: "contractReference"
    type: "String"
  - name: "tradeDate"
    type: "Date"
  - name: "valueDate"
    type: "Date"
  - name: "buyCurrency"
    type: "String"
  - name: "sellCurrency"
    type: "String"
  - name: "buyAmount"
    type: "Decimal"
  - name: "sellAmount"
    type: "Decimal"
  - name: "rate"
    type: "Decimal"
  - name: "contractType"
    type: "FXContractType"
  - name: "status"
    type: "FXContractStatus"
  relations:
  - name: "client"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
enums:
- name: "BusinessUnitType"
  description: "Types of organizational units within a commercial bank."
  data:
  - name: "CorporateBanking"
  - name: "MiddleMarket"
  - name: "SME"
  - name: "GlobalTransactionBanking"
  - name: "PublicSector"
- name: "CompanySize"
  description: "Classification of corporate client size for segmentation and coverage."
  data:
  - name: "Small"
  - name: "Mid"
  - name: "Large"
  - name: "Enterprise"
- name: "KYCStatus"
  description: "Status of know-your-customer due diligence."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
  - name: "RefreshDue"
- name: "RiskGrade"
  description: "Internal risk rating assigned to the client."
  data:
  - name: "Low"
  - name: "Moderate"
  - name: "High"
  - name: "VeryHigh"
- name: "AccountType"
  description: "Categories of deposit accounts used by commercial clients."
  data:
  - name: "OperatingChecking"
  - name: "InterestChecking"
  - name: "Savings"
  - name: "Escrow"
  - name: "Payroll"
  - name: "Trust"
  - name: "Virtual"
- name: "AccountStatus"
  description: "Lifecycle status of a deposit account."
  data:
  - name: "Active"
