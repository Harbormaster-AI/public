---
metadata:
  name: "Trade Finance Capabilities Model"
  description: "Comprehensive capabilities model for trade finance instruments, lifecycle\
    \ processing, documentation, compliance, and settlement among banks and corporate\
    \ participants."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Banking"
  type: "Capability"
  domain: "Trade Finance"
entities:
- name: "FinancialInstitution"
  description: "Regulated bank or financial institution participating in trade transactions\
    \ and messaging."
  data:
  - name: "legalName"
    type: "String"
  - name: "bic"
    type: "BIC"
  - name: "country"
    type: "String"
  - name: "swiftEnabled"
    type: "Boolean"
  relations:
  - name: "correspondentBanks"
    type: "FinancialInstitution"
    multiplicity: "ManyToMany"
- name: "CorporateClient"
  description: "Corporate customer utilizing trade finance products and services."
  data:
  - name: "legalName"
    type: "String"
  - name: "registrationNumber"
    type: "String"
  - name: "industrySector"
    type: "String"
  - name: "domicileCountry"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "primaryBank"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "complianceProfile"
    type: "ComplianceProfile"
    multiplicity: "OneToOne"
  - name: "tradeLoans"
    type: "TradeLoan"
    multiplicity: "OneToMany"
- name: "TradingParty"
  description: "External party to a trade transaction, such as beneficiary, buyer,\
    \ seller, or drawee."
  data:
  - name: "name"
    type: "String"
  - name: "partyType"
    type: "PartyType"
  - name: "country"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "taxId"
    type: "String"
  - name: "contactEmail"
    type: "String"
  relations:
  - name: "counterpartyBanks"
    type: "FinancialInstitution"
    multiplicity: "ManyToMany"
  - name: "complianceProfile"
    type: "ComplianceProfile"
    multiplicity: "OneToOne"
- name: "LetterOfCredit"
  description: "Documentary credit issued by a bank in favor of a beneficiary, subject\
    \ to trade rules and terms."
  data:
  - name: "lcNumber"
    type: "String"
  - name: "type"
    type: "LCType"
  - name: "status"
    type: "LCStatus"
  - name: "amount"
    type: "Money"
  - name: "issueDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "placeOfExpiry"
    type: "String"
  - name: "tenorType"
    type: "TenorType"
  - name: "transferable"
    type: "Boolean"
  - name: "latestShipmentDate"
    type: "Date"
  - name: "partialShipmentsAllowed"
    type: "Boolean"
  - name: "revolving"
    type: "Boolean"
  relations:
  - name: "applicant"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "beneficiary"
    type: "TradingParty"
    multiplicity: "ManyToOne"
  - name: "issuingBank"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "advisingBank"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "confirmingBank"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "amendments"
    type: "LCAmendment"
    multiplicity: "OneToMany"
  - name: "presentations"
    type: "Presentation"
    multiplicity: "OneToMany"
  - name: "charges"
    type: "Charge"
    multiplicity: "OneToMany"
  - name: "screeningResults"
    type: "ScreeningResult"
    multiplicity: "OneToMany"
- name: "LCAmendment"
  description: "Formal change to the terms and conditions of an issued letter of credit."
  data:
  - name: "amendmentNumber"
    type: "String"
  - name: "amendmentDate"
    type: "Date"
  - name: "status"
    type: "LCAmendmentStatus"
  - name: "details"
    type: "String"
  relations:
  - name: "letterOfCredit"
    type: "LetterOfCredit"
    multiplicity: "ManyToOne"
  - name: "swiftMessage"
    type: "SWIFTMessage"
    multiplicity: "ManyToOne"
- name: "Presentation"
  description: "Set of documents presented under a letter of credit for examination\
    \ and payment/acceptance."
  data:
  - name: "presentationNumber"
    type: "String"
  - name: "presentedOn"
    type: "Date"
  - name: "examinationOutcome"
    type: "ExaminationOutcome"
  - name: "claimedAmount"
    type: "Money"
  relations:
  - name: "letterOfCredit"
    type: "LetterOfCredit"
    multiplicity: "ManyToOne"
  - name: "presentingBank"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "TradeDocument"
    multiplicity: "OneToMany"
  - name: "discrepancies"
    type: "Discrepancy"
    multiplicity: "OneToMany"
  - name: "reimbursementClaim"
    type: "ReimbursementClaim"
    multiplicity: "OneToOne"
  - name: "charges"
    type: "Charge"
    multiplicity: "OneToMany"
- name: "TradeDocument"
  description: "Commercial or transport document supporting a trade transaction."
  data:
  - name: "documentType"
    type: "DocumentType"
  - name: "referenceNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "issuerName"
    type: "String"
  - name: "declaredAmount"
    type: "Money"
  relations:
  - name: "presentation"
    type: "Presentation"
    multiplicity: "ManyToOne"
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
- name: "Discrepancy"
  description: "Non-conformity found during document examination under a trade instrument."
  data:
  - name: "description"
    type: "String"
  - name: "discrepancyType"
    type: "DiscrepancyType"
  - name: "material"
    type: "Boolean"
  - name: "resolved"
    type: "Boolean"
  relations:
  - name: "presentation"
    type: "Presentation"
    multiplicity: "ManyToOne"
  - name: "waiverRequest"
    type: "WaiverRequest"
    multiplicity: "ManyToOne"
- name: "WaiverRequest"
  description: "Request to waive one or more discrepancies identified in a presentation."
  data:
  - name: "requestDate"
    type: "Date"
  - name: "status"
    type: "WaiverStatus"
  - name: "decisionDate"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "presentation"
    type: "Presentation"
    multiplicity: "ManyToOne"
  - name: "raisedBy"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "decidingBank"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "discrepancies"
    type: "Discrepancy"
    multiplicity: "OneToMany"
- name: "Shipment"
  description: "Movement of goods associated with a trade transaction and supported\
    \ by transport documents."
  data:
  - name: "shipmentReference"
    type: "String"
  - name: "incoterm"
    type: "Incoterm"
  - name: "transportMode"
    type: "TransportMode"
  - name: "portOfLoading"
    type: "String"
  - name: "portOfDischarge"
    type: "String"
  - name: "vesselName"
    type: "String"
  - name: "onboardDate"
    type: "Date"
  - name: "goodsDescription"
    type: "String"
  - name: "invoiceValue"
    type: "Money"
  relations:
  - name: "letterOfCredit"
    type: "LetterOfCredit"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "TradeDocument"
    multiplicity: "OneToMany"
  - name: "beneficiary"
    type: "TradingParty"
    multiplicity: "ManyToOne"
- name: "CollectionInstruction"
  description: "Documentary collection instruction for remitting and collecting banks\
    \ under URC rules."
  data:
  - name: "collectionReference"
    type: "String"
  - name: "collectionType"
    type: "CollectionType"
  - name: "tenorType"
    type: "TenorType"
  - name: "maturityDate"
    type: "Date"
  - name: "status"
    type: "CollectionStatus"
  - name: "amount"
    type: "Money"
  - name: "draweeName"
    type: "String"
  relations:
  - name: "drawer"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "remittingBank"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "collectingBank"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "TradeDocument"
    multiplicity: "OneToMany"
  - name: "charges"
    type: "Charge"
    multiplicity: "OneToMany"
  - name: "screeningResults"
    type: "ScreeningResult"
    multiplicity: "OneToMany"
- name: "TradeLoan"
  description: "Short-term financing facility linked to trade transactions for working\
    \ capital."
  data:
  - name: "loanNumber"
    type: "String"
  - name: "loanType"
    type: "TradeLoanType"
  - name: "principal"
    type: "Money"
  - name: "interestRate"
    type: "Decimal"
  - name: "startDate"
    type: "Date"
  - name: "maturityDate"
    type: "Date"
  - name: "status"
    type: "LoanStatus"
  relations:
  - name: "borrower"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "financedLC"
    type: "LetterOfCredit"
    multiplicity: "ManyToOne"
  - name: "financedPresentation"
    type: "Presentation"
    multiplicity: "ManyToOne"
  - name: "financedCollection"
    type: "CollectionInstruction"
    multiplicity: "ManyToOne"
  - name: "charges"
    type: "Charge"
    multiplicity: "OneToMany"
- name: "DemandGuarantee"
  description: "Independent guarantee issued by a bank to secure performance or payment\
    \ obligations."
  data:
  - name: "guaranteeNumber"
    type: "String"
  - name: "purpose"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "issueDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "status"
    type: "GuaranteeStatus"
  - name: "counterGuarantee"
    type: "Boolean"
  relations:
  - name: "applicant"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "beneficiary"
    type: "TradingParty"
    multiplicity: "ManyToOne"
  - name: "issuingBank"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "advisingBank"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "charges"
    type: "Charge"
    multiplicity: "OneToMany"
  - name: "screeningResults"
    type: "ScreeningResult"
    multiplicity: "OneToMany"
  - name: "swiftMessages"
    type: "SWIFTMessage"
    multiplicity: "OneToMany"
- name: "ComplianceProfile"
  description: "Consolidated KYC and risk profile maintained for a client or counterparty."
  data:
  - name: "riskRating"
    type: "String"
  - name: "lastReviewedOn"
    type: "Date"
  - name: "pepFlag"
    type: "Boolean"
  - name: "countryRisk"
    type: "String"
  relations:
  - name: "corporateClient"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "tradingParty"
    type: "TradingParty"
    multiplicity: "ManyToOne"
  - name: "screeningResults"
    type: "ScreeningResult"
    multiplicity: "OneToMany"
- name: "ScreeningResult"
  description: "Outcome of sanctions, PEP, and adverse media screening for trade participants\
    \ or transactions."
  data:
  - name: "screeningDate"
    type: "Date"
  - name: "status"
    type: "ScreeningStatus"
  - name: "provider"
    type: "String"
  - name: "matchScore"
    type: "Decimal"
  - name: "notes"
    type: "String"
  relations:
  - name: "subjectParty"
    type: "TradingParty"
    multiplicity: "ManyToOne"
  - name: "subjectClient"
    type: "CorporateClient"
    multiplicity: "ManyToOne"
  - name: "letterOfCredit"
    type: "LetterOfCredit"
    multiplicity: "ManyToOne"
  - name: "demandGuarantee"
    type: "DemandGuarantee"
    multiplicity: "ManyToOne"
  - name: "collectionInstruction"
    type: "CollectionInstruction"
    multiplicity: "ManyToOne"
- name: "SWIFTMessage"
  description: "Structured interbank message exchanged over the SWIFT network for\
    \ trade processing."
  data:
  - name: "messageType"
    type: "SWIFTMessageType"
  - name: "reference"
    type: "String"
  - name: "sentOn"
    type: "Date"
  - name: "direction"
    type: "MessageDirection"
  - name: "rawText"
    type: "String"
  relations:
  - name: "fromInstitution"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "toInstitution"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "relatedLC"
    type: "LetterOfCredit"
    multiplicity: "ManyToOne"
  - name: "relatedGuarantee"
    type: "DemandGuarantee"
    multiplicity: "ManyToOne"
  - name: "relatedAmendment"
    type: "LCAmendment"
    multiplicity: "ManyToOne"
  - name: "relatedPresentation"
    type: "Presentation"
    multiplicity: "ManyToOne"
  - name: "relatedCollection"
    type: "CollectionInstruction"
    multiplicity: "ManyToOne"
- name: "Charge"
  description: "Fees and charges assessed for trade services and processing."
  data:
  - name: "chargeType"
    type: "ChargeType"
  - name: "amount"
    type: "Money"
  - name: "taxAmount"
    type: "Money"
  - name: "payer"
    type: "ChargePayer"
  - name: "description"
    type: "String"
  relations:
  - name: "letterOfCredit"
    type: "LetterOfCredit"
    multiplicity: "ManyToOne"
  - name: "presentation"
    type: "Presentation"
    multiplicity: "ManyToOne"
  - name: "demandGuarantee"
    type: "DemandGuarantee"
    multiplicity: "ManyToOne"
  - name: "collectionInstruction"
    type: "CollectionInstruction"
    multiplicity: "ManyToOne"
  - name: "tradeLoan"
    type: "TradeLoan"
    multiplicity: "ManyToOne"
- name: "ReimbursementClaim"
  description: "Claim raised to a reimbursing bank for payment under a compliant presentation."
  data:
  - name: "claimReference"
    type: "String"
  - name: "claimDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "ReimbursementStatus"
  relations:
  - name: "presentation"
    type: "Presentation"
    multiplicity: "ManyToOne"
  - name: "reimbursingBank"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "issuerBank"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "swiftMessage"
    type: "SWIFTMessage"
    multiplicity: "ManyToOne"
enums:
- name: "PartyType"
  description: "Classification of a trade party by legal nature."
  data:
  - name: "Company"
  - name: "Individual"
  - name: "Government"
  - name: "FinancialInstitution"
- name: "LCType"
  description: "Types of letters of credit used in international trade."
  data:
  - name: "Irrevocable"
  - name: "Standby"
  - name: "Transferable"
  - name: "BackToBack"
  - name: "Revolving"
- name: "LCStatus"
  description: "Lifecycle states for a letter of credit."
  data:
  - name: "Draft"
  - name: "Issued"
  - name: "Advised"
  - name: "Confirmed"
  - name: "Active"
  - name: "Amended"
  - name: "Expired"
  - name: "Cancelled"
  - name: "Closed"
- name: "TenorType"
  description: "Settlement timing relative to document presentation or acceptance."
  data:
  - name: "Sight"
  - name: "Usance"
  - name: "Deferred"
  - name: "Mixed"
- name: "Incoterm"
  description: "International commercial terms defining delivery obligations."
  data:
  - name: "EXW"
  - name: "FCA"
  - name: "FAS"
  - name: "FOB"
  - name: "CFR"
  - name: "CIF"
  - name: "CPT"
  - name: "CIP"
  - name: "DAP"
  - name: "DPU"
  - name: "DDP"
- name: "TransportMode"
  description: "Mode of transport used for the shipment of goods."
  data:
  - name: "Sea"
  - name: "Air"
  - name: "Road"
  - name: "Rail"
  - name: "Multimodal"
  - name: "Courier"
- name: "DocumentType"
  description: "Types of documents commonly required in trade operations."
  data:
  - name: "Invoice"
  - name: "BillOfLading"
  - name: "AirWaybill"
  - name: "PackingList"
  - name: "InsuranceCertificate"
  - name: "CertificateOfOrigin"
  - name: "InspectionCertificate"
  - name: "Draft"
  - name: "BeneficiaryCertificate"
- name: "ExaminationOutcome"
  description: "Result of the document examination process."
  data:
  - name: "Compliant"
  - name: "Discrepant"
  - name: "Waived"
- name: "DiscrepancyType"
  description: "Typical non-conformities identified during document examination."
  data:
  - name: "LateShipment"
  - name: "StaleBillOfLading"
  - name: "MissingDocument"
  - name: "InconsistentDescription"
  - name: "AmountExceedsCredit"
  - name: "UnauthenticSignature"
  - name: "AlteredDocument"
- name: "WaiverStatus"
  description: "Status of a request to waive discrepancies."
  data:
  - name: "Requested"
  - name: "Approved"
  - name: "Rejected"
  - name: "Withdrawn"
- name: "LCAmendmentStatus"
  description: "Status for an LC amendment through its advice and acceptance."
  data:
  - name: "Draft"
  - name: "Sent"
  - name: "Advised"
  - name: "Accepted"
  - name: "Rejected"
- name: "CollectionType"
  description: "Documentary collection flow specifying release conditions."
  data:
  - name: "DocumentsAgainstPayment"
  - name: "DocumentsAgainstAcceptance"
- name: "CollectionStatus"
  description: "Processing state of a collection instruction."
  data:
  - name: "Received"
  - name: "Presented"
  - name: "Paid"
  - name: "Accepted"
  - name: "Returned"
  - name: "Cancelled"
- name: "TradeLoanType"
  description: "Financing structures used for trade-related working capital."
  data:
  - name: "ImportLoan"
  - name: "ExportLoan"
  - name: "PackingCredit"
  - name: "PostShipmentFinance"
  - name: "InvoiceDiscounting"
  - name: "ReceivablesPurchase"
- name: "LoanStatus"
  description: "Lifecycle states of a trade loan."
  data:
  - name: "Proposed"
  - name: "Active"
  - name: "Matured"
  - name: "Closed"
  - name: "Defaulted"
- name: "GuaranteeStatus"
  description: "Lifecycle states of a demand guarantee."
  data:
  - name: "Draft"
  - name: "Issued"
  - name: "Active"
  - name: "Expired"
  - name: "Cancelled"
  - name: "Claimed"
  - name: "Paid"
- name: "ScreeningStatus"
  description: "Outcome classification of sanctions and adverse media screening."
  data:
  - name: "Clear"
  - name: "PotentialMatch"
  - name: "Escalated"
  - name: "Approved"
  - name: "Rejected"
- name: "SWIFTMessageType"
  description: "Common SWIFT message types used in trade operations."
  data:
  - name: "MT700"
  - name: "MT707"
  - name: "MT710"
  - name: "MT720"
  - name: "MT760"
  - name: "MT754"
  - name: "MT799"
  - name: "MT499"
- name: "MessageDirection"
  description: "Direction of a SWIFT message relative to the institution."
  data:
  - name: "Inbound"
  - name: "Outbound"
- name: "ChargeType"
  description: "Types of fees applicable to trade finance services."
  data:
  - name: "IssuanceFee"
  - name: "AmendmentFee"
  - name: "ConfirmationFee"
  - name: "AdvisingFee"
  - name: "DiscrepancyFee"
  - name: "HandlingFee"
  - name: "SwiftFee"
  - name: "CommitmentFee"
  - name: "CourierFee"
- name: "ChargePayer"
  description: "Party responsible for bearing a fee."
  data:
  - name: "Applicant"
  - name: "Beneficiary"
  - name: "Shared"
- name: "ReimbursementStatus"
  description: "Status of a reimbursement claim process."
  data:
  - name: "Requested"
  - name: "Claimed"
  - name: "Paid"
  - name: "Rejected"
  - name: "Cancelled"
valueObjects:
- name: "Money"
  description: "Monetary amount expressed in a specific currency for trade transactions\
    \ and charges."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address for trade parties and shipment locations."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "stateOrProvince"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "BIC"
  description: "SWIFT Business Identifier Code used to identify financial institutions."
  data:
  - name: "value"
    type: "String"
