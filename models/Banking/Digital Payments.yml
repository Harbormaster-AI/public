    type: "String"
  - name: "country"
    type: "String"
  - name: "website"
    type: "String"
  - name: "supportedSchemes"
    type: "String"
  relations:
  - name: "gateways"
    type: "PaymentGateway"
    multiplicity: "OneToMany"
  - name: "acquirers"
