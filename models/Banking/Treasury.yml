---
metadata:
  name: "Treasury Capabilities Model"
  description: "Capabilities model for bank treasury operations covering liquidity,\
    \ funding, asset-liability management, market risk, collateral, transfer pricing,\
    \ and hedge accounting."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Financial"
  type: "Capability"
  domain: "Treasury"
entities:
- name: "TreasuryUnit"
  description: "Organizational unit responsible for treasury activities such as funding,\
    \ liquidity management, ALM, and market operations."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "bookingLocation"
    type: "String"
  - name: "baseCurrency"
    type: "String"
  relations:
  - name: "tradingBooks"
    type: "TradingBook"
    multiplicity: "OneToMany"
  - name: "bankAccounts"
    type: "BankAccount"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "TreasuryPolicy"
    multiplicity: "OneToMany"
  - name: "transferPricingRules"
    type: "TransferPricingRule"
    multiplicity: "OneToMany"
  - name: "internalDealsOut"
    type: "InternalDeal"
    multiplicity: "OneToMany"
  - name: "internalDealsIn"
    type: "InternalDeal"
    multiplicity: "OneToMany"
- name: "TradingBook"
  description: "Booking structure used to segregate treasury positions and trades\
    \ for risk and P&L management."
  data:
  - name: "name"
    type: "String"
  - name: "bookCategory"
    type: "BookCategory"
  relations:
  - name: "treasuryUnit"
    type: "TreasuryUnit"
    multiplicity: "ManyToOne"
  - name: "portfolios"
    type: "Portfolio"
    multiplicity: "OneToMany"
  - name: "limits"
    type: "RiskLimit"
    multiplicity: "OneToMany"
  - name: "trades"
    type: "Trade"
    multiplicity: "OneToMany"
- name: "Portfolio"
  description: "Collection of positions and trades managed under a defined strategy\
    \ and risk mandate."
  data:
  - name: "name"
    type: "String"
  - name: "strategy"
    type: "String"
  - name: "baseCurrency"
    type: "String"
  relations:
  - name: "tradingBook"
    type: "TradingBook"
    multiplicity: "ManyToOne"
  - name: "positions"
    type: "Position"
    multiplicity: "OneToMany"
  - name: "trades"
    type: "Trade"
    multiplicity: "OneToMany"
  - name: "riskReports"
    type: "RiskReport"
    multiplicity: "OneToMany"
  - name: "riskLimits"
    type: "RiskLimit"
    multiplicity: "OneToMany"
  - name: "liquidityBuffers"
    type: "LiquidityBuffer"
    multiplicity: "OneToMany"
- name: "Counterparty"
  description: "External legal entity with which treasury executes financial transactions."
  data:
  - name: "legalName"
    type: "String"
  - name: "lei"
    type: "LegalEntityIdentifier"
  - name: "sector"
    type: "String"
  - name: "domicileCountry"
    type: "String"
  - name: "creditRating"
    type: "String"
  relations:
  - name: "nettingAgreements"
    type: "NettingAgreement"
    multiplicity: "OneToMany"
  - name: "trades"
    type: "Trade"
    multiplicity: "OneToMany"
  - name: "collateralAgreements"
    type: "CollateralAgreement"
    multiplicity: "OneToMany"
  - name: "limits"
    type: "RiskLimit"
    multiplicity: "OneToMany"
  - name: "marginCalls"
    type: "MarginCall"
    multiplicity: "OneToMany"
  - name: "settlementInstructions"
    type: "SettlementInstruction"
    multiplicity: "OneToMany"
- name: "NettingAgreement"
  description: "Master agreement defining close-out and payment netting terms for\
    \ eligible trades."
  data:
  - name: "agreementType"
    type: "NettingAgreementType"
  - name: "agreementDate"
    type: "Date"
  - name: "governingLaw"
    type: "String"
  relations:
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "collateralAgreements"
    type: "CollateralAgreement"
    multiplicity: "OneToMany"
  - name: "trades"
    type: "Trade"
    multiplicity: "OneToMany"
- name: "CollateralAgreement"
  description: "Agreement defining margining terms, thresholds, and eligible collateral\
    \ between parties."
  data:
  - name: "agreementType"
    type: "CollateralAgreementType"
  - name: "threshold"
    type: "Money"
  - name: "minimumTransferAmount"
    type: "Money"
  - name: "independentAmount"
    type: "Money"
  - name: "marginFrequency"
    type: "String"
  - name: "eligibleCollateral"
    type: "CollateralType"
  relations:
  - name: "nettingAgreement"
    type: "NettingAgreement"
    multiplicity: "ManyToOne"
  - name: "marginCalls"
    type: "MarginCall"
    multiplicity: "OneToMany"
  - name: "collateralAccounts"
    type: "CollateralAccount"
    multiplicity: "OneToMany"
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
- name: "CollateralAccount"
  description: "Account used to hold or pledge collateral assets or cash under the\
    \ collateral agreement."
  data:
  - name: "accountName"
    type: "String"
  - name: "collateralType"
    type: "CollateralType"
  - name: "custodyLocation"
    type: "String"
  relations:
  - name: "collateralAgreement"
    type: "CollateralAgreement"
    multiplicity: "ManyToOne"
  - name: "trades"
    type: "Trade"
    multiplicity: "OneToMany"
  - name: "marginCalls"
    type: "MarginCall"
    multiplicity: "OneToMany"
- name: "MarginCall"
  description: "Request or return of collateral based on exposure calculations under\
    \ the collateral agreement."
  data:
  - name: "callDate"
    type: "Date"
  - name: "direction"
    type: "MarginDirection"
  - name: "requiredAmount"
    type: "Money"
  - name: "status"
    type: "MarginStatus"
  relations:
  - name: "collateralAgreement"
    type: "CollateralAgreement"
    multiplicity: "ManyToOne"
  - name: "collateralAccount"
    type: "CollateralAccount"
    multiplicity: "ManyToOne"
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "cashFlows"
    type: "CashFlow"
    multiplicity: "OneToMany"
- name: "BankAccount"
  description: "External account used by treasury for settlements and liquidity management."
  data:
  - name: "accountName"
    type: "String"
  - name: "accountIdentifier"
    type: "AccountIdentifier"
  - name: "currency"
    type: "String"
  - name: "bankBic"
    type: "BIC"
  relations:
  - name: "treasuryUnit"
    type: "TreasuryUnit"
    multiplicity: "ManyToOne"
  - name: "cashPositions"
    type: "CashPosition"
    multiplicity: "OneToMany"
  - name: "cashFlows"
    type: "CashFlow"
    multiplicity: "OneToMany"
  - name: "settlementInstructions"
    type: "SettlementInstruction"
    multiplicity: "OneToMany"
- name: "CashPosition"
  description: "Daily summary of balances and availability for a bank account."
  data:
  - name: "positionDate"
    type: "Date"
  - name: "openingBalance"
    type: "Money"
  - name: "closingBalance"
    type: "Money"
  - name: "availableBalance"
    type: "Money"
  relations:
  - name: "bankAccount"
    type: "BankAccount"
    multiplicity: "ManyToOne"
  - name: "cashFlows"
    type: "CashFlow"
    multiplicity: "OneToMany"
- name: "CashFlow"
  description: "Dated movement of cash arising from trades, margining, fees, or settlements."
  data:
  - name: "flowDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "flowType"
    type: "CashFlowType"
  - name: "description"
    type: "String"
  relations:
  - name: "trade"
    type: "Trade"
    multiplicity: "ManyToOne"
  - name: "cashPosition"
    type: "CashPosition"
    multiplicity: "ManyToOne"
  - name: "marginCall"
    type: "MarginCall"
    multiplicity: "ManyToOne"
  - name: "bankAccount"
    type: "BankAccount"
    multiplicity: "ManyToOne"
- name: "Trade"
  description: "Executed financial transaction representing a treasury instrument."
  data:
  - name: "tradeNumber"
    type: "String"
  - name: "instrumentType"
    type: "InstrumentType"
  - name: "tradeDate"
    type: "Date"
  - name: "valueDate"
    type: "Date"
  - name: "maturityDate"
    type: "Date"
  - name: "notional"
    type: "Money"
  - name: "fixedRate"
    type: "Rate"
  - name: "side"
    type: "Side"
  - name: "status"
    type: "TradeStatus"
  - name: "clearingStatus"
    type: "ClearingStatus"
  relations:
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
  - name: "settlementInstruction"
    type: "SettlementInstruction"
    multiplicity: "OneToOne"
  - name: "cashFlows"
    type: "CashFlow"
    multiplicity: "OneToMany"
  - name: "collateralAccount"
    type: "CollateralAccount"
    multiplicity: "ManyToOne"
  - name: "hedgeRelationship"
    type: "HedgeRelationship"
    multiplicity: "ManyToOne"
- name: "SettlementInstruction"
  description: "Payment and delivery details required to settle a trade."
  data:
  - name: "paymentSystem"
    type: "String"
  - name: "settlementCurrency"
    type: "String"
  - name: "beneficiaryAccount"
    type: "AccountIdentifier"
  - name: "intermediaryBankBic"
    type: "BIC"
  relations:
  - name: "trade"
    type: "Trade"
    multiplicity: "OneToOne"
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "bankAccount"
    type: "BankAccount"
    multiplicity: "ManyToOne"
- name: "FundingProgram"
  description: "Strategic program governing market funding issuance for the institution."
  data:
  - name: "programName"
    type: "String"
  - name: "instrumentFamily"
    type: "FundingInstrumentType"
  - name: "limitAmount"
    type: "Money"
  - name: "rating"
    type: "String"
  relations:
  - name: "issuances"
    type: "Issuance"
    multiplicity: "OneToMany"
  - name: "treasuryUnit"
    type: "TreasuryUnit"
    multiplicity: "ManyToOne"
- name: "Issuance"
  description: "Primary market transaction raising funding under a program."
  data:
  - name: "issueName"
    type: "String"
  - name: "instrumentType"
    type: "InstrumentType"
  - name: "isin"
    type: "ISIN"
  - name: "issueDate"
    type: "Date"
  - name: "maturityDate"
    type: "Date"
  - name: "couponRate"
    type: "Rate"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "IssuanceStatus"
  relations:
  - name: "fundingProgram"
    type: "FundingProgram"
    multiplicity: "ManyToOne"
  - name: "cashFlows"
    type: "CashFlow"
    multiplicity: "OneToMany"
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
- name: "Position"
  description: "Valued holding derived from trades, representing risk and P&L exposure."
  data:
  - name: "asOfDate"
    type: "Date"
  - name: "positionType"
    type: "PositionType"
  - name: "quantity"
    type: "Decimal"
  - name: "marketValue"
    type: "Money"
  - name: "pnl"
    type: "Money"
  relations:
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
  - name: "trade"
    type: "Trade"
    multiplicity: "ManyToOne"
- name: "RiskLimit"
  description: "Quantitative constraint applied to portfolios or counterparties to\
    \ control risk."
  data:
  - name: "name"
    type: "String"
  - name: "limitType"
    type: "LimitType"
  - name: "measure"
    type: "RiskMeasureType"
  - name: "threshold"
    type: "Decimal"
  - name: "currency"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  relations:
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "breaches"
    type: "LimitBreach"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "policy"
    type: "TreasuryPolicy"
    multiplicity: "ManyToOne"
- name: "LimitBreach"
  description: "Recorded event when a risk limit threshold is exceeded."
  data:
  - name: "breachDate"
    type: "Date"
  - name: "observedValue"
    type: "Decimal"
  - name: "severity"
    type: "String"
  - name: "status"
    type: "LimitBreachStatus"
  relations:
  - name: "riskLimit"
    type: "RiskLimit"
    multiplicity: "ManyToOne"
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "Approval"
  description: "Governance decision related to limits, breaches, or policies."
  data:
  - name: "approverName"
    type: "String"
  - name: "approvalDate"
    type: "Date"
  - name: "decision"
    type: "ApprovalDecision"
  - name: "notes"
    type: "String"
  relations:
  - name: "riskLimit"
    type: "RiskLimit"
    multiplicity: "ManyToOne"
  - name: "limitBreach"
    type: "LimitBreach"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "TreasuryPolicy"
    multiplicity: "ManyToOne"
- name: "TreasuryPolicy"
  description: "Formal directive defining risk appetite, controls, and governance\
    \ for treasury activities."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "area"
    type: "PolicyArea"
  relations:
  - name: "treasuryUnit"
    type: "TreasuryUnit"
    multiplicity: "ManyToOne"
  - name: "limits"
    type: "RiskLimit"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "MarketDataSet"
  description: "Cohesive set of market data used for pricing and risk measurement\
    \ on a valuation date."
  data:
  - name: "name"
    type: "String"
  - name: "valuationDate"
    type: "Date"
  relations:
  - name: "yieldCurves"
    type: "YieldCurve"
    multiplicity: "OneToMany"
  - name: "fxRates"
    type: "FXRate"
    multiplicity: "OneToMany"
  - name: "volSurfaces"
    type: "VolSurface"
    multiplicity: "OneToMany"
  - name: "stressScenarios"
    type: "StressScenario"
    multiplicity: "OneToMany"
- name: "YieldCurve"
  description: "Term structure of interest rates used for discounting and projection."
  data:
  - name: "curveType"
    type: "CurveType"
  - name: "currency"
    type: "String"
  - name: "dayCount"
    type: "DayCountConvention"
  - name: "buildMethod"
    type: "String"
  relations:
  - name: "marketDataSet"
    type: "MarketDataSet"
    multiplicity: "ManyToOne"
  - name: "quotes"
    type: "CurveQuote"
    multiplicity: "OneToMany"
- name: "CurveQuote"
  description: "Quoted tenor point and rate on a yield curve."
  data:
  - name: "tenor"
    type: "Tenor"
  - name: "rate"
    type: "Rate"
  relations:
  - name: "yieldCurve"
    type: "YieldCurve"
    multiplicity: "ManyToOne"
- name: "FXRate"
  description: "Spot or derived exchange rate for a currency pair on the valuation\
    \ date."
  data:
  - name: "baseCurrency"
    type: "String"
  - name: "quoteCurrency"
    type: "String"
  - name: "rate"
    type: "Decimal"
  relations:
  - name: "marketDataSet"
    type: "MarketDataSet"
    multiplicity: "ManyToOne"
- name: "VolSurface"
  description: "Volatility structure used for pricing options and optionality."
  data:
  - name: "assetClass"
    type: "String"
  - name: "model"
    type: "PricingModel"
  - name: "currency"
    type: "String"
  relations:
  - name: "marketDataSet"
    type: "MarketDataSet"
    multiplicity: "ManyToOne"
- name: "RiskReport"
  description: "Aggregated risk and liquidity report produced for a given portfolio\
    \ and date."
  data:
  - name: "reportDate"
    type: "Date"
  - name: "reportType"
    type: "RiskReportType"
  - name: "status"
    type: "ReportStatus"
  relations:
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
  - name: "positions"
    type: "Position"
    multiplicity: "OneToMany"
  - name: "regulatoryMetrics"
    type: "RegulatoryMetric"
    multiplicity: "OneToMany"
- name: "RegulatoryMetric"
  description: "Calculated metric required for liquidity and funding regulation."
  data:
  - name: "metricType"
    type: "RegMetricType"
  - name: "value"
    type: "Decimal"
  - name: "currency"
    type: "String"
  - name: "horizon"
    type: "LiquidityHorizon"
  relations:
  - name: "riskReport"
    type: "RiskReport"
    multiplicity: "ManyToOne"
  - name: "liquidityBuffer"
    type: "LiquidityBuffer"
    multiplicity: "ManyToOne"
- name: "LiquidityBuffer"
  description: "Portfolio of high-quality liquid assets maintained to meet liquidity\
    \ coverage requirements."
  data:
  - name: "name"
    type: "String"
  - name: "hqlaClass"
    type: "HQLAClass"
  - name: "marketValue"
    type: "Money"
  relations:
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "BufferAsset"
    multiplicity: "OneToMany"
  - name: "regulatoryMetrics"
    type: "RegulatoryMetric"
    multiplicity: "OneToMany"
- name: "BufferAsset"
  description: "Security or cash item held within the liquidity buffer."
  data:
  - name: "securityName"
    type: "String"
  - name: "isin"
    type: "ISIN"
  - name: "hqlaClass"
    type: "HQLAClass"
  - name: "marketValue"
    type: "Money"
  relations:
  - name: "liquidityBuffer"
    type: "LiquidityBuffer"
    multiplicity: "ManyToOne"
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
- name: "TransferPricingRule"
  description: "Methodology used to assign internal funds transfer pricing to business\
    \ units or products."
  data:
  - name: "name"
    type: "String"
  - name: "method"
    type: "TransferPricingMethod"
  - name: "curveType"
    type: "CurveType"
  - name: "spread"
    type: "Rate"
  - name: "effectiveFrom"
    type: "Date"
  relations:
  - name: "treasuryUnit"
    type: "TreasuryUnit"
    multiplicity: "ManyToOne"
  - name: "appliedDeals"
    type: "InternalDeal"
    multiplicity: "OneToMany"
- name: "InternalDeal"
  description: "Intercompany or intra-entity transfer between treasury and businesses\
    \ for funds or risk."
  data:
  - name: "dealNumber"
    type: "String"
  - name: "product"
    type: "InstrumentType"
  - name: "tradeDate"
    type: "Date"
  - name: "valueDate"
    type: "Date"
  - name: "maturityDate"
    type: "Date"
  - name: "rate"
    type: "Rate"
  - name: "notional"
    type: "Money"
  - name: "side"
    type: "Side"
  - name: "status"
    type: "TradeStatus"
  relations:
  - name: "transferPricingRule"
    type: "TransferPricingRule"
    multiplicity: "ManyToOne"
  - name: "fromUnit"
    type: "TreasuryUnit"
    multiplicity: "ManyToOne"
  - name: "toUnit"
    type: "TreasuryUnit"
    multiplicity: "ManyToOne"
  - name: "cashFlows"
    type: "CashFlow"
    multiplicity: "OneToMany"
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
- name: "HedgeRelationship"
  description: "Designated accounting hedge relationship between hedged items and\
    \ hedging instruments."
  data:
  - name: "name"
    type: "String"
  - name: "designationStatus"
    type: "HedgeDesignationStatus"
  - name: "objective"
    type: "String"
  relations:
  - name: "hedgedItem"
    type: "Trade"
    multiplicity: "ManyToOne"
  - name: "hedgingInstrument"
    type: "Trade"
    multiplicity: "ManyToOne"
  - name: "accountingEntries"
    type: "AccountingEntry"
    multiplicity: "OneToMany"
- name: "AccountingEntry"
  description: "Journal entry reflecting treasury transactions and hedge accounting\
    \ effects."
  data:
  - name: "postingDate"
    type: "Date"
  - name: "account"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "narrative"
    type: "String"
  - name: "treatment"
    type: "AccountingTreatment"
  relations:
  - name: "trade"
    type: "Trade"
    multiplicity: "ManyToOne"
  - name: "hedgeRelationship"
    type: "HedgeRelationship"
    multiplicity: "ManyToOne"
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
- name: "StressScenario"
  description: "Hypothetical or historical market condition used for treasury stress\
    \ testing."
  data:
  - name: "name"
    type: "String"
  - name: "horizon"
    type: "LiquidityHorizon"
  - name: "severity"
    type: "String"
  relations:
  - name: "marketDataSet"
    type: "MarketDataSet"
    multiplicity: "ManyToOne"
  - name: "stressResults"
    type: "StressResult"
    multiplicity: "OneToMany"
- name: "StressResult"
  description: "Quantified impact of a stress scenario on a specific portfolio."
  data:
  - name: "measure"
    type: "RiskMeasureType"
  - name: "value"
    type: "Decimal"
  - name: "currency"
    type: "String"
  relations:
  - name: "stressScenario"
    type: "StressScenario"
    multiplicity: "ManyToOne"
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
- name: "BusinessCalendar"
  description: "Calendar defining business days and holidays for a given market or\
    \ location."
  data:
  - name: "name"
    type: "String"
  - name: "location"
    type: "String"
  relations:
  - name: "holidays"
    type: "Holiday"
    multiplicity: "OneToMany"
- name: "Holiday"
  description: "Non-business day with associated description for settlement and scheduling."
  data:
  - name: "date"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "calendar"
    type: "BusinessCalendar"
    multiplicity: "ManyToOne"
enums:
- name: "BookCategory"
  description: "Classification of trading books within treasury."
  data:
  - name: "Treasury"
  - name: "ALM"
  - name: "LiquidityBuffer"
- name: "InstrumentType"
  description: "Types of instruments traded or managed by treasury."
  data:
  - name: "InterbankDeposit"
  - name: "TimeDeposit"
