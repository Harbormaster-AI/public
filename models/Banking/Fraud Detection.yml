  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "AlertStatus"
  description: "Progress state of an alert through triage and review."
  data:
  - name: "Open"
  - name: "UnderReview"
  - name: "Escalated"
  - name: "Closed"
  - name: "Suppressed"
- name: "FraudType"
  description: "Primary suspected fraud category associated with an alert or case."
  data:
  - name: "AccountTakeover"
  - name: "CardNotPresent"
  - name: "ApplicationFraud"
  - name: "MuleActivity"
  - name: "SyntheticIdentity"
  - name: "MerchantFraud"
  - name: "InsiderFraud"
- name: "ModelType"
  description: "Approach used by the predictive model."
