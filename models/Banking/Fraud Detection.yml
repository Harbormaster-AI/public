---
metadata:
  name: "Fraud Detection Capabilities Model"
  description: "Domain model capturing entities, relationships, and data necessary\
    \ to detect, investigate, and manage financial fraud across digital channels and\
    \ payment flows."
  version: "1.0.0"
  industry: "Banking"
  category: "Banking"
  type: "Capability"
  domain: "Fraud Detection"
entities:
- name: "FinancialInstitution"
  description: "Regulated organization that operates accounts, payment instruments,\
    \ and fraud controls."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "regulatoryJurisdiction"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "customers"
    type: "CustomerProfile"
    multiplicity: "OneToMany"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "rules"
    type: "Rule"
    multiplicity: "OneToMany"
  - name: "models"
    type: "Model"
    multiplicity: "OneToMany"
  - name: "watchlists"
    type: "Watchlist"
    multiplicity: "OneToMany"
- name: "CustomerProfile"
  description: "Party using the institution’s products and channels, providing context\
    \ for fraud risk assessment."
  data:
  - name: "fullName"
    type: "String"
  - name: "customerType"
    type: "CustomerType"
  - name: "dateOfBirth"
    type: "Date"
  - name: "primaryEmail"
    type: "EmailAddress"
  - name: "primaryPhone"
    type: "PhoneNumber"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "kycCompleted"
    type: "Boolean"
  relations:
  - name: "institution"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "paymentInstruments"
    type: "PaymentInstrument"
    multiplicity: "OneToMany"
  - name: "devices"
    type: "Device"
    multiplicity: "OneToMany"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "cases"
    type: "Case"
    multiplicity: "OneToMany"
- name: "Account"
  description: "Deposit or payment account that is the source or destination of monetary\
    \ transactions."
  data:
  - name: "accountNumber"
    type: "AccountNumber"
  - name: "status"
    type: "AccountStatus"
  - name: "currency"
    type: "String"
  - name: "openedOn"
    type: "Date"
  - name: "averageDailyBalance"
    type: "Decimal"
  relations:
  - name: "institution"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "cases"
    type: "Case"
    multiplicity: "OneToMany"
  - name: "paymentInstruments"
    type: "PaymentInstrument"
    multiplicity: "OneToMany"
- name: "PaymentInstrument"
  description: "Mechanism used to initiate a payment, such as a card, virtual card,\
    \ wallet token, or account credential."
  data:
  - name: "instrumentType"
    type: "InstrumentType"
  - name: "maskedNumber"
    type: "String"
  - name: "network"
    type: "String"
  - name: "expiryMonth"
    type: "Integer"
  - name: "expiryYear"
    type: "Integer"
  - name: "issueCountry"
    type: "String"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "devices"
    type: "Device"
    multiplicity: "ManyToMany"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
- name: "Device"
  description: "Endpoint used by a customer to access services, fingerprinted for\
    \ fraud detection."
  data:
  - name: "deviceFingerprint"
    type: "DeviceFingerprint"
  - name: "deviceType"
    type: "DeviceType"
  - name: "operatingSystem"
    type: "String"
  - name: "browser"
    type: "String"
  - name: "riskLevel"
    type: "RiskLevel"
  relations:
  - name: "customer"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "sessions"
    type: "Session"
    multiplicity: "OneToMany"
  - name: "authenticationEvents"
    type: "AuthenticationEvent"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
- name: "Session"
  description: "Continuous interaction window between a device and digital channel,\
    \ providing behavioral and network context."
  data:
  - name: "sessionKey"
    type: "String"
  - name: "startedAt"
    type: "DateTime"
  - name: "channel"
    type: "ChannelType"
  - name: "ipAddress"
    type: "IPAddress"
  - name: "location"
    type: "GeoPoint"
  relations:
  - name: "customer"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "Device"
    multiplicity: "ManyToOne"
  - name: "authenticationEvents"
    type: "AuthenticationEvent"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
- name: "AuthenticationEvent"
  description: "Attempt to authenticate during a session, used to detect account takeover\
    \ and credential abuse."
  data:
  - name: "occurredAt"
    type: "DateTime"
  - name: "method"
    type: "AuthenticationMethod"
  - name: "result"
    type: "AuthenticationResult"
  - name: "channel"
    type: "ChannelType"
  - name: "ipAddress"
    type: "IPAddress"
  relations:
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "Device"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "signals"
    type: "Signal"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "decision"
    type: "Decision"
    multiplicity: "OneToOne"
- name: "Counterparty"
  description: "External entity sending or receiving funds in non-card transactions."
  data:
  - name: "name"
    type: "String"
  - name: "country"
    type: "String"
  - name: "category"
    type: "String"
  relations:
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
  - name: "watchlistEntries"
    type: "WatchlistEntry"
    multiplicity: "ManyToMany"
- name: "Merchant"
  description: "Card-accepting business involved in purchase transactions, assessed\
    \ for merchant-related fraud risk."
  data:
  - name: "name"
    type: "String"
  - name: "mcc"
    type: "String"
  - name: "country"
    type: "String"
  - name: "riskLevel"
    type: "RiskLevel"
  relations:
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
  - name: "watchlistEntries"
    type: "WatchlistEntry"
    multiplicity: "ManyToMany"
- name: "Transaction"
  description: "Monetary movement or authorization evaluated for fraud risk in real-time\
    \ and post-event."
  data:
  - name: "transactionTime"
    type: "DateTime"
  - name: "amount"
    type: "Money"
  - name: "transactionType"
    type: "TransactionType"
  - name: "channel"
    type: "ChannelType"
  - name: "ipAddress"
    type: "IPAddress"
  - name: "merchantCity"
    type: "String"
  - name: "location"
    type: "GeoPoint"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "paymentInstrument"
    type: "PaymentInstrument"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "session"
    type: "Session"
    multiplicity: "ManyToOne"
  - name: "signals"
    type: "Signal"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "decision"
    type: "Decision"
    multiplicity: "OneToOne"
- name: "Signal"
  description: "Derived indicator or heuristic measurement used by rules and models\
    \ to assess risk."
  data:
  - name: "name"
    type: "String"
  - name: "signalType"
    type: "SignalType"
  - name: "value"
    type: "Decimal"
  - name: "weight"
    type: "Decimal"
  - name: "observedAt"
    type: "DateTime"
  relations:
  - name: "transaction"
    type: "Transaction"
    multiplicity: "ManyToOne"
  - name: "authenticationEvent"
    type: "AuthenticationEvent"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
  - name: "model"
    type: "Model"
    multiplicity: "ManyToOne"
- name: "Rule"
  description: "Deterministic logic that evaluates signals and attributes to produce\
    \ alerts or decisions."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "expression"
    type: "String"
  - name: "status"
    type: "RuleStatus"
  - name: "severity"
    type: "AlertPriority"
  relations:
  - name: "institution"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "signals"
    type: "Signal"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "ManyToMany"
  - name: "decisions"
    type: "Decision"
    multiplicity: "ManyToMany"
- name: "Model"
  description: "Statistical or machine learning artifact producing risk scores and\
    \ features for detection."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "modelType"
    type: "ModelType"
  - name: "trainedOn"
    type: "Date"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "institution"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "features"
    type: "Feature"
    multiplicity: "ManyToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "signals"
    type: "Signal"
    multiplicity: "OneToMany"
  - name: "decisions"
    type: "Decision"
    multiplicity: "OneToMany"
- name: "Feature"
  description: "Input variable engineered for models and rules."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "description"
    type: "String"
  relations:
  - name: "models"
    type: "Model"
    multiplicity: "ManyToMany"
- name: "RiskAssessment"
  description: "Evaluation artifact containing a score and rationale produced for\
    \ an event or transaction."
  data:
  - name: "score"
    type: "RiskScore"
  - name: "assessedAt"
    type: "DateTime"
  - name: "threshold"
    type: "Decimal"
  - name: "explanation"
    type: "String"
  relations:
  - name: "model"
    type: "Model"
    multiplicity: "ManyToOne"
  - name: "transaction"
    type: "Transaction"
    multiplicity: "ManyToOne"
  - name: "authenticationEvent"
    type: "AuthenticationEvent"
    multiplicity: "ManyToOne"
  - name: "alert"
    type: "Alert"
    multiplicity: "ManyToOne"
- name: "Decision"
  description: "Real-time or post-event action taken based on risk evaluation."
  data:
  - name: "outcome"
    type: "DecisionOutcome"
  - name: "decidedAt"
    type: "DateTime"
  - name: "reason"
    type: "String"
  - name: "channel"
    type: "ChannelType"
  relations:
  - name: "transaction"
    type: "Transaction"
    multiplicity: "ManyToOne"
  - name: "authenticationEvent"
    type: "AuthenticationEvent"
    multiplicity: "ManyToOne"
  - name: "model"
    type: "Model"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "Rule"
    multiplicity: "ManyToMany"
  - name: "alert"
    type: "Alert"
    multiplicity: "ManyToOne"
- name: "Alert"
  description: "Notification that an event or transaction is suspicious and requires\
    \ action or review."
  data:
  - name: "reference"
    type: "String"
  - name: "priority"
    type: "AlertPriority"
  - name: "status"
    type: "AlertStatus"
  - name: "createdAt"
    type: "DateTime"
  - name: "category"
    type: "FraudType"
  - name: "riskScore"
    type: "RiskScore"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "transaction"
    type: "Transaction"
    multiplicity: "ManyToOne"
  - name: "authenticationEvent"
    type: "AuthenticationEvent"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "triggeredRules"
    type: "Rule"
    multiplicity: "ManyToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
- name: "Case"
  description: "Investigative container aggregating alerts, evidence, and actions\
    \ to reach a disposition."
  data:
  - name: "caseReference"
    type: "String"
  - name: "status"
    type: "CaseStatus"
  - name: "openedAt"
    type: "DateTime"
  - name: "closedAt"
    type: "DateTime"
  - name: "disposition"
    type: "Disposition"
  - name: "lossAmount"
    type: "Money"
  relations:
  - name: "institution"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "ManyToMany"
  - name: "customer"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "investigator"
    type: "Investigator"
    multiplicity: "ManyToOne"
- name: "Investigator"
  description: "Analyst responsible for triaging alerts and conducting case investigations."
  data:
  - name: "fullName"
    type: "String"
  - name: "role"
    type: "AnalystRole"
  - name: "email"
    type: "EmailAddress"
  - name: "team"
    type: "String"
  relations:
  - name: "cases"
    type: "Case"
    multiplicity: "OneToMany"
- name: "Watchlist"
  description: "Curated set of risky entities used for screening and monitoring."
  data:
  - name: "name"
    type: "String"
  - name: "listType"
    type: "WatchlistType"
  - name: "source"
    type: "String"
  - name: "lastUpdated"
    type: "DateTime"
  relations:
  - name: "institution"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "entries"
    type: "WatchlistEntry"
    multiplicity: "OneToMany"
- name: "WatchlistEntry"
  description: "Specific record within a watchlist representing an entity to be screened."
  data:
  - name: "value"
    type: "String"
  - name: "entityType"
    type: "WatchlistEntityType"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "validUntil"
    type: "Date"
  relations:
  - name: "watchlist"
    type: "Watchlist"
    multiplicity: "ManyToOne"
  - name: "customers"
    type: "CustomerProfile"
    multiplicity: "ManyToMany"
  - name: "counterparties"
    type: "Counterparty"
    multiplicity: "ManyToMany"
  - name: "merchants"
    type: "Merchant"
    multiplicity: "ManyToMany"
