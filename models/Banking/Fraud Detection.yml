  description: "Classification of the customer for risk profiling and controls."
  data:
  - name: "Retail"
  - name: "Business"
- name: "AccountStatus"
  description: "Lifecycle state of an account relevant for fraud controls and monitoring."
  data:
  - name: "Active"
  - name: "Dormant"
  - name: "Closed"
  - name: "Restricted"
  - name: "Frozen"
- name: "InstrumentType"
  description: "Category of payment instrument used to initiate a transaction."
  data:
  - name: "Card"
  - name: "BankAccount"
  - name: "Wallet"
  - name: "Token"
  - name: "VirtualCard"
- name: "ChannelType"
  description: "Access point through which an interaction or payment is initiated."
