  - name: "MobileApp"
  - name: "ATM"
  - name: "POS"
  - name: "CallCenter"
  - name: "OpenBankingAPI"
- name: "TransactionType"
  description: "Nature of the monetary movement under review."
  data:
  - name: "CardPurchase"
  - name: "CashWithdrawal"
  - name: "FundsTransfer"
  - name: "BillPayment"
  - name: "Deposit"
  - name: "Refund"
  - name: "Chargeback"
  - name: "P2PTransfer"
- name: "AuthenticationResult"
  description: "Outcome of an authentication attempt."
  data:
  - name: "Success"
  - name: "Failure"
  - name: "Challenge"
  - name: "LockedOut"
  - name: "Timeout"
- name: "AuthenticationMethod"
  description: "Technique employed to verify user identity."
  data:
  - name: "Password"
  - name: "OTP"
  - name: "Biometric"
  - name: "3DSecure"
  - name: "DeviceBinding"
- name: "SignalType"
