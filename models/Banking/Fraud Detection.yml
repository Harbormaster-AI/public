  - name: "value"
    type: "Decimal"
  - name: "band"
    type: "RiskLevel"
- name: "AccountNumber"
  description: "Structured representation of an account identifier."
  data:
  - name: "value"
    type: "String"
  - name: "institutionCode"
    type: "String"
- name: "EmailAddress"
  description: "Electronic mail address used for contact and verification."
  data:
  - name: "value"
    type: "String"
