  data:
  - name: "Velocity"
  - name: "Geovelocity"
  - name: "AmountAnomaly"
  - name: "DeviceMismatch"
  - name: "IPReputation"
  - name: "MerchantRisk"
  - name: "Behavioral"
  - name: "ListHit"
  - name: "ModelScore"
  - name: "RuleHit"
