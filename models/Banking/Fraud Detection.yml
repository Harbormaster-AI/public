  - name: "Integer"
  - name: "Decimal"
  - name: "String"
  - name: "Boolean"
  - name: "DateTime"
  - name: "Categorical"
- name: "DecisionOutcome"
  description: "Action taken as a result of fraud evaluation."
  data:
  - name: "Approve"
  - name: "Decline"
  - name: "Review"
  - name: "Challenge"
- name: "CaseStatus"
