---
metadata:
  name: "HCIDL Loan Origination Capabilities Model"
  description: "Canonical capability model for end-to-end loan origination, covering\
    \ intake, qualification, underwriting, pricing, offer, closing, and booking processes."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Banking"
  type: "Capability"
  domain: "Loan Origination"
entities:
- name: "Lender"
  description: "Legal entity that originates and funds loans, maintaining products,\
    \ pricing, and policies."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "licenseNumber"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "products"
    type: "LoanProduct"
    multiplicity: "OneToMany"
  - name: "rateSheets"
    type: "RateSheet"
    multiplicity: "OneToMany"
  - name: "originators"
    type: "Originator"
    multiplicity: "OneToMany"
  - name: "applications"
    type: "LoanApplication"
    multiplicity: "OneToMany"
- name: "Originator"
  description: "Individual or firm that sources and submits loan applications on behalf\
    \ of borrowers."
  data:
  - name: "name"
    type: "String"
  - name: "channel"
    type: "ChannelType"
  - name: "organizationName"
    type: "String"
  - name: "registrationNumber"
    type: "String"
  - name: "contactEmail"
    type: "EmailAddress"
  - name: "contactPhone"
    type: "PhoneNumber"
  relations:
  - name: "lender"
    type: "Lender"
    multiplicity: "ManyToOne"
  - name: "applications"
    type: "LoanApplication"
    multiplicity: "OneToMany"
- name: "LoanProduct"
  description: "Configured lending program with eligibility, pricing basis, and terms."
  data:
  - name: "name"
    type: "String"
  - name: "loanType"
    type: "LoanType"
  - name: "interestRateType"
    type: "InterestRateType"
  - name: "amortizationType"
    type: "AmortizationType"
  - name: "termMonths"
    type: "Integer"
  - name: "baseRate"
    type: "Decimal"
  - name: "maxLoanAmount"
    type: "Money"
  - name: "maxLTV"
    type: "Decimal"
  - name: "minCreditScore"
    type: "Integer"
  relations:
  - name: "lender"
    type: "Lender"
    multiplicity: "ManyToOne"
  - name: "rateSheets"
    type: "RateSheet"
    multiplicity: "OneToMany"
  - name: "applications"
    type: "LoanApplication"
    multiplicity: "OneToMany"
- name: "RateSheet"
  description: "Published pricing terms and adjustments effective for a time window."
  data:
  - name: "name"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "baseIndex"
    type: "String"
  - name: "spread"
    type: "Decimal"
  relations:
  - name: "lender"
    type: "Lender"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "LoanProduct"
    multiplicity: "ManyToOne"
  - name: "pricingAdjustments"
    type: "PricingAdjustment"
    multiplicity: "OneToMany"
  - name: "pricingRequests"
    type: "PricingRequest"
    multiplicity: "OneToMany"
- name: "PricingAdjustment"
  description: "Additive component or credit applied to base pricing based on risk\
    \ or product features."
  data:
  - name: "name"
    type: "String"
  - name: "adjustmentType"
    type: "PricingAdjustmentType"
  - name: "value"
    type: "Decimal"
  - name: "description"
    type: "String"
  relations:
  - name: "rateSheet"
    type: "RateSheet"
    multiplicity: "ManyToOne"
- name: "Applicant"
  description: "Individual borrower or co-borrower providing personal, income, asset,\
    \ and liability information."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "dateOfBirth"
    type: "Date"
  - name: "residencyStatus"
    type: "ResidencyStatus"
  - name: "maritalStatus"
    type: "MaritalStatus"
  - name: "educationLevel"
    type: "EducationLevel"
  - name: "taxIdentifier"
    type: "TaxIdentifier"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "currentAddress"
    type: "Address"
  relations:
  - name: "applications"
    type: "LoanApplication"
    multiplicity: "ManyToMany"
  - name: "employments"
    type: "Employment"
    multiplicity: "OneToMany"
  - name: "incomeSources"
    type: "IncomeSource"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "liabilities"
    type: "Liability"
    multiplicity: "OneToMany"
  - name: "addressHistory"
    type: "AddressHistory"
    multiplicity: "OneToMany"
  - name: "creditReports"
    type: "CreditReport"
    multiplicity: "OneToMany"
  - name: "verifications"
    type: "Verification"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "Consent"
    multiplicity: "OneToMany"
  - name: "kycChecks"
    type: "KYCCheck"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "Employment"
  description: "Employment engagement providing income for an applicant."
  data:
  - name: "employerName"
    type: "String"
  - name: "employmentType"
    type: "EmploymentType"
  - name: "jobTitle"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "monthlyIncome"
    type: "Money"
  relations:
  - name: "applicant"
    type: "Applicant"
    multiplicity: "ManyToOne"
- name: "IncomeSource"
  description: "Declared source of income including regularity and documentation state."
  data:
  - name: "incomeType"
    type: "IncomeType"
  - name: "amount"
    type: "Money"
  - name: "frequency"
    type: "IncomeFrequency"
  - name: "startDate"
    type: "Date"
  - name: "documentationProvided"
    type: "Boolean"
  relations:
  - name: "applicant"
    type: "Applicant"
    multiplicity: "ManyToOne"
- name: "Asset"
  description: "Financial or tangible resource owned by the applicant that contributes\
    \ to capacity or reserves."
  data:
  - name: "assetType"
    type: "AssetType"
  - name: "description"
    type: "String"
  - name: "currentValue"
    type: "Money"
  - name: "institutionName"
    type: "String"
  - name: "liquidityTier"
    type: "LiquidityTier"
  relations:
  - name: "applicant"
    type: "Applicant"
    multiplicity: "ManyToOne"
- name: "Liability"
  description: "Existing debt obligation of the applicant with recurring payments."
  data:
  - name: "creditorName"
    type: "String"
  - name: "liabilityType"
    type: "LiabilityType"
  - name: "monthlyPayment"
    type: "Money"
  - name: "remainingBalance"
    type: "Money"
  - name: "openDate"
    type: "Date"
  relations:
  - name: "applicant"
    type: "Applicant"
    multiplicity: "ManyToOne"
- name: "AddressHistory"
  description: "Historical residence record used for identity and stability assessment."
  data:
  - name: "address"
    type: "Address"
  - name: "occupancyType"
    type: "OccupancyType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "applicant"
    type: "Applicant"
    multiplicity: "ManyToOne"
- name: "LoanApplication"
  description: "Primary application record capturing requested terms, purpose, and\
    \ processing state."
  data:
  - name: "applicationNumber"
    type: "String"
  - name: "status"
    type: "ApplicationStatus"
  - name: "submissionDate"
    type: "Date"
  - name: "channel"
    type: "ChannelType"
  - name: "loanPurpose"
    type: "LoanPurposeType"
  - name: "requestedAmount"
    type: "Money"
  - name: "requestedTermMonths"
    type: "Integer"
  relations:
  - name: "lender"
    type: "Lender"
    multiplicity: "ManyToOne"
  - name: "originator"
    type: "Originator"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "LoanProduct"
    multiplicity: "ManyToOne"
  - name: "applicants"
    type: "Applicant"
    multiplicity: "ManyToMany"
  - name: "collaterals"
    type: "Collateral"
    multiplicity: "OneToMany"
  - name: "pricingRequests"
    type: "PricingRequest"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "verifications"
    type: "Verification"
    multiplicity: "OneToMany"
  - name: "creditReports"
    type: "CreditReport"
    multiplicity: "OneToMany"
  - name: "underwritingCase"
    type: "UnderwritingCase"
    multiplicity: "OneToOne"
  - name: "offers"
    type: "Offer"
    multiplicity: "OneToMany"
  - name: "fees"
    type: "Fee"
    multiplicity: "OneToMany"
  - name: "complianceReviews"
    type: "ComplianceReview"
    multiplicity: "OneToMany"
  - name: "auditTrail"
    type: "AuditTrail"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "Consent"
    multiplicity: "OneToMany"
  - name: "kycChecks"
    type: "KYCCheck"
    multiplicity: "OneToMany"
- name: "CreditReport"
  description: "Third-party credit bureau report and summary metrics for an applicant."
  data:
  - name: "bureau"
    type: "CreditBureau"
  - name: "pulledDate"
    type: "Date"
  - name: "score"
    type: "Integer"
  - name: "referenceNumber"
    type: "String"
  relations:
  - name: "application"
    type: "LoanApplication"
    multiplicity: "ManyToOne"
  - name: "applicant"
    type: "Applicant"
    multiplicity: "ManyToOne"
- name: "Collateral"
  description: "Asset pledged to secure the loan, with valuation and documentation."
  data:
  - name: "collateralType"
    type: "CollateralType"
  - name: "description"
    type: "String"
  - name: "estimatedValue"
    type: "Money"
  - name: "pledged"
    type: "Boolean"
  relations:
  - name: "application"
    type: "LoanApplication"
    multiplicity: "ManyToOne"
  - name: "property"
    type: "PropertyCollateral"
    multiplicity: "OneToOne"
  - name: "appraisals"
    type: "Appraisal"
    multiplicity: "OneToMany"
- name: "PropertyCollateral"
  description: "Real estate details used when property secures the loan."
  data:
  - name: "address"
    type: "Address"
  - name: "propertyType"
    type: "PropertyType"
  - name: "occupancyIntent"
    type: "OccupancyIntent"
  - name: "yearBuilt"
    type: "Integer"
  - name: "squareFeet"
    type: "Integer"
  relations:
  - name: "collateral"
    type: "Collateral"
    multiplicity: "OneToOne"
- name: "Appraisal"
  description: "Independent valuation of pledged collateral."
  data:
  - name: "appraisalDate"
    type: "Date"
  - name: "appraisedValue"
    type: "Money"
  - name: "appraiserName"
    type: "String"
  - name: "status"
    type: "AppraisalStatus"
  relations:
  - name: "collateral"
    type: "Collateral"
    multiplicity: "ManyToOne"
- name: "PricingRequest"
  description: "Request to evaluate pricing and optional rate lock terms for a loan\
    \ scenario."
  data:
  - name: "requestDate"
    type: "Date"
  - name: "lockRequested"
    type: "Boolean"
  - name: "requestedLockDays"
    type: "Integer"
  relations:
  - name: "application"
    type: "LoanApplication"
    multiplicity: "ManyToOne"
  - name: "rateSheet"
    type: "RateSheet"
    multiplicity: "ManyToOne"
  - name: "pricingResult"
    type: "PricingResult"
    multiplicity: "OneToOne"
- name: "PricingResult"
  description: "Calculated pricing outcome including note rate, APR, and credits."
  data:
  - name: "noteRate"
    type: "Decimal"
  - name: "apr"
    type: "Decimal"
  - name: "totalDiscountPoints"
    type: "Decimal"
  - name: "totalLenderCredits"
    type: "Money"
  relations:
  - name: "pricingRequest"
    type: "PricingRequest"
    multiplicity: "OneToOne"
- name: "UnderwritingCase"
  description: "Structured review of risk, eligibility, and decisioning for an application."
  data:
  - name: "caseNumber"
    type: "String"
  - name: "decisionStatus"
    type: "UnderwritingDecisionStatus"
  - name: "decisionDate"
    type: "Date"
  - name: "riskScore"
    type: "Decimal"
  relations:
  - name: "application"
    type: "LoanApplication"
    multiplicity: "OneToOne"
  - name: "underwriter"
    type: "Underwriter"
    multiplicity: "ManyToOne"
  - name: "conditions"
    type: "Condition"
    multiplicity: "OneToMany"
- name: "Condition"
  description: "Requirement that must be satisfied for approval or funding."
  data:
  - name: "name"
    type: "String"
  - name: "conditionType"
    type: "ConditionType"
  - name: "severity"
    type: "ConditionSeverity"
  - name: "status"
    type: "ConditionStatus"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "underwritingCase"
    type: "UnderwritingCase"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "ManyToMany"
- name: "Verification"
  description: "Independent confirmation of applicant information and collateral details."
  data:
  - name: "verificationType"
    type: "VerificationType"
  - name: "status"
    type: "VerificationStatus"
  - name: "requestedDate"
    type: "Date"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "application"
    type: "LoanApplication"
    multiplicity: "ManyToOne"
  - name: "applicant"
    type: "Applicant"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "Document"
  description: "Artifact submitted or generated to support application processing."
  data:
  - name: "documentType"
    type: "DocumentType"
  - name: "fileName"
    type: "String"
  - name: "uploadDate"
    type: "Date"
  - name: "receivedFrom"
    type: "PartyRole"
  - name: "isOriginal"
    type: "Boolean"
  - name: "pages"
    type: "Integer"
  relations:
  - name: "application"
    type: "LoanApplication"
    multiplicity: "ManyToOne"
  - name: "applicant"
    type: "Applicant"
    multiplicity: "ManyToOne"
  - name: "verifications"
    type: "Verification"
    multiplicity: "ManyToMany"
  - name: "conditions"
    type: "Condition"
    multiplicity: "ManyToMany"
  - name: "closingPackage"
    type: "ClosingPackage"
    multiplicity: "ManyToOne"
  - name: "complianceReviews"
    type: "ComplianceReview"
    multiplicity: "ManyToMany"
  - name: "consents"
    type: "Consent"
    multiplicity: "ManyToMany"
  - name: "kycChecks"
    type: "KYCCheck"
    multiplicity: "ManyToMany"
- name: "Offer"
  description: "Formal lending proposal containing approved terms presented to the\
    \ borrower."
  data:
  - name: "offerNumber"
    type: "String"
  - name: "status"
    type: "OfferStatus"
  - name: "offeredAmount"
    type: "Money"
  - name: "offeredTermMonths"
    type: "Integer"
  - name: "noteRate"
    type: "Decimal"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "application"
    type: "LoanApplication"
    multiplicity: "ManyToOne"
  - name: "pricingResult"
    type: "PricingResult"
    multiplicity: "ManyToOne"
  - name: "rateLock"
    type: "RateLock"
    multiplicity: "OneToOne"
  - name: "conditions"
    type: "Condition"
    multiplicity: "OneToMany"
  - name: "closingPackage"
    type: "ClosingPackage"
    multiplicity: "OneToOne"
- name: "RateLock"
  description: "Agreement to hold a specified interest rate for a defined period."
  data:
  - name: "lockDate"
    type: "Date"
  - name: "lockExpirationDate"
    type: "Date"
  - name: "lockStatus"
    type: "RateLockStatus"
  - name: "lockedRate"
    type: "Decimal"
  relations:
  - name: "offer"
    type: "Offer"
    multiplicity: "OneToOne"
- name: "ClosingPackage"
  description: "Compiled set of documents and instructions for settlement and funding."
  data:
  - name: "packageNumber"
    type: "String"
  - name: "status"
    type: "ClosingPackageStatus"
  - name: "scheduledClosingDate"
    type: "Date"
  - name: "settlementAgentName"
    type: "String"
  relations:
  - name: "offer"
    type: "Offer"
    multiplicity: "OneToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "disbursements"
    type: "Disbursement"
    multiplicity: "OneToMany"
  - name: "fees"
    type: "Fee"
    multiplicity: "OneToMany"
- name: "Disbursement"
  description: "Instruction to release loan proceeds or settle obligations at closing."
  data:
  - name: "amount"
    type: "Money"
  - name: "disbursementType"
    type: "DisbursementType"
  - name: "scheduledDate"
    type: "Date"
  - name: "destinationType"
    type: "DisbursementDestinationType"
  - name: "payeeName"
    type: "String"
  relations:
  - name: "closingPackage"
    type: "ClosingPackage"
    multiplicity: "ManyToOne"
- name: "ComplianceReview"
  description: "Assessment of regulatory adherence and disclosure accuracy."
  data:
  - name: "reviewType"
    type: "ComplianceReviewType"
  - name: "status"
    type: "ComplianceStatus"
  - name: "completedDate"
    type: "Date"
  - name: "reviewerName"
    type: "String"
  relations:
  - name: "application"
    type: "LoanApplication"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "ManyToMany"
  - name: "issues"
    type: "ComplianceIssue"
    multiplicity: "OneToMany"
- name: "ComplianceIssue"
  description: "Identified compliance defect or observation requiring resolution."
  data:
  - name: "code"
    type: "String"
  - name: "description"
    type: "String"
  - name: "severity"
    type: "ComplianceSeverity"
  - name: "status"
    type: "ComplianceStatus"
  relations:
  - name: "complianceReview"
    type: "ComplianceReview"
    multiplicity: "ManyToOne"
- name: "Underwriter"
  description: "Credit professional responsible for assessing risk and issuing decisions."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "role"
    type: "UnderwriterRole"
  relations:
  - name: "underwritingCases"
    type: "UnderwritingCase"
    multiplicity: "OneToMany"
- name: "Fee"
  description: "Charge assessed in connection with processing, underwriting, or funding\
    \ the loan."
  data:
  - name: "name"
    type: "String"
  - name: "feeType"
    type: "FeeType"
  - name: "amount"
    type: "Money"
  - name: "paidBy"
    type: "PartyRole"
  - name: "refundable"
    type: "Boolean"
  relations:
  - name: "application"
    type: "LoanApplication"
    multiplicity: "ManyToOne"
  - name: "closingPackage"
    type: "ClosingPackage"
    multiplicity: "ManyToOne"
- name: "Consent"
  description: "Borrower authorization enabling specific processing actions."
  data:
  - name: "consentType"
    type: "ConsentType"
  - name: "granted"
    type: "Boolean"
  - name: "grantedDate"
    type: "Date"
  relations:
  - name: "application"
    type: "LoanApplication"
    multiplicity: "ManyToOne"
  - name: "applicant"
    type: "Applicant"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "ManyToMany"
- name: "AuditTrail"
  description: "Immutable record of significant processing events and changes."
  data:
  - name: "eventTime"
    type: "Date"
  - name: "eventType"
    type: "AuditEventType"
  - name: "actor"
    type: "String"
  - name: "details"
    type: "String"
  relations:
  - name: "application"
    type: "LoanApplication"
    multiplicity: "ManyToOne"
- name: "KYCCheck"
  description: "Customer due diligence screening outcome supporting regulatory requirements."
  data:
  - name: "checkType"
    type: "KYCCheckType"
  - name: "status"
    type: "KYCStatus"
  - name: "completedDate"
    type: "Date"
  relations:
  - name: "applicant"
    type: "Applicant"
    multiplicity: "ManyToOne"
  - name: "application"
    type: "LoanApplication"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "ManyToMany"
enums:
- name: "LoanType"
  description: "Classification of the lending program."
  data:
  - name: "Personal"
  - name: "Auto"
  - name: "Mortgage"
  - name: "HomeEquity"
  - name: "Student"
  - name: "SmallBusiness"
- name: "InterestRateType"
  description: "Structure of the interest rate over the loan term."
  data:
  - name: "Fixed"
  - name: "Variable"
- name: "AmortizationType"
  description: "Method by which payments reduce principal over time."
  data:
  - name: "Amortizing"
  - name: "InterestOnly"
  - name: "Balloon"
- name: "ApplicationStatus"
  description: "Processing state of a loan application."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "InReview"
  - name: "ConditionalApproval"
  - name: "FinalApproval"
  - name: "Declined"
  - name: "Withdrawn"
- name: "ChannelType"
  description: "Origination source through which the application was received."
  data:
  - name: "Branch"
  - name: "Online"
  - name: "Broker"
  - name: "CallCenter"
  - name: "Mobile"
- name: "LoanPurposeType"
  description: "Reason for borrowing."
  data:
  - name: "Purchase"
  - name: "Refinance"
  - name: "DebtConsolidation"
  - name: "HomeImprovement"
  - name: "WorkingCapital"
  - name: "Education"
- name: "CreditBureau"
  description: "Provider of consumer credit reports."
  data:
  - name: "Equifax"
  - name: "Experian"
  - name: "TransUnion"
  - name: "Other"
- name: "CollateralType"
  description: "Category of asset pledged as security."
  data:
  - name: "RealEstate"
  - name: "CashDeposit"
  - name: "Securities"
  - name: "Vehicle"
  - name: "Equipment"
  - name: "Unsecured"
- name: "PropertyType"
  description: "Classification of real estate collateral."
  data:
  - name: "SingleFamily"
  - name: "MultiFamily"
  - name: "Condo"
  - name: "Townhouse"
  - name: "Land"
  - name: "CommercialProperty"
- name: "OccupancyIntent"
  description: "Intended use of the property by the borrower."
  data:
