---
metadata:
  name: "Party Management HCIDL"
  description: "Canonical HCIDL model for managing parties, their identities, roles,\
    \ relationships, and contact mechanisms across the enterprise lifecycle."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Customer & Party Management"
  type: "Capability"
  domain: "Party Management"
entities:
- name: "Party"
  description: "Root entity representing a person or organization that can assume\
    \ roles, maintain identifiers, and participate in relationships."
  data:
  - name: "type"
    type: "PartyType"
  - name: "status"
    type: "PartyStatus"
  - name: "preferredLanguage"
    type: "String"
  - name: "preferredTimeZone"
    type: "String"
  - name: "dateCreated"
    type: "Date"
  relations:
  - name: "person"
    type: "Person"
    multiplicity: "OneToOne"
  - name: "organization"
    type: "Organization"
    multiplicity: "OneToOne"
  - name: "roles"
    type: "PartyRole"
    multiplicity: "OneToMany"
  - name: "identifiers"
    type: "PartyIdentifier"
    multiplicity: "OneToMany"
  - name: "names"
    type: "PartyName"
    multiplicity: "OneToMany"
  - name: "contactAddresses"
    type: "ContactAddress"
    multiplicity: "OneToMany"
  - name: "contactEmails"
    type: "ContactEmail"
    multiplicity: "OneToMany"
  - name: "contactPhones"
    type: "ContactPhone"
    multiplicity: "OneToMany"
  - name: "relationshipsFrom"
    type: "PartyRelationship"
    multiplicity: "OneToMany"
  - name: "relationshipsTo"
    type: "PartyRelationship"
    multiplicity: "OneToMany"
  - name: "preferences"
    type: "CommunicationPreference"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "ConsentGrant"
    multiplicity: "OneToMany"
  - name: "externalReferences"
    type: "ExternalReference"
    multiplicity: "OneToMany"
  - name: "profile"
    type: "PartyProfile"
    multiplicity: "OneToOne"
- name: "Person"
  description: "Natural person details associated with a party."
  data:
  - name: "dateOfBirth"
    type: "Date"
  - name: "gender"
    type: "String"
  - name: "nationality"
    type: "String"
  - name: "deceased"
    type: "Boolean"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "OneToOne"
- name: "Organization"
  description: "Legal or formal organization associated with a party."
  data:
  - name: "legalName"
    type: "String"
  - name: "operatingName"
    type: "String"
  - name: "organizationType"
    type: "OrganizationType"
  - name: "dateEstablished"
    type: "Date"
  - name: "registrationCountry"
    type: "String"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "OneToOne"
- name: "PartyRole"
  description: "Specific role held by a party within a business context, constrained\
    \ by a validity period."
  data:
  - name: "roleType"
    type: "RoleType"
  - name: "validPeriod"
    type: "TimePeriod"
  - name: "status"
    type: "RoleStatus"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "PartyIdentifier"
  description: "Official or business identifier issued to a party by an authority\
    \ or system."
  data:
  - name: "type"
    type: "IdentifierType"
  - name: "value"
    type: "String"
  - name: "issuingAuthority"
    type: "String"
  - name: "issuedDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "PartyName"
  description: "Historical and categorized names associated with a party."
  data:
  - name: "nameType"
    type: "NameType"
  - name: "fullName"
    type: "String"
  - name: "givenName"
    type: "String"
  - name: "middleName"
    type: "String"
  - name: "familyName"
    type: "String"
  - name: "prefix"
    type: "String"
  - name: "suffix"
    type: "String"
  - name: "language"
    type: "String"
  - name: "validPeriod"
    type: "TimePeriod"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "ContactAddress"
  description: "Postal address used to communicate with or locate a party for a defined\
    \ purpose."
  data:
  - name: "purpose"
    type: "ContactPurpose"
  - name: "isPrimary"
    type: "Boolean"
  - name: "validPeriod"
    type: "TimePeriod"
  - name: "address"
    type: "Address"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "ContactEmail"
  description: "Email contact point for a party, including verification status and\
    \ usage purpose."
  data:
  - name: "purpose"
    type: "ContactPurpose"
  - name: "isPrimary"
    type: "Boolean"
  - name: "verificationStatus"
    type: "VerificationStatus"
  - name: "validPeriod"
    type: "TimePeriod"
  - name: "email"
    type: "EmailAddress"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "ContactPhone"
  description: "Telephone contact point for a party, including verification status\
    \ and usage purpose."
  data:
  - name: "purpose"
    type: "ContactPurpose"
  - name: "isPrimary"
    type: "Boolean"
  - name: "verificationStatus"
    type: "VerificationStatus"
  - name: "validPeriod"
    type: "TimePeriod"
  - name: "phoneNumber"
    type: "TelephoneNumber"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "PartyRelationship"
  description: "Directed relationship between two parties with a defined type and\
    \ validity period."
  data:
  - name: "relationshipType"
    type: "RelationshipType"
  - name: "status"
    type: "RelationshipStatus"
  - name: "validPeriod"
    type: "TimePeriod"
  - name: "description"
    type: "String"
  relations:
  - name: "fromParty"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "toParty"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "CommunicationPreference"
  description: "Channel-specific communication preferences declared or inferred for\
    \ a party."
  data:
  - name: "channel"
    type: "ChannelType"
  - name: "allowed"
    type: "Boolean"
  - name: "frequency"
    type: "PreferenceFrequency"
  - name: "preferredTimeWindow"
    type: "String"
  - name: "purpose"
    type: "ContactPurpose"
  - name: "lastUpdated"
    type: "Date"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "ConsentGrant"
  description: "Record of consent decisions given by a party for specific purposes\
    \ and channels."
  data:
  - name: "consentType"
    type: "ConsentType"
  - name: "status"
    type: "ConsentStatus"
  - name: "lawfulBasis"
    type: "LawfulBasis"
  - name: "scope"
    type: "String"
  - name: "grantedAt"
    type: "Date"
  - name: "revokedAt"
    type: "Date"
  - name: "sourceChannel"
    type: "ChannelType"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "ExternalReference"
  description: "Cross-system reference linking a party to identifiers in external\
    \ applications."
  data:
  - name: "system"
    type: "String"
  - name: "reference"
    type: "String"
  - name: "referenceType"
    type: "String"
  - name: "description"
    type: "String"
  - name: "synchronizedAt"
    type: "Date"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "PartyProfile"
  description: "Aggregated and curated profile attributes used for personalization,\
    \ segmentation, and analytics."
  data:
  - name: "locale"
    type: "String"
  - name: "customerSegment"
    type: "String"
  - name: "riskRating"
    type: "String"
  - name: "loyaltyLevel"
    type: "String"
  - name: "lastReviewed"
    type: "Date"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "OneToOne"
enums:
- name: "PartyType"
  description: "Classification of a party as a person or an organization."
  data:
  - name: "Person"
  - name: "Organization"
- name: "PartyStatus"
  description: "Lifecycle state of a party within the master data system."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Suspended"
  - name: "Archived"
- name: "OrganizationType"
  description: "Legal or structural classification of an organization."
  data:
  - name: "PrivateCompany"
  - name: "PublicCompany"
  - name: "NonProfit"
  - name: "Government"
  - name: "Partnership"
  - name: "SoleProprietor"
  - name: "Cooperative"
- name: "RoleType"
  description: "Business roles that a party can assume."
  data:
  - name: "Customer"
  - name: "Supplier"
  - name: "Employee"
  - name: "Partner"
  - name: "Prospect"
  - name: "Member"
  - name: "Subscriber"
  - name: "Guarantor"
- name: "RoleStatus"
  description: "Status of a role assignment for a party."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Suspended"
- name: "IdentifierType"
  description: "Types of identifiers that can be associated with a party."
  data:
  - name: "NationalID"
  - name: "Passport"
  - name: "TaxID"
  - name: "BusinessRegistration"
  - name: "DriverLicense"
  - name: "SocialSecurity"
  - name: "ResidencePermit"
- name: "NameType"
  description: "Categorization of a party name for contextual use."
  data:
  - name: "Legal"
  - name: "Preferred"
  - name: "Trading"
  - name: "Alias"
  - name: "Former"
- name: "ContactPurpose"
  description: "Business purpose for which a contact point is used."
  data:
  - name: "Home"
  - name: "Work"
  - name: "Billing"
  - name: "Shipping"
  - name: "Support"
  - name: "Legal"
- name: "VerificationStatus"
  description: "Verification state of a contact point such as email or phone."
  data:
  - name: "Unverified"
  - name: "Pending"
  - name: "Verified"
  - name: "Bounced"
  - name: "Invalid"
- name: "RelationshipType"
  description: "Semantic type of relationship that can exist between two parties."
  data:
  - name: "SpouseOf"
  - name: "ParentOf"
  - name: "ChildOf"
  - name: "GuardianOf"
  - name: "EmployerOf"
  - name: "EmployeeOf"
  - name: "SubsidiaryOf"
  - name: "DirectorOf"
  - name: "OwnerOf"
  - name: "MemberOf"
  - name: "BeneficiaryOf"
- name: "RelationshipStatus"
  description: "State of a party-to-party relationship over time."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Suspended"
  - name: "Terminated"
- name: "ChannelType"
  description: "Communication channel used to reach a party."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "Phone"
  - name: "PostalMail"
  - name: "PushNotification"
  - name: "Social"
- name: "PreferenceFrequency"
  description: "Preferred cadence for communications sent to a party."
  data:
  - name: "Immediate"
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Quarterly"
- name: "ConsentType"
  description: "Types of permissions that may be granted by a party."
  data:
  - name: "Marketing"
  - name: "Profiling"
  - name: "ThirdPartySharing"
  - name: "Communications"
  - name: "DataProcessing"
  - name: "LocationTracking"
- name: "ConsentStatus"
  description: "Lifecycle status of a consent record."
  data:
  - name: "Granted"
  - name: "Denied"
  - name: "Withdrawn"
  - name: "Expired"
  - name: "Pending"
- name: "LawfulBasis"
  description: "Legal basis for processing personal data in compliance frameworks."
  data:
  - name: "Consent"
  - name: "Contract"
  - name: "LegitimateInterest"
  - name: "LegalObligation"
  - name: "VitalInterest"
  - name: "PublicTask"
valueObjects:
- name: "Address"
  description: "Structured postal address details suitable for mailing and location\
    \ purposes."
  data:
  - name: "line1"
    type: "String"
  - name: "line2"
    type: "String"
  - name: "city"
    type: "String"
  - name: "region"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "countryCode"
    type: "String"
- name: "EmailAddress"
  description: "Electronic mail address formatted according to internet standards."
  data:
  - name: "address"
    type: "String"
- name: "TelephoneNumber"
  description: "Internationally formatted telephone number including optional extension."
  data:
  - name: "countryCode"
    type: "String"
  - name: "nationalNumber"
    type: "String"
  - name: "extension"
    type: "String"
- name: "TimePeriod"
  description: "Time window represented by a start and optional end date for validity."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
