---
metadata:
  name: "Customer Management Capabilities Model"
  description: "Canonical HCIDL capabilities model for managing customers, parties,\
    \ accounts, profiles, interactions, preferences, consents, and segmentation across\
    \ the customer lifecycle."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Customer & Party Management"
  type: "Capability"
  domain: "Customer Management"
entities:
- name: "Party"
  description: "Root abstraction representing an individual, organization, or household\
    \ recognized by the enterprise."
  data:
  - name: "partyType"
    type: "PartyType"
  - name: "displayName"
    type: "String"
  - name: "status"
    type: "PartyStatus"
  - name: "externalReference"
    type: "String"
  relations:
  - name: "person"
    type: "Person"
    multiplicity: "OneToOne"
  - name: "organization"
    type: "Organization"
    multiplicity: "OneToOne"
  - name: "customer"
    type: "Customer"
    multiplicity: "OneToOne"
  - name: "addresses"
    type: "CustomerAddress"
    multiplicity: "OneToMany"
  - name: "contactPoints"
    type: "ContactPoint"
    multiplicity: "OneToMany"
  - name: "relationshipsFrom"
    type: "PartyRelationship"
    multiplicity: "OneToMany"
  - name: "relationshipsTo"
    type: "PartyRelationship"
    multiplicity: "OneToMany"
- name: "Person"
  description: "Natural person details associated with a party."
  data:
  - name: "name"
    type: "PersonalName"
  - name: "dateOfBirth"
    type: "Date"
  - name: "gender"
    type: "Gender"
  - name: "nationalIdentifier"
    type: "String"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "identityDocuments"
    type: "IdentityDocument"
    multiplicity: "OneToMany"
- name: "Organization"
  description: "Registered organization or business associated with a party."
  data:
  - name: "legalName"
    type: "String"
  - name: "tradeName"
    type: "String"
  - name: "industry"
    type: "String"
  - name: "registrationNumber"
    type: "String"
  - name: "organizationSize"
    type: "OrganizationSize"
  - name: "yearEstablished"
    type: "Integer"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "Customer"
  description: "Party engaged with the enterprise in a customer capacity across the\
    \ lifecycle."
  data:
  - name: "category"
    type: "CustomerCategory"
  - name: "lifecycleStatus"
    type: "CustomerLifecycleStatus"
  - name: "primaryLanguage"
    type: "String"
  - name: "preferredTimeZone"
    type: "String"
  - name: "dateJoined"
    type: "Date"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "OneToOne"
  - name: "accounts"
    type: "CustomerAccount"
    multiplicity: "OneToMany"
  - name: "interactions"
    type: "CustomerInteraction"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
  - name: "preferences"
    type: "PreferenceSetting"
    multiplicity: "OneToMany"
  - name: "segments"
    type: "SegmentMembership"
    multiplicity: "OneToMany"
  - name: "addresses"
    type: "CustomerAddress"
    multiplicity: "OneToMany"
  - name: "contactPoints"
    type: "ContactPoint"
    multiplicity: "OneToMany"
  - name: "notes"
    type: "CustomerNote"
    multiplicity: "OneToMany"
  - name: "profile"
    type: "CustomerProfile"
    multiplicity: "OneToOne"
- name: "Household"
  description: "Grouping of parties that share a living arrangement or common economic\
    \ unit."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "formedOn"
    type: "Date"
  relations:
  - name: "members"
    type: "Party"
    multiplicity: "ManyToMany"
  - name: "primaryCustomer"
    type: "Customer"
    multiplicity: "ManyToOne"
- name: "PartyRelationship"
  description: "Directed relationship between two parties with a defined role and\
    \ period."
  data:
  - name: "relationshipType"
    type: "PartyRelationshipType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "directionality"
    type: "RelationshipDirection"
  relations:
  - name: "fromParty"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "toParty"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "ContactPoint"
  description: "Reachable touchpoint for a party or account such as email, phone,\
    \ or social handle."
  data:
  - name: "contactType"
    type: "ContactPointType"
  - name: "value"
    type: "String"
  - name: "primary"
    type: "BinaryFlag"
  - name: "verificationStatus"
    type: "VerificationStatus"
  - name: "usageType"
    type: "ContactUsageType"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
- name: "CustomerAddress"
  description: "Managed postal address for a party, customer, or account with effective\
    \ dating and type."
  data:
  - name: "address"
    type: "PostalAddress"
  - name: "addressType"
    type: "AddressType"
  - name: "primary"
    type: "BinaryFlag"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
- name: "IdentityDocument"
  description: "Government-issued identity credential associated with a person or\
    \ customer."
  data:
  - name: "documentType"
    type: "IdentityDocumentType"
  - name: "documentNumber"
    type: "String"
  - name: "countryOfIssue"
    type: "String"
  - name: "issuedOn"
    type: "Date"
  - name: "expiresOn"
    type: "Date"
  relations:
  - name: "person"
    type: "Person"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
- name: "CustomerAccount"
  description: "Commercial account used to manage billing, entitlements, and balances\
    \ for a customer."
  data:
  - name: "accountNumber"
    type: "String"
  - name: "status"
    type: "AccountStatus"
  - name: "openedOn"
    type: "Date"
  - name: "closedOn"
    type: "Date"
  - name: "creditLimit"
    type: "CurrencyAmount"
  - name: "balance"
    type: "CurrencyAmount"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "ownerParty"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "primaryContact"
    type: "ContactPoint"
    multiplicity: "ManyToOne"
  - name: "serviceAgreements"
    type: "ServiceAgreement"
    multiplicity: "OneToMany"
  - name: "billingProfiles"
    type: "BillingProfile"
    multiplicity: "OneToMany"
  - name: "notes"
    type: "CustomerNote"
    multiplicity: "OneToMany"
- name: "BillingProfile"
  description: "Billing configuration for an account including cycle, terms, delivery\
    \ and payment setup."
  data:
  - name: "billingCycle"
    type: "BillingCycle"
  - name: "paymentTermDays"
    type: "Integer"
  - name: "invoiceDeliveryMethod"
    type: "InvoiceDeliveryMethod"
  - name: "defaultPaymentMethod"
    type: "PaymentMethodType"
  relations:
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "paymentMethods"
    type: "PaymentMethod"
    multiplicity: "OneToMany"
  - name: "billingAddress"
    type: "CustomerAddress"
    multiplicity: "ManyToOne"
- name: "PaymentMethod"
  description: "Enabled means of payment with masked representation and lifecycle\
    \ status."
  data:
  - name: "paymentMethodType"
    type: "PaymentMethodType"
  - name: "displayLabel"
    type: "String"
  - name: "maskedDetails"
    type: "String"
  - name: "status"
    type: "PaymentMethodStatus"
  relations:
  - name: "billingProfile"
    type: "BillingProfile"
    multiplicity: "ManyToOne"
- name: "ServiceAgreement"
  description: "Terms and service commitments applicable to an account for a defined\
    \ period."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "AgreementStatus"
  - name: "serviceLevel"
    type: "String"
  relations:
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
- name: "CustomerProfile"
  description: "Enriched demographic and behavioral attributes maintained for a customer\
    \ or party."
  data:
  - name: "maritalStatus"
    type: "MaritalStatus"
  - name: "educationLevel"
    type: "EducationLevel"
  - name: "occupation"
    type: "String"
  - name: "annualIncome"
    type: "CurrencyAmount"
  - name: "riskRating"
    type: "RiskRating"
  - name: "interests"
    type: "String"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "PreferenceSetting"
  description: "Explicit preferences declared by a party or customer for communications\
    \ and experience."
  data:
  - name: "preferenceType"
    type: "PreferenceType"
  - name: "key"
    type: "String"
  - name: "value"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "CommunicationSubscription"
  description: "Subscription state for receiving communications by channel and topic."
  data:
  - name: "channel"
    type: "Channel"
  - name: "topic"
    type: "CommunicationTopic"
  - name: "frequency"
    type: "CommunicationFrequency"
  - name: "status"
    type: "SubscriptionStatus"
  - name: "updatedOn"
    type: "Date"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "ConsentRecord"
  description: "Regulatory consent decision with scope, legal basis, and evidence\
    \ tracking."
  data:
  - name: "consentType"
    type: "ConsentType"
  - name: "scope"
    type: "ConsentScope"
  - name: "status"
    type: "ConsentStatus"
  - name: "channel"
    type: "Channel"
  - name: "grantedOn"
    type: "Date"
  - name: "expiresOn"
    type: "Date"
  - name: "legalBasis"
    type: "LegalBasis"
  - name: "evidenceReference"
    type: "String"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "Segment"
  description: "Cohort definition used for targeting and analytics."
  data:
  - name: "name"
    type: "String"
  - name: "segmentType"
    type: "SegmentType"
  - name: "description"
    type: "String"
  - name: "status"
    type: "SegmentStatus"
  relations:
  - name: "memberships"
    type: "SegmentMembership"
    multiplicity: "OneToMany"
- name: "SegmentMembership"
  description: "Association of a party or customer to a segment over a period."
  data:
  - name: "joinedOn"
    type: "Date"
  - name: "leftOn"
    type: "Date"
  - name: "source"
    type: "String"
  relations:
  - name: "segment"
    type: "Segment"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "CustomerInteraction"
  description: "Recorded interaction between the enterprise and a customer through\
    \ a specific channel."
  data:
  - name: "interactionType"
    type: "InteractionType"
  - name: "channel"
    type: "Channel"
  - name: "subject"
    type: "String"
  - name: "occurredOn"
    type: "Date"
  - name: "outcome"
    type: "InteractionOutcome"
  - name: "notes"
    type: "String"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "relatedCase"
    type: "CustomerCase"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Agent"
    multiplicity: "ManyToOne"
- name: "CustomerCase"
  description: "Structured request or issue raised by or on behalf of a customer."
  data:
  - name: "caseNumber"
    type: "String"
  - name: "status"
    type: "CaseStatus"
  - name: "priority"
    type: "Priority"
  - name: "openedOn"
    type: "Date"
  - name: "closedOn"
    type: "Date"
  - name: "summary"
    type: "String"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "interactions"
    type: "CustomerInteraction"
    multiplicity: "OneToMany"
  - name: "assignedTeam"
    type: "SupportTeam"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Agent"
    multiplicity: "ManyToOne"
- name: "SupportTeam"
  description: "Group responsible for handling customer cases and interactions."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "queueEmail"
    type: "String"
  relations:
  - name: "cases"
    type: "CustomerCase"
    multiplicity: "OneToMany"
  - name: "agents"
    type: "Agent"
    multiplicity: "OneToMany"
- name: "Agent"
  description: "Employee or representative who manages interactions, notes, and cases."
  data:
  - name: "name"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "AgentRole"
  - name: "employmentStatus"
    type: "EmploymentStatus"
  relations:
  - name: "team"
    type: "SupportTeam"
    multiplicity: "ManyToOne"
  - name: "interactions"
    type: "CustomerInteraction"
    multiplicity: "OneToMany"
  - name: "notes"
    type: "CustomerNote"
    multiplicity: "OneToMany"
- name: "CustomerNote"
  description: "Internal or shareable annotation about a customer, account, or interaction."
  data:
  - name: "title"
    type: "String"
  - name: "content"
    type: "String"
  - name: "createdOn"
    type: "Date"
  - name: "visibility"
    type: "NoteVisibility"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "Agent"
    multiplicity: "ManyToOne"
- name: "BlacklistEntry"
  description: "Suppression record preventing outreach to a specific contact point\
    \ or party."
  data:
  - name: "reason"
    type: "String"
  - name: "source"
    type: "String"
  - name: "createdOn"
    type: "Date"
  - name: "status"
    type: "BlacklistStatus"
  relations:
  - name: "contactPoint"
    type: "ContactPoint"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
