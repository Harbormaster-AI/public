- name: "PartyType"
  description: "Classification of a party by form."
  data:
  - name: "Person"
  - name: "Organization"
  - name: "Household"
- name: "PartyStatus"
  description: "Lifecycle state of a party record."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Archived"
- name: "CustomerCategory"
  description: "High-level category of the customer by market or legal segment."
  data:
  - name: "Consumer"
  - name: "Business"
  - name: "Government"
  - name: "Nonprofit"
- name: "CustomerLifecycleStatus"
  description: "Current lifecycle stage of a customer relationship."
  data:
  - name: "Prospect"
  - name: "Onboarded"
  - name: "Active"
  - name: "AtRisk"
  - name: "Dormant"
  - name: "Churned"
- name: "OrganizationSize"
  description: "Size band of an organization."
  data:
  - name: "Micro"
  - name: "Small"
  - name: "Medium"
  - name: "Large"
  - name: "Enterprise"
- name: "AccountStatus"
  description: "Operational status of a customer account."
  data:
  - name: "Open"
  - name: "Suspended"
  - name: "Closed"
  - name: "WriteOff"
- name: "ContactPointType"
