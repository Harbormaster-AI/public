  - name: "Work"
  - name: "Billing"
  - name: "Shipping"
  - name: "Support"
- name: "AddressType"
  description: "Purpose classification for an address."
  data:
  - name: "Home"
  - name: "Office"
  - name: "Billing"
  - name: "Shipping"
  - name: "Other"
- name: "InteractionType"
  description: "Nature of the interaction."
