---
metadata:
  name: "HCIDL Profile Management Capabilities Model"
  description: "Canonical capabilities model for managing customer and organization\
    \ profiles, including structure, enrichment, governance, versioning, and lifecycle\
    \ controls across channels and systems."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Customer & Party Management"
  type: "Capability"
  domain: "Profile Management"
entities:
- name: "Profile"
  description: "Aggregated view of a person or organization used for identification,\
    \ personalization, and engagement."
  data:
  - name: "displayName"
    type: "String"
  - name: "profileType"
    type: "ProfileType"
  - name: "status"
    type: "ProfileStatus"
  - name: "locale"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "birthDate"
    type: "Date"
  - name: "pronouns"
    type: "String"
  - name: "createdOn"
    type: "Date"
  - name: "updatedOn"
    type: "Date"
  relations:
  - name: "revisions"
    type: "ProfileRevision"
    multiplicity: "OneToMany"
  - name: "contactPoints"
    type: "ProfileContactPoint"
    multiplicity: "OneToMany"
  - name: "addresses"
    type: "ProfileAddress"
    multiplicity: "OneToMany"
  - name: "photos"
    type: "ProfilePhoto"
    multiplicity: "OneToMany"
  - name: "links"
    type: "ProfileLink"
    multiplicity: "OneToMany"
  - name: "identifiers"
    type: "ProfileIdentifier"
    multiplicity: "OneToMany"
  - name: "attributes"
    type: "ProfileAttributeValue"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "TagAssignment"
    multiplicity: "OneToMany"
  - name: "verifications"
    type: "ProfileVerification"
    multiplicity: "OneToMany"
  - name: "mergeRequests"
    type: "ProfileMergeRequest"
    multiplicity: "OneToMany"
  - name: "notes"
    type: "ProfileNote"
    multiplicity: "OneToMany"
  - name: "languages"
    type: "ProfileLanguage"
    multiplicity: "OneToMany"
- name: "ProfileRevision"
  description: "Immutable snapshot of a profile’s state captured for auditability\
    \ and rollback."
  data:
  - name: "versionNumber"
    type: "Integer"
  - name: "changeSummary"
    type: "String"
  - name: "createdOn"
    type: "Date"
  relations:
  - name: "profile"
    type: "Profile"
    multiplicity: "ManyToOne"
- name: "ProfilePhoto"
  description: "Image asset associated with a profile for recognition and display."
  data:
  - name: "caption"
    type: "String"
  - name: "image"
    type: "ImageRef"
  - name: "photoType"
    type: "PhotoType"
  - name: "uploadedOn"
    type: "Date"
  relations:
  - name: "profile"
    type: "Profile"
    multiplicity: "ManyToOne"
- name: "ProfileContactPoint"
  description: "Reachable channel detail used to communicate with the profile subject."
  data:
  - name: "type"
    type: "ContactPointType"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "url"
    type: "Url"
  - name: "label"
    type: "String"
  - name: "preferredRank"
    type: "Integer"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "verificationStatus"
    type: "VerificationStatus"
  relations:
  - name: "profile"
    type: "Profile"
    multiplicity: "ManyToOne"
- name: "ProfileAddress"
  description: "Postal location associated with a profile for communication or fulfillment\
    \ purposes."
  data:
  - name: "address"
    type: "Address"
  - name: "addressType"
    type: "AddressType"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  relations:
  - name: "profile"
    type: "Profile"
    multiplicity: "ManyToOne"
- name: "ProfileIdentifier"
  description: "External or system-specific identifier that links a profile to other\
    \ systems."
  data:
  - name: "sourceSystem"
    type: "String"
  - name: "identifierValue"
    type: "String"
  - name: "status"
    type: "IdentifierStatus"
  - name: "assignedOn"
    type: "Date"
  relations:
  - name: "profile"
    type: "Profile"
    multiplicity: "ManyToOne"
- name: "ProfileAttributeDefinition"
  description: "Governed definition of a custom profile attribute including semantics\
    \ and constraints."
  data:
  - name: "key"
    type: "String"
  - name: "label"
    type: "String"
  - name: "dataType"
    type: "AttributeDataType"
  - name: "cardinality"
    type: "AttributeCardinality"
  - name: "requirementLevel"
    type: "RequirementLevel"
  - name: "scope"
    type: "AttributeScope"
  - name: "description"
    type: "String"
  - name: "allowedValuesHint"
    type: "String"
  relations:
  - name: "values"
    type: "ProfileAttributeValue"
    multiplicity: "OneToMany"
- name: "ProfileAttributeValue"
  description: "Instance value of a custom attribute captured on a profile."
  data:
  - name: "key"
    type: "String"
  - name: "stringValue"
    type: "String"
  - name: "numberValue"
    type: "Decimal"
  - name: "dateValue"
    type: "Date"
  - name: "valueFormat"
    type: "String"
  - name: "capturedOn"
    type: "Date"
  - name: "source"
    type: "String"
  - name: "visibility"
    type: "ProfileVisibilityLevel"
  relations:
  - name: "profile"
    type: "Profile"
    multiplicity: "ManyToOne"
  - name: "definition"
    type: "ProfileAttributeDefinition"
    multiplicity: "ManyToOne"
- name: "Tag"
  description: "Taxonomy label used to classify and organize profiles."
  data:
  - name: "name"
    type: "String"
  - name: "color"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "assignments"
    type: "TagAssignment"
    multiplicity: "OneToMany"
- name: "TagAssignment"
  description: "Association of a tag to a profile with provenance information."
  data:
  - name: "assignedOn"
    type: "Date"
  - name: "reason"
    type: "String"
  - name: "assignedBy"
    type: "String"
  relations:
  - name: "profile"
    type: "Profile"
    multiplicity: "ManyToOne"
  - name: "tag"
    type: "Tag"
    multiplicity: "ManyToOne"
- name: "ProfileVerification"
  description: "Evidence and status tracking for verification of profile data elements."
  data:
  - name: "verificationType"
    type: "VerificationType"
  - name: "status"
    type: "VerificationStatus"
  - name: "checkedOn"
    type: "Date"
  - name: "checkedBy"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "profile"
    type: "Profile"
    multiplicity: "ManyToOne"
  - name: "relatedContactPoint"
    type: "ProfileContactPoint"
    multiplicity: "ManyToOne"
  - name: "relatedAttribute"
    type: "ProfileAttributeValue"
    multiplicity: "ManyToOne"
  - name: "relatedIdentifier"
    type: "ProfileIdentifier"
    multiplicity: "ManyToOne"
- name: "ProfileMergeRequest"
  description: "Managed process to review and merge suspected duplicate profiles."
  data:
  - name: "reason"
    type: "MergeReason"
  - name: "status"
    type: "MergeRequestStatus"
  - name: "requestedOn"
    type: "Date"
  - name: "decisionOn"
    type: "Date"
  - name: "decidedBy"
    type: "String"
  relations:
  - name: "primaryProfile"
    type: "Profile"
    multiplicity: "ManyToOne"
  - name: "duplicateProfile"
    type: "Profile"
    multiplicity: "ManyToOne"
- name: "ProfileLink"
  description: "Connection to an external profile or social presence for enrichment\
    \ and authentication."
  data:
  - name: "platform"
    type: "SocialPlatform"
  - name: "handle"
    type: "String"
  - name: "url"
    type: "Url"
  - name: "displayName"
    type: "String"
  - name: "addedOn"
    type: "Date"
  - name: "visibility"
    type: "ProfileVisibilityLevel"
  relations:
  - name: "profile"
    type: "Profile"
    multiplicity: "ManyToOne"
- name: "ProfileNote"
  description: "Unstructured annotation attached to a profile with categorization\
    \ and access level."
  data:
  - name: "text"
    type: "String"
  - name: "category"
    type: "NoteCategory"
  - name: "createdOn"
    type: "Date"
  - name: "author"
    type: "String"
  - name: "visibility"
    type: "ProfileVisibilityLevel"
  relations:
  - name: "profile"
    type: "Profile"
    multiplicity: "ManyToOne"
- name: "ProfileLanguage"
  description: "Language association and proficiency used for personalization and\
    \ support."
  data:
  - name: "languageCode"
    type: "String"
  - name: "proficiency"
    type: "LanguageProficiency"
  - name: "role"
    type: "LanguageRole"
  - name: "addedOn"
    type: "Date"
  relations:
  - name: "profile"
    type: "Profile"
    multiplicity: "ManyToOne"
enums:
- name: "ProfileType"
  description: "Classification of the subject represented by a profile."
  data:
  - name: "Individual"
  - name: "Organization"
  - name: "Household"
  - name: "Team"
- name: "ProfileStatus"
  description: "Lifecycle state of a profile within the system."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Suspended"
  - name: "Archived"
- name: "ContactPointType"
  description: "Type of channel used to reach the profile."
  data:
  - name: "Email"
  - name: "MobilePhone"
  - name: "LandlinePhone"
  - name: "Website"
  - name: "MessagingApp"
- name: "VerificationStatus"
  description: "Current verification state of a datum or channel."
  data:
  - name: "Unverified"
  - name: "Pending"
  - name: "Verified"
  - name: "Rejected"
  - name: "Expired"
- name: "AddressType"
  description: "Purpose or usage context of an address."
  data:
  - name: "Home"
  - name: "Work"
  - name: "Mailing"
  - name: "Billing"
  - name: "Shipping"
- name: "PhotoType"
  description: "Intended role of a profile image."
  data:
  - name: "Primary"
  - name: "Secondary"
  - name: "Thumbnail"
  - name: "Banner"
- name: "IdentifierStatus"
  description: "State of an external identifier’s applicability."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Deprecated"
- name: "AttributeDataType"
  description: "Data shape of a custom attribute’s value."
  data:
  - name: "Text"
  - name: "Number"
  - name: "Date"
  - name: "URL"
  - name: "Choice"
- name: "RequirementLevel"
  description: "Degree to which an attribute must be provided."
  data:
  - name: "Optional"
  - name: "Recommended"
  - name: "Required"
- name: "AttributeCardinality"
  description: "Number of values an attribute can hold for a profile."
  data:
  - name: "Single"
  - name: "Multiple"
- name: "AttributeScope"
  description: "Applicability context of an attribute definition."
  data:
  - name: "Global"
  - name: "Segment"
  - name: "Organization"
- name: "ProfileVisibilityLevel"
  description: "Audience permitted to view a piece of profile information."
  data:
  - name: "Private"
  - name: "Internal"
  - name: "Public"
- name: "VerificationType"
  description: "Mechanism used to verify profile data."
  data:
  - name: "EmailConfirmation"
  - name: "PhoneOtp"
  - name: "DocumentCheck"
  - name: "SocialHandleCheck"
  - name: "AddressValidation"
- name: "MergeReason"
  description: "Business driver initiating a merge review."
  data:
  - name: "DuplicateDetected"
  - name: "CustomerRequest"
  - name: "DataQualityProcess"
- name: "MergeRequestStatus"
  description: "Workflow state of a profile merge request."
  data:
  - name: "Proposed"
  - name: "UnderReview"
  - name: "Approved"
  - name: "Rejected"
  - name: "Completed"
  - name: "Cancelled"
- name: "SocialPlatform"
  description: "External platform hosting a related profile or handle."
  data:
  - name: "Twitter"
  - name: "Facebook"
  - name: "LinkedIn"
  - name: "Instagram"
  - name: "GitHub"
  - name: "Other"
- name: "NoteCategory"
  description: "Organizational classification for profile notes."
  data:
  - name: "General"
  - name: "Compliance"
  - name: "Support"
  - name: "Sales"
- name: "LanguageProficiency"
  description: "Declared or assessed fluency in a language."
  data:
  - name: "Basic"
  - name: "Conversational"
  - name: "Fluent"
  - name: "Native"
- name: "LanguageRole"
  description: "Role of the language in the profile’s communication preferences."
  data:
  - name: "Primary"
  - name: "Secondary"
valueObjects:
- name: "EmailAddress"
  description: "Structured representation of an email address string."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "Structured representation of a telephone number for dialing and display."
  data:
  - name: "countryCode"
    type: "String"
  - name: "number"
    type: "String"
  - name: "extension"
    type: "String"
- name: "Url"
  description: "Web address used to reference an online resource."
  data:
  - name: "value"
    type: "String"
- name: "ImageRef"
  description: "Reference to an image asset including dimensions and media type."
  data:
  - name: "url"
    type: "String"
  - name: "width"
    type: "Integer"
  - name: "height"
    type: "Integer"
  - name: "mimeType"
    type: "String"
- name: "Address"
  description: "Postal address components suitable for mailing and geocoding."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
