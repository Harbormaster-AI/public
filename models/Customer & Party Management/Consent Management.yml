---
metadata:
  name: "Consent Management Capabilities Model"
  description: "Canonical capability and information model for managing customer and\
    \ party consent across purposes, activities, channels, and jurisdictions, including\
    \ collection, evidence, versioning, revocation, and auditing."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Customer & Party Management"
  type: "Capability"
  domain: "Consent Management"
entities:
- name: "DataController"
  description: "Organization that determines purposes and means of personal data processing."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  - name: "contactEmail"
    type: "String"
  - name: "dpoEmail"
    type: "String"
  relations:
  - name: "policies"
    type: "ConsentPolicy"
    multiplicity: "OneToMany"
  - name: "processingActivities"
    type: "ProcessingActivity"
    multiplicity: "OneToMany"
  - name: "processors"
    type: "DataProcessor"
    multiplicity: "ManyToMany"
  - name: "agreements"
    type: "ProcessingAgreement"
    multiplicity: "OneToMany"
  - name: "privacyNotices"
    type: "PrivacyNotice"
    multiplicity: "OneToMany"
  - name: "consentGrants"
    type: "ConsentGrant"
    multiplicity: "OneToMany"
  - name: "consentRequests"
    type: "ConsentRequest"
    multiplicity: "OneToMany"
  - name: "events"
    type: "ConsentEvent"
    multiplicity: "OneToMany"
- name: "DataProcessor"
  description: "Organization that processes personal data on behalf of a data controller."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "countryOfOperation"
    type: "String"
  - name: "contactEmail"
    type: "String"
  relations:
  - name: "controllers"
    type: "DataController"
    multiplicity: "ManyToMany"
  - name: "agreements"
    type: "ProcessingAgreement"
    multiplicity: "OneToMany"
  - name: "assignedActivities"
    type: "ProcessingActivity"
    multiplicity: "ManyToMany"
- name: "ProcessingAgreement"
  description: "Contractual arrangement defining processing terms between a controller\
    \ and a processor."
  data:
  - name: "name"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "standardContractualClauses"
    type: "Boolean"
  - name: "termsReference"
    type: "String"
  - name: "document"
    type: "DocumentReference"
  relations:
  - name: "controller"
    type: "DataController"
    multiplicity: "ManyToOne"
  - name: "processor"
    type: "DataProcessor"
    multiplicity: "ManyToOne"
- name: "ProcessingPurpose"
  description: "High-level intent for processing personal data."
  data:
  - name: "name"
    type: "String"
  - name: "purposeCategory"
    type: "PurposeCategory"
  - name: "lawfulBasis"
    type: "LegalBasis"
  relations:
  - name: "activities"
    type: "ProcessingActivity"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "ConsentPolicy"
    multiplicity: "OneToMany"
- name: "RetentionPolicy"
  description: "Rules defining how long data is kept and how it is disposed."
  data:
  - name: "name"
    type: "String"
  - name: "duration"
    type: "Duration"
  - name: "deletionStrategy"
    type: "DeletionStrategy"
  - name: "legalHoldAllowed"
    type: "Boolean"
  relations:
  - name: "activities"
    type: "ProcessingActivity"
    multiplicity: "OneToMany"
- name: "ProcessingActivity"
  description: "Specific operational process that handles personal data for a defined\
    \ purpose."
  data:
  - name: "name"
    type: "String"
  - name: "activityType"
    type: "ProcessingActivityType"
  - name: "lawfulBasis"
    type: "LegalBasis"
  - name: "primaryDataCategory"
    type: "DataCategory"
  relations:
  - name: "controller"
    type: "DataController"
    multiplicity: "ManyToOne"
  - name: "purpose"
    type: "ProcessingPurpose"
    multiplicity: "ManyToOne"
  - name: "retentionPolicy"
    type: "RetentionPolicy"
    multiplicity: "ManyToOne"
  - name: "processors"
    type: "DataProcessor"
    multiplicity: "ManyToMany"
  - name: "consentGrants"
    type: "ConsentGrant"
    multiplicity: "OneToMany"
  - name: "consentRequests"
    type: "ConsentRequest"
    multiplicity: "ManyToMany"
- name: "ConsentPolicy"
  description: "Policy that governs consent collection, constraints, and presentation\
    \ rules."
  data:
  - name: "name"
    type: "String"
  - name: "policyVersion"
    type: "String"
  - name: "requiresExplicit"
    type: "Boolean"
  - name: "minAge"
    type: "Integer"
  - name: "jurisdiction"
    type: "Jurisdiction"
  - name: "defaultStatus"
    type: "ConsentStatus"
  relations:
  - name: "controller"
    type: "DataController"
    multiplicity: "ManyToOne"
  - name: "processingActivities"
    type: "ProcessingActivity"
    multiplicity: "OneToMany"
  - name: "notices"
    type: "PrivacyNotice"
    multiplicity: "OneToMany"
  - name: "forms"
    type: "ConsentForm"
    multiplicity: "OneToMany"
  - name: "consentRequests"
    type: "ConsentRequest"
    multiplicity: "OneToMany"
- name: "PrivacyNotice"
  description: "Published notice communicating processing details to data subjects."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "language"
    type: "String"
  - name: "publishedAt"
    type: "DateTime"
  - name: "document"
    type: "DocumentReference"
  relations:
  - name: "controller"
    type: "DataController"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "ConsentPolicy"
    multiplicity: "ManyToOne"
- name: "ConsentForm"
  description: "Configured user interface or API experience used to capture consent."
  data:
  - name: "templateName"
    type: "String"
  - name: "versionLabel"
    type: "String"
  - name: "locale"
    type: "String"
  - name: "channel"
    type: "InteractionChannel"
  relations:
  - name: "policy"
    type: "ConsentPolicy"
    multiplicity: "ManyToOne"
  - name: "notice"
    type: "PrivacyNotice"
    multiplicity: "ManyToOne"
- name: "DataSubject"
  description: "Natural person or party to whom the personal data relates."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "emailAddress"
    type: "String"
  - name: "preferredLanguage"
    type: "String"
  - name: "subjectType"
    type: "SubjectType"
  - name: "birthDate"
    type: "Date"
  - name: "residency"
    type: "Jurisdiction"
  relations:
  - name: "consentGrants"
    type: "ConsentGrant"
    multiplicity: "OneToMany"
  - name: "consentRequests"
    type: "ConsentRequest"
    multiplicity: "OneToMany"
  - name: "delegations"
    type: "Delegation"
    multiplicity: "OneToMany"
  - name: "verifications"
    type: "IdentityVerification"
    multiplicity: "OneToMany"
  - name: "representatives"
    type: "AuthorizedRepresentative"
    multiplicity: "ManyToMany"
  - name: "revocations"
    type: "ConsentRevocation"
    multiplicity: "OneToMany"
  - name: "events"
    type: "ConsentEvent"
    multiplicity: "OneToMany"
- name: "AuthorizedRepresentative"
  description: "Individual or organization authorized to act on behalf of a data subject."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "organizationName"
    type: "String"
  - name: "representativeType"
    type: "RepresentativeType"
  - name: "contactEmail"
    type: "String"
  relations:
  - name: "subjects"
    type: "DataSubject"
    multiplicity: "ManyToMany"
  - name: "delegations"
    type: "Delegation"
    multiplicity: "OneToMany"
- name: "Delegation"
  description: "Authorization that permits a representative to provide or withdraw\
    \ consent on behalf of a subject."
  data:
  - name: "delegationType"
    type: "DelegationType"
  - name: "validFrom"
    type: "Date"
  - name: "validUntil"
    type: "Date"
  - name: "terms"
    type: "String"
  relations:
  - name: "subject"
    type: "DataSubject"
    multiplicity: "ManyToOne"
  - name: "representative"
    type: "AuthorizedRepresentative"
    multiplicity: "ManyToOne"
  - name: "consentGrants"
    type: "ConsentGrant"
    multiplicity: "OneToMany"
- name: "IdentityVerification"
  description: "Verification event confirming the identity or authority of a data\
    \ subject or representative."
  data:
  - name: "method"
    type: "VerificationMethod"
  - name: "verificationStatus"
    type: "VerificationStatus"
  - name: "verifiedAt"
    type: "DateTime"
  - name: "reference"
    type: "String"
  relations:
  - name: "subject"
    type: "DataSubject"
    multiplicity: "ManyToOne"
- name: "ConsentRequest"
  description: "Transaction requesting consent from a data subject for specific processing\
    \ activities."
  data:
  - name: "requestReference"
    type: "String"
  - name: "requestedAt"
    type: "DateTime"
  - name: "channel"
    type: "InteractionChannel"
  - name: "locale"
    type: "String"
  relations:
  - name: "subject"
    type: "DataSubject"
    multiplicity: "ManyToOne"
  - name: "controller"
    type: "DataController"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "ConsentPolicy"
    multiplicity: "ManyToOne"
  - name: "processingActivities"
    type: "ProcessingActivity"
    multiplicity: "ManyToMany"
  - name: "form"
    type: "ConsentForm"
    multiplicity: "ManyToOne"
  - name: "evidence"
    type: "ConsentEvidence"
    multiplicity: "OneToMany"
  - name: "grant"
    type: "ConsentGrant"
    multiplicity: "OneToOne"
  - name: "events"
    type: "ConsentEvent"
    multiplicity: "OneToMany"
- name: "ConsentEvidence"
  description: "Collected artifacts that demonstrate how consent was obtained."
  data:
  - name: "evidenceType"
    type: "EvidenceType"
  - name: "storageLocation"
    type: "String"
  - name: "contentHash"
    type: "String"
  - name: "capturedAt"
    type: "DateTime"
  - name: "ipAddress"
    type: "IPAddress"
  - name: "userAgent"
    type: "String"
  - name: "artifact"
    type: "DocumentReference"
  relations:
  - name: "grant"
    type: "ConsentGrant"
    multiplicity: "ManyToOne"
  - name: "request"
    type: "ConsentRequest"
    multiplicity: "ManyToOne"
- name: "ConsentGrant"
  description: "Record of the subject’s consent decision and its applicable scope."
  data:
  - name: "status"
    type: "ConsentStatus"
  - name: "grantedAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  - name: "jurisdiction"
    type: "Jurisdiction"
  - name: "scopeDescription"
    type: "String"
  - name: "ageAttested"
    type: "Boolean"
  relations:
  - name: "subject"
    type: "DataSubject"
    multiplicity: "ManyToOne"
  - name: "controller"
    type: "DataController"
    multiplicity: "ManyToOne"
  - name: "processingActivities"
    type: "ProcessingActivity"
    multiplicity: "ManyToMany"
  - name: "request"
    type: "ConsentRequest"
    multiplicity: "OneToOne"
  - name: "receipt"
    type: "ConsentReceipt"
    multiplicity: "OneToOne"
  - name: "evidence"
    type: "ConsentEvidence"
    multiplicity: "OneToMany"
  - name: "delegation"
    type: "Delegation"
    multiplicity: "ManyToOne"
  - name: "revocations"
    type: "ConsentRevocation"
    multiplicity: "OneToMany"
  - name: "events"
    type: "ConsentEvent"
    multiplicity: "OneToMany"
- name: "ConsentReceipt"
  description: "Issued confirmation document summarizing consent details for the subject."
  data:
  - name: "receiptReference"
    type: "String"
  - name: "issuedAt"
    type: "DateTime"
  - name: "format"
    type: "ReceiptFormat"
  - name: "deliveryChannel"
    type: "InteractionChannel"
  - name: "downloadUrl"
    type: "String"
  - name: "document"
    type: "DocumentReference"
  relations:
  - name: "grant"
    type: "ConsentGrant"
    multiplicity: "OneToOne"
- name: "ConsentRevocation"
  description: "Record of a withdrawal of consent including context and reason."
  data:
  - name: "revokedAt"
    type: "DateTime"
  - name: "reason"
    type: "RevocationReason"
  - name: "channel"
    type: "InteractionChannel"
  - name: "notes"
    type: "String"
  relations:
  - name: "grant"
    type: "ConsentGrant"
    multiplicity: "ManyToOne"
  - name: "subject"
    type: "DataSubject"
    multiplicity: "ManyToOne"
- name: "ConsentEvent"
  description: "Audit trail entry capturing lifecycle changes to requests and grants."
  data:
  - name: "eventType"
    type: "ConsentEventType"
  - name: "occurredAt"
    type: "DateTime"
  - name: "actorType"
    type: "ActorType"
  - name: "actorDisplayName"
    type: "String"
  - name: "details"
    type: "String"
  relations:
  - name: "grant"
    type: "ConsentGrant"
    multiplicity: "ManyToOne"
  - name: "request"
    type: "ConsentRequest"
    multiplicity: "ManyToOne"
  - name: "subject"
    type: "DataSubject"
    multiplicity: "ManyToOne"
  - name: "controller"
    type: "DataController"
    multiplicity: "ManyToOne"
enums:
- name: "SubjectType"
  description: "Classification of the data subject’s role."
  data:
  - name: "Individual"
  - name: "OrganizationContact"
  - name: "Minor"
- name: "RepresentativeType"
  description: "Nature of authority for an authorized representative."
  data:
  - name: "ParentGuardian"
  - name: "LegalAgent"
  - name: "Employee"
  - name: "Caregiver"
- name: "DelegationType"
  description: "Scope and duration of delegation authority."
  data:
  - name: "Permanent"
  - name: "Temporary"
  - name: "CaseSpecific"
- name: "VerificationMethod"
  description: "Technique used to validate identity or authority."
  data:
  - name: "EmailOTP"
  - name: "SMSOTP"
  - name: "KnowledgeBased"
  - name: "DocumentScan"
  - name: "IdentityProvider"
- name: "VerificationStatus"
  description: "Outcome of the identity verification process."
  data:
  - name: "Pending"
  - name: "Verified"
  - name: "Failed"
  - name: "Expired"
- name: "InteractionChannel"
  description: "Channel through which consent interactions occur."
  data:
  - name: "Web"
  - name: "MobileApp"
  - name: "CallCenter"
  - name: "PointOfSale"
  - name: "PaperForm"
  - name: "API"
- name: "ConsentStatus"
  description: "Current decision state for a consent grant."
  data:
  - name: "Granted"
  - name: "Denied"
  - name: "Withdrawn"
  - name: "Expired"
  - name: "Pending"
- name: "EvidenceType"
  description: "Kind of artifact used as proof of consent."
  data:
  - name: "UIHtmlSnapshot"
  - name: "VoiceRecording"
  - name: "SignedDocument"
  - name: "APIRequestLog"
  - name: "ScreenCapture"
- name: "RevocationReason"
  description: "Reason provided for withdrawing consent."
  data:
  - name: "UserInitiated"
  - name: "Complaint"
  - name: "PolicyChange"
  - name: "IdentityChallengeFailed"
  - name: "Other"
- name: "ReceiptFormat"
  description: "Representation format for a consent receipt."
  data:
  - name: "PDF"
  - name: "HTML"
  - name: "JSON"
  - name: "PlainText"
- name: "LegalBasis"
  description: "Lawful basis relied on for processing personal data."
  data:
  - name: "Consent"
  - name: "Contract"
  - name: "LegalObligation"
  - name: "VitalInterest"
  - name: "PublicTask"
  - name: "LegitimateInterest"
- name: "ProcessingActivityType"
  description: "Functional category of processing performed."
  data:
  - name: "Marketing"
  - name: "Analytics"
  - name: "Personalization"
  - name: "ServiceProvision"
  - name: "SecurityMonitoring"
  - name: "DataSharing"
- name: "DeletionStrategy"
  description: "Method used when disposing of retained personal data."
  data:
  - name: "Anonymize"
  - name: "Delete"
  - name: "Archive"
  - name: "RestrictedAccess"
- name: "ConsentEventType"
  description: "Type of lifecycle event recorded for audit."
  data:
  - name: "Requested"
  - name: "Granted"
  - name: "Denied"
  - name: "Withdrawn"
  - name: "Renewed"
  - name: "Expired"
  - name: "Updated"
- name: "ActorType"
  description: "Source responsible for the consent-related event."
  data:
  - name: "DataSubject"
  - name: "ControllerAgent"
  - name: "ProcessorAgent"
  - name: "System"
- name: "PurposeCategory"
  description: "Grouping of processing purposes for governance."
  data:
  - name: "MarketingCommunications"
  - name: "ServiceOperations"
  - name: "ResearchAndDevelopment"
  - name: "Compliance"
  - name: "Security"
  - name: "Personalization"
- name: "DataCategory"
  description: "Type of personal data predominantly involved in processing."
  data:
  - name: "ContactData"
  - name: "IdentityData"
  - name: "BehavioralData"
  - name: "LocationData"
  - name: "FinancialData"
  - name: "HealthData"
- name: "DurationUnit"
  description: "Unit of measure for retention and time spans."
  data:
  - name: "Days"
  - name: "Weeks"
  - name: "Months"
  - name: "Years"
  - name: "Indefinite"
valueObjects:
- name: "Jurisdiction"
  description: "Geographic scope indicating applicable legal or regulatory area."
  data:
  - name: "country"
    type: "String"
  - name: "region"
    type: "String"
- name: "Duration"
  description: "Length of time used for retention and expiry calculations."
  data:
  - name: "amount"
    type: "Integer"
  - name: "unit"
    type: "DurationUnit"
- name: "IPAddress"
  description: "Representation of an internet protocol address captured as evidence."
  data:
  - name: "value"
    type: "String"
- name: "DocumentReference"
  description: "Reference to a managed document with its integrity hash."
  data:
  - name: "uri"
    type: "String"
  - name: "contentHash"
    type: "String"
