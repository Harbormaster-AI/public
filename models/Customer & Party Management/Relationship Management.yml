---
metadata:
  name: "HCIDL Relationship Management"
  description: "Capabilities model for defining, analyzing, and governing relationships\
    \ among parties, including roles, affiliations, influence, health, and engagement\
    \ planning."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Customer & Party Management"
  type: "Capability"
  domain: "Relationship Management"
entities:
- name: "Party"
  description: "A person, organization, or group that participates in relationships\
    \ and engagements."
  data:
  - name: "displayName"
    type: "String"
  - name: "partyKind"
    type: "PartyKind"
  - name: "primaryLanguage"
    type: "String"
  - name: "timeZone"
    type: "String"
  relations:
  - name: "relationshipParticipants"
    type: "RelationshipParticipant"
    multiplicity: "OneToMany"
  - name: "groupMemberships"
    type: "GroupMembership"
    multiplicity: "OneToMany"
  - name: "affiliations"
    type: "Affiliation"
    multiplicity: "OneToMany"
  - name: "ownedPlans"
    type: "EngagementPlan"
    multiplicity: "OneToMany"
  - name: "assignedTasks"
    type: "EngagementTask"
    multiplicity: "OneToMany"
  - name: "authoredNotes"
    type: "RelationshipNote"
    multiplicity: "OneToMany"
  - name: "connectionRequestsSent"
    type: "ConnectionRequest"
    multiplicity: "OneToMany"
  - name: "connectionRequestsReceived"
    type: "ConnectionRequest"
    multiplicity: "OneToMany"
  - name: "influencesOut"
    type: "InfluenceLink"
    multiplicity: "OneToMany"
  - name: "influencesIn"
    type: "InfluenceLink"
    multiplicity: "OneToMany"
- name: "Relationship"
  description: "A defined association between two or more parties, characterized by\
    \ type, direction, and lifecycle."
  data:
  - name: "relationshipKind"
    type: "RelationshipKind"
  - name: "status"
    type: "RelationshipStatus"
  - name: "direction"
    type: "RelationshipDirection"
  - name: "visibility"
    type: "ConfidentialityLevel"
  - name: "validityPeriod"
    type: "DateRange"
  - name: "summary"
    type: "String"
  relations:
  - name: "participants"
    type: "RelationshipParticipant"
    multiplicity: "OneToMany"
  - name: "health"
    type: "RelationshipHealth"
    multiplicity: "OneToOne"
  - name: "notes"
    type: "RelationshipNote"
    multiplicity: "OneToMany"
  - name: "engagementPlans"
    type: "EngagementPlan"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "RelationshipTagAssignment"
    multiplicity: "OneToMany"
- name: "RelationshipParticipant"
  description: "Role assignment of a party within a specific relationship, including\
    \ level of involvement and timing."
  data:
  - name: "role"
    type: "RoleType"
  - name: "involvement"
    type: "InvolvementLevel"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "relationship"
    type: "Relationship"
    multiplicity: "ManyToOne"
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "Affiliation"
  description: "Membership or employment-like association between a party and an organization\
    \ party."
  data:
  - name: "title"
    type: "String"
  - name: "department"
    type: "String"
  - name: "status"
    type: "AffiliationStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "organization"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "PartyGroup"
  description: "A logical collection of parties that share a purpose or context, such\
    \ as a household or committee."
  data:
  - name: "name"
    type: "String"
  - name: "groupType"
    type: "PartyGroupType"
  - name: "description"
    type: "String"
  relations:
  - name: "memberships"
    type: "GroupMembership"
    multiplicity: "OneToMany"
- name: "GroupMembership"
  description: "The participation of a party in a party group, with assigned role\
    \ and status."
  data:
  - name: "role"
    type: "GroupRole"
  - name: "status"
    type: "AffiliationStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "group"
    type: "PartyGroup"
    multiplicity: "ManyToOne"
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "InfluenceLink"
  description: "A directional influence or advocacy connection from one party to another,\
    \ including sentiment and strength."
  data:
  - name: "influenceStrength"
    type: "Percentage"
  - name: "sentiment"
    type: "Sentiment"
  - name: "rationale"
    type: "String"
  - name: "lastAssessed"
    type: "Date"
  relations:
  - name: "sourceParty"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "targetParty"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "RelationshipHealth"
  description: "Assessment of the overall condition of a relationship using status,\
    \ score, and trend."
  data:
  - name: "healthStatus"
    type: "HealthStatus"
  - name: "healthScore"
    type: "Percentage"
  - name: "trend"
    type: "TrendDirection"
  - name: "assessedOn"
    type: "Date"
  - name: "rationale"
    type: "String"
  relations:
  - name: "relationship"
    type: "Relationship"
    multiplicity: "OneToOne"
- name: "EngagementPlan"
  description: "A structured plan of actions to build, maintain, or recover a relationship."
  data:
  - name: "name"
    type: "String"
  - name: "objective"
    type: "String"
  - name: "status"
    type: "PlanStatus"
  - name: "priority"
    type: "Priority"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "relationship"
    type: "Relationship"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "EngagementTask"
    multiplicity: "OneToMany"
  - name: "collaborators"
    type: "Party"
    multiplicity: "ManyToMany"
- name: "EngagementTask"
  description: "A discrete action within an engagement plan, assigned to a responsible\
    \ party."
  data:
  - name: "name"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "TaskStatus_"
  - name: "channel"
    type: "ChannelType"
  - name: "confidentiality"
    type: "ConfidentialityLevel"
  - name: "notes"
    type: "String"
  relations:
  - name: "plan"
    type: "EngagementPlan"
    multiplicity: "ManyToOne"
  - name: "assignee"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "RelationshipNote"
  description: "A narrative annotation linked to a relationship, authored by a party\
    \ with a defined confidentiality level."
  data:
  - name: "subject"
    type: "String"
  - name: "content"
    type: "String"
  - name: "createdOn"
    type: "Date"
  - name: "confidentiality"
    type: "ConfidentialityLevel"
  relations:
  - name: "relationship"
    type: "Relationship"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "ConnectionRequest"
  description: "A proposal to establish a new relationship between two parties, tracking\
    \ status and timing."
  data:
  - name: "message"
    type: "String"
  - name: "requestedOn"
    type: "Date"
  - name: "respondedOn"
    type: "Date"
  - name: "status"
    type: "RequestStatus"
  relations:
  - name: "requester"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "recipient"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "relationship"
    type: "Relationship"
    multiplicity: "OneToOne"
- name: "RelationshipTag"
  description: "A controlled label used to categorize relationships for discovery\
    \ and reporting."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "color"
    type: "String"
  relations:
  - name: "assignments"
    type: "RelationshipTagAssignment"
    multiplicity: "OneToMany"
- name: "RelationshipTagAssignment"
  description: "The assignment of a tag to a relationship, including who applied it\
    \ and when."
  data:
  - name: "assignedOn"
    type: "Date"
  - name: "note"
    type: "String"
  relations:
  - name: "relationship"
    type: "Relationship"
    multiplicity: "ManyToOne"
  - name: "tag"
    type: "RelationshipTag"
    multiplicity: "ManyToOne"
  - name: "assignedBy"
    type: "Party"
    multiplicity: "ManyToOne"
enums:
- name: "PartyKind"
  description: "Classification of a party as an individual, organization, or group."
  data:
  - name: "Individual"
  - name: "Organization"
  - name: "Group"
- name: "RelationshipKind"
  description: "Canonical types describing the nature of a relationship between parties."
  data:
  - name: "Family"
  - name: "Employment"
  - name: "Partnership"
  - name: "Membership"
  - name: "Ownership"
  - name: "Advisory"
  - name: "Sponsorship"
  - name: "Referral"
  - name: "Hierarchical"
  - name: "Household"
  - name: "Colleague"
  - name: "ClientProvider"
- name: "RelationshipStatus"
  description: "Lifecycle state of a relationship."
  data:
  - name: "Proposed"
  - name: "Active"
  - name: "OnHold"
  - name: "Ended"
- name: "RelationshipDirection"
  description: "Indicates whether a relationship is directional or not."
  data:
  - name: "Directed"
  - name: "Undirected"
- name: "RoleType"
  description: "Roles a party can play within a relationship."
  data:
  - name: "DecisionMaker"
  - name: "Influencer"
  - name: "Approver"
  - name: "User"
  - name: "Sponsor"
  - name: "Stakeholder"
  - name: "Partner"
  - name: "Advisor"
  - name: "FamilyMember"
  - name: "Manager"
  - name: "Subordinate"
- name: "InvolvementLevel"
  description: "Degree to which a participant is engaged in a relationship."
  data:
  - name: "Primary"
  - name: "Secondary"
  - name: "Tertiary"
- name: "AffiliationStatus"
  description: "Status of a party’s membership or affiliation."
  data:
  - name: "Pending"
  - name: "Active"
  - name: "Suspended"
  - name: "Ended"
- name: "PartyGroupType"
  description: "Types of groups that organize parties."
  data:
  - name: "Household"
  - name: "BuyingCenter"
  - name: "Committee"
  - name: "Team"
  - name: "Board"
  - name: "Community"
  - name: "Project"
- name: "GroupRole"
  description: "Roles that parties may assume within a group."
  data:
  - name: "Leader"
  - name: "Member"
  - name: "Coordinator"
  - name: "Observer"
  - name: "Treasurer"
  - name: "Secretary"
- name: "Sentiment"
  description: "Expressed attitude associated with an influence link."
  data:
  - name: "VeryPositive"
  - name: "Positive"
  - name: "Neutral"
  - name: "Negative"
  - name: "VeryNegative"
- name: "TrendDirection"
  description: "Directional change observed in a relationship’s health over time."
  data:
  - name: "Improving"
  - name: "Stable"
  - name: "Declining"
- name: "HealthStatus"
  description: "Qualitative assessment of a relationship’s condition."
  data:
  - name: "Excellent"
  - name: "Good"
  - name: "Fair"
  - name: "Poor"
  - name: "AtRisk"
- name: "PlanStatus"
  description: "Lifecycle state of an engagement plan."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "Priority"
  description: "Relative urgency used for planning and task management."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "TaskStatus_"
  description: "Execution state for an engagement task."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Waiting"
  - name: "Completed"
  - name: "Cancelled"
- name: "ChannelType"
  description: "Communication or interaction channel used during engagement."
  data:
  - name: "Email"
  - name: "Phone"
  - name: "Meeting"
  - name: "Chat"
  - name: "Social"
  - name: "Event"
  - name: "DirectMail"
- name: "RequestStatus"
  description: "Status of a request to establish a new relationship."
  data:
  - name: "Proposed"
  - name: "Accepted"
  - name: "Declined"
  - name: "Withdrawn"
  - name: "Expired"
- name: "ConfidentialityLevel"
  description: "Access sensitivity classification for relationship information."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Confidential"
  - name: "Restricted"
valueObjects:
- name: "DateRange"
  description: "A contiguous period bounded by a start and end date."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "Percentage"
  description: "A fractional value expressed as a percentage between 0 and 100."
  data:
  - name: "value"
    type: "Decimal"
