---
metadata:
  name: "Account Management Capabilities Model"
  description: "HCIDL model for managing accounts, their roles, hierarchies, contact\
    \ channels, identifiers, status history, and categorization."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Customer & Party Management"
  type: "Capability"
  domain: "Account Management"
entities:
- name: "Account"
  description: "Primary record representing a customer, partner, or internal account\
    \ used to manage relationships, entitlements, and commercial interactions."
  data:
  - name: "name"
    type: "String"
  - name: "accountCode"
    type: "AccountCode"
  - name: "accountType"
    type: "AccountType"
  - name: "status"
    type: "AccountStatus"
  - name: "lifecycleStage"
    type: "AccountLifecycleStage"
  - name: "openedDate"
    type: "Date"
  - name: "closedDate"
    type: "Date"
  - name: "tier"
    type: "AccountTier"
  - name: "defaultCurrency"
    type: "String"
  relations:
  - name: "roles"
    type: "AccountPartyRole"
    multiplicity: "OneToMany"
  - name: "addresses"
    type: "AccountAddress"
    multiplicity: "OneToMany"
  - name: "contactPoints"
    type: "AccountContactPoint"
    multiplicity: "OneToMany"
  - name: "identifiers"
    type: "AccountIdentifier"
    multiplicity: "OneToMany"
  - name: "statusHistory"
    type: "AccountStatusHistory"
    multiplicity: "OneToMany"
  - name: "parentLinks"
    type: "AccountRelationship"
    multiplicity: "OneToMany"
  - name: "childLinks"
    type: "AccountRelationship"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "notes"
    type: "AccountNote"
    multiplicity: "OneToMany"
- name: "Party"
  description: "Individual or organization that can be assigned roles on accounts."
  data:
  - name: "partyType"
    type: "PartyType"
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "preferredLanguage"
    type: "String"
  - name: "dateOfBirth"
    type: "Date"
  relations:
  - name: "accountRoles"
    type: "AccountPartyRole"
    multiplicity: "OneToMany"
  - name: "notesAuthored"
    type: "AccountNote"
    multiplicity: "OneToMany"
- name: "AccountPartyRole"
  description: "Assignment of a party to an account with a defined role and effective\
    \ period."
  data:
  - name: "roleType"
    type: "AccountRoleType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "isPrimary"
    type: "Boolean"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "AccountRelationship"
  description: "Relationship linking two accounts to express hierarchy or affiliation."
  data:
  - name: "relationshipType"
    type: "AccountRelationshipType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "parentAccount"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "childAccount"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "AccountAddress"
  description: "Postal address maintained for an account with usage and validity."
  data:
  - name: "usageType"
    type: "AddressUsageType"
  - name: "isPrimary"
    type: "Boolean"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "address"
    type: "PostalAddress"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "AccountContactPoint"
  description: "Contact channel for an account such as email, phone, or social handle."
  data:
  - name: "channelType"
    type: "ContactChannelType"
  - name: "usageType"
    type: "ContactUsageType"
  - name: "isPrimary"
    type: "Boolean"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "handle"
    type: "String"
  - name: "verifiedAt"
    type: "DateTime"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "AccountIdentifier"
  description: "External system reference associated with an account."
  data:
  - name: "system"
    type: "IdentifierSystem"
  - name: "value"
    type: "String"
  - name: "active"
    type: "Boolean"
  - name: "assignedDate"
    type: "Date"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "AccountStatusHistory"
  description: "Audit of account status and lifecycle transitions."
  data:
  - name: "fromStatus"
    type: "AccountStatus"
  - name: "toStatus"
    type: "AccountStatus"
  - name: "changeDate"
    type: "DateTime"
  - name: "reason"
    type: "StatusChangeReason"
  - name: "notes"
    type: "String"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "Tag"
  description: "Reusable label for categorizing and filtering accounts."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "color"
    type: "String"
  relations:
  - name: "accounts"
    type: "Account"
    multiplicity: "ManyToMany"
- name: "AccountNote"
  description: "Freeform note captured against an account for operational context."
  data:
  - name: "subject"
    type: "String"
  - name: "body"
    type: "String"
  - name: "createdDate"
    type: "DateTime"
  - name: "visibilityLevel"
    type: "NoteVisibilityLevel"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "Party"
    multiplicity: "ManyToOne"
enums:
- name: "AccountType"
  description: "Classification of the account based on relationship and usage."
  data:
  - name: "Consumer"
  - name: "Business"
  - name: "Household"
  - name: "Partner"
  - name: "Internal"
- name: "AccountStatus"
  description: "Operational state of the account used for access and servicing controls."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Suspended"
  - name: "Closed"
  - name: "Pending"
- name: "AccountLifecycleStage"
  description: "High-level lifecycle stage indicating progression from acquisition\
    \ to closure."
  data:
  - name: "Prospect"
  - name: "Onboarding"
  - name: "Active"
  - name: "Dormant"
  - name: "Closed"
- name: "PartyType"
  description: "Nature of the party associated with an account."
  data:
  - name: "Person"
  - name: "Organization"
- name: "AccountRoleType"
  description: "Role a party plays on an account for responsibilities and authorization."
  data:
  - name: "Owner"
  - name: "AuthorizedUser"
  - name: "BillingContact"
  - name: "DecisionMaker"
  - name: "Stakeholder"
- name: "AddressUsageType"
  description: "Purpose for which an account address is maintained."
  data:
  - name: "Billing"
  - name: "Mailing"
  - name: "Shipping"
  - name: "Registered"
- name: "AccountRelationshipType"
  description: "Type of linkage between two accounts in a hierarchy or affiliation."
  data:
  - name: "Parent"
  - name: "Subsidiary"
  - name: "Related"
  - name: "ManagedBy"
  - name: "ReferredBy"
- name: "IdentifierSystem"
  description: "External system or domain that provides an identifier for the account."
  data:
  - name: "CRM"
  - name: "ERP"
  - name: "Billing"
  - name: "Marketing"
  - name: "Support"
- name: "ContactChannelType"
  description: "Channel used to reach the account."
  data:
  - name: "Email"
  - name: "Phone"
  - name: "Mobile"
  - name: "Fax"
  - name: "Social"
- name: "ContactUsageType"
  description: "Context for how a contact point is used."
  data:
  - name: "Primary"
  - name: "Secondary"
  - name: "Support"
  - name: "Emergency"
- name: "StatusChangeReason"
  description: "Rationale for transitioning an account from one status to another."
  data:
  - name: "UserRequest"
  - name: "NonPayment"
  - name: "Compliance"
  - name: "DataCorrection"
  - name: "Merged"
- name: "AccountTier"
  description: "Service tier or level assigned to the account."
  data:
  - name: "Standard"
  - name: "Silver"
  - name: "Gold"
  - name: "Platinum"
- name: "NoteVisibilityLevel"
  description: "Scope of who can view a note associated with an account."
  data:
  - name: "Internal"
  - name: "Restricted"
  - name: "External"
valueObjects:
- name: "AccountCode"
  description: "Business-friendly code used to reference an account."
  data:
  - name: "value"
    type: "String"
- name: "PostalAddress"
  description: "Structured representation of a postal address for mailing and service."
  data:
  - name: "line1"
    type: "String"
  - name: "line2"
    type: "String"
  - name: "city"
    type: "String"
  - name: "region"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "countryCode"
    type: "String"
- name: "EmailAddress"
  description: "Validated electronic mail address format."
  data:
  - name: "address"
    type: "String"
- name: "PhoneNumber"
  description: "Structured telephone number including optional extension."
  data:
  - name: "countryCode"
    type: "String"
  - name: "number"
    type: "String"
  - name: "extension"
    type: "String"
