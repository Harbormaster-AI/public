---
metadata:
  name: "HCIDL - Preference Management Capabilities Model"
  description: "Canonical capability model for managing customer communication and\
    \ experience preferences across channels, topics, and contexts, including configuration,\
    \ capture, enforcement, and audit."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Customer & Party Management"
  type: "Capability"
  domain: "Preference Management"
entities:
- name: "PreferenceProfile"
  description: "Central container for a subject’s communication and experience preferences."
  data:
  - name: "displayName"
    type: "String"
  - name: "primaryEmail"
    type: "EmailAddress"
  - name: "primaryPhone"
    type: "PhoneNumber"
  - name: "locale"
    type: "LocaleCode"
  - name: "timezone"
    type: "TimezoneId"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "subject"
    type: "PreferenceSubject"
    multiplicity: "OneToOne"
  - name: "preferences"
    type: "PreferenceSetting"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "frequencyCaps"
    type: "FrequencyCap"
    multiplicity: "OneToMany"
  - name: "quietHours"
    type: "QuietHours"
    multiplicity: "OneToOne"
  - name: "appliedBundles"
    type: "PreferenceBundleAssignment"
    multiplicity: "OneToMany"
  - name: "contactPoints"
    type: "ContactPoint"
    multiplicity: "OneToMany"
  - name: "deliverySuppressions"
    type: "DeliverySuppression"
    multiplicity: "OneToMany"
- name: "PreferenceSubject"
  description: "Person or organization to whom the profile belongs, used to connect\
    \ preferences to external identities."
  data:
  - name: "subjectType"
    type: "SubjectType"
  - name: "externalReference"
    type: "String"
  - name: "name"
    type: "String"
  relations:
  - name: "profile"
    type: "PreferenceProfile"
    multiplicity: "OneToOne"
- name: "PreferenceCategory"
  description: "Logical grouping used to organize preference definitions for presentation\
    \ and governance."
  data:
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  - name: "displayOrder"
    type: "Integer"
  relations:
  - name: "definitions"
    type: "PreferenceDefinition"
    multiplicity: "OneToMany"
- name: "Channel"
  description: "Communication medium through which messages are delivered."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "descriptionText"
    type: "String"
  - name: "isTransactional"
    type: "Boolean"
  relations:
  - name: "topics"
    type: "Topic"
    multiplicity: "OneToMany"
- name: "Topic"
  description: "Thematic subject used to target communications and manage subscriptions."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  - name: "defaultPriority"
    type: "Integer"
  relations:
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "definitions"
    type: "PreferenceDefinition"
    multiplicity: "OneToMany"
- name: "PreferenceDefinition"
  description: "Canonical specification of an individual preference, including data\
    \ type and default behavior."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  - name: "dataType"
    type: "PreferenceDataType"
  - name: "defaultState"
    type: "PreferenceState"
  - name: "defaultValue"
    type: "String"
  - name: "scope"
    type: "PreferenceScope"
  relations:
  - name: "category"
    type: "PreferenceCategory"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
  - name: "options"
    type: "PreferenceOption"
    multiplicity: "OneToMany"
  - name: "rules"
    type: "PreferenceRule"
    multiplicity: "OneToMany"
- name: "PreferenceOption"
  description: "Permissible choice for a constrained preference definition."
  data:
  - name: "code"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "descriptionText"
    type: "String"
  - name: "isDefault"
    type: "Boolean"
  relations:
  - name: "definition"
    type: "PreferenceDefinition"
    multiplicity: "ManyToOne"
- name: "PreferenceContext"
  description: "Contextual boundary such as brand, product, region, or application\
    \ where preferences apply."
  data:
  - name: "name"
    type: "String"
  - name: "contextType"
    type: "ContextType"
  - name: "referenceCode"
    type: "String"
  relations:
  - name: "parent"
    type: "PreferenceContext"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "PreferenceContext"
    multiplicity: "OneToMany"
- name: "PreferenceSetting"
  description: "Concrete state and value of a preference for a profile within an optional\
    \ context."
  data:
  - name: "state"
    type: "PreferenceState"
  - name: "value"
    type: "String"
  - name: "effectiveFrom"
    type: "DateTime"
  - name: "effectiveTo"
    type: "DateTime"
  - name: "source"
    type: "UpdateSource"
  - name: "reason"
    type: "UpdateReason"
  - name: "inherited"
    type: "Boolean"
  relations:
  - name: "profile"
    type: "PreferenceProfile"
    multiplicity: "ManyToOne"
  - name: "definition"
    type: "PreferenceDefinition"
    multiplicity: "ManyToOne"
  - name: "context"
    type: "PreferenceContext"
    multiplicity: "ManyToOne"
  - name: "updates"
    type: "PreferenceUpdate"
    multiplicity: "OneToMany"
- name: "PreferenceUpdate"
  description: "Immutable audit entry capturing a change to a preference setting."
  data:
  - name: "changedAt"
    type: "DateTime"
  - name: "changedBy"
    type: "String"
  - name: "source"
    type: "UpdateSource"
  - name: "reason"
    type: "UpdateReason"
  - name: "previousState"
    type: "PreferenceState"
  - name: "newState"
    type: "PreferenceState"
  - name: "previousValue"
    type: "String"
  - name: "newValue"
    type: "String"
  - name: "channelAddress"
    type: "String"
  - name: "ipAddress"
    type: "String"
  - name: "userAgent"
    type: "String"
  relations:
  - name: "preferenceSetting"
    type: "PreferenceSetting"
    multiplicity: "ManyToOne"
- name: "Subscription"
  description: "Topic-level subscription state for a profile with optional contextualization."
  data:
  - name: "status"
    type: "SubscriptionStatus"
  - name: "effectiveFrom"
    type: "DateTime"
  - name: "effectiveTo"
    type: "DateTime"
  - name: "source"
    type: "UpdateSource"
  - name: "reason"
    type: "UpdateReason"
  relations:
  - name: "profile"
    type: "PreferenceProfile"
    multiplicity: "ManyToOne"
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
  - name: "context"
    type: "PreferenceContext"
    multiplicity: "ManyToOne"
  - name: "updates"
    type: "SubscriptionUpdate"
    multiplicity: "OneToMany"
- name: "SubscriptionUpdate"
  description: "Audit entry capturing a change to a subscription."
  data:
  - name: "changedAt"
    type: "DateTime"
  - name: "changedBy"
    type: "String"
  - name: "source"
    type: "UpdateSource"
  - name: "reason"
    type: "UpdateReason"
  - name: "previousStatus"
    type: "SubscriptionStatus"
  - name: "newStatus"
    type: "SubscriptionStatus"
  - name: "ipAddress"
    type: "String"
  - name: "userAgent"
    type: "String"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
- name: "FrequencyCap"
  description: "Limit of contact attempts within a specified period for a profile,\
    \ optionally scoped to channel or topic."
  data:
  - name: "maxContacts"
    type: "Integer"
  - name: "period"
    type: "FrequencyPeriod"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "profile"
    type: "PreferenceProfile"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
  - name: "context"
    type: "PreferenceContext"
    multiplicity: "ManyToOne"
- name: "QuietHours"
  description: "Daily time window during which communications should be suppressed."
  data:
  - name: "startTime"
    type: "Time"
  - name: "endTime"
    type: "Time"
  - name: "timezone"
    type: "TimezoneId"
  - name: "applyWeekends"
    type: "Boolean"
  relations:
  - name: "profile"
    type: "PreferenceProfile"
    multiplicity: "OneToOne"
- name: "PreferenceRule"
  description: "Rule used to calculate, enforce, or cascade preference states and\
    \ values."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "RuleType"
  - name: "expression"
    type: "String"
  - name: "priority"
    type: "Integer"
  - name: "enabled"
    type: "Boolean"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "definition"
    type: "PreferenceDefinition"
    multiplicity: "ManyToOne"
  - name: "scopeContext"
    type: "PreferenceContext"
    multiplicity: "ManyToOne"
- name: "PreferenceBundle"
  description: "Named collection of default preference states and values intended\
    \ for bulk application."
  data:
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  - name: "versionLabel"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "items"
    type: "PreferenceBundleItem"
    multiplicity: "OneToMany"
- name: "PreferenceBundleItem"
  description: "Default setting for a specific preference definition within a bundle\
    \ and optional context."
  data:
  - name: "state"
    type: "PreferenceState"
  - name: "value"
    type: "String"
  relations:
  - name: "bundle"
    type: "PreferenceBundle"
    multiplicity: "ManyToOne"
  - name: "definition"
    type: "PreferenceDefinition"
    multiplicity: "ManyToOne"
  - name: "context"
    type: "PreferenceContext"
    multiplicity: "ManyToOne"
- name: "PreferenceBundleAssignment"
  description: "Application of a bundle to a profile with activation details."
  data:
  - name: "assignedAt"
    type: "DateTime"
  - name: "assignedBy"
    type: "String"
  - name: "reason"
    type: "UpdateReason"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "profile"
    type: "PreferenceProfile"
    multiplicity: "ManyToOne"
  - name: "bundle"
    type: "PreferenceBundle"
    multiplicity: "ManyToOne"
- name: "ContactPoint"
  description: "Reachable address associated to a channel for delivering communications."
  data:
  - name: "contactType"
    type: "ContactPointType"
  - name: "value"
    type: "String"
  - name: "verified"
    type: "Boolean"
  - name: "primary"
    type: "Boolean"
  relations:
  - name: "profile"
    type: "PreferenceProfile"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
- name: "DeliverySuppression"
  description: "Temporary or permanent block preventing delivery due to bounces, complaints,\
    \ or policy."
  data:
  - name: "suppressionType"
    type: "SuppressionType"
  - name: "reasonText"
    type: "String"
  - name: "activeFrom"
    type: "DateTime"
  - name: "activeTo"
    type: "DateTime"
  relations:
  - name: "profile"
    type: "PreferenceProfile"
    multiplicity: "ManyToOne"
  - name: "contactPoint"
    type: "ContactPoint"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "topic"
    type: "Topic"
    multiplicity: "ManyToOne"
enums:
- name: "SubjectType"
  description: "Classification of the preference subject."
  data:
  - name: "Individual"
  - name: "Organization"
  - name: "Household"
  - name: "Unknown"
- name: "ChannelType"
  description: "Communication mechanisms supported by the enterprise."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "Push"
  - name: "InApp"
  - name: "Voice"
  - name: "Mail"
  - name: "Social"
  - name: "Webhook"
- name: "PreferenceDataType"
  description: "Data type used to store a preference value."
  data:
  - name: "Boolean"
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Date"
  - name: "Time"
  - name: "DateTime"
  - name: "Enum"
- name: "PreferenceState"
  description: "Normalized state of a preference."
  data:
  - name: "OptIn"
  - name: "OptOut"
  - name: "Neutral"
  - name: "Required"
  - name: "Suppressed"
- name: "PreferenceScope"
  description: "Logical boundary for which a preference is defined."
  data:
  - name: "Global"
  - name: "Channel"
  - name: "Topic"
  - name: "Context"
  - name: "Journey"
  - name: "Campaign"
- name: "ContextType"
  description: "Type of contextual boundary where a preference applies."
  data:
  - name: "Brand"
  - name: "BusinessUnit"
  - name: "Product"
  - name: "Region"
  - name: "Application"
  - name: "Environment"
- name: "UpdateSource"
  description: "Origin of a preference or subscription change."
  data:
  - name: "CustomerPortal"
  - name: "MobileApp"
  - name: "ContactCenter"
  - name: "BatchImport"
  - name: "API"
  - name: "SystemDefault"
  - name: "Campaign"
  - name: "DataIntegration"
- name: "UpdateReason"
  description: "Business rationale provided for a change."
  data:
  - name: "CustomerRequest"
  - name: "DerivedByRule"
  - name: "DataCorrection"
  - name: "Migration"
  - name: "PreferenceBundleApplied"
  - name: "ChannelVerification"
  - name: "Complaint"
  - name: "Bounce"
- name: "FrequencyPeriod"
  description: "Cadence for evaluating frequency caps."
  data:
  - name: "PerDay"
  - name: "PerWeek"
  - name: "PerMonth"
  - name: "PerQuarter"
  - name: "PerYear"
  - name: "Rolling30Days"
- name: "SubscriptionStatus"
  description: "State of a topic-level subscription."
  data:
  - name: "Subscribed"
  - name: "Unsubscribed"
  - name: "Paused"
  - name: "Required"
  - name: "Suppressed"
- name: "RuleType"
  description: "Classification of how a rule is applied."
  data:
  - name: "Derivation"
  - name: "Validation"
  - name: "Suppression"
  - name: "Cascade"
  - name: "Defaulting"
- name: "ContactPointType"
  description: "Type of address or handle used for contact."
  data:
  - name: "Email"
  - name: "MobilePhone"
  - name: "Landline"
  - name: "PushToken"
  - name: "PostalAddress"
  - name: "SocialHandle"
  - name: "WebhookEndpoint"
- name: "SuppressionType"
  description: "Reason category that blocks deliveries."
  data:
  - name: "HardBounce"
  - name: "Complaint"
  - name: "SpamTrap"
  - name: "OptOutPolicy"
  - name: "SystemError"
  - name: "TemporaryFailure"
valueObjects:
- name: "EmailAddress"
  description: "Structured representation of an email address value."
  data:
  - name: "address"
    type: "String"
- name: "PhoneNumber"
  description: "Structured representation of a telephone number in E.164 or local\
    \ format."
  data:
  - name: "number"
    type: "String"
  - name: "extension"
    type: "String"
- name: "LocaleCode"
  description: "Language and regional formatting code, typically IETF BCP 47."
  data:
  - name: "value"
    type: "String"
- name: "TimezoneId"
  description: "IANA timezone identifier for scheduling and quiet hours."
  data:
  - name: "value"
    type: "String"
