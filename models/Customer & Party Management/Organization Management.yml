---
metadata:
  name: "HCIDL Organization Management"
  description: "Capabilities model for managing organizations, internal structures,\
    \ registrations, identifiers, governance, and inter-organization relationships."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Identity and Security"
  type: "Capability"
  domain: "Organization Management"
entities:
- name: "Organization"
  description: "Registered party representing a business, government, or nonprofit\
    \ entity."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "organizationType"
    type: "OrganizationType"
  - name: "status"
    type: "OrganizationStatus"
  - name: "yearEstablished"
    type: "Integer"
  - name: "registrationCountry"
    type: "String"
  - name: "primaryIndustry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "parentOrganization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "childOrganizations"
    type: "Organization"
    multiplicity: "OneToMany"
  - name: "identifiers"
    type: "OrganizationIdentifier"
    multiplicity: "OneToMany"
  - name: "registrations"
    type: "OrganizationRegistration"
    multiplicity: "OneToMany"
  - name: "industryClassifications"
    type: "IndustryClassification"
    multiplicity: "OneToMany"
  - name: "offices"
    type: "Office"
    multiplicity: "OneToMany"
  - name: "governanceBodies"
    type: "GovernanceBody"
    multiplicity: "OneToMany"
- name: "OrganizationalUnit"
  description: "Internal structural unit within an organization used to group people,\
    \ processes, or resources."
  data:
  - name: "name"
    type: "String"
  - name: "unitType"
    type: "OrganizationalUnitType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "costCenterCode"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "parentUnit"
    type: "OrganizationalUnit"
    multiplicity: "ManyToOne"
  - name: "subUnits"
    type: "OrganizationalUnit"
    multiplicity: "OneToMany"
  - name: "offices"
    type: "Office"
    multiplicity: "OneToMany"
  - name: "functions"
    type: "BusinessFunction"
    multiplicity: "ManyToMany"
- name: "OrganizationIdentifier"
  description: "External identification assigned to an organization by authorities\
    \ or registries."
  data:
  - name: "identifierType"
    type: "IdentifierType"
  - name: "value"
    type: "String"
  - name: "issuingAuthority"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "OrganizationRegistration"
  description: "Registration of an organization within a jurisdiction for legal or\
    \ tax purposes."
  data:
  - name: "registrationType"
    type: "RegistrationType"
  - name: "registrationNumber"
    type: "String"
  - name: "jurisdiction"
    type: "String"
  - name: "registrationStatus"
    type: "RegistrationStatus"
  - name: "registrationDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "IndustryClassification"
  description: "Standardized industry code associated with an organization."
  data:
  - name: "system"
    type: "IndustryClassificationSystem"
  - name: "code"
    type: "String"
  - name: "label"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "Office"
  description: "Physical or virtual place of operations for an organization or unit."
  data:
  - name: "name"
    type: "String"
  - name: "officeType"
    type: "OfficeType"
  - name: "timezone"
    type: "String"
  - name: "phone"
    type: "PhoneNumber"
  - name: "email"
    type: "String"
  - name: "openDate"
    type: "Date"
  - name: "closeDate"
    type: "Date"
  - name: "address"
    type: "Address"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "organizationalUnit"
    type: "OrganizationalUnit"
    multiplicity: "ManyToOne"
