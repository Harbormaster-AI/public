  description: "Group responsible for oversight, compliance, and strategic decision-making."
  data:
  - name: "name"
    type: "String"
  - name: "bodyType"
    type: "GovernanceBodyType"
  - name: "charterReference"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "policies"
    type: "Policy"
    multiplicity: "OneToMany"
- name: "Policy"
  description: "Formal rule or directive adopted by the organization."
  data:
  - name: "name"
    type: "String"
  - name: "policyCategory"
    type: "PolicyCategory"
  - name: "versionLabel"
    type: "String"
  - name: "status"
    type: "PolicyStatus"
  - name: "publicationDate"
    type: "Date"
  - name: "documentUrl"
    type: "String"
  relations:
  - name: "owningOrganization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "governingBody"
    type: "GovernanceBody"
    multiplicity: "ManyToOne"
- name: "BusinessFunction"
  description: "High-level capability or functional area performed by organizational\
    \ units."
  data:
  - name: "name"
    type: "String"
  - name: "functionCategory"
    type: "FunctionCategory"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "organizationalUnits"
    type: "OrganizationalUnit"
    multiplicity: "ManyToMany"
- name: "OrganizationRelationship"
  description: "Business-to-business relationship instance between two organizations."
  data:
  - name: "relationshipType"
    type: "OrganizationRelationshipType"
  - name: "status"
    type: "RelationshipStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "fromOrganization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "toOrganization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "agreements"
    type: "RelationshipAgreement"
    multiplicity: "OneToMany"
- name: "RelationshipAgreement"
  description: "Agreement or contract governing an inter-organizational relationship."
  data:
  - name: "name"
    type: "String"
  - name: "agreementType"
    type: "AgreementType"
  - name: "effectiveDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "governingLaw"
    type: "String"
  relations:
  - name: "organizationRelationship"
    type: "OrganizationRelationship"
    multiplicity: "ManyToOne"
- name: "OwnershipLink"
  description: "Ownership structure expressing control and shareholding between organizations."
  data:
  - name: "ownershipType"
    type: "OwnershipType"
  - name: "percentage"
    type: "Decimal"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "owner"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "ownedEntity"
    type: "Organization"
    multiplicity: "ManyToOne"
