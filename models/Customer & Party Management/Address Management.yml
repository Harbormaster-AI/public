---
metadata:
  name: "HCIDL Address Management"
  description: "Capabilities model for capturing, standardizing, validating, geocoding,\
    \ governing, and using party addresses across channels and systems."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Customer & Party Management"
  type: "Capability"
  domain: "Address Management"
entities:
- name: "Address"
  description: "Canonical, standardized representation of a deliverable postal location."
  data:
  - name: "postalAddress"
    type: "PostalAddress"
  - name: "addressType"
    type: "AddressType"
  - name: "status"
    type: "AddressStatus"
  - name: "primaryLanguage"
    type: "String"
  - name: "standardizationScore"
    type: "Integer"
  - name: "isValidated"
    type: "Boolean"
  relations:
  - name: "deliveryPoint"
    type: "DeliveryPoint"
    multiplicity: "ManyToOne"
  - name: "verifications"
    type: "AddressVerification"
    multiplicity: "OneToMany"
  - name: "geocodes"
    type: "AddressGeocode"
    multiplicity: "OneToMany"
  - name: "aliases"
    type: "AddressAlias"
    multiplicity: "OneToMany"
  - name: "restrictions"
    type: "AddressRestriction"
    multiplicity: "OneToMany"
  - name: "usages"
    type: "AddressUsage"
    multiplicity: "OneToMany"
  - name: "lifecycleEvents"
    type: "AddressLifecycleEvent"
    multiplicity: "OneToMany"
- name: "AddressUsage"
  description: "Assignment of an address to a party with a defined purpose and validity\
    \ period."
  data:
  - name: "usageType"
    type: "AddressUsageType"
  - name: "isPrimary"
    type: "Boolean"
  - name: "validPeriod"
    type: "TimePeriod"
  relations:
  - name: "address"
    type: "Address"
    multiplicity: "ManyToOne"
  - name: "party"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "Party"
  description: "Person or organization that can have one or more addresses for various\
    \ uses."
  data:
  - name: "displayName"
    type: "String"
  - name: "partyType"
    type: "PartyType"
  - name: "defaultLanguage"
    type: "String"
  relations:
  - name: "addressUsages"
    type: "AddressUsage"
    multiplicity: "OneToMany"
- name: "DeliveryPoint"
  description: "Physical delivery location representing a mailbox, unit, or consolidated\
    \ drop point."
  data:
  - name: "deliveryPointType"
    type: "DeliveryPointType"
  - name: "status"
    type: "DeliveryPointStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "addresses"
    type: "Address"
    multiplicity: "OneToMany"
- name: "AddressVerification"
  description: "Evidence and outcome of validating an address against authoritative\
    \ or third-party sources."
  data:
  - name: "verificationStatus"
    type: "VerificationStatus"
  - name: "confidenceScore"
    type: "Integer"
  - name: "verificationDate"
    type: "Date"
  - name: "referenceCode"
    type: "String"
  relations:
  - name: "address"
    type: "Address"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "AddressDataProvider"
    multiplicity: "ManyToOne"
- name: "AddressDataProvider"
  description: "External or internal source of address reference data, validation,\
    \ or geocoding services."
  data:
  - name: "name"
    type: "String"
  - name: "providerType"
    type: "ProviderType"
  - name: "serviceEndpoint"
    type: "String"
  relations:
  - name: "verifications"
    type: "AddressVerification"
    multiplicity: "OneToMany"
  - name: "geocodes"
    type: "AddressGeocode"
    multiplicity: "OneToMany"
- name: "AddressGeocode"
  description: "Geospatial coordinates and precision information associated with an\
    \ address."
  data:
  - name: "coordinate"
    type: "GeoCoordinate"
  - name: "precision"
    type: "GeocodePrecision"
  - name: "geocodeMethod"
    type: "GeocodeMethod"
  - name: "timezone"
    type: "String"
  relations:
  - name: "address"
    type: "Address"
    multiplicity: "ManyToOne"
  - name: "provider"
    type: "AddressDataProvider"
    multiplicity: "ManyToOne"
- name: "AddressAlias"
  description: "Alternate or historical naming of an address used locally or during\
    \ transitions."
  data:
  - name: "aliasText"
    type: "String"
  - name: "aliasType"
    type: "AliasType"
  relations:
  - name: "address"
    type: "Address"
    multiplicity: "ManyToOne"
- name: "AddressRestriction"
  description: "Communication and delivery constraints applied to a specific address."
  data:
  - name: "restrictionType"
    type: "RestrictionType"
  - name: "reason"
    type: "String"
  - name: "effectivePeriod"
    type: "TimePeriod"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "address"
    type: "Address"
    multiplicity: "ManyToOne"
  - name: "setBy"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "AddressLifecycleEvent"
  description: "Audit trail of key lifecycle events impacting an address."
  data:
  - name: "eventType"
    type: "LifecycleEventType"
  - name: "eventDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "address"
    type: "Address"
    multiplicity: "ManyToOne"
  - name: "actor"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "AddressChangeRequest"
  description: "Governed request to add, correct, move, or deprecate an address."
  data:
  - name: "changeType"
    type: "ChangeType"
  - name: "status"
    type: "ChangeRequestStatus"
  - name: "submittedDate"
    type: "Date"
  - name: "approvedDate"
    type: "Date"
  - name: "requestedByChannel"
    type: "CaptureChannel"
  - name: "originalAddressText"
    type: "String"
  relations:
  - name: "targetAddress"
    type: "Address"
    multiplicity: "ManyToOne"
  - name: "requester"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "AddressMerge"
  description: "Consolidation action that designates a surviving address and merges\
    \ duplicates into it."
  data:
  - name: "mergeReason"
    type: "MergeReason"
  - name: "mergeDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "survivor"
    type: "Address"
    multiplicity: "ManyToOne"
  - name: "mergedFrom"
    type: "Address"
    multiplicity: "ManyToMany"
- name: "AddressCaptureSession"
  description: "Guided entry or ingestion session that captures and standardizes an\
    \ address."
  data:
  - name: "inputAddressText"
    type: "String"
  - name: "channel"
    type: "CaptureChannel"
  - name: "status"
    type: "CaptureStatus"
  - name: "startedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  relations:
  - name: "createdAddress"
    type: "Address"
    multiplicity: "OneToOne"
  - name: "initiatedBy"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "AddressFormatProfile"
  description: "Country and locale-specific rules for rendering and validating address\
    \ strings."
  data:
  - name: "countryCode"
    type: "String"
  - name: "formatPattern"
    type: "String"
  - name: "postalCodePattern"
    type: "String"
  - name: "textDirection"
    type: "TextDirection"
  - name: "uppercasePostalCode"
    type: "Boolean"
- name: "AddressImportBatch"
  description: "Batch process that imports addresses and optionally creates party\
    \ usages."
  data:
  - name: "sourceSystem"
    type: "String"
  - name: "fileName"
    type: "String"
  - name: "startedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  - name: "status"
    type: "ImportStatus"
  - name: "totalRecords"
    type: "Integer"
  - name: "successfulRecords"
    type: "Integer"
  - name: "failedRecords"
    type: "Integer"
  relations:
  - name: "createdAddresses"
    type: "Address"
    multiplicity: "OneToMany"
  - name: "createdUsages"
    type: "AddressUsage"
    multiplicity: "OneToMany"
- name: "AddressDeduplicationCluster"
  description: "Grouping of similar addresses identified for review and resolution."
  data:
  - name: "similarityScore"
    type: "Integer"
  - name: "resolutionStatus"
    type: "DedupResolutionStatus"
  relations:
  - name: "candidates"
    type: "Address"
    multiplicity: "ManyToMany"
  - name: "survivor"
    type: "Address"
    multiplicity: "ManyToOne"
enums:
- name: "AddressType"
  description: "Classification of an address by operational use or structure."
  data:
  - name: "Residential"
  - name: "Business"
  - name: "POBox"
  - name: "Military"
  - name: "RuralRoute"
  - name: "Campus"
  - name: "Government"
- name: "AddressStatus"
  description: "Lifecycle state of an address within the repository."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "PendingVerification"
  - name: "Deprecated"
  - name: "Superseded"
- name: "AddressUsageType"
  description: "Purpose for which a party uses an address."
  data:
  - name: "Billing"
  - name: "Shipping"
  - name: "Home"
  - name: "Office"
  - name: "RegisteredOffice"
  - name: "Postal"
  - name: "EmergencyContact"
- name: "PartyType"
  description: "High-level classification of the party associated with addresses."
  data:
  - name: "Person"
  - name: "Organization"
- name: "DeliveryPointType"
  description: "Kind of physical location where mail or parcels are delivered."
  data:
  - name: "SingleUnit"
  - name: "MultiUnitLobby"
  - name: "ParcelLocker"
  - name: "CommunityMailbox"
  - name: "ReceptionDesk"
  - name: "Dock"
- name: "DeliveryPointStatus"
  description: "Operational status of the delivery point."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "TemporarilyClosed"
- name: "VerificationStatus"
  description: "Result of validating an address against reference sources."
  data:
  - name: "Verified"
  - name: "PartiallyVerified"
  - name: "NotVerified"
  - name: "CannotVerify"
- name: "ProviderType"
  description: "Type of data provider for address validation or geocoding."
  data:
  - name: "PostalAuthority"
  - name: "ThirdParty"
  - name: "InternalReference"
- name: "GeocodePrecision"
  description: "Accuracy level of the geocode relative to the address."
  data:
  - name: "Rooftop"
  - name: "Entrance"
  - name: "Parcel"
  - name: "Street"
  - name: "Interpolated"
  - name: "Locality"
  - name: "AdministrativeArea"
- name: "GeocodeMethod"
  description: "Method used to derive the geocode for an address."
  data:
  - name: "AuthoritativePoint"
  - name: "Interpolation"
  - name: "Centroid"
  - name: "Manual"
- name: "AliasType"
  description: "Nature of the alternate naming for an address."
  data:
  - name: "FormerName"
  - name: "LocalName"
  - name: "Intersection"
  - name: "LandmarkBased"
  - name: "PhoneticVariant"
- name: "RestrictionType"
  description: "Constraint applied to communications or deliveries to the address."
  data:
  - name: "DoNotMail"
  - name: "DoNotVisit"
  - name: "DoNotShipHazmat"
  - name: "SeasonalHold"
- name: "LifecycleEventType"
  description: "Business event that modifies or records the state of an address."
  data:
  - name: "Created"
  - name: "Standardized"
  - name: "Verified"
  - name: "Geocoded"
  - name: "Moved"
  - name: "Deprecated"
  - name: "Reactivated"
- name: "ChangeType"
  description: "Category of change proposed by a change request."
  data:
  - name: "Add"
  - name: "Correction"
  - name: "Move"
  - name: "Remove"
  - name: "Reactivate"
- name: "ChangeRequestStatus"
  description: "Workflow stage of an address change request."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Applied"
  - name: "Cancelled"
- name: "MergeReason"
  description: "Justification for consolidating duplicate addresses."
  data:
  - name: "Duplicate"
  - name: "Consolidation"
  - name: "SupersededByAuthority"
- name: "CaptureChannel"
  description: "Source channel through which the address was captured or requested."
  data:
  - name: "Web"
  - name: "Mobile"
  - name: "CallCenter"
  - name: "Batch"
  - name: "API"
- name: "CaptureStatus"
  description: "State of an address capture session."
  data:
  - name: "InProgress"
  - name: "Completed"
  - name: "Abandoned"
  - name: "Failed"
- name: "TextDirection"
  description: "Directionality for rendering address text."
  data:
  - name: "LeftToRight"
  - name: "RightToLeft"
- name: "ImportStatus"
  description: "Processing state of an address import batch."
  data:
  - name: "Queued"
  - name: "Running"
  - name: "Completed"
  - name: "CompletedWithErrors"
  - name: "Failed"
- name: "DedupResolutionStatus"
  description: "Resolution progress for a deduplication cluster."
  data:
  - name: "Unreviewed"
  - name: "UnderReview"
  - name: "Resolved"
  - name: "PartiallyResolved"
valueObjects:
- name: "PostalAddress"
  description: "Structured, locale-agnostic components of a mailing address."
  data:
  - name: "addressLine1"
    type: "String"
  - name: "addressLine2"
    type: "String"
  - name: "buildingNumber"
    type: "String"
  - name: "streetName"
    type: "String"
  - name: "thoroughfareType"
    type: "String"
  - name: "subBuilding"
    type: "String"
  - name: "locality"
    type: "String"
  - name: "district"
    type: "String"
  - name: "region"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "countryCode"
    type: "String"
  - name: "careOf"
    type: "String"
- name: "GeoCoordinate"
  description: "Geographic position expressed in decimal degrees."
  data:
  - name: "latitude"
    type: "Decimal"
  - name: "longitude"
    type: "Decimal"
  - name: "coordinateSystem"
    type: "String"
- name: "TimePeriod"
  description: "Time interval with a start and optional end."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "openEnded"
    type: "Boolean"
