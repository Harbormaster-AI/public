---
metadata:
  name: "HCIDL Capabilities Model - Contact Management"
  description: "A capabilities model capturing how contacts, their communication points,\
    \ permissions, lists, and related operational records are managed across an organization."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Customer & Party Management"
  type: "Capability"
  domain: "Contact Management"
entities:
- name: "Contact"
  description: "An individual person whose reachability, preferences, and related\
    \ records are managed."
  data:
  - name: "personName"
    type: "PersonName"
  - name: "jobTitle"
    type: "String"
  - name: "department"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "language"
    type: "String"
  - name: "preferredContactMethod"
    type: "PreferredContactMethod"
  - name: "status"
    type: "ContactStatus"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "emails"
    type: "Email"
    multiplicity: "OneToMany"
  - name: "phones"
    type: "Phone"
    multiplicity: "OneToMany"
  - name: "addresses"
    type: "ContactAddress"
    multiplicity: "OneToMany"
  - name: "socialProfiles"
    type: "SocialProfile"
    multiplicity: "OneToMany"
  - name: "messagingHandles"
    type: "MessagingHandle"
    multiplicity: "OneToMany"
  - name: "permissions"
    type: "ContactPermission"
    multiplicity: "OneToMany"
  - name: "lists"
    type: "ContactList"
    multiplicity: "ManyToMany"
  - name: "owner"
    type: "ContactOwner"
    multiplicity: "ManyToOne"
  - name: "interactions"
    type: "ContactInteraction"
    multiplicity: "OneToMany"
  - name: "notes"
    type: "ContactNote"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "ContactAttachment"
    multiplicity: "OneToMany"
  - name: "lifecycleRecords"
    type: "ContactLifecycle"
    multiplicity: "OneToMany"
  - name: "sourceRecords"
    type: "ContactSourceRecord"
    multiplicity: "OneToMany"
- name: "Organization"
  description: "A business or institution associated with one or more contacts."
  data:
  - name: "name"
    type: "String"
  - name: "industry"
    type: "String"
  - name: "website"
    type: "WebUrl"
  - name: "sizeBand"
    type: "OrganizationSizeBand"
  relations:
  - name: "contacts"
    type: "Contact"
    multiplicity: "OneToMany"
  - name: "addresses"
    type: "OrganizationAddress"
    multiplicity: "OneToMany"
  - name: "domains"
    type: "EmailDomain"
    multiplicity: "OneToMany"
- name: "Email"
  description: "A managed email address for a contact, including verification and\
    \ deliverability status."
  data:
  - name: "address"
    type: "EmailAddress"
  - name: "isPrimary"
    type: "Boolean"
  - name: "verificationStatus"
    type: "VerificationStatus"
  - name: "deliverabilityStatus"
    type: "DeliverabilityStatus"
  relations:
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "Phone"
  description: "A managed phone number for a contact, including type and reachability."
  data:
  - name: "number"
    type: "PhoneNumber"
  - name: "phoneType"
    type: "PhoneType"
  - name: "isPrimary"
    type: "Boolean"
  - name: "verificationStatus"
    type: "VerificationStatus"
  - name: "reachable"
    type: "Boolean"
  relations:
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "SocialProfile"
  description: "A social network profile used to engage or research a contact."
  data:
  - name: "network"
    type: "SocialNetwork"
  - name: "handle"
    type: "String"
  - name: "url"
    type: "WebUrl"
  - name: "isPrimary"
    type: "Boolean"
  relations:
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "MessagingHandle"
  description: "A messaging application handle associated with a contact."
  data:
  - name: "platform"
    type: "MessagingPlatform"
  - name: "handle"
    type: "String"
  - name: "isPrimary"
    type: "Boolean"
  - name: "verificationStatus"
    type: "VerificationStatus"
  - name: "canReceiveMedia"
    type: "Boolean"
  relations:
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "ContactAddress"
  description: "A postal address for a contact, including intended usage and validation\
    \ status."
  data:
  - name: "address"
    type: "PostalAddress"
  - name: "addressType"
    type: "AddressType"
  - name: "isPrimary"
    type: "Boolean"
  - name: "validationStatus"
    type: "AddressValidationStatus"
  relations:
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "OrganizationAddress"
  description: "A postal address for an organization, with usage and validation details."
  data:
  - name: "address"
    type: "PostalAddress"
  - name: "addressType"
    type: "AddressType"
  - name: "isPrimary"
    type: "Boolean"
  - name: "validationStatus"
    type: "AddressValidationStatus"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "ContactPermission"
  description: "Channel-specific permission to contact an individual for a specified\
    \ purpose."
  data:
  - name: "channel"
    type: "ContactChannelType"
  - name: "purpose"
    type: "ContactPurpose"
  - name: "status"
    type: "ConsentStatus"
  - name: "grantedAt"
    type: "Date"
  - name: "expiresAt"
    type: "Date"
  - name: "source"
    type: "ConsentSource"
  relations:
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "ContactOwner"
  description: "The accountable owner for a set of contacts, which may be a user,\
    \ team, or queue."
  data:
  - name: "ownerType"
    type: "OwnerType"
  - name: "name"
    type: "String"
  relations:
  - name: "contacts"
    type: "Contact"
    multiplicity: "OneToMany"
  - name: "lists"
    type: "ContactList"
    multiplicity: "OneToMany"
  - name: "notes"
    type: "ContactNote"
    multiplicity: "OneToMany"
- name: "ContactList"
  description: "A managed collection of contacts used for organization, outreach,\
    \ or workflows."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "listType"
    type: "ContactListType"
  - name: "visibility"
    type: "ListVisibility"
  relations:
  - name: "contacts"
    type: "Contact"
    multiplicity: "ManyToMany"
  - name: "owner"
    type: "ContactOwner"
    multiplicity: "ManyToOne"
- name: "ContactNote"
  description: "A note authored about a contact, providing context and history."
  data:
  - name: "noteType"
    type: "NoteType"
  - name: "body"
    type: "String"
  - name: "createdAt"
    type: "Date"
  - name: "visibility"
    type: "NoteVisibility"
  relations:
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "ContactOwner"
    multiplicity: "ManyToOne"
- name: "ContactSourceRecord"
  description: "Provenance information describing how the contact was acquired or\
    \ updated."
  data:
  - name: "sourceType"
    type: "SourceType"
  - name: "sourceName"
    type: "String"
  - name: "capturedAt"
    type: "Date"
  - name: "reference"
    type: "String"
  - name: "medium"
    type: "String"
  relations:
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
- name: "EmailDomain"
  description: "An email domain associated with an organization, used for inference\
    \ and matching."
  data:
  - name: "domain"
    type: "String"
  - name: "isVerified"
    type: "Boolean"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "ContactMerge"
  description: "A controlled process that consolidates duplicate contacts into a single\
    \ primary record."
  data:
  - name: "status"
    type: "MergeStatus"
  - name: "ruleSet"
    type: "String"
  - name: "initiatedAt"
    type: "Date"
  relations:
  - name: "primaryContact"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "duplicateContact"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "resolvedBy"
    type: "ContactOwner"
    multiplicity: "ManyToOne"
- name: "ContactInteraction"
  description: "A record of an interaction or attempted interaction with a contact."
  data:
  - name: "interactionType"
    type: "InteractionType"
  - name: "channel"
    type: "ContactChannelType"
  - name: "occurredAt"
    type: "Date"
  - name: "subject"
    type: "String"
  - name: "outcome"
    type: "InteractionOutcome"
  - name: "summary"
    type: "String"
  relations:
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "organizer"
    type: "ContactOwner"
    multiplicity: "ManyToOne"
- name: "ContactAttachment"
  description: "A file or link attached to a contact record for reference."
  data:
  - name: "fileName"
    type: "String"
  - name: "contentType"
    type: "String"
  - name: "sizeBytes"
    type: "Integer"
  - name: "url"
    type: "WebUrl"
  - name: "uploadedAt"
    type: "Date"
  relations:
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
  - name: "uploadedBy"
    type: "ContactOwner"
    multiplicity: "ManyToOne"
- name: "ContactLifecycle"
  description: "The current stage and history of a contact within the relationship\
    \ lifecycle."
  data:
  - name: "stage"
    type: "LifecycleStage"
  - name: "since"
    type: "Date"
  - name: "reason"
    type: "String"
  relations:
  - name: "contact"
    type: "Contact"
    multiplicity: "ManyToOne"
enums:
- name: "PreferredContactMethod"
  description: "The method a contact prefers to be reached by."
  data:
  - name: "Email"
  - name: "Phone"
  - name: "SMS"
  - name: "MessagingApp"
  - name: "Social"
  - name: "PostalMail"
  - name: "None"
- name: "ContactStatus"
  description: "The current operational status of a contact record."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Archived"
  - name: "DoNotContact"
- name: "OrganizationSizeBand"
  description: "A coarse-grained categorization of organization size."
  data:
  - name: "Micro"
  - name: "Small"
  - name: "Medium"
  - name: "Large"
  - name: "Enterprise"
- name: "VerificationStatus"
  description: "The verification state of a communication endpoint."
  data:
  - name: "Unverified"
  - name: "Pending"
  - name: "Verified"
  - name: "Failed"
- name: "DeliverabilityStatus"
  description: "The current ability to deliver messages to an email address."
  data:
  - name: "Deliverable"
  - name: "Risky"
  - name: "Undeliverable"
  - name: "Unknown"
- name: "PhoneType"
  description: "The classification of a phone number for a contact."
  data:
  - name: "Mobile"
  - name: "Work"
  - name: "Home"
  - name: "Fax"
  - name: "VoIP"
  - name: "Other"
- name: "SocialNetwork"
  description: "Supported social networks for social profile management."
  data:
  - name: "LinkedIn"
  - name: "X"
  - name: "Facebook"
  - name: "Instagram"
  - name: "GitHub"
  - name: "YouTube"
  - name: "Other"
- name: "MessagingPlatform"
  description: "Supported messaging platforms and applications."
  data:
  - name: "SMS"
  - name: "WhatsApp"
  - name: "Telegram"
  - name: "WeChat"
  - name: "Signal"
  - name: "Messenger"
  - name: "Other"
- name: "AddressType"
  description: "Intended usage category for a postal address."
  data:
  - name: "Home"
  - name: "Work"
  - name: "Billing"
  - name: "Shipping"
  - name: "Other"
- name: "AddressValidationStatus"
  description: "The validation outcome for a postal address."
  data:
  - name: "NotValidated"
  - name: "Valid"
  - name: "Corrected"
  - name: "Invalid"
  - name: "Ambiguous"
- name: "ConsentStatus"
  description: "The current consent state for contacting an individual."
  data:
  - name: "Granted"
  - name: "Denied"
  - name: "Revoked"
  - name: "Unknown"
- name: "ConsentSource"
  description: "Where or how a contact’s permission decision was obtained."
  data:
  - name: "WebForm"
  - name: "PaperForm"
  - name: "Verbal"
  - name: "EmailConfirmation"
  - name: "SMSConfirmation"
  - name: "SystemImport"
  - name: "API"
- name: "ContactChannelType"
  description: "The communication channel category referenced by permissions and interactions."
  data:
  - name: "Email"
  - name: "Phone"
  - name: "SMS"
  - name: "MessagingApp"
  - name: "Social"
  - name: "PostalMail"
- name: "ContactPurpose"
  description: "The purpose for which communications are intended."
  data:
  - name: "Transactional"
  - name: "Service"
  - name: "Marketing"
  - name: "Research"
  - name: "Legal"
- name: "OwnerType"
  description: "The type of entity that owns or manages contact records."
  data:
  - name: "User"
  - name: "Team"
  - name: "Queue"
- name: "ContactListType"
  description: "The method by which membership of a contact list is maintained."
  data:
  - name: "Static"
  - name: "Smart"
- name: "ListVisibility"
  description: "The visibility and sharing scope for a contact list."
  data:
  - name: "Private"
  - name: "Team"
  - name: "Organization"
- name: "NoteType"
  description: "The thematic category of a contact note."
  data:
  - name: "General"
  - name: "CallSummary"
  - name: "MeetingSummary"
  - name: "System"
  - name: "Other"
- name: "NoteVisibility"
  description: "Visibility constraints applied to a note’s content."
  data:
  - name: "Private"
  - name: "Internal"
  - name: "Public"
- name: "SourceType"
  description: "The origination mode through which a contact was created or updated."
  data:
  - name: "ManualEntry"
  - name: "Import"
  - name: "WebForm"
  - name: "Referral"
  - name: "Event"
  - name: "API"
  - name: "Enrichment"
- name: "MergeStatus"
  description: "The lifecycle state of a contact merge process."
  data:
  - name: "Proposed"
  - name: "Approved"
  - name: "Applied"
  - name: "Rejected"
- name: "InteractionType"
  description: "The format of an interaction with a contact."
  data:
  - name: "Call"
  - name: "Email"
  - name: "SMS"
  - name: "Meeting"
  - name: "Message"
  - name: "PostalMail"
- name: "InteractionOutcome"
  description: "The outcome recorded for a specific interaction."
  data:
  - name: "Completed"
  - name: "NoAnswer"
  - name: "Bounced"
  - name: "Failed"
  - name: "Rescheduled"
  - name: "Deferred"
- name: "LifecycleStage"
  description: "The relationship stage assigned to a contact over time."
  data:
  - name: "Lead"
  - name: "Prospect"
  - name: "Customer"
  - name: "Advocate"
  - name: "Former"
valueObjects:
- name: "EmailAddress"
  description: "A syntactically valid email address string, optionally normalized\
    \ to lowercase."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "A phone number captured in human-readable form, optionally normalized\
    \ to E.164."
  data:
  - name: "value"
    type: "String"
  - name: "extension"
    type: "String"
- name: "PostalAddress"
  description: "A structured postal address suitable for mailing and geocoding."
  data:
  - name: "line1"
    type: "String"
  - name: "line2"
    type: "String"
  - name: "city"
    type: "String"
  - name: "region"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "PersonName"
  description: "Structured components of a personal name for display and matching."
  data:
  - name: "givenName"
    type: "String"
  - name: "middleName"
    type: "String"
  - name: "familyName"
    type: "String"
  - name: "honorificPrefix"
    type: "String"
  - name: "honorificSuffix"
    type: "String"
- name: "WebUrl"
  description: "A web URL string, typically including scheme, host, and path."
  data:
  - name: "value"
    type: "String"
