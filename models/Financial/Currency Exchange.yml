  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "currencyPair"
    type: "CurrencyPair"
    multiplicity: "ManyToOne"
  - name: "venue"
    type: "ExchangeVenue"
    multiplicity: "ManyToOne"
  - name: "quote"
    type: "RateQuote"
    multiplicity: "ManyToOne"
  - name: "executions"
    type: "TradeExecution"
    multiplicity: "OneToMany"
  - name: "complianceChecks"
    type: "ComplianceCheck"
    multiplicity: "OneToMany"
  - name: "hedges"
    type: "HedgeInstruction"
    multiplicity: "ManyToMany"
- name: "TradeExecution"
  description: "Completed or partial fill resulting from a trade order."
  data:
  - name: "executionReference"
    type: "String"
  - name: "executionType"
    type: "ExecutionType"
  - name: "executedRate"
    type: "Rate"
  - name: "executedNotional"
    type: "Money"
  - name: "tradeDate"
    type: "Date"
  - name: "valueDate"
    type: "Date"
  relations:
  - name: "order"
    type: "TradeOrder"
    multiplicity: "ManyToOne"
  - name: "currencyPair"
    type: "CurrencyPair"
    multiplicity: "ManyToOne"
  - name: "venue"
    type: "ExchangeVenue"
    multiplicity: "ManyToOne"
  - name: "settlementInstruction"
    type: "SettlementInstruction"
    multiplicity: "OneToOne"
  - name: "regulatoryReports"
    type: "RegulatoryReport"
    multiplicity: "ManyToMany"
  - name: "feeCharges"
    type: "FeeCharge"
    multiplicity: "OneToMany"
  - name: "complianceChecks"
    type: "ComplianceCheck"
    multiplicity: "OneToMany"
- name: "SettlementInstruction"
  description: "Post-trade directions for payment settlement of FX legs."
  data:
  - name: "instructionReference"
    type: "String"
  - name: "settlementType"
    type: "SettlementType"
  - name: "status"
    type: "SettlementStatus"
  - name: "valueDate"
    type: "Date"
  - name: "paymentMethod"
    type: "PaymentMethod"
  relations:
  - name: "execution"
    type: "TradeExecution"
    multiplicity: "OneToOne"
  - name: "paymentLegs"
    type: "PaymentLeg"
    multiplicity: "OneToMany"
- name: "PaymentLeg"
  description: "Individual currency payment leg comprising amount, direction, and\
    \ beneficiary details."
  data:
  - name: "direction"
    type: "PaymentDirection"
  - name: "amount"
    type: "Money"
  - name: "beneficiaryName"
    type: "String"
  - name: "bankReference"
    type: "String"
  relations:
  - name: "settlementInstruction"
    type: "SettlementInstruction"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "feeCharges"
    type: "FeeCharge"
    multiplicity: "OneToMany"
- name: "FeeSchedule"
  description: "Commercial terms defining how fees are calculated for FX activity."
  data:
  - name: "name"
    type: "String"
  - name: "feeType"
    type: "FeeType"
  - name: "basis"
    type: "FeeBasis"
  - name: "value"
    type: "Decimal"
  - name: "minimumCharge"
    type: "Money"
  relations:
  - name: "venue"
    type: "ExchangeVenue"
    multiplicity: "ManyToOne"
  - name: "counterparties"
    type: "Counterparty"
    multiplicity: "ManyToMany"
  - name: "feeCharges"
    type: "FeeCharge"
    multiplicity: "OneToMany"
- name: "FeeCharge"
  description: "Concrete fee applied to a payment leg or execution."
  data:
  - name: "description"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "feeType"
    type: "FeeType"
  relations:
  - name: "execution"
    type: "TradeExecution"
    multiplicity: "ManyToOne"
  - name: "paymentLeg"
    type: "PaymentLeg"
    multiplicity: "ManyToOne"
  - name: "schedule"
    type: "FeeSchedule"
    multiplicity: "ManyToOne"
- name: "Exposure"
  description: "Aggregated net currency amount indicating directional FX risk."
  data:
  - name: "currency"
    type: "String"
  - name: "netNotional"
    type: "Decimal"
  - name: "windowDays"
    type: "Integer"
  - name: "hedgingRequired"
    type: "Boolean"
  relations:
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "hedges"
    type: "HedgeInstruction"
    multiplicity: "OneToMany"
- name: "HedgeInstruction"
  description: "Directive to offset FX exposure using specified hedge methods."
  data:
  - name: "instructionNumber"
    type: "String"
  - name: "method"
    type: "HedgingMethod"
  - name: "targetRate"
    type: "Rate"
  - name: "notional"
    type: "Money"
  - name: "status"
    type: "HedgeStatus"
  relations:
  - name: "exposure"
    type: "Exposure"
    multiplicity: "ManyToOne"
  - name: "orders"
    type: "TradeOrder"
    multiplicity: "ManyToMany"
- name: "HolidayCalendar"
  description: "Calendar of non-business days used for FX settlement and pricing."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "holidays"
    type: "Holiday"
    multiplicity: "OneToMany"
- name: "Holiday"
  description: "Non-business day entry within a holiday calendar."
