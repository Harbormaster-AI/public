  - name: "quoteRequest"
    type: "QuoteRequest"
    multiplicity: "ManyToOne"
  - name: "currencyPair"
    type: "CurrencyPair"
    multiplicity: "ManyToOne"
  - name: "rateSource"
    type: "RateSource"
    multiplicity: "ManyToOne"
- name: "TradeOrder"
  description: "Instruction to execute an FX trade with specified terms and constraints."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "side"
    type: "TradeSide"
  - name: "orderType"
    type: "OrderType"
  - name: "requestedRate"
    type: "Rate"
  - name: "notional"
    type: "Money"
  - name: "timeInForce"
    type: "TimeInForce"
  - name: "status"
    type: "OrderStatus"
  - name: "creationTimestamp"
    type: "String"
