    type: "String"
  - name: "available"
    type: "Decimal"
  - name: "onHold"
    type: "Decimal"
  - name: "lastUpdated"
    type: "Date"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "QuoteRequest"
  description: "Request for FX pricing for a specified notional and settlement profile."
  data:
