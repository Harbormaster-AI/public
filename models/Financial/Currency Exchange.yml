    type: "String"
  - name: "accountNumber"
    type: "String"
  - name: "accountType"
    type: "AccountType"
  - name: "currency"
    type: "String"
  - name: "bankName"
    type: "String"
  - name: "iban"
    type: "String"
  - name: "swiftBic"
    type: "String"
  relations:
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "cashBalances"
    type: "CashBalance"
    multiplicity: "OneToMany"
  - name: "paymentLegs"
    type: "PaymentLeg"
    multiplicity: "OneToMany"
- name: "CashBalance"
