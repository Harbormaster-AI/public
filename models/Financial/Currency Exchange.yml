    type: "Rate"
  - name: "administeredBy"
    type: "String"
  relations:
  - name: "currencyPair"
    type: "CurrencyPair"
    multiplicity: "ManyToOne"
  - name: "rateSource"
    type: "RateSource"
    multiplicity: "ManyToOne"
- name: "TradingSession"
  description: "Dated trading window defining venue operating hours and state."
  data:
  - name: "sessionDate"
