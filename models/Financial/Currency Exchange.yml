    type: "String"
  - name: "counterpartyType"
    type: "CounterpartyType"
  - name: "domicileCountry"
    type: "String"
  - name: "lei"
    type: "LEI"
  - name: "kycStatus"
    type: "KycStatus"
  relations:
  - name: "kycProfile"
    type: "KYCProfile"
    multiplicity: "OneToOne"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "orders"
    type: "TradeOrder"
    multiplicity: "OneToMany"
  - name: "exposures"
    type: "Exposure"
    multiplicity: "OneToMany"
  - name: "feeSchedules"
    type: "FeeSchedule"
    multiplicity: "ManyToMany"
- name: "KYCProfile"
  description: "Compliance profile containing due diligence status and risk assessment."
