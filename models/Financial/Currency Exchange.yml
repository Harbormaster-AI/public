    type: "String"
  - name: "side"
    type: "TradeSide"
  - name: "notional"
    type: "Money"
  - name: "settlementDate"
    type: "Date"
  - name: "tenor"
    type: "Tenor"
  - name: "timeInForce"
    type: "TimeInForce"
  - name: "status"
    type: "QuoteRequestStatus"
  - name: "createdAt"
    type: "String"
  relations:
  - name: "currencyPair"
    type: "CurrencyPair"
    multiplicity: "ManyToOne"
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "venue"
    type: "ExchangeVenue"
    multiplicity: "ManyToOne"
  - name: "quotes"
    type: "RateQuote"
    multiplicity: "OneToMany"
- name: "RateQuote"
