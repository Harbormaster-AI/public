  relations:
  - name: "venue"
    type: "ExchangeVenue"
    multiplicity: "ManyToOne"
  - name: "rateSource"
    type: "RateSource"
    multiplicity: "ManyToOne"
- name: "ForwardCurve"
  description: "Term structure of forward FX points and rates for a currency pair."
  data:
  - name: "createdAt"
    type: "String"
  - name: "dayCountConvention"
    type: "DayCountConvention"
  - name: "baseCurrency"
    type: "String"
  - name: "quoteCurrency"
    type: "String"
  relations:
  - name: "points"
    type: "SwapPoint"
    multiplicity: "OneToMany"
  - name: "rateSource"
    type: "RateSource"
    multiplicity: "ManyToOne"
  - name: "currencyPair"
    type: "CurrencyPair"
    multiplicity: "ManyToOne"
