    type: "String"
  - name: "sourceType"
    type: "RateSourceType"
  - name: "reliabilityScore"
    type: "Integer"
  relations:
  - name: "venue"
    type: "ExchangeVenue"
    multiplicity: "ManyToOne"
  - name: "marketDataFeeds"
    type: "MarketDataFeed"
    multiplicity: "OneToMany"
  - name: "exchangeRates"
    type: "ExchangeRate"
    multiplicity: "OneToMany"
  - name: "forwardCurves"
    type: "ForwardCurve"
    multiplicity: "OneToMany"
  - name: "fixings"
    type: "Fixing"
    multiplicity: "OneToMany"
- name: "MarketDataFeed"
  description: "Delivery channel providing streaming or batch FX market data."
  data:
  - name: "name"
    type: "String"
  - name: "deliveryProtocol"
    type: "String"
  - name: "isRealTime"
    type: "Boolean"
  relations:
  - name: "rateSource"
    type: "RateSource"
    multiplicity: "ManyToOne"
- name: "CurrencyPair"
  description: "Tradable currency instrument composed of a base and quote currency."
  data:
  - name: "baseCurrency"
    type: "String"
  - name: "quoteCurrency"
    type: "String"
  - name: "symbol"
    type: "String"
  - name: "pipPrecision"
    type: "Integer"
  relations:
  - name: "marketRates"
    type: "ExchangeRate"
    multiplicity: "OneToMany"
  - name: "quotes"
    type: "RateQuote"
    multiplicity: "OneToMany"
  - name: "orders"
    type: "TradeOrder"
    multiplicity: "OneToMany"
  - name: "forwardCurves"
    type: "ForwardCurve"
    multiplicity: "OneToMany"
  - name: "fixings"
    type: "Fixing"
    multiplicity: "OneToMany"
- name: "ExchangeRate"
  description: "Time-stamped FX rate observation with associated type and source."
  data:
  - name: "rate"
    type: "Rate"
  - name: "rateType"
    type: "RateType"
  - name: "asOfDate"
    type: "Date"
  - name: "asOfTime"
    type: "String"
