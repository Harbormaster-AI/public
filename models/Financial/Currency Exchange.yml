---
metadata:
  name: "Currency Exchange Capabilities Model"
  description: "Canonical capability model for foreign exchange pricing, quoting,\
    \ trading, settlement, fees, risk, and reporting."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Financial"
  type: "Capability"
  domain: "Currency Exchange"
entities:
- name: "ExchangeVenue"
  description: "Electronic platform or OTC venue facilitating currency exchange trading\
    \ and price discovery."
  data:
  - name: "name"
    type: "String"
  - name: "venueCode"
    type: "String"
  - name: "jurisdiction"
    type: "String"
  - name: "marketVenue"
    type: "MarketVenue"
  relations:
  - name: "rateSources"
    type: "RateSource"
    multiplicity: "OneToMany"
  - name: "tradingSessions"
    type: "TradingSession"
    multiplicity: "OneToMany"
  - name: "feeSchedules"
    type: "FeeSchedule"
    multiplicity: "OneToMany"
  - name: "orders"
    type: "TradeOrder"
    multiplicity: "OneToMany"
  - name: "executions"
    type: "TradeExecution"
    multiplicity: "OneToMany"
  - name: "businessDayRules"
    type: "BusinessDayRule"
    multiplicity: "ManyToMany"
- name: "RateSource"
  description: "Origin of FX pricing information such as banks, ECNs, aggregators,\
