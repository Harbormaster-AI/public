---
metadata:
  name: "Revenue Recognition"
  description: "Capabilities model for ASC 606 / IFRS 15 compliant revenue recognition\
    \ across contracts, performance obligations, allocations, scheduling, events,\
    \ postings, and disclosures."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Financial"
  type: "Capability"
  domain: "Revenue Recognition"
entities:
- name: "RevenueContract"
  description: "Commercial agreement with a customer governing consideration and performance\
    \ obligations subject to revenue recognition."
  data:
  - name: "contractNumber"
    type: "String"
  - name: "contractName"
    type: "String"
  - name: "contractDate"
    type: "Date"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "currency"
    type: "String"
  - name: "transactionPrice"
    type: "Money"
  - name: "status"
    type: "RevenueContractStatus"
  relations:
  - name: "customer"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "performanceObligations"
    type: "PerformanceObligation"
    multiplicity: "OneToMany"
  - name: "contractModifications"
    type: "ContractModification"
    multiplicity: "OneToMany"
  - name: "variableConsiderations"
    type: "VariableConsideration"
    multiplicity: "OneToMany"
  - name: "allocations"
    type: "RevenueAllocation"
    multiplicity: "OneToMany"
  - name: "holds"
    type: "RevenueHold"
    multiplicity: "OneToMany"
  - name: "waterfalls"
    type: "RevenueWaterfall"
    multiplicity: "OneToMany"
  - name: "disclosureGroupings"
    type: "DisclosureGrouping"
    multiplicity: "ManyToMany"
  - name: "costsToObtain"
    type: "CostToObtainAsset"
    multiplicity: "OneToMany"
- name: "CustomerAccount"
  description: "Customer master used for revenue recognition, disclosures, and contract\
    \ linkage."
  data:
  - name: "name"
    type: "String"
  - name: "customerCategory"
    type: "CustomerCategory"
  - name: "billingAddress"
    type: "Address"
  relations:
  - name: "revenueContracts"
    type: "RevenueContract"
    multiplicity: "OneToMany"
- name: "PerformanceObligation"
  description: "Distinct promise to transfer goods or services to a customer under\
    \ a contract."
  data:
  - name: "obligationCode"
    type: "String"
  - name: "obligationName"
    type: "String"
  - name: "description"
    type: "String"
  - name: "recognitionMethod"
    type: "RecognitionMethod"
  - name: "measureOfProgress"
    type: "MeasureOfProgressMethod"
  - name: "standaloneSellingPrice"
    type: "Money"
  - name: "quantity"
    type: "Decimal"
  - name: "unitOfMeasure"
    type: "String"
  - name: "status"
    type: "PerformanceObligationStatus"
  relations:
  - name: "revenueContract"
    type: "RevenueContract"
    multiplicity: "ManyToOne"
  - name: "allocations"
    type: "RevenueAllocation"
    multiplicity: "OneToMany"
  - name: "revenueSchedules"
    type: "RevenueSchedule"
    multiplicity: "OneToMany"
  - name: "events"
    type: "RevenueEvent"
    multiplicity: "OneToMany"
  - name: "recognitionEntries"
    type: "RevenueRecognitionEntry"
    multiplicity: "OneToMany"
  - name: "template"
    type: "ObligationTemplate"
    multiplicity: "ManyToOne"
  - name: "holds"
    type: "RevenueHold"
    multiplicity: "OneToMany"
  - name: "disclosureGroupings"
    type: "DisclosureGrouping"
    multiplicity: "ManyToMany"
- name: "RevenueAllocation"
  description: "Allocation of transaction price to performance obligations using applicable\
    \ methods and policies."
  data:
  - name: "allocationDate"
    type: "Date"
  - name: "allocationMethod"
    type: "AllocationMethod"
  - name: "allocatedAmount"
    type: "Money"
  - name: "notes"
    type: "String"
  relations:
  - name: "revenueContract"
    type: "RevenueContract"
    multiplicity: "ManyToOne"
  - name: "performanceObligation"
    type: "PerformanceObligation"
    multiplicity: "ManyToOne"
  - name: "contractModification"
    type: "ContractModification"
    multiplicity: "ManyToOne"
- name: "ContractModification"
  description: "A change in scope or price of a RevenueContract that may trigger reallocation\
    \ or new obligations."
  data:
  - name: "modificationNumber"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "modificationType"
    type: "ContractModificationType"
  - name: "status"
    type: "ModificationStatus"
  - name: "description"
    type: "String"
  - name: "priceAdjustment"
    type: "Money"
  relations:
  - name: "revenueContract"
    type: "RevenueContract"
    multiplicity: "ManyToOne"
  - name: "allocations"
    type: "RevenueAllocation"
    multiplicity: "OneToMany"
  - name: "affectedObligations"
    type: "PerformanceObligation"
    multiplicity: "ManyToMany"
- name: "RecognitionPolicy"
  description: "Policy that governs timing, scheduling, rounding, and allocation behavior\
    \ for recognition."
  data:
  - name: "policyName"
    type: "String"
  - name: "applicableMethod"
    type: "RecognitionMethod"
  - name: "scheduleStrategy"
    type: "ScheduleStrategy"
  - name: "roundingRule"
    type: "RoundingRule"
  - name: "description"
    type: "String"
  relations:
  - name: "obligationTemplates"
    type: "ObligationTemplate"
    multiplicity: "OneToMany"
  - name: "performanceObligations"
    type: "PerformanceObligation"
    multiplicity: "OneToMany"
- name: "ObligationTemplate"
  description: "Template defining default recognition behavior for a type of promised\
    \ good or service."
  data:
  - name: "templateCode"
    type: "String"
  - name: "templateName"
    type: "String"
  - name: "defaultRecognitionMethod"
    type: "RecognitionMethod"
  - name: "defaultMeasureOfProgress"
    type: "MeasureOfProgressMethod"
  - name: "defaultTermMonths"
    type: "Integer"
  - name: "description"
    type: "String"
  relations:
  - name: "recognitionPolicy"
    type: "RecognitionPolicy"
    multiplicity: "ManyToOne"
  - name: "sspPolicies"
    type: "StandaloneSellingPricePolicy"
    multiplicity: "OneToMany"
- name: "StandaloneSellingPricePolicy"
  description: "Methodology and observed values used to determine or estimate standalone\
    \ selling price."
  data:
  - name: "policyName"
    type: "String"
  - name: "sspMethod"
    type: "SSPMethod"
  - name: "effectiveStartDate"
    type: "Date"
  - name: "effectiveEndDate"
    type: "Date"
  - name: "currency"
    type: "String"
  - name: "observedPrice"
    type: "Money"
  relations:
  - name: "obligationTemplate"
    type: "ObligationTemplate"
    multiplicity: "ManyToOne"
- name: "VariableConsideration"
  description: "Estimate and constraint of amounts subject to variability such as\
    \ rebates, discounts, and usage fees."
  data:
  - name: "description"
    type: "String"
  - name: "considerationType"
    type: "VariableConsiderationType"
  - name: "constraintMethod"
    type: "ConstraintMethod"
  - name: "estimateAmount"
    type: "Money"
  - name: "likelihoodPercent"
    type: "Decimal"
  - name: "ceilingAmount"
    type: "Money"
  - name: "floorAmount"
    type: "Money"
  - name: "assessmentDate"
    type: "Date"
  relations:
  - name: "revenueContract"
    type: "RevenueContract"
    multiplicity: "ManyToOne"
  - name: "performanceObligation"
    type: "PerformanceObligation"
    multiplicity: "ManyToOne"
- name: "RevenueSchedule"
  description: "Plan of revenue recognition over time or events for a specific performance\
    \ obligation."
  data:
  - name: "scheduleNumber"
    type: "String"
  - name: "scheduleType"
    type: "ScheduleType"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "ScheduleStatus"
  - name: "totalRecognizable"
    type: "Money"
  - name: "deferredBalance"
    type: "Money"
  relations:
  - name: "performanceObligation"
    type: "PerformanceObligation"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "RevenueScheduleLine"
    multiplicity: "OneToMany"
  - name: "recognitionPolicy"
    type: "RecognitionPolicy"
    multiplicity: "ManyToOne"
- name: "RevenueScheduleLine"
  description: "Periodic revenue amounts planned and recognized within a revenue schedule."
  data:
  - name: "period"
    type: "AccountingPeriod"
  - name: "plannedAmount"
    type: "Money"
  - name: "recognizedAmount"
    type: "Money"
  - name: "status"
    type: "RecognitionStatus"
  relations:
  - name: "schedule"
    type: "RevenueSchedule"
    multiplicity: "ManyToOne"
  - name: "recognitionEntries"
    type: "RevenueRecognitionEntry"
    multiplicity: "OneToMany"
  - name: "fiscalPeriod"
    type: "FiscalPeriod"
    multiplicity: "ManyToOne"
- name: "RevenueEvent"
  description: "Triggering business event that satisfies or progresses a performance\
    \ obligation and drives recognition."
  data:
  - name: "eventNumber"
    type: "String"
  - name: "eventType"
    type: "RevenueEventType"
  - name: "eventDate"
    type: "Date"
  - name: "quantityDelivered"
    type: "Decimal"
  - name: "eventAmount"
    type: "Money"
  - name: "reference"
    type: "String"
  relations:
  - name: "performanceObligation"
    type: "PerformanceObligation"
    multiplicity: "ManyToOne"
  - name: "recognitionEntries"
    type: "RevenueRecognitionEntry"
    multiplicity: "OneToMany"
  - name: "relatedContract"
    type: "RevenueContract"
    multiplicity: "ManyToOne"
- name: "RevenueRecognitionEntry"
  description: "Recognized revenue transaction ready for journal posting to the general\
    \ ledger."
  data:
  - name: "entryNumber"
    type: "String"
  - name: "recognitionDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "JournalStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "performanceObligation"
    type: "PerformanceObligation"
    multiplicity: "ManyToOne"
  - name: "revenueEvent"
    type: "RevenueEvent"
    multiplicity: "ManyToOne"
  - name: "scheduleLine"
    type: "RevenueScheduleLine"
    multiplicity: "ManyToOne"
  - name: "accountingEntries"
    type: "AccountingEntry"
    multiplicity: "OneToMany"
  - name: "fiscalPeriod"
    type: "FiscalPeriod"
    multiplicity: "ManyToOne"
- name: "AccountingEntry"
  description: "Double-entry journal line that debits or credits revenue and related\
    \ accounts."
  data:
  - name: "entryType"
    type: "AccountingEntryType"
  - name: "account"
    type: "GLAccountReference"
  - name: "amount"
    type: "Money"
  - name: "postingDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "recognitionEntry"
    type: "RevenueRecognitionEntry"
    multiplicity: "ManyToOne"
  - name: "fiscalPeriod"
    type: "FiscalPeriod"
    multiplicity: "ManyToOne"
- name: "FiscalPeriod"
  description: "Accounting period used to control posting windows and reporting aggregation."
  data:
  - name: "periodName"
    type: "String"
  - name: "fiscalYear"
    type: "Integer"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "FiscalPeriodStatus"
  relations:
  - name: "recognitionEntries"
    type: "RevenueRecognitionEntry"
    multiplicity: "OneToMany"
  - name: "accountingEntries"
    type: "AccountingEntry"
    multiplicity: "OneToMany"
  - name: "amortizationLines"
    type: "AmortizationLine"
    multiplicity: "OneToMany"
- name: "ReturnReserve"
  description: "Reserve for expected returns that reduces recognized revenue and establishes\
    \ a refund liability."
  data:
  - name: "reserveNumber"
    type: "String"
  - name: "reserveMethod"
    type: "ReserveMethod"
  - name: "expectedReturnRatePercent"
    type: "Decimal"
  - name: "reserveAmount"
    type: "Money"
  - name: "reassessmentDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "revenueContract"
    type: "RevenueContract"
    multiplicity: "ManyToOne"
  - name: "performanceObligation"
    type: "PerformanceObligation"
    multiplicity: "ManyToOne"
- name: "RevenueHold"
  description: "Administrative or compliance hold that temporarily prevents revenue\
    \ recognition or posting."
  data:
  - name: "holdCode"
    type: "String"
  - name: "reason"
    type: "String"
  - name: "holdStatus"
    type: "HoldStatus"
  - name: "createdDate"
    type: "Date"
  - name: "releasedDate"
    type: "Date"
  relations:
  - name: "revenueContract"
    type: "RevenueContract"
    multiplicity: "ManyToOne"
  - name: "performanceObligation"
    type: "PerformanceObligation"
    multiplicity: "ManyToOne"
- name: "RevenueWaterfall"
  description: "Snapshot view of recognized, deferred, and forecasted revenue balances\
    \ for analysis and disclosure."
  data:
  - name: "snapshotDate"
    type: "Date"
  - name: "totalRecognizedToDate"
    type: "Money"
  - name: "totalDeferred"
    type: "Money"
  - name: "forecastNext12Months"
    type: "Money"
  relations:
  - name: "revenueContract"
    type: "RevenueContract"
    multiplicity: "ManyToOne"
  - name: "performanceObligation"
    type: "PerformanceObligation"
    multiplicity: "ManyToOne"
- name: "CostToObtainAsset"
  description: "Capitalized incremental costs of obtaining a contract to be amortized\
    \ over the benefit period."
  data:
  - name: "assetNumber"
    type: "String"
  - name: "capitalizationDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "amortizationTermMonths"
    type: "Integer"
  - name: "amortizationMethod"
    type: "AmortizationMethod"
  - name: "status"
    type: "AssetStatus"
  - name: "description"
    type: "String"
  relations:
  - name: "revenueContract"
    type: "RevenueContract"
    multiplicity: "ManyToOne"
  - name: "amortizationSchedules"
    type: "AmortizationSchedule"
    multiplicity: "OneToMany"
- name: "AmortizationSchedule"
  description: "Plan for expensing the CostToObtainAsset over the expected benefit\
    \ period."
  data:
  - name: "scheduleNumber"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "ScheduleStatus"
  - name: "totalAmortizable"
    type: "Money"
  relations:
  - name: "costToObtainAsset"
    type: "CostToObtainAsset"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "AmortizationLine"
    multiplicity: "OneToMany"
- name: "AmortizationLine"
  description: "Periodic expense amounts for capitalized contract acquisition costs."
  data:
  - name: "period"
    type: "AccountingPeriod"
  - name: "plannedAmount"
    type: "Money"
  - name: "postedAmount"
    type: "Money"
  - name: "status"
    type: "RecognitionStatus"
  relations:
  - name: "amortizationSchedule"
    type: "AmortizationSchedule"
    multiplicity: "ManyToOne"
  - name: "accountingEntries"
    type: "AccountingEntry"
    multiplicity: "OneToMany"
  - name: "fiscalPeriod"
    type: "FiscalPeriod"
    multiplicity: "ManyToOne"
- name: "DisclosureGrouping"
  description: "Grouping construct for revenue disclosure notes and presentation requirements."
  data:
  - name: "groupingName"
    type: "String"
  - name: "disclosureCategory"
    type: "DisclosureCategory"
  - name: "principalAgentAssessment"
    type: "PrincipalAgentAssessment"
  - name: "distinctAssessment"
    type: "DistinctAssessment"
  - name: "description"
    type: "String"
  relations:
  - name: "performanceObligations"
    type: "PerformanceObligation"
    multiplicity: "OneToMany"
  - name: "revenueContracts"
    type: "RevenueContract"
    multiplicity: "OneToMany"
- name: "RecognitionAudit"
  description: "Audit trail of policy decisions, allocations, and postings for revenue\
    \ recognition transparency."
  data:
  - name: "auditNumber"
    type: "String"
  - name: "action"
    type: "AuditAction"
  - name: "actor"
    type: "String"
  - name: "actionDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "revenueContract"
    type: "RevenueContract"
    multiplicity: "ManyToOne"
  - name: "performanceObligation"
    type: "PerformanceObligation"
    multiplicity: "ManyToOne"
  - name: "recognitionEntry"
    type: "RevenueRecognitionEntry"
    multiplicity: "ManyToOne"
  - name: "schedule"
    type: "RevenueSchedule"
    multiplicity: "ManyToOne"
