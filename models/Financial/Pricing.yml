---
metadata:
  name: "Pricing"
  description: "Canonical HCIDL capabilities model for enterprise pricing, covering\
    \ price catalogs, rules, promotions, contracts, rounding, and calculation artifacts."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Financial"
  type: "Capability"
  domain: "Pricing"
entities:
- name: "Product"
  description: "Sellable good or service that is priced, bundled, and transacted."
  data:
  - name: "name"
    type: "String"
  - name: "sku"
    type: "String"
  - name: "unitOfMeasure"
    type: "String"
  - name: "productType"
    type: "ProductType"
  relations:
  - name: "categories"
    type: "ProductCategory"
    multiplicity: "ManyToMany"
  - name: "priceEntries"
    type: "PriceListEntry"
    multiplicity: "OneToMany"
  - name: "bundles"
    type: "ProductBundle"
    multiplicity: "OneToMany"
  - name: "costBases"
    type: "CostBasis"
    multiplicity: "OneToMany"
  - name: "competitorPrices"
    type: "CompetitorPrice"
    multiplicity: "OneToMany"
- name: "ProductCategory"
  description: "Hierarchical classification of products that can influence pricing."
  data:
  - name: "name"
    type: "String"
  - name: "path"
    type: "String"
  relations:
  - name: "products"
    type: "Product"
    multiplicity: "ManyToMany"
- name: "PriceBook"
  description: "Logical container for price lists by business line, region, or brand."
  data:
  - name: "name"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "effectivePeriod"
    type: "DateRange"
  - name: "status"
    type: "PriceBookStatus"
  relations:
  - name: "priceLists"
    type: "PriceList"
    multiplicity: "OneToMany"
  - name: "markets"
    type: "Market"
    multiplicity: "ManyToMany"
- name: "Market"
  description: "Geographic or economic market in which pricing is applied."
  data:
  - name: "name"
    type: "String"
  - name: "country"
    type: "String"
  - name: "region"
    type: "String"
  - name: "currency"
    type: "String"
  - name: "taxInclusion"
    type: "TaxInclusionType"
  relations:
  - name: "priceBooks"
    type: "PriceBook"
    multiplicity: "ManyToMany"
  - name: "channels"
    type: "SalesChannel"
    multiplicity: "ManyToMany"
  - name: "competitorPrices"
    type: "CompetitorPrice"
    multiplicity: "OneToMany"
- name: "SalesChannel"
  description: "Route to market where prices are published or transacted."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  relations:
  - name: "markets"
    type: "Market"
    multiplicity: "ManyToMany"
  - name: "priceLists"
    type: "PriceList"
    multiplicity: "ManyToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
- name: "CustomerSegment"
  description: "Grouping of customers with shared attributes for pricing eligibility."
  data:
  - name: "name"
    type: "String"
  - name: "segmentCode"
    type: "String"
  - name: "priority"
    type: "Integer"
  relations:
  - name: "priceLists"
    type: "PriceList"
    multiplicity: "ManyToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
  - name: "contractPrices"
    type: "ContractPrice"
    multiplicity: "OneToMany"
- name: "PriceList"
  description: "Collection of prices for products within a defined scope and currency."
  data:
  - name: "name"
    type: "String"
  - name: "currency"
    type: "String"
  - name: "validPeriod"
    type: "DateRange"
  - name: "status"
    type: "PriceListStatus"
  - name: "taxMode"
    type: "TaxMode"
  relations:
  - name: "priceBook"
    type: "PriceBook"
    multiplicity: "ManyToOne"
  - name: "entries"
    type: "PriceListEntry"
    multiplicity: "OneToMany"
  - name: "channels"
    type: "SalesChannel"
    multiplicity: "ManyToMany"
  - name: "market"
    type: "Market"
    multiplicity: "ManyToOne"
  - name: "customerSegments"
    type: "CustomerSegment"
    multiplicity: "ManyToMany"
  - name: "roundingPolicy"
    type: "RoundingPolicy"
    multiplicity: "ManyToOne"
- name: "PriceListEntry"
  description: "Pricing for a specific product on a given price list."
  data:
  - name: "priceType"
    type: "PriceType"
  - name: "unitOfMeasure"
    type: "String"
  - name: "basePrice"
    type: "Money"
  - name: "minOrderQuantity"
    type: "Integer"
  - name: "status"
    type: "PriceEntryStatus"
  relations:
  - name: "priceList"
    type: "PriceList"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "tiers"
    type: "PriceTier"
    multiplicity: "OneToMany"
  - name: "strategies"
    type: "PricingStrategy"
    multiplicity: "ManyToMany"
  - name: "rules"
    type: "PricingRule"
    multiplicity: "OneToMany"
- name: "PriceTier"
  description: "Quantity-based tier that modifies the unit price for a price list\
    \ entry."
  data:
  - name: "minQuantity"
    type: "Integer"
  - name: "maxQuantity"
    type: "Integer"
  - name: "unitPrice"
    type: "Money"
  relations:
  - name: "priceListEntry"
    type: "PriceListEntry"
    multiplicity: "ManyToOne"
- name: "ProductBundle"
  description: "Packaged group of products sold together with defined pricing behavior."
  data:
  - name: "name"
    type: "String"
  - name: "pricingMethod"
    type: "BundlePricingMethod"
  - name: "fixedBundlePrice"
    type: "Money"
  relations:
  - name: "parentProduct"
    type: "Product"
    multiplicity: "OneToOne"
  - name: "components"
    type: "BundleComponent"
    multiplicity: "OneToMany"
- name: "BundleComponent"
  description: "Component product and quantity within a bundle, with pricing treatment."
  data:
  - name: "quantity"
    type: "Decimal"
  - name: "included"
    type: "Boolean"
  - name: "discount"
    type: "Percentage"
  - name: "pricingTreatment"
    type: "BundleComponentPricing"
  relations:
  - name: "bundle"
    type: "ProductBundle"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
- name: "PricingStrategy"
  description: "High-level pricing approach and targets used to guide price setting."
  data:
  - name: "name"
    type: "String"
  - name: "strategyType"
    type: "PricingStrategyType"
  - name: "targetMargin"
    type: "Percentage"
  - name: "markupOverCost"
    type: "Percentage"
  relations:
  - name: "priceListEntries"
    type: "PriceListEntry"
    multiplicity: "ManyToMany"
  - name: "productCategories"
    type: "ProductCategory"
    multiplicity: "ManyToMany"
  - name: "markets"
    type: "Market"
    multiplicity: "ManyToMany"
- name: "RoundingPolicy"
  description: "Rules for rounding intermediate and final prices."
  data:
  - name: "precision"
    type: "Integer"
  - name: "roundingRule"
    type: "RoundingRule"
  - name: "threshold"
    type: "Decimal"
  relations:
  - name: "priceLists"
    type: "PriceList"
    multiplicity: "OneToMany"
- name: "PricingRule"
  description: "Conditional rule that applies adjustments to computed prices."
  data:
  - name: "name"
    type: "String"
  - name: "priority"
    type: "Integer"
  - name: "evaluationScope"
    type: "RuleScope"
  - name: "status"
    type: "RuleStatus"
  relations:
  - name: "priceListEntry"
    type: "PriceListEntry"
    multiplicity: "ManyToOne"
  - name: "conditions"
    type: "RuleCondition"
    multiplicity: "OneToMany"
  - name: "actions"
    type: "RuleAction"
    multiplicity: "OneToMany"
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
- name: "RuleCondition"
  description: "Logical predicate evaluated to determine rule applicability."
  data:
  - name: "attribute"
    type: "ConditionAttribute"
  - name: "operator_"
    type: "ComparisonOperator"
  - name: "value"
    type: "String"
  - name: "matchType"
    type: "MatchType"
  relations:
  - name: "rule"
    type: "PricingRule"
    multiplicity: "ManyToOne"
- name: "RuleAction"
  description: "Adjustment executed when a pricing rule matches."
  data:
  - name: "method"
    type: "AdjustmentMethod"
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
  - name: "maxDiscount"
    type: "Percentage"
  - name: "targetComponent"
    type: "PriceComponentType"
  - name: "applicationMode"
    type: "ApplicationMode"
  relations:
  - name: "rule"
    type: "PricingRule"
    multiplicity: "ManyToOne"
- name: "Promotion"
  description: "Time-bound commercial offer with eligibility and pricing rules."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "period"
    type: "DateRange"
  - name: "status"
    type: "PromotionStatus"
  - name: "budget"
    type: "Money"
  relations:
  - name: "rules"
    type: "PricingRule"
    multiplicity: "OneToMany"
  - name: "channels"
    type: "SalesChannel"
    multiplicity: "ManyToMany"
  - name: "customerSegments"
    type: "CustomerSegment"
    multiplicity: "ManyToMany"
  - name: "markets"
    type: "Market"
    multiplicity: "ManyToMany"
- name: "ContractPrice"
  description: "Negotiated price terms for a defined customer segment, market, and\
    \ channel."
  data:
  - name: "reference"
    type: "String"
  - name: "validPeriod"
    type: "DateRange"
  - name: "unitPrice"
    type: "Money"
  - name: "floorPrice"
    type: "Money"
  - name: "ceilingPrice"
    type: "Money"
  - name: "approvalStatus"
    type: "ApprovalStatus"
  relations:
  - name: "customerSegment"
    type: "CustomerSegment"
    multiplicity: "ManyToOne"
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "market"
    type: "Market"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "SalesChannel"
    multiplicity: "ManyToOne"
  - name: "priceList"
    type: "PriceList"
    multiplicity: "ManyToOne"
- name: "PriceOverride"
  description: "Manual price adjustment proposed during quoting or ordering."
  data:
  - name: "reason"
    type: "String"
  - name: "requestedBy"
    type: "String"
  - name: "requestedAt"
    type: "Date"
  - name: "overrideAmount"
    type: "Money"
  - name: "overrideMethod"
    type: "AdjustmentMethod"
  - name: "approvalStatus"
    type: "ApprovalStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "priceCalculation"
    type: "PriceCalculation"
    multiplicity: "ManyToOne"
  - name: "approval"
    type: "PriceApproval"
    multiplicity: "OneToOne"
- name: "PriceApproval"
  description: "Governance record capturing approval decisions for overrides."
  data:
  - name: "approver"
    type: "String"
  - name: "decision"
    type: "ApprovalStatus"
  - name: "decisionDate"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "priceOverride"
    type: "PriceOverride"
    multiplicity: "OneToOne"
- name: "PriceCalculation"
  description: "Snapshot of the computed price for a product and quantity."
  data:
  - name: "calculationDate"
    type: "Date"
  - name: "quantity"
    type: "Decimal"
  - name: "finalUnitPrice"
    type: "Money"
  - name: "listUnitPrice"
    type: "Money"
  - name: "discountTotal"
    type: "Money"
  - name: "surchargeTotal"
    type: "Money"
  - name: "taxMode"
    type: "TaxMode"
  - name: "currency"
    type: "String"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "priceList"
    type: "PriceList"
    multiplicity: "ManyToOne"
  - name: "appliedRules"
    type: "PricingRule"
    multiplicity: "ManyToMany"
  - name: "breakdownItems"
    type: "PriceComponent"
    multiplicity: "OneToMany"
  - name: "market"
    type: "Market"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "SalesChannel"
    multiplicity: "ManyToOne"
- name: "PriceComponent"
  description: "Element of a price calculation such as base, discount, surcharge,\
    \ or fee."
  data:
  - name: "componentType"
    type: "PriceComponentType"
  - name: "description"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "sequence"
    type: "Integer"
  - name: "sign"
    type: "AdjustmentSign"
  relations:
  - name: "priceCalculation"
    type: "PriceCalculation"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "PricingRule"
    multiplicity: "ManyToOne"
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
- name: "RebateProgram"
  description: "Program that accrues rebates based on volume or revenue performance."
  data:
  - name: "name"
    type: "String"
  - name: "programType"
    type: "RebateProgramType"
  - name: "accrualMethod"
    type: "RebateAccrualMethod"
  - name: "validPeriod"
    type: "DateRange"
  - name: "payoutFrequency"
    type: "PayoutFrequency"
  relations:
  - name: "tiers"
    type: "RebateTier"
    multiplicity: "OneToMany"
  - name: "products"
    type: "Product"
    multiplicity: "ManyToMany"
  - name: "customerSegments"
    type: "CustomerSegment"
    multiplicity: "ManyToMany"
  - name: "markets"
    type: "Market"
    multiplicity: "ManyToMany"
  - name: "channels"
    type: "SalesChannel"
    multiplicity: "ManyToMany"
- name: "RebateTier"
  description: "Tier within a rebate program defining thresholds and payout rates."
  data:
  - name: "thresholdQuantity"
    type: "Integer"
  - name: "thresholdRevenue"
    type: "Money"
  - name: "rate"
    type: "Percentage"
  - name: "maximumPayout"
    type: "Money"
  relations:
  - name: "program"
    type: "RebateProgram"
    multiplicity: "ManyToOne"
- name: "CostBasis"
  description: "Cost information used to inform price setting and margins."
  data:
  - name: "costType"
    type: "CostType"
  - name: "amount"
    type: "Money"
  - name: "source"
    type: "String"
  - name: "validPeriod"
    type: "DateRange"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "market"
    type: "Market"
    multiplicity: "ManyToOne"
- name: "CompetitorPrice"
  description: "Observed competitor price for a comparable offer in a market and channel."
  data:
  - name: "competitorName"
    type: "String"
  - name: "observedPrice"
    type: "Money"
  - name: "observationDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "market"
    type: "Market"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "SalesChannel"
    multiplicity: "ManyToOne"
enums:
- name: "ProductType"
  description: "Types of sellable items supported by pricing."
  data:
  - name: "Good"
  - name: "Service"
  - name: "Subscription"
  - name: "Digital"
- name: "PriceBookStatus"
  description: "Lifecycle state of a price book."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Retired"
- name: "ChannelType"
  description: "Classification of sales channels where prices are used."
  data:
  - name: "Direct"
  - name: "Reseller"
  - name: "Marketplace"
  - name: "Online"
  - name: "Retail"
- name: "TaxInclusionType"
  description: "Indicates whether prices include taxes for a market."
  data:
  - name: "TaxExclusive"
  - name: "TaxInclusive"
- name: "PriceListStatus"
  description: "Lifecycle state of a price list."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Suspended"
  - name: "Archived"
- name: "TaxMode"
  description: "Treatment of tax in the calculated price."
  data:
  - name: "Exclusive"
  - name: "Inclusive"
- name: "PriceType"
  description: "Nature of the price represented by a list entry."
  data:
  - name: "Base"
  - name: "MSRP"
  - name: "Wholesale"
  - name: "Promotional"
- name: "PriceEntryStatus"
  description: "Availability of a specific price entry for use."
  data:
  - name: "Active"
  - name: "Inactive"
- name: "BundlePricingMethod"
  description: "Approach used to compute bundle pricing."
  data:
  - name: "FixedPrice"
  - name: "SumOfComponents"
  - name: "DynamicDiscount"
- name: "BundleComponentPricing"
  description: "How a component contributes to bundle price."
  data:
  - name: "IncludedInBundle"
  - name: "Prorated"
  - name: "Excluded"
- name: "PricingStrategyType"
  description: "Strategic method applied to set or guide prices."
  data:
  - name: "CostPlus"
  - name: "ValueBased"
  - name: "Competitive"
  - name: "Penetration"
  - name: "Skimming"
- name: "RoundingRule"
  description: "Rule used for rounding price calculations."
  data:
  - name: "RoundHalfUp"
  - name: "RoundHalfDown"
  - name: "RoundUp"
  - name: "RoundDown"
  - name: "BankersRounding"
- name: "RuleScope"
  description: "Scope at which a pricing rule is evaluated."
  data:
  - name: "LineItem"
  - name: "Order"
  - name: "CustomerSegment"
  - name: "Market"
- name: "RuleStatus"
  description: "Lifecycle state of a pricing rule."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Expired"
  - name: "Disabled"
- name: "ConditionAttribute"
  description: "Attribute available for rule condition evaluation."
  data:
  - name: "OrderQuantity"
  - name: "CustomerSegment"
  - name: "Market"
  - name: "Channel"
  - name: "ProductCategory"
  - name: "Date"
  - name: "PriceList"
- name: "ComparisonOperator"
  description: "Operators used to evaluate rule conditions."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "GreaterThan"
  - name: "GreaterOrEqual"
  - name: "LessThan"
  - name: "LessOrEqual"
  - name: "In"
  - name: "NotIn"
  - name: "Between"
  - name: "Contains"
- name: "AdjustmentMethod"
  description: "Method used to apply a price adjustment."
  data:
  - name: "AmountOff"
  - name: "PercentOff"
  - name: "SetPrice"
  - name: "Surcharge"
- name: "PriceComponentType"
  description: "Types of components that make up a calculated price."
  data:
  - name: "BasePrice"
  - name: "Discount"
  - name: "Surcharge"
  - name: "Fee"
  - name: "Shipping"
  - name: "Tax"
  - name: "Rounding"
  - name: "Adjustment"
  - name: "FloorAdjustment"
  - name: "CeilingAdjustment"
  - name: "RebateAccrual"
- name: "MatchType"
  description: "How multiple conditions within a rule are combined."
  data:
  - name: "All"
  - name: "Any"
- name: "ApplicationMode"
  description: "How an action interacts with other applicable actions."
  data:
  - name: "Additive"
  - name: "Exclusive"
  - name: "BestPrice"
  - name: "Stackable"
- name: "PromotionStatus"
  description: "Current state of a promotion."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "Paused"
  - name: "Ended"
- name: "ApprovalStatus"
  description: "Decision state for approvals and override requests."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
- name: "RebateProgramType"
  description: "Basis on which rebate eligibility is measured."
  data:
  - name: "Volume"
  - name: "Revenue"
  - name: "Growth"
  - name: "Mix"
- name: "RebateAccrualMethod"
  description: "Timing for accruing rebate amounts."
  data:
  - name: "PerInvoice"
  - name: "Periodic"
  - name: "OnAchievement"
- name: "PayoutFrequency"
  description: "Frequency with which rebates are paid."
  data:
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Annually"
  - name: "OnDemand"
- name: "CostType"
  description: "Type of cost used as a basis for pricing."
  data:
  - name: "StandardCost"
  - name: "AverageCost"
  - name: "LandedCost"
  - name: "ReplacementCost"
- name: "AdjustmentSign"
  description: "Direction of the price component's impact on the total."
  data:
  - name: "Credit"
  - name: "Debit"
valueObjects:
- name: "Money"
  description: "Monetary amount in a specific currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Percentage"
  description: "Proportion expressed as a decimal fraction of one."
  data:
  - name: "value"
    type: "Decimal"
- name: "DateRange"
  description: "Inclusive period over which something is valid."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
