---
metadata:
  name: "Accounts Receivable"
  description: "Capability model for managing customer receivables including invoicing,\
    \ payments, credits, collections, and aging."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Financial"
  type: "Capability"
  domain: "Accounts Receivable"
entities:
- name: "CustomerAccount"
  description: "Customer record used for billing, credit, and receivables management."
  data:
  - name: "name"
    type: "String"
  - name: "accountNumber"
    type: "String"
  - name: "accountStatus"
    type: "CustomerAccountStatus"
  - name: "creditLimit"
    type: "Money"
  - name: "creditHold"
    type: "Boolean"
  - name: "preferredCurrency"
    type: "String"
  - name: "billingAddress"
    type: "Address"
  relations:
  - name: "billingProfiles"
    type: "BillingProfile"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "creditMemos"
    type: "CreditMemo"
    multiplicity: "OneToMany"
  - name: "debitNotes"
    type: "DebitNote"
    multiplicity: "OneToMany"
  - name: "disputes"
    type: "Dispute"
    multiplicity: "OneToMany"
  - name: "dunningCases"
    type: "DunningCase"
    multiplicity: "OneToMany"
  - name: "agingSnapshots"
    type: "AgingSnapshot"
    multiplicity: "OneToMany"
- name: "BillingProfile"
  description: "Configuration for invoicing cadence, delivery, payment terms, and\
    \ taxation for a customer account."
  data:
  - name: "profileName"
    type: "String"
  - name: "taxRegistrationNumber"
    type: "String"
  - name: "invoicingCycle"
    type: "InvoicingCycle"
  - name: "preferredDeliveryMethod"
    type: "InvoiceDeliveryMethod"
  - name: "defaultCurrency"
    type: "String"
  relations:
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "paymentTerm"
    type: "PaymentTerm"
    multiplicity: "ManyToOne"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
- name: "PaymentTerm"
  description: "Rules for due date calculation and early payment discounts."
  data:
  - name: "name"
    type: "String"
  - name: "netDays"
    type: "Integer"
  - name: "discountPercentage"
    type: "Decimal"
  - name: "discountDays"
    type: "Integer"
  - name: "calculationMethod"
    type: "PaymentTermMethod"
  relations:
  - name: "billingProfiles"
    type: "BillingProfile"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
- name: "Invoice"
  description: "Commercial document requesting payment from a customer."
  data:
  - name: "invoiceNumber"
    type: "String"
  - name: "invoiceDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "invoiceType"
    type: "InvoiceType"
  - name: "status"
    type: "InvoiceStatus"
  - name: "currency"
    type: "String"
  - name: "totalAmount"
    type: "Money"
  - name: "taxAmount"
    type: "Money"
  - name: "balanceDue"
    type: "Money"
  relations:
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "billingProfile"
    type: "BillingProfile"
    multiplicity: "ManyToOne"
  - name: "paymentTerm"
    type: "PaymentTerm"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "InvoiceLine"
    multiplicity: "OneToMany"
  - name: "paymentApplications"
    type: "PaymentApplication"
    multiplicity: "OneToMany"
  - name: "creditApplications"
    type: "CreditApplication"
    multiplicity: "OneToMany"
  - name: "disputes"
    type: "Dispute"
    multiplicity: "OneToMany"
  - name: "dunningCases"
    type: "DunningCase"
    multiplicity: "OneToMany"
  - name: "writeOffs"
    type: "WriteOff"
    multiplicity: "OneToMany"
- name: "InvoiceLine"
  description: "Itemized charge, fee, or adjustment composing an invoice total."
  data:
  - name: "description"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "unitPrice"
    type: "Money"
  - name: "lineAmount"
    type: "Money"
  - name: "taxRate"
    type: "Decimal"
  - name: "taxAmount"
    type: "Money"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "Payment"
  description: "Cash receipt from a customer that may be applied to one or more invoices."
  data:
  - name: "paymentReference"
    type: "PaymentReference"
  - name: "paymentDate"
    type: "Date"
  - name: "method"
    type: "PaymentMethod"
  - name: "status"
    type: "PaymentStatus"
  - name: "receivedAmount"
    type: "Money"
  - name: "unappliedAmount"
    type: "Money"
  relations:
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "applications"
    type: "PaymentApplication"
    multiplicity: "OneToMany"
  - name: "remittanceAdvice"
    type: "RemittanceAdvice"
    multiplicity: "OneToOne"
  - name: "bankDeposit"
    type: "BankDeposit"
    multiplicity: "ManyToOne"
- name: "PaymentApplication"
  description: "Allocation of a payment amount to a specific invoice."
  data:
  - name: "applicationDate"
    type: "Date"
  - name: "appliedAmount"
    type: "Money"
  - name: "discountTaken"
    type: "Money"
  - name: "overpayment"
    type: "Money"
  relations:
  - name: "payment"
    type: "Payment"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "CreditMemo"
  description: "Document that reduces amounts owed by a customer."
  data:
  - name: "memoNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "reason"
    type: "CreditMemoReason"
  - name: "status"
    type: "CreditMemoStatus"
  - name: "totalAmount"
    type: "Money"
  - name: "remainingAmount"
    type: "Money"
  relations:
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "applications"
    type: "CreditApplication"
    multiplicity: "OneToMany"
- name: "CreditApplication"
  description: "Application of a credit memo against an open invoice."
  data:
  - name: "applicationDate"
    type: "Date"
  - name: "appliedAmount"
    type: "Money"
  relations:
  - name: "creditMemo"
    type: "CreditMemo"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "DebitNote"
  description: "Document that increases amounts owed by a customer."
  data:
  - name: "noteNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "reason"
    type: "DebitNoteReason"
  - name: "status"
    type: "DebitNoteStatus"
  - name: "totalAmount"
    type: "Money"
  - name: "remainingAmount"
    type: "Money"
  relations:
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "relatedInvoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "RemittanceAdvice"
  description: "Payer-provided details explaining payment allocations and references."
  data:
  - name: "referenceNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "payerName"
    type: "String"
  - name: "totalAmount"
    type: "Money"
  relations:
  - name: "payment"
    type: "Payment"
    multiplicity: "OneToOne"
  - name: "lines"
    type: "RemittanceLine"
    multiplicity: "OneToMany"
- name: "RemittanceLine"
  description: "Line item within a remittance advice referencing an invoice and amount."
  data:
  - name: "invoiceReference"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "discountTaken"
    type: "Money"
  relations:
  - name: "remittanceAdvice"
    type: "RemittanceAdvice"
    multiplicity: "ManyToOne"
- name: "WriteOff"
  description: "Authorized reduction of an uncollectible receivable balance."
  data:
  - name: "writeOffNumber"
    type: "String"
  - name: "date"
    type: "Date"
  - name: "reason"
    type: "WriteOffReason"
  - name: "amount"
    type: "Money"
  - name: "approvalStatus"
    type: "ApprovalStatus"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
- name: "DunningPolicy"
  description: "Strategy defining timing and actions for past-due receivables reminders."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  - name: "graceDays"
    type: "Integer"
  relations:
  - name: "levels"
    type: "DunningLevel"
    multiplicity: "OneToMany"
- name: "DunningLevel"
  description: "A configured step in a dunning policy with specific trigger timing\
    \ and action."
  data:
  - name: "sequence"
    type: "Integer"
  - name: "daysPastDue"
    type: "Integer"
  - name: "actionType"
    type: "DunningActionType"
  - name: "fee"
    type: "Money"
  relations:
  - name: "policy"
    type: "DunningPolicy"
    multiplicity: "ManyToOne"
- name: "DunningCase"
  description: "Case tracking dunning workflow and communications for an overdue invoice."
  data:
  - name: "caseNumber"
    type: "String"
  - name: "status"
    type: "DunningCaseStatus"
  - name: "createdDate"
    type: "Date"
  - name: "lastActionDate"
    type: "Date"
  relations:
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "currentLevel"
    type: "DunningLevel"
    multiplicity: "ManyToOne"
  - name: "notices"
    type: "DunningNotice"
    multiplicity: "OneToMany"
- name: "DunningNotice"
  description: "Communication sent to the customer as part of a dunning case."
  data:
  - name: "noticeNumber"
    type: "String"
  - name: "sentDate"
    type: "Date"
  - name: "channel"
    type: "CommunicationChannel"
  - name: "status"
    type: "NoticeStatus"
  relations:
  - name: "dunningCase"
    type: "DunningCase"
    multiplicity: "ManyToOne"
- name: "AgingSnapshot"
  description: "Point-in-time aggregation of receivables balances by aging bucket."
  data:
  - name: "asOfDate"
    type: "Date"
  relations:
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "bucketAmounts"
    type: "AgingBucketAmount"
    multiplicity: "OneToMany"
- name: "AgingBucketAmount"
  description: "Receivable balance for a single aging bucket within a snapshot."
  data:
  - name: "bucket"
    type: "AgingBucket"
  - name: "amount"
    type: "Money"
  relations:
  - name: "snapshot"
    type: "AgingSnapshot"
    multiplicity: "ManyToOne"
- name: "BankDeposit"
  description: "Deposit event grouping payments posted to a bank account."
  data:
  - name: "depositReference"
    type: "String"
  - name: "depositDate"
    type: "Date"
  - name: "bankAccount"
    type: "String"
  - name: "status"
    type: "DepositStatus"
  - name: "totalAmount"
    type: "Money"
  relations:
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
- name: "Dispute"
  description: "Customer-raised objection to an invoice impacting collection and balance."
  data:
  - name: "disputeNumber"
    type: "String"
  - name: "reason"
    type: "DisputeReason"
  - name: "status"
    type: "DisputeStatus"
  - name: "openedDate"
    type: "Date"
  - name: "disputedAmount"
    type: "Money"
  - name: "resolutionDate"
    type: "Date"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "creditMemo"
    type: "CreditMemo"
    multiplicity: "OneToOne"
enums:
- name: "CustomerAccountStatus"
  description: "Lifecycle status of a customer account used for receivables."
  data:
  - name: "Active"
  - name: "OnHold"
  - name: "Suspended"
  - name: "Closed"
- name: "InvoiceType"
  description: "Classification of invoice purpose or origin."
  data:
  - name: "Standard"
  - name: "ProForma"
  - name: "Recurring"
  - name: "Adjustment"
- name: "InvoiceStatus"
  description: "Processing and collection state of an invoice."
  data:
  - name: "Draft"
  - name: "Issued"
  - name: "PartiallyPaid"
  - name: "Paid"
  - name: "Overdue"
  - name: "Cancelled"
  - name: "WrittenOff"
- name: "PaymentMethod"
  description: "Channel or instrument used for receiving funds."
  data:
  - name: "ACH"
  - name: "Wire"
  - name: "Check"
  - name: "Cash"
  - name: "Card"
  - name: "DirectDebit"
  - name: "Online"
- name: "PaymentStatus"
  description: "Application and clearing state of an inbound payment."
  data:
  - name: "Unapplied"
  - name: "PartiallyApplied"
  - name: "FullyApplied"
  - name: "Reversed"
  - name: "Returned"
- name: "CreditMemoStatus"
  description: "Lifecycle state of a credit memo."
  data:
  - name: "Draft"
  - name: "Issued"
  - name: "Applied"
  - name: "Cancelled"
  - name: "Expired"
- name: "CreditMemoReason"
  description: "Business reason for issuing a credit memo."
  data:
  - name: "PriceAdjustment"
  - name: "Return"
  - name: "ServiceIssue"
  - name: "Goodwill"
  - name: "TaxCorrection"
- name: "DebitNoteStatus"
  description: "Lifecycle state of a debit note."
  data:
  - name: "Draft"
  - name: "Issued"
  - name: "Applied"
  - name: "Cancelled"
- name: "DebitNoteReason"
  description: "Business reason for issuing a debit note."
  data:
  - name: "Underbilling"
  - name: "AdditionalFees"
  - name: "LateCancellation"
  - name: "InterestCharge"
- name: "DunningActionType"
  description: "Action taken at a dunning level to pursue overdue balances."
  data:
  - name: "Email"
  - name: "Letter"
  - name: "PhoneCall"
  - name: "SMS"
  - name: "LegalNotice"
  - name: "ServiceSuspension"
- name: "DunningCaseStatus"
  description: "Progress state of a dunning case."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "Escalated"
  - name: "Resolved"
  - name: "Closed"
- name: "CommunicationChannel"
  description: "Channel used to send dunning or invoice communications."
  data:
  - name: "Email"
  - name: "PostalMail"
  - name: "SMS"
  - name: "PhoneCall"
  - name: "Portal"
- name: "NoticeStatus"
  description: "Delivery and acknowledgment state of a notice."
  data:
  - name: "Pending"
  - name: "Sent"
  - name: "Failed"
  - name: "Acknowledged"
- name: "AgingBucket"
  description: "Time-based category used to segment receivables by days past due."
  data:
  - name: "Current"
  - name: "Days1_30"
  - name: "Days31_60"
  - name: "Days61_90"
  - name: "Days91_120"
  - name: "Over120"
- name: "InvoicingCycle"
  description: "Frequency with which invoices are generated for a profile."
  data:
  - name: "Weekly"
  - name: "Biweekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "OnDemand"
- name: "InvoiceDeliveryMethod"
  description: "Preferred means of delivering invoices to customers."
  data:
  - name: "Email"
  - name: "Portal"
  - name: "PostalMail"
  - name: "EDI"
- name: "PaymentTermMethod"
  description: "Method for determining due dates and discount windows."
  data:
  - name: "Net"
  - name: "EOM"
  - name: "EOMPlus"
  - name: "Custom"
- name: "DepositStatus"
  description: "Processing state of a bank deposit for received payments."
  data:
  - name: "Pending"
  - name: "Confirmed"
  - name: "Reconciled"
  - name: "Cancelled"
- name: "ApprovalStatus"
  description: "Decision state for actions requiring authorization."
  data:
  - name: "PendingApproval"
  - name: "Approved"
  - name: "Rejected"
- name: "WriteOffReason"
  description: "Justification for writing off a receivable balance."
  data:
  - name: "CustomerBankruptcy"
  - name: "SmallBalance"
  - name: "Uncollectible"
  - name: "Settlement"
- name: "DisputeReason"
  description: "Customer-stated grounds for challenging an invoice."
  data:
  - name: "PricingError"
  - name: "QuantityDiscrepancy"
  - name: "ServiceQuality"
  - name: "DuplicateInvoice"
  - name: "TaxDispute"
  - name: "ContractDisagreement"
- name: "DisputeStatus"
  description: "Resolution state of an invoice dispute."
  data:
  - name: "Open"
  - name: "UnderReview"
  - name: "Accepted"
  - name: "Rejected"
  - name: "Resolved"
  - name: "Cancelled"
valueObjects:
- name: "Money"
  description: "Monetary amount with associated currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address used for billing correspondence."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "PaymentReference"
  description: "External or payer-provided identifier for a payment."
  data:
  - name: "value"
    type: "String"
