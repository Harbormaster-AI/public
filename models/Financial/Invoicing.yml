---
metadata:
  name: "Invoicing HCIDL Capabilities Model"
  description: "Canonical capabilities model for issuing, delivering, adjusting, crediting,\
    \ allocating, and tracking invoices within financial operations."
  version: "1.0.0"
  industry: "Cross-Industry Finance"
  category: "Financial"
  type: "Capability"
  domain: "Invoicing"
entities:
- name: "BillingEntity"
  description: "Organization or business unit responsible for issuing invoices and\
    \ collecting payments."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "taxRegistration"
    type: "TaxRegistration"
  - name: "defaultCurrency"
    type: "String"
  - name: "country"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "customers"
    type: "CustomerAccount"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
  - name: "taxCodes"
    type: "TaxCode"
    multiplicity: "OneToMany"
  - name: "paymentTerms"
    type: "PaymentTerm"
    multiplicity: "OneToMany"
  - name: "invoiceTemplates"
    type: "InvoiceTemplate"
    multiplicity: "OneToMany"
  - name: "bankAccounts"
    type: "BankAccount"
    multiplicity: "OneToMany"
- name: "CustomerAccount"
  description: "Customer record that receives invoices and maintains payment, tax,\
    \ and contact preferences."
  data:
  - name: "name"
    type: "String"
  - name: "accountType"
    type: "AccountType"
  - name: "billingAddress"
    type: "Address"
  - name: "shippingAddress"
    type: "Address"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "String"
  - name: "taxRegistration"
    type: "TaxRegistration"
  - name: "taxExempt"
    type: "Boolean"
  - name: "creditLimit"
    type: "Money"
  - name: "preferredDeliveryMethod"
    type: "InvoiceDeliveryMethod"
  relations:
  - name: "billingEntity"
    type: "BillingEntity"
    multiplicity: "ManyToOne"
  - name: "contacts"
    type: "BillingContact"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
  - name: "paymentTerm"
    type: "PaymentTerm"
    multiplicity: "ManyToOne"
  - name: "dunningPolicy"
    type: "DunningPolicy"
    multiplicity: "ManyToOne"
  - name: "exemptionCertificates"
    type: "TaxExemptionCertificate"
    multiplicity: "OneToMany"
  - name: "schedules"
    type: "RecurringInvoiceSchedule"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "PaymentReceipt"
    multiplicity: "OneToMany"
  - name: "creditNotes"
    type: "CreditNote"
    multiplicity: "OneToMany"
- name: "BillingContact"
  description: "Designated individual for billing communications and collections coordination."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "String"
  - name: "role"
    type: "ContactRole"
  relations:
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
- name: "PaymentTerm"
  description: "Contractual terms that determine due dates, discounts, and late fee\
    \ conditions for invoices."
  data:
  - name: "name"
    type: "String"
  - name: "termType"
    type: "PaymentTermType"
  - name: "netDays"
    type: "Integer"
  - name: "discountPercent"
    type: "Decimal"
  - name: "discountDays"
    type: "Integer"
  - name: "dueDayOfMonth"
    type: "Integer"
  - name: "endOfMonthOffset"
    type: "Integer"
  - name: "lateFeePercent"
    type: "Decimal"
  - name: "description"
    type: "String"
  relations:
  - name: "billingEntity"
    type: "BillingEntity"
    multiplicity: "ManyToOne"
  - name: "customers"
    type: "CustomerAccount"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
- name: "Item"
  description: "Billable good, service, or fee used to create invoice lines."
  data:
  - name: "sku"
    type: "String"
  - name: "name"
    type: "String"
  - name: "itemType"
    type: "ItemType"
  - name: "defaultUnitOfMeasure"
    type: "UnitOfMeasure"
  - name: "defaultTaxCode"
    type: "String"
  - name: "taxable"
    type: "Boolean"
  - name: "unitPrice"
    type: "Money"
  relations:
  - name: "billingEntity"
    type: "BillingEntity"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "InvoiceLine"
    multiplicity: "OneToMany"
- name: "TaxCode"
  description: "Tax policy defining the rate, type, and jurisdiction for calculation."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "taxType"
    type: "TaxType"
  - name: "ratePercent"
    type: "Decimal"
  - name: "jurisdiction"
    type: "String"
  - name: "isCompound"
    type: "Boolean"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "billingEntity"
    type: "BillingEntity"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "InvoiceLine"
    multiplicity: "OneToMany"
- name: "Invoice"
  description: "Commercial document requesting payment for delivered goods or services."
  data:
  - name: "invoiceNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "currency"
    type: "String"
  - name: "status"
    type: "InvoiceStatus"
  - name: "taxCalculationMethod"
    type: "TaxCalculationMethod"
  - name: "roundingRule"
    type: "RoundingRule"
  - name: "notes"
    type: "String"
  - name: "totalNet"
    type: "Money"
  - name: "totalTax"
    type: "Money"
  - name: "totalGross"
    type: "Money"
  relations:
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "billingEntity"
    type: "BillingEntity"
    multiplicity: "ManyToOne"
  - name: "paymentTerm"
    type: "PaymentTerm"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "InvoiceLine"
    multiplicity: "OneToMany"
  - name: "taxes"
    type: "InvoiceTax"
    multiplicity: "OneToMany"
  - name: "deliveries"
    type: "InvoiceDelivery"
    multiplicity: "OneToMany"
  - name: "adjustments"
    type: "InvoiceAdjustment"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "InvoiceAttachment"
    multiplicity: "OneToMany"
  - name: "paymentsApplied"
    type: "PaymentAllocation"
    multiplicity: "OneToMany"
  - name: "creditsApplied"
    type: "CreditAllocation"
    multiplicity: "OneToMany"
  - name: "creditNotes"
    type: "CreditNote"
    multiplicity: "OneToMany"
  - name: "schedule"
    type: "RecurringInvoiceSchedule"
    multiplicity: "ManyToOne"
- name: "InvoiceLine"
  description: "Detailed charge, service, or adjustment item belonging to an invoice."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "lineType"
    type: "InvoiceLineType"
  - name: "description"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  - name: "unitPrice"
    type: "Money"
  - name: "discountType"
    type: "DiscountType"
  - name: "discountValue"
    type: "Decimal"
  - name: "lineNet"
    type: "Money"
  - name: "lineTax"
    type: "Money"
  - name: "lineTotal"
    type: "Money"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "taxCode"
    type: "TaxCode"
    multiplicity: "ManyToOne"
- name: "InvoiceTax"
  description: "Aggregated tax component calculated for an invoice by tax code and\
    \ jurisdiction."
  data:
  - name: "taxType"
    type: "TaxType"
  - name: "taxCode"
    type: "String"
  - name: "ratePercent"
    type: "Decimal"
  - name: "jurisdiction"
    type: "String"
  - name: "taxableAmount"
    type: "Money"
  - name: "taxAmount"
    type: "Money"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "InvoiceAdjustment"
  description: "Header-level surcharge, discount, rounding, or correction applied\
    \ to an invoice."
  data:
  - name: "adjustmentType"
    type: "AdjustmentType"
  - name: "description"
    type: "String"
  - name: "amount"
    type: "Money"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "CreditNote"
  description: "Document that issues a credit to reduce amounts previously billed."
  data:
  - name: "creditNoteNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "status"
    type: "CreditNoteStatus"
  - name: "currency"
    type: "String"
  - name: "totalAmount"
    type: "Money"
  - name: "reason"
    type: "CreditNoteReason"
  - name: "notes"
    type: "String"
  relations:
  - name: "billingEntity"
    type: "BillingEntity"
    multiplicity: "ManyToOne"
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "originalInvoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "CreditNoteLine"
    multiplicity: "OneToMany"
  - name: "allocations"
    type: "CreditAllocation"
    multiplicity: "OneToMany"
- name: "CreditNoteLine"
  description: "Individual credit entry linked to a credit note."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "appliesToLineNumber"
    type: "Integer"
  relations:
  - name: "creditNote"
    type: "CreditNote"
    multiplicity: "ManyToOne"
  - name: "taxCode"
    type: "TaxCode"
    multiplicity: "ManyToOne"
- name: "CreditAllocation"
  description: "Allocation of a credit note amount against an open invoice balance."
  data:
  - name: "amount"
    type: "Money"
  - name: "allocationDate"
    type: "Date"
  relations:
  - name: "creditNote"
    type: "CreditNote"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "PaymentReceipt"
  description: "Record of received funds intended to settle outstanding invoices."
  data:
  - name: "receiptNumber"
    type: "String"
  - name: "paymentDate"
    type: "Date"
  - name: "amountReceived"
    type: "Money"
  - name: "method"
    type: "PaymentMethod"
  - name: "status"
    type: "PaymentStatus"
  - name: "reference"
    type: "PaymentReference"
  - name: "currency"
    type: "String"
  - name: "exchangeRate"
    type: "Decimal"
  relations:
  - name: "billingEntity"
    type: "BillingEntity"
    multiplicity: "ManyToOne"
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "allocations"
    type: "PaymentAllocation"
    multiplicity: "OneToMany"
  - name: "bankAccount"
    type: "BankAccount"
    multiplicity: "ManyToOne"
- name: "PaymentAllocation"
  description: "Allocation of a payment receipt amount to a specific invoice."
  data:
  - name: "amount"
    type: "Money"
  - name: "allocationDate"
    type: "Date"
  relations:
  - name: "paymentReceipt"
    type: "PaymentReceipt"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "InvoiceDelivery"
  description: "Log of how and when an invoice was delivered to the customer."
  data:
  - name: "deliveryMethod"
    type: "InvoiceDeliveryMethod"
  - name: "destination"
    type: "String"
  - name: "sentDate"
    type: "Date"
  - name: "status"
    type: "DeliveryStatus"
  - name: "attemptCount"
    type: "Integer"
  - name: "messageId"
    type: "String"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "DunningPolicy"
  description: "Configuration of sequential actions for managing overdue receivables."
  data:
  - name: "name"
    type: "String"
  - name: "graceDays"
    type: "Integer"
  - name: "maxLevel"
    type: "Integer"
  relations:
  - name: "billingEntity"
    type: "BillingEntity"
    multiplicity: "ManyToOne"
  - name: "steps"
    type: "DunningStep"
    multiplicity: "OneToMany"
  - name: "customers"
    type: "CustomerAccount"
    multiplicity: "OneToMany"
- name: "DunningStep"
  description: "Action and timing rule executed at a specific delinquency level."
  data:
  - name: "level"
    type: "Integer"
  - name: "action"
    type: "DunningAction"
  - name: "daysPastDue"
    type: "Integer"
  - name: "sendToCollector"
    type: "Boolean"
  - name: "templateName"
    type: "String"
  relations:
  - name: "policy"
    type: "DunningPolicy"
    multiplicity: "ManyToOne"
- name: "TaxExemptionCertificate"
  description: "Evidence of tax exemption for a customer within a jurisdiction."
  data:
  - name: "certificateNumber"
    type: "String"
  - name: "jurisdiction"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "reason"
    type: "String"
  relations:
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "billingEntity"
    type: "BillingEntity"
    multiplicity: "ManyToOne"
- name: "BankAccount"
  description: "Financial account configured to receive customer payments."
  data:
  - name: "accountName"
    type: "String"
  - name: "bankName"
    type: "String"
  - name: "iban"
    type: "String"
  - name: "bic"
    type: "String"
  - name: "accountNumber"
    type: "String"
  - name: "routingNumber"
    type: "String"
  - name: "currency"
    type: "String"
  relations:
  - name: "billingEntity"
    type: "BillingEntity"
    multiplicity: "ManyToOne"
  - name: "paymentReceipts"
    type: "PaymentReceipt"
    multiplicity: "OneToMany"
- name: "InvoiceAttachment"
  description: "Supporting document or link associated with an invoice."
  data:
  - name: "fileName"
    type: "String"
  - name: "fileType"
    type: "String"
  - name: "url"
    type: "String"
  - name: "uploadedDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "RecurringInvoiceSchedule"
  description: "Template-driven instruction to generate invoices on a defined cadence."
  data:
  - name: "name"
    type: "String"
  - name: "frequency"
    type: "RecurrenceFrequency"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "nextRunDate"
    type: "Date"
  - name: "dayOfMonth"
    type: "Integer"
  - name: "anchorDayOfWeek"
    type: "String"
  relations:
  - name: "billingEntity"
    type: "BillingEntity"
    multiplicity: "ManyToOne"
  - name: "customerAccount"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "Item"
    multiplicity: "ManyToOne"
  - name: "template"
    type: "InvoiceTemplate"
    multiplicity: "ManyToOne"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
- name: "InvoiceTemplate"
  description: "Presentation and numbering configuration used to render invoices."
  data:
  - name: "name"
    type: "String"
  - name: "locale"
    type: "String"
  - name: "currency"
    type: "String"
  - name: "numberingPattern"
    type: "String"
  - name: "footerText"
    type: "String"
  - name: "logoUrl"
    type: "String"
  relations:
  - name: "billingEntity"
    type: "BillingEntity"
    multiplicity: "ManyToOne"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
- name: "WithholdingRule"
  description: "Rule defining withholding tax to be deducted from invoice payments\
    \ as per jurisdiction."
  data:
  - name: "name"
    type: "String"
  - name: "ratePercent"
    type: "Decimal"
  - name: "jurisdiction"
    type: "String"
  - name: "appliesTo"
    type: "TaxType"
  relations:
  - name: "billingEntity"
    type: "BillingEntity"
    multiplicity: "ManyToOne"
enums:
- name: "AccountType"
  description: "Classification of the customer account."
  data:
  - name: "Business"
  - name: "Individual"
  - name: "Government"
  - name: "NonProfit"
- name: "PaymentTermType"
  description: "Method used to compute invoice due dates and discounts."
  data:
  - name: "Net"
  - name: "DueOnReceipt"
  - name: "EndOfMonth"
  - name: "Custom"
- name: "InvoiceStatus"
  description: "Lifecycle stage of an invoice from creation to settlement."
  data:
  - name: "Draft"
  - name: "Issued"
  - name: "PartiallyPaid"
  - name: "Paid"
  - name: "Overdue"
  - name: "Void"
- name: "InvoiceLineType"
  description: "Category of charge represented by an invoice line."
  data:
  - name: "Product"
  - name: "Service"
  - name: "Freight"
  - name: "Discount"
  - name: "Surcharge"
  - name: "Rounding"
- name: "UnitOfMeasure"
  description: "Measurement unit for quantity on invoice lines."
  data:
  - name: "Each"
  - name: "Hour"
  - name: "Day"
  - name: "Month"
  - name: "Kg"
  - name: "Litre"
  - name: "Box"
- name: "TaxType"
  description: "Type of tax that may be applied to invoice amounts."
  data:
  - name: "VAT"
  - name: "GST"
  - name: "SalesTax"
  - name: "UseTax"
  - name: "ServiceTax"
  - name: "WithholdingTax"
  - name: "ZeroRated"
  - name: "Exempt"
- name: "DiscountType"
  description: "Method of discounting applied to a line or invoice."
  data:
  - name: "None"
  - name: "Percentage"
  - name: "Amount"
  - name: "EarlyPayment"
- name: "PaymentMethod"
  description: "Instrument through which a payment is received."
  data:
  - name: "BankTransfer"
  - name: "CreditCard"
  - name: "Cash"
  - name: "Check"
  - name: "DirectDebit"
  - name: "MobileWallet"
  - name: "ACH"
  - name: "Wire"
- name: "PaymentStatus"
  description: "Application and clearing state of a received payment."
  data:
  - name: "Pending"
  - name: "Completed"
  - name: "Failed"
  - name: "Reversed"
  - name: "PartiallyApplied"
- name: "CreditNoteStatus"
  description: "Lifecycle state of a credit note."
  data:
  - name: "Draft"
  - name: "Issued"
  - name: "Applied"
  - name: "Void"
- name: "CreditNoteReason"
  description: "Reason code explaining why a credit note was issued."
  data:
  - name: "Return"
  - name: "PriceAdjustment"
  - name: "BillingError"
  - name: "Goodwill"
  - name: "TaxCorrection"
  - name: "WriteOff"
- name: "DeliveryStatus"
  description: "Status of an attempt to deliver an invoice to a recipient."
  data:
  - name: "Pending"
  - name: "Sent"
  - name: "Failed"
  - name: "Bounced"
  - name: "Acknowledged"
- name: "InvoiceDeliveryMethod"
  description: "Channel used to distribute the invoice to the customer."
  data:
  - name: "Email"
  - name: "Portal"
  - name: "Print"
  - name: "EDI"
  - name: "API"
- name: "AdjustmentType"
  description: "Type of invoice-level financial change applied outside normal line\
    \ items."
  data:
  - name: "Discount"
  - name: "Surcharge"
  - name: "WriteOff"
  - name: "Rounding"
  - name: "TaxCorrection"
- name: "DunningAction"
  description: "Action taken at a specific delinquency level."
  data:
  - name: "EmailReminder"
  - name: "Letter"
  - name: "PhoneCall"
  - name: "LateFee"
  - name: "SuspendService"
  - name: "SendToCollections"
- name: "ContactRole"
  description: "Functional role of a billing contact at the customer."
  data:
  - name: "Billing"
  - name: "AccountsPayable"
  - name: "Legal"
  - name: "Owner"
  - name: "Technical"
- name: "ItemType"
  description: "Classification of billable item on an invoice."
  data:
  - name: "Good"
  - name: "Service"
  - name: "Fee"
- name: "TaxCalculationMethod"
  description: "Approach for calculating tax relative to line prices."
  data:
  - name: "Exclusive"
  - name: "Inclusive"
- name: "RoundingRule"
  description: "Rule applied when rounding line or invoice totals."
  data:
  - name: "Nearest"
  - name: "Up"
  - name: "Down"
- name: "RecurrenceFrequency"
  description: "Cadence for generating recurring invoices."
  data:
  - name: "Weekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Annually"
valueObjects:
- name: "Money"
  description: "Monetary amount expressed in a specified currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal location used for billing or shipping purposes."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "EmailAddress"
  description: "Electronic mail address used for invoice delivery and notifications."
  data:
  - name: "value"
    type: "String"
- name: "TaxRegistration"
  description: "Jurisdictional tax identification for a legal entity or customer."
  data:
  - name: "number"
    type: "String"
  - name: "countryCode"
    type: "String"
  - name: "scheme"
    type: "String"
- name: "PaymentReference"
  description: "External reference identifying a payment within a clearing or processor\
    \ network."
  data:
  - name: "reference"
    type: "String"
  - name: "provider"
    type: "String"
