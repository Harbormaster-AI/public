    type: "String"
  - name: "legalName"
    type: "String"
  - name: "lei"
    type: "LEI"
  - name: "domicileCountry"
    type: "String"
  - name: "sector"
    type: "MarketSector"
  relations:
  - name: "securities"
    type: "Security"
    multiplicity: "OneToMany"
- name: "Security"
  description: "Tradeable financial instrument such as equity, bond, ETF, or derivative."
