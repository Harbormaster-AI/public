    type: "Price"
  - name: "last"
    type: "Price"
  - name: "quoteTime"
    type: "DateTime"
  - name: "size"
    type: "Quantity"
  relations:
  - name: "security"
    type: "Security"
    multiplicity: "ManyToOne"
  - name: "venue"
    type: "TradingVenue"
    multiplicity: "ManyToOne"
  - name: "feed"
