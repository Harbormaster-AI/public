  - name: "trade"
    type: "Trade"
    multiplicity: "ManyToOne"
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
