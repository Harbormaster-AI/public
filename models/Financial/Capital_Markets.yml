metadata:
  name: "Capital Markets Industry Domain Model"
  version: "1.0.0"
  industry: "Capital Markets"
  category: "Financial"
  description: "HCIDL model capturing core issuance, trading, market data, clearing,\
    \ settlement, risk, collateral, and regulatory reporting capabilities across capital\
    \ markets."
  type: "Industry"
  domain: "Capital Markets"
enums:
- name: "SecurityType"
  description: "Classification of the financial instrument."
  data:
  - name: "Equity"
  - name: "PreferredEquity"
  - name: "ETF"
  - name: "Bond"
  - name: "CommercialPaper"
  - name: "MoneyMarket"
  - name: "Futures"
  - name: "Option"
  - name: "Swap"
  - name: "FXForward"
  - name: "FundShare"
- name: "ListingStatus"
  description: "State of a security’s admission to trading on a venue."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Delisted"
- name: "VenueType"
  description: "Type of trading facility or market structure."
  data:
  - name: "Exchange"
  - name: "MTF"
  - name: "ATS"
  - name: "DarkPool"
  - name: "OTC"
- name: "BrokerDealerType"
  description: "Operating model of the intermediary."
  data:
  - name: "Agency"
  - name: "Principal"
  - name: "PrimeBroker"
  - name: "ClearingBroker"
- name: "ParticipantStatus"
  description: "Enrollment and activity status of a market participant."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Suspended"
- name: "InvestorType"
  description: "Category of investing entity."
  data:
  - name: "Individual"
  - name: "Institutional"
  - name: "HedgeFund"
  - name: "AssetManager"
  - name: "PensionFund"
  - name: "Insurance"
- name: "PortfolioType"
  description: "Structure and legal form of the portfolio."
  data:
  - name: "Segregated"
  - name: "Commingled"
  - name: "SMA"
  - name: "FundPortfolio"
- name: "AccountStatus"
  description: "Operational state of an account."
  data:
  - name: "Open"
  - name: "Restricted"
  - name: "Closed"
- name: "MarginType"
  description: "Margin methodology agreed for the account."
  data:
  - name: "Cash"
  - name: "Margin"
  - name: "PortfolioMargin"
- name: "Side"
  description: "Direction of trade intent."
  data:
  - name: "Buy"
  - name: "Sell"
  - name: "SellShort"
  - name: "BuyToCover"
- name: "OrderType"
  description: "Execution instruction controlling price discovery."
  data:
  - name: "Market"
  - name: "Limit"
  - name: "Stop"
  - name: "StopLimit"
  - name: "Pegged"
  - name: "Iceberg"
- name: "TimeInForce"
  description: "Duration over which an order remains executable."
  data:
  - name: "Day"
  - name: "GTC"
  - name: "IOC"
  - name: "FOK"
  - name: "GTT"
  - name: "AtTheOpen"
  - name: "AtTheClose"
- name: "OrderStatus"
  description: "Processing and lifecycle state of an order."
  data:
  - name: "New"
  - name: "PartiallyFilled"
  - name: "Filled"
  - name: "Canceled"
  - name: "Rejected"
  - name: "Expired"
  - name: "PendingCancel"
  - name: "PendingReplace"
  - name: "Suspended"
- name: "TradeStatus"
  description: "Lifecycle state of a trade through post-trade processing."
  data:
  - name: "Pending"
  - name: "Confirmed"
  - name: "Cleared"
  - name: "Settled"
  - name: "Cancelled"
  - name: "Corrected"
  - name: "Novated"
- name: "LiquidityIndicator"
  description: "Liquidity characteristic of an execution relative to the book."
  data:
  - name: "Added"
  - name: "Removed"
  - name: "Auction"
- name: "ClearingStatus"
  description: "Status of a trade in the clearing process."
  data:
  - name: "Pending"
  - name: "Novated"
  - name: "Rejected"
  - name: "Cleared"
- name: "DeliveryType"
  description: "Method by which securities and cash are exchanged."
  data:
  - name: "DVP"
