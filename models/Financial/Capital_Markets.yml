  - name: "listings"
    type: "Listing"
    multiplicity: "OneToMany"
  - name: "underliers"
    type: "Security"
    multiplicity: "ManyToMany"
  - name: "index"
    type: "_Index"
    multiplicity: "ManyToOne"
  - name: "corporateActions"
    type: "CorporateAction"
    multiplicity: "OneToMany"
