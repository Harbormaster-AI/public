  - name: "name"
    type: "String"
  - name: "ticker"
    type: "String"
  - name: "isin"
    type: "ISIN"
  - name: "cusip"
    type: "CUSIP"
  - name: "figi"
    type: "FIGI"
  - name: "currency"
