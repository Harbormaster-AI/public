    type: "LetterOfCredit"
    multiplicity: "OneToMany"
  - name: "bankAccounts"
    type: "BankAccount"
    multiplicity: "OneToMany"
- name: "TradeAccount"
  description: "Relationship account used to manage limits, collateral, and transactions\
