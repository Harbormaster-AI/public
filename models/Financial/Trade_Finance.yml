  - name: "country"
    type: "String"
  - name: "regulatorIdentifier"
    type: "String"
  - name: "swiftConnected"
    type: "Boolean"
  relations:
  - name: "customers"
    type: "CorporateCustomer"
    multiplicity: "ManyToMany"
  - name: "tradeAccounts"
    type: "TradeAccount"
    multiplicity: "OneToMany"
  - name: "swiftMessagesSent"
    type: "SWIFTMessage"
    multiplicity: "OneToMany"
  - name: "swiftMessagesReceived"
    type: "SWIFTMessage"
    multiplicity: "OneToMany"
- name: "CorporateCustomer"
  description: "Importer or exporter engaging in cross-border trade transactions."
