---
metadata:
  name: "Payments Capabilities Model"
  description: "Canonical HCIDL capabilities model for payments processing, authorization,\
    \ capture, settlement, and payout."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Financial"
  type: "Capability"
  domain: "Payments"
entities:
- name: "PaymentServiceProvider"
  description: "Organization offering payment processing, risk, and settlement services\
    \ to merchants."
  data:
  - name: "name"
    type: "String"
  - name: "website"
    type: "String"
  - name: "countryOfIncorporation"
    type: "String"
  relations:
  - name: "merchants"
    type: "Merchant"
    multiplicity: "OneToMany"
  - name: "acquirers"
    type: "Acquirer"
    multiplicity: "ManyToMany"
  - name: "gateways"
    type: "PaymentGateway"
    multiplicity: "OneToMany"
  - name: "riskPolicies"
    type: "RiskPolicy"
    multiplicity: "OneToMany"
- name: "Merchant"
  description: "Business entity that accepts payments from payers for goods or services."
  data:
  - name: "legalName"
    type: "String"
  - name: "tradingName"
    type: "String"
  - name: "mcc"
    type: "MerchantCategoryCode"
  - name: "settlementCurrency"
    type: "String"
  - name: "defaultChannel"
    type: "PaymentChannel"
  relations:
  - name: "svcProvider"
    type: "PaymentServiceProvider"
    multiplicity: "ManyToOne"
  - name: "merchantAccounts"
    type: "MerchantAccount"
    multiplicity: "OneToMany"
  - name: "checkoutSessions"
    type: "CheckoutSession"
    multiplicity: "OneToMany"
  - name: "paymentOrders"
    type: "PaymentOrder"
    multiplicity: "OneToMany"
  - name: "disputes"
    type: "Dispute"
    multiplicity: "OneToMany"
  - name: "riskPolicies"
    type: "RiskPolicy"
    multiplicity: "ManyToMany"
- name: "MerchantAccount"
  description: "Processing configuration for a merchant, typically scoped by region\
    \ or currency."
  data:
  - name: "name"
    type: "String"
  - name: "currency"
    type: "String"
  - name: "status"
    type: "MerchantAccountStatus"
  - name: "settlementSchedule"
    type: "SettlementSchedule"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "acquirer"
    type: "Acquirer"
    multiplicity: "ManyToOne"
  - name: "settlementBatches"
    type: "SettlementBatch"
    multiplicity: "OneToMany"
  - name: "payouts"
    type: "Payout"
    multiplicity: "OneToMany"
  - name: "settlementInstructions"
    type: "SettlementInstruction"
    multiplicity: "OneToMany"
  - name: "settlementBankAccounts"
    type: "SettlementBankAccount"
    multiplicity: "OneToMany"
- name: "Acquirer"
  description: "Financial institution that acquires and settles card transactions\
    \ for merchants."
  data:
  - name: "name"
    type: "String"
  - name: "network"
    type: "NetworkScheme"
  - name: "binRange"
    type: "String"
  relations:
  - name: "serviceProviders"
    type: "PaymentServiceProvider"
    multiplicity: "ManyToMany"
  - name: "merchantAccounts"
    type: "MerchantAccount"
    multiplicity: "OneToMany"
  - name: "settlementBatches"
    type: "SettlementBatch"
    multiplicity: "OneToMany"
- name: "PaymentGateway"
  description: "Technical connection that routes payment messages to networks and\
    \ processors."
  data:
  - name: "name"
    type: "String"
  - name: "endpointUrl"
    type: "String"
  - name: "status"
    type: "ConnectionStatus"
  relations:
  - name: "svcProvider"
    type: "PaymentServiceProvider"
    multiplicity: "ManyToOne"
  - name: "merchants"
    type: "Merchant"
    multiplicity: "ManyToMany"
- name: "CheckoutSession"
  description: "Session that orchestrates available payment methods and collects payer\
    \ intent."
  data:
  - name: "sessionReference"
    type: "String"
  - name: "channel"
    type: "PaymentChannel"
  - name: "locale"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "paymentOrder"
    type: "PaymentOrder"
    multiplicity: "OneToOne"
  - name: "allowedMethods"
    type: "PaymentMethod"
    multiplicity: "ManyToMany"
- name: "PaymentOrder"
  description: "Commercial request to collect funds from a payer on behalf of a merchant."
  data:
  - name: "reference"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "PaymentStatus"
  - name: "intent"
    type: "PaymentIntentType"
  - name: "captureMethod"
    type: "CaptureMethod"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "payer"
    type: "Payer"
    multiplicity: "ManyToOne"
  - name: "paymentAttempts"
    type: "PaymentAttempt"
    multiplicity: "OneToMany"
  - name: "refunds"
    type: "Refund"
    multiplicity: "OneToMany"
- name: "Payer"
  description: "Individual or organization that provides funds for a payment."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "customerType"
    type: "PayerType"
  relations:
  - name: "paymentOrders"
    type: "PaymentOrder"
    multiplicity: "OneToMany"
  - name: "mandates"
    type: "Mandate"
    multiplicity: "OneToMany"
  - name: "instruments"
    type: "_FundingInstrument"
    multiplicity: "OneToMany"
  - name: "complianceChecks"
    type: "ComplianceCheck"
    multiplicity: "OneToMany"
- name: "PaymentMethod"
  description: "Checkout option representing a way to pay, such as card, bank transfer,\
    \ or wallet."
  data:
  - name: "name"
    type: "String"
  - name: "methodType"
    type: "PaymentMethodType"
  - name: "recurringSupported"
    type: "Boolean"
  relations:
  - name: "checkoutSessions"
    type: "CheckoutSession"
    multiplicity: "ManyToMany"
- name: "_FundingInstrument"
  description: "Stored funding source that can be used to pay, such as a card, bank\
    \ account, or wallet."
  data:
  - name: "alias"
    type: "String"
  - name: "instrumentType"
    type: "FundingInstrumentType"
  - name: "status"
    type: "InstrumentStatus"
  relations:
  - name: "payer"
    type: "Payer"
    multiplicity: "ManyToOne"
  - name: "card"
    type: "CardInstrument"
    multiplicity: "ManyToOne"
  - name: "bankAccount"
    type: "BankInstrument"
    multiplicity: "ManyToOne"
  - name: "wallet"
    type: "WalletInstrument"
    multiplicity: "ManyToOne"
  - name: "tokens"
    type: "InstrumentToken"
    multiplicity: "OneToMany"
  - name: "mandates"
    type: "Mandate"
    multiplicity: "OneToMany"
- name: "CardInstrument"
  description: "Card-based funding instrument details used for authorization and capture."
  data:
  - name: "brand"
    type: "CardBrand"
  - name: "panLast4"
    type: "PANLast4"
  - name: "expMonth"
    type: "Integer"
  - name: "expYear"
    type: "Integer"
  - name: "cardholderName"
    type: "CardholderName"
  - name: "network"
    type: "NetworkScheme"
  relations:
  - name: "instruments"
    type: "_FundingInstrument"
    multiplicity: "OneToMany"
  - name: "issuer"
    type: "Issuer"
    multiplicity: "ManyToOne"
- name: "BankInstrument"
  description: "Bank account funding instrument used for transfers or direct debit."
  data:
  - name: "accountNumber"
    type: "AccountNumber"
  - name: "routingNumber"
    type: "RoutingNumber"
  - name: "iban"
    type: "IBAN"
  - name: "bankName"
    type: "String"
  - name: "country"
    type: "String"
  relations:
  - name: "instruments"
    type: "_FundingInstrument"
    multiplicity: "OneToMany"
  - name: "mandates"
    type: "Mandate"
    multiplicity: "OneToMany"
  - name: "bank"
    type: "Bank"
    multiplicity: "ManyToOne"
- name: "WalletInstrument"
  description: "Digital wallet profile used to authorize and fund payments."
  data:
  - name: "provider"
    type: "WalletProvider"
  - name: "email"
    type: "EmailAddress"
  relations:
  - name: "instruments"
    type: "_FundingInstrument"
    multiplicity: "OneToMany"
- name: "InstrumentToken"
  description: "Tokenized representation of a funding instrument for secure reuse."
  data:
  - name: "token"
    type: "TokenReference"
  - name: "tokenProvider"
    type: "TokenServiceProvider"
  - name: "status"
    type: "TokenStatus"
  relations:
  - name: "instrument"
    type: "_FundingInstrument"
    multiplicity: "ManyToOne"
- name: "Mandate"
  description: "Authorization from a payer allowing pull payments or recurring debits."
  data:
  - name: "mandateReference"
    type: "String"
  - name: "status"
    type: "MandateStatus"
  - name: "scheme"
    type: "DebitScheme"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "payer"
    type: "Payer"
    multiplicity: "ManyToOne"
  - name: "instrument"
    type: "_FundingInstrument"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
- name: "PaymentAttempt"
  description: "A single processing attempt to authorize or capture funds for a payment\
    \ order."
  data:
  - name: "attemptReference"
    type: "String"
  - name: "status"
    type: "AttemptStatus"
  - name: "authenticationMethod"
    type: "AuthenticationMethod"
  - name: "riskScore"
    type: "Integer"
  - name: "authorizedAmount"
    type: "Money"
  relations:
  - name: "paymentOrder"
    type: "PaymentOrder"
    multiplicity: "ManyToOne"
  - name: "gateway"
    type: "PaymentGateway"
    multiplicity: "ManyToOne"
  - name: "authorization"
    type: "Authorization"
    multiplicity: "OneToOne"
  - name: "captures"
    type: "Capture"
    multiplicity: "OneToMany"
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "OneToOne"
- name: "Authorization"
  description: "Financial approval that reserves funds on a funding instrument."
  data:
  - name: "status"
    type: "AuthorizationStatus"
  - name: "approved"
    type: "Boolean"
  - name: "authorizationCode"
    type: "String"
  - name: "expiresOn"
    type: "Date"
  relations:
  - name: "attempt"
    type: "PaymentAttempt"
    multiplicity: "ManyToOne"
  - name: "captures"
    type: "Capture"
    multiplicity: "OneToMany"
- name: "Capture"
  description: "Movement of authorized funds from payer to acquirer on behalf of the\
    \ merchant."
  data:
  - name: "captureReference"
    type: "String"
  - name: "status"
    type: "CaptureStatus"
  - name: "capturedAmount"
    type: "Money"
  - name: "captureDate"
    type: "Date"
  relations:
  - name: "authorization"
    type: "Authorization"
    multiplicity: "ManyToOne"
  - name: "paymentOrder"
    type: "PaymentOrder"
    multiplicity: "ManyToOne"
  - name: "settlementBatch"
    type: "SettlementBatch"
    multiplicity: "ManyToOne"
  - name: "refunds"
    type: "Refund"
    multiplicity: "OneToMany"
- name: "Refund"
  description: "Return of funds from a settled or captured transaction back to the\
    \ payer."
  data:
  - name: "refundReference"
    type: "String"
  - name: "status"
    type: "RefundStatus"
  - name: "amount"
    type: "Money"
  - name: "reason"
    type: "RefundReason"
  - name: "requestedDate"
    type: "Date"
  relations:
  - name: "paymentOrder"
    type: "PaymentOrder"
    multiplicity: "ManyToOne"
  - name: "capture"
    type: "Capture"
    multiplicity: "ManyToOne"
  - name: "settlementBatch"
    type: "SettlementBatch"
    multiplicity: "ManyToOne"
- name: "Dispute"
  description: "Case created when a payer or issuer challenges a transaction."
  data:
  - name: "caseNumber"
    type: "String"
  - name: "reason"
    type: "DisputeReason"
  - name: "status"
    type: "DisputeStatus"
  - name: "disputedAmount"
    type: "Money"
  - name: "openedDate"
    type: "Date"
  relations:
  - name: "capture"
    type: "Capture"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "evidence"
    type: "DisputeEvidence"
    multiplicity: "OneToMany"
  - name: "chargeback"
    type: "Chargeback"
    multiplicity: "OneToOne"
- name: "DisputeEvidence"
  description: "Documentation and data submitted to contest a dispute."
  data:
  - name: "evidenceType"
    type: "EvidenceType"
  - name: "submittedDate"
    type: "Date"
  - name: "description"
    type: "String"
  relations:
  - name: "dispute"
    type: "Dispute"
    multiplicity: "ManyToOne"
- name: "Chargeback"
  description: "Reversal of funds resulting from a dispute decision."
  data:
  - name: "status"
    type: "ChargebackStatus"
  - name: "amount"
    type: "Money"
  - name: "postedDate"
    type: "Date"
  relations:
  - name: "dispute"
    type: "Dispute"
    multiplicity: "ManyToOne"
  - name: "settlementBatch"
    type: "SettlementBatch"
    multiplicity: "ManyToOne"
- name: "SettlementBatch"
  description: "Group of financial movements submitted for clearing and settlement."
  data:
  - name: "batchReference"
    type: "String"
  - name: "status"
    type: "SettlementStatus"
  - name: "currency"
    type: "String"
  - name: "submissionDate"
    type: "Date"
  relations:
  - name: "acquirer"
    type: "Acquirer"
    multiplicity: "ManyToOne"
  - name: "merchantAccount"
    type: "MerchantAccount"
    multiplicity: "ManyToOne"
  - name: "captures"
    type: "Capture"
    multiplicity: "OneToMany"
  - name: "refunds"
    type: "Refund"
    multiplicity: "OneToMany"
  - name: "chargebacks"
    type: "Chargeback"
    multiplicity: "OneToMany"
  - name: "payouts"
    type: "Payout"
    multiplicity: "OneToMany"
- name: "Payout"
  description: "Transfer of settled funds from the acquirer or PSP to the merchant’\
    s bank account."
  data:
  - name: "payoutReference"
    type: "String"
  - name: "status"
    type: "PayoutStatus"
  - name: "amount"
    type: "Money"
  - name: "arrivalDate"
    type: "Date"
  relations:
  - name: "settlementBatch"
    type: "SettlementBatch"
    multiplicity: "ManyToOne"
  - name: "merchantAccount"
    type: "MerchantAccount"
    multiplicity: "ManyToOne"
  - name: "settlementInstruction"
    type: "SettlementInstruction"
    multiplicity: "ManyToOne"
- name: "SettlementInstruction"
  description: "Configuration specifying where and how payouts should be disbursed."
  data:
  - name: "beneficiaryName"
    type: "String"
  - name: "priority"
    type: "Integer"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "merchantAccount"
    type: "MerchantAccount"
    multiplicity: "ManyToOne"
  - name: "bankAccount"
    type: "SettlementBankAccount"
    multiplicity: "ManyToOne"
- name: "SettlementBankAccount"
  description: "Bank account owned by the merchant and used as the destination for\
    \ payouts."
  data:
  - name: "accountNumber"
    type: "AccountNumber"
  - name: "routingNumber"
    type: "RoutingNumber"
  - name: "iban"
    type: "IBAN"
  - name: "accountHolder"
    type: "String"
  - name: "country"
    type: "String"
  - name: "currency"
    type: "String"
  relations:
  - name: "bank"
    type: "Bank"
    multiplicity: "ManyToOne"
  - name: "settlementInstructions"
    type: "SettlementInstruction"
    multiplicity: "OneToMany"
  - name: "merchantAccount"
    type: "MerchantAccount"
    multiplicity: "ManyToOne"
- name: "Issuer"
  description: "Financial institution that issues payment cards to payers."
  data:
  - name: "name"
    type: "String"
  - name: "country"
    type: "String"
  relations:
  - name: "cards"
    type: "CardInstrument"
    multiplicity: "OneToMany"
- name: "Bank"
  description: "Financial institution that holds accounts used for debits and payouts."
  data:
  - name: "name"
    type: "String"
  - name: "bic"
    type: "String"
  - name: "country"
    type: "String"
  relations:
  - name: "bankAccounts"
    type: "SettlementBankAccount"
    multiplicity: "OneToMany"
  - name: "bankInstruments"
    type: "BankInstrument"
    multiplicity: "OneToMany"
- name: "RiskPolicy"
  description: "Configurable rules and controls that determine transaction risk handling."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "PolicyStatus"
  - name: "maxAttempt"
    type: "Integer"
  - name: "blockPrepaid"
    type: "Boolean"
  relations:
  - name: "svcProvider"
    type: "PaymentServiceProvider"
    multiplicity: "ManyToOne"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "merchants"
    type: "Merchant"
    multiplicity: "ManyToMany"
- name: "RiskAssessment"
  description: "Evaluation outcome that scores and classifies the risk of a payment\
    \ attempt."
  data:
  - name: "score"
    type: "Integer"
  - name: "result"
    type: "RiskResult"
  - name: "reasonCodes"
    type: "String"
  relations:
  - name: "attempt"
    type: "PaymentAttempt"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "RiskPolicy"
    multiplicity: "ManyToOne"
- name: "ComplianceCheck"
  description: "Screening activity ensuring compliance with sanctions, KYC/KYB, AML,\
    \ and PEP requirements."
  data:
  - name: "checkType"
    type: "ComplianceCheckType"
  - name: "status"
    type: "ComplianceStatus"
  - name: "checkedDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "payer"
    type: "Payer"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
enums:
- name: "PaymentChannel"
  description: "Channel through which a payment is initiated."
  data:
  - name: "Ecommerce"
  - name: "POS"
  - name: "MobileApp"
  - name: "CallCenter"
- name: "PaymentStatus"
  description: "Lifecycle state of a payment order."
  data:
  - name: "Pending"
  - name: "Authorized"
  - name: "PartiallyCaptured"
  - name: "Captured"
  - name: "Cancelled"
  - name: "Failed"
- name: "PaymentIntentType"
  description: "Intent of the payment flow."
  data:
  - name: "Charge"
  - name: "Authorization"
  - name: "Setup"
- name: "CaptureMethod"
  description: "Strategy used to capture funds for a payment."
  data:
  - name: "Automatic"
  - name: "Manual"
- name: "PaymentMethodType"
  description: "Category of payment option presented at checkout."
  data:
  - name: "Card"
  - name: "BankTransfer"
  - name: "DirectDebit"
  - name: "Wallet"
  - name: "BuyNowPayLater"
  - name: "Voucher"
- name: "FundingInstrumentType"
  description: "Type of funding source used to pay."
  data:
  - name: "Card"
  - name: "BankAccount"
  - name: "Wallet"
- name: "InstrumentStatus"
  description: "Operational state of a funding instrument."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Expired"
  - name: "Suspended"
- name: "CardBrand"
  description: "Brand of the payment card."
  data:
  - name: "Visa"
  - name: "Mastercard"
  - name: "AmericanExpress"
  - name: "Discover"
  - name: "JCB"
  - name: "UnionPay"
  - name: "Maestro"
- name: "NetworkScheme"
  description: "Network or clearing scheme used to route the transaction."
  data:
  - name: "Visa"
  - name: "Mastercard"
  - name: "AmericanExpress"
  - name: "Discover"
  - name: "ACH"
  - name: "SEPA"
  - name: "FasterPayments"
  - name: "UPI"
  - name: "PIX"
- name: "WalletProvider"
  description: "Digital wallet service provider."
  data:
  - name: "ApplePay"
  - name: "GooglePay"
  - name: "PayPal"
- name: "TokenServiceProvider"
  description: "Service responsible for generating and managing payment tokens."
  data:
  - name: "NetworkTokenization"
  - name: "GatewayTokenization"
  - name: "Vault"
- name: "TokenStatus"
  description: "State of a tokenized funding instrument."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Deleted"
- name: "MandateStatus"
  description: "Lifecycle state of a mandate."
  data:
  - name: "Pending"
  - name: "Active"
  - name: "Suspended"
  - name: "Revoked"
  - name: "Expired"
- name: "DebitScheme"
  description: "Direct debit scheme used for mandate-based payments."
  data:
  - name: "SEPA"
  - name: "ACH"
  - name: "BACS"
  - name: "BECS"
  - name: "PAD"
- name: "AttemptStatus"
  description: "Processing state of a payment attempt."
  data:
  - name: "Pending"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Declined"
  - name: "Cancelled"
  - name: "Retried"
- name: "AuthenticationMethod"
  description: "Method used to authenticate the payer."
  data:
  - name: "None"
  - name: "ThreeDS1"
  - name: "ThreeDS2"
  - name: "OTP"
  - name: "Biometrics"
- name: "AuthorizationStatus"
  description: "Outcome and state of an authorization."
  data:
  - name: "Approved"
  - name: "Declined"
  - name: "Reversed"
  - name: "Expired"
  - name: "Pending"
- name: "CaptureStatus"
  description: "Outcome and state of a capture operation."
  data:
  - name: "Pending"
  - name: "Succeeded"
  - name: "PartiallyCaptured"
  - name: "Failed"
  - name: "Reversed"
- name: "RefundStatus"
  description: "Outcome and state of a refund operation."
  data:
  - name: "Pending"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Cancelled"
- name: "RefundReason"
  description: "Reason a refund was initiated."
  data:
  - name: "CustomerRequest"
  - name: "Fraud"
  - name: "Duplicate"
  - name: "ProductIssue"
  - name: "ServiceCancelled"
- name: "DisputeReason"
  description: "Reason code provided for a dispute."
  data:
  - name: "Fraud"
  - name: "NotRecognized"
  - name: "ProductNotReceived"
  - name: "ProductUnacceptable"
  - name: "CreditNotProcessed"
- name: "DisputeStatus"
  description: "Lifecycle state of a dispute case."
  data:
  - name: "Open"
  - name: "UnderReview"
