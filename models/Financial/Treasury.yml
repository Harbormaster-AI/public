---
metadata:
  name: "Treasury Capabilities Model"
  description: "Capability model describing corporate treasury operations including\
    \ cash, liquidity, risk, funding, and bank connectivity."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Financial"
  type: "Capability"
  domain: "Treasury"
entities:
- name: "TreasuryCenter"
  description: "Centralized function coordinating cash, liquidity, risk, and funding\
    \ activities across the enterprise."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "timeZone"
    type: "String"
  relations:
  - name: "bankAccounts"
    type: "BankAccount"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "TreasuryPolicy"
    multiplicity: "OneToMany"
  - name: "counterparties"
    type: "Counterparty"
    multiplicity: "ManyToMany"
  - name: "cashPools"
    type: "CashPool"
    multiplicity: "OneToMany"
  - name: "hedgingPrograms"
    type: "HedgeProgram"
    multiplicity: "OneToMany"
  - name: "paymentRuns"
    type: "PaymentBatch"
    multiplicity: "OneToMany"
  - name: "forecasts"
    type: "CashForecast"
    multiplicity: "OneToMany"
  - name: "liquidityPlans"
    type: "LiquidityPlan"
    multiplicity: "OneToMany"
- name: "TreasuryPolicy"
  description: "Governance rule defining how treasury manages risk, liquidity, investments,\
    \ and counterparties."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "TreasuryPolicyType"
  - name: "description"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  relations:
  - name: "treasuryCenter"
    type: "TreasuryCenter"
    multiplicity: "ManyToOne"
- name: "Bank"
  description: "Financial institution providing accounts, payments, market services,\
    \ and connectivity."
  data:
  - name: "name"
    type: "String"
  - name: "bic"
    type: "BIC"
  - name: "country"
    type: "String"
  relations:
  - name: "bankAccounts"
    type: "BankAccount"
    multiplicity: "OneToMany"
  - name: "communicationProfiles"
    type: "BankCommunicationProfile"
    multiplicity: "OneToMany"
  - name: "feeStatements"
    type: "BankFeeStatement"
    multiplicity: "OneToMany"
- name: "LegalEntity"
  description: "Company or subsidiary participating in treasury transactions and owning\
    \ bank accounts."
  data:
  - name: "name"
    type: "String"
  - name: "domicileCountry"
    type: "String"
  - name: "registrationNumber"
    type: "String"
  relations:
  - name: "bankAccounts"
    type: "BankAccount"
    multiplicity: "OneToMany"
  - name: "loansIssued"
    type: "IntercompanyLoan"
    multiplicity: "OneToMany"
  - name: "loansReceived"
    type: "IntercompanyLoan"
    multiplicity: "OneToMany"
  - name: "exposures"
    type: "Exposure"
    multiplicity: "OneToMany"
  - name: "treasuryDeals"
    type: "TreasuryDeal"
    multiplicity: "OneToMany"
- name: "BankAccount"
  description: "Deposit account used for collections, disbursements, and liquidity\
    \ management."
  data:
  - name: "accountName"
    type: "String"
  - name: "accountNumber"
    type: "AccountNumber"
  - name: "iban"
    type: "IBAN"
  - name: "currency"
    type: "String"
  - name: "accountType"
    type: "AccountType"
  - name: "bankCountry"
    type: "String"
  relations:
  - name: "bank"
    type: "Bank"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "LegalEntity"
    multiplicity: "ManyToOne"
  - name: "cashPositions"
    type: "CashPosition"
    multiplicity: "OneToMany"
  - name: "bankStatements"
    type: "BankStatement"
    multiplicity: "OneToMany"
  - name: "cashMovements"
    type: "CashMovement"
    multiplicity: "OneToMany"
  - name: "cashPools"
    type: "CashPool"
    multiplicity: "ManyToMany"
  - name: "reconciliations"
    type: "Reconciliation"
    multiplicity: "OneToMany"
- name: "BankStatement"
  description: "Statement of account activity as provided by a bank."
  data:
  - name: "statementDate"
    type: "Date"
  - name: "openingBalance"
    type: "Money"
  - name: "closingBalance"
    type: "Money"
  - name: "source"
    type: "String"
  relations:
  - name: "bankAccount"
    type: "BankAccount"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "BankStatementLine"
    multiplicity: "OneToMany"
  - name: "communicationProfile"
    type: "BankCommunicationProfile"
    multiplicity: "ManyToOne"
- name: "BankStatementLine"
  description: "Individual transaction line on a bank statement."
  data:
  - name: "valueDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "description"
    type: "String"
  - name: "code"
    type: "String"
  relations:
  - name: "bankStatement"
    type: "BankStatement"
    multiplicity: "ManyToOne"
  - name: "cashMovement"
    type: "CashMovement"
    multiplicity: "OneToOne"
- name: "CashPosition"
  description: "Daily view of opening, intraday, and closing balances for a bank account."
  data:
  - name: "positionDate"
    type: "Date"
  - name: "openingBalance"
    type: "Money"
  - name: "closingBalance"
    type: "Money"
  - name: "positionStatus"
    type: "CashPositionStatus"
  relations:
  - name: "bankAccount"
    type: "BankAccount"
    multiplicity: "ManyToOne"
  - name: "cashMovements"
    type: "CashMovement"
    multiplicity: "OneToMany"
- name: "CashMovement"
  description: "Posted cash event affecting account balance, including credits, debits,\
    \ and sweeps."
  data:
  - name: "valueDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "movementType"
    type: "CashMovementType"
  - name: "reference"
    type: "String"
  relations:
  - name: "bankAccount"
    type: "BankAccount"
    multiplicity: "ManyToOne"
  - name: "cashPosition"
    type: "CashPosition"
    multiplicity: "ManyToOne"
  - name: "paymentInstruction"
    type: "PaymentInstruction"
    multiplicity: "ManyToOne"
  - name: "treasuryDeal"
    type: "TreasuryDeal"
    multiplicity: "ManyToOne"
- name: "CashForecast"
  description: "Projection of future cash inflows and outflows over a defined horizon."
  data:
  - name: "forecastDate"
    type: "Date"
  - name: "horizon"
    type: "ForecastHorizon"
  - name: "methodology"
    type: "String"
  relations:
  - name: "lines"
    type: "CashForecastLine"
    multiplicity: "OneToMany"
  - name: "treasuryCenter"
    type: "TreasuryCenter"
    multiplicity: "ManyToOne"
- name: "CashForecastLine"
  description: "Forecasted cash item with date, amount, category, and certainty."
  data:
  - name: "expectedDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "certainty"
    type: "CertaintyLevel"
  - name: "category"
    type: "ForecastCategory"
  relations:
  - name: "forecast"
    type: "CashForecast"
    multiplicity: "ManyToOne"
  - name: "bankAccount"
    type: "BankAccount"
    multiplicity: "ManyToOne"
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "relatedDeal"
    type: "TreasuryDeal"
    multiplicity: "ManyToOne"
- name: "CashPool"
  description: "Structure used to optimize liquidity through physical or notional\
    \ concentration."
  data:
  - name: "name"
    type: "String"
  - name: "poolType"
    type: "CashPoolType"
  - name: "baseCurrency"
    type: "String"
  - name: "sweepType"
    type: "SweepType"
  relations:
  - name: "accounts"
    type: "BankAccount"
    multiplicity: "ManyToMany"
  - name: "headerAccount"
    type: "BankAccount"
    multiplicity: "ManyToOne"
  - name: "treasuryCenter"
    type: "TreasuryCenter"
    multiplicity: "ManyToOne"
  - name: "sweeps"
    type: "CashConcentrationSweep"
    multiplicity: "OneToMany"
- name: "CashConcentrationSweep"
  description: "Execution record of a concentration or notional offset event across\
    \ pooled accounts."
  data:
  - name: "sweepDate"
    type: "Date"
  - name: "status"
    type: "SweepStatus"
  - name: "totalAmount"
    type: "Money"
  relations:
  - name: "cashPool"
    type: "CashPool"
    multiplicity: "ManyToOne"
  - name: "movements"
    type: "CashMovement"
    multiplicity: "OneToMany"
- name: "Counterparty"
  description: "External or internal entity transacting with treasury in payments,\
    \ funding, or hedging."
  data:
  - name: "name"
    type: "String"
  - name: "counterpartyType"
    type: "CounterpartyType"
  - name: "creditRating"
    type: "String"
  - name: "domicileCountry"
    type: "String"
  relations:
  - name: "settlementInstructions"
    type: "SettlementInstruction"
    multiplicity: "OneToMany"
  - name: "deals"
    type: "TreasuryDeal"
    multiplicity: "OneToMany"
- name: "SettlementInstruction"
  description: "Standing beneficiary and bank details used to settle payments and\
    \ deals."
  data:
  - name: "instructionName"
    type: "String"
  - name: "beneficiaryName"
    type: "String"
  - name: "beneficiaryAccount"
    type: "IBAN"
  - name: "beneficiaryBankBIC"
    type: "BIC"
  - name: "currency"
    type: "String"
  relations:
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
- name: "TreasuryDeal"
  description: "Executed treasury transaction such as FX, interest rate, money market,\
    \ or debt instrument."
  data:
  - name: "tradeDate"
    type: "Date"
  - name: "valueDate"
    type: "Date"
  - name: "maturityDate"
    type: "Date"
  - name: "instrumentType"
    type: "InstrumentType"
  - name: "direction"
    type: "BuySell"
  - name: "notional"
    type: "Money"
  - name: "price"
    type: "Decimal"
  - name: "rate"
    type: "Percentage"
  - name: "status"
    type: "DealStatus"
  - name: "reference"
    type: "String"
  - name: "currencyPair"
    type: "CurrencyPair"
  relations:
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "settlementInstruction"
    type: "SettlementInstruction"
    multiplicity: "ManyToOne"
  - name: "legalEntity"
    type: "LegalEntity"
    multiplicity: "ManyToOne"
  - name: "confirmations"
    type: "Confirmation"
    multiplicity: "OneToMany"
  - name: "settlements"
    type: "Settlement"
    multiplicity: "OneToMany"
  - name: "valuations"
    type: "Valuation"
    multiplicity: "OneToMany"
- name: "Exposure"
  description: "Measured risk position subject to hedging, such as FX, interest rate,\
    \ or liquidity exposure."
  data:
  - name: "exposureDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "exposureType"
    type: "ExposureType"
  - name: "description"
    type: "String"
  relations:
  - name: "legalEntity"
    type: "LegalEntity"
    multiplicity: "ManyToOne"
  - name: "hedgeRelationships"
    type: "HedgeRelationship"
    multiplicity: "ManyToMany"
- name: "HedgeProgram"
  description: "Structured initiative defining objectives, scope, and rules for risk\
    \ hedging."
  data:
  - name: "name"
    type: "String"
  - name: "programType"
    type: "HedgeProgramType"
  - name: "strategy"
    type: "String"
  - name: "objective"
    type: "String"
  relations:
  - name: "treasuryCenter"
    type: "TreasuryCenter"
    multiplicity: "ManyToOne"
  - name: "hedgeRelationships"
    type: "HedgeRelationship"
    multiplicity: "OneToMany"
  - name: "riskLimits"
    type: "RiskLimit"
    multiplicity: "OneToMany"
- name: "HedgeRelationship"
  description: "Linkage between designated hedging instruments and underlying exposures."
  data:
  - name: "designation"
    type: "HedgeDesignation"
  - name: "effectivenessMethod"
    type: "EffectivenessMethod"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "hedgeProgram"
    type: "HedgeProgram"
    multiplicity: "ManyToOne"
  - name: "exposures"
    type: "Exposure"
    multiplicity: "ManyToMany"
  - name: "hedgeInstruments"
    type: "TreasuryDeal"
    multiplicity: "OneToMany"
- name: "RiskLimit"
  description: "Quantitative constraint used to control exposure, concentration, or\
    \ loss."
  data:
  - name: "name"
    type: "String"
  - name: "limitType"
    type: "RiskLimitType"
  - name: "limitValue"
    type: "Decimal"
  - name: "unit"
    type: "LimitUnit"
  - name: "description"
    type: "String"
  relations:
  - name: "hedgeProgram"
    type: "HedgeProgram"
    multiplicity: "ManyToOne"
  - name: "breaches"
    type: "LimitBreach"
    multiplicity: "OneToMany"
- name: "LimitBreach"
  description: "Event indicating a limit has been exceeded or violated."
  data:
  - name: "breachDate"
    type: "Date"
  - name: "severity"
    type: "SeverityLevel"
  - name: "description"
    type: "String"
  relations:
  - name: "riskLimit"
    type: "RiskLimit"
    multiplicity: "ManyToOne"
- name: "DebtFacility"
  description: "Agreement providing committed or uncommitted borrowing capacity."
  data:
  - name: "facilityName"
    type: "String"
  - name: "facilityType"
    type: "DebtFacilityType"
  - name: "limitAmount"
    type: "Money"
  - name: "baseRate"
    type: "String"
  - name: "spread"
    type: "Percentage"
  - name: "startDate"
    type: "Date"
  - name: "maturityDate"
    type: "Date"
  relations:
  - name: "lender"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "borrower"
    type: "LegalEntity"
    multiplicity: "ManyToOne"
  - name: "drawdowns"
    type: "DebtDrawdown"
    multiplicity: "OneToMany"
  - name: "covenants"
    type: "Covenant"
    multiplicity: "OneToMany"
- name: "DebtDrawdown"
  description: "Borrowing event under a facility with associated interest accruals\
    \ and repayments."
  data:
  - name: "drawdownDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "currentBalance"
    type: "Money"
  - name: "rate"
    type: "Decimal"
  - name: "interestBasis"
    type: "DayCountConvention"
  - name: "maturityDate"
    type: "Date"
  relations:
  - name: "facility"
    type: "DebtFacility"
    multiplicity: "ManyToOne"
  - name: "relatedDeal"
    type: "TreasuryDeal"
    multiplicity: "ManyToOne"
  - name: "interestSchedules"
    type: "InterestSchedule"
    multiplicity: "OneToMany"
- name: "InterestSchedule"
  description: "Calculated interest period and payment for a borrowing."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "paymentDate"
    type: "Date"
  - name: "accrualDays"
    type: "Integer"
  - name: "interestAmount"
    type: "Money"
  - name: "status"
    type: "AccrualStatus"
  relations:
  - name: "drawdown"
    type: "DebtDrawdown"
    multiplicity: "ManyToOne"
- name: "Covenant"
  description: "Measurable financial condition or ratio required by a lending agreement."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "threshold"
    type: "Decimal"
  - name: "unit"
    type: "LimitUnit"
  relations:
  - name: "facility"
    type: "DebtFacility"
    multiplicity: "ManyToOne"
- name: "Investment"
  description: "Short-term placement of surplus cash in approved instruments."
  data:
  - name: "investmentDate"
    type: "Date"
  - name: "maturityDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "rate"
    type: "Decimal"
  - name: "instrumentType"
    type: "InvestmentInstrumentType"
  relations:
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "legalEntity"
    type: "LegalEntity"
    multiplicity: "ManyToOne"
  - name: "deal"
    type: "TreasuryDeal"
    multiplicity: "ManyToOne"
- name: "IntercompanyLoan"
  description: "Internal funding arrangement between related legal entities."
  data:
  - name: "loanName"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "maturityDate"
    type: "Date"
  - name: "principal"
    type: "Money"
  - name: "rateType"
    type: "RateType"
  - name: "spread"
    type: "Percentage"
  relations:
  - name: "lender"
    type: "LegalEntity"
    multiplicity: "ManyToOne"
  - name: "borrower"
    type: "LegalEntity"
    multiplicity: "ManyToOne"
  - name: "schedules"
    type: "IntercompanyLoanSchedule"
    multiplicity: "OneToMany"
- name: "IntercompanyLoanSchedule"
  description: "Amortization and interest timetable for an intercompany loan."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "paymentDate"
    type: "Date"
  - name: "principalDue"
    type: "Money"
  - name: "interestDue"
    type: "Money"
  - name: "status"
    type: "ScheduleStatus"
  relations:
  - name: "loan"
    type: "IntercompanyLoan"
    multiplicity: "ManyToOne"
- name: "PaymentInstruction"
  description: "Structured order to pay a beneficiary according to settlement instructions."
  data:
  - name: "instructionDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "paymentType"
    type: "PaymentType"
  - name: "status"
    type: "PaymentStatus"
  - name: "purposeCode"
    type: "String"
  - name: "endToEndId"
    type: "String"
  relations:
  - name: "debtorAccount"
    type: "BankAccount"
    multiplicity: "ManyToOne"
  - name: "creditor"
    type: "Counterparty"
    multiplicity: "ManyToOne"
  - name: "settlementInstruction"
    type: "SettlementInstruction"
    multiplicity: "ManyToOne"
  - name: "paymentBatch"
    type: "PaymentBatch"
    multiplicity: "ManyToOne"
  - name: "relatedDeal"
    type: "TreasuryDeal"
    multiplicity: "ManyToOne"
  - name: "cashMovement"
    type: "CashMovement"
    multiplicity: "OneToOne"
- name: "PaymentBatch"
  description: "Grouped set of payment instructions prepared for transmission to a\
    \ bank."
  data:
  - name: "batchReference"
    type: "String"
  - name: "creationDate"
    type: "Date"
  - name: "status"
    type: "PaymentBatchStatus"
  - name: "channel"
    type: "BankChannel"
  relations:
  - name: "paymentInstructions"
    type: "PaymentInstruction"
    multiplicity: "OneToMany"
  - name: "treasuryCenter"
    type: "TreasuryCenter"
    multiplicity: "ManyToOne"
  - name: "bankCommunicationProfile"
    type: "BankCommunicationProfile"
    multiplicity: "ManyToOne"
- name: "BankCommunicationProfile"
  description: "Connectivity and security configuration for bank file and message\
    \ exchanges."
  data:
  - name: "profileName"
    type: "String"
  - name: "protocol"
    type: "BankProtocol"
  - name: "endpoint"
    type: "String"
  - name: "encryptionMethod"
    type: "String"
  relations:
  - name: "bank"
    type: "Bank"
    multiplicity: "ManyToOne"
  - name: "paymentBatches"
    type: "PaymentBatch"
    multiplicity: "OneToMany"
  - name: "bankStatements"
    type: "BankStatement"
    multiplicity: "OneToMany"
- name: "Confirmation"
  description: "Affirmation of deal terms exchanged between counterparties."
  data:
  - name: "confirmationDate"
    type: "Date"
  - name: "method"
    type: "ConfirmationMethod"
  - name: "status"
    type: "ConfirmationStatus"
  - name: "reference"
    type: "String"
  relations:
  - name: "deal"
    type: "TreasuryDeal"
    multiplicity: "ManyToOne"
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
- name: "Settlement"
  description: "Completion record of cash or security movement for a treasury deal."
  data:
  - name: "settlementDate"
    type: "Date"
  - name: "status"
    type: "SettlementStatus"
  - name: "amount"
    type: "Money"
  - name: "fees"
    type: "Money"
  relations:
  - name: "deal"
    type: "TreasuryDeal"
    multiplicity: "ManyToOne"
  - name: "paymentInstruction"
    type: "PaymentInstruction"
    multiplicity: "ManyToOne"
  - name: "counterparty"
    type: "Counterparty"
    multiplicity: "ManyToOne"
- name: "Valuation"
  description: "Measurement of fair value and NPV for a treasury instrument."
  data:
  - name: "valuationDate"
    type: "Date"
  - name: "fairValue"
    type: "Money"
  - name: "npv"
    type: "Money"
  - name: "methodology"
    type: "String"
  relations:
  - name: "deal"
    type: "TreasuryDeal"
    multiplicity: "ManyToOne"
  - name: "marketDataSnapshot"
    type: "MarketDataSnapshot"
    multiplicity: "ManyToOne"
- name: "MarketDataSnapshot"
  description: "Time-stamped set of market observations used for pricing and risk."
  data:
  - name: "asOf"
    type: "Date"
  - name: "source"
    type: "String"
  relations:
  - name: "quotes"
    type: "MarketQuote"
    multiplicity: "OneToMany"
- name: "MarketQuote"
  description: "Single market data point such as rate, price, or volatility."
  data:
  - name: "instrument"
    type: "String"
  - name: "quoteType"
    type: "QuoteType"
  - name: "value"
    type: "Decimal"
  - name: "currency"
    type: "String"
  - name: "tenor"
    type: "Tenor"
  relations:
  - name: "snapshot"
    type: "MarketDataSnapshot"
    multiplicity: "ManyToOne"
- name: "BankFeeStatement"
  description: "Billing statement from a bank detailing service charges."
  data:
  - name: "statementDate"
    type: "Date"
  - name: "totalFees"
    type: "Money"
  - name: "currency"
    type: "String"
  relations:
  - name: "bank"
    type: "Bank"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "BankFeeLine"
    multiplicity: "OneToMany"
- name: "BankFeeLine"
  description: "Itemized bank service charge with associated account allocation."
  data:
  - name: "feeCode"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "serviceDescription"
    type: "String"
  relations:
  - name: "feeStatement"
    type: "BankFeeStatement"
    multiplicity: "ManyToOne"
  - name: "bankAccount"
