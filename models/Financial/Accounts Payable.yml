---
metadata:
  name: "Accounts Payable Capabilities Model"
  description: "A domain capability model for managing supplier obligations, invoices,\
    \ matching, holds, approvals, and outbound payments within Accounts Payable."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Financial"
  type: "Capability"
  domain: "Accounts Payable"
entities:
- name: "AccountingEntity"
  description: "Organizational legal entity for which payables are recorded, approved,\
    \ and paid."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "reportingCurrency"
    type: "String"
  - name: "country"
    type: "String"
  - name: "fiscalYearStartMonth"
    type: "Integer"
  relations:
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "OneToMany"
  - name: "paymentTerms"
    type: "PaymentTerm"
    multiplicity: "OneToMany"
  - name: "taxCodes"
    type: "TaxCode"
    multiplicity: "OneToMany"
  - name: "exchangeRates"
    type: "ExchangeRate"
    multiplicity: "OneToMany"
  - name: "companyBankAccounts"
    type: "CompanyBankAccount"
    multiplicity: "OneToMany"
  - name: "purchaseOrders"
    type: "PurchaseOrder"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "APInvoice"
    multiplicity: "OneToMany"
  - name: "paymentBatches"
    type: "PaymentBatch"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
- name: "Supplier"
  description: "External party to whom the organization owes money for goods or services\
    \ received."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "supplierType"
    type: "SupplierType"
  - name: "status"
    type: "SupplierStatus"
  - name: "taxRegistrationNumber"
    type: "String"
  - name: "preferredPaymentMethod"
    type: "PaymentMethodType"
  - name: "primaryCurrency"
    type: "String"
  - name: "contactEmail"
    type: "String"
  - name: "contactPhone"
    type: "String"
  - name: "remittanceAddress"
    type: "Address"
  - name: "requiresWithholding"
    type: "Boolean"
  relations:
  - name: "accountingEntity"
    type: "AccountingEntity"
    multiplicity: "ManyToOne"
  - name: "paymentTerm"
    type: "PaymentTerm"
    multiplicity: "ManyToOne"
  - name: "bankAccounts"
    type: "SupplierBankAccount"
    multiplicity: "OneToMany"
  - name: "contacts"
    type: "SupplierContact"
    multiplicity: "OneToMany"
  - name: "purchaseOrders"
    type: "PurchaseOrder"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "APInvoice"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "withholdingCertificates"
    type: "WithholdingCertificate"
    multiplicity: "OneToMany"
- name: "SupplierContact"
  description: "Named point of contact at a supplier for invoicing and payment communications."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "role"
    type: "String"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
- name: "SupplierBankAccount"
  description: "Supplier-owned bank account details used for disbursements."
  data:
  - name: "accountHolderName"
    type: "String"
  - name: "details"
    type: "BankAccountDetails"
  - name: "currency"
    type: "String"
  - name: "isPrimary"
    type: "Boolean"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "bank"
    type: "Bank"
    multiplicity: "ManyToOne"
- name: "Bank"
  description: "Financial institution used for supplier and company settlement accounts."
  data:
  - name: "name"
    type: "String"
  - name: "swiftBic"
    type: "String"
  - name: "country"
    type: "String"
  - name: "routingScheme"
    type: "String"
  relations:
  - name: "supplierAccounts"
    type: "SupplierBankAccount"
    multiplicity: "OneToMany"
  - name: "companyAccounts"
    type: "CompanyBankAccount"
    multiplicity: "OneToMany"
- name: "CompanyBankAccount"
  description: "Organization-owned bank account used to fund AP disbursements."
  data:
  - name: "accountName"
    type: "String"
  - name: "details"
    type: "BankAccountDetails"
  - name: "currency"
    type: "String"
  - name: "isDisbursementAccount"
    type: "Boolean"
  relations:
  - name: "bank"
    type: "Bank"
    multiplicity: "ManyToOne"
  - name: "accountingEntity"
    type: "AccountingEntity"
    multiplicity: "ManyToOne"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "paymentBatches"
    type: "PaymentBatch"
    multiplicity: "OneToMany"
- name: "PaymentTerm"
  description: "Commercial terms defining invoice due dates and early payment discounts."
  data:
  - name: "name"
    type: "String"
  - name: "netDays"
    type: "Integer"
  - name: "discountPercentage"
    type: "Decimal"
  - name: "discountDays"
    type: "Integer"
  - name: "endOfMonth"
    type: "Boolean"
  relations:
  - name: "accountingEntity"
    type: "AccountingEntity"
    multiplicity: "ManyToOne"
  - name: "suppliers"
    type: "Supplier"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "APInvoice"
    multiplicity: "OneToMany"
- name: "TaxCode"
  description: "Tax configuration used to calculate indirect and withholding taxes\
    \ on payables."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "taxRate"
    type: "Decimal"
  - name: "taxType"
    type: "TaxType"
  - name: "jurisdiction"
    type: "String"
  - name: "isWithholding"
    type: "Boolean"
  relations:
  - name: "accountingEntity"
    type: "AccountingEntity"
    multiplicity: "ManyToOne"
  - name: "invoiceTaxLines"
    type: "InvoiceTaxLine"
    multiplicity: "OneToMany"
  - name: "purchaseOrderLines"
    type: "PurchaseOrderLine"
    multiplicity: "OneToMany"
  - name: "invoiceLines"
    type: "APInvoiceLine"
    multiplicity: "OneToMany"
- name: "ExchangeRate"
  description: "Currency conversion rate used to translate foreign currency invoices\
    \ and payments."
  data:
  - name: "fromCurrency"
    type: "String"
  - name: "toCurrency"
    type: "String"
  - name: "rate"
    type: "Decimal"
  - name: "rateDate"
    type: "Date"
  - name: "rateType"
    type: "ExchangeRateType"
  relations:
  - name: "accountingEntity"
    type: "AccountingEntity"
    multiplicity: "ManyToOne"
- name: "PurchaseOrder"
  description: "Commercial commitment used for matching supplier invoices prior to\
    \ payment."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "orderDate"
    type: "Date"
  - name: "currency"
    type: "String"
  - name: "totalAmount"
    type: "Money"
  - name: "status"
    type: "PurchaseOrderStatus"
  relations:
  - name: "accountingEntity"
    type: "AccountingEntity"
    multiplicity: "ManyToOne"
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "PurchaseOrderLine"
    multiplicity: "OneToMany"
  - name: "receipts"
    type: "Receipt"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "APInvoice"
    multiplicity: "OneToMany"
- name: "PurchaseOrderLine"
  description: "Line-level detail of ordered items or services including expected\
    \ pricing and tax treatment."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "unitPrice"
    type: "Money"
  - name: "uom"
    type: "String"
  - name: "glAccountCode"
    type: "String"
  relations:
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "taxCode"
    type: "TaxCode"
    multiplicity: "ManyToOne"
- name: "Receipt"
  description: "Confirmation that ordered goods or services were received for matching\
    \ against invoices."
  data:
  - name: "receiptNumber"
    type: "String"
  - name: "receiptDate"
    type: "Date"
  - name: "quantityReceived"
    type: "Decimal"
  - name: "status"
    type: "ReceiptStatus"
  relations:
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "purchaseOrderLine"
    type: "PurchaseOrderLine"
    multiplicity: "ManyToOne"
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
- name: "APInvoice"
  description: "Supplier bill representing an obligation to pay for goods or services\
    \ received."
  data:
  - name: "invoiceNumber"
    type: "String"
  - name: "invoiceDate"
    type: "Date"
  - name: "invoiceType"
    type: "InvoiceType"
  - name: "description"
    type: "String"
  - name: "currency"
    type: "String"
  - name: "invoiceAmount"
    type: "Money"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "InvoiceStatus"
  - name: "matchStatus"
    type: "MatchStatus"
  relations:
  - name: "accountingEntity"
    type: "AccountingEntity"
    multiplicity: "ManyToOne"
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "paymentTerm"
    type: "PaymentTerm"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "APInvoiceLine"
    multiplicity: "OneToMany"
  - name: "taxLines"
    type: "InvoiceTaxLine"
    multiplicity: "OneToMany"
  - name: "distributions"
    type: "DistributionLine"
    multiplicity: "OneToMany"
  - name: "receipts"
    type: "Receipt"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "InvoiceApproval"
    multiplicity: "OneToMany"
  - name: "holds"
    type: "InvoiceHold"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "ManyToMany"
  - name: "paymentBatches"
    type: "PaymentBatch"
    multiplicity: "ManyToMany"
- name: "APInvoiceLine"
  description: "Line-level invoice detail for items, services, freight, or other charges."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "unitPrice"
    type: "Money"
  - name: "lineAmount"
    type: "Money"
  - name: "lineType"
    type: "InvoiceLineType"
  relations:
  - name: "invoice"
    type: "APInvoice"
    multiplicity: "ManyToOne"
  - name: "purchaseOrderLine"
    type: "PurchaseOrderLine"
    multiplicity: "ManyToOne"
  - name: "receipt"
    type: "Receipt"
    multiplicity: "ManyToOne"
  - name: "taxCode"
    type: "TaxCode"
    multiplicity: "ManyToOne"
- name: "InvoiceTaxLine"
  description: "Calculated or entered tax components applied to an invoice or invoice\
    \ line."
  data:
  - name: "taxBaseAmount"
    type: "Money"
  - name: "taxAmount"
    type: "Money"
  relations:
  - name: "invoice"
    type: "APInvoice"
    multiplicity: "ManyToOne"
  - name: "invoiceLine"
    type: "APInvoiceLine"
    multiplicity: "ManyToOne"
  - name: "taxCode"
    type: "TaxCode"
    multiplicity: "ManyToOne"
- name: "DistributionLine"
  description: "Accounting allocation of invoice amounts to general ledger accounts\
    \ and cost objects."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "amount"
    type: "Money"
  - name: "glAccountCode"
    type: "String"
  - name: "costCenter"
    type: "String"
  - name: "projectCode"
    type: "String"
  relations:
  - name: "invoice"
    type: "APInvoice"
    multiplicity: "ManyToOne"
- name: "InvoiceApproval"
  description: "Approval record documenting authorization of an invoice for payment."
  data:
  - name: "approvalStatus"
    type: "ApprovalStatus"
  - name: "approverRole"
    type: "String"
  - name: "approvedAt"
    type: "Date"
  relations:
  - name: "invoice"
    type: "APInvoice"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "InvoiceHold"
  description: "Temporary block preventing invoice payment until a specific issue\
    \ is resolved."
  data:
  - name: "holdReason"
    type: "HoldReason"
  - name: "notes"
    type: "String"
  - name: "placedAt"
    type: "Date"
  - name: "releasedAt"
    type: "Date"
  - name: "status"
    type: "HoldStatus"
  relations:
  - name: "invoice"
    type: "APInvoice"
    multiplicity: "ManyToOne"
  - name: "placedBy"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "MatchingResult"
  description: "Outcome of two-way or three-way matching between invoice, purchase\
    \ order, and receipts."
  data:
  - name: "matchLevel"
    type: "MatchLevel"
  - name: "matchedQuantity"
    type: "Decimal"
  - name: "matchedAmount"
    type: "Money"
  - name: "variances"
    type: "String"
  - name: "status"
    type: "MatchStatus"
  relations:
  - name: "invoice"
    type: "APInvoice"
    multiplicity: "ManyToOne"
  - name: "purchaseOrder"
    type: "PurchaseOrder"
    multiplicity: "ManyToOne"
  - name: "receipt"
    type: "Receipt"
    multiplicity: "ManyToOne"
- name: "Employee"
  description: "Internal user participating in invoice approval and hold management."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "department"
    type: "String"
  relations:
  - name: "approvals"
    type: "InvoiceApproval"
    multiplicity: "OneToMany"
  - name: "holds"
    type: "InvoiceHold"
    multiplicity: "OneToMany"
- name: "PaymentBatch"
  description: "Grouping of approved invoices scheduled for payment on a specific\
    \ date and method."
  data:
  - name: "batchReference"
    type: "String"
  - name: "paymentDate"
    type: "Date"
  - name: "totalAmount"
    type: "Money"
  - name: "status"
    type: "PaymentBatchStatus"
  - name: "paymentMethod"
    type: "PaymentMethodType"
  relations:
  - name: "accountingEntity"
    type: "AccountingEntity"
    multiplicity: "ManyToOne"
  - name: "invoices"
    type: "APInvoice"
    multiplicity: "ManyToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "companyBankAccount"
    type: "CompanyBankAccount"
    multiplicity: "ManyToOne"
  - name: "paymentFile"
    type: "PaymentFile"
    multiplicity: "OneToOne"
- name: "Payment"
  description: "Monetary disbursement to a supplier, settling one or more approved\
    \ invoices."
  data:
  - name: "paymentReference"
    type: "String"
  - name: "paymentDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "PaymentStatus"
  - name: "method"
    type: "PaymentMethodType"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "invoices"
    type: "APInvoice"
    multiplicity: "ManyToMany"
  - name: "paymentBatch"
    type: "PaymentBatch"
    multiplicity: "ManyToOne"
  - name: "companyBankAccount"
    type: "CompanyBankAccount"
    multiplicity: "ManyToOne"
  - name: "remittanceAdvice"
    type: "RemittanceAdvice"
    multiplicity: "OneToOne"
- name: "PaymentFile"
  description: "Generated file containing payment instructions for transmission to\
    \ a bank."
  data:
  - name: "fileFormat"
    type: "PaymentFileFormat"
  - name: "generatedAt"
    type: "Date"
  - name: "contentHash"
    type: "String"
  relations:
  - name: "paymentBatch"
    type: "PaymentBatch"
    multiplicity: "OneToOne"
- name: "RemittanceAdvice"
  description: "Communication to the supplier detailing invoices and amounts included\
    \ in a payment."
  data:
  - name: "sentAt"
    type: "Date"
  - name: "deliveryMethod"
    type: "RemittanceDeliveryMethod"
  - name: "message"
    type: "String"
  relations:
  - name: "payment"
    type: "Payment"
    multiplicity: "OneToOne"
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "invoices"
    type: "APInvoice"
    multiplicity: "ManyToMany"
- name: "WithholdingCertificate"
  description: "Document defining supplier-specific withholding tax rates and validity."
  data:
  - name: "certificateNumber"
    type: "String"
  - name: "withholdingRate"
    type: "Decimal"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "jurisdiction"
    type: "String"
  relations:
  - name: "supplier"
    type: "Supplier"
    multiplicity: "ManyToOne"
  - name: "applicableTaxCodes"
    type: "TaxCode"
    multiplicity: "ManyToMany"
enums:
- name: "SupplierType"
  description: "Classification of the supplier’s legal and operational nature."
  data:
  - name: "Individual"
  - name: "Company"
  - name: "Government"
  - name: "NonProfit"
- name: "SupplierStatus"
  description: "Lifecycle state controlling whether invoices and payments are permitted."
  data:
  - name: "Active"
  - name: "OnHold"
  - name: "Inactive"
- name: "InvoiceType"
  description: "Category of supplier billing document."
  data:
  - name: "Standard"
  - name: "CreditMemo"
  - name: "DebitMemo"
  - name: "Prepayment"
  - name: "Expense"
- name: "InvoiceStatus"
  description: "Processing state of an AP invoice."
  data:
  - name: "Draft"
  - name: "PendingApproval"
  - name: "Approved"
  - name: "OnHold"
  - name: "ScheduledForPayment"
  - name: "PartiallyPaid"
  - name: "Paid"
  - name: "Cancelled"
- name: "InvoiceLineType"
  description: "Nature of the cost represented by an invoice line."
  data:
  - name: "Item"
  - name: "Service"
  - name: "Freight"
  - name: "Tax"
  - name: "Misc"
- name: "MatchStatus"
  description: "Result of matching invoice details to purchase orders and receipts."
  data:
  - name: "NotMatched"
  - name: "PartiallyMatched"
  - name: "Matched"
  - name: "Exception"
- name: "MatchLevel"
  description: "Degree of control applied during invoice matching."
  data:
  - name: "TwoWay"
  - name: "ThreeWay"
- name: "PurchaseOrderStatus"
  description: "Lifecycle state of a purchase order in relation to AP processes."
  data:
  - name: "Draft"
  - name: "Approved"
  - name: "Open"
  - name: "Closed"
  - name: "Cancelled"
- name: "ReceiptStatus"
  description: "Status of goods or services acknowledgment used in matching."
  data:
  - name: "Pending"
  - name: "Received"
  - name: "Rejected"
- name: "ApprovalStatus"
  description: "Decision outcome for an invoice approval step."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
  - name: "Escalated"
- name: "HoldReason"
  description: "Business reason explaining why an invoice is placed on hold."
  data:
  - name: "MissingPO"
  - name: "PriceVariance"
  - name: "QuantityVariance"
  - name: "TaxIssue"
  - name: "SupplierOnHold"
  - name: "DuplicateInvoice"
  - name: "ComplianceReview"
  - name: "MissingReceipt"
- name: "HoldStatus"
  description: "State of an invoice hold."
  data:
  - name: "Active"
  - name: "Released"
- name: "PaymentMethodType"
  description: "Mechanism by which funds are disbursed to suppliers."
  data:
  - name: "ACH"
  - name: "Wire"
  - name: "Check"
  - name: "SEPA"
  - name: "BACS"
  - name: "Cash"
  - name: "Card"
  - name: "VirtualCard"
- name: "PaymentStatus"
  description: "Processing state of a payment transaction."
  data:
  - name: "Proposed"
  - name: "InProcess"
  - name: "Sent"
  - name: "Reconciled"
  - name: "Failed"
  - name: "Cancelled"
- name: "PaymentBatchStatus"
  description: "Lifecycle of a group of payments prepared for disbursement."
  data:
  - name: "Draft"
  - name: "Approved"
  - name: "Exported"
  - name: "Disbursed"
  - name: "Reconciled"
  - name: "Cancelled"
- name: "PaymentFileFormat"
  description: "Standard used to encode payment instructions for the bank."
  data:
  - name: "ISO20022_PAIN_001"
  - name: "NACHA"
  - name: "SEPA_XML"
  - name: "BACS_Standard18"
  - name: "CSV"
  - name: "Custom"
- name: "RemittanceDeliveryMethod"
  description: "Channel used to deliver remittance advice to suppliers."
  data:
  - name: "Email"
  - name: "Portal"
  - name: "Paper"
  - name: "EDI"
- name: "TaxType"
  description: "Classification of tax calculated or withheld on payables."
  data:
  - name: "VAT"
  - name: "GST"
  - name: "SalesTax"
  - name: "Withholding"
  - name: "ServiceTax"
  - name: "ImportDuty"
- name: "ExchangeRateType"
  description: "Methodology governing how currency conversion rates are determined."
  data:
  - name: "Spot"
  - name: "Corporate"
  - name: "Historical"
  - name: "Contract"
valueObjects:
- name: "Money"
  description: "Monetary value paired with an ISO currency code."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address used for remittances and supplier correspondence."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "BankAccountDetails"
  description: "Structured bank account identifiers necessary for electronic and check\
    \ payments."
  data:
  - name: "accountNumber"
    type: "String"
  - name: "routingNumber"
    type: "String"
  - name: "iban"
    type: "String"
  - name: "swiftBic"
    type: "String"
