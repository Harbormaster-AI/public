---
metadata:
  name: "HCIDL Capabilities Model - Tax Management"
  description: "Canonical capability model for managing tax jurisdictions, registrations,\
    \ calculations, filings, assessments, payments, and audit processes across direct\
    \ and indirect tax domains."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Financial"
  type: "Capability"
  domain: "Tax Management"
entities:
- name: "TaxAuthority"
  description: "Government body empowered to administer and collect taxes for one\
    \ or more jurisdictions."
  data:
  - name: "name"
    type: "String"
  - name: "jurisdictionLevel"
    type: "JurisdictionLevel"
  - name: "contactWebsite"
    type: "String"
  - name: "contactEmail"
    type: "String"
  relations:
  - name: "taxJurisdictions"
    type: "TaxJurisdiction"
    multiplicity: "OneToMany"
  - name: "taxRates"
    type: "TaxRate"
    multiplicity: "OneToMany"
  - name: "taxRules"
    type: "TaxRule"
    multiplicity: "OneToMany"
- name: "TaxJurisdiction"
  description: "Geographical or legal area where specific tax laws, rates, and rules\
    \ apply."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "jurisdictionLevel"
    type: "JurisdictionLevel"
  - name: "country"
    type: "String"
  - name: "region"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "authority"
    type: "TaxAuthority"
    multiplicity: "ManyToOne"
  - name: "taxRates"
    type: "TaxRate"
    multiplicity: "OneToMany"
  - name: "registrations"
    type: "TaxRegistration"
    multiplicity: "OneToMany"
  - name: "returns"
    type: "TaxReturn"
    multiplicity: "OneToMany"
  - name: "filingChannels"
    type: "FilingChannel"
    multiplicity: "ManyToMany"
- name: "Taxpayer"
  description: "Individual or organization subject to tax obligations and entitled\
    \ to file returns or make payments."
  data:
  - name: "legalName"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "taxpayerType"
    type: "TaxpayerType"
  - name: "residencyCountry"
    type: "String"
  - name: "primaryAddress"
    type: "Address"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  relations:
  - name: "registrations"
    type: "TaxRegistration"
    multiplicity: "OneToMany"
  - name: "returns"
    type: "TaxReturn"
    multiplicity: "OneToMany"
  - name: "obligations"
    type: "TaxObligation"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "TaxPayment"
    multiplicity: "OneToMany"
  - name: "auditCases"
    type: "AuditCase"
    multiplicity: "OneToMany"
  - name: "withholdingCertificates"
    type: "WithholdingCertificate"
    multiplicity: "OneToMany"
- name: "TaxRegistration"
  description: "Enrollment record establishing a taxpayer’s authority and responsibility\
    \ to collect, report, and remit a specific tax in a jurisdiction."
  data:
  - name: "identifier"
    type: "TaxIdentifier"
  - name: "registrationType"
    type: "TaxRegistrationType"
  - name: "status"
    type: "RegistrationStatus"
  - name: "registrationDate"
    type: "Date"
  - name: "deregistrationDate"
    type: "Date"
  - name: "filingFrequency"
    type: "FilingFrequency"
  relations:
  - name: "taxpayer"
    type: "Taxpayer"
    multiplicity: "ManyToOne"
  - name: "jurisdiction"
    type: "TaxJurisdiction"
    multiplicity: "ManyToOne"
  - name: "exemptionCertificates"
    type: "ExemptionCertificate"
    multiplicity: "OneToMany"
  - name: "returns"
    type: "TaxReturn"
    multiplicity: "OneToMany"
  - name: "filingSchedules"
    type: "FilingSchedule"
    multiplicity: "OneToMany"
- name: "ExemptionCertificate"
  description: "Document granting relief from specific tax obligations, such as resale\
    \ or manufacturing exemptions."
  data:
  - name: "certificateNumber"
    type: "String"
  - name: "exemptionType"
    type: "ExemptionType"
  - name: "issueDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "status"
    type: "ExemptionStatus"
  relations:
  - name: "registration"
    type: "TaxRegistration"
    multiplicity: "ManyToOne"
  - name: "jurisdiction"
    type: "TaxJurisdiction"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "TaxRule"
    multiplicity: "ManyToMany"
- name: "WithholdingCertificate"
  description: "Instructional document defining withholding elections for payroll\
    \ or vendor payments within a jurisdiction."
  data:
  - name: "certificateNumber"
    type: "String"
  - name: "withholdingType"
    type: "WithholdingType"
  - name: "issueDate"
    type: "Date"
  - name: "allowances"
    type: "Integer"
  - name: "additionalWithholding"
    type: "Money"
  - name: "status"
    type: "CertificateStatus"
  relations:
  - name: "taxpayer"
    type: "Taxpayer"
    multiplicity: "ManyToOne"
  - name: "jurisdiction"
    type: "TaxJurisdiction"
    multiplicity: "ManyToOne"
- name: "FilingSchedule"
  description: "Prescribed cadence and rules for when returns or remittances are due\
    \ for a registration."
  data:
  - name: "frequency"
    type: "FilingFrequency"
  - name: "firstDueDate"
    type: "Date"
  - name: "graceDays"
    type: "Integer"
  - name: "isElectronicOnly"
    type: "Boolean"
  relations:
  - name: "registration"
    type: "TaxRegistration"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "FilingChannel"
    multiplicity: "ManyToOne"
- name: "FilingChannel"
  description: "Mechanism permitted by a jurisdiction for submitting returns and making\
    \ payments."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "FilingChannelType"
  - name: "url"
    type: "String"
  - name: "supportsAmendments"
    type: "Boolean"
  relations:
  - name: "schedules"
    type: "FilingSchedule"
    multiplicity: "OneToMany"
  - name: "jurisdictions"
    type: "TaxJurisdiction"
    multiplicity: "OneToMany"
- name: "TaxObligation"
  description: "A payable or filing requirement for a specific period, tied to a registration."
  data:
  - name: "period"
    type: "TaxPeriod"
  - name: "obligationType"
    type: "TaxObligationType"
  - name: "dueDate"
    type: "Date"
  - name: "amountDue"
    type: "Money"
  - name: "status"
    type: "ObligationStatus"
  relations:
  - name: "registration"
    type: "TaxRegistration"
    multiplicity: "ManyToOne"
  - name: "taxReturn"
    type: "TaxReturn"
    multiplicity: "OneToOne"
  - name: "assessments"
    type: "Assessment"
    multiplicity: "OneToMany"
  - name: "notices"
    type: "Notice"
    multiplicity: "OneToMany"
  - name: "paymentAllocations"
    type: "PaymentAllocation"
    multiplicity: "OneToMany"
- name: "TaxReturn"
  description: "Formal filing summarizing taxable activity, liabilities, deductions,\
    \ and credits for a period."
  data:
  - name: "period"
    type: "TaxPeriod"
  - name: "returnType"
    type: "TaxReturnType"
  - name: "status"
    type: "ReturnStatus"
  - name: "filingDate"
    type: "Date"
  - name: "totalTaxableAmount"
    type: "Money"
  - name: "totalTaxDue"
    type: "Money"
  - name: "isAmended"
    type: "Boolean"
  - name: "amendmentNumber"
    type: "String"
  relations:
  - name: "registration"
    type: "TaxRegistration"
    multiplicity: "ManyToOne"
  - name: "obligation"
    type: "TaxObligation"
    multiplicity: "OneToOne"
  - name: "lines"
    type: "TaxReturnLine"
    multiplicity: "OneToMany"
  - name: "calculation"
    type: "TaxCalculation"
    multiplicity: "OneToOne"
  - name: "deductions"
    type: "Deduction"
    multiplicity: "OneToMany"
  - name: "credits"
    type: "TaxCredit"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "paymentAllocations"
    type: "PaymentAllocation"
    multiplicity: "OneToMany"
  - name: "auditCase"
    type: "AuditCase"
    multiplicity: "ManyToOne"
- name: "TaxReturnLine"
  description: "Detailed component of a tax return representing a specific category\
    \ of taxable or exempt activity."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "taxableAmount"
    type: "Money"
  - name: "taxRateApplied"
    type: "Percentage"
  - name: "taxAmount"
    type: "Money"
  - name: "lineType"
    type: "ReturnLineType"
  relations:
  - name: "taxReturn"
    type: "TaxReturn"
    multiplicity: "ManyToOne"
  - name: "taxRate"
    type: "TaxRate"
    multiplicity: "ManyToOne"
  - name: "taxRule"
    type: "TaxRule"
    multiplicity: "ManyToOne"
- name: "TaxRate"
  description: "Published rate applied to a taxable base for a specific tax type and\
    \ jurisdiction."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "rate"
    type: "Percentage"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  - name: "taxType"
    type: "TaxType"
  - name: "isCompound"
    type: "Boolean"
  relations:
  - name: "jurisdiction"
    type: "TaxJurisdiction"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "TaxRule"
    multiplicity: "OneToMany"
- name: "TaxRule"
  description: "Deterministic or conditional logic specifying how to calculate tax\
    \ for a given context."
  data:
  - name: "code"
    type: "String"
  - name: "description"
    type: "String"
  - name: "calculationMethod"
    type: "CalculationMethod"
  - name: "basis"
    type: "TaxBasis"
  - name: "priority"
    type: "Integer"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "jurisdiction"
    type: "TaxJurisdiction"
    multiplicity: "ManyToOne"
  - name: "applicableRates"
    type: "TaxRate"
    multiplicity: "ManyToMany"
  - name: "exemptions"
    type: "ExemptionCertificate"
    multiplicity: "ManyToMany"
- name: "TaxCalculation"
  description: "Result set and context used to derive liability from transactional\
    \ inputs and rules."
  data:
  - name: "calculationDate"
    type: "Date"
  - name: "methodVersion"
    type: "String"
  - name: "taxableBase"
    type: "Money"
  - name: "totalTax"
    type: "Money"
  - name: "roundingMode"
    type: "RoundingMode"
  relations:
  - name: "taxReturn"
    type: "TaxReturn"
    multiplicity: "OneToOne"
  - name: "inputs"
    type: "CalculationInput"
    multiplicity: "OneToMany"
  - name: "breakdowns"
    type: "CalculationBreakdown"
    multiplicity: "OneToMany"
- name: "CalculationInput"
  description: "Source value contributing to the tax base, captured for auditability\
    \ and recalculation."
  data:
  - name: "sourceType"
    type: "InputSourceType"
  - name: "referenceNumber"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "description"
    type: "String"
  relations:
  - name: "calculation"
    type: "TaxCalculation"
    multiplicity: "ManyToOne"
- name: "CalculationBreakdown"
  description: "Line-level computation detail showing rate application and resulting\
    \ amounts."
  data:
  - name: "component"
    type: "String"
  - name: "rate"
    type: "Percentage"
  - name: "amount"
    type: "Money"
  relations:
  - name: "calculation"
    type: "TaxCalculation"
    multiplicity: "ManyToOne"
  - name: "taxRate"
    type: "TaxRate"
    multiplicity: "ManyToOne"
  - name: "taxRule"
    type: "TaxRule"
    multiplicity: "ManyToOne"
- name: "Deduction"
  description: "Allowable reduction of taxable base or liability under applicable\
    \ law."
  data:
  - name: "code"
    type: "String"
  - name: "description"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "deductionType"
    type: "DeductionType"
  relations:
  - name: "taxReturn"
    type: "TaxReturn"
    multiplicity: "ManyToOne"
- name: "TaxCredit"
  description: "Allowance that directly reduces tax liability, often subject to limitations\
    \ and carryforwards."
  data:
  - name: "code"
    type: "String"
  - name: "description"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "creditType"
    type: "CreditType"
  - name: "carryforwardAllowed"
    type: "Boolean"
  relations:
  - name: "taxReturn"
    type: "TaxReturn"
    multiplicity: "ManyToOne"
  - name: "carryforwards"
    type: "Carryforward"
    multiplicity: "OneToMany"
- name: "Carryforward"
  description: "Unused credit balance available for application to future periods\
    \ until expiry."
  data:
  - name: "originYear"
    type: "Integer"
  - name: "amount"
    type: "Money"
  - name: "expirationYear"
    type: "Integer"
  - name: "status"
    type: "CarryforwardStatus"
  relations:
  - name: "credit"
    type: "TaxCredit"
    multiplicity: "ManyToOne"
  - name: "taxpayer"
    type: "Taxpayer"
    multiplicity: "ManyToOne"
- name: "TaxPayment"
  description: "Remittance made by or on behalf of a taxpayer to satisfy liabilities,\
    \ assessments, or estimated obligations."
  data:
  - name: "paymentReference"
    type: "String"
  - name: "paymentDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "method"
    type: "PaymentMethod"
  - name: "status"
    type: "PaymentStatus"
  - name: "receivedBy"
    type: "String"
  relations:
  - name: "taxpayer"
    type: "Taxpayer"
    multiplicity: "ManyToOne"
  - name: "jurisdiction"
    type: "TaxJurisdiction"
    multiplicity: "ManyToOne"
  - name: "allocations"
    type: "PaymentAllocation"
    multiplicity: "OneToMany"
- name: "PaymentAllocation"
  description: "Application of a payment to specific liabilities, returns, penalties,\
    \ or interest."
  data:
  - name: "amount"
    type: "Money"
  - name: "allocationDate"
    type: "Date"
  - name: "allocationType"
    type: "AllocationType"
  relations:
  - name: "payment"
    type: "TaxPayment"
    multiplicity: "ManyToOne"
  - name: "taxReturn"
    type: "TaxReturn"
    multiplicity: "ManyToOne"
  - name: "obligation"
    type: "TaxObligation"
    multiplicity: "ManyToOne"
  - name: "assessment"
    type: "Assessment"
    multiplicity: "ManyToOne"
- name: "Assessment"
  description: "Determination by a tax authority establishing or adjusting liability\
    \ for a period."
  data:
  - name: "assessmentNumber"
    type: "String"
  - name: "assessmentType"
    type: "AssessmentType"
  - name: "assessmentDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "reason"
    type: "String"
  - name: "status"
    type: "AssessmentStatus"
  relations:
  - name: "obligation"
    type: "TaxObligation"
    multiplicity: "ManyToOne"
  - name: "taxReturn"
    type: "TaxReturn"
    multiplicity: "ManyToOne"
  - name: "notices"
    type: "Notice"
    multiplicity: "OneToMany"
  - name: "interestCharges"
    type: "InterestCharge"
    multiplicity: "OneToMany"
  - name: "penalties"
    type: "Penalty"
    multiplicity: "OneToMany"
  - name: "paymentAllocations"
    type: "PaymentAllocation"
    multiplicity: "OneToMany"
- name: "Penalty"
  description: "Financial charge imposed due to non-compliance such as late filing\
    \ or underpayment."
  data:
  - name: "penaltyType"
    type: "PenaltyType"
  - name: "amount"
    type: "Money"
  - name: "calculatedDate"
    type: "Date"
  - name: "status"
    type: "ChargeStatus"
  relations:
  - name: "assessment"
    type: "Assessment"
    multiplicity: "ManyToOne"
- name: "InterestCharge"
  description: "Interest accrued on overdue tax liabilities according to statutory\
    \ rates and periods."
  data:
  - name: "interestType"
    type: "InterestType"
  - name: "rate"
    type: "Percentage"
  - name: "amount"
    type: "Money"
  - name: "period"
    type: "TaxPeriod"
  - name: "status"
    type: "ChargeStatus"
  relations:
  - name: "assessment"
    type: "Assessment"
    multiplicity: "ManyToOne"
- name: "Notice"
  description: "Formal communication from a tax authority regarding balances, filings,\
    \ or additional information requests."
  data:
  - name: "noticeNumber"
    type: "String"
  - name: "noticeType"
    type: "NoticeType"
  - name: "issueDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "NoticeStatus"
  - name: "message"
    type: "String"
  relations:
  - name: "assessment"
    type: "Assessment"
    multiplicity: "ManyToOne"
  - name: "obligation"
    type: "TaxObligation"
    multiplicity: "ManyToOne"
  - name: "taxpayer"
    type: "Taxpayer"
    multiplicity: "ManyToOne"
  - name: "attachments"
    type: "Document"
    multiplicity: "OneToMany"
- name: "AuditCase"
  description: "Investigation or examination of a taxpayer’s filings and records by\
    \ the tax authority."
  data:
  - name: "caseNumber"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "AuditStatus"
  - name: "scopeDescription"
    type: "String"
  relations:
  - name: "taxpayer"
    type: "Taxpayer"
    multiplicity: "ManyToOne"
  - name: "returns"
    type: "TaxReturn"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "assessments"
    type: "Assessment"
    multiplicity: "OneToMany"
- name: "Document"
  description: "Supporting artifact such as returns, receipts, correspondence, or\
    \ workpapers stored for compliance and audit."
  data:
  - name: "documentType"
    type: "DocumentType"
  - name: "title"
    type: "String"
  - name: "fileName"
    type: "String"
  - name: "uploadedDate"
    type: "Date"
  - name: "storageUrl"
    type: "String"
  relations:
  - name: "taxpayer"
    type: "Taxpayer"
    multiplicity: "ManyToOne"
  - name: "taxReturn"
    type: "TaxReturn"
    multiplicity: "ManyToOne"
  - name: "auditCase"
    type: "AuditCase"
    multiplicity: "ManyToOne"
  - name: "notice"
    type: "Notice"
    multiplicity: "ManyToOne"
enums:
- name: "JurisdictionLevel"
  description: "Classification of the legal scope at which tax laws apply."
  data:
  - name: "Supranational"
  - name: "National"
  - name: "StateProvince"
  - name: "County"
  - name: "City"
  - name: "SpecialDistrict"
- name: "TaxpayerType"
  description: "Category describing the nature of the entity subject to taxation."
  data:
  - name: "Individual"
  - name: "Business"
  - name: "Nonprofit"
  - name: "Government"
- name: "TaxRegistrationType"
  description: "Type of tax for which a registration is established."
  data:
  - name: "VAT"
  - name: "GST"
  - name: "SalesAndUse"
  - name: "IncomeTax"
  - name: "CorporateTax"
  - name: "PayrollWithholding"
  - name: "Excise"
- name: "RegistrationStatus"
  description: "Lifecycle state of a tax registration."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Closed"
  - name: "Pending"
- name: "FilingFrequency"
  description: "Recurrence interval at which returns and payments are due."
  data:
  - name: "Annual"
  - name: "Quarterly"
  - name: "Monthly"
  - name: "SemiMonthly"
  - name: "Weekly"
  - name: "AdHoc"
- name: "TaxObligationType"
  description: "Nature of the requirement creating a liability or filing event."
  data:
  - name: "Filing"
  - name: "EstimatedPayment"
  - name: "WithholdingRemittance"
  - name: "Installment"
  - name: "AssessmentPayment"
- name: "ObligationStatus"
  description: "Current standing of an obligation relative to due dates and satisfaction."
  data:
  - name: "Open"
  - name: "Satisfied"
  - name: "Overdue"
  - name: "InDispute"
  - name: "Waived"
- name: "TaxReturnType"
  description: "Form or category of a tax return submission."
  data:
  - name: "VATReturn"
  - name: "GSTReturn"
  - name: "SalesTaxReturn"
  - name: "IncomeTaxReturn"
  - name: "CorporateTaxReturn"
  - name: "PayrollReturn"
  - name: "ExciseReturn"
  - name: "WithholdingStatement"
  - name: "AmendedReturn"
- name: "ReturnStatus"
  description: "Processing state of a submitted or in-preparation return."
  data:
  - name: "Draft"
  - name: "Filed"
  - name: "Accepted"
  - name: "Rejected"
  - name: "Amended"
  - name: "Voided"
- name: "ReturnLineType"
  description: "Classification of a return line that dictates calculation and reporting."
  data:
  - name: "TaxableSale"
  - name: "ExemptSale"
  - name: "ZeroRatedSale"
  - name: "Purchase"
  - name: "Import"
  - name: "Export"
  - name: "Adjustment"
  - name: "BadDebt"
  - name: "Other"
- name: "TaxType"
  description: "Distinct classes of taxes administered by authorities."
  data:
  - name: "VAT"
  - name: "GST"
  - name: "SalesTax"
  - name: "UseTax"
  - name: "IncomeTax"
  - name: "CorporateTax"
  - name: "PayrollTax"
  - name: "ExciseTax"
  - name: "WithholdingTax"
- name: "CalculationMethod"
  description: "Approach used to compute liability from base amounts and rates."
  data:
  - name: "RateTimesBase"
  - name: "Tiered"
  - name: "Compound"
  - name: "NetOfTax"
  - name: "ReverseCharge"
  - name: "SelfAssessment"
- name: "TaxBasis"
  description: "Basis upon which tax is calculated."
  data:
  - name: "Net"
  - name: "Gross"
  - name: "Margin"
  - name: "Destination"
  - name: "Origin"
- name: "RoundingMode"
  description: "Rule applied when normalizing calculated amounts."
  data:
  - name: "Up"
  - name: "Down"
  - name: "Nearest"
  - name: "Bankers"
- name: "InputSourceType"
  description: "Originating system or document contributing to calculation input."
  data:
  - name: "Invoice"
  - name: "Receipt"
  - name: "Payroll"
  - name: "JournalEntry"
  - name: "ImportFile"
  - name: "ManualEntry"
- name: "ExemptionType"
  description: "Legal basis for excluding activity from taxation."
  data:
