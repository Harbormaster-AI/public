---
metadata:
  name: "General Ledger Capabilities Model"
  description: "Canonical HCIDL capabilities model for enterprise General Ledger,\
    \ covering chart of accounts, journals, periods, balances, allocations, recurring\
    \ entries, currency management, and intercompany processes."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Financial"
  type: "Capability"
  domain: "General Ledger"
entities:
- name: "LegalEntity"
  description: "Organization recognized in law for accounting, taxation, and reporting\
    \ purposes."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "registrationCountry"
    type: "String"
  - name: "baseCurrency"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "ledgers"
    type: "Ledger"
    multiplicity: "OneToMany"
  - name: "intercompanyAgreementsAsOrigin"
    type: "IntercompanyAgreement"
    multiplicity: "OneToMany"
  - name: "intercompanyAgreementsAsCounterparty"
    type: "IntercompanyAgreement"
    multiplicity: "OneToMany"
- name: "Ledger"
  description: "Accounting book defining currency, calendar, and posting rules for\
    \ a legal entity."
  data:
  - name: "name"
    type: "String"
  - name: "ledgerType"
    type: "LedgerType"
  - name: "baseCurrency"
    type: "String"
  - name: "isPrimary"
    type: "Boolean"
  - name: "allowJournalApproval"
    type: "Boolean"
  relations:
  - name: "legalEntity"
    type: "LegalEntity"
    multiplicity: "ManyToOne"
  - name: "chartOfAccounts"
    type: "ChartOfAccounts"
    multiplicity: "ManyToOne"
  - name: "fiscalCalendar"
    type: "FiscalCalendar"
    multiplicity: "ManyToOne"
  - name: "journalEntries"
    type: "JournalEntry"
    multiplicity: "OneToMany"
  - name: "accountBalances"
    type: "AccountBalance"
    multiplicity: "OneToMany"
  - name: "currencyRates"
    type: "CurrencyRate"
    multiplicity: "OneToMany"
  - name: "budgetVersions"
    type: "BudgetVersion"
    multiplicity: "OneToMany"
  - name: "allocationRules"
    type: "AllocationRule"
    multiplicity: "OneToMany"
  - name: "recurringJournalTemplates"
    type: "RecurringJournalTemplate"
    multiplicity: "OneToMany"
  - name: "postingBatches"
    type: "PostingBatch"
    multiplicity: "OneToMany"
  - name: "closingTasks"
    type: "ClosingTask"
    multiplicity: "OneToMany"
  - name: "accountCombinations"
    type: "AccountCombination"
    multiplicity: "OneToMany"
- name: "FiscalCalendar"
  description: "Structure defining fiscal years and periods for accounting."
  data:
  - name: "name"
    type: "String"
  - name: "startMonth"
    type: "Integer"
  - name: "description"
    type: "String"
  relations:
  - name: "fiscalYears"
    type: "FiscalYear"
    multiplicity: "OneToMany"
  - name: "ledgers"
    type: "Ledger"
    multiplicity: "OneToMany"
- name: "FiscalYear"
  description: "Fiscal year within a fiscal calendar."
  data:
  - name: "year"
    type: "Integer"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "calendar"
    type: "FiscalCalendar"
    multiplicity: "ManyToOne"
  - name: "periods"
    type: "AccountingPeriod"
    multiplicity: "OneToMany"
- name: "AccountingPeriod"
  description: "Accounting time bucket used for journal posting and balance tracking."
  data:
  - name: "periodNumber"
    type: "Integer"
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "PeriodStatus"
  - name: "isAdjustment"
    type: "Boolean"
  relations:
  - name: "fiscalYear"
    type: "FiscalYear"
    multiplicity: "ManyToOne"
  - name: "journalEntries"
    type: "JournalEntry"
    multiplicity: "OneToMany"
  - name: "balances"
    type: "AccountBalance"
    multiplicity: "OneToMany"
  - name: "budgetLines"
    type: "BudgetLine"
    multiplicity: "OneToMany"
  - name: "closingTasks"
    type: "ClosingTask"
    multiplicity: "OneToMany"
- name: "ChartOfAccounts"
  description: "Canonical set of accounts and segments used for classification of\
    \ transactions."
  data:
  - name: "name"
    type: "String"
  - name: "structureDescription"
    type: "String"
  relations:
  - name: "ledgers"
    type: "Ledger"
    multiplicity: "OneToMany"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "segments"
    type: "AccountSegment"
    multiplicity: "OneToMany"
  - name: "accountCombinations"
    type: "AccountCombination"
    multiplicity: "OneToMany"
- name: "Account"
  description: "Posting or summary account representing a specific classification\
    \ of financial activity."
  data:
  - name: "code"
    type: "AccountCode"
  - name: "name"
    type: "String"
  - name: "accountType"
    type: "AccountType"
  - name: "normalBalance"
    type: "NormalBalance"
  - name: "isPosting"
    type: "Boolean"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "chartOfAccounts"
    type: "ChartOfAccounts"
    multiplicity: "ManyToOne"
  - name: "parentAccount"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "subAccounts"
    type: "Account"
    multiplicity: "OneToMany"
- name: "AccountSegment"
  description: "Structural component of an account combination such as natural account,\
    \ cost center, or project."
  data:
  - name: "name"
    type: "String"
  - name: "segmentType"
    type: "SegmentType"
  - name: "length"
    type: "Integer"
  - name: "delimiter"
    type: "String"
  - name: "isRequired"
    type: "Boolean"
  - name: "displayOrder"
    type: "Integer"
  relations:
  - name: "chartOfAccounts"
    type: "ChartOfAccounts"
    multiplicity: "ManyToOne"
  - name: "values"
    type: "SegmentValue"
    multiplicity: "OneToMany"
- name: "SegmentValue"
  description: "Allowed code for a given segment used to build account combinations."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  - name: "effectiveStartDate"
    type: "Date"
  - name: "effectiveEndDate"
    type: "Date"
  relations:
  - name: "segment"
    type: "AccountSegment"
    multiplicity: "ManyToOne"
- name: "AccountCombination"
  description: "Concrete, validated string of segment values representing a posting\
    \ destination."
  data:
  - name: "combinationCode"
    type: "String"
  - name: "description"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "chartOfAccounts"
    type: "ChartOfAccounts"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "segmentValues"
    type: "SegmentValue"
    multiplicity: "ManyToMany"
  - name: "journalLines"
    type: "JournalLine"
    multiplicity: "OneToMany"
  - name: "balances"
    type: "AccountBalance"
    multiplicity: "OneToMany"
- name: "JournalSource"
  description: "Origin classification for journals such as manual, import, recurring,\
    \ or subledger."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "journalEntries"
    type: "JournalEntry"
    multiplicity: "OneToMany"
- name: "PostingBatch"
  description: "Grouping of journal entries for collective validation, approval, and\
    \ posting."
  data:
  - name: "batchNumber"
    type: "String"
  - name: "description"
    type: "String"
  - name: "status"
    type: "PostingBatchStatus"
  relations:
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "AccountingPeriod"
    multiplicity: "ManyToOne"
  - name: "journalEntries"
    type: "JournalEntry"
    multiplicity: "OneToMany"
- name: "JournalEntry"
  description: "Header record capturing accounting intent and control attributes for\
    \ posted lines."
  data:
  - name: "journalNumber"
    type: "JournalNumber"
  - name: "description"
    type: "String"
  - name: "accountingDate"
    type: "Date"
  - name: "status"
    type: "JournalStatus"
  - name: "reversalMethod"
    type: "ReversalMethod"
  - name: "reversalDate"
    type: "Date"
  - name: "sourceReference"
    type: "String"
  relations:
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "AccountingPeriod"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "JournalLine"
    multiplicity: "OneToMany"
  - name: "source"
    type: "JournalSource"
    multiplicity: "ManyToOne"
  - name: "postingBatch"
    type: "PostingBatch"
    multiplicity: "ManyToOne"
  - name: "reversedFrom"
    type: "JournalEntry"
    multiplicity: "ManyToOne"
  - name: "reversals"
    type: "JournalEntry"
    multiplicity: "OneToMany"
- name: "JournalLine"
  description: "Detailed debit or credit posting linked to an account combination."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "postingType"
    type: "PostingType"
  - name: "amount"
    type: "Money"
  - name: "transactionCurrency"
    type: "String"
  - name: "exchangeRate"
    type: "Decimal"
  - name: "taxAmount"
    type: "Money"
  relations:
  - name: "journalEntry"
    type: "JournalEntry"
    multiplicity: "ManyToOne"
  - name: "accountCombination"
    type: "AccountCombination"
    multiplicity: "ManyToOne"
  - name: "statisticalAccount"
    type: "StatisticalAccount"
    multiplicity: "ManyToOne"
  - name: "intercompanyTransaction"
    type: "IntercompanyTransaction"
    multiplicity: "ManyToOne"
- name: "AccountBalance"
  description: "Aggregated balances for an account combination and period, by balance\
    \ classification."
  data:
  - name: "balanceType"
    type: "BalanceType"
  - name: "openingBalance"
    type: "Money"
  - name: "debitTotal"
    type: "Money"
  - name: "creditTotal"
    type: "Money"
  - name: "endingBalance"
    type: "Money"
  relations:
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "AccountingPeriod"
    multiplicity: "ManyToOne"
  - name: "accountCombination"
    type: "AccountCombination"
    multiplicity: "ManyToOne"
- name: "BudgetVersion"
  description: "Authorized set of budget amounts for a ledger and fiscal year."
  data:
  - name: "name"
    type: "String"
  - name: "fiscalYear"
    type: "Integer"
  - name: "status"
    type: "BudgetStatus"
  relations:
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
  - name: "budgetLines"
    type: "BudgetLine"
    multiplicity: "OneToMany"
- name: "BudgetLine"
  description: "Budget amount for a specific account combination and period."
  data:
  - name: "amount"
    type: "Money"
  - name: "note"
    type: "String"
  relations:
  - name: "budgetVersion"
    type: "BudgetVersion"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "AccountingPeriod"
    multiplicity: "ManyToOne"
  - name: "accountCombination"
    type: "AccountCombination"
    multiplicity: "ManyToOne"
- name: "AllocationRule"
  description: "Rule used to redistribute amounts from a source to one or more targets."
  data:
  - name: "name"
    type: "String"
  - name: "allocationMethod"
    type: "AllocationMethod"
  - name: "description"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
  - name: "sourceCombination"
    type: "AccountCombination"
    multiplicity: "ManyToOne"
  - name: "targetCombinations"
    type: "AccountCombination"
    multiplicity: "ManyToMany"
  - name: "basisStatisticalAccount"
    type: "StatisticalAccount"
    multiplicity: "ManyToOne"
- name: "RecurringJournalTemplate"
  description: "Template controlling automated creation of periodic journal entries."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "frequency"
    type: "RecurrenceFrequency"
  - name: "nextRunDate"
    type: "Date"
  - name: "reversalMethod"
    type: "ReversalMethod"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
  - name: "templateLines"
    type: "RecurringJournalLine"
    multiplicity: "OneToMany"
- name: "RecurringJournalLine"
  description: "Prescribed debit or credit line included in a recurring journal template."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "postingType"
    type: "PostingType"
  - name: "amount"
    type: "Money"
  relations:
  - name: "template"
    type: "RecurringJournalTemplate"
    multiplicity: "ManyToOne"
  - name: "accountCombination"
    type: "AccountCombination"
    multiplicity: "ManyToOne"
- name: "CurrencyRate"
  description: "Exchange rate definition used for currency conversion within a ledger."
  data:
  - name: "fromCurrency"
    type: "String"
  - name: "toCurrency"
    type: "String"
  - name: "rateType"
    type: "RateType"
  - name: "rate"
    type: "Decimal"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
- name: "ClosingTask"
  description: "Close checklist activity tracked to ensure period-end completeness\
    \ and control."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "status"
    type: "CloseTaskStatus"
  - name: "dueDate"
    type: "Date"
  - name: "owner"
    type: "String"
  relations:
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "AccountingPeriod"
    multiplicity: "ManyToOne"
  - name: "predecessorTasks"
    type: "ClosingTask"
    multiplicity: "ManyToMany"
- name: "StatisticalAccount"
  description: "Non-monetary measure used as a driver for allocations and analysis."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "unitOfMeasure"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
  - name: "statisticalBalances"
    type: "StatisticalBalance"
    multiplicity: "OneToMany"
  - name: "journalLines"
    type: "JournalLine"
    multiplicity: "OneToMany"
- name: "StatisticalBalance"
  description: "Aggregated non-monetary quantity by period and optionally by account\
    \ combination."
  data:
  - name: "quantity"
    type: "Decimal"
  relations:
  - name: "statisticalAccount"
    type: "StatisticalAccount"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "AccountingPeriod"
    multiplicity: "ManyToOne"
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
  - name: "accountCombination"
    type: "AccountCombination"
    multiplicity: "ManyToOne"
- name: "IntercompanyAgreement"
  description: "Rules and accounts governing transactions between two legal entities."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  - name: "settlementCurrency"
    type: "String"
  relations:
  - name: "fromLegalEntity"
    type: "LegalEntity"
    multiplicity: "ManyToOne"
  - name: "toLegalEntity"
    type: "LegalEntity"
    multiplicity: "ManyToOne"
  - name: "dueFromAccountCombination"
    type: "AccountCombination"
    multiplicity: "ManyToOne"
  - name: "dueToAccountCombination"
    type: "AccountCombination"
    multiplicity: "ManyToOne"
  - name: "intercompanyTransactions"
    type: "IntercompanyTransaction"
    multiplicity: "OneToMany"
- name: "IntercompanyTransaction"
  description: "Cross-entity transaction requiring reciprocal recognition and settlement."
  data:
  - name: "referenceNumber"
    type: "String"
  - name: "description"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "IntercompanyStatus"
  relations:
  - name: "agreement"
    type: "IntercompanyAgreement"
    multiplicity: "ManyToOne"
  - name: "originatingJournalLine"
    type: "JournalLine"
    multiplicity: "ManyToOne"
  - name: "fromLedger"
    type: "Ledger"
    multiplicity: "ManyToOne"
  - name: "toLedger"
    type: "Ledger"
    multiplicity: "ManyToOne"
- name: "ReportingUnit"
  description: "Managerial reporting construct grouping ledgers and account combinations."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "legalEntity"
    type: "LegalEntity"
    multiplicity: "ManyToOne"
  - name: "ledgers"
    type: "Ledger"
    multiplicity: "ManyToMany"
  - name: "accountCombinations"
    type: "AccountCombination"
    multiplicity: "ManyToMany"
enums:
- name: "AccountType"
  description: "High-level classification of accounts for balance sheet and income\
    \ statement reporting."
  data:
  - name: "Asset"
  - name: "Liability"
  - name: "Equity"
  - name: "Revenue"
  - name: "Expense"
- name: "NormalBalance"
  description: "Side on which the account’s increases are recorded."
  data:
  - name: "Debit"
  - name: "Credit"
- name: "LedgerType"
  description: "Operational purpose of the ledger within the enterprise."
  data:
  - name: "Primary"
  - name: "Secondary"
  - name: "Reporting"
  - name: "Consolidation"
- name: "PeriodStatus"
  description: "Lifecycle stage of an accounting period with respect to posting."
  data:
  - name: "Open"
  - name: "Closed"
  - name: "Locked"
  - name: "PendingClose"
  - name: "Adjusting"
- name: "JournalStatus"
  description: "Workflow and posting state of a journal entry."
  data:
  - name: "Draft"
  - name: "PendingApproval"
  - name: "Approved"
  - name: "Posted"
  - name: "Reversed"
  - name: "Rejected"
- name: "PostingType"
  description: "Directional nature of the journal line for posting."
  data:
  - name: "Debit"
  - name: "Credit"
- name: "BalanceType"
  description: "Classification of balances to distinguish actuals and planned figures."
  data:
  - name: "Actual"
  - name: "Budget"
  - name: "Forecast"
  - name: "Opening"
  - name: "Encumbrance"
  - name: "Commitment"
- name: "RateType"
  description: "Methodology or source used to derive foreign exchange rates."
  data:
  - name: "Spot"
  - name: "Average"
  - name: "Corporate"
  - name: "Historic"
- name: "RecurrenceFrequency"
  description: "Interval for generating recurring journal entries."
  data:
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Yearly"
- name: "ReversalMethod"
  description: "Rule defining when and how a journal reversal is booked."
  data:
  - name: "NextPeriod"
  - name: "OnDate"
  - name: "DayAfter"
  - name: "CustomDate"
- name: "SegmentType"
  description: "Category of segment employed in account combination structures."
  data:
  - name: "Natural"
  - name: "CostCenter"
  - name: "Department"
  - name: "Project"
  - name: "Location"
  - name: "Product"
- name: "AllocationMethod"
  description: "Algorithm used to distribute source amounts to targets."
  data:
  - name: "FixedPercentage"
  - name: "DriverBased"
  - name: "StepDown"
  - name: "EvenSpread"
- name: "BudgetStatus"
  description: "Authorization state of a budget version."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Locked"
  - name: "Archived"
- name: "CloseTaskStatus"
  description: "Execution state for a financial close task."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "Blocked"
  - name: "Completed"
  - name: "Deferred"
- name: "IntercompanyStatus"
  description: "Matching and settlement state of an intercompany transaction."
  data:
  - name: "Initiated"
  - name: "Matched"
  - name: "Posted"
  - name: "Settled"
  - name: "Disputed"
  - name: "Cancelled"
- name: "PostingBatchStatus"
  description: "Processing status of a batch of journal entries."
  data:
  - name: "Open"
  - name: "Validated"
  - name: "Approved"
  - name: "Posted"
  - name: "Closed"
  - name: "Error"
valueObjects:
- name: "Money"
  description: "Monetary value represented by an amount and currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "AccountCode"
  description: "Human-readable code uniquely identifying an account within a chart\
    \ of accounts."
  data:
  - name: "value"
    type: "String"
- name: "JournalNumber"
  description: "Sequential or rule-based identifier assigned to a journal entry."
  data:
  - name: "value"
    type: "String"
