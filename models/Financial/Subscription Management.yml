---
metadata:
  name: "Subscription Management HCIDL"
  description: "Canonical capabilities model for managing subscription lifecycles,\
    \ plans, pricing, entitlements, usage, and renewals."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Financial"
  type: "Capability"
  domain: "Subscription Management"
entities:
- name: "Account"
  description: "Customer or organization that owns subscriptions and billing relationships."
  data:
  - name: "name"
    type: "String"
  - name: "accountType"
    type: "AccountType"
  - name: "defaultCurrency"
    type: "String"
  - name: "locale"
    type: "String"
  - name: "taxNumber"
    type: "String"
  - name: "billingAddress"
    type: "Address"
  relations:
  - name: "contacts"
    type: "Contact"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "paymentMethods"
    type: "PaymentMethod"
    multiplicity: "OneToMany"
  - name: "billingProfiles"
    type: "BillingProfile"
    multiplicity: "OneToMany"
  - name: "parentAccount"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "childAccounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "partners"
    type: "Partner"
    multiplicity: "ManyToMany"
  - name: "promotionRedemptions"
    type: "PromotionRedemption"
    multiplicity: "OneToMany"
- name: "Contact"
  description: "Person associated with an account for communication and notifications."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "Email"
  - name: "phone"
    type: "String"
  - name: "jobTitle"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "BillingProfile"
  description: "Billing preferences and schedule used to generate charges for subscriptions."
  data:
  - name: "billCycleAnchor"
    type: "Date"
  - name: "billingDayOfMonth"
    type: "Integer"
  - name: "invoiceTiming"
    type: "BillingAlignment"
  - name: "prorationMode"
    type: "ProrationMode"
  - name: "taxExempt"
    type: "Boolean"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
- name: "PaymentMethod"
  description: "Tokenized payment instrument used for recurring charges."
  data:
  - name: "nickname"
    type: "String"
  - name: "methodType"
    type: "PaymentMethodType"
  - name: "gatewayToken"
    type: "String"
  - name: "last4"
    type: "String"
  - name: "expirationMonth"
    type: "Integer"
  - name: "expirationYear"
    type: "Integer"
  - name: "isDefault"
    type: "Boolean"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
- name: "Partner"
  description: "Channel organization such as a reseller, distributor, or marketplace."
  data:
  - name: "name"
    type: "String"
  - name: "partnerType"
    type: "PartnerType"
  - name: "website"
    type: "String"
  relations:
  - name: "accounts"
    type: "Account"
    multiplicity: "ManyToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
- name: "Product"
  description: "Marketable product that groups related subscription plans."
  data:
  - name: "name"
    type: "String"
  - name: "productCode"
    type: "String"
  - name: "category"
    type: "String"
  relations:
  - name: "plans"
    type: "Plan"
    multiplicity: "OneToMany"
- name: "Plan"
  description: "Sellable subscription plan defining terms, billing period, and included\
    \ features."
  data:
  - name: "name"
    type: "String"
  - name: "planCode"
    type: "String"
  - name: "billingPeriod"
    type: "BillingPeriod"
  - name: "termType"
    type: "TermType"
  - name: "trialDays"
    type: "Integer"
  - name: "cancellationPolicy"
    type: "CancellationPolicy"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "prices"
    type: "Price"
    multiplicity: "OneToMany"
  - name: "features"
    type: "Feature"
    multiplicity: "ManyToMany"
  - name: "addOnDefinitions"
    type: "AddOnDefinition"
    multiplicity: "OneToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
- name: "AddOnDefinition"
  description: "Optional add-on that can be attached to a subscription in addition\
    \ to the base plan."
  data:
  - name: "name"
    type: "String"
  - name: "addOnCode"
    type: "String"
  - name: "billingPeriod"
    type: "BillingPeriod"
  - name: "chargeType"
    type: "ChargeType"
  relations:
  - name: "plan"
    type: "Plan"
    multiplicity: "ManyToOne"
  - name: "prices"
    type: "Price"
    multiplicity: "OneToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
- name: "Price"
  description: "Price definition for a plan or add-on, including charge type and unit\
    \ price."
  data:
  - name: "unitPrice"
    type: "Money"
  - name: "chargeType"
    type: "ChargeType"
  - name: "billingAlignment"
    type: "BillingAlignment"
  - name: "minimumQuantity"
    type: "Integer"
  - name: "maximumQuantity"
    type: "Integer"
  relations:
  - name: "plan"
    type: "Plan"
    multiplicity: "ManyToOne"
  - name: "addOn"
    type: "AddOnDefinition"
    multiplicity: "ManyToOne"
  - name: "pricingTiers"
    type: "PricingTier"
    multiplicity: "OneToMany"
- name: "PricingTier"
  description: "Tiered pricing breakpoint and per-unit charge for usage-based or volume\
    \ pricing."
  data:
  - name: "startingQuantity"
    type: "Decimal"
  - name: "endingQuantity"
    type: "Decimal"
  - name: "pricePerUnit"
    type: "Money"
  relations:
  - name: "price"
    type: "Price"
    multiplicity: "ManyToOne"
- name: "Feature"
  description: "Capability or resource included with a plan that can be granted as\
    \ an entitlement."
  data:
  - name: "code"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  - name: "metered"
    type: "Boolean"
  relations:
  - name: "plans"
    type: "Plan"
    multiplicity: "ManyToMany"
  - name: "entitlementGrants"
    type: "EntitlementGrant"
    multiplicity: "OneToMany"
  - name: "usageRecords"
    type: "UsageRecord"
    multiplicity: "OneToMany"
- name: "Subscription"
  description: "Active agreement to a plan for a specific account, including lifecycle\
    \ and billing settings."
  data:
  - name: "subscriptionNumber"
    type: "String"
  - name: "status"
    type: "SubscriptionStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "renewalMode"
    type: "RenewalMode"
  - name: "autoRenew"
    type: "Boolean"
  - name: "billingPeriod"
    type: "BillingPeriod"
  - name: "quantity"
    type: "Integer"
  - name: "prorationMode"
    type: "ProrationMode"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "plan"
    type: "Plan"
    multiplicity: "ManyToOne"
  - name: "billingProfile"
    type: "BillingProfile"
    multiplicity: "ManyToOne"
  - name: "paymentMethod"
    type: "PaymentMethod"
    multiplicity: "ManyToOne"
  - name: "partner"
    type: "Partner"
    multiplicity: "ManyToOne"
  - name: "addOns"
    type: "SubscriptionAddOn"
    multiplicity: "OneToMany"
  - name: "entitlements"
    type: "EntitlementGrant"
    multiplicity: "OneToMany"
  - name: "usageRecords"
    type: "UsageRecord"
    multiplicity: "OneToMany"
  - name: "usageAggregations"
    type: "UsageAggregation"
    multiplicity: "OneToMany"
  - name: "changes"
    type: "SubscriptionChange"
    multiplicity: "OneToMany"
  - name: "pauses"
    type: "SubscriptionPause"
    multiplicity: "OneToMany"
  - name: "trial"
    type: "Trial"
    multiplicity: "OneToOne"
  - name: "contract"
    type: "Contract"
    multiplicity: "OneToOne"
  - name: "promotionRedemptions"
    type: "PromotionRedemption"
    multiplicity: "OneToMany"
  - name: "priceOverrides"
    type: "PriceOverride"
    multiplicity: "OneToMany"
- name: "SubscriptionAddOn"
  description: "Instance of an add-on attached to a specific subscription."
  data:
  - name: "addOnCode"
    type: "String"
  - name: "quantity"
    type: "Integer"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "addOnDefinition"
    type: "AddOnDefinition"
    multiplicity: "ManyToOne"
  - name: "priceOverrides"
    type: "PriceOverride"
    multiplicity: "OneToMany"
- name: "EntitlementGrant"
  description: "Grant of a feature to a subscription with allowed and consumed quantities."
  data:
  - name: "featureCode"
    type: "String"
  - name: "allowedQuantity"
    type: "Decimal"
  - name: "consumedQuantity"
    type: "Decimal"
  - name: "effectiveStart"
    type: "Date"
  - name: "effectiveEnd"
    type: "Date"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "feature"
    type: "Feature"
    multiplicity: "ManyToOne"
- name: "UsageRecord"
  description: "Metered usage event or summary contributing to billable consumption."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "featureCode"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "source"
    type: "String"
  - name: "status"
    type: "UsageRecordStatus"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "feature"
    type: "Feature"
    multiplicity: "ManyToOne"
  - name: "aggregation"
    type: "UsageAggregation"
    multiplicity: "ManyToOne"
- name: "UsageAggregation"
  description: "Consolidated view of usage for a subscription and feature within a\
    \ period."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "totalQuantity"
    type: "Decimal"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "feature"
    type: "Feature"
    multiplicity: "ManyToOne"
  - name: "usageRecords"
    type: "UsageRecord"
    multiplicity: "OneToMany"
- name: "SubscriptionChange"
  description: "Requested or executed modification to a subscription such as upgrade,\
    \ downgrade, or cancellation."
  data:
  - name: "changeNumber"
    type: "String"
  - name: "changeType"
    type: "ChangeType"
  - name: "effectiveDate"
    type: "Date"
  - name: "status"
    type: "ChangeStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "previousPlan"
    type: "Plan"
    multiplicity: "ManyToOne"
  - name: "newPlan"
    type: "Plan"
    multiplicity: "ManyToOne"
  - name: "initiatedByAccount"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "SubscriptionPause"
  description: "Temporary suspension period during which billing and entitlements\
    \ may be limited."
  data:
  - name: "pauseStart"
    type: "Date"
  - name: "pauseEnd"
    type: "Date"
  - name: "reason"
    type: "String"
  - name: "status"
    type: "PauseStatus"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
- name: "Trial"
  description: "Trial window associated with a subscription prior to paid conversion."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "converted"
    type: "Boolean"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "OneToOne"
- name: "PriceOverride"
  description: "Subscription-specific price adjustment applied to a plan or add-on."
  data:
  - name: "overrideType"
    type: "PriceOverrideType"
  - name: "amount"
    type: "Money"
  - name: "percentage"
    type: "Decimal"
  - name: "reason"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "scope"
    type: "PriceScope"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "addOn"
    type: "SubscriptionAddOn"
    multiplicity: "ManyToOne"
- name: "Promotion"
  description: "Marketing incentive such as a discount or free trial extension."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "discountType"
    type: "DiscountType"
  - name: "value"
    type: "Decimal"
  - name: "maxRedemptions"
    type: "Integer"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "appliesTo"
    type: "PromotionScope"
  - name: "stackable"
    type: "Boolean"
  relations:
  - name: "plans"
    type: "Plan"
    multiplicity: "ManyToMany"
  - name: "addOns"
    type: "AddOnDefinition"
    multiplicity: "ManyToMany"
  - name: "redemptions"
    type: "PromotionRedemption"
    multiplicity: "OneToMany"
- name: "PromotionRedemption"
  description: "Application of a promotion to an account or subscription."
  data:
  - name: "redemptionCode"
    type: "String"
  - name: "redeemedDate"
    type: "Date"
  - name: "status"
    type: "RedemptionStatus"
  relations:
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "subscription"
    type: "Subscription"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "Contract"
  description: "Binding agreement capturing term dates and commercial obligations\
    \ for a subscription."
  data:
  - name: "contractNumber"
    type: "String"
  - name: "termStart"
    type: "Date"
  - name: "termEnd"
    type: "Date"
  - name: "earlyTerminationFee"
    type: "Money"
  - name: "noticePeriodDays"
    type: "Integer"
  relations:
  - name: "subscription"
    type: "Subscription"
    multiplicity: "OneToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
enums:
- name: "AccountType"
  description: "Classification of the customer entity that owns subscriptions."
  data:
  - name: "Individual"
  - name: "Company"
  - name: "Nonprofit"
  - name: "Government"
- name: "PaymentMethodType"
  description: "Supported payment instrument categories."
  data:
  - name: "Card"
  - name: "BankDebit"
  - name: "PayPal"
  - name: "Wire"
  - name: "Other"
- name: "BillingPeriod"
  description: "Recurrence interval used for recurring charges."
  data:
  - name: "Weekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "SemiAnnual"
  - name: "Annual"
- name: "TermType"
  description: "Contractual structure of the subscription term."
  data:
  - name: "Evergreen"
  - name: "Termed"
- name: "ChargeType"
  description: "Nature of the charge applied by a price."
  data:
  - name: "Recurring"
  - name: "OneTime"
  - name: "Usage"
- name: "BillingAlignment"
  description: "Timing of billing relative to service delivery."
  data:
  - name: "InAdvance"
  - name: "InArrears"
- name: "UnitOfMeasure"
  description: "Measurement unit for metered features and entitlements."
  data:
  - name: "Seats"
  - name: "GB"
  - name: "API_Calls"
  - name: "Hours"
  - name: "Units"
- name: "SubscriptionStatus"
  description: "Lifecycle state of a subscription."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "PastDue"
  - name: "Suspended"
  - name: "Cancelled"
  - name: "Expired"
- name: "RenewalMode"
  description: "Method by which a subscription renews at term end."
  data:
  - name: "Auto"
  - name: "Manual"
- name: "ProrationMode"
  description: "How charges are prorated when changes occur mid-cycle."
  data:
  - name: "Full"
  - name: "Prorate"
  - name: "None"
- name: "UsageRecordStatus"
  description: "Processing state of a usage record."
  data:
  - name: "Accepted"
  - name: "Rejected"
  - name: "Billed"
  - name: "Adjusted"
- name: "ChangeType"
  description: "Type of modification applied to a subscription."
  data:
  - name: "New"
  - name: "Upgrade"
  - name: "Downgrade"
  - name: "AddOnAdded"
  - name: "AddOnRemoved"
  - name: "Cancellation"
  - name: "Renewal"
  - name: "Pause"
  - name: "Resume"
- name: "ChangeStatus"
  description: "Execution status of a subscription change."
  data:
  - name: "Requested"
  - name: "Scheduled"
  - name: "Completed"
  - name: "Reverted"
  - name: "Failed"
- name: "PauseStatus"
  description: "State of a subscription pause window."
  data:
  - name: "Planned"
  - name: "Active"
  - name: "Completed"
  - name: "Cancelled"
- name: "PartnerType"
  description: "Role of the channel partner in the go-to-market model."
  data:
  - name: "Reseller"
  - name: "Distributor"
  - name: "Marketplace"
- name: "PriceOverrideType"
  description: "Method by which price is adjusted for a subscription."
  data:
  - name: "FixedPrice"
  - name: "DiscountPercentage"
  - name: "DiscountAmount"
- name: "PriceScope"
  description: "Target of a price override within a subscription."
  data:
  - name: "Plan"
  - name: "AddOn"
  - name: "Feature"
- name: "CancellationPolicy"
  description: "When service ends and charges stop upon cancellation."
  data:
  - name: "Immediate"
  - name: "EndOfTerm"
  - name: "ProratedEndOfCycle"
- name: "DiscountType"
  description: "Structure of promotional discount or concession."
  data:
  - name: "Percentage"
  - name: "Amount"
  - name: "FreeTrialDays"
- name: "PromotionScope"
  description: "Entity types to which a promotion may apply."
  data:
  - name: "Plan"
  - name: "AddOn"
  - name: "Account"
- name: "RedemptionStatus"
  description: "Status of a promotion redemption instance."
  data:
  - name: "Applied"
  - name: "Voided"
  - name: "Expired"
valueObjects:
- name: "Money"
  description: "Monetary value with amount and currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address used for billing and contact purposes."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "Email"
  description: "Electronic mail address in standard format."
  data:
  - name: "value"
    type: "String"
