---
metadata:
  name: "HCIDL Capabilities Model - Financial Reporting"
  description: "Canonical capability model for financial reporting, covering statements,\
    \ consolidation, metrics, disclosures, and report execution across accounting\
    \ periods and entities."
  version: "1.0.0"
  industry: "Finance and Accounting"
  category: "Financial"
  type: "Capability"
  domain: "Financial Reporting"
entities:
- name: "ReportingEntity"
  description: "Legal entity or reporting unit for which financial statements and\
    \ disclosures are prepared."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "reportingCurrency"
    type: "String"
  - name: "domicileCountry"
    type: "String"
  - name: "industryClassification"
    type: "String"
  relations:
  - name: "parentEntity"
    type: "ReportingEntity"
    multiplicity: "ManyToOne"
  - name: "childEntities"
    type: "ReportingEntity"
    multiplicity: "OneToMany"
  - name: "ledgers"
    type: "Ledger"
    multiplicity: "OneToMany"
  - name: "costCenters"
    type: "CostCenter"
    multiplicity: "OneToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
  - name: "consolidationGroups"
    type: "ConsolidationGroup"
    multiplicity: "ManyToMany"
- name: "Ledger"
  description: "Book of record used as the basis for reporting, aligned to a chart\
    \ of accounts and accounting periods."
  data:
  - name: "name"
    type: "String"
  - name: "ledgerType"
    type: "LedgerType"
  - name: "baseCurrency"
    type: "String"
  - name: "signConvention"
    type: "SignConvention"
  relations:
  - name: "reportingEntity"
    type: "ReportingEntity"
    multiplicity: "ManyToOne"
  - name: "chartOfAccounts"
    type: "ChartOfAccounts"
    multiplicity: "OneToOne"
  - name: "periods"
    type: "AccountingPeriod"
    multiplicity: "OneToMany"
  - name: "balances"
    type: "AccountBalance"
    multiplicity: "OneToMany"
  - name: "exchangeRates"
    type: "ExchangeRate"
    multiplicity: "OneToMany"
  - name: "dataFeeds"
    type: "DataFeed"
    multiplicity: "OneToMany"
- name: "ChartOfAccounts"
  description: "Structured list of accounts used for classification and reporting\
    \ of financial activity."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "versionEffectiveDate"
    type: "Date"
  relations:
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
- name: "Account"
  description: "Financial classification node capturing balances and activity for\
    \ reporting purposes."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "accountType"
    type: "AccountType"
  - name: "normalBalance"
    type: "NormalBalance"
  - name: "reportingLineHint"
    type: "String"
  relations:
  - name: "chartOfAccounts"
    type: "ChartOfAccounts"
    multiplicity: "ManyToOne"
  - name: "parentAccount"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "childAccounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "statementLines"
    type: "StatementLine"
    multiplicity: "ManyToMany"
  - name: "eliminationRules"
    type: "EliminationRule"
    multiplicity: "ManyToMany"
- name: "AccountingPeriod"
  description: "Time bucket used for reporting, aligned to the fiscal calendar and\
    \ ledger close process."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "periodNumber"
    type: "Integer"
  - name: "fiscalYear"
    type: "Integer"
  - name: "periodType"
    type: "PeriodType"
  - name: "status"
    type: "PeriodStatus"
  relations:
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
  - name: "balances"
    type: "AccountBalance"
    multiplicity: "OneToMany"
- name: "AccountBalance"
  description: "Aggregated balances for an account, period, and scenario, optionally\
    \ by segment such as cost center or project."
  data:
  - name: "openingAmount"
    type: "Amount"
  - name: "debitAmount"
    type: "Amount"
  - name: "creditAmount"
    type: "Amount"
  - name: "endingAmount"
    type: "Amount"
  - name: "scenario"
    type: "ScenarioType"
  relations:
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "AccountingPeriod"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "costCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
- name: "StatementTemplate"
  description: "Versioned definition of a financial statement structure including\
    \ lines, hierarchy, and computation rules."
  data:
  - name: "name"
    type: "String"
  - name: "statementType"
    type: "StatementType"
  - name: "versionLabel"
    type: "String"
  - name: "consolidationScope"
    type: "ConsolidationScope"
  relations:
  - name: "lines"
    type: "StatementLine"
    multiplicity: "OneToMany"
  - name: "reportDefinitions"
    type: "ReportDefinition"
    multiplicity: "OneToMany"
- name: "StatementLine"
  description: "Line within a statement template that may aggregate accounts, other\
    \ lines, or calculated metrics."
  data:
  - name: "lineCode"
    type: "String"
  - name: "label"
    type: "String"
  - name: "lineType"
    type: "StatementLineType"
  - name: "computationType"
    type: "ComputationType"
  - name: "signConvention"
    type: "SignConvention"
  - name: "formula"
    type: "String"
  relations:
  - name: "template"
    type: "StatementTemplate"
    multiplicity: "ManyToOne"
  - name: "parentLine"
    type: "StatementLine"
    multiplicity: "ManyToOne"
  - name: "childLines"
    type: "StatementLine"
    multiplicity: "OneToMany"
  - name: "accounts"
    type: "Account"
    multiplicity: "ManyToMany"
  - name: "metrics"
    type: "MetricDefinition"
    multiplicity: "ManyToMany"
- name: "ReportDefinition"
  description: "Executable report configuration that binds a statement template with\
    \ parameters, format, and scope."
  data:
  - name: "name"
    type: "String"
  - name: "format"
    type: "ReportFormat"
  - name: "layoutVariant"
    type: "String"
  relations:
  - name: "template"
    type: "StatementTemplate"
    multiplicity: "ManyToOne"
  - name: "parameters"
    type: "ReportParameter"
    multiplicity: "OneToMany"
  - name: "assignedEntities"
    type: "ReportingEntity"
    multiplicity: "ManyToMany"
  - name: "runs"
    type: "ReportRun"
    multiplicity: "OneToMany"
  - name: "workflow"
    type: "ApprovalWorkflow"
    multiplicity: "OneToOne"
  - name: "dataConnectors"
    type: "DataConnector"
    multiplicity: "ManyToMany"
- name: "ReportParameter"
  description: "Name-value pair defining variable inputs to a report definition."
  data:
  - name: "name"
    type: "String"
  - name: "value"
    type: "String"
  - name: "parameterType"
    type: "ParameterType"
  relations:
  - name: "reportDefinition"
    type: "ReportDefinition"
    multiplicity: "ManyToOne"
- name: "ReportRun"
  description: "Execution instance of a report capturing parameters, status, timing,\
    \ and output location."
  data:
  - name: "runReference"
    type: "String"
  - name: "status"
    type: "ReportRunStatus"
  - name: "requestedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  - name: "outputUri"
    type: "String"
  - name: "scenario"
    type: "ScenarioType"
  - name: "requestedBy"
    type: "String"
  relations:
  - name: "reportDefinition"
    type: "ReportDefinition"
    multiplicity: "ManyToOne"
  - name: "reportingEntity"
    type: "ReportingEntity"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "AccountingPeriod"
    multiplicity: "ManyToOne"
- name: "ConsolidationGroup"
  description: "Grouping of reporting entities for consolidated financial reporting\
    \ with a designated consolidation method."
  data:
  - name: "name"
    type: "String"
  - name: "consolidationMethod"
    type: "ConsolidationMethod"
  - name: "reportingCurrency"
    type: "String"
  relations:
  - name: "members"
    type: "ReportingEntity"
    multiplicity: "ManyToMany"
  - name: "ownerships"
    type: "OwnershipInterest"
    multiplicity: "OneToMany"
  - name: "eliminationRules"
    type: "EliminationRule"
    multiplicity: "OneToMany"
- name: "OwnershipInterest"
  description: "Ownership relationship between parent and child entities within a\
    \ consolidation group."
  data:
  - name: "percentage"
    type: "Percentage"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "group"
    type: "ConsolidationGroup"
    multiplicity: "ManyToOne"
  - name: "parentEntity"
    type: "ReportingEntity"
    multiplicity: "ManyToOne"
  - name: "childEntity"
    type: "ReportingEntity"
    multiplicity: "ManyToOne"
- name: "EliminationRule"
  description: "Rule defining how intercompany balances or transactions are eliminated\
    \ during consolidation."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "EliminationRuleType"
  - name: "computationType"
    type: "ComputationType"
  - name: "formula"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "consolidationGroup"
    type: "ConsolidationGroup"
    multiplicity: "ManyToOne"
  - name: "accounts"
    type: "Account"
    multiplicity: "ManyToMany"
- name: "CostCenter"
  description: "Organizational segment used for reporting and analysis of expenses\
    \ and revenues."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  relations:
  - name: "reportingEntity"
    type: "ReportingEntity"
    multiplicity: "ManyToOne"
  - name: "parentCostCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
  - name: "childCostCenters"
    type: "CostCenter"
    multiplicity: "OneToMany"
  - name: "balances"
    type: "AccountBalance"
    multiplicity: "OneToMany"
- name: "Project"
  description: "Time-bounded initiative for which financial results are tracked and\
    \ reported."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "reportingEntity"
    type: "ReportingEntity"
    multiplicity: "ManyToOne"
  - name: "balances"
    type: "AccountBalance"
    multiplicity: "OneToMany"
- name: "MetricDefinition"
  description: "Definition of a calculated or aggregated metric used in reporting\
    \ and analysis."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "calculationMethod"
    type: "MetricCalculationMethod"
  - name: "expression"
    type: "String"
  relations:
  - name: "lines"
    type: "StatementLine"
    multiplicity: "ManyToMany"
  - name: "metricValues"
    type: "MetricValue"
    multiplicity: "OneToMany"
- name: "MetricValue"
  description: "Evaluated metric value for a given entity, period, and optional segment."
  data:
  - name: "value"
    type: "Decimal"
  - name: "scenario"
    type: "ScenarioType"
  relations:
  - name: "metricDefinition"
    type: "MetricDefinition"
    multiplicity: "ManyToOne"
  - name: "reportingEntity"
    type: "ReportingEntity"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "AccountingPeriod"
    multiplicity: "ManyToOne"
  - name: "costCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
- name: "VarianceDefinition"
  description: "Configuration specifying base and comparison scenarios for variance\
    \ analysis."
  data:
  - name: "name"
    type: "String"
  - name: "baseScenario"
    type: "ScenarioType"
  - name: "compareScenario"
    type: "ScenarioType"
  - name: "varianceType"
    type: "VarianceType"
  relations:
  - name: "relatedReport"
    type: "ReportDefinition"
    multiplicity: "ManyToOne"
  - name: "results"
    type: "VarianceResult"
    multiplicity: "OneToMany"
- name: "VarianceResult"
  description: "Computed difference between base and comparison values, with directional\
    \ interpretation."
  data:
  - name: "value"
    type: "Decimal"
  - name: "direction"
    type: "VarianceDirection"
  relations:
  - name: "varianceDefinition"
    type: "VarianceDefinition"
    multiplicity: "ManyToOne"
  - name: "metricDefinition"
    type: "MetricDefinition"
    multiplicity: "ManyToOne"
  - name: "entity"
    type: "ReportingEntity"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "AccountingPeriod"
    multiplicity: "ManyToOne"
- name: "DisclosureNote"
  description: "Narrative disclosure accompanying financial statements, including\
    \ policies and significant events."
  data:
  - name: "title"
    type: "String"
  - name: "disclosureType"
    type: "DisclosureType"
  - name: "content"
    type: "String"
  - name: "preparedBy"
    type: "String"
  - name: "preparedDate"
    type: "Date"
  relations:
  - name: "reportingEntity"
    type: "ReportingEntity"
    multiplicity: "ManyToOne"
  - name: "reportDefinition"
    type: "ReportDefinition"
    multiplicity: "ManyToOne"
- name: "DataConnector"
  description: "Logical integration endpoint used to source balances and dimensional\
    \ data for reporting."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "DataSourceType"
  - name: "connectionDetail"
    type: "String"
  - name: "lastSyncAt"
    type: "Date"
  - name: "status"
    type: "ConnectorStatus"
  relations:
  - name: "feeds"
    type: "DataFeed"
    multiplicity: "OneToMany"
  - name: "reportDefinitions"
    type: "ReportDefinition"
    multiplicity: "ManyToMany"
- name: "DataFeed"
  description: "Scheduled transfer of source data from a connector into the reporting\
    \ repository."
  data:
  - name: "name"
    type: "String"
  - name: "scheduleExpression"
    type: "String"
  - name: "lastRunAt"
    type: "Date"
  - name: "status"
    type: "DataFeedStatus"
  relations:
  - name: "connector"
    type: "DataConnector"
    multiplicity: "ManyToOne"
  - name: "targetLedger"
    type: "Ledger"
    multiplicity: "ManyToOne"
- name: "ExchangeRate"
  description: "Currency conversion rate used for translation and consolidation."
  data:
  - name: "fromCurrency"
    type: "String"
  - name: "toCurrency"
    type: "String"
  - name: "rate"
    type: "Decimal"
  - name: "rateType"
    type: "RateType"
  - name: "asOfDate"
    type: "Date"
  relations:
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
- name: "TranslationAdjustment"
  description: "Adjustment recorded to reflect currency translation differences for\
    \ reporting purposes."
  data:
  - name: "amount"
    type: "Amount"
  - name: "method"
    type: "CurrencyTranslationMethod"
  - name: "description"
    type: "String"
  relations:
  - name: "ledger"
    type: "Ledger"
    multiplicity: "ManyToOne"
  - name: "period"
    type: "AccountingPeriod"
    multiplicity: "ManyToOne"
  - name: "reportingEntity"
    type: "ReportingEntity"
    multiplicity: "ManyToOne"
- name: "CloseCalendar"
  description: "Timetable of activities and milestones for period-end close supporting\
    \ reporting deadlines."
  data:
  - name: "name"
    type: "String"
  - name: "periodType"
    type: "PeriodType"
  - name: "cutOffDate"
    type: "Date"
  - name: "status"
    type: "CloseStatus"
  relations:
  - name: "periods"
    type: "AccountingPeriod"
    multiplicity: "ManyToMany"
  - name: "reportingEntity"
    type: "ReportingEntity"
    multiplicity: "ManyToOne"
- name: "ApprovalWorkflow"
  description: "Governance process for review and approval of report content and issuance."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "ApprovalStatus"
  relations:
  - name: "reportDefinition"
    type: "ReportDefinition"
    multiplicity: "ManyToOne"
  - name: "approvers"
    type: "Approver"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "ApprovalRecord"
    multiplicity: "OneToMany"
- name: "Approver"
  description: "Person responsible for reviewing and approving a report within a workflow."
  data:
  - name: "name"
    type: "String"
  - name: "role"
    type: "String"
  - name: "email"
    type: "String"
  relations:
  - name: "workflow"
    type: "ApprovalWorkflow"
    multiplicity: "ManyToOne"
- name: "ApprovalRecord"
  description: "Decision recorded by an approver including timestamp and commentary."
  data:
  - name: "decision"
    type: "ApprovalDecision"
  - name: "decidedAt"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "workflow"
    type: "ApprovalWorkflow"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Approver"
    multiplicity: "ManyToOne"
enums:
- name: "LedgerType"
  description: "Classification of the ledger context used for reporting."
  data:
  - name: "Statutory"
  - name: "Management"
  - name: "Tax"
  - name: "Consolidation"
  - name: "Reporting"
- name: "SignConvention"
  description: "Rule determining whether amounts are displayed in natural or inverted\
    \ sign."
  data:
  - name: "Natural"
  - name: "Inverted"
- name: "AccountType"
  description: "Financial classification determining placement on statements and normal\
    \ balance."
  data:
  - name: "Asset"
  - name: "Liability"
  - name: "Equity"
  - name: "Revenue"
  - name: "Expense"
  - name: "ContraAsset"
  - name: "ContraLiability"
  - name: "ContraRevenue"
- name: "NormalBalance"
  description: "Expected balance orientation used for validation and presentation."
  data:
  - name: "Debit"
  - name: "Credit"
- name: "PeriodType"
  description: "Type of accounting period in the fiscal calendar."
  data:
  - name: "Month"
  - name: "Quarter"
  - name: "Year"
  - name: "Adjustment"
- name: "PeriodStatus"
  description: "Lifecycle state of an accounting period."
  data:
  - name: "Open"
  - name: "Closed"
  - name: "Locked"
- name: "StatementType"
  description: "Category of financial statement."
  data:
  - name: "BalanceSheet"
  - name: "IncomeStatement"
  - name: "CashFlow"
  - name: "Equity"
- name: "ConsolidationScope"
  description: "Scope of reporting in relation to consolidation."
  data:
  - name: "EntityOnly"
  - name: "Consolidated"
- name: "StatementLineType"
  description: "Presentation role of a statement line in the hierarchy."
  data:
  - name: "Header"
  - name: "Detail"
  - name: "Subtotal"
  - name: "Total"
  - name: "Note"
- name: "ComputationType"
  description: "Method used to derive the value of a statement line."
  data:
  - name: "Sum"
  - name: "Difference"
  - name: "Formula"
  - name: "Ratio"
  - name: "LinkAccount"
  - name: "Reference"
- name: "ReportFormat"
  description: "Output format for rendered reports."
  data:
  - name: "PDF"
  - name: "XLSX"
  - name: "HTML"
  - name: "CSV"
- name: "ParameterType"
  description: "Semantic type of a report parameter."
  data:
  - name: "Entity"
  - name: "Period"
  - name: "Scenario"
  - name: "Currency"
  - name: "Segment"
- name: "ReportRunStatus"
  description: "Execution status of a report run."
  data:
  - name: "Queued"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Cancelled"
- name: "ConsolidationMethod"
  description: "Technique applied for combining results of group members."
  data:
  - name: "Full"
  - name: "Proportionate"
  - name: "Equity"
- name: "EliminationRuleType"
  description: "Category of intercompany elimination to apply during consolidation."
  data:
  - name: "IntercompanySales"
  - name: "IntercompanyBalances"
  - name: "Dividends"
  - name: "UnrealizedProfit"
  - name: "InvestmentElimination"
- name: "MetricCalculationMethod"
  description: "Approach used to compute a metric."
  data:
  - name: "Aggregate"
  - name: "Ratio"
  - name: "CustomFormula"
  - name: "RollingAverage"
- name: "VarianceType"
  description: "Style of variance evaluation between two values."
  data:
  - name: "Absolute"
  - name: "Percentage"
  - name: "Rate"
- name: "VarianceDirection"
  description: "Interpretation of variance in terms of favorability."
  data:
  - name: "Favorable"
  - name: "Unfavorable"
  - name: "Neutral"
- name: "DisclosureType"
  description: "Nature of the disclosure note associated with a report."
  data:
  - name: "AccountingPolicy"
  - name: "ContingentLiability"
  - name: "SubsequentEvent"
  - name: "RiskManagement"
  - name: "SignificantJudgment"
- name: "DataSourceType"
  description: "Origin system type for reporting data ingestion."
  data:
  - name: "GeneralLedger"
  - name: "Subledger"
  - name: "DataWarehouse"
  - name: "Spreadsheet"
  - name: "ManualEntry"
- name: "ConnectorStatus"
  description: "Operational state of a data connector."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Error"
- name: "DataFeedStatus"
  description: "Execution status of a scheduled data feed."
  data:
  - name: "Scheduled"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Paused"
- name: "RateType"
  description: "Classification of exchange rate for translation."
  data:
  - name: "Spot"
  - name: "Average"
  - name: "Closing"
  - name: "Historical"
- name: "CurrencyTranslationMethod"
  description: "Methodology for translating foreign currency financials."
  data:
  - name: "CurrentRate"
  - name: "Temporal"
- name: "CloseStatus"
  description: "Status of the period-end close calendar."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
- name: "ApprovalStatus"
  description: "Overall status of the approval workflow."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
- name: "ApprovalDecision"
  description: "Specific decision recorded by an approver."
  data:
  - name: "Approved"
  - name: "Rejected"
  - name: "NeedsChanges"
- name: "ScenarioType"
  description: "Context of financial values used for reporting and analysis."
  data:
  - name: "Actual"
  - name: "Budget"
  - name: "Forecast"
  - name: "Plan"
  - name: "PriorYear"
valueObjects:
- name: "Amount"
  description: "Monetary value paired with a currency for reporting."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Percentage"
  description: "Proportional value expressed as a decimal fraction."
  data:
  - name: "value"
    type: "Decimal"
- name: "PeriodRange"
  description: "Continuous span of dates that defines a reporting window."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "FileReference"
  description: "Pointer to a file resource associated with reporting outputs or disclosures."
  data:
  - name: "fileName"
    type: "String"
  - name: "url"
    type: "String"
  - name: "contentType"
    type: "String"
