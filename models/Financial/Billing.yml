---
metadata:
  name: "HCIDL Billing Capabilities Model"
  description: "Canonical capability model for enterprise billing, covering account\
    \ setup, billing cycles, charge orchestration, invoice generation, delivery, adjustments,\
    \ and payment application."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Financial"
  type: "Capability"
  domain: "Billing"
entities:
- name: "CustomerAccount"
  description: "Party to be billed for goods or services, including preferences, taxation,\
    \ and financial terms."
  data:
  - name: "accountNumber"
    type: "String"
  - name: "name"
    type: "String"
  - name: "status"
    type: "AccountStatus"
  - name: "billToAddress"
    type: "Address"
  - name: "email"
    type: "EmailAddress"
  - name: "taxId"
    type: "TaxId"
  - name: "preferredCurrency"
    type: "String"
  - name: "creditLimit"
    type: "Money"
  relations:
  - name: "billingProfiles"
    type: "BillingProfile"
    multiplicity: "OneToMany"
  - name: "chargeInstances"
    type: "ChargeInstance"
    multiplicity: "OneToMany"
  - name: "usageRecords"
    type: "UsageRecord"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "statements"
    type: "Statement"
    multiplicity: "OneToMany"
  - name: "taxRateSchedules"
    type: "TaxRateSchedule"
    multiplicity: "ManyToMany"
- name: "BillingProfile"
  description: "Configuration of invoicing preferences and commercial terms for a\
    \ customer account."
  data:
  - name: "name"
    type: "String"
  - name: "paymentTerm"
    type: "PaymentTermType"
  - name: "deliveryMethod"
    type: "InvoiceDeliveryMethod"
  - name: "billCycleDay"
    type: "Integer"
  - name: "autoPayEnabled"
    type: "Boolean"
  - name: "taxExempt"
    type: "Boolean"
  - name: "language"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "remitToAddress"
    type: "Address"
  - name: "notificationEmail"
    type: "EmailAddress"
  relations:
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "billingCycle"
    type: "BillingCycle"
    multiplicity: "ManyToOne"
  - name: "deliveries"
    type: "InvoiceDelivery"
    multiplicity: "OneToMany"
- name: "BillingCycle"
  description: "Definition of the cadence and rules used to accumulate charges into\
    \ billing periods."
  data:
  - name: "name"
    type: "String"
  - name: "frequency"
    type: "BillingFrequency"
  - name: "anchorDay"
    type: "Integer"
  - name: "prorationPolicy"
    type: "ProrationPolicy"
  - name: "graceDays"
    type: "Integer"
  relations:
  - name: "profiles"
    type: "BillingProfile"
    multiplicity: "OneToMany"
  - name: "billRuns"
    type: "BillRun"
    multiplicity: "OneToMany"
- name: "ChargeDefinition"
  description: "Catalog definition of a billable charge with pricing attributes and\
    \ taxation flags."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
  - name: "chargeType"
    type: "ChargeType"
  - name: "timing"
    type: "ChargeTiming"
  - name: "defaultPrice"
    type: "Money"
  - name: "taxable"
    type: "Boolean"
  - name: "taxType"
    type: "TaxType"
  relations:
  - name: "chargeInstances"
    type: "ChargeInstance"
    multiplicity: "OneToMany"
  - name: "taxRateSchedules"
    type: "TaxRateSchedule"
    multiplicity: "ManyToMany"
  - name: "invoiceLines"
    type: "InvoiceLine"
    multiplicity: "OneToMany"
- name: "ChargeInstance"
  description: "Applied instance of a charge for a specific account over a defined\
    \ effective period."
  data:
  - name: "effectiveStart"
    type: "Date"
  - name: "effectiveEnd"
    type: "Date"
  - name: "quantity"
    type: "Quantity"
  - name: "unitPrice"
    type: "Money"
  - name: "status"
    type: "ChargeInstanceStatus"
  - name: "nextBillDate"
    type: "Date"
  - name: "billingAlignment"
    type: "BillingAlignment"
  relations:
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "definition"
    type: "ChargeDefinition"
    multiplicity: "ManyToOne"
  - name: "invoiceLines"
    type: "InvoiceLine"
    multiplicity: "OneToMany"
- name: "UsageRecord"
  description: "Measured consumption event that may be rated and billed according\
    \ to a charge definition."
  data:
  - name: "sourceSystem"
    type: "String"
  - name: "usageDate"
    type: "Date"
  - name: "quantity"
    type: "Quantity"
  - name: "status"
    type: "UsageRecordStatus"
  - name: "reference"
    type: "String"
  relations:
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "chargeDefinition"
    type: "ChargeDefinition"
    multiplicity: "ManyToOne"
  - name: "invoiceLine"
    type: "InvoiceLine"
    multiplicity: "ManyToOne"
- name: "BillRun"
  description: "Executed batch that aggregates charges for a billing cycle and generates\
    \ invoices."
  data:
  - name: "runCode"
    type: "String"
  - name: "billingPeriod"
    type: "BillingPeriodRange"
  - name: "status"
    type: "BillRunStatus"
  - name: "executedBy"
    type: "String"
  - name: "executedOn"
    type: "Date"
  relations:
  - name: "billingCycle"
    type: "BillingCycle"
    multiplicity: "ManyToOne"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
- name: "Invoice"
  description: "Commercial document requesting payment for billed charges within a\
    \ period."
  data:
  - name: "invoiceNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "InvoiceStatus"
  - name: "subTotal"
    type: "Money"
  - name: "taxTotal"
    type: "Money"
  - name: "total"
    type: "Money"
  - name: "balance"
    type: "Money"
  - name: "paymentTerm"
    type: "PaymentTermType"
  - name: "purchaseOrderNumber"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "InvoiceLine"
    multiplicity: "OneToMany"
  - name: "billRun"
    type: "BillRun"
    multiplicity: "ManyToOne"
  - name: "adjustments"
    type: "BillingAdjustment"
    multiplicity: "OneToMany"
  - name: "deliveries"
    type: "InvoiceDelivery"
    multiplicity: "OneToMany"
  - name: "allocations"
    type: "PaymentAllocation"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "BillingDocumentAttachment"
    multiplicity: "OneToMany"
  - name: "statement"
    type: "Statement"
    multiplicity: "ManyToOne"
- name: "InvoiceLine"
  description: "Line-level detail of an invoice representing a billed charge, usage,\
    \ discount, or adjustment."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "lineType"
    type: "InvoiceLineType"
  - name: "quantity"
    type: "Quantity"
  - name: "unitPrice"
    type: "Money"
  - name: "netAmount"
    type: "Money"
  - name: "taxRate"
    type: "Decimal"
  - name: "taxAmount"
    type: "Money"
  - name: "totalAmount"
    type: "Money"
  - name: "servicePeriod"
    type: "BillingPeriodRange"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "chargeInstance"
    type: "ChargeInstance"
    multiplicity: "ManyToOne"
  - name: "chargeDefinition"
    type: "ChargeDefinition"
    multiplicity: "ManyToOne"
  - name: "usageRecords"
    type: "UsageRecord"
    multiplicity: "OneToMany"
- name: "BillingAdjustment"
  description: "Credit or debit adjustment applied to an account or specific invoice\
    \ and line."
  data:
  - name: "adjustmentNumber"
    type: "String"
  - name: "adjustmentType"
    type: "AdjustmentType"
  - name: "reason"
    type: "AdjustmentReason"
  - name: "amount"
    type: "Money"
  - name: "appliedDate"
    type: "Date"
  - name: "status"
    type: "AdjustmentStatus"
  - name: "comment"
    type: "String"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "line"
    type: "InvoiceLine"
    multiplicity: "ManyToOne"
- name: "InvoiceDelivery"
  description: "Execution record of how and where an invoice was delivered to the\
    \ customer."
  data:
  - name: "method"
    type: "InvoiceDeliveryMethod"
  - name: "target"
    type: "String"
  - name: "status"
    type: "DeliveryStatus"
  - name: "deliveredOn"
    type: "Date"
  - name: "trackingReference"
    type: "String"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "profile"
    type: "BillingProfile"
    multiplicity: "ManyToOne"
- name: "Payment"
  description: "Remittance received from a customer intended to settle outstanding\
    \ invoice balances."
  data:
  - name: "paymentReference"
    type: "String"
  - name: "paymentDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "method"
    type: "PaymentMethod"
  - name: "status"
    type: "PaymentStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "allocations"
    type: "PaymentAllocation"
    multiplicity: "OneToMany"
  - name: "statement"
    type: "Statement"
    multiplicity: "ManyToOne"
- name: "PaymentAllocation"
  description: "Application of a payment amount to an invoice and optionally to an\
    \ individual line."
  data:
  - name: "amount"
    type: "Money"
  - name: "allocationDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "payment"
    type: "Payment"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "line"
    type: "InvoiceLine"
    multiplicity: "ManyToOne"
- name: "Statement"
  description: "Periodic summary of account activity including invoices, payments,\
    \ and adjustments."
  data:
  - name: "statementNumber"
    type: "String"
  - name: "period"
    type: "BillingPeriodRange"
  - name: "generatedOn"
    type: "Date"
  - name: "openingBalance"
    type: "Money"
  - name: "closingBalance"
    type: "Money"
  relations:
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
  - name: "adjustments"
    type: "BillingAdjustment"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "attachments"
    type: "BillingDocumentAttachment"
    multiplicity: "OneToMany"
- name: "TaxRateSchedule"
  description: "Jurisdictional tax rule with effective dates and applicable charge\
    \ scope."
  data:
  - name: "name"
    type: "String"
  - name: "jurisdiction"
    type: "String"
  - name: "taxType"
    type: "TaxType"
  - name: "rate"
    type: "Decimal"
  - name: "effectiveStart"
    type: "Date"
  - name: "effectiveEnd"
    type: "Date"
  relations:
  - name: "applicableCharges"
    type: "ChargeDefinition"
    multiplicity: "ManyToMany"
  - name: "accounts"
    type: "CustomerAccount"
    multiplicity: "ManyToMany"
- name: "BillingDocumentAttachment"
  description: "File or link attached to billing documents for distribution or audit."
  data:
  - name: "fileName"
    type: "String"
  - name: "fileType"
    type: "String"
  - name: "url"
    type: "String"
  - name: "uploadedOn"
    type: "Date"
  - name: "category"
    type: "AttachmentCategory"
  relations:
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
  - name: "statement"
    type: "Statement"
    multiplicity: "ManyToOne"
enums:
- name: "AccountStatus"
  description: "Lifecycle state of a customer account in the billing system."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Closed"
- name: "BillingFrequency"
  description: "Recurrence interval at which billing periods are generated."
  data:
  - name: "Weekly"
  - name: "SemiMonthly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Annually"
- name: "ProrationPolicy"
  description: "Rule applied when service periods start or end mid-cycle."
  data:
  - name: "None"
  - name: "ProrateFirst"
  - name: "ProrateLast"
  - name: "FullPeriod"
- name: "ChargeType"
  description: "Classification of a charge according to its commercial intent."
  data:
  - name: "Product"
  - name: "Service"
  - name: "Fee"
  - name: "Discount"
  - name: "Surcharge"
- name: "ChargeTiming"
  description: "Temporal behavior of a charge."
  data:
  - name: "OneTime"
  - name: "Recurring"
  - name: "Usage"
- name: "ChargeInstanceStatus"
  description: "Operational state of a charge applied to an account."
  data:
  - name: "Active"
  - name: "Paused"
  - name: "Cancelled"
  - name: "Expired"
- name: "BillingAlignment"
  description: "Alignment rule used to determine when recurring charges bill."
  data:
  - name: "Anniversary"
  - name: "Calendar"
- name: "UsageRecordStatus"
  description: "Processing status of a usage record from ingestion through billing."
  data:
  - name: "Received"
  - name: "Rated"
  - name: "Billed"
  - name: "Rejected"
- name: "BillRunStatus"
  description: "Execution status of a bill run."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
  - name: "Failed"
- name: "InvoiceStatus"
  description: "Financial status of an invoice from issuance to settlement."
  data:
  - name: "Draft"
  - name: "Issued"
  - name: "PartiallyPaid"
  - name: "Paid"
  - name: "Overdue"
  - name: "Cancelled"
  - name: "WrittenOff"
- name: "InvoiceLineType"
  description: "Nature of an invoice line and how it contributes to totals."
  data:
  - name: "RecurringCharge"
  - name: "OneTimeCharge"
  - name: "UsageCharge"
  - name: "Discount"
  - name: "Adjustment"
  - name: "Tax"
- name: "AdjustmentType"
  description: "Indicates whether the adjustment increases or decreases the amount\
    \ due."
  data:
  - name: "Credit"
  - name: "Debit"
- name: "AdjustmentStatus"
  description: "Approval and application lifecycle of an adjustment."
  data:
  - name: "Draft"
  - name: "Approved"
  - name: "Applied"
  - name: "Reversed"
  - name: "Rejected"
- name: "AdjustmentReason"
  description: "Business reason for creating an adjustment."
  data:
  - name: "PricingError"
  - name: "ServiceIssue"
  - name: "Goodwill"
  - name: "TaxCorrection"
  - name: "Cancellation"
- name: "InvoiceDeliveryMethod"
  description: "Channel used to deliver invoices to customers."
  data:
  - name: "Email"
  - name: "Portal"
  - name: "PostalMail"
  - name: "EDI"
- name: "DeliveryStatus"
  description: "Current state of an invoice delivery attempt."
  data:
  - name: "Pending"
  - name: "Sent"
  - name: "Delivered"
  - name: "Failed"
- name: "PaymentMethod"
  description: "Method by which a customer remits payment."
  data:
  - name: "Card"
  - name: "BankTransfer"
  - name: "Cash"
  - name: "Check"
  - name: "DigitalWallet"
- name: "PaymentStatus"
  description: "Settlement status of a recorded payment."
  data:
  - name: "Pending"
  - name: "Settled"
  - name: "Failed"
  - name: "Refunded"
  - name: "PartiallySettled"
- name: "PaymentTermType"
  description: "Contractual time allowed for an invoice to be paid."
  data:
  - name: "DueOnReceipt"
  - name: "Net15"
  - name: "Net30"
  - name: "Net45"
  - name: "Net60"
  - name: "Custom"
- name: "TaxType"
  description: "Classification of tax applied to charges."
  data:
  - name: "VAT"
  - name: "SalesTax"
  - name: "GST"
  - name: "HST"
  - name: "ServiceTax"
  - name: "Withholding"
  - name: "None"
- name: "AttachmentCategory"
  description: "Semantic category for files attached to billing documents."
  data:
  - name: "InvoicePDF"
  - name: "StatementPDF"
  - name: "SupportingDocument"
valueObjects:
- name: "Money"
  description: "Monetary value paired with an ISO currency designation."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address used for billing and remittance."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "TaxId"
  description: "Registered tax identification associated with the billed party."
  data:
  - name: "value"
    type: "String"
  - name: "issuingCountry"
    type: "String"
- name: "Percentage"
  description: "Scalar value representing a percentage."
  data:
  - name: "value"
    type: "Decimal"
- name: "BillingPeriodRange"
  description: "Start and end dates for a billing period or service interval."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "EmailAddress"
  description: "Electronic mail address formatted per RFC standards."
  data:
  - name: "value"
    type: "String"
- name: "Quantity"
  description: "Measurable amount of a product or service with a unit of measure."
  data:
  - name: "value"
    type: "Decimal"
  - name: "unit"
    type: "String"
