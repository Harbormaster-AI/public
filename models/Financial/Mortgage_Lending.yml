    \ market, and servicing capabilities for residential mortgage lending."
  version: "1.0.0"
  industry: "Mortgage Lending"
  category: "Financial"
  language: "English"
  type: "Industry"
  domain: "Mortgage Lending"
entities:
- name: "Lender"
  description: "Licensed financial institution that originates, funds, sells, and\
    \ services mortgage loans."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "nmlsId"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "loanProducts"
    type: "LoanProduct"
    multiplicity: "OneToMany"
  - name: "branches"
    type: "Branch"
    multiplicity: "OneToMany"
  - name: "loanOfficers"
    type: "LoanOfficer"
    multiplicity: "OneToMany"
  - name: "brokers"
    type: "MortgageBroker"
    multiplicity: "ManyToMany"
  - name: "investors"
