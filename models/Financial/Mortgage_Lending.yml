    multiplicity: "ManyToOne"
  - name: "loanOfficers"
    type: "LoanOfficer"
    multiplicity: "OneToMany"
- name: "LoanOfficer"
  description: "Licensed individual responsible for advising borrowers and originating\
    \ applications."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "nmlsId"
    type: "String"
  - name: "email"
    type: "Email"
  - name: "phone"
    type: "PhoneNumber"
  relations:
  - name: "branch"
    type: "Branch"
    multiplicity: "ManyToOne"
  - name: "lender"
    type: "Lender"
    multiplicity: "ManyToOne"
