  - name: "epoch"
    type: "Epoch"
    multiplicity: "ManyToOne"
  - name: "validator"
    type: "Validator"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "token"
    type: "FungibleToken"
    multiplicity: "ManyToOne"
- name: "Block"
