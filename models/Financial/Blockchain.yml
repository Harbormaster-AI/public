    type: "_Hash"
  - name: "topic3"
    type: "_Hash"
  - name: "data"
    type: "HexData"
  relations:
  - name: "transaction"
    type: "Transaction"
    multiplicity: "ManyToOne"
  - name: "smartContract"
    type: "SmartContract"
    multiplicity: "ManyToOne"
  - name: "block"
    type: "Block"
    multiplicity: "ManyToOne"
