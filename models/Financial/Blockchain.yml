    multiplicity: "OneToMany"
metadata:
  name: "Blockchain Industry Domain Model"
  version: "1.0.0"
  industry: "Blockchain"
  category: "Financial"
  description: "HCIDL model capturing core blockchain networking, consensus, contracts,\
    \ tokens, governance, staking, fees, oracles, bridges, and indexing."
  type: "Industry"
  domain: "Blockchain"
enums:
- name: "NetworkType"
  description: "Classification of access and permissioning for a blockchain network."
  data:
  - name: "Public"
  - name: "Permissioned"
  - name: "Private"
  - name: "Testnet"
- name: "FinalityType"
  description: "Method by which blocks become irreversible or economically final."
  data:
  - name: "Probabilistic"
  - name: "BFT"
  - name: "Immediate"
  - name: "Economic"
- name: "NodeRole"
  description: "Primary functional role of a node in the network."
  data:
  - name: "Full"
  - name: "Light"
  - name: "Archive"
  - name: "Validator"
  - name: "Miner"
  - name: "Sequencer"
- name: "NodeStatus"
  description: "Operational state of a node."
  data:
  - name: "Joining"
  - name: "Syncing"
  - name: "Ready"
  - name: "Offline"
- name: "TokenStandard"
  description: "Interface standard implemented by fungible token contracts."
  data:
  - name: "ERC20"
  - name: "ERC777"
  - name: "SPL"
  - name: "FA1_2"
  - name: "FungibleCustom"
- name: "NFTStandard"
  description: "Interface standard implemented by non-fungible token contracts."
  data:
  - name: "ERC721"
  - name: "ERC1155"
  - name: "MetaplexNFT"
  - name: "NFTCustom"
- name: "TransactionStatus"
  description: "Lifecycle state of a transaction."
  data:
  - name: "Pending"
  - name: "Confirmed"
  - name: "Failed"
  - name: "Reverted"
- name: "SignatureScheme"
  description: "Cryptographic scheme used to sign data."
  data:
  - name: "ECDSA"
  - name: "Ed25519"
  - name: "Sr25519"
  - name: "BLS"
- name: "KeyAlgorithm"
  description: "Public key algorithm associated with a key pair."
  data:
  - name: "secp256k1"
  - name: "ed25519"
  - name: "sr25519"
  - name: "bls12_381"
- name: "ContractLanguage"
  description: "Programming language or framework used to author a smart contract."
  data:
  - name: "Solidity"
  - name: "Vyper"
  - name: "Rust"
  - name: "Go"
  - name: "Move"
- name: "FunctionMutability"
  description: "Mutability and value transfer properties of a contract function."
  data:
  - name: "View"
  - name: "Pure"
  - name: "NonPayable"
  - name: "Payable"
- name: "AccountType"
  description: "Category of account represented by an address."
  data:
  - name: "ExternallyOwned"
  - name: "Contract"
  - name: "Module"
  - name: "Multisig"
- name: "DelegationStatus"
  description: "Current bonding state of a delegation to a validator."
  data:
  - name: "Active"
  - name: "Unbonding"
  - name: "Unbonded"
  - name: "Slashed"
- name: "GovernanceModel"
  description: "Voting power assignment and decision mechanism for governance."
  data:
  - name: "TokenWeighted"
  - name: "ValidatorWeighted"
  - name: "OnePersonOneVote"
