  - name: "value"
    type: "Decimal"
  - name: "observedAt"
    type: "Date"
  relations:
  - name: "dataFeed"
    type: "DataFeed"
    multiplicity: "ManyToOne"
  - name: "transaction"
    type: "Transaction"
    multiplicity: "ManyToOne"
