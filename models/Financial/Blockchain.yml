    type: "Account"
    multiplicity: "ManyToOne"
  - name: "validator"
    type: "Validator"
    multiplicity: "ManyToOne"
  - name: "token"
    type: "FungibleToken"
    multiplicity: "ManyToOne"
- name: "Epoch"
