  - name: "name"
    type: "String"
  - name: "protocolFamily"
    type: "String"
  - name: "version"
    type: "String"
  relations:
  - name: "networks"
    type: "Network"
    multiplicity: "OneToMany"
- name: "Network"
  description: "Deployed blockchain network instance implementing a specific protocol\
    \ configuration."
  data:
  - name: "name"
    type: "String"
  - name: "networkId"
    type: "String"
  - name: "networkType"
    type: "NetworkType"
  - name: "genesisHash"
    type: "Hash"
  relations:
