    type: "String"
  - name: "commissionRate"
    type: "Decimal"
  - name: "stakingAddress"
    type: "Address"
  relations:
  - name: "node"
    type: "Node"
    multiplicity: "OneToOne"
  - name: "network"
    type: "Network"
    multiplicity: "ManyToOne"
  - name: "delegations"
    type: "StakingDelegation"
    multiplicity: "OneToMany"
- name: "StakingDelegation"
