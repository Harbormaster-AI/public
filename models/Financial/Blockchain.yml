  - name: "chainId"
    type: "String"
  - name: "finalityType"
    type: "FinalityType"
  - name: "blockTimeSeconds"
    type: "Integer"
  relations:
  - name: "network"
    type: "Network"
    multiplicity: "ManyToOne"
  - name: "blocks"
    type: "Block"
    multiplicity: "OneToMany"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "smartContracts"
    type: "SmartContract"
    multiplicity: "OneToMany"
  - name: "feeMarket"
    type: "FeeMarket"
    multiplicity: "OneToOne"
  - name: "governance"
    type: "GovernanceModule"
    multiplicity: "OneToOne"
  - name: "epochs"
    type: "Epoch"
    multiplicity: "OneToMany"
  - name: "fungibleTokens"
    type: "FungibleToken"
    multiplicity: "OneToMany"
  - name: "nftCollections"
    type: "NonFungibleToken"
    multiplicity: "OneToMany"
- name: "Node"
