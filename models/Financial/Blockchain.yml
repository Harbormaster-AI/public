    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "chain"
    type: "Chain"
    multiplicity: "ManyToOne"
  - name: "rewards"
    type: "RewardDistribution"
    multiplicity: "OneToMany"
- name: "RewardDistribution"
