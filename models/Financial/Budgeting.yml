---
metadata:
  name: "Budgeting"
  description: "Capabilities model for planning, managing, and governing financial\
    \ budgets across organizations, including versioning, assumptions, allocations,\
    \ approvals, constraints, and variance analysis."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Financial"
  type: "Capability"
  domain: "Budgeting"
entities:
- name: "OrganizationUnit"
  description: "Hierarchical planning entity such as a division, department, or cost\
    \ center."
  data:
  - name: "name"
    type: "String"
  - name: "unitType"
    type: "OrganizationUnitType"
  - name: "managerName"
    type: "String"
  relations:
  - name: "parent"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "OrganizationUnit"
    multiplicity: "OneToMany"
  - name: "planners"
    type: "Planner"
    multiplicity: "OneToMany"
- name: "Account"
  description: "Financial planning account, aligned with the chart of accounts hierarchy."
  data:
  - name: "name"
    type: "String"
  - name: "accountCode"
    type: "String"
  - name: "accountType"
    type: "AccountType"
  relations:
  - name: "parent"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "Account"
    multiplicity: "OneToMany"
- name: "Project"
  description: "Time-bound initiative used as a budgeting dimension for tracking planned\
    \ spend and benefits."
  data:
  - name: "name"
    type: "String"
  - name: "projectCode"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "owner"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
- name: "Planner"
  description: "Individual responsible for preparing, submitting, or adjusting budgets."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  relations:
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
- name: "BudgetCalendar"
  description: "Defines fiscal structure and periodization for planning cycles."
  data:
  - name: "name"
    type: "String"
  - name: "fiscalYearStartMonth"
    type: "Integer"
  - name: "timeGranularity"
    type: "TimeGranularity"
  - name: "numberOfPeriods"
    type: "Integer"
  relations:
  - name: "books"
    type: "BudgetBook"
    multiplicity: "OneToMany"
- name: "BudgetModel"
  description: "Structural definition of a budgeting framework including dimensions\
    \ and defaults."
  data:
  - name: "name"
    type: "String"
  - name: "timeGranularity"
    type: "TimeGranularity"
  - name: "defaultCurrency"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "organizationUnits"
    type: "OrganizationUnit"
    multiplicity: "OneToMany"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "spreadProfiles"
    type: "SpreadProfile"
    multiplicity: "OneToMany"
- name: "SpreadProfile"
  description: "Predefined distribution pattern for spreading amounts across periods."
  data:
  - name: "name"
    type: "String"
  - name: "spreadMethod"
    type: "SpreadMethod"
  - name: "notes"
    type: "String"
  relations:
  - name: "model"
    type: "BudgetModel"
    multiplicity: "ManyToOne"
- name: "BudgetBook"
  description: "A fiscal-year planning container that governs scenarios, versions,\
    \ and approvals."
  data:
  - name: "name"
    type: "String"
  - name: "fiscalYear"
    type: "Integer"
  - name: "status"
    type: "BudgetStatus"
  - name: "description"
    type: "String"
  relations:
  - name: "model"
    type: "BudgetModel"
    multiplicity: "ManyToOne"
  - name: "calendar"
    type: "BudgetCalendar"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "scenarios"
    type: "Scenario"
    multiplicity: "OneToMany"
  - name: "versions"
    type: "BudgetVersion"
    multiplicity: "OneToMany"
  - name: "approvalWorkflow"
    type: "ApprovalWorkflow"
    multiplicity: "ManyToOne"
  - name: "rateTables"
    type: "CurrencyRateTable"
    multiplicity: "OneToMany"
- name: "Scenario"
  description: "Planning perspective representing an alternative set of assumptions\
    \ or outcomes."
  data:
  - name: "name"
    type: "String"
  - name: "scenarioType"
    type: "ScenarioType"
  - name: "description"
    type: "String"
  relations:
  - name: "budgetBook"
    type: "BudgetBook"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "BudgetVersion"
    multiplicity: "OneToMany"
- name: "BudgetVersion"
  description: "A snapshot of budget data and assumptions for a specific scenario\
    \ and period."
  data:
  - name: "name"
    type: "String"
  - name: "versionType"
    type: "VersionType"
  - name: "status"
    type: "BudgetStatus"
  - name: "createdOn"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "budgetBook"
    type: "BudgetBook"
    multiplicity: "ManyToOne"
  - name: "scenario"
    type: "Scenario"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "Planner"
    multiplicity: "ManyToOne"
  - name: "lineItems"
    type: "BudgetLineItem"
    multiplicity: "OneToMany"
  - name: "allocationRules"
    type: "AllocationRule"
    multiplicity: "OneToMany"
  - name: "assumptions"
    type: "Assumption"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "BudgetApproval"
    multiplicity: "OneToMany"
  - name: "adjustments"
    type: "BudgetAdjustment"
    multiplicity: "OneToMany"
  - name: "transfers"
    type: "BudgetTransfer"
    multiplicity: "OneToMany"
  - name: "constraints"
    type: "BudgetConstraint"
    multiplicity: "OneToMany"
  - name: "varianceAnalyses"
    type: "VarianceAnalysis"
    multiplicity: "OneToMany"
  - name: "dataImports"
    type: "DataImportJob"
    multiplicity: "OneToMany"
  - name: "rateTable"
    type: "CurrencyRateTable"
    multiplicity: "ManyToOne"
- name: "BudgetLineItem"
  description: "Atomic planned amount for a specific period and dimensional intersection."
  data:
  - name: "lineType"
    type: "LineType"
  - name: "description"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "period"
    type: "FiscalPeriod"
  relations:
  - name: "budgetVersion"
    type: "BudgetVersion"
    multiplicity: "ManyToOne"
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "spreadProfile"
    type: "SpreadProfile"
    multiplicity: "ManyToOne"
  - name: "allocationRule"
    type: "AllocationRule"
    multiplicity: "ManyToOne"
- name: "AllocationRule"
  description: "Instruction that distributes source amounts across targets based on\
    \ a method or driver."
  data:
  - name: "name"
    type: "String"
  - name: "method"
    type: "AllocationMethod"
  - name: "weight"
    type: "Decimal"
  - name: "fixedAmount"
    type: "Money"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "budgetVersion"
    type: "BudgetVersion"
    multiplicity: "ManyToOne"
  - name: "driver"
    type: "PlanningDriver"
    multiplicity: "ManyToOne"
  - name: "sourceAccount"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "targetAccounts"
    type: "Account"
    multiplicity: "ManyToMany"
  - name: "sourceOrganizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "targetOrganizationUnits"
    type: "OrganizationUnit"
    multiplicity: "ManyToMany"
- name: "PlanningDriver"
  description: "Quantitative driver influencing budget calculations, such as volume\
    \ or headcount."
  data:
  - name: "name"
    type: "String"
  - name: "driverType"
    type: "DriverType"
  - name: "value"
    type: "Decimal"
  - name: "unit"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "budgetVersion"
    type: "BudgetVersion"
    multiplicity: "ManyToOne"
- name: "Assumption"
  description: "Parameterized planning input used to calculate or constrain budget\
    \ outcomes."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "value"
    type: "Decimal"
  - name: "unit"
    type: "String"
  - name: "effectiveFrom"
    type: "Date"
  - name: "effectiveTo"
    type: "Date"
  relations:
  - name: "budgetVersion"
    type: "BudgetVersion"
    multiplicity: "ManyToOne"
  - name: "relatedDriver"
    type: "PlanningDriver"
    multiplicity: "ManyToOne"
- name: "ApprovalWorkflow"
  description: "Configured sequence of review steps and thresholds governing budget\
    \ approvals."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "threshold"
    type: "Money"
  relations:
  - name: "budgetBook"
    type: "BudgetBook"
    multiplicity: "ManyToOne"
  - name: "steps"
    type: "ApprovalStep"
    multiplicity: "OneToMany"
- name: "ApprovalStep"
  description: "Ordered stage in the workflow containing criteria and assignees."
  data:
  - name: "stepOrder"
    type: "Integer"
  - name: "criteria"
    type: "String"
  relations:
  - name: "workflow"
    type: "ApprovalWorkflow"
    multiplicity: "ManyToOne"
  - name: "approvers"
    type: "Approver"
    multiplicity: "ManyToMany"
- name: "Approver"
  description: "Person authorized to review and approve budget submissions."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "String"
  relations:
  - name: "approvalSteps"
    type: "ApprovalStep"
    multiplicity: "ManyToMany"
  - name: "approvals"
    type: "BudgetApproval"
    multiplicity: "OneToMany"
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
- name: "BudgetApproval"
  description: "Decision record for an approval step on a budget version."
  data:
  - name: "status"
    type: "ApprovalStatus"
  - name: "decisionDate"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "budgetVersion"
    type: "BudgetVersion"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Approver"
    multiplicity: "ManyToOne"
  - name: "step"
    type: "ApprovalStep"
    multiplicity: "ManyToOne"
- name: "BudgetAdjustment"
  description: "Directed change to budget values for a specific period and context."
  data:
  - name: "adjustmentType"
    type: "AdjustmentType"
  - name: "reason"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "period"
    type: "FiscalPeriod"
  - name: "createdOn"
    type: "Date"
  relations:
  - name: "budgetVersion"
    type: "BudgetVersion"
    multiplicity: "ManyToOne"
  - name: "lineItem"
    type: "BudgetLineItem"
    multiplicity: "ManyToOne"
  - name: "requestedBy"
    type: "Planner"
    multiplicity: "ManyToOne"
- name: "BudgetTransfer"
  description: "Movement of planned amounts between contexts while preserving auditability."
  data:
  - name: "transferType"
    type: "TransferType"
  - name: "memo"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "period"
    type: "FiscalPeriod"
  - name: "transferDate"
    type: "Date"
  relations:
  - name: "budgetVersion"
    type: "BudgetVersion"
    multiplicity: "ManyToOne"
  - name: "sourceLineItem"
    type: "BudgetLineItem"
    multiplicity: "ManyToOne"
  - name: "targetLineItem"
    type: "BudgetLineItem"
    multiplicity: "ManyToOne"
  - name: "requestedBy"
    type: "Planner"
    multiplicity: "ManyToOne"
- name: "VarianceAnalysis"
  description: "Comparison of two budget versions that quantifies and explains differences."
  data:
  - name: "asOfDate"
    type: "Date"
  - name: "totalVariance"
    type: "Money"
  - name: "commentary"
    type: "String"
  relations:
  - name: "baseVersion"
    type: "BudgetVersion"
    multiplicity: "ManyToOne"
  - name: "compareVersion"
    type: "BudgetVersion"
    multiplicity: "ManyToOne"
  - name: "varianceLines"
    type: "VarianceLine"
    multiplicity: "OneToMany"
- name: "VarianceLine"
  description: "Detailed variance by period and dimension with type attribution."
  data:
  - name: "varianceType"
    type: "VarianceType"
  - name: "amount"
    type: "Money"
  - name: "percent"
    type: "Decimal"
  - name: "period"
    type: "FiscalPeriod"
  relations:
  - name: "varianceAnalysis"
    type: "VarianceAnalysis"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
- name: "DataImportJob"
  description: "Scheduled or on-demand import that loads external data to support\
    \ budgeting."
  data:
  - name: "name"
    type: "String"
  - name: "sourceSystem"
    type: "String"
  - name: "scheduledAt"
    type: "Date"
  - name: "status"
    type: "ImportStatus"
  relations:
  - name: "budgetVersion"
    type: "BudgetVersion"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "Planner"
    multiplicity: "ManyToOne"
- name: "CurrencyRateTable"
  description: "Set of currency conversion rates applicable to a budgeting horizon."
  data:
  - name: "name"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "baseCurrency"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "budgetBook"
    type: "BudgetBook"
    multiplicity: "ManyToOne"
  - name: "rates"
    type: "CurrencyRate"
    multiplicity: "OneToMany"
- name: "CurrencyRate"
  description: "Direct conversion rate between two currencies."
  data:
  - name: "fromCurrency"
    type: "String"
  - name: "toCurrency"
    type: "String"
  - name: "rate"
    type: "Decimal"
  relations:
  - name: "table"
    type: "CurrencyRateTable"
    multiplicity: "ManyToOne"
- name: "BudgetConstraint"
  description: "Policy limiting or targeting amounts for a given dimension and scope."
  data:
  - name: "name"
    type: "String"
  - name: "constraintType"
    type: "ConstraintType"
  - name: "dimension"
    type: "ConstrainedDimension"
  - name: "threshold"
    type: "Money"
  - name: "notes"
    type: "String"
  relations:
  - name: "budgetVersion"
    type: "BudgetVersion"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
enums:
- name: "BudgetStatus"
  description: "Lifecycle state of a budget entity during planning and governance."
  data:
  - name: "Draft"
  - name: "InProgress"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Archived"
- name: "VersionType"
  description: "Classification of a budget version based on purpose and timing."
  data:
  - name: "Working"
  - name: "Baseline"
  - name: "Approved"
  - name: "Forecast"
  - name: "Reforecast"
  - name: "ActualsSnapshot"
- name: "AllocationMethod"
  description: "Technique used to distribute amounts from a source to one or more\
    \ targets."
  data:
  - name: "EvenSpread"
  - name: "Proportional"
  - name: "DriverBased"
  - name: "FixedAmount"
  - name: "StepDown"
- name: "TimeGranularity"
  description: "Periodic resolution used for planning and reporting."
  data:
  - name: "Weekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Annual"
- name: "ApprovalStatus"
  description: "Decision state within an approval workflow."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "Approved"
  - name: "Rejected"
  - name: "Returned"
- name: "DriverType"
  description: "Category of planning driver used to compute budget values."
  data:
  - name: "Headcount"
  - name: "Revenue"
  - name: "Volume"
  - name: "Rate"
  - name: "Index"
  - name: "Efficiency"
- name: "VarianceType"
  description: "Attribution category used to explain variances."
  data:
  - name: "Volume"
  - name: "Rate"
  - name: "Mix"
  - name: "Timing"
  - name: "OneTime"
  - name: "Currency"
- name: "LineType"
  description: "Classification of a budget line item for calculation and reporting."
  data:
  - name: "OperatingExpense"
  - name: "CapitalExpense"
  - name: "Revenue"
  - name: "Headcount"
  - name: "Transfer"
- name: "TransferType"
  description: "Nature of a transfer indicating permanence or reversibility."
  data:
  - name: "Permanent"
  - name: "Temporary"
- name: "AdjustmentType"
  description: "Direction or intent of a budget adjustment."
  data:
  - name: "Increase"
  - name: "Decrease"
  - name: "Reclass"
- name: "ScenarioType"
  description: "Conceptual framing used to explore alternative budget outcomes."
  data:
  - name: "BaseCase"
  - name: "BestCase"
  - name: "WorstCase"
  - name: "WhatIf"
  - name: "StressTest"
- name: "SpreadMethod"
  description: "Algorithm for distributing annualized values across periods."
  data:
  - name: "Even"
  - name: "Seasonality"
  - name: "FrontLoaded"
  - name: "BackLoaded"
  - name: "Custom"
- name: "OrganizationUnitType"
  description: "Structural classification of an organizational unit for planning."
  data:
  - name: "Corporate"
  - name: "Division"
  - name: "Department"
  - name: "CostCenter"
  - name: "Region"
- name: "AccountType"
  description: "Financial account classification to guide aggregation and behavior."
  data:
  - name: "Revenue"
  - name: "Expense"
  - name: "Asset"
  - name: "Liability"
  - name: "Equity"
  - name: "Statistical"
- name: "ImportStatus"
  description: "Execution state of a data import job."
  data:
  - name: "Pending"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Cancelled"
- name: "ConstraintType"
  description: "Type of policy applied to control or guide budget amounts."
  data:
  - name: "Ceiling"
  - name: "Floor"
  - name: "Target"
- name: "ConstrainedDimension"
  description: "Dimension to which a constraint is applied."
  data:
  - name: "Account"
  - name: "OrganizationUnit"
  - name: "Project"
  - name: "Total"
valueObjects:
- name: "Money"
  description: "Monetary amount expressed in a specific currency."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "FiscalPeriod"
  description: "Identifies a discrete planning period within a fiscal year."
  data:
  - name: "fiscalYear"
    type: "Integer"
  - name: "periodNumber"
    type: "Integer"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "label"
    type: "String"
