---
metadata:
  name: "HCIDL Expense Management"
  description: "Capability model for enterprise expense management including capture,\
    \ policy control, approvals, travel, taxation, audit, export, card reconciliation,\
    \ and reimbursement."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Financial"
  type: "Capability"
  domain: "Expense Management"
entities:
- name: "Organization"
  description: "Legal entity that owns expense policies, employees, and financial\
    \ configurations."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "timezone"
    type: "String"
  relations:
  - name: "units"
    type: "OrganizationUnit"
    multiplicity: "OneToMany"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "ExpensePolicy"
    multiplicity: "OneToMany"
- name: "OrganizationUnit"
  description: "Division or department within an organization, used for responsibility\
    \ and policy scope."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "OrganizationUnit"
    multiplicity: "OneToMany"
  - name: "costCenters"
    type: "CostCenter"
    multiplicity: "OneToMany"
  - name: "employees"
    type: "Employee"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "ExpensePolicy"
    multiplicity: "OneToMany"
- name: "CostCenter"
  description: "Financial responsibility area used to allocate expenses for reporting\
    \ and budgeting."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "owners"
    type: "Employee"
    multiplicity: "ManyToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
  - name: "expenseReports"
    type: "ExpenseReport"
    multiplicity: "OneToMany"
  - name: "expenseItems"
    type: "ExpenseItem"
    multiplicity: "OneToMany"
- name: "Employee"
  description: "Worker who submits expenses, approves transactions, or holds a corporate\
    \ card."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "employeeNumber"
    type: "String"
  - name: "locale"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "costCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
  - name: "manager"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "reports"
    type: "ExpenseReport"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "corporateCards"
    type: "CorporateCardAccount"
    multiplicity: "OneToMany"
  - name: "paymentProfile"
    type: "PaymentProfile"
    multiplicity: "OneToOne"
  - name: "delegationsAsDelegator"
    type: "ExpenseDelegate"
    multiplicity: "OneToMany"
  - name: "delegationsAsDelegate"
    type: "ExpenseDelegate"
    multiplicity: "OneToMany"
  - name: "travelRequests"
    type: "TravelRequest"
    multiplicity: "OneToMany"
  - name: "reimbursements"
    type: "Reimbursement"
    multiplicity: "OneToMany"
- name: "PaymentProfile"
  description: "Preferred and configured reimbursement details for an employee."
  data:
  - name: "preferredMethod"
    type: "ReimbursementMethod"
  - name: "bankName"
    type: "String"
  - name: "bankAccountNumberMasked"
    type: "String"
  - name: "bankRoutingNumberMasked"
    type: "String"
  - name: "payeeName"
    type: "String"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "ExpenseCategory"
  description: "Hierarchical classification that describes the nature of an expense."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "isReimbursable"
    type: "Boolean"
  relations:
  - name: "parent"
    type: "ExpenseCategory"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "ExpenseCategory"
    multiplicity: "OneToMany"
  - name: "items"
    type: "ExpenseItem"
    multiplicity: "OneToMany"
  - name: "policyRules"
    type: "PolicyRule"
    multiplicity: "OneToMany"
- name: "Project"
  description: "Work initiative against which expenses can be tracked and billed."
  data:
  - name: "name"
    type: "String"
  - name: "projectCode"
    type: "String"
  - name: "clientName"
    type: "String"
  - name: "billable"
    type: "Boolean"
  relations:
  - name: "costCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
  - name: "employees"
    type: "Employee"
    multiplicity: "ManyToMany"
  - name: "expenseReports"
    type: "ExpenseReport"
    multiplicity: "OneToMany"
  - name: "expenseItems"
    type: "ExpenseItem"
    multiplicity: "OneToMany"
- name: "Merchant"
  description: "Supplier or vendor where purchases are made, identified by category\
    \ and location."
  data:
  - name: "name"
    type: "String"
  - name: "mccCode"
    type: "String"
  - name: "category"
    type: "MerchantCategoryGroup"
  - name: "address"
    type: "Address"
  relations:
  - name: "expenses"
    type: "ExpenseItem"
    multiplicity: "OneToMany"
  - name: "receipts"
    type: "Receipt"
    multiplicity: "OneToMany"
  - name: "cardTransactions"
    type: "CardTransaction"
    multiplicity: "OneToMany"
  - name: "itinerarySegments"
    type: "ItinerarySegment"
    multiplicity: "OneToMany"
- name: "CorporateCardAccount"
  description: "Company-issued payment card used by employees for business spending."
  data:
  - name: "cardLastFour"
    type: "String"
  - name: "issuer"
    type: "String"
  - name: "programName"
    type: "String"
  - name: "status"
    type: "CardAccountStatus"
  - name: "creditLimit"
    type: "Money"
  relations:
  - name: "holder"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "CardTransaction"
    multiplicity: "OneToMany"
  - name: "reconciliations"
    type: "CardReconciliation"
    multiplicity: "OneToMany"
- name: "CardTransaction"
  description: "Transaction imported from a corporate card feed."
  data:
  - name: "postedDate"
    type: "Date"
  - name: "transactionDate"
    type: "Date"
  - name: "description"
    type: "String"
  - name: "status"
    type: "CardTransactionStatus"
  - name: "amount"
    type: "Money"
  - name: "foreignAmount"
    type: "Money"
  - name: "exchangeRate"
    type: "Decimal"
  - name: "referenceNumber"
    type: "String"
  relations:
  - name: "cardAccount"
    type: "CorporateCardAccount"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "expenseItem"
    type: "ExpenseItem"
    multiplicity: "OneToOne"
  - name: "reconciliation"
    type: "CardReconciliation"
    multiplicity: "ManyToOne"
  - name: "exchangeRateRef"
    type: "ExchangeRate"
    multiplicity: "ManyToOne"
  - name: "exportBatches"
    type: "ExportBatch"
    multiplicity: "ManyToMany"
- name: "CardReconciliation"
  description: "Process record that matches card transactions to reported expenses."
  data:
  - name: "reconciliationNumber"
    type: "String"
  - name: "status"
    type: "CardReconciliationStatus"
  - name: "reconciliationDate"
    type: "Date"
  - name: "variance"
    type: "Money"
  relations:
  - name: "cardAccount"
    type: "CorporateCardAccount"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "CardTransaction"
    multiplicity: "OneToMany"
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
- name: "ExpensePolicy"
  description: "Set of rules governing allowable expenses and receipt requirements."
  data:
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  - name: "effectivePeriod"
    type: "DateRange"
  - name: "isDefault"
    type: "Boolean"
  relations:
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "rules"
    type: "PolicyRule"
    multiplicity: "OneToMany"
- name: "PolicyRule"
  description: "Specific constraint or requirement within an expense policy."
  data:
  - name: "name"
    type: "String"
  - name: "severity"
    type: "PolicySeverity"
  - name: "appliesToExpenseType"
    type: "ExpenseType"
  - name: "maxAmountPerDay"
    type: "Decimal"
  - name: "receiptRequired"
    type: "Boolean"
  - name: "minReceiptAmount"
    type: "Decimal"
  - name: "requiresItemization"
    type: "Boolean"
  - name: "limitPerTrip"
    type: "Decimal"
  relations:
  - name: "policy"
    type: "ExpensePolicy"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "ExpenseCategory"
    multiplicity: "ManyToOne"
- name: "PolicyException"
  description: "Request to override a policy rule for a specific expense."
  data:
  - name: "reason"
    type: "String"
  - name: "requestedDate"
    type: "Date"
  - name: "decision"
    type: "PolicyExceptionDecision"
  - name: "notes"
    type: "String"
  relations:
  - name: "policyRule"
    type: "PolicyRule"
    multiplicity: "ManyToOne"
  - name: "expenseItem"
    type: "ExpenseItem"
    multiplicity: "ManyToOne"
  - name: "requestedBy"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "Approval"
  description: "Recorded decision by an authorized reviewer for a specific request."
  data:
  - name: "status"
    type: "ApprovalStatus"
  - name: "decisionDate"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "approver"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "expenseReport"
    type: "ExpenseReport"
    multiplicity: "ManyToOne"
  - name: "travelRequest"
    type: "TravelRequest"
    multiplicity: "ManyToOne"
  - name: "policyException"
    type: "PolicyException"
    multiplicity: "ManyToOne"
- name: "TravelRequest"
  description: "Pre-trip authorization describing business purpose, timing, and estimated\
    \ costs."
  data:
  - name: "requestNumber"
    type: "String"
  - name: "status"
    type: "TravelRequestStatus"
  - name: "purpose"
    type: "String"
  - name: "dateRange"
    type: "DateRange"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "trips"
    type: "Trip"
    multiplicity: "OneToMany"
  - name: "expenseReports"
    type: "ExpenseReport"
    multiplicity: "OneToMany"
- name: "Trip"
  description: "Actual business travel instance that groups itinerary segments."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "TripPurpose"
  - name: "dateRange"
    type: "DateRange"
  relations:
  - name: "travelRequest"
    type: "TravelRequest"
    multiplicity: "ManyToOne"
  - name: "segments"
    type: "ItinerarySegment"
    multiplicity: "OneToMany"
  - name: "expenseReports"
    type: "ExpenseReport"
    multiplicity: "OneToMany"
- name: "ItinerarySegment"
  description: "Booked travel component such as a flight, hotel, rail, or car rental."
  data:
  - name: "segmentType"
    type: "TravelSegmentType"
  - name: "carrierOrHotel"
    type: "String"
  - name: "departureDate"
    type: "Date"
  - name: "arrivalDate"
    type: "Date"
  - name: "origin"
    type: "String"
  - name: "destination"
    type: "String"
  - name: "bookingReference"
    type: "String"
  - name: "cost"
    type: "Money"
  relations:
  - name: "trip"
    type: "Trip"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
- name: "ExpenseReport"
  description: "Collection of expense items submitted together for review and reimbursement."
  data:
  - name: "reportNumber"
    type: "String"
  - name: "status"
    type: "ExpenseReportStatus"
  - name: "purpose"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "submissionDate"
    type: "Date"
  - name: "total"
    type: "Money"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "costCenter"
    type: "CostCenter"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "travelRequest"
    type: "TravelRequest"
    multiplicity: "ManyToOne"
  - name: "trip"
    type: "Trip"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "ExpenseItem"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "reimbursements"
    type: "Reimbursement"
    multiplicity: "OneToMany"
  - name: "cashAdvances"
    type: "CashAdvance"
    multiplicity: "ManyToMany"
  - name: "policyExceptions"
    type: "PolicyException"
    multiplicity: "OneToMany"
  - name: "auditRecords"
    type: "AuditRecord"
    multiplicity: "OneToMany"
  - name: "exchangeRates"
    type: "ExchangeRate"
    multiplicity: "OneToMany"
  - name: "exportBatches"
    type: "ExportBatch"
    multiplicity: "ManyToMany"
- name: "ExpenseItem"
  description: "Individual expense entry that may include receipts, taxes, and card\
    \ details."
  data:
  - name: "description"
    type: "String"
  - name: "expenseDate"
    type: "Date"
  - name: "expenseType"
    type: "ExpenseType"
  - name: "source"
    type: "ExpenseSource"
  - name: "amount"
    type: "Money"
  - name: "foreignAmount"
    type: "Money"
  - name: "exchangeRateApplied"
    type: "Decimal"
  - name: "isBillable"
    type: "Boolean"
  relations:
  - name: "expenseReport"
    type: "ExpenseReport"
    multiplicity: "ManyToOne"
  - name: "category"
    type: "ExpenseCategory"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "receipt"
    type: "Receipt"
    multiplicity: "OneToOne"
  - name: "cardTransaction"
    type: "CardTransaction"
    multiplicity: "ManyToOne"
  - name: "taxDetails"
    type: "TaxDetail"
    multiplicity: "OneToMany"
  - name: "mileageLog"
    type: "MileageLog"
    multiplicity: "ManyToOne"
  - name: "perDiemClaim"
    type: "PerDiemClaim"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "policyExceptions"
    type: "PolicyException"
    multiplicity: "OneToMany"
  - name: "auditRecords"
    type: "AuditRecord"
    multiplicity: "OneToMany"
  - name: "exchangeRateRef"
    type: "ExchangeRate"
    multiplicity: "ManyToOne"
- name: "Receipt"
  description: "Evidence of purchase captured as an image or electronic document."
  data:
  - name: "receiptNumber"
    type: "String"
  - name: "receiptType"
    type: "ReceiptType"
  - name: "captureMethod"
    type: "String"
  - name: "captureDate"
    type: "Date"
  - name: "total"
    type: "Money"
  - name: "media"
    type: "MediaReference"
  relations:
  - name: "expenseItem"
    type: "ExpenseItem"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
- name: "MileageLog"
  description: "Record of distance traveled using a personal vehicle for business\
    \ purposes."
  data:
  - name: "date"
    type: "Date"
  - name: "distance"
    type: "Distance"
  - name: "rate"
    type: "Money"
  - name: "routeDescription"
    type: "String"
  - name: "vehicleType"
    type: "MileageVehicleType"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "expenseItem"
    type: "ExpenseItem"
    multiplicity: "OneToOne"
- name: "PerDiemRate"
  description: "Authorized daily allowance for meals, lodging, or incidentals for\
    \ a specific location and time period."
  data:
  - name: "location"
    type: "String"
  - name: "perDiemType"
    type: "PerDiemType"
  - name: "amount"
    type: "Money"
  - name: "effectivePeriod"
    type: "DateRange"
  relations:
  - name: "organizationUnit"
    type: "OrganizationUnit"
    multiplicity: "ManyToOne"
  - name: "claims"
    type: "PerDiemClaim"
    multiplicity: "OneToMany"
- name: "PerDiemClaim"
  description: "Claimed per diem allowance for a range of travel dates."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "dailyRate"
    type: "Money"
  - name: "deductionsPercentage"
    type: "Decimal"
  - name: "notes"
    type: "String"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "expenseReport"
    type: "ExpenseReport"
    multiplicity: "ManyToOne"
  - name: "perDiemRate"
    type: "PerDiemRate"
    multiplicity: "ManyToOne"
  - name: "expenseItem"
    type: "ExpenseItem"
    multiplicity: "OneToOne"
- name: "CashAdvance"
  description: "Prepaid funds issued to an employee ahead of expected expenses."
  data:
  - name: "advanceNumber"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "issueDate"
    type: "Date"
  - name: "status"
    type: "CashAdvanceStatus"
  - name: "remainingBalance"
    type: "Money"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "expenseReports"
    type: "ExpenseReport"
    multiplicity: "ManyToMany"
  - name: "reimbursements"
    type: "Reimbursement"
    multiplicity: "OneToMany"
- name: "Reimbursement"
  description: "Payment made to an employee or offset against an advance for approved\
    \ expenses."
  data:
  - name: "referenceNumber"
    type: "String"
  - name: "method"
    type: "ReimbursementMethod"
  - name: "status"
    type: "PaymentStatus"
  - name: "scheduledDate"
    type: "Date"
  - name: "paidDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "expenseReport"
    type: "ExpenseReport"
    multiplicity: "ManyToOne"
  - name: "paymentBatch"
    type: "PaymentBatch"
    multiplicity: "ManyToOne"
  - name: "cashAdvance"
    type: "CashAdvance"
    multiplicity: "ManyToOne"
- name: "PaymentBatch"
  description: "Group of reimbursements processed together for disbursement."
  data:
  - name: "batchNumber"
    type: "String"
  - name: "status"
    type: "PaymentStatus"
  - name: "paymentDate"
    type: "Date"
  - name: "totalAmount"
    type: "Money"
  relations:
  - name: "reimbursements"
    type: "Reimbursement"
    multiplicity: "OneToMany"
  - name: "exportBatches"
    type: "ExportBatch"
    multiplicity: "OneToMany"
- name: "TaxRate"
  description: "Configured tax rate applicable to expenses based on jurisdiction and\
    \ type."
  data:
  - name: "name"
    type: "String"
  - name: "jurisdiction"
    type: "String"
  - name: "taxType"
    type: "TaxType"
  - name: "rate"
    type: "Decimal"
  - name: "effectivePeriod"
    type: "DateRange"
  relations:
  - name: "taxDetails"
    type: "TaxDetail"
    multiplicity: "OneToMany"
- name: "TaxDetail"
  description: "Calculated tax for an expense item including taxable base and amount."
  data:
  - name: "taxableAmount"
    type: "Money"
  - name: "taxAmount"
    type: "Money"
  - name: "taxType"
    type: "TaxType"
  relations:
  - name: "expenseItem"
    type: "ExpenseItem"
    multiplicity: "ManyToOne"
  - name: "taxRate"
    type: "TaxRate"
    multiplicity: "ManyToOne"
- name: "ExchangeRate"
  description: "Daily exchange rate used to convert foreign currency amounts."
  data:
  - name: "sourceCurrency"
    type: "String"
  - name: "targetCurrency"
    type: "String"
  - name: "rate"
    type: "Decimal"
  - name: "rateDate"
    type: "Date"
  relations:
  - name: "expenseReports"
    type: "ExpenseReport"
    multiplicity: "OneToMany"
  - name: "expenseItems"
    type: "ExpenseItem"
    multiplicity: "OneToMany"
  - name: "cardTransactions"
    type: "CardTransaction"
    multiplicity: "OneToMany"
- name: "AuditRecord"
  description: "Immutable history entry capturing actions, policy checks, and changes."
  data:
  - name: "eventType"
    type: "AuditEventType"
  - name: "eventDate"
    type: "Date"
  - name: "notes"
    type: "String"
  - name: "changedBy"
    type: "String"
  relations:
  - name: "employee"
    type: "Employee"
    multiplicity: "ManyToOne"
  - name: "expenseReport"
    type: "ExpenseReport"
    multiplicity: "ManyToOne"
  - name: "expenseItem"
    type: "ExpenseItem"
    multiplicity: "ManyToOne"
  - name: "policyRule"
    type: "PolicyRule"
    multiplicity: "ManyToOne"
- name: "ExportBatch"
  description: "Outbound integration package of expense data for external systems."
  data:
  - name: "exportNumber"
    type: "String"
  - name: "exportType"
    type: "ExportType"
  - name: "status"
    type: "ExportStatus"
  - name: "exportDate"
    type: "Date"
  - name: "destinationSystem"
    type: "String"
  relations:
  - name: "reports"
    type: "ExpenseReport"
    multiplicity: "OneToMany"
