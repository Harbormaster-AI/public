---
metadata:
  name: "Document Management Capabilities Model"
  description: "Canonical capability model for managing documents, versions, metadata,\
    \ access, lifecycle, and compliance across repositories and libraries."
  version: "1.0.0"
  industry: "All Industries"
  category: "Document & Content"
  type: "Capability"
  domain: "Document Management"
entities:
- name: "Repository"
  description: "Top-level content store that governs libraries, storage configuration,\
    \ and global governance policies."
  data:
  - name: "name"
    type: "String"
  - name: "defaultLocale"
    type: "LanguageCode"
  - name: "baseUrl"
    type: "Url"
  - name: "storageType"
    type: "ContentStorageType"
  - name: "isVersioningEnabled"
    type: "Boolean"
  relations:
  - name: "libraries"
    type: "Library"
    multiplicity: "OneToMany"
  - name: "retentionPolicies"
    type: "RetentionPolicy"
    multiplicity: "OneToMany"
- name: "Library"
  description: "Logical partition within a repository containing folders, documents,\
    \ templates, and local governance."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "isInheritanceEnabled"
    type: "Boolean"
  - name: "requiresCheckout"
    type: "Boolean"
  relations:
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "folders"
    type: "Folder"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "templates"
    type: "DocumentTemplate"
    multiplicity: "OneToMany"
  - name: "retentionPolicies"
    type: "RetentionPolicy"
    multiplicity: "ManyToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "watermarkPolicies"
    type: "WatermarkPolicy"
    multiplicity: "OneToMany"
- name: "Folder"
  description: "Hierarchical container organizing documents within a library."
  data:
  - name: "name"
    type: "String"
  - name: "path"
    type: "DocumentPath"
  - name: "isRecordCategory"
    type: "Boolean"
  relations:
  - name: "library"
    type: "Library"
    multiplicity: "ManyToOne"
  - name: "parentFolder"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "subfolders"
    type: "Folder"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
- name: "DocumentType"
  description: "Business classification for documents defining schema, templates,\
    \ and lifecycle behaviors."
  data:
  - name: "name"
    type: "String"
  - name: "lifecycleControlled"
    type: "Boolean"
  relations:
  - name: "metadataSchema"
    type: "MetadataSchema"
    multiplicity: "ManyToOne"
  - name: "templates"
    type: "DocumentTemplate"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "retentionPolicies"
    type: "RetentionPolicy"
    multiplicity: "ManyToMany"
- name: "MetadataSchema"
  description: "Logical schema grouping metadata fields for one or more document types."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  relations:
  - name: "fields"
    type: "MetadataField"
    multiplicity: "OneToMany"
  - name: "documentTypes"
    type: "DocumentType"
    multiplicity: "OneToMany"
- name: "MetadataField"
  description: "Field definition in a metadata schema including data type and validation\
    \ rules."
  data:
  - name: "name"
    type: "String"
  - name: "label"
    type: "String"
  - name: "fieldType"
    type: "MetadataFieldType"
  - name: "isRequired"
    type: "Boolean"
  - name: "isMultiValued"
    type: "Boolean"
  - name: "maxLength"
    type: "Integer"
  - name: "allowedPattern"
    type: "String"
  - name: "defaultValue"
    type: "String"
  relations:
  - name: "schema"
    type: "MetadataSchema"
    multiplicity: "ManyToOne"
- name: "DocumentTemplate"
  description: "Reusable starter content and metadata blueprint for creating documents\
    \ of a given type."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "fileNamePattern"
    type: "String"
  relations:
  - name: "documentType"
    type: "DocumentType"
    multiplicity: "ManyToOne"
  - name: "library"
    type: "Library"
    multiplicity: "ManyToOne"
  - name: "content"
    type: "ContentBlob"
    multiplicity: "ManyToOne"
- name: "Document"
  description: "Managed record containing content, metadata, version history, and\
    \ governance attributes."
  data:
  - name: "title"
    type: "String"
  - name: "fileName"
    type: "String"
  - name: "format"
    type: "DocumentFormat"
  - name: "mimeType"
    type: "MimeType"
  - name: "language"
    type: "LanguageCode"
  - name: "fileSize"
    type: "FileSize"
  - name: "status"
    type: "DocumentStatus"
  - name: "classification"
    type: "InformationClassification"
  - name: "isRecord"
    type: "Boolean"
  relations:
  - name: "library"
    type: "Library"
    multiplicity: "ManyToOne"
  - name: "folder"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "documentType"
    type: "DocumentType"
    multiplicity: "ManyToOne"
  - name: "currentVersion"
    type: "DocumentVersion"
    multiplicity: "OneToOne"
  - name: "versions"
    type: "DocumentVersion"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "legalHolds"
    type: "LegalHold"
    multiplicity: "ManyToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
  - name: "shareLinks"
    type: "ShareLink"
    multiplicity: "OneToMany"
  - name: "ingestBatch"
    type: "IngestBatch"
    multiplicity: "ManyToOne"
- name: "Tag"
  description: "Taxonomic label used to classify and discover documents."
  data:
  - name: "name"
    type: "String"
  - name: "normalizedKey"
    type: "String"
  relations:
  - name: "termSet"
    type: "TermSet"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "ManyToMany"
- name: "TermSet"
  description: "Controlled vocabulary group for tags managed within a taxonomy."
  data:
  - name: "name"
    type: "String"
  - name: "locale"
    type: "LanguageCode"
  relations:
  - name: "tags"
    type: "Tag"
    multiplicity: "OneToMany"
- name: "DocumentVersion"
  description: "Immutable snapshot of a document's content and metadata at a point\
    \ in time."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "status"
    type: "VersionStatus"
  - name: "checksum"
    type: "ContentHash"
  - name: "size"
    type: "FileSize"
  - name: "createdAt"
    type: "Date"
  - name: "changeSummary"
    type: "String"
  relations:
  - name: "document"
    type: "Document"
    multiplicity: "ManyToOne"
  - name: "content"
    type: "ContentBlob"
    multiplicity: "ManyToOne"
  - name: "renditions"
    type: "Rendition"
    multiplicity: "OneToMany"
  - name: "approvalWorkflow"
    type: "ApprovalWorkflow"
    multiplicity: "OneToOne"
  - name: "createdBy"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "metadataValues"
    type: "MetadataValue"
    multiplicity: "OneToMany"
  - name: "ocrRequests"
    type: "OCRRequest"
    multiplicity: "OneToMany"
- name: "ContentBlob"
  description: "Binary payload record describing where and how content is stored."
  data:
  - name: "storageType"
    type: "ContentStorageType"
  - name: "uri"
    type: "Url"
  - name: "mimeType"
    type: "MimeType"
  - name: "size"
    type: "FileSize"
  - name: "hash"
    type: "ContentHash"
  - name: "isEncrypted"
    type: "Boolean"
  relations:
  - name: "versions"
    type: "DocumentVersion"
    multiplicity: "OneToMany"
  - name: "renditions"
    type: "Rendition"
    multiplicity: "OneToMany"
- name: "Rendition"
  description: "Derived representation of a document version for preview, distribution,\
    \ or processing."
  data:
  - name: "renditionType"
    type: "RenditionType"
  - name: "mimeType"
    type: "MimeType"
  - name: "size"
    type: "FileSize"
  - name: "width"
    type: "Integer"
  - name: "height"
    type: "Integer"
  relations:
  - name: "version"
    type: "DocumentVersion"
    multiplicity: "ManyToOne"
  - name: "content"
    type: "ContentBlob"
    multiplicity: "ManyToOne"
- name: "MetadataValue"
  description: "Assigned value of a schema field for a specific document version."
  data:
  - name: "value"
    type: "String"
  - name: "language"
    type: "LanguageCode"
  relations:
  - name: "field"
    type: "MetadataField"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "DocumentVersion"
    multiplicity: "ManyToOne"
- name: "ApprovalWorkflow"
  description: "Routed approval process governing readiness of a document version."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "WorkflowStatus"
  - name: "startedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  relations:
  - name: "steps"
    type: "ApprovalStep"
    multiplicity: "OneToMany"
  - name: "version"
    type: "DocumentVersion"
    multiplicity: "ManyToOne"
  - name: "initiatedBy"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "ApprovalStep"
  description: "Single approval gate within a workflow including approver, timing,\
    \ and outcome."
  data:
  - name: "stepOrder"
    type: "Integer"
  - name: "decision"
    type: "ApprovalDecision"
  - name: "decidedAt"
    type: "Date"
  - name: "comment"
    type: "String"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "workflow"
    type: "ApprovalWorkflow"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "Principal"
  description: "Identity that can own content, perform actions, and be granted permissions."
  data:
  - name: "displayName"
    type: "String"
  - name: "principalType"
    type: "PrincipalType"
  - name: "email"
    type: "EmailAddress"
  - name: "isExternal"
    type: "Boolean"
  relations:
  - name: "groups"
    type: "Group"
    multiplicity: "ManyToMany"
  - name: "approvals"
    type: "ApprovalStep"
    multiplicity: "OneToMany"
- name: "Group"
  description: "Named collection of principals used to simplify permission assignment."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "members"
    type: "Principal"
    multiplicity: "ManyToMany"
- name: "AccessPolicy"
  description: "Permission assignment granting a principal specific access on a target\
    \ scope."
  data:
  - name: "permissionLevel"
    type: "PermissionLevel"
  - name: "scopeInherited"
    type: "Boolean"
  - name: "grantedAt"
    type: "Date"
  relations:
  - name: "library"
    type: "Library"
    multiplicity: "ManyToOne"
  - name: "folder"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "document"
    type: "Document"
    multiplicity: "ManyToOne"
  - name: "principal"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "DocumentLock"
  description: "Lock or checkout protecting a document from conflicting edits."
  data:
  - name: "lockType"
    type: "LockType"
  - name: "createdAt"
    type: "Date"
  - name: "expiresAt"
    type: "Date"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "document"
    type: "Document"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "RetentionPolicy"
  description: "Policy controlling retention duration and disposition actions for\
    \ governed content."
  data:
  - name: "name"
    type: "String"
  - name: "retentionPeriodMonths"
    type: "Integer"
  - name: "action"
    type: "RetentionAction"
  - name: "eventBased"
    type: "Boolean"
  - name: "description"
    type: "String"
  relations:
  - name: "libraries"
    type: "Library"
    multiplicity: "ManyToMany"
  - name: "documentTypes"
    type: "DocumentType"
    multiplicity: "ManyToMany"
- name: "LegalHold"
  description: "Preservation control preventing modification or deletion of held documents."
  data:
  - name: "name"
    type: "String"
  - name: "reason"
    type: "String"
  - name: "status"
    type: "HoldStatus"
  - name: "createdAt"
    type: "Date"
  relations:
  - name: "documents"
    type: "Document"
    multiplicity: "ManyToMany"
  - name: "owner"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "AuditEvent"
  description: "Immutable security and activity event associated with a document or\
    \ version."
  data:
  - name: "eventType"
    type: "AuditEventType"
  - name: "occurredAt"
    type: "Date"
  - name: "ipAddress"
    type: "String"
  - name: "userAgent"
    type: "String"
  - name: "detail"
    type: "String"
  relations:
  - name: "document"
    type: "Document"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "DocumentVersion"
    multiplicity: "ManyToOne"
  - name: "actor"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "ShareLink"
  description: "Time-bound link enabling controlled external or internal access to\
    \ content."
  data:
  - name: "token"
    type: "String"
  - name: "accessLevel"
    type: "ShareAccessLevel"
  - name: "expiresAt"
    type: "Date"
  - name: "isPasswordProtected"
    type: "Boolean"
  - name: "passwordHint"
    type: "String"
  relations:
  - name: "document"
    type: "Document"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "DocumentVersion"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "OCRRequest"
  description: "Request to extract machine-readable text from a document version."
  data:
  - name: "requestedAt"
    type: "Date"
  - name: "status"
    type: "OcrStatus"
  - name: "language"
    type: "LanguageCode"
  - name: "engine"
    type: "String"
  relations:
  - name: "version"
    type: "DocumentVersion"
    multiplicity: "ManyToOne"
  - name: "outputContent"
    type: "ContentBlob"
    multiplicity: "ManyToOne"
  - name: "requestedBy"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "IndexingTask"
  description: "Processing task that updates search or metadata indexes for content."
  data:
  - name: "status"
    type: "IndexingStatus"
  - name: "startedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  - name: "reason"
    type: "String"
  relations:
  - name: "document"
    type: "Document"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "DocumentVersion"
    multiplicity: "ManyToOne"
- name: "IngestBatch"
  description: "Grouped import operation bringing external content and metadata into\
    \ the repository."
  data:
  - name: "name"
    type: "String"
  - name: "sourceSystem"
    type: "String"
  - name: "startedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  - name: "status"
    type: "IngestStatus"
  relations:
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "WatermarkPolicy"
  description: "Policy defining dynamic watermarking applied to previews or downloads."
  data:
  - name: "isEnabled"
    type: "Boolean"
  - name: "settings"
    type: "WatermarkSettings"
  relations:
  - name: "libraries"
    type: "Library"
    multiplicity: "ManyToMany"
  - name: "documentTypes"
    type: "DocumentType"
    multiplicity: "ManyToMany"
enums:
- name: "DocumentStatus"
  description: "High-level lifecycle state representing a document's readiness and\
    \ distribution posture."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Approved"
  - name: "Published"
  - name: "Archived"
  - name: "Obsolete"
- name: "VersionStatus"
  description: "State of a specific document version from creation through deprecation."
  data:
  - name: "Draft"
  - name: "Final"
  - name: "Superseded"
  - name: "Withdrawn"
- name: "RenditionType"
  description: "Kind of derivative representation generated from a document version."
  data:
  - name: "Thumbnail"
  - name: "PreviewPDF"
  - name: "TextExtract"
  - name: "WebOptimized"
  - name: "ArchiveZip"
- name: "PermissionLevel"
  description: "Effective capability granted to a principal over a target scope."
  data:
  - name: "View"
  - name: "Comment"
  - name: "Edit"
  - name: "Manage"
  - name: "Owner"
- name: "ContentStorageType"
  description: "Backend storage mechanism used for persisting content."
  data:
  - name: "ObjectStorage"
  - name: "FileSystem"
  - name: "BlockStorage"
  - name: "ExternalURL"
- name: "MetadataFieldType"
  description: "Supported data types for metadata fields within schemas."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime"
  - name: "MultilineText"
  - name: "URL"
  - name: "TagReference"
  - name: "UserReference"
- name: "WorkflowStatus"
  description: "Execution state of a multi-step process such as approval or OCR."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "ApprovalDecision"
  description: "Outcome recorded for a single approval step."
  data:
  - name: "Approved"
  - name: "Rejected"
  - name: "ChangesRequested"
  - name: "Skipped"
- name: "LockType"
  description: "Nature of a lock enforced to protect document integrity."
  data:
  - name: "CheckOut"
  - name: "EditLock"
  - name: "ReadLock"
- name: "RetentionAction"
  description: "Disposition applied when retention period or event conditions are\
    \ met."
  data:
  - name: "Retain"
  - name: "Delete"
  - name: "Transfer"
  - name: "Review"
- name: "HoldStatus"
  description: "Lifecycle state of a legal hold control."
  data:
  - name: "Active"
  - name: "Released"
- name: "AuditEventType"
  description: "Classification of auditable actions affecting content or permissions."
  data:
  - name: "Created"
  - name: "Updated"
  - name: "Deleted"
  - name: "Versioned"
  - name: "CheckedOut"
  - name: "CheckedIn"
  - name: "Downloaded"
  - name: "Shared"
  - name: "PermissionChanged"
  - name: "Moved"
  - name: "Renamed"
  - name: "Restored"
- name: "ShareAccessLevel"
  description: "Access granted to a share link recipient."
  data:
  - name: "View"
  - name: "Comment"
  - name: "Edit"
  - name: "Owner"
- name: "PrincipalType"
  description: "Classification of an identity used for access control and authorship."
  data:
  - name: "User"
  - name: "Application"
  - name: "Service"
- name: "DocumentFormat"
  description: "Common document formats used for creation, sharing, and archiving."
  data:
  - name: "Unknown"
  - name: "PDF"
  - name: "DOCX"
  - name: "XLSX"
  - name: "PPTX"
  - name: "TXT"
  - name: "HTML"
  - name: "JPEG"
  - name: "PNG"
  - name: "TIFF"
  - name: "JSON"
  - name: "XML"
- name: "OcrStatus"
  description: "Processing status for OCR requests."
  data:
  - name: "Pending"
  - name: "InProgress"
  - name: "Completed"
  - name: "Failed"
- name: "IndexingStatus"
  description: "State of background indexing tasks that update search structures."
  data:
  - name: "Pending"
  - name: "Scheduled"
  - name: "Running"
  - name: "Completed"
  - name: "Failed"
  - name: "Skipped"
- name: "IngestStatus"
  description: "Execution status of a content ingestion batch operation."
  data:
  - name: "Draft"
  - name: "Running"
  - name: "Completed"
  - name: "Failed"
  - name: "Cancelled"
- name: "InformationClassification"
  description: "Sensitivity label indicating handling and sharing constraints."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Confidential"
  - name: "Restricted"
valueObjects:
- name: "MimeType"
  description: "IANA media type describing the content format."
  data:
  - name: "value"
    type: "String"
- name: "FileSize"
  description: "Size of a file or rendition measured in bytes."
  data:
  - name: "bytes"
    type: "Integer"
- name: "ContentHash"
  description: "Digest representing a content checksum used for integrity verification."
  data:
  - name: "algorithm"
    type: "String"
  - name: "value"
    type: "String"
- name: "Url"
  description: "Absolute resource locator pointing to an internal or external location."
  data:
  - name: "value"
    type: "String"
- name: "LanguageCode"
  description: "ISO language identifier used for content and metadata localization."
  data:
  - name: "value"
    type: "String"
- name: "DocumentPath"
  description: "Canonical, human-readable path representing folder hierarchy."
  data:
  - name: "value"
    type: "String"
- name: "EmailAddress"
  description: "Address used to contact a principal or recipient."
  data:
  - name: "value"
    type: "String"
- name: "WatermarkSettings"
  description: "Configuration for dynamic watermark text and presentation."
  data:
  - name: "text"
    type: "String"
  - name: "opacity"
    type: "Decimal"
  - name: "position"
    type: "String"
