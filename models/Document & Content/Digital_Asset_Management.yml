---
entities:
- name: "Organization"
  description: "Legal entity that owns libraries, users, storage endpoints, and contractual\
    \ rights."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "libraries"
    type: "Library"
    multiplicity: "OneToMany"
  - name: "users"
    type: "User"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "Group"
    multiplicity: "OneToMany"
  - name: "storageEndpoints"
    type: "StorageEndpoint"
    multiplicity: "OneToMany"
  - name: "partners"
    type: "ExternalPartner"
    multiplicity: "OneToMany"
  - name: "licenseAgreements"
    type: "LicenseAgreement"
    multiplicity: "OneToMany"
- name: "Library"
  description: "Logical repository that organizes assets, collections, schemas, and\
    \ delivery channels for a brand or department."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "defaultAccessLevel"
    type: "AccessLevel"
  - name: "timeZone"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "collections"
    type: "_Collection"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "metadataSchemas"
    type: "MetadataSchema"
    multiplicity: "ManyToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
  - name: "deliveryChannels"
    type: "DeliveryChannel"
    multiplicity: "OneToMany"
  - name: "transcodeProfiles"
    type: "TranscodeProfile"
    multiplicity: "ManyToMany"
- name: "_Collection"
  description: "Hierarchical grouping of assets; may be static or backed by a saved\
    \ search."
  data:
  - name: "name"
    type: "String"
  - name: "slug"
    type: "String"
  - name: "asSmart"
    type: "Boolean"
  relations:
  - name: "library"
    type: "Library"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "_Collection"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "_Collection"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "savedSearch"
    type: "SavedSearch"
    multiplicity: "OneToOne"
- name: "Asset"
  description: "Canonical digital asset record representing a managed media object."
  data:
  - name: "assetKey"
    type: "String"
  - name: "title"
    type: "String"
  - name: "assetType"
    type: "AssetType"
  - name: "mimeType"
    type: "MimeType"
  - name: "status"
    type: "AssetStatus"
  - name: "createdAt"
    type: "Date"
  - name: "updatedAt"
    type: "Date"
  - name: "fileSize"
    type: "Integer"
  relations:
  - name: "library"
    type: "Library"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "AssetVersion"
    multiplicity: "OneToMany"
  - name: "currentVersion"
    type: "AssetVersion"
    multiplicity: "OneToOne"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "taxonomyTerms"
    type: "TaxonomyTerm"
    multiplicity: "ManyToMany"
  - name: "usageRights"
    type: "UsageRights"
    multiplicity: "OneToOne"
  - name: "accessPolicy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
  - name: "renditions"
    type: "Rendition"
    multiplicity: "OneToMany"
  - name: "annotations"
    type: "Annotation"
    multiplicity: "OneToMany"
  - name: "workflows"
    type: "WorkflowInstance"
    multiplicity: "OneToMany"
  - name: "packages"
    type: "ContentPackage"
    multiplicity: "ManyToMany"
  - name: "relatedAssets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "publishJobs"
    type: "PublishJob"
    multiplicity: "OneToMany"
- name: "AssetVersion"
  description: "Immutable version of an asset with its own checksum, storage path,\
    \ and associated renditions."
  data:
  - name: "versionNumber"
    type: "Integer"
  - name: "checksum"
    type: "Checksum"
  - name: "size"
    type: "Integer"
  - name: "createdAt"
    type: "Date"
  - name: "storagePath"
    type: "URI"
  - name: "versionNote"
    type: "String"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "sourceIngest"
    type: "ContentIngest"
    multiplicity: "ManyToOne"
  - name: "renditions"
    type: "Rendition"
    multiplicity: "OneToMany"
  - name: "captions"
    type: "Caption"
    multiplicity: "OneToMany"
  - name: "transcript"
    type: "Transcript"
    multiplicity: "ManyToOne"
- name: "Rendition"
  description: "Derived representation of a source asset version for delivery or preview."
  data:
  - name: "name"
    type: "String"
  - name: "format"
    type: "RenditionFormat"
  - name: "width"
    type: "Integer"
  - name: "height"
    type: "Integer"
  - name: "bitrate"
    type: "Integer"
  - name: "duration"
    type: "Duration"
  - name: "colorProfile"
    type: "String"
  - name: "storagePath"
    type: "URI"
  - name: "fileSize"
    type: "Integer"
  relations:
  - name: "assetVersion"
    type: "AssetVersion"
    multiplicity: "ManyToOne"
  - name: "recipe"
    type: "DerivativeRecipe"
    multiplicity: "ManyToOne"
  - name: "deliveryChannels"
    type: "DeliveryChannel"
    multiplicity: "ManyToMany"
- name: "DerivativeRecipe"
  description: "Parameterized configuration used to produce renditions consistently."
  data:
  - name: "name"
    type: "String"
  - name: "recipeType"
    type: "RecipeType"
  - name: "targetFormat"
    type: "RenditionFormat"
  - name: "maxWidth"
    type: "Integer"
  - name: "maxHeight"
    type: "Integer"
  - name: "videoCodec"
    type: "VideoCodec"
  - name: "audioCodec"
    type: "AudioCodec"
  - name: "quality"
    type: "Integer"
  relations:
  - name: "transcodeProfile"
    type: "TranscodeProfile"
    multiplicity: "ManyToOne"
  - name: "renditions"
    type: "Rendition"
    multiplicity: "OneToMany"
- name: "TranscodeProfile"
  description: "Grouping of encoding parameters and recipes for a specific media type."
  data:
  - name: "name"
    type: "String"
  - name: "mediaType"
    type: "MediaType"
  - name: "description"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "recipes"
    type: "DerivativeRecipe"
    multiplicity: "OneToMany"
  - name: "libraries"
    type: "Library"
    multiplicity: "ManyToMany"
- name: "MetadataSchema"
  description: "Versioned definition of structured metadata fields and validation\
    \ rules."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "scope"
    type: "SchemaScope"
  - name: "jsonSchema"
    type: "String"
  relations:
  - name: "fields"
    type: "MetadataField"
    multiplicity: "OneToMany"
  - name: "libraries"
    type: "Library"
    multiplicity: "ManyToMany"
  - name: "templates"
    type: "MetadataTemplate"
    multiplicity: "OneToMany"
- name: "MetadataField"
  description: "Field definition within a metadata schema."
  data:
  - name: "name"
    type: "String"
  - name: "label"
    type: "String"
  - name: "dataType"
    type: "FieldDataType"
  - name: "required"
    type: "Boolean"
  - name: "multivalued"
    type: "Boolean"
  relations:
  - name: "schema"
    type: "MetadataSchema"
    multiplicity: "ManyToOne"
- name: "MetadataTemplate"
  description: "Predefined set of field values to accelerate metadata application."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "schema"
    type: "MetadataSchema"
    multiplicity: "ManyToOne"
  - name: "defaultValues"
    type: "MetadataValue"
    multiplicity: "OneToMany"
  - name: "library"
    type: "Library"
    multiplicity: "ManyToOne"
- name: "MetadataValue"
  description: "Concrete default value mapped to a schema field inside a template."
  data:
  - name: "fieldName"
    type: "String"
  - name: "value"
    type: "String"
  relations:
  - name: "template"
    type: "MetadataTemplate"
    multiplicity: "ManyToOne"
- name: "Tag"
  description: "User-applied keyword label for quick retrieval."
  data:
  - name: "name"
    type: "String"
  - name: "normalizedName"
    type: "String"
  relations:
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "library"
    type: "Library"
    multiplicity: "ManyToOne"
- name: "Taxonomy"
  description: "Controlled vocabulary that governs standardized metadata terms."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "terms"
    type: "TaxonomyTerm"
    multiplicity: "OneToMany"
  - name: "library"
    type: "Library"
    multiplicity: "ManyToOne"
- name: "TaxonomyTerm"
  description: "Managed hierarchical term within a taxonomy."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  relations:
  - name: "taxonomy"
    type: "Taxonomy"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "TaxonomyTerm"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "TaxonomyTerm"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
- name: "UsageRights"
  description: "Rights, restrictions, and validity for how an asset may be used."
  data:
  - name: "rightsStatus"
    type: "RightsStatus"
  - name: "notes"
    type: "String"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  - name: "territory"
    type: "String"
  relations:
  - name: "licenseAgreement"
    type: "LicenseAgreement"
    multiplicity: "ManyToOne"
  - name: "consentRecords"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
  - name: "asset"
    type: "Asset"
    multiplicity: "OneToOne"
- name: "LicenseAgreement"
  description: "Contractual agreement that defines permitted usage terms for assets."
  data:
  - name: "licenseNumber"
    type: "String"
  - name: "licenseType"
    type: "LicenseType"
  - name: "fee"
    type: "Money"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "supplierName"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "usageRights"
    type: "UsageRights"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
- name: "ConsentRecord"
  description: "Evidence of subject consent associated with usage rights."
  data:
  - name: "subjectName"
    type: "String"
  - name: "consentStatus"
    type: "ConsentStatus"
  - name: "consentDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "usageRights"
    type: "UsageRights"
    multiplicity: "ManyToOne"
  - name: "files"
    type: "ConsentFile"
    multiplicity: "OneToMany"
- name: "ConsentFile"
  description: "Digital file that documents or proves consent."
  data:
  - name: "fileName"
    type: "String"
  - name: "storagePath"
    type: "URI"
  relations:
  - name: "consentRecord"
    type: "ConsentRecord"
    multiplicity: "ManyToOne"
- name: "AccessPolicy"
  description: "Rule set that governs who can see, download, or share assets."
  data:
  - name: "name"
    type: "String"
  - name: "accessLevel"
    type: "AccessLevel"
  - name: "sharingEnabled"
    type: "Boolean"
  - name: "watermarkEnabled"
    type: "Boolean"
  relations:
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "Group"
    multiplicity: "ManyToMany"
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
- name: "User"
  description: "Person who interacts with the system to manage or consume assets."
  data:
  - name: "username"
    type: "String"
  - name: "email"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "status"
    type: "UserStatus"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "groups"
    type: "Group"
    multiplicity: "ManyToMany"
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "createdAssets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "assignedTasks"
    type: "WorkflowTask"
    multiplicity: "OneToMany"
- name: "Group"
  description: "Cohort of users managed together for access control."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "ManyToMany"
- name: "Role"
  description: "Named set of permissions assignable to users and groups."
  data:
  - name: "name"
    type: "String"
  - name: "roleType"
    type: "RoleType"
  relations:
  - name: "permissions"
    type: "Permission"
    multiplicity: "ManyToMany"
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "groups"
    type: "Group"
    multiplicity: "ManyToMany"
- name: "Permission"
  description: "Atomic authorization over a resource and scope."
  data:
  - name: "action"
    type: "PermissionAction"
  - name: "resource"
    type: "ResourceType"
  - name: "scope"
    type: "ScopeType"
  relations:
  - name: "roles"
    type: "Role"
    multiplicity: "ManyToMany"
- name: "Project"
  description: "Work container for planning, producing, or curating assets."
  data:
  - name: "name"
    type: "String"
  - name: "projectCode"
    type: "String"
  - name: "status"
    type: "ProjectStatus"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "library"
    type: "Library"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "workflows"
    type: "WorkflowInstance"
    multiplicity: "OneToMany"
  - name: "campaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
- name: "Campaign"
  description: "Marketing initiative that coordinates projects and distribution."
  data:
  - name: "name"
    type: "String"
  - name: "campaignCode"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
  - name: "distributionChannels"
    type: "DeliveryChannel"
    multiplicity: "ManyToMany"
- name: "WorkflowDefinition"
  description: "Blueprint describing stages and tasks for asset lifecycle processes."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "category"
    type: "String"
  relations:
  - name: "tasks"
    type: "TaskTemplate"
    multiplicity: "OneToMany"
  - name: "instances"
    type: "WorkflowInstance"
    multiplicity: "OneToMany"
  - name: "library"
    type: "Library"
    multiplicity: "ManyToOne"
- name: "TaskTemplate"
  description: "Reusable step definition within a workflow definition."
  data:
  - name: "name"
    type: "String"
  - name: "taskType"
    type: "TaskType"
  - name: "required"
    type: "Boolean"
  - name: "assigneeRole"
    type: "RoleType"
  relations:
  - name: "workflowDefinition"
    type: "WorkflowDefinition"
    multiplicity: "ManyToOne"
- name: "WorkflowInstance"
  description: "Executing workflow instance attached to assets or projects."
  data:
  - name: "startedAt"
    type: "Date"
  - name: "status"
    type: "WorkflowStatus"
  - name: "completedAt"
    type: "Date"
  relations:
  - name: "definition"
    type: "WorkflowDefinition"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "WorkflowTask"
    multiplicity: "OneToMany"
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "User"
    multiplicity: "ManyToOne"
- name: "WorkflowTask"
  description: "Unit of work within a workflow instance, assigned to a user."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "TaskStatus_"
  - name: "dueDate"
    type: "Date"
  - name: "priority"
    type: "TaskPriority"
  relations:
  - name: "instance"
    type: "WorkflowInstance"
    multiplicity: "ManyToOne"
  - name: "assignee"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "review"
    type: "Review"
    multiplicity: "OneToOne"
- name: "Review"
  description: "Structured approval decision with optional annotations."
  data:
  - name: "decision"
    type: "ApprovalDecision"
  - name: "comment"
    type: "String"
  - name: "decidedAt"
    type: "Date"
  relations:
  - name: "task"
    type: "WorkflowTask"
    multiplicity: "OneToOne"
  - name: "annotations"
    type: "Annotation"
    multiplicity: "OneToMany"
  - name: "reviewer"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Annotation"
  description: "Markup or note referencing a region or time range on an asset."
  data:
  - name: "body"
    type: "String"
  - name: "createdAt"
    type: "Date"
  - name: "shape"
    type: "AnnotationShape"
  - name: "x"
    type: "Integer"
  - name: "y"
    type: "Integer"
  - name: "width"
    type: "Integer"
  - name: "height"
    type: "Integer"
  - name: "timecode"
    type: "Timecode"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "review"
    type: "Review"
    multiplicity: "ManyToOne"
- name: "SavedSearch"
  description: "Persisted query created by a user; may back a smart collection."
  data:
  - name: "name"
    type: "String"
  - name: "query"
    type: "String"
  - name: "ownerUsername"
    type: "String"
  relations:
  - name: "collection"
    type: "_Collection"
    multiplicity: "OneToOne"
- name: "ContentIngest"
  description: "Process that acquires files into storage and registers them as asset\
    \ versions."
  data:
  - name: "ingestId"
    type: "String"
  - name: "source"
    type: "SourceType"
  - name: "status"
    type: "IngestStatus"
  - name: "startedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  relations:
  - name: "batch"
    type: "ImportBatch"
    multiplicity: "ManyToOne"
  - name: "assetVersions"
    type: "AssetVersion"
    multiplicity: "OneToMany"
  - name: "storageEndpoint"
    type: "StorageEndpoint"
    multiplicity: "ManyToOne"
- name: "ImportBatch"
  description: "Logical grouping of related ingests for operational tracking."
  data:
  - name: "batchId"
    type: "String"
  - name: "createdAt"
    type: "Date"
  - name: "createdBy"
    type: "String"
  relations:
  - name: "ingests"
    type: "ContentIngest"
    multiplicity: "OneToMany"
- name: "PublishJob"
  description: "Request to distribute an asset or rendition to a delivery channel."
  data:
  - name: "jobNumber"
    type: "String"
  - name: "status"
    type: "PublishStatus"
  - name: "requestedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "rendition"
    type: "Rendition"
    multiplicity: "ManyToOne"
  - name: "deliveryChannel"
    type: "DeliveryChannel"
    multiplicity: "ManyToOne"
- name: "DeliveryChannel"
  description: "Destination platform or system that receives published content."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "endpointUrl"
    type: "String"
  - name: "authenticationMethod"
    type: "AuthMethod"
  relations:
  - name: "library"
    type: "Library"
    multiplicity: "ManyToOne"
  - name: "publishJobs"
    type: "PublishJob"
    multiplicity: "OneToMany"
  - name: "renditions"
    type: "Rendition"
    multiplicity: "ManyToMany"
- name: "StorageEndpoint"
  description: "Physical or cloud-backed storage location for binary objects."
  data:
  - name: "name"
    type: "String"
  - name: "provider"
    type: "StorageProvider"
  - name: "storageClass"
    type: "StorageClass"
  - name: "bucket"
    type: "String"
  - name: "region"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "ingests"
    type: "ContentIngest"
    multiplicity: "OneToMany"
- name: "AuditEvent"
  description: "Immutable record of a significant action for compliance and traceability."
  data:
  - name: "eventType"
    type: "AuditEventType"
  - name: "occurredAt"
    type: "Date"
  - name: "actor"
    type: "String"
  - name: "resource"
    type: "ResourceType"
  - name: "details"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "ExternalPartner"
  description: "Third-party organization such as agencies, vendors, or distributors."
  data:
  - name: "name"
    type: "String"
  - name: "partnerType"
    type: "PartnerType"
  - name: "contactEmail"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "contracts"
    type: "LicenseAgreement"
    multiplicity: "OneToMany"
- name: "ContentPackage"
  description: "Logical bundle of related assets assembled for distribution."
  data:
  - name: "name"
    type: "String"
  - name: "packageCode"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "deliveryChannel"
    type: "DeliveryChannel"
    multiplicity: "ManyToOne"
- name: "Localization"
  description: "Locale-specific adaptation of an asset’s metadata or text."
  data:
  - name: "locale"
    type: "LanguageCode"
  - name: "title"
    type: "String"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "translations"
    type: "Translation"
    multiplicity: "OneToMany"
- name: "Translation"
  description: "Language-specific content for titles, descriptions, captions, or transcripts."
  data:
  - name: "language"
    type: "LanguageCode"
  - name: "content"
    type: "String"
  - name: "kind"
    type: "TranslationKind"
  relations:
  - name: "localization"
    type: "Localization"
    multiplicity: "ManyToOne"
- name: "Caption"
  description: "Timed text captions associated with a specific asset version."
  data:
  - name: "language"
    type: "LanguageCode"
  - name: "format"
    type: "CaptionFormat"
  - name: "storagePath"
    type: "URI"
  relations:
  - name: "assetVersion"
    type: "AssetVersion"
    multiplicity: "ManyToOne"
- name: "Transcript"
  description: "Full textual transcript derived from an asset version’s audio."
  data:
  - name: "language"
    type: "LanguageCode"
  - name: "content"
    type: "String"
  relations:
  - name: "assetVersion"
    type: "AssetVersion"
    multiplicity: "ManyToOne"
metadata:
  name: "Digital Asset Management Industry Domain Model"
  version: "1.0.0"
  industry: "Digital Asset Management"
  category: "Document & Content"
  description: "HCIDL model capturing core DAM capabilities spanning organizations,\
    \ libraries, assets, versions, renditions, metadata, rights, workflows, publishing,\
    \ storage, and governance."
  type: "Industry"
  domain: "Digital Asset Management"
