---
metadata:
  name: "Version Management Capability Model"
  description: "A capabilities model for managing versions of documents, files, and\
    \ digital assets, including branching, merging, approvals, retention, and audit\
    \ across repositories and content spaces."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Document & Content"
  type: "Capability"
  domain: "Version Management"
entities:
- name: "ContentSpace"
  description: "Top-level governance boundary that groups repositories and applies\
    \ shared policies."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "String"
  - name: "complianceTier"
    type: "ComplianceTier"
  - name: "createdOn"
    type: "DateTime"
  relations:
  - name: "repositories"
    type: "Repository"
    multiplicity: "OneToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
- name: "Repository"
  description: "Logical container that stores content items, version history, branches,\
    \ and policies."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "defaultBranch"
    type: "String"
  - name: "storageTier"
    type: "StorageTier"
  - name: "createdOn"
    type: "DateTime"
  - name: "retentionEnabled"
    type: "Boolean"
  relations:
  - name: "contentSpace"
    type: "ContentSpace"
    multiplicity: "ManyToOne"
  - name: "branches"
    type: "Branch"
    multiplicity: "OneToMany"
  - name: "contentItems"
    type: "ContentItem"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "OneToMany"
  - name: "snapshots"
    type: "Snapshot"
    multiplicity: "OneToMany"
  - name: "retentionRules"
    type: "RetentionRule"
    multiplicity: "OneToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "storageLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
- name: "Branch"
  description: "Named line of development within a repository that organizes concurrent\
    \ version histories."
  data:
  - name: "name"
    type: "String"
  - name: "branchType"
    type: "BranchType"
  - name: "isProtected"
    type: "Boolean"
  - name: "createdOn"
    type: "DateTime"
  relations:
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "baseBranch"
    type: "Branch"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "Version"
    multiplicity: "OneToMany"
  - name: "mergeRequestsAsSource"
    type: "MergeRequest"
    multiplicity: "OneToMany"
  - name: "mergeRequestsAsTarget"
    type: "MergeRequest"
    multiplicity: "OneToMany"
- name: "ContentItem"
  description: "Logical document or asset tracked over time with multiple versions."
  data:
  - name: "title"
    type: "String"
  - name: "contentType"
    type: "String"
  - name: "path"
    type: "Path"
  - name: "sizeBytes"
    type: "Integer"
  - name: "status"
    type: "ContentStatus"
  - name: "isLocked"
    type: "Boolean"
  relations:
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "currentVersion"
    type: "Version"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "Version"
    multiplicity: "OneToMany"
  - name: "locks"
    type: "Lock"
    multiplicity: "OneToMany"
  - name: "renditions"
    type: "Rendition"
    multiplicity: "OneToMany"
- name: "Version"
  description: "Immutable state of a content item with metadata, authorship, and lineage."
  data:
  - name: "sequenceNumber"
    type: "Integer"
  - name: "semanticVersion"
    type: "SemanticVersion"
  - name: "createdOn"
    type: "DateTime"
  - name: "message"
    type: "String"
  - name: "checksum"
    type: "Checksum"
  - name: "sizeBytes"
    type: "Integer"
  - name: "status"
    type: "VersionStatus"
  - name: "isMajor"
    type: "Boolean"
  relations:
  - name: "contentItem"
    type: "ContentItem"
    multiplicity: "ManyToOne"
  - name: "branch"
    type: "Branch"
    multiplicity: "ManyToOne"
  - name: "parentVersion"
    type: "Version"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "changeSet"
    type: "ChangeSet"
    multiplicity: "ManyToOne"
  - name: "tags"
    type: "Tag"
    multiplicity: "OneToMany"
  - name: "annotations"
    type: "Comment"
    multiplicity: "OneToMany"
  - name: "renditions"
    type: "Rendition"
    multiplicity: "OneToMany"
- name: "ChangeSet"
  description: "Grouping of related edits applied together across one or more content\
    \ items."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "changeType"
    type: "ChangeType"
  - name: "createdOn"
    type: "DateTime"
  - name: "isBreakingChange"
    type: "Boolean"
  relations:
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "Version"
    multiplicity: "OneToMany"
- name: "MergeRequest"
  description: "Proposal to integrate changes from a source branch into a target branch."
  data:
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "status"
    type: "MergeRequestStatus"
  - name: "mergeStrategy"
    type: "MergeStrategy"
  - name: "isDraft"
    type: "Boolean"
  - name: "createdOn"
    type: "DateTime"
  relations:
  - name: "sourceBranch"
    type: "Branch"
    multiplicity: "ManyToOne"
  - name: "targetBranch"
    type: "Branch"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "changeSets"
    type: "ChangeSet"
    multiplicity: "OneToMany"
  - name: "reviews"
    type: "Review"
    multiplicity: "OneToMany"
  - name: "merge"
    type: "Merge"
    multiplicity: "OneToOne"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
- name: "Merge"
  description: "Execution outcome of a merge operation between branches."
  data:
  - name: "status"
    type: "MergeStatus"
  - name: "resolvedConflicts"
    type: "Integer"
  - name: "createdOn"
    type: "DateTime"
  - name: "summary"
    type: "String"
  relations:
  - name: "mergeRequest"
    type: "MergeRequest"
    multiplicity: "OneToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "targetBranch"
    type: "Branch"
    multiplicity: "ManyToOne"
- name: "Review"
  description: "Formal evaluation of a merge request or change set with a decision."
  data:
  - name: "decision"
    type: "ReviewDecision"
  - name: "commentCount"
    type: "Integer"
  - name: "reviewedOn"
    type: "DateTime"
  relations:
  - name: "mergeRequest"
    type: "MergeRequest"
    multiplicity: "ManyToOne"
  - name: "reviewer"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
- name: "Comment"
  description: "Annotation or discussion item attached to a version or merge request."
  data:
  - name: "body"
    type: "String"
  - name: "authoredOn"
    type: "DateTime"
  - name: "anchor"
    type: "TextAnchor"
  relations:
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "Version"
    multiplicity: "ManyToOne"
  - name: "mergeRequest"
    type: "MergeRequest"
    multiplicity: "ManyToOne"
- name: "Tag"
  description: "Lightweight, human-readable label applied to versions for quick reference."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "createdOn"
    type: "DateTime"
  relations:
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "Version"
    multiplicity: "ManyToOne"
- name: "Snapshot"
  description: "Point-in-time capture of repository state across branches and content\
    \ items."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "createdOn"
    type: "DateTime"
  relations:
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "Version"
    multiplicity: "OneToMany"
- name: "Rendition"
  description: "Derived representation of a version in a specific output format."
  data:
  - name: "format"
    type: "RenditionFormat"
  - name: "uri"
    type: "String"
  - name: "sizeBytes"
    type: "Integer"
  - name: "generatedOn"
    type: "DateTime"
  - name: "status"
    type: "RenditionStatus"
  relations:
  - name: "version"
    type: "Version"
    multiplicity: "ManyToOne"
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
- name: "Lock"
  description: "Mechanism to prevent conflicting edits on a content item."
  data:
  - name: "lockType"
    type: "LockType"
  - name: "createdOn"
    type: "DateTime"
  - name: "expiresOn"
    type: "DateTime"
  - name: "reason"
    type: "String"
  relations:
  - name: "contentItem"
    type: "ContentItem"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "WorkflowInstance"
  description: "Controlled process applied to a version, such as review or publication\
    \ workflow."
  data:
  - name: "state"
    type: "WorkflowState"
  - name: "startedOn"
    type: "DateTime"
  - name: "completedOn"
    type: "DateTime"
  - name: "name"
    type: "String"
  relations:
  - name: "version"
    type: "Version"
    multiplicity: "ManyToOne"
  - name: "assignees"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "Approval"
  description: "Decision record within a workflow that authorizes or rejects progression."
  data:
  - name: "outcome"
    type: "ApprovalOutcome"
  - name: "decidedOn"
    type: "DateTime"
  - name: "comment"
    type: "String"
  relations:
  - name: "workflowInstance"
    type: "WorkflowInstance"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "User"
    multiplicity: "ManyToOne"
- name: "RetentionRule"
  description: "Policy defining how long versions are kept and when they are pruned."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "RetentionRuleType"
  - name: "keepCount"
    type: "Integer"
  - name: "keepDays"
    type: "Integer"
  - name: "autoDelete"
    type: "Boolean"
  - name: "activeFrom"
    type: "DateTime"
  relations:
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "branch"
    type: "Branch"
    multiplicity: "ManyToOne"
  - name: "contentItem"
    type: "ContentItem"
    multiplicity: "ManyToOne"
- name: "AccessPolicy"
  description: "Access control assignment that grants permissions to users or teams\
    \ within a scope."
  data:
  - name: "scopeType"
    type: "AccessScopeType"
  - name: "accessLevel"
    type: "AccessLevel"
  - name: "isInherited"
    type: "Boolean"
  - name: "effectiveFrom"
    type: "DateTime"
  relations:
  - name: "contentSpace"
    type: "ContentSpace"
    multiplicity: "ManyToOne"
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "branch"
    type: "Branch"
    multiplicity: "ManyToOne"
  - name: "contentItem"
    type: "ContentItem"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "team"
    type: "Team"
    multiplicity: "ManyToOne"
- name: "User"
  description: "Individual participant who authors changes, reviews, and administers\
    \ repositories."
  data:
  - name: "username"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "timeZone"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "reviews"
    type: "Review"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "authoredVersions"
    type: "Version"
    multiplicity: "OneToMany"
- name: "Team"
  description: "Group of users that shares responsibilities and permissions across\
    \ scopes."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "defaultAccessLevel"
    type: "AccessLevel"
  relations:
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
- name: "AuditEvent"
  description: "Immutable record of actions taken within the version management system."
  data:
  - name: "action"
    type: "AuditAction"
  - name: "occurredOn"
    type: "DateTime"
  - name: "actorType"
    type: "ActorType"
  - name: "ipAddress"
    type: "String"
  - name: "userAgent"
    type: "String"
  - name: "targetType"
    type: "AuditTargetType"
  - name: "targetPath"
    type: "String"
  - name: "details"
    type: "String"
  relations:
  - name: "repository"
    type: "Repository"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "Version"
    multiplicity: "ManyToOne"
  - name: "contentItem"
    type: "ContentItem"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "StorageLocation"
  description: "Physical or cloud-backed storage descriptor for repository content\
    \ and renditions."
  data:
  - name: "provider"
    type: "StorageProvider"
  - name: "bucket"
    type: "String"
  - name: "region"
    type: "String"
  - name: "encryptionEnabled"
    type: "Boolean"
  relations:
  - name: "repositories"
    type: "Repository"
    multiplicity: "OneToMany"
  - name: "renditions"
    type: "Rendition"
    multiplicity: "OneToMany"
enums:
- name: "BranchType"
  description: "Classification for branch purpose and workflow conventions."
  data:
  - name: "Mainline"
  - name: "Feature"
  - name: "Release"
  - name: "Hotfix"
  - name: "Personal"
- name: "VersionStatus"
  description: "Lifecycle state of a specific version of a content item."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Archived"
  - name: "Deprecated"
- name: "ChangeType"
  description: "Nature of changes represented in a change set."
  data:
  - name: "Addition"
  - name: "Modification"
  - name: "Deletion"
  - name: "Rename"
  - name: "Move"
- name: "MergeRequestStatus"
  description: "Current progression of a merge request through review and completion."
  data:
  - name: "Open"
  - name: "UnderReview"
  - name: "Approved"
  - name: "ChangesRequested"
  - name: "Merged"
  - name: "Closed"
- name: "MergeStrategy"
  description: "Method used to integrate source branch history into the target branch."
  data:
  - name: "FastForward"
  - name: "NoFastForward"
  - name: "Squash"
  - name: "Rebase"
- name: "MergeStatus"
  description: "Result of executing a merge operation."
  data:
  - name: "Succeeded"
  - name: "Failed"
  - name: "Conflicted"
  - name: "Cancelled"
- name: "ReviewDecision"
  description: "Outcome of a formal review."
  data:
  - name: "Approve"
  - name: "RequestChanges"
  - name: "CommentOnly"
  - name: "Reject"
- name: "ContentStatus"
  description: "Administrative condition of a content item."
  data:
  - name: "Normal"
  - name: "UnderReview"
  - name: "Locked"
  - name: "Flagged"
- name: "RetentionRuleType"
  description: "Strategy used to retain or prune versions over time."
  data:
  - name: "KeepLastN"
  - name: "KeepForDays"
  - name: "KeepTaggedOnly"
  - name: "KeepMajorVersions"
- name: "RenditionStatus"
  description: "Processing state of a rendition job."
  data:
  - name: "Pending"
  - name: "Completed"
  - name: "Failed"
- name: "LockType"
  description: "Degree of exclusivity enforced by a lock."
  data:
  - name: "Exclusive"
  - name: "Advisory"
- name: "WorkflowState"
  description: "Current state of a workflow instance."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "ApprovalOutcome"
  description: "Decision recorded by an approver within a workflow."
  data:
  - name: "Approved"
  - name: "Rejected"
  - name: "Skipped"
- name: "AuditAction"
  description: "Type of auditable operation performed by a participant or system."
  data:
  - name: "CreateRepository"
  - name: "UpdateRepository"
  - name: "DeleteRepository"
  - name: "CreateContent"
  - name: "UpdateContent"
  - name: "DeleteContent"
  - name: "CreateVersion"
  - name: "RestoreVersion"
  - name: "BranchCreated"
  - name: "MergeCompleted"
  - name: "TagCreated"
  - name: "PolicyChanged"
  - name: "AccessGranted"
  - name: "AccessRevoked"
- name: "AccessScopeType"
  description: "Target scope to which an access policy is applied."
  data:
  - name: "ContentSpace"
  - name: "Repository"
  - name: "Branch"
  - name: "ContentItem"
- name: "AccessLevel"
  description: "Permission level granted to a user or team."
  data:
  - name: "Read"
  - name: "Write"
  - name: "Maintain"
  - name: "Admin"
  - name: "Owner"
- name: "StorageTier"
  description: "Storage performance and cost profile for repository data."
  data:
  - name: "Standard"
  - name: "InfrequentAccess"
  - name: "Archive"
- name: "StorageProvider"
  description: "Backing storage technology for persisted content."
  data:
  - name: "S3"
  - name: "AzureBlob"
  - name: "GCS"
  - name: "Filesystem"
- name: "ActorType"
  description: "Origin of an action in the audit log."
  data:
  - name: "User"
  - name: "System"
  - name: "Integration"
- name: "AuditTargetType"
  description: "Classification of the primary subject affected by an action."
  data:
  - name: "Space"
  - name: "Repository"
  - name: "Branch"
  - name: "Content"
  - name: "Version"
  - name: "Policy"
  - name: "Workflow"
  - name: "Rendition"
- name: "RenditionFormat"
  description: "Output format for generated renditions."
  data:
  - name: "PDF"
  - name: "PNG"
  - name: "JPEG"
  - name: "TXT"
  - name: "HTML"
  - name: "DOCX"
  - name: "MP4"
  - name: "ZIP"
- name: "ComplianceTier"
  description: "Sensitivity classification guiding handling and controls."
  data:
  - name: "General"
  - name: "Confidential"
  - name: "Restricted"
valueObjects:
- name: "Path"
  description: "Canonical, normalized path of a content item within a repository."
  data:
  - name: "fullPath"
    type: "String"
- name: "Checksum"
  description: "Digest representing integrity of content bytes."
  data:
  - name: "value"
    type: "String"
  - name: "algorithm"
    type: "String"
- name: "SemanticVersion"
  description: "Structured version label conveying ordering and significance."
  data:
  - name: "major"
    type: "Integer"
  - name: "minor"
    type: "Integer"
  - name: "patch"
    type: "Integer"
  - name: "label"
    type: "String"
- name: "TextAnchor"
  description: "Location reference to a text range for precise commenting."
  data:
  - name: "startLine"
    type: "Integer"
  - name: "startChar"
    type: "Integer"
  - name: "endLine"
    type: "Integer"
  - name: "endChar"
    type: "Integer"
