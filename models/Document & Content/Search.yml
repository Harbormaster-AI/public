---
metadata:
  name: "HCIDL Capabilities Model - Search"
  description: "Canonical capability model for enterprise search, covering indexing,\
    \ query processing, relevance, analytics, and operations across content repositories."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Document & Content"
  type: "Capability"
  domain: "Search"
entities:
- name: "SearchCluster"
  description: "Logical search cluster providing indexing and query services across\
    \ nodes."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "apiEndpoint"
    type: "URI"
  - name: "version"
    type: "String"
  relations:
  - name: "nodes"
    type: "SearchNode"
    multiplicity: "OneToMany"
  - name: "indexes"
    type: "Index"
    multiplicity: "OneToMany"
- name: "SearchNode"
  description: "Compute node participating in the cluster, hosting shards and executing\
    \ workloads."
  data:
  - name: "hostname"
    type: "String"
  - name: "role"
    type: "NodeRole"
  - name: "status"
    type: "NodeStatus"
  - name: "cpuCores"
    type: "Integer"
  - name: "memoryGB"
    type: "Integer"
  relations:
  - name: "cluster"
    type: "SearchCluster"
    multiplicity: "ManyToOne"
  - name: "hostedShards"
    type: "IndexShard"
    multiplicity: "OneToMany"
- name: "Index"
  description: "Searchable collection of documents with its own schema, analyzers,\
    \ and runtime settings."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "IndexStatus"
  - name: "defaultLanguage"
    type: "LanguageCode"
  - name: "createdOn"
    type: "Date"
  - name: "retentionDays"
    type: "Integer"
  relations:
  - name: "cluster"
    type: "SearchCluster"
    multiplicity: "ManyToOne"
  - name: "shards"
    type: "IndexShard"
    multiplicity: "OneToMany"
  - name: "fieldSchemas"
    type: "FieldSchema"
    multiplicity: "OneToMany"
  - name: "analyzers"
    type: "Analyzer"
    multiplicity: "OneToMany"
  - name: "stopwordLists"
    type: "StopwordList"
    multiplicity: "OneToMany"
  - name: "synonymSets"
    type: "SynonymSet"
    multiplicity: "OneToMany"
  - name: "rankingProfiles"
    type: "RankingProfile"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "spellModels"
    type: "SpellCorrectionModel"
    multiplicity: "OneToMany"
  - name: "autocompleteIndexes"
    type: "AutocompleteIndex"
    multiplicity: "OneToMany"
  - name: "facetDefinitions"
    type: "FacetDefinition"
    multiplicity: "OneToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "aliases"
    type: "IndexAlias"
    multiplicity: "ManyToMany"
- name: "IndexAlias"
  description: "Logical name that routes read or write operations to one or more indexes."
  data:
  - name: "name"
    type: "String"
  - name: "isWriteAlias"
    type: "Boolean"
  - name: "routingExpression"
    type: "String"
  relations:
  - name: "indexes"
    type: "Index"
    multiplicity: "ManyToMany"
- name: "IndexShard"
  description: "Partition of an index used for distribution and parallelization of\
    \ storage and queries."
  data:
  - name: "shardNumber"
    type: "Integer"
  - name: "replicaCount"
    type: "Integer"
  - name: "status"
    type: "ShardStatus"
  relations:
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
  - name: "primaryNode"
    type: "SearchNode"
    multiplicity: "ManyToOne"
  - name: "replicaNodes"
    type: "SearchNode"
    multiplicity: "ManyToMany"
- name: "FieldSchema"
  description: "Declarative definition of a document field including data type and\
    \ indexing options."
  data:
  - name: "fieldName"
    type: "String"
  - name: "fieldType"
    type: "FieldType"
  - name: "stored"
    type: "Boolean"
  - name: "indexed"
    type: "Boolean"
  - name: "sortable"
    type: "Boolean"
  - name: "facetable"
    type: "Boolean"
  - name: "multiValued"
    type: "Boolean"
  relations:
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
  - name: "analyzer"
    type: "Analyzer"
    multiplicity: "ManyToOne"
- name: "Analyzer"
  description: "Text analysis configuration controlling tokenization and filtering\
    \ behavior."
  data:
  - name: "name"
    type: "String"
  - name: "analyzerType"
    type: "AnalyzerType"
  - name: "language"
    type: "LanguageCode"
  relations:
  - name: "tokenizers"
    type: "Tokenizer"
    multiplicity: "OneToMany"
  - name: "tokenFilters"
    type: "TokenFilter"
    multiplicity: "OneToMany"
  - name: "charFilters"
    type: "CharFilter"
    multiplicity: "OneToMany"
- name: "Tokenizer"
  description: "Component that splits text into tokens for further analysis."
  data:
  - name: "name"
    type: "String"
  - name: "tokenizerType"
    type: "TokenizerType"
  - name: "pattern"
    type: "RegexPattern"
  relations:
  - name: "analyzer"
    type: "Analyzer"
    multiplicity: "ManyToOne"
- name: "TokenFilter"
  description: "Component that transforms or filters tokens during analysis."
  data:
  - name: "name"
    type: "String"
  - name: "filterType"
    type: "TokenFilterType"
  - name: "configuration"
    type: "String"
  relations:
  - name: "analyzer"
    type: "Analyzer"
    multiplicity: "ManyToOne"
- name: "CharFilter"
  description: "Pre-tokenization component that normalizes character streams."
  data:
  - name: "name"
    type: "String"
  - name: "mappingRules"
    type: "String"
  relations:
  - name: "analyzer"
    type: "Analyzer"
    multiplicity: "ManyToOne"
- name: "SynonymSet"
  description: "Curated or generated synonym mappings applied to query or index time."
  data:
  - name: "name"
    type: "String"
  - name: "scope"
    type: "SynonymScope"
  - name: "language"
    type: "LanguageCode"
  - name: "source"
    type: "String"
  relations:
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
- name: "StopwordList"
  description: "Language-specific list of stopwords excluded during analysis."
  data:
  - name: "name"
    type: "String"
  - name: "language"
    type: "LanguageCode"
  - name: "source"
    type: "String"
  relations:
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
- name: "RankingProfile"
  description: "Relevance strategy defining scoring functions, boosts, and tie-breaking\
    \ rules."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "tieBreaker"
    type: "Decimal"
  - name: "isDefault"
    type: "Boolean"
  relations:
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
  - name: "scoringFunctions"
    type: "ScoringFunction"
    multiplicity: "OneToMany"
  - name: "boostRules"
    type: "BoostRule"
    multiplicity: "OneToMany"
- name: "ScoringFunction"
  description: "Parameterized scoring component contributing to overall document relevance."
  data:
  - name: "name"
    type: "String"
  - name: "functionType"
    type: "ScoringFunctionType"
  - name: "weight"
    type: "Decimal"
  - name: "field"
    type: "String"
  relations:
  - name: "rankingProfile"
    type: "RankingProfile"
    multiplicity: "ManyToOne"
- name: "BoostRule"
  description: "Conditional boost or penalty applied based on query-time or document\
    \ attributes."
  data:
  - name: "name"
    type: "String"
  - name: "conditionType"
    type: "BoostConditionType"
  - name: "pattern"
    type: "String"
  - name: "weight"
    type: "Decimal"
  relations:
  - name: "rankingProfile"
    type: "RankingProfile"
    multiplicity: "ManyToOne"
- name: "DataSourceConnector"
  description: "Integration endpoint responsible for fetching content from external\
    \ systems."
  data:
  - name: "name"
    type: "String"
  - name: "connectorType"
    type: "ConnectorType"
  - name: "connectionUri"
    type: "URI"
  - name: "authenticationMethod"
    type: "AuthenticationMethod"
  - name: "pollingIntervalMinutes"
    type: "Integer"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "pipelines"
    type: "IngestionPipeline"
    multiplicity: "OneToMany"
  - name: "schedules"
    type: "CrawlSchedule"
    multiplicity: "OneToMany"
- name: "CrawlSchedule"
  description: "Recurring plan controlling when a connector runs to ingest or refresh\
    \ content."
  data:
  - name: "name"
    type: "String"
  - name: "frequency"
    type: "ScheduleFrequency"
  - name: "startDate"
    type: "Date"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "connector"
    type: "DataSourceConnector"
    multiplicity: "ManyToOne"
- name: "IngestionPipeline"
  description: "Orchestrated sequence of stages that fetch, transform, and index content."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "PipelineStatus"
  relations:
  - name: "connector"
    type: "DataSourceConnector"
    multiplicity: "ManyToOne"
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
  - name: "stages"
    type: "PipelineStage"
    multiplicity: "OneToMany"
  - name: "mappingRules"
    type: "MappingRule"
    multiplicity: "OneToMany"
- name: "PipelineStage"
  description: "Individual processing step within an ingestion pipeline."
  data:
  - name: "name"
    type: "String"
  - name: "stageType"
    type: "PipelineStageType"
  - name: "order"
    type: "Integer"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "pipeline"
    type: "IngestionPipeline"
    multiplicity: "ManyToOne"
- name: "MappingRule"
  description: "Field mapping and transformation definition applied during ingestion."
  data:
  - name: "name"
    type: "String"
  - name: "sourcePath"
    type: "JsonPath"
  - name: "targetField"
    type: "String"
  - name: "transformation"
    type: "String"
  relations:
  - name: "pipeline"
    type: "IngestionPipeline"
    multiplicity: "ManyToOne"
- name: "Document"
  description: "Indexable content item with metadata used for retrieval and permissions."
  data:
  - name: "uri"
    type: "URI"
  - name: "title"
    type: "String"
  - name: "language"
    type: "LanguageCode"
  - name: "contentType"
    type: "String"
  - name: "sizeBytes"
    type: "Integer"
  - name: "lastIndexed"
    type: "Date"
  - name: "checksum"
    type: "HashDigest"
  relations:
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
  - name: "accessPolicy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
- name: "QuerySession"
  description: "Temporal context grouping a series of related search interactions."
  data:
  - name: "sessionKey"
    type: "String"
  - name: "startedAt"
    type: "Date"
  - name: "userAgent"
    type: "String"
  - name: "sourceApplication"
    type: "String"
  relations:
  - name: "principal"
    type: "SecurityPrincipal"
    multiplicity: "ManyToOne"
  - name: "queries"
    type: "Query"
    multiplicity: "OneToMany"
- name: "Query"
  description: "Executable search request with parameters and personalization flags."
  data:
  - name: "queryText"
    type: "String"
  - name: "language"
    type: "LanguageCode"
  - name: "submittedAt"
    type: "Date"
  - name: "topK"
    type: "Integer"
  - name: "sortOrder"
    type: "SortOrder"
  - name: "filters"
    type: "String"
  - name: "personalize"
    type: "Boolean"
  relations:
  - name: "session"
    type: "QuerySession"
    multiplicity: "ManyToOne"
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
  - name: "resultSet"
    type: "SearchResultSet"
    multiplicity: "OneToOne"
- name: "SearchResultSet"
  description: "Aggregated results and facets produced by executing a query."
  data:
  - name: "queryTimeMs"
    type: "Integer"
  - name: "totalHits"
    type: "Integer"
  - name: "correctedQuery"
    type: "String"
  relations:
  - name: "query"
    type: "Query"
    multiplicity: "OneToOne"
  - name: "items"
    type: "SearchResultItem"
    multiplicity: "OneToMany"
  - name: "facets"
    type: "FacetBucket"
    multiplicity: "OneToMany"
- name: "SearchResultItem"
  description: "Ranked item in a result set representing a matched document."
  data:
  - name: "rank"
    type: "Integer"
  - name: "documentUri"
    type: "URI"
  - name: "score"
    type: "Score"
  - name: "snippet"
    type: "String"
  relations:
  - name: "resultSet"
    type: "SearchResultSet"
    multiplicity: "ManyToOne"
  - name: "document"
    type: "Document"
    multiplicity: "ManyToOne"
  - name: "clickedSignals"
    type: "ClickSignal"
    multiplicity: "OneToMany"
- name: "FacetDefinition"
  description: "Declarative configuration of a facet over a field with a specific\
    \ display type."
  data:
  - name: "name"
    type: "String"
  - name: "facetType"
    type: "FacetType"
  - name: "field"
    type: "String"
  relations:
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
- name: "FacetBucket"
  description: "Aggregated count or range bucket returned for a facet."
  data:
  - name: "label"
    type: "String"
  - name: "count"
    type: "Integer"
  - name: "rangeStart"
    type: "String"
  - name: "rangeEnd"
    type: "String"
  relations:
  - name: "resultSet"
    type: "SearchResultSet"
    multiplicity: "ManyToOne"
  - name: "facetDefinition"
    type: "FacetDefinition"
    multiplicity: "ManyToOne"
  - name: "parentBucket"
    type: "FacetBucket"
    multiplicity: "ManyToOne"
- name: "SpellCorrectionModel"
  description: "Language model providing corrections and expansions for misspelled\
    \ queries."
  data:
  - name: "name"
    type: "String"
  - name: "language"
    type: "LanguageCode"
  - name: "lastTrainedOn"
    type: "Date"
  relations:
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
- name: "AutocompleteIndex"
  description: "Specialized structure optimized for prefix search and suggestions."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "IndexStatus"
  - name: "ngramSize"
    type: "Integer"
  - name: "minPrefixLength"
    type: "Integer"
  relations:
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
  - name: "suggestions"
    type: "Suggestion"
    multiplicity: "OneToMany"
- name: "Suggestion"
  description: "Candidate phrase emitted by autocomplete with associated weight."
  data:
  - name: "phrase"
    type: "String"
  - name: "weight"
    type: "Integer"
  - name: "language"
    type: "LanguageCode"
  - name: "suggestionType"
    type: "SuggestionType"
  relations:
  - name: "autocompleteIndex"
    type: "AutocompleteIndex"
    multiplicity: "ManyToOne"
- name: "QueryLogEntry"
  description: "Immutable record of a query execution for analytics and tuning."
  data:
  - name: "timestamp"
    type: "Date"
  - name: "rawQuery"
    type: "String"
  - name: "responseTimeMs"
    type: "Integer"
  - name: "resultCount"
    type: "Integer"
  relations:
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
  - name: "session"
    type: "QuerySession"
    multiplicity: "ManyToOne"
  - name: "clickSignals"
    type: "ClickSignal"
    multiplicity: "OneToMany"
- name: "ClickSignal"
  description: "User interaction captured from a result list indicating engagement."
  data:
  - name: "timestamp"
    type: "Date"
  - name: "rank"
    type: "Integer"
  - name: "documentUri"
    type: "URI"
  - name: "actionType"
    type: "ClickActionType"
  relations:
  - name: "queryLogEntry"
    type: "QueryLogEntry"
    multiplicity: "ManyToOne"
  - name: "resultItem"
    type: "SearchResultItem"
    multiplicity: "ManyToOne"
- name: "RelevanceJudgment"
  description: "Labeled assessment indicating how well a document satisfies a query."
  data:
  - name: "queryText"
    type: "String"
  - name: "documentUri"
    type: "URI"
  - name: "label"
    type: "RelevanceLabel"
  - name: "judgeType"
    type: "JudgmentType"
  - name: "notes"
    type: "String"
  relations:
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
  - name: "rankingProfile"
    type: "RankingProfile"
    multiplicity: "ManyToOne"
- name: "Experiment"
  description: "Controlled evaluation comparing alternative search configurations."
  data:
  - name: "name"
    type: "String"
  - name: "hypothesis"
    type: "String"
  - name: "status"
    type: "ExperimentStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
  - name: "variants"
    type: "ABVariant"
    multiplicity: "OneToMany"
  - name: "metrics"
    type: "ExperimentMetric"
    multiplicity: "OneToMany"
- name: "ABVariant"
  description: "Experiment branch with a defined traffic split and configuration."
  data:
  - name: "name"
    type: "String"
  - name: "trafficPercentage"
    type: "Integer"
  relations:
  - name: "experiment"
    type: "Experiment"
    multiplicity: "ManyToOne"
  - name: "rankingProfile"
    type: "RankingProfile"
    multiplicity: "ManyToOne"
- name: "ExperimentMetric"
  description: "Aggregated measurement observed for an experiment within a period."
  data:
  - name: "name"
    type: "String"
  - name: "value"
    type: "Decimal"
  - name: "unit"
    type: "String"
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  relations:
  - name: "experiment"
    type: "Experiment"
    multiplicity: "ManyToOne"
- name: "AccessPolicy"
  description: "Authorization configuration controlling who can query or view documents."
  data:
  - name: "name"
    type: "String"
  - name: "scope"
    type: "AccessScope"
  - name: "description"
    type: "String"
  relations:
  - name: "index"
    type: "Index"
    multiplicity: "ManyToOne"
  - name: "principals"
    type: "SecurityPrincipal"
    multiplicity: "ManyToMany"
- name: "SecurityPrincipal"
  description: "Identity representation used for access control and personalization."
  data:
  - name: "name"
    type: "String"
  - name: "principalType"
    type: "PrincipalType"
  - name: "externalReference"
    type: "String"
  relations:
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "ManyToMany"
  - name: "sessions"
    type: "QuerySession"
    multiplicity: "OneToMany"
enums:
- name: "NodeRole"
  description: "Functional role performed by a search node."
  data:
  - name: "Coordinator"
  - name: "Data"
  - name: "Ingest"
  - name: "Manager"
- name: "NodeStatus"
  description: "Operational state of a search node."
  data:
  - name: "Online"
  - name: "Draining"
  - name: "Degraded"
  - name: "Maintenance"
  - name: "Offline"
- name: "IndexStatus"
  description: "Lifecycle and access state of an index or suggestion store."
  data:
  - name: "Active"
  - name: "ReadOnly"
  - name: "Reindexing"
  - name: "Closed"
- name: "ShardStatus"
  description: "Runtime status of an index shard."
  data:
  - name: "Initializing"
  - name: "Active"
  - name: "Relocating"
  - name: "Recovering"
  - name: "Unassigned"
- name: "FieldType"
  description: "Data type used to represent and index a field."
  data:
  - name: "Text"
  - name: "Keyword"
  - name: "Integer"
  - name: "Long"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "GeoPoint"
- name: "AnalyzerType"
  description: "Preset or custom analyzer category."
  data:
  - name: "Standard"
  - name: "Language"
  - name: "Whitespace"
  - name: "Custom"
- name: "TokenizerType"
  description: "Strategy used to split text into tokens."
  data:
  - name: "Standard"
  - name: "Whitespace"
  - name: "Pattern"
  - name: "NGram"
  - name: "EdgeNGram"
- name: "TokenFilterType"
  description: "Operation applied to tokens during analysis."
  data:
  - name: "Lowercase"
  - name: "Stop"
  - name: "Stemmer"
  - name: "Synonym"
  - name: "AsciiFolding"
  - name: "Snowball"
- name: "SynonymScope"
  description: "Applicability domain of a synonym set."
  data:
  - name: "Global"
  - name: "Index"
  - name: "Locale"
- name: "ConnectorType"
  description: "Source system category supported by a connector."
  data:
  - name: "WebCrawler"
  - name: "Database"
  - name: "Filesystem"
  - name: "API"
  - name: "MessageQueue"
- name: "AuthenticationMethod"
  description: "Method used by a connector to authenticate to a source system."
  data:
  - name: "None"
  - name: "Basic"
  - name: "OAuth2"
  - name: "APIKey"
- name: "ScheduleFrequency"
  description: "Recurrence interval for running connector jobs."
  data:
  - name: "Hourly"
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Cron"
- name: "PipelineStatus"
  description: "Operational state of an ingestion pipeline."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Paused"
  - name: "Disabled"
- name: "PipelineStageType"
  description: "Functional role performed by a pipeline stage."
  data:
  - name: "Fetch"
  - name: "Parse"
  - name: "Enrich"
  - name: "Classify"
  - name: "Deduplicate"
  - name: "Normalize"
  - name: "Route"
- name: "SortOrder"
  description: "Direction used when ordering search results."
  data:
  - name: "Ascending"
  - name: "Descending"
- name: "FacetType"
  description: "Presentation and aggregation strategy for a facet."
  data:
  - name: "Term"
  - name: "Range"
  - name: "Hierarchical"
- name: "ScoringFunctionType"
  description: "Algorithmic family used to compute document scores."
  data:
  - name: "BM25"
  - name: "FieldValueFactor"
  - name: "Freshness"
  - name: "Proximity"
  - name: "Script"
- name: "BoostConditionType"
  description: "Condition evaluated at query time to modify scores."
  data:
  - name: "QueryTerm"
  - name: "FieldMatch"
