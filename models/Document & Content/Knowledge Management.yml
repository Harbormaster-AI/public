---
metadata:
  name: "HCIDL Knowledge Management Capabilities Model"
  description: "Canonical capability model for Knowledge Management, covering the\
    \ lifecycle of enterprise knowledge from creation and curation to discovery, reuse,\
    \ governance, and retention."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Document & Content"
  type: "Capability"
  domain: "Knowledge Management"
entities:
- name: "KnowledgeRepository"
  description: "Top-level container that governs knowledge assets, spaces, taxonomies,\
    \ audiences, and discovery services."
  data:
  - name: "name"
    type: "String"
  - name: "defaultLanguage"
    type: "Language"
  - name: "visibility"
    type: "VisibilityLevel"
  - name: "baseUri"
    type: "URI"
  relations:
  - name: "spaces"
    type: "KnowledgeSpace"
    multiplicity: "OneToMany"
  - name: "taxonomies"
    type: "Taxonomy"
    multiplicity: "OneToMany"
  - name: "audiences"
    type: "Audience"
    multiplicity: "OneToMany"
  - name: "contentSources"
    type: "ContentSource"
    multiplicity: "OneToMany"
  - name: "searchIndex"
    type: "SearchIndex"
    multiplicity: "OneToOne"
- name: "KnowledgeSpace"
  description: "Logical area that organizes knowledge by theme, product, project,\
    \ or community of practice."
  data:
  - name: "name"
    type: "String"
  - name: "overview"
    type: "String"
  - name: "spaceType"
    type: "SpaceType"
  relations:
  - name: "repository"
    type: "KnowledgeRepository"
    multiplicity: "ManyToOne"
  - name: "articles"
    type: "KnowledgeArticle"
    multiplicity: "OneToMany"
  - name: "collections"
    type: "KnowledgeCollection"
    multiplicity: "OneToMany"
  - name: "owners"
    type: "UserGroup"
    multiplicity: "ManyToMany"
  - name: "audiences"
    type: "Audience"
    multiplicity: "ManyToMany"
- name: "KnowledgeArticle"
  description: "Canonical unit of knowledge such as an how-to, runbook, policy, or\
    \ reference entry."
  data:
  - name: "title"
    type: "String"
  - name: "slug"
    type: "Slug"
  - name: "summary"
    type: "String"
  - name: "language"
    type: "Language"
  - name: "status"
    type: "ArticleStatus"
  - name: "format"
    type: "ContentFormat"
  - name: "lastReviewed"
    type: "Date"
  - name: "effectiveDate"
    type: "Date"
  relations:
  - name: "space"
    type: "KnowledgeSpace"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "Contributor"
    multiplicity: "ManyToOne"
  - name: "reviewers"
    type: "Contributor"
    multiplicity: "ManyToMany"
  - name: "versions"
    type: "ArticleVersion"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "taxonomyTerms"
    type: "TaxonomyTerm"
    multiplicity: "ManyToMany"
  - name: "attachments"
    type: "Attachment"
    multiplicity: "OneToMany"
  - name: "relatedArticles"
    type: "KnowledgeArticle"
    multiplicity: "ManyToMany"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
  - name: "ratings"
    type: "Rating"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "workflow"
    type: "Workflow"
    multiplicity: "ManyToOne"
  - name: "translations"
    type: "Translation"
    multiplicity: "OneToMany"
- name: "ArticleVersion"
  description: "Immutable snapshot of article content and metadata for change tracking\
    \ and rollback."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "changeSummary"
    type: "String"
  - name: "createdDate"
    type: "Date"
  - name: "changeType"
    type: "ChangeType"
  - name: "checksum"
    type: "String"
  relations:
  - name: "article"
    type: "KnowledgeArticle"
    multiplicity: "ManyToOne"
  - name: "editor"
    type: "Contributor"
    multiplicity: "ManyToOne"
- name: "Contributor"
  description: "Person who authors, edits, reviews, or curates knowledge content."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "role"
    type: "ContributorRole"
  - name: "expertise"
    type: "String"
  relations:
  - name: "groups"
    type: "UserGroup"
    multiplicity: "ManyToMany"
  - name: "articlesAuthored"
    type: "KnowledgeArticle"
    multiplicity: "OneToMany"
- name: "UserGroup"
  description: "Functional or security grouping of contributors for ownership and\
    \ access control."
  data:
  - name: "name"
    type: "String"
  - name: "groupType"
    type: "GroupType"
  relations:
  - name: "contributors"
    type: "Contributor"
    multiplicity: "OneToMany"
  - name: "spaces"
    type: "KnowledgeSpace"
    multiplicity: "ManyToMany"
- name: "Taxonomy"
  description: "Controlled vocabulary structure used to classify and find knowledge."
  data:
  - name: "name"
    type: "String"
  - name: "taxonomyType"
    type: "TaxonomyType"
  - name: "description"
    type: "String"
  relations:
  - name: "repository"
    type: "KnowledgeRepository"
    multiplicity: "ManyToOne"
  - name: "terms"
    type: "TaxonomyTerm"
    multiplicity: "OneToMany"
- name: "TaxonomyTerm"
  description: "Node in a taxonomy hierarchy representing a categorization label."
  data:
  - name: "term"
    type: "String"
  - name: "code"
    type: "String"
  relations:
  - name: "taxonomy"
    type: "Taxonomy"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "TaxonomyTerm"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "TaxonomyTerm"
    multiplicity: "OneToMany"
  - name: "articles"
    type: "KnowledgeArticle"
    multiplicity: "ManyToMany"
- name: "Tag"
  description: "Folksonomy label created by users to enhance discoverability."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "articles"
    type: "KnowledgeArticle"
    multiplicity: "ManyToMany"
- name: "Attachment"
  description: "Binary or external resource linked to an article."
  data:
  - name: "filename"
    type: "String"
  - name: "uri"
    type: "URI"
  - name: "fileSizeKB"
    type: "Integer"
  - name: "mediaType"
    type: "MediaType"
  relations:
  - name: "article"
    type: "KnowledgeArticle"
    multiplicity: "ManyToOne"
- name: "KnowledgeCollection"
  description: "Curated set of articles for a specific task, release, or audience."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "space"
    type: "KnowledgeSpace"
    multiplicity: "ManyToOne"
  - name: "articles"
    type: "KnowledgeArticle"
    multiplicity: "ManyToMany"
  - name: "curator"
    type: "Contributor"
    multiplicity: "ManyToOne"
- name: "GlossaryTerm"
  description: "Canonical definition of a business or technical term managed in the\
    \ repository."
  data:
  - name: "term"
    type: "String"
  - name: "definition"
    type: "String"
  relations:
  - name: "repository"
    type: "KnowledgeRepository"
    multiplicity: "ManyToOne"
  - name: "steward"
    type: "Contributor"
    multiplicity: "ManyToOne"
  - name: "relatedTerms"
    type: "GlossaryTerm"
    multiplicity: "ManyToMany"
  - name: "referencedBy"
    type: "KnowledgeArticle"
    multiplicity: "ManyToMany"
- name: "QnAPair"
  description: "Frequently asked question and maintained answer for fast self-service."
  data:
  - name: "question"
    type: "String"
  - name: "answer"
    type: "String"
  - name: "visibility"
    type: "VisibilityLevel"
  relations:
  - name: "space"
    type: "KnowledgeSpace"
    multiplicity: "ManyToOne"
  - name: "relatedArticles"
    type: "KnowledgeArticle"
    multiplicity: "ManyToMany"
- name: "Workflow"
  description: "Orchestrated sequence of steps for article review, approval, and publication."
  data:
  - name: "name"
    type: "String"
  - name: "workflowType"
    type: "WorkflowType"
  relations:
  - name: "repository"
    type: "KnowledgeRepository"
    multiplicity: "ManyToOne"
  - name: "steps"
    type: "WorkflowStep"
    multiplicity: "OneToMany"
  - name: "articles"
    type: "KnowledgeArticle"
    multiplicity: "OneToMany"
- name: "WorkflowStep"
  description: "Individual gate within a workflow requiring action or verification."
  data:
  - name: "name"
    type: "String"
  - name: "requiredRole"
    type: "ContributorRole"
  - name: "deadlineDays"
    type: "Integer"
  relations:
  - name: "workflow"
    type: "Workflow"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
- name: "Approval"
  description: "Reviewer decision and commentary tied to a specific article version\
    \ and step."
  data:
  - name: "decision"
    type: "ReviewDecision"
  - name: "decidedDate"
    type: "Date"
  - name: "comment"
    type: "String"
  relations:
  - name: "article"
    type: "KnowledgeArticle"
    multiplicity: "ManyToOne"
  - name: "step"
    type: "WorkflowStep"
    multiplicity: "ManyToOne"
  - name: "reviewer"
    type: "Contributor"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "ArticleVersion"
    multiplicity: "ManyToOne"
- name: "Comment"
  description: "Discussion entry providing feedback or clarification on an article."
  data:
  - name: "body"
    type: "String"
  - name: "createdDate"
    type: "Date"
  - name: "sentiment"
    type: "Sentiment"
  relations:
  - name: "article"
    type: "KnowledgeArticle"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "Contributor"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "Comment"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "Comment"
    multiplicity: "OneToMany"
- name: "Rating"
  description: "Quantitative evaluation of article usefulness from readers."
  data:
  - name: "value"
    type: "Integer"
  - name: "maxValue"
    type: "Integer"
  relations:
  - name: "article"
    type: "KnowledgeArticle"
    multiplicity: "ManyToOne"
  - name: "rater"
    type: "Contributor"
    multiplicity: "ManyToOne"
- name: "Audience"
  description: "Target readership segment used for scoping access and tailoring content."
  data:
  - name: "name"
    type: "String"
  - name: "visibility"
    type: "VisibilityLevel"
  - name: "description"
    type: "String"
  relations:
  - name: "repository"
    type: "KnowledgeRepository"
    multiplicity: "ManyToOne"
  - name: "spaces"
    type: "KnowledgeSpace"
    multiplicity: "ManyToMany"
  - name: "articles"
    type: "KnowledgeArticle"
    multiplicity: "ManyToMany"
- name: "AccessPolicy"
  description: "Rule that grants or restricts access to spaces, articles, or groups."
  data:
  - name: "name"
    type: "String"
  - name: "accessLevel"
    type: "AccessLevel"
  - name: "appliesToType"
    type: "PolicySubjectType"
  relations:
  - name: "audience"
    type: "Audience"
    multiplicity: "ManyToOne"
  - name: "space"
    type: "KnowledgeSpace"
    multiplicity: "ManyToOne"
  - name: "article"
    type: "KnowledgeArticle"
    multiplicity: "ManyToOne"
  - name: "group"
    type: "UserGroup"
    multiplicity: "ManyToOne"
- name: "SearchIndex"
  description: "Service maintaining searchable representations of knowledge artifacts."
  data:
  - name: "name"
    type: "String"
  - name: "indexingStatus"
    type: "IndexingStatus"
  - name: "lastIndexed"
    type: "Date"
  relations:
  - name: "repository"
    type: "KnowledgeRepository"
    multiplicity: "ManyToOne"
  - name: "indexedArticles"
    type: "KnowledgeArticle"
    multiplicity: "OneToMany"
- name: "SearchQuery"
  description: "Recorded user search for trend analysis and search optimization."
  data:
  - name: "queryText"
    type: "String"
  - name: "submittedDate"
    type: "Date"
  - name: "resultCount"
    type: "Integer"
  - name: "channel"
    type: "Channel"
  relations:
  - name: "contributor"
    type: "Contributor"
    multiplicity: "ManyToOne"
  - name: "repository"
    type: "KnowledgeRepository"
    multiplicity: "ManyToOne"
- name: "Recommendation"
  description: "System-suggested association between knowledge items based on behavior\
    \ or content similarity."
  data:
  - name: "algorithm"
    type: "String"
  - name: "score"
    type: "Decimal"
  relations:
  - name: "article"
    type: "KnowledgeArticle"
    multiplicity: "ManyToOne"
  - name: "forArticle"
    type: "KnowledgeArticle"
    multiplicity: "ManyToOne"
  - name: "forAudience"
    type: "Audience"
    multiplicity: "ManyToOne"
- name: "RetentionPolicy"
  description: "Governs how long knowledge is kept and what happens at end of life."
  data:
  - name: "name"
    type: "String"
  - name: "retentionPeriodDays"
    type: "Integer"
  - name: "disposition"
    type: "DispositionAction"
  relations:
  - name: "repository"
    type: "KnowledgeRepository"
    multiplicity: "ManyToOne"
  - name: "spaces"
    type: "KnowledgeSpace"
    multiplicity: "ManyToMany"
  - name: "articles"
    type: "KnowledgeArticle"
    multiplicity: "ManyToMany"
- name: "ContentSource"
  description: "External or internal system from which knowledge is ingested or synchronized."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "ContentSourceType"
  - name: "connectionUri"
    type: "URI"
  - name: "syncFrequency"
    type: "String"
  relations:
  - name: "repository"
    type: "KnowledgeRepository"
    multiplicity: "ManyToOne"
  - name: "ingestedArticles"
    type: "KnowledgeArticle"
    multiplicity: "OneToMany"
- name: "Translation"
  description: "Localized rendition of article content for a specific language."
  data:
  - name: "language"
    type: "Language"
  - name: "title"
    type: "String"
  - name: "body"
    type: "String"
  - name: "translationStatus"
    type: "TranslationStatus"
  relations:
  - name: "article"
    type: "KnowledgeArticle"
    multiplicity: "ManyToOne"
  - name: "translator"
    type: "Contributor"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "ArticleVersion"
    multiplicity: "ManyToOne"
- name: "Announcement"
  description: "Broadcast message that highlights important changes or featured knowledge."
  data:
  - name: "title"
    type: "String"
  - name: "body"
    type: "String"
  - name: "publishDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "priority"
    type: "PriorityLevel"
  relations:
  - name: "repository"
    type: "KnowledgeRepository"
    multiplicity: "ManyToOne"
  - name: "targetAudiences"
    type: "Audience"
    multiplicity: "ManyToMany"
enums:
- name: "Language"
  description: "Supported languages for authoring and translation."
  data:
  - name: "EN"
  - name: "ES"
  - name: "FR"
  - name: "DE"
  - name: "IT"
  - name: "PT"
  - name: "ZH"
  - name: "JA"
  - name: "KO"
- name: "VisibilityLevel"
  description: "Scope of visibility for content and spaces."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Restricted"
  - name: "Confidential"
- name: "ArticleStatus"
  description: "Lifecycle state of a knowledge article."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Approved"
  - name: "Published"
  - name: "Archived"
  - name: "Retired"
- name: "ContentFormat"
  description: "Primary formatting or structural convention used for an article."
  data:
  - name: "Markdown"
  - name: "HTML"
  - name: "RichText"
  - name: "PlainText"
  - name: "AsciiDoc"
- name: "SpaceType"
  description: "Organizational purpose of a knowledge space."
  data:
  - name: "Product"
  - name: "Project"
  - name: "Team"
  - name: "Community"
  - name: "Policy"
  - name: "Runbook"
- name: "ChangeType"
  description: "Nature of a version change applied to an article."
  data:
  - name: "Major"
  - name: "Minor"
  - name: "Correction"
  - name: "Structural"
  - name: "Localization"
- name: "ContributorRole"
  description: "Primary role a contributor performs within the knowledge program."
  data:
  - name: "Author"
  - name: "Editor"
  - name: "Reviewer"
  - name: "Publisher"
  - name: "Curator"
  - name: "Administrator"
- name: "GroupType"
  description: "Classification of contributor groups for administration and access."
  data:
  - name: "Functional"
  - name: "Project"
  - name: "Community"
  - name: "Security"
- name: "TaxonomyType"
  description: "Classification scheme used for organizing knowledge."
  data:
  - name: "Hierarchical"
  - name: "Faceted"
  - name: "Tagset"
  - name: "Thesaurus"
- name: "MediaType"
  description: "Type of media represented by an attachment."
  data:
  - name: "Document"
  - name: "Image"
  - name: "Audio"
  - name: "Video"
  - name: "Spreadsheet"
  - name: "Presentation"
  - name: "Archive"
- name: "ContentSourceType"
  description: "Origin of ingested knowledge content."
  data:
  - name: "Wiki"
  - name: "CMS"
  - name: "FileShare"
  - name: "Ticketing"
  - name: "Chat"
  - name: "Email"
  - name: "WebCrawl"
  - name: "API"
- name: "WorkflowType"
  description: "Purpose of a workflow driving article progression."
  data:
  - name: "Editorial"
  - name: "FastTrack"
  - name: "Compliance"
  - name: "Localization"
- name: "ReviewDecision"
  description: "Outcome choices available to reviewers."
  data:
  - name: "Approved"
  - name: "RevisionsRequested"
  - name: "Rejected"
  - name: "Deferred"
- name: "Sentiment"
  description: "Qualitative tone of a comment."
  data:
  - name: "Positive"
  - name: "Neutral"
  - name: "Negative"
- name: "AccessLevel"
  description: "Degree of permissions granted by a policy."
  data:
  - name: "View"
  - name: "Comment"
  - name: "Contribute"
  - name: "Manage"
- name: "PolicySubjectType"
  description: "Kind of subject that a policy targets."
  data:
  - name: "Audience"
  - name: "Space"
  - name: "Article"
  - name: "Group"
- name: "IndexingStatus"
  description: "Operational state of search indexing."
  data:
  - name: "Idle"
  - name: "InProgress"
  - name: "Completed"
  - name: "Failed"
  - name: "Paused"
- name: "Channel"
  description: "Interface through which a search is performed."
  data:
  - name: "Web"
  - name: "Mobile"
  - name: "Chatbot"
  - name: "API"
- name: "DispositionAction"
  description: "Action to perform when retention period ends."
  data:
  - name: "Review"
  - name: "Deprecate"
  - name: "Delete"
  - name: "Archive"
- name: "TranslationStatus"
  description: "Progress state for localized content."
  data:
  - name: "Pending"
  - name: "InProgress"
  - name: "Completed"
  - name: "NeedsUpdate"
- name: "PriorityLevel"
  description: "Relative importance of an announcement."
  data:
  - name: "Low"
  - name: "Normal"
  - name: "High"
  - name: "Urgent"
valueObjects:
- name: "Slug"
  description: "URL-friendly identifier derived from a title for stable linking."
  data:
  - name: "value"
    type: "String"
- name: "URI"
  description: "Uniform Resource Identifier pointing to an internal or external resource."
  data:
  - name: "value"
    type: "String"
- name: "EmailAddress"
  description: "Structured representation of an electronic mail address."
  data:
  - name: "address"
    type: "String"
