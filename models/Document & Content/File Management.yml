---
metadata:
  name: "File Management Capabilities Model"
  description: "HCIDL capabilities model for enterprise file management across storage,\
    \ access control, sharing, security, and lifecycle operations."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Document & Content"
  type: "Capability"
  domain: "File Management"
entities:
- name: "StorageProvider"
  description: "Service or system that offers physical or logical storage capabilities\
    \ for files and folders."
  data:
  - name: "name"
    type: "String"
  - name: "providerType"
    type: "StorageProviderType"
  - name: "apiEndpoint"
    type: "Url"
  - name: "defaultRegion"
    type: "String"
  relations:
  - name: "storageVolumes"
    type: "StorageVolume"
    multiplicity: "OneToMany"
- name: "StorageVolume"
  description: "Logical storage container within a provider that holds folders, files,\
    \ and related policies."
  data:
  - name: "name"
    type: "String"
  - name: "storageClass"
    type: "StorageClass"
  - name: "capacity"
    type: "SizeInBytes"
  - name: "isEncrypted"
    type: "Boolean"
  - name: "encryptionKey"
    type: "KeyReference"
  relations:
  - name: "provider"
    type: "StorageProvider"
    multiplicity: "ManyToOne"
  - name: "rootFolder"
    type: "Folder"
    multiplicity: "OneToOne"
  - name: "snapshots"
    type: "Snapshot"
    multiplicity: "OneToMany"
  - name: "lifecycleRules"
    type: "LifecycleRule"
    multiplicity: "OneToMany"
- name: "Folder"
  description: "Hierarchical container used to organize files within a volume."
  data:
  - name: "name"
    type: "String"
  - name: "path"
    type: "Path"
  - name: "createdAt"
    type: "DateTime"
  - name: "updatedAt"
    type: "DateTime"
  - name: "inheritPermissions"
    type: "Boolean"
  relations:
  - name: "volume"
    type: "StorageVolume"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "subfolders"
    type: "Folder"
    multiplicity: "OneToMany"
  - name: "files"
    type: "File"
    multiplicity: "OneToMany"
  - name: "owner"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "accessPolicy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
  - name: "accessControlEntries"
    type: "AccessControlEntry"
    multiplicity: "OneToMany"
  - name: "retentionPolicy"
    type: "RetentionPolicy"
    multiplicity: "ManyToOne"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "metadataEntries"
    type: "MetadataEntry"
    multiplicity: "OneToMany"
  - name: "trashItems"
    type: "TrashItem"
    multiplicity: "OneToMany"
- name: "File"
  description: "Discrete piece of binary or textual content stored within a folder."
  data:
  - name: "name"
    type: "String"
  - name: "extension"
    type: "String"
  - name: "mimeType"
    type: "MimeType"
  - name: "size"
    type: "SizeInBytes"
  - name: "checksum"
    type: "Checksum"
  - name: "eTag"
    type: "ETag"
  - name: "createdAt"
    type: "DateTime"
  - name: "modifiedAt"
    type: "DateTime"
  - name: "status"
    type: "FileStatus"
  - name: "storageUri"
    type: "StorageUri"
  relations:
  - name: "folder"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "FileVersion"
    multiplicity: "OneToMany"
  - name: "accessPolicy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
  - name: "accessControlEntries"
    type: "AccessControlEntry"
    multiplicity: "OneToMany"
  - name: "shareLinks"
    type: "ShareLink"
    multiplicity: "OneToMany"
  - name: "retentionPolicy"
    type: "RetentionPolicy"
    multiplicity: "ManyToOne"
  - name: "lifecycleRules"
    type: "LifecycleRule"
    multiplicity: "ManyToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "metadataEntries"
    type: "MetadataEntry"
    multiplicity: "OneToMany"
  - name: "virusScans"
    type: "VirusScan"
    multiplicity: "OneToMany"
  - name: "lock"
    type: "FileLock"
    multiplicity: "OneToOne"
  - name: "trashItem"
    type: "TrashItem"
    multiplicity: "OneToOne"
  - name: "events"
    type: "EventLog"
    multiplicity: "OneToMany"
  - name: "uploadSessions"
    type: "UploadSession"
    multiplicity: "OneToMany"
- name: "FileVersion"
  description: "Immutable snapshot of a file’s content and metadata at a specific\
    \ point in time."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "size"
    type: "SizeInBytes"
  - name: "checksum"
    type: "Checksum"
  - name: "createdAt"
    type: "DateTime"
  - name: "strategy"
    type: "VersioningStrategy"
  - name: "comment"
    type: "String"
  relations:
  - name: "file"
    type: "File"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "uploadSession"
    type: "UploadSession"
    multiplicity: "ManyToOne"
- name: "AccessControlEntry"
  description: "Grant that assigns rights to a principal over a specific resource\
    \ in a defined scope."
  data:
  - name: "scope"
    type: "AccessScope"
  - name: "rights"
    type: "AccessRight"
  - name: "inherited"
    type: "Boolean"
  - name: "createdAt"
    type: "DateTime"
  relations:
  - name: "principal"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "file"
    type: "File"
    multiplicity: "ManyToOne"
  - name: "folder"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
- name: "AccessPolicy"
  description: "Reusable collection of access rules and inheritance settings applied\
    \ to files and folders."
  data:
  - name: "name"
    type: "String"
  - name: "inheritance"
    type: "InheritanceMode"
  - name: "description"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "entries"
    type: "AccessControlEntry"
    multiplicity: "OneToMany"
  - name: "folders"
    type: "Folder"
    multiplicity: "OneToMany"
  - name: "files"
    type: "File"
    multiplicity: "OneToMany"
- name: "Principal"
  description: "Security subject that can be granted permissions, representing a user,\
    \ group, or service account."
  data:
  - name: "displayName"
    type: "String"
  - name: "principalType"
    type: "PrincipalType"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "OneToOne"
  - name: "group"
    type: "Group"
    multiplicity: "OneToOne"
  - name: "serviceAccount"
    type: "ServiceAccount"
    multiplicity: "OneToOne"
  - name: "accessControlEntries"
    type: "AccessControlEntry"
    multiplicity: "OneToMany"
  - name: "events"
    type: "EventLog"
    multiplicity: "OneToMany"
  - name: "locks"
    type: "FileLock"
    multiplicity: "OneToMany"
  - name: "shareLinks"
    type: "ShareLink"
    multiplicity: "OneToMany"
- name: "User"
  description: "Human actor who owns, accesses, and manages files and folders."
  data:
  - name: "username"
    type: "String"
  - name: "email"
    type: "String"
  - name: "locale"
    type: "String"
  - name: "timeZone"
    type: "String"
  relations:
  - name: "principal"
    type: "Principal"
    multiplicity: "OneToOne"
  - name: "groups"
    type: "Group"
    multiplicity: "ManyToMany"
  - name: "ownedFiles"
    type: "File"
    multiplicity: "OneToMany"
  - name: "ownedFolders"
    type: "Folder"
    multiplicity: "OneToMany"
  - name: "devices"
    type: "Device"
    multiplicity: "OneToMany"
  - name: "uploadSessions"
    type: "UploadSession"
    multiplicity: "OneToMany"
  - name: "shareLinks"
    type: "ShareLink"
    multiplicity: "OneToMany"
  - name: "fileVersions"
    type: "FileVersion"
    multiplicity: "OneToMany"
- name: "Group"
  description: "Collection of users used to simplify permission management."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "members"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "principal"
    type: "Principal"
    multiplicity: "OneToOne"
- name: "ServiceAccount"
  description: "Non-human account used by automation and services to interact with\
    \ the file system."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "principal"
    type: "Principal"
    multiplicity: "OneToOne"
- name: "ShareLink"
  description: "Time-bound and policy-controlled URL for sharing file access."
  data:
  - name: "url"
    type: "Url"
  - name: "visibility"
    type: "ShareVisibility"
  - name: "accessLevel"
    type: "ShareAccessLevel"
  - name: "expiresAt"
    type: "DateTime"
  - name: "passwordProtected"
    type: "Boolean"
  - name: "maxDownloads"
    type: "Integer"
  - name: "allowUpload"
    type: "Boolean"
  relations:
  - name: "file"
    type: "File"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "RetentionPolicy"
  description: "Policy that governs how long files and folders must be retained and\
    \ whether deletion is restricted."
  data:
  - name: "name"
    type: "String"
  - name: "period"
    type: "RetentionPeriod"
  - name: "mode"
    type: "RetentionMode"
  - name: "legalHold"
    type: "Boolean"
  - name: "description"
    type: "String"
  relations:
  - name: "files"
    type: "File"
    multiplicity: "OneToMany"
  - name: "folders"
    type: "Folder"
    multiplicity: "OneToMany"
- name: "LifecycleRule"
  description: "Automated action that transitions storage class or disposes of content\
    \ based on elapsed time."
  data:
  - name: "name"
    type: "String"
  - name: "action"
    type: "LifecycleAction"
  - name: "transitionAfterDays"
    type: "Integer"
  - name: "deleteAfterDays"
    type: "Integer"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "volume"
    type: "StorageVolume"
    multiplicity: "ManyToOne"
  - name: "files"
    type: "File"
    multiplicity: "ManyToMany"
  - name: "folders"
    type: "Folder"
    multiplicity: "ManyToMany"
- name: "UploadSession"
  description: "Server-side context that tracks chunked uploads and finalization."
  data:
  - name: "chunkSize"
    type: "Integer"
  - name: "totalSize"
    type: "SizeInBytes"
  - name: "startedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  - name: "status"
    type: "UploadStatus"
  relations:
  - name: "file"
    type: "File"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "User"
    multiplicity: "ManyToOne"
- name: "SyncClient"
  description: "Software agent that synchronizes files between endpoints and storage."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "platform"
    type: "ClientPlatform"
  relations:
  - name: "devices"
    type: "Device"
    multiplicity: "OneToMany"
- name: "Device"
  description: "Endpoint used by a user to access and synchronize content."
  data:
  - name: "deviceName"
    type: "String"
  - name: "deviceType"
    type: "DeviceType"
  - name: "os"
    type: "String"
  - name: "lastSyncAt"
    type: "DateTime"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "syncClient"
    type: "SyncClient"
    multiplicity: "ManyToOne"
- name: "EventLog"
  description: "Immutable audit record of actions performed on files and folders."
  data:
  - name: "eventType"
    type: "FileEventType"
  - name: "occurredAt"
    type: "DateTime"
  - name: "ipAddress"
    type: "String"
  - name: "userAgent"
    type: "String"
  - name: "outcome"
    type: "String"
  - name: "details"
    type: "String"
  relations:
  - name: "actor"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "file"
    type: "File"
    multiplicity: "ManyToOne"
  - name: "folder"
    type: "Folder"
    multiplicity: "ManyToOne"
- name: "Tag"
  description: "Label used to categorize and filter files and folders."
  data:
  - name: "name"
    type: "String"
  - name: "color"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "files"
    type: "File"
    multiplicity: "ManyToMany"
  - name: "folders"
    type: "Folder"
    multiplicity: "ManyToMany"
- name: "MetadataSchema"
  description: "Definition of structured metadata applied to content."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "version"
    type: "String"
  relations:
  - name: "fields"
    type: "MetadataField"
    multiplicity: "OneToMany"
  - name: "folders"
    type: "Folder"
    multiplicity: "ManyToMany"
- name: "MetadataField"
  description: "Field definition within a metadata schema that constrains name, type,\
    \ and requirements."
  data:
  - name: "name"
    type: "String"
  - name: "fieldType"
    type: "MetadataFieldType"
  - name: "required"
    type: "Boolean"
  - name: "allowedValues"
    type: "String"
  relations:
  - name: "schema"
    type: "MetadataSchema"
    multiplicity: "ManyToOne"
  - name: "entries"
    type: "MetadataEntry"
    multiplicity: "OneToMany"
- name: "MetadataEntry"
  description: "Concrete metadata value assigned to a file or folder for a defined\
    \ field."
  data:
  - name: "value"
    type: "String"
  - name: "setAt"
    type: "DateTime"
  - name: "setBy"
    type: "String"
  relations:
  - name: "field"
    type: "MetadataField"
    multiplicity: "ManyToOne"
  - name: "file"
    type: "File"
    multiplicity: "ManyToOne"
  - name: "folder"
    type: "Folder"
    multiplicity: "ManyToOne"
- name: "VirusScan"
  description: "Security scan record that evaluates file content against malware signatures\
    \ and heuristics."
  data:
  - name: "engineName"
    type: "String"
  - name: "engineVersion"
    type: "String"
  - name: "scannedAt"
    type: "DateTime"
  - name: "result"
    type: "VirusScanResult"
  - name: "signatureVersion"
    type: "String"
  - name: "message"
    type: "String"
  relations:
  - name: "file"
    type: "File"
    multiplicity: "ManyToOne"
  - name: "triggeredBy"
    type: "Principal"
    multiplicity: "ManyToOne"
  - name: "quarantineItem"
    type: "QuarantineItem"
    multiplicity: "OneToOne"
- name: "QuarantineItem"
  description: "Isolation record for a file flagged by a security mechanism."
  data:
  - name: "reason"
    type: "String"
  - name: "status"
    type: "QuarantineStatus"
  - name: "quarantinedAt"
    type: "DateTime"
  - name: "releasedAt"
    type: "DateTime"
  relations:
  - name: "file"
    type: "File"
    multiplicity: "ManyToOne"
  - name: "virusScan"
    type: "VirusScan"
    multiplicity: "ManyToOne"
  - name: "releasedBy"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "TrashItem"
  description: "Soft-deletion record tracking when content was deleted and when it\
    \ will be purged."
  data:
  - name: "deletedAt"
    type: "DateTime"
  - name: "purgeAt"
    type: "DateTime"
  - name: "reason"
    type: "String"
  relations:
  - name: "file"
    type: "File"
    multiplicity: "ManyToOne"
  - name: "folder"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "deletedBy"
    type: "Principal"
    multiplicity: "ManyToOne"
- name: "Snapshot"
  description: "Point-in-time copy of a storage volume used for backup and recovery."
  data:
  - name: "name"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  - name: "status"
    type: "SnapshotStatus"
  - name: "description"
    type: "String"
  relations:
  - name: "volume"
    type: "StorageVolume"
    multiplicity: "ManyToOne"
  - name: "fileSnapshots"
    type: "FileSnapshot"
    multiplicity: "OneToMany"
- name: "FileSnapshot"
  description: "Association of a file and specific version captured within a snapshot."
  data:
  - name: "note"
    type: "String"
  relations:
  - name: "snapshot"
    type: "Snapshot"
    multiplicity: "ManyToOne"
  - name: "file"
    type: "File"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "FileVersion"
    multiplicity: "ManyToOne"
- name: "FileLock"
  description: "Mechanism that prevents conflicting changes to a file for a defined\
    \ period."
  data:
  - name: "lockType"
    type: "LockType"
  - name: "acquiredAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  - name: "isExpired"
    type: "Boolean"
  relations:
  - name: "file"
    type: "File"
    multiplicity: "OneToOne"
  - name: "owner"
    type: "Principal"
    multiplicity: "ManyToOne"
enums:
- name: "StorageProviderType"
  description: "Types of underlying storage services that host files and folders."
  data:
  - name: "LocalFilesystem"
  - name: "NAS"
  - name: "SAN"
  - name: "ObjectStorage"
  - name: "CloudStorage"
  - name: "FTP"
  - name: "SFTP"
  - name: "SMB"
  - name: "NFS"
- name: "StorageClass"
  description: "Storage durability and performance tiers."
  data:
  - name: "Hot"
  - name: "Standard"
  - name: "InfrequentAccess"
  - name: "Coldline"
  - name: "Archive"
- name: "FileStatus"
  description: "Lifecycle and accessibility state of a file."
  data:
  - name: "Active"
  - name: "Archived"
  - name: "Quarantined"
  - name: "Deleted"
  - name: "Locked"
- name: "PrincipalType"
  description: "Categories of security subjects used for access control."
  data:
  - name: "User"
  - name: "Group"
  - name: "ServiceAccount"
- name: "ShareAccessLevel"
  description: "Permission level granted through a share link."
  data:
  - name: "View"
  - name: "Comment"
  - name: "Edit"
  - name: "Upload"
  - name: "Owner"
- name: "InheritanceMode"
  description: "How access policies cascade through the folder hierarchy."
  data:
  - name: "None"
  - name: "ParentOnly"
  - name: "Merge"
- name: "LifecycleAction"
  description: "Automated operations executed by lifecycle management."
  data:
  - name: "TransitionStorageClass"
  - name: "MoveToArchive"
  - name: "DeletePermanently"
  - name: "RemoveOlderVersions"
- name: "UploadStatus"
  description: "State of an upload session."
  data:
  - name: "Initiated"
  - name: "InProgress"
  - name: "Completed"
  - name: "Failed"
  - name: "Aborted"
- name: "ClientPlatform"
  description: "Platform on which a synchronization client runs."
  data:
  - name: "Windows"
  - name: "macOS"
  - name: "Linux"
  - name: "iOS"
  - name: "Android"
- name: "DeviceType"
  description: "Category of endpoint device used to access files."
  data:
  - name: "Desktop"
  - name: "Laptop"
  - name: "Mobile"
  - name: "Tablet"
  - name: "Server"
- name: "FileEventType"
  description: "Types of events recorded in the audit trail."
  data:
  - name: "Created"
  - name: "Updated"
  - name: "Moved"
  - name: "Copied"
  - name: "Deleted"
  - name: "Restored"
  - name: "Versioned"
  - name: "Shared"
  - name: "PermissionChanged"
  - name: "Downloaded"
  - name: "Previewed"
  - name: "Scanned"
  - name: "SyncConflict"
- name: "MetadataFieldType"
  description: "Supported data types for structured metadata fields."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime"
  - name: "Enum"
  - name: "Url"
- name: "VirusScanResult"
  description: "Outcome of a malware scan."
  data:
  - name: "Clean"
  - name: "Infected"
  - name: "Suspicious"
  - name: "Error"
- name: "QuarantineStatus"
  description: "Status of an item placed in quarantine."
  data:
  - name: "Active"
  - name: "Released"
  - name: "Deleted"
- name: "LockType"
  description: "Types of coordination locks applied to files."
  data:
  - name: "ReadOnly"
  - name: "ExclusiveWrite"
  - name: "CooperativeWrite"
- name: "AccessRight"
  description: "Discrete permissions that can be granted to a principal."
  data:
  - name: "Read"
  - name: "Write"
  - name: "Delete"
  - name: "Share"
  - name: "ManagePermissions"
  - name: "Owner"
- name: "AccessScope"
  description: "Range of resource coverage for an access control entry."
  data:
  - name: "ObjectOnly"
  - name: "ChildrenOnly"
  - name: "ObjectAndChildren"
  - name: "Descendants"
- name: "RetentionMode"
  description: "Enforcement mode governing whether retention can be shortened or must\
    \ be immutable."
  data:
  - name: "Governance"
  - name: "Compliance"
- name: "ShareVisibility"
  description: "Audience that can discover and use a share link."
  data:
  - name: "Public"
  - name: "Organization"
  - name: "Restricted"
- name: "VersioningStrategy"
  description: "Method used to create and label versions."
  data:
  - name: "MajorMinor"
  - name: "Timestamped"
  - name: "Sequential"
  - name: "ContentHash"
- name: "SnapshotStatus"
  description: "Availability and health state of a snapshot."
  data:
  - name: "Available"
  - name: "InProgress"
  - name: "Failed"
  - name: "Expired"
valueObjects:
- name: "Path"
  description: "Absolute or volume-scoped hierarchical location of a folder or file."
  data:
  - name: "value"
    type: "String"
- name: "MimeType"
  description: "Standardized media type that indicates file content format."
  data:
  - name: "value"
    type: "String"
- name: "Url"
  description: "Fully qualified URL used for APIs, callbacks, or share links."
  data:
  - name: "value"
    type: "String"
- name: "SizeInBytes"
  description: "Integer representation of content size measured in bytes."
  data:
