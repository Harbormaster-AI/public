metadata:
  name: "Media Industry Domain Model"
  version: "1.0.0"
  industry: "Media"
  category: "Document & Content"
  description: "HCIDL model capturing core media company, content, rights, distribution,\
    \ advertising, and subscription capabilities."
  language: "en-US"
  type: "Industry"
  domain: "Media"
enums:
- name: "AudienceSegment"
  description: "Target audience category that a brand primarily serves."
  data:
  - name: "Kids"
  - name: "Teens"
  - name: "Adults"
  - name: "Family"
  - name: "SportsFans"
  - name: "NewsSeekers"
  - name: "LifestyleEnthusiasts"
  - name: "Gamers"
- name: "Genre"
  description: "Editorial categorization used to group titles by theme or subject."
  data:
  - name: "Drama"
  - name: "Comedy"
  - name: "Action"
  - name: "Thriller"
  - name: "Documentary"
  - name: "Animation"
  - name: "SciFi"
  - name: "Fantasy"
  - name: "Romance"
  - name: "Horror"
  - name: "Sports"
  - name: "News"
- name: "TitleType"
  description: "Classification of the canonical work."
  data:
  - name: "Film"
  - name: "Episode"
  - name: "Special"
  - name: "ShortForm"
  - name: "LiveEvent"
- name: "ContentRating"
