---
metadata:
  name: "HCIDL Content Management Capabilities Model"
  description: "Canonical capability model for managing digital content, documents,\
    \ assets, structure, classification, workflow, publishing, security, and retention\
    \ across repositories and channels."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Document & Content"
  type: "Capability"
  domain: "Content Management"
entities:
- name: "ContentRepository"
  description: "Root container for content, configuration, users, groups, taxonomies,\
    \ and channels."
  data:
  - name: "name"
    type: "String"
  - name: "defaultLocale"
    type: "Locale"
  - name: "versioningStrategy"
    type: "VersioningStrategy"
  relations:
  - name: "spaces"
    type: "Space"
    multiplicity: "OneToMany"
  - name: "taxonomies"
    type: "Taxonomy"
    multiplicity: "OneToMany"
  - name: "users"
    type: "User"
    multiplicity: "OneToMany"
  - name: "groups"
    type: "Group"
    multiplicity: "OneToMany"
  - name: "roles"
    type: "Role"
    multiplicity: "OneToMany"
  - name: "channels"
    type: "PublishingChannel"
    multiplicity: "OneToMany"
  - name: "searchIndices"
    type: "SearchIndex"
    multiplicity: "OneToMany"
- name: "Space"
  description: "Logical subdivision of a repository for sites, products, or departments."
  data:
  - name: "name"
    type: "String"
  - name: "path"
    type: "Path"
  - name: "visibility"
    type: "Visibility"
  relations:
  - name: "repository"
    type: "ContentRepository"
    multiplicity: "ManyToOne"
  - name: "folders"
    type: "Folder"
    multiplicity: "OneToMany"
  - name: "items"
    type: "ContentItem"
    multiplicity: "OneToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
- name: "Folder"
  description: "Hierarchical container used to organize content within a space."
  data:
  - name: "name"
    type: "String"
  - name: "path"
    type: "Path"
  - name: "description"
    type: "String"
  relations:
  - name: "space"
    type: "Space"
    multiplicity: "ManyToOne"
  - name: "parentFolder"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "subfolders"
    type: "Folder"
    multiplicity: "OneToMany"
  - name: "items"
    type: "ContentItem"
    multiplicity: "OneToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
- name: "ContentType"
  description: "Schema definition describing structure and behavior of content items."
  data:
  - name: "name"
    type: "String"
  - name: "kind"
    type: "ContentTypeKind"
  - name: "version"
    type: "String"
  relations:
  - name: "templates"
    type: "Template"
    multiplicity: "OneToMany"
  - name: "items"
    type: "ContentItem"
    multiplicity: "OneToMany"
- name: "Template"
  description: "Presentation template for rendering items for specific channels or\
    \ contexts."
  data:
  - name: "name"
    type: "String"
  - name: "engine"
    type: "String"
  - name: "renderingFormat"
    type: "TextFormat"
  - name: "templateBody"
    type: "RichText"
  relations:
  - name: "contentType"
    type: "ContentType"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "PublishingChannel"
    multiplicity: "ManyToOne"
- name: "ContentItem"
  description: "Primary managed unit of content governed by type, workflow, and publishing."
  data:
  - name: "title"
    type: "String"
  - name: "slug"
    type: "Slug"
  - name: "locale"
    type: "Locale"
  - name: "status"
    type: "ContentStatus"
  - name: "visibility"
    type: "Visibility"
  - name: "createdAt"
    type: "DateTime"
  - name: "updatedAt"
    type: "DateTime"
  relations:
  - name: "space"
    type: "Space"
    multiplicity: "ManyToOne"
  - name: "folder"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "contentType"
    type: "ContentType"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "ContentVersion"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "BinaryAsset"
    multiplicity: "OneToMany"
  - name: "renditions"
    type: "Rendition"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "terms"
    type: "Term"
    multiplicity: "ManyToMany"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
  - name: "links"
    type: "ContentLink"
    multiplicity: "OneToMany"
  - name: "translations"
    type: "Translation"
    multiplicity: "OneToMany"
- name: "ContentVersion"
  description: "Immutable snapshot of a content item at a specific time."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "message"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "status"
    type: "VersionStatus"
  relations:
  - name: "item"
    type: "ContentItem"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "publications"
    type: "Publication"
    multiplicity: "OneToMany"
- name: "BinaryAsset"
  description: "Managed binary file stored with metadata for reuse and delivery."
  data:
  - name: "fileName"
    type: "String"
  - name: "assetType"
    type: "AssetType"
  - name: "mimeType"
    type: "MimeType"
  - name: "fileSize"
    type: "FileSize"
  - name: "checksum"
    type: "Checksum"
  - name: "url"
    type: "Url"
  relations:
  - name: "item"
    type: "ContentItem"
    multiplicity: "ManyToOne"
  - name: "renditions"
    type: "Rendition"
    multiplicity: "OneToMany"
- name: "Rendition"
  description: "Derived representation of an asset or item for a target format or\
    \ device."
  data:
  - name: "format"
    type: "RenditionFormat"
  - name: "width"
    type: "Integer"
  - name: "height"
    type: "Integer"
  - name: "url"
    type: "Url"
  relations:
  - name: "asset"
    type: "BinaryAsset"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "ContentItem"
    multiplicity: "ManyToOne"
- name: "Tag"
  description: "Free-form label used to aid discovery and curation."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "items"
    type: "ContentItem"
    multiplicity: "ManyToMany"
- name: "Taxonomy"
  description: "Controlled vocabulary defining terms and hierarchies for classification."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "repository"
    type: "ContentRepository"
    multiplicity: "ManyToOne"
  - name: "terms"
    type: "Term"
    multiplicity: "OneToMany"
- name: "Term"
  description: "Node in a taxonomy hierarchy used to classify content items."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  relations:
  - name: "taxonomy"
    type: "Taxonomy"
    multiplicity: "ManyToOne"
  - name: "parentTerm"
    type: "Term"
    multiplicity: "ManyToOne"
  - name: "childTerms"
    type: "Term"
    multiplicity: "OneToMany"
  - name: "items"
    type: "ContentItem"
    multiplicity: "ManyToMany"
- name: "Comment"
  description: "Annotation or remark made by a user on a content item."
  data:
  - name: "body"
    type: "String"
  - name: "visibility"
    type: "CommentVisibility"
  - name: "createdAt"
    type: "DateTime"
  - name: "updatedAt"
    type: "DateTime"
  relations:
  - name: "item"
    type: "ContentItem"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
- name: "ContentLink"
  description: "Explicit relationship between two items for navigation, reuse, or\
    \ reference."
  data:
  - name: "linkType"
    type: "LinkType"
  - name: "description"
    type: "String"
  relations:
  - name: "source"
    type: "ContentItem"
    multiplicity: "ManyToOne"
  - name: "target"
    type: "ContentItem"
    multiplicity: "ManyToOne"
- name: "Translation"
  description: "Association between an original item and its localized counterpart."
  data:
  - name: "targetLocale"
    type: "Locale"
  - name: "status"
    type: "TranslationStatus"
  relations:
  - name: "original"
    type: "ContentItem"
    multiplicity: "ManyToOne"
  - name: "translated"
    type: "ContentItem"
    multiplicity: "ManyToOne"
- name: "PublishingChannel"
  description: "Destination endpoint used to deliver published content."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "endpoint"
    type: "Url"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "repository"
    type: "ContentRepository"
    multiplicity: "ManyToOne"
  - name: "templates"
    type: "Template"
    multiplicity: "OneToMany"
  - name: "publications"
    type: "Publication"
    multiplicity: "OneToMany"
- name: "Publication"
  description: "Execution record of delivering a content version to a channel."
  data:
  - name: "publishedAt"
    type: "DateTime"
  - name: "status"
    type: "PublicationStatus"
  - name: "message"
    type: "String"
  relations:
  - name: "version"
    type: "ContentVersion"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "PublishingChannel"
    multiplicity: "ManyToOne"
  - name: "schedule"
    type: "PublicationSchedule"
    multiplicity: "ManyToOne"
- name: "PublicationSchedule"
  description: "Time-based instruction to publish or unpublish content to channels."
  data:
  - name: "window"
    type: "TimeWindow"
  - name: "status"
    type: "PublicationScheduleStatus"
  - name: "timeZone"
    type: "String"
  relations:
  - name: "item"
    type: "ContentItem"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "PublishingChannel"
    multiplicity: "ManyToOne"
  - name: "publications"
    type: "Publication"
    multiplicity: "OneToMany"
- name: "WorkflowDefinition"
  description: "Reusable model describing steps, routing, and rules for content review."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "version"
    type: "String"
  relations:
  - name: "steps"
    type: "WorkflowStep"
    multiplicity: "OneToMany"
  - name: "instances"
    type: "WorkflowInstance"
    multiplicity: "OneToMany"
- name: "WorkflowStep"
  description: "Ordered unit of work within a workflow that may require approval."
  data:
  - name: "name"
    type: "String"
  - name: "order"
    type: "Integer"
  - name: "requiresApproval"
    type: "Boolean"
  relations:
  - name: "workflowDefinition"
    type: "WorkflowDefinition"
    multiplicity: "ManyToOne"
- name: "WorkflowInstance"
  description: "Runtime execution of a workflow for a content item and version."
  data:
  - name: "status"
    type: "WorkflowStatus"
  - name: "startedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  relations:
  - name: "definition"
    type: "WorkflowDefinition"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "ContentItem"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "ContentVersion"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "ApprovalTask"
    multiplicity: "OneToMany"
- name: "ApprovalTask"
  description: "Actionable decision or review assigned to a user or group within a\
    \ workflow."
  data:
  - name: "status"
    type: "TaskStatus_"
  - name: "dueDate"
    type: "Date"
  - name: "comment"
    type: "String"
  relations:
  - name: "workflowInstance"
    type: "WorkflowInstance"
    multiplicity: "ManyToOne"
  - name: "assigneeUser"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "assigneeGroup"
    type: "Group"
    multiplicity: "ManyToOne"
  - name: "decidedBy"
    type: "User"
    multiplicity: "ManyToOne"
- name: "User"
  description: "Person who creates, reviews, manages, or publishes content."
  data:
  - name: "username"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "locale"
    type: "Locale"
  relations:
  - name: "groups"
    type: "Group"
    multiplicity: "ManyToMany"
  - name: "authoredItems"
    type: "ContentItem"
    multiplicity: "OneToMany"
- name: "Group"
  description: "Collection of users for organizing permissions and workflow assignment."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
- name: "Role"
  description: "Named collection of permissions granted within policies and workflows."
  data:
  - name: "name"
    type: "String"
  - name: "permissionLevel"
    type: "PermissionLevel"
  relations:
  - name: "assignments"
    type: "AccessAssignment"
    multiplicity: "OneToMany"
- name: "AccessPolicy"
  description: "Policy defining access control for a specific scope with inheritance\
    \ options."
  data:
  - name: "name"
    type: "String"
  - name: "scopeType"
    type: "AccessScopeType"
  - name: "inherit"
    type: "Boolean"
  relations:
  - name: "space"
    type: "Space"
    multiplicity: "ManyToOne"
  - name: "folder"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "ContentItem"
    multiplicity: "ManyToOne"
  - name: "assignments"
    type: "AccessAssignment"
    multiplicity: "OneToMany"
- name: "AccessAssignment"
  description: "Grant of a role to a user or group under a specific policy."
  data:
  - name: "start"
    type: "Date"
  - name: "end"
    type: "Date"
  relations:
  - name: "policy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
  - name: "role"
    type: "Role"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "group"
    type: "Group"
    multiplicity: "ManyToOne"
- name: "RetentionPolicy"
  description: "Rule set governing how long content is retained and its end-of-life\
    \ action."
  data:
  - name: "name"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  - name: "action"
    type: "RetentionAction"
  - name: "legalHold"
    type: "Boolean"
  relations:
  - name: "assignments"
    type: "RetentionAssignment"
    multiplicity: "OneToMany"
- name: "RetentionAssignment"
  description: "Application of a retention policy to specific content or folders."
  data:
  - name: "assignedAt"
    type: "DateTime"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "policy"
    type: "RetentionPolicy"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "ContentItem"
    multiplicity: "ManyToOne"
  - name: "folder"
    type: "Folder"
    multiplicity: "ManyToOne"
- name: "SearchIndex"
  description: "Search configuration and operational status for a repository."
  data:
  - name: "name"
    type: "String"
  - name: "engine"
    type: "String"
  - name: "status"
    type: "IndexStatus"
  relations:
  - name: "repository"
    type: "ContentRepository"
    multiplicity: "ManyToOne"
enums:
- name: "ContentTypeKind"
  description: "High-level classification of a content type to guide structure and\
    \ rendering."
  data:
  - name: "Document"
  - name: "Article"
  - name: "Page"
  - name: "Image"
  - name: "Video"
  - name: "Audio"
  - name: "Dataset"
  - name: "Link"
  - name: "Form"
- name: "TextFormat"
  description: "Markup or templating language used for presentation or rich text content."
  data:
  - name: "HTML"
  - name: "Markdown"
  - name: "PlainText"
  - name: "Liquid"
  - name: "Mustache"
  - name: "Freemarker"
- name: "ChannelType"
  description: "Type of distribution endpoint for published content."
  data:
  - name: "Website"
  - name: "MobileApp"
  - name: "API"
  - name: "Social"
  - name: "Email"
  - name: "Kiosk"
  - name: "Print"
- name: "VersioningStrategy"
  description: "Approach governing how new versions are created and organized."
  data:
  - name: "Linear"
  - name: "Branching"
  - name: "Semantic"
- name: "ContentStatus"
  description: "Lifecycle state of a content item."
  data:
  - name: "Draft"
  - name: "InReview"
  - name: "Approved"
  - name: "Scheduled"
  - name: "Published"
  - name: "Archived"
  - name: "Retired"
- name: "VersionStatus"
  description: "State of a specific content version with respect to readiness and\
    \ exposure."
  data:
  - name: "Draft"
  - name: "Ready"
  - name: "Published"
  - name: "Archived"
- name: "PublicationStatus"
  description: "Operational state of a publish execution."
  data:
  - name: "Queued"
  - name: "InProgress"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Cancelled"
- name: "PublicationScheduleStatus"
  description: "Status of a scheduled publishing window."
  data:
  - name: "Draft"
  - name: "Scheduled"
  - name: "Executed"
  - name: "Cancelled"
  - name: "Failed"
  - name: "Expired"
- name: "WorkflowStatus"
  description: "Overall progress of a workflow instance."
  data:
  - name: "NotStarted"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "TaskStatus_"
  description: "Decision or progress state of an approval or review task."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
  - name: "InProgress"
  - name: "OnHold"
  - name: "Completed"
  - name: "Cancelled"
- name: "PermissionLevel"
  description: "Aggregate permission tier used to authorize operations."
  data:
  - name: "View"
  - name: "Comment"
  - name: "Edit"
  - name: "Approve"
  - name: "Publish"
  - name: "Admin"
- name: "AccessScopeType"
  description: "Target surface to which an access policy applies."
  data:
  - name: "Repository"
  - name: "Space"
  - name: "Folder"
  - name: "ContentItem"
- name: "RenditionFormat"
  description: "Output format for derived representations."
  data:
  - name: "PNG"
  - name: "JPEG"
  - name: "WEBP"
  - name: "GIF"
  - name: "SVG"
  - name: "PDF"
  - name: "TXT"
  - name: "HTML"
  - name: "DOCX"
  - name: "MP4"
- name: "AssetType"
  description: "General classification of a binary asset."
  data:
  - name: "Image"
  - name: "Video"
  - name: "Audio"
  - name: "Document"
  - name: "Archive"
  - name: "Other"
- name: "TranslationStatus"
  description: "Progress state of a localized variant."
  data:
  - name: "Pending"
  - name: "InProgress"
  - name: "Reviewed"
  - name: "Approved"
  - name: "Published"
  - name: "Deprecated"
- name: "RetentionAction"
  description: "Terminal action to perform when a retention policy matures."
  data:
  - name: "Retain"
  - name: "Delete"
  - name: "Review"
- name: "IndexStatus"
  description: "Operational state of a search index configuration."
  data:
  - name: "Queued"
  - name: "Indexing"
  - name: "Indexed"
  - name: "Failed"
  - name: "Disabled"
- name: "ChecksumAlgorithm"
  description: "Algorithm used to compute a checksum for asset integrity."
  data:
  - name: "MD5"
  - name: "SHA1"
  - name: "SHA256"
- name: "CommentVisibility"
  description: "Audience that can see a comment."
  data:
  - name: "Public"
  - name: "Internal"
- name: "LinkType"
  description: "Nature of a relationship between two content items."
  data:
  - name: "Related"
  - name: "Duplicate"
  - name: "Replaces"
  - name: "References"
  - name: "Embeds"
- name: "Visibility"
  description: "Access exposure of spaces and items outside of explicit ACLs."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Private"
valueObjects:
- name: "Locale"
  description: "Language and regional setting used for content and UI."
  data:
  - name: "code"
    type: "String"
  - name: "name"
    type: "String"
- name: "Slug"
  description: "URL-friendly identifier derived from a title."
  data:
  - name: "value"
    type: "String"
- name: "Url"
  description: "Absolute or relative address referencing a resource."
  data:
  - name: "value"
    type: "String"
- name: "MimeType"
  description: "IANA media type representing the content format."
  data:
  - name: "value"
    type: "String"
- name: "FileSize"
  description: "Size of a binary payload with both raw and human-readable forms."
  data:
  - name: "bytes"
    type: "Integer"
  - name: "readable"
    type: "String"
- name: "Checksum"
  description: "Digest representing asset integrity."
  data:
  - name: "algorithm"
    type: "ChecksumAlgorithm"
  - name: "value"
    type: "String"
- name: "Path"
  description: "Hierarchical location within a repository or space."
  data:
  - name: "value"
    type: "String"
- name: "TimeWindow"
  description: "Scheduling interval defining start and end of an action."
  data:
  - name: "start"
    type: "DateTime"
  - name: "end"
    type: "DateTime"
- name: "EmailAddress"
  description: "Electronic mail address used for notification and identity."
  data:
  - name: "value"
    type: "String"
- name: "RichText"
  description: "Text content with associated markup format."
  data:
  - name: "content"
    type: "String"
  - name: "format"
    type: "TextFormat"
