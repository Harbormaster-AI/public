---
metadata:
  name: "Digital Asset Management Capabilities Model"
  description: "Capability model for organizing, governing, enriching, transforming,\
    \ and distributing digital media across the enterprise."
  version: "1.0.0"
  industry: "Software"
  category: "Document & Content"
  type: "Capability"
  domain: "Digital Asset Management"
entities:
- name: "AssetRepository"
  description: "Logical space that governs assets, metadata, storage, and access policies\
    \ for a DAM deployment."
  data:
  - name: "name"
    type: "String"
  - name: "defaultStorageClass"
    type: "StorageClass"
  - name: "baseUri"
    type: "URI"
  - name: "timezone"
    type: "String"
  relations:
  - name: "folders"
    type: "Folder"
    multiplicity: "OneToMany"
  - name: "schemas"
    type: "MetadataSchema"
    multiplicity: "OneToMany"
  - name: "storageLocations"
    type: "StorageLocation"
    multiplicity: "OneToMany"
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "StorageLocation"
  description: "Physical or cloud-backed storage target used for original files, versions,\
    \ and renditions."
  data:
  - name: "name"
    type: "String"
  - name: "provider"
    type: "StorageProvider"
  - name: "storageClass"
    type: "StorageClass"
  - name: "bucket"
    type: "String"
  - name: "basePath"
    type: "String"
  - name: "region"
    type: "String"
  - name: "encryptionAtRest"
    type: "Boolean"
  relations:
  - name: "repository"
    type: "AssetRepository"
    multiplicity: "ManyToOne"
  - name: "assetVersions"
    type: "AssetVersion"
    multiplicity: "OneToMany"
  - name: "renditions"
    type: "Rendition"
    multiplicity: "OneToMany"
- name: "Folder"
  description: "Hierarchical container used to organize assets within a repository."
  data:
  - name: "name"
    type: "String"
  - name: "path"
    type: "String"
  - name: "isRoot"
    type: "Boolean"
  relations:
  - name: "repository"
    type: "AssetRepository"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "Folder"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "OneToMany"
- name: "Asset"
  description: "Canonical representation of a digital asset and its lifecycle, metadata,\
    \ and governance."
  data:
  - name: "title"
    type: "String"
  - name: "assetType"
    type: "AssetType"
  - name: "mediaType"
    type: "MediaType"
  - name: "originalFilename"
    type: "String"
  - name: "fileSize"
    type: "Integer"
  - name: "checksum"
    type: "Checksum"
  - name: "captureDate"
    type: "Date"
  - name: "language"
    type: "LanguageTag"
  - name: "status"
    type: "AssetLifecycleStatus"
  - name: "location"
    type: "GeoPoint"
  relations:
  - name: "folder"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "repository"
    type: "AssetRepository"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "AssetVersion"
    multiplicity: "OneToMany"
  - name: "taxonomyTerms"
    type: "TaxonomyTerm"
    multiplicity: "ManyToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "rightsGrants"
    type: "RightsGrant"
    multiplicity: "OneToMany"
  - name: "consentRecords"
    type: "ConsentRecord"
    multiplicity: "ManyToMany"
  - name: "collections"
    type: "Collection"
    multiplicity: "ManyToMany"
  - name: "campaigns"
    type: "Campaign"
    multiplicity: "ManyToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
  - name: "usages"
    type: "AssetUsage"
    multiplicity: "OneToMany"
  - name: "workflows"
    type: "WorkflowInstance"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
  - name: "retentionPolicies"
    type: "RetentionPolicy"
    multiplicity: "ManyToMany"
  - name: "preservationPlans"
    type: "PreservationPlan"
    multiplicity: "ManyToMany"
  - name: "distributions"
    type: "Distribution"
    multiplicity: "OneToMany"
  - name: "searchIndexes"
    type: "SearchIndex"
    multiplicity: "ManyToMany"
- name: "AssetVersion"
  description: "Immutable file state of an asset capturing technical characteristics\
    \ and provenance."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "versionNumber"
    type: "Integer"
  - name: "createdOn"
    type: "Date"
  - name: "checksum"
    type: "Checksum"
  - name: "fileSize"
    type: "Integer"
  - name: "dimensions"
    type: "Dimensions"
  - name: "duration"
    type: "Duration"
  - name: "colorProfile"
    type: "ColorProfile"
  - name: "frameRate"
    type: "Decimal"
  - name: "storagePath"
    type: "URI"
  - name: "isCurrent"
    type: "Boolean"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "renditions"
    type: "Rendition"
    multiplicity: "OneToMany"
  - name: "storageLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "transcript"
    type: "Transcript"
    multiplicity: "OneToOne"
  - name: "checksumRecords"
    type: "ChecksumRecord"
    multiplicity: "OneToMany"
  - name: "aiExtractions"
    type: "AIExtraction"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
  - name: "distributions"
    type: "Distribution"
    multiplicity: "OneToMany"
  - name: "transformJobs"
    type: "TransformJob"
    multiplicity: "OneToMany"
- name: "Rendition"
  description: "Derived representation of a version optimized for a specific channel\
    \ or use case."
  data:
  - name: "renditionType"
    type: "RenditionType"
  - name: "format"
    type: "String"
  - name: "mimeType"
    type: "String"
  - name: "dimensions"
    type: "Dimensions"
  - name: "duration"
    type: "Duration"
  - name: "storagePath"
    type: "URI"
  - name: "fileSize"
    type: "Integer"
  - name: "watermarkApplied"
    type: "Boolean"
  relations:
  - name: "assetVersion"
    type: "AssetVersion"
    multiplicity: "ManyToOne"
  - name: "transcodeProfile"
    type: "TranscodeProfile"
    multiplicity: "ManyToOne"
  - name: "storageLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "transformJob"
    type: "TransformJob"
    multiplicity: "ManyToOne"
  - name: "checksumRecords"
    type: "ChecksumRecord"
    multiplicity: "OneToMany"
- name: "TranscodeProfile"
  description: "Technical blueprint describing how renditions are produced from source\
    \ media."
  data:
  - name: "name"
    type: "String"
  - name: "targetFormat"
    type: "String"
  - name: "targetCodec"
    type: "String"
  - name: "quality"
    type: "String"
  - name: "maxWidth"
    type: "Integer"
  - name: "maxHeight"
    type: "Integer"
  - name: "bitrateKbps"
    type: "Integer"
  relations:
  - name: "renditions"
    type: "Rendition"
    multiplicity: "OneToMany"
  - name: "workflows"
    type: "WorkflowDefinition"
    multiplicity: "ManyToMany"
- name: "MetadataSchema"
  description: "Configurable set of metadata fields applicable to assets and organizational\
    \ scopes."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "scope"
    type: "SchemaScope"
  relations:
  - name: "fields"
    type: "MetadataField"
    multiplicity: "OneToMany"
  - name: "repository"
    type: "AssetRepository"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
- name: "MetadataField"
  description: "Atomic metadata definition including type, cardinality, and validation\
    \ details."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "FieldDataType"
  - name: "isRequired"
    type: "Boolean"
  - name: "isMultiValued"
    type: "Boolean"
  - name: "vocabulary"
    type: "String"
  relations:
  - name: "schema"
    type: "MetadataSchema"
    multiplicity: "ManyToOne"
- name: "Taxonomy"
  description: "Controlled vocabulary structure used to classify and navigate assets."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "terms"
    type: "TaxonomyTerm"
    multiplicity: "OneToMany"
- name: "TaxonomyTerm"
  description: "Hierarchical term within a taxonomy used for consistent asset classification."
  data:
  - name: "term"
    type: "String"
  - name: "synonymOf"
    type: "String"
  - name: "status"
    type: "TermStatus"
  relations:
  - name: "taxonomy"
    type: "Taxonomy"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "TaxonomyTerm"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "TaxonomyTerm"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
- name: "Tag"
  description: "Flexible label applied to assets for ad-hoc grouping and discovery."
  data:
  - name: "label"
    type: "String"
  - name: "slug"
    type: "String"
  relations:
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
- name: "Collection"
  description: "Curated set of assets assembled for a purpose such as a release, theme,\
    \ or audience."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "visibility"
    type: "Visibility"
  relations:
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "owner"
    type: "UserGroup"
    multiplicity: "ManyToOne"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
- name: "Campaign"
  description: "Marketing or communication initiative that coordinates asset usage\
    \ across channels."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "channel"
    type: "DistributionChannel"
  relations:
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
  - name: "distributions"
    type: "Distribution"
    multiplicity: "OneToMany"
- name: "License"
  description: "Legal instrument defining permissions and constraints for asset usage."
  data:
  - name: "name"
    type: "String"
  - name: "licenseType"
    type: "LicenseType"
  - name: "textUri"
    type: "URI"
  - name: "termsSummary"
    type: "String"
  relations:
  - name: "grants"
    type: "RightsGrant"
    multiplicity: "OneToMany"
- name: "RightsGrant"
  description: "Specific rights and restrictions permitting asset usage under defined\
    \ conditions."
  data:
  - name: "usageType"
    type: "UsageType"
  - name: "territory"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "exclusivity"
    type: "Exclusivity"
  - name: "restrictionNotes"
    type: "String"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "license"
    type: "License"
    multiplicity: "ManyToOne"
  - name: "campaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
- name: "ConsentRecord"
  description: "Documented authorization from a subject or rights holder permitting\
    \ use of their likeness or property."
  data:
  - name: "subject"
    type: "PersonName"
  - name: "consentType"
    type: "ConsentType"
  - name: "jurisdiction"
    type: "String"
  - name: "obtainedOn"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "status"
    type: "ConsentStatus"
  - name: "referenceUri"
    type: "URI"
  relations:
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
- name: "AssetUsage"
  description: "Record of when, where, and why an asset was used."
  data:
  - name: "usedOn"
    type: "Date"
  - name: "purpose"
    type: "UsagePurpose"
  - name: "channel"
    type: "DistributionChannel"
  - name: "destinationUri"
    type: "URI"
  - name: "notes"
    type: "String"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "campaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
  - name: "requester"
    type: "User"
    multiplicity: "ManyToOne"
- name: "Approval"
  description: "Governance checkpoint capturing review outcomes for asset readiness\
    \ and compliance."
  data:
  - name: "status"
    type: "ApprovalStatus"
  - name: "decisionDate"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "workflow"
    type: "WorkflowInstance"
    multiplicity: "ManyToOne"
- name: "WorkflowDefinition"
  description: "Reusable workflow template defining stages, roles, and automation\
    \ for DAM processes."
  data:
  - name: "name"
    type: "String"
  - name: "workflowType"
    type: "WorkflowType"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "steps"
    type: "WorkflowStepDefinition"
    multiplicity: "OneToMany"
  - name: "transcodeProfiles"
    type: "TranscodeProfile"
    multiplicity: "ManyToMany"
- name: "WorkflowStepDefinition"
  description: "Ordered step within a workflow definition describing task behavior\
    \ and assignment."
  data:
  - name: "name"
    type: "String"
  - name: "stepType"
    type: "WorkflowStepType"
  - name: "orderIndex"
    type: "Integer"
  - name: "assigneeRole"
    type: "String"
  - name: "dueDays"
    type: "Integer"
  relations:
  - name: "workflowDefinition"
    type: "WorkflowDefinition"
    multiplicity: "ManyToOne"
- name: "WorkflowInstance"
  description: "Execution of a workflow definition tracking state and interactions\
    \ for a specific asset."
  data:
  - name: "startedOn"
    type: "Date"
  - name: "status"
    type: "WorkflowStatus"
  relations:
  - name: "definition"
    type: "WorkflowDefinition"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "steps"
    type: "WorkflowStepInstance"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "initiatedBy"
    type: "User"
    multiplicity: "ManyToOne"
- name: "WorkflowStepInstance"
  description: "Runtime instance of a workflow step with progress and accountability\
    \ details."
  data:
  - name: "status"
    type: "WorkflowStatus"
  - name: "startedOn"
    type: "Date"
  - name: "completedOn"
    type: "Date"
  - name: "comments"
    type: "String"
  relations:
  - name: "instance"
    type: "WorkflowInstance"
    multiplicity: "ManyToOne"
  - name: "assignee"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "approval"
    type: "Approval"
    multiplicity: "ManyToOne"
- name: "Comment"
  description: "Feedback or annotation associated with an asset and optionally a specific\
    \ version."
  data:
  - name: "body"
    type: "String"
  - name: "createdOn"
    type: "Date"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "AssetVersion"
    multiplicity: "ManyToOne"
- name: "User"
  description: "Person with authenticated access to DAM capabilities and content."
  data:
  - name: "username"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "String"
  relations:
  - name: "groups"
    type: "UserGroup"
    multiplicity: "ManyToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "comments"
    type: "Comment"
    multiplicity: "OneToMany"
  - name: "repositories"
    type: "AssetRepository"
    multiplicity: "ManyToMany"
  - name: "jobs"
    type: "IngestJob"
    multiplicity: "OneToMany"
- name: "UserGroup"
  description: "Cohort of users with shared responsibilities, access rights, and ownership."
  data:
  - name: "name"
    type: "String"
  - name: "groupType"
    type: "GroupType"
  relations:
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "collections"
    type: "Collection"
    multiplicity: "OneToMany"
- name: "AccessPolicy"
  description: "Rule granting specific permissions to a group over a defined scope\
    \ of content."
  data:
  - name: "permission"
    type: "Permission"
  - name: "scopeType"
    type: "AccessScopeType"
  - name: "scopeReference"
    type: "String"
  - name: "policyExpression"
    type: "String"
  relations:
  - name: "group"
    type: "UserGroup"
    multiplicity: "ManyToOne"
  - name: "repository"
    type: "AssetRepository"
    multiplicity: "ManyToOne"
  - name: "folder"
    type: "Folder"
    multiplicity: "ManyToOne"
  - name: "collection"
    type: "Collection"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
- name: "IngestJob"
  description: "Orchestrated process that imports source media and creates managed\
    \ assets."
  data:
  - name: "sourceUri"
    type: "URI"
  - name: "ingestType"
    type: "IngestType"
  - name: "status"
    type: "JobStatus"
  - name: "submittedOn"
    type: "Date"
  - name: "completedOn"
    type: "Date"
  - name: "errorMessage"
    type: "String"
  relations:
  - name: "repository"
    type: "AssetRepository"
    multiplicity: "ManyToOne"
  - name: "createdAssets"
    type: "Asset"
    multiplicity: "OneToMany"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "TransformJob"
  description: "Background task that creates or modifies technical derivatives of\
    \ an asset version."
  data:
  - name: "jobType"
    type: "TransformJobType"
  - name: "status"
    type: "JobStatus"
  - name: "submittedOn"
    type: "Date"
  - name: "completedOn"
    type: "Date"
  - name: "errorMessage"
    type: "String"
  relations:
  - name: "assetVersion"
    type: "AssetVersion"
    multiplicity: "ManyToOne"
  - name: "renditions"
    type: "Rendition"
    multiplicity: "OneToMany"
  - name: "profile"
    type: "TranscodeProfile"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "AuditEvent"
  description: "Immutable trace of user or system activity for compliance and monitoring."
  data:
  - name: "occurredOn"
    type: "Date"
  - name: "actor"
    type: "String"
  - name: "action"
    type: "AuditAction"
  - name: "subjectType"
    type: "String"
  - name: "subjectReference"
    type: "String"
  - name: "ipAddress"
    type: "String"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "repository"
    type: "AssetRepository"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "AssetVersion"
    multiplicity: "ManyToOne"
- name: "RetentionPolicy"
  description: "Rule that governs how long assets are retained and how they are handled\
    \ at end of life."
  data:
  - name: "name"
    type: "String"
  - name: "retentionPeriodDays"
    type: "Integer"
  - name: "legalHoldEnabled"
    type: "Boolean"
  - name: "deleteAction"
    type: "DeleteAction"
  relations:
  - name: "repository"
    type: "AssetRepository"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
- name: "PreservationPlan"
  description: "Strategy for long-term sustainability of digital assets, including\
    \ fixity and migration."
  data:
  - name: "name"
    type: "String"
  - name: "strategy"
    type: "PreservationStrategy"
  - name: "fixityCheckIntervalDays"
    type: "Integer"
  relations:
  - name: "repository"
    type: "AssetRepository"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "Asset"
    multiplicity: "ManyToMany"
- name: "ChecksumRecord"
  description: "Fixity verification outcome for stored binaries confirming file integrity."
  data:
  - name: "algorithm"
    type: "ChecksumAlgorithm"
  - name: "value"
    type: "Checksum"
  - name: "calculatedOn"
    type: "Date"
  - name: "isValid"
    type: "Boolean"
  relations:
  - name: "assetVersion"
    type: "AssetVersion"
    multiplicity: "ManyToOne"
  - name: "rendition"
    type: "Rendition"
    multiplicity: "ManyToOne"
- name: "Transcript"
  description: "Timed text artifact associated with an audio or video asset version."
  data:
  - name: "language"
    type: "LanguageTag"
  - name: "contentUri"
    type: "URI"
  - name: "transcriptType"
    type: "TranscriptType"
  - name: "confidence"
    type: "Decimal"
  relations:
  - name: "assetVersion"
    type: "AssetVersion"
    multiplicity: "ManyToOne"
- name: "AIExtraction"
  description: "Machine-generated enrichment providing labels, entities, or temporal\
    \ markers."
  data:
  - name: "extractionType"
    type: "AIExtractionType"
  - name: "status"
    type: "JobStatus"
  - name: "detailsUri"
    type: "URI"
  - name: "confidence"
    type: "Decimal"
  relations:
  - name: "asset"
    type: "Asset"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "AssetVersion"
    multiplicity: "ManyToOne"
- name: "SearchIndex"
  description: "Index configuration enabling fast discovery, filtering, and similarity\
    \ search."
  data:
  - name: "name"
    type: "String"
  - name: "indexType"
    type: "SearchIndexType"
  - name: "refreshIntervalSeconds"
    type: "Integer"
  relations:
  - name: "repository"
    type: "AssetRepository"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "Asset"
