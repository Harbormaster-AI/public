---
metadata:
  name: "HCIDL OCR Capabilities Model"
  description: "Canonical capability model for Optical Character Recognition including\
    \ ingestion, preprocessing, recognition, layout analysis, post-processing, evaluation,\
    \ and export."
  version: "1.0.0"
  industry: "Software"
  category: "Document & Content"
  type: "Capability"
  domain: "OCR"
entities:
- name: "Organization"
  description: "Legal entity that owns OCR assets, projects, and users."
  data:
  - name: "name"
    type: "String"
  - name: "domain"
    type: "String"
  - name: "primaryCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "users"
    type: "User"
    multiplicity: "OneToMany"
  - name: "projects"
    type: "OCRProject"
    multiplicity: "OneToMany"
  - name: "apiKeys"
    type: "APIKey"
    multiplicity: "OneToMany"
- name: "User"
  description: "Person who manages OCR workflows and assets."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "UserRole"
  - name: "timeZone"
    type: "String"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "apiKeys"
    type: "APIKey"
    multiplicity: "OneToMany"
  - name: "assignedProjects"
    type: "OCRProject"
    multiplicity: "ManyToMany"
- name: "APIKey"
  description: "Credential used to authenticate automated access to OCR services."
  data:
  - name: "keyName"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "status"
    type: "CredentialStatus"
  - name: "lastUsedAt"
    type: "DateTime"
  relations:
  - name: "owner"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
- name: "OCRProject"
  description: "Workspace grouping documents, pipelines, models, and runs."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "defaultLanguage"
    type: "LanguageTag"
  - name: "privacyLevel"
    type: "PrivacyLevel"
  - name: "retentionDays"
    type: "Integer"
  relations:
  - name: "organization"
    type: "Organization"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "ingestionBatches"
    type: "IngestionBatch"
    multiplicity: "OneToMany"
  - name: "pipelines"
    type: "PreprocessingPipeline"
    multiplicity: "OneToMany"
  - name: "ocrModels"
    type: "OCRModel"
    multiplicity: "ManyToMany"
  - name: "runs"
    type: "OCRRun"
    multiplicity: "OneToMany"
  - name: "groundTruthSets"
    type: "GroundTruthSet"
    multiplicity: "OneToMany"
  - name: "postProcessingRules"
    type: "PostProcessingRule"
    multiplicity: "OneToMany"
  - name: "exportPackages"
    type: "ExportPackage"
    multiplicity: "OneToMany"
  - name: "evaluationRuns"
    type: "EvaluationRun"
    multiplicity: "OneToMany"
  - name: "users"
    type: "User"
    multiplicity: "ManyToMany"
- name: "IngestionBatch"
  description: "Cohort of documents submitted together for processing."
  data:
  - name: "name"
    type: "String"
  - name: "submittedAt"
    type: "DateTime"
  - name: "sourceSystem"
    type: "String"
  - name: "status"
    type: "IngestionStatus"
  relations:
  - name: "project"
    type: "OCRProject"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "Document"
  description: "Logical document that contains one or more pages for OCR."
  data:
  - name: "title"
    type: "String"
  - name: "contentType"
    type: "MimeType"
  - name: "pageCount"
    type: "Integer"
  - name: "source"
    type: "DocumentSource"
  - name: "storageUri"
    type: "String"
  - name: "checksum"
    type: "String"
  relations:
  - name: "project"
    type: "OCRProject"
    multiplicity: "ManyToOne"
  - name: "ingestionBatch"
    type: "IngestionBatch"
    multiplicity: "ManyToOne"
  - name: "pages"
    type: "Page"
    multiplicity: "OneToMany"
- name: "Page"
  description: "Individual page image belonging to a document."
  data:
  - name: "pageNumber"
    type: "Integer"
  - name: "width"
    type: "Integer"
  - name: "height"
    type: "Integer"
  - name: "dpi"
    type: "Integer"
  - name: "rotation"
    type: "Rotation"
  - name: "colorMode"
    type: "ColorMode"
  relations:
  - name: "document"
    type: "Document"
    multiplicity: "ManyToOne"
  - name: "imageAsset"
    type: "ImageAsset"
    multiplicity: "OneToOne"
  - name: "ocrRuns"
    type: "OCRRun"
    multiplicity: "ManyToMany"
  - name: "layoutRegions"
    type: "LayoutRegion"
    multiplicity: "OneToMany"
  - name: "textBlocks"
    type: "TextBlock"
    multiplicity: "OneToMany"
- name: "ImageAsset"
  description: "Binary image representation associated with a page."
  data:
  - name: "uri"
    type: "String"
  - name: "format"
    type: "ImageFormat"
  - name: "byteSize"
    type: "Integer"
  - name: "checksum"
    type: "String"
  relations:
  - name: "page"
    type: "Page"
    multiplicity: "OneToOne"
- name: "PreprocessingPipeline"
  description: "Ordered configuration of image enhancement steps applied prior to\
    \ OCR."
  data:
  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "isDefault"
    type: "Boolean"
  relations:
  - name: "project"
    type: "OCRProject"
    multiplicity: "ManyToOne"
  - name: "steps"
    type: "PreprocessingStep"
    multiplicity: "OneToMany"
  - name: "ocrRuns"
    type: "OCRRun"
    multiplicity: "OneToMany"
- name: "PreprocessingStep"
  description: "Single operation within a preprocessing pipeline."
  data:
  - name: "stepType"
    type: "PreprocessStepType"
  - name: "parameters"
    type: "String"
  - name: "orderIndex"
    type: "Integer"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "pipeline"
    type: "PreprocessingPipeline"
    multiplicity: "ManyToOne"
- name: "OCRModel"
  description: "OCR engine or model configuration used to perform recognition."
  data:
  - name: "name"
    type: "String"
  - name: "vendor"
    type: "String"
  - name: "modelType"
    type: "OCRModelType"
  - name: "version"
    type: "String"
  - name: "supportsLayout"
    type: "Boolean"
  - name: "primaryLanguage"
    type: "LanguageTag"
  relations:
  - name: "projects"
    type: "OCRProject"
    multiplicity: "ManyToMany"
  - name: "runs"
    type: "OCRRun"
    multiplicity: "OneToMany"
  - name: "trainingDataSets"
    type: "GroundTruthSet"
    multiplicity: "ManyToMany"
- name: "GroundTruthSet"
  description: "Curated labeled examples used for training and evaluation."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "source"
    type: "GroundTruthSource"
  - name: "sampleCount"
    type: "Integer"
  relations:
  - name: "project"
    type: "OCRProject"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "ManyToMany"
  - name: "annotations"
    type: "Annotation"
    multiplicity: "OneToMany"
  - name: "models"
    type: "OCRModel"
    multiplicity: "ManyToMany"
- name: "Annotation"
  description: "Labeled region or transcription used as reference truth."
  data:
  - name: "annotationType"
    type: "AnnotationType"
  - name: "text"
    type: "String"
  - name: "boundingBox"
    type: "BoundingBox"
  - name: "pageNumber"
    type: "Integer"
  relations:
  - name: "groundTruthSet"
    type: "GroundTruthSet"
    multiplicity: "ManyToOne"
  - name: "document"
    type: "Document"
    multiplicity: "ManyToOne"
  - name: "page"
    type: "Page"
    multiplicity: "ManyToOne"
- name: "OCRRun"
  description: "Executed recognition job over a document or page range."
  data:
  - name: "startedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  - name: "status"
    type: "RunStatus"
  - name: "processingScope"
    type: "ProcessingScope"
  - name: "pageFrom"
    type: "Integer"
  - name: "pageTo"
    type: "Integer"
  - name: "averageConfidence"
    type: "Decimal"
  - name: "notes"
    type: "String"
  relations:
  - name: "project"
    type: "OCRProject"
    multiplicity: "ManyToOne"
  - name: "document"
    type: "Document"
    multiplicity: "ManyToOne"
  - name: "pages"
    type: "Page"
    multiplicity: "ManyToMany"
  - name: "model"
    type: "OCRModel"
    multiplicity: "ManyToOne"
  - name: "pipeline"
    type: "PreprocessingPipeline"
    multiplicity: "ManyToOne"
  - name: "textBlocks"
    type: "TextBlock"
    multiplicity: "OneToMany"
  - name: "layoutRegions"
    type: "LayoutRegion"
    multiplicity: "OneToMany"
- name: "TextBlock"
  description: "Contiguous paragraph-level text content recognized on a page."
  data:
  - name: "text"
    type: "String"
  - name: "boundingBox"
    type: "BoundingBox"
  - name: "confidence"
    type: "Decimal"
  - name: "readingOrder"
    type: "Integer"
  - name: "language"
    type: "LanguageTag"
  relations:
  - name: "page"
    type: "Page"
    multiplicity: "ManyToOne"
  - name: "ocrRun"
    type: "OCRRun"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "Line"
    multiplicity: "OneToMany"
- name: "Line"
  description: "Single line of text within a text block."
  data:
  - name: "text"
    type: "String"
  - name: "boundingBox"
    type: "BoundingBox"
  - name: "confidence"
    type: "Decimal"
  - name: "orderInBlock"
    type: "Integer"
  - name: "language"
    type: "LanguageTag"
  relations:
  - name: "textBlock"
    type: "TextBlock"
    multiplicity: "ManyToOne"
  - name: "words"
    type: "Word"
    multiplicity: "OneToMany"
  - name: "page"
    type: "Page"
    multiplicity: "ManyToOne"
  - name: "ocrRun"
    type: "OCRRun"
    multiplicity: "ManyToOne"
- name: "Word"
  description: "Recognized token with position and confidence."
  data:
  - name: "text"
    type: "String"
  - name: "boundingBox"
    type: "BoundingBox"
  - name: "confidence"
    type: "Decimal"
  - name: "normalizedText"
    type: "String"
  - name: "language"
    type: "LanguageTag"
  relations:
  - name: "line"
    type: "Line"
    multiplicity: "ManyToOne"
  - name: "ocrRun"
    type: "OCRRun"
    multiplicity: "ManyToOne"
  - name: "page"
    type: "Page"
    multiplicity: "ManyToOne"
- name: "LayoutRegion"
  description: "Detected structural region on a page such as table, figure, or header."
  data:
  - name: "regionType"
    type: "LayoutRegionType"
  - name: "boundingBox"
    type: "BoundingBox"
  - name: "readingOrder"
    type: "Integer"
  relations:
  - name: "page"
    type: "Page"
    multiplicity: "ManyToOne"
  - name: "ocrRun"
    type: "OCRRun"
    multiplicity: "ManyToOne"
  - name: "tableExtraction"
    type: "TableExtraction"
    multiplicity: "OneToOne"
- name: "TableExtraction"
  description: "Parsed representation of a detected table."
  data:
  - name: "rowCount"
    type: "Integer"
  - name: "columnCount"
    type: "Integer"
  - name: "detectionConfidence"
    type: "Decimal"
  relations:
  - name: "layoutRegion"
    type: "LayoutRegion"
    multiplicity: "OneToOne"
  - name: "cells"
    type: "TableCell"
    multiplicity: "OneToMany"
- name: "TableCell"
  description: "Individual cell within an extracted table."
  data:
  - name: "rowIndex"
    type: "Integer"
  - name: "columnIndex"
    type: "Integer"
  - name: "text"
    type: "String"
  - name: "boundingBox"
    type: "BoundingBox"
  - name: "confidence"
    type: "Decimal"
  relations:
  - name: "tableExtraction"
    type: "TableExtraction"
    multiplicity: "ManyToOne"
- name: "PostProcessingRule"
  description: "Normalization or validation rule applied to recognized text."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "PostProcessRuleType"
  - name: "pattern"
    type: "String"
  - name: "replacement"
    type: "String"
  - name: "priority"
    type: "Integer"
  - name: "isActive"
    type: "Boolean"
  - name: "appliesTo"
    type: "AppliesToType"
  relations:
  - name: "project"
    type: "OCRProject"
    multiplicity: "ManyToOne"
- name: "ExportPackage"
  description: "Packaged outputs from an OCR run for downstream consumption."
  data:
  - name: "format"
    type: "ExportFormat"
  - name: "createdAt"
    type: "DateTime"
  - name: "fileUri"
    type: "String"
  - name: "includedAnnotations"
    type: "Boolean"
  relations:
  - name: "project"
    type: "OCRProject"
    multiplicity: "ManyToOne"
  - name: "ocrRun"
    type: "OCRRun"
    multiplicity: "ManyToOne"
  - name: "document"
    type: "Document"
    multiplicity: "ManyToOne"
- name: "EvaluationRun"
  description: "Assessment of OCR model performance against a ground truth set."
  data:
  - name: "executedAt"
    type: "DateTime"
  - name: "characterAccuracy"
    type: "Decimal"
  - name: "wordAccuracy"
    type: "Decimal"
  - name: "cer"
    type: "Decimal"
  - name: "wer"
    type: "Decimal"
  - name: "status"
    type: "EvaluationStatus"
  relations:
  - name: "project"
    type: "OCRProject"
    multiplicity: "ManyToOne"
  - name: "model"
    type: "OCRModel"
    multiplicity: "ManyToOne"
  - name: "groundTruthSet"
    type: "GroundTruthSet"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "ManyToMany"
  - name: "confidenceProfile"
    type: "ConfidenceProfile"
    multiplicity: "OneToOne"
- name: "ConfidenceProfile"
  description: "Calibration summary mapping confidence scores to observed accuracy."
  data:
  - name: "bucketsJson"
    type: "String"
  - name: "method"
    type: "CalibrationMethod"
  relations:
  - name: "evaluationRun"
    type: "EvaluationRun"
    multiplicity: "OneToOne"
enums:
- name: "UserRole"
  description: "Access level governing actions a user may perform."
  data:
  - name: "Admin"
  - name: "Manager"
  - name: "Operator_"
  - name: "Viewer"
- name: "CredentialStatus"
  description: "Lifecycle state of an API key."
  data:
  - name: "Active"
  - name: "Revoked"
  - name: "Expired"
- name: "PrivacyLevel"
  description: "Visibility of project assets and results."
  data:
  - name: "Private"
  - name: "Team"
  - name: "Organization"
- name: "DocumentSource"
  description: "Origin of the document content."
  data:
  - name: "Upload"
  - name: "Email"
  - name: "Scanner"
  - name: "API"
  - name: "ArchiveImport"
- name: "Rotation"
  description: "Page orientation relative to upright."
  data:
  - name: "None"
  - name: "Rotate90"
  - name: "Rotate180"
  - name: "Rotate270"
- name: "ColorMode"
  description: "Color characteristics of the page image."
  data:
  - name: "Color"
  - name: "Grayscale"
  - name: "Binary"
- name: "ImageFormat"
  description: "File format of the stored image asset."
  data:
  - name: "PNG"
  - name: "JPEG"
  - name: "TIFF"
  - name: "BMP"
  - name: "PDF"
- name: "IngestionStatus"
  description: "Processing state of an ingestion batch."
  data:
  - name: "Draft"
  - name: "Received"
  - name: "Processing"
  - name: "Completed"
  - name: "Failed"
- name: "PreprocessStepType"
  description: "Type of preprocessing operation applied to images."
  data:
  - name: "Binarization"
  - name: "Deskew"
  - name: "Denoise"
  - name: "Deblur"
  - name: "Deshadow"
  - name: "Contrast"
  - name: "Resize"
  - name: "Crop"
  - name: "Rotate"
  - name: "Sharpen"
- name: "OCRModelType"
  description: "Approach or family of the OCR engine."
  data:
  - name: "RuleBased"
  - name: "Statistical"
  - name: "Neural"
  - name: "CloudService"
- name: "GroundTruthSource"
  description: "Method by which ground truth labels were obtained."
  data:
  - name: "ManualTranscription"
  - name: "ImportedDataset"
  - name: "Synthetic"
- name: "AnnotationType"
  description: "Nature of the labeled element within ground truth."
  data:
  - name: "TextRegion"
  - name: "Line"
  - name: "Word"
  - name: "Table"
  - name: "Figure"
  - name: "Header"
  - name: "Footer"
  - name: "Signature"
  - name: "Stamp"
  - name: "Handwriting"
- name: "RunStatus"
  description: "Execution state of an OCR run."
  data:
  - name: "Pending"
  - name: "Running"
  - name: "Completed"
  - name: "Failed"
  - name: "Cancelled"
- name: "ProcessingScope"
  description: "Granularity of the requested OCR operation."
  data:
  - name: "Document"
  - name: "PageRange"
  - name: "SinglePage"
- name: "LayoutRegionType"
  description: "Semantic classification of a detected page region."
  data:
  - name: "Paragraph"
  - name: "Table"
  - name: "Figure"
  - name: "Header"
  - name: "Footer"
  - name: "List"
  - name: "FormField"
  - name: "Barcode"
- name: "PostProcessRuleType"
  description: "Mechanism used to transform or validate text output."
  data:
  - name: "RegexReplace"
  - name: "DictionaryNormalize"
  - name: "CaseTransform"
  - name: "WhitespaceNormalize"
  - name: "Validation"
- name: "AppliesToType"
  description: "Target artifact category for a post-processing rule."
  data:
  - name: "Word"
  - name: "Line"
  - name: "Block"
  - name: "TableCell"
  - name: "Metadata"
- name: "ExportFormat"
  description: "Packaging format for delivering OCR results."
  data:
  - name: "ALTO"
  - name: "HOCR"
  - name: "PAGEXML"
  - name: "JSON"
  - name: "CSV"
  - name: "PlainText"
  - name: "PDF"
  - name: "DOCX"
- name: "EvaluationStatus"
  description: "State of an evaluation run."
  data:
  - name: "Planned"
  - name: "Running"
  - name: "Completed"
  - name: "Failed"
- name: "CalibrationMethod"
  description: "Technique used to derive confidence calibration."
  data:
  - name: "ReliabilityDiagram"
  - name: "IsotonicRegression"
  - name: "PlattScaling"
  - name: "Histogram"
valueObjects:
- name: "BoundingBox"
  description: "Axis-aligned rectangle expressed in page coordinate space."
  data:
  - name: "x"
    type: "Decimal"
  - name: "y"
    type: "Decimal"
  - name: "width"
    type: "Decimal"
  - name: "height"
    type: "Decimal"
- name: "LanguageTag"
  description: "BCP 47 language tag indicating the language of text."
  data:
  - name: "value"
    type: "String"
- name: "MimeType"
  description: "Internet media type describing the content format."
  data:
  - name: "value"
    type: "String"
