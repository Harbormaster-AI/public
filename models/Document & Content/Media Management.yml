---
metadata:
  name: "Media Management Capabilities Model"
  description: "HCIDL capabilities model describing core concepts, structures, and\
    \ relationships for managing media assets across their lifecycle, including ingest,\
    \ curation, transformation, rights, and distribution."
  version: "1.0.0"
  industry: "Media & Entertainment"
  category: "Document & Content"
  type: "Capability"
  domain: "Media Management"
entities:
- name: "MediaLibrary"
  description: "Logical container that organizes media assets, schemas, workflows,\
    \ and access policies."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "visibility"
    type: "Visibility"
  - name: "defaultLicenseType"
    type: "LicenseType"
  - name: "storageRegion"
    type: "String"
  - name: "retentionPolicy"
    type: "RetentionPolicy"
  - name: "createdDate"
    type: "Date"
  relations:
  - name: "ownerGroup"
    type: "UserGroup"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "MediaAsset"
    multiplicity: "OneToMany"
  - name: "collections"
    type: "Collection"
    multiplicity: "OneToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "storageLocations"
    type: "StorageLocation"
    multiplicity: "ManyToMany"
  - name: "workflows"
    type: "Workflow"
    multiplicity: "OneToMany"
  - name: "metadataSchemas"
    type: "MetadataSchema"
    multiplicity: "OneToMany"
- name: "MediaAsset"
  description: "Primary digital asset such as video, image, or audio file with associated\
    \ metadata and lifecycle state."
  data:
  - name: "filename"
    type: "String"
  - name: "title"
    type: "String"
  - name: "description"
    type: "String"
  - name: "mediaType"
    type: "MediaType"
  - name: "format"
    type: "String"
  - name: "duration"
    type: "Duration"
  - name: "fileSize"
    type: "FileSize"
  - name: "language"
    type: "LanguageCode"
  - name: "checksum"
    type: "Checksum"
  - name: "captureDate"
    type: "Date"
  - name: "status"
    type: "AssetStatus"
  - name: "colorSpace"
    type: "String"
  - name: "frameRate"
    type: "Decimal"
  - name: "aspectRatio"
    type: "String"
  relations:
  - name: "library"
    type: "MediaLibrary"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "MediaVersion"
    multiplicity: "OneToMany"
  - name: "renditions"
    type: "MediaRendition"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "rightsPolicy"
    type: "RightsPolicy"
    multiplicity: "ManyToOne"
  - name: "captionTracks"
    type: "CaptionTrack"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "annotations"
    type: "Annotation"
    multiplicity: "OneToMany"
  - name: "campaignLinks"
    type: "Campaign"
    multiplicity: "ManyToMany"
  - name: "playlistItems"
    type: "PlaylistItem"
    multiplicity: "OneToMany"
  - name: "deliveries"
    type: "Delivery"
    multiplicity: "OneToMany"
  - name: "storageLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
- name: "MediaVersion"
  description: "Immutable snapshot of a media asset that records editorial changes\
    \ and approvals over time."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "changeNote"
    type: "String"
  - name: "createdDate"
    type: "Date"
  relations:
  - name: "asset"
    type: "MediaAsset"
    multiplicity: "ManyToOne"
  - name: "createdBy"
    type: "Contributor"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "captionTracks"
    type: "CaptionTrack"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "MediaRendition"
  description: "Derived variant of a media asset optimized for specific distribution\
    \ channels or devices."
  data:
  - name: "name"
    type: "String"
  - name: "container"
    type: "String"
  - name: "codec"
    type: "String"
  - name: "resolution"
    type: "Resolution"
  - name: "bitrate"
    type: "Integer"
  - name: "fileSize"
    type: "FileSize"
  - name: "url"
    type: "Url"
  - name: "checksum"
    type: "Checksum"
  relations:
  - name: "asset"
    type: "MediaAsset"
    multiplicity: "ManyToOne"
  - name: "generatedBy"
    type: "TranscodeJob"
    multiplicity: "ManyToOne"
  - name: "profile"
    type: "TranscodeProfile"
    multiplicity: "ManyToOne"
  - name: "storageLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "captionTracks"
    type: "CaptionTrack"
    multiplicity: "ManyToMany"
  - name: "deliveries"
    type: "Delivery"
    multiplicity: "ManyToMany"
  - name: "playlistItems"
    type: "PlaylistItem"
    multiplicity: "OneToMany"
- name: "Collection"
  description: "Curated grouping of media assets used for editorial, thematic, or\
    \ campaign purposes."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "collectionType"
    type: "CollectionType"
  - name: "publishedStatus"
    type: "PublishingStatus"
  relations:
  - name: "library"
    type: "MediaLibrary"
    multiplicity: "ManyToOne"
  - name: "assets"
    type: "MediaAsset"
    multiplicity: "ManyToMany"
  - name: "owner"
    type: "Contributor"
    multiplicity: "ManyToOne"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
- name: "Tag"
  description: "Descriptive label used to classify and discover media assets."
  data:
  - name: "name"
    type: "String"
  - name: "category"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "assets"
    type: "MediaAsset"
    multiplicity: "ManyToMany"
  - name: "library"
    type: "MediaLibrary"
    multiplicity: "ManyToOne"
- name: "StorageLocation"
  description: "Physical or cloud-backed storage endpoint where assets and renditions\
    \ are persisted."
  data:
  - name: "name"
    type: "String"
  - name: "provider"
    type: "StorageProvider"
  - name: "bucket"
    type: "String"
  - name: "region"
    type: "String"
  - name: "pathPrefix"
    type: "String"
  - name: "storageClass"
    type: "String"
  - name: "encrypted"
    type: "Boolean"
  relations:
  - name: "libraries"
    type: "MediaLibrary"
    multiplicity: "ManyToMany"
  - name: "assets"
    type: "MediaAsset"
    multiplicity: "OneToMany"
  - name: "renditions"
    type: "MediaRendition"
    multiplicity: "OneToMany"
  - name: "archiveJobs"
    type: "ArchiveJob"
    multiplicity: "OneToMany"
- name: "TranscodeProfile"
  description: "Preset defining encoding parameters for generating renditions."
  data:
  - name: "profileName"
    type: "String"
  - name: "targetMediaType"
    type: "MediaType"
  - name: "container"
    type: "String"
  - name: "codec"
    type: "String"
  - name: "resolution"
    type: "Resolution"
  - name: "bitrate"
    type: "Integer"
  - name: "audioChannels"
    type: "Integer"
  - name: "sampleRate"
    type: "Integer"
  relations:
  - name: "renditions"
    type: "MediaRendition"
    multiplicity: "OneToMany"
  - name: "jobs"
    type: "TranscodeJob"
    multiplicity: "OneToMany"
- name: "TranscodeJob"
  description: "Processing task that converts a source asset into one or more renditions."
  data:
  - name: "jobNumber"
    type: "String"
  - name: "status"
    type: "JobStatus"
  - name: "submittedAt"
    type: "Date"
  - name: "startedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  - name: "priority"
    type: "Integer"
  relations:
  - name: "asset"
    type: "MediaAsset"
    multiplicity: "ManyToOne"
  - name: "profile"
    type: "TranscodeProfile"
    multiplicity: "ManyToOne"
  - name: "rendition"
    type: "MediaRendition"
    multiplicity: "OneToOne"
  - name: "submittedBy"
    type: "Contributor"
    multiplicity: "ManyToOne"
  - name: "storageLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "PublicationChannel"
  description: "Distribution destination through which media is published or syndicated."
  data:
  - name: "name"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "endpoint"
    type: "Url"
  - name: "description"
    type: "String"
  relations:
  - name: "deliveries"
    type: "Delivery"
    multiplicity: "OneToMany"
  - name: "libraries"
    type: "MediaLibrary"
    multiplicity: "ManyToMany"
  - name: "campaigns"
    type: "Campaign"
    multiplicity: "ManyToMany"
- name: "Delivery"
  description: "Event capturing the publication of an asset or rendition to a channel\
    \ with constraints."
  data:
  - name: "deliveryNumber"
    type: "String"
  - name: "status"
    type: "DeliveryStatus"
  - name: "publishDate"
    type: "Date"
  - name: "expiryDate"
    type: "Date"
  - name: "captionIncluded"
    type: "Boolean"
  - name: "geographicScope"
    type: "GeographicScope"
  relations:
  - name: "asset"
    type: "MediaAsset"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "PublicationChannel"
    multiplicity: "ManyToOne"
  - name: "renditions"
    type: "MediaRendition"
    multiplicity: "ManyToMany"
  - name: "policy"
    type: "RightsPolicy"
    multiplicity: "ManyToOne"
  - name: "campaign"
    type: "Campaign"
    multiplicity: "ManyToOne"
- name: "RightsPolicy"
  description: "Policy specifying licensing, usage, territorial, and temporal constraints\
    \ for assets."
  data:
  - name: "licenseType"
    type: "LicenseType"
  - name: "usageRestriction"
    type: "UsageRestriction"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "geographicScope"
    type: "GeographicScope"
  - name: "exclusivity"
    type: "Boolean"
  - name: "attributionRequired"
    type: "Boolean"
  relations:
  - name: "assets"
    type: "MediaAsset"
    multiplicity: "OneToMany"
  - name: "agreements"
    type: "LicenseAgreement"
    multiplicity: "OneToMany"
  - name: "parties"
    type: "Party"
    multiplicity: "ManyToMany"
- name: "LicenseAgreement"
  description: "Legal instrument governing the grant of rights and obligations for\
    \ media usage."
  data:
  - name: "agreementNumber"
    type: "String"
  - name: "licenseType"
    type: "LicenseType"
  - name: "fee"
    type: "Money"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "assets"
    type: "MediaAsset"
    multiplicity: "ManyToMany"
  - name: "policy"
    type: "RightsPolicy"
    multiplicity: "ManyToOne"
  - name: "licensor"
    type: "Party"
    multiplicity: "ManyToOne"
  - name: "licensee"
    type: "Party"
    multiplicity: "ManyToOne"
- name: "Party"
  description: "Legal person or organization entering into agreements or holding rights."
  data:
  - name: "name"
    type: "String"
  - name: "partyType"
    type: "PartyType"
  - name: "contactEmail"
    type: "String"
  - name: "website"
    type: "Url"
  relations:
  - name: "agreements"
    type: "LicenseAgreement"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "RightsPolicy"
    multiplicity: "ManyToMany"
- name: "AccessPolicy"
  description: "Authorization rule granting specific levels of access to libraries,\
    \ collections, or assets."
  data:
  - name: "name"
    type: "String"
  - name: "scope"
    type: "AccessScope"
  - name: "accessLevel"
    type: "AccessLevel"
  - name: "expiresAt"
    type: "Date"
  relations:
  - name: "library"
    type: "MediaLibrary"
    multiplicity: "ManyToOne"
  - name: "collection"
    type: "Collection"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "MediaAsset"
    multiplicity: "ManyToOne"
  - name: "group"
    type: "UserGroup"
    multiplicity: "ManyToOne"
  - name: "contributor"
    type: "Contributor"
    multiplicity: "ManyToOne"
- name: "UserGroup"
  description: "Collaborative group used for organizing contributors and assigning\
    \ permissions or workflow roles."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "members"
    type: "Contributor"
    multiplicity: "OneToMany"
  - name: "libraries"
    type: "MediaLibrary"
    multiplicity: "ManyToMany"
  - name: "workflows"
    type: "Workflow"
    multiplicity: "OneToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
- name: "Contributor"
  description: "Individual user who creates, edits, reviews, or manages media and\
    \ metadata."
  data:
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "ContributorRole"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "groups"
    type: "UserGroup"
    multiplicity: "ManyToMany"
  - name: "createdVersions"
    type: "MediaVersion"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "Task"
    multiplicity: "OneToMany"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "Workflow"
  description: "Structured sequence of steps orchestrating editorial, compliance,\
    \ or localization activities."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "workflowType"
    type: "WorkflowType"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "steps"
    type: "WorkflowStep"
    multiplicity: "OneToMany"
  - name: "library"
    type: "MediaLibrary"
    multiplicity: "ManyToOne"
  - name: "group"
    type: "UserGroup"
    multiplicity: "ManyToOne"
- name: "WorkflowStep"
  description: "Discrete action or gate within a workflow, optionally time-bound and\
    \ group-assigned."
  data:
  - name: "name"
    type: "String"
  - name: "stepType"
    type: "StepType"
  - name: "order"
    type: "Integer"
  - name: "dueDays"
    type: "Integer"
  relations:
  - name: "workflow"
    type: "Workflow"
    multiplicity: "ManyToOne"
  - name: "assignedGroup"
    type: "UserGroup"
    multiplicity: "ManyToOne"
  - name: "approvals"
    type: "Approval"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "Task"
    multiplicity: "OneToMany"
- name: "Approval"
  description: "Decision record documenting review outcomes for assets or versions."
  data:
  - name: "approvalStatus"
    type: "ApprovalStatus"
  - name: "comment"
    type: "String"
  - name: "decisionDate"
    type: "Date"
  relations:
  - name: "step"
    type: "WorkflowStep"
    multiplicity: "ManyToOne"
  - name: "approver"
    type: "Contributor"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "MediaVersion"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "MediaAsset"
    multiplicity: "ManyToOne"
- name: "Task"
  description: "Unit of work assigned to a contributor within a workflow step."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "TaskStatus_"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "step"
    type: "WorkflowStep"
    multiplicity: "ManyToOne"
  - name: "assignee"
    type: "Contributor"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "MediaAsset"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "MediaVersion"
    multiplicity: "ManyToOne"
- name: "CaptionTrack"
  description: "Time-aligned text track providing subtitles or captions for accessibility\
    \ and localization."
  data:
  - name: "language"
    type: "LanguageCode"
  - name: "format"
    type: "String"
  - name: "isForced"
    type: "Boolean"
  relations:
  - name: "asset"
    type: "MediaAsset"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "MediaVersion"
    multiplicity: "ManyToOne"
  - name: "renditions"
    type: "MediaRendition"
    multiplicity: "ManyToMany"
- name: "MetadataSchema"
  description: "Configurable schema defining custom metadata fields for specific entity\
    \ targets."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "targetEntity"
    type: "TargetEntityType"
  - name: "version"
    type: "String"
  relations:
  - name: "fields"
    type: "MetadataField"
    multiplicity: "OneToMany"
  - name: "library"
    type: "MediaLibrary"
    multiplicity: "ManyToOne"
- name: "MetadataField"
  description: "Individual metadata definition including type, cardinality, and optional\
    \ enumeration reference."
  data:
  - name: "fieldName"
    type: "String"
  - name: "dataType"
    type: "MetadataDataType"
  - name: "required"
    type: "Boolean"
  - name: "multivalued"
    type: "Boolean"
  relations:
  - name: "schema"
    type: "MetadataSchema"
    multiplicity: "ManyToOne"
  - name: "enumeration"
    type: "EnumDefinition"
    multiplicity: "ManyToOne"
- name: "EnumDefinition"
  description: "User-defined controlled vocabulary that can be referenced by metadata\
    \ fields."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "values"
    type: "EnumValue"
    multiplicity: "OneToMany"
  - name: "fields"
    type: "MetadataField"
    multiplicity: "ManyToMany"
- name: "EnumValue"
  description: "Member of a user-defined enumeration with label and activation state."
  data:
  - name: "value"
    type: "String"
  - name: "label"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "enumDefinition"
    type: "EnumDefinition"
    multiplicity: "ManyToOne"
- name: "AuditEvent"
  description: "Immutable record of significant actions performed on media entities\
    \ for traceability."
  data:
  - name: "action"
    type: "AuditAction"
  - name: "actorType"
    type: "ActorType"
  - name: "actorName"
    type: "String"
  - name: "eventDate"
    type: "Date"
  - name: "context"
    type: "String"
  relations:
  - name: "asset"
    type: "MediaAsset"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "MediaVersion"
    multiplicity: "ManyToOne"
  - name: "library"
    type: "MediaLibrary"
    multiplicity: "ManyToOne"
  - name: "rendition"
    type: "MediaRendition"
    multiplicity: "ManyToOne"
  - name: "job"
    type: "TranscodeJob"
    multiplicity: "ManyToOne"
- name: "Campaign"
  description: "Coordinated initiative that groups assets and channels to achieve\
    \ distribution objectives."
  data:
  - name: "name"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "objective"
    type: "String"
  relations:
  - name: "deliveries"
    type: "Delivery"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "MediaAsset"
    multiplicity: "ManyToMany"
  - name: "channels"
    type: "PublicationChannel"
    multiplicity: "ManyToMany"
- name: "Playlist"
  description: "Ordered sequence of assets used for programming, preview, or embedded\
    \ playback."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "ordering"
    type: "PlaylistOrdering"
  - name: "loopEnabled"
    type: "Boolean"
  relations:
  - name: "items"
    type: "PlaylistItem"
    multiplicity: "OneToMany"
  - name: "library"
    type: "MediaLibrary"
    multiplicity: "ManyToOne"
  - name: "owner"
    type: "Contributor"
    multiplicity: "ManyToOne"
- name: "PlaylistItem"
  description: "Positioned reference to an asset or rendition within a playlist."
  data:
  - name: "position"
    type: "Integer"
  - name: "titleOverride"
    type: "String"
  - name: "startTimecode"
    type: "Timecode"
  - name: "endTimecode"
    type: "Timecode"
  relations:
  - name: "playlist"
    type: "Playlist"
    multiplicity: "ManyToOne"
  - name: "asset"
    type: "MediaAsset"
    multiplicity: "ManyToOne"
  - name: "rendition"
    type: "MediaRendition"
    multiplicity: "ManyToOne"
- name: "Annotation"
  description: "Time-based or spatial note attached to an asset or version for review\
    \ and collaboration."
  data:
  - name: "annotationType"
    type: "AnnotationType"
  - name: "text"
    type: "String"
  - name: "start"
    type: "Timecode"
  - name: "end"
    type: "Timecode"
  relations:
  - name: "asset"
    type: "MediaAsset"
    multiplicity: "ManyToOne"
  - name: "version"
    type: "MediaVersion"
    multiplicity: "ManyToOne"
  - name: "author"
    type: "Contributor"
    multiplicity: "ManyToOne"
- name: "IngestJob"
  description: "Process that imports external media into a library with validation\
    \ and normalization."
  data:
  - name: "jobNumber"
    type: "String"
  - name: "status"
    type: "IngestStatus"
  - name: "source"
    type: "Url"
  - name: "startedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  - name: "errorCount"
    type: "Integer"
  relations:
  - name: "asset"
    type: "MediaAsset"
    multiplicity: "ManyToOne"
  - name: "library"
    type: "MediaLibrary"
    multiplicity: "ManyToOne"
  - name: "submittedBy"
    type: "Contributor"
    multiplicity: "ManyToOne"
  - name: "auditEvents"
    type: "AuditEvent"
    multiplicity: "OneToMany"
- name: "ArchiveJob"
  description: "Operation that transitions assets between storage tiers for cost optimization\
    \ and retention."
  data:
  - name: "jobNumber"
    type: "String"
  - name: "status"
