---
metadata:
  name: "Forecasting Capabilities Model (HCIDL)"
  description: "A domain model describing capabilities required to design, train,\
    \ validate, deploy, and operate statistical and machine learning forecasting across\
    \ time series and hierarchical structures."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Analytics & AI"
  type: "Capability"
  domain: "Forecasting"
entities:
- name: "ForecastProgram"
  description: "Organizational context for forecasting initiatives, defining strategy,\
    \ defaults, and owned assets."
  data:
  - name: "name"
    type: "String"
  - name: "objective"
    type: "String"
  - name: "owner"
    type: "String"
  - name: "defaultGranularity"
    type: "TimeGranularity"
  - name: "defaultHorizon"
    type: "Horizon"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "OneToMany"
  - name: "hierarchies"
    type: "ForecastHierarchy"
    multiplicity: "OneToMany"
  - name: "models"
    type: "ForecastModel"
    multiplicity: "OneToMany"
  - name: "scenarios"
    type: "Scenario"
    multiplicity: "OneToMany"
- name: "DataSource"
  description: "Logical connection to an external system or storage from which time\
    \ series data and features are ingested."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "DataSourceType"
  - name: "connection"
    type: "URI"
  - name: "isReadOnly"
    type: "Boolean"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "OneToMany"
- name: "Dataset"
  description: "Curated collection of time-indexed observations, targets, and exogenous\
    \ features at a defined granularity."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "granularity"
    type: "TimeGranularity"
  - name: "targetField"
    type: "String"
  - name: "timeIndexField"
    type: "String"
  - name: "timezone"
    type: "String"
  - name: "seasonality"
    type: "SeasonalityType"
  relations:
  - name: "dataSource"
    type: "DataSource"
    multiplicity: "ManyToOne"
  - name: "program"
    type: "ForecastProgram"
    multiplicity: "ManyToOne"
  - name: "features"
    type: "Feature"
    multiplicity: "OneToMany"
  - name: "eventCalendars"
    type: "EventCalendar"
    multiplicity: "ManyToMany"
  - name: "transformationPipelines"
    type: "TransformationPipeline"
    multiplicity: "OneToMany"
  - name: "series"
    type: "ForecastSeries"
    multiplicity: "OneToMany"
- name: "Feature"
  description: "Input variable available within a dataset and used for forecasting\
    \ or analysis."
  data:
  - name: "name"
    type: "String"
  - name: "role"
    type: "FeatureRole"
  - name: "fieldType"
    type: "FieldType"
  - name: "isNullable"
    type: "Boolean"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
- name: "EventCalendar"
  description: "Collection of dated events that can influence demand, supply, or other\
    \ forecasted signals."
  data:
  - name: "name"
    type: "String"
  - name: "calendarType"
    type: "CalendarType"
  - name: "timezone"
    type: "String"
  relations:
  - name: "events"
    type: "CalendarEvent"
    multiplicity: "OneToMany"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
- name: "CalendarEvent"
  description: "Time-bound exogenous occurrence such as a promotion, holiday, or weather\
    \ event."
  data:
  - name: "name"
    type: "String"
  - name: "eventType"
    type: "EventType"
  - name: "window"
    type: "TimeWindow"
  - name: "expectedImpact"
    type: "Decimal"
  relations:
  - name: "calendar"
    type: "EventCalendar"
    multiplicity: "ManyToOne"
- name: "ForecastHierarchy"
  description: "Multilevel aggregation structure used to organize time series and\
    \ reconcile forecasts."
  data:
  - name: "name"
    type: "String"
  - name: "reconciliationMethod"
    type: "ReconciliationMethod"
  - name: "description"
    type: "String"
  relations:
  - name: "program"
    type: "ForecastProgram"
    multiplicity: "ManyToOne"
  - name: "nodes"
    type: "HierarchyNode"
    multiplicity: "OneToMany"
- name: "HierarchyNode"
  description: "A single element within a forecasting hierarchy, representing a level\
    \ and membership path."
  data:
  - name: "name"
    type: "String"
  - name: "levelName"
    type: "String"
  - name: "path"
    type: "String"
  relations:
  - name: "hierarchy"
    type: "ForecastHierarchy"
    multiplicity: "ManyToOne"
  - name: "parent"
    type: "HierarchyNode"
    multiplicity: "ManyToOne"
  - name: "children"
    type: "HierarchyNode"
    multiplicity: "OneToMany"
  - name: "series"
    type: "ForecastSeries"
    multiplicity: "OneToMany"
- name: "ForecastSeries"
  description: "Identifiable time series within a dataset and hierarchy node, serving\
    \ as a forecast target."
  data:
  - name: "key"
    type: "String"
  - name: "aggregationMethod"
    type: "AggregationFunction"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "hierarchyNode"
    type: "HierarchyNode"
    multiplicity: "ManyToOne"
  - name: "forecastItems"
    type: "ForecastItem"
    multiplicity: "OneToMany"
- name: "TransformationPipeline"
  description: "Ordered set of preprocessing and feature engineering steps applied\
    \ to data prior to modeling."
  data:
  - name: "name"
    type: "String"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "steps"
    type: "TransformationStep"
    multiplicity: "OneToMany"
  - name: "models"
    type: "ForecastModel"
    multiplicity: "ManyToMany"
- name: "TransformationStep"
  description: "A single transformation executed within a pipeline with configured\
    \ parameters."
  data:
  - name: "name"
    type: "String"
  - name: "order"
    type: "Integer"
  - name: "transformationType"
    type: "TransformationType"
  - name: "parameters"
    type: "String"
  relations:
  - name: "pipeline"
    type: "TransformationPipeline"
    multiplicity: "ManyToOne"
- name: "ForecastModel"
  description: "Conceptual forecasting approach and algorithm family maintained under\
    \ lifecycle control."
  data:
  - name: "name"
    type: "String"
  - name: "modelType"
    type: "ModelType"
  - name: "status"
    type: "ModelStatus"
  relations:
  - name: "program"
    type: "ForecastProgram"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "ModelVersion"
    multiplicity: "OneToMany"
  - name: "transformationPipelines"
    type: "TransformationPipeline"
    multiplicity: "ManyToMany"
- name: "ModelVersion"
  description: "Immutable snapshot of a model’s configuration, code, and training\
    \ artifacts."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "createdOn"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "model"
    type: "ForecastModel"
    multiplicity: "ManyToOne"
  - name: "trainingRuns"
    type: "TrainingRun"
    multiplicity: "OneToMany"
  - name: "backtests"
    type: "Backtest"
    multiplicity: "OneToMany"
  - name: "deployments"
    type: "DeploymentEndpoint"
    multiplicity: "OneToMany"
  - name: "forecastJobs"
    type: "ForecastJob"
    multiplicity: "OneToMany"
- name: "TrainingRun"
  description: "Execution record of model training with a specific data split and\
    \ hyperparameters."
  data:
  - name: "name"
    type: "String"
  - name: "startedAt"
    type: "Date"
  - name: "endedAt"
    type: "Date"
  - name: "splitStrategy"
    type: "SplitStrategy"
  - name: "trainingStatus"
    type: "TrainingStatus"
  relations:
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
  - name: "evaluationResults"
    type: "EvaluationResult"
    multiplicity: "OneToMany"
- name: "Backtest"
  description: "Historical simulation evaluating predictive performance across rolling\
    \ windows or folds."
  data:
  - name: "name"
    type: "String"
  - name: "window"
    type: "TimeWindow"
  - name: "horizon"
    type: "Horizon"
  - name: "splitStrategy"
    type: "SplitStrategy"
  relations:
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
  - name: "evaluationResults"
    type: "EvaluationResult"
    multiplicity: "OneToMany"
- name: "EvaluationResult"
  description: "Quantified performance outcome of training or backtesting using a\
    \ defined metric."
  data:
  - name: "metric"
    type: "EvaluationMetricType"
  - name: "value"
    type: "Decimal"
  - name: "direction"
    type: "OptimizationDirection"
  relations:
  - name: "trainingRun"
    type: "TrainingRun"
    multiplicity: "ManyToOne"
  - name: "backtest"
    type: "Backtest"
    multiplicity: "ManyToOne"
- name: "Scenario"
  description: "What-if configuration for generating forecasts with assumptions about\
    \ future conditions."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "uncertaintyMethod"
    type: "UncertaintyMethod"
  - name: "includePredictionIntervals"
    type: "Boolean"
  relations:
  - name: "program"
    type: "ForecastProgram"
    multiplicity: "ManyToOne"
  - name: "adjustments"
    type: "ScenarioAdjustment"
    multiplicity: "OneToMany"
  - name: "forecastJobs"
    type: "ForecastJob"
    multiplicity: "OneToMany"
- name: "ScenarioAdjustment"
  description: "Targeted modification applied to a series or feature during scenario-based\
    \ forecasting."
  data:
  - name: "name"
    type: "String"
  - name: "targetType"
    type: "ScenarioTargetType"
  - name: "modifierType"
    type: "AdjustmentType"
  - name: "value"
    type: "Decimal"
  - name: "timeWindow"
    type: "TimeWindow"
  relations:
  - name: "scenario"
    type: "Scenario"
    multiplicity: "ManyToOne"
  - name: "series"
    type: "ForecastSeries"
    multiplicity: "ManyToOne"
  - name: "feature"
    type: "Feature"
    multiplicity: "ManyToOne"
- name: "ForecastJob"
  description: "Execution request that produces a forecast using a specific model\
    \ version, dataset, and scenario."
  data:
  - name: "name"
    type: "String"
  - name: "submittedOn"
    type: "Date"
  - name: "status"
    type: "ForecastStatus"
  - name: "horizon"
    type: "Horizon"
  - name: "granularity"
    type: "TimeGranularity"
  relations:
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "scenario"
    type: "Scenario"
    multiplicity: "ManyToOne"
  - name: "result"
    type: "ForecastResult"
    multiplicity: "OneToOne"
- name: "ForecastResult"
  description: "Container for outputs produced by a forecast job, including uncertainty\
    \ coverage."
  data:
  - name: "generatedOn"
    type: "Date"
  - name: "coverage"
    type: "Probability"
  relations:
  - name: "forecastJob"
    type: "ForecastJob"
    multiplicity: "OneToOne"
  - name: "items"
    type: "ForecastItem"
    multiplicity: "OneToMany"
- name: "ForecastItem"
  description: "A single forecasted period with point estimate and optional interval\
    \ bounds."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "pointEstimate"
    type: "Decimal"
  - name: "lowerBound"
    type: "Decimal"
  - name: "upperBound"
    type: "Decimal"
  - name: "quantile"
    type: "Decimal"
  relations:
  - name: "result"
    type: "ForecastResult"
    multiplicity: "ManyToOne"
  - name: "series"
    type: "ForecastSeries"
    multiplicity: "ManyToOne"
- name: "DeploymentEndpoint"
  description: "Operational interface exposing forecast generation or retrieval capabilities."
  data:
  - name: "name"
    type: "String"
  - name: "targetType"
    type: "DeploymentTargetType"
  - name: "status"
    type: "DeploymentStatus"
  - name: "endpointUrl"
    type: "String"
  relations:
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
enums:
- name: "DataSourceType"
  description: "Types of systems from which datasets can be acquired."
  data:
  - name: "File"
  - name: "Database"
  - name: "API"
  - name: "Stream"
  - name: "DataWarehouse"
  - name: "Lakehouse"
- name: "TimeGranularity"
  description: "Standard intervals at which time series are indexed and forecasts\
    \ are produced."
  data:
  - name: "Minutely"
  - name: "Hourly"
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Yearly"
- name: "ModelType"
  description: "Families of forecasting algorithms and approaches."
  data:
  - name: "ARIMA"
  - name: "ETS"
  - name: "Prophet"
  - name: "LinearRegression"
  - name: "XGBoost"
  - name: "RandomForest"
  - name: "LSTM"
  - name: "Transformer"
  - name: "Croston"
  - name: "TBATS"
- name: "ModelStatus"
  description: "Lifecycle state of a forecasting model."
  data:
  - name: "Draft"
  - name: "Trained"
  - name: "Validated"
  - name: "Deployed"
  - name: "Retired"
- name: "FeatureRole"
  description: "Functional role of a feature within modeling."
  data:
  - name: "Target"
  - name: "TimeIndex"
  - name: "Exogenous"
  - name: "Categorical"
  - name: "Numerical"
  - name: "Identifier"
- name: "FieldType"
  description: "Primitive data classification for features."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime"
- name: "CalendarType"
  description: "Styles of calendars used to model events and seasonality."
  data:
  - name: "Fiscal"
  - name: "Retail"
  - name: "ISOWeek"
  - name: "Holiday"
  - name: "Custom"
- name: "EventType"
  description: "Categories of events that may impact future values."
  data:
  - name: "Promotion"
  - name: "Holiday"
  - name: "Weather"
  - name: "Outage"
  - name: "PriceChange"
  - name: "ProductLaunch"
  - name: "MarketingCampaign"
- name: "ReconciliationMethod"
  description: "Techniques used to ensure coherence of hierarchical forecasts."
  data:
  - name: "BottomUp"
  - name: "TopDown"
  - name: "MiddleOut"
  - name: "MinT"
  - name: "OLS"
- name: "AggregationFunction"
  description: "Functions used to aggregate observations across hierarchies or windows."
  data:
  - name: "Sum"
  - name: "Average"
  - name: "Median"
  - name: "Max"
  - name: "Min"
  - name: "Last"
  - name: "First"
- name: "TransformationType"
  description: "Preprocessing and feature engineering operations applied to data."
  data:
  - name: "Imputation"
  - name: "Standardization"
  - name: "Normalization"
  - name: "OneHotEncoding"
  - name: "LogTransform"
  - name: "Differencing"
  - name: "SeasonalAdjustment"
  - name: "OutlierRemoval"
- name: "SplitStrategy"
  description: "Methods for partitioning time series data for training and validation."
  data:
  - name: "Holdout"
  - name: "RollingOrigin"
  - name: "KFoldTimeSeries"
  - name: "MonteCarloTimeSplit"
- name: "TrainingStatus"
  description: "Execution state of a training run."
  data:
  - name: "Submitted"
  - name: "Running"
  - name: "Completed"
  - name: "Failed"
  - name: "Cancelled"
- name: "EvaluationMetricType"
  description: "Metrics used to quantify forecast accuracy and quality."
  data:
  - name: "MAE"
  - name: "MAPE"
  - name: "RMSE"
  - name: "SMAPE"
  - name: "MASE"
  - name: "R2"
  - name: "PinballLoss"
- name: "OptimizationDirection"
  description: "Direction in which a metric is considered better."
  data:
  - name: "LowerIsBetter"
  - name: "HigherIsBetter"
- name: "UncertaintyMethod"
  description: "Approaches to estimate forecast uncertainty and intervals."
  data:
  - name: "Quantile"
  - name: "Ensemble"
  - name: "Bayesian"
  - name: "Bootstrap"
- name: "AdjustmentType"
  description: "Methods to apply scenario adjustments to series or features."
  data:
  - name: "Additive"
  - name: "Multiplicative"
  - name: "Override"
- name: "ScenarioTargetType"
  description: "Scope of a scenario adjustment within the forecasting process."
  data:
  - name: "Global"
  - name: "Series"
  - name: "Feature"
- name: "ForecastStatus"
  description: "Processing state of a forecast job."
  data:
  - name: "Draft"
  - name: "Scheduled"
  - name: "Running"
  - name: "Completed"
  - name: "Failed"
  - name: "Archived"
- name: "DeploymentTargetType"
  description: "Runtime modality for serving forecasts."
  data:
  - name: "BatchJob"
  - name: "RESTEndpoint"
  - name: "Streaming"
  - name: "BIExport"
- name: "DeploymentStatus"
  description: "Operational state of a deployment endpoint."
  data:
  - name: "Inactive"
  - name: "Activating"
  - name: "Active"
  - name: "Degraded"
  - name: "Retired"
- name: "SeasonalityType"
  description: "Dominant seasonal patterns present in a time series."
  data:
  - name: "None"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Yearly"
  - name: "Multiple"
valueObjects:
- name: "Horizon"
  description: "Forward-looking span for which forecasts are produced."
  data:
  - name: "length"
    type: "Integer"
  - name: "unit"
    type: "TimeGranularity"
- name: "TimeWindow"
  description: "Inclusive date range used to bound analysis, events, or backtests."
  data:
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
- name: "Probability"
  description: "Probability value between 0 and 1 representing confidence or coverage."
  data:
  - name: "value"
    type: "Decimal"
- name: "URI"
  description: "Uniform resource identifier for connecting to external systems."
  data:
  - name: "value"
    type: "String"
