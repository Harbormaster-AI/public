---
metadata:
  name: "Data Lineage Capabilities Model"
  description: "Canonical HCIDL model capturing how data flows, transforms, and is\
    \ governed across sources, pipelines, and analytical systems."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Analytics & AI"
  type: "Capability"
  domain: "Data Lineage"
entities:
- name: "DataSource"
  description: "Originating system or producer of data such as an application, service,\
    \ or external provider."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "SourceType"
  - name: "domain"
    type: "String"
  - name: "ownerTeam"
    type: "String"
  - name: "contactEmail"
    type: "String"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "OneToMany"
  - name: "dataStores"
    type: "DataStore"
    multiplicity: "OneToMany"
- name: "DataStore"
  description: "Physical or logical storage system that persists data assets."
  data:
  - name: "name"
    type: "String"
  - name: "technology"
    type: "StorageTechnology"
  - name: "region"
    type: "String"
  - name: "connectionUri"
    type: "String"
  - name: "isManaged"
    type: "Boolean"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "OneToMany"
- name: "Dataset"
  description: "Curated data asset such as a table, view, topic, or file collection."
  data:
  - name: "name"
    type: "String"
  - name: "qualifiedName"
    type: "QualifiedName"
  - name: "datasetType"
    type: "DatasetType"
  - name: "format"
    type: "DataFormat"
  - name: "sensitivity"
    type: "SensitivityClassification"
  - name: "description"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  relations:
  - name: "source"
    type: "DataSource"
    multiplicity: "ManyToOne"
  - name: "store"
    type: "DataStore"
    multiplicity: "ManyToOne"
  - name: "schemaSnapshots"
    type: "SchemaSnapshot"
    multiplicity: "OneToMany"
  - name: "glossaryTerms"
    type: "GlossaryTerm"
    multiplicity: "ManyToMany"
  - name: "owners"
    type: "Steward"
    multiplicity: "ManyToMany"
  - name: "inputToJobs"
    type: "DataJob"
    multiplicity: "ManyToMany"
  - name: "outputFromJobs"
    type: "DataJob"
    multiplicity: "ManyToMany"
- name: "SchemaSnapshot"
  description: "Point-in-time schema definition for a dataset used for lineage and\
    \ compatibility checks."
  data:
  - name: "version"
    type: "String"
  - name: "createdAt"
    type: "Date"
  - name: "checksum"
    type: "Checksum"
  - name: "comment"
    type: "String"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "fields"
    type: "SchemaField"
    multiplicity: "OneToMany"
- name: "SchemaField"
  description: "Column or attribute within a schema snapshot."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "nullable"
    type: "Boolean"
  - name: "precision"
    type: "Integer"
  - name: "scale"
    type: "Integer"
  - name: "description"
    type: "String"
  - name: "isPrimaryKey"
    type: "Boolean"
  relations:
  - name: "schemaSnapshot"
    type: "SchemaSnapshot"
    multiplicity: "ManyToOne"
  - name: "glossaryTerms"
    type: "GlossaryTerm"
    multiplicity: "ManyToMany"
  - name: "owners"
    type: "Steward"
    multiplicity: "ManyToMany"
- name: "DataPipeline"
  description: "Logical grouping of related data jobs orchestrated to deliver data\
    \ products."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "String"
  - name: "schedule"
    type: "CronExpression"
  - name: "status"
    type: "PipelineStatus"
  - name: "orchestrationTool"
    type: "String"
  relations:
  - name: "jobs"
    type: "DataJob"
    multiplicity: "OneToMany"
  - name: "owners"
    type: "Steward"
    multiplicity: "ManyToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
- name: "DataJob"
  description: "Executable unit that reads, transforms, and writes data."
  data:
  - name: "name"
    type: "String"
  - name: "jobType"
    type: "JobType"
  - name: "runtime"
    type: "String"
  - name: "repositoryUrl"
    type: "String"
  relations:
  - name: "pipeline"
    type: "DataPipeline"
    multiplicity: "ManyToOne"
  - name: "transformations"
    type: "Transformation"
    multiplicity: "OneToMany"
  - name: "runs"
    type: "DataJobRun"
    multiplicity: "OneToMany"
  - name: "inputDatasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "outputDatasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "owners"
    type: "Steward"
    multiplicity: "ManyToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
- name: "DataJobRun"
  description: "Single execution instance of a data job with runtime metrics and results."
  data:
  - name: "startedAt"
    type: "DateTime"
  - name: "endedAt"
    type: "DateTime"
  - name: "status"
    type: "RunStatus"
  - name: "runtimeSeconds"
    type: "Integer"
  - name: "recordsRead"
    type: "Long"
  - name: "recordsWritten"
    type: "Long"
  - name: "errorMessage"
    type: "String"
  relations:
  - name: "job"
    type: "DataJob"
    multiplicity: "ManyToOne"
  - name: "inputSchemas"
    type: "SchemaSnapshot"
    multiplicity: "ManyToMany"
  - name: "outputSchemas"
    type: "SchemaSnapshot"
    multiplicity: "ManyToMany"
  - name: "lineageEvents"
    type: "LineageEvent"
    multiplicity: "OneToMany"
  - name: "qualityResults"
    type: "QualityResult"
    multiplicity: "OneToMany"
- name: "Transformation"
  description: "Declarative step within a job that defines how inputs are transformed."
  data:
  - name: "name"
    type: "String"
  - name: "operation"
    type: "OperationType"
  - name: "expression"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "job"
    type: "DataJob"
    multiplicity: "ManyToOne"
  - name: "fieldMappings"
    type: "FieldMapping"
    multiplicity: "OneToMany"
- name: "FieldMapping"
  description: "Fine-grained lineage rule connecting input fields to a single output\
    \ field."
  data:
  - name: "expression"
    type: "String"
  - name: "comment"
    type: "String"
  relations:
  - name: "transformation"
    type: "Transformation"
    multiplicity: "ManyToOne"
  - name: "inputFields"
    type: "SchemaField"
    multiplicity: "ManyToMany"
  - name: "outputField"
    type: "SchemaField"
    multiplicity: "ManyToOne"
- name: "DatasetLineage"
  description: "Directed edge capturing dataset-level lineage between a source and\
    \ a target."
  data:
  - name: "relationType"
    type: "LineageRelationType"
  - name: "confidence"
    type: "LineageConfidence"
  - name: "observedAt"
    type: "DateTime"
  - name: "notes"
    type: "String"
  relations:
  - name: "sourceDataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "targetDataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "job"
    type: "DataJob"
    multiplicity: "ManyToOne"
  - name: "transformation"
    type: "Transformation"
    multiplicity: "ManyToOne"
  - name: "capture"
    type: "LineageEvent"
    multiplicity: "ManyToOne"
- name: "FieldLineage"
  description: "Directed edge capturing field-level lineage between a source field\
    \ and a target field."
  data:
  - name: "relationType"
    type: "LineageRelationType"
  - name: "confidence"
    type: "LineageConfidence"
  - name: "observedAt"
    type: "DateTime"
  - name: "expression"
    type: "String"
  relations:
  - name: "sourceField"
    type: "SchemaField"
    multiplicity: "ManyToOne"
  - name: "targetField"
    type: "SchemaField"
    multiplicity: "ManyToOne"
  - name: "job"
    type: "DataJob"
    multiplicity: "ManyToOne"
  - name: "transformation"
    type: "Transformation"
    multiplicity: "ManyToOne"
  - name: "capture"
    type: "LineageEvent"
    multiplicity: "ManyToOne"
- name: "LineageEvent"
  description: "Capture session describing how lineage was collected from tools or\
    \ runtime signals."
  data:
  - name: "capturedAt"
    type: "DateTime"
  - name: "capturedBy"
    type: "String"
  - name: "captureMethod"
    type: "CaptureMethod"
  - name: "toolVersion"
    type: "String"
  - name: "details"
    type: "String"
  relations:
  - name: "jobRun"
    type: "DataJobRun"
    multiplicity: "ManyToOne"
  - name: "datasetEdges"
    type: "DatasetLineage"
    multiplicity: "OneToMany"
  - name: "fieldEdges"
    type: "FieldLineage"
    multiplicity: "OneToMany"
- name: "Steward"
  description: "Person or group accountable for data ownership, stewardship, or custodianship."
  data:
  - name: "name"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "StewardRole"
  - name: "team"
    type: "String"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "fields"
    type: "SchemaField"
    multiplicity: "ManyToMany"
  - name: "pipelines"
    type: "DataPipeline"
    multiplicity: "ManyToMany"
  - name: "jobs"
    type: "DataJob"
    multiplicity: "ManyToMany"
  - name: "contracts"
    type: "DataContract"
    multiplicity: "OneToMany"
- name: "GlossaryTerm"
  description: "Business vocabulary item used to standardize meaning across data assets."
  data:
  - name: "name"
    type: "String"
  - name: "definition"
    type: "String"
  - name: "termStatus"
    type: "TermStatus"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "fields"
    type: "SchemaField"
    multiplicity: "ManyToMany"
  - name: "relatedTerms"
    type: "GlossaryTerm"
    multiplicity: "ManyToMany"
- name: "DataContract"
  description: "Agreement defining expectations for data quality, timeliness, and\
    \ protection."
  data:
  - name: "name"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  - name: "freshnessSlaMinutes"
    type: "Integer"
  - name: "piiPolicy"
    type: "PiiPolicy"
  - name: "notes"
    type: "String"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "owners"
    type: "Steward"
    multiplicity: "ManyToMany"
  - name: "qualityRules"
    type: "QualityRule"
    multiplicity: "OneToMany"
- name: "QualityRule"
  description: "Testable constraint used to evaluate data quality for lineage-aware\
    \ assets."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "QualityRuleType"
  - name: "threshold"
    type: "Decimal"
  - name: "isBlocking"
    type: "Boolean"
  - name: "query"
    type: "String"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "field"
    type: "SchemaField"
    multiplicity: "ManyToOne"
  - name: "contract"
    type: "DataContract"
    multiplicity: "ManyToOne"
  - name: "results"
    type: "QualityResult"
    multiplicity: "OneToMany"
- name: "QualityResult"
  description: "Outcome of a quality rule evaluation associated with a job run and\
    \ asset version."
  data:
  - name: "evaluatedAt"
    type: "DateTime"
  - name: "passed"
    type: "Boolean"
  - name: "failureCount"
    type: "Integer"
  - name: "sampleUrl"
    type: "String"
  relations:
  - name: "rule"
    type: "QualityRule"
    multiplicity: "ManyToOne"
  - name: "jobRun"
    type: "DataJobRun"
    multiplicity: "ManyToOne"
- name: "Tag"
  description: "Lightweight label used to classify and discover assets and processes."
  data:
  - name: "name"
    type: "String"
  - name: "color"
    type: "String"
  - name: "category"
    type: "String"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "fields"
    type: "SchemaField"
    multiplicity: "ManyToMany"
  - name: "pipelines"
    type: "DataPipeline"
    multiplicity: "ManyToMany"
  - name: "jobs"
    type: "DataJob"
    multiplicity: "ManyToMany"
enums:
- name: "SourceType"
  description: "Category of system that originates data."
  data:
  - name: "Application"
  - name: "Database"
  - name: "Messaging"
  - name: "API"
  - name: "FileShare"
  - name: "SaaS"
- name: "StorageTechnology"
  description: "Technology used by the data store."
  data:
  - name: "RelationalDatabase"
  - name: "DataWarehouse"
  - name: "DataLake"
  - name: "ObjectStorage"
  - name: "Stream"
  - name: "NoSQL"
  - name: "Lakehouse"
- name: "DatasetType"
  description: "Structural type of dataset."
  data:
  - name: "Table"
  - name: "View"
  - name: "MaterializedView"
  - name: "Topic"
  - name: "FileSet"
  - name: "ReportExtract"
- name: "DataFormat"
  description: "Physical serialization format of the dataset."
  data:
  - name: "Parquet"
  - name: "Avro"
  - name: "CSV"
  - name: "JSON"
  - name: "ORC"
  - name: "XML"
  - name: "Delta"
- name: "SensitivityClassification"
  description: "Confidentiality level for handling data."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Confidential"
  - name: "Restricted"
  - name: "HighlyRestricted"
- name: "DataType"
  description: "Logical data type of a schema field."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Long"
  - name: "Decimal"
  - name: "Double"
  - name: "Boolean"
  - name: "Date"
  - name: "Timestamp"
  - name: "Binary"
  - name: "Array"
  - name: "Map"
- name: "PipelineStatus"
  description: "Lifecycle state of a data pipeline."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Paused"
  - name: "Deprecated"
- name: "JobType"
  description: "Purpose of a data job within a pipeline."
  data:
  - name: "Ingestion"
  - name: "Transform"
  - name: "Aggregation"
  - name: "Enrichment"
  - name: "MachineLearning"
  - name: "Export"
  - name: "Streaming"
  - name: "Orchestration"
- name: "RunStatus"
  description: "Execution status of a job run."
  data:
  - name: "Queued"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Skipped"
  - name: "Cancelled"
- name: "OperationType"
  description: "Type of transformation applied to data."
  data:
  - name: "Select"
  - name: "Filter"
  - name: "Join"
  - name: "Union"
  - name: "Aggregate"
  - name: "Window"
  - name: "Pivot"
  - name: "Unpivot"
  - name: "Cast"
  - name: "Deduplicate"
  - name: "Mask"
  - name: "Hash"
  - name: "Lookup"
- name: "LineageRelationType"
  description: "Semantics of the lineage relationship between assets."
  data:
  - name: "Copies"
  - name: "Derives"
  - name: "Aggregates"
  - name: "Joins"
  - name: "Splits"
  - name: "Merges"
  - name: "Masks"
  - name: "Filters"
- name: "LineageConfidence"
  description: "Confidence level assigned to a lineage assertion."
  data:
  - name: "High"
  - name: "Medium"
  - name: "Low"
  - name: "Inferred"
- name: "CaptureMethod"
  description: "Mechanism used to collect lineage information."
  data:
  - name: "Parser"
  - name: "RuntimeHook"
  - name: "QueryLog"
  - name: "ExternalAPI"
  - name: "Manual"
- name: "StewardRole"
  description: "Responsibility profile for data accountability."
  data:
  - name: "DataOwner"
  - name: "DataSteward"
  - name: "Custodian"
  - name: "Producer"
  - name: "Consumer"
- name: "TermStatus"
  description: "Governance status of a glossary term."
  data:
  - name: "Draft"
  - name: "Approved"
  - name: "Deprecated"
- name: "PiiPolicy"
  description: "Protection strategy for personally identifiable information."
  data:
  - name: "None"
  - name: "Pseudonymized"
  - name: "Anonymized"
  - name: "Encrypted"
  - name: "Tokenized"
- name: "QualityRuleType"
  description: "Category of quality control applied to a dataset or field."
  data:
  - name: "Completeness"
  - name: "Uniqueness"
  - name: "Validity"
  - name: "Consistency"
  - name: "Freshness"
  - name: "Accuracy"
  - name: "ReferentialIntegrity"
valueObjects:
- name: "QualifiedName"
  description: "Fully scoped logical name that uniquely identifies a data asset in\
    \ a namespace."
  data:
  - name: "namespace"
    type: "String"
  - name: "name"
    type: "String"
  - name: "path"
    type: "String"
- name: "Checksum"
  description: "Digest representing a stable fingerprint of a schema snapshot."
  data:
  - name: "algorithm"
    type: "String"
  - name: "value"
    type: "String"
- name: "CronExpression"
  description: "Schedule definition using cron notation and an optional time zone."
  data:
  - name: "expression"
    type: "String"
  - name: "timeZone"
    type: "String"
- name: "URN"
  description: "Uniform Resource Name identifying an entity consistently across systems."
  data:
  - name: "value"
    type: "String"
