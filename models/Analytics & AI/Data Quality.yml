---
metadata:
  name: "Data Quality"
  description: "Canonical HCIDL capabilities model for governing, measuring, and improving\
    \ enterprise data quality across datasets, sources, and domains."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Analytics & AI"
  type: "Capability"
  domain: "Data Quality"
entities:
- name: "DataDomain"
  description: "Logical business domain that groups datasets for ownership and governance\
    \ focus."
  data:
  - name: "name"
    type: "String"
  - name: "criticality"
    type: "DataCriticality"
  - name: "businessPurpose"
    type: "String"
  - name: "dataSensitivity"
    type: "DataSensitivity"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "OneToMany"
  - name: "stewards"
    type: "Steward"
    multiplicity: "ManyToMany"
- name: "Steward"
  description: "Individual accountable for data quality, with responsibilities for\
    \ domains, datasets, and issues."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "StewardRole"
  relations:
  - name: "domains"
    type: "DataDomain"
    multiplicity: "ManyToMany"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "issues"
    type: "DataQualityIssue"
    multiplicity: "OneToMany"
  - name: "remediationTasks"
    type: "RemediationTask"
    multiplicity: "OneToMany"
- name: "DataSource"
  description: "System or platform that produces or hosts datasets."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "SourceType"
  - name: "connectionUri"
    type: "URI"
  - name: "ownerTeam"
    type: "String"
  - name: "dataSensitivity"
    type: "DataSensitivity"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "OneToMany"
- name: "Dataset"
  description: "Managed collection of structured or semi-structured data with a defined\
    \ refresh cadence."
  data:
  - name: "name"
    type: "String"
  - name: "datasetType"
    type: "DatasetType"
  - name: "storageFormat"
    type: "StorageFormat"
  - name: "retentionDays"
    type: "Integer"
  - name: "refreshFrequency"
    type: "ScheduleFrequency"
  - name: "rowCountEstimate"
    type: "Integer"
  - name: "dataSensitivity"
    type: "DataSensitivity"
  relations:
  - name: "domain"
    type: "DataDomain"
    multiplicity: "ManyToOne"
  - name: "source"
    type: "DataSource"
    multiplicity: "ManyToOne"
  - name: "schemaVersions"
    type: "SchemaVersion"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "ValidationPolicy"
    multiplicity: "ManyToMany"
  - name: "stewards"
    type: "Steward"
    multiplicity: "ManyToMany"
  - name: "profiles"
    type: "DataProfile"
    multiplicity: "OneToMany"
  - name: "validationRuns"
    type: "ValidationRun"
    multiplicity: "OneToMany"
  - name: "issues"
    type: "DataQualityIssue"
    multiplicity: "OneToMany"
- name: "SchemaVersion"
  description: "Versioned logical schema for a dataset including the set of fields\
    \ and data types."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "isCurrent"
    type: "Boolean"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "fields"
    type: "SchemaField"
    multiplicity: "OneToMany"
- name: "SchemaField"
  description: "Field within a schema version that defines structure and semantic\
    \ properties."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "nullable"
    type: "Boolean"
  - name: "maxLength"
    type: "Integer"
  - name: "descriptionText"
    type: "String"
  - name: "piiFlag"
    type: "Boolean"
  relations:
  - name: "schemaVersion"
    type: "SchemaVersion"
    multiplicity: "ManyToOne"
- name: "ValidationPolicy"
  description: "Collection of rules, schedules, and escalation behavior applied to\
    \ one or more datasets."
  data:
  - name: "name"
    type: "String"
  - name: "schedule"
    type: "ScheduleFrequency"
  - name: "isBlocking"
    type: "Boolean"
  - name: "alertSeverityThreshold"
    type: "Severity"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "rules"
    type: "DataQualityRule"
    multiplicity: "ManyToMany"
  - name: "thresholds"
    type: "Threshold"
    multiplicity: "OneToMany"
- name: "DataQualityRule"
  description: "Declarative condition that validates data for a specific quality dimension\
    \ and target scope."
  data:
  - name: "name"
    type: "String"
  - name: "dimension"
    type: "QualityDimension"
  - name: "ruleType"
    type: "RuleType"
  - name: "language"
    type: "RuleLogicLanguage"
  - name: "definition"
    type: "RuleExpression"
  - name: "targetScope"
    type: "RuleScope"
  - name: "targetFieldName"
    type: "String"
  - name: "severity"
    type: "Severity"
  - name: "status"
    type: "RuleStatus"
  relations:
  - name: "policies"
    type: "ValidationPolicy"
    multiplicity: "ManyToMany"
  - name: "metricDefinitions"
    type: "MetricDefinition"
    multiplicity: "ManyToMany"
  - name: "validationResults"
    type: "ValidationResult"
    multiplicity: "OneToMany"
  - name: "thresholds"
    type: "Threshold"
    multiplicity: "OneToMany"
- name: "MetricDefinition"
  description: "Reusable definition of a quantitative measure computed during profiling\
    \ or validation."
  data:
  - name: "name"
    type: "String"
  - name: "metricType"
    type: "MetricType"
  - name: "dimension"
    type: "QualityDimension"
  - name: "aggregationMethod"
    type: "AggregationMethod"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "rules"
    type: "DataQualityRule"
    multiplicity: "ManyToMany"
  - name: "profilingRuns"
    type: "ProfilingRun"
    multiplicity: "ManyToMany"
  - name: "validationResults"
    type: "ValidationResult"
    multiplicity: "OneToMany"
  - name: "thresholds"
    type: "Threshold"
    multiplicity: "OneToMany"
- name: "Threshold"
  description: "Acceptability limits and operators that determine whether a metric\
    \ value is compliant."
  data:
  - name: "name"
    type: "String"
  - name: "thresholdType"
    type: "ThresholdType"
  - name: "operator_"
    type: "ComparisonOperator"
  - name: "target"
    type: "Decimal"
  - name: "warningTarget"
    type: "Decimal"
  - name: "unit"
    type: "UnitOfMeasure"
  relations:
  - name: "metric"
    type: "MetricDefinition"
    multiplicity: "ManyToOne"
  - name: "policy"
    type: "ValidationPolicy"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "DataQualityRule"
    multiplicity: "ManyToOne"
  - name: "scorecards"
    type: "Scorecard"
    multiplicity: "ManyToMany"
- name: "DataProfile"
  description: "Longitudinal characterization of dataset structure and statistics\
    \ across profiling runs."
  data:
  - name: "createdAt"
    type: "DateTime"
  - name: "profilingTool"
    type: "String"
  - name: "notes"
    type: "String"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "runs"
    type: "ProfilingRun"
    multiplicity: "OneToMany"
- name: "ProfilingRun"
  description: "Execution instance that computes structural and statistical metrics\
    \ for a dataset."
  data:
  - name: "runAt"
    type: "DateTime"
  - name: "rowCount"
    type: "Integer"
  - name: "columnCount"
    type: "Integer"
  - name: "samplePercent"
    type: "Decimal"
  - name: "status"
    type: "ExecutionStatus"
  relations:
  - name: "profile"
    type: "DataProfile"
    multiplicity: "ManyToOne"
  - name: "metrics"
    type: "MetricDefinition"
    multiplicity: "ManyToMany"
- name: "ValidationRun"
  description: "Execution instance of applying validation rules to a dataset under\
    \ a policy."
  data:
  - name: "runAt"
    type: "DateTime"
  - name: "initiatedBy"
    type: "String"
  - name: "status"
    type: "ExecutionStatus"
  - name: "durationSeconds"
    type: "Integer"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "results"
    type: "ValidationResult"
    multiplicity: "OneToMany"
- name: "ValidationResult"
  description: "Outcome of evaluating a single rule, including observed metric values\
    \ and pass/fail status."
  data:
  - name: "evaluatedAt"
    type: "DateTime"
  - name: "status"
    type: "EvaluationStatus"
  - name: "passedCount"
    type: "Integer"
  - name: "failedCount"
    type: "Integer"
  - name: "errorMessage"
    type: "String"
  - name: "observedValue"
    type: "Decimal"
  relations:
  - name: "run"
    type: "ValidationRun"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "DataQualityRule"
    multiplicity: "ManyToOne"
  - name: "metric"
    type: "MetricDefinition"
    multiplicity: "ManyToOne"
  - name: "issue"
    type: "DataQualityIssue"
    multiplicity: "OneToOne"
- name: "DataQualityIssue"
  description: "Tracked problem detected by validation or profiling that requires\
    \ investigation or remediation."
  data:
  - name: "title"
    type: "String"
  - name: "severity"
    type: "Severity"
  - name: "status"
    type: "IssueStatus"
  - name: "firstDetected"
    type: "DateTime"
  - name: "lastSeen"
    type: "DateTime"
  - name: "affectedDatasetArea"
    type: "String"
  - name: "estimatedImpact"
    type: "String"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "DataQualityRule"
    multiplicity: "ManyToOne"
  - name: "validationResult"
    type: "ValidationResult"
    multiplicity: "OneToOne"
  - name: "assignee"
    type: "Steward"
    multiplicity: "ManyToOne"
  - name: "remediationTasks"
    type: "RemediationTask"
    multiplicity: "OneToMany"
- name: "RemediationTask"
  description: "Actionable work item created to resolve a specific data quality issue."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "RemediationStatus"
  - name: "priority"
    type: "Severity"
  - name: "createdAt"
    type: "DateTime"
  - name: "dueDate"
    type: "Date"
  - name: "notes"
    type: "String"
  relations:
  - name: "issue"
    type: "DataQualityIssue"
    multiplicity: "ManyToOne"
  - name: "assignee"
    type: "Steward"
    multiplicity: "ManyToOne"
- name: "Scorecard"
  description: "Aggregated view that combines thresholds and metrics to produce an\
    \ overall quality score."
  data:
  - name: "name"
    type: "String"
  - name: "method"
    type: "ScorecardMethod"
  - name: "targetPassRate"
    type: "Decimal"
  - name: "scoringWindow"
    type: "TimeRange"
  - name: "status"
    type: "ScorecardStatus"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "thresholds"
    type: "Threshold"
    multiplicity: "ManyToMany"
  - name: "results"
    type: "ScorecardResult"
    multiplicity: "OneToMany"
- name: "ScorecardResult"
  description: "Periodic evaluation output of a scorecard, including overall score\
    \ and grade."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "score"
    type: "Decimal"
  - name: "grade"
    type: "QualityGrade"
  - name: "evaluatedAt"
    type: "DateTime"
  relations:
  - name: "scorecard"
    type: "Scorecard"
    multiplicity: "ManyToOne"
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
enums:
- name: "SourceType"
  description: "Classification of systems that host or produce datasets."
  data:
  - name: "Database"
  - name: "DataWarehouse"
  - name: "FileSystem"
  - name: "ObjectStore"
  - name: "MessageQueue"
  - name: "Api"
  - name: "SaaS"
  - name: "StreamingPlatform"
- name: "DatasetType"
  description: "Logical representation of how data is exposed or consumed."
  data:
  - name: "Table"
  - name: "View"
  - name: "File"
  - name: "Stream"
  - name: "Topic"
  - name: "APIResource"
- name: "StorageFormat"
  description: "Physical format in which dataset content is stored."
  data:
  - name: "CSV"
  - name: "JSON"
  - name: "Parquet"
  - name: "Avro"
  - name: "ORC"
  - name: "Delta"
  - name: "XML"
- name: "DataType"
  description: "Primitive data types supported for schema fields."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime_"
  - name: "Binary"
- name: "QualityDimension"
  description: "Standard categories used to evaluate data quality characteristics."
  data:
  - name: "Accuracy"
  - name: "Completeness"
  - name: "Consistency"
  - name: "Timeliness"
  - name: "Uniqueness"
  - name: "Validity"
  - name: "Integrity"
  - name: "Conformity"
- name: "RuleType"
  description: "Structural classification of validation rules by evaluation method."
  data:
  - name: "ColumnLevel"
  - name: "DatasetLevel"
  - name: "CrossDataset"
  - name: "ReferentialIntegrity"
  - name: "Freshness"
  - name: "Pattern"
  - name: "AnomalyDetection"
- name: "RuleLogicLanguage"
  description: "Language or syntax used to express a validation rule."
  data:
  - name: "SQL"
  - name: "DSL"
  - name: "Regex"
  - name: "Python"
  - name: "SparkSQL"
- name: "RuleScope"
  description: "Target granularity at which a rule is applied."
  data:
  - name: "Dataset"
  - name: "Field"
  - name: "Record"
  - name: "CrossDataset"
- name: "Severity"
  description: "Impact level used for alerting, prioritization, and escalation."
  data:
  - name: "Critical"
  - name: "High"
  - name: "Medium"
  - name: "Low"
- name: "RuleStatus"
  description: "Lifecycle state of a validation rule."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Paused"
  - name: "Deprecated"
- name: "MetricType"
  description: "Types of computed measurements produced by profiling or validation."
  data:
  - name: "Count"
  - name: "Ratio"
  - name: "DistinctCount"
  - name: "NullCount"
  - name: "DuplicateRate"
  - name: "PatternMatchRate"
  - name: "FreshnessHours"
  - name: "ReferentialIntegrityFailures"
  - name: "OutlierRate"
  - name: "CompletenessRate"
  - name: "ValidityRate"
- name: "AggregationMethod"
  description: "Method used to combine metric values across partitions or time."
  data:
  - name: "Average"
  - name: "Sum"
  - name: "Min"
  - name: "Max"
  - name: "WeightedAverage"
  - name: "Median"
  - name: "Percentile95"
- name: "ThresholdType"
  description: "Strategy used to determine acceptable bounds for a metric."
  data:
  - name: "Static"
  - name: "Dynamic"
  - name: "Adaptive"
  - name: "SLA"
- name: "ComparisonOperator"
  description: "Operator used when comparing observed values to threshold targets."
  data:
  - name: "GreaterThan"
  - name: "GreaterOrEqual"
  - name: "LessThan"
  - name: "LessOrEqual"
  - name: "Equal"
  - name: "NotEqual"
  - name: "Between"
  - name: "OutsideRange"
- name: "UnitOfMeasure"
  description: "Units applied to metric and threshold values."
  data:
  - name: "Count"
  - name: "Ratio"
  - name: "Percentage"
  - name: "Rows"
  - name: "Columns"
  - name: "Hours"
  - name: "Days"
  - name: "Seconds"
- name: "ExecutionStatus"
  description: "Overall outcome state of a profiling or validation run."
  data:
  - name: "Succeeded"
  - name: "Failed"
  - name: "PartiallySucceeded"
  - name: "Cancelled"
- name: "EvaluationStatus"
  description: "Result of a single rule evaluation against data."
  data:
  - name: "Passed"
  - name: "Failed"
  - name: "Error"
  - name: "Skipped"
- name: "ScheduleFrequency"
  description: "Cadence at which a policy triggers profiling or validation."
  data:
  - name: "OnDemand"
  - name: "Hourly"
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
- name: "IssueStatus"
  description: "Lifecycle state of a data quality issue."
  data:
  - name: "Open"
  - name: "Investigating"
  - name: "InProgress"
  - name: "Resolved"
  - name: "Suppressed"
  - name: "Closed"
- name: "RemediationStatus"
  description: "Progress state of a remediation task."
  data:
  - name: "Open"
  - name: "InProgress"
  - name: "Blocked"
  - name: "Completed"
  - name: "Cancelled"
- name: "ScorecardMethod"
  description: "Algorithm for combining metrics into an overall quality score."
  data:
  - name: "WeightedAverage"
  - name: "MinimumPassRate"
  - name: "AveragePassRate"
- name: "ScorecardStatus"
  description: "Lifecycle state of a scorecard definition."
  data:
  - name: "Active"
  - name: "Archived"
- name: "QualityGrade"
  description: "Letter grade representing overall quality performance."
  data:
  - name: "A"
  - name: "B"
  - name: "C"
  - name: "D"
  - name: "F"
- name: "StewardRole"
  description: "Role classification for individuals accountable for data assets."
  data:
  - name: "DataSteward"
  - name: "DomainOwner"
  - name: "Custodian"
- name: "DataSensitivity"
  description: "Classification of data confidentiality and handling requirements."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Confidential"
  - name: "Restricted"
- name: "DataCriticality"
  description: "Importance of a domain’s data to business operations."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "MissionCritical"
valueObjects:
- name: "URI"
  description: "Uniform Resource Identifier used to locate or connect to a data source."
  data:
  - name: "value"
    type: "String"
- name: "RuleExpression"
  description: "Textual representation of a rule in the specified rule language."
  data:
  - name: "text"
    type: "String"
- name: "TimeRange"
  description: "Inclusive start and end timestamps defining a scoring or evaluation\
    \ window."
  data:
  - name: "start"
    type: "DateTime"
  - name: "end"
    type: "DateTime"
