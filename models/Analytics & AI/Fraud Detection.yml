---
metadata:
  name: "Fraud Detection"
  description: "Capabilities model for detecting, assessing, and managing fraud across\
    \ transactions, identities, devices, and channels, including analytics, alerting,\
    \ case management, and model governance."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Banking"
  type: "Capability"
  domain: "Fraud Detection"
entities:
- name: "CustomerProfile"
  description: "Individual or organization whose identity and behavior are monitored\
    \ for potential fraud risk."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "phone"
    type: "PhoneNumber"
  - name: "dateOfBirth"
    type: "Date"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "vip"
    type: "Boolean"
  relations:
  - name: "accounts"
    type: "CustomerAccount"
    multiplicity: "OneToMany"
  - name: "devices"
    type: "Device"
    multiplicity: "ManyToMany"
  - name: "sessions"
    type: "UserSession"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "cases"
    type: "Case"
    multiplicity: "OneToMany"
  - name: "identityVerifications"
    type: "IdentityVerification"
    multiplicity: "OneToMany"
  - name: "watchlists"
    type: "WatchlistEntry"
    multiplicity: "ManyToMany"
- name: "CustomerAccount"
  description: "Financial or service account monitored for fraudulent activity."
  data:
  - name: "accountNumber"
    type: "String"
  - name: "accountType"
    type: "AccountType"
  - name: "status"
    type: "AccountStatus"
  relations:
  - name: "owner"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
- name: "Merchant"
  description: "Receiving party or merchant entity associated with commerce transactions."
  data:
  - name: "name"
    type: "String"
  - name: "merchantCategory"
    type: "String"
  - name: "country"
    type: "String"
  - name: "riskLevel"
    type: "RiskLevel"
  relations:
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "watchlists"
    type: "WatchlistEntry"
    multiplicity: "ManyToMany"
- name: "Device"
  description: "Physical or virtual device used to access channels and perform actions\
    \ under evaluation for fraud."
  data:
  - name: "deviceKey"
    type: "String"
  - name: "platform"
    type: "DevicePlatform"
  - name: "fingerprint"
    type: "DeviceFingerprint"
  - name: "isEmulator"
    type: "Boolean"
  relations:
  - name: "profiles"
    type: "CustomerProfile"
    multiplicity: "ManyToMany"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
  - name: "sessions"
    type: "UserSession"
    multiplicity: "OneToMany"
  - name: "authEvents"
    type: "AuthenticationEvent"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "watchlists"
    type: "WatchlistEntry"
    multiplicity: "ManyToMany"
- name: "NetworkEndpoint"
  description: "Network attributes observed for activity, such as IP address and autonomous\
    \ system."
  data:
  - name: "ipAddress"
    type: "IPAddress"
  - name: "autonomousSystem"
    type: "String"
  - name: "networkType"
    type: "NetworkType"
  - name: "geolocation"
    type: "GeoPoint"
  relations:
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
  - name: "sessions"
    type: "UserSession"
    multiplicity: "OneToMany"
  - name: "authEvents"
    type: "AuthenticationEvent"
    multiplicity: "OneToMany"
- name: "UserSession"
  description: "Interaction context representing a period of authenticated or unauthenticated\
    \ activity."
  data:
  - name: "sessionKey"
    type: "String"
  - name: "startedAt"
    type: "Date"
  - name: "channel"
    type: "ChannelType"
  relations:
  - name: "profile"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "Device"
    multiplicity: "ManyToOne"
  - name: "networkEndpoint"
    type: "NetworkEndpoint"
    multiplicity: "ManyToOne"
  - name: "authEvents"
    type: "AuthenticationEvent"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
- name: "AuthenticationEvent"
  description: "Login or identity assertion event evaluated for potential fraud."
  data:
  - name: "occurredAt"
    type: "Date"
  - name: "result"
    type: "AuthenticationResult"
  - name: "method"
    type: "String"
  relations:
  - name: "session"
    type: "UserSession"
    multiplicity: "ManyToOne"
  - name: "profile"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "Device"
    multiplicity: "ManyToOne"
  - name: "networkEndpoint"
    type: "NetworkEndpoint"
    multiplicity: "ManyToOne"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
- name: "Transaction"
  description: "Monetary or value-bearing action subject to fraud screening and decisioning."
  data:
  - name: "transactionReference"
    type: "String"
  - name: "type"
    type: "TransactionType"
  - name: "method"
    type: "PaymentMethod"
  - name: "amount"
    type: "Money"
  - name: "occurredAt"
    type: "Date"
  - name: "channel"
    type: "ChannelType"
  - name: "status"
    type: "TransactionStatus"
  - name: "merchantReference"
    type: "String"
  - name: "location"
    type: "GeoPoint"
  relations:
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "session"
    type: "UserSession"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "Device"
    multiplicity: "ManyToOne"
  - name: "networkEndpoint"
    type: "NetworkEndpoint"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "decisions"
    type: "Decision"
    multiplicity: "OneToMany"
- name: "RiskAssessment"
  description: "Evaluation produced by rules and/or models estimating the likelihood\
    \ and impact of fraud."
  data:
  - name: "assessedAt"
    type: "Date"
  - name: "score"
    type: "RiskScore"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "explanation"
    type: "String"
  relations:
  - name: "transaction"
    type: "Transaction"
    multiplicity: "ManyToOne"
  - name: "authenticationEvent"
    type: "AuthenticationEvent"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
  - name: "ruleHits"
    type: "RuleHit"
    multiplicity: "OneToMany"
  - name: "featureVector"
    type: "FeatureVector"
    multiplicity: "OneToOne"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
- name: "Alert"
  description: "Notification generated when risk surpasses thresholds or rules trigger."
  data:
  - name: "alertNumber"
    type: "String"
  - name: "createdAt"
    type: "Date"
  - name: "severity"
    type: "AlertSeverity"
  - name: "status"
    type: "AlertStatus"
  - name: "rationale"
    type: "String"
  relations:
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
  - name: "transaction"
    type: "Transaction"
    multiplicity: "ManyToOne"
  - name: "authenticationEvent"
    type: "AuthenticationEvent"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "CustomerAccount"
    multiplicity: "ManyToOne"
  - name: "profile"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "Device"
    multiplicity: "ManyToOne"
  - name: "networkEndpoint"
    type: "NetworkEndpoint"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
- name: "Case"
  description: "Container for managing investigation, triage, and resolution of related\
    \ alerts and activity."
  data:
  - name: "caseNumber"
    type: "String"
  - name: "openedAt"
    type: "Date"
  - name: "closedAt"
    type: "Date"
  - name: "status"
    type: "CaseStatus"
  - name: "priority"
    type: "CasePriority"
  - name: "summary"
    type: "String"
  relations:
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "ManyToMany"
  - name: "investigator"
    type: "Investigator"
    multiplicity: "ManyToOne"
  - name: "profile"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
  - name: "decisions"
    type: "Decision"
    multiplicity: "OneToMany"
- name: "Investigator"
  description: "Analyst or supervisor responsible for triage and investigation activities."
  data:
  - name: "fullName"
    type: "String"
  - name: "role"
    type: "InvestigatorRole"
  - name: "email"
    type: "EmailAddress"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "cases"
    type: "Case"
    multiplicity: "OneToMany"
- name: "Decision"
  description: "Automated or human adjudication on risk, yielding outcomes and operational\
    \ actions."
  data:
  - name: "decidedAt"
    type: "Date"
  - name: "outcome"
    type: "DecisionOutcome"
  - name: "reason"
    type: "String"
  relations:
  - name: "case"
    type: "Case"
    multiplicity: "ManyToOne"
  - name: "transaction"
    type: "Transaction"
    multiplicity: "ManyToOne"
  - name: "actions"
    type: "Action"
    multiplicity: "OneToMany"
  - name: "analyst"
    type: "Investigator"
    multiplicity: "ManyToOne"
- name: "Action"
  description: "Operational measure applied in response to a decision to mitigate\
    \ fraud risk."
  data:
  - name: "actionType"
    type: "ActionType"
  - name: "effectiveFrom"
    type: "Date"
  - name: "durationMinutes"
    type: "Integer"
  - name: "parameters"
    type: "String"
  relations:
  - name: "decision"
    type: "Decision"
    multiplicity: "ManyToOne"
  - name: "appliedToAlerts"
    type: "Alert"
    multiplicity: "ManyToMany"
  - name: "appliedToAccounts"
    type: "CustomerAccount"
    multiplicity: "ManyToMany"
- name: "Rule"
  description: "Deterministic logic used to identify suspicious conditions and contribute\
    \ to risk scoring."
  data:
  - name: "name"
    type: "String"
  - name: "ruleCode"
    type: "String"
  - name: "ruleType"
    type: "RuleType"
  - name: "status"
    type: "RuleStatus"
  - name: "severity"
    type: "AlertSeverity"
  - name: "description"
    type: "String"
  relations:
  - name: "ruleHits"
    type: "RuleHit"
    multiplicity: "OneToMany"
- name: "RuleHit"
  description: "Evidence record that a specific rule matched during assessment."
  data:
  - name: "triggeredAt"
    type: "Date"
  - name: "weight"
    type: "Decimal"
  - name: "severity"
    type: "AlertSeverity"
  - name: "context"
    type: "String"
  relations:
  - name: "rule"
    type: "Rule"
    multiplicity: "ManyToOne"
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
  - name: "transaction"
    type: "Transaction"
    multiplicity: "ManyToOne"
  - name: "authenticationEvent"
    type: "AuthenticationEvent"
    multiplicity: "ManyToOne"
- name: "Model"
  description: "Statistical or machine learning artifact used to estimate fraud risk."
  data:
  - name: "name"
    type: "String"
  - name: "modelType"
    type: "ModelType"
  - name: "description"
    type: "String"
  relations:
  - name: "versions"
    type: "ModelVersion"
    multiplicity: "OneToMany"
  - name: "currentVersion"
    type: "ModelVersion"
    multiplicity: "OneToOne"
- name: "ModelVersion"
  description: "Concrete, versioned instance of a model with training data and performance\
    \ characteristics."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "trainedAt"
    type: "Date"
  - name: "trainingDatasetType"
    type: "TrainingDatasetType"
  - name: "performance"
    type: "ModelPerformance"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "model"
    type: "Model"
    multiplicity: "ManyToOne"
  - name: "featureDefinitions"
    type: "FeatureDefinition"
    multiplicity: "ManyToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
  - name: "dataSources"
    type: "DataSource"
    multiplicity: "ManyToMany"
- name: "FeatureDefinition"
  description: "Specification of an input variable available for training and scoring."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "FeatureDataType"
  - name: "description"
    type: "String"
  relations:
  - name: "modelVersions"
    type: "ModelVersion"
    multiplicity: "ManyToMany"
- name: "FeatureVector"
  description: "Set of computed feature values used during a specific risk assessment."
  data:
  - name: "computedAt"
    type: "Date"
  relations:
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "OneToOne"
  - name: "featureValues"
    type: "FeatureValue"
    multiplicity: "OneToMany"
- name: "FeatureValue"
  description: "Concrete value for a feature as used in scoring, stored in a flexible\
    \ representation."
  data:
  - name: "featureName"
    type: "String"
  - name: "numericValue"
    type: "Decimal"
  - name: "textValue"
    type: "String"
  - name: "booleanValue"
    type: "Boolean"
  - name: "timestampValue"
    type: "Date"
  relations:
  - name: "featureVector"
    type: "FeatureVector"
    multiplicity: "ManyToOne"
  - name: "definition"
    type: "FeatureDefinition"
    multiplicity: "ManyToOne"
- name: "WatchlistEntry"
  description: "External or internal listing of entities of concern used for screening."
  data:
  - name: "listName"
    type: "String"
  - name: "entityType"
    type: "WatchlistEntityType"
  - name: "reference"
    type: "String"
  - name: "reason"
    type: "String"
  - name: "listedAt"
    type: "Date"
  - name: "expiresAt"
    type: "Date"
  relations:
  - name: "profiles"
    type: "CustomerProfile"
    multiplicity: "ManyToMany"
  - name: "merchants"
    type: "Merchant"
    multiplicity: "ManyToMany"
  - name: "devices"
    type: "Device"
    multiplicity: "ManyToMany"
- name: "IdentityVerification"
  description: "KYC/KYB verification result used as input into fraud decisions."
  data:
  - name: "provider"
    type: "String"
  - name: "checkedAt"
    type: "Date"
  - name: "status"
    type: "IdentityVerificationStatus"
  - name: "reference"
    type: "String"
  - name: "riskLevel"
    type: "RiskLevel"
  relations:
  - name: "profile"
    type: "CustomerProfile"
    multiplicity: "ManyToOne"
- name: "DataSource"
  description: "Origin of data used for model training or scoring, including refresh\
    \ and retention properties."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  - name: "refreshIntervalMinutes"
    type: "Integer"
  relations:
  - name: "modelVersions"
    type: "ModelVersion"
    multiplicity: "ManyToMany"
enums:
- name: "TransactionType"
  description: "Classification of financial or account activity under evaluation."
  data:
  - name: "Payment"
  - name: "Transfer"
  - name: "Withdrawal"
  - name: "Deposit"
  - name: "Purchase"
  - name: "Payout"
- name: "PaymentMethod"
  description: "Instrument or rail used to move funds or value."
  data:
  - name: "Card"
  - name: "BankTransfer"
  - name: "Wallet"
  - name: "Crypto"
  - name: "Cash"
  - name: "DirectDebit"
- name: "ChannelType"
  description: "Access channel through which activity is initiated."
  data:
  - name: "Web"
  - name: "Mobile"
  - name: "API"
  - name: "POS"
  - name: "CallCenter"
- name: "TransactionStatus"
  description: "Lifecycle state of a transaction from authorization to post-processing."
  data:
  - name: "Pending"
  - name: "Authorized"
  - name: "Captured"
  - name: "Settled"
  - name: "Declined"
  - name: "Reversed"
  - name: "Chargeback"
- name: "AlertSeverity"
  description: "Relative urgency and potential impact of a detected fraud signal."
  data:
  - name: "Low"
  - name: "Medium"
  - name: "High"
  - name: "Critical"
- name: "AlertStatus"
  description: "Workflow state of an alert from creation to resolution or suppression."
  data:
  - name: "New"
  - name: "Triaged"
  - name: "Suppressed"
  - name: "PromotedToCase"
  - name: "Resolved"
- name: "CaseStatus"
  description: "Progress state of an investigation."
  data:
  - name: "Open"
  - name: "InReview"
  - name: "Escalated"
  - name: "Closed"
- name: "CasePriority"
  description: "Operational priority used to order investigative work."
  data:
  - name: "P1"
  - name: "P2"
  - name: "P3"
  - name: "P4"
- name: "DecisionOutcome"
  description: "Adjudication result applied to the activity or subject under review."
  data:
  - name: "Approve"
  - name: "Challenge"
  - name: "Decline"
  - name: "Review"
- name: "ActionType"
  description: "Operational control enacted to mitigate detected fraud risk."
  data:
  - name: "BlockAccount"
  - name: "HoldTransaction"
  - name: "RequireStepUpAuth"
  - name: "NotifyCustomer"
  - name: "AddToWatchlist"
  - name: "RemoveFromWatchlist"
  - name: "FileRegulatoryReport"
- name: "RuleType"
  description: "Category of deterministic logic used in fraud detection."
  data:
  - name: "Velocity"
  - name: "GeolocationAnomaly"
  - name: "DeviceMismatch"
  - name: "BehaviorDeviation"
  - name: "ListMatch"
  - name: "NetworkRisk"
  - name: "ModelScoreThreshold"
- name: "RuleStatus"
  description: "Deployment and execution state of a rule."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Disabled"
  - name: "Shadow"
- name: "ModelType"
  description: "Learning paradigm or technique employed by a fraud model."
  data:
  - name: "Supervised"
  - name: "Unsupervised"
  - name: "SemiSupervised"
  - name: "RulesHybrid"
  - name: "Graph"
- name: "TrainingDatasetType"
  description: "Nature of data used to train or calibrate the model."
  data:
  - name: "HistoricalLabeled"
  - name: "StreamingWindowed"
  - name: "SyntheticAugmented"
- name: "FeatureDataType"
  description: "Primitive type of a feature value."
  data:
  - name: "Numeric"
  - name: "Categorical"
  - name: "Boolean"
  - name: "Text"
  - name: "Timestamp"
  - name: "Vector"
- name: "RiskLevel"
  description: "Discrete banding of risk used for policy and workflow routing."
  data:
  - name: "Low"
  - name: "Moderate"
  - name: "High"
  - name: "Severe"
- name: "IdentityVerificationStatus"
  description: "Result of a KYC or KYB verification attempt."
  data:
  - name: "Passed"
  - name: "Failed"
  - name: "Pending"
  - name: "NotAttempted"
- name: "WatchlistEntityType"
  description: "Type of entity represented by a watchlist entry."
  data:
  - name: "Person"
  - name: "Merchant"
  - name: "Device"
  - name: "Account"
  - name: "Email"
  - name: "Phone"
  - name: "IP"
- name: "AuthenticationResult"
  description: "Outcome of an authentication event."
  data:
  - name: "Success"
  - name: "Failure"
  - name: "Challenge"
  - name: "Locked"
- name: "InvestigatorRole"
  description: "Functional role of an investigator within the fraud team."
  data:
  - name: "Analyst"
  - name: "SeniorAnalyst"
  - name: "Supervisor"
- name: "DevicePlatform"
  description: "Execution environment of the device used to access services."
  data:
  - name: "iOS"
  - name: "Android"
  - name: "Web"
  - name: "Desktop"
  - name: "Other"
- name: "NetworkType"
  description: "Classification of the network from which activity originated."
  data:
  - name: "Residential"
  - name: "Corporate"
  - name: "Mobile"
  - name: "Hosting"
  - name: "Tor"
  - name: "VPN"
  - name: "Unknown"
- name: "AccountType"
  description: "Category of account being monitored for fraud risk."
  data:
  - name: "Checking"
  - name: "Savings"
  - name: "CreditCard"
  - name: "Wallet"
  - name: "Loan"
- name: "AccountStatus"
  description: "Operational standing of an account with respect to usage controls."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Closed"
  - name: "Frozen"
valueObjects:
- name: "Money"
  description: "Monetary value with associated currency used for transaction amounts\
    \ and balances."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "RiskScore"
  description: "Continuous score representing estimated fraud risk on a defined scale."
  data:
  - name: "value"
    type: "Decimal"
  - name: "scale"
    type: "String"
- name: "IPAddress"
  description: "IPv4 or IPv6 textual representation used for network risk evaluation."
  data:
  - name: "value"
    type: "String"
- name: "GeoPoint"
  description: "Geographic location expressed as latitude and longitude with optional\
    \ accuracy."
  data:
  - name: "latitude"
    type: "Decimal"
  - name: "longitude"
    type: "Decimal"
  - name: "accuracyMeters"
    type: "Integer"
- name: "DeviceFingerprint"
  description: "Stable hash derived from device characteristics used to recognize\
    \ returning devices."
  data:
  - name: "value"
    type: "String"
  - name: "algorithm"
    type: "String"
- name: "EmailAddress"
  description: "Electronic mail address in a normalized format."
  data:
  - name: "value"
    type: "String"
- name: "PhoneNumber"
  description: "Telephone number represented as a normalized string, typically E.164."
  data:
  - name: "value"
    type: "String"
- name: "ModelPerformance"
  description: "Common evaluation metrics for fraud detection models."
  data:
