  industry: "DataAnalytics"
  category: "Analytics & AI"
  language: "EN"
  type: "Industry"
  domain: "Data Analytics"
entities:
- name: "Organization"
  description: "Legal entity that operates data platforms and analytics initiatives."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "industrySegment"
    type: "String"
  - name: "website"
    type: "URL"
  relations:
  - name: "workspaces"
    type: "Workspace"
    multiplicity: "OneToMany"
  - name: "users"
    type: "User"
    multiplicity: "OneToMany"
- name: "Workspace"
