    multiplicity: "OneToMany"
  - name: "notebooks"
    type: "Notebook"
    multiplicity: "OneToMany"
  - name: "reports"
    type: "Report"
    multiplicity: "OneToMany"
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "OneToMany"
  - name: "models"
    type: "MLModel"
    multiplicity: "OneToMany"
  - name: "glossaryTerms"
