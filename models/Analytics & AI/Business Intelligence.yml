---
metadata:
  name: "Business Intelligence Capabilities Model"
  description: "Canonical HCIDL capabilities model for Business Intelligence, covering\
    \ datasets, metrics, dimensions, dashboards, reports, lineage, quality, and governance."
  version: "1.0.0"
  industry: "Cross-industry"
  category: "Analytics & AI"
  type: "Capability"
  domain: "Business Intelligence"
entities:
- name: "BIUser"
  description: "Person who designs, administers, or consumes Business Intelligence\
    \ content."
  data:
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "role"
    type: "RoleType"
  - name: "isActive"
    type: "Boolean"
  - name: "locale"
    type: "String"
  - name: "timezone"
    type: "String"
  relations:
  - name: "groups"
    type: "UserGroup"
    multiplicity: "ManyToMany"
  - name: "accessGrants"
    type: "AccessGrant"
    multiplicity: "OneToMany"
  - name: "ownedDatasets"
    type: "Dataset"
    multiplicity: "OneToMany"
  - name: "ownedDashboards"
    type: "Dashboard"
    multiplicity: "OneToMany"
  - name: "ownedReports"
    type: "Report"
    multiplicity: "OneToMany"
  - name: "ownedMetrics"
    type: "Metric"
    multiplicity: "OneToMany"
- name: "UserGroup"
  description: "Collection of users managed together for shared access and governance."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "String"
  relations:
  - name: "members"
    type: "BIUser"
    multiplicity: "ManyToMany"
  - name: "accessGrants"
    type: "AccessGrant"
    multiplicity: "OneToMany"
- name: "DataSource"
  description: "External system or location that provides raw data for analytics."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "SourceType"
  - name: "format"
    type: "DataFormat"
  - name: "host"
    type: "String"
  - name: "path"
    type: "String"
  - name: "database"
    type: "String"
  - name: "schema"
    type: "String"
  - name: "connectionUri"
    type: "URI"
  - name: "ownerEmail"
    type: "EmailAddress"
  relations:
  - name: "owners"
    type: "BIUser"
    multiplicity: "ManyToMany"
  - name: "ingestionJobs"
    type: "DataIngestionJob"
    multiplicity: "OneToMany"
  - name: "assets"
    type: "DataAsset"
    multiplicity: "OneToMany"
- name: "DataIngestionJob"
  description: "Orchestrated job that moves and prepares data from a source into analytical\
    \ storage."
  data:
  - name: "name"
    type: "String"
  - name: "frequency"
    type: "ScheduleFrequency"
  - name: "schedule"
    type: "CronSchedule"
  - name: "status"
    type: "IngestionStatus"
  - name: "loadType"
    type: "LoadType"
  - name: "lastRunAt"
    type: "DateTime"
  - name: "lastRunDurationSeconds"
    type: "Integer"
  - name: "isEnabled"
    type: "Boolean"
  relations:
  - name: "dataSource"
    type: "DataSource"
    multiplicity: "ManyToOne"
  - name: "targetDataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "refreshHistory"
    type: "RefreshHistory"
    multiplicity: "OneToMany"
  - name: "createdBy"
    type: "BIUser"
    multiplicity: "ManyToOne"
- name: "Dataset"
  description: "Curated, queryable dataset used by dashboards, reports, and ad-hoc\
    \ analysis."
  data:
  - name: "name"
    type: "String"
  - name: "domain"
    type: "String"
  - name: "grain"
    type: "Grain"
  - name: "sensitivity"
    type: "SensitivityLevel"
  - name: "storageFormat"
    type: "DataFormat"
  - name: "schemaVersion"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  - name: "certification"
    type: "CertificationStatus"
  - name: "refreshEnabled"
    type: "Boolean"
  relations:
  - name: "owner"
    type: "BIUser"
    multiplicity: "ManyToOne"
  - name: "fields"
    type: "DataField"
    multiplicity: "OneToMany"
  - name: "metrics"
    type: "Metric"
    multiplicity: "ManyToMany"
  - name: "dimensions"
    type: "Dimension"
    multiplicity: "ManyToMany"
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "ManyToMany"
  - name: "reports"
    type: "Report"
    multiplicity: "ManyToMany"
  - name: "ingestionJobs"
    type: "DataIngestionJob"
    multiplicity: "OneToMany"
  - name: "qualityRules"
    type: "DataQualityRule"
    multiplicity: "OneToMany"
  - name: "refreshHistory"
    type: "RefreshHistory"
    multiplicity: "OneToMany"
  - name: "queryLogs"
    type: "QueryLog"
    multiplicity: "OneToMany"
  - name: "terms"
    type: "BusinessTerm"
    multiplicity: "ManyToMany"
  - name: "catalogEntry"
    type: "DataAsset"
    multiplicity: "OneToOne"
- name: "DataField"
  description: "Column within a dataset with defined type, aggregation behavior, and\
    \ formatting."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "aggregation"
    type: "AggregationFunction"
  - name: "nullable"
    type: "Boolean"
  - name: "formatPattern"
    type: "String"
  - name: "length"
    type: "Integer"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "mapsToDimension"
    type: "Dimension"
    multiplicity: "ManyToOne"
  - name: "businessTerm"
    type: "BusinessTerm"
    multiplicity: "ManyToOne"
- name: "Metric"
  description: "Business KPI or measure with a reusable calculation and semantics."
  data:
  - name: "name"
    type: "String"
  - name: "metricType"
    type: "MetricType"
  - name: "expression"
    type: "SqlText"
  - name: "aggregation"
    type: "AggregationFunction"
  - name: "formatPattern"
    type: "String"
  - name: "isAdditive"
    type: "Boolean"
  - name: "targetDirection"
    type: "TargetDirection"
  relations:
  - name: "owner"
    type: "BIUser"
    multiplicity: "ManyToOne"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "fields"
    type: "DataField"
    multiplicity: "ManyToMany"
  - name: "terms"
    type: "BusinessTerm"
    multiplicity: "ManyToMany"
  - name: "catalogEntry"
    type: "DataAsset"
    multiplicity: "OneToOne"
- name: "Dimension"
  description: "Descriptive attribute structure used to slice, filter, and group measures."
  data:
  - name: "name"
    type: "String"
  - name: "grain"
    type: "Grain"
  - name: "isConformed"
    type: "Boolean"
  relations:
  - name: "attributes"
    type: "DimensionAttribute"
    multiplicity: "OneToMany"
  - name: "hierarchies"
    type: "DimensionHierarchy"
    multiplicity: "OneToMany"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "terms"
    type: "BusinessTerm"
    multiplicity: "ManyToMany"
- name: "DimensionAttribute"
  description: "Attribute that belongs to a dimension and may serve as a key or descriptor."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "DataType"
  - name: "isKey"
    type: "Boolean"
  - name: "isSCD"
    type: "Boolean"
  relations:
  - name: "dimension"
    type: "Dimension"
    multiplicity: "ManyToOne"
- name: "DimensionHierarchy"
  description: "Ordered collection of levels that define drill paths within a dimension."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "dimension"
    type: "Dimension"
    multiplicity: "ManyToOne"
  - name: "levels"
    type: "HierarchyLevel"
    multiplicity: "OneToMany"
- name: "HierarchyLevel"
  description: "Specific level within a dimension hierarchy with a defined drill order."
  data:
  - name: "name"
    type: "String"
  - name: "ordinal"
    type: "Integer"
  relations:
  - name: "hierarchy"
    type: "DimensionHierarchy"
    multiplicity: "ManyToOne"
  - name: "attribute"
    type: "DimensionAttribute"
    multiplicity: "ManyToOne"
- name: "Report"
  description: "Formal, versioned artifact that answers predefined business questions."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "ReportStatus"
  - name: "frequency"
    type: "ScheduleFrequency"
  - name: "publishWindow"
    type: "TimePeriod"
  - name: "queryEngine"
    type: "QueryEngineType"
  - name: "parametersJson"
    type: "String"
  - name: "lastPublishedAt"
    type: "DateTime"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "metrics"
    type: "Metric"
    multiplicity: "ManyToMany"
  - name: "filters"
    type: "Filter"
    multiplicity: "OneToMany"
  - name: "owner"
    type: "BIUser"
    multiplicity: "ManyToOne"
  - name: "distributionLists"
    type: "DistributionList"
    multiplicity: "ManyToMany"
  - name: "catalogEntry"
    type: "DataAsset"
    multiplicity: "OneToOne"
  - name: "visualizations"
    type: "Visualization"
    multiplicity: "OneToMany"
  - name: "queryLogs"
    type: "QueryLog"
    multiplicity: "OneToMany"
- name: "Dashboard"
  description: "Interactive collection of visualizations for monitoring and exploration."
  data:
  - name: "name"
    type: "String"
  - name: "layout"
    type: "DashboardLayout"
  - name: "status"
    type: "ReportStatus"
  - name: "theme"
    type: "String"
  - name: "lastPublishedAt"
    type: "DateTime"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "metrics"
    type: "Metric"
    multiplicity: "ManyToMany"
  - name: "filters"
    type: "Filter"
    multiplicity: "OneToMany"
  - name: "tiles"
    type: "Visualization"
    multiplicity: "OneToMany"
  - name: "owner"
    type: "BIUser"
    multiplicity: "ManyToOne"
  - name: "catalogEntry"
    type: "DataAsset"
    multiplicity: "OneToOne"
  - name: "queryLogs"
    type: "QueryLog"
    multiplicity: "OneToMany"
- name: "Visualization"
  description: "Chart or table with defined encodings and mappings to dataset fields."
  data:
  - name: "title"
    type: "String"
  - name: "visualizationType"
    type: "VisualizationType"
  - name: "xField"
    type: "String"
  - name: "yField"
    type: "String"
  - name: "colorField"
    type: "String"
  - name: "sortOrder"
    type: "String"
  - name: "showLegend"
    type: "Boolean"
  relations:
  - name: "dashboard"
    type: "Dashboard"
    multiplicity: "ManyToOne"
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "metrics"
    type: "Metric"
    multiplicity: "ManyToMany"
  - name: "filters"
    type: "Filter"
    multiplicity: "ManyToMany"
  - name: "report"
    type: "Report"
    multiplicity: "ManyToOne"
- name: "Filter"
  description: "Declarative constraint applied to datasets, visualizations, or reports."
  data:
  - name: "fieldName"
    type: "String"
  - name: "operator_"
    type: "FilterOperator"
  - name: "value"
    type: "String"
  - name: "includeBlanks"
    type: "Boolean"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
- name: "AccessGrant"
  description: "Permission record assigning a principal access to a specific BI asset."
  data:
  - name: "accessLevel"
    type: "AccessLevel"
  - name: "grantedAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  relations:
  - name: "principalUser"
    type: "BIUser"
    multiplicity: "ManyToOne"
  - name: "principalGroup"
    type: "UserGroup"
    multiplicity: "ManyToOne"
  - name: "targetDataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "targetReport"
    type: "Report"
    multiplicity: "ManyToOne"
  - name: "targetDashboard"
    type: "Dashboard"
    multiplicity: "ManyToOne"
- name: "DataQualityRule"
  description: "Configured validation used to assess data fitness and reliability."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "RuleType"
  - name: "targetField"
    type: "String"
  - name: "thresholdDecimal"
    type: "Decimal"
  - name: "severity"
    type: "SeverityLevel"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "evaluations"
    type: "DataQualityResult"
    multiplicity: "OneToMany"
  - name: "owner"
    type: "BIUser"
    multiplicity: "ManyToOne"
- name: "DataQualityResult"
  description: "Execution outcome for a quality rule, recorded for a specific evaluation\
    \ time."
  data:
  - name: "evaluatedAt"
    type: "DateTime"
  - name: "passed"
    type: "Boolean"
  - name: "observedValue"
    type: "Decimal"
  - name: "sampleSize"
    type: "Integer"
  - name: "message"
    type: "String"
  relations:
  - name: "rule"
    type: "DataQualityRule"
    multiplicity: "ManyToOne"
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "alert"
    type: "Alert"
    multiplicity: "OneToOne"
- name: "BusinessTerm"
  description: "Standardized business vocabulary term with stewardship and mappings\
    \ to assets."
  data:
  - name: "name"
    type: "String"
  - name: "definition"
    type: "String"
  - name: "synonyms"
    type: "String"
  relations:
  - name: "steward"
    type: "BIUser"
    multiplicity: "ManyToOne"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "metrics"
    type: "Metric"
    multiplicity: "ManyToMany"
  - name: "dimensions"
    type: "Dimension"
    multiplicity: "ManyToMany"
  - name: "dataFields"
    type: "DataField"
    multiplicity: "OneToMany"
- name: "DataAsset"
  description: "Catalog entry representing a discoverable analytical object for governance\
    \ and lineage."
  data:
  - name: "name"
    type: "String"
  - name: "assetType"
    type: "DataAssetType"
  - name: "qualifiedName"
    type: "String"
  - name: "uri"
    type: "URI"
  - name: "certification"
    type: "CertificationStatus"
  relations:
  - name: "steward"
    type: "BIUser"
    multiplicity: "ManyToOne"
  - name: "terms"
    type: "BusinessTerm"
    multiplicity: "ManyToMany"
- name: "LineageEdge"
  description: "Directed relationship describing how one asset contributes to another."
  data:
  - name: "relationType"
    type: "LineageRelationType"
  - name: "createdAt"
    type: "DateTime"
  - name: "notes"
    type: "String"
  relations:
  - name: "upstream"
    type: "DataAsset"
    multiplicity: "ManyToOne"
  - name: "downstream"
    type: "DataAsset"
    multiplicity: "ManyToOne"
- name: "RefreshHistory"
  description: "Historical record of dataset refresh or ingestion job execution."
  data:
  - name: "runStartedAt"
    type: "DateTime"
  - name: "runEndedAt"
    type: "DateTime"
  - name: "status"
    type: "IngestionStatus"
  - name: "rowsProcessed"
    type: "Integer"
  - name: "errorMessage"
    type: "String"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "ingestionJob"
    type: "DataIngestionJob"
    multiplicity: "ManyToOne"
- name: "QueryLog"
  description: "Audit trail entry for interactive or scheduled analytical queries."
  data:
  - name: "submittedAt"
    type: "DateTime"
  - name: "queryEngine"
    type: "QueryEngineType"
  - name: "durationMs"
    type: "Integer"
  - name: "text"
    type: "SqlText"
  - name: "rowsReturned"
    type: "Integer"
  - name: "cacheHit"
    type: "Boolean"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "BIUser"
    multiplicity: "ManyToOne"
  - name: "visualization"
    type: "Visualization"
    multiplicity: "ManyToOne"
  - name: "report"
    type: "Report"
    multiplicity: "ManyToOne"
  - name: "dashboard"
    type: "Dashboard"
    multiplicity: "ManyToOne"
- name: "Alert"
  description: "Notification triggered by data quality failures, anomalies, or operational\
    \ issues."
  data:
  - name: "name"
    type: "String"
  - name: "severity"
    type: "SeverityLevel"
  - name: "createdAt"
    type: "DateTime"
  - name: "message"
    type: "String"
  - name: "acknowledged"
    type: "Boolean"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "rule"
    type: "DataQualityRule"
    multiplicity: "ManyToOne"
  - name: "recipients"
    type: "BIUser"
    multiplicity: "ManyToMany"
  - name: "result"
    type: "DataQualityResult"
    multiplicity: "OneToOne"
- name: "DistributionList"
  description: "Named set of recipients used for scheduled delivery of reports and\
    \ alerts."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "String"
  relations:
  - name: "members"
    type: "BIUser"
    multiplicity: "ManyToMany"
  - name: "reports"
    type: "Report"
    multiplicity: "OneToMany"
- name: "SemanticModel"
  description: "Logical semantic layer defining measures, dimensions, and relationships\
    \ for a subject area."
  data:
  - name: "name"
    type: "String"
  - name: "approach"
    type: "ModelingApproach"
  - name: "version"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "metrics"
    type: "Metric"
    multiplicity: "OneToMany"
  - name: "dimensions"
    type: "Dimension"
    multiplicity: "OneToMany"
  - name: "owner"
    type: "BIUser"
    multiplicity: "ManyToOne"
  - name: "catalogEntry"
    type: "DataAsset"
    multiplicity: "OneToOne"
enums:
- name: "SourceType"
  description: "Type of upstream source from which data is acquired."
  data:
  - name: "Database"
  - name: "DataWarehouse"
  - name: "DataLake"
  - name: "File"
  - name: "API"
  - name: "Streaming"
  - name: "SaaS"
- name: "DataFormat"
  description: "Serialization or storage format for data at rest or in motion."
  data:
  - name: "CSV"
  - name: "JSON"
  - name: "Parquet"
  - name: "Avro"
  - name: "ORC"
  - name: "XML"
  - name: "Excel"
- name: "IngestionStatus"
  description: "Lifecycle state of an ingestion job or refresh execution."
  data:
  - name: "Draft"
  - name: "Scheduled"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Paused"
  - name: "Cancelled"
- name: "ScheduleFrequency"
  description: "Planned cadence for executions and publications."
  data:
  - name: "Adhoc"
  - name: "Hourly"
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Quarterly"
- name: "LoadType"
  description: "Method used to load or synchronize data during ingestion."
  data:
  - name: "Full"
  - name: "Incremental"
  - name: "Snapshot"
  - name: "CDC"
- name: "DataType"
  description: "Fundamental data types used to describe dataset fields."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime"
  - name: "Binary"
  - name: "Geo"
- name: "AggregationFunction"
  description: "Aggregations applicable to numeric or categorical data."
  data:
  - name: "None"
  - name: "Sum"
  - name: "Avg"
  - name: "Min"
  - name: "Max"
  - name: "Count"
  - name: "DistinctCount"
  - name: "Median"
  - name: "Percentile"
- name: "MetricType"
  description: "Category describing the nature and interpretation of a metric."
  data:
  - name: "Absolute"
  - name: "Ratio"
  - name: "Percentage"
  - name: "Currency"
  - name: "Rate"
  - name: "Duration"
  - name: "Index"
- name: "VisualizationType"
  description: "Visual representation used to present dataset results."
  data:
  - name: "Table"
  - name: "Bar"
  - name: "Column"
  - name: "Line"
  - name: "Area"
  - name: "Pie"
  - name: "Donut"
  - name: "Scatter"
  - name: "Bubble"
  - name: "Heatmap"
  - name: "Map"
  - name: "KPI"
  - name: "Treemap"
  - name: "Waterfall"
- name: "DashboardLayout"
  description: "Arrangement approach for positioning visualizations on a dashboard."
  data:
  - name: "Grid"
  - name: "Tiled"
  - name: "Freeform"
- name: "ReportStatus"
  description: "Publication and lifecycle status for reports and dashboards."
  data:
  - name: "Draft"
  - name: "Published"
  - name: "Archived"
  - name: "Deprecated"
- name: "AccessLevel"
  description: "Level of permissions granted to a principal on a BI asset."
  data:
  - name: "View"
  - name: "Explore"
  - name: "Edit"
  - name: "Admin"
  - name: "Owner"
- name: "RoleType"
  description: "Primary role of a user within the Business Intelligence ecosystem."
  data:
  - name: "Executive"
  - name: "Analyst"
  - name: "Developer"
  - name: "DataSteward"
  - name: "Viewer"
  - name: "Administrator"
- name: "RuleType"
  description: "Type of data quality validation applied to datasets or fields."
  data:
  - name: "Completeness"
  - name: "Uniqueness"
  - name: "Validity"
  - name: "Consistency"
  - name: "Freshness"
  - name: "Accuracy"
  - name: "ReferentialIntegrity"
- name: "SeverityLevel"
  description: "Criticality level associated with alerts and quality rule outcomes."
  data:
  - name: "Info"
  - name: "Warning"
  - name: "Critical"
- name: "LineageRelationType"
  description: "Nature of transformation or dependency between upstream and downstream\
    \ assets."
  data:
  - name: "DerivedFrom"
  - name: "CopiedFrom"
  - name: "JoinedFrom"
  - name: "AggregatedFrom"
  - name: "TransformedFrom"
  - name: "MaskedFrom"
- name: "SensitivityLevel"
  description: "Classification indicating confidentiality and handling requirements."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Confidential"
  - name: "Restricted"
