---
metadata:
  name: "Machine Learning Capabilities Model"
  description: "End-to-end capability model for managing the machine learning lifecycle\
    \ including data, experimentation, model management, deployment, and monitoring."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Analytics & AI"
  type: "Capability"
  domain: "Machine Learning"
entities:
- name: "Workspace"
  description: "Organizational boundary for machine learning assets, resources, and\
    \ governance."
  data:
  - name: "name"
    type: "String"
  - name: "organization"
    type: "String"
  - name: "region"
    type: "String"
  - name: "defaultStorage"
    type: "URI"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "projects"
    type: "Project"
    multiplicity: "OneToMany"
  - name: "dataSources"
    type: "DataSource"
    multiplicity: "OneToMany"
  - name: "featureStores"
    type: "FeatureStore"
    multiplicity: "OneToMany"
  - name: "computeResources"
    type: "ComputeResource"
    multiplicity: "OneToMany"
  - name: "registries"
    type: "ModelRegistry"
    multiplicity: "OneToMany"
  - name: "governancePolicies"
    type: "GovernancePolicy"
    multiplicity: "OneToMany"
- name: "Project"
  description: "Collection of ML objectives, datasets, experiments, and models pursuing\
    \ a specific business outcome."
  data:
  - name: "name"
    type: "String"
  - name: "objective"
    type: "String"
  - name: "problemType"
    type: "ProblemType"
  - name: "status"
    type: "ProjectStatus"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "OneToMany"
  - name: "experiments"
    type: "Experiment"
    multiplicity: "OneToMany"
  - name: "pipelines"
    type: "Pipeline"
    multiplicity: "OneToMany"
  - name: "modelDefinitions"
    type: "ModelDefinition"
    multiplicity: "OneToMany"
  - name: "notebooks"
    type: "Notebook"
    multiplicity: "OneToMany"
- name: "DataSource"
  description: "External system or storage location from which raw data is ingested\
    \ for machine learning."
  data:
  - name: "name"
    type: "String"
  - name: "connectionType"
    type: "DataConnectionType"
  - name: "endpoint"
    type: "URI"
  - name: "authentication"
    type: "AuthMethod"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "OneToMany"
- name: "Dataset"
  description: "Curated collection of data prepared for machine learning use."
  data:
  - name: "name"
    type: "String"
  - name: "format"
    type: "DatasetFormat"
  - name: "storageLocation"
    type: "URI"
  - name: "recordCount"
    type: "Integer"
  - name: "schemaDefinition"
    type: "SchemaDefinition"
  - name: "refreshInterval"
    type: "Duration"
  - name: "sensitivity"
    type: "DataSensitivity"
  relations:
  - name: "dataSource"
    type: "DataSource"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "DataVersion"
    multiplicity: "OneToMany"
  - name: "features"
    type: "Feature"
    multiplicity: "OneToMany"
  - name: "labelingProjects"
    type: "DataLabelingProject"
    multiplicity: "OneToMany"
  - name: "projects"
    type: "Project"
    multiplicity: "ManyToMany"
- name: "DataVersion"
  description: "Immutable snapshot of a dataset used for reproducible experimentation\
    \ and evaluation."
  data:
  - name: "versionTag"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "checksum"
    type: "Checksum"
  - name: "snapshotLocation"
    type: "URI"
  - name: "size"
    type: "ResourceSize"
  - name: "rowCount"
    type: "Integer"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "splits"
    type: "DataSplit"
    multiplicity: "OneToMany"
  - name: "artifacts"
    type: "Artifact"
    multiplicity: "OneToMany"
- name: "DataSplit"
  description: "Logical subset of a data version assigned a role such as training,\
    \ validation, or test."
  data:
  - name: "role"
    type: "DatasetRole"
  - name: "percentage"
    type: "Percent"
  - name: "selectionCriteria"
    type: "String"
  relations:
  - name: "dataVersion"
    type: "DataVersion"
    multiplicity: "ManyToOne"
- name: "Feature"
  description: "Measurable property or attribute used by an ML model."
  data:
  - name: "name"
    type: "String"
  - name: "featureType"
    type: "FeatureType"
  - name: "dataType"
    type: "DataType"
  - name: "descriptionText"
    type: "String"
  - name: "transformation"
    type: "String"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "featureSet"
    type: "FeatureSet"
    multiplicity: "ManyToOne"
- name: "FeatureSet"
  description: "Versioned group of features curated for training and inference."
  data:
  - name: "name"
    type: "String"
  - name: "versionTag"
    type: "String"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "features"
    type: "Feature"
    multiplicity: "OneToMany"
  - name: "featureStore"
    type: "FeatureStore"
    multiplicity: "ManyToOne"
  - name: "projects"
    type: "Project"
    multiplicity: "ManyToMany"
- name: "FeatureStore"
  description: "System for managing and serving features consistently to training\
    \ and online inference."
  data:
  - name: "name"
    type: "String"
  - name: "storageType"
    type: "StorageType"
  - name: "onlineEnabled"
    type: "Boolean"
  - name: "offlineEnabled"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "featureSets"
    type: "FeatureSet"
    multiplicity: "OneToMany"
- name: "Experiment"
  description: "Scientifically controlled study for comparing model configurations\
    \ and outcomes."
  data:
  - name: "name"
    type: "String"
  - name: "purpose"
    type: "String"
  - name: "optimizationMetric"
    type: "String"
  - name: "optimizationDirection"
    type: "OptimizationDirection"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "runs"
    type: "Run"
    multiplicity: "OneToMany"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
- name: "Run"
  description: "Single execution of a training or evaluation process producing artifacts\
    \ and metrics."
  data:
  - name: "startTime"
    type: "DateTime"
  - name: "endTime"
    type: "DateTime"
  - name: "status"
    type: "RunStatus"
  - name: "randomSeed"
    type: "Integer"
  - name: "notes"
    type: "String"
  relations:
  - name: "experiment"
    type: "Experiment"
    multiplicity: "ManyToOne"
  - name: "inputDataVersions"
    type: "DataVersion"
    multiplicity: "ManyToMany"
  - name: "featureSet"
    type: "FeatureSet"
    multiplicity: "ManyToOne"
  - name: "parameters"
    type: "Parameter"
    multiplicity: "OneToMany"
  - name: "metrics"
    type: "Metric"
    multiplicity: "OneToMany"
  - name: "artifacts"
    type: "Artifact"
    multiplicity: "OneToMany"
  - name: "computeResource"
    type: "ComputeResource"
    multiplicity: "ManyToOne"
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "OneToOne"
- name: "Parameter"
  description: "Hyperparameter or configuration setting used for a run."
  data:
  - name: "name"
    type: "String"
  - name: "value"
    type: "String"
  - name: "parameterType"
    type: "ParameterType"
  relations:
  - name: "run"
    type: "Run"
    multiplicity: "ManyToOne"
- name: "Metric"
  description: "Quantitative performance or diagnostic measurement captured during\
    \ a run or evaluation."
  data:
  - name: "name"
    type: "String"
  - name: "metricType"
    type: "MetricType"
  - name: "value"
    type: "Decimal"
  - name: "step"
    type: "Integer"
  - name: "datasetRole"
    type: "DatasetRole"
  relations:
  - name: "run"
    type: "Run"
    multiplicity: "ManyToOne"
- name: "Artifact"
  description: "Versioned file or object generated or consumed in the ML lifecycle\
    \ such as models, datasets, or reports."
  data:
  - name: "name"
    type: "String"
  - name: "artifactType"
    type: "ArtifactType"
  - name: "uri"
    type: "URI"
  - name: "checksum"
    type: "Checksum"
  - name: "createdAt"
    type: "DateTime"
  relations:
  - name: "producingRun"
    type: "Run"
    multiplicity: "ManyToOne"
  - name: "consumingSteps"
    type: "PipelineStep"
    multiplicity: "ManyToMany"
- name: "ComputeResource"
  description: "Computational resource used to execute ML workloads."
  data:
  - name: "name"
    type: "String"
  - name: "computeType"
    type: "ComputeType"
  - name: "cpuCores"
    type: "Integer"
  - name: "memoryGb"
    type: "Integer"
  - name: "gpuCount"
    type: "Integer"
  - name: "deviceType"
    type: "DeviceType"
  - name: "region"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "assignedRuns"
    type: "Run"
    multiplicity: "OneToMany"
- name: "ModelDefinition"
  description: "Conceptual model design including framework and intended objective."
  data:
  - name: "name"
    type: "String"
  - name: "framework"
    type: "MLFramework"
  - name: "frameworkVersion"
    type: "String"
  - name: "problemType"
    type: "ProblemType"
  - name: "objectiveMetric"
    type: "String"
  - name: "signature"
    type: "ModelSignature"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "ModelVersion"
    multiplicity: "OneToMany"
  - name: "trainingPipelines"
    type: "Pipeline"
    multiplicity: "OneToMany"
- name: "ModelVersion"
  description: "Immutable packaged model resulting from a run, ready for evaluation,\
    \ registration, and deployment."
  data:
  - name: "versionTag"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "stage"
    type: "ModelStage"
  - name: "artifactUri"
    type: "URI"
  - name: "parametersSnapshot"
    type: "String"
  relations:
  - name: "modelDefinition"
    type: "ModelDefinition"
    multiplicity: "ManyToOne"
  - name: "sourceRun"
    type: "Run"
    multiplicity: "ManyToOne"
  - name: "evaluations"
    type: "EvaluationResult"
    multiplicity: "OneToMany"
  - name: "deployments"
    type: "Deployment"
    multiplicity: "OneToMany"
  - name: "registryEntry"
    type: "RegistryEntry"
    multiplicity: "OneToOne"
  - name: "modelCard"
    type: "ModelCard"
    multiplicity: "OneToOne"
- name: "EvaluationResult"
  description: "Structured assessment of a model version on a specific dataset version."
  data:
  - name: "evaluatedAt"
    type: "DateTime"
  - name: "datasetRole"
    type: "DatasetRole"
  - name: "summary"
    type: "String"
  relations:
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
  - name: "dataVersion"
    type: "DataVersion"
    multiplicity: "ManyToOne"
  - name: "metrics"
    type: "Metric"
    multiplicity: "OneToMany"
- name: "ModelRegistry"
  description: "Catalog that governs discoverability, lineage, and promotion of model\
    \ versions."
  data:
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
  - name: "entries"
    type: "RegistryEntry"
    multiplicity: "OneToMany"
- name: "RegistryEntry"
  description: "Registration record tracking approval, stage, and stewardship for\
    \ a model version."
  data:
  - name: "name"
    type: "String"
  - name: "stage"
    type: "RegistryStage"
  - name: "approvalStatus"
    type: "GovernanceStatus"
  - name: "reviewer"
    type: "String"
  - name: "approvedAt"
    type: "DateTime"
  relations:
  - name: "registry"
    type: "ModelRegistry"
    multiplicity: "ManyToOne"
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "OneToOne"
- name: "Deployment"
  description: "Realization of a model version in an executable environment to serve\
    \ predictions."
  data:
  - name: "environment"
    type: "EnvironmentType"
  - name: "target"
    type: "DeploymentTarget"
  - name: "status"
    type: "DeploymentStatus"
  - name: "deployedAt"
    type: "DateTime"
  - name: "trafficShare"
    type: "Percent"
  - name: "autoscalingEnabled"
    type: "Boolean"
  relations:
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
  - name: "endpoints"
    type: "Endpoint"
    multiplicity: "OneToMany"
  - name: "monitoringSchedules"
    type: "MonitoringSchedule"
    multiplicity: "OneToMany"
- name: "Endpoint"
  description: "Network-accessible interface exposing a deployed model for inference."
  data:
  - name: "name"
    type: "String"
  - name: "endpointUrl"
    type: "URI"
  - name: "protocol"
    type: "ServingProtocol"
  - name: "inferenceMode"
    type: "InferenceMode"
  - name: "maxConcurrentRequests"
    type: "Integer"
  relations:
  - name: "deployment"
    type: "Deployment"
    multiplicity: "ManyToOne"
  - name: "inferenceLogs"
    type: "InferenceLog"
    multiplicity: "OneToMany"
- name: "InferenceLog"
  description: "Telemetry record for an individual or aggregated inference event."
  data:
  - name: "timestamp"
    type: "DateTime"
  - name: "latencyMs"
    type: "Integer"
  - name: "statusCode"
    type: "Integer"
  - name: "requestPayloadRef"
    type: "URI"
  - name: "responsePayloadRef"
    type: "URI"
  relations:
  - name: "endpoint"
    type: "Endpoint"
    multiplicity: "ManyToOne"
- name: "MonitoringSchedule"
  description: "Time-based or event-based execution plan for monitoring a deployment."
  data:
  - name: "name"
    type: "String"
  - name: "monitorType"
    type: "MonitorType"
  - name: "interval"
    type: "Duration"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "deployment"
    type: "Deployment"
    multiplicity: "ManyToOne"
  - name: "reports"
    type: "DriftReport"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
- name: "DriftReport"
  description: "Quantitative analysis describing drift or performance changes over\
    \ time."
  data:
  - name: "generatedAt"
    type: "DateTime"
  - name: "driftType"
    type: "DriftType"
  - name: "pValue"
    type: "Decimal"
  - name: "severity"
    type: "DriftSeverity"
  - name: "detailsRef"
    type: "URI"
  relations:
  - name: "monitoringSchedule"
    type: "MonitoringSchedule"
    multiplicity: "ManyToOne"
  - name: "endpoint"
    type: "Endpoint"
    multiplicity: "ManyToOne"
- name: "Alert"
  description: "Notification indicating a threshold breach or anomaly detected by\
    \ monitoring."
  data:
  - name: "raisedAt"
    type: "DateTime"
  - name: "severity"
    type: "AlertSeverity"
  - name: "message"
    type: "String"
  - name: "status"
    type: "AlertStatus"
  - name: "acknowledgedBy"
    type: "String"
  - name: "resolvedAt"
    type: "DateTime"
  relations:
  - name: "monitoringSchedule"
    type: "MonitoringSchedule"
    multiplicity: "ManyToOne"
  - name: "deployment"
    type: "Deployment"
    multiplicity: "ManyToOne"
- name: "DataLabelingProject"
  description: "Managed effort to create human or programmatic annotations for a dataset."
  data:
  - name: "name"
    type: "String"
  - name: "taskType"
    type: "LabelTaskType"
  - name: "labelSchema"
    type: "String"
  - name: "status"
    type: "LabelingStatus"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "LabelingTask"
    multiplicity: "OneToMany"
  - name: "annotations"
    type: "Annotation"
    multiplicity: "OneToMany"
- name: "LabelingTask"
  description: "Unit of labeling work with instructions and assignment."
  data:
  - name: "instruction"
    type: "String"
  - name: "priority"
    type: "Integer"
  - name: "assignee"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "LabelingStatus"
  relations:
  - name: "labelingProject"
    type: "DataLabelingProject"
    multiplicity: "ManyToOne"
  - name: "annotations"
    type: "Annotation"
    multiplicity: "OneToMany"
- name: "Annotation"
  description: "Label or markup applied to a data item with optional quality metadata."
  data:
  - name: "itemRef"
    type: "URI"
  - name: "label"
    type: "String"
  - name: "confidence"
    type: "Decimal"
  - name: "reviewer"
    type: "String"
  - name: "approved"
    type: "Boolean"
  relations:
  - name: "labelingProject"
    type: "DataLabelingProject"
    multiplicity: "ManyToOne"
  - name: "labelingTask"
    type: "LabelingTask"
    multiplicity: "ManyToOne"
  - name: "dataVersion"
    type: "DataVersion"
    multiplicity: "ManyToOne"
- name: "Pipeline"
  description: "Orchestrated workflow automating ML tasks from ingestion to deployment."
  data:
  - name: "name"
    type: "String"
  - name: "pipelineType"
    type: "PipelineType"
  - name: "status"
    type: "PipelineStatus"
  - name: "lastRunAt"
    type: "DateTime"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "steps"
    type: "PipelineStep"
    multiplicity: "OneToMany"
  - name: "runs"
    type: "Run"
    multiplicity: "OneToMany"
- name: "PipelineStep"
  description: "Executable stage within a pipeline with declared inputs and outputs."
  data:
  - name: "name"
    type: "String"
  - name: "stepType"
    type: "PipelineStepType"
  - name: "orderIndex"
    type: "Integer"
  - name: "scriptRef"
    type: "URI"
  relations:
  - name: "pipeline"
    type: "Pipeline"
    multiplicity: "ManyToOne"
  - name: "inputArtifacts"
    type: "Artifact"
    multiplicity: "OneToMany"
  - name: "outputArtifacts"
    type: "Artifact"
    multiplicity: "OneToMany"
- name: "Notebook"
  description: "Interactive development environment for exploratory data analysis\
    \ and prototyping."
  data:
  - name: "name"
    type: "String"
  - name: "uri"
    type: "URI"
  - name: "kernel"
    type: "String"
  - name: "framework"
    type: "MLFramework"
  relations:
  - name: "project"
    type: "Project"
    multiplicity: "ManyToOne"
  - name: "artifacts"
    type: "Artifact"
    multiplicity: "OneToMany"
- name: "GovernancePolicy"
  description: "Rules and controls ensuring compliance, quality, and responsible AI\
    \ practices."
  data:
  - name: "name"
    type: "String"
  - name: "policyType"
    type: "PolicyType"
  - name: "descriptionText"
    type: "String"
  - name: "status"
    type: "GovernanceStatus"
  relations:
  - name: "workspace"
    type: "Workspace"
    multiplicity: "ManyToOne"
- name: "ModelCard"
  description: "Documentation summarizing intended use, performance, and limitations\
    \ of a model version."
  data:
  - name: "name"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "intendedUse"
    type: "String"
  - name: "limitations"
    type: "String"
  relations:
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
enums:
- name: "ProblemType"
  description: "Categories of machine learning problems addressed by a project or\
    \ model."
  data:
  - name: "Classification"
  - name: "Regression"
  - name: "Clustering"
  - name: "Forecasting"
  - name: "Ranking"
  - name: "NLP"
  - name: "ComputerVision"
  - name: "Recommendation"
  - name: "AnomalyDetection"
- name: "ProjectStatus"
  description: "Lifecycle states of an ML project."
  data:
  - name: "Ideation"
  - name: "InDiscovery"
  - name: "InDevelopment"
  - name: "InValidation"
  - name: "InProduction"
  - name: "Retired"
- name: "DataConnectionType"
  description: "Connection modality for sourcing data."
  data:
  - name: "Database"
  - name: "ObjectStore"
  - name: "FileSystem"
  - name: "Stream"
  - name: "API"
- name: "AuthMethod"
  description: "Authentication approach for accessing a data source."
  data:
  - name: "None"
  - name: "Basic"
  - name: "OAuth2"
  - name: "ApiKey"
  - name: "IAMRole"
- name: "DatasetFormat"
  description: "Encodings and layouts used to store datasets."
  data:
  - name: "CSV"
  - name: "Parquet"
  - name: "JSON"
  - name: "Avro"
  - name: "ImageFolder"
  - name: "TFRecord"
  - name: "Text"
- name: "DataSensitivity"
  description: "Sensitivity classification guiding handling requirements for datasets."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Confidential"
  - name: "Restricted"
- name: "FeatureType"
  description: "Semantic role of a feature used by a model."
  data:
  - name: "Numerical"
  - name: "Categorical"
  - name: "Text"
  - name: "Image"
  - name: "Timestamp"
  - name: "Boolean"
  - name: "Vector"
  - name: "Geospatial"
- name: "DataType"
  description: "Primitive data types used for feature representation."
  data:
  - name: "Integer"
  - name: "Float"
  - name: "String"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime"
  - name: "Binary"
- name: "SplitStrategy"
  description: "High-level methods for dividing data into subsets."
  data:
  - name: "Random"
  - name: "Stratified"
  - name: "TimeSeries"
  - name: "Custom"
- name: "StorageType"
  description: "Feature store persistence mode."
  data:
  - name: "Online"
  - name: "Offline"
  - name: "Hybrid"
- name: "OptimizationDirection"
  description: "Direction for optimizing the target metric."
  data:
  - name: "Maximize"
  - name: "Minimize"
- name: "RunStatus"
  description: "Execution state of a training or evaluation run."
  data:
