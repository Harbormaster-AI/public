---
metadata:
  name: "Reporting Capabilities Model"
  description: "Canonical HCIDL model for enterprise reporting, covering report definitions,\
    \ data sources, datasets, scheduling, execution, and distribution."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Analytics & AI"
  type: "Capability"
  domain: "Reporting"
entities:
- name: "ReportCatalog"
  description: "Hierarchical container used to organize report definitions into navigable\
    \ folders."
  data:
  - name: "name"
    type: "String"
  - name: "path"
    type: "String"
  - name: "ownerDepartment"
    type: "String"
  relations:
  - name: "parentCatalog"
    type: "ReportCatalog"
    multiplicity: "ManyToOne"
  - name: "subCatalogs"
    type: "ReportCatalog"
    multiplicity: "OneToMany"
  - name: "reportDefinitions"
    type: "ReportDefinition"
    multiplicity: "OneToMany"
- name: "ReportDefinition"
  description: "Master definition of a report including purpose, governance, datasets,\
    \ and visual design."
  data:
  - name: "title"
    type: "String"
  - name: "purpose"
    type: "String"
  - name: "reportType"
    type: "ReportType"
  - name: "confidentiality"
    type: "DataSensitivity"
  - name: "defaultFormat"
    type: "OutputFormat"
  relations:
  - name: "catalog"
    type: "ReportCatalog"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "ReportVersion"
    multiplicity: "OneToMany"
  - name: "parameters"
    type: "ReportParameter"
    multiplicity: "OneToMany"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "visualizations"
    type: "Visualization"
    multiplicity: "OneToMany"
  - name: "schedules"
    type: "ReportSchedule"
    multiplicity: "OneToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "dataPolicy"
    type: "DataPolicy"
    multiplicity: "ManyToOne"
  - name: "distributionLists"
    type: "DistributionList"
    multiplicity: "ManyToMany"
- name: "ReportVersion"
  description: "Versioned snapshot of a report definition used for stable execution\
    \ and auditing."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "changeLog"
    type: "String"
  - name: "createdDate"
    type: "Date"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "reportDefinition"
    type: "ReportDefinition"
    multiplicity: "ManyToOne"
  - name: "templates"
    type: "Template"
    multiplicity: "OneToMany"
  - name: "metrics"
    type: "Metric"
    multiplicity: "ManyToMany"
  - name: "dimensions"
    type: "Dimension"
    multiplicity: "ManyToMany"
- name: "DataSource"
  description: "Connection configuration for a data provider used by datasets and\
    \ reports."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "DataSourceType"
  - name: "connectionUri"
    type: "URI"
  - name: "authenticationMode"
    type: "AuthMode"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "OneToMany"
- name: "Dataset"
  description: "Logical dataset that encapsulates a query and schema for reporting."
  data:
  - name: "name"
    type: "String"
  - name: "queryLanguage"
    type: "QueryLanguage"
  - name: "queryText"
    type: "String"
  - name: "refreshPolicy"
    type: "RefreshPolicy"
  relations:
  - name: "dataSource"
    type: "DataSource"
    multiplicity: "ManyToOne"
  - name: "fields"
    type: "DatasetField"
    multiplicity: "OneToMany"
  - name: "versions"
    type: "DatasetVersion"
    multiplicity: "OneToMany"
  - name: "reportDefinitions"
    type: "ReportDefinition"
    multiplicity: "ManyToMany"
  - name: "dataPolicy"
    type: "DataPolicy"
    multiplicity: "ManyToOne"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
- name: "DatasetField"
  description: "Column-level metadata describing a field within a dataset."
  data:
  - name: "name"
    type: "String"
  - name: "dataType"
    type: "ScalarType"
  - name: "isNullable"
    type: "Boolean"
  - name: "semanticRole"
    type: "SemanticRole"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
- name: "DatasetVersion"
  description: "Version of a dataset capturing changes to query logic or schema."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "changeSummary"
    type: "String"
  - name: "createdDate"
    type: "Date"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
- name: "Metric"
  description: "Numeric calculation or measure used for aggregations in reporting."
  data:
  - name: "name"
    type: "String"
  - name: "expression"
    type: "String"
  - name: "aggregation"
    type: "AggregationFunction"
  - name: "formatPattern"
    type: "String"
  relations:
  - name: "reportVersions"
    type: "ReportVersion"
    multiplicity: "ManyToMany"
- name: "Dimension"
  description: "Categorical attribute used for grouping, slicing, and filtering."
  data:
  - name: "name"
    type: "String"
  - name: "expression"
    type: "String"
  - name: "hierarchyLevel"
    type: "String"
  relations:
  - name: "reportVersions"
    type: "ReportVersion"
    multiplicity: "ManyToMany"
- name: "FilterDefinition"
  description: "Reusable predicate that constrains data within a report."
  data:
  - name: "name"
    type: "String"
  - name: "operator_"
    type: "FilterOperator"
  - name: "valueType"
    type: "ScalarType"
  - name: "defaultValue"
    type: "String"
  - name: "isRequired"
    type: "Boolean"
  relations:
  - name: "reportDefinition"
    type: "ReportDefinition"
    multiplicity: "ManyToOne"
  - name: "parameter"
    type: "ReportParameter"
    multiplicity: "ManyToOne"
- name: "ReportParameter"
  description: "User-supplied input that customizes report execution at runtime."
  data:
  - name: "name"
    type: "String"
  - name: "parameterType"
    type: "ScalarType"
  - name: "promptText"
    type: "String"
  - name: "defaultValue"
    type: "String"
  - name: "allowedValuesRule"
    type: "String"
  relations:
  - name: "reportDefinition"
    type: "ReportDefinition"
    multiplicity: "ManyToOne"
- name: "Visualization"
  description: "Configured view such as a table or chart used to present report results."
  data:
  - name: "title"
    type: "String"
  - name: "visualizationType"
    type: "VisualizationType"
  - name: "sortOrder"
    type: "Integer"
  - name: "showLegend"
    type: "Boolean"
  relations:
  - name: "reportDefinition"
    type: "ReportDefinition"
    multiplicity: "ManyToOne"
  - name: "metrics"
    type: "Metric"
    multiplicity: "ManyToMany"
  - name: "dimensions"
    type: "Dimension"
    multiplicity: "ManyToMany"
- name: "ReportSchedule"
  description: "Automated plan that executes a report on a defined cadence."
  data:
  - name: "scheduleName"
    type: "String"
  - name: "frequency"
    type: "ScheduleFrequency"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "timeZone"
    type: "Timezone"
  - name: "isActive"
    type: "Boolean"
  - name: "customCron"
    type: "CronExpression"
  relations:
  - name: "reportDefinition"
    type: "ReportDefinition"
    multiplicity: "ManyToOne"
  - name: "recipients"
    type: "DistributionTarget"
    multiplicity: "ManyToMany"
  - name: "distributionLists"
    type: "DistributionList"
    multiplicity: "ManyToMany"
  - name: "reportRuns"
    type: "ReportRun"
    multiplicity: "OneToMany"
  - name: "owner"
    type: "UserAccount"
    multiplicity: "ManyToOne"
- name: "DistributionTarget"
  description: "Destination endpoint for delivering report outputs to individuals\
    \ or systems."
  data:
  - name: "targetName"
    type: "String"
  - name: "method"
    type: "DeliveryMethod"
  - name: "address"
    type: "String"
  - name: "encryptionRequired"
    type: "Boolean"
  relations:
  - name: "schedules"
    type: "ReportSchedule"
    multiplicity: "ManyToMany"
  - name: "deliveryEvents"
    type: "DeliveryEvent"
    multiplicity: "OneToMany"
- name: "DistributionList"
  description: "Named group of recipients used to simplify recurring report deliveries."
  data:
  - name: "name"
    type: "String"
  - name: "descriptionText"
    type: "String"
  relations:
  - name: "members"
    type: "DistributionMember"
    multiplicity: "OneToMany"
  - name: "schedules"
    type: "ReportSchedule"
    multiplicity: "ManyToMany"
- name: "DistributionMember"
  description: "Recipient entry belonging to a distribution list."
  data:
  - name: "displayName"
    type: "String"
  - name: "method"
    type: "DeliveryMethod"
  - name: "address"
    type: "String"
  - name: "contact"
    type: "EmailAddress"
  relations:
  - name: "distributionList"
    type: "DistributionList"
    multiplicity: "ManyToOne"
- name: "Template"
  description: "Layout and rendering blueprint referenced by a report version."
  data:
  - name: "name"
    type: "String"
  - name: "templateType"
    type: "TemplateType"
  - name: "contentUri"
    type: "URI"
  relations:
  - name: "reportVersion"
    type: "ReportVersion"
    multiplicity: "ManyToOne"
- name: "ReportRun"
  description: "Execution instance of a report capturing status, lineage, and outputs."
  data:
  - name: "runNumber"
    type: "String"
  - name: "status"
    type: "ExecutionStatus"
  - name: "startedAt"
    type: "Date"
  - name: "finishedAt"
    type: "Date"
  - name: "rowCount"
    type: "Integer"
  - name: "errorMessage"
    type: "String"
  relations:
  - name: "reportVersion"
    type: "ReportVersion"
    multiplicity: "ManyToOne"
  - name: "schedule"
    type: "ReportSchedule"
    multiplicity: "ManyToOne"
  - name: "triggeredBy"
    type: "UserAccount"
    multiplicity: "ManyToOne"
  - name: "outputs"
    type: "ReportOutput"
    multiplicity: "OneToMany"
  - name: "parameters"
    type: "RunParameter"
    multiplicity: "OneToMany"
- name: "RunParameter"
  description: "Concrete parameter value used during a specific report run."
  data:
  - name: "name"
    type: "String"
  - name: "value"
    type: "String"
  relations:
  - name: "reportRun"
    type: "ReportRun"
    multiplicity: "ManyToOne"
  - name: "parameterDefinition"
    type: "ReportParameter"
    multiplicity: "ManyToOne"
- name: "ReportOutput"
  description: "Artifact produced by a report run such as a file or rendered content."
  data:
  - name: "fileName"
    type: "String"
  - name: "format"
    type: "OutputFormat"
  - name: "sizeBytes"
    type: "Integer"
  - name: "storageUri"
    type: "URI"
  - name: "checksum"
    type: "Checksum"
  relations:
  - name: "reportRun"
    type: "ReportRun"
    multiplicity: "ManyToOne"
  - name: "deliveryEvents"
    type: "DeliveryEvent"
    multiplicity: "OneToMany"
- name: "DeliveryEvent"
  description: "Audit trail entry for a delivery attempt or outcome for a report output."
  data:
  - name: "status"
    type: "DeliveryStatus"
  - name: "deliveredAt"
    type: "Date"
  - name: "detail"
    type: "String"
  relations:
  - name: "reportOutput"
    type: "ReportOutput"
    multiplicity: "ManyToOne"
  - name: "target"
    type: "DistributionTarget"
    multiplicity: "ManyToOne"
- name: "DataPolicy"
  description: "Governance policy defining classification, retention, and masking\
    \ rules for reporting data."
  data:
  - name: "name"
    type: "String"
  - name: "classification"
    type: "DataSensitivity"
  - name: "retentionDays"
    type: "Integer"
  - name: "maskingRule"
    type: "String"
  relations:
  - name: "reportDefinitions"
    type: "ReportDefinition"
    multiplicity: "OneToMany"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
- name: "Tag"
  description: "Keyword used to categorize and discover reporting assets across the\
    \ catalog."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "reportDefinitions"
    type: "ReportDefinition"
    multiplicity: "ManyToMany"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
- name: "UserAccount"
  description: "Person or service principal permitted to design, schedule, and run\
    \ reports."
  data:
  - name: "username"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "role"
    type: "UserRole"
  relations:
  - name: "initiatedRuns"
    type: "ReportRun"
    multiplicity: "OneToMany"
  - name: "ownedSchedules"
    type: "ReportSchedule"
    multiplicity: "OneToMany"
enums:
- name: "ReportType"
  description: "High-level categorization of a report’s purpose and audience."
  data:
  - name: "Operational"
  - name: "Analytical"
  - name: "Regulatory"
  - name: "AdHoc"
- name: "DataSourceType"
  description: "Kind of data system from which datasets retrieve information."
  data:
  - name: "RelationalDatabase"
  - name: "DataWarehouse"
  - name: "DataLake"
  - name: "API"
  - name: "File"
  - name: "OLAP"
  - name: "Stream"
- name: "AuthMode"
  description: "Authentication mechanism used to access a data source."
  data:
  - name: "OAuth2"
  - name: "APIKey"
  - name: "UsernamePassword"
  - name: "Kerberos"
  - name: "IAMRole"
  - name: "Anonymous"
- name: "QueryLanguage"
  description: "Language or protocol used to define dataset queries."
  data:
  - name: "SQL"
  - name: "MDX"
  - name: "DAX"
  - name: "REST"
  - name: "GraphQL"
  - name: "SparkSQL"
- name: "RefreshPolicy"
  description: "Strategy governing when and how dataset data is refreshed."
  data:
  - name: "OnDemand"
  - name: "Scheduled"
  - name: "EventDriven"
  - name: "RealTime"
- name: "ScalarType"
  description: "Primitive data types supported within reporting datasets and parameters."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime"
  - name: "Binary"
- name: "SemanticRole"
  description: "Business meaning used to guide modeling, visualization, and aggregation\
    \ behavior."
  data:
  - name: "Identifier"
  - name: "Attribute"
  - name: "Measure"
  - name: "Timestamp"
  - name: "GeoSpatial"
- name: "AggregationFunction"
  description: "Functions used to reduce sets of values to a single summary value."
  data:
  - name: "Sum"
  - name: "Avg"
  - name: "Min"
  - name: "Max"
  - name: "Count"
  - name: "DistinctCount"
  - name: "Median"
  - name: "Percentile"
- name: "FilterOperator"
  description: "Operators available to construct filter predicates."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "GreaterThan"
  - name: "LessThan"
  - name: "GreaterOrEqual"
  - name: "LessOrEqual"
  - name: "Between"
  - name: "In"
  - name: "NotIn"
  - name: "Contains"
  - name: "StartsWith"
  - name: "EndsWith"
  - name: "IsNull"
  - name: "IsNotNull"
- name: "VisualizationType"
  description: "Supported visual representations for report content."
  data:
  - name: "Table"
  - name: "BarChart"
  - name: "LineChart"
  - name: "AreaChart"
  - name: "PieChart"
  - name: "ScatterPlot"
  - name: "Histogram"
  - name: "Heatmap"
  - name: "KPI"
  - name: "Pivot"
- name: "ScheduleFrequency"
  description: "Standard intervals at which a report may be executed."
  data:
  - name: "Hourly"
  - name: "Daily"
  - name: "Weekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Yearly"
  - name: "Cron"
- name: "DeliveryMethod"
  description: "Mechanisms by which report outputs are delivered to recipients."
  data:
  - name: "Email"
  - name: "SFTP"
  - name: "Webhook"
  - name: "Slack"
  - name: "Teams"
  - name: "CloudStorage"
  - name: "Print"
- name: "DeliveryStatus"
  description: "Lifecycle states for a delivery attempt of a report output."
  data:
  - name: "Pending"
  - name: "Sent"
  - name: "Failed"
  - name: "Retried"
  - name: "Acknowledged"
- name: "OutputFormat"
  description: "File or content format used for rendered report outputs."
  data:
  - name: "PDF"
  - name: "XLSX"
  - name: "CSV"
  - name: "JSON"
  - name: "HTML"
  - name: "Image"
- name: "ExecutionStatus"
  description: "States capturing the lifecycle of a report run."
  data:
  - name: "Queued"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Cancelled"
  - name: "Partial"
- name: "TemplateType"
  description: "Template engine or artifact type used to render a report."
  data:
  - name: "RDL"
  - name: "HTML"
  - name: "Markdown"
  - name: "Jaspersoft"
  - name: "BIRT"
  - name: "Custom"
- name: "DataSensitivity"
  description: "Classification levels indicating handling and access restrictions\
    \ for data."
  data:
  - name: "Public"
  - name: "Internal"
  - name: "Confidential"
  - name: "Restricted"
- name: "UserRole"
  description: "Role granted to a user determining reporting permissions and scope."
  data:
  - name: "Viewer"
  - name: "Analyst"
  - name: "Developer"
  - name: "Administrator"
valueObjects:
- name: "URI"
  description: "Uniform resource identifier indicating a resolvable location for content\
    \ or services."
  data:
  - name: "value"
    type: "String"
- name: "EmailAddress"
  description: "Formatted email address used for communication and delivery."
  data:
  - name: "value"
    type: "String"
- name: "CronExpression"
  description: "Quartz-compatible cron string defining a custom execution schedule."
  data:
  - name: "expression"
    type: "String"
- name: "Checksum"
  description: "Hash digest used to verify report output integrity."
  data:
  - name: "algorithm"
    type: "String"
  - name: "hash"
    type: "String"
- name: "Timezone"
  description: "IANA time zone identifier used to interpret schedule times."
  data:
  - name: "value"
    type: "String"
