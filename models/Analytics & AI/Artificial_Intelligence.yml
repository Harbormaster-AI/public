---
entities:
- name: "AICompany"
  description: "Legal entity responsible for researching, building, and operating\
    \ AI systems."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "productLines"
    type: "ProductLine"
    multiplicity: "OneToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "OneToMany"
  - name: "computeClusters"
    type: "ComputeCluster"
    multiplicity: "OneToMany"
- name: "ProductLine"
  description: "Commercial AI product family or business line."
  data:
  - name: "name"
    type: "String"
  - name: "marketSegment"
    type: "AIMarketSegment"
  relations:
  - name: "company"
    type: "AICompany"
    multiplicity: "ManyToOne"
  - name: "aiPlatforms"
    type: "AIPlatform"
    multiplicity: "OneToMany"
  - name: "deployments"
    type: "Deployment"
    multiplicity: "OneToMany"
  - name: "projects"
    type: "AIProject"
    multiplicity: "OneToMany"
- name: "AIPlatform"
  description: "Shared platform or reference architecture used across model families."
  data:
  - name: "name"
    type: "String"
  - name: "platformCode"
    type: "String"
  relations:
  - name: "productLine"
    type: "ProductLine"
    multiplicity: "ManyToOne"
  - name: "modelFamilies"
    type: "ModelFamily"
    multiplicity: "OneToMany"
- name: "ModelFamily"
  description: "Conceptual AI model lineage grouped by task and modality."
  data:
  - name: "name"
    type: "String"
  - name: "modality"
    type: "ModalityType"
  relations:
  - name: "platform"
    type: "AIPlatform"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "ModelVersion"
    multiplicity: "OneToMany"
- name: "ModelVersion"
  description: "A concrete, versioned release of a model family."
  data:
  - name: "versionTag"
    type: "String"
  - name: "releaseStage"
    type: "ReleaseStage"
  relations:
  - name: "modelFamily"
    type: "ModelFamily"
    multiplicity: "ManyToOne"
  - name: "configurations"
    type: "ModelConfiguration"
    multiplicity: "OneToMany"
  - name: "artifacts"
    type: "ModelArtifact"
    multiplicity: "OneToMany"
  - name: "evaluationSuites"
    type: "EvaluationSuite"
    multiplicity: "OneToMany"
  - name: "modelCard"
    type: "ModelCard"
    multiplicity: "OneToOne"
- name: "ModelConfiguration"
  description: "Training-time or inference-time model configuration instance."
  data:
  - name: "configName"
    type: "String"
  - name: "architectureType"
    type: "ArchitectureType"
  relations:
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
  - name: "trainingRuns"
    type: "TrainingRun"
    multiplicity: "OneToMany"
- name: "Dataset"
  description: "Managed collection of data curated for AI training, validation, or\
    \ testing."
  data:
  - name: "name"
    type: "String"
  - name: "datasetId"
    type: "DatasetId"
  - name: "modality"
    type: "ModalityType"
  - name: "license"
    type: "DataLicenseType"
  relations:
  - name: "dataSources"
    type: "DataSource"
    multiplicity: "ManyToMany"
  - name: "versions"
    type: "DatasetVersion"
    multiplicity: "OneToMany"
  - name: "annotationProjects"
    type: "AnnotationProject"
    multiplicity: "OneToMany"
  - name: "custodians"
    type: "Team"
    multiplicity: "ManyToMany"
- name: "DatasetVersion"
  description: "Immutable snapshot of a dataset at a point in time."
  data:
  - name: "versionTag"
    type: "String"
  - name: "recordCount"
    type: "Integer"
  - name: "storageUri"
    type: "URI"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "labelSchema"
    type: "LabelSchema"
    multiplicity: "ManyToOne"
  - name: "samples"
    type: "DataSample"
    multiplicity: "OneToMany"
  - name: "splits"
    type: "DatasetSplit"
    multiplicity: "OneToMany"
  - name: "lineageRecords"
    type: "DataLineageRecord"
    multiplicity: "OneToMany"
- name: "DatasetSplit"
  description: "Logical partition of a dataset version used for training, validation,\
    \ or testing."
  data:
  - name: "splitType"
    type: "SplitType"
  - name: "recordCount"
    type: "Integer"
  relations:
  - name: "datasetVersion"
    type: "DatasetVersion"
    multiplicity: "ManyToOne"
  - name: "samples"
    type: "DataSample"
    multiplicity: "OneToMany"
- name: "DataSource"
  description: "Origin system or storage location that provides raw data."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "DataSourceType"
  - name: "connectionUri"
    type: "URI"
  relations:
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "dataIngestionPipelines"
    type: "DataIngestionPipeline"
    multiplicity: "OneToMany"
- name: "DataIngestionPipeline"
  description: "Managed pipeline that extracts, transforms, and loads data into datasets."
  data:
  - name: "name"
    type: "String"
  - name: "schedule"
    type: "CronExpression"
  - name: "status"
    type: "PipelineStatus"
  relations:
  - name: "dataSource"
    type: "DataSource"
    multiplicity: "ManyToOne"
  - name: "targetDataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "runs"
    type: "PipelineRun"
    multiplicity: "OneToMany"
- name: "PipelineRun"
  description: "Executed instance of a data ingestion pipeline."
  data:
  - name: "runId"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "PipelineRunStatus"
  relations:
  - name: "pipeline"
    type: "DataIngestionPipeline"
    multiplicity: "ManyToOne"
  - name: "artifacts"
    type: "ModelArtifact"
    multiplicity: "ManyToMany"
- name: "DataSample"
  description: "Addressable unit of data within a dataset version."
  data:
  - name: "sampleId"
    type: "String"
  - name: "uri"
    type: "URI"
  - name: "checksum"
    type: "String"
  relations:
  - name: "datasetVersion"
    type: "DatasetVersion"
    multiplicity: "ManyToOne"
  - name: "annotations"
    type: "Annotation"
    multiplicity: "OneToMany"
- name: "AnnotationProject"
  description: "Managed effort to label or enrich data with human or programmatic\
    \ annotations."
  data:
  - name: "name"
    type: "String"
  - name: "status"
    type: "AnnotationProjectStatus"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "tasks"
    type: "AnnotationTask"
    multiplicity: "OneToMany"
  - name: "labelSchema"
    type: "LabelSchema"
    multiplicity: "ManyToOne"
  - name: "vendor"
    type: "LabelingVendor"
    multiplicity: "ManyToOne"
  - name: "annotators"
    type: "Annotator"
    multiplicity: "ManyToMany"
- name: "AnnotationTask"
  description: "Unit of work assigning a sample to be labeled under a project."
  data:
  - name: "taskId"
    type: "String"
  - name: "difficulty"
    type: "TaskDifficulty"
  relations:
  - name: "project"
    type: "AnnotationProject"
    multiplicity: "ManyToOne"
  - name: "sample"
    type: "DataSample"
    multiplicity: "ManyToOne"
  - name: "assignments"
    type: "AnnotationAssignment"
    multiplicity: "OneToMany"
- name: "AnnotationAssignment"
  description: "Specific annotation assignment for an annotator."
  data:
  - name: "assignmentId"
    type: "String"
  - name: "status"
    type: "AnnotationStatus"
  relations:
  - name: "task"
    type: "AnnotationTask"
    multiplicity: "ManyToOne"
  - name: "annotator"
    type: "Annotator"
    multiplicity: "ManyToOne"
  - name: "annotations"
    type: "Annotation"
    multiplicity: "OneToMany"
  - name: "review"
    type: "AnnotationReview"
    multiplicity: "OneToOne"
- name: "Annotation"
  description: "Structured label payload attached to a data sample."
  data:
  - name: "annotationId"
    type: "String"
  - name: "format"
    type: "AnnotationFormat"
  - name: "dataLocation"
    type: "URI"
  - name: "confidence"
    type: "Percentage"
  relations:
  - name: "assignment"
    type: "AnnotationAssignment"
    multiplicity: "ManyToOne"
  - name: "sample"
    type: "DataSample"
    multiplicity: "ManyToOne"
  - name: "label"
    type: "Label"
    multiplicity: "ManyToOne"
- name: "AnnotationReview"
  description: "Quality control review of an annotation assignment."
  data:
  - name: "reviewStatus"
    type: "ReviewStatus"
  - name: "comments"
    type: "String"
  relations:
  - name: "assignment"
    type: "AnnotationAssignment"
    multiplicity: "ManyToOne"
  - name: "reviewer"
    type: "Annotator"
    multiplicity: "ManyToOne"
- name: "Annotator"
  description: "Human labeler performing annotation work."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "experienceLevel"
    type: "ExperienceLevel"
  relations:
  - name: "assignments"
    type: "AnnotationAssignment"
    multiplicity: "OneToMany"
  - name: "vendor"
    type: "LabelingVendor"
    multiplicity: "ManyToOne"
- name: "LabelSchema"
  description: "Ontology defining valid labels and relationships for a dataset."
  data:
  - name: "name"
    type: "String"
  - name: "schemaVersion"
    type: "String"
  - name: "ontologyType"
    type: "OntologyType"
  relations:
  - name: "labels"
    type: "Label"
    multiplicity: "OneToMany"
  - name: "datasetVersions"
    type: "DatasetVersion"
    multiplicity: "OneToMany"
  - name: "projects"
    type: "AnnotationProject"
    multiplicity: "OneToMany"
- name: "Label"
  description: "Atomic label element defined in a label schema."
  data:
  - name: "code"
    type: "String"
  - name: "displayName"
    type: "String"
  - name: "labelType"
    type: "LabelType"
  relations:
  - name: "labelSchema"
    type: "LabelSchema"
    multiplicity: "ManyToOne"
- name: "LabelingVendor"
  description: "Third-party provider delivering labeling services."
  data:
  - name: "name"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "projects"
    type: "AnnotationProject"
    multiplicity: "OneToMany"
  - name: "annotators"
    type: "Annotator"
    multiplicity: "OneToMany"
  - name: "contracts"
    type: "LabelingContract"
    multiplicity: "OneToMany"
- name: "LabelingContract"
  description: "Commercial agreement governing labeling work and rates."
  data:
  - name: "contractNumber"
    type: "String"
  - name: "ratePerTask"
    type: "Money"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "vendor"
    type: "LabelingVendor"
    multiplicity: "ManyToOne"
  - name: "projects"
    type: "AnnotationProject"
    multiplicity: "OneToMany"
- name: "AIProject"
  description: "Cross-functional initiative delivering AI capabilities."
  data:
  - name: "name"
    type: "String"
  - name: "projectCode"
    type: "String"
  - name: "businessObjective"
    type: "String"
  relations:
  - name: "productLine"
    type: "ProductLine"
    multiplicity: "ManyToOne"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "ManyToMany"
  - name: "experiments"
    type: "Experiment"
    multiplicity: "OneToMany"
  - name: "modelFamilies"
    type: "ModelFamily"
    multiplicity: "OneToMany"
  - name: "teams"
    type: "Team"
    multiplicity: "ManyToMany"
  - name: "auditLogs"
    type: "AuditLog"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
- name: "Experiment"
  description: "Structured investigation to evaluate modeling hypotheses."
  data:
  - name: "name"
    type: "String"
  - name: "hypothesis"
    type: "String"
  - name: "status"
    type: "ExperimentStatus"
  relations:
  - name: "project"
    type: "AIProject"
    multiplicity: "ManyToOne"
  - name: "runs"
    type: "TrainingRun"
    multiplicity: "OneToMany"
  - name: "owner"
    type: "Team"
    multiplicity: "ManyToOne"
- name: "TrainingRun"
  description: "Executed training attempt of a model configuration with specific data\
    \ and compute."
  data:
  - name: "runId"
    type: "String"
  - name: "objective"
    type: "String"
  - name: "status"
    type: "TrainingRunStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "configuration"
    type: "ModelConfiguration"
    multiplicity: "ManyToOne"
  - name: "trainingDatasets"
    type: "DatasetVersion"
    multiplicity: "ManyToMany"
  - name: "validationDatasets"
    type: "DatasetVersion"
    multiplicity: "ManyToMany"
  - name: "computeJob"
    type: "ComputeJob"
    multiplicity: "OneToOne"
  - name: "metrics"
    type: "MetricRecord"
    multiplicity: "OneToMany"
  - name: "artifacts"
    type: "ModelArtifact"
    multiplicity: "OneToMany"
  - name: "hyperparameters"
    type: "HyperparameterSetting"
    multiplicity: "OneToMany"
  - name: "experiment"
    type: "Experiment"
    multiplicity: "ManyToOne"
- name: "HyperparameterSetting"
  description: "Single hyperparameter value used during a training run."
  data:
  - name: "name"
    type: "String"
  - name: "value"
    type: "String"
  relations:
  - name: "trainingRun"
    type: "TrainingRun"
    multiplicity: "ManyToOne"
- name: "MetricRecord"
  description: "Recorded metric value for a training run at a specific step or aggregate."
  data:
  - name: "name"
    type: "String"
  - name: "value"
    type: "Decimal"
  - name: "datasetSplit"
    type: "SplitType"
  - name: "step"
    type: "Integer"
  relations:
  - name: "trainingRun"
    type: "TrainingRun"
    multiplicity: "ManyToOne"
- name: "ModelArtifact"
  description: "Versioned binary or document artifact produced or consumed by AI workflows."
  data:
  - name: "artifactId"
    type: "String"
  - name: "artifactType"
    type: "ArtifactType"
  - name: "uri"
    type: "URI"
  - name: "checksum"
    type: "String"
  relations:
  - name: "trainingRun"
    type: "TrainingRun"
    multiplicity: "ManyToOne"
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
- name: "ComputeCluster"
  description: "Logical cluster providing compute capacity for AI workloads."
  data:
  - name: "name"
    type: "String"
  - name: "provider"
    type: "CloudProvider"
  - name: "region"
    type: "String"
  relations:
  - name: "nodes"
    type: "ComputeNode"
    multiplicity: "OneToMany"
  - name: "jobs"
    type: "ComputeJob"
    multiplicity: "OneToMany"
  - name: "company"
    type: "AICompany"
    multiplicity: "ManyToOne"
- name: "ComputeNode"
  description: "Physical or virtual machine participating in a compute cluster."
  data:
  - name: "nodeId"
    type: "String"
  - name: "acceleratorType"
    type: "AcceleratorType"
  - name: "acceleratorCount"
    type: "Integer"
  - name: "memoryGB"
    type: "Integer"
  relations:
  - name: "cluster"
    type: "ComputeCluster"
    multiplicity: "ManyToOne"
  - name: "jobs"
    type: "ComputeJob"
    multiplicity: "OneToMany"
- name: "ComputeJob"
  description: "Scheduled or running compute workload supporting AI processes."
  data:
  - name: "jobId"
    type: "String"
  - name: "jobType"
    type: "ComputeJobType"
  - name: "status"
    type: "ComputeJobStatus"
  - name: "submittedAt"
    type: "Date"
  relations:
  - name: "cluster"
    type: "ComputeCluster"
    multiplicity: "ManyToOne"
  - name: "node"
    type: "ComputeNode"
    multiplicity: "ManyToOne"
  - name: "artifacts"
    type: "ModelArtifact"
    multiplicity: "OneToMany"
  - name: "trainingRun"
    type: "TrainingRun"
    multiplicity: "OneToOne"
- name: "Deployment"
  description: "Operationalized delivery of a model version to serve predictions or\
    \ jobs."
  data:
  - name: "deploymentId"
    type: "String"
  - name: "deploymentType"
    type: "DeploymentType"
  - name: "status"
    type: "DeploymentStatus"
  - name: "createdAt"
    type: "Date"
  relations:
  - name: "productLine"
    type: "ProductLine"
    multiplicity: "ManyToOne"
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
  - name: "endpoints"
    type: "Endpoint"
    multiplicity: "OneToMany"
  - name: "monitors"
    type: "Monitor"
    multiplicity: "OneToMany"
  - name: "environment"
    type: "Environment"
    multiplicity: "ManyToOne"
- name: "Endpoint"
  description: "Network-accessible interface exposing an AI model or policy."
  data:
  - name: "name"
    type: "String"
  - name: "url"
    type: "URI"
  - name: "protocol"
    type: "ProtocolType"
  relations:
  - name: "deployment"
    type: "Deployment"
    multiplicity: "ManyToOne"
  - name: "abTests"
    type: "ABTest"
    multiplicity: "OneToMany"
  - name: "trafficPolicies"
    type: "TrafficPolicy"
    multiplicity: "OneToMany"
  - name: "requestLogs"
    type: "RequestLog"
    multiplicity: "OneToMany"
- name: "TrafficPolicy"
  description: "Strategy controlling traffic routing across model versions or endpoints."
  data:
  - name: "policyId"
    type: "String"
  - name: "strategy"
    type: "TrafficStrategy"
  relations:
  - name: "endpoint"
    type: "Endpoint"
    multiplicity: "ManyToOne"
  - name: "versions"
    type: "TrafficPolicyVersion"
    multiplicity: "OneToMany"
- name: "TrafficPolicyVersion"
  description: "Versioned specification of a traffic policy configuration."
  data:
  - name: "versionNumber"
    type: "Integer"
  - name: "yamlSpecUri"
    type: "URI"
  relations:
  - name: "policy"
    type: "TrafficPolicy"
    multiplicity: "ManyToOne"
- name: "ABTest"
  description: "Controlled experiment routing traffic to multiple model variants."
  data:
  - name: "experimentId"
    type: "String"
  - name: "status"
    type: "ABTestStatus"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "endpoint"
    type: "Endpoint"
    multiplicity: "ManyToOne"
  - name: "variants"
    type: "ABVariant"
    multiplicity: "OneToMany"
  - name: "metrics"
    type: "ABMetric"
    multiplicity: "OneToMany"
- name: "ABVariant"
  description: "Individual treatment arm participating in an A/B test."
  data:
  - name: "name"
    type: "String"
  - name: "allocationPercent"
    type: "Percentage"
  relations:
  - name: "abTest"
    type: "ABTest"
    multiplicity: "ManyToOne"
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
- name: "ABMetric"
  description: "Outcome metric observed during an A/B test."
  data:
  - name: "name"
    type: "String"
  - name: "value"
    type: "Decimal"
  relations:
  - name: "abTest"
    type: "ABTest"
    multiplicity: "ManyToOne"
- name: "Monitor"
  description: "Automated check measuring system health, data quality, or model behavior."
  data:
  - name: "name"
    type: "String"
  - name: "monitorType"
    type: "MonitorType"
  - name: "threshold"
    type: "Decimal"
  relations:
  - name: "deployment"
    type: "Deployment"
    multiplicity: "ManyToOne"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "signals"
    type: "MonitoringSignal"
    multiplicity: "OneToMany"
- name: "MonitoringSignal"
  description: "Time-stamped measurement produced by a monitor."
  data:
  - name: "signalId"
    type: "String"
  - name: "signalType"
    type: "SignalType"
  - name: "value"
    type: "Decimal"
  - name: "recordedAt"
    type: "Date"
  relations:
  - name: "monitor"
    type: "Monitor"
    multiplicity: "ManyToOne"
- name: "Alert"
  description: "Condition-triggered notification created by a monitor."
  data:
  - name: "alertId"
    type: "String"
  - name: "severity"
    type: "AlertSeverity"
  - name: "status"
    type: "AlertStatus"
  - name: "createdAt"
    type: "Date"
  relations:
  - name: "monitor"
    type: "Monitor"
    multiplicity: "ManyToOne"
  - name: "incidents"
    type: "Incident"
    multiplicity: "OneToMany"
- name: "Incident"
  description: "Tracked operational issue resulting from alerts or failures."
  data:
  - name: "incidentId"
    type: "String"
  - name: "status"
    type: "IncidentStatus"
  - name: "resolutionSummary"
    type: "String"
  relations:
  - name: "alert"
    type: "Alert"
    multiplicity: "ManyToOne"
  - name: "postmortem"
    type: "Postmortem"
    multiplicity: "OneToOne"
- name: "Postmortem"
  description: "Documented analysis of an incident's root cause and corrective actions."
  data:
  - name: "documentUri"
    type: "URI"
  - name: "author"
    type: "String"
  - name: "createdAt"
    type: "Date"
  relations:
  - name: "incident"
    type: "Incident"
    multiplicity: "ManyToOne"
- name: "EvaluationSuite"
  description: "Organized set of tests to assess a model version against defined criteria."
  data:
  - name: "name"
    type: "String"
  - name: "suiteType"
    type: "EvaluationSuiteType"
  relations:
  - name: "testCases"
    type: "EvaluationCase"
    multiplicity: "OneToMany"
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
- name: "EvaluationCase"
  description: "Individual test defining input, expected output, and scoring metric."
  data:
  - name: "caseId"
    type: "String"
  - name: "inputUri"
    type: "URI"
  - name: "expectedOutputUri"
    type: "URI"
  - name: "metric"
    type: "String"
  relations:
  - name: "suite"
    type: "EvaluationSuite"
    multiplicity: "ManyToOne"
- name: "RiskAssessment"
  description: "Formal evaluation of risks, impacts, and mitigations for an AI project."
  data:
  - name: "assessmentId"
    type: "String"
  - name: "riskLevel"
    type: "RiskLevel"
  - name: "completedAt"
    type: "Date"
  relations:
  - name: "project"
