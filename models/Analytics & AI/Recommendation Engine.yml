---
metadata:
  name: "Recommendation Engine HCIDL Model"
  description: "Capability model for designing, training, evaluating, and operating\
    \ a recommendation engine across channels and experiences."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Analytics & AI"
  type: "Capability"
  domain: "Recommendation Engine"
entities:
- name: "UserProfile"
  description: "End user who receives recommendations and generates behavioral signals."
  data:
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "locale"
    type: "String"
  - name: "profileStatus"
    type: "ProfileStatus"
  - name: "marketingOptIn"
    type: "Boolean"
  relations:
  - name: "segments"
    type: "AudienceSegment"
    multiplicity: "ManyToMany"
  - name: "sessions"
    type: "SessionContext"
    multiplicity: "OneToMany"
  - name: "interactions"
    type: "InteractionEvent"
    multiplicity: "OneToMany"
  - name: "feedback"
    type: "Feedback"
    multiplicity: "OneToMany"
  - name: "recommendations"
    type: "Recommendation"
    multiplicity: "OneToMany"
  - name: "embeddings"
    type: "UserEmbedding"
    multiplicity: "OneToMany"
  - name: "consentRecords"
    type: "ConsentRecord"
    multiplicity: "OneToMany"
- name: "AudienceSegment"
  description: "Grouping of users based on shared attributes or behaviors for targeting\
    \ and analysis."
  data:
  - name: "name"
    type: "String"
  - name: "segmentType"
    type: "SegmentType"
  - name: "description"
    type: "String"
  - name: "criteria"
    type: "String"
  relations:
  - name: "users"
    type: "UserProfile"
    multiplicity: "ManyToMany"
  - name: "policies"
    type: "RecommendationPolicy"
    multiplicity: "ManyToMany"
- name: "SessionContext"
  description: "Browsing or usage session capturing device and temporal context."
  data:
  - name: "startedAt"
    type: "Date"
  - name: "endedAt"
    type: "Date"
  - name: "deviceType"
    type: "DeviceType"
  - name: "locale"
    type: "String"
  - name: "referrer"
    type: "String"
  relations:
  - name: "user"
    type: "UserProfile"
    multiplicity: "ManyToOne"
  - name: "interactions"
    type: "InteractionEvent"
    multiplicity: "OneToMany"
  - name: "requests"
    type: "RecommendationRequest"
    multiplicity: "OneToMany"
- name: "Catalog"
  description: "Logical catalog of items available for recommendation."
  data:
  - name: "name"
    type: "String"
  - name: "defaultLocale"
    type: "String"
  - name: "currency"
    type: "String"
  relations:
  - name: "items"
    type: "CatalogItem"
    multiplicity: "OneToMany"
  - name: "categories"
    type: "Category"
    multiplicity: "OneToMany"
- name: "CatalogItem"
  description: "Recommendable item such as a product, content piece, or service."
  data:
  - name: "name"
    type: "String"
  - name: "itemType"
    type: "ContentType"
  - name: "lifecycleStatus"
    type: "ItemLifecycleStatus"
  - name: "language"
    type: "String"
  - name: "basePrice"
    type: "Money"
  - name: "releaseDate"
    type: "Date"
  relations:
  - name: "catalog"
    type: "Catalog"
    multiplicity: "ManyToOne"
  - name: "categories"
    type: "Category"
    multiplicity: "ManyToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
  - name: "variants"
    type: "ContentVariant"
    multiplicity: "OneToMany"
  - name: "embeddings"
    type: "ItemEmbedding"
    multiplicity: "OneToMany"
  - name: "interactions"
    type: "InteractionEvent"
    multiplicity: "OneToMany"
  - name: "feedback"
    type: "Feedback"
    multiplicity: "OneToMany"
  - name: "recommendations"
    type: "Recommendation"
    multiplicity: "OneToMany"
- name: "Category"
  description: "Hierarchical category within a catalog used for organization and diversity\
    \ controls."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "catalog"
    type: "Catalog"
    multiplicity: "ManyToOne"
  - name: "parentCategory"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "childCategories"
    type: "Category"
    multiplicity: "OneToMany"
  - name: "items"
    type: "CatalogItem"
    multiplicity: "ManyToMany"
- name: "Tag"
  description: "Label applied to items for filtering, boosting, and analytics."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "items"
    type: "CatalogItem"
    multiplicity: "ManyToMany"
- name: "ContentVariant"
  description: "Alternative representation or format of an item."
  data:
  - name: "variantName"
    type: "String"
  - name: "format"
    type: "String"
  - name: "url"
    type: "String"
  - name: "fileSizeKB"
    type: "Integer"
  relations:
  - name: "item"
    type: "CatalogItem"
    multiplicity: "ManyToOne"
- name: "RecommendationRequest"
  description: "Input context captured when recommendations are requested."
  data:
  - name: "requestTime"
    type: "Date"
  - name: "channel"
    type: "DeliveryChannel"
  - name: "deviceType"
    type: "DeviceType"
  - name: "locale"
    type: "String"
  - name: "pageContext"
    type: "String"
  - name: "explorationPolicy"
    type: "ExplorationPolicy"
  relations:
  - name: "user"
    type: "UserProfile"
    multiplicity: "ManyToOne"
  - name: "session"
    type: "SessionContext"
    multiplicity: "ManyToOne"
  - name: "recommendationSet"
    type: "RecommendationSet"
    multiplicity: "OneToOne"
  - name: "pipeline"
    type: "RecommendationPipeline"
    multiplicity: "ManyToOne"
- name: "RecommendationSet"
  description: "Cohesive bundle of ranked recommendations produced for a request."
  data:
  - name: "generatedAt"
    type: "Date"
  - name: "strategy"
    type: "RankingStrategy"
  - name: "totalReturned"
    type: "Integer"
  relations:
  - name: "request"
    type: "RecommendationRequest"
    multiplicity: "OneToOne"
  - name: "recommendations"
    type: "Recommendation"
    multiplicity: "OneToMany"
  - name: "deliveryEndpoint"
    type: "DeliveryEndpoint"
    multiplicity: "ManyToOne"
- name: "Recommendation"
  description: "Individual ranked suggestion for a specific user and item."
  data:
  - name: "rank"
    type: "Integer"
  - name: "score"
    type: "Score"
  - name: "algorithm"
    type: "AlgorithmType"
  - name: "objective"
    type: "ObjectiveFunction"
  - name: "explanation"
    type: "String"
  - name: "isExploration"
    type: "Boolean"
  - name: "presentedAt"
    type: "Date"
  relations:
  - name: "recommendationSet"
    type: "RecommendationSet"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "UserProfile"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "CatalogItem"
    multiplicity: "ManyToOne"
  - name: "interactionEvents"
    type: "InteractionEvent"
    multiplicity: "OneToMany"
  - name: "feedback"
    type: "Feedback"
    multiplicity: "OneToMany"
  - name: "experimentVariant"
    type: "ExperimentVariant"
    multiplicity: "ManyToOne"
- name: "InteractionEvent"
  description: "Recorded user behavior involving an item, used for learning and attribution."
  data:
  - name: "eventType"
    type: "InteractionType"
  - name: "occurredAt"
    type: "Date"
  - name: "value"
    type: "Decimal"
  - name: "dwellTimeSeconds"
    type: "Integer"
  - name: "referrer"
    type: "String"
  relations:
  - name: "user"
    type: "UserProfile"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "CatalogItem"
    multiplicity: "ManyToOne"
  - name: "session"
    type: "SessionContext"
    multiplicity: "ManyToOne"
  - name: "recommendation"
    type: "Recommendation"
    multiplicity: "ManyToOne"
- name: "Feedback"
  description: "Explicit or implicit feedback about a recommendation or item."
  data:
  - name: "feedbackType"
    type: "FeedbackType"
  - name: "sentiment"
    type: "SentimentType"
  - name: "comment"
    type: "String"
  - name: "submittedAt"
    type: "Date"
  - name: "value"
    type: "Decimal"
  relations:
  - name: "user"
    type: "UserProfile"
    multiplicity: "ManyToOne"
  - name: "item"
    type: "CatalogItem"
    multiplicity: "ManyToOne"
  - name: "recommendation"
    type: "Recommendation"
    multiplicity: "ManyToOne"
- name: "FeatureStore"
  description: "Central repository for defining, storing, and serving ML features."
  data:
  - name: "name"
    type: "String"
  - name: "storageType"
    type: "StorageType"
  - name: "retentionDays"
    type: "Integer"
  relations:
  - name: "features"
    type: "Feature"
    multiplicity: "OneToMany"
  - name: "featureViews"
    type: "FeatureView"
    multiplicity: "OneToMany"
- name: "Feature"
  description: "Declarative feature definition with transformation logic and metadata."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "dataType"
    type: "FeatureDataType"
  - name: "transformation"
    type: "String"
  - name: "freshnessSeconds"
    type: "Integer"
  - name: "ownerTeam"
    type: "String"
  relations:
  - name: "featureStore"
    type: "FeatureStore"
    multiplicity: "ManyToOne"
  - name: "featureViews"
    type: "FeatureView"
    multiplicity: "ManyToMany"
- name: "FeatureView"
  description: "Materialized set of features optimized for online or offline serving."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "freshnessSeconds"
    type: "Integer"
  relations:
  - name: "featureStore"
    type: "FeatureStore"
    multiplicity: "ManyToOne"
  - name: "features"
    type: "Feature"
    multiplicity: "ManyToMany"
- name: "TrainingDataset"
  description: "Curated dataset snapshot used to train or validate models."
  data:
  - name: "name"
    type: "String"
  - name: "createdAt"
    type: "Date"
  - name: "samplingStrategy"
    type: "SamplingStrategy"
  - name: "positiveLabel"
    type: "String"
  - name: "negativeLabel"
    type: "String"
  - name: "description"
    type: "String"
  relations:
  - name: "features"
    type: "Feature"
    multiplicity: "ManyToMany"
  - name: "featureStore"
    type: "FeatureStore"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "CatalogItem"
    multiplicity: "ManyToMany"
  - name: "users"
    type: "UserProfile"
    multiplicity: "ManyToMany"
  - name: "trainingRuns"
    type: "ModelTrainingRun"
    multiplicity: "OneToMany"
- name: "Model"
  description: "Logical recommendation model definition and lifecycle state."
  data:
  - name: "name"
    type: "String"
  - name: "algorithm"
    type: "AlgorithmType"
  - name: "objective"
    type: "ObjectiveFunction"
  - name: "status"
    type: "ModelStatus"
  - name: "description"
    type: "String"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "versions"
    type: "ModelVersion"
    multiplicity: "OneToMany"
  - name: "pipelines"
    type: "RecommendationPipeline"
    multiplicity: "ManyToMany"
  - name: "similarityIndices"
    type: "SimilarityIndex"
    multiplicity: "OneToMany"
- name: "ModelVersion"
  description: "Trained and versioned artifact of a model with metrics and parameters."
  data:
  - name: "versionLabel"
    type: "String"
  - name: "trainingStart"
    type: "Date"
  - name: "trainingEnd"
    type: "Date"
  - name: "hyperparameters"
    type: "Hyperparameters"
  - name: "trainingMetrics"
    type: "MetricSet"
  - name: "modelSizeMB"
    type: "Decimal"
  relations:
  - name: "model"
    type: "Model"
    multiplicity: "ManyToOne"
  - name: "trainingRun"
    type: "ModelTrainingRun"
    multiplicity: "OneToOne"
  - name: "deployments"
    type: "ModelDeployment"
    multiplicity: "OneToMany"
  - name: "offlineEvaluations"
    type: "OfflineEvaluation"
    multiplicity: "OneToMany"
  - name: "onlineMetrics"
    type: "OnlineMetric"
    multiplicity: "OneToMany"
  - name: "experimentVariants"
    type: "ExperimentVariant"
    multiplicity: "OneToMany"
- name: "ModelTrainingRun"
  description: "Execution record of a training job including resources and costs."
  data:
  - name: "runLabel"
    type: "String"
  - name: "computeEnvironment"
    type: "ComputeEnvironment"
  - name: "startedAt"
    type: "Date"
  - name: "endedAt"
    type: "Date"
  - name: "trainingCost"
    type: "Money"
  relations:
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "OneToOne"
  - name: "trainingDataset"
    type: "TrainingDataset"
    multiplicity: "ManyToOne"
  - name: "featureStore"
    type: "FeatureStore"
    multiplicity: "ManyToOne"
- name: "OfflineEvaluation"
  description: "Batch evaluation of a model version against held-out data."
  data:
  - name: "metric"
    type: "EvaluationMetricType"
  - name: "metricValue"
    type: "Decimal"
  - name: "evaluatedAt"
    type: "Date"
  - name: "datasetSplit"
    type: "DatasetSplitType"
  - name: "notes"
    type: "String"
  relations:
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
  - name: "trainingDataset"
    type: "TrainingDataset"
    multiplicity: "ManyToOne"
- name: "OnlineMetric"
  description: "Near-real-time performance indicator observed in production."
  data:
  - name: "name"
    type: "String"
  - name: "window"
    type: "WindowType"
  - name: "value"
    type: "Decimal"
  - name: "observedAt"
    type: "Date"
  relations:
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
  - name: "experimentVariant"
    type: "ExperimentVariant"
    multiplicity: "ManyToOne"
- name: "RecommendationPipeline"
  description: "Orchestrated flow that generates, ranks, and delivers recommendations."
  data:
  - name: "name"
    type: "String"
  - name: "pipelineType"
    type: "PipelineType"
  - name: "refreshIntervalMinutes"
    type: "Integer"
  - name: "description"
    type: "String"
  relations:
  - name: "models"
    type: "Model"
    multiplicity: "ManyToMany"
  - name: "dataSources"
    type: "DataSource"
    multiplicity: "ManyToMany"
  - name: "deliveryEndpoints"
    type: "DeliveryEndpoint"
    multiplicity: "ManyToMany"
  - name: "requests"
    type: "RecommendationRequest"
    multiplicity: "OneToMany"
  - name: "deployments"
    type: "ModelDeployment"
    multiplicity: "OneToMany"
  - name: "experiments"
    type: "Experiment"
    multiplicity: "OneToMany"
  - name: "policies"
    type: "RecommendationPolicy"
    multiplicity: "ManyToMany"
- name: "ModelDeployment"
  description: "Deployed instance of a model version serving traffic."
  data:
  - name: "environment"
    type: "DeploymentEnvironment"
  - name: "endpointUrl"
    type: "String"
  - name: "status"
    type: "DeploymentStatus"
  - name: "deployedAt"
    type: "Date"
  relations:
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
  - name: "pipeline"
    type: "RecommendationPipeline"
    multiplicity: "ManyToOne"
- name: "DataSource"
  description: "System from which training or real-time data is ingested."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "DataSourceType"
  - name: "connectionUri"
    type: "String"
  - name: "schedule"
    type: "Schedule"
  - name: "isRealtime"
    type: "Boolean"
  relations:
  - name: "pipelines"
    type: "RecommendationPipeline"
    multiplicity: "ManyToMany"
  - name: "eventStreams"
    type: "EventStream"
    multiplicity: "ManyToMany"
- name: "EventStream"
  description: "Streaming backbone carrying events for feature computation and inference."
  data:
  - name: "name"
    type: "String"
  - name: "streamType"
    type: "StreamType"
  - name: "topic"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  relations:
  - name: "dataSources"
    type: "DataSource"
    multiplicity: "ManyToMany"
  - name: "pipelines"
    type: "RecommendationPipeline"
    multiplicity: "ManyToMany"
- name: "RecommendationPolicy"
  description: "Collection of business controls applied during recommendation generation."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "scope"
    type: "PolicyScope"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "rules"
    type: "BusinessRule"
    multiplicity: "OneToMany"
  - name: "diversityConstraints"
    type: "DiversityConstraint"
    multiplicity: "OneToMany"
  - name: "pipelines"
    type: "RecommendationPipeline"
    multiplicity: "ManyToMany"
  - name: "segments"
    type: "AudienceSegment"
    multiplicity: "ManyToMany"
- name: "BusinessRule"
  description: "Individual rule expressing filters, boosts, or constraints."
  data:
  - name: "name"
    type: "String"
  - name: "ruleType"
    type: "RuleType"
  - name: "expression"
    type: "String"
  - name: "priority"
    type: "Integer"
  - name: "active"
    type: "Boolean"
  relations:
  - name: "policy"
    type: "RecommendationPolicy"
    multiplicity: "ManyToOne"
- name: "DiversityConstraint"
  description: "Policy element ensuring variety across categories or attributes."
  data:
  - name: "name"
    type: "String"
  - name: "minDistinctCategories"
    type: "Integer"
  - name: "maxPerCategory"
    type: "Integer"
  - name: "enabled"
    type: "Boolean"
  relations:
  - name: "policy"
    type: "RecommendationPolicy"
    multiplicity: "ManyToOne"
  - name: "categories"
    type: "Category"
    multiplicity: "ManyToMany"
- name: "DeliveryEndpoint"
  description: "Destination system or channel used to deliver recommendation results."
  data:
  - name: "name"
    type: "String"
  - name: "channel"
    type: "DeliveryChannel"
  - name: "integrationType"
    type: "IntegrationType"
  - name: "targetAddress"
    type: "String"
  relations:
  - name: "pipelines"
    type: "RecommendationPipeline"
    multiplicity: "ManyToMany"
  - name: "recommendationSets"
    type: "RecommendationSet"
    multiplicity: "OneToMany"
- name: "SimilarityIndex"
  description: "Index of embeddings used to compute nearest neighbors for recall."
  data:
  - name: "name"
    type: "String"
  - name: "similarityMetric"
    type: "SimilarityMetric"
  - name: "dimension"
    type: "Integer"
  - name: "lastUpdated"
    type: "Date"
  relations:
  - name: "model"
    type: "Model"
    multiplicity: "ManyToOne"
  - name: "itemEmbeddings"
    type: "ItemEmbedding"
    multiplicity: "OneToMany"
  - name: "userEmbeddings"
    type: "UserEmbedding"
    multiplicity: "OneToMany"
- name: "ItemEmbedding"
  description: "Vector representation of an item for similarity and retrieval."
  data:
  - name: "modelName"
    type: "String"
  - name: "vector"
    type: "Embedding"
  - name: "updatedAt"
    type: "Date"
  relations:
  - name: "item"
    type: "CatalogItem"
    multiplicity: "ManyToOne"
  - name: "similarityIndex"
    type: "SimilarityIndex"
    multiplicity: "ManyToOne"
- name: "UserEmbedding"
  description: "Vector representation of a user for personalization and retrieval."
  data:
  - name: "modelName"
    type: "String"
  - name: "vector"
    type: "Embedding"
  - name: "updatedAt"
    type: "Date"
  relations:
  - name: "user"
    type: "UserProfile"
    multiplicity: "ManyToOne"
  - name: "similarityIndex"
    type: "SimilarityIndex"
    multiplicity: "ManyToOne"
- name: "ConsentRecord"
  description: "Consent choice related to personalization and data usage for a user."
  data:
  - name: "consentType"
    type: "ConsentType"
  - name: "granted"
    type: "Boolean"
  - name: "capturedAt"
    type: "Date"
  - name: "jurisdiction"
    type: "String"
  relations:
  - name: "user"
    type: "UserProfile"
    multiplicity: "ManyToOne"
- name: "Experiment"
  description: "Controlled test used to compare recommendation strategies or models."
  data:
  - name: "name"
    type: "String"
  - name: "hypothesis"
    type: "String"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "status"
    type: "ExperimentStatus"
  - name: "primaryMetric"
    type: "EvaluationMetricType"
  relations:
  - name: "variants"
    type: "ExperimentVariant"
    multiplicity: "OneToMany"
  - name: "pipeline"
    type: "RecommendationPipeline"
    multiplicity: "ManyToOne"
- name: "ExperimentVariant"
  description: "Traffic-bearing arm of an experiment linked to a specific model version\
    \ and strategy."
  data:
  - name: "name"
    type: "String"
  - name: "allocationPercentage"
    type: "Decimal"
  - name: "strategy"
    type: "RankingStrategy"
  - name: "explorationRate"
    type: "Decimal"
  relations:
  - name: "experiment"
    type: "Experiment"
    multiplicity: "ManyToOne"
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
  - name: "recommendations"
    type: "Recommendation"
    multiplicity: "OneToMany"
  - name: "onlineMetrics"
    type: "OnlineMetric"
    multiplicity: "OneToMany"
enums:
- name: "ContentType"
  description: "High-level type of recommendable content or item."
  data:
  - name: "Product"
  - name: "Article"
  - name: "Video"
  - name: "Music"
  - name: "App"
  - name: "Service"
- name: "ItemLifecycleStatus"
  description: "Operational status of an item throughout its lifecycle."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Deprecated"
  - name: "Archived"
- name: "ProfileStatus"
  description: "State of a user profile with respect to personalization."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Deleted"
  - name: "Anonymous"
- name: "DeliveryChannel"
  description: "Channel through which recommendations are delivered."
  data:
  - name: "Web"
  - name: "MobileApp"
  - name: "Email"
  - name: "PushNotification"
  - name: "API"
- name: "DeviceType"
  description: "Device category associated with a session or request."
  data:
  - name: "Desktop"
  - name: "Mobile"
  - name: "Tablet"
  - name: "TV"
  - name: "Console"
- name: "ExplorationPolicy"
  description: "Strategy used to balance exploration and exploitation."
  data:
  - name: "PureExploration"
  - name: "EpsilonGreedy"
