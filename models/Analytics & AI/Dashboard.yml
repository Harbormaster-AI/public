---
metadata:
  name: "Dashboard Capabilities Model"
  description: "A capability model for designing, delivering, and governing analytical\
    \ dashboards, including data modeling, visualization, interaction, refresh, alerting,\
    \ collaboration, and export workflows."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Analytics & AI"
  type: "Capability"
  domain: "Dashboard"
entities:
- name: "AnalyticsWorkspace"
  description: "Logical container for dashboards, datasets, sources, themes, and access\
    \ policies."
  data:
  - name: "name"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  - name: "defaultTheme"
    type: "ThemeMode"
  relations:
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "OneToMany"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "OneToMany"
  - name: "dataSources"
    type: "DataSource"
    multiplicity: "OneToMany"
  - name: "memberships"
    type: "WorkspaceMembership"
    multiplicity: "OneToMany"
  - name: "themes"
    type: "Theme"
    multiplicity: "OneToMany"
- name: "WorkspaceMembership"
  description: "Grants a user a specific role within a workspace."
  data:
  - name: "membershipRole"
    type: "AccessLevel"
  - name: "invitedBy"
    type: "String"
  - name: "invitedAt"
    type: "DateTime"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
  - name: "workspace"
    type: "AnalyticsWorkspace"
    multiplicity: "ManyToOne"
- name: "User"
  description: "Person accessing and managing dashboards."
  data:
  - name: "displayName"
    type: "String"
  - name: "email"
    type: "EmailAddress"
  - name: "timezone"
    type: "String"
  - name: "locale"
    type: "String"
  relations:
  - name: "memberships"
    type: "WorkspaceMembership"
    multiplicity: "OneToMany"
  - name: "preferences"
    type: "UserPreference"
    multiplicity: "OneToOne"
  - name: "annotations"
    type: "Annotation"
    multiplicity: "OneToMany"
  - name: "exportJobs"
    type: "ExportJob"
    multiplicity: "OneToMany"
- name: "UserPreference"
  description: "Personalization settings applied to a user’s dashboard experience."
  data:
  - name: "themeMode"
    type: "ThemeMode"
  - name: "density"
    type: "DensityMode"
  - name: "startPage"
    type: "String"
  relations:
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "DataSource"
  description: "Connection definition for retrieving data from external systems."
  data:
  - name: "name"
    type: "String"
  - name: "sourceType"
    type: "DataSourceType"
  - name: "host"
    type: "String"
  - name: "database"
    type: "String"
  - name: "authenticationMethod"
    type: "AuthenticationMethod"
  - name: "isEnabled"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "AnalyticsWorkspace"
    multiplicity: "ManyToOne"
  - name: "datasets"
    type: "Dataset"
    multiplicity: "OneToMany"
  - name: "gateway"
    type: "ConnectionGateway"
    multiplicity: "ManyToOne"
- name: "ConnectionGateway"
  description: "Secure bridge enabling connectivity to private or on-premise sources."
  data:
  - name: "name"
    type: "String"
  - name: "region"
    type: "String"
  - name: "isOnline"
    type: "Boolean"
  relations:
  - name: "dataSources"
    type: "DataSource"
    multiplicity: "OneToMany"
- name: "Dataset"
  description: "Curated, queryable model used by widgets and dashboards."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "refreshPolicy"
    type: "RefreshPolicy"
  - name: "lastRefreshedAt"
    type: "DateTime"
  relations:
  - name: "workspace"
    type: "AnalyticsWorkspace"
    multiplicity: "ManyToOne"
  - name: "dataSource"
    type: "DataSource"
    multiplicity: "ManyToOne"
  - name: "fields"
    type: "DataField"
    multiplicity: "OneToMany"
  - name: "queries"
    type: "QueryDefinition"
    multiplicity: "OneToMany"
  - name: "metrics"
    type: "Metric"
    multiplicity: "OneToMany"
  - name: "refreshSchedules"
    type: "RefreshSchedule"
    multiplicity: "OneToMany"
  - name: "cacheConfig"
    type: "CacheConfig"
    multiplicity: "OneToOne"
  - name: "parameters"
    type: "Parameter"
    multiplicity: "OneToMany"
  - name: "refreshRuns"
    type: "RefreshRun"
    multiplicity: "OneToMany"
- name: "DataField"
  description: "Column or calculated attribute within a dataset schema."
  data:
  - name: "name"
    type: "String"
  - name: "label"
    type: "String"
  - name: "dataType"
    type: "ScalarType"
  - name: "isDimension"
    type: "Boolean"
  - name: "isHidden"
    type: "Boolean"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
- name: "QueryDefinition"
  description: "Executable query or expression producing data for widgets or transformations."
  data:
  - name: "name"
    type: "String"
  - name: "queryText"
    type: "QueryText"
  - name: "resultPreviewLimit"
    type: "Integer"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
- name: "Metric"
  description: "Reusable business calculation referenced across widgets."
  data:
  - name: "name"
    type: "String"
  - name: "metricType"
    type: "MetricType"
  - name: "expression"
    type: "String"
  - name: "formatPattern"
    type: "String"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "OneToMany"
- name: "Parameter"
  description: "Typed input used to dynamically filter or shape queries."
  data:
  - name: "name"
    type: "String"
  - name: "label"
    type: "String"
  - name: "dataType"
    type: "ScalarType"
  - name: "defaultValue"
    type: "String"
  - name: "isRequired"
    type: "Boolean"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
- name: "CacheConfig"
  description: "Caching behavior controlling freshness and performance for a dataset."
  data:
  - name: "strategy"
    type: "CacheStrategy"
  - name: "ttlSeconds"
    type: "Integer"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
- name: "RefreshSchedule"
  description: "Automated execution plan for dataset refresh operations."
  data:
  - name: "scheduleName"
    type: "String"
  - name: "schedule"
    type: "CronSchedule"
  - name: "timeZone"
    type: "String"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "refreshRuns"
    type: "RefreshRun"
    multiplicity: "OneToMany"
- name: "Dashboard"
  description: "Presentational canvas organizing widgets into pages for storytelling\
    \ and monitoring."
  data:
  - name: "title"
    type: "String"
  - name: "state"
    type: "DashboardState"
  - name: "layoutType"
    type: "LayoutType"
  - name: "slug"
    type: "String"
  relations:
  - name: "workspace"
    type: "AnalyticsWorkspace"
    multiplicity: "ManyToOne"
  - name: "pages"
    type: "DashboardPage"
    multiplicity: "OneToMany"
  - name: "theme"
    type: "Theme"
    multiplicity: "ManyToOne"
  - name: "shareLinks"
    type: "ShareLink"
    multiplicity: "OneToMany"
  - name: "annotations"
    type: "Annotation"
    multiplicity: "OneToMany"
  - name: "exportJobs"
    type: "ExportJob"
    multiplicity: "OneToMany"
  - name: "performanceLogs"
    type: "PerformanceLog"
    multiplicity: "OneToMany"
- name: "DashboardPage"
  description: "Page or tab grouping widgets within a dashboard."
  data:
  - name: "title"
    type: "String"
  - name: "index"
    type: "Integer"
  relations:
  - name: "dashboard"
    type: "Dashboard"
    multiplicity: "ManyToOne"
  - name: "widgets"
    type: "Widget"
    multiplicity: "OneToMany"
  - name: "annotations"
    type: "Annotation"
    multiplicity: "OneToMany"
- name: "Widget"
  description: "Visual component rendering data as a chart, table, or KPI."
  data:
  - name: "title"
    type: "String"
  - name: "visualizationType"
    type: "VisualizationType"
  - name: "state"
    type: "WidgetState"
  - name: "showLegend"
    type: "Boolean"
  - name: "sortDirection"
    type: "SortDirection"
  - name: "timeGrain"
    type: "TimeGrain"
  relations:
  - name: "page"
    type: "DashboardPage"
    multiplicity: "ManyToOne"
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "queryDefinition"
    type: "QueryDefinition"
    multiplicity: "ManyToOne"
  - name: "fields"
    type: "DataField"
    multiplicity: "ManyToMany"
  - name: "parameters"
    type: "Parameter"
    multiplicity: "ManyToMany"
  - name: "filters"
    type: "Filter"
    multiplicity: "OneToMany"
  - name: "placements"
    type: "WidgetPlacement"
    multiplicity: "OneToMany"
  - name: "interactionsAsSource"
    type: "Interaction"
    multiplicity: "OneToMany"
  - name: "interactionsAsTarget"
    type: "Interaction"
    multiplicity: "OneToMany"
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "OneToMany"
  - name: "annotations"
    type: "Annotation"
    multiplicity: "OneToMany"
  - name: "performanceLogs"
    type: "PerformanceLog"
    multiplicity: "OneToMany"
- name: "WidgetPlacement"
  description: "Grid positioning and sizing of a widget on a page."
  data:
  - name: "x"
    type: "Integer"
  - name: "y"
    type: "Integer"
  - name: "width"
    type: "Integer"
  - name: "height"
    type: "Integer"
  - name: "zIndex"
    type: "Integer"
  relations:
  - name: "widget"
    type: "Widget"
    multiplicity: "ManyToOne"
  - name: "page"
    type: "DashboardPage"
    multiplicity: "ManyToOne"
- name: "Filter"
  description: "Constraint applied to reduce or shape data displayed by a widget."
  data:
  - name: "fieldName"
    type: "String"
  - name: "operator_"
    type: "FilterOperator"
  - name: "value"
    type: "String"
  - name: "secondaryValue"
    type: "String"
  - name: "isPinned"
    type: "Boolean"
  relations:
  - name: "widget"
    type: "Widget"
    multiplicity: "ManyToOne"
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
- name: "Interaction"
  description: "Behavior linking widgets or navigation based on user actions."
  data:
  - name: "interactionType"
    type: "InteractionType"
  - name: "mappingExpression"
    type: "String"
  - name: "targetUrl"
    type: "Url"
  - name: "isEnabled"
    type: "Boolean"
  relations:
  - name: "sourceWidget"
    type: "Widget"
    multiplicity: "ManyToOne"
  - name: "targetWidget"
    type: "Widget"
    multiplicity: "ManyToOne"
- name: "Theme"
  description: "Visual identity defining color palette and typography."
  data:
  - name: "name"
    type: "String"
  - name: "background"
    type: "ColorHex"
  - name: "foreground"
    type: "ColorHex"
  - name: "accent"
    type: "ColorHex"
  - name: "fontFamily"
    type: "String"
  - name: "mode"
    type: "ThemeMode"
  relations:
  - name: "workspace"
    type: "AnalyticsWorkspace"
    multiplicity: "ManyToOne"
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "OneToMany"
- name: "ShareLink"
  description: "Public or restricted link granting access to a dashboard."
  data:
  - name: "token"
    type: "String"
  - name: "accessLevel"
    type: "AccessLevel"
  - name: "expiresAt"
    type: "DateTime"
  - name: "isEnabled"
    type: "Boolean"
  relations:
  - name: "dashboard"
    type: "Dashboard"
    multiplicity: "ManyToOne"
- name: "AlertRule"
  description: "Condition monitoring a metric or widget output to trigger notifications."
  data:
  - name: "name"
    type: "String"
  - name: "conditionType"
    type: "AlertConditionType"
  - name: "threshold"
    type: "Decimal"
  - name: "windowMinutes"
    type: "Integer"
  - name: "isActive"
    type: "Boolean"
  relations:
  - name: "widget"
    type: "Widget"
    multiplicity: "ManyToOne"
  - name: "metric"
    type: "Metric"
    multiplicity: "ManyToOne"
  - name: "channels"
    type: "NotificationEndpoint"
    multiplicity: "ManyToMany"
  - name: "incidents"
    type: "AlertIncident"
    multiplicity: "OneToMany"
- name: "NotificationEndpoint"
  description: "Delivery target used to send alert notifications."
  data:
  - name: "channel"
    type: "AlertChannel"
  - name: "email"
    type: "EmailAddress"
  - name: "webhook"
    type: "WebhookUrl"
  - name: "phone"
    type: "PhoneNumber"
  - name: "isEnabled"
    type: "Boolean"
  relations:
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "ManyToMany"
- name: "AlertIncident"
  description: "Recorded occurrence when an alert rule condition was met."
  data:
  - name: "occurredAt"
    type: "DateTime"
  - name: "observedValue"
    type: "Decimal"
  - name: "status"
    type: "IncidentStatus"
  - name: "notes"
    type: "String"
  relations:
  - name: "alertRule"
    type: "AlertRule"
    multiplicity: "ManyToOne"
  - name: "widget"
    type: "Widget"
    multiplicity: "ManyToOne"
- name: "Annotation"
  description: "Contextual note or comment attached to dashboards, pages, or widgets."
  data:
  - name: "authorName"
    type: "String"
  - name: "content"
    type: "RichText"
  - name: "createdAt"
    type: "DateTime"
  - name: "resolved"
    type: "Boolean"
  relations:
  - name: "widget"
    type: "Widget"
    multiplicity: "ManyToOne"
  - name: "page"
    type: "DashboardPage"
    multiplicity: "ManyToOne"
  - name: "dashboard"
    type: "Dashboard"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
- name: "ExportJob"
  description: "Asynchronous process producing a downloadable artifact from a dashboard\
    \ or widget."
  data:
  - name: "requestedAt"
    type: "DateTime"
  - name: "status"
    type: "ExportJobStatus"
  - name: "format"
    type: "ExportFormat"
  - name: "fileUrl"
    type: "Url"
  - name: "includeAnnotations"
    type: "Boolean"
  relations:
  - name: "dashboard"
    type: "Dashboard"
    multiplicity: "ManyToOne"
  - name: "widget"
    type: "Widget"
    multiplicity: "ManyToOne"
  - name: "requestedBy"
    type: "User"
    multiplicity: "ManyToOne"
- name: "RefreshRun"
  description: "Execution record of a dataset refresh attempt."
  data:
  - name: "startedAt"
    type: "DateTime"
  - name: "endedAt"
    type: "DateTime"
  - name: "status"
    type: "RefreshStatus"
  - name: "rowCount"
    type: "Integer"
  - name: "errorMessage"
    type: "String"
  relations:
  - name: "dataset"
    type: "Dataset"
    multiplicity: "ManyToOne"
  - name: "schedule"
    type: "RefreshSchedule"
    multiplicity: "ManyToOne"
- name: "PerformanceLog"
  description: "Telemetry capturing render and query performance details."
  data:
  - name: "eventName"
    type: "String"
  - name: "durationMs"
    type: "Integer"
  - name: "occurredAt"
    type: "DateTime"
  - name: "details"
    type: "String"
  relations:
  - name: "widget"
    type: "Widget"
    multiplicity: "ManyToOne"
  - name: "dashboard"
    type: "Dashboard"
    multiplicity: "ManyToOne"
- name: "AuditEvent"
  description: "Governance trail of user and system actions for compliance and diagnostics."
  data:
  - name: "action"
    type: "String"
  - name: "actor"
    type: "String"
  - name: "occurredAt"
    type: "DateTime"
  - name: "details"
    type: "String"
  relations:
  - name: "workspace"
    type: "AnalyticsWorkspace"
    multiplicity: "ManyToOne"
  - name: "dashboard"
    type: "Dashboard"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "User"
    multiplicity: "ManyToOne"
enums:
- name: "AccessLevel"
  description: "Authorization level granted to a principal within the platform."
  data:
  - name: "View"
  - name: "Edit"
  - name: "Admin"
- name: "DataSourceType"
  description: "Category of system or storage technology providing data to the platform."
  data:
  - name: "SQLDatabase"
  - name: "DataWarehouse"
  - name: "NoSQL"
  - name: "API"
  - name: "Spreadsheet"
  - name: "CloudStorage"
  - name: "Stream"
  - name: "File"
- name: "AuthenticationMethod"
  description: "Mechanism used to authenticate against a data source."
  data:
  - name: "None"
  - name: "Basic"
  - name: "OAuth2"
  - name: "APIKey"
  - name: "IAMRole"
- name: "RefreshPolicy"
  description: "Strategy determining how and when data is refreshed for a dataset."
  data:
  - name: "Manual"
  - name: "Scheduled"
  - name: "Live"
- name: "ScalarType"
  description: "Primitive data types supported in datasets and parameters."
  data:
  - name: "String"
  - name: "Integer"
  - name: "Decimal"
  - name: "Boolean"
  - name: "Date"
  - name: "DateTime"
  - name: "Time"
  - name: "GeoPoint"
- name: "MetricType"
  description: "Conceptual classification of a metric’s calculation behavior."
  data:
  - name: "Count"
  - name: "Sum"
  - name: "Average"
  - name: "Min"
  - name: "Max"
  - name: "Ratio"
  - name: "Rate"
  - name: "Index"
  - name: "Duration"
  - name: "Score"
- name: "CacheStrategy"
  description: "Approach for caching query results to balance latency and freshness."
  data:
  - name: "None"
  - name: "Memory"
  - name: "Distributed"
  - name: "Persistent"
- name: "DashboardState"
  description: "Lifecycle stage of a dashboard’s visibility and editability."
  data:
  - name: "Draft"
  - name: "Published"
  - name: "Archived"
- name: "LayoutType"
  description: "Method used to arrange widgets on a dashboard page."
  data:
  - name: "Grid"
  - name: "Freeform"
  - name: "Canvas"
- name: "VisualizationType"
  description: "Rendering style used by a widget to display data."
  data:
  - name: "Bar"
  - name: "Line"
  - name: "Area"
  - name: "Pie"
  - name: "Donut"
  - name: "Table"
  - name: "Pivot"
  - name: "KPI"
  - name: "Gauge"
  - name: "Scatter"
  - name: "Heatmap"
  - name: "Map"
  - name: "Funnel"
  - name: "Bullet"
  - name: "Number"
- name: "WidgetState"
  description: "Lifecycle state controlling whether a widget is visible and editable."
  data:
  - name: "Draft"
  - name: "Published"
  - name: "Archived"
- name: "SortDirection"
  description: "Order in which data is arranged for display or processing."
  data:
  - name: "Asc"
  - name: "Desc"
- name: "TimeGrain"
  description: "Temporal aggregation bucket used for time-series analysis."
  data:
  - name: "Minute"
  - name: "Hour"
  - name: "Day"
  - name: "Week"
  - name: "Month"
  - name: "Quarter"
  - name: "Year"
- name: "FilterOperator"
  description: "Logical operation applied to a field when filtering data."
  data:
  - name: "Equals"
  - name: "NotEquals"
  - name: "Contains"
  - name: "NotContains"
  - name: "In"
  - name: "NotIn"
  - name: "GreaterThan"
  - name: "GreaterThanOrEqual"
  - name: "LessThan"
  - name: "LessThanOrEqual"
  - name: "Between"
  - name: "IsNull"
  - name: "IsNotNull"
  - name: "StartsWith"
  - name: "EndsWith"
- name: "InteractionType"
  description: "Kind of behavior linking user actions to outcomes across the dashboard."
  data:
  - name: "DrillThrough"
  - name: "CrossFilter"
  - name: "Highlight"
  - name: "UrlNavigation"
  - name: "ParameterBinding"
- name: "ThemeMode"
  description: "Global brightness and contrast choice for visual styling."
  data:
  - name: "Light"
  - name: "Dark"
  - name: "Auto"
- name: "AlertConditionType"
  description: "Rule logic used to evaluate whether an alert should fire."
  data:
  - name: "Above"
  - name: "Below"
  - name: "Equal"
  - name: "OutsideRange"
  - name: "InsideRange"
  - name: "ChangeRate"
  - name: "Anomaly"
- name: "AlertChannel"
  description: "Delivery medium used to send notifications to recipients."
  data:
  - name: "Email"
  - name: "SMS"
  - name: "Webhook"
  - name: "Slack"
  - name: "Teams"
  - name: "PagerDuty"
- name: "IncidentStatus"
  description: "Current resolution state of an alert incident."
  data:
  - name: "Open"
  - name: "Acknowledged"
  - name: "Resolved"
- name: "ExportJobStatus"
  description: "State of progress for an export operation."
  data:
  - name: "Queued"
  - name: "Running"
  - name: "Completed"
  - name: "Failed"
  - name: "Cancelled"
- name: "ExportFormat"
  description: "File format used to export dashboard content or data."
  data:
  - name: "PDF"
  - name: "PNG"
  - name: "CSV"
  - name: "XLSX"
  - name: "JSON"
- name: "RefreshStatus"
  description: "Execution status outcome for a dataset refresh run."
  data:
  - name: "Pending"
  - name: "Running"
  - name: "Succeeded"
  - name: "Failed"
  - name: "Skipped"
- name: "DensityMode"
  description: "Spacing preference impacting component density in the UI."
  data:
  - name: "Comfortable"
  - name: "Compact"
  - name: "Cozy"
valueObjects:
- name: "QueryText"
  description: "Text of a query or expression in the native language of the source\
    \ or engine."
  data:
  - name: "value"
    type: "String"
- name: "CronSchedule"
  description: "Cron-based expression defining times when a task should run."
  data:
  - name: "expression"
    type: "String"
- name: "ColorHex"
  description: "Hexadecimal RGB or RGBA color representation."
  data:
  - name: "value"
    type: "String"
- name: "Url"
  description: "Absolute URL pointing to an internal or external location."
  data:
  - name: "value"
    type: "String"
- name: "WebhookUrl"
  description: "Callback URL used to receive programmatic notifications."
  data:
  - name: "value"
