version: "3.3"

services:
  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_TCP_PORT: ${DB_PORT}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - ./db:/docker-entrypoint-initdb.d

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI
      - "14268:14268" # HTTP collector
      - "14250:14250" # gRPC collector
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411 # Enable Zipkin compatibility

  backend:
    image: theharbormaster/harbormaster:latest
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      DATABASE_URL: jdbc:${DB_URL}/harbormaster?createDatabaseIfNotExist=true&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      DATABASE_PASSWORD: ${DB_PASSWORD}
      HARBORMASTER_LICENSE: ${LICENSE}
      GIT_URL_TOKEN: ${GIT_URL_TOKEN}
      TELEMETRY_IN_USE: ${TELEMETRY_IN_USE}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT}
      HARBORMASTER_RESULT_URL: ${HARBORMASTER_RESULT_URL}

    depends_on:
      - db
      - jaeger
    links:
      - db
    volumes:
      - "./:/root"
      - "./working_dir/:/usr/local/tomcat/temp/harbormaster_working_dir"

  frontend:
    image: theharbormaster/frontend:latest
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      REACT_APP_HARBORMASTER: "${FRONTEND_HARBORMASTER_HOMEPAGE_URL}"
      REACT_APP_HARBORMASTER_BACKEND: "${FRONTEND_BACKEND_URL}"
    depends_on:
      - backend
    links:
      - backend
    volumes:
      - "./:/root"

  smee-webhook:
    image: node:latest
    command: npx smee-client -u ${SMEE_HOST_URL} -t ${SMEE_WEBHOOK_URL}
    ports:
      - "${SMEE_HOST_PORT}:${SMEE_HOST_PORT}"
    depends_on:
      - backend
    links:
      - backend
    volumes:
      - "./:/root"
